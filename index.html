<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정처기 퀴즈">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>정처기 실기 퀴즈</title>
<meta name="description" content="정보처리기사 실기 대비 레슨: 코드 함정, DB, 네트워크, 보안, UML">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#3C3C3C; --muted:#777777; --line:#E5E5E5; --soft:#F7F7F7;
  --green:#58CC02; --green-d:#58A700; --green-soft:#D7FFB8;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-soft:#DDF4FF;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-soft:#FFDFE0;
  --gold:#FFC800; --gold-d:#E5A800; --orange:#FF9600;
  --gray:#E5E5E5; --gray-d:#CECECE;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
code,pre{font-family:var(--mono)}
mark{background:#FFF0A8;color:inherit;padding:0 3px;border-radius:3px}
[hidden]{display:none!important}
.screen{min-height:100%;display:flex;flex-direction:column}
.col{width:100%;max-width:600px;margin:0 auto;padding-inline:18px}

.btn{border:none;border-radius:16px;padding:14px 18px;font-weight:800;font-size:16px;letter-spacing:.02em;box-shadow:0 4px 0 var(--sh);transition:transform .05s,box-shadow .05s;background:var(--c);color:#fff;--c:var(--green);--sh:var(--green-d);width:100%;display:block}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--sh)}
.btn:disabled{--c:var(--gray);--sh:var(--gray-d);color:#AFAFAF;cursor:not-allowed}
.btn:disabled:active{transform:none;box-shadow:0 4px 0 var(--sh)}
.btn.blue{--c:var(--blue);--sh:var(--blue-d)}
.btn.red{--c:var(--red);--sh:var(--red-d)}
.btn.ghost{--c:#fff;--sh:var(--line);color:var(--blue);border:2px solid var(--line)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .col{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;padding:4px 6px}
.stat svg{width:26px;height:26px}
.stat.fire{color:var(--orange)} .stat.fire.off{color:#CFCFCF}
.stat.xp{color:var(--gold-d)}
.brandmini{font-family:var(--display);font-size:20px;color:var(--green);white-space:nowrap}

/* path */
.path{padding-block:18px 140px;display:grid;gap:30px}
.unit{display:grid;gap:26px}
.unit-head{background:var(--uc);color:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 0 var(--ud)}
.unit-head .t{display:grid}
.unit-head .t small{font-weight:700;opacity:.9;font-size:13px;letter-spacing:.04em}
.unit-head .t b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2}
.unit-head a{color:#fff;text-decoration:none;font-weight:800;font-size:13px;border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:6px 10px;white-space:nowrap}
.nodes{position:relative;display:grid;justify-items:center;gap:20px;padding-block:6px}
.node-wrap{position:relative;display:grid;justify-items:center}
.node{width:72px;height:66px;border-radius:50%;border:none;background:var(--uc);box-shadow:0 7px 0 var(--ud);display:grid;place-items:center;color:#fff;position:relative;transition:transform .05s,box-shadow .05s}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ud)}
.node svg{width:34px;height:34px}
.node.locked{background:var(--gray);box-shadow:0 7px 0 var(--gray-d);color:#AFAFAF;cursor:not-allowed}
.node.locked:active{transform:none;box-shadow:0 7px 0 var(--gray-d)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node-wrap.current::before{content:"";position:absolute;inset:-9px -9px -2px;border-radius:50%;border:6px solid var(--gray);border-top-color:var(--uc);border-right-color:var(--uc);pointer-events:none}
.start-tip{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:#fff;color:var(--uc);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:900;font-size:14px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:2}
.start-tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.path-mascot{position:absolute;width:110px;pointer-events:none}
.practice{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;width:auto;border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:8px}
.practice svg{width:22px;height:22px}

/* mascot */
.mascot{display:block;width:100%;height:auto;overflow:visible}
.mascot .body{transform-origin:60px 112px;transform-box:view-box}
.mascot.idle .body{animation:breathe 2.6s ease-in-out infinite}
.mascot.happy .body{animation:hop .6s ease-out 2}
.mascot.sad .body{animation:droop .5s ease-out forwards}
.mascot.cheer .body{animation:hop .55s ease-out infinite}
.mascot .eyes-happy,.mascot .mouth-sad,.mascot .tear{display:none}
.mascot.happy .eyes-open,.mascot.cheer .eyes-open{display:none}
.mascot.happy .eyes-happy,.mascot.cheer .eyes-happy{display:inline}
.mascot.sad .mouth-smile{display:none}
.mascot.sad .mouth-sad,.mascot.sad .tear{display:inline}
.mascot .arm-l,.mascot .arm-r{transform-box:fill-box}
.mascot .arm-l{transform-origin:100% 20%}.mascot .arm-r{transform-origin:0 20%}
.mascot.cheer .arm-l{animation:waveL .55s ease-in-out infinite}
.mascot.cheer .arm-r{animation:waveR .55s ease-in-out infinite}
.mascot .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(.96,1.05)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes droop{to{transform:translateY(4px) scale(1.04,.94)}}
@keyframes waveL{50%{transform:rotate(-38deg)}}
@keyframes waveR{50%{transform:rotate(38deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* intro */
.intro{flex:1;display:grid;align-content:center;justify-items:center;gap:22px;padding-block:40px;text-align:center}
.intro .m{width:180px}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-weight:700;font-size:17px;line-height:1.5;max-width:320px}
.bubble.down::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:10px solid transparent;border-top-color:var(--line)}
.intro h1{font-family:var(--display);font-weight:400;font-size:38px;color:var(--green);line-height:1.15}
.intro .actions{width:100%;max-width:340px;display:grid;gap:12px}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:14px;height:64px;margin-top:env(safe-area-inset-top,0px)}
.x{background:none;border:none;padding:6px;color:#AFAFAF}
.x svg{width:24px;height:24px;display:block}
.pbar{flex:1;height:16px;background:var(--gray);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s ease;position:relative}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.lives{display:flex;align-items:center;gap:4px;font-weight:900;color:var(--red);font-size:18px}
.lives svg{width:28px;height:28px}
.lives.hit svg{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px) rotate(-8deg)}75%{transform:translateX(4px) rotate(8deg)}}
.lesson-body{flex:1;display:grid;align-content:start;gap:18px;padding-block:8px 20px}
.q-kind{font-family:var(--display);font-size:24px;line-height:1.3}
.speaker{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:end}
.speaker .bubble{font-weight:500;font-size:16px;align-self:center}
.speaker .bubble::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);border-style:solid;border-color:transparent var(--line) transparent transparent;border-width:8px 12px 8px 0}
.q-term{font-weight:900;font-size:21px;line-height:1.35}
.q-text{font-size:16px;background:var(--soft);border-radius:14px;padding:12px 14px}
.lesson-body pre{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:0;font-size:14px;line-height:1.55;overflow-x:auto}
.lesson-body svg.rel{width:100%;max-width:300px;height:48px;color:var(--ink);justify-self:center}
svg .hollow{fill:#fff} svg .solid{fill:currentColor}
.mnemo{font-family:var(--display);font-size:24px;color:var(--blue)}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.45;font-weight:500}
.choice .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:900;color:#AFAFAF}
.choice:active{transform:translateY(2px);border-bottom-width:2px}
.choice.sel{border-color:#84D8FF;background:var(--blue-soft);color:var(--blue-d)}
.choice.sel .k{border-color:#84D8FF;color:var(--blue-d)}
.choice.right{border-color:var(--green);background:var(--green-soft);color:var(--green-d)}
.choice.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red-d)}
.choice[disabled]{cursor:default}
.answer-input{width:100%;font:500 18px var(--mono);padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink)}
.answer-input:focus{outline:none;border-color:var(--blue);background:#fff}
.hint{font-size:13px;color:var(--muted)}
.check-bar{border-top:2px solid var(--line);padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));background:#fff;position:sticky;bottom:0}
.check-bar .col{display:grid;grid-template-columns:auto 1fr;gap:12px}
.check-bar .col.one{grid-template-columns:1fr}
.check-bar .col.two{grid-template-columns:1fr 1fr}
.skip{width:auto;padding-inline:20px}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-block:18px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-height:80vh;overflow:auto}
.sheet.show{transform:none}
.sheet.ok{background:var(--green-soft)} .sheet.ng{background:var(--red-soft)}
.sheet .col{display:grid;gap:12px}
.sheet .head{display:flex;align-items:center;gap:12px}
.sheet .head .m{width:62px;flex:none}
.sheet .head b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2}
.sheet.ok .head b{color:var(--green-d)} .sheet.ng .head b{color:var(--red-d)}
.sheet .correct{font-weight:700;color:var(--red-d)}
.explain{background:rgba(255,255,255,.8);border-radius:14px;padding:12px 14px;font-size:15px;display:grid;gap:6px}
.explain .a{font-family:var(--mono);font-weight:700;color:var(--green-d)}
.explain .why{color:#555}
.explain code{background:rgba(0,0,0,.05);padding:0 4px;border-radius:4px;font-size:.92em}
.explain .steps{margin:0;padding-left:1.3em;display:grid;gap:4px}
.explain pre{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:0;font-size:13px;overflow-x:auto}
.explain dl{margin:0;display:grid;gap:6px}
.explain dt{font-size:12px;font-weight:900;color:var(--muted)}
.explain dd{margin:0}
.explain dd.hint{color:#555}
.reveal-box{background:var(--soft);border:2px dashed var(--line)}
.sheet-shade{position:fixed;inset:0;z-index:35}

/* result */
.result{flex:1;display:grid;align-content:center;justify-items:center;gap:20px;text-align:center;padding-block:30px}
.result .m{width:190px}
.result h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.2;color:var(--gold-d)}
.result.fail h2{color:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.tile{border:2px solid var(--tc);border-radius:16px;overflow:hidden;background:var(--tc)}
.tile span{display:block;color:#fff;font-weight:900;font-size:12px;letter-spacing:.05em;padding:4px}
.tile b{display:block;background:#fff;border-radius:13px 13px 0 0;margin:0 2px 2px;padding:12px 4px;color:var(--tc);font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.result .actions{width:100%;max-width:420px;display:grid;gap:12px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 캐릭터 "비트" (새로 그림) -->
<template id="mascot-tpl">
<svg class="mascot idle" viewBox="0 0 120 124" aria-hidden="true">
  <ellipse cx="60" cy="119" rx="34" ry="5" fill="#000" opacity=".08"/>
  <g class="body">
    <path class="arm-l" d="M20 70c-10 2-15 10-13 17 4 1 10-4 15-9z" fill="#3FB5A3"/>

    <circle cx="60" cy="10" r="6" fill="#FFC800"/>

      <g class="blink"><ellipse cx="76" cy="62" rx="9" ry="11" fill="#fff"/><ellipse cx="77.5" cy="64" rx="5" ry="6.5" fill="#23324A"/><circle cx="79.5" cy="61" r="2" fill="#fff"/></g>
    </g>

      <path d="M36 64q8-10 16 0"/><path d="M68 64q8-10 16 0"/>

    <circle cx="34" cy="77" r="5" fill="#FF8FA3" opacity=".55"/><circle cx="86" cy="77" r="5" fill="#FF8FA3" opacity=".55"/>

    <path class="mouth-sad" d="M52 83q8-7 16 0" fill="none" stroke="#23324A" stroke-width="3.5" stroke-linecap="round"/>

  </g>
</svg>
</template>

<section class="screen" id="s-intro" hidden>
  <div class="col intro">
    <div class="bubble down">안녕! 나는 <b>비트</b>야.<br>정처기 실기, 매일 한 레슨씩 같이 끝내 보자!</div>
    <div class="m" data-mascot></div>
    <h1>정처기 실기</h1>
    <div class="actions">
      <button class="btn" id="intro-start" type="button">시작하기</button>
      <a class="btn ghost" href="notes.html" style="text-decoration:none;text-align:center">먼저 노트 보기</a>
    </div>
  </div>
</section>

<section class="screen" id="s-home" hidden>
  <header class="topbar"><div class="col">
    <span class="brandmini">정처기 실기</span>
    <div style="display:flex;gap:6px">
      <span class="stat fire" id="st-streak" title="연속 학습일"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c1 4-2 5-2 8 0 1.5 1 2.5 2 2.5s2-1 2-2.5c2 1.5 3 3.5 3 6A5 5 0 0 1 12 21a5 5 0 0 1-5-5c0-4 3-6 3-9 0-2 1-4 2-5z"/></svg><span>0</span></span>
      <span class="stat xp" id="st-xp" title="총 XP"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>0</span></span>
    </div>
  </div></header>
  <main class="col path" id="path"></main>
  <p id="loading" style="text-align:center;color:var(--muted);padding:40px 16px">레슨을 불러오는 중…</p>
  <button class="btn blue practice" id="practice" type="button" hidden><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg><span>약점 복습</span></button>
</section>

<section class="screen" id="s-lesson" hidden>
  <div class="col lesson-top">
    <button class="x" id="l-quit" type="button" aria-label="레슨 그만하기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
    <div class="pbar"><i id="l-bar" style="width:0"></i></div>
    <span class="lives" id="l-lives"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg><span>3</span></span>
  </div>
  <main class="col lesson-body" id="l-body"></main>
  <div class="check-bar"><div class="col" id="l-actions"></div></div>
</section>

<div class="sheet-shade" id="shade" hidden></div>
<div class="sheet" id="sheet" role="status" aria-live="polite"><div class="col">
  <div class="head"><div class="m" data-mascot></div><b id="fb-title">정답이에요!</b></div>
  <p class="correct" id="fb-correct"></p>
  <div class="explain" id="fb-explain"></div>
  <button class="btn" id="fb-next" type="button">계속</button>
</div></div>

<section class="screen" id="s-result" hidden>
  <div class="col result" id="r-wrap">
    <div class="m" data-mascot></div>
    <h2 id="r-title">레슨 완료!</h2>
    <p id="r-sub" style="color:var(--muted);font-weight:500"></p>
    <div class="tiles">
      <div class="tile" style="--tc:var(--gold)"><span>획득 XP</span><b id="r-xp">0</b></div>
      <div class="tile" style="--tc:var(--green)"><span>정확도</span><b id="r-acc">0%</b></div>
      <div class="tile" style="--tc:var(--orange)"><span>연속 학습</span><b id="r-streak">0일</b></div>
    </div>
    <div class="actions">
      <button class="btn" id="r-next" type="button">계속</button>
      <button class="btn ghost" id="r-retry" type="button" hidden>다시 도전</button>
    </div>
  </div>
</section>
<canvas id="confetti" hidden></canvas>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var LIVES = 3, PER_LESSON = 6;

  // 저장
  var KEY = 'jcq-duo-v1';
  var S = { xp:0, streak:0, lastDay:null, done:{}, cards:{}, introSeen:false, sound:true };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) Object.assign(S, saved); } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
  function day(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function yesterday(){ var d = new Date(); d.setDate(d.getDate()-1); return day(d); }
  function liveStreak(){ return (S.lastDay === day() || S.lastDay === yesterday()) ? S.streak : 0; }

  // 캐릭터
  var tpl = $('mascot-tpl').content;
  function mountMascots(root){ (root || document).querySelectorAll('[data-mascot]').forEach(function(el){ if (!el.firstElementChild) el.appendChild(tpl.cloneNode(true)); }); }
  function mood(el, m){ var svg = el && el.querySelector('svg.mascot'); if (!svg) return; svg.classList.remove('idle','happy','sad','cheer'); svg.getBoundingClientRect(); svg.classList.add(m); }
  function mascotHTML(){ var d = document.createElement('div'); d.appendChild(tpl.cloneNode(true)); return d.innerHTML; }

  // 소리 (파일 없이 합성)
  var ac = null;
  function tone(freq, t0, dur, type, vol){
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
    } catch(e) {}
  }
  var sfx = {
    ok: function(){ if (S.sound) { tone(784, 0, .12); tone(1175, .09, .22); } },
    ng: function(){ if (S.sound) { tone(220, 0, .18, 'square', .07); tone(165, .12, .26, 'square', .07); } },
    win: function(){ if (S.sound) [523, 659, 784, 1047].forEach(function(f, i){ tone(f, i*.11, .25, 'triangle', .16); }); }
  };

  // 카드 (notes.html에서 읽음)
  var UNITS = [
    {id:'code-c', name:'C 언어 함정', color:'#58CC02', dark:'#58A700'},
    {id:'code-java', name:'Java 함정', color:'#1CB0F6', dark:'#1899D6'},
    {id:'code-py', name:'Python 함정', color:'#CE82FF', dark:'#A568CC'},
    {id:'code-sql', name:'SQL 함정', color:'#FF9600', dark:'#CD7900'},
    {id:'db', name:'DB 이론', color:'#FF4B4B', dark:'#EA2B2B'},
    {id:'net', name:'네트워크', color:'#00CD9C', dark:'#00A47D'},
    {id:'sec', name:'보안', color:'#2B70C9', dark:'#1F57A0'},
    {id:'uml', name:'UML', color:'#E5A800', dark:'#B88700'}
  ];
  var cards = [], byId = {}, lessons = [];
  function txt(html){ var d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g, ' ').trim(); }

  function buildCards(doc){
    UNITS.forEach(function(u){
      var sec = doc.getElementById(u.id); if (!sec) return;
      var gi = 0;
      sec.querySelectorAll('table, [data-id]').forEach(function(el){
        if (el.tagName === 'TABLE') { gi++; return; }
        var c = {id:el.dataset.id, unit:u.id};
        if (el.tagName === 'TR') {
          var heads = Array.prototype.map.call(el.closest('table').querySelectorAll('thead th'), function(th){ return th.textContent.trim(); });
          var term = el.querySelector('td.term'), parts = [];
          el.querySelectorAll('td').forEach(function(td, i){ if (td.classList.contains('c') || td === term) return; parts.push({h:heads[i] || '', html:td.innerHTML, hint:!td.classList.contains('ans') || td.classList.contains('hint')}); });
          var tc = term.cloneNode(true), sm = tc.querySelector('small');
          c.sub = sm ? sm.textContent.trim() : ''; if (sm) sm.remove();
          c.kind = 'term'; c.table = u.id + ':' + gi; c.col = heads[1] || '용어';
          c.term = tc.textContent.trim();
          c.meaning = txt(parts[0] ? parts[0].html : '');
          c.explain = '<dl>' + parts.map(function(p){ return '<dt>' + p.h + '</dt><dd' + (p.hint ? ' class="hint"' : '') + '>' + p.html + '</dd>'; }).join('') + '</dl>';
        } else {
          var cl = el.cloneNode(true);
          cl.querySelectorAll('input, label.chk').forEach(function(n){ n.remove(); });
          var ans = cl.querySelector('.ans'), a = ans && ans.querySelector('.a');
          var t = cl.querySelector('h3') || cl.querySelector('.name');
          c.title = t ? t.textContent.trim() : '';
          c.explain = ans ? ans.innerHTML : '';
          c.answer = a ? a.textContent.trim() : '';
          var svg = cl.querySelector('svg'); c.svg = svg ? svg.outerHTML.replace('<svg ', '<svg class="rel" ') : '';
          c.pre = cl.querySelector('pre') ? cl.querySelector('pre').outerHTML : '';
          var q = cl.querySelector('.q'); c.q = q ? q.innerHTML : '';
          var mn = cl.querySelector('.mnemo'); c.mnemo = mn ? mn.outerHTML : '';
          c.kind = c.svg ? 'rel' : (c.answer ? 'answer' : 'recall');
        }
        cards.push(c); byId[c.id] = c;
      });
    });
    UNITS.forEach(function(u){
      var list = cards.filter(function(c){ return c.unit === u.id; }), chunks = [];
      for (var i = 0; i < list.length; i += PER_LESSON) chunks.push(list.slice(i, i + PER_LESSON));
      if (chunks.length > 1 && chunks[chunks.length-1].length < 3) { var last = chunks.pop(); chunks[chunks.length-1] = chunks[chunks.length-1].concat(last); }
      u.lessons = chunks.map(function(ch, i){ var L = {id:u.id + '-' + (i+1), unit:u, n:i+1, cards:ch.map(function(c){ return c.id; })}; lessons.push(L); return L; });
    });
  }

  // 문제 만들기
  function shuffle(a){ for (var i = a.length-1; i > 0; i--) { var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function uniq(a){ var s = {}; return a.filter(function(x){ if (s[x]) return false; s[x] = 1; return true; }); }
  function pickOthers(pool, not, n){ return shuffle(uniq(pool.filter(function(x){ return x && x !== not; }))).slice(0, n); }
  var CUSTOM = {
    s7: ['80만 포함', '90만 포함', '둘 다 포함 안 됨'],
    s8: ['DESC (내림차순)', '입력한 순서 그대로', '무작위 순서']
  };
  function perturb(ans){
    var nums = ans.match(/-?\d+/g) || [], out = [];
    if (nums.length >= 2) { var rev = nums.slice().reverse(), i = 0; out.push(ans.replace(/-?\d+/g, function(){ return rev[i++]; })); }
    nums.forEach(function(nm){ out.push(ans.replace(nm, String(+nm + 1))); out.push(ans.replace(nm, String(+nm - 1))); });
    return uniq(out.filter(function(x){ return x !== ans; }));
  }
  function makeQuestion(c){
    var unitCards = cards.filter(function(x){ return x.unit === c.unit; });
    if (c.kind === 'term') {
      var same = cards.filter(function(x){ return x.kind === 'term' && x.table === c.table; });
      var pool = same.length >= 4 ? same : unitCards.filter(function(x){ return x.kind === 'term'; });
      var leaks = c.meaning.indexOf(c.term) > -1 || c.meaning.length < 4;
      if (leaks || Math.random() < 0.6) {
        return { c:c, type:'mc', kind:'뜻 고르기', say:'<b>' + esc(c.term) + '</b>' + (c.sub ? ' (' + esc(c.sub) + ')' : '') + '의 뜻은 뭘까?', prompt:'', options:shuffle([c.meaning].concat(pickOthers(pool.map(function(x){ return x.meaning; }), c.meaning, 3))), correct:c.meaning };
      }
      return { c:c, type:'mc', kind:'용어 고르기', say:'이 설명에 맞는 ' + (c.col === '기호' ? '기호' : '용어') + '는?', prompt:'<p class="q-text">' + esc(c.meaning) + '</p>', options:shuffle([c.term].concat(pickOthers(pool.map(function(x){ return x.term; }), c.term, 3))), correct:c.term };
    }
    if (c.kind === 'rel') {
      var names = cards.filter(function(x){ return x.kind === 'rel'; }).map(function(x){ return x.title; });
      return { c:c, type:'mc', kind:'관계 고르기', say:'이 선 모양은 어떤 관계일까?', prompt:c.svg, options:shuffle([c.title].concat(pickOthers(names, c.title, 3))), correct:c.title };
    }
    if (c.kind === 'answer') {
      if (/[가-힣]/.test(c.answer)) {
        var opts = CUSTOM[c.id];
        if (!opts) {
          var lastWord = c.answer.split(' ').pop();
          var cand = cards.filter(function(x){ return x.kind === 'term' && x.unit === c.unit && x.term.indexOf(lastWord) > -1; }).map(function(x){ return x.term; });
          opts = cand.length >= 3 ? pickOthers(cand, c.answer, 3) : perturb(c.answer).slice(0, 3);
        }
        return { c:c, type:'mc', kind:'정답 고르기', say:(c.q ? txt(c.q) : '정답은?'), prompt:'<p class="q-term">' + esc(c.title) + '</p>' + c.pre, options:shuffle([c.answer].concat(opts.slice(0,3))), correct:c.answer };
      }
      return { c:c, type:'type', kind:'직접 써 보기', say:'실행 결과를 <b>그대로</b> 써 봐!', prompt:'<p class="q-term">' + esc(c.title) + '</p>' + c.pre, correct:c.answer };
    }
    return { c:c, type:'recall', kind:'떠올려 보기', say:'머릿속으로 답을 떠올린 다음 확인해 봐.', prompt:'<p class="q-term">' + esc(c.title) + '</p>' + c.mnemo + c.pre + (c.q ? '<p class="q-text">' + c.q + '</p>' : '') };
  }
  function norm(s){ return String(s).toLowerCase().replace(/[\s'"`]/g, '').replace(/[.。]$/, ''); }
  function loose(s){ return norm(s).replace(/[,\[\]{}()]/g, ''); }
  function isRight(q, v){ return norm(v) === norm(q.correct) || (loose(v) !== '' && loose(v) === loose(q.correct)); }

  function show(id){ ['s-intro','s-home','s-lesson','s-result'].forEach(function(s){ $(s).hidden = s !== id; }); window.scrollTo(0, 0); }

  // 홈: 레슨 지도
  var ICON = {
    star:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="m12 2 3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg>',
    check:'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    lock:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>',
    trophy:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h10v2h3v3a4 4 0 0 1-4 4 5 5 0 0 1-3 2.8V18h3v3H8v-3h3v-3.2A5 5 0 0 1 8 12a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1 1.7zm10 0v2.7A2 2 0 0 0 18 8V7z"/></svg>'
  };
  var ZIG = [0, 44, 70, 44, 0, -44, -70, -44];
  function unlocked(L){ return L.n === 1 || !!S.done[L.unit.id + '-' + (L.n - 1)]; }
  function renderHome(){
    $('st-streak').lastElementChild.textContent = liveStreak();
    $('st-streak').classList.toggle('off', S.lastDay !== day());
    $('st-xp').lastElementChild.textContent = S.xp;
    if (!lessons.length) return;
    var html = '', firstCurrent = null;
    UNITS.forEach(function(u, ui){
      var doneN = u.lessons.filter(function(L){ return S.done[L.id]; }).length, curInUnit = false;
      html += '<section class="unit" style="--uc:' + u.color + ';--ud:' + u.dark + '"><div class="unit-head"><div class="t"><small>유닛 ' + (ui+1) + ' · ' + doneN + '/' + u.lessons.length + ' 완료</small><b>' + u.name + '</b></div><a href="notes.html#' + u.id + '">노트</a></div><div class="nodes">';
      u.lessons.forEach(function(L, i){
        var done = !!S.done[L.id], open = unlocked(L), cur = open && !done && !curInUnit;
        if (cur) { curInUnit = true; if (!firstCurrent) firstCurrent = L.id; }
        var last = i === u.lessons.length - 1;
        var icon = done ? ICON.check : (open ? (last ? ICON.trophy : ICON.star) : ICON.lock);
        html += '<div class="node-wrap' + (cur ? ' current' : '') + '" data-x="' + ZIG[i % ZIG.length] + '" style="transform:translateX(' + ZIG[i % ZIG.length] + 'px)" data-lesson="' + L.id + '">' +
          (L.id === firstCurrent ? '<span class="start-tip">시작</span>' : '') +
          '<button class="node ' + (done ? 'done' : open ? '' : 'locked') + '" type="button" data-lesson="' + L.id + '" aria-label="' + u.name + ' 레슨 ' + L.n + (done ? ' 완료' : open ? '' : ' 잠김') + '">' + icon + '</button></div>';
      });
      html += '</div></section>';
    });
    $('path').innerHTML = html;
    var target = firstCurrent && $('path').querySelector('.node-wrap[data-lesson="' + firstCurrent + '"]');
    if (target) {
      var m = document.createElement('div'), x = +target.dataset.x;
      m.className = 'path-mascot'; m.innerHTML = mascotHTML();
      m.style.top = (target.offsetTop - 18) + 'px';
      m.style.left = x > 0 ? 'calc(50% - 190px)' : 'calc(50% + 80px)';
      target.parentNode.appendChild(m);
      setTimeout(function(){ target.scrollIntoView({block:'center', behavior:'smooth'}); }, 60);
    }
    var weak = cards.filter(function(c){ return S.cards[c.id] && S.cards[c.id].last === 'ng'; });
    $('practice').hidden = !weak.length;
    $('practice').lastElementChild.textContent = '약점 복습 ' + weak.length;
  }
  $('path').addEventListener('click', function(e){
    var b = e.target.closest('button.node'); if (!b || b.classList.contains('locked')) return;
    var L = lessons.filter(function(x){ return x.id === b.dataset.lesson; })[0]; if (L) startLesson(L.cards, L);
  });
  $('practice').addEventListener('click', function(){
    startLesson(shuffle(cards.filter(function(c){ return S.cards[c.id] && S.cards[c.id].last === 'ng'; })).slice(0, 8).map(function(c){ return c.id; }), null);
  });

  // 레슨
  var R = null;
  function startLesson(ids, L){
    R = { L:L, queue:ids.map(function(id){ return makeQuestion(byId[id]); }), total:ids.length, solved:0, lives:LIVES, mistakes:0, firstTry:{} };
    show('s-lesson'); updateTop(); renderQ();
  }
  function updateTop(){ $('l-bar').style.width = (R.solved / R.total * 100) + '%'; $('l-lives').lastElementChild.textContent = R.lives; }
  function renderQ(){
    var q = R.queue[0]; R.sel = null;
    var body = '<p class="q-kind">' + q.kind + '</p>' +
      (R.firstTry[q.c.id] === false ? '<p class="hint" style="color:var(--orange);font-weight:700">아까 틀린 문제예요. 다시 도전!</p>' : '') +
      '<div class="speaker"><div data-mascot></div><div class="bubble">' + q.say + '</div></div>' + q.prompt;
    if (q.type === 'mc') body += '<div class="choices" id="choices">' + q.options.map(function(o, i){ return '<button class="choice" type="button" data-i="' + i + '"><span class="k">' + (i+1) + '</span><span>' + esc(o) + '</span></button>'; }).join('') + '</div>';
    if (q.type === 'type') body += '<input class="answer-input" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="출력값 입력" enterkeyhint="done"><p class="hint">띄어쓰기와 따옴표는 신경 안 써도 돼요.</p>';
    $('l-body').innerHTML = body; mountMascots($('l-body'));
    var A = $('l-actions');
    if (q.type === 'recall') {
      A.className = 'col one'; A.innerHTML = '<button class="btn blue" id="l-check" type="button">답 확인하기</button>';
    } else {
      A.className = 'col'; A.innerHTML = '<button class="btn ghost skip" id="l-skip" type="button">모르겠어요</button><button class="btn" id="l-check" type="button" disabled>확인</button>';
      $('l-skip').onclick = function(){ grade(false); };
    }
    $('l-check').onclick = onCheck;
    if (q.type === 'mc') $('choices').addEventListener('click', function(e){ var b = e.target.closest('.choice'); if (b && !b.disabled) pick(+b.dataset.i); });
    if (q.type === 'type') { var inp = $('answer'); inp.addEventListener('input', function(){ $('l-check').disabled = !inp.value.trim(); }); setTimeout(function(){ inp.focus(); }, 50); }
  }
  function pick(i){
    R.sel = i;
    document.querySelectorAll('.choice').forEach(function(b){ b.classList.toggle('sel', +b.dataset.i === i); });
    $('l-check').disabled = false;
  }
  function onCheck(){
    var q = R.queue[0];
    if (q.type === 'recall') return showRecall();
    if (q.type === 'mc') { if (R.sel !== null) grade(q.options[R.sel] === q.correct); return; }
    var v = $('answer').value; if (v.trim()) grade(isRight(q, v));
  }
  function showRecall(){
    $('l-body').insertAdjacentHTML('beforeend', '<div class="explain reveal-box">' + R.queue[0].c.explain + '</div>');
    var A = $('l-actions'); A.className = 'col two';
    A.innerHTML = '<button class="btn red" id="l-no" type="button">몰랐어요</button><button class="btn" id="l-yes" type="button">알았어요</button>';
    $('l-no').onclick = function(){ grade(false, true); };
    $('l-yes').onclick = function(){ grade(true, true); };
    $('l-body').lastElementChild.scrollIntoView({behavior:'smooth', block:'start'});
  }
  function grade(ok, isRecall){
    var q = R.queue[0], c = q.c;
    if (!(c.id in R.firstTry)) R.firstTry[c.id] = ok;
    var st = S.cards[c.id] || {ok:0, ng:0, last:null};
    if (ok) st.ok++; else st.ng++; st.last = ok ? 'ok' : 'ng'; S.cards[c.id] = st; save();
    if (q.type === 'mc') document.querySelectorAll('.choice').forEach(function(b){ b.disabled = true; var o = q.options[+b.dataset.i]; if (o === q.correct) b.classList.add('right'); else if (+b.dataset.i === R.sel) b.classList.add('wrong'); });
    if (q.type === 'type') $('answer').disabled = true;
    R.queue.shift();
    if (ok) { sfx.ok(); R.solved++; }
    else {
      sfx.ng(); R.lives--; R.mistakes++;
      var lv = $('l-lives'); lv.classList.remove('hit'); void lv.offsetWidth; lv.classList.add('hit');
      R.queue.push(makeQuestion(c));
    }
    updateTop();
    if (isRecall) return next();
    openSheet(ok, q);
  }
  function openSheet(ok, q){
    var sh = $('sheet');
    sh.className = 'sheet ' + (ok ? 'ok' : 'ng');
    $('fb-title').textContent = ok ? pickOne(['정답이에요!', '좋아요!', '완벽해요!', '잘했어요!']) : '아쉬워요';
    $('fb-correct').innerHTML = ok ? '' : '정답: <code>' + esc(q.correct) + '</code>';
    $('fb-correct').hidden = ok;
    $('fb-explain').innerHTML = q.c.explain;
    $('fb-next').className = 'btn' + (ok ? '' : ' red');
    mountMascots(sh); mood(sh.querySelector('[data-mascot]'), ok ? 'happy' : 'sad');
    $('shade').hidden = false; sh.scrollTop = 0;
    requestAnimationFrame(function(){ sh.classList.add('show'); $('fb-next').focus({preventScroll:true}); });
  }
  function closeSheet(){ $('sheet').classList.remove('show'); $('shade').hidden = true; }
  $('fb-next').addEventListener('click', function(){ closeSheet(); next(); });
  function next(){
    if (R.lives <= 0) return finish(false);
    if (!R.queue.length) return finish(true);
    renderQ();
  }
  $('l-quit').addEventListener('click', function(){ closeSheet(); renderHome(); show('s-home'); });

  // 결과
  function finish(passed){
    closeSheet();
    var firsts = Object.keys(R.firstTry), right = firsts.filter(function(k){ return R.firstTry[k]; }).length;
    var acc = firsts.length ? Math.round(right / firsts.length * 100) : 0;
    var wrap = $('r-wrap'); wrap.classList.toggle('fail', !passed);
    show('s-result');
    var m = wrap.querySelector('[data-mascot]');
    if (passed) {
      var gain = 10 + (R.mistakes === 0 ? 5 : 0) + (R.L && !S.done[R.L.id] ? 5 : 0);
      S.xp += gain;
      if (S.lastDay !== day()) { S.streak = (S.lastDay === yesterday() ? S.streak : 0) + 1; S.lastDay = day(); }
      if (R.L) S.done[R.L.id] = true;
      save();
      $('r-title').textContent = R.mistakes === 0 ? '완벽한 레슨!' : '레슨 완료!';
      $('r-sub').textContent = R.L ? R.L.unit.name + ' · 레슨 ' + R.L.n : '약점 복습';
      $('r-xp').textContent = '+' + gain;
      $('r-streak').textContent = S.streak + '일';
      $('r-retry').hidden = true; $('r-next').textContent = '계속';
      mood(m, 'cheer'); sfx.win(); confetti();
    } else {
      $('r-title').textContent = '하트를 다 썼어요';
      $('r-sub').textContent = '틀린 카드는 약점 복습에 모였어요. 해설 보고 다시 도전해 봐요!';
      $('r-xp').textContent = '+0'; $('r-streak').textContent = liveStreak() + '일';
      $('r-retry').hidden = !R.L; $('r-next').textContent = '지도로 돌아가기';
      mood(m, 'sad');
    }
    $('r-acc').textContent = acc + '%';
  }
  $('r-next').addEventListener('click', function(){ renderHome(); show('s-home'); });
  $('r-retry').addEventListener('click', function(){ startLesson(R.L.cards, R.L); });

  // 폭죽
  function confetti(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = $('confetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    cv.hidden = false; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var colors = ['#58CC02', '#1CB0F6', '#FFC800', '#FF4B4B', '#CE82FF', '#FF9600'], ps = [];
    for (var i = 0; i < 140; i++) ps.push({x:W/2, y:H*0.35, vx:(Math.random()-.5)*14, vy:Math.random()*-14-4, s:Math.random()*7+4, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:colors[i % colors.length]});
    var t0 = performance.now();
    (function frame(t){
      ctx.clearRect(0, 0, W, H);
      ps.forEach(function(p){ p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/3, p.s, p.s*.66); ctx.restore(); });
      if (t - t0 < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
    })(t0);
  }

  // 키보드
  document.addEventListener('keydown', function(e){
    if ($('s-lesson').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    if ($('sheet').classList.contains('show')) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fb-next').click(); } return; }
    var q = R && R.queue[0]; if (!q) return;
    if (q.type === 'mc' && /^[1-4]$/.test(e.key)) { var b = document.querySelector('.choice[data-i="' + (+e.key - 1) + '"]'); if (b && !b.disabled) pick(+e.key - 1); }
    if (e.key === 'Enter') { var ck = $('l-check'); if (ck && !ck.disabled) { e.preventDefault(); ck.click(); } }
  });

  function esc(s){ return String(s).replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }
  function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }

  // 시작
  mountMascots();
  $('intro-start').addEventListener('click', function(){ S.introSeen = true; save(); show('s-home'); renderHome(); });
  if (S.introSeen) show('s-home'); else { show('s-intro'); mood(document.querySelector('#s-intro [data-mascot]'), 'cheer'); }
  fetch('notes.html').then(function(r){ if (!r.ok) throw 0; return r.text(); }).then(function(html){
    buildCards(new DOMParser().parseFromString(html, 'text/html'));
    $('loading').hidden = true; renderHome();
  }).catch(function(){ $('loading').textContent = '레슨을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'; });

  if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
</script>
