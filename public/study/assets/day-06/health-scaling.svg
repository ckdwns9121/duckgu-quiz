<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">요청 제외와 서버 교체를 구분</title><desc id="desc">ALB가 비정상 대상을 판단한 뒤 ELB 상태 확인이 활성화된 ASG가 서버를 교체하고 새 대상은 준비 후 요청을 받는다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2863a6"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;font-size:24px;fill:#172c48} .title{font-size:32px;font-weight:700} .small{font-size:20px} .label{font-weight:700} .edge{fill:none;stroke:#2863a6;stroke-width:3;marker-end:url(#a)}</style><rect width="1120" height="700" fill="white"/><text x="40" y="50" class="title">요청 제외와 서버 교체를 구분</text><rect x="40" y="110" width="300" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="190.0" y="145" text-anchor="middle">ALB 상태 확인</text><text x="190.0" y="176" text-anchor="middle">앱 /health 검사</text><rect x="440" y="110" width="300" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="590.0" y="145" text-anchor="middle">대상 unhealthy</text><text x="590.0" y="176" text-anchor="middle">일반적으로 분산 제외</text><path class="edge" d="M340 165 H440"/><rect x="440" y="320" width="610" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="745.0" y="355" text-anchor="middle">ASG가 ELB 상태 확인을 사용하도록 설정</text><text x="745.0" y="386" text-anchor="middle">비정상 인스턴스 교체 판단</text><path class="edge" d="M590 220 V320"/><rect x="40" y="510" width="330" height="90" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="205.0" y="545" text-anchor="middle">새 인스턴스 시작</text><rect x="480" y="510" width="570" height="90" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="765.0" y="545" text-anchor="middle">준비·등록·상태 확인 통과 후 요청 처리</text><path class="edge" d="M745 430 V470 H205 V510"/><path class="edge" d="M370 555 H480"/><text x="40" y="270" class="small">ALB만으로 EC2가 자동 교체되지는 않음</text><text x="40" y="655" class="small">예외: ALB의 모든 등록 대상이 비정상이면 fail-open 가능</text></svg>