<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">로드 밸런서별 트래픽 처리 기준</title><desc id="desc">ALB의 HTTP 조건 분기, NLB의 연결 분산, GWLB의 GENEVE 장비 전달을 비교한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2863a6"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;font-size:24px;fill:#172c48} .title{font-size:32px;font-weight:700} .small{font-size:20px} .label{font-weight:700} .edge{fill:none;stroke:#2863a6;stroke-width:3;marker-end:url(#a)}</style><rect width="1120" height="640" fill="white"/><text x="40" y="50" class="title">로드 밸런서별 트래픽 처리 기준</text><rect x="40" y="115" width="230" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="155.0" y="150" text-anchor="middle">ALB · L7</text><rect x="360" y="115" width="350" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="535.0" y="150" text-anchor="middle">Host / URL 경로 조건</text><rect x="800" y="115" width="290" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="945.0" y="150" text-anchor="middle">/api → API 그룹</text><text x="945.0" y="181" text-anchor="middle">/images → 이미지 그룹</text><path class="edge" d="M270 170 H360"/><path class="edge" d="M710 170 H800"/><rect x="40" y="285" width="230" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="155.0" y="320" text-anchor="middle">NLB · L4</text><rect x="360" y="285" width="350" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="535.0" y="320" text-anchor="middle">TCP / UDP 연결</text><rect x="800" y="285" width="290" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="945.0" y="320" text-anchor="middle">네트워크 서비스 대상</text><path class="edge" d="M270 340 H360"/><path class="edge" d="M710 340 H800"/><rect x="40" y="455" width="230" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="155.0" y="490" text-anchor="middle">GWLB</text><rect x="360" y="455" width="350" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="535.0" y="490" text-anchor="middle">GENEVE · UDP 6081</text><rect x="800" y="455" width="290" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="945.0" y="490" text-anchor="middle">방화벽 등 가상 장비</text><path class="edge" d="M270 510 H360"/><path class="edge" d="M710 510 H800"/></svg>