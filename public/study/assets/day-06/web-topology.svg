<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc"><title id="title">공개 요청과 앱의 외부 호출은 다른 경로</title><desc id="desc">사용자는 IGW에서 공개 ALB로 들어와 두 AZ의 비공개 앱에 접근한다. 각 앱의 별도 외부 호출은 같은 AZ NAT와 IGW를 지난다. 선은 연결 시작 방향이며 응답은 기존 연결로 돌아온다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2863a6"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;font-size:24px;fill:#172c48} .title{font-size:32px;font-weight:700} .small{font-size:20px} .label{font-weight:700} .edge{fill:none;stroke:#2863a6;stroke-width:3;marker-end:url(#a)}</style><rect width="1120" height="840" fill="white"/><text x="40" y="50" class="title">공개 요청과 앱의 외부 호출은 다른 경로</text><rect x="40" y="90" width="240" height="90" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="160.0" y="125" text-anchor="middle">인터넷 사용자</text><rect x="430" y="90" width="240" height="90" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="550.0" y="125" text-anchor="middle">IGW</text><rect x="820" y="90" width="260" height="90" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="950.0" y="125" text-anchor="middle">외부 API</text><path class="edge" d="M280 135 H430"/><rect x="40" y="230" width="400" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="240.0" y="265" text-anchor="middle">공개 ALB</text><text x="240.0" y="296" text-anchor="middle">AZ A·B의 공개 서브넷</text><path class="edge" d="M480 180 V205 H240 V230"/><rect x="40" y="430" width="400" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="240.0" y="465" text-anchor="middle">비공개 앱 A · AZ A</text><text x="240.0" y="496" text-anchor="middle">앱 포트는 ALB SG에서 허용</text><rect x="620" y="430" width="460" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="850.0" y="465" text-anchor="middle">비공개 앱 B · AZ B</text><text x="850.0" y="496" text-anchor="middle">앱 포트는 ALB SG에서 허용</text><path class="edge" d="M160 340 V430"/><path class="edge" d="M360 340 V385 H850 V430"/><rect x="40" y="650" width="400" height="90" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="240.0" y="685" text-anchor="middle">Zonal NAT A · EIP</text><rect x="620" y="650" width="460" height="90" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="850.0" y="685" text-anchor="middle">Zonal NAT B · EIP</text><path class="edge" d="M240 540 V650"/><path class="edge" d="M850 540 V650"/><path class="edge" d="M40 695 H20 V200 H530 V180"/><path class="edge" d="M1080 695 H1100 V200 H580 V180"/><path class="edge" d="M670 135 H820"/><text x="310" y="600" class="small">앱의 외부 API 호출: 같은 AZ NAT 사용</text><text x="40" y="795" class="small">사용자 요청·응답: ALB 연결 사용 · 별도 외부 호출: NAT → IGW → 외부 API</text></svg>