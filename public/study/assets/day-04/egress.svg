<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">IPv4 NAT와 IPv6 Egress-only IGW</title><desc id="desc">IPv4는 공개 NAT와 IGW를 함께 사용하고 IPv6는 egress-only IGW로 나간다. 화살표는 연결을 시작하는 방향이다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2863a6"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;font-size:24px;fill:#172c48} .title{font-size:32px;font-weight:700} .small{font-size:20px} .label{font-weight:700} .edge{fill:none;stroke:#2863a6;stroke-width:3;marker-end:url(#a)}</style><rect width="1120" height="640" fill="white"/><text x="40" y="50" class="title">IPv4 NAT와 IPv6 Egress-only IGW</text><text x="40" y="105" class="">IPv4 · Zonal NAT 구성 · 앱이 시작한 외부 연결</text><rect x="40" y="140" width="260" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="170.0" y="175" text-anchor="middle">비공개 앱</text><text x="170.0" y="206" text-anchor="middle">프라이빗 IPv4</text><rect x="390" y="140" width="290" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="535.0" y="175" text-anchor="middle">Zonal 공개 NAT</text><text x="535.0" y="206" text-anchor="middle">공개 서브넷 · EIP</text><rect x="770" y="140" width="130" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="835.0" y="175" text-anchor="middle">IGW</text><rect x="960" y="140" width="130" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="1025.0" y="175" text-anchor="middle">인터넷</text><path class="edge" d="M300 195 H390"/><path class="edge" d="M680 195 H770"/><path class="edge" d="M900 195 H960"/><text x="40" y="300" class="small">앱 서브넷: 0.0.0.0/0 → NAT · NAT 서브넷: 0.0.0.0/0 → IGW</text><text x="40" y="365" class="">IPv6 · 별도의 ::/0 경로</text><rect x="40" y="400" width="260" height="100" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="170.0" y="435" text-anchor="middle">IPv6 앱</text><rect x="390" y="400" width="370" height="100" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="575.0" y="435" text-anchor="middle">Egress-only IGW</text><rect x="890" y="400" width="200" height="100" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="990.0" y="435" text-anchor="middle">IPv6 인터넷</text><path class="edge" d="M300 450 H390"/><path class="edge" d="M760 450 H890"/><text x="40" y="565" class="small">두 경로 모두 시작한 연결의 응답은 허용 · 외부의 새 연결은 전달하지 않음</text></svg>