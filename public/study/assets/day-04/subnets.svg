<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">VPC·서브넷·AZ의 범위</title><desc id="desc">두 AZ마다 공개와 비공개 서브넷을 별도로 배치한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2863a6"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;font-size:24px;fill:#172c48} .title{font-size:32px;font-weight:700} .small{font-size:20px} .label{font-weight:700} .edge{fill:none;stroke:#2863a6;stroke-width:3;marker-end:url(#a)}</style><rect width="1120" height="640" fill="white"/><text x="40" y="50" class="title">VPC·서브넷·AZ의 범위</text><text x="40" y="95" class="">VPC 10.0.0.0/16 · 리전 안에서 여러 AZ에 걸칠 수 있음</text><rect x="40" y="125" width="500" height="420" rx="12" fill="#f7f9fc" stroke="#93afcf" stroke-width="2"/><text x="290.0" y="160" text-anchor="middle">AZ A</text><rect x="65" y="195" width="450" height="130" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="290.0" y="230" text-anchor="middle">공개 서브넷</text><text x="290.0" y="261" text-anchor="middle">10.0.1.0/24</text><text x="290.0" y="292" text-anchor="middle">기본 경로 → IGW</text><rect x="65" y="355" width="450" height="130" rx="12" fill="#edf8f1" stroke="#93afcf" stroke-width="2"/><text x="290.0" y="390" text-anchor="middle">비공개 앱 서브넷</text><text x="290.0" y="421" text-anchor="middle">10.0.11.0/24</text><text x="290.0" y="452" text-anchor="middle">기본 경로 → 같은 AZ NAT</text><rect x="580" y="125" width="500" height="420" rx="12" fill="#f7f9fc" stroke="#93afcf" stroke-width="2"/><text x="830.0" y="160" text-anchor="middle">AZ B</text><rect x="605" y="195" width="450" height="130" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="830.0" y="230" text-anchor="middle">공개 서브넷</text><text x="830.0" y="261" text-anchor="middle">10.0.2.0/24</text><text x="830.0" y="292" text-anchor="middle">기본 경로 → IGW</text><rect x="605" y="355" width="450" height="130" rx="12" fill="#edf8f1" stroke="#93afcf" stroke-width="2"/><text x="830.0" y="390" text-anchor="middle">비공개 앱 서브넷</text><text x="830.0" y="421" text-anchor="middle">10.0.12.0/24</text><text x="830.0" y="452" text-anchor="middle">기본 경로 → 같은 AZ NAT</text><text x="40" y="595" class="">서브넷 하나 = AZ 하나 · CIDR는 VPC 범위 안에서 서로 겹치지 않음</text></svg>