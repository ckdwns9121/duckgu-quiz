<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">라우팅은 가장 구체적인 목적지를 선택</title><desc id="desc">10.0.12.30은 VPC local 경로와 기본 경로에 일치하지만 local의 더 긴 접두사가 우선한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2863a6"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;font-size:24px;fill:#172c48} .title{font-size:32px;font-weight:700} .small{font-size:20px} .label{font-weight:700} .edge{fill:none;stroke:#2863a6;stroke-width:3;marker-end:url(#a)}</style><rect width="1120" height="640" fill="white"/><text x="40" y="50" class="title">라우팅은 가장 구체적인 목적지를 선택</text><rect x="40" y="100" width="310" height="100" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="195.0" y="135" text-anchor="middle">패킷 목적지</text><text x="195.0" y="166" text-anchor="middle">10.0.12.30</text><path class="edge" d="M350 150 H415"/><rect x="430" y="100" width="640" height="290" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="750.0" y="135" text-anchor="middle">라우팅 테이블</text><text x="750.0" y="166" text-anchor="middle">10.0.0.0/16 → local</text><text x="750.0" y="197" text-anchor="middle">172.16.0.0/16 → Peering</text><text x="750.0" y="228" text-anchor="middle">0.0.0.0/0 → NAT</text><text x="470" y="320" class="label">/16과 /0이 일치 → /16 선택</text><path class="edge" d="M750 390 V440"/><rect x="430" y="455" width="640" height="90" rx="12" fill="#edf8f1" stroke="#93afcf" stroke-width="2"/><text x="750.0" y="490" text-anchor="middle">VPC 내부로 전달 · NAT를 거치지 않음</text><text x="40" y="590" class="">경로 선택: /32 → /24 → /16 → /0 순으로 더 구체적</text></svg>