<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">수신은 삭제가 아니다: 재시도와 DLQ</title><desc id="desc">메시지는 수신 후 visibility timeout 동안 숨겨진다. 성공하면 삭제되고 실패하면 재노출되며 반복 실패는 DLQ로 보낸다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#16304c}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#fff;stroke:#b5c9da;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1120" height="660" fill="#f3f7fb"/><text class="title" x="40" y="54">수신은 삭제가 아니다: 재시도와 DLQ</text><rect x="40" y="115" width="290" height="150" rx="16" class="box" style="fill:#fff"/><text x="60" y="153" class="label">수신</text><text x="60" y="193" class="body">큐에 메시지는 남음</text><text x="60" y="224" class="body">일시적으로 보이지 않음</text><rect x="415" y="115" width="280" height="150" rx="16" class="box" style="fill:#fff"/><text x="435" y="153" class="label">작업 실행</text><text x="435" y="193" class="body">성공 → 삭제</text><text x="435" y="224" class="body">실패·중단 → 시간 경과</text><path class="line" d="M330 190L405 190"/><rect x="790" y="115" width="285" height="150" rx="16" class="box" style="fill:#fff"/><text x="810" y="153" class="label">삭제 성공</text><text x="810" y="193" class="body">큐에서 제거</text><text x="810" y="224" class="body">업무 효과는 별도 저장</text><path class="line" d="M695 190L780 190"/><rect x="415" y="365" width="280" height="145" rx="16" class="box" style="fill:#fff"/><text x="435" y="403" class="label">재노출</text><text x="435" y="443" class="body">다른 소비자가 재수신</text><text x="435" y="474" class="body">멱등성 키로 중복 방지</text><path class="line" d="M555 265L555 355"/><rect x="790" y="365" width="285" height="145" rx="16" class="box" style="fill:#fff"/><text x="810" y="403" class="label">DLQ</text><text x="810" y="443" class="body">수신 횟수 기준 초과</text><text x="810" y="474" class="body">조사·수정·재처리</text><path class="line" d="M695 435L780 435"/><text x="40" y="585" class="body">결제 후 삭제 전에 중단될 수 있다. 큐 재전달과 중복 결제를 구분한다.</text></svg>