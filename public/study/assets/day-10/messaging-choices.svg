<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">전달·라우팅·순서 조정의 차이</title><desc id="desc">SNS는 구독자별 전달, EventBridge는 조건별 라우팅, Step Functions는 작업 순서와 오류 처리를 조정한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#16304c}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#fff;stroke:#b5c9da;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1120" height="660" fill="#f3f7fb"/><text class="title" x="40" y="54">전달·라우팅·순서 조정의 차이</text><rect x="40" y="115" width="300" height="350" rx="16" class="box" style="fill:#eaf5ff"/><text x="60" y="153" class="label">SNS</text><text x="60" y="193" class="body">주문 완료 토픽</text><text x="60" y="224" class="body">↓ 구독자별 전달</text><text x="60" y="255" class="body">발송 SQS / 분석 SQS</text><text x="60" y="286" class="body"></text><text x="60" y="317" class="body">각 소비자는 독립 처리</text><rect x="410" y="115" width="300" height="350" rx="16" class="box" style="fill:#eff9f0"/><text x="430" y="153" class="label">EventBridge</text><text x="430" y="193" class="body">이벤트 버스</text><text x="430" y="224" class="body">↓ 내용 기반 규칙</text><text x="430" y="255" class="body">결제 이벤트 → 회계</text><text x="430" y="286" class="body">취소 이벤트 → 환불</text><text x="430" y="317" class="body"></text><text x="430" y="348" class="body">소스·필터·대상 연결</text><rect x="780" y="115" width="300" height="350" rx="16" class="box" style="fill:#fff5e6"/><text x="800" y="153" class="label">Step Functions</text><text x="800" y="193" class="body">재고 확보 → 결제</text><text x="800" y="224" class="body">↓ 성공 / 실패 분기</text><text x="800" y="255" class="body">배송 / 보상 처리</text><text x="800" y="286" class="body"></text><text x="800" y="317" class="body">Retry · Catch 구성</text><text x="40" y="555" class="body">SQS: 작업 보관  |  SNS: 구독 전달  |  EventBridge: 라우팅  |  Step Functions: 조정</text><text x="40" y="600" class="body">재시도가 생기는 모든 경로에서 업무 중복 효과를 확인한다.</text></svg>