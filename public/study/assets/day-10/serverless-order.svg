<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">주문 API와 후속 작업의 독립 확장</title><desc id="desc">사용자는 API Gateway와 Lambda를 통해 주문을 접수한다. 주문 상태는 DB에 저장되고 SQS 메시지를 별도 작업자가 처리한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#16304c}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#fff;stroke:#b5c9da;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1120" height="660" fill="#f3f7fb"/><text class="title" x="40" y="54">주문 API와 후속 작업의 독립 확장</text><rect x="40" y="115" width="210" height="145" rx="16" class="box" style="fill:#fff"/><text x="60" y="153" class="label">사용자</text><text x="60" y="193" class="body">주문 요청</text><text x="60" y="224" class="body">접수 응답 수신</text><rect x="330" y="115" width="320" height="145" rx="16" class="box" style="fill:#fff"/><text x="350" y="153" class="label">API Gateway → Lambda</text><text x="350" y="193" class="body">인증·요청 제한 / 업무 처리</text><text x="350" y="224" class="body">응답은 후속 완료와 다름</text><path class="line" d="M250 185L320 185"/><rect x="760" y="115" width="310" height="145" rx="16" class="box" style="fill:#fff"/><text x="780" y="153" class="label">주문 DB</text><text x="780" y="193" class="body">주문 번호·현재 상태</text><text x="780" y="224" class="body">영속 저장</text><path class="line" d="M650 185L750 185"/><rect x="330" y="365" width="320" height="145" rx="16" class="box" style="fill:#fff"/><text x="350" y="403" class="label">SQS</text><text x="350" y="443" class="body">발송 작업 보관</text><text x="350" y="474" class="body">작업자 장애 동안 대기</text><path class="line" d="M490 260L490 355"/><rect x="760" y="365" width="310" height="145" rx="16" class="box" style="fill:#fff"/><text x="780" y="403" class="label">별도 작업자</text><text x="780" y="443" class="body">영수증·알림 처리</text><text x="780" y="474" class="body">성공 후 메시지 삭제</text><path class="line" d="M650 435L750 435"/><text x="40" y="590" class="body">API 요청률 · 함수 동시 실행 · DB 처리량은 각각 다른 한도다.</text></svg>