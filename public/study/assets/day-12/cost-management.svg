<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">비용 원인·알림·상세 배분·크기 조정</title><desc id="desc">Cost Explorer는 비용 분석, Budgets는 예산 알림, CUR는 상세 항목, Compute Optimizer는 사용률 기반 조정 제안에 쓴다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#16304c}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#fff;stroke:#b5c9da;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1120" height="660" fill="#f3f7fb"/><text class="title" x="40" y="54">비용 원인·알림·상세 배분·크기 조정</text><rect x="40" y="110" width="490" height="200" rx="16" class="box" style="fill:#eaf5ff"/><text x="60" y="148" class="label">Cost Explorer</text><text x="60" y="188" class="body">어느 서비스 · 계정의 비용이 늘었나</text><text x="60" y="219" class="body">기간 · 서비스 · 태그로 추세 비교</text><text x="60" y="250" class="body">분석과 예측</text><rect x="590" y="110" width="490" height="200" rx="16" class="box" style="fill:#fff5e6"/><text x="610" y="148" class="label">AWS Budgets</text><text x="610" y="188" class="body">실제 · 예측 비용이 기준을 넘는가</text><text x="610" y="219" class="body">알림과 지원 작업</text><text x="610" y="250" class="body">실시간 강제 지출 상한은 아님</text><rect x="40" y="365" width="490" height="200" rx="16" class="box" style="fill:#eff9f0"/><text x="60" y="403" class="label">CUR / Data Exports</text><text x="60" y="443" class="body">상세 사용 · 비용 항목을 S3로 내보내기</text><text x="60" y="474" class="body">태그 · 계정 · 공유 비용 배분</text><text x="60" y="505" class="body">배분 합계와 미할당 비용 확인</text><rect x="590" y="365" width="490" height="200" rx="16" class="box" style="fill:#fff"/><text x="610" y="403" class="label">Compute Optimizer</text><text x="610" y="443" class="body">구성 · 사용률로 적정 크기 제안</text><text x="610" y="474" class="body">부하 패턴과 업무 성능 확인 후 적용</text><text x="610" y="505" class="body">권장값이 업무 성능을 보장하지 않음</text><text x="40" y="620" class="body">목표: 비용 절감과 응답 시간 · 가용성 · 처리 여유를 함께 판단한다.</text></svg>