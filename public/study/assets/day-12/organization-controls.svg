<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">계정 조직과 권한 상한</title><desc id="desc">Organizations는 계정과 OU를 묶는다. 멤버 계정 권한은 SCP 상한 안에서 IAM 등의 정책이 실제로 허용해야 한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#16304c}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#fff;stroke:#b5c9da;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1120" height="660" fill="#f3f7fb"/><text class="title" x="40" y="54">계정 조직과 권한 상한</text><rect x="40" y="110" width="1040" height="105" rx="16" class="box" style="fill:#eaf5ff"/><text x="60" y="148" class="label">Organizations / OU</text><text x="60" y="188" class="body">운영 OU · 개발 OU 등 정책 요구에 따라 계정 묶기</text><rect x="40" y="300" width="300" height="180" rx="16" class="box" style="fill:#fff"/><text x="60" y="338" class="label">직원 접근</text><text x="60" y="378" class="body">Identity Center</text><text x="60" y="409" class="body">사용자 · 그룹 · 권한 세트</text><text x="60" y="440" class="body">어느 계정에 접근하는가</text><rect x="410" y="300" width="300" height="180" rx="16" class="box" style="fill:#fff"/><text x="430" y="338" class="label">SCP 상한</text><text x="430" y="378" class="body">OU · 계정 적용</text><text x="430" y="409" class="body">가능한 권한의 경계</text><text x="430" y="440" class="body">자체로 권한을 주지 않음</text><rect x="780" y="300" width="300" height="180" rx="16" class="box" style="fill:#fff"/><text x="800" y="338" class="label">실제 접근 허용</text><text x="800" y="378" class="body">IAM · 리소스 정책 등</text><text x="800" y="409" class="body">허용 + 상한 안의 작업</text><text x="800" y="440" class="body">명시적 거부 확인</text><path class="line" d="M340 390L400 390"/><path class="line" d="M710 390L770 390"/><text x="40" y="550" class="body">멤버 계정 루트에도 SCP 적용  |  관리 계정에는 SCP 미적용</text><text x="40" y="600" class="body">Control Tower: 랜딩 존과 계정·로그·통제 구성의 일관성을 관리한다.</text></svg>