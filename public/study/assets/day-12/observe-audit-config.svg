<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">같은 장애, 서로 다른 조사 기록</title><desc id="desc">CloudWatch는 성능과 로그, CloudTrail은 API 작업 주체, Config는 구성 이력과 규칙 준수를 기록한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#16304c}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#fff;stroke:#b5c9da;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1120" height="660" fill="#f3f7fb"/><text class="title" x="40" y="54">같은 장애, 서로 다른 조사 기록</text><rect x="40" y="115" width="1040" height="100" rx="16" class="box" style="fill:#fff5e6"/><text x="60" y="153" class="label">사건: 주문 API 오류 증가</text><text x="60" y="193" class="body">언제부터 느렸나?  /  누가 바꿨나?  /  기준과 다른 설정인가?</text><rect x="40" y="320" width="300" height="220" rx="16" class="box" style="fill:#fff"/><text x="60" y="358" class="label">CloudWatch</text><text x="60" y="398" class="body">지표 · 로그 · 알람</text><text x="60" y="429" class="body">응답 지연 · 오류율</text><text x="60" y="460" class="body">큐 적체와 CPU 확인</text><rect x="410" y="320" width="300" height="220" rx="16" class="box" style="fill:#fff"/><text x="430" y="358" class="label">CloudTrail</text><text x="430" y="398" class="body">지원 API 활동</text><text x="430" y="429" class="body">호출 주체 · 시각 · 작업</text><text x="430" y="460" class="body">데이터 이벤트는 별도 설정</text><rect x="780" y="320" width="300" height="220" rx="16" class="box" style="fill:#fff"/><text x="800" y="358" class="label">AWS Config</text><text x="800" y="398" class="body">리소스 구성 · 관계</text><text x="800" y="429" class="body">과거 상태 · 규칙 준수</text><text x="800" y="460" class="body">탐지와 차단은 구분</text><path class="line" d="M190 215L190 310"/><path class="line" d="M560 215L560 310"/><path class="line" d="M930 215L930 310"/><text x="40" y="605" class="body">필요한 범위를 미리 수집한다. 앱의 업무 기록은 별도로 설계한다.</text></svg>