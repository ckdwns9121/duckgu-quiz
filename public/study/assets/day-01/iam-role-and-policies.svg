<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="755" viewBox="0 0 1120 755" role="img" aria-labelledby="title desc"><title id="title">04  역할의 신뢰와 권한을 나누어 이해한다</title><desc id="desc">역할의 신뢰 정책은 맡을 주체를 정하고 권한 정책은 수행할 작업을 정한다. 앱은 임시 자격 증명으로 S3 읽기를 요청하며 정책 평가 결과에 따라 허용 또는 거부된다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1120" height="755" rx="0" fill="#F8FAFD"/><text x="40" y="54" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">04  역할의 신뢰와 권한을 나누어 이해한다</text><text x="40" y="90" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">예: EC2 앱이 비공개 S3의 특정 경로에 있는 파일을 읽는다.</text><rect x="40" y="122" width="500" height="132" rx="18" fill="#EEF4FF"/><text x="64" y="161" font-size="25" fill="#225AD5" font-weight="700" text-anchor="start">신뢰 정책</text><text x="64" y="199" font-size="23" fill="#15243B" font-weight="400" text-anchor="start">누가 이 역할을 맡을 수 있나?</text><text x="64" y="233" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">예: EC2 서비스가 맡도록 신뢰</text><rect x="580" y="122" width="500" height="132" rx="18" fill="#E8F7F2"/><text x="604" y="161" font-size="25" fill="#087B72" font-weight="700" text-anchor="start">권한 정책</text><text x="604" y="199" font-size="23" fill="#15243B" font-weight="400" text-anchor="start">이 역할로 무엇을 할 수 있나?</text><text x="604" y="233" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">예: 특정 S3 객체의 GetObject 허용</text><rect x="40" y="284" width="1040" height="90" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="65" y="322" font-size="26" fill="#15243B" font-weight="700" text-anchor="start">IAM 역할</text><text x="65" y="356" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">신뢰와 권한을 함께 설정하고, 역할 세션은 임시 자격 증명을 사용한다.</text><rect x="40" y="436" width="300" height="155" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="60" y="476" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">EC2의 앱</text><text x="60" y="521" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">역할의 임시 자격 증명을</text><text x="60" y="559" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">지원 SDK가 사용</text><rect x="410" y="436" width="300" height="155" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="430" y="476" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">권한 판단</text><text x="430" y="521" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">GetObject + 대상 경로</text><text x="430" y="559" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">적용되는 정책을 평가</text><rect x="780" y="436" width="300" height="155" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="800" y="476" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">S3 객체</text><text x="800" y="521" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">허용된 파일 읽기</text><text x="800" y="559" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">다른 작업은 별도 권한</text><path d="M350,514 L396,514" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><path d="M720,514 L766,514" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="617" width="1040" height="67" rx="18" fill="#FFF3E6"/><text x="64" y="658" font-size="23" fill="#A95512" font-weight="600" text-anchor="start">Allow가 있어도 적용되는 명시적 Deny가 있으면 거부된다.</text><text x="40" y="723" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">권한 흐름의 개념도다. IAM 역할은 네트워크 중계 서버가 아니다.</text></g></svg>