<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">01  리전 안에 여러 가용 영역이 있다</title><desc id="desc">리전 A 안에 독립된 AZ A와 AZ B 및 서버를 배치했다. 별도 리전 B로 자동 복제되지는 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1120" height="660" rx="0" fill="#F8FAFD"/><text x="40" y="54" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">01  리전 안에 여러 가용 영역이 있다</text><text x="40" y="90" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">리전은 지리적 지역, AZ는 한 리전 안의 장애 분리 단위</text><rect x="40" y="120" width="1040" height="342" rx="18" fill="#EEF4FF" stroke="#CBD5E1" stroke-width="2"/><text x="65" y="160" font-size="25" fill="#225AD5" font-weight="700" text-anchor="start">리전 A · 서울 등 선택한 지역</text><rect x="65" y="184" width="470" height="245" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="89" y="222" font-size="24" fill="#15243B" font-weight="700" text-anchor="start">AZ A</text><text x="89" y="257" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">하나 이상의 데이터센터</text><rect x="89" y="281" width="422" height="65" rx="18" fill="#E8F7F2"/><text x="300" y="322" font-size="24" fill="#087B72" font-weight="600" text-anchor="middle">웹 서버 A</text><text x="89" y="392" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">한 AZ의 장애를 다른 AZ와 분리</text><rect x="585" y="184" width="470" height="245" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="609" y="222" font-size="24" fill="#15243B" font-weight="700" text-anchor="start">AZ B</text><text x="609" y="257" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">하나 이상의 데이터센터</text><rect x="609" y="281" width="422" height="65" rx="18" fill="#E8F7F2"/><text x="820" y="322" font-size="24" fill="#087B72" font-weight="600" text-anchor="middle">웹 서버 B</text><text x="609" y="392" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">한 AZ의 장애를 다른 AZ와 분리</text><rect x="40" y="486" width="1040" height="106" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 7"/><text x="65" y="525" font-size="24" fill="#15243B" font-weight="700" text-anchor="start">리전 B · 별도의 지리적 지역</text><text x="65" y="562" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">리전 간 복제와 전환은 서비스별로 별도 설계한다.</text><text x="40" y="631" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">개념도: 서버 분산만 표현했으며 요청 분산과 데이터 계층은 생략했다.</text></g></svg>