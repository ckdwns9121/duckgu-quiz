<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">계정 간 역할 사용과 접근 권한</title><desc id="desc">계정 A의 호출자가 AssumeRole 권한과 계정 B의 신뢰 정책을 통해 계정 B의 역할을 맡고 역할 세션의 권한으로 S3에 접근한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><rect width="1120" height="680" fill="#F8FAFD"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="40" y="55" font-size="30" fill="#15243B" font-weight="700">계정 간 역할 사용과 접근 권한</text><text x="40" y="98" font-size="22" fill="#52627A" font-weight="400">계정 A의 신원은 계정 B의 역할을 맡은 뒤 그 역할의 권한으로 요청한다.</text><rect x="40" y="155" width="300" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="60" y="198" font-size="24" fill="#15243B" font-weight="700">계정 A · 분석가</text><text x="60" y="252" font-size="21" fill="#15243B" font-weight="400">AssumeRole 호출 권한</text><text x="60" y="298" font-size="20" fill="#52627A" font-weight="400">대상 역할을 지정</text><rect x="410" y="155" width="300" height="180" rx="16" fill="#EEF4FF" stroke="#CBD5E1" stroke-width="2"/><text x="430" y="198" font-size="24" fill="#15243B" font-weight="700">계정 B · 읽기 역할</text><text x="430" y="252" font-size="21" fill="#15243B" font-weight="400">신뢰 정책 + 권한 정책</text><text x="430" y="298" font-size="20" fill="#52627A" font-weight="400">STS 임시 자격 증명</text><rect x="780" y="155" width="300" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="800" y="198" font-size="24" fill="#15243B" font-weight="700">계정 B · S3 데이터</text><text x="800" y="252" font-size="21" fill="#15243B" font-weight="400">읽기 작업과 대상 경로</text><text x="800" y="298" font-size="20" fill="#52627A" font-weight="400">적용되는 정책으로 평가</text><path d="M351,245 L396,245" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><path d="M721,245 L766,245" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="380" width="1040" height="65" rx="16" fill="#E8F7F2" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="421" font-size="22" fill="#087B72" font-weight="700">호출자 권한</text><text x="225" y="421" font-size="21" fill="#15243B" font-weight="400">계정 A에서 계정 B 역할의 sts:AssumeRole 호출을 허용</text><rect x="40" y="455" width="1040" height="65" rx="16" fill="#E8F7F2" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="496" font-size="22" fill="#087B72" font-weight="700">역할 신뢰</text><text x="225" y="496" font-size="21" fill="#15243B" font-weight="400">계정 B에서 계정 A의 허용된 주체가 역할을 맡도록 신뢰</text><rect x="40" y="530" width="1040" height="65" rx="16" fill="#E8F7F2" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="571" font-size="22" fill="#087B72" font-weight="700">데이터 접근</text><text x="225" y="571" font-size="21" fill="#15243B" font-weight="400">역할의 읽기 권한과 버킷·KMS 등 적용되는 정책을 함께 확인</text><text x="40" y="642" font-size="20" fill="#52627A" font-weight="400">역할을 맡으면 원래 신원의 권한을 단순 합산하는 것이 아니라 역할 세션으로 요청한다.</text></g></svg>