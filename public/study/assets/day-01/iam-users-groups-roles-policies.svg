<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1020" viewBox="0 0 1120 1020" role="img" aria-labelledby="title desc"><title id="title">IAM 사용자·그룹·역할·정책의 관계</title><desc id="desc">S3 읽기 정책을 개발자 그룹에 연결하면 그룹의 IAM 사용자들에게 권한이 적용된다. 별도의 IAM 역할에는 권한 정책이 연결되며 신뢰받는 사용자나 앱이 역할을 맡아 임시 자격 증명으로 요청한다. 역할은 그룹 구성원이 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><rect width="1120" height="1020" fill="#F8FAFD"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="40" y="56" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">IAM 사용자·그룹·역할·정책</text><text x="40" y="98" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">정책은 권한 규칙이고, 그룹과 역할은 그 규칙을 사용하는 방식이 다르다.</text><rect x="40" y="130" width="1040" height="350" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="172" font-size="26" fill="#15243B" font-weight="700" text-anchor="start">사용자와 그룹</text><rect x="64" y="210" width="330" height="160" rx="18" fill="#EEF4FF"/><text x="86" y="252" font-size="25" fill="#225AD5" font-weight="700" text-anchor="start">정책 · S3 읽기</text><text x="86" y="297" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">작업: GetObject 허용</text><text x="86" y="335" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">대상: reports/* 경로</text><path d="M410,288 L550,288" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="256" font-size="20" fill="#225AD5" font-weight="400" text-anchor="middle">그룹에 연결</text><rect x="566" y="198" width="490" height="222" rx="18" fill="#E8F7F2" stroke="#CBD5E1" stroke-width="2"/><text x="590" y="238" font-size="25" fill="#087B72" font-weight="700" text-anchor="start">개발자 그룹</text><rect x="590" y="266" width="209" height="99" rx="18" fill="white"/><text x="694" y="309" font-size="23" fill="#15243B" font-weight="600" text-anchor="middle">사용자 · 민수</text><text x="694" y="343" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">각자의 신원으로 요청</text><rect x="823" y="266" width="209" height="99" rx="18" fill="white"/><text x="927" y="309" font-size="23" fill="#15243B" font-weight="600" text-anchor="middle">사용자 · 지수</text><text x="927" y="343" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">각자의 신원으로 요청</text><text x="590" y="400" font-size="20" fill="#087B72" font-weight="400" text-anchor="start">소속 사용자에게 그룹 정책의 권한 적용</text><text x="64" y="452" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">그룹은 IAM 사용자를 묶는다. 그룹 자체로 로그인하거나 역할을 맡지 않는다.</text><rect x="40" y="505" width="1040" height="360" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="547" font-size="26" fill="#15243B" font-weight="700" text-anchor="start">역할과 정책</text><rect x="64" y="617" width="250" height="137" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="84" y="656" font-size="23" fill="#15243B" font-weight="700" text-anchor="start">허용된 사용자·앱</text><text x="84" y="697" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">예: EC2에서 실행할 앱</text><path d="M330,684 L407,684" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><text x="369" y="593" font-size="19" fill="#225AD5" font-weight="400" text-anchor="middle">역할 사용</text><rect x="423" y="617" width="302" height="137" rx="18" fill="#E8F7F2"/><text x="446" y="656" font-size="26" fill="#087B72" font-weight="700" text-anchor="start">IAM 역할</text><text x="446" y="699" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">임시 자격 증명으로 사용</text><text x="446" y="733" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">신뢰 정책으로 맡을 주체 지정</text><path d="M795,684 L741,684" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><text x="768" y="593" font-size="19" fill="#225AD5" font-weight="400" text-anchor="middle">연결</text><rect x="811" y="617" width="245" height="137" rx="18" fill="#EEF4FF"/><text x="832" y="656" font-size="25" fill="#225AD5" font-weight="700" text-anchor="start">권한 정책</text><text x="832" y="698" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">S3 읽기 허용</text><text x="832" y="733" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">작업·대상·조건 정의</text><text x="64" y="800" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">역할은 그룹에 넣지 않는다. 신뢰받는 사용자나 앱이 역할을 맡는다.</text><text x="64" y="836" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">예: EC2 앱은 역할의 임시 자격 증명으로 허용된 S3 읽기를 요청한다.</text><rect x="40" y="890" width="1040" height="100" rx="18" fill="#FFF3E6"/><text x="64" y="932" font-size="23" fill="#A95512" font-weight="600" text-anchor="start">정책은 사용자에게 직접 연결할 수도 있다.</text><text x="64" y="970" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">그룹·역할·사용자에 연결하는 권한 정책을 예로 들었다. 최종 허용 여부는 적용되는 정책 전체로 판단한다.</text></g></svg>