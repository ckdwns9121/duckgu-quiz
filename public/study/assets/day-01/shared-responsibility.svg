<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">02  서비스에 따라 보안 책임의 경계가 달라진다</title><desc id="desc">EC2에서는 고객이 데이터 앱 게스트 OS를 관리한다. S3에서는 고객이 데이터와 접근 권한을 관리하고 AWS가 서비스와 기반 운영을 관리한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1120" height="720" rx="0" fill="#F8FAFD"/><text x="40" y="54" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">02  서비스에 따라 보안 책임의 경계가 달라진다</text><text x="40" y="90" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">고객의 설정·데이터 책임은 남고, 기반 운영의 경계는 서비스에 따라 달라진다.</text><rect x="40" y="122" width="500" height="448" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="164" font-size="23" fill="#15243B" font-weight="700" text-anchor="start">EC2 · 서버 운영체제까지 고객 관리</text><rect x="580" y="122" width="500" height="448" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="604" y="164" font-size="23" fill="#15243B" font-weight="700" text-anchor="start">S3 · 기반 운영을 AWS가 관리</text><rect x="58" y="190" width="464" height="70" rx="18" fill="#E8F7F2"/><text x="76" y="220" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">데이터 · 접근 권한</text><text x="76" y="246" font-size="18" fill="#087B72" font-weight="600" text-anchor="start">관리 주체: 고객</text><rect x="58" y="278" width="464" height="70" rx="18" fill="#E8F7F2"/><text x="76" y="308" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">애플리케이션 · 라이브러리</text><text x="76" y="334" font-size="18" fill="#087B72" font-weight="600" text-anchor="start">관리 주체: 고객</text><rect x="58" y="366" width="464" height="70" rx="18" fill="#E8F7F2"/><text x="76" y="396" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">게스트 운영체제 패치</text><text x="76" y="422" font-size="18" fill="#087B72" font-weight="600" text-anchor="start">관리 주체: 고객</text><rect x="58" y="454" width="464" height="70" rx="18" fill="#EEF4FF"/><text x="76" y="484" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">물리 서버 · 시설 · 기반 인프라</text><text x="76" y="510" font-size="18" fill="#225AD5" font-weight="600" text-anchor="start">관리 주체: AWS</text><rect x="598" y="190" width="464" height="70" rx="18" fill="#E8F7F2"/><text x="616" y="220" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">데이터 · 공개 여부 · 접근 권한</text><text x="616" y="246" font-size="18" fill="#087B72" font-weight="600" text-anchor="start">관리 주체: 고객</text><rect x="598" y="278" width="464" height="70" rx="18" fill="#EEF4FF"/><text x="616" y="308" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">S3 서비스 소프트웨어</text><text x="616" y="334" font-size="18" fill="#225AD5" font-weight="600" text-anchor="start">관리 주체: AWS</text><rect x="598" y="366" width="464" height="70" rx="18" fill="#EEF4FF"/><text x="616" y="396" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">S3 기반 운영체제</text><text x="616" y="422" font-size="18" fill="#225AD5" font-weight="600" text-anchor="start">관리 주체: AWS</text><rect x="598" y="454" width="464" height="70" rx="18" fill="#EEF4FF"/><text x="616" y="484" font-size="20" fill="#15243B" font-weight="400" text-anchor="start">물리 서버 · 시설 · 기반 인프라</text><text x="616" y="510" font-size="18" fill="#225AD5" font-weight="600" text-anchor="start">관리 주체: AWS</text><rect x="40" y="594" width="1040" height="65" rx="18" fill="#FFF3E6"/><text x="64" y="634" font-size="23" fill="#A95512" font-weight="600" text-anchor="start">관리형 서비스에서도 고객이 데이터와 접근 설정을 관리한다.</text><text x="40" y="695" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">핵심 책임을 단순화한 비교이며 모든 보안 통제를 나열한 표는 아니다.</text></g></svg>