<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">03  인증 다음에 작업별 권한을 판단한다</title><desc id="desc">요청자가 요청하면 인증으로 신원을 확인하고 인가로 작업 권한을 확인한다. 인증 성공이 모든 작업 허용을 의미하지는 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1120" height="590" rx="0" fill="#F8FAFD"/><text x="40" y="54" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">03  인증 다음에 작업별 권한을 판단한다</text><text x="40" y="90" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">여기서는 인증이 필요한 IAM 사용자·역할의 요청을 예로 든다.</text><rect x="40" y="160" width="300" height="192" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="62" y="197" font-size="22" fill="#225AD5" font-weight="700" text-anchor="start">1</text><text x="62" y="236" font-size="28" fill="#15243B" font-weight="700" text-anchor="start">요청</text><text x="62" y="280" font-size="22" fill="#15243B" font-weight="400" text-anchor="start">개발자 또는 앱이</text><text x="62" y="316" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">AWS 작업을 요청</text><rect x="410" y="160" width="300" height="192" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="432" y="197" font-size="22" fill="#225AD5" font-weight="700" text-anchor="start">2</text><text x="432" y="236" font-size="28" fill="#15243B" font-weight="700" text-anchor="start">인증</text><text x="432" y="280" font-size="22" fill="#15243B" font-weight="400" text-anchor="start">누가 요청했는지</text><text x="432" y="316" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">자격 증명으로 확인</text><rect x="780" y="160" width="300" height="192" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="802" y="197" font-size="22" fill="#225AD5" font-weight="700" text-anchor="start">3</text><text x="802" y="236" font-size="28" fill="#15243B" font-weight="700" text-anchor="start">인가</text><text x="802" y="280" font-size="22" fill="#15243B" font-weight="400" text-anchor="start">이 작업을 허용할지</text><text x="802" y="316" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">적용되는 정책으로 판단</text><path d="M350,255 L396,255" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><path d="M720,255 L766,255" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="397" width="500" height="103" rx="18" fill="#E8F7F2"/><text x="65" y="438" font-size="25" fill="#087B72" font-weight="700" text-anchor="start">로그인·인증 성공</text><text x="65" y="476" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">요청자의 신원을 확인한 상태</text><rect x="570" y="397" width="510" height="103" rx="18" fill="#FFF3E6"/><text x="595" y="438" font-size="24" fill="#A95512" font-weight="700" text-anchor="start">전체 작업 허용을 뜻하지 않는다</text><text x="595" y="476" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">읽기 허용과 삭제 허용은 별개</text><text x="40" y="550" font-size="22" fill="#15243B" font-weight="600" text-anchor="start">정책 판단의 단위: 요청자 + 작업(Action) + 대상(Resource) + 조건</text></g></svg>