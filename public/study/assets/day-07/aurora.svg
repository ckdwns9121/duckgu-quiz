<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">Aurora: 연결과 저장 계층의 분리</title><desc id="desc">앱은 writer 또는 reader endpoint를 골라 연결하고 인스턴스들은 다중 AZ 스토리지를 공유한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527796" stroke-width="2"/></marker></defs><rect width="1120" height="510" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><text x="48" y="60" font-size="32" font-weight="700" fill="#17324d">Aurora: 연결과 저장 계층의 분리</text><rect x="48" y="100" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="138" font-size="25" font-weight="700" fill="#17324d">앱의 쓰기 연결</text><text x="66" y="178" font-size="21" fill="#3e5367">Cluster endpoint</text><path d="M369,156 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="100" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="138" font-size="25" font-weight="700" fill="#17324d">Writer</text><text x="420" y="178" font-size="21" fill="#3e5367">읽기·쓰기 SQL 실행</text><path d="M723,156 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="100" width="316" height="262" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="195" font-size="25" font-weight="700" fill="#17324d">공유 클러스터 볼륨</text><text x="774" y="235" font-size="21" fill="#3e5367">Writer와 Reader가</text><text x="774" y="270" font-size="21" fill="#3e5367">같은 다중 AZ 저장소 사용</text><rect x="48" y="250" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="288" font-size="25" font-weight="700" fill="#17324d">앱의 읽기 연결</text><text x="66" y="328" font-size="21" fill="#3e5367">Reader endpoint</text><path d="M369,306 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="250" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="288" font-size="25" font-weight="700" fill="#17324d">Reader 그룹</text><text x="420" y="328" font-size="21" fill="#3e5367">연결 단위로 읽기 분산</text><path d="M723,306 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><text x="48" y="468" font-size="22" fill="#3e5367">Reader endpoint는 SQL마다 분산하거나 쓰기를 자동 라우팅하지 않는다.</text></g></svg>