<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">복제와 시점 복구는 다른 문제를 푼다</title><desc id="desc">삭제는 복제본에도 전파되며 PITR은 삭제 이전의 새 DB를 복원한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527796" stroke-width="2"/></marker></defs><rect width="1120" height="510" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><text x="48" y="60" font-size="32" font-weight="700" fill="#17324d">복제와 시점 복구는 다른 문제를 푼다</text><rect x="48" y="100" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="138" font-size="25" font-weight="700" fill="#17324d">10:00 정상 데이터</text><text x="66" y="178" font-size="21" fill="#3e5367">자동 백업 + 변경 로그</text><path d="M369,156 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="100" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="138" font-size="25" font-weight="700" fill="#17324d">10:15 실수로 삭제</text><text x="420" y="178" font-size="21" fill="#3e5367">복제본에도 삭제 전파</text><path d="M723,156 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="100" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="138" font-size="25" font-weight="700" fill="#17324d">10:30 복구 시작</text><text x="774" y="178" font-size="21" fill="#3e5367">10:14 시점 선택</text><rect x="48" y="250" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="288" font-size="25" font-weight="700" fill="#17324d">과거 데이터 복원</text><text x="66" y="328" font-size="21" fill="#3e5367">새 DB 인스턴스 생성</text><path d="M369,306 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="250" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="288" font-size="25" font-weight="700" fill="#17324d">앱·권한·데이터 확인</text><text x="420" y="328" font-size="21" fill="#3e5367">접속과 복구 결과 점검</text><path d="M723,306 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="250" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="288" font-size="25" font-weight="700" fill="#17324d">연결 대상 전환</text><text x="774" y="328" font-size="21" fill="#3e5367">새 DB로 서비스 복구</text><text x="48" y="468" font-size="22" fill="#3e5367">Multi-AZ는 가용성, PITR은 과거 데이터 복구. 남긴 백업 비용도 확인한다.</text></g></svg>