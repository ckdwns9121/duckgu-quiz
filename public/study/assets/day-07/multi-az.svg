<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">RDS Multi-AZ: 배포 유형을 먼저 확인</title><desc id="desc">DB instance 방식은 대기 DB를 읽기에 사용하지 않고 DB cluster 방식은 두 reader를 읽기에 활용한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527796" stroke-width="2"/></marker></defs><rect width="1120" height="510" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><text x="48" y="60" font-size="32" font-weight="700" fill="#17324d">RDS Multi-AZ: 배포 유형을 먼저 확인</text><rect x="48" y="100" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="138" font-size="25" font-weight="700" fill="#17324d">DB instance</text><text x="66" y="178" font-size="21" fill="#3e5367">기본 DB: 읽기·쓰기</text><path d="M369,156 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="100" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="138" font-size="25" font-weight="700" fill="#17324d">다른 AZ로 동기 복제</text><text x="420" y="178" font-size="21" fill="#3e5367">standby는 일반 읽기 불가</text><path d="M723,156 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="100" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="138" font-size="25" font-weight="700" fill="#17324d">장애 조치</text><text x="774" y="178" font-size="21" fill="#3e5367">standby가 기본 DB 역할</text><rect x="48" y="250" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="288" font-size="25" font-weight="700" fill="#17324d">DB cluster</text><text x="66" y="328" font-size="21" fill="#3e5367">writer + reader 2대</text><path d="M369,306 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="250" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="288" font-size="25" font-weight="700" fill="#17324d">세 AZ에 배치</text><text x="420" y="328" font-size="21" fill="#3e5367">reader는 읽기 요청 처리</text><path d="M723,306 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="250" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="288" font-size="25" font-weight="700" fill="#17324d">장애 조치</text><text x="774" y="328" font-size="21" fill="#3e5367">reader가 승격 대상</text><text x="48" y="468" font-size="22" fill="#3e5367">Multi-AZ DB instance의 standby와 일반 읽기 복제본은 역할이 다르다.</text></g></svg>