<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">NACL에는 반환 트래픽 규칙도 필요</title><desc id="desc">클라이언트 임시 포트 53000에서 서버 443으로 요청하면 응답의 목적지는 53000이다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2863a6"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;font-size:24px;fill:#172c48} .title{font-size:32px;font-weight:700} .small{font-size:20px} .label{font-weight:700} .edge{fill:none;stroke:#2863a6;stroke-width:3;marker-end:url(#a)}</style><rect width="1120" height="640" fill="white"/><text x="40" y="50" class="title">NACL에는 반환 트래픽 규칙도 필요</text><rect x="40" y="150" width="270" height="130" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="175.0" y="185" text-anchor="middle">외부 클라이언트</text><text x="175.0" y="216" text-anchor="middle">203.0.113.10</text><text x="175.0" y="247" text-anchor="middle">임시 포트 53000</text><rect x="790" y="150" width="270" height="130" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="925.0" y="185" text-anchor="middle">서브넷 안의 서버</text><text x="925.0" y="216" text-anchor="middle">10.0.1.20</text><text x="925.0" y="247" text-anchor="middle">HTTPS 443</text><path class="edge" d="M310 185 H790"/><text x="350" y="160" class="">요청: 목적지 TCP 443</text><path class="edge" d="M790 250 H310"/><text x="335" y="310" class="">응답: 목적지 TCP 53000</text><rect x="340" y="365" width="440" height="150" rx="12" fill="#fff5e8" stroke="#93afcf" stroke-width="2"/><text x="560.0" y="400" text-anchor="middle">서버 서브넷의 NACL</text><text x="560.0" y="431" text-anchor="middle">인바운드: 443 허용</text><text x="560.0" y="462" text-anchor="middle">아웃바운드: 임시 포트 허용</text><text x="40" y="580" class="">SG는 허용된 연결의 응답을 추적 · NACL은 양방향을 각각 평가</text></svg>