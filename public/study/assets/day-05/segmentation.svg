<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">계층별 보안 그룹으로 통신 범위 제한</title><desc id="desc">사용자에서 ALB, ALB 보안 그룹에서 앱, 앱 보안 그룹에서 DB로 필요한 포트만 허용한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2863a6"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;font-size:24px;fill:#172c48} .title{font-size:32px;font-weight:700} .small{font-size:20px} .label{font-weight:700} .edge{fill:none;stroke:#2863a6;stroke-width:3;marker-end:url(#a)}</style><rect width="1120" height="640" fill="white"/><text x="40" y="50" class="title">계층별 보안 그룹으로 통신 범위 제한</text><rect x="40" y="130" width="210" height="120" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="145.0" y="165" text-anchor="middle">사용자</text><text x="145.0" y="196" text-anchor="middle">인터넷</text><rect x="390" y="130" width="280" height="120" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="530.0" y="165" text-anchor="middle">ALB · ALB SG</text><text x="530.0" y="196" text-anchor="middle">HTTPS 443</text><rect x="810" y="130" width="270" height="120" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="945.0" y="165" text-anchor="middle">앱 · App SG</text><text x="945.0" y="196" text-anchor="middle">TCP 8080</text><path class="edge" d="M250 190 H390"/><path class="edge" d="M669 190 H810"/><text x="310" y="105" class="small">인터넷에서 443</text><text x="750" y="105" class="small">출발지 ALB SG</text><rect x="810" y="390" width="270" height="120" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="945.0" y="425" text-anchor="middle">DB · DB SG</text><text x="945.0" y="456" text-anchor="middle">TCP 3306</text><path class="edge" d="M945 250 V390"/><text x="450" y="335" class="label">DB 허용 출발지 = App SG</text><text x="40" y="560" class="">앱·DB는 비공개 서브넷에 배치 · SG 참조는 규칙 복사가 아님</text></svg>