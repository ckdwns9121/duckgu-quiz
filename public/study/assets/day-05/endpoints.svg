<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Gateway와 Interface Endpoint의 연결 방식</title><desc id="desc">Gateway는 라우팅을 사용하고 Interface는 사설 ENI와 보안 그룹을 사용하는 PrivateLink 연결이다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2863a6"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;font-size:24px;fill:#172c48} .title{font-size:32px;font-weight:700} .small{font-size:20px} .label{font-weight:700} .edge{fill:none;stroke:#2863a6;stroke-width:3;marker-end:url(#a)}</style><rect width="1120" height="640" fill="white"/><text x="40" y="50" class="title">Gateway와 Interface Endpoint의 연결 방식</text><text x="40" y="105" class="label">Gateway Endpoint · 라우팅 기반</text><rect x="40" y="135" width="220" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="150.0" y="170" text-anchor="middle">앱</text><rect x="350" y="135" width="430" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="565.0" y="170" text-anchor="middle">라우팅 테이블</text><text x="565.0" y="201" text-anchor="middle">서비스 prefix list → VPCE</text><rect x="870" y="135" width="220" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="980.0" y="170" text-anchor="middle">S3 / DynamoDB</text><path class="edge" d="M260 190 H350"/><path class="edge" d="M780 190 H870"/><text x="40" y="295" class="small">IGW·NAT 불필요 · 엔드포인트 SG 없음 · 추가 엔드포인트 요금 없음</text><text x="40" y="365" class="label">Interface Endpoint · PrivateLink</text><rect x="40" y="400" width="220" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="150.0" y="435" text-anchor="middle">앱</text><rect x="350" y="400" width="430" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="565.0" y="435" text-anchor="middle">프라이빗 ENI + SG</text><text x="565.0" y="466" text-anchor="middle">DNS → ENI 사설 IP</text><rect x="870" y="400" width="220" height="110" rx="12" fill="#eef5fc" stroke="#93afcf" stroke-width="2"/><text x="980.0" y="435" text-anchor="middle">지원 서비스</text><path class="edge" d="M260 455 H350"/><path class="edge" d="M780 455 H870"/><text x="40" y="575" class="small">시간·처리량 요금 · 두 방식 모두 IAM·리소스 정책 권한은 별도</text></svg>