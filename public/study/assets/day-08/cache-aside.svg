<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">Cache-aside: hit와 miss</title><desc id="desc">앱은 캐시를 먼저 확인하고 miss일 때 원본 DB를 읽어 캐시에 저장한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527796" stroke-width="2"/></marker></defs><rect width="1120" height="510" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><text x="48" y="60" font-size="32" font-weight="700" fill="#17324d">Cache-aside: hit와 miss</text><rect x="48" y="100" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="138" font-size="25" font-weight="700" fill="#17324d">① 앱이 캐시 조회</text><text x="66" y="178" font-size="21" fill="#3e5367">상품 ID를 키로 사용</text><path d="M369,156 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="100" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="138" font-size="25" font-weight="700" fill="#17324d">② HIT: 캐시 값 있음</text><text x="420" y="178" font-size="21" fill="#3e5367">메모리에서 바로 응답</text><path d="M723,156 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="100" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="138" font-size="25" font-weight="700" fill="#17324d">원본 DB 접근 생략</text><text x="774" y="178" font-size="21" fill="#3e5367">반복 읽기 부하 감소</text><rect x="48" y="250" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="288" font-size="25" font-weight="700" fill="#17324d">② MISS: 값 없음</text><text x="66" y="328" font-size="21" fill="#3e5367">앱이 원본 DB 조회</text><path d="M369,306 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="250" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="288" font-size="25" font-weight="700" fill="#17324d">③ 결과 캐시에 저장</text><text x="420" y="328" font-size="21" fill="#3e5367">TTL과 함께 보관</text><path d="M723,306 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="250" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="288" font-size="25" font-weight="700" fill="#17324d">④ 사용자에게 응답</text><text x="774" y="328" font-size="21" fill="#3e5367">다음 요청은 HIT 가능</text><text x="48" y="468" font-size="22" fill="#3e5367">DB 변경이 캐시에 자동 반영되지는 않는다. 갱신·무효화 전략이 필요하다.</text></g></svg>