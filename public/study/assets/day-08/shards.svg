<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">샤딩은 분할, 복제는 같은 데이터의 사본</title><desc id="desc">샤드마다 다른 키를 저장하고 replica는 해당 샤드의 사본을 유지한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527796" stroke-width="2"/></marker></defs><rect width="1120" height="510" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><text x="48" y="60" font-size="32" font-weight="700" fill="#17324d">샤딩은 분할, 복제는 같은 데이터의 사본</text><rect x="48" y="100" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="138" font-size="25" font-weight="700" fill="#17324d">Shard A primary</text><text x="66" y="178" font-size="21" fill="#3e5367">키 A~M, 읽기·쓰기</text><path d="M369,156 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="100" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="138" font-size="25" font-weight="700" fill="#17324d">Shard A replica</text><text x="420" y="178" font-size="21" fill="#3e5367">같은 키 A~M 복제</text><path d="M723,156 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="100" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="138" font-size="25" font-weight="700" fill="#17324d">역할</text><text x="774" y="178" font-size="21" fill="#3e5367">읽기·장애 대응</text><rect x="48" y="250" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="288" font-size="25" font-weight="700" fill="#17324d">Shard B primary</text><text x="66" y="328" font-size="21" fill="#3e5367">키 N~Z, 읽기·쓰기</text><path d="M369,306 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="250" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="288" font-size="25" font-weight="700" fill="#17324d">Shard B replica</text><text x="420" y="328" font-size="21" fill="#3e5367">같은 키 N~Z 복제</text><path d="M723,306 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="250" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="288" font-size="25" font-weight="700" fill="#17324d">역할</text><text x="774" y="328" font-size="21" fill="#3e5367">읽기·장애 대응</text><text x="48" y="468" font-size="22" fill="#3e5367">샤드 추가: 데이터와 처리량 분산. 복제본 추가: 같은 샤드의 사본 증가.</text></g></svg>