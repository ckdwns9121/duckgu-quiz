<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">DynamoDB: 조회 패턴에서 키 설계</title><desc id="desc">고객 파티션 키와 시간 정렬 키로 주문을 찾고 쓰기 집중을 피한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527796" stroke-width="2"/></marker></defs><rect width="1120" height="510" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><text x="48" y="60" font-size="32" font-weight="700" fill="#17324d">DynamoDB: 조회 패턴에서 키 설계</text><rect x="48" y="100" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="138" font-size="25" font-weight="700" fill="#17324d">파티션 키 C101</text><text x="66" y="178" font-size="21" fill="#3e5367">고객 단위로 주문 묶음</text><path d="M369,156 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="100" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="138" font-size="25" font-weight="700" fill="#17324d">정렬 키 11-02#O900</text><text x="420" y="178" font-size="21" fill="#3e5367">같은 고객 안의 주문 구분</text><path d="M723,156 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="100" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="138" font-size="25" font-weight="700" fill="#17324d">Query</text><text x="774" y="178" font-size="21" fill="#3e5367">고객 + 시간 범위 조회</text><rect x="48" y="250" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="288" font-size="25" font-weight="700" fill="#17324d">파티션 키 C202</text><text x="66" y="328" font-size="21" fill="#3e5367">다른 고객의 주문 묶음</text><path d="M369,306 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="250" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="288" font-size="25" font-weight="700" fill="#17324d">여러 키로 부하 분산</text><text x="420" y="328" font-size="21" fill="#3e5367">특정 키 집중 여부 확인</text><path d="M723,306 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="250" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="288" font-size="25" font-weight="700" fill="#17324d">주의: TODAY 한 키</text><text x="774" y="328" font-size="21" fill="#3e5367">요청 집중 시 hot key</text><text x="48" y="468" font-size="22" fill="#3e5367">키 개수가 많아도 실제 요청이 한 키에 몰리면 병목이 생길 수 있다.</text></g></svg>