<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">I/O 성능: 가장 좁은 경로가 병목</title><desc id="desc">볼륨 12,000 IOPS · 250MiB/s → 요구를 수치상 충족. EC2가 8,000 IOPS이면 볼륨만 높여도 목표 달성 불가. CPU가 낮아도 스토리지 큐·I/O 지연 때문에 앱은 느릴 수 있음</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#4f85b5"/></marker></defs><rect width="1120" height="570" rx="20" fill="#0e1c30"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" fill="#edf5ff"><text x="40" y="58" font-size="30" font-weight="700">I/O 성능: 가장 좁은 경로가 병목</text><rect x="40" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="58" y="151" font-size="24" font-weight="700">앱의 실제 요구</text><text x="58" y="202" font-size="20">16KiB × 10,000 IOPS</text><text x="58" y="242" font-size="20">약 156MiB/s 처리량 필요</text><path d="M365 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="418" y="151" font-size="24" font-weight="700">EC2 전체 EBS 한도</text><text x="418" y="202" font-size="20">인스턴스에 연결한 볼륨이 공유</text><text x="418" y="242" font-size="20">CPU·네트워크 한도도 별도</text><path d="M725 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="778" y="151" font-size="24" font-weight="700">EBS 볼륨 설정</text><text x="778" y="202" font-size="20">IOPS와 MiB/s를 함께 충족</text><text x="778" y="242" font-size="20">용량만 늘리는 것과 다름</text><text x="50" y="370" font-size="23">볼륨 12,000 IOPS · 250MiB/s → 요구를 수치상 충족</text><text x="50" y="435" font-size="23">EC2가 8,000 IOPS이면 볼륨만 높여도 목표 달성 불가</text><text x="50" y="500" font-size="23">CPU가 낮아도 스토리지 큐·I/O 지연 때문에 앱은 느릴 수 있음</text></g></svg>