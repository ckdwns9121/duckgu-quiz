<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">할인 약정과 실행 용량은 독립</title><desc id="desc">Compute Savings Plans는 적격 사용의 할인이지 AZ 용량 보장이 아님. AZ A 예약은 AZ B로 자동 이동하지 않음. 예약 미사용 비용과 할인 약정 미사용 비용을 각각 확인</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#4f85b5"/></marker></defs><rect width="1120" height="570" rx="20" fill="#0e1c30"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" fill="#edf5ff"><text x="40" y="58" font-size="30" font-weight="700">할인 약정과 실행 용량은 독립</text><rect x="40" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="58" y="151" font-size="24" font-weight="700">사용 패턴 판단</text><text x="58" y="202" font-size="20">24시간 기본 부하: 보수적 약정</text><text x="58" y="242" font-size="20">짧은 재시도 배치: Spot 검토</text><path d="M365 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="418" y="151" font-size="24" font-weight="700">가격 선택</text><text x="418" y="202" font-size="20">Compute Savings Plans</text><text x="418" y="242" font-size="20">시간당 미사용 약정 이월 없음</text><path d="M725 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="778" y="151" font-size="24" font-weight="700">용량 선택</text><text x="778" y="202" font-size="20">지정 AZ의 Capacity Reservation</text><text x="778" y="242" font-size="20">유형·플랫폼 등 조건 일치 필요</text><text x="50" y="370" font-size="23">Compute Savings Plans는 적격 사용의 할인이지 AZ 용량 보장이 아님</text><text x="50" y="435" font-size="23">AZ A 예약은 AZ B로 자동 이동하지 않음</text><text x="50" y="500" font-size="23">예약 미사용 비용과 할인 약정 미사용 비용을 각각 확인</text></g></svg>