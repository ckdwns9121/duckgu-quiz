<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">SQS 수신 이후의 재처리</title><desc id="desc">보존 기간: 소비 중단보다 길게. 처리 중에는 다른 소비자에게 숨김. 시간 초과면 다시 노출될 수 있음. 업무 효과는 이벤트 ID로 멱등 처리. 실패 항목: 제한 재수신 후 DLQ 격리. Lambda 배치: 실패 ID만 반환 → 성공 항목 재실행 감소</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#365b84"/></marker></defs><rect width="1120" height="510" fill="#f7fafc"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#182d45"><text x="40" y="55" font-size="30" font-weight="700">SQS 수신 이후의 재처리</text><rect x="40" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="55" y="150" font-size="23" font-weight="700">큐에 보관</text><text x="55" y="187" font-size="20">보존 기간: 소비</text><text x="55" y="214" font-size="20">중단보다 길게</text><path d="M275 180 H300" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="325" y="150" font-size="23" font-weight="700">수신·숨김</text><text x="325" y="187" font-size="20">처리 중에는 다른</text><text x="325" y="214" font-size="20">소비자에게 숨김</text><path d="M545 180 H570" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="595" y="150" font-size="23" font-weight="700">업무 처리</text><text x="595" y="187" font-size="20">시간 초과면 다시</text><text x="595" y="214" font-size="20">노출될 수 있음</text><path d="M815 180 H840" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="865" y="150" font-size="23" font-weight="700">성공 후 삭제</text><text x="865" y="187" font-size="20">업무 효과는 이벤트</text><text x="865" y="214" font-size="20">ID로 멱등 처리</text><rect x="40" y="305" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="345" font-size="21">실패 항목: 제한 재수신 후 DLQ 격리</text><rect x="40" y="387" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="427" font-size="21">Lambda 배치: 실패 ID만 반환 → 성공 항목 재실행 감소</text></g></svg>