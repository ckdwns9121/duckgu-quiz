<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc"><title id="title">이벤트 분배·라우팅·워크플로의 독립 비교</title><desc id="desc">SNS는 두 구독 SQS로 분배한다. EventBridge는 내용 규칙으로 SQS, Lambda, Step Functions 중 대상에 전달한다. Step Functions는 별도 상태 머신에서 작업, 재시도, 실패와 콜백 대기를 조정한다. 세 행은 하나의 필수 연결 경로가 아니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#365b84"/></marker></defs><rect width="1120" height="690" fill="#f7fafc"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#182d45"><text x="40" y="48" font-size="29" font-weight="700">이벤트 분배·라우팅·워크플로 비교</text><text x="40" y="82" font-size="21">세 행은 기능별 선택 비교이며 하나의 필수 연결 경로가 아니다.</text><text x="40" y="130" font-size="23" font-weight="700">SNS: 구독자별 분배</text><rect x="40" y="150" width="230" height="62" rx="10" fill="#e6f0fb" stroke="#8aa9c8"/><text x="55" y="189" font-size="21">SNS 토픽</text><rect x="380" y="150" width="280" height="62" rx="10" fill="#e6f0fb" stroke="#8aa9c8"/><text x="395" y="189" font-size="21">이메일 SQS</text><rect x="760" y="150" width="280" height="62" rx="10" fill="#e6f0fb" stroke="#8aa9c8"/><text x="775" y="189" font-size="21">재고 SQS</text><path d="M270 181 H315 V227 H735 V181 H755" fill="none" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><path d="M270 181 H375" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="253" font-size="21">각 구독 큐가 독립적으로 보관·소비</text><text x="40" y="300" font-size="23" font-weight="700">EventBridge: 내용 기반 라우팅</text><rect x="40" y="320" width="230" height="62" rx="10" fill="#e6f0fb" stroke="#8aa9c8"/><text x="55" y="359" font-size="21">이벤트 버스</text><rect x="380" y="320" width="280" height="62" rx="10" fill="#e6f0fb" stroke="#8aa9c8"/><text x="395" y="359" font-size="21">내용 규칙</text><rect x="760" y="320" width="320" height="62" rx="10" fill="#e6f0fb" stroke="#8aa9c8"/><text x="775" y="359" font-size="21">SQS / Lambda / StepFns</text><path d="M275 351 H375" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><path d="M665 351 H755" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="423" font-size="21">AWS·SaaS·자체 이벤트를 조건에 맞는 대상으로</text><text x="40" y="470" font-size="23" font-weight="700">Step Functions: 실행 단계 조정</text><rect x="40" y="490" width="230" height="62" rx="10" fill="#e6f0fb" stroke="#8aa9c8"/><text x="55" y="529" font-size="21">상태 머신</text><rect x="380" y="490" width="280" height="62" rx="10" fill="#e6f0fb" stroke="#8aa9c8"/><text x="395" y="529" font-size="21">Task / Retry / Catch</text><rect x="760" y="490" width="320" height="62" rx="10" fill="#e6f0fb" stroke="#8aa9c8"/><text x="775" y="529" font-size="21">Callback으로 대기·재개</text><path d="M275 521 H375" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><path d="M665 521 H755" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="593" font-size="21">Standard의 긴 대기·callback / Express의 짧은 멱등 처리</text><text x="40" y="660" font-size="20">SNS FIFO도 archive/replay 지원 · EventBridge replay는 시간 범위와 대상 규칙을 선택</text></g></svg>