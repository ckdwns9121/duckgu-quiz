<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">일회용 권한과 TTL의 역할</title><desc id="desc">동시 요청 A / used=false AND expireAt &gt; now 검사 + used=true 갱신 / 조건과 변경을 원자적으로 수행 → 첫 요청 성공. 동시 요청 B / 같은 항목 갱신 시 used=true 확인 → 조건 실패 / 먼저 strong read를 해도 별도 무조건 쓰기는 경쟁 발생. 나중 정리 / expireAt = 숫자형 epoch 초 → TTL 비동기 삭제 / 만료 즉시 승인은 거부 / 물리 삭제까지는 며칠 가능</desc><rect width="1120" height="610" fill="#f4f7fc"/><style>text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:22px;fill:#16324f}.head{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{fill:#4b6076;font-size:21px}</style><text x="40" y="55" class="head">일회용 권한과 TTL의 역할</text><rect x="30" y="85" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="85" width="12" height="145" rx="5" fill="#2374ab"/><text x="60" y="121" class="label">동시 요청 A</text><text x="60" y="163">used=false AND expireAt &gt; now 검사 + used=true 갱신</text><text x="60" y="201" class="note">조건과 변경을 원자적으로 수행 → 첫 요청 성공</text><rect x="30" y="250" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="250" width="12" height="145" rx="5" fill="#17876d"/><text x="60" y="286" class="label">동시 요청 B</text><text x="60" y="328">같은 항목 갱신 시 used=true 확인 → 조건 실패</text><text x="60" y="366" class="note">먼저 strong read를 해도 별도 무조건 쓰기는 경쟁 발생</text><rect x="30" y="415" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="415" width="12" height="145" rx="5" fill="#9c6332"/><text x="60" y="451" class="label">나중 정리</text><text x="60" y="493">expireAt = 숫자형 epoch 초 → TTL 비동기 삭제</text><text x="60" y="531" class="note">만료 즉시 승인은 거부 / 물리 삭제까지는 며칠 가능</text></svg>