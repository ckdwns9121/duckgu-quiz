<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">캐시 집중과 변경 누락</title><desc id="desc">서로 다른 키 / 키 A·B·C의 만료 시각 → 허용 범위 안 TTL jitter / 여러 키가 같은 순간 DB로 몰리는 현상을 분산. 같은 인기 키 / 여러 앱의 동시 miss → 공유 lease → 한 요청이 채움 / 프로세스 내부 lock만으로 모든 앱의 중복 채움을 못 막음. 변경 뒤 앱 종료 / DB commit → 캐시 무효화 누락 → TTL 뒤 재조회 / TTL + 읽기·채움 시간이 허용 stale 범위 안인지 확인</desc><rect width="1120" height="610" fill="#f4f7fc"/><style>text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:22px;fill:#16324f}.head{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{fill:#4b6076;font-size:21px}</style><text x="40" y="55" class="head">캐시 집중과 변경 누락</text><rect x="30" y="85" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="85" width="12" height="145" rx="5" fill="#2374ab"/><text x="60" y="121" class="label">서로 다른 키</text><text x="60" y="163">키 A·B·C의 만료 시각 → 허용 범위 안 TTL jitter</text><text x="60" y="201" class="note">여러 키가 같은 순간 DB로 몰리는 현상을 분산</text><rect x="30" y="250" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="250" width="12" height="145" rx="5" fill="#17876d"/><text x="60" y="286" class="label">같은 인기 키</text><text x="60" y="328">여러 앱의 동시 miss → 공유 lease → 한 요청이 채움</text><text x="60" y="366" class="note">프로세스 내부 lock만으로 모든 앱의 중복 채움을 못 막음</text><rect x="30" y="415" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="415" width="12" height="145" rx="5" fill="#9c6332"/><text x="60" y="451" class="label">변경 뒤 앱 종료</text><text x="60" y="493">DB commit → 캐시 무효화 누락 → TTL 뒤 재조회</text><text x="60" y="531" class="note">TTL + 읽기·채움 시간이 허용 stale 범위 안인지 확인</text></svg>