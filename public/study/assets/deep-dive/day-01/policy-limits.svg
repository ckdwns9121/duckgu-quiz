<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">권한 평가: 허용·상한·거부를 구별</title><desc id="desc">권한 정책 Allow만 있어도 경계가 읽기를 허용하지 않으면 실패. ABAC: 주체 project = 자원 project 조건 + 태그 수정 통제. 경계 제거·교체·정책 편집을 열어 두면 생성 권한으로 우회 가능</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#4f85b5"/></marker></defs><rect width="1120" height="570" rx="20" fill="#0e1c30"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" fill="#edf5ff"><text x="40" y="58" font-size="30" font-weight="700">권한 평가: 허용·상한·거부를 구별</text><rect x="40" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="58" y="151" font-size="24" font-weight="700">업무 권한 정책</text><text x="58" y="202" font-size="20">이 역할이 할 수 있는 작업</text><text x="58" y="242" font-size="20">예: reports/* GetObject</text><path d="M365 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="418" y="151" font-size="24" font-weight="700">Boundary · SCP</text><text x="418" y="202" font-size="20">권한을 부여하지 않는 상한</text><text x="418" y="242" font-size="20">예: 경계가 GetObject를 제외</text><path d="M725 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="778" y="151" font-size="24" font-weight="700">최종 요청 평가</text><text x="778" y="202" font-size="20">적용되는 명시적 Deny 우선</text><text x="778" y="242" font-size="20">세션·리소스 정책 예외도 확인</text><text x="50" y="370" font-size="23">권한 정책 Allow만 있어도 경계가 읽기를 허용하지 않으면 실패</text><text x="50" y="435" font-size="23">ABAC: 주체 project = 자원 project 조건 + 태그 수정 통제</text><text x="50" y="500" font-size="23">경계 제거·교체·정책 편집을 열어 두면 생성 권한으로 우회 가능</text></g></svg>