<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">AssumeRole: 진입과 사용은 별도 요청</title><desc id="desc">실패 1: 신뢰 없음 → 세션을 발급하지 않음. 실패 2: 삭제 요청 → 세션은 있지만 작업 권한 없음. 원래 Analyst 권한은 새 역할 권한에 합산되지 않음</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#4f85b5"/></marker></defs><rect width="1120" height="570" rx="20" fill="#0e1c30"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" fill="#edf5ff"><text x="40" y="58" font-size="30" font-weight="700">AssumeRole: 진입과 사용은 별도 요청</text><rect x="40" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="58" y="151" font-size="24" font-weight="700">계정 A · Analyst</text><text x="58" y="202" font-size="20">기존 자격 증명으로 STS 서명</text><text x="58" y="242" font-size="20">권한: sts:AssumeRole 허용</text><path d="M365 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="418" y="151" font-size="24" font-weight="700">STS · 역할 전환 판단</text><text x="418" y="202" font-size="20">호출자 허용 + 대상 역할 신뢰</text><text x="418" y="242" font-size="20">임시 키 3종 + 만료 시각 발급</text><path d="M725 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="778" y="151" font-size="24" font-weight="700">계정 B · ReportReader</text><text x="778" y="202" font-size="20">새 역할 세션으로 S3 직접 요청</text><text x="778" y="242" font-size="20">reports/* 읽기만 허용</text><text x="50" y="370" font-size="23">실패 1: 신뢰 없음 → 세션을 발급하지 않음</text><text x="50" y="435" font-size="23">실패 2: 삭제 요청 → 세션은 있지만 작업 권한 없음</text><text x="50" y="500" font-size="23">원래 Analyst 권한은 새 역할 권한에 합산되지 않음</text></g></svg>