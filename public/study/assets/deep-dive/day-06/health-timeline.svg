<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><ns0:title id="title">신규 인스턴스의 세 가지 판단</ns0:title><ns0:desc id="desc">등록 직후 · 앱 초기화 중. ALB /ready 실패 → 정상 요청 대상 제외. 기존 정상 대상이 서비스 용량을 유지. Health grace · ASG 교체 판단. 초기화로 인한 성급한 unhealthy 교체 유예. ALB의 상태 확인은 계속 수행. Instance warmup · 확장 판단. 초기 사용량이 집계 지표를 왜곡하지 않게. 준비 상태 검사와 다른 목적. 준비 성공 이후. ALB 정상 대상 편입 / grace 종료 / warmup 종료. 각 신호의 시작·종료 시각을 별도로 설정</ns0:desc><ns0:style>text{font-family:Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif;fill:#153047;font-size:23px}.head{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.muted{fill:#35576a}</ns0:style><ns0:rect width="1120" height="700" fill="#f5f8fb" /><ns0:text x="40" y="60" class="head">신규 인스턴스의 세 가지 판단</ns0:text><ns0:rect x="40" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="148" class="label">등록 직후 · 앱 초기화 중</ns0:text><ns0:text x="62" y="206" class="muted">ALB /ready 실패 → 정상 요청 대상 제외</ns0:text><ns0:text x="62" y="264" class="muted">기존 정상 대상이 서비스 용량을 유지</ns0:text><ns0:rect x="590" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="148" class="label">Health grace · ASG 교체 판단</ns0:text><ns0:text x="612" y="206" class="muted">초기화 중 unhealthy 교체 유예</ns0:text><ns0:text x="612" y="264" class="muted">ALB의 상태 확인은 계속 수행</ns0:text><ns0:rect x="40" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="428" class="label">Instance warmup · 확장 판단</ns0:text><ns0:text x="62" y="486" class="muted">초기 사용량이 집계 지표를 왜곡하지 않게</ns0:text><ns0:text x="62" y="544" class="muted">준비 상태 검사와 다른 목적</ns0:text><ns0:rect x="590" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="428" class="label">준비 성공 이후</ns0:text><ns0:text x="612" y="486" class="muted">준비 확인 후 ALB 정상 대상 편입</ns0:text><ns0:text x="612" y="544" class="muted">각 신호의 시작·종료 시각을 별도로 설정</ns0:text><ns0:text x="40" y="674" class="muted">요청 경로·반환 경로·판단 신호를 각각 읽는다</ns0:text></ns0:svg>