<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><ns0:title id="title">ALB 규칙과 가중치의 서로 다른 판단</ns0:title><ns0:desc id="desc">우선순위 10 · API 조건. Host 일치 AND path /api 또는 /api/*. /apiv2는 이 규칙에 일치하지 않음. 기본 규칙 · 나머지 요청. 앞선 규칙 미일치 → 카탈로그. path 조건 자체는 경로 재작성 아님. Forward 가중치 · canary. 기존 95 / 신규 5 → 확률적 요청 분할. 매 20건마다 정확히 1건 보장은 아님. 신규 그룹 전체 비정상. 기존 그룹으로 자동 재분배하지 않음. 배포 제어가 신규 가중치 0 등으로 변경</ns0:desc><ns0:style>text{font-family:Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif;fill:#153047;font-size:23px}.head{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.muted{fill:#35576a}</ns0:style><ns0:rect width="1120" height="700" fill="#f5f8fb" /><ns0:text x="40" y="60" class="head">ALB 규칙과 가중치의 서로 다른 판단</ns0:text><ns0:rect x="40" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="148" class="label">우선순위 10 · API 조건</ns0:text><ns0:text x="62" y="206" class="muted">Host 일치 AND path /api 또는 /api/*</ns0:text><ns0:text x="62" y="264" class="muted">/apiv2는 이 규칙에 일치하지 않음</ns0:text><ns0:rect x="590" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="148" class="label">기본 규칙 · 나머지 요청</ns0:text><ns0:text x="612" y="206" class="muted">앞선 규칙 미일치 → 카탈로그</ns0:text><ns0:text x="612" y="264" class="muted">path 조건 자체는 경로 재작성 아님</ns0:text><ns0:rect x="40" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="428" class="label">Forward 가중치 · canary</ns0:text><ns0:text x="62" y="486" class="muted">기존 95 / 신규 5 → 확률적 요청 분할</ns0:text><ns0:text x="62" y="544" class="muted">매 20건마다 정확히 1건 보장은 아님</ns0:text><ns0:rect x="590" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="428" class="label">신규 그룹 전체 비정상</ns0:text><ns0:text x="612" y="486" class="muted">기존 그룹으로 자동 재분배하지 않음</ns0:text><ns0:text x="612" y="544" class="muted">배포 제어가 신규 가중치 0 등으로 변경</ns0:text><ns0:text x="40" y="674" class="muted">요청 경로·반환 경로·판단 신호를 각각 읽는다</ns0:text></ns0:svg>