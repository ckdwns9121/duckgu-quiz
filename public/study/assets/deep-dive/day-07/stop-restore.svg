<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">개발 DB 중지와 복원</title><desc id="desc">지원 DB 중지 / 운영 DB → 중지 → 시작 → 준비 상태 확인 → 앱 접속 / 데이터·DNS endpoint 유지 / 최대 7일 뒤 자동 시작. 스냅샷 복원 / 보관본 → 새 DB 생성 → 권한·데이터 확인 → 연결 전환 / 새 endpoint / 복원 시간과 데이터 초기화 고려. 비용 경계 / 인스턴스 시간 + 저장소 + IOPS + 백업 + 할인 약정 / 중지는 저장·백업 비용을 없애지 않음 / 상시 앱 중지 불가</desc><rect width="1120" height="610" fill="#f4f7fc"/><style>text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:22px;fill:#16324f}.head{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{fill:#4b6076;font-size:21px}</style><text x="40" y="55" class="head">개발 DB 중지와 복원</text><rect x="30" y="85" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="85" width="12" height="145" rx="5" fill="#2374ab"/><text x="60" y="121" class="label">지원 DB 중지</text><text x="60" y="163">운영 DB → 중지 → 시작 → 준비 상태 확인 → 앱 접속</text><text x="60" y="201" class="note">데이터·DNS endpoint 유지 / 최대 7일 뒤 자동 시작</text><rect x="30" y="250" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="250" width="12" height="145" rx="5" fill="#17876d"/><text x="60" y="286" class="label">스냅샷 복원</text><text x="60" y="328">보관본 → 새 DB 생성 → 권한·데이터 확인 → 연결 전환</text><text x="60" y="366" class="note">새 endpoint / 복원 시간과 데이터 초기화 고려</text><rect x="30" y="415" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="415" width="12" height="145" rx="5" fill="#9c6332"/><text x="60" y="451" class="label">비용 경계</text><text x="60" y="493">인스턴스 시간 + 저장소 + IOPS + 백업 + 할인 약정</text><text x="60" y="531" class="note">중지는 저장·백업 비용을 없애지 않음 / 상시 앱 중지 불가</text></svg>