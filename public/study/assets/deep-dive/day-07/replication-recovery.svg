<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">복제·장애 조치·과거 복구</title><desc id="desc">AZ 장애 / primary 연결 단절 → standby 승격 → DNS 갱신 → 앱 재연결 / Multi-AZ DB instance standby는 일반 조회 대상이 아님. 읽기 확장 / writer 커밋 → 비동기 로그 → reader 적용 → 통계 조회 / 복제 지연·오류 관측 / 최신 주문 확인은 writer. 오삭제 복구 / 스냅샷 + 로그 → 삭제 직전 새 DB → 검증·병합·전환 / 삭제도 replica에 전파됨 / 복제는 과거 백업과 다름</desc><rect width="1120" height="610" fill="#f4f7fc"/><style>text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:22px;fill:#16324f}.head{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{fill:#4b6076;font-size:21px}</style><text x="40" y="55" class="head">복제·장애 조치·과거 복구</text><rect x="30" y="85" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="85" width="12" height="145" rx="5" fill="#2374ab"/><text x="60" y="121" class="label">AZ 장애</text><text x="60" y="163">primary 연결 단절 → standby 승격 → DNS 갱신 → 앱 재연결</text><text x="60" y="201" class="note">Multi-AZ DB instance standby는 일반 조회 대상이 아님</text><rect x="30" y="250" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="250" width="12" height="145" rx="5" fill="#17876d"/><text x="60" y="286" class="label">읽기 확장</text><text x="60" y="328">writer 커밋 → 비동기 로그 → reader 적용 → 통계 조회</text><text x="60" y="366" class="note">복제 지연·오류 관측 / 최신 주문 확인은 writer</text><rect x="30" y="415" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="415" width="12" height="145" rx="5" fill="#9c6332"/><text x="60" y="451" class="label">오삭제 복구</text><text x="60" y="493">스냅샷 + 로그 → 삭제 직전 새 DB → 검증·병합·전환</text><text x="60" y="531" class="note">삭제도 replica에 전파됨 / 복제는 과거 백업과 다름</text></svg>