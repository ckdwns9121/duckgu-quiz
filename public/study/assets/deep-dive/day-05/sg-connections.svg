<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><ns0:title id="title">SG 참조는 규칙 복사가 아니다</ns0:title><ns0:desc id="desc">연결 1 · ALB → 앱. 앱 인바운드: 출발지 sg-alb, TCP 8080. ALB의 앱행 아웃바운드도 필요. 연결 2 · 앱 → DB. DB 인바운드: 출발지 sg-app, TCP 5432. 앱의 DB행 아웃바운드도 필요. 허용된 연결의 응답. SG가 상태를 추적하므로 응답 허용. DB가 새로 시작한 앱행 연결과 다름. 서버 교체 후. 새 ENI에 sg-app 연결. DB에 앱의 새 IP를 수동 추가하지 않음</ns0:desc><ns0:style>text{font-family:Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif;fill:#153047;font-size:23px}.head{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.muted{fill:#35576a}</ns0:style><ns0:rect width="1120" height="700" fill="#f5f8fb" /><ns0:text x="40" y="60" class="head">SG 참조는 규칙 복사가 아니다</ns0:text><ns0:rect x="40" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="148" class="label">연결 1 · ALB → 앱</ns0:text><ns0:text x="62" y="206" class="muted">앱 인바운드: 출발지 sg-alb, TCP 8080</ns0:text><ns0:text x="62" y="264" class="muted">ALB의 앱행 아웃바운드도 필요</ns0:text><ns0:rect x="590" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="148" class="label">연결 2 · 앱 → DB</ns0:text><ns0:text x="612" y="206" class="muted">DB 인바운드: 출발지 sg-app, TCP 5432</ns0:text><ns0:text x="612" y="264" class="muted">앱의 DB행 아웃바운드도 필요</ns0:text><ns0:rect x="40" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="428" class="label">허용된 연결의 응답</ns0:text><ns0:text x="62" y="486" class="muted">SG가 상태를 추적하므로 응답 허용</ns0:text><ns0:text x="62" y="544" class="muted">DB가 새로 시작한 앱행 연결과 다름</ns0:text><ns0:rect x="590" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="428" class="label">서버 교체 후</ns0:text><ns0:text x="612" y="486" class="muted">새 ENI에 sg-app 연결</ns0:text><ns0:text x="612" y="544" class="muted">DB에 앱의 새 IP를 수동 추가하지 않음</ns0:text><ns0:text x="40" y="674" class="muted">요청 경로·반환 경로·판단 신호를 각각 읽는다</ns0:text></ns0:svg>