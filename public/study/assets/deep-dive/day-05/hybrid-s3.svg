<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><ns0:title id="title">S3의 DNS 질의와 데이터 경로</ns0:title><ns0:desc id="desc">VPC 앱 · DNS 질의. VPC Resolver → S3 서비스 주소. Gateway Endpoint 경로로 데이터 전달. 온프레미스 · DNS 질의. 사내 DNS → Resolver inbound:53. S3 Interface ENI의 사설 IP 응답. 온프레미스 · HTTPS 데이터. VPN/DX → Interface ENI:443 → S3. 왕복 경로·SG·IAM·버킷 정책 필요. inbound 전용 private DNS. S3 Gateway Endpoint를 유지해야 함. VPC 대량 데이터의 Interface 비용 절감</ns0:desc><ns0:style>text{font-family:Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif;fill:#153047;font-size:23px}.head{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.muted{fill:#35576a}</ns0:style><ns0:rect width="1120" height="700" fill="#f5f8fb" /><ns0:text x="40" y="60" class="head">S3의 DNS 질의와 데이터 경로</ns0:text><ns0:rect x="40" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="148" class="label">VPC 앱 · DNS 질의</ns0:text><ns0:text x="62" y="206" class="muted">VPC Resolver → S3 서비스 주소</ns0:text><ns0:text x="62" y="264" class="muted">Gateway Endpoint 경로로 데이터 전달</ns0:text><ns0:rect x="590" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="148" class="label">온프레미스 · DNS 질의</ns0:text><ns0:text x="612" y="206" class="muted">사내 DNS → Resolver inbound:53</ns0:text><ns0:text x="612" y="264" class="muted">S3 Interface ENI의 사설 IP 응답</ns0:text><ns0:rect x="40" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="428" class="label">온프레미스 · HTTPS 데이터</ns0:text><ns0:text x="62" y="486" class="muted">VPN/DX → Interface ENI:443 → S3</ns0:text><ns0:text x="62" y="544" class="muted">왕복 경로·SG·IAM·버킷 정책 필요</ns0:text><ns0:rect x="590" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="428" class="label">inbound 전용 private DNS</ns0:text><ns0:text x="612" y="486" class="muted">S3 Gateway Endpoint를 유지해야 함</ns0:text><ns0:text x="612" y="544" class="muted">VPC 대량 데이터의 Interface 비용 절감</ns0:text><ns0:text x="40" y="674" class="muted">요청 경로·반환 경로·판단 신호를 각각 읽는다</ns0:text></ns0:svg>