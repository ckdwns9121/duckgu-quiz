<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc"><title id="title">Athena의 세 비용·성능 경계</title><desc id="desc">SQL 파티션 조건에서 Catalog index로 등록된 파티션을 검색하거나 projection 규칙으로 경로를 계산하는 두 대안을 분기한다. 파일 스캔과 결과 재사용은 별도 단계이다.</desc><rect width="1120" height="550" fill="#f4f7fc"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="22" fill="#17253b"><text x="36" y="48" font-size="30" font-weight="700">Athena의 세 비용·성능 경계</text><rect x="30" y="85" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="115" font-weight="700">① 읽을 위치 찾기</text><text x="50" y="158" fill="#165d9a">SQL 파티션 조건</text><path d="M235 151 H285 V137 H350 M285 151 V176 H350" fill="none" stroke="#527399" stroke-width="2"/><text x="310" y="160" font-size="20" fill="#17253b">OR</text><text x="365" y="144" fill="#165d9a">Catalog index: 등록된 실제 파티션 검색</text><text x="365" y="183" fill="#165d9a">projection: 규칙으로 S3 경로 계산</text><rect x="30" y="215" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="245" font-weight="700">② 실제 파일 읽기</text><text x="50.0" y="280" fill="#165d9a">선정 S3 경로</text><text x="349.3333333333333" y="280">→</text><text x="383.3333333333333" y="280" fill="#165d9a">Parquet 필요한 열</text><text x="682.6666666666666" y="280">→</text><text x="716.6666666666666" y="280" fill="#165d9a">압축·블록 필터</text><text x="48" y="313" font-size="20">gzip CSV는 열 저장이 아님. 희소 경로 projection은 빈 탐색을 늘릴 수 있음</text><rect x="30" y="345" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="375" font-weight="700">③ 결과와 접근</text><text x="50.0" y="410" fill="#165d9a">집계 결과 S3</text><text x="349.3333333333333" y="410">→</text><text x="383.3333333333333" y="410" fill="#165d9a">권한·최대 나이</text><text x="682.6666666666666" y="410">→</text><text x="716.6666666666666" y="410" fill="#165d9a">동일 쿼리 재사용</text><text x="48" y="443" font-size="20">재사용은 신선도 허용 때만. 결과 버킷 권한은 원본 열 권한과 별도</text><text x="36" y="525" font-size="20">개별 스캔 제한: 실행 중 취소 / 누적 알림·Budgets: 사용량 감시</text></g></svg>