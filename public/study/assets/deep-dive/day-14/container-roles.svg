<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc"><title id="title">배포·시작·앱 호출의 권한을 분리한다</title><desc id="desc">운영자, 작업 시작 계층, 앱 코드가 사용하는 역할을 구별한다.</desc><rect width="1120" height="550" fill="#f4f7fc"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="22" fill="#17253b"><text x="36" y="48" font-size="30" font-weight="700">배포·시작·앱 호출의 권한을 분리한다</text><rect x="30" y="85" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="115" font-weight="700">① 운영자 IAM</text><text x="50.0" y="150" fill="#165d9a">배포 API 호출</text><text x="349.3333333333333" y="150">→</text><text x="383.3333333333333" y="150" fill="#165d9a">iam:PassRole</text><text x="682.6666666666666" y="150">→</text><text x="716.6666666666666" y="150" fill="#165d9a">ECS 서비스 설정</text><text x="48" y="183" font-size="20">운영자 권한이 컨테이너 앱에 자동 전달되지는 않음</text><rect x="30" y="215" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="245" font-weight="700">② Task execution role</text><text x="50.0" y="280" fill="#165d9a">Fargate 시작</text><text x="349.3333333333333" y="280">→</text><text x="383.3333333333333" y="280" fill="#165d9a">ECR 이미지 pull</text><text x="682.6666666666666" y="280">→</text><text x="716.6666666666666" y="280" fill="#165d9a">로그·비밀값 주입</text><text x="48" y="313" font-size="20">네트워크 ECR·S3·Logs 경로도 필요. Fargate에는 고객 EC2 profile이 없음</text><rect x="30" y="345" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="375" font-weight="700">③ Task role</text><text x="50.0" y="410" fill="#165d9a">실행 중 앱 SDK</text><text x="349.3333333333333" y="410">→</text><text x="383.3333333333333" y="410" fill="#165d9a">임시 자격 증명</text><text x="682.6666666666666" y="410">→</text><text x="716.6666666666666" y="410" fill="#165d9a">S3·DynamoDB 호출</text><text x="48" y="443" font-size="20">앱 권한을 execution role에만 주면 SDK의 데이터 접근은 해결되지 않음</text><text x="36" y="525" font-size="20">ECS on EC2의 컨테이너 인스턴스 역할은 호스트·에이전트 용도로 별도 확인</text></g></svg>