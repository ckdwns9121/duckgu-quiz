<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">두 DB 사용자의 교대 회전</title><desc id="desc">AWSCURRENT → app_a. 관리자 secret은 회전 함수만. AWSPENDING 자격 증명 검증. AWSCURRENT → app_b. 전환 전 조회: 기존 app_a는 계속 유효 / 다음 회전은 app_a 갱신. 앱: username + password 재조회·캐시 만료·연결 풀 갱신</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#365b84"/></marker></defs><rect width="1120" height="510" fill="#f7fafc"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#182d45"><text x="40" y="55" font-size="30" font-weight="700">두 DB 사용자의 교대 회전</text><rect x="40" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="55" y="150" font-size="23" font-weight="700">앱은 app_a</text><text x="55" y="187" font-size="20">AWSCURRENT → app_a</text><path d="M275 180 H300" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="325" y="150" font-size="23" font-weight="700">app_b 갱신</text><text x="325" y="187" font-size="20">관리자 secret은 회전</text><text x="325" y="214" font-size="20">함수만</text><path d="M545 180 H570" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="595" y="150" font-size="23" font-weight="700">새 연결 시험</text><text x="595" y="187" font-size="20">AWSPENDING 자격 증명</text><text x="595" y="214" font-size="20">검증</text><path d="M815 180 H840" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="865" y="150" font-size="23" font-weight="700">현재 라벨 이동</text><text x="865" y="187" font-size="20">AWSCURRENT → app_b</text><rect x="40" y="305" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="345" font-size="21">전환 전 조회: 기존 app_a는 계속 유효 / 다음 회전은 app_a 갱신</text><rect x="40" y="387" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="427" font-size="21">앱: username + password 재조회·캐시 만료·연결 풀 갱신</text></g></svg>