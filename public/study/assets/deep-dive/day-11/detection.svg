<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">중앙 탐지와 민감정보 문맥</title><desc id="desc">GuardDuty / Inspector 별도. 서울·도쿄 기존·신규 계정. EC2 / 보호 계획 활성화. 미검사 사유도 추적. Macie: 정규식 일치 + keyword 거리 → 후보 → allow list 제외. finding은 발견 결과 / 읽지 못한 파일을 안전하다고 판정하지 않음</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#365b84"/></marker></defs><rect width="1120" height="510" fill="#f7fafc"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#182d45"><text x="40" y="55" font-size="30" font-weight="700">중앙 탐지와 민감정보 문맥</text><rect x="40" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="55" y="150" font-size="23" font-weight="700">위임 관리자</text><text x="55" y="187" font-size="20">GuardDuty /</text><text x="55" y="214" font-size="20">Inspector 별도</text><path d="M275 180 H300" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="325" y="150" font-size="23" font-weight="700">계정 × 리전</text><text x="325" y="187" font-size="20">서울·도쿄</text><text x="325" y="214" font-size="20">기존·신규 계정</text><path d="M545 180 H570" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="595" y="150" font-size="23" font-weight="700">스캔 유형</text><text x="595" y="187" font-size="20">EC2 / 보호 계획</text><text x="595" y="214" font-size="20">활성화</text><path d="M815 180 H840" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="865" y="150" font-size="23" font-weight="700">coverage 확인</text><text x="865" y="187" font-size="20">미검사 사유도 추적</text><rect x="40" y="305" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="345" font-size="21">Macie: 정규식 일치 + keyword 거리 → 후보 → allow list 제외</text><rect x="40" y="387" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="427" font-size="21">finding은 발견 결과 / 읽지 못한 파일을 안전하다고 판정하지 않음</text></g></svg>