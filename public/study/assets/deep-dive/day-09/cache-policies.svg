<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">캐시 키와 원본 전달</title><desc id="desc">언어별 매뉴얼 / /manual + lang=ko → 같은 키의 한국어 객체 재사용 / lang은 cache policy / tracking은 미스 때 원본 추가 전달. 개인 계정 / /account → 캐시 비활성화 → 인증 정보와 함께 원본 호출 / 경로만 키로 공유하면 다른 회원 응답이 노출될 수 있음. TTL 제약 / 원본 private·no-store + 양수 최소 TTL → 캐시 가능 / 개인화 경로는 최소·기본·최대 TTL 0 정책 검토</desc><rect width="1120" height="610" fill="#f4f7fc"/><style>text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:22px;fill:#16324f}.head{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{fill:#4b6076;font-size:21px}</style><text x="40" y="55" class="head">캐시 키와 원본 전달</text><rect x="30" y="85" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="85" width="12" height="145" rx="5" fill="#2374ab"/><text x="60" y="121" class="label">언어별 매뉴얼</text><text x="60" y="163">/manual + lang=ko → 같은 키의 한국어 객체 재사용</text><text x="60" y="201" class="note">lang은 cache policy / tracking은 미스 때 원본 추가 전달</text><rect x="30" y="250" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="250" width="12" height="145" rx="5" fill="#17876d"/><text x="60" y="286" class="label">개인 계정</text><text x="60" y="328">/account → 캐시 비활성화 → 인증 정보와 함께 원본 호출</text><text x="60" y="366" class="note">경로만 키로 공유하면 다른 회원 응답이 노출될 수 있음</text><rect x="30" y="415" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="415" width="12" height="145" rx="5" fill="#9c6332"/><text x="60" y="451" class="label">TTL 제약</text><text x="60" y="493">원본 private·no-store + 양수 최소 TTL → 캐시 가능</text><text x="60" y="531" class="note">개인화 경로는 최소·기본·최대 TTL 0 정책 검토</text></svg>