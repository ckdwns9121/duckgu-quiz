<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">DNS 전환과 기존 연결</title><desc id="desc">전환 준비 / 이전 TTL이 만료될 여유 → 미리 TTL 축소 → 대기 검증 / TTL 1시간의 기존 응답은 지금 바꿔도 소급 단축 안 됨. 새 DNS 조회 / 상태 실패 감지 → Route 53 보조 응답 → 캐시 갱신 / 이미 캐시한 클라이언트에는 기존 주소가 잠시 남음. 열린 연결 / heartbeat 무응답 감지 → 연결 종료 → DNS 재조회·연결 / DNS 변경만으로 기존 WebSocket이 새 리전으로 이동 안 됨</desc><rect width="1120" height="610" fill="#f4f7fc"/><style>text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:22px;fill:#16324f}.head{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{fill:#4b6076;font-size:21px}</style><text x="40" y="55" class="head">DNS 전환과 기존 연결</text><rect x="30" y="85" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="85" width="12" height="145" rx="5" fill="#2374ab"/><text x="60" y="121" class="label">전환 준비</text><text x="60" y="163">이전 TTL이 만료될 여유 → 미리 TTL 축소 → 대기 검증</text><text x="60" y="201" class="note">TTL 1시간의 기존 응답은 지금 바꿔도 소급 단축 안 됨</text><rect x="30" y="250" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="250" width="12" height="145" rx="5" fill="#17876d"/><text x="60" y="286" class="label">새 DNS 조회</text><text x="60" y="328">상태 실패 감지 → Route 53 보조 응답 → 캐시 갱신</text><text x="60" y="366" class="note">이미 캐시한 클라이언트에는 기존 주소가 잠시 남음</text><rect x="30" y="415" width="1060" height="145" rx="14" fill="white" stroke="#aec4dd"/><rect x="30" y="415" width="12" height="145" rx="5" fill="#9c6332"/><text x="60" y="451" class="label">열린 연결</text><text x="60" y="493">heartbeat 무응답 감지 → 연결 종료 → DNS 재조회·연결</text><text x="60" y="531" class="note">DNS 변경만으로 기존 WebSocket이 새 리전으로 이동 안 됨</text></svg>