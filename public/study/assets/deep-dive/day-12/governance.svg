<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">상한과 접근 배정·계정 등록</title><desc id="desc">상위 Deny는 계속 상속. 하위 Allow로 상쇄 불가. Identity Center 권한 세트. 모든 관련 경계 평가. 시드니 예외: 정확한 운영 계정 DRDeploy 역할에만 추가 허용. Control Tower: 자동 등록이 꺼져 있으면 기존 계정을 별도 enroll</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#365b84"/></marker></defs><rect width="1120" height="510" fill="#f7fafc"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#182d45"><text x="40" y="55" font-size="30" font-weight="700">상한과 접근 배정·계정 등록</text><rect x="40" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="55" y="150" font-size="23" font-weight="700">조직 루트</text><text x="55" y="187" font-size="20">상위 Deny는 계속</text><text x="55" y="214" font-size="20">상속</text><path d="M275 180 H300" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="325" y="150" font-size="23" font-weight="700">OU·계정 SCP</text><text x="325" y="187" font-size="20">하위 Allow로 상쇄</text><text x="325" y="214" font-size="20">불가</text><path d="M545 180 H570" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="595" y="150" font-size="23" font-weight="700">IAM 역할 허용</text><text x="595" y="187" font-size="20">Identity Center 권한</text><text x="595" y="214" font-size="20">세트</text><path d="M815 180 H840" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="865" y="150" font-size="23" font-weight="700">실제 요청</text><text x="865" y="187" font-size="20">모든 관련 경계 평가</text><rect x="40" y="305" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="345" font-size="21">시드니 예외: 정확한 운영 계정 DRDeploy 역할에만 추가 허용</text><rect x="40" y="387" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="427" font-size="21">Control Tower: 자동 등록이 꺼져 있으면 기존 계정을 별도 enroll</text></g></svg>