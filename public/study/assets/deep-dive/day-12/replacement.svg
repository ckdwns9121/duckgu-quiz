<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">교체와 삭제의 다른 대상</title><desc id="desc">UpdateReplacePolicy: Retain. 데이터 이관·검증은 별도. 이전 DB는 스택 관리 밖. DeletionPolicy: Snapshot. 호환 배포: 새 컬럼 추가 → backfill → 구·신 앱 공존 → 검증 → 구 컬럼 제거. Retain은 실행 상태 보존 / Snapshot은 스냅샷 후 해당 DB 삭제</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#365b84"/></marker></defs><rect width="1120" height="510" fill="#f7fafc"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#182d45"><text x="40" y="55" font-size="30" font-weight="700">교체와 삭제의 다른 대상</text><rect x="40" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="55" y="150" font-size="23" font-weight="700">기존 물리 DB</text><text x="55" y="187" font-size="20"></text><text x="55" y="214" font-size="20">UpdateReplacePolicy:</text><text x="55" y="241" font-size="20">Retain</text><path d="M275 180 H300" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="325" y="150" font-size="23" font-weight="700">새 물리 DB</text><text x="325" y="187" font-size="20">데이터 이관·검증은</text><text x="325" y="214" font-size="20">별도</text><path d="M545 180 H570" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="595" y="150" font-size="23" font-weight="700">참조 전환</text><text x="595" y="187" font-size="20">이전 DB는 스택 관리</text><text x="595" y="214" font-size="20">밖</text><path d="M815 180 H840" stroke="#365b84" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="110" width="230" height="145" rx="12" fill="#e6f0fb" stroke="#8aa9c8"/><text x="865" y="150" font-size="23" font-weight="700">나중 스택 삭제</text><text x="865" y="187" font-size="20">DeletionPolicy:</text><text x="865" y="214" font-size="20">Snapshot</text><rect x="40" y="305" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="345" font-size="21">호환 배포: 새 컬럼 추가 → backfill → 구·신 앱 공존 → 검증 → 구 컬럼 제거</text><rect x="40" y="387" width="1040" height="65" rx="10" fill="#fff" stroke="#bfccd9"/><text x="60" y="427" font-size="21">Retain은 실행 상태 보존 / Snapshot은 스냅샷 후 해당 DB 삭제</text></g></svg>