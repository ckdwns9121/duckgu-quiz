<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><ns0:title id="title">NAT의 AZ 범위와 확장 지연</ns0:title><ns0:desc id="desc">Zonal · AZ A. 앱 A → NAT A → IGW. 다른 AZ의 NAT에 의존하지 않음. Zonal · AZ B. 앱 B → NAT B → IGW. NAT별 시간·처리 비용을 합산. Regional · 기존 AZ. 여러 서브넷 → 같은 NAT ID. NAT 호스팅 공개 서브넷 지정 불필요. Regional · 신규 AZ 확장 전. 최대 60분 동안 기존 AZ에서 처리 가능. 시작부터 동일 AZ가 필요하면 사전 준비</ns0:desc><ns0:style>text{font-family:Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif;fill:#153047;font-size:23px}.head{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.muted{fill:#35576a}</ns0:style><ns0:rect width="1120" height="700" fill="#f5f8fb" /><ns0:text x="40" y="60" class="head">NAT의 AZ 범위와 확장 지연</ns0:text><ns0:rect x="40" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="148" class="label">Zonal · AZ A</ns0:text><ns0:text x="62" y="206" class="muted">앱 A → NAT A → IGW</ns0:text><ns0:text x="62" y="264" class="muted">다른 AZ의 NAT에 의존하지 않음</ns0:text><ns0:rect x="590" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="148" class="label">Zonal · AZ B</ns0:text><ns0:text x="612" y="206" class="muted">앱 B → NAT B → IGW</ns0:text><ns0:text x="612" y="264" class="muted">NAT별 시간·처리 비용을 합산</ns0:text><ns0:rect x="40" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="428" class="label">Regional · 기존 AZ</ns0:text><ns0:text x="62" y="486" class="muted">여러 서브넷 → 같은 NAT ID</ns0:text><ns0:text x="62" y="544" class="muted">NAT 호스팅 공개 서브넷 지정 불필요</ns0:text><ns0:rect x="590" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="428" class="label">Regional · 신규 AZ 확장 전</ns0:text><ns0:text x="612" y="486" class="muted">최대 60분 동안 기존 AZ에서 처리 가능</ns0:text><ns0:text x="612" y="544" class="muted">시작부터 동일 AZ가 필요하면 사전 준비</ns0:text><ns0:text x="40" y="674" class="muted">요청 경로·반환 경로·판단 신호를 각각 읽는다</ns0:text></ns0:svg>