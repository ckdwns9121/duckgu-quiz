<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><ns0:title id="title">NAT 연결의 요청과 응답</ns0:title><ns0:desc id="desc">앱 · 사설 주소. 10.0.11.20:51000 → API:443. 앱 서브넷 /0 → Zonal NAT. NAT · 주소와 포트 변환. 앱 연결 ↔ NAT 사설 주소:변환 포트. NAT 서브넷 /0 → IGW. IGW · EIP로 인터넷 전달. 외부에서 보는 출발지는 EIP. API 응답은 EIP:변환 포트로. 응답 · 연결 대응을 역으로 적용. API:443 → 앱:51000. 새 외부 연결을 임의 전달하지 않음</ns0:desc><ns0:style>text{font-family:Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif;fill:#153047;font-size:23px}.head{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.muted{fill:#35576a}</ns0:style><ns0:rect width="1120" height="700" fill="#f5f8fb" /><ns0:text x="40" y="60" class="head">NAT 연결의 요청과 응답</ns0:text><ns0:rect x="40" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="148" class="label">앱 · 사설 주소</ns0:text><ns0:text x="62" y="206" class="muted">10.0.11.20:51000 → API:443</ns0:text><ns0:text x="62" y="264" class="muted">앱 서브넷 /0 → Zonal NAT</ns0:text><ns0:rect x="590" y="100" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="148" class="label">NAT · 주소와 포트 변환</ns0:text><ns0:text x="612" y="206" class="muted">앱 연결 ↔ NAT 사설 주소:변환 포트</ns0:text><ns0:text x="612" y="264" class="muted">NAT 서브넷 /0 → IGW</ns0:text><ns0:rect x="40" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="62" y="428" class="label">IGW · EIP로 인터넷 전달</ns0:text><ns0:text x="62" y="486" class="muted">외부에서 보는 출발지는 EIP</ns0:text><ns0:text x="62" y="544" class="muted">API 응답은 EIP:변환 포트로</ns0:text><ns0:rect x="590" y="380" width="510" height="240" rx="18" fill="white" stroke="#6b98b2" stroke-width="2" /><ns0:text x="612" y="428" class="label">응답 · 연결 대응을 역으로 적용</ns0:text><ns0:text x="612" y="486" class="muted">API:443 → 앱:51000</ns0:text><ns0:text x="612" y="544" class="muted">새 외부 연결을 임의 전달하지 않음</ns0:text><ns0:text x="40" y="674" class="muted">요청 경로·반환 경로·판단 신호를 각각 읽는다</ns0:text></ns0:svg>