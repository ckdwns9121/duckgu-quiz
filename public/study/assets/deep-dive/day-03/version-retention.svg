<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">Object Lock은 객체 버전을 보호</title><desc id="desc">일반 DELETE의 삭제 마커는 보호 버전의 영구 삭제와 다름. 새 버전 작성은 과거 보호 버전을 덮어 없애지 않음. Versioning만으로는 관리자 영구 삭제를 막지 못함</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#4f85b5"/></marker></defs><rect width="1120" height="570" rx="20" fill="#0e1c30"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" fill="#edf5ff"><text x="40" y="58" font-size="30" font-weight="700">Object Lock은 객체 버전을 보호</text><rect x="40" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="58" y="151" font-size="24" font-weight="700">동일 키 · report.csv</text><text x="58" y="202" font-size="20">v1: Compliance 90일 + hold</text><text x="58" y="242" font-size="20">v2: 새 수정본 작성 가능</text><path d="M365 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="418" y="151" font-size="24" font-weight="700">30일: hold 해제</text><text x="418" y="202" font-size="20">조사는 끝나도 보존 기간은 남음</text><text x="418" y="242" font-size="20">v1 영구 삭제는 계속 거부</text><path d="M725 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="778" y="151" font-size="24" font-weight="700">90일 이후</text><text x="778" y="202" font-size="20">보존 만료 + hold 없음 확인</text><text x="778" y="242" font-size="20">권한자가 version ID로 삭제</text><text x="50" y="370" font-size="23">일반 DELETE의 삭제 마커는 보호 버전의 영구 삭제와 다름</text><text x="50" y="435" font-size="23">새 버전 작성은 과거 보호 버전을 덮어 없애지 않음</text><text x="50" y="500" font-size="23">Versioning만으로는 관리자 영구 삭제를 막지 못함</text></g></svg>