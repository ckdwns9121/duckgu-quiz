<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">EBS: 첫 읽기와 지속 I/O 성능</title><desc id="desc">IOPS를 높여도 스냅샷 첫 블록 초기화와는 다른 문제. FSR은 기존 볼륨에 소급되거나 새 스냅샷에 자동 상속되지 않음. 최신 결과의 종료 후 보존은 DeleteOnTermination을 별도 설정</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#4f85b5"/></marker></defs><rect width="1120" height="570" rx="20" fill="#0e1c30"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" fill="#edf5ff"><text x="40" y="58" font-size="30" font-weight="700">EBS: 첫 읽기와 지속 I/O 성능</text><rect x="40" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="58" y="151" font-size="24" font-weight="700">스냅샷 → 새 볼륨</text><text x="58" y="202" font-size="20">첫 접근 블록을 가져오는 초기화</text><text x="58" y="242" font-size="20">처음만 느린 지연의 원인</text><path d="M365 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="418" y="151" font-size="24" font-weight="700">FSR 준비</text><text x="418" y="202" font-size="20">스냅샷·AZ 조합에 활성화</text><text x="418" y="242" font-size="20">이후 생성하는 볼륨에 적용</text><path d="M725 205h28" stroke="#4f85b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="110" width="320" height="190" rx="15" fill="#1b3554" stroke="#5b95c4"/><text x="778" y="151" font-size="24" font-weight="700">정상 상태 한도</text><text x="778" y="202" font-size="20">gp3 / io2 IOPS · 처리량</text><text x="778" y="242" font-size="20">EC2 전체 EBS 한도도 필요</text><text x="50" y="370" font-size="23">IOPS를 높여도 스냅샷 첫 블록 초기화와는 다른 문제</text><text x="50" y="435" font-size="23">FSR은 기존 볼륨에 소급되거나 새 스냅샷에 자동 상속되지 않음</text><text x="50" y="500" font-size="23">최신 결과의 종료 후 보존은 DeleteOnTermination을 별도 설정</text></g></svg>