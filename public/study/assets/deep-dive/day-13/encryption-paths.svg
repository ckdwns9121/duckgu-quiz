<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc"><title id="title">IPsec 종단 주소와 DX 경로</title><desc id="desc">세 경로의 VPN 종단 주소와 DX 가상 인터페이스 종류를 비교한다.</desc><rect width="1120" height="550" fill="#f4f7fc"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="22" fill="#17253b"><text x="36" y="48" font-size="30" font-weight="700">IPsec 종단 주소와 DX 경로</text><rect x="30" y="85" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="115" font-weight="700">인터넷 VPN</text><text x="50.0" y="150" fill="#165d9a">고객 라우터</text><text x="349.3333333333333" y="150">→</text><text x="383.3333333333333" y="150" fill="#165d9a">인터넷</text><text x="682.6666666666666" y="150">→</text><text x="716.6666666666666" y="150" fill="#165d9a">공개 VPN 종단</text><text x="48" y="183" font-size="20">IKE로 키 협상, IPsec으로 패킷 암호화. DX 경로는 아님</text><rect x="30" y="215" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="245" font-weight="700">공개 주소 VPN over DX</text><text x="50.0" y="280" fill="#165d9a">고객 라우터</text><text x="349.3333333333333" y="280">→</text><text x="383.3333333333333" y="280" fill="#165d9a">DX public VIF</text><text x="682.6666666666666" y="280">→</text><text x="716.6666666666666" y="280" fill="#165d9a">공개 VPN 종단</text><text x="48" y="313" font-size="20">전용 전송 경로라도 VPN 종단은 공개 IP이므로 공개 종단 금지 조건에 불충족</text><rect x="30" y="345" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="375" font-weight="700">사설 주소 VPN over DX</text><text x="50.0" y="410" fill="#165d9a">고객 라우터</text><text x="349.3333333333333" y="410">→</text><text x="383.3333333333333" y="410" fill="#165d9a">transit VIF·DXGW</text><text x="682.6666666666666" y="410">→</text><text x="716.6666666666666" y="410" fill="#165d9a">TGW 사설 VPN</text><text x="48" y="443" font-size="20">터널은 고객 게이트웨이 ↔ TGW에서 종단. VPC attachment 왕복 경로도 필요</text><text x="36" y="525" font-size="20">MACsec 링크 암호화·앱 TLS는 이 IPsec 터널의 종단 요구를 대신하지 않음</text></g></svg>