<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc"><title id="title">데이터의 시각과 업무 복구의 시각</title><desc id="desc">RPO는 장애 이전 복구 가능한 데이터의 시각, RTO는 장애 후 업무 검증까지의 시간이다.</desc><rect width="1120" height="550" fill="#f4f7fc"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="22" fill="#17253b"><text x="36" y="48" font-size="30" font-weight="700">데이터의 시각과 업무 복구의 시각</text><rect x="30" y="85" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="115" font-weight="700">장애 전 데이터</text><text x="50.0" y="150" fill="#165d9a">09:56 정상 데이터</text><text x="516.0" y="150">→</text><text x="550.0" y="150" fill="#165d9a">10:00 장애</text><text x="48" y="183" font-size="20">데이터 손실 범위 4분. 복제 지연·복원 검증을 반영해 판단</text><rect x="30" y="215" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="245" font-weight="700">장애 후 순차 작업</text><text x="50.0" y="280" fill="#165d9a">탐지·승인</text><text x="266.0" y="280">→</text><text x="300.0" y="280" fill="#165d9a">DB·앱 준비</text><text x="516.0" y="280">→</text><text x="550.0" y="280" fill="#165d9a">용량·권한</text><text x="766.0" y="280">→</text><text x="800.0" y="280" fill="#165d9a">전환·업무 검증</text><text x="48" y="313" font-size="20">DB available에서 멈추지 않고 주문·결제 성공까지 측정</text><rect x="30" y="345" width="1060" height="112" rx="12" fill="white" stroke="#a8bdd5"/><text x="48" y="375" font-weight="700">10:35 업무 재개</text><text x="50.0" y="410" fill="#165d9a">RPO 5분 충족</text><text x="516.0" y="410">→</text><text x="550.0" y="410" fill="#165d9a">RTO 30분 초과</text><text x="48" y="443" font-size="20">복제 목표가 맞아도 승인·확장·외부 인증 병목은 따로 줄여야 함</text><text x="36" y="525" font-size="20">RTO 계산에서 병렬 시간 차감은 실제 의존 관계와 훈련 결과가 있을 때만 적용</text></g></svg>