<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">현재 데이터 복제와 과거 시점 보존</title><desc id="desc">주 리전 DB의 현재 변경은 복구 리전 DB로 전달된다. 백업 보관함에는 과거 시점 복구 지점을 유지한다. 이 그림은 사용자 요청 라우팅이 아닌 데이터 경로를 나타낸다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#28678d"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#183349;font-size:23px}.head{font-size:30px;font-weight:700}.bold{font-weight:700}.box{fill:#eef6fa;stroke:#6b9ab2;stroke-width:2}.line{fill:none;stroke:#28678d;stroke-width:3;marker-end:url(#arrow)}.note{fill:#526b7b;font-size:21px}</style><rect width="1120" height="600" fill="#fff"/><text x="40" y="50" class="head">현재 데이터 복제와 과거 시점 보존</text><rect x="50" y="140" width="280" height="130" rx="14" class="box"/><text x="70" y="175" class="bold">주 리전 DB</text><text x="70" y="209" class="">정상 변경·실수 모두 발생</text><rect x="750" y="140" width="310" height="130" rx="14" class="box"/><text x="770" y="175" class="bold">복구 리전 DB</text><text x="770" y="209" class="">현재 변경을 따라감</text><path d="M330,190 L750,190" class="line"/><text x="380" y="160" class="">변경 복제: 지연 가능</text><rect x="350" y="360" width="430" height="130" rx="14" class="box"/><text x="370" y="395" class="bold">별도 백업 보관함</text><text x="370" y="429" class="">과거 복구 지점 · 보존 정책</text><text x="370" y="463" class="">계정·리전 분리와 삭제 통제</text><path d="M190,270 V420 H350" class="line"/><text x="65" y="345" class="">백업 생성</text><text x="50" y="550" class="note">잘못된 값이 복제됐다면 과거 시점 복원으로 되돌릴 수 있어야 한다.</text></svg>