<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc"><title id="title">무엇을 옮기는가에 따라 도구가 달라진다</title><desc id="desc">파일과 객체는 DataSync, 기존 SFTP 접속은 Transfer Family, DB 전체 적재와 CDC는 DMS, 서버 리호스트는 MGN으로 비교한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#28678d"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#183349;font-size:23px}.head{font-size:30px;font-weight:700}.bold{font-weight:700}.box{fill:#eef6fa;stroke:#6b9ab2;stroke-width:2}.line{fill:none;stroke:#28678d;stroke-width:3;marker-end:url(#arrow)}.note{fill:#526b7b;font-size:21px}</style><rect width="1120" height="580" fill="#fff"/><text x="40" y="50" class="head">무엇을 옮기는가에 따라 도구가 달라진다</text><rect x="45" y="110" width="315" height="80" rx="14" class="box"/><text x="65" y="145" class="bold">파일·객체 저장소</text><path d="M360,150 L700,150" class="line"/><rect x="700" y="110" width="370" height="80" rx="14" class="box"/><text x="720" y="145" class="bold">DataSync → S3·EFS 등</text><text x="390" y="140" class="">복사·검증 작업</text><rect x="45" y="225" width="315" height="80" rx="14" class="box"/><text x="65" y="260" class="bold">거래처 SFTP 클라이언트</text><path d="M360,265 L700,265" class="line"/><rect x="700" y="225" width="370" height="80" rx="14" class="box"/><text x="720" y="260" class="bold">Transfer Family → S3·EFS</text><text x="390" y="255" class="">접속 프로토콜 유지</text><rect x="45" y="340" width="315" height="80" rx="14" class="box"/><text x="65" y="375" class="bold">원본 데이터베이스</text><path d="M360,380 L700,380" class="line"/><rect x="700" y="340" width="370" height="80" rx="14" class="box"/><text x="720" y="375" class="bold">DMS → 대상 DB</text><text x="390" y="370" class="">전체 적재·CDC</text><rect x="45" y="455" width="315" height="80" rx="14" class="box"/><text x="65" y="490" class="bold">기존 서버의 디스크</text><path d="M360,495 L700,495" class="line"/><rect x="700" y="455" width="370" height="80" rx="14" class="box"/><text x="720" y="490" class="bold">MGN → EC2 서버</text><text x="390" y="485" class="">서버 리호스트</text></svg>