<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">RPO는 잃을 수 있는 데이터, RTO는 업무 중단 시간</title><desc id="desc">9시 55분 복구 지점과 10시 장애 사이 5분은 데이터 손실이며 10시부터 10시 40분 업무 재개까지 40분은 복구 시간이다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#28678d"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#183349;font-size:23px}.head{font-size:30px;font-weight:700}.bold{font-weight:700}.box{fill:#eef6fa;stroke:#6b9ab2;stroke-width:2}.line{fill:none;stroke:#28678d;stroke-width:3;marker-end:url(#arrow)}.note{fill:#526b7b;font-size:21px}</style><rect width="1120" height="600" fill="#fff"/><text x="40" y="50" class="head">RPO는 잃을 수 있는 데이터, RTO는 업무 중단 시간</text><rect x="50" y="110" width="280" height="115" rx="14" class="box"/><text x="70" y="145" class="bold">09:55</text><text x="70" y="179" class="">복구 가능한 마지막 데이터</text><rect x="420" y="110" width="230" height="115" rx="14" class="box"/><text x="440" y="145" class="bold">10:00</text><text x="440" y="179" class="">장애 발생</text><rect x="800" y="110" width="270" height="115" rx="14" class="box"/><text x="820" y="145" class="bold">10:40</text><text x="820" y="179" class="">업무 재개</text><path d="M80,310 L1040,310" class="line"/><path d="M180,290 v40" stroke="#28678d" stroke-width="3"/><path d="M535,290 v40" stroke="#28678d" stroke-width="3"/><path d="M930,290 v40" stroke="#28678d" stroke-width="3"/><text x="195" y="370" class="">← 데이터 손실 5분 →</text><text x="600" y="415" class="">← 업무 중단 40분 →</text><text x="55" y="500" class="">예시 목표: RPO 15분 · RTO 1시간 → 두 조건을 각각 비교한다.</text><text x="55" y="540" class="note">목표 시간은 복제·배포·DNS·검증이 포함된 훈련으로 확인한다.</text></svg>