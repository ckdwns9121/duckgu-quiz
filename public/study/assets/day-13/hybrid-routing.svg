<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">하이브리드 네트워크: 터널과 라우트는 별도 설정</title><desc id="desc">회사 장비에서 두 IPsec VPN 터널을 통해 Transit Gateway로 연결한다. TGW는 두 VPC의 attachment와 라우트 테이블을 통해 통신을 제어한다. 모든 화살표는 네트워크 경로다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#28678d"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#183349;font-size:23px}.head{font-size:30px;font-weight:700}.bold{font-weight:700}.box{fill:#eef6fa;stroke:#6b9ab2;stroke-width:2}.line{fill:none;stroke:#28678d;stroke-width:3;marker-end:url(#arrow)}.note{fill:#526b7b;font-size:21px}</style><rect width="1120" height="600" fill="#fff"/><text x="40" y="50" class="head">하이브리드 네트워크: 터널과 라우트는 별도 설정</text><rect x="40" y="220" width="220" height="110" rx="14" class="box"/><text x="60" y="255" class="bold">회사 네트워크</text><text x="60" y="289" class="">고객 게이트웨이</text><rect x="420" y="220" width="250" height="110" rx="14" class="box"/><text x="440" y="255" class="bold">Transit Gateway</text><text x="440" y="289" class="">TGW 라우트 테이블</text><rect x="820" y="110" width="260" height="110" rx="14" class="box"/><text x="840" y="145" class="bold">운영 VPC</text><text x="840" y="179" class="">앱·DB CIDR</text><rect x="820" y="390" width="260" height="110" rx="14" class="box"/><text x="840" y="425" class="bold">개발 VPC</text><text x="840" y="459" class="">별도 CIDR·경로</text><path d="M260,245 H420" class="line"/><path d="M260,305 H420" class="line"/><text x="270" y="220" class="">IPsec 터널 1</text><text x="270" y="350" class="">IPsec 터널 2</text><path d="M670,245 H740 V165 H820" class="line"/><path d="M670,305 H740 V445 H820" class="line"/><text x="750" y="90" class="">VPC attachment</text><text x="750" y="540" class="note">왕복 라우트·보안 규칙 필요</text><text x="40" y="430" class="">DX는 별도 전용 경로 선택지다.</text><text x="40" y="470" class="note">기본 전송 암호화와 혼동하지 않는다.</text></svg>