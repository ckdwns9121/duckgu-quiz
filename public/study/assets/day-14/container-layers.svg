<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">컨테이너는 저장·배치·실행을 나누어 읽는다</title><desc id="desc">ECR에서 이미지를 가져오고 ECS 또는 EKS가 배치를 조율한다. 실제 CPU와 메모리는 선택한 EC2 또는 Fargate가 제공한다. EKS Fargate는 지원 기능을 확인해야 한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#28678d"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#183349;font-size:23px}.head{font-size:30px;font-weight:700}.bold{font-weight:700}.box{fill:#eef6fa;stroke:#6b9ab2;stroke-width:2}.line{fill:none;stroke:#28678d;stroke-width:3;marker-end:url(#arrow)}.note{fill:#526b7b;font-size:21px}</style><rect width="1120" height="600" fill="#fff"/><text x="40" y="50" class="head">컨테이너는 저장·배치·실행을 나누어 읽는다</text><rect x="45" y="190" width="230" height="150" rx="14" class="box"/><text x="65" y="225" class="bold">ECR</text><text x="65" y="259" class="">이미지 저장</text><text x="65" y="293" class="">빌드 결과 배포</text><path d="M275,240 H340 V170 H420" class="line"/><path d="M275,290 H340 V380 H420" class="line"/><text x="280" y="95" class="">이미지 참조</text><rect x="420" y="110" width="260" height="120" rx="14" class="box"/><text x="440" y="145" class="bold">ECS</text><text x="440" y="179" class="">작업·서비스 관리</text><rect x="420" y="320" width="260" height="120" rx="14" class="box"/><text x="440" y="355" class="bold">EKS</text><text x="440" y="389" class="">Kubernetes 관리</text><rect x="830" y="110" width="240" height="120" rx="14" class="box"/><text x="850" y="145" class="bold">EC2</text><text x="850" y="179" class="">노드 직접 관리</text><rect x="830" y="320" width="240" height="120" rx="14" class="box"/><text x="850" y="355" class="bold">Fargate</text><text x="850" y="389" class="">작업별 실행 자원</text><path d="M680,170 L830,170" class="line"/><path d="M680,380 L830,380" class="line"/><path d="M680,190 L830,350" class="line"/><path d="M680,350 L830,190" class="line"/><text x="45" y="515" class="">배치 계층과 실행 계층은 조합한다. ECR 자체가 앱을 실행하지는 않는다.</text><text x="45" y="555" class="note">EKS Fargate는 DaemonSet·GPU 등 제약을 별도로 확인한다.</text></svg>