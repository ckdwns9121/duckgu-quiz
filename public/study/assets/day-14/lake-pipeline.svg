<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">수집 → 저장 → 변환 → SQL → 대시보드</title><desc id="desc">Firehose가 S3 원본에 전달하고 Glue ETL이 정제 Parquet를 만든다. Athena가 정제 S3를 SQL 조회하고 BI가 결과를 시각화한다. Glue Data Catalog는 메타데이터이며 원본 저장소가 아니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#28678d"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#183349;font-size:23px}.head{font-size:30px;font-weight:700}.bold{font-weight:700}.box{fill:#eef6fa;stroke:#6b9ab2;stroke-width:2}.line{fill:none;stroke:#28678d;stroke-width:3;marker-end:url(#arrow)}.note{fill:#526b7b;font-size:21px}</style><rect width="1120" height="600" fill="#fff"/><text x="40" y="50" class="head">수집 → 저장 → 변환 → SQL → 대시보드</text><rect x="40" y="125" width="230" height="110" rx="14" class="box"/><text x="60" y="160" class="bold">Data Firehose</text><text x="60" y="194" class="">수집·버퍼·전달</text><rect x="410" y="125" width="250" height="110" rx="14" class="box"/><text x="430" y="160" class="bold">S3 원본</text><text x="430" y="194" class="">이벤트 파일</text><rect x="800" y="125" width="280" height="110" rx="14" class="box"/><text x="820" y="160" class="bold">Glue ETL</text><text x="820" y="194" class="">검증·Parquet 변환</text><path d="M270,180 L410,180" class="line"/><path d="M660,180 L800,180" class="line"/><rect x="800" y="350" width="280" height="110" rx="14" class="box"/><text x="820" y="385" class="bold">S3 정제</text><text x="820" y="419" class="">날짜 파티션</text><path d="M940,235 L940,350" class="line"/><rect x="410" y="350" width="250" height="110" rx="14" class="box"/><text x="430" y="385" class="bold">Athena</text><text x="430" y="419" class="">SQL 조회</text><path d="M800,405 L660,405" class="line"/><rect x="40" y="350" width="230" height="110" rx="14" class="box"/><text x="60" y="385" class="bold">BI 대시보드</text><text x="60" y="419" class="">매출 시각화</text><path d="M410,405 L270,405" class="line"/><text x="40" y="525" class="">Glue Data Catalog: 위치·스키마·파티션 메타데이터</text><text x="40" y="565" class="note">IAM·KMS·Lake Formation: 각 경로와 데이터 권한을 함께 통제</text></svg>