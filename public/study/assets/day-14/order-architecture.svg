<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">주문 처리와 분석은 다른 경로로 흐른다</title><desc id="desc">사용자 요청이 ALB와 ECS를 거쳐 RDS에 주문을 저장한다. ECS는 SQS 작업과 이벤트 수집을 별도 경로로 전달한다. 분석 데이터는 S3와 Glue Athena를 거쳐 대시보드로 연결된다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#28678d"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#183349;font-size:23px}.head{font-size:30px;font-weight:700}.bold{font-weight:700}.box{fill:#eef6fa;stroke:#6b9ab2;stroke-width:2}.line{fill:none;stroke:#28678d;stroke-width:3;marker-end:url(#arrow)}.note{fill:#526b7b;font-size:21px}</style><rect width="1120" height="600" fill="#fff"/><text x="40" y="50" class="head">주문 처리와 분석은 다른 경로로 흐른다</text><rect x="40" y="130" width="220" height="100" rx="14" class="box"/><text x="60" y="165" class="bold">사용자</text><text x="60" y="199" class="">화면·API 요청</text><rect x="390" y="130" width="250" height="100" rx="14" class="box"/><text x="410" y="165" class="bold">ALB → ECS</text><text x="410" y="199" class="">여러 AZ의 앱 작업</text><rect x="810" y="130" width="270" height="100" rx="14" class="box"/><text x="830" y="165" class="bold">RDS·Aurora</text><text x="830" y="199" class="">주문 트랜잭션</text><path d="M260,180 L390,180" class="line"/><path d="M640,180 L810,180" class="line"/><rect x="40" y="370" width="250" height="110" rx="14" class="box"/><text x="60" y="405" class="bold">SQS → 작업자</text><text x="60" y="439" class="">송장·비동기 처리</text><path d="M440,230 V300 H165 V370" class="line"/><text x="45" y="295" class="">업무 작업 전달</text><rect x="420" y="370" width="270" height="110" rx="14" class="box"/><text x="440" y="405" class="bold">이벤트 수집 → S3</text><text x="440" y="439" class="">Streams 또는 Firehose</text><path d="M550,230 V370" class="line"/><text x="570" y="300" class="">분석 이벤트</text><rect x="810" y="370" width="270" height="110" rx="14" class="box"/><text x="830" y="405" class="bold">Glue → Athena → BI</text><text x="830" y="439" class="">정제·조회·표시</text><path d="M690,425 L810,425" class="line"/><text x="40" y="550" class="note">DB 저장과 이벤트 발행의 누락·중복은 별도 전달 설계로 다룬다.</text></svg>