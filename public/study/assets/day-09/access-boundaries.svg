<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">서명 사용자 접근과 OAC 원본 접근</title><desc id="desc">사용자 접근은 CloudFront 서명 URL 또는 쿠키로 검증하고 원본 접근은 OAC 및 S3 정책으로 제한한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527796" stroke-width="2"/></marker></defs><rect width="1120" height="510" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><text x="48" y="60" font-size="32" font-weight="700" fill="#17324d">서명 사용자 접근과 OAC 원본 접근</text><rect x="48" y="100" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="138" font-size="25" font-weight="700" fill="#17324d">사용자</text><text x="66" y="178" font-size="21" fill="#3e5367">Signed URL / Cookie</text><path d="M369,156 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="100" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="138" font-size="25" font-weight="700" fill="#17324d">CloudFront</text><text x="420" y="178" font-size="21" fill="#3e5367">서명·만료·자원 검증</text><path d="M723,156 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="100" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="138" font-size="25" font-weight="700" fill="#17324d">사용자 접근 경계</text><text x="774" y="178" font-size="21" fill="#3e5367">누가 콘텐츠를 받는가</text><rect x="48" y="250" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="288" font-size="25" font-weight="700" fill="#17324d">CloudFront → S3</text><text x="66" y="328" font-size="21" fill="#3e5367">OAC로 원본 요청 서명</text><path d="M369,306 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="250" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="288" font-size="25" font-weight="700" fill="#17324d">비공개 S3 REST 원본</text><text x="420" y="328" font-size="21" fill="#3e5367">버킷 정책 + 배포 조건</text><path d="M723,306 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="250" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="288" font-size="25" font-weight="700" fill="#17324d">원본 접근 경계</text><text x="774" y="328" font-size="21" fill="#3e5367">누가 원본을 읽는가</text><text x="48" y="468" font-size="22" fill="#3e5367">OAC만으로 유료 사용자를 구별하지 못한다. 공개 S3는 CDN 서명을 우회한다.</text></g></svg>