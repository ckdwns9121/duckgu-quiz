<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">Route 53: 응답 주소 선택과 실제 요청</title><desc id="desc">DNS는 접속 주소를 응답하고 콘텐츠 요청은 클라이언트가 서비스로 보낸다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527796" stroke-width="2"/></marker></defs><rect width="1120" height="510" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><text x="48" y="60" font-size="32" font-weight="700" fill="#17324d">Route 53: 응답 주소 선택과 실제 요청</text><rect x="48" y="100" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="138" font-size="25" font-weight="700" fill="#17324d">① DNS 질문</text><text x="66" y="178" font-size="21" fill="#3e5367">www.example.com 주소?</text><path d="M369,156 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="100" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="138" font-size="25" font-weight="700" fill="#17324d">Route 53 정책</text><text x="420" y="178" font-size="21" fill="#3e5367">가중치·지연·상태로 선택</text><path d="M723,156 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="100" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="138" font-size="25" font-weight="700" fill="#17324d">② DNS 응답</text><text x="774" y="178" font-size="21" fill="#3e5367">선택된 서비스 주소</text><rect x="48" y="250" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="288" font-size="25" font-weight="700" fill="#17324d">③ 브라우저 요청</text><text x="66" y="328" font-size="21" fill="#3e5367">응답 주소에 HTTPS 연결</text><path d="M369,306 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="250" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="288" font-size="25" font-weight="700" fill="#17324d">실제 웹 서비스</text><text x="420" y="328" font-size="21" fill="#3e5367">ALB·CloudFront 등</text><path d="M723,306 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="250" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="288" font-size="25" font-weight="700" fill="#17324d">④ 콘텐츠 응답</text><text x="774" y="328" font-size="21" fill="#3e5367">이미지·HTML·API 응답</text><text x="48" y="468" font-size="22" fill="#3e5367">DNS 캐시의 TTL과 상태 판정 시간 때문에 장애 조치는 즉시 완료되지 않는다.</text></g></svg>