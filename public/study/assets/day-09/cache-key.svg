<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">CloudFront: 같은 키에 같은 응답</title><desc id="desc">캐시 키가 같고 객체가 유효하면 엣지에서 응답하고 아니면 원본을 조회한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527796" stroke-width="2"/></marker></defs><rect width="1120" height="510" fill="#f4f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif"><text x="48" y="60" font-size="32" font-weight="700" fill="#17324d">CloudFront: 같은 키에 같은 응답</text><rect x="48" y="100" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="138" font-size="25" font-weight="700" fill="#17324d">사용자 요청</text><text x="66" y="178" font-size="21" fill="#3e5367">경로·헤더·쿠키·쿼리</text><path d="M369,156 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="100" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="138" font-size="25" font-weight="700" fill="#17324d">캐시 키 구성</text><text x="420" y="178" font-size="21" fill="#3e5367">응답을 바꾸는 값 선택</text><path d="M723,156 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="100" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="138" font-size="25" font-weight="700" fill="#17324d">HIT</text><text x="774" y="178" font-size="21" fill="#3e5367">엣지의 유효 객체 응답</text><rect x="48" y="250" width="316" height="112" rx="14" fill="white" stroke="#4d83b4" stroke-width="2"/><text x="66" y="288" font-size="25" font-weight="700" fill="#17324d">MISS 또는 재검증</text><text x="66" y="328" font-size="21" fill="#3e5367">원본으로 요청 전달</text><path d="M369,306 H396" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="402" y="250" width="316" height="112" rx="14" fill="white" stroke="#278f8d" stroke-width="2"/><text x="420" y="288" font-size="25" font-weight="700" fill="#17324d">원본 응답</text><text x="420" y="328" font-size="21" fill="#3e5367">캐시 정책·TTL 적용</text><path d="M723,306 H750" stroke="#527796" stroke-width="2" marker-end="url(#a)"/><rect x="756" y="250" width="316" height="112" rx="14" fill="white" stroke="#b67b2c" stroke-width="2"/><text x="774" y="288" font-size="25" font-weight="700" fill="#17324d">다음 요청</text><text x="774" y="328" font-size="21" fill="#3e5367">동일 키라면 재사용</text><text x="48" y="468" font-size="22" fill="#3e5367">개인화 구분 누락은 정보 노출 위험. 불필요한 키는 적중률을 낮춘다.</text></g></svg>