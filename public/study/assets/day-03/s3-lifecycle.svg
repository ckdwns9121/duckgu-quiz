<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">S3 수명 주기 규칙의 예</title><desc id="desc">버전 관리가 없는 버킷의 로그를 생성 시 Standard, 30일 후 Standard IA, 180일 후 Deep Archive로 전환하고 1095일 후 영구 삭제하는 예시다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><rect width="1120" height="610" fill="#F8FAFD"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="40" y="55" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">S3 수명 주기 규칙의 예</text><text x="40" y="95" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">예: 버전 관리를 사용하지 않는 버킷의 로그 객체 · 생성 후 경과일 기준</text><text x="140" y="163" font-size="25" fill="#225AD5" font-weight="700" text-anchor="middle">0일</text><rect x="40" y="185" width="200" height="180" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="140" y="245" font-size="23" fill="#15243B" font-weight="700" text-anchor="middle">Standard</text><text x="140" y="307" font-size="21" fill="#52627A" font-weight="400" text-anchor="middle">최근 로그</text><text x="140" y="336" font-size="21" fill="#52627A" font-weight="400" text-anchor="middle">자주 조회</text><text x="420" y="163" font-size="25" fill="#225AD5" font-weight="700" text-anchor="middle">30일</text><rect x="320" y="185" width="200" height="180" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="420" y="245" font-size="23" fill="#15243B" font-weight="700" text-anchor="middle">Standard-IA</text><text x="420" y="307" font-size="21" fill="#52627A" font-weight="400" text-anchor="middle">드문 조회</text><text x="420" y="336" font-size="21" fill="#52627A" font-weight="400" text-anchor="middle">즉시 접근</text><text x="700" y="163" font-size="25" fill="#225AD5" font-weight="700" text-anchor="middle">180일</text><rect x="600" y="185" width="200" height="180" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="700" y="230" font-size="23" fill="#15243B" font-weight="700" text-anchor="middle">Glacier</text><text x="700" y="261" font-size="22" fill="#15243B" font-weight="700" text-anchor="middle">Deep Archive</text><text x="700" y="307" font-size="21" fill="#52627A" font-weight="400" text-anchor="middle">장기 보관</text><text x="700" y="336" font-size="21" fill="#52627A" font-weight="400" text-anchor="middle">복원 대기</text><text x="980" y="163" font-size="25" fill="#225AD5" font-weight="700" text-anchor="middle">1,095일</text><rect x="880" y="185" width="200" height="180" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="980" y="245" font-size="23" fill="#15243B" font-weight="700" text-anchor="middle">영구 삭제</text><text x="980" y="307" font-size="21" fill="#52627A" font-weight="400" text-anchor="middle">보관 의무</text><text x="980" y="336" font-size="21" fill="#52627A" font-weight="400" text-anchor="middle">종료</text><path d="M250,275 L308,275" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><path d="M530,275 L588,275" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><path d="M810,275 L868,275" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="410" width="1040" height="115" rx="16" fill="#FFF3E6"/><text x="64" y="451" font-size="23" fill="#A95512" font-weight="600" text-anchor="start">전환(Transition)은 저장 클래스를 바꾸고, 만료(Expiration)는 삭제한다.</text><text x="64" y="492" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">버전 관리가 켜진 버킷은 현재 버전과 이전 버전의 만료 규칙을 구분한다.</text><text x="40" y="570" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">기간은 설명용 예시다. 허용되는 전환·객체 크기·최소 보관 기간·복원 조건을 확인한다.</text></g></svg>