<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc"><title id="title">블록·파일·객체 저장소의 접근 방식</title><desc id="desc">EBS는 운영체제에 블록 장치로 연결한다. EFS와 FSx는 공유 파일 시스템으로 마운트한다. S3는 버킷과 키를 지정하는 객체 API로 접근한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><rect width="1120" height="805" fill="#F8FAFD"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="40" y="55" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">블록·파일·객체 저장소의 접근 방식</text><text x="40" y="94" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">애플리케이션이 데이터를 읽고 쓰는 인터페이스가 다르다.</text><rect x="40" y="130" width="1040" height="195" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="169" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">블록 저장소 · EBS</text><rect x="64" y="194" width="310" height="68" rx="16" fill="#EEF4FF"/><text x="219" y="238" font-size="23" fill="#15243B" font-weight="400" text-anchor="middle">EC2의 운영체제</text><rect x="720" y="194" width="336" height="68" rx="16" fill="#EEF4FF"/><text x="888" y="238" font-size="23" fill="#15243B" font-weight="400" text-anchor="middle">EBS 볼륨</text><path d="M390,228 L704,228" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><text x="547" y="206" font-size="20" fill="#225AD5" font-weight="400" text-anchor="middle">디스크 연결</text><text x="64" y="300" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">OS가 볼륨에 파일 시스템을 만들어 사용</text><rect x="40" y="350" width="1040" height="195" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="389" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">파일 저장소 · EFS / FSx</text><rect x="64" y="414" width="310" height="68" rx="16" fill="#E8F7F2"/><text x="219" y="458" font-size="23" fill="#15243B" font-weight="400" text-anchor="middle">여러 서버의 앱</text><rect x="720" y="414" width="336" height="68" rx="16" fill="#E8F7F2"/><text x="888" y="458" font-size="23" fill="#15243B" font-weight="400" text-anchor="middle">공유 파일 시스템</text><path d="M390,448 L704,448" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><text x="547" y="426" font-size="20" fill="#225AD5" font-weight="400" text-anchor="middle">NFS / SMB 등</text><text x="64" y="520" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">서버들이 같은 파일 경로를 마운트해 사용</text><rect x="40" y="570" width="1040" height="195" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="609" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">객체 저장소 · S3</text><rect x="64" y="634" width="310" height="68" rx="16" fill="#FFF3E6"/><text x="219" y="678" font-size="23" fill="#15243B" font-weight="400" text-anchor="middle">앱 · SDK</text><rect x="720" y="634" width="336" height="68" rx="16" fill="#FFF3E6"/><text x="888" y="678" font-size="23" fill="#15243B" font-weight="400" text-anchor="middle">버킷 안의 객체</text><path d="M390,668 L704,668" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><text x="547" y="646" font-size="20" fill="#225AD5" font-weight="400" text-anchor="middle">HTTPS API</text><text x="64" y="740" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">버킷과 키로 객체를 지정해 업로드·다운로드</text></g></svg>