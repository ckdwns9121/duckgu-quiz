<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">EBS와 EFS의 가용 영역 범위</title><desc id="desc">EBS 볼륨은 같은 AZ의 EC2에 연결한다. 다른 AZ에서는 스냅샷으로 새 볼륨을 복원한다. Regional EFS는 AZ별 마운트 타깃으로 여러 AZ의 서버가 하나의 파일 시스템에 접근한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><rect width="1120" height="790" fill="#F8FAFD"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="40" y="55" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">EBS와 EFS의 가용 영역 범위</text><text x="40" y="94" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">EBS 볼륨의 연결 범위와 Regional EFS의 공유 범위를 비교한다.</text><rect x="40" y="125" width="1040" height="290" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="164" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">EBS 볼륨 · 같은 AZ의 EC2에 연결</text><rect x="64" y="185" width="376" height="133" rx="16" fill="#EEF4FF"/><text x="84" y="220" font-size="23" fill="#225AD5" font-weight="700" text-anchor="start">AZ A</text><rect x="680" y="185" width="376" height="133" rx="16" fill="#EEF4FF"/><text x="700" y="220" font-size="23" fill="#225AD5" font-weight="700" text-anchor="start">AZ B</text><text x="84" y="269" font-size="23" fill="#15243B" font-weight="400" text-anchor="start">EC2 A  ↔  EBS 볼륨 A</text><text x="700" y="269" font-size="23" fill="#15243B" font-weight="400" text-anchor="start">EC2 B  ↔  새 EBS 볼륨</text><path d="M453,260 L666,260" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><text x="559" y="230" font-size="20" fill="#225AD5" font-weight="400" text-anchor="middle">스냅샷으로 복원</text><text x="64" y="359" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">볼륨 A를 다른 AZ의 서버에 직접 연결하지 않는다.</text><text x="64" y="394" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">Multi-Attach도 같은 AZ 안에서 지원 조건을 충족해야 한다.</text><rect x="40" y="440" width="1040" height="315" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="64" y="480" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">Regional EFS · 여러 AZ의 서버가 같은 파일 시스템 사용</text><rect x="64" y="515" width="336" height="77" rx="16" fill="#E8F7F2"/><text x="232" y="562" font-size="23" fill="#087B72" font-weight="600" text-anchor="middle">AZ A · Linux EC2</text><rect x="720" y="515" width="336" height="77" rx="16" fill="#E8F7F2"/><text x="888" y="562" font-size="23" fill="#087B72" font-weight="600" text-anchor="middle">AZ B · Linux EC2</text><path d="M232,602 L430,661" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><path d="M888,602 L690,661" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="635" width="280" height="68" rx="16" fill="#E8F7F2"/><text x="560" y="679" font-size="22" fill="#087B72" font-weight="600" text-anchor="middle">같은 EFS 파일 시스템</text><text x="64" y="731" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">AZ별 마운트 타깃을 통해 접근한다. One Zone EFS는 저장 범위가 다르다.</text></g></svg>