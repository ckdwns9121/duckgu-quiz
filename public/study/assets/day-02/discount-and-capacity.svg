<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="665" viewBox="0 0 1120 665" role="img" aria-labelledby="title desc"><title id="title">요금 할인과 용량 예약의 차이</title><desc id="desc">Savings Plans와 리전 예약 인스턴스는 할인하지만 용량을 확보하지 않는다. AZ 예약 인스턴스는 할인과 용량 확보를 제공한다. 온디맨드 용량 예약 자체에는 할인이 없다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1120" height="665" rx="16" fill="#F8FAFD"/><text x="40" y="55" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">요금 할인과 용량 예약의 차이</text><text x="40" y="95" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">할인 약정과 특정 AZ의 용량 확보는 따로 확인한다.</text><rect x="40" y="130" width="1040" height="65" rx="16" fill="#15243B"/><text x="62" y="171" font-size="23" fill="white" font-weight="600" text-anchor="start">방식</text><text x="615" y="171" font-size="23" fill="white" font-weight="600" text-anchor="middle">약정에 따른 할인</text><text x="925" y="171" font-size="23" fill="white" font-weight="600" text-anchor="middle">특정 AZ 용량 확보</text><rect x="40" y="208" width="1040" height="70" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="62" y="252" font-size="23" fill="#15243B" font-weight="600" text-anchor="start">Savings Plans</text><text x="615" y="252" font-size="22" fill="#087B72" font-weight="400" text-anchor="middle">있음</text><text x="925" y="252" font-size="22" fill="#225AD5" font-weight="400" text-anchor="middle">없음</text><rect x="40" y="290" width="1040" height="70" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="62" y="334" font-size="23" fill="#15243B" font-weight="600" text-anchor="start">리전 범위 예약 인스턴스</text><text x="615" y="334" font-size="22" fill="#087B72" font-weight="400" text-anchor="middle">있음</text><text x="925" y="334" font-size="22" fill="#225AD5" font-weight="400" text-anchor="middle">없음</text><rect x="40" y="372" width="1040" height="70" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="62" y="416" font-size="23" fill="#15243B" font-weight="600" text-anchor="start">AZ 범위 예약 인스턴스</text><text x="615" y="416" font-size="22" fill="#087B72" font-weight="400" text-anchor="middle">있음</text><text x="925" y="416" font-size="22" fill="#225AD5" font-weight="400" text-anchor="middle">있음</text><rect x="40" y="454" width="1040" height="70" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="62" y="498" font-size="23" fill="#15243B" font-weight="600" text-anchor="start">온디맨드 용량 예약</text><text x="615" y="498" font-size="22" fill="#087B72" font-weight="400" text-anchor="middle">자체 할인 없음</text><text x="925" y="498" font-size="22" fill="#225AD5" font-weight="400" text-anchor="middle">있음</text><rect x="40" y="560" width="1040" height="73" rx="16" fill="#FFF3E6"/><text x="64" y="605" font-size="22" fill="#A95512" font-weight="600" text-anchor="start">온디맨드 용량 예약은 조건에 맞는 할인 약정과 조합할 수 있다.</text></g></svg>