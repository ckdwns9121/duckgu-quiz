<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc"><title id="title">EC2의 중지와 종료</title><desc id="desc">실행 준비에서 실행 상태로 바뀐다. 중지한 인스턴스는 다시 시작할 수 있지만 종료한 인스턴스는 복구할 수 없다. 중간 전환 상태는 생략했다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1120" height="690" rx="16" fill="#F8FAFD"/><text x="40" y="55" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">EC2의 중지와 종료</text><text x="40" y="95" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">EBS 루트 볼륨을 사용하는 인스턴스의 주요 상태를 단순화했다.</text><rect x="40" y="165" width="300" height="140" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="60" y="210" font-size="27" fill="#225AD5" font-weight="700" text-anchor="start">pending</text><text x="60" y="260" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">실행 준비</text><rect x="410" y="165" width="300" height="140" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="430" y="210" font-size="27" fill="#225AD5" font-weight="700" text-anchor="start">running</text><text x="430" y="260" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">실행 중 · 사용 요금 발생</text><rect x="780" y="165" width="300" height="140" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="800" y="210" font-size="27" fill="#225AD5" font-weight="700" text-anchor="start">stopped</text><text x="800" y="260" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">중지 · 다시 시작 가능</text><path d="M350,235 L395,235" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><path d="M720,235 L765,235" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><text x="742" y="211" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">중지</text><rect x="780" y="330" width="300" height="100" rx="16" fill="#EEF4FF"/><text x="800" y="370" font-size="22" fill="#15243B" font-weight="600" text-anchor="start">다시 시작하면</text><text x="800" y="406" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">pending을 거쳐 running</text><path d="M560,315 L560,470" fill="none" stroke="#225AD5" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="397" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">종료</text><rect x="410" y="485" width="300" height="120" rx="16" fill="#FFF3E6"/><text x="430" y="530" font-size="27" fill="#A95512" font-weight="700" text-anchor="start">terminated</text><text x="430" y="575" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">삭제 · 다시 시작 불가</text><text x="40" y="650" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">중지 중에도 EBS 등 별도 리소스 요금과 구매 약정은 남을 수 있다.</text></g></svg>