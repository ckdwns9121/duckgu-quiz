<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">EC2 인스턴스를 시작할 때 정하는 것</title><desc id="desc">AMI와 인스턴스 유형 및 배치 접근 설정을 선택하여 EC2 인스턴스를 실행한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#225AD5"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1120" height="590" rx="16" fill="#F8FAFD"/><text x="40" y="55" font-size="30" fill="#15243B" font-weight="700" text-anchor="start">EC2 인스턴스를 시작할 때 정하는 것</text><text x="40" y="95" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">소프트웨어 이미지, 하드웨어 사양, 배치·접근 설정을 골라 서버를 실행한다.</text><rect x="40" y="135" width="300" height="155" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="60" y="175" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">AMI</text><text x="60" y="220" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">운영체제·소프트웨어</text><text x="60" y="257" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">예: Linux + 웹 서버</text><rect x="410" y="135" width="300" height="155" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="430" y="175" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">인스턴스 유형</text><text x="430" y="220" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">CPU·메모리 등 사양</text><text x="430" y="257" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">예: m7i.large</text><rect x="780" y="135" width="300" height="155" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="800" y="175" font-size="25" fill="#15243B" font-weight="700" text-anchor="start">배치·접근 설정</text><text x="800" y="220" font-size="21" fill="#15243B" font-weight="400" text-anchor="start">서브넷·보안 그룹·역할</text><text x="800" y="257" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">사용할 위치와 접근 범위</text><path d="M190,300 V335 H560 V375" fill="none" stroke="#225AD5" stroke-width="2"/><path d="M560,300 V335 H560 V375" fill="none" stroke="#225AD5" stroke-width="2"/><path d="M930,300 V335 H560 V375" fill="none" stroke="#225AD5" stroke-width="2"/><rect x="260" y="380" width="600" height="120" rx="16" fill="#E8F7F2"/><text x="560" y="426" font-size="28" fill="#087B72" font-weight="700" text-anchor="middle">실행한 EC2 인스턴스</text><text x="560" y="471" font-size="22" fill="#52627A" font-weight="400" text-anchor="middle">실행 상태·데이터·요금은 이후 별도로 관리</text><text x="40" y="550" font-size="22" fill="#15243B" font-weight="600" text-anchor="start">AMI는 실행 중인 서버가 아니라 새 인스턴스를 시작하는 이미지다.</text></g></svg>