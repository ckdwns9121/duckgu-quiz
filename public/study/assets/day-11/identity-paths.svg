<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">앱 회원과 직원의 접근 경로</title><desc id="desc">Cognito User pool은 앱 사용자 토큰, Identity pool은 임시 AWS 자격 증명, IAM Identity Center는 직원의 계정 접근을 관리한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#16304c}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#fff;stroke:#b5c9da;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1120" height="660" fill="#f3f7fb"/><text class="title" x="40" y="54">앱 회원과 직원의 접근 경로</text><rect x="40" y="115" width="300" height="320" rx="16" class="box" style="fill:#eaf5ff"/><text x="60" y="153" class="label">User pool</text><text x="60" y="193" class="body">앱 사용자 로그인</text><text x="60" y="224" class="body">외부 SAML · OIDC 연동</text><text x="60" y="255" class="body">↓ 인증 토큰</text><text x="60" y="286" class="body">API가 토큰 검증</text><text x="60" y="317" class="body"></text><text x="60" y="348" class="body">앱의 업무 권한은 별도</text><rect x="410" y="115" width="300" height="320" rx="16" class="box" style="fill:#eff9f0"/><text x="430" y="153" class="label">Identity pool</text><text x="430" y="193" class="body">신뢰한 인증 결과</text><text x="430" y="224" class="body">↓ 역할 매핑</text><text x="430" y="255" class="body">임시 AWS 자격 증명</text><text x="430" y="286" class="body">S3 등 직접 접근</text><text x="430" y="317" class="body"></text><text x="430" y="348" class="body">역할 정책으로 범위 제한</text><rect x="780" y="115" width="300" height="320" rx="16" class="box" style="fill:#fff5e6"/><text x="800" y="153" class="label">Identity Center</text><text x="800" y="193" class="body">직원 · 그룹</text><text x="800" y="224" class="body">↓ 권한 세트</text><text x="800" y="255" class="body">여러 AWS 계정</text><text x="800" y="286" class="body">업무 앱 접근</text><text x="800" y="317" class="body"></text><text x="800" y="348" class="body">소비자 회원 관리와 구분</text><text x="40" y="525" class="body">User pool과 Identity pool은 함께 쓰거나 독립적으로 사용할 수 있다.</text><text x="40" y="580" class="body">Directory Service: Microsoft AD가 필요한 앱과 기존 디렉터리 연동을 검토한다.</text></svg>