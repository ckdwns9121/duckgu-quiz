<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">요청과 데이터에 놓이는 보안 경계</title><desc id="desc">사용자 인증, TLS, WAF 요청 검사, 앱 권한과 저장 암호화는 서로 다른 역할이다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569" /></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#16304c}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#fff;stroke:#b5c9da;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1120" height="660" fill="#f3f7fb" /><text class="title" x="40" y="54">요청과 데이터에 놓이는 보안 경계</text><rect x="40" y="110" width="300" height="150" rx="16" class="box" style="fill:#fff" /><text x="60" y="148" class="label">웹 요청 진입</text><text x="60" y="188" class="body">HTTPS · TLS</text><text x="60" y="219" class="body">ACM 인증서로 전송 보호</text><rect x="410" y="110" width="300" height="150" rx="16" class="box" style="fill:#fff" /><text x="430" y="148" class="label">요청 검사</text><text x="430" y="188" class="body">WAF 규칙</text><text x="430" y="219" class="body">악성 HTTP 요청 통제</text><path class="line" d="M340 185L400 185" /><rect x="780" y="110" width="300" height="150" rx="16" class="box" style="fill:#fff" /><text x="800" y="148" class="label">사용자 인증</text><text x="800" y="188" class="body">Cognito 사용자 로그인</text><text x="800" y="219" class="body">토큰으로 신원 확인</text><path class="line" d="M710 185L770 185" /><rect x="780" y="365" width="300" height="150" rx="16" class="box" style="fill:#fff" /><text x="800" y="403" class="label">앱 권한 판단</text><text x="800" y="443" class="body">해당 주문의 소유자인가</text><text x="800" y="474" class="body">로그인 후에도 검사</text><path class="line" d="M930 260L930 355" /><rect x="410" y="365" width="300" height="150" rx="16" class="box" style="fill:#fff" /><text x="430" y="403" class="label">저장 데이터</text><text x="430" y="443" class="body">KMS 키 사용 통제</text><text x="430" y="474" class="body">S3 · DB 암호화</text><path class="line" d="M780 440L720 440" /><text x="40" y="585" class="body">HTTPS · 로그인 · 암호화는 각각 다른 경계다. 하나가 나머지를 대신하지 않는다.</text></svg>