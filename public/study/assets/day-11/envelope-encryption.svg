<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">봉투 암호화: 데이터와 키를 따로 보호</title><desc id="desc">데이터 키로 파일을 암호화한다. KMS 키는 데이터 키를 암호화하며 암호화된 데이터 키를 암호문과 함께 저장한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#16304c}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#fff;stroke:#b5c9da;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1120" height="660" fill="#f3f7fb"/><text class="title" x="40" y="54">봉투 암호화: 데이터와 키를 따로 보호</text><rect x="40" y="115" width="285" height="150" rx="16" class="box" style="fill:#fff"/><text x="60" y="153" class="label">KMS 키</text><text x="60" y="193" class="body">키 정책 · 사용 권한</text><text x="60" y="224" class="body">데이터 키를 보호</text><rect x="420" y="115" width="285" height="150" rx="16" class="box" style="fill:#fff"/><text x="440" y="153" class="label">평문 데이터 키</text><text x="440" y="193" class="body">파일 암호화에 사용</text><text x="440" y="224" class="body">사용 뒤 메모리에서 제거</text><path class="line" d="M325 190L410 190"/><rect x="800" y="115" width="280" height="150" rx="16" class="box" style="fill:#fff"/><text x="820" y="153" class="label">원본 파일</text><text x="820" y="193" class="body">데이터 키로 암호화</text><text x="820" y="224" class="body">평문은 저장하지 않음</text><path class="line" d="M705 190L790 190"/><rect x="420" y="370" width="660" height="150" rx="16" class="box" style="fill:#fff"/><text x="440" y="408" class="label">보관할 항목</text><text x="440" y="448" class="body">암호화된 파일 + 암호화된 데이터 키</text><text x="440" y="479" class="body">복호화: KMS 권한 확인 → 데이터 키 복원 → 파일 해독</text><path class="line" d="M940 265L940 360"/><path class="line" d="M180 265L180 445"/><path class="line" d="M180 445L410 445"/><text x="40" y="590" class="body">KMS 키 회전은 기존 파일 전체를 새 키로 재암호화하는 작업이 아니다.</text></svg>