id: aws-db
name: DB · 메시징
color: "#2B70C9"
dark: "#1F57A0"
part: PART 6
lede: RDS의 Multi-AZ와 복제본, DynamoDB의 일관성과 파티션, SQS의 중복과 순서처럼 "왜 데이터가 이상하지?"의 원인이 되는 것들입니다.
blocks:
  - items:
      - id: aws-db-q-multiaz
        tag: RDS
        title: RDS 읽기 나누기
        type: mcq
        quizzes:
          - q: RDS Multi-AZ(인스턴스 배포)의 대기 인스턴스로 읽기 쿼리를 나눌 수 있을까?
            answer: 없다. 대기 인스턴스는 읽기를 받지 않는다
            wrong:
              - 있다. 대기 인스턴스 주소로 읽으면 된다
              - 있다. RDS가 읽기를 자동으로 나눠 준다
              - 있다. 장애 조치 중에만 못 읽는다
          - q: 조회 쿼리가 너무 많아 주 DB가 느리다. 읽기를 나누려면?
            answer: 읽기 전용 복제본으로 조회를 보낸다
            wrong:
              - Multi-AZ를 켜서 대기로 읽기를 나눈다
              - 인스턴스를 다른 AZ로 옮긴다
              - 자동 백업을 더 자주 하게 한다
        explain: <p><b>Multi-AZ</b>(인스턴스 배포)는 다른 AZ에 <b>동기</b> 복제한 대기 인스턴스를 두고, 주 DB가 죽으면 자동으로 넘긴다. 목적은 가용성이라 대기 인스턴스는 읽기를 받지 않는다. <b>읽기 전용 복제본</b>은 <b>비동기</b> 복제로 읽기를 나누는 용도다. (두 개의 읽기 가능한 대기를 두는 Multi-AZ DB 클러스터 배포는 별도 방식이다.)</p>
      - id: aws-db-q-failover
        tag: RDS
        title: 장애 조치 후 연결
        type: mcq
        quizzes:
          - q: Multi-AZ에서 장애 조치가 일어났다. 앱의 DB 연결 주소는?
            answer: 그대로 둔다. 같은 엔드포인트가 새 주 DB로
            wrong:
              - 새 주 DB의 IP로 바꿔야 한다
              - 대기 인스턴스의 엔드포인트로 바꿔야 한다
              - 앱도 새 AZ로 옮겨 다시 배포해야 한다
        explain: <p>RDS는 장애 조치 때 <b>같은 엔드포인트(DNS 이름)</b>가 새 주 DB를 가리키게 바꾼다. 그래서 앱은 IP가 아니라 엔드포인트로 접속하고, DNS를 너무 오래 캐시하지 않으며, 끊긴 연결을 다시 맺는 재시도 로직을 둔다.</p>
      - id: aws-db-q-lag
        tag: RDS
        title: 복제본에서 방금 쓴 데이터
        type: mcq
        quizzes:
          - q: 주 DB에 글을 쓴 직후 읽기 복제본에서 조회했더니 새 글이 없다. 이유는?
            answer: 복제본은 비동기라 잠깐 늦을 수 있어서
            wrong:
              - 트랜잭션이 아직 커밋되지 않아서
              - 복제본은 1시간마다 스냅샷으로 맞춰져서
              - 복제본은 조회 결과를 캐시해 두어서
        explain: <p>읽기 복제본은 <b>비동기 복제</b>라 복제 지연(replica lag)만큼 늦다. "쓰고 바로 내 글 보기"처럼 방금 쓴 값을 꼭 봐야 하는 조회는 주 DB에서 읽는다.</p>
      - id: aws-db-q-ddbread
        tag: DynamoDB
        title: DynamoDB의 기본 읽기
        type: mcq
        quizzes:
          - q: DynamoDB에서 옵션 없이 GetItem을 하면 읽기 방식은?
            answer: 최종적 일관성
            wrong:
              - 강한 일관성
              - 트랜잭션 읽기
              - 테이블을 만들 때 고른 방식
          - q: 글로벌 보조 인덱스(GSI)에서 강한 일관성 읽기를 하면?
            answer: 지원되지 않는다
            wrong:
              - 테이블과 똑같이 된다
              - 요금이 두 배로 된다
              - 파티션 키가 같을 때만 된다
        explain: "<p>DynamoDB 읽기는 기본이 <b>최종적 일관성</b>이고, <code>ConsistentRead: true</code>로 강한 일관성을 고를 수 있다(읽기 용량을 두 배 쓴다). 다만 <b>GSI는 비동기로 갱신</b>되어 강한 일관성 읽기를 지원하지 않는다.</p>"
      - id: aws-db-q-hot
        tag: DynamoDB
        title: 쓰기가 스로틀될 때
        type: mcq
        quizzes:
          - q: 주문 테이블의 파티션 키를 주문 날짜(2026-09-24)로 했더니, 오늘 주문이 몰릴 때 쓰기가 스로틀된다. 원인은?
            answer: 한 파티션 키로 쓰기가 몰려서 (핫 파티션)
            wrong:
              - 하루 쓰기 횟수 한도에 걸려서
              - 정렬 키를 정하지 않아서
              - 온디맨드 모드는 쓰기가 느려서
        explain: <p>DynamoDB는 파티션 키로 데이터를 나눠 저장하고, 파티션마다 처리량 한계가 있다. 날짜처럼 <b>값의 종류가 적고 한쪽으로 몰리는 키</b>는 그날의 모든 쓰기가 한 파티션에 몰린다. 주문 ID·사용자 ID처럼 고르게 퍼지는 키를 쓰거나 키에 무작위 접미사를 붙인다.</p>
      - id: aws-db-q-visibility
        tag: SQS
        title: 처리 시간과 가시성 제한
        type: mcq
        quizzes:
          - q: 워커가 메시지 하나를 처리하는 데 60초가 걸리는데, 큐의 가시성 제한 시간은 기본값 30초다. 무슨 일이 생길까?
            answer: 처리 중인 메시지를 다른 워커가 또 받는다
            wrong:
              - 30초가 지나면 메시지가 삭제된다
              - 처리하는 동안 제한 시간이 자동으로 늘어난다
              - 60초 동안 다음 메시지를 받을 수 없다
        explain: <p>SQS는 메시지를 받아 간 뒤 <b>가시성 제한 시간</b> 동안만 숨긴다. 그 안에 DeleteMessage를 하지 않으면 다시 보여서 다른 소비자가 받는다. 처리 시간보다 넉넉하게(기본 30초, 최대 12시간) 잡거나, 처리 중에 ChangeMessageVisibility로 늘린다.</p>
      - id: aws-db-q-sqstype
        tag: SQS
        title: 큐 종류 고르기
        type: mcq
        quizzes:
          - q: SQS 표준 큐의 소비자가 대비해야 하는 것은?
            answer: 같은 메시지가 두 번 이상 올 수 있다
            wrong:
              - 메시지가 사라질 수 있다
              - 메시지 하나에 소비자가 하나로 고정된다
              - 메시지가 항상 순서대로 온다
          - q: 같은 주문의 이벤트를 들어온 순서대로, 한 번만 처리하고 싶다.
            answer: FIFO 큐 (주문 ID를 메시지 그룹 ID로)
            wrong:
              - 표준 큐 (소비자를 한 개만 둔다)
              - 표준 큐 (메시지에 순번을 붙인다)
              - 표준 큐 + DLQ (실패는 따로 모은다)
        explain: "<p><b>표준 큐</b>: 처리량이 매우 크지만 <b>최소 한 번 전달</b>(가끔 중복)이고 순서는 최선일 뿐이다. 그래서 소비자를 <b>멱등</b>하게 만든다. <b>FIFO 큐</b>: 같은 <b>메시지 그룹</b> 안에서 순서를 지키고 정확히 한 번 처리한다.</p>"
      - id: aws-db-q-dlq
        tag: SQS
        title: 계속 실패하는 메시지
        type: mcq
        quizzes:
          - q: 형식이 잘못돼 처리할 때마다 실패하는 메시지가 큐에서 계속 재시도되며 비용과 로그를 먹는다.
            answer: 최대 수신 횟수를 정해 DLQ로 보낸다
            wrong:
              - 가시성 제한 시간을 0으로 줄인다
              - 큐를 FIFO 큐로 바꾼다
              - 소비자 워커를 더 늘린다
        explain: <p>재드라이브 정책에 <b>maxReceiveCount</b>를 정하면, 그 횟수만큼 받아 갔는데도 지워지지 않은 메시지를 <b>DLQ</b>로 옮긴다. 정상 메시지 처리를 막지 않고, 실패한 메시지는 따로 살펴보거나 고친 뒤 다시 보낼 수 있다.</p>
      - id: aws-db-q-fanout
        tag: SNS
        title: 하나의 이벤트를 여러 곳에
        type: mcq
        quizzes:
          - q: 주문이 들어오면 결제·알림·분석 서비스가 각자 같은 이벤트를 받아 따로 처리해야 한다.
            answer: SNS 토픽에 서비스별 SQS 큐를 구독시킨다
            wrong:
              - SQS 큐 하나를 세 서비스가 같이 읽는다
              - SQS FIFO 큐 하나를 세 서비스가 같이 읽는다
              - SQS 큐 하나에 소비자 그룹을 세 개 만든다
        explain: <p>SQS 큐 하나를 여러 소비자가 읽으면 메시지 하나를 <b>한 소비자만</b> 가져간다(일을 나눠 가짐). 모두가 받아야 하면 <b>SNS 토픽 → 여러 SQS 큐(팬아웃)</b>로 복사해서 보낸다. 서비스마다 자기 큐가 있어 속도도, 장애도 서로 영향을 덜 준다.</p>
