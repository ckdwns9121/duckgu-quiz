id: aws-compute
name: EC2 · Lambda · 컨테이너
color: "#ED7100"
dark: "#BD5A00"
part: PART 3
lede: 서버를 어떻게 사고, 어디에 데이터를 두고, Lambda가 어떻게 재사용되는지처럼 비용과 장애로 바로 이어지는 선택을 다룹니다.
blocks:
  - items:
      - id: aws-cmp-q-spot
        tag: 구매 옵션
        title: 가장 싸게 돌리기
        type: mcq
        quizzes:
          - q: 밤새 도는 배치 작업이 중간에 끊겨도 다시 이어서 할 수 있다. 가장 싸게 돌리려면?
            answer: 스팟 인스턴스
            wrong:
              - 온디맨드 인스턴스
              - 전용 호스트
              - 예약 인스턴스 3년
          - q: 스팟 인스턴스를 AWS가 회수할 때 미리 받는 알림은?
            answer: 2분 전 중단 알림
            wrong:
              - 24시간 전 이메일
              - 알림 없이 바로 종료
              - 1시간 전 콘솔 알림
        explain: <p>스팟은 남는 용량을 크게 할인해서 쓰는 대신, AWS가 용량이 필요하면 <b>2분 전 알림</b> 후 회수한다. 그래서 중단돼도 괜찮은 작업(배치, CI, 이미지 변환)에 쓰고, 알림을 받으면 작업 상태를 저장한다. 1년 이상 꾸준히 도는 서버는 Savings Plans나 예약 인스턴스가 싸다.</p>
      - id: aws-cmp-q-store
        tag: 스토리지
        title: 인스턴스 스토어의 데이터
        type: mcq
        quizzes:
          - q: 인스턴스 스토어에 저장한 파일은 인스턴스를 중지했다가 다시 시작하면?
            answer: 사라진다
            wrong:
              - 그대로 남는다
              - 자동으로 EBS 스냅샷에 백업된다
              - 중지 전에 저장한 파일만 남는다
          - q: 인스턴스 스토어의 파일은 재부팅하면?
            answer: 그대로 남는다
            wrong:
              - 사라진다
              - 미리 스냅샷을 찍어 둔 것만 남는다
              - 루트 볼륨일 때만 남는다
        explain: <p>인스턴스 스토어는 호스트 서버에 붙은 디스크라 매우 빠르지만 <b>임시</b>다. 재부팅에서는 남지만, <b>중지·최대 절전·종료</b>하면 데이터가 사라진다(다른 호스트로 옮겨질 수 있어서). 남아야 하는 데이터는 EBS나 S3에 둔다.</p>
      - id: aws-cmp-q-ebs
        tag: EBS
        title: 다른 AZ로 볼륨 옮기기
        type: mcq
        quizzes:
          - q: ap-northeast-2a에 있는 EBS 볼륨을 2c의 EC2에 붙이려면?
            answer: 스냅샷을 만들어 2c에서 새 볼륨으로 복원한다
            wrong:
              - 분리(detach)한 뒤 2c 인스턴스에 바로 붙인다
              - 같은 리전이라 그냥 붙일 수 있다
              - 볼륨 유형을 io2로 바꾸면 붙는다
        explain: <p>EBS 볼륨은 <b>만들어진 가용 영역(AZ)에 묶여</b> 있어서 같은 AZ의 인스턴스에만 붙는다. 다른 AZ로 옮기려면 스냅샷(S3에 저장돼 리전 전체에서 쓸 수 있음)으로 새 볼륨을 만든다. 여러 AZ에서 같은 파일을 봐야 하면 EFS를 쓴다.</p>
      - id: aws-cmp-q-asg
        tag: 오토 스케일링
        title: 고장 난 서버가 안 바뀔 때
        type: mcq
        quizzes:
          - q: ALB 뒤의 오토 스케일링 그룹에서 앱이 계속 500만 내는데 인스턴스가 교체되지 않는다. 가장 흔한 원인은?
            answer: ELB 상태 검사를 켜지 않아서 (기본은 EC2 검사)
            wrong:
              - ALB 헬스 체크는 500을 정상으로 봐서
              - 오토 스케일링은 하루에 한 번만 검사해서
              - 최소 용량이 1이라 교체할 여유가 없어서
        explain: "<p>오토 스케일링 그룹은 기본으로 <b>EC2 상태 검사</b>(하드웨어·OS가 살아 있나)만 본다. 앱이 망가져도 OS는 살아 있으면 정상이다. <b>ELB 상태 검사</b>를 켜면 로드 밸런서의 헬스 체크(예: /health가 200인지)에 실패한 인스턴스를 교체한다.</p>"
      - id: aws-cmp-q-timeout
        tag: Lambda
        title: 오래 걸리는 작업
        type: mcq
        quizzes:
          - q: 20분 걸리는 영상 변환을 Lambda 하나로 처리하려 한다. 어떻게 될까?
            answer: 안 된다. 최대 실행 시간이 15분이다
            wrong:
              - 된다. 타임아웃을 20분으로 설정하면
              - 된다. 메모리를 늘리면 제한도 늘어난다
              - 된다. 비동기로 호출하면 제한이 없다
        explain: <p>Lambda 한 번의 실행은 <b>최대 900초(15분)</b>다. 더 긴 작업은 잘게 나눠 Step Functions로 잇거나, 컨테이너(ECS Fargate)나 AWS Batch로 돌린다. 메모리를 늘리면 CPU도 늘어 빨라질 수는 있지만 시간 제한 자체는 그대로다.</p>
      - id: aws-cmp-q-reuse
        tag: Lambda
        title: 핸들러 밖의 코드
        type: mcq
        code: |-
          const db = createConnection(); // 핸들러 밖

          export const handler = async (event) => {
            return db.query('SELECT 1');
          };
        quizzes:
          - q: 핸들러 밖에서 만든 DB 연결 db는 어떻게 될까?
            answer: 실행 환경이 재사용되면 다음 호출에서도 그대로 쓰인다
            wrong:
              - 호출마다 새로 만들어진다
              - Lambda가 핸들러 밖 코드를 실행하지 않는다
              - 첫 호출이 끝나면 항상 버려진다
        explain: <p>Lambda는 호출이 끝난 실행 환경을 한동안 살려 두고 <b>다음 호출에 재사용</b>한다(웜 스타트). 핸들러 밖 코드는 환경이 처음 만들어질 때 한 번만 실행되므로 SDK 클라이언트, DB 연결을 여기서 만들면 호출마다 다시 만들지 않아도 된다. 대신 요청마다 달라야 하는 값을 여기 두면 다른 요청에 섞인다.</p>
      - id: aws-cmp-q-concurrency
        tag: Lambda
        title: 동시성 설정
        type: mcq
        quizzes:
          - q: 첫 요청이 느린 콜드 스타트를 줄이려고 실행 환경을 미리 준비해 두는 설정은?
            answer: 프로비저닝된 동시성
            wrong:
              - 예약된 동시성
              - 타임아웃 늘리기
              - 메모리 줄이기
          - q: 다른 함수가 계정 동시성을 다 써도 결제 함수는 100개를 쓸 수 있게 보장하고, 동시에 100개는 넘지 않게 하는 설정은?
            answer: 예약된 동시성
            wrong:
              - 프로비저닝된 동시성
              - 타임아웃 늘리기
              - SQS 배치 크기 늘리기
        explain: "<p><b>예약된 동시성</b>: 이 함수 몫으로 떼어 두는 개수. 보장이면서 동시에 <b>상한</b>이다(DB가 버틸 만큼만 돌리게 할 때도 쓴다). <b>프로비저닝된 동시성</b>: 실행 환경을 <b>미리 초기화</b>해 두어 콜드 스타트를 없앤다(켜 둔 시간만큼 요금).</p>"
      - id: aws-cmp-q-async
        tag: Lambda
        title: 비동기 호출에서 난 에러
        type: mcq
        quizzes:
          - q: S3 이벤트처럼 비동기로 호출된 Lambda가 에러를 던지면?
            answer: Lambda가 기본으로 두 번 더 재시도한다
            wrong:
              - 재시도 없이 이벤트가 사라진다
              - 성공할 때까지 무한히 재시도한다
              - 에러가 S3로 돌아가 업로드가 취소된다
        explain: <p>비동기 호출은 Lambda가 내부 큐에 넣고 실행하며, 함수 에러가 나면 <b>기본 2번 더 재시도</b>한다(재시도 횟수·최대 이벤트 나이는 설정 가능). 그래서 같은 이벤트가 여러 번 처리될 수 있으니 함수는 <b>멱등</b>하게 짜고, 끝까지 실패한 이벤트는 실패 대상(SQS·SNS)이나 DLQ로 보낸다.</p>
      - id: aws-cmp-q-fargate
        tag: 컨테이너
        title: 서버 없이 컨테이너 돌리기
        type: mcq
        quizzes:
          - q: EC2 서버를 만들고 패치하는 일 없이 컨테이너만 돌리고 싶다.
            answer: ECS on Fargate
            wrong:
              - ECS on EC2
              - EC2에 Docker를 직접 설치
              - EKS 관리형 노드 그룹
        explain: <p><b>Fargate</b>는 컨테이너가 돌 서버를 AWS가 관리해서, 작업(Task)에 CPU·메모리만 정해 주면 된다. ECS on EC2나 EKS 노드 그룹은 컨테이너를 올릴 EC2 인스턴스를 직접 두고 관리해야 한다. 대신 Fargate는 같은 자원이면 보통 더 비싸다.</p>
