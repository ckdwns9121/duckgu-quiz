id: aws-iam
name: IAM · 보안
color: "#DD344C"
dark: "#B0263B"
part: PART 1
lede: 누가 무엇을 할 수 있는지 정하는 IAM은 AWS 사고의 가장 흔한 원인입니다. 정책이 겹칠 때 무엇이 이기는지, 키를 어떻게 다뤄야 하는지를 상황으로 익힙니다.
blocks:
  - items:
      - id: aws-iam-q-deny
        tag: 정책 평가
        title: Allow와 Deny가 겹치면
        type: mcq
        quizzes:
          - q: 사용자 정책은 s3:*를 Allow, 그룹 정책은 s3:DeleteObject를 Deny한다. 이 사용자가 객체를 지우면?
            answer: 거부된다
            wrong:
              - 허용된다 (Allow가 하나라도 있으면)
              - 나중에 붙인 정책을 따른다
              - 사용자 정책이 그룹 정책보다 우선해 허용된다
        explain: <p>IAM은 요청에 걸리는 모든 정책을 모아 보고, <b>명시적 Deny가 하나라도 있으면 무조건 거부</b>한다. 그다음 Allow가 있으면 허용, 아무것도 없으면 거부(암묵적 거부)다. 정책을 붙인 순서나 위치(사용자·그룹·역할)는 우선순위가 없다.</p>
      - id: aws-iam-q-implicit
        tag: 정책 평가
        title: 정책이 없는 사용자
        type: mcq
        quizzes:
          - q: 정책을 하나도 붙이지 않은 새 IAM 사용자가 s3:ListBucket을 호출하면?
            answer: 거부된다
            wrong:
              - 같은 계정이라 허용된다
              - 읽기 작업이라 허용된다
              - 루트 사용자가 승인하면 그때 허용된다
        explain: <p>AWS는 <b>기본이 거부</b>다(암묵적 거부). 같은 계정이어도, 읽기여도 명시적으로 Allow한 정책이 있어야 한다. 그래서 새 사용자·역할에는 필요한 권한만 골라 붙인다(최소 권한).</p>
      - id: aws-iam-b-eval
        tag: 정책 평가
        title: 권한 판단 순서
        type: build
        mode: order
        join: " → "
        q: IAM이 요청 하나를 허용할지 판단하는 순서대로 놓으세요.
        tokens:
          - 명시적 Deny가 있으면 거부
          - 명시적 Allow가 있으면 허용
          - 둘 다 없으면 거부
        why: <p class="why">Deny 확인이 먼저라서 Allow가 아무리 많아도 Deny 하나를 못 이긴다. 마지막 단계 때문에 "아무 말 없으면 안 된다"가 기본이다.</p>
        hints:
          - 첫 번째 조각은 <b>명시적 Deny가 있으면 거부</b>
          - Deny 확인이 먼저라서 Allow가 아무리 많아도 Deny 하나를 못 이긴다. 마지막 단계 때문에 "아무 말 없으면 안 된다"가 기본이다.
      - id: aws-iam-q-ec2role
        tag: 자격 증명
        title: EC2 앱의 AWS 권한
        type: mcq
        quizzes:
          - q: EC2에서 도는 앱이 S3 파일을 읽어야 한다. 가장 안전한 방법은?
            answer: EC2에 IAM 역할(인스턴스 프로파일)을 붙인다
            wrong:
              - 액세스 키를 .env 파일에 넣는다
              - 액세스 키를 AMI 이미지에 넣어 둔다
              - 버킷을 공개로 열어 키 없이 읽는다
        explain: <p>역할을 붙이면 SDK가 인스턴스 메타데이터에서 <b>자동으로 임시 자격 증명</b>을 받아 쓰고, 만료되기 전에 알아서 새로 받는다. 오래 사는 액세스 키를 서버에 두면 유출됐을 때 피해가 크다. Lambda, ECS도 같은 방식(실행 역할)이다.</p>
      - id: aws-iam-q-sts
        tag: 자격 증명
        title: 역할을 맡으면 받는 것
        type: mcq
        quizzes:
          - q: sts:AssumeRole로 역할을 맡으면 받는 자격 증명은?
            answer: 만료 시간이 있는 임시 자격 증명
            wrong:
              - 만료되지 않는 새 액세스 키
              - 역할 이름과 로그인 비밀번호
              - 역할을 만든 사람의 액세스 키
        explain: <p>AssumeRole은 액세스 키 ID, 비밀 키, <b>세션 토큰</b> 세 개와 만료 시각을 준다. 기본 1시간이고 정해진 범위에서 늘릴 수 있다. 세 개를 모두 써야 요청이 서명되고, 만료되면 다시 받아야 한다.</p>
      - id: aws-iam-q-root
        tag: 계정
        title: 팀원 계정 나누기
        type: mcq
        quizzes:
          - q: 개발자 3명이 같은 AWS 계정에서 일한다. 로그인을 어떻게 나눌까?
            answer: 각자 사용자를 만들고 필요한 권한만 준다
            wrong:
              - 루트 사용자 하나를 셋이 함께 쓴다
              - IAM 사용자 하나를 만들어 셋이 함께 쓴다
              - 각자 사용자를 만들고 모두 AdministratorAccess를 준다
        explain: <p>사람마다 따로 로그인해야 CloudTrail에 누가 무엇을 했는지 남고, 퇴사자만 골라 막을 수 있다. 권한은 하는 일에 필요한 만큼만(최소 권한), 조직이라면 IAM Identity Center로 사람을 관리한다. 루트 사용자는 결제 정보 변경, 계정 닫기처럼 <b>무엇이든</b> 할 수 있고 정책으로 제한할 수도 없다. 그래서 MFA를 켜고 액세스 키는 만들지 않으며, 일상 작업은 권한을 좁힌 IAM 사용자·역할(또는 IAM Identity Center)로 한다.</p>
      - id: aws-iam-q-leak
        tag: 사고 대응
        title: 공개 저장소에 올라간 키
        type: mcq
        quizzes:
          - q: 실수로 액세스 키를 GitHub 공개 저장소에 푸시했다. 가장 먼저 할 일은?
            answer: 그 키를 비활성화·삭제하고 새 키로 바꾼다
            wrong:
              - 커밋을 지우고 force push한다
              - 저장소를 비공개로 바꾼다
              - 키 파일 이름을 바꿔 다시 커밋한다
        explain: <p>공개 저장소의 키는 자동화된 봇이 <b>몇 분 안에</b> 긁어 간다. 커밋을 지우거나 저장소를 닫아도 이미 복사된 키는 살아 있다. 먼저 키를 무효화하고, CloudTrail에서 그 키로 한 일을 확인한 뒤, 가능하면 키 대신 역할을 쓰도록 바꾼다.</p>
      - id: aws-iam-q-arn
        tag: 정책 작성
        title: Resource에 버킷 이름만 적으면
        type: mcq
        code: |-
          {
            "Effect": "Allow",
            "Action": "s3:GetObject",
            "Resource": "arn:aws:s3:::my-bucket"
          }
        quizzes:
          - q: 이 정책을 가진 사용자가 my-bucket의 파일을 GetObject하면?
            answer: 거부된다. my-bucket/*가 따로 필요하다
            wrong:
              - 허용된다. 버킷 ARN에 안의 객체도 포함된다
              - 허용된다. 같은 계정의 버킷이라서
              - 정책 저장이 거부된다. /*가 꼭 있어야 한다
        explain: <p><code>arn:aws:s3:::my-bucket</code>은 <b>버킷 자체</b>(ListBucket 같은 버킷 작업), <code>arn:aws:s3:::my-bucket/*</code>는 <b>버킷 안 객체</b>(GetObject, PutObject)를 가리킨다. 둘 다 필요하면 Resource에 두 개를 모두 적는다. 가장 흔한 AccessDenied 원인 중 하나.</p>
      - id: aws-iam-q-cross
        tag: 역할
        title: 다른 계정의 역할 맡기
        type: mcq
        quizzes:
          - q: 계정 A의 사용자가 계정 B의 역할을 맡으려면 필요한 것은?
            answer: B의 신뢰 정책에 A를, A 사용자에 AssumeRole 권한
            wrong:
              - B 역할의 권한 정책에 A 계정을 적기만 한다
              - A 사용자에게 AssumeRole 권한만 주면 된다
              - B 계정의 액세스 키를 A 사용자에게 준다
        explain: '<p>역할에는 두 가지 정책이 있다. <b>신뢰 정책</b>은 "누가 이 역할을 맡을 수 있나", <b>권한 정책</b>은 "맡으면 무엇을 할 수 있나". 다른 계정이면 양쪽이 모두 허락해야 한다: B는 신뢰 정책으로 A를 믿고, A는 자기 사용자에게 AssumeRole을 허용한다.</p>'
      - id: aws-iam-q-imds
        tag: EC2 보안
        title: 메타데이터 자격 증명 지키기
        type: mcq
        quizzes:
          - q: EC2 앱의 SSRF 취약점으로 메타데이터(169.254.169.254)의 역할 자격 증명을 빼앗기는 위험을 줄이는 설정은?
            answer: IMDSv2를 필수로 한다 (세션 토큰 요구)
            wrong:
              - 보안 그룹에서 169.254.169.254를 막는다
              - 역할 대신 액세스 키를 쓴다
              - 인스턴스의 퍼블릭 IP를 없앤다
        explain: <p><b>IMDSv2</b>는 먼저 PUT 요청으로 세션 토큰을 받아야 메타데이터를 읽을 수 있어서, 단순히 URL을 대신 요청하게 만드는 SSRF로는 뚫기 어렵다. 메타데이터 주소는 인스턴스 안에서만 닿는 주소라 보안 그룹으로 막는 대상이 아니다.</p>
