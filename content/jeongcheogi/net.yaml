id: net
name: 네트워크
color: "#00CD9C"
dark: "#00A47D"
part: PART 2
lede: 네트워크는 <mark>택배</mark>라고 생각하면 됩니다. 물건(데이터)을 상자에 넣고, 주소를 붙이고, 트럭으로 옮기는 과정을 층층이 나눈 게 OSI 7계층입니다.
blocks:
  - tip: <b>OSI 7계층 외우는 법 (아래 1층부터)</b><span class="mnemo">물 · 데 · 네 · 전 · 세 · 표 · 응</span><span>물리 → 데이터링크 → 네트워크 → 전송 → 세션 → 표현 → 응용. "물 데워서 네가 전해줘, 세 표 응?"처럼 문장으로 붙이세요.</span>
  - table:
      heads:
        - 계층
        - 하는 일
        - 택배로 치면
        - 대표 단어
      rows:
        - id: n-osi7
          term: 7 응용
          sub: Application
          desc: 사람이 직접 쓰는 <b>프로그램과 서비스</b>가 동작하는 층. 웹 보기, 메일, 파일 전송.
          hint: 택배 앱에서 "보내기" 누르기
          extra:
            - HTTP, FTP, SMTP, DNS, Telnet
          short: 사람이 직접 쓰는 프로그램과 서비스가 동작하는 층
        - id: n-osi6
          term: 6 표현
          sub: Presentation
          desc: 데이터를 <b>상대가 알아볼 수 있는 형식</b>으로 바꾼다. 암호화, 압축, 문자 인코딩.
          hint: 물건을 규격 상자에 맞게 포장하기
          extra:
            - JPEG, MPEG, ASCII, 암호화·압축
          short: 데이터를 상대가 알아볼 수 있는 형식으로 바꾼다
        - id: n-osi5
          term: 5 세션
          sub: Session
          desc: 두 컴퓨터 사이의 <b>대화(연결)를 시작하고 유지하고 끝낸다</b>. 중간 저장점(동기점)을 둔다.
          hint: 배송 시작부터 끝까지 일정 관리
          extra:
            - 세션 연결·종료, 동기점(체크포인트)
          short: 두 컴퓨터 사이의 대화(연결)를 시작하고 유지하고 끝낸다
        - id: n-osi4
          term: 4 전송
          sub: Transport
          desc: 보낸 데이터가 <b>빠짐없이 순서대로</b> 도착하게 한다. 잘못되면 다시 보낸다(오류 제어), 너무 빠르면 속도를 맞춘다(흐름 제어).
          hint: 분실되면 다시 보내고, 받는 쪽이 받을 수 있는 만큼만 보내기
          extra:
            - "TCP, UDP / 단위: <b>세그먼트</b>"
          short: 보낸 데이터가 빠짐없이 순서대로 도착하게 한다
        - id: n-osi3
          term: 3 네트워크
          sub: Network
          desc: <b>IP 주소</b>를 보고 목적지까지 <b>가장 좋은 길</b>을 찾는다(라우팅).
          hint: 주소 보고 어느 물류센터를 거쳐 갈지 정하기
          extra:
            - "IP, ICMP, ARP, <b>라우터</b> / 단위: <b>패킷</b>"
          short: IP 주소를 보고 목적지까지 가장 좋은 길을 찾는다(라우팅)
        - id: n-osi2
          term: 2 데이터링크
          sub: Data Link
          desc: <b>MAC 주소</b>로 바로 옆 장비까지 전달하고 오류를 검사한다.
          hint: 동네 집배원이 옆 건물까지 배달
          extra:
            - "이더넷, <b>스위치</b>, 브리지 / 단위: <b>프레임</b>"
          short: MAC 주소로 바로 옆 장비까지 전달하고 오류를 검사한다
        - id: n-osi1
          term: 1 물리
          sub: Physical
          desc: 0과 1을 <b>전기 신호·빛·전파</b>로 바꿔 실제로 선을 타고 보낸다.
          hint: 도로와 트럭 그 자체
          extra:
            - "케이블, <b>허브, 리피터</b> / 단위: <b>비트</b>"
          short: 0과 1을 전기 신호·빛·전파로 바꿔 실제로 선을 타고 보낸다
  - group: 꼭 나오는 네트워크 용어
  - table:
      heads:
        - 용어
        - 뜻
        - 예시 · 외우는 법
      rows:
        - id: n-tcp
          term: TCP
          sub: Transmission Control Protocol
          desc: <b>연결을 맺고</b>, <b>빠짐없이 순서대로</b> 도착했는지 확인하며 보낸다. 못 받은 건 다시 보낸다.
          hint: 등기 우편. 도착 확인까지 받아서 느리지만 확실함. 웹, 이메일, 파일 전송에 사용
          short: 연결을 맺고, 빠짐없이 순서대로 도착했는지 확인하며 보낸다
        - id: n-udp
          term: UDP
          sub: User Datagram Protocol
          desc: 연결 없이 <b>그냥 바로 보내는</b> 방식. 도착 확인을 안 해서 빠르지만 중간에 빠져도 모른다.
          hint: "전단지 뿌리기. 조금 빠져도 괜찮고 빠른 게 중요한 곳: 영상 스트리밍, 게임, DNS"
          short: 연결 없이 그냥 바로 보내는 방식
        - id: n-3way
          term: 3-Way Handshake
          desc: "TCP가 연결을 맺는 3단계: ① <b>SYN</b>(연결하자) → ② <b>SYN+ACK</b>(좋아, 너도 들려?) → ③ <b>ACK</b>(응, 들려)."
          hint: '전화: "여보세요?" → "네, 들려요. 제 말도 들려요?" → "네, 들려요." 이후 대화 시작'
          quiz: false
        - id: n-ip
          term: IPv4 / IPv6
          desc: IPv4 = <mark>32비트</mark>, 8비트씩 4덩어리를 점으로 구분 (192.168.0.1). IPv6 = <mark>128비트</mark>, 16비트씩 8덩어리를 콜론으로 구분 (2001:db8::1).
          hint: IPv4 주소가 부족해서 IPv6가 나옴. IPv6에는 <b>브로드캐스트가 없고</b> 유니캐스트(1:1)·멀티캐스트(1:그룹)·애니캐스트(1:가장 가까운 하나)가 있음
          short: IPv4 = 32비트, 8비트씩 4덩어리를 점으로 구분 (192.168.0.1)
          segments:
            - label: IPv4
              text: 32비트, 8비트씩 4덩어리를 점으로 구분 (192.168.0.1)
            - label: IPv6
              text: 128비트, 16비트씩 8덩어리를 콜론으로 구분 (2001:db8::1)
        - id: n-arp
          term: ARP / RARP
          sub: Address Resolution Protocol
          desc: "<b>ARP</b>: IP 주소로 <b>MAC 주소</b>를 알아낸다(MAC = 랜카드 고유 번호). <b>RARP</b>: 반대로 MAC 주소로 IP 주소를 알아낸다."
          hint: R = Reverse(거꾸로). ARP = 이름(IP)으로 얼굴(MAC) 찾기
          short: "ARP: IP 주소로 MAC 주소를 알아낸다(MAC = 랜카드 고유 번호)"
          segments:
            - label: ARP
              text: IP 주소로 MAC 주소를 알아낸다(MAC = 랜카드 고유 번호)
            - label: RARP
              text: 반대로 MAC 주소로 IP 주소를 알아낸다
        - id: n-icmp
          term: ICMP
          sub: Internet Control Message Protocol
          desc: 네트워크에서 <b>오류가 났거나 상태를 알려줄 때</b> 쓰는 메시지 프로토콜. "목적지에 도달할 수 없음" 같은 알림.
          hint: <code>ping</code> 명령어가 ICMP를 씀. Smurf, Ping of Death 공격에도 등장
          short: 네트워크에서 오류가 났거나 상태를 알려줄 때 쓰는 메시지 프로토콜
        - id: n-dns
          term: DNS
          sub: Domain Name System
          desc: <b>도메인 이름</b>(naver.com)을 <b>IP 주소</b>로 바꿔 준다. 사람은 이름을 외우고, 컴퓨터는 IP로 찾아간다.
          hint: 전화번호부. 이름을 찾으면 번호가 나옴. 포트 53
          short: 도메인 이름(naver.com)을 IP 주소로 바꿔 준다
        - id: n-dhcp
          term: DHCP
          sub: Dynamic Host Configuration Protocol
          desc: 네트워크에 접속한 기기에 <b>IP 주소를 자동으로 빌려 준다</b>.
          hint: 카페 와이파이에 붙으면 IP를 직접 안 넣어도 인터넷이 되는 이유
          short: 네트워크에 접속한 기기에 IP 주소를 자동으로 빌려 준다
        - id: n-nat
          term: NAT
          sub: Network Address Translation
          desc: 내부에서 쓰는 <b>사설 IP</b>를 인터넷에 나갈 때 <b>공인 IP</b>로 바꿔 준다. 공인 IP 하나로 여러 기기가 인터넷을 쓴다.
          hint: 회사 대표번호 하나로 여러 내선 전화를 쓰는 것. 집 공유기가 하는 일
          short: 내부에서 쓰는 사설 IP를 인터넷에 나갈 때 공인 IP로 바꿔 준다
        - id: n-rip
          term: RIP / OSPF / BGP
          desc: "<b>RIP</b>: 거리(거쳐 가는 라우터 수, 홉)로 길을 고름. <mark>최대 15홉</mark>, 소규모용. <b>OSPF</b>: 네트워크 전체 지도(링크 상태)를 보고 고름, 대규모용. <b>BGP</b>: 서로 다른 조직 네트워크(AS)끼리 길을 주고받음."
          hint: RIP = 정거장 수만 셈, OSPF = 지도 앱처럼 전체 상황 보고 판단, BGP = 나라끼리 국경 도로 협의
          short: "RIP: 거리(거쳐 가는 라우터 수, 홉)로 길을 고름"
          segments:
            - label: RIP
              text: 거리(거쳐 가는 라우터 수, 홉)로 길을 고름
            - label: OSPF
              text: 네트워크 전체 지도(링크 상태)를 보고 고름, 대규모용
            - label: BGP
              text: 서로 다른 조직 네트워크(AS)끼리 길을 주고받음
        - id: n-dev
          term: 장비와 계층
          desc: "<b>1계층</b>: 허브, 리피터 (신호만 키우거나 뿌림). <b>2계층</b>: 스위치, 브리지 (MAC 주소 보고 전달). <b>3계층</b>: 라우터 (IP 주소 보고 길 찾기)."
          hint: 장비가 똑똑할수록 층이 높다. 허브는 무조건 다 뿌림 → 스위치는 받을 사람한테만 → 라우터는 다른 네트워크까지 길 찾기
          quiz: false
  - group: 포트 번호 (숫자로 자주 나옴)
  - table:
      heads:
        - 프로토콜
        - 포트
        - 하는 일
      rows:
        - id: n-p-ftp
          term: FTP 데이터 / FTP 제어
          desc: <b>20</b> / <b>21</b>
          hint: "파일 전송. 두 개를 씀: 명령은 21, 실제 파일은 20"
          short: 20 / 21
          segments:
            - label: FTP 데이터
              text: "20"
            - label: FTP 제어
              text: "21"
        - id: n-p-ssh
          term: SSH / Telnet
          desc: <b>22</b> / <b>23</b>
          hint: 원격 접속. SSH는 <b>암호화</b>해서 안전, Telnet은 암호화 없이 그대로(평문) 보내서 위험. 22가 더 안전한 쪽
          short: 22 / 23
          segments:
            - label: SSH
              text: "22"
            - label: Telnet
              text: "23"
        - id: n-p-smtp
          term: SMTP / POP3 / IMAP
          desc: <b>25</b> / <b>110</b> / <b>143</b>
          hint: SMTP = 메일 <b>보내기</b>. POP3 = 메일을 내 PC로 <b>가져오기</b>(서버에서 지워짐). IMAP = 서버에 <b>두고 보기</b>(폰·PC 동기화)
          short: 25 / 110 / 143
          segments:
            - label: SMTP
              text: "25"
            - label: POP3
              text: "110"
            - label: IMAP
              text: "143"
        - id: n-p-dns
          term: DNS
          desc: <b>53</b>
          hint: 도메인 이름을 IP로 바꿔 줌
          short: "53"
        - id: n-p-http
          term: HTTP / HTTPS
          desc: <b>80</b> / <b>443</b>
          hint: 웹사이트. HTTPS는 HTTP에 암호화(TLS)를 더한 것. 주소창 자물쇠 = 443
          short: 80 / 443
          segments:
            - label: HTTP
              text: "80"
            - label: HTTPS
              text: "443"
  - tip: <b>서브넷 계산 한 가지만</b><span><code>/26</code> 같은 숫자는 앞에서부터 1인 비트 수. 한 서브넷 주소 수 = <mark>2^(32−n)</mark>, 쓸 수 있는 호스트 = 그 값 −2 (네트워크 주소, 브로드캐스트 주소 제외).</span><span>예) 192.168.1.0/26 → 2^6 = 64개씩 4개로 나뉨 → 호스트 62개. 서브넷 마스크는 255.255.255.192.</span>
  - group: 조각으로 만들기
  - items:
      - id: b-osi
        tag: 순서
        title: OSI 7계층 순서
        type: build
        mode: order
        join: " → "
        q: 아래(1계층)부터 위(7계층)까지 순서대로 놓으세요.
        tokens:
          - 물리
          - 데이터링크
          - 네트워크
          - 전송
          - 세션
          - 표현
          - 응용
        why: '<p class="why"><b>외우는 법</b>: 아래부터 "<mark>물 데 네 전 세 표 응</mark>". 택배로 치면 도로(물리) → 동네 집배원(데이터링크) → 경로 정하기(네트워크) → 분실 시 재전송(전송) → 배송 예약(세션) → 포장(표현) → 택배 앱(응용).</p>'
        hints:
          - 첫 번째 조각은 <b>물리</b>
          - '<b>외우는 법</b>: 아래부터 "<mark>물 데 네 전 세 표 응</mark>". 택배로 치면 도로(물리) → 동네 집배원(데이터링크) → 경로 정하기(네트워크) → 분실 시 재전송(전송) → 배송 예약(세션) → 포장(표현) → 택배 앱(응용).'
      - id: b-tcpip
        tag: 순서
        title: TCP/IP 4계층 순서
        type: build
        mode: order
        join: " → "
        q: 아래부터 위까지 순서대로 놓으세요.
        tokens:
          - 네트워크 액세스
          - 인터넷
          - 전송
          - 응용
        why: <p class="why">OSI 7계층을 4개로 묶은 것. 물리·데이터링크 → <b>네트워크 액세스</b>, 네트워크 → <b>인터넷</b>(IP), 전송 → <b>전송</b>(TCP·UDP), 세션·표현·응용 → <b>응용</b>. 세션 계층은 따로 없다.</p>
        hints:
          - 첫 번째 조각은 <b>네트워크 액세스</b>
          - OSI 7계층을 4개로 묶은 것. 물리·데이터링크 → <b>네트워크 액세스</b>, 네트워크 → <b>인터넷</b>(IP), 전송 → <b>전송</b>(TCP·UDP), 세션·표현·응용 → <b>응용</b>. 세션 계층은 따로 없다.
      - id: b-3way
        tag: 순서
        title: TCP 3-Way Handshake
        type: build
        mode: order
        join: " → "
        q: TCP가 연결을 맺을 때 주고받는 순서대로 놓으세요.
        tokens:
          - SYN
          - SYN+ACK
          - ACK
        why: <p class="why">"여보세요?"(SYN) → "네, 들려요. 제 말도 들려요?"(SYN+ACK) → "네"(ACK). <mark>FIN은 연결을 끊을 때</mark>, RST는 강제로 끊을 때 쓴다.</p>
        hints:
          - 첫 번째 조각은 <b>SYN</b>
          - '"여보세요?"(SYN) → "네, 들려요. 제 말도 들려요?"(SYN+ACK) → "네"(ACK). <mark>FIN은 연결을 끊을 때</mark>, RST는 강제로 끊을 때 쓴다.'
      - id: b-dhcp
        tag: 영문
        title: DHCP 풀네임
        type: build
        mode: fullname
        join: " "
        decoys:
          - Domain
          - Control
        q: DHCP의 영문 풀네임을 만드세요.
        tokens:
          - Dynamic
          - Host
          - Configuration
          - Protocol
