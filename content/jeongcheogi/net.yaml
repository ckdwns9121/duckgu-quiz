      - id: q-dev
        tag: 개념
        title: 네트워크 장비의 계층
        type: mcq
        quizzes:
          - q: 스위치는 OSI 몇 계층 장비일까?
            answer: 2계층 (데이터링크)
            wrong:
              - 1계층 (물리)
              - 3계층 (네트워크)
              - 4계층 (전송)
            hints:
              - 장비가 똑똑할수록 층이 높다. 허브는 무조건 다 뿌리고, 스위치는 받을 사람한테만, 라우터는 네트워크 밖까지.
          - q: IP 주소를 보고 다른 네트워크로 가는 길을 찾는 장비는?
            answer: 라우터
            wrong:
              - 스위치
              - 허브
              - 브리지
        explain: '<p><b>1계층</b>: 허브, 리피터(신호만 키우거나 뿌림). <b>2계층</b>: 스위치, 브리지(MAC 주소를 보고 받을 장비에게만 전달). <b>3계층</b>: 라우터(IP 주소를 보고 다른 네트워크까지 길 찾기).</p><p class="why">장비가 똑똑할수록 층이 높다. 허브는 무조건 다 뿌리고, 스위치는 받을 사람한테만, 라우터는 네트워크 밖까지.</p>'
