id: swe
name: 소프트웨어 공학
color: "#FF6FAE"
dark: "#D9508E"
part: PART 5
lede: 결합도·응집도, 테스트 단계, 개발 모델은 <mark>순서</mark>를 묻는 문제가 많습니다. 앞글자로 외우고 조각을 맞추며 확인하세요.
blocks:
  - items:
      - id: b-coupling
        tag: 순서
        title: 결합도 순서
        type: build
        mode: order
        join: " → "
        q: 결합도가 약한 것(좋은 것)부터 강한 것(나쁜 것)까지 순서대로 놓으세요.
        tokens:
          - 자료
          - 스탬프
          - 제어
          - 외부
          - 공통
          - 내용
        why: '<p class="why"><b>외우는 법</b>: "<mark>자 스 제 외 공 내</mark>". 결합도는 모듈끼리 얼마나 얽혔는지라서 <b>약할수록 좋다</b>. 필요한 값만 넘기면 자료 결합도, 남의 내부를 직접 건드리면 내용 결합도.</p>'
        hints:
          - 첫 번째 조각은 <b>자료</b>
          - '<b>외우는 법</b>: "<mark>자 스 제 외 공 내</mark>". 결합도는 모듈끼리 얼마나 얽혔는지라서 <b>약할수록 좋다</b>. 필요한 값만 넘기면 자료 결합도, 남의 내부를 직접 건드리면 내용 결합도.'
      - id: b-cohesion
        tag: 순서
        title: 응집도 순서
        type: build
        mode: order
        join: " → "
        q: 응집도가 강한 것(좋은 것)부터 약한 것(나쁜 것)까지 순서대로 놓으세요.
        tokens:
          - 기능적
          - 순차적
          - 교환적
          - 절차적
          - 시간적
          - 논리적
          - 우연적
        why: '<p class="why"><b>외우는 법</b>: "<mark>기 순 교 절 시 논 우</mark>". 응집도는 한 모듈 안이 얼마나 한 가지 일에 모였는지라서 <b>강할수록 좋다</b>. 결합도는 약할수록, 응집도는 강할수록 좋은 설계.</p>'
        hints:
          - 첫 번째 조각은 <b>기능적</b>
          - '<b>외우는 법</b>: "<mark>기 순 교 절 시 논 우</mark>". 응집도는 한 모듈 안이 얼마나 한 가지 일에 모였는지라서 <b>강할수록 좋다</b>. 결합도는 약할수록, 응집도는 강할수록 좋은 설계.'
      - id: b-vmodel
        tag: 순서
        title: 테스트 단계 순서
        type: build
        mode: order
        join: " → "
        q: 소프트웨어 테스트 단계를 작은 것부터 순서대로 놓으세요.
        tokens:
          - 단위 테스트
          - 통합 테스트
          - 시스템 테스트
          - 인수 테스트
        why: <p class="why">함수 하나(단위) → 모듈을 합쳐서(통합) → 전체 시스템(시스템) → 사용자가 받아들일지(인수). V-모델에서 각각 구현·설계·분석·요구사항 단계와 짝을 이룬다. 회귀 테스트는 고친 뒤 다시 확인하는 테스트라 순서 단계가 아니다.</p>
        hints:
          - 첫 번째 조각은 <b>단위 테스트</b>
          - 함수 하나(단위) → 모듈을 합쳐서(통합) → 전체 시스템(시스템) → 사용자가 받아들일지(인수). V-모델에서 각각 구현·설계·분석·요구사항 단계와 짝을 이룬다. 회귀 테스트는 고친 뒤 다시 확인하는 테스트라 순서 단계가 아니다.
      - id: b-waterfall
        tag: 순서
        title: 폭포수 모델 순서
        type: build
        mode: order
        join: " → "
        q: 폭포수 모델의 개발 단계를 순서대로 놓으세요.
        tokens:
          - 계획
          - 요구 분석
          - 설계
          - 구현
          - 테스트
          - 유지보수
        why: <p class="why">물이 위에서 아래로만 흐르듯 <b>한 단계를 끝내야 다음 단계</b>로 간다. 프로토타입(시제품을 먼저 보여 주기)은 프로토타입 모델의 특징.</p>
        hints:
          - 첫 번째 조각은 <b>계획</b>
          - 물이 위에서 아래로만 흐르듯 <b>한 단계를 끝내야 다음 단계</b>로 간다. 프로토타입(시제품을 먼저 보여 주기)은 프로토타입 모델의 특징.
      - id: b-integration
        tag: 순서
        title: 하향식 통합 테스트
        type: build
        mode: order
        join: " → "
        q: 하향식 통합 테스트에서 모듈을 합치는 순서대로 놓으세요.
        tokens:
          - 상위 모듈
          - 중간 모듈
          - 하위 모듈
        why: <p class="why">하향식은 <b>위에서 아래로</b> 합치고, 아직 없는 아래 모듈은 가짜 모듈인 <mark>스텁(Stub)</mark>으로 대신한다. 상향식은 반대로 아래부터 합치고 <mark>드라이버(Driver)</mark>를 쓴다.</p>
        hints:
          - 첫 번째 조각은 <b>상위 모듈</b>
          - 하향식은 <b>위에서 아래로</b> 합치고, 아직 없는 아래 모듈은 가짜 모듈인 <mark>스텁(Stub)</mark>으로 대신한다. 상향식은 반대로 아래부터 합치고 <mark>드라이버(Driver)</mark>를 쓴다.
heading: 소프트웨어 공학, 순서로 외우기
