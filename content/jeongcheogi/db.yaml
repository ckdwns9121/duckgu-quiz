id: db
name: DB 이론
color: "#FF4B4B"
dark: "#EA2B2B"
part: PART 1.5 · 데이터베이스
lede: DB는 용어가 비슷해서 헷갈립니다. <mark>엑셀 표 하나</mark>를 떠올리면서 보세요. 표 = 테이블, 가로줄 = 행, 세로줄 = 열입니다.
blocks:
  - tip: '<b>"무결성"이 두 번 나오는 이유</b><span>무결성은 한마디로 <mark>데이터가 틀리지 않고 올바른 상태</mark>라는 뜻입니다.</span><span><b>보안에서</b>: 허락 없이 데이터를 못 바꾸게 지키는 것 (CIA의 I). <b>DB에서</b>: 규칙에 안 맞는 데이터가 아예 못 들어오게 막는 것 (무결성 제약조건). 뜻은 같고 보는 쪽만 다릅니다.</span>'
  - group: 관계형 DB 기본 용어
  - table:
      heads:
        - 용어
        - 뜻
        - 엑셀로 치면 / 외우는 법
      rows:
        - id: d-rel
          term: 릴레이션
          sub: Relation
          desc: 데이터를 담는 <b>표 하나</b>. 관계형 DB에서는 테이블을 릴레이션이라고 부른다.
          hint: 엑셀 시트 한 장. 예) 학생 표, 학과 표
          short: 데이터를 담는 표 하나
        - id: d-tuple
          term: 튜플
          sub: Tuple
          desc: 표의 <b>가로 한 줄</b>. 대상 하나에 대한 정보 묶음. 레코드, 행이라고도 한다.
          hint: 학생 표에서 (2024001, 홍길동, 컴공, 3) 한 줄 = 학생 한 명
          short: 표의 가로 한 줄
        - id: d-attr
          term: 속성
          sub: Attribute
          desc: 표의 <b>세로 한 줄</b>. 데이터의 항목 이름. 열, 컬럼, 필드라고도 한다.
          hint: 학번, 이름, 학과, 학년 각각이 속성
          short: 표의 세로 한 줄
        - id: d-domain
          term: 도메인
          sub: Domain
          desc: 한 속성에 <b>들어갈 수 있는 값의 범위</b>. 이 밖의 값은 들어가면 안 된다.
          hint: 성별 → {남, 여}만 가능. 학년 → 1~4만 가능. 학년에 7이 들어가면 도메인 위반
          short: 한 속성에 들어갈 수 있는 값의 범위
        - id: d-degree
          term: 차수
          sub: Degree
          desc: 표에 있는 <mark>속성(세로줄)의 개수</mark>.
          hint: 학생(학번, 이름, 학과, 학년) → 차수 4. 표를 설계할 때 정해지고 잘 안 바뀐다
          short: 표에 있는 속성(세로줄)의 개수
        - id: d-card
          term: 카디널리티
          sub: Cardinality
          desc: 표에 들어 있는 <mark>튜플(가로줄)의 개수</mark>.
          hint: 학생이 5명이면 카디널리티 5. 학생을 한 명 추가하면 6으로 바뀐다. "카드 = 사람 수"로 외우기
          short: 표에 들어 있는 튜플(가로줄)의 개수
        - id: d-schema
          term: 스키마 / 인스턴스
          desc: "<b>스키마</b>: 표의 구조(어떤 열이 있고 타입이 뭔지). <b>인스턴스</b>: 어느 순간 실제로 들어 있는 데이터."
          hint: 스키마 = 빈 회원가입 양식, 인스턴스 = 사람들이 채워 넣은 양식들
          short: "스키마: 표의 구조(어떤 열이 있고 타입이 뭔지)"
          segments:
            - label: 스키마
              text: 표의 구조(어떤 열이 있고 타입이 뭔지)
            - label: 인스턴스
              text: 어느 순간 실제로 들어 있는 데이터
  - items:
      - id: d-q1
        tag: 연습
        title: 차수와 카디널리티
        type: answer
        code: |-
          학생(학번, 이름, 학과, 학년)
          행 5개가 들어 있음
        q: 차수와 카디널리티는?
        answer: 차수 4, 카디널리티 5
        steps:
          - "열(속성) 세기: 학번, 이름, 학과, 학년 → <b>4개 = 차수</b>"
          - "행(튜플) 세기: 5명 → <b>5개 = 카디널리티</b>"
        why: "<b>기억할 것</b>: <mark>차수 = 세로줄(열) 수, 카디널리티 = 가로줄(행) 수</mark>. 사람(카드)이 늘면 카디널리티가 는다."
        hints:
          - "열(속성) 세기: 학번, 이름, 학과, 학년 → <b>4개 = 차수</b>"
          - "<b>기억할 것</b>: <mark>차수 = 세로줄(열) 수, 카디널리티 = 가로줄(행) 수</mark>. 사람(카드)이 늘면 카디널리티가 는다."
      - id: d-q2
        tag: 연습
        title: 무슨 무결성 위반?
        type: answer
        code: |-
          학생 테이블 기본키 = 학번
          INSERT 학생 VALUES (NULL, '홍길동', ...)
        q: 어떤 무결성을 어겼나?
        answer: 개체 무결성
        steps:
          - 학번은 이 테이블의 <b>기본키</b> (학생 한 명을 구별하는 값)
          - 학번에 NULL을 넣으면 이 학생이 누군지 구별할 수 없음
          - 기본키는 <b>NULL도 안 되고 중복도 안 됨</b> → 이 규칙이 개체 무결성
        why: "<b>기억할 것</b>: <mark>기본키 문제 = 개체 무결성</mark>. 이름표 없는 학생은 입학 불가."
        hints:
          - 학번은 이 테이블의 <b>기본키</b> (학생 한 명을 구별하는 값)
      - id: d-q3
        tag: 연습
        title: 이것도 무슨 무결성?
        type: answer
        code: |-
          학과 테이블: 컴공, 전자만 있음
          학생.학과(외래키) = '경영'으로 입력
        q: 어떤 무결성을 어겼나?
        answer: 참조 무결성
        steps:
          - 학생.학과는 학과 테이블을 <b>가리키는 외래키</b>
          - 학과 테이블에는 컴공, 전자만 있고 '경영'은 없음
          - 없는 학과를 가리키면 안 됨 → 외래키 값은 <b>상대 테이블에 실제로 있는 값이거나 NULL</b>이어야 함
        why: "<b>기억할 것</b>: <mark>외래키 문제 = 참조 무결성</mark>. 존재하지 않는 반에 배정할 수 없다."
        hints:
          - 학생.학과는 학과 테이블을 <b>가리키는 외래키</b>
  - group: 무결성 제약조건
  - table:
      heads:
        - 종류
        - 규칙
        - 예시 · 외우는 법
      rows:
        - id: d-i-ent
          term: 개체 무결성
          desc: <mark>기본키</mark>에는 <b>NULL(빈 값)</b>도, <b>중복 값</b>도 들어갈 수 없다.
          hint: 기본키는 학생의 이름표. 이름표가 비어 있거나 두 명이 같은 이름표를 달면 누가 누군지 모른다. 개체 = 나 자신
          short: 기본키에는 NULL(빈 값)도, 중복 값도 들어갈 수 없다
        - id: d-i-ref
          term: 참조 무결성
          desc: <mark>외래키</mark> 값은 <b>상대 테이블의 기본키에 실제로 있는 값</b>이거나 NULL이어야 한다.
          hint: 학생.학과 = '경영'인데 학과 표에 경영이 없으면 위반. 없는 반에 배정할 수 없음. 참조 = 남을 가리킴
          short: 외래키 값은 상대 테이블의 기본키에 실제로 있는 값이거나 NULL이어야 한다
        - id: d-i-dom
          term: 도메인 무결성
          desc: 각 속성 값은 그 속성에 정해진 <b>도메인(범위·형식) 안</b>에 있어야 한다.
          hint: 학년에 7, 성별에 '기타', 나이에 '스무살'(숫자 칸에 글자) → 모두 위반
          short: 각 속성 값은 그 속성에 정해진 도메인(범위·형식) 안에 있어야 한다
        - id: d-i-key
          term: 키 무결성
          desc: 한 테이블 안에 <b>같은 키 값을 가진 행이 두 개 있으면 안 된다</b>.
          hint: 학번 2024001인 학생이 두 줄 있으면 위반
          short: 한 테이블 안에 같은 키 값을 가진 행이 두 개 있으면 안 된다
        - id: d-i-user
          term: 사용자 정의 무결성
          desc: 회사나 업무에서 정한 <b>추가 규칙</b>을 지켜야 한다.
          hint: '"재고는 0 이상", "할인율은 50% 이하" 같은 규칙'
          short: 회사나 업무에서 정한 추가 규칙을 지켜야 한다
  - group: 키 종류
  - tip: <b>예시 테이블로 보기</b><span>학생(<mark>학번</mark>, 주민번호, 이름, 학과). 학번도 주민번호도 한 사람을 딱 구별할 수 있음.</span>
  - table:
      heads:
        - 키
        - 뜻
        - 예시
      rows:
        - id: d-k-super
          term: 슈퍼키
          desc: 한 행을 구별할 수만 있으면 되는 키. <mark>유일성 O, 최소성 X</mark> (쓸데없는 속성이 붙어 있어도 됨)
          hint: (학번, 이름)은 학번만으로도 구별되는데 이름이 더 붙어 있음 → 그래도 구별은 되니까 슈퍼키
          short: 한 행을 구별할 수만 있으면 되는 키
        - id: d-k-cand
          term: 후보키
          desc: 구별도 되고 <b>군더더기도 없는</b> 키. <mark>유일성 O, 최소성 O</mark>
          hint: 학번 하나, 주민번호 하나. 여기서 뭘 빼면 더 이상 구별이 안 되는 딱 필요한 만큼
          short: 구별도 되고 군더더기도 없는 키
        - id: d-k-pk
          term: 기본키
          sub: Primary Key
          desc: 후보키 중에서 <b>대표로 하나 고른 것</b>. NULL도 중복도 안 된다.
          hint: 학번과 주민번호 중 학번을 골랐다면 학번이 기본키
          short: 후보키 중에서 대표로 하나 고른 것
        - id: d-k-alt
          term: 대체키
          desc: 후보키 중에서 기본키로 <mark>뽑히지 않은 나머지</mark>.
          hint: 학번이 기본키가 되면 주민번호는 대체키. 반장 선거에서 떨어진 후보
          short: 후보키 중에서 기본키로 뽑히지 않은 나머지
        - id: d-k-fk
          term: 외래키
          sub: Foreign Key
          desc: <b>다른 테이블의 기본키를 가리키는</b> 속성. 두 표를 연결하는 고리.
          hint: 학생 표의 학과코드 → 학과 표의 학과코드(기본키)를 가리킴. 이 값은 학과 표에 실제로 있어야 함(참조 무결성)
          short: 다른 테이블의 기본키를 가리키는 속성
  - tip: <b>한 줄 정리</b><span>슈퍼키 ⊃ 후보키 = 기본키 + 대체키. 유일성은 "구별됨", 최소성은 "군더더기 없음".</span>
  - group: 이상 현상과 정규화
  - tip: '<b>이상 현상: 표를 잘못 만들면 생기는 문제</b><span class="mnemo">삽 · 삭 · 갱</span><span><b>삽입 이상</b>: 쓸데없는 정보가 없으면 데이터를 못 넣음 (수강 과목이 없으면 학생을 등록 못 함). <b>삭제 이상</b>: 하나 지웠는데 필요한 정보까지 같이 사라짐. <b>갱신 이상</b>: 같은 정보가 여러 줄에 있어서 일부만 바뀜. 이걸 없애려고 표를 쪼개는 게 <mark>정규화</mark>입니다.</span>'
  - tip: "<b>함수 종속 먼저 이해하기</b><span><code>X → Y</code> = X를 알면 Y가 하나로 정해짐. 예) 학번 → 이름 (학번을 알면 이름이 딱 나옴).</span><span><b>부분 함수 종속</b>: 기본키가 (학번, 과목)인데 이름은 <mark>학번만</mark>으로도 정해짐 → 키의 일부에만 종속. <b>이행 함수 종속</b>: 학번 → 학과, 학과 → 학과사무실이면 학번 → 학과사무실이 <mark>건너서</mark> 성립.</span>"
  - table:
      heads:
        - 단계
        - 하는 일
        - 예시 · 외우는 법
      rows:
        - id: d-n1
          term: 1NF
          desc: 모든 칸의 값을 <mark>원자값</mark>(더 쪼갤 수 없는 하나의 값)으로 만든다.
          hint: '한 칸에 "수학, 영어"처럼 두 개가 있으면 줄을 나눠 한 칸에 하나씩. 외우기: <b>도</b>메인 원자값'
          short: 모든 칸의 값을 원자값(더 쪼갤 수 없는 하나의 값)으로 만든다
        - id: d-n2
          term: 2NF
          desc: 기본키 <b>일부에만 종속된 속성</b>을 떼어 낸다(<mark>부분 함수 종속 제거</mark>). 기본키가 여러 속성으로 이루어졌을 때 생기는 문제다.
          hint: "키가 (학번, 과목)인데 이름은 학번만 알아도 나옴 → 이름을 학생 표로 분리. 외우기: <b>부</b>분"
          short: 기본키 일부에만 종속된 속성을 떼어 낸다(부분 함수 종속 제거)
        - id: d-n3
          term: 3NF
          desc: A → B → C처럼 <b>건너서 결정되는 속성</b>을 떼어 낸다(<mark>이행 함수 종속 제거</mark>).
          hint: "학번 → 학과, 학과 → 학과사무실 → 학과사무실을 학과 표로 분리. 외우기: <b>이</b>행"
          short: A → B → C처럼 건너서 결정되는 속성을 떼어 낸다(이행 함수 종속 제거)
        - id: d-nb
          term: BCNF
          desc: 어떤 속성을 결정하는 것(<mark>결정자</mark>)은 전부 후보키여야 한다.
          hint: "후보키도 아닌 게 다른 값을 결정하고 있으면 분리. 3NF보다 조금 더 엄격한 버전. 외우기: <b>결</b>정자"
          short: 어떤 속성을 결정하는 것(결정자)은 전부 후보키여야 한다
        - id: d-n4
          term: 4NF
          desc: 한 값이 <b>여러 값의 묶음</b>을 결정하는 관계(<mark>다치 종속</mark>)를 없앤다.
          hint: "외우기: <b>다</b>치. 시험에는 이름과 순서 정도만 나온다"
          short: 한 값이 여러 값의 묶음을 결정하는 관계(다치 종속)를 없앤다
        - id: d-n5
          term: 5NF
          desc: 표를 쪼갰다가 다시 합칠 때 생기는 문제(<mark>조인 종속</mark>)를 없앤다.
          hint: "외우기: <b>조</b>인. 이름과 순서만 알면 충분"
          short: 표를 쪼갰다가 다시 합칠 때 생기는 문제(조인 종속)를 없앤다
        - id: d-denorm
          term: 반정규화
          desc: 성능을 위해 <b>일부러 합치거나 중복을 허용</b>하는 것. 정규화로 너무 잘게 쪼개 조인이 많아지고 느려졌을 때 쓴다.
          hint: 조회할 때마다 JOIN을 5번 해야 하면 느림 → 자주 보는 값은 한 표에 같이 둠
          short: 성능을 위해 일부러 합치거나 중복을 허용하는 것
  - tip: <b>정규화 순서 외우기</b><span class="mnemo">도 · 부 · 이 · 결 · 다 · 조</span><span>"도부이결다조" (두부 이겨 다 조려). 각 단계에서 제거하는 것의 앞글자입니다.</span>
  - group: 관계대수 기호
  - table:
      heads:
        - 기호
        - 이름
        - 뜻 / 외우는 법
      rows:
        - id: d-ra-s
          term: σ
          desc: Select (셀렉트)
          hint: "조건에 맞는 <mark>행(가로줄)</mark>만 골라낸다. SQL의 WHERE와 같다. 예) σ<sub>학년=3</sub>(학생) = 3학년인 학생들만. 외우기: 시그마 = S = Select"
          hint_class: hint ans
          short: Select (셀렉트)
        - id: d-ra-p
          term: π
          desc: Project (프로젝트)
          hint: "원하는 <mark>열(세로줄)</mark>만 뽑아낸다. SQL의 SELECT 뒤에 열 이름 쓰는 것과 같다. 예) π<sub>이름</sub>(학생) = 이름 열만. 외우기: 파이 = P = Project"
          hint_class: hint ans
          short: Project (프로젝트)
        - id: d-ra-j
          term: ⋈
          desc: Join (조인)
          hint: 두 표를 <b>공통 속성</b>으로 이어 붙여 하나로 만든다. 예) 학생 ⋈ 학과 = 학생 정보 옆에 학과 정보가 붙음. 기호가 나비넥타이 모양
          hint_class: hint ans
          short: Join (조인)
        - id: d-ra-d
          term: ÷
          desc: Division (디비전)
          hint: A ÷ B = B의 값을 <b>전부</b> 가지고 있는 A의 행만 남긴다. 예) 수강 ÷ 필수과목 = 필수과목을 <b>모두</b> 들은 학생
          hint_class: hint ans
          short: Division (디비전)
        - id: d-ra-set
          term: ∪ / ∩ / − / ×
          desc: "<b>∪</b>: 합집합. <b>∩</b>: 교집합. <b>−</b>: 차집합. <b>×</b>: 카티션 프로덕트."
          hint: ×(카티션 프로덕트)는 두 표의 <b>모든 조합</b>. 3줄 × 4줄 = 12줄. 결과의 <mark>차수는 더하고, 카디널리티는 곱한다</mark>
          hint_class: hint ans
          short: "∪: 합집합"
          segments:
            - label: ∪
              text: 합집합
            - label: ∩
              text: 교집합
            - label: −
              text: 차집합
            - label: ×
              text: 카티션 프로덕트
        - id: d-ra-calc
          term: 관계대수 / 관계해석
          desc: "<b>관계대수</b>: <mark>절차적</mark>. 어떻게 구할지 순서를 적는다. <b>관계해석</b>: <mark>비절차적</mark>. 무엇을 원하는지만 적는다."
          hint: 대수 = 요리 레시피(순서대로), 해석 = 주문서("김치찌개 주세요")
          quiz: false
  - group: 트랜잭션과 ACID
  - tip: "<b>트랜잭션 = 한 번에 처리되어야 하는 작업 묶음</b><span>계좌이체: A에서 빼기 + B에 넣기. 둘 중 하나만 되면 안 됩니다.</span>"
  - table:
      heads:
        - 특성
        - 뜻
        - 계좌이체로 치면
      rows:
        - id: d-acid-a
          term: 원자성
          sub: Atomicity
          desc: 트랜잭션 안의 작업은 <b>전부 성공하거나, 하나라도 실패하면 전부 취소</b>된다. 성공하면 Commit, 취소하면 Rollback.
          hint: A 계좌에서 빼기는 됐는데 B 계좌에 넣기가 실패하면 → 빼기도 취소해서 처음 상태로
          short: 트랜잭션 안의 작업은 전부 성공하거나, 하나라도 실패하면 전부 취소된다
        - id: d-acid-c
          term: 일관성
          sub: Consistency
          desc: 트랜잭션 전과 후 모두 DB가 <b>규칙에 맞는 올바른 상태</b>여야 한다.
          hint: 이체 전 두 계좌 합계 100만 원이면, 이체 후에도 합계 100만 원
          short: 트랜잭션 전과 후 모두 DB가 규칙에 맞는 올바른 상태여야 한다
        - id: d-acid-i
          term: 격리성
          sub: Isolation
          desc: 여러 트랜잭션이 동시에 실행돼도 <b>서로의 중간 과정을 보거나 끼어들지 않는다</b>.
          hint: 내가 이체하는 도중에 다른 사람이 내 잔액을 조회해도 반쯤 처리된 금액은 안 보임
          short: 여러 트랜잭션이 동시에 실행돼도 서로의 중간 과정을 보거나 끼어들지 않는다
        - id: d-acid-d
          term: 영속성
          sub: Durability
          desc: Commit으로 완료된 결과는 <mark>영구히</mark> 저장된다. 서버가 꺼져도 사라지지 않는다.
          hint: 이체 완료 문자를 받은 직후 은행 서버가 꺼져도, 켜 보면 이체 기록이 그대로 있음
          short: Commit으로 완료된 결과는 영구히 저장된다
        - id: d-tx-state
          term: 트랜잭션 상태
          desc: <b>활동</b>(실행 중) → <b>부분 완료</b>(마지막 명령까지 실행, 아직 Commit 전) → <b>완료</b>(Commit). 중간에 문제가 생기면 <b>실패</b> → <b>철회</b>(Rollback).
          hint: "부분 완료와 완료가 헷갈리면: 부분 완료 = 도장 찍기 직전, 완료 = 도장 찍음"
          quiz: false
  - group: 병행 제어와 회복
  - table:
      heads:
        - 용어
        - 뜻
        - 예시 · 외우는 법
      rows:
        - id: d-cc-prob
          term: 병행 제어 안 하면
          desc: "여러 트랜잭션을 동시에 막 실행하면 생기는 문제: <b>갱신 분실</b>(한 사람의 수정이 덮여 사라짐), <b>모순성</b>(값이 앞뒤가 안 맞음), <b>연쇄 복귀</b>(하나를 취소하면 그걸 쓴 다른 것도 줄줄이 취소)."
          hint: 두 사람이 같은 문서를 동시에 고치고 저장 → 나중에 저장한 사람 것만 남음 = 갱신 분실
          quiz: false
        - id: d-cc-lock
          term: 로킹
          sub: Locking
          desc: 데이터를 쓰는 동안 <b>잠가서</b> 다른 트랜잭션이 못 쓰게 한다. 다 쓰면 풀어 준다(Lock → Unlock).
          hint: 화장실 문 잠그기. 쓰는 동안 다른 사람은 기다림
          short: 데이터를 쓰는 동안 잠가서 다른 트랜잭션이 못 쓰게 한다
        - id: d-cc-unit
          term: 로킹 단위
          desc: 잠그는 단위가 <mark>크면</mark>(DB 전체, 테이블) → 관리가 쉽지만 동시에 쓸 수 있는 사람이 적음(병행성 낮음). 단위가 <mark>작으면</mark>(행 하나) → 여럿이 동시에 쓸 수 있지만 관리가 복잡함(오버헤드 큼).
          hint: 건물 정문을 잠그면 편하지만 아무도 못 들어감. 방마다 잠그면 여럿이 쓰지만 열쇠 관리가 힘듦
          quiz: false
        - id: d-cc-ts
          term: 타임스탬프 / 낙관적 검증 / 다중 버전
          desc: "<b>타임스탬프</b>: 먼저 시작한 트랜잭션 순서대로 처리. <b>낙관적 검증</b>: 일단 다 실행하고 끝날 때 충돌 검사. <b>다중 버전(MVCC)</b>: 데이터 버전을 여러 개 두고 각자 맞는 버전을 읽음."
          hint: 로킹 말고 다른 병행 제어 방법들. 번호표 순서대로 / 일단 하고 나중에 확인 / 복사본 여러 개
          short: "타임스탬프: 먼저 시작한 트랜잭션 순서대로 처리"
          segments:
            - label: 타임스탬프
              text: 먼저 시작한 트랜잭션 순서대로 처리
            - label: 낙관적 검증
              text: 일단 다 실행하고 끝날 때 충돌 검사
            - label: 다중 버전(MVCC)
              text: 데이터 버전을 여러 개 두고 각자 맞는 버전을 읽음
        - id: d-rc-redo
          term: REDO / UNDO
          desc: "<b>REDO</b>: Commit까지 <mark>끝난 작업</mark>을 다시 실행해서 결과를 살림. <b>UNDO</b>: Commit 못 한 <mark>덜 끝난 작업</mark>을 되돌려서 없앰."
          hint: "장애 후 회복할 때: 끝낸 숙제는 다시 써 두기(Redo), 쓰다 만 숙제는 지우기(Undo)"
          short: "REDO: Commit까지 끝난 작업을 다시 실행해서 결과를 살림"
          segments:
            - label: REDO
              text: Commit까지 끝난 작업을 다시 실행해서 결과를 살림
            - label: UNDO
              text: Commit 못 한 덜 끝난 작업을 되돌려서 없앰
        - id: d-rc-imm
          term: 즉시 갱신 / 지연 갱신
          desc: "<b>즉시 갱신</b>: 작업하는 즉시 DB에 반영 → 끝난 건 REDO, 덜 끝난 것도 이미 DB에 썼으니 UNDO 필요 → <b>둘 다</b>. <b>지연 갱신</b>: Commit할 때 한꺼번에 반영 → Commit 전엔 DB에 쓴 게 없어서 UNDO 불필요 → <mark>REDO만</mark>."
          hint: 지연 갱신 = 초안에만 쓰다가 확정할 때 옮겨 적기. 확정 전이면 원본은 멀쩡하니 지울 게 없음
          quiz: false
        - id: d-rc-etc
          term: 체크포인트 / 그림자 페이징
          desc: "<b>체크포인트</b>: 중간중간 저장 지점을 찍어 두고, 장애가 나면 그 지점부터만 회복. <b>그림자 페이징</b>: 원본(그림자) 페이지를 따로 보관하다가 실패하면 그걸로 바꿔 끼움."
          hint: 체크포인트 = 게임 세이브 포인트, 그림자 페이징 = 원본 백업본
          short: "체크포인트: 중간중간 저장 지점을 찍어 두고, 장애가 나면 그 지점부터만 회복"
          segments:
            - label: 체크포인트
              text: 중간중간 저장 지점을 찍어 두고, 장애가 나면 그 지점부터만 회복
            - label: 그림자 페이징
              text: 원본(그림자) 페이지를 따로 보관하다가 실패하면 그걸로 바꿔 끼움
  - group: 스키마 3단계와 설계 순서
  - table:
      heads:
        - 용어
        - 뜻
        - 예시 · 외우는 법
      rows:
        - id: d-sch-ext
          term: 외부 스키마
          desc: 사용자나 프로그램 <b>하나하나가 보는</b> DB의 일부분. 서브 스키마라고도 한다. 여러 개 있을 수 있다.
          hint: 학생 앱은 성적만, 교직원 앱은 급여만 보는 것처럼 각자 보이는 화면
          short: 사용자나 프로그램 하나하나가 보는 DB의 일부분
        - id: d-sch-con
          term: 개념 스키마
          desc: 조직 <b>전체 입장</b>에서 본 DB의 논리 구조. 모든 테이블과 관계, 제약조건. DB 하나에 하나만 있다.
          hint: 학교 전체 데이터 설계도 한 장. 보통 그냥 "스키마"라고 하면 이것
          short: 조직 전체 입장에서 본 DB의 논리 구조
        - id: d-sch-int
          term: 내부 스키마
          desc: 데이터가 <b>실제로 디스크에 어떻게 저장되는지</b>의 물리 구조. 저장 방식, 인덱스 등.
          hint: 창고 안에 상자가 어느 선반에 어떻게 쌓였는지
          short: 데이터가 실제로 디스크에 어떻게 저장되는지의 물리 구조
        - id: d-indep
          term: 논리적 / 물리적 독립성
          desc: "<b>논리적 독립성</b>: 개념 스키마(전체 설계)를 바꿔도 외부 스키마(앱)는 안 고쳐도 됨. <b>물리적 독립성</b>: 내부 스키마(저장 방식)를 바꿔도 개념 스키마는 그대로."
          hint: 외부 ↔ 개념 사이 = 논리적, 개념 ↔ 내부 사이 = 물리적. 아래층을 고쳐도 위층은 모름
          short: "논리적 독립성: 개념 스키마(전체 설계)를 바꿔도 외부 스키마(앱)는 안 고쳐도 됨"
          segments:
            - label: 논리적 독립성
              text: 개념 스키마(전체 설계)를 바꿔도 외부 스키마(앱)는 안 고쳐도 됨
            - label: 물리적 독립성
              text: 내부 스키마(저장 방식)를 바꿔도 개념 스키마는 그대로
        - id: d-design
          term: DB 설계 순서
          desc: <b>요구 분석</b>(뭘 저장할지 정리) → <b>개념 설계</b>(E-R 다이어그램 그림) → <b>논리 설계</b>(테이블·키로 바꾸고 정규화) → <b>물리 설계</b>(저장 방식·인덱스) → <b>구현</b>(실제 SQL로 생성).
          hint: '"요개논물구". 집 짓기: 요구 듣기 → 스케치 → 도면 → 자재·시공 방법 → 시공'
          quiz: false
        - id: d-er
          term: E-R 다이어그램 기호
          desc: "<b>사각형</b> = 개체, <b>마름모</b> = 관계, <b>타원</b> = 속성. 예: 학생(개체), 수강한다(관계), 이름(속성). <b>밑줄 친 속성</b>은 기본키."
          hint: 개체 = 명사, 관계 = 동사, 속성 = 형용사처럼 생각하기. UML의 마름모(집합·합성)와는 다른 것
          quiz: false
        - id: d-view
          term: 뷰
          sub: View
          desc: <b>데이터를 저장하지 않는 가상 테이블</b>. 다른 테이블에서 필요한 부분만 골라 보여 준다. <mark>ALTER로 수정 불가</mark> → DROP하고 다시 CREATE.
          hint: 보여주고 싶은 열만 골라 보여줄 수 있어서 보안에 좋음. 뷰를 지워도 원본 테이블은 멀쩡함
          short: 데이터를 저장하지 않는 가상 테이블
  - group: 조각으로 만들기
  - items:
      - id: b-norm
        tag: 순서
        title: 정규화 순서
        type: build
        mode: order
        join: " → "
        q: 정규화 단계를 순서대로 놓으세요.
        tokens:
          - 1NF
          - 2NF
          - 3NF
          - BCNF
          - 4NF
          - 5NF
        why: '<p class="why"><b>외우는 법</b>: 각 단계에서 없애는 것의 앞글자 "<mark>도 부 이 결 다 조</mark>" (도메인 원자값 → 부분 종속 → 이행 종속 → 결정자 → 다치 종속 → 조인 종속). BCNF는 3NF와 4NF 사이.</p>'
        hints:
          - 첫 번째 조각은 <b>1NF</b>
          - '<b>외우는 법</b>: 각 단계에서 없애는 것의 앞글자 "<mark>도 부 이 결 다 조</mark>" (도메인 원자값 → 부분 종속 → 이행 종속 → 결정자 → 다치 종속 → 조인 종속). BCNF는 3NF와 4NF 사이.'
      - id: b-dbdesign
        tag: 순서
        title: DB 설계 순서
        type: build
        mode: order
        join: " → "
        q: 데이터베이스 설계 단계를 순서대로 놓으세요.
        tokens:
          - 요구 분석
          - 개념 설계
          - 논리 설계
          - 물리 설계
          - 구현
        why: '<p class="why"><b>외우는 법</b>: "<mark>요 개 논 물 구</mark>". 개념 설계에서 E-R 다이어그램을 그리고, 논리 설계에서 테이블로 바꾸고 정규화한다.</p>'
        hints:
          - 첫 번째 조각은 <b>요구 분석</b>
          - '<b>외우는 법</b>: "<mark>요 개 논 물 구</mark>". 개념 설계에서 E-R 다이어그램을 그리고, 논리 설계에서 테이블로 바꾸고 정규화한다.'
      - id: b-txstate
        tag: 순서
        title: 트랜잭션이 정상으로 끝나는 순서
        type: build
        mode: order
        join: " → "
        q: 트랜잭션이 문제없이 끝날 때 거치는 상태를 순서대로 놓으세요.
        tokens:
          - 활동
          - 부분 완료
          - 완료
        why: <p class="why">실행 중(활동) → 마지막 명령까지 실행, Commit 직전(부분 완료) → Commit(완료). 문제가 생기면 실패 → 철회(Rollback)로 간다.</p>
        hints:
          - 첫 번째 조각은 <b>활동</b>
          - 실행 중(활동) → 마지막 명령까지 실행, Commit 직전(부분 완료) → Commit(완료). 문제가 생기면 실패 → 철회(Rollback)로 간다.
      - id: b-acid
        tag: 영문
        title: ACID 풀네임
        type: build
        mode: fullname
        join: ", "
        decoys:
          - Availability
          - Integrity
        q: 트랜잭션 특성 A, C, I, D를 순서대로 놓으세요.
        tokens:
          - Atomicity
          - Consistency
          - Isolation
          - Durability
        why: <p class="why"><b>원자성</b>(전부 아니면 전무), <b>일관성</b>, <b>격리성</b>, <b>영속성</b>. Availability·Integrity는 보안 3요소(CIA)라서 섞어 내는 함정.</p>
        hints:
          - 첫 번째 조각은 <b>Atomicity</b>
          - <b>원자성</b>(전부 아니면 전무), <b>일관성</b>, <b>격리성</b>, <b>영속성</b>. Availability·Integrity는 보안 3요소(CIA)라서 섞어 내는 함정.
  - group: 개념 확인 문제
  - items:
      - id: q-cc-unit
        tag: 개념
        title: 로킹 단위
        type: mcq
        quizzes:
          - q: 로킹 단위를 작게(행 하나 단위로) 하면 어떻게 될까?
            answer: 병행성은 높아지고, 관리 부담(오버헤드)은 커진다
            wrong:
              - 병행성은 낮아지고, 관리 부담은 작아진다
              - 병행성도 높아지고, 관리 부담도 작아진다
              - 병행성은 낮아지고, 관리 부담은 커진다
            hints:
              - "<b>기억할 것</b>: 건물 정문을 잠그면 편하지만 아무도 못 들어가고, 방마다 잠그면 여럿이 쓰지만 열쇠 관리가 힘들다."
        explain: '<p>잠그는 단위가 <mark>작으면</mark> 여럿이 동시에 쓸 수 있지만(병행성↑) 잠금이 많아 관리가 복잡하다(오버헤드↑). <mark>크면</mark> 그 반대.</p><p class="why"><b>기억할 것</b>: 건물 정문을 잠그면 편하지만 아무도 못 들어가고, 방마다 잠그면 여럿이 쓰지만 열쇠 관리가 힘들다.</p>'
      - id: q-rc-imm
        tag: 개념
        title: 즉시 갱신 · 지연 갱신
        type: mcq
        quizzes:
          - q: 지연 갱신 회복 기법에서 장애가 났을 때 필요한 연산은?
            answer: REDO만
            wrong:
              - UNDO만
              - REDO와 UNDO 모두
              - 필요 없음
            hints:
              - "<b>기억할 것</b>: 지연 갱신 = 초안에만 쓰다가 확정할 때 옮겨 적기. 확정 전이면 원본은 멀쩡하니 지울 게 없다."
          - q: 즉시 갱신 회복 기법에서 장애가 났을 때 필요한 연산은?
            answer: REDO와 UNDO 모두
            wrong:
              - REDO만
              - UNDO만
              - 필요 없음
            hints:
              - "<b>기억할 것</b>: 지연 갱신 = 초안에만 쓰다가 확정할 때 옮겨 적기. 확정 전이면 원본은 멀쩡하니 지울 게 없다."
        explain: '<p><b>즉시 갱신</b>: 작업하는 즉시 DB에 반영 → 끝난 건 REDO, 덜 끝난 것도 이미 DB에 썼으니 UNDO → <b>둘 다</b>.</p><p><b>지연 갱신</b>: Commit할 때 한꺼번에 반영 → Commit 전엔 DB에 쓴 게 없어서 UNDO 불필요 → <mark>REDO만</mark>.</p><p class="why"><b>기억할 것</b>: 지연 갱신 = 초안에만 쓰다가 확정할 때 옮겨 적기. 확정 전이면 원본은 멀쩡하니 지울 게 없다.</p>'
      - id: q-cc-prob
        tag: 개념
        title: 병행 제어를 안 하면
        type: mcq
        quizzes:
          - q: 병행 제어를 하지 않을 때 생기는 문제가 아닌 것은?
            answer: 정규화 위반
            wrong:
              - 갱신 분실
              - 모순성
              - 연쇄 복귀
            hints:
              - 정규화는 테이블 설계 문제라 병행 제어와 관계없다.
        explain: <p>여러 트랜잭션을 동시에 막 실행하면 <b>갱신 분실</b>(한 사람의 수정이 덮여 사라짐), <b>모순성</b>(값이 앞뒤가 안 맞음), <b>연쇄 복귀</b>(하나를 취소하면 그걸 쓴 다른 것도 줄줄이 취소)가 생긴다.</p><p class="why">정규화는 테이블 설계 문제라 병행 제어와 관계없다.</p>
      - id: q-er
        tag: 개념
        title: E-R 다이어그램 읽기
        type: mcq
        quizzes:
          - q: E-R 다이어그램에서 마름모는 무엇을 나타낼까?
            answer: 관계
            wrong:
              - 개체
              - 속성
              - 기본키
          - q: E-R 다이어그램에서 밑줄 친 속성은 무엇일까?
            answer: 기본키
            wrong:
              - 외래키
              - 다중값 속성
              - 유도 속성
            hints:
              - "UML의 마름모(집합·합성)와 헷갈리지 않기: E-R의 마름모는 개체 사이의 관계다."
        explain: '<p><b>사각형</b> = 개체(학생), <b>마름모</b> = 관계(수강한다), <b>타원</b> = 속성(이름), <b>밑줄</b> = 기본키. 이중 타원은 다중값 속성, 점선 타원은 유도 속성이다.</p><p class="why">UML의 마름모(집합·합성)와 헷갈리지 않기: E-R의 마름모는 개체 사이의 관계다.</p>'
      - id: q-ra-calc
        tag: 개념
        title: 질의를 적는 두 방식
        type: mcq
        quizzes:
          - q: 원하는 결과를 얻기 위한 연산 순서를 적는 방식은?
            answer: 관계대수
            wrong:
              - 관계해석
              - 정규화
              - 뷰
          - q: 원하는 결과가 무엇인지만 적고, 구하는 순서는 적지 않는 방식은?
            answer: 관계해석
            wrong:
              - 관계대수
              - 카티션 프로덕트
              - 트랜잭션
        explain: "<p><b>관계대수</b> = <mark>절차적</mark>: σ, π, ⋈처럼 연산을 어떤 순서로 할지 적는다(요리 레시피). <b>관계해석</b> = <mark>비절차적</mark>: 원하는 조건만 적는다(주문서). SQL은 관계해석에 가깝다.</p>"
heading: DB 이론, 헷갈리는 것만
