id: code-py
name: Python 함정
color: "#CE82FF"
dark: "#A568CC"
part: PART 1 · 코드
lede: "슬라이싱은 <mark>[시작 : 끝 : 간격]</mark>, 끝 번호는 포함 안 됨. 이것만 확실하면 절반은 풉니다."
blocks:
  - items:
      - id: p1
        tag: Py
        title: 리스트 슬라이싱
        type: answer
        code: |-
          a = [1, 2, 3, 4, 5]
          print(a[1:3], a[-2:], a[::2], a[::-1])
        q: 출력은?
        answer: "[2, 3] [4, 5] [1, 3, 5] [5, 4, 3, 2, 1]"
        steps:
          - "번호 매기기: 값 1 2 3 4 5 → 번호 <b>0 1 2 3 4</b> (뒤에서는 -5 -4 -3 -2 -1)"
          - <code>a[1:3]</code> → 1번부터 <b>3번 직전</b>까지 → 1번, 2번 → [2, 3]
          - <code>a[-2:]</code> → 뒤에서 두 번째부터 끝까지 → [4, 5]
          - <code>a[::2]</code> → 처음부터 끝까지 <b>2칸씩</b> 건너뛰기 → 0, 2, 4번 → [1, 3, 5]
          - <code>a[::-1]</code> → 간격 -1 = <b>거꾸로</b> → [5, 4, 3, 2, 1]
        why: '<b>기억할 것</b>: <mark>[시작 : 끝 : 간격], 끝 번호는 안 들어간다</mark>. 빈칸이면 "처음부터" 또는 "끝까지".'
        hints:
          - "번호 매기기: 값 1 2 3 4 5 → 번호 <b>0 1 2 3 4</b> (뒤에서는 -5 -4 -3 -2 -1)"
          - '<b>기억할 것</b>: <mark>[시작 : 끝 : 간격], 끝 번호는 안 들어간다</mark>. 빈칸이면 "처음부터" 또는 "끝까지".'
      - id: p2
        tag: Py
        title: 문자열 슬라이싱
        type: answer
        code: |-
          s = "Hello"
          print(s[1:4], s[-1], s[:2])
        q: 출력은?
        answer: ell o He
        steps:
          - "번호: H=0, e=1, l=2, l=3, o=4"
          - <code>s[1:4]</code> → 1, 2, 3번 → "ell"
          - <code>s[-1]</code> → 맨 뒤 한 글자 → "o"
          - <code>s[:2]</code> → 처음부터 2번 직전까지 → 0, 1번 → "He"
        why: '<b>기억할 것</b>: 문자열도 리스트와 똑같이 자른다. <mark>[:2]는 "앞에서 2글자"</mark>로 외우면 편하다.'
        hints:
          - "번호: H=0, e=1, l=2, l=3, o=4"
          - '<b>기억할 것</b>: 문자열도 리스트와 똑같이 자른다. <mark>[:2]는 "앞에서 2글자"</mark>로 외우면 편하다.'
      - id: p3
        tag: Py
        title: // 와 % 와 **
        type: answer
        code: print(7//2, -7//2, -7%3, 2**3, 7/2)
        q: 출력은?
        answer: 3 -4 2 8 3.5
        steps:
          - <code>7//2</code> → 3.5를 <b>내림</b> → 3
          - <code>-7//2</code> → -3.5를 <b>내림(더 작은 쪽)</b> → <b>-4</b> (C는 -3)
          - <code>-7%3</code> → Python 나머지는 <b>나누는 수(3)와 부호가 같음</b> → -7 = 3×(-3) + <b>2</b>
          - <code>2**3</code> → 2의 3제곱 → 8
          - <code>7/2</code> → <code>/</code>는 항상 실수 → 3.5
        why: "<b>기억할 것</b>: <mark>Python //는 무조건 아래로(바닥으로) 내린다</mark>. 음수가 나오면 C랑 답이 달라지니 함정 1순위."
        hints:
          - <code>7//2</code> → 3.5를 <b>내림</b> → 3
          - "<b>기억할 것</b>: <mark>Python //는 무조건 아래로(바닥으로) 내린다</mark>. 음수가 나오면 C랑 답이 달라지니 함정 1순위."
      - id: p4
        tag: Py
        title: 리스트는 같이 바뀜
        type: answer
        code: |-
          a = [1, 2, 3]
          b = a
          b.append(4)
          print(a)
        q: 출력은?
        answer: "[1, 2, 3, 4]"
        steps:
          - <code>a = [1, 2, 3]</code> → 리스트 하나를 만들고 a라는 이름표를 붙임
          - <code>b = a</code> → 리스트를 <b>복사하지 않고</b> 같은 리스트에 b라는 이름표를 하나 더 붙임
          - <code>b.append(4)</code> → 그 리스트 하나에 4 추가
          - a도 같은 리스트를 보고 있으니 → [1, 2, 3, 4]
        why: "<b>기억할 것</b>: <mark>= 는 복사가 아니라 이름표 하나 더 붙이기</mark>. 따로 쓰려면 <code>b = a[:]</code> 또는 <code>b = a.copy()</code>."
        hints:
          - <code>a = [1, 2, 3]</code> → 리스트 하나를 만들고 a라는 이름표를 붙임
          - "<b>기억할 것</b>: <mark>= 는 복사가 아니라 이름표 하나 더 붙이기</mark>. 따로 쓰려면 <code>b = a[:]</code> 또는 <code>b = a.copy()</code>."
      - id: p5
        tag: Py
        title: append vs extend
        type: answer
        code: |-
          a = [1, 2]; b = [1, 2]
          a.append([3, 4])
          b.extend([3, 4])
          print(a, len(a), b, len(b))
        q: 출력은?
        answer: "[1, 2, [3, 4]] 3 [1, 2, 3, 4] 4"
        steps:
          - <code>a.append([3, 4])</code> → [3, 4] <b>리스트 통째로</b>를 한 칸에 넣음 → [1, 2, [3, 4]], 칸 수 3
          - <code>b.extend([3, 4])</code> → 안의 값을 <b>하나씩 꺼내서</b> 넣음 → [1, 2, 3, 4], 칸 수 4
        why: "<b>기억할 것</b>: <mark>append = 상자째 넣기, extend = 상자 풀어서 넣기</mark>."
        hints:
          - <code>a.append([3, 4])</code> → [3, 4] <b>리스트 통째로</b>를 한 칸에 넣음 → [1, 2, [3, 4]], 칸 수 3
          - "<b>기억할 것</b>: <mark>append = 상자째 넣기, extend = 상자 풀어서 넣기</mark>."
      - id: p6
        tag: Py
        title: range
        type: answer
        code: print(list(range(5)), list(range(1, 10, 3)), list(range(5, 0, -2)))
        q: 출력은?
        answer: "[0, 1, 2, 3, 4] [1, 4, 7] [5, 3, 1]"
        steps:
          - <code>range(5)</code> → 0부터 5 직전까지 → 0~4
          - <code>range(1, 10, 3)</code> → 1에서 시작, 3씩 증가, 10 직전까지 → 1, 4, 7 (10은 안 됨)
          - <code>range(5, 0, -2)</code> → 5에서 시작, 2씩 감소, 0 직전까지 → 5, 3, 1
        why: "<b>기억할 것</b>: <mark>range(시작, 끝, 간격)에서 끝은 절대 안 들어간다</mark>. 숫자를 직접 써 보면서 끝에 닿기 전에 멈추기."
        hints:
          - <code>range(5)</code> → 0부터 5 직전까지 → 0~4
          - "<b>기억할 것</b>: <mark>range(시작, 끝, 간격)에서 끝은 절대 안 들어간다</mark>. 숫자를 직접 써 보면서 끝에 닿기 전에 멈추기."
      - id: p7
        tag: Py
        title: 리스트 컴프리헨션
        type: answer
        code: print([x*2 for x in range(5) if x % 2 == 0])
        q: 출력은?
        answer: "[0, 4, 8]"
        steps:
          - "읽는 순서: <b>for → if → 앞의 식</b>"
          - <code>for x in range(5)</code> → x = 0, 1, 2, 3, 4
          - <code>if x % 2 == 0</code> → 짝수만 통과 → 0, 2, 4
          - <code>x*2</code> → 0, 4, 8
        why: "<b>기억할 것</b>: 리스트 컴프리헨션은 <mark>가운데(for) → 오른쪽(if) → 왼쪽(식)</mark> 순서로 읽는다."
        hints:
          - "읽는 순서: <b>for → if → 앞의 식</b>"
          - "<b>기억할 것</b>: 리스트 컴프리헨션은 <mark>가운데(for) → 오른쪽(if) → 왼쪽(식)</mark> 순서로 읽는다."
      - id: p8
        tag: Py
        title: set 연산
        type: answer
        code: |-
          a = {1, 2, 3}; b = {2, 3, 4}
          print(a & b, a | b, a - b)
        q: 출력은?
        answer: "{2, 3} {1, 2, 3, 4} {1}"
        steps:
          - "<code>a &amp; b</code> 교집합: 둘 다 있는 것 → {2, 3}"
          - "<code>a | b</code> 합집합: 하나라도 있는 것 (중복은 한 번만) → {1, 2, 3, 4}"
          - "<code>a - b</code> 차집합: a에만 있는 것 → {1}"
        why: "<b>기억할 것</b>: <mark>&amp; = 그리고(둘 다), | = 또는(하나라도), - = 빼기</mark>. set은 중복을 자동으로 없앤다."
        hints:
          - "<code>a &amp; b</code> 교집합: 둘 다 있는 것 → {2, 3}"
          - "<b>기억할 것</b>: <mark>&amp; = 그리고(둘 다), | = 또는(하나라도), - = 빼기</mark>. set은 중복을 자동으로 없앤다."
      - id: p9
        tag: Py
        title: print 의 sep, end
        type: answer
        code: |-
          print(1, 2, 3, sep="-", end="!")
          print("A")
        q: 출력은?
        answer: 1-2-3!A
        steps:
          - <code>sep="-"</code> → 값과 값 <b>사이</b>에 "-"를 넣음 → 1-2-3
          - <code>end="!"</code> → 끝에 원래 붙는 <b>줄바꿈 대신</b> "!"를 붙임 → 1-2-3!
          - 줄이 안 바뀌었으니 다음 print("A")가 <b>바로 옆에</b> 이어짐 → 1-2-3!A
        why: '<b>기억할 것</b>: <mark>sep = 사이에, end = 끝에</mark>. 기본값은 sep=" "(공백), end="\n"(줄바꿈).'
        hints:
          - <code>sep="-"</code> → 값과 값 <b>사이</b>에 "-"를 넣음 → 1-2-3
          - '<b>기억할 것</b>: <mark>sep = 사이에, end = 끝에</mark>. 기본값은 sep=" "(공백), end="\n"(줄바꿈).'
      - id: p10
        tag: Py
        title: dict 순회
        type: answer
        code: |-
          d = {"a": 1, "b": 2}
          for k in d:
              print(k, end="")
          print(d.get("c", 0))
        q: 출력은?
        answer: ab0
        steps:
          - <code>for k in d</code> → dict를 그냥 돌리면 <b>키만</b> 나옴 → "a", "b"
          - <code>end=""</code>라 줄바꿈 없이 붙음 → "ab"
          - <code>d.get("c", 0)</code> → "c" 키가 없음 → 대신 <b>기본값 0</b> → "ab0"
        why: '<b>기억할 것</b>: <mark>dict 반복 = 키만</mark>. 값은 <code>d.values()</code>, 둘 다는 <code>d.items()</code>. <code>d["c"]</code>처럼 없는 키를 바로 꺼내면 에러, get은 기본값.'
        hints:
          - <code>for k in d</code> → dict를 그냥 돌리면 <b>키만</b> 나옴 → "a", "b"
          - '<b>기억할 것</b>: <mark>dict 반복 = 키만</mark>. 값은 <code>d.values()</code>, 둘 다는 <code>d.items()</code>. <code>d["c"]</code>처럼 없는 키를 바로 꺼내면 에러, get은 기본값.'
