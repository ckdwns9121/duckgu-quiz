id: dk-network
name: Service · Ingress · NetworkPolicy
color: "#326CE5"
dark: "#244EA3"
part: PART 4
lede: Service에 엔드포인트가 없고, 포트가 엇갈리고, 기본 거부 정책 뒤 DNS까지 끊기는 네트워크 장애를 다룹니다.
blocks:
  - items:
      - id: dk-net-q-selector
        tag: Service
        title: Service IP는 되는데 연결이 거부될 때
        type: mcq
        quizzes:
          - q: Service selector는 app=api인데 Pod 라벨은 app=backend다. EndpointSlice에는 무엇이 생길까?
            answer: 일치하는 Pod가 없어 엔드포인트가 비어 있다
            wrong:
              - 같은 namespace의 모든 Pod가 들어간다
              - Pod 이름에 api가 있으면 자동으로 들어간다
              - Service가 Pod 라벨을 app=api로 바꾼다
          - q: Service가 어느 Pod로도 연결되지 않을 때 가장 먼저 함께 볼 두 가지는?
            answer: Service selector와 Pod 라벨
            wrong:
              - ConfigMap 키와 Secret 값
              - 노드 이름과 PVC 용량
              - Ingress host와 ServiceAccount
        explain: <p>selector가 있는 Service는 일치하는 Pod를 찾아 EndpointSlice를 자동으로 만든다. Service ClusterIP가 존재해도 엔드포인트가 비어 있으면 전달할 대상이 없다. <code>kubectl get endpointslice</code>와 양쪽 라벨을 비교한다.</p>
      - id: dk-net-q-ports
        tag: Service
        title: 포트 번호가 세 군데 다를 때
        type: mcq
        quizzes:
          - q: Service의 port는 80, targetPort는 8080이고 앱은 컨테이너에서 8080을 듣는다. 클러스터 내부 클라이언트는 어디로 접속할까?
            answer: Service 주소의 80 포트
            wrong:
              - Service 주소의 8080 포트만 가능하다
              - Pod IP의 80 포트로만 가능하다
              - 노드 IP의 임의 포트가 반드시 필요하다
          - q: Service targetPort를 이름 http로 지정했다. Pod에서 필요한 설정은?
            answer: containerPort에 이름 http인 포트가 있어야 한다
            wrong:
              - Pod 이름이 http로 시작해야 한다
              - namespace에 http라는 ConfigMap이 있어야 한다
              - Ingress class 이름을 http로 정해야 한다
        explain: <p><code>port</code>는 클라이언트가 Service에 접속하는 포트, <code>targetPort</code>는 백엔드 Pod로 전달할 포트다. 이름 있는 targetPort는 Pod의 이름 있는 컨테이너 포트를 찾아 서로 다른 버전의 실제 포트도 같은 Service로 연결할 수 있다.</p>
      - id: dk-net-q-types
        tag: Service 유형
        title: 노출 범위를 잘못 고를 때
        type: mcq
        quizzes:
          - q: 클러스터 안의 다른 Pod만 접근할 내부 API에 가장 기본적인 Service 유형은?
            answer: ClusterIP
            wrong:
              - NodePort
              - LoadBalancer
              - ExternalName으로 외부 IP 직접 지정
          - q: 지원되는 클라우드에서 Service 하나를 외부 로드 밸런서로 노출하려면?
            answer: LoadBalancer
            wrong:
              - ClusterIP와 hostNetwork
              - ExternalName과 Pod IP
              - Headless Service와 localhost
        explain: <p><b>ClusterIP</b>는 기본 내부 가상 IP다. <b>NodePort</b>는 각 노드의 포트를 열고, <b>LoadBalancer</b>는 지원되는 환경에서 외부 로드 밸런서 프로비저닝을 요청한다. HTTP 경로·호스트 라우팅이 여러 개면 Ingress나 Gateway API를 함께 검토한다.</p>
      - id: dk-net-q-ingress
        tag: Ingress
        title: 객체를 만들었는데 외부 주소가 없을 때
        type: mcq
        quizzes:
          - q: Ingress 리소스를 적용했지만 외부 주소도 라우팅도 생기지 않는다. 가장 흔한 원인은?
            answer: Ingress 컨트롤러가 설치되거나 선택되지 않았다
            wrong:
              - Ingress는 StatefulSet만 대상으로 삼아서
              - 모든 Service가 NodePort여야만 해서
              - Pod에 PVC가 없으면 주소를 만들지 않아서
          - q: Ingress의 host에 api.example.com을 적으면 공인 DNS 레코드는 어떻게 될까?
            answer: 별도 DNS 설정이나 자동화가 필요하다
            wrong:
              - Kubernetes가 도메인 등록까지 자동 처리한다
              - CoreDNS가 인터넷 DNS에 자동 게시한다
              - ServiceAccount 이름으로 CNAME이 생성된다
        explain: <p>Ingress는 원하는 HTTP 라우팅 규칙을 선언할 뿐 실제 구현은 <b>Ingress 컨트롤러</b>가 한다. 외부 IP나 로드 밸런서 주소에 도메인이 향하도록 DNS도 별도로 설정해야 한다. IngressClass가 여러 개면 어떤 컨트롤러가 처리할지도 명시한다.</p>
      - id: dk-net-q-defaultdeny
        tag: NetworkPolicy
        title: 정책을 추가하자 DNS까지 끊길 때
        type: mcq
        quizzes:
          - q: namespace에 NetworkPolicy가 하나도 없다. 기본적인 Pod ingress·egress 동작은?
            answer: 둘 다 허용된다
            wrong:
              - 둘 다 기본 거부된다
              - ingress만 허용되고 egress는 거부된다
              - 같은 라벨끼리만 허용된다
          - q: 모든 egress를 기본 거부한 뒤 외부 API뿐 아니라 서비스 이름 해석도 실패한다. 추가로 허용할 것은?
            answer: 클러스터 DNS로 가는 DNS 트래픽
            wrong:
              - 모든 Pod의 hostNetwork 사용
              - API 서버의 익명 인증
              - Service의 sessionAffinity
        explain: <p>NetworkPolicy가 선택하지 않은 Pod의 트래픽은 기본 허용이다. 허용 목록 방식은 모든 Pod를 선택하는 기본 거부 정책에서 시작한다. egress를 막으면 DNS 요청도 트래픽이므로 CoreDNS로 가는 UDP·TCP 53 등을 명시적으로 허용해야 서비스 이름을 풀 수 있다.</p>
      - id: dk-net-q-bothways
        tag: NetworkPolicy
        title: 한쪽 정책만 열었는데 통신이 안 될 때
        type: mcq
        quizzes:
          - q: source Pod의 egress는 허용했지만 destination Pod의 ingress 정책은 source를 허용하지 않는다. 연결 결과는?
            answer: 양쪽 정책이 모두 허용하지 않아 차단된다
            wrong:
              - source의 egress 허용만으로 연결된다
              - destination 정책은 응답 트래픽에만 적용된다
              - 같은 namespace면 정책과 무관하게 연결된다
          - q: NetworkPolicy 객체는 정상인데 아무 트래픽도 차단되지 않는다. 확인할 클러스터 구성은?
            answer: 사용 중인 CNI가 NetworkPolicy를 구현하는지
            wrong:
              - kubelet의 이미지 가비지 컬렉션 주기
              - StorageClass의 volumeBindingMode
              - Deployment의 revisionHistoryLimit
        explain: <p>연결이 허용되려면 source의 egress와 destination의 ingress가 각각 적용되는 정책에서 모두 허용돼야 한다. 응답 트래픽은 허용된 연결의 일부로 처리된다. NetworkPolicy API를 저장하는 것과 실제 데이터 경로에서 집행하는 것은 별개라 CNI 지원이 필요하다.</p>
      - id: dk-net-q-readiness
        tag: EndpointSlice
        title: Pod는 Running인데 Service에서 빠질 때
        type: mcq
        quizzes:
          - q: Pod는 Running이지만 readiness probe가 실패한다. 일반 Service의 트래픽은 어떻게 될까?
            answer: 준비되지 않은 엔드포인트로는 보내지 않는다
            wrong:
              - Running이므로 계속 같은 비율로 보낸다
              - Pod를 즉시 삭제하고 다시 만들지 않는다
              - Service ClusterIP 자체가 삭제된다
          - q: Service가 실제로 사용할 백엔드 IP와 준비 상태를 확인할 리소스는?
            answer: EndpointSlice
            wrong:
              - ResourceQuota
              - PodDisruptionBudget
              - ClusterRoleBinding
        explain: <p>EndpointSlice는 Service의 백엔드 IP·포트와 ready·serving·terminating 상태를 담는다. Pod가 Running이어도 readiness가 실패하면 일반 트래픽 대상에서 빠진다. 그래서 배포 장애에서는 Pod 상태만 보지 않고 EndpointSlice와 readiness 이벤트를 함께 본다.</p>
