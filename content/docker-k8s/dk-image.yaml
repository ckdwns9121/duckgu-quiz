id: dk-image
name: Docker 이미지 · 빌드
color: "#2496ED"
dark: "#1769AA"
part: PART 1
lede: 빌드 캐시가 매번 깨지고, 비밀 값이 레이어에 남고, 실행 이미지가 불필요하게 커지는 원인을 Dockerfile에서 찾습니다.
blocks:
  - items:
      - id: dk-img-q-cache-order
        tag: 빌드 캐시
        title: 소스 한 줄에 의존성을 다시 받을 때
        type: mcq
        quizzes:
          - q: Node 앱에서 소스 한 줄만 바꿔도 npm ci가 매번 다시 실행된다. 캐시를 가장 잘 재사용하는 Dockerfile 순서는?
            answer: lockfile 복사 → npm ci → 소스 복사
            wrong:
              - 소스 전체 복사 → npm ci → lockfile 복사
              - npm ci → 소스 복사 → lockfile 복사
              - 소스 전체 복사 → npm ci → 소스 전체 재복사
          - q: Dockerfile 앞쪽의 COPY . . 레이어가 바뀌면 뒤의 RUN npm ci 캐시는 어떻게 될까?
            answer: 앞 레이어부터 달라져 npm ci도 다시 실행된다
            wrong:
              - package.json이 같으면 항상 재사용된다
              - RUN 명령은 파일 변경과 무관하게 재사용된다
              - 마지막 CMD만 다시 만들어지고 나머지는 유지된다
        explain: <p>Docker는 앞 레이어가 달라지면 그 뒤 레이어도 다시 만든다. 자주 안 바뀌는 <code>package.json</code>과 lockfile을 먼저 복사해 의존성을 설치하고, 자주 바뀌는 소스는 나중에 복사해야 코드 수정 때 설치 캐시를 살릴 수 있다.</p>
      - id: dk-img-q-invalidation
        tag: 캐시 무효화
        title: 최신 패키지를 기대했는데 그대로일 때
        type: mcq
        quizzes:
          - q: Dockerfile의 RUN apt-get update 명령 문자열이 같고 앞 레이어도 같다. 일주일 뒤 다시 빌드하면?
            answer: 캐시를 재사용해 update가 실행되지 않을 수 있다
            wrong:
              - 저장소 날짜를 비교해 반드시 다시 실행한다
              - apt 명령은 매 빌드마다 캐시를 무시한다
              - 이미지 태그가 같으면 전체 빌드가 실패한다
          - q: 캐시를 쓰지 않고 모든 빌드 단계를 다시 실행하면서 베이스 이미지도 새로 받으려면?
            answer: docker build --pull --no-cache
            wrong:
              - docker build --force-recreate
              - docker build --refresh-layers
              - docker pull 뒤 docker start
        explain: <p>일반 <code>RUN</code> 캐시는 컨테이너 안 파일의 최신 상태를 검사하지 않고 명령과 이전 레이어를 본다. <code>--no-cache</code>는 빌드 단계를 다시 실행하지만 베이스 이미지를 새로 받는 옵션은 아니므로, 둘 다 원하면 <code>--pull</code>을 함께 쓴다.</p>
      - id: dk-img-q-multistage
        tag: 멀티 스테이지
        title: 컴파일러가 운영 이미지에 남을 때
        type: mcq
        quizzes:
          - q: Go 앱 운영 이미지에 컴파일러와 소스가 모두 들어가 이미지가 크다. 가장 적절한 개선은?
            answer: 빌드 단계의 바이너리만 최종 단계로 복사한다
            wrong:
              - 한 단계에서 빌드 후 소스를 rm으로 지운다
              - 컨테이너 시작 시마다 바이너리를 컴파일한다
              - 운영 이미지를 압축 파일로 감싸서 실행한다
          - q: 멀티 스테이지 Dockerfile의 최종 이미지에 기본으로 포함되는 것은?
            answer: 마지막 단계와 COPY --from으로 가져온 파일
            wrong:
              - 모든 단계의 파일 시스템 전체
              - 이름이 build인 단계의 모든 레이어
              - 첫 단계에 설치한 패키지와 캐시 전체
        explain: <p>멀티 스테이지 빌드는 컴파일·테스트 도구가 있는 단계와 실행 단계를 분리한다. 마지막 단계에는 그 단계의 베이스와 <code>COPY --from</code>으로 고른 산출물만 남아 이미지 크기와 공격 표면이 줄어든다. 같은 단계에서 삭제하면 이전 레이어에는 파일이 남을 수 있다.</p>
      - id: dk-img-q-secret
        tag: 빌드 보안
        title: 레지스트리 토큰이 이미지에 남을 때
        type: mcq
        quizzes:
          - q: 비공개 패키지를 받으려고 토큰을 ARG로 전달해 RUN에서 사용했다. 왜 위험할까?
            answer: 이미지 메타데이터나 빌드 기록에 남을 수 있다
            wrong:
              - ARG는 컨테이너 포트를 자동으로 공개한다
              - ARG를 쓰면 멀티 스테이지 빌드가 꺼진다
              - 토큰이 컨테이너의 PID 1로 실행된다
          - q: BuildKit에서 빌드 중에만 토큰을 제공하고 레이어에 남기지 않으려면?
            answer: RUN --mount=type=secret을 사용한다
            wrong:
              - ENV TOKEN을 최종 단계에 선언한다
              - 토큰 파일을 COPY한 뒤 다음 RUN에서 지운다
              - LABEL에 토큰을 넣고 빌드 뒤 덮어쓴다
        explain: <p>빌드 인수와 환경 변수는 비밀 전달 수단이 아니다. 파일을 복사한 뒤 다음 레이어에서 지워도 앞 레이어에서 복구할 수 있다. BuildKit의 <code>secret</code> 마운트는 해당 <code>RUN</code> 동안만 비밀을 노출하고 결과 레이어에 포함하지 않는다.</p>
      - id: dk-img-q-context
        tag: 빌드 컨텍스트
        title: 빌드 전송이 느리고 키 파일도 보일 때
        type: mcq
        quizzes:
          - q: docker build . 시작 단계에서 수 GB가 전송되고 node_modules와 .git도 포함된다. 가장 먼저 할 일은?
            answer: .dockerignore에서 불필요한 경로를 제외한다
            wrong:
              - Dockerfile의 EXPOSE 줄을 삭제한다
              - 컨테이너에 tmpfs를 마운트한다
              - 이미지 태그를 latest에서 stable로 바꾼다
          - q: Dockerfile에 COPY . .가 있어도 .dockerignore에 secrets/가 있으면 기본 동작은?
            answer: secrets/는 빌드 컨텍스트와 COPY 대상에서 빠진다
            wrong:
              - COPY가 ignore보다 우선해 이미지에 들어간다
              - 파일은 복사되지만 docker history에서만 숨겨진다
              - 최종 이미지에서는 빠지지만 빌드 단계에는 들어간다
        explain: <p><code>.dockerignore</code>는 빌더에 보낼 컨텍스트 자체에서 파일을 제외한다. 전송량과 캐시 무효화를 줄이고 키·로컬 의존성의 우발적 복사를 막는다. 다만 이미 Git에 올라간 비밀이나 외부에서 내려받는 비밀까지 보호하는 기능은 아니다.</p>
      - id: dk-img-q-base
        tag: 재현 가능한 빌드
        title: 같은 태그인데 결과가 달라질 때
        type: mcq
        quizzes:
          - q: node:22 태그가 가리키는 이미지 변경까지 막아 완전히 같은 베이스를 쓰려면?
            answer: 이미지 다이제스트로 고정한다
            wrong:
              - 컨테이너 이름을 node-22로 고정한다
              - EXPOSE에 Node 버전을 적는다
              - 빌드할 때 --no-cache만 사용한다
          - q: 베이스 이미지의 보안 패치를 받으면서 태그 이동도 검토 가능한 방식으로 관리하려면?
            answer: 다이제스트 갱신을 자동 PR로 받아 검토한다
            wrong:
              - latest 태그를 영구히 로컬 캐시에서만 쓴다
              - 실행 중인 컨테이너 안에서 apt upgrade한다
              - 매 시작마다 Dockerfile을 다시 생성한다
        explain: <p>태그는 다른 이미지로 이동할 수 있지만 다이제스트는 특정 콘텐츠를 가리킨다. 다이제스트 고정은 재현성을 주는 대신 보안 수정도 자동으로 들어오지 않으므로, 의존성 업데이트 도구가 새 다이제스트를 제안하고 CI와 검토를 거쳐 갱신하게 만드는 방식이 실용적이다.</p>
