          term: 콜 스택
          sub: Call Stack
          desc: 지금 실행 중인 함수들이 쌓이는 곳. 콜 스택이 비어야 큐에서 다음 작업을 꺼낸다.
          hint: 무거운 동기 코드가 콜 스택을 오래 붙잡으면 화면이 멈춘다
          quiz: false
        - id: fe-as-t-state
          term: pending / fulfilled / rejected
          sub: Promise 상태
          desc: "<b>pending</b>: 아직 결과가 없는 대기 상태. <b>fulfilled</b>: 성공해서 값이 정해진 상태 (then 실행). <b>rejected</b>: 실패한 상태 (catch 실행)."
          hint: 한 번 fulfilled나 rejected가 되면 다시 바뀌지 않는다
          quiz: false
        - id: fe-as-t-async
          term: async / await
          desc: "<b>async</b>: 항상 Promise를 돌려주는 함수로 만든다. <b>await</b>: Promise가 끝날 때까지 그 함수의 나머지를 멈추고 기다린다."
          hint: await는 async 함수 안에서만 (모듈 최상단은 예외)
          quiz: false
