id: fe-browser
name: 브라우저 · DOM
color: "#1CB0F6"
dark: "#1899D6"
part: PART 3
lede: 렌더링 과정, 스크립트 로딩, 이벤트 전파, 저장소, CORS처럼 브라우저가 실제로 하는 일을 다룹니다.
blocks:
  - items:
      - id: fe-br-b-crp
        tag: 순서
        title: 브라우저 렌더링 순서
        type: build
        mode: order
        join: " → "
        q: HTML을 받아 화면에 그리기까지의 순서대로 놓으세요.
        tokens:
          - HTML 파싱 → DOM
          - CSS 파싱 → CSSOM
          - 렌더 트리
          - 레이아웃
          - 페인트
          - 합성
        why: <p class="why">DOM과 CSSOM을 합쳐 <b>렌더 트리</b>를 만들고 → 위치·크기 계산(<b>레이아웃</b>, 리플로우) → 픽셀 칠하기(<b>페인트</b>) → 레이어 합치기(<b>합성</b>). transform·opacity는 합성 단계만 다시 해서 가장 싸다.</p>
        hints:
          - 첫 번째 조각은 <b>HTML 파싱 → DOM</b>
          - DOM과 CSSOM을 합쳐 <b>렌더 트리</b>를 만들고 → 위치·크기 계산(<b>레이아웃</b>, 리플로우) → 픽셀 칠하기(<b>페인트</b>) → 레이어 합치기(<b>합성</b>). transform·opacity는 합성 단계만 다시 해서 가장 싸다.
      - id: fe-br-q-reflow
        tag: 렌더링
        title: 리플로우가 안 일어나는 변경
        type: mcq
        quizzes:
          - q: 다음 중 리플로우(레이아웃 다시 계산) 없이 다시 칠하기만 하는 변경은?
            answer: color를 바꾼다
            wrong:
              - width를 바꾼다
              - padding을 바꾼다
              - font-size를 바꾼다
        explain: <p>크기나 위치에 영향을 주는 속성(width, padding, font-size, margin, top…)은 <b>리플로우</b>를 일으킨다. color, background-color처럼 모양만 바꾸는 속성은 <b>리페인트</b>만 한다. transform·opacity는 합성 단계만 다시 해서 더 싸다.</p>
      - id: fe-br-q-anim
        tag: 성능
        title: 애니메이션 속성
        type: mcq
        quizzes:
          - q: 다음 중 리플로우 없이 처리돼 애니메이션에 가장 좋은 속성은?
            answer: transform
            wrong:
              - width
              - top
              - margin
        explain: <p>transform과 opacity는 레이아웃·페인트를 건너뛰고 <b>합성</b> 단계만 다시 해서 부드럽다. width·top·margin은 바꿀 때마다 리플로우가 일어난다.</p>
      - id: fe-br-q-script
        tag: script
        title: 스크립트 불러오기
        type: mcq
        quizzes:
          - q: lib.js와 그걸 쓰는 app.js를 순서대로 실행하면서, HTML 파싱은 막지 않으려면?
            answer: 둘 다 defer
            wrong:
              - 둘 다 async
              - 속성 없이 head에 둔다
              - app.js에만 async
          - q: 다른 코드와 상관없는 분석 스크립트를 다운로드되는 대로 바로 실행해도 된다. 가장 알맞은 것은?
            answer: async
            wrong:
              - defer
              - 속성 없이 head에 둔다
              - body 맨 위에 둔다
        explain: "<p><b>defer</b>: 파싱을 막지 않고 받아 두었다가 <b>파싱이 끝난 뒤 적힌 순서대로</b> 실행. <b>async</b>: 파싱을 막지 않고 받지만 <b>다 받는 즉시</b> 실행하므로 순서가 보장되지 않는다. 속성 없는 script는 받고 실행하는 동안 파싱을 멈춘다.</p>"
      - id: fe-br-q-load
        tag: 이벤트
        title: 페이지 로딩 이벤트
        type: mcq
        quizzes:
          - q: 이미지가 다 뜨기 전이라도 DOM이 준비되면 바로 버튼에 이벤트를 달고 싶다. 어떤 이벤트를 기다릴까?
            answer: DOMContentLoaded
            wrong:
              - load
              - pageshow
              - readystatechange의 complete
        explain: "<p><b>DOMContentLoaded</b>: HTML을 다 읽어 DOM이 만들어진 시점 (defer 스크립트 실행 뒤). <b>load</b>: 이미지, 스타일시트 같은 리소스까지 모두 받은 시점이라 더 늦다. readyState가 complete가 되는 것도 load와 같은 때다.</p>"
      - id: fe-br-b-event
        tag: 순서
        title: 이벤트 전파 순서
        type: build
        mode: order
        join: " → "
        q: 버튼을 클릭했을 때 이벤트가 전파되는 순서대로 놓으세요.
        tokens:
          - 캡처링 (위 → 아래)
          - 타깃
          - 버블링 (아래 → 위)
        why: '<p class="why">window에서 버튼까지 내려가며 <b>캡처링</b> → 버튼에서 <b>타깃</b> 단계 → 다시 window까지 올라가며 <b>버블링</b>. addEventListener는 기본으로 버블링 단계에서 실행되고, <code>{ capture: true }</code>를 주면 캡처링 단계.</p>'
        hints:
          - 첫 번째 조각은 <b>캡처링 (위 → 아래)</b>
          - "window에서 버튼까지 내려가며 <b>캡처링</b> → 버튼에서 <b>타깃</b> 단계 → 다시 window까지 올라가며 <b>버블링</b>. addEventListener는 기본으로 버블링 단계에서 실행되고, <code>{ capture: true }</code>를 주면 캡처링 단계."
      - id: fe-br-q-target
        tag: 이벤트
        title: target과 currentTarget
        type: mcq
        code: |-
          <ul id="list">
            <li><span>사과</span></li>
          </ul>

          list.addEventListener('click', (e) => {
            console.log(
              e.target.tagName,
              e.currentTarget.tagName
            );
          });
        quizzes:
          - q: span을 클릭하면 출력은?
            answer: SPAN UL
            wrong:
              - UL SPAN
              - LI UL
              - SPAN LI
        explain: <p><b>target</b>은 실제로 클릭된 가장 안쪽 요소(span), <b>currentTarget</b>은 지금 실행 중인 리스너가 달린 요소(ul). 이벤트 위임에서 누가 눌렸는지는 target으로, 보통 <code>e.target.closest('li')</code>로 항목을 찾는다.</p>
      - id: fe-br-q-prevent
        tag: 이벤트
        title: 폼 제출과 새로고침
        type: mcq
        quizzes:
          - q: addEventListener로 단 폼 submit 핸들러에서 페이지 새로고침을 막으려면?
            answer: e.preventDefault()
            wrong:
              - e.stopPropagation()
              - return false
              - e.stopImmediatePropagation()
        explain: <p><b>preventDefault</b>는 브라우저 기본 동작(폼 제출, 링크 이동)을 막는다. stopPropagation 계열은 <b>전파</b>만 막고 기본 동작은 그대로 일어난다. <code>return false</code>는 onsubmit 같은 속성 핸들러에서만 통하고 addEventListener에서는 아무 효과가 없다.</p>
      - id: fe-br-q-stop
        tag: 이벤트
        title: 모달 바깥 클릭
        type: mcq
        quizzes:
          - q: 모달 안을 클릭해도 바깥 배경에 달린 "닫기" 클릭 핸들러가 실행되지 않게 하려면?
            answer: 모달 안 클릭에서 e.stopPropagation()
            wrong:
              - 모달 안 클릭에서 e.preventDefault()
              - "배경 리스너를 capture: true로 단다"
              - "모달에 pointer-events: none을 준다"
        explain: "<p>모달은 배경 안에 있어서 클릭이 <b>버블링</b>으로 배경까지 올라간다. 모달에서 <b>stopPropagation</b>하면 배경 핸들러까지 가지 않는다. capture로 달면 배경 핸들러가 오히려 먼저 실행되고, pointer-events: none이면 모달 안을 아예 클릭할 수 없다. (배경 핸들러에서 <code>e.target === e.currentTarget</code>일 때만 닫는 방법도 있다.)</p>"
      - id: fe-br-q-origin
        tag: 출처
        title: 동일 출처 판단
        type: mcq
        quizzes:
          - q: https://a.com 페이지에서 다음 중 같은 출처(Same-Origin)인 것은?
            answer: https://a.com/other/page
            wrong:
              - http://a.com
              - https://api.a.com
              - https://a.com:8080
        explain: <p>경로(/other/page)는 출처에 들어가지 않는다. <b>프로토콜</b>(http), <b>호스트</b>(api.a.com), <b>포트</b>(8080) 중 하나라도 다르면 다른 출처.</p>
      - id: fe-br-q-cors
        tag: CORS
        title: CORS 에러 고치기
        type: mcq
        quizzes:
          - q: localhost:3000에서 api.shop.com으로 fetch했더니 CORS 에러가 났다. 고쳐야 할 곳은?
            answer: API 서버의 응답 헤더 (Allow-Origin)
            wrong:
              - 'fetch 옵션에 mode: "no-cors"를 넣는다'
              - 요청 헤더에 Origin을 직접 넣는다
              - 브라우저의 보안 설정을 끈다
          - q: "fetch로 Content-Type: application/json인 POST를 보내면, 본 요청 전에 브라우저가 먼저 보내는 요청은?"
            answer: OPTIONS
            wrong:
              - HEAD
              - GET
              - 없다. 바로 POST를 보낸다
        explain: <p>CORS는 <b>서버가 허락한 출처인지 브라우저가 확인</b>하는 규칙이라, 서버가 <code>Access-Control-Allow-Origin</code>으로 허락해야 풀린다. no-cors는 에러만 숨기고 응답 내용을 읽을 수 없게 만든다. JSON POST처럼 "단순 요청"이 아니면 브라우저가 <b>OPTIONS</b>로 먼저 물어보는 <b>preflight</b>를 보낸다.</p>
      - id: fe-br-q-storage
        tag: 저장소
        title: 어디에 저장할까
        type: mcq
        quizzes:
          - q: 로그인 세션 id처럼 서버가 요청마다 받아야 하는 값은?
            answer: 쿠키
            wrong:
              - localStorage
              - sessionStorage
              - 자바스크립트 변수
          - q: 작성 중인 글을 임시로 저장하되, 탭을 닫으면 버려도 된다.
            answer: sessionStorage
            wrong:
              - localStorage
              - 쿠키
              - 자바스크립트 변수
          - q: 다크 모드 설정처럼 브라우저를 껐다 켜도 남아야 하고, 서버는 몰라도 되는 값은?
            answer: localStorage
            wrong:
              - sessionStorage
              - 쿠키
              - 자바스크립트 변수
        explain: "<p><b>쿠키</b>: 요청마다 서버로 자동 전송 (약 4KB). <b>localStorage</b>: 지우기 전까지 남고 서버로 안 감. <b>sessionStorage</b>: 탭을 닫으면 사라짐. 자바스크립트 변수는 새로고침만 해도 사라진다.</p>"
      - id: fe-br-q-deferorder
        tag: script
        title: defer 두 개와 인라인
        type: mcq
        code: |-
          <!-- a.js는 log('a'), b.js는 log('b')만 한다 -->
          <script defer src="a.js"></script>
          <script defer src="b.js"></script>
          <script>log('inline')</script>
          <script>
            document.addEventListener('DOMContentLoaded',
              () => log('DOMContentLoaded'));
          </script>
        quizzes:
          - q: a.js는 늦게, b.js는 먼저 도착한다. 로그 순서는?
            answer: inline → a → b → DOMContentLoaded
            wrong:
              - inline → b → a → DOMContentLoaded
              - a → b → inline → DOMContentLoaded
              - inline → DOMContentLoaded → a → b
        explain: <p>defer 스크립트는 받는 동안 파싱을 막지 않고, <b>파싱이 끝난 뒤 문서에 적힌 순서대로</b> 실행된다. 먼저 도착한 b.js도 a.js를 기다린다. 그리고 defer 스크립트가 모두 끝나야 <b>DOMContentLoaded</b>가 발생한다. 인라인 스크립트는 파서가 만나는 즉시 실행된다.</p>
      - id: fe-br-q-module
        tag: script
        title: type="module"의 실행 시점
        type: mcq
        code: |-
          <script type="module">log('module')</script>
          <script>log('classic')</script>
        quizzes:
          - q: 로그 순서는?
            answer: classic → module
            wrong:
              - module → classic
              - module은 실행되지 않는다
              - 매번 순서가 다르다
        explain: <p><code>type="module"</code> 스크립트는 인라인이어도 <b>기본으로 defer처럼</b> 동작해서, 파싱이 끝난 뒤(DOMContentLoaded 전에) 실행된다. 그래서 뒤에 있는 일반 스크립트가 먼저다. module에 async를 주면 준비되는 대로 실행된다.</p>
      - id: fe-br-q-dynscript
        tag: script
        title: JS로 넣은 script
        type: mcq
        code: |-
          for (const name of ['one', 'two']) {
            const s = document.createElement('script');
            s.src = `/${name}.js`;
            document.head.append(s);
          }
        quizzes:
          - q: one.js는 늦게, two.js는 먼저 도착한다. 실행 순서는?
            answer: two → one
            wrong:
              - one → two
              - one만 실행된다
              - two만 실행된다
          - q: JS로 넣은 두 스크립트를 넣은 순서대로 실행하려면?
            answer: s.async = false
            wrong:
              - s.defer = true
              - s.type = 'module'
              - document.head 대신 body에 넣는다
        explain: <p>createElement로 넣은 script는 <b>기본이 async</b>라 도착하는 대로 실행된다. <code>s.async = false</code>를 주면 넣은 순서가 지켜진다. 동적으로 넣은 script에는 <b>defer가 효과가 없다</b>(실제 Chrome에서도 two → one 그대로).</p>
      - id: fe-br-q-innerscript
        tag: 보안
        title: innerHTML로 넣은 script
        type: mcq
        code: |-
          box.innerHTML =
            '<script>log("script")<\/script>' +
            '<img src="x" onerror="log(\'onerror\')">';
        quizzes:
          - q: 이 코드를 실행하면?
            answer: script는 안 돌고, img의 onerror는 돈다
            wrong:
              - script와 img의 onerror가 모두 돈다
              - script만 돌고, onerror는 무시된다
              - 둘 다 안 돌고 글자로만 보인다
        explain: <p>HTML 표준상 <b>innerHTML로 넣은 &lt;script&gt;는 실행되지 않는다</b>. 그렇다고 안전한 것은 아니다. <code>onerror</code> 같은 이벤트 속성은 실행되므로 innerHTML에 사용자 입력을 넣으면 XSS가 된다. 사용자 입력은 textContent로 넣는다.</p>
      - id: fe-br-q-hints
        tag: 성능
        title: 미리 연결하기와 미리 받기
        type: mcq
        quizzes:
          - q: 다른 도메인(CDN)에서 곧 파일을 받을 테니 연결(DNS·TCP·TLS)만 먼저 맺어 두고 싶다.
            answer: <link rel="preconnect">
            wrong:
              - <link rel="preload">
              - <link rel="prefetch">
              - <link rel="modulepreload">
          - q: 지금 페이지가 곧 쓸 폰트 파일을 높은 우선순위로 먼저 받고 싶다.
            answer: <link rel="preload">
            wrong:
              - <link rel="prefetch">
              - <link rel="preconnect">
              - <link rel="dns-prefetch">
          - q: 사용자가 다음에 갈 페이지의 JS를 한가할 때 미리 받아 두고 싶다.
            answer: <link rel="prefetch">
            wrong:
              - <link rel="preload">
              - <link rel="preconnect">
              - <link rel="modulepreload">
        explain: "<p><b>preconnect</b>: 연결만 미리 (파일은 아직). <b>preload</b>: <b>지금 페이지</b>가 곧 쓸 파일을 높은 우선순위로. <b>prefetch</b>: <b>다음 탐색</b>에 쓸 파일을 낮은 우선순위로. dns-prefetch는 DNS 조회만, modulepreload는 JS 모듈을 preload하는 것.</p>"
      - id: fe-br-q-bfcache
        tag: 성능
        title: 뒤로 가기 캐시(bfcache)
        type: mcq
        quizzes:
          - q: 뒤로 가기를 눌렀을 때 페이지를 메모리에서 바로 복원하는 bfcache를 막는 대표적인 코드는?
            answer: window.addEventListener('unload', ...)
            wrong:
              - document.addEventListener('DOMContentLoaded', ...)
              - localStorage.setItem(...)
              - <script defer>
        explain: <p><b>unload 리스너</b>가 있으면 브라우저가 페이지를 bfcache에 넣지 못해 뒤로 가기 때 새로 불러온다. 페이지를 떠날 때 할 일은 <code>pagehide</code>나 <code>visibilitychange</code>에서 한다. 복원됐는지는 <code>pageshow</code> 이벤트의 <code>persisted</code>로 알 수 있다.</p>
      - id: fe-br-q-clickseq
        tag: 이벤트
        title: 클릭 한 번의 이벤트 순서
        type: mcq
        quizzes:
          - q: 사용자가 마우스로 버튼을 한 번 클릭하면, 버튼에서 일어나는 이벤트 순서는?
            answer: pointerdown → mousedown → focus → pointerup → mouseup → click
            wrong:
              - mousedown → mouseup → click → focus
              - click → mousedown → mouseup → focus
              - focus → pointerdown → mousedown → pointerup → mouseup → click
        explain: <p>누르는 순간 <b>pointerdown → mousedown</b>, 그 기본 동작으로 <b>focus</b>가 옮겨지고, 떼면 <b>pointerup → mouseup</b>, 마지막에 <b>click</b>. 그래서 mousedown에서 preventDefault하면 포커스가 옮겨지지 않는다(드롭다운 항목을 누를 때 입력창 포커스를 지키는 요령).</p>
      - id: fe-br-q-phases
        tag: 이벤트
        title: 캡처와 버블 순서
        type: mcq
        code: |-
          // <div id="outer"><button id="btn"></button></div>
          const on = (el, name, capture) =>
            el.addEventListener('click', () => log(name), capture);

          on(outer, 'O버블');
          on(outer, 'O캡처', true);
          on(btn, 'B버블');
          on(btn, 'B캡처', true);
          on(document, 'D캡처', true);
        quizzes:
          - q: button을 클릭하면 로그 순서는?
            answer: D캡처 → O캡처 → B캡처 → B버블 → O버블
            wrong:
              - D캡처 → O버블 → O캡처 → B버블 → B캡처
              - O버블 → O캡처 → B버블 → B캡처 → D캡처
              - B캡처 → B버블 → O캡처 → O버블 → D캡처
        explain: <p>이벤트는 위에서 아래로 내려가며 <b>캡처</b> 리스너를 부르고, 타깃에 도착한 뒤 아래에서 위로 올라가며 <b>버블</b> 리스너를 부른다. <b>등록한 순서는 상관없다</b>(outer에 버블을 먼저 달았어도 캡처가 먼저). 타깃 자신에서도 캡처가 버블보다 먼저다.</p>
      - id: fe-br-q-stopprop2
        tag: 이벤트
        title: stopPropagation 뒤의 리스너
        type: mcq
        code: |-
          btn.addEventListener('click', (e) => {
            log('btn 1');
            e.stopPropagation();
          });
          btn.addEventListener('click', () => log('btn 2'));
          outer.addEventListener('click', () => log('outer'));
        quizzes:
          - q: 버튼을 클릭하면 로그 순서는?
            answer: btn 1 → btn 2
            wrong:
              - btn 1
              - btn 1 → btn 2 → outer
              - btn 1 → outer
          - q: btn 1에서 같은 버튼의 btn 2까지 막으려면?
            answer: e.stopImmediatePropagation()
            wrong:
              - e.stopPropagation()을 두 번 부른다
              - e.preventDefault()
              - return false
        explain: <p><b>stopPropagation</b>은 이벤트가 <b>다른 요소로</b> 전파되는 것만 막는다. 같은 요소에 달린 나머지 리스너(btn 2)는 그대로 실행된다. 같은 요소의 나머지 리스너까지 막는 것이 <b>stopImmediatePropagation</b>이다.</p>
      - id: fe-br-q-samefn
        tag: 이벤트
        title: 같은 함수를 두 번 등록
        type: mcq
        code: |-
          let n = 0;
          const onClick = () => n++;
          btn.addEventListener('click', onClick);
          btn.addEventListener('click', onClick);
        quizzes:
          - q: 버튼을 한 번 클릭하면 n은?
            answer: "1"
            wrong:
              - "2"
              - "0"
              - 에러가 난다
        explain: <p>같은 요소, 같은 이벤트, <b>같은 함수</b>, 같은 capture 설정으로 두 번 등록하면 <b>한 번만 등록</b>된다. 반대로 매번 새 화살표 함수를 넘기면 서로 다른 함수라 여러 번 등록된다.</p>
      - id: fe-br-q-removeanon
        tag: 이벤트
        title: 익명 함수 제거하기
        type: mcq
        code: |-
          let n = 0;
          btn.addEventListener('click', () => n++);
          btn.removeEventListener('click', () => n++);
        quizzes:
          - q: 버튼을 한 번 클릭하면 n은?
            answer: "1"
            wrong:
              - "0"
              - "2"
              - 에러가 난다
        explain: "<p>removeEventListener는 등록할 때와 <b>같은 함수 참조</b>를 넘겨야 지운다. 모양이 같아도 새로 만든 화살표 함수는 다른 함수라 아무것도 지워지지 않는다. 지울 계획이면 함수를 변수에 담아 두거나, <code>{ once: true }</code>나 <code>AbortController</code>의 signal을 쓴다.</p>"
      - id: fe-br-q-focusin
        tag: 이벤트
        title: form에서 포커스 감지
        type: mcq
        code: |-
          form.addEventListener('focus', () => log('focus'));
          form.addEventListener('focusin', () => log('focusin'));

          // <form id="form"><input></form>
        quizzes:
          - q: input을 클릭해 포커스하면 로그에 찍히는 것은?
            answer: focusin만
            wrong:
              - focus와 focusin
              - focus만
              - 아무것도 안 찍힌다
        explain: <p><b>focus와 blur는 버블링하지 않는다</b>. 그래서 부모(form)에 단 focus 리스너는 자식 input의 포커스를 받지 못한다. 버블링하는 <b>focusin / focusout</b>을 쓰거나, focus를 캡처 단계(<code>true</code>)로 단다.</p>
      - id: fe-br-q-passive
        tag: 이벤트
        title: passive 리스너
        type: mcq
        quizzes:
          - q: "passive: true로 단 wheel 리스너에서 e.preventDefault()를 부르면?"
            answer: 무시되고 스크롤은 그대로 된다
            wrong:
              - 스크롤이 막힌다
              - 에러가 던져진다
              - 리스너가 자동으로 제거된다
        explain: '<p><code>passive: true</code>는 "이 리스너는 기본 동작을 막지 않는다"는 약속이다. 그래서 브라우저가 리스너를 기다리지 않고 바로 스크롤해 부드럽다. 그 안의 preventDefault는 <b>무시</b>되고(defaultPrevented도 false) 콘솔 경고만 뜬다. 스크롤을 막아야 하면 passive: false로 단다.</p>'
      - id: fe-br-q-mo
        tag: 이벤트 루프
        title: MutationObserver의 실행 시점
        type: mcq
        code: |-
          new MutationObserver(() => log('mo'))
            .observe(el, { childList: true });
          setTimeout(() => log('timeout'));
          el.textContent = 'x';
          Promise.resolve().then(() => log('then'));
          log('sync');
        quizzes:
          - q: 로그 순서는?
            answer: sync → mo → then → timeout
            wrong:
              - sync → then → mo → timeout
              - sync → timeout → mo → then
              - mo → sync → then → timeout
        explain: <p>MutationObserver 콜백은 <b>마이크로태스크</b>로 실행된다. DOM을 바꾼 순간(textContent 대입) 마이크로태스크가 줄을 서고, then은 그 뒤에 줄을 서서 mo가 먼저다. 동기 코드가 끝나면 마이크로태스크를 모두 실행한 뒤 setTimeout(매크로태스크)이 실행된다.</p>
      - id: fe-br-q-raf
        tag: 렌더링
        title: requestAnimationFrame의 시점
        type: mcq
        quizzes:
          - q: requestAnimationFrame(fn)의 fn은 언제 실행될까?
            answer: 다음 화면을 그리기 직전
            wrong:
              - 지금 코드가 끝난 직후, then보다 먼저
              - 정확히 16ms 뒤 setTimeout처럼
              - 화면을 그린 직후
        explain: "<p>rAF 콜백은 브라우저가 <b>다음 프레임을 그리기 직전</b>(스타일·레이아웃 계산 전)에 실행된다. 그래서 애니메이션에 setTimeout 대신 쓴다. 마이크로태스크(then)보다는 늦다(실제 Chrome: sync → then → raf). 백그라운드 탭에서는 멈춘다.</p>"
      - id: fe-br-q-thrash
        tag: 렌더링
        title: 반복문 안에서 읽고 쓰기
        type: mcq
        code: |-
          for (const el of items) {
            el.style.width = box.offsetWidth + 'px';
          }
        quizzes:
          - q: 항목이 1000개면 이 코드가 느린 이유는?
            answer: offsetWidth를 읽을 때마다 레이아웃을 다시 계산해서
            wrong:
              - style.width를 바꿀 때마다 화면을 새로 그려서
              - box를 찾는 querySelector가 반복마다 실행돼서
              - + 'px' 문자열 더하기가 반복마다 느려서
          - q: 어떻게 고치면 될까?
            answer: offsetWidth를 반복문 밖에서 한 번만 읽는다
            wrong:
              - style.width 대신 setAttribute로 바꾼다
              - 반복문을 forEach로 바꾼다
              - requestIdleCallback 안에서 같은 반복문을 돌린다
        explain: <p>스타일을 바꾼 뒤 <b>offsetWidth 같은 레이아웃 값을 읽으면</b> 브라우저는 정확한 값을 주려고 그 자리에서 레이아웃을 다시 계산한다(강제 동기 레이아웃). 반복마다 쓰기 → 읽기가 번갈아 1000번 계산된다(layout thrashing). <b>읽기를 먼저 몰아서, 쓰기는 나중에 몰아서</b> 하면 한 번이면 된다.</p>
      - id: fe-br-q-storageevent
        tag: 저장소
        title: storage 이벤트
        type: mcq
        quizzes:
          - q: 탭 A에서 localStorage.setItem('theme', 'dark')를 하면, storage 이벤트는 어디서 발생할까?
            answer: 같은 사이트를 연 다른 탭(B)에서만
            wrong:
              - 값을 바꾼 탭 A에서만
              - A와 B 모두
              - 발생하지 않는다
        explain: <p>storage 이벤트는 <b>다른 탭(같은 출처)</b>에 "저장소가 바뀌었다"고 알려 주는 용도라, 값을 바꾼 탭 자신에서는 발생하지 않는다. 그래서 탭 사이 로그아웃·테마 동기화에 쓴다. 같은 탭 안에서 알리려면 직접 이벤트를 만들거나 BroadcastChannel을 쓴다.</p>
      - id: fe-br-q-swupdate
        tag: 서비스 워커
        title: 새 서비스 워커가 안 켜질 때
        type: mcq
        quizzes:
          - q: 새 서비스 워커를 배포했는데 새로고침해도 예전 버전이 계속 동작한다. 가장 흔한 이유는?
            answer: 새 워커가 설치된 뒤 waiting 상태로 기다려서
            wrong:
              - 브라우저가 워커 파일을 영원히 캐시해서
              - 워커는 하루에 한 번만 업데이트를 확인해서
              - 사이트가 HTTPS가 아니라 워커가 안 켜져서
        explain: <p>새 서비스 워커는 설치된 뒤 <b>waiting</b> 상태로 기다린다. 예전 워커가 관리하는 탭이 하나라도 열려 있으면 새로고침만으로는 교체되지 않는다(새로고침하는 동안에도 탭이 유지되기 때문). 바로 교체하려면 install에서 <code>skipWaiting()</code>, activate에서 <code>clients.claim()</code>을 쓴다.</p>
      - id: fe-br-q-cred
        tag: CORS
        title: 쿠키를 실은 요청
        type: mcq
        quizzes:
          - q: "fetch(url, { credentials: 'include' })에 서버가 Access-Control-Allow-Origin: *로 답하면?"
            answer: 브라우저가 응답을 막는다
            wrong:
              - 쿠키 없이 성공한다
              - 쿠키와 함께 성공한다
              - preflight만 실패하고 본 요청은 성공한다
          - q: 다음 중 preflight(OPTIONS) 없이 바로 가는 요청은?
            answer: 헤더를 따로 붙이지 않은 GET
            wrong:
              - Authorization 헤더를 붙인 GET
              - Content-Type이 application/json인 POST
              - PUT 요청
        explain: "<p>쿠키를 실은(credentials) 요청은 서버가 <b>와일드카드(*) 대신 정확한 출처</b>를 적고 <code>Access-Control-Allow-Credentials: true</code>를 보내야 브라우저가 응답을 넘겨준다. <b>단순 요청</b>(GET·HEAD·POST, 기본 헤더만, form 계열 Content-Type)만 preflight 없이 간다. Authorization 헤더나 JSON Content-Type을 붙이면 OPTIONS로 먼저 묻는다.</p>"
      - id: fe-br-q-samesite
        tag: 쿠키
        title: SameSite=Lax
        type: mcq
        quizzes:
          - q: SameSite=Lax 쿠키는 다른 사이트에서 시작된 어떤 요청에 붙을까?
            answer: 링크를 눌러 이동하는 GET 요청
            wrong:
              - 다른 사이트 form의 POST 제출
              - 다른 사이트 페이지가 보낸 fetch
              - 다른 사이트에 넣은 iframe 안의 요청
        explain: <p><b>Lax</b>(현재 브라우저 기본값)는 다른 사이트에서 온 요청에는 쿠키를 붙이지 않되, <b>링크를 눌러 주소창이 바뀌는 최상위 GET 이동</b>에는 붙인다. 그래서 외부 링크로 들어와도 로그인이 유지되면서 다른 사이트의 POST를 이용한 CSRF는 막힌다. Strict는 이동에도 안 붙이고, None은 다 붙인다(Secure 필수).</p>
  - group: 브라우저 용어
  - table:
      heads:
        - 용어
        - 뜻
        - 예시 · 외우는 법
      rows:
        - id: fe-br-t-reflow
          term: 리플로우 / 리페인트
          desc: "<b>리플로우</b>: 크기나 위치가 바뀌어 레이아웃을 다시 계산하는 것. <b>리페인트</b>: 색이나 그림자처럼 모양만 다시 칠하는 것."
          hint: "리플로우: width, top, margin 변경. 리페인트: color, background 변경. 리플로우가 더 비싸다"
          quiz: false
        - id: fe-br-t-script
          term: async / defer
          sub: script 속성
          desc: "<b>async</b>: 다운로드가 끝나는 즉시 HTML 파싱을 멈추고 실행하며, 실행 순서는 보장되지 않는다. <b>defer</b>: HTML 파싱이 끝난 뒤 문서에 적힌 순서대로 실행한다."
          hint: 서로 의존하는 스크립트는 defer, 분석 스크립트처럼 독립된 건 async
          quiz: false
        - id: fe-br-t-deleg
          term: 이벤트 위임
          sub: Event Delegation
          desc: 자식마다 리스너를 달지 않고 부모 하나에 달아서 event.target으로 누가 눌렸는지 구분하는 방식.
          hint: 버블링 덕분에 가능. 목록 항목이 늘어나도 리스너는 하나
          quiz: false
        - id: fe-br-t-storage
          term: localStorage / sessionStorage / 쿠키
          desc: "<b>localStorage</b>: 직접 지우기 전까지 남고, 서버로 보내지 않는다. <b>sessionStorage</b>: 탭을 닫으면 사라진다. <b>쿠키</b>: 요청할 때마다 서버로 같이 전송되고, 만료일을 정할 수 있다."
          hint: "용량: 로컬·세션 스토리지 약 5MB, 쿠키 약 4KB"
          quiz: false
        - id: fe-br-t-origin
          term: 동일 출처
          sub: Same-Origin
          desc: 프로토콜, 호스트, 포트가 모두 같은 것. 하나라도 다르면 다른 출처로 본다.
          hint: https://a.com 과 http://a.com 은 프로토콜이 달라서 다른 출처
          quiz: false
        - id: fe-br-t-cors
          term: CORS
          sub: Cross-Origin Resource Sharing
          desc: 다른 출처의 리소스를 요청할 때, 서버가 응답 헤더로 허락해야 브라우저가 결과를 넘겨주는 규칙.
          hint: 서버가 Access-Control-Allow-Origin 헤더를 보내야 함. 막는 건 서버가 아니라 브라우저
          quiz: false
        - id: fe-br-t-prevent
          term: preventDefault
          desc: 링크 이동, 폼 제출 같은 브라우저 기본 동작을 막는다.
          hint: 폼 제출 막기는 preventDefault
          quiz: false
        - id: fe-br-t-stop
          term: stopPropagation
          desc: 이벤트가 부모로 더 전파되지 않게 막는다.
          hint: 부모 클릭 핸들러까지 가는 걸 막기는 stopPropagation
          quiz: false
