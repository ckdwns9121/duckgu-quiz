id: fe-js
name: JavaScript 핵심
color: "#E5A800"
dark: "#B88700"
part: PART 1
lede: 호이스팅, 클로저, this, 비교 연산, 복사처럼 면접과 코드 리뷰에서 가장 많이 헷갈리는 것만 모았습니다.
blocks:
  - items:
      - id: fe-js-hoist
        tag: JS
        title: var 호이스팅
        type: answer
        run: node
        code: |-
          console.log(a);
          var a = 1;
          console.log(a);
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: undefined 1
        steps:
          - <code>var a</code> 선언이 맨 위로 끌어올려진 것처럼 동작하고, 값은 <b>undefined</b>로 시작
          - 첫 <code>console.log(a)</code> → <b>undefined</b> (에러가 아님)
          - <code>a = 1</code> 대입 뒤 두 번째 출력 → <b>1</b>
        why: "<b>기억할 것</b>: <mark>var는 선언만 올라가고 값은 안 올라간다</mark>. let·const였다면 첫 줄에서 ReferenceError."
        hints:
          - <code>var a</code> 선언이 맨 위로 끌어올려진 것처럼 동작하고, 값은 <b>undefined</b>로 시작
          - "<b>기억할 것</b>: <mark>var는 선언만 올라가고 값은 안 올라간다</mark>. let·const였다면 첫 줄에서 ReferenceError."
      - id: fe-js-q-const
        tag: JS
        title: const 객체 바꾸기
        type: mcq
        code: |-
          const cfg = { dark: false };
          cfg.dark = true;
          console.log(cfg.dark);
        quizzes:
          - q: 이 코드를 실행하면?
            answer: true가 출력된다
            wrong:
              - TypeError가 난다
              - false가 출력된다
              - SyntaxError가 난다
        explain: <p>const가 막는 건 <b>변수에 다시 대입하는 것</b>(<code>cfg = {}</code>)뿐이다. 변수가 가리키는 객체의 속성은 바꿀 수 있다. 속성까지 막으려면 <code>Object.freeze(cfg)</code>.</p>
      - id: fe-js-closure
        tag: JS
        title: 클로저 카운터
        type: answer
        run: node
        code: |-
          function makeCounter() {
            let n = 0;
            return () => ++n;
          }
          const c1 = makeCounter();
          const c2 = makeCounter();
          console.log(c1(), c1(), c2());
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: 1 2 1
        steps:
          - <code>makeCounter()</code>를 부를 때마다 <b>새 n</b>이 만들어짐
          - c1은 자기 n을 기억 → 1, 2
          - c2는 따로 만든 n → 1
        why: "<b>기억할 것</b>: <mark>클로저는 만들어질 때의 변수를 각자 따로 기억</mark>한다. c1과 c2는 서로의 n을 모른다."
        hints:
          - <code>makeCounter()</code>를 부를 때마다 <b>새 n</b>이 만들어짐
          - "<b>기억할 것</b>: <mark>클로저는 만들어질 때의 변수를 각자 따로 기억</mark>한다. c1과 c2는 서로의 n을 모른다."
      - id: fe-js-q-redeclare
        tag: JS
        title: 다시 선언하기
        type: mcq
        quizzes:
          - q: 같은 스코프에서 같은 이름으로 한 번 더 선언해도 에러가 나지 않는 것은?
            answer: var
            wrong:
              - let
              - const
              - let과 const 둘 다
        explain: <p><code>var a = 1; var a = 2;</code>는 조용히 넘어가서 실수를 숨긴다. let·const는 같은 스코프에서 다시 선언하면 <b>SyntaxError</b>. var 대신 let·const를 쓰는 이유 중 하나.</p>
      - id: fe-js-varloop
        tag: JS
        title: var + setTimeout 반복문
        type: answer
        run: node
        code: |-
          for (var i = 0; i < 3; i++) {
            setTimeout(() => console.log(i));
          }
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: 3 3 3
        steps:
          - <code>var i</code>는 반복문 전체에서 <b>하나</b>뿐
          - setTimeout 콜백은 반복문이 다 끝난 뒤 실행 → 그때 i는 <b>3</b>
          - 세 콜백이 같은 i를 보므로 3이 세 번
        why: "<b>기억할 것</b>: <mark>var는 함수 스코프라 반복마다 새로 안 생긴다</mark>. 해결: let으로 바꾸기."
        hints:
          - <code>var i</code>는 반복문 전체에서 <b>하나</b>뿐
          - "<b>기억할 것</b>: <mark>var는 함수 스코프라 반복마다 새로 안 생긴다</mark>. 해결: let으로 바꾸기."
      - id: fe-js-letloop
        tag: JS
        title: let + setTimeout 반복문
        type: answer
        run: node
        code: |-
          for (let i = 0; i < 3; i++) {
            setTimeout(() => console.log(i));
          }
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: 0 1 2
        steps:
          - <code>let i</code>는 반복마다 <b>새 i</b>가 만들어짐
          - 각 콜백이 자기 반복의 i를 기억 (클로저)
          - 0, 1, 2 순서로 출력
        why: "<b>기억할 것</b>: <mark>let은 블록 스코프라 반복마다 새 변수</mark>. var 문제와 짝으로 외우기."
        hints:
          - <code>let i</code>는 반복마다 <b>새 i</b>가 만들어짐
          - "<b>기억할 것</b>: <mark>let은 블록 스코프라 반복마다 새 변수</mark>. var 문제와 짝으로 외우기."
      - id: fe-js-call
        tag: JS
        title: this와 call
        type: answer
        run: node
        code: |-
          const obj = {
            name: 'A',
            hi() { return this.name; },
          };
          console.log(obj.hi());
          console.log(obj.hi.call({ name: 'B' }));
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: A B
        steps:
          - <code>obj.hi()</code> → 점 앞의 객체(obj)가 this → <b>A</b>
          - "<code>obj.hi.call({ name: 'B' })</code> → call로 넘긴 객체가 this → <b>B</b>"
        why: "<b>기억할 것</b>: 일반 함수의 this는 <mark>어떻게 불렀는지</mark>로 정해진다. 점 앞의 객체, 또는 call·apply·bind로 넘긴 객체."
        hints:
          - <code>obj.hi()</code> → 점 앞의 객체(obj)가 this → <b>A</b>
          - "<b>기억할 것</b>: 일반 함수의 this는 <mark>어떻게 불렀는지</mark>로 정해진다. 점 앞의 객체, 또는 call·apply·bind로 넘긴 객체."
      - id: fe-js-this2
        tag: JS
        title: 메서드와 화살표 함수의 this
        type: answer
        run: node
        code: |-
          const user = {
            nick: 'kim',
            hi() { return this.nick; },
            bye: () => this.nick,
          };
          console.log(user.hi());
          console.log(user.bye());
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: kim undefined
        steps:
          - <code>user.hi()</code> → 일반 메서드라 점 앞의 user가 this → <b>kim</b>
          - <code>bye</code>는 화살표 함수라 자기 this가 없고, 객체 리터럴을 감싼 바깥(최상위)의 this를 씀
          - 최상위 this에는 nick이 없음 → <b>undefined</b>
        why: "<b>기억할 것</b>: <mark>객체 메서드를 화살표 함수로 쓰면 this가 객체가 아니다</mark>. 객체 리터럴의 중괄호는 스코프가 아니다."
        hints:
          - <code>user.hi()</code> → 일반 메서드라 점 앞의 user가 this → <b>kim</b>
          - "<b>기억할 것</b>: <mark>객체 메서드를 화살표 함수로 쓰면 this가 객체가 아니다</mark>. 객체 리터럴의 중괄호는 스코프가 아니다."
      - id: fe-js-q-timer
        tag: JS
        title: 콜백 안의 this
        type: mcq
        code: |-
          class Timer {
            count = 0;
            start() {
              setTimeout(function () {
                this.count++;
              }, 100);
            }
          }
        quizzes:
          - q: start() 뒤 100ms가 지나도 count가 늘지 않는다. 가장 간단한 해결은?
            answer: function을 화살표 함수로 바꾼다
            wrong:
              - setTimeout 시간을 0으로 바꾼다
              - this.count 대신 count++로 쓴다
              - count를 let으로 선언한다
        explain: <p>setTimeout에 넘긴 <b>일반 함수</b>는 나중에 그냥 호출되므로 this가 인스턴스가 아니다. 화살표 함수는 자기 this가 없어서 <b>start()의 this(인스턴스)</b>를 그대로 쓴다. <code>count++</code>만 쓰면 없는 변수를 찾다가 ReferenceError.</p>
      - id: fe-js-q-tdz
        tag: JS
        title: let 선언 전에 읽기
        type: mcq
        code: |-
          try {
            console.log(b);
          } catch (e) {
            console.log(e.name);
          }
          let b = 2;
        quizzes:
          - q: 이 코드의 출력은?
            answer: ReferenceError
            wrong:
              - undefined
              - "2"
              - TypeError
        explain: <p>let은 선언 전 구간(TDZ)에서 읽으면 <b>ReferenceError</b>를 던진다. var였다면 undefined.</p>
      - id: fe-js-equal
        tag: JS
        title: == 와 ===
        type: answer
        run: node
        code: |-
          console.log(0 == '0');
          console.log(0 === '0');
          console.log(null == undefined);
          console.log(null === undefined);
          console.log(NaN === NaN);
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: true false true false false
        steps:
          - <code>0 == '0'</code> → 타입을 맞춰 비교 → <b>true</b>
          - <code>0 === '0'</code> → 타입이 다름 → <b>false</b>
          - <code>null == undefined</code> → 특별 규칙으로 <b>true</b>
          - <code>null === undefined</code> → <b>false</b>
          - <code>NaN === NaN</code> → NaN은 자기 자신과도 다름 → <b>false</b>
        why: "<b>기억할 것</b>: <mark>==는 타입을 바꿔서 비교, ===는 타입까지 비교</mark>. NaN 확인은 Number.isNaN()."
        hints:
          - <code>0 == '0'</code> → 타입을 맞춰 비교 → <b>true</b>
          - "<b>기억할 것</b>: <mark>==는 타입을 바꿔서 비교, ===는 타입까지 비교</mark>. NaN 확인은 Number.isNaN()."
      - id: fe-js-typeof
        tag: JS
        title: typeof 함정
        type: answer
        run: node
        code: |-
          console.log(typeof null);
          console.log(typeof []);
          console.log(typeof undefined);
          console.log(typeof function () {});
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: object object undefined function
        steps:
          - <code>typeof null</code> → <b>object</b> (JS 초기 설계 버그가 그대로 남음)
          - <code>typeof []</code> → 배열도 <b>object</b>
          - <code>typeof undefined</code> → <b>undefined</b>
          - <code>typeof function(){}</code> → <b>function</b>
        why: "<b>기억할 것</b>: <mark>null과 배열은 typeof로 구별이 안 된다</mark>. 배열은 Array.isArray(), null은 === null."
        hints:
          - <code>typeof null</code> → <b>object</b> (JS 초기 설계 버그가 그대로 남음)
          - "<b>기억할 것</b>: <mark>null과 배열은 typeof로 구별이 안 된다</mark>. 배열은 Array.isArray(), null은 === null."
      - id: fe-js-truthy
        tag: JS
        title: truthy · falsy
        type: answer
        run: node
        code: |-
          console.log(Boolean(''));
          console.log(Boolean('0'));
          console.log(Boolean([]));
          console.log(Boolean(0));
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: false true true false
        steps:
          - <code>''</code> 빈 문자열 → <b>false</b>
          - <code>'0'</code> 글자가 있는 문자열 → <b>true</b>
          - <code>[]</code> 빈 배열도 객체라 → <b>true</b>
          - <code>0</code> → <b>false</b>
        why: "<b>기억할 것</b>: falsy는 <mark>false, 0, '', null, undefined, NaN</mark> 여섯 개뿐. 나머지는 빈 배열·빈 객체까지 전부 truthy."
        hints:
          - <code>''</code> 빈 문자열 → <b>false</b>
          - "<b>기억할 것</b>: falsy는 <mark>false, 0, '', null, undefined, NaN</mark> 여섯 개뿐. 나머지는 빈 배열·빈 객체까지 전부 truthy."
      - id: fe-js-nullish
        tag: JS
        title: "|| 와 ?? 와 ?."
        type: answer
        run: node
        code: |-
          const u = { n: 0 };
          console.log(u.n || 5);
          console.log(u.n ?? 5);
          console.log(u.x?.y);
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: 5 0 undefined
        steps:
          - <code>u.n || 5</code> → 0은 falsy라 <b>5</b>
          - <code>u.n ?? 5</code> → ??는 null·undefined일 때만 뒤를 씀 → <b>0</b>
          - <code>u.x?.y</code> → u.x가 없으니 에러 대신 <b>undefined</b>
        why: "<b>기억할 것</b>: <mark>||는 falsy면 대체, ??는 null·undefined일 때만 대체</mark>. 0이나 빈 문자열을 살리고 싶으면 ??."
        hints:
          - <code>u.n || 5</code> → 0은 falsy라 <b>5</b>
          - "<b>기억할 것</b>: <mark>||는 falsy면 대체, ??는 null·undefined일 때만 대체</mark>. 0이나 빈 문자열을 살리고 싶으면 ??."
      - id: fe-js-shallow
        tag: JS
        title: spread 얕은 복사
        type: answer
        run: node
        code: |-
          const a = { x: 1, inner: { y: 1 } };
          const b = { ...a };
          b.x = 2;
          b.inner.y = 2;
          console.log(a.x, a.inner.y);
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: 1 2
        steps:
          - <code>{ ...a }</code>는 바깥 객체만 새로 만든다
          - <code>b.x = 2</code> → b만 바뀜 → a.x는 <b>1</b>
          - <code>b.inner</code>는 a.inner와 <b>같은 객체</b> → a.inner.y도 <b>2</b>
        why: "<b>기억할 것</b>: <mark>spread는 얕은 복사</mark>. 안쪽 객체까지 복사하려면 structuredClone()."
        hints:
          - <code>{ ...a }</code>는 바깥 객체만 새로 만든다
          - "<b>기억할 것</b>: <mark>spread는 얕은 복사</mark>. 안쪽 객체까지 복사하려면 structuredClone()."
      - id: fe-js-q-clone
        tag: JS
        title: 깊은 복사
        type: mcq
        quizzes:
          - q: 안쪽 객체까지 원본과 완전히 끊어진 복사본을 만드는 것은?
            answer: structuredClone(obj)
            wrong:
              - "{ ...obj }"
              - Object.assign({}, obj)
              - const copy = obj
        explain: <p>spread와 Object.assign은 <b>얕은 복사</b>라 안쪽 객체는 원본과 같은 것을 가리킨다. <code>const copy = obj</code>는 복사가 아니라 같은 객체를 하나 더 가리키는 것. 안쪽까지 복사하려면 <b>structuredClone</b>.</p>
      - id: fe-js-sort
        tag: JS
        title: sort() 기본 정렬
        type: answer
        run: node
        code: |-
          const nums = [10, 1, 2];
          nums.sort();
          console.log(...nums);
        q: 출력은? (여러 줄이면 띄어쓰기로 이어서)
        answer: 1 10 2
        steps:
          - 인자 없는 <code>sort()</code>는 값을 <b>문자열로 바꿔서</b> 사전 순으로 비교
          - '"10", "1", "2" → 사전 순으로 "1" &lt; "10" &lt; "2"'
          - 결과 <b>1 10 2</b>
        why: "<b>기억할 것</b>: <mark>숫자 정렬은 sort((a, b) =&gt; a - b)</mark>. 그리고 sort는 원본 배열을 바꾼다."
        hints:
          - 인자 없는 <code>sort()</code>는 값을 <b>문자열로 바꿔서</b> 사전 순으로 비교
          - "<b>기억할 것</b>: <mark>숫자 정렬은 sort((a, b) =&gt; a - b)</mark>. 그리고 sort는 원본 배열을 바꾼다."
      - id: fe-js-q-reduce
        tag: JS
        title: filter · map · reduce
        type: mcq
        code: |-
          console.log(
            [1, 2, 3, 4]
              .filter((n) => n % 2 === 0)
              .map((n) => n * 10)
              .reduce((s, n) => s + n, 0)
          );
        quizzes:
          - q: 이 코드의 출력은?
            answer: "60"
            wrong:
              - "100"
              - "6"
              - "[20, 40]"
        explain: <p>filter로 짝수 [2, 4] → map으로 [20, 40] → reduce로 더해서 <b>60</b>. filter를 빼먹으면 100, map을 빼먹으면 6.</p>
      - id: fe-js-q-debounce
        tag: JS
        title: 이벤트 호출 줄이기
        type: mcq
        quizzes:
          - q: 검색창에서 입력이 멈추고 300ms가 지나면 API를 한 번만 부르고 싶다. 무엇을 쓸까?
            answer: 디바운스
            wrong:
              - 스로틀
              - setInterval 폴링
              - 메모이제이션
          - q: 스크롤하는 동안 위치 계산을 최대 100ms에 한 번만 하고 싶다. 무엇을 쓸까?
            answer: 스로틀
            wrong:
              - 디바운스
              - setInterval 폴링
              - 메모이제이션
        explain: "<p><b>디바운스</b>: 이벤트가 멈추고 일정 시간이 지나면 <b>마지막 한 번</b>만 실행 (검색어 자동완성, 창 크기 조절 끝). <b>스로틀</b>: 이벤트가 계속 와도 <b>정해진 간격마다 한 번</b>씩 실행 (스크롤, 드래그). 메모이제이션은 같은 입력의 계산 결과를 재사용하는 것이라 호출 횟수와는 상관없다.</p>"
