      rows:
        - id: fe-js-t-hoist
          term: 호이스팅
          sub: Hoisting
          desc: 선언이 스코프 맨 위로 끌어올려진 것처럼 동작하는 것. var는 undefined로 시작하고, let·const는 선언 전에 접근하면 에러.
          hint: var로 선언한 변수를 선언 줄보다 위에서 읽으면 undefined
          quiz: false
        - id: fe-js-t-closure
          term: 클로저
          sub: Closure
          desc: 함수가 만들어질 때의 바깥 변수를 기억해서, 바깥 함수가 끝난 뒤에도 그 변수를 쓰는 것.
          hint: 카운터, 디바운스, React 훅이 모두 클로저로 동작
          quiz: false
        - id: fe-js-t-tdz
          term: TDZ
          sub: Temporal Dead Zone
          desc: let·const가 선언되기 전까지의 구간. 여기서 변수를 읽으면 ReferenceError가 난다.
          hint: '"아직 태어나지 않은 변수" 구간'
          quiz: false
        - id: fe-js-t-copy
          term: 얕은 복사 / 깊은 복사
          desc: "<b>얕은 복사</b>: 바깥 객체만 새로 만들고 안쪽 객체는 원본과 같은 것을 가리킴. <b>깊은 복사</b>: 안쪽 객체까지 전부 새로 만듦."
          hint: "얕은 복사: spread, Object.assign. 깊은 복사: structuredClone"
          quiz: false
        - id: fe-js-t-scope
          term: 함수 스코프 / 블록 스코프
          desc: "<b>함수 스코프</b>: 함수 안 어디서든 같은 변수 (var). <b>블록 스코프</b>: 중괄호 { } 안에서만 사는 변수 (let, const)."
          hint: 반복문의 var가 하나만 생기는 이유
          quiz: false
