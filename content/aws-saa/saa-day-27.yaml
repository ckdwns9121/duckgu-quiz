        quizzes:
          - q: 신규 서비스가 AZ를 자주 추가하며 인터넷 외부 API를 호출한다. 팀은 높은 가용성을 유지하면서 AZ마다 Zonal NAT와 경로를 수동
              추가하는 운영 부담을 줄이고 싶다. 현재 이용 가능한 NAT 방식을 평가할 때 가장 적절한 비교는?
            answer: Regional 자동 모드는 워크로드 AZ에 맞춰 확장하므로 관리와 실제 AZ별 비용을 비교한다
            wrong:
              - Regional NAT는 공개 서브넷을 AZ마다 직접 지정해야만 생성할 수 있다
              - Regional 자동 확장을 쓰면 모든 AZ의 시간·처리 비용이 단일 AZ 요금으로 고정된다
              - Regional NAT ID 하나는 항상 한 AZ이므로 어떤 모드에서도 다중 AZ를 지원하지 않는다
