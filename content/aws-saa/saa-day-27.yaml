id: saa-day-27
name: 모의고사 C
part: 27일 차
color: "#4385ef"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: Q27-01
        type: mcq
        title: Q27-01 · 모의고사 C
        explain: |
          <p>교차 계정 역할 전환은 호출자 허용과 대상 역할의 신뢰를 연결한다. 대상 역할의 S3 범위를 보고서로 제한하면 장기 키 배포 없이 필요한 접근만 제공한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>개발 계정의 읽기 역할만 만들고 운영 계정 역할의 신뢰 설정은 생략한다</td>
          <td>호출 권한만으로 대상 계정의 역할 신뢰나 객체 권한이 생기지 않는다.</td>
          </tr>
          <tr>
          <td>운영 계정에 분석가별 IAM 사용자를 만들고 액세스 키를 주기적으로 공유한다</td>
          <td>별도 장기 신원과 키 배포가 발생해 요구한 기존 로그인·임시 접근과 맞지 않는다.</td>
          </tr>
          <tr>
          <td>운영 계정 관리자 역할의 신뢰를 개발 계정 전체에 열고 보고서만 안내한다</td>
          <td>신뢰와 관리자 권한이 필요 이상으로 넓어 지정 보고서 읽기 제한을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html">IAM tutorial: Delegate access across AWS accounts using IAM roles - AWS Identity and Access Management</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 개발·운영 계정을 분리한 회사에서 개발 분석가가 운영 S3의 지정 보고서만 읽어야 한다. 운영 계정에 개인별 장기 키를 만들지 않고, 기존
              회사 로그인으로 접근하며 다른 운영 자원에는 권한을 주지 않으려 한다. 가장 적절한 구성은?
            answer: 운영 계정의 읽기 역할을 신뢰 설정하고 개발 신원의 역할 전환을 허용한다
            wrong:
              - 개발 계정의 읽기 역할만 만들고 운영 계정 역할의 신뢰 설정은 생략한다
              - 운영 계정에 분석가별 IAM 사용자를 만들고 액세스 키를 주기적으로 공유한다
              - 운영 계정 관리자 역할의 신뢰를 개발 계정 전체에 열고 보고서만 안내한다
      - id: Q27-02
        type: mcq
        title: Q27-02 · 모의고사 C
        explain: |
          <p>권한 경계는 최대 범위이며 자체로 권한을 주지 않는다. 역할 생성 시 지정 경계를 강제하고 변경·제거 경로도 통제해야 개발자의 새 역할 생성으로 상한을 우회하지 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>지정 permissions boundary만 연결하고 업무 권한 정책은 제거한다</td>
          <td>경계 자체는 업무 작업을 허용하지 않으므로 필요한 신원 정책도 있어야 한다.</td>
          </tr>
          <tr>
          <td>개발자 역할에 AdministratorAccess를 부여하고 경계를 선택사항으로 둔다</td>
          <td>선택사항인 경계는 우회할 수 있어 최대 권한 강제 요구를 만족하지 않는다.</td>
          </tr>
          <tr>
          <td>생성된 역할의 권한만 사후 점검하고 생성·경계 변경은 자유롭게 허용한다</td>
          <td>사후 점검은 발견 전 우회 권한 사용을 예방하는 상한 강제가 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html">Permissions boundaries for IAM entities - AWS Identity and Access Management</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 플랫폼 팀은 개발자가 직접 IAM 역할을 생성하도록 하되, 만든 역할로 회사의 권한 상한을 넘지 못하게 해야 한다. 지정 경계를 지운 새
              역할을 만들어 우회하는 것도 막아야 하며, 역할마다 필요한 업무 권한은 따로 부여한다. 함께 필요한 조치는?
            answer: 생성할 역할에 지정 permissions boundary가 붙도록 정책 조건을 강제한다
            wrong:
              - 지정 permissions boundary만 연결하고 업무 권한 정책은 제거한다
              - 개발자 역할에 AdministratorAccess를 부여하고 경계를 선택사항으로 둔다
              - 생성된 역할의 권한만 사후 점검하고 생성·경계 변경은 자유롭게 허용한다
            answers:
              - 생성할 역할에 지정 permissions boundary가 붙도록 정책 조건을 강제한다
              - 경계 제거·변경으로 우회하지 못하도록 개발자의 관련 작업을 제한한다
            options:
              - 지정 permissions boundary만 연결하고 업무 권한 정책은 제거한다
              - 개발자 역할에 AdministratorAccess를 부여하고 경계를 선택사항으로 둔다
              - 생성된 역할의 권한만 사후 점검하고 생성·경계 변경은 자유롭게 허용한다
              - 생성할 역할에 지정 permissions boundary가 붙도록 정책 조건을 강제한다
              - 경계 제거·변경으로 우회하지 못하도록 개발자의 관련 작업을 제한한다
      - id: Q27-03
        type: mcq
        title: Q27-03 · 모의고사 C
        explain: |
          <p>직원들의 다중 계정 접근과 권한 세트 배정은 IAM Identity Center의 용도다. 외부 신원 연동의 지원 방식도 확인하면서 중앙 사용자 수명 주기와 계정 접근을 연결한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>회사 SAML을 계정별 역할에 직접 연동하고 권한 배정을 각 계정에서 따로 관리한다</td>
          <td>연동 자체는 가능하지만 중앙 권한 세트 배정과 일관된 계정 접근 관리 요구에는 불리하다.</td>
          </tr>
          <tr>
          <td>계정마다 IAM 사용자를 생성하고 동일한 장기 액세스 키를 복사한다</td>
          <td>계정별 사용자와 키 복제는 중앙 회수의 일관성과 장기 키 축소 요구에 불리하다.</td>
          </tr>
          <tr>
          <td>각 계정 IAM 사용자를 별도로 만들고 퇴사 시 계정 담당자가 수동 삭제한다</td>
          <td>계정별 사용자 수명 주기가 분산되어 한곳에서 접근을 회수하려는 요구에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html">What is IAM Identity Center? - AWS IAM Identity Center</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 여러 AWS 계정을 쓰는 회사가 직원 퇴사 때 접근을 한곳에서 회수하려 한다. 기존 SAML 신원 체계를 사용하되 직무별 권한 세트를
              중앙에서 계정에 배정하고, 계정별 역할·정책을 따로 편집하는 작업을 최소화해야 한다. IAM 사용자를 계정마다 복제하지
              않을 때 적합한 방식은?
            answer: 지원되는 외부 신원 연동과 IAM Identity Center 권한 세트로 계정 접근을 관리한다
            wrong:
              - 회사 SAML을 계정별 역할에 직접 연동하고 권한 배정을 각 계정에서 따로 관리한다
              - 계정마다 IAM 사용자를 생성하고 동일한 장기 액세스 키를 복사한다
              - 각 계정 IAM 사용자를 별도로 만들고 퇴사 시 계정 담당자가 수동 삭제한다
      - id: Q27-04
        type: mcq
        title: Q27-04 · 모의고사 C
        explain: |
          <p>EC2 역할은 임시 자격 증명을 제공하고 SDK는 지원 경로로 이를 사용·갱신한다. 역할 정책의 리소스를 접두사로 한정하면 이미지에 장기 키를 넣지 않아도 된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>부팅할 때 한 번 받은 STS 임시 값을 파일에 고정하고 재조회는 하지 않는다</td>
          <td>임시 값은 만료되므로 SDK의 갱신 경로를 사용하지 않으면 계속 읽기 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>배포 시 IAM 사용자 키를 환경 변수로 넣고 인스턴스 수명 내내 고정한다</td>
          <td>고정 장기 키 배포와 수동 갱신 부담이 남는다.</td>
          </tr>
          <tr>
          <td>부팅 스크립트로 운영자 개인 키를 내려받고 OS 파일 권한만 제한한다</td>
          <td>개인 키를 서버에 복제하면 사람의 신원과 앱 권한이 섞이고 회수도 어려워진다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html">Use an IAM role to grant permissions to applications running on Amazon EC2 instances - AWS Identity and Access Management</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: EC2의 정산 앱이 하루 동안 여러 번 S3 파일을 읽는다. 배포 이미지에 키를 넣을 수 없고, 인스턴스 교체 후에도 운영자가 자격 증명을
              수동 갱신하지 않아야 한다. 앱의 읽기 대상은 하나의 접두사로 제한된다. 어떤 구성이 적절한가?
            answer: 인스턴스 프로파일 역할을 연결하고 SDK 기본 자격 증명 경로를 사용한다
            wrong:
              - 부팅할 때 한 번 받은 STS 임시 값을 파일에 고정하고 재조회는 하지 않는다
              - 배포 시 IAM 사용자 키를 환경 변수로 넣고 인스턴스 수명 내내 고정한다
              - 부팅 스크립트로 운영자 개인 키를 내려받고 OS 파일 권한만 제한한다
      - id: Q27-05
        type: mcq
        title: Q27-05 · 모의고사 C
        explain: |
          <p>속성 기반 접근은 정책이 태그를 조건으로 평가할 때 작동한다. 태그가 권한 경계의 일부라면 태그 편집도 제한해야 속성을 바꿔 접근을 우회하는 것을 막을 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 리소스에 프로젝트 태그만 붙이고 신원 정책의 조건은 생략한다</td>
          <td>태그만으로 IAM 권한이 자동 제한되지는 않는다.</td>
          </tr>
          <tr>
          <td>역할마다 프로젝트별 리소스 ARN을 나열한 정책을 계속 복제한다</td>
          <td>범위를 제한할 수는 있어도 프로젝트가 늘 때 정책 복제를 피하려는 속성 기반 관리 요구와 다르다.</td>
          </tr>
          <tr>
          <td>비용 할당 태그를 활성화하고 태그 수정은 개발자에게 자유롭게 허용한다</td>
          <td>비용 태그 활성화는 IAM 조건 평가가 아니며 권한에 쓰는 태그를 자유롭게 바꾸면 우회가 가능하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html">Define permissions based on attributes with ABAC authorization - AWS Identity and Access Management</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 프로젝트별 개발 역할이 같은 프로젝트 태그가 붙은 자원만 변경하도록 구성하려 한다. 프로젝트가 늘어도 역할 정책을 매번 복제하지 않고,
              개발자가 태그를 바꿔 다른 프로젝트 자원을 가져오는 경로도 차단해야 한다. 필요한 설계 두 가지는?
            answer: 프로젝트 태그의 생성·변경 권한을 제한하고 허용 값을 통제한다
            wrong:
              - 모든 리소스에 프로젝트 태그만 붙이고 신원 정책의 조건은 생략한다
              - 역할마다 프로젝트별 리소스 ARN을 나열한 정책을 계속 복제한다
              - 비용 할당 태그를 활성화하고 태그 수정은 개발자에게 자유롭게 허용한다
            answers:
              - 프로젝트 태그의 생성·변경 권한을 제한하고 허용 값을 통제한다
              - 신원·리소스의 프로젝트 태그를 비교하는 지원 작업의 조건 정책을 사용한다
            options:
              - 프로젝트 태그의 생성·변경 권한을 제한하고 허용 값을 통제한다
              - 모든 리소스에 프로젝트 태그만 붙이고 신원 정책의 조건은 생략한다
              - 역할마다 프로젝트별 리소스 ARN을 나열한 정책을 계속 복제한다
              - 비용 할당 태그를 활성화하고 태그 수정은 개발자에게 자유롭게 허용한다
              - 신원·리소스의 프로젝트 태그를 비교하는 지원 작업의 조건 정책을 사용한다
      - id: Q27-06
        type: mcq
        title: Q27-06 · 모의고사 C
        explain: |
          <p>멤버 계정에 적용되는 SCP의 명시적 거부는 계정 내 IAM Allow로 넘을 수 없다. 특정 중지 작업을 거부하면 다른 관리 권한을 유지하면서 조직 수준 제한을 둘 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>관리자 역할에 읽기 전용 permissions boundary를 선택적으로 권고한다</td>
          <td>선택적인 경계는 새 역할 생성으로 우회할 수 있고 모든 관리 작업까지 축소한다.</td>
          </tr>
          <tr>
          <td>현재 역할에만 중지 거부 정책을 붙이고 새 역할 생성·정책 편집을 허용한다</td>
          <td>거부가 현재 역할에만 적용되므로 관리자가 다른 역할로 작업하는 것을 계정 수준에서 막지 못한다.</td>
          </tr>
          <tr>
          <td>현재 관리자 역할의 신원 정책에서만 CloudTrail 중지 허용을 삭제한다</td>
          <td>계정 관리자가 새 역할이나 정책으로 다시 허용할 수 있어 계정 수준 강제가 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html">Service control policies (SCPs) - AWS Organizations</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 조직의 운영 멤버 계정에서 IAM 관리자 역할도 CloudTrail 중지를 하지 못하게 하려 한다. 다른 관리 작업은 유지해야 하고, 계정
              관리자가 새 역할에 넓은 정책을 붙여도 이 제한은 남아야 한다. 어떤 방법이 적합한가?
            answer: 해당 계정에 적용되는 SCP에서 CloudTrail 중지 작업을 명시적으로 거부한다
            wrong:
              - 관리자 역할에 읽기 전용 permissions boundary를 선택적으로 권고한다
              - 현재 역할에만 중지 거부 정책을 붙이고 새 역할 생성·정책 편집을 허용한다
              - 현재 관리자 역할의 신원 정책에서만 CloudTrail 중지 허용을 삭제한다
      - id: Q27-07
        type: mcq
        title: Q27-07 · 모의고사 C
        explain: |
          <p>교차 계정의 신원·버킷 허용이 있어도 역할 ARN에 부여한 권한은 permissions boundary의 상한을 넘지 못한다. 경계에 지정 보고서의 GetObject를 추가하면 기존 양쪽 허용과 교집합이 생기며 보고서 범위도 유지된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>보고서 객체의 소유권을 분석 계정으로 이전한다</td>
          <td>객체 소유권 변경은 읽기 작업의 역할 권한 상한을 변경하지 않는다. 이 조건에서는 소유권이 아니라 boundary의 작업 허용이 부족하다.</td>
          </tr>
          <tr>
          <td>버킷 정책 Principal을 분석 계정의 루트 ARN으로 바꾼다</td>
          <td>계정 Principal 허용은 교차 계정 신원 정책과 경계의 교집합을 대체하지 않는다. 역할 세션 ARN에 직접 허용하는 별도 사례와 다르다.</td>
          </tr>
          <tr>
          <td>역할 신원 정책의 S3 허용 범위를 버킷 전체로 넓힌다</td>
          <td>신원 Allow를 넓혀도 boundary가 GetObject를 허용하지 않는 제한이 남고 최소 범위도 넓어진다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html">IAM permissions boundaries</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 분석 계정의 ReportRole로 다른 계정의 S3 보고서를 읽으면 AccessDenied가 난다. 역할의 신원 정책과 버킷 정책은 각각
              해당 보고서의 GetObject를 허용하며, 버킷 정책 Principal은 역할 ARN이다. 역할의
              permissions boundary는 버킷 ListBucket만 허용한다. SCP·세션 정책·명시적 Deny는 없고
              SSE-S3 객체이다. 역할의 최대 권한을 보고서 읽기 범위로 유지하면서 해결할 변경은?
            answer: 경계에 해당 보고서 객체 ARN의 GetObject를 추가한다
            wrong:
              - 보고서 객체의 소유권을 분석 계정으로 이전한다
              - 버킷 정책 Principal을 분석 계정의 루트 ARN으로 바꾼다
              - 역할 신원 정책의 S3 허용 범위를 버킷 전체로 넓힌다
      - id: Q27-08
        type: mcq
        title: Q27-08 · 모의고사 C
        explain: |
          <p>DB에 실제 연결을 시작하는 앱의 보안 그룹을 출발지로 참조하면 IP 교체에 대응하면서 계층 범위를 제한한다. 필요한 DB 포트만 허용하고 앱 아웃바운드도 확인한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>출발지를 ALB 보안 그룹으로 지정하고 DB 포트만 허용한다</td>
          <td>DB 연결 출발지는 ALB가 아니라 앱이므로 올바른 계층을 식별하지 못한다.</td>
          </tr>
          <tr>
          <td>출발지를 현재 앱 프라이빗 IP 목록으로 고정하고 DB 포트만 허용한다</td>
          <td>현재 연결은 가능하지만 서버 교체로 IP가 바뀌면 목록 갱신이 필요해 반복 교체 요구에 불리하다.</td>
          </tr>
          <tr>
          <td>출발지를 VPC 전체 CIDR로 지정하고 DB 포트만 허용한다</td>
          <td>VPC의 다른 서버까지 접근 범위에 포함한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html">Security group rules - Amazon Virtual Private Cloud</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: ALB 뒤 두 AZ의 앱과 RDS를 운영한다. 앱 인스턴스는 자주 교체되어 IP가 바뀌고, DB는 이 앱 계층에서 시작한 MySQL 연결만
              받아야 한다. 같은 VPC의 다른 서버는 DB에 접근하지 못해야 한다. 권장되는 DB 인바운드 규칙은?
            answer: 출발지를 앱 전용 보안 그룹으로 지정하고 DB 포트만 허용한다
            wrong:
              - 출발지를 ALB 보안 그룹으로 지정하고 DB 포트만 허용한다
              - 출발지를 현재 앱 프라이빗 IP 목록으로 고정하고 DB 포트만 허용한다
              - 출발지를 VPC 전체 CIDR로 지정하고 DB 포트만 허용한다
      - id: Q27-09
        type: mcq
        title: Q27-09 · 모의고사 C
        explain: |
          <p>개인화 경로의 공유 캐시를 끄고 필요한 인증 쿠키를 원본으로 전달하면 잘못 공유된 캐시 문제를 제거한다. 정적 경로는 별도 behavior로 계속 캐시할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>계정 경로의 최소 TTL을 늘리고 원본에 모든 쿠키를 추가 전달한다</td>
          <td>원본으로 쿠키를 보내도 캐시 키가 같으면 적중 응답은 여전히 공유될 수 있다.</td>
          </tr>
          <tr>
          <td>경로만 유지한 채 원본 응답에 private를 넣고 최소 TTL은 높게 유지한다</td>
          <td>양수 최소 TTL은 원본의 private 의도와 충돌할 수 있어 안전한 분리를 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>계정 화면을 별도 원본으로 옮기고 경로만 사용한 캐시는 유지한다</td>
          <td>원본 위치 변경만으로 캐시 키의 사용자 혼합은 해결되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html">Control the cache key with a policy - Amazon CloudFront</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 국가별 개인 계정 화면을 CloudFront로 전달하는 서비스에서 다른 회원의 주소가 보이는 사고가 났다. 원본은 쿠키로 회원을 구분하지만
              캐시 키는 경로만 사용한다. 정적 상품 이미지는 계속 캐시하고, 계정 화면은 공유 캐시를 사용하지 않아도 된다.
              조치는?
            answer: 계정 경로의 캐시를 비활성화하고 인증 정보를 원본에 올바르게 전달한다
            wrong:
              - 계정 경로의 최소 TTL을 늘리고 원본에 모든 쿠키를 추가 전달한다
              - 경로만 유지한 채 원본 응답에 private를 넣고 최소 TTL은 높게 유지한다
              - 계정 화면을 별도 원본으로 옮기고 경로만 사용한 캐시는 유지한다
      - id: Q27-10
        type: mcq
        title: Q27-10 · 모의고사 C
        explain: |
          <p>OAC와 버킷 정책은 원본을 읽는 CloudFront의 경계를 제한한다. 서명 쿠키는 여러 제한 파일에 대한 회원의 기간별 접근을 검증하므로 두 서로 다른 경계가 모두 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>OAC를 구성한 뒤 CloudFront 사용자 접근은 모두 공개한다</td>
          <td>원본 보호만으로 CloudFront에서 구매 회원을 구분하지 않는다.</td>
          </tr>
          <tr>
          <td>S3 버킷을 공개하고 CloudFront 서명 쿠키만 검증한다</td>
          <td>S3가 공개면 원본 URL로 서명 검증을 우회할 수 있다.</td>
          </tr>
          <tr>
          <td>S3 presigned URL을 발급하되 원본 정책에는 발급자 직접 접근을 계속 허용한다</td>
          <td>S3 직접 접근 경로가 남아 CloudFront만을 통한 제한이라는 원본 경계 요구와 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html">Restrict access to an Amazon S3 origin - Amazon CloudFront</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 유료 교육 회사는 비공개 S3의 강의 영상을 CloudFront로 전송한다. 결제를 확인한 회원만 정해진 시간 동안 여러 영상 조각을
              받고, S3 주소 직접 접속으로 제한을 우회하지 못해야 한다. 함께 사용할 구성 두 가지는?
            answer: OAC와 해당 배포만 허용하는 S3 버킷 정책을 구성한다
            wrong:
              - OAC를 구성한 뒤 CloudFront 사용자 접근은 모두 공개한다
              - S3 버킷을 공개하고 CloudFront 서명 쿠키만 검증한다
              - S3 presigned URL을 발급하되 원본 정책에는 발급자 직접 접근을 계속 허용한다
            answers:
              - OAC와 해당 배포만 허용하는 S3 버킷 정책을 구성한다
              - 구매 확인 후 CloudFront 서명 쿠키를 발급한다
            options:
              - OAC를 구성한 뒤 CloudFront 사용자 접근은 모두 공개한다
              - S3 버킷을 공개하고 CloudFront 서명 쿠키만 검증한다
              - S3 presigned URL을 발급하되 원본 정책에는 발급자 직접 접근을 계속 허용한다
              - OAC와 해당 배포만 허용하는 S3 버킷 정책을 구성한다
              - 구매 확인 후 CloudFront 서명 쿠키를 발급한다
      - id: Q27-11
        type: mcq
        title: Q27-11 · 모의고사 C
        explain: |
          <p>WAF는 지원 웹 리소스의 요청 패턴을 검사할 수 있다. 규칙을 시험하고 오탐을 조정하면서 적용해야 하며, 앱의 업무 인가를 대신하는 것으로 보지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ALB SG에서 알려진 고객 IP만 허용하고 해당 고객의 HTTP 요청 내용은 검사하지 않는다</td>
          <td>고객 IP 허용은 네트워크 범위 통제이며 허용 출발지에서 오는 SQL 인젝션 요청 패턴을 검사하지 않는다.</td>
          </tr>
          <tr>
          <td>NACL에서 과거 공격 출발지 CIDR만 거부하고 새 IP의 같은 요청은 허용한다</td>
          <td>IP 목록은 요청 내용 기반 SQL 인젝션 통제와 달라 출발지가 바뀐 공격을 제한하지 못한다.</td>
          </tr>
          <tr>
          <td>Shield Advanced 보호만 구성하고 HTTP 요청 패턴 규칙은 만들지 않는다</td>
          <td>가용성 보호만으로 지정된 SQL 인젝션 HTTP 요청 패턴 통제를 구성하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">What are AWS WAF, AWS Shield Advanced, AWS Shield network security director and AWS Firewall Manager? - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 레거시 웹 앱에 SQL 인젝션 의심 요청이 증가한다. 소스 수정에는 시간이 걸리므로 지원되는 ALB 앞에서 요청 패턴을 먼저 제한하고,
              정상 고객을 잘못 차단하는지 점검해야 한다. 기존 앱의 사용자별 권한 검사는 계속 유지한다. 적절한 조치는?
            answer: WAF 규칙을 관측·시험한 뒤 ALB에 적용해 악성 HTTP 요청을 제한한다
            wrong:
              - ALB SG에서 알려진 고객 IP만 허용하고 해당 고객의 HTTP 요청 내용은 검사하지 않는다
              - NACL에서 과거 공격 출발지 CIDR만 거부하고 새 IP의 같은 요청은 허용한다
              - Shield Advanced 보호만 구성하고 HTTP 요청 패턴 규칙은 만들지 않는다
      - id: Q27-12
        type: mcq
        title: Q27-12 · 모의고사 C
        explain: |
          <p>Session Manager는 직접 SSH 인바운드 없이 관리 세션을 제공한다. 직원의 세션 권한, 노드 IAM 역할과 서비스 엔드포인트 연결을 모두 갖춰야 접속할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SSH 경로를 허용한 관리용 EC2를 경유하고 직원에게 SSH 키를 배포한다</td>
          <td>배스천은 가능한 관리 대안이지만 직접 SSH 경로와 개인 키 배포를 없애려는 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>Site-to-Site VPN을 추가하고 승인 직원용 세션 권한·노드 구성은 생략한다</td>
          <td>사설 네트워크 연결만으로 IAM 기반 관리 세션과 노드 접속 전제가 충족되지 않는다.</td>
          </tr>
          <tr>
          <td>EC2 역할에 ssm 권한만 주고 직원 세션 권한과 서비스 연결은 생략한다</td>
          <td>노드 권한만으로 직원 허용과 필요한 네트워크 경로가 생기지는 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-prerequisites.html">Step 1: Complete Session Manager prerequisites - AWS Systems Manager</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 운영자는 비공개 EC2의 장애를 조사해야 한다. 인터넷에 SSH 인바운드를 열거나 개인 SSH 키를 배포할 수 없고, 승인한 직원만 세션을
              시작해야 한다. 인스턴스에는 지원 OS와 SSM Agent가 설치되어 있다. 적절한 구성은?
            answer: Session Manager 권한·노드 역할과 필요한 서비스 연결을 준비한다
            wrong:
              - SSH 경로를 허용한 관리용 EC2를 경유하고 직원에게 SSH 키를 배포한다
              - Site-to-Site VPN을 추가하고 승인 직원용 세션 권한·노드 구성은 생략한다
              - EC2 역할에 ssm 권한만 주고 직원 세션 권한과 서비스 연결은 생략한다
      - id: Q27-13
        type: mcq
        title: Q27-13 · 모의고사 C
        explain: |
          <p>앱 회원 로그인과 토큰 발급은 user pool의 역할이다. 서버가 AWS 리소스 접근을 담당하므로 브라우저에 identity pool 임시 자격 증명을 제공할 필요가 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Cognito identity pool로 브라우저에 임시 AWS 권한을 주고 업무 API를 IAM으로만 인증한다</td>
          <td>가능한 다른 모델이지만 브라우저 AWS 자격 증명 없이 JWT로 호출한다는 기존 구조와 맞지 않는다.</td>
          </tr>
          <tr>
          <td>IAM Identity Center에 모든 소비자를 직원 권한 세트로 등록한다</td>
          <td>직원의 다중 계정 접근 관리와 소비자 회원 인증은 서로 다른 요구다.</td>
          </tr>
          <tr>
          <td>앱 자체 회원 DB와 비밀번호 검증 서버를 새로 만들고 JWT 발급도 직접 운영한다</td>
          <td>구현할 수는 있으나 관리형 회원 인증으로 운영 부담을 줄이는 user pool보다 불필요한 직접 운영이 늘어난다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html">What is Amazon Cognito? - Amazon Cognito</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 소비자 앱에서 로그인 후 JWT로 주문 API를 호출한다. API 서버가 자신의 역할로 S3를 읽으므로 브라우저에는 AWS 자격 증명을 줄
              필요가 없다. 회사 직원의 AWS 콘솔 접근은 이미 별도 관리한다. 회원 인증 서버의 직접 운영을 줄일 때 가장 적합한
              구성은?
            answer: Cognito user pool에서 인증 토큰을 발급하고 API에서 검증한다
            wrong:
              - Cognito identity pool로 브라우저에 임시 AWS 권한을 주고 업무 API를 IAM으로만 인증한다
              - IAM Identity Center에 모든 소비자를 직원 권한 세트로 등록한다
              - 앱 자체 회원 DB와 비밀번호 검증 서버를 새로 만들고 JWT 발급도 직접 운영한다
      - id: Q27-14
        type: mcq
        title: Q27-14 · 모의고사 C
        explain: |
          <p>Macie가 고객 관리형 KMS 암호문을 분류하려면 Macie 서비스 연결 역할이 해당 키를 사용할 수 있어야 한다. GetObject 같은 객체 수준의 의심 활동은 GuardDuty S3 Protection 대상이며, 기본 관리 이벤트 모니터링과 구분된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Macie 역할에 키 사용을 허용해 분류 작업을 실행하고 GuardDuty 기본 보호를 유지한다</td>
          <td>분류는 가능하지만 S3 Protection을 끈 기본 보호만으로 요구한 GetObject 데이터 이벤트 기반 탐지를 구성하지 못한다.</td>
          </tr>
          <tr>
          <td>분석가 역할에 키 사용을 허용해 Macie 작업을 실행하고 GuardDuty S3 Protection을 켠다</td>
          <td>분석가의 복호화 권한이 Macie 서비스 연결 역할에 전달되지는 않는다. 객체 접근 탐지를 켜도 내용 분류 권한이 남는다.</td>
          </tr>
          <tr>
          <td>분석가 역할에 키 사용을 허용해 Athena로 분류하고 CloudTrail Lake의 SQL 조회를 예약한다</td>
          <td>Athena와 CloudTrail Lake로 직접 분석할 수 있지만 분류 SQL·이상 탐지 규칙과 결과 처리를 운영해야 하므로 관리형 분류·위협 탐지 요구와 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/macie/latest/user/discovery-supported-encryption-types.html">Macie encrypted objects</a> · <a href="https://docs.aws.amazon.com/guardduty/latest/ug/s3-protection.html">GuardDuty S3 Protection</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: S3의 SSE-KMS 암호화 CSV에서 신분증 번호를 분류하고, 유효한 자격 증명으로 발생하는 비정상 GetObject도 관리형 위협
              탐지로 찾아야 한다. 고객 관리형 키 정책은 현재 앱 역할에만 복호화를 허용하며 기본 GuardDuty는 켜져 있지만
              S3 Protection은 꺼져 있다. 원본 암호화를 유지하고 별도 탐지 규칙 엔진을 개발하지 않을 때 적절한 구성은?
            answer: Macie 역할에 키 사용을 허용해 분류 작업을 실행하고 GuardDuty S3 Protection을 켠다
            wrong:
              - Macie 역할에 키 사용을 허용해 분류 작업을 실행하고 GuardDuty 기본 보호를 유지한다
              - 분석가 역할에 키 사용을 허용해 Macie 작업을 실행하고 GuardDuty S3 Protection을 켠다
              - 분석가 역할에 키 사용을 허용해 Athena로 분류하고 CloudTrail Lake의 SQL 조회를 예약한다
      - id: Q27-15
        type: mcq
        title: Q27-15 · 모의고사 C
        explain: |
          <p>교차 계정 KMS 사용은 키 소유 계정의 키 정책과 호출자 계정 IAM 허용을 함께 갖춰야 한다. 기존 S3 읽기와 별개인 복호화 경계를 해당 역할과 키로 제한해 허용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 버킷 정책의 객체 읽기 Allow만 같은 내용으로 추가한다</td>
          <td>이미 허용된 S3 객체 읽기를 추가해도 KMS 키 사용 권한은 생기지 않는다.</td>
          </tr>
          <tr>
          <td>역할을 맡을 신뢰 정책만 확장하고 키 정책·복호화 권한은 유지한다</td>
          <td>역할을 맡는 권한과 키의 복호화 권한은 다른 경계이다.</td>
          </tr>
          <tr>
          <td>키 소유 계정에만 복호화 Allow를 추가하고 호출자 IAM에는 명시적 허용을 두지 않는다</td>
          <td>교차 계정 사용에는 호출자 IAM과 키 소유 계정의 허용이 함께 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html">Allowing users in other accounts to use a KMS key - AWS Key Management Service</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 다른 계정의 분석 역할이 고객 관리형 KMS 키로 암호화된 S3 데이터를 읽어야 한다. S3 객체 읽기는 이미 양쪽 계정에서 허용되었으나
              복호화가 거부된다. 키를 공개하거나 모든 계정에 복호화를 열지 않고 해결할 조치 두 가지는?
            answer: 키 소유 계정의 키 정책에서 분석 역할의 필요한 키 사용을 허용한다
            wrong:
              - S3 버킷 정책의 객체 읽기 Allow만 같은 내용으로 추가한다
              - 역할을 맡을 신뢰 정책만 확장하고 키 정책·복호화 권한은 유지한다
              - 키 소유 계정에만 복호화 Allow를 추가하고 호출자 IAM에는 명시적 허용을 두지 않는다
            answers:
              - 키 소유 계정의 키 정책에서 분석 역할의 필요한 키 사용을 허용한다
              - 분석 역할 계정의 IAM 정책에서 해당 키의 필요한 복호화 작업을 허용한다
            options:
              - S3 버킷 정책의 객체 읽기 Allow만 같은 내용으로 추가한다
              - 역할을 맡을 신뢰 정책만 확장하고 키 정책·복호화 권한은 유지한다
              - 키 소유 계정에만 복호화 Allow를 추가하고 호출자 IAM에는 명시적 허용을 두지 않는다
              - 키 소유 계정의 키 정책에서 분석 역할의 필요한 키 사용을 허용한다
              - 분석 역할 계정의 IAM 정책에서 해당 키의 필요한 복호화 작업을 허용한다
      - id: Q27-16
        type: mcq
        title: Q27-16 · 모의고사 C
        explain: |
          <p>Compliance 보존은 기간 중 보호된 버전의 영구 삭제를 강하게 제한한다. 같은 키에 새 버전을 생성하는 것과 보호된 과거 버전의 삭제는 구분되므로 수정본 보관 요구에도 맞는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Versioning만 켜고 관리자에게 DeleteObjectVersion을 허용한다</td>
          <td>버전 관리만으로 권한 있는 사용자의 특정 버전 영구 삭제가 막히지 않는다.</td>
          </tr>
          <tr>
          <td>Object Lock Governance를 켜고 모든 관리자에게 우회 권한을 준다</td>
          <td>Governance 우회 권한을 가진 관리자는 보존을 우회할 수 있어 강제 수준이 부족하다.</td>
          </tr>
          <tr>
          <td>CRR과 버전 관리를 사용하고 두 위치 관리자에게 버전 삭제를 허용한다</td>
          <td>복제와 버전만으로 관리자에 의한 보호 버전 영구 삭제를 막는 불변 보존 요구를 만족하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html">Locking objects with Object Lock - Amazon Simple Storage Service</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 규정 문서를 S3에 보관하는 기관은 승인된 보존 만료 전에는 루트 사용자도 보호된 버전을 삭제하지 못하게 해야 한다. 조회는 가능해야
              하고, 같은 이름으로 수정본을 올려도 과거 버전은 남아야 한다. 가장 적합한 통제는?
            answer: Versioning과 Object Lock Compliance 보존을 구성한다
            wrong:
              - Versioning만 켜고 관리자에게 DeleteObjectVersion을 허용한다
              - Object Lock Governance를 켜고 모든 관리자에게 우회 권한을 준다
              - CRR과 버전 관리를 사용하고 두 위치 관리자에게 버전 삭제를 허용한다
      - id: Q27-17
        type: mcq
        title: Q27-17 · 모의고사 C
        explain: |
          <p>Legal hold와 보존 기간은 독립적인 보호이다. Hold를 해제해도 Compliance 보존은 90일까지 남으며 Governance 우회 권한으로 해제할 수 없다. 두 보호가 모두 끝난 뒤 해당 version ID를 삭제해야 영구 삭제가 된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>30일째 hold를 해제하고 Governance 우회 헤더로 버전 ID를 삭제한다</td>
          <td>BypassGovernanceRetention은 Governance용이며 고정 Compliance 기간을 단축하거나 우회하지 못한다.</td>
          </tr>
          <tr>
          <td>30일째 버전 ID 없는 DeleteObject를 실행해 해당 파일을 삭제한다</td>
          <td>버전 ID 없는 삭제는 delete marker를 만들 수 있지만 보호된 과거 버전을 영구 삭제하지 않는다.</td>
          </tr>
          <tr>
          <td>90일 보존 만료 후 hold가 켜진 버전을 버전 ID로 삭제한다</td>
          <td>Compliance 기간이 만료되어도 legal hold는 명시적으로 해제할 때까지 유지되므로 영구 삭제가 거부된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html">S3 Object Lock</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: S3의 한 객체 버전에 고정된 Compliance 보존 90일과 legal hold가 함께 적용되어 있다. 30일째 조사가 끝나 법무가
              hold 해제를 승인했다. 보존 기간을 늘릴 의무는 없으며 해당 버전의 영구 삭제가 가능한 가장 이른 시점에 삭제하려
              한다. 작업자는 hold 해제와 버전 삭제 권한이 있다. 적절한 절차는?
            answer: 30일째 hold를 해제하고 90일 보존 만료 후 버전 ID로 삭제한다
            wrong:
              - 30일째 hold를 해제하고 Governance 우회 헤더로 버전 ID를 삭제한다
              - 30일째 버전 ID 없는 DeleteObject를 실행해 해당 파일을 삭제한다
              - 90일 보존 만료 후 hold가 켜진 버전을 버전 ID로 삭제한다
      - id: Q27-18
        type: mcq
        title: Q27-18 · 모의고사 C
        explain: |
          <p>지원되는 KMS 자동 회전은 같은 논리 키를 유지하며 키 재료를 바꾼다. 기존 암호문 복호화에 필요한 재료도 관리하므로 데이터 전체 재암호화나 앱 ARN 변경과 다르다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>키 ARN이 매번 바뀌므로 모든 호출자의 리소스 정책을 다시 작성한다</td>
          <td>키 재료 회전은 논리 키 ARN을 유지하는 방식이다.</td>
          </tr>
          <tr>
          <td>기존 S3 객체와 모든 DB 백업이 즉시 새 키로 재암호화된다</td>
          <td>키 회전은 이미 저장된 객체·백업 전체의 재암호화 작업을 자동 수행하지 않는다.</td>
          </tr>
          <tr>
          <td>이전 키 재료가 즉시 제거되어 기존 암호문을 복사해 다시 만들어야 한다</td>
          <td>과거 재료를 유지해 기존 암호문을 복호화하므로 즉시 제거라는 전제가 틀리다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html">Rotate AWS KMS keys - AWS Key Management Service</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 보안 규정이 고객 관리형 KMS 키의 주기적 회전을 요구한다. 기존 암호문을 계속 읽어야 하고 키 식별자를 사용하는 앱 설정도 유지하려
              한다. 지원되는 대칭 키의 자동 회전을 켠 후 예상할 올바른 동작은?
            answer: 새 키 재료로 이후 암호화를 수행하고 기존 암호문은 과거 재료로 복호화한다
            wrong:
              - 키 ARN이 매번 바뀌므로 모든 호출자의 리소스 정책을 다시 작성한다
              - 기존 S3 객체와 모든 DB 백업이 즉시 새 키로 재암호화된다
              - 이전 키 재료가 즉시 제거되어 기존 암호문을 복사해 다시 만들어야 한다
      - id: Q27-19
        type: mcq
        title: Q27-19 · 모의고사 C
        explain: |
          <p>복제본뿐 아니라 로그·백업도 허용 리전과 보존 요건을 충족해야 한다. 복구 계정에서 R2 암호문을 읽으려면 실제 대상 키에 대한 키 정책과 호출자 IAM 허용을 갖춰야 원본 앱 신원에 의존하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>승인되지 않은 R3에 암호화 복제본을 두고 키를 R1에 유지한다</td>
          <td>암호문도 환자 자료이므로 승인되지 않은 R3에 둘 수 없다. 원본 키의 위치만으로 복제 데이터의 위치 제한을 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>R1 키 정책에 복구 역할을 허용하고 R2 대상 키 정책은 앱 전용으로 둔다</td>
          <td>R1 키 사용 허용은 R2 대상 키의 권한을 대신하지 못한다. 복구 역할은 복제본을 암호화한 대상 키를 사용할 수 있어야 한다.</td>
          </tr>
          <tr>
          <td>R2 복제본에 30일 만료를 적용하고 복구 역할에는 원본 버킷 읽기를 준다</td>
          <td>30일 만료는 7년 보존 요구를 깨고 원본 읽기는 원본 계정 장애 시 복구본 접근을 대체하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-config-for-kms-objects.html">S3 replication of encrypted objects</a> · <a href="https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html">Cross-account KMS permissions</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 병원은 승인 리전 R1의 SSE-KMS S3 환자 자료를 다른 계정으로 복제한다. 규정상 자료·로그·백업은 승인 리전 R1/R2에만 둘 수
              있고 복제본도 7년 보존해야 한다. 복구 역할은 원본 계정 장애 중에도 복제본을 읽어야 하며, 기존 버킷·키 정책에는
              원본 앱만 허용되어 있다. 복구 계정의 S3 읽기 허용은 준비했다. 설계에 포함할 조치 두 가지는?
            answer: R2에 복제 대상과 관련 로그·백업을 두고 복제본의 7년 보존을 구성한다
            wrong:
              - 승인되지 않은 R3에 암호화 복제본을 두고 키를 R1에 유지한다
              - R1 키 정책에 복구 역할을 허용하고 R2 대상 키 정책은 앱 전용으로 둔다
              - R2 복제본에 30일 만료를 적용하고 복구 역할에는 원본 버킷 읽기를 준다
            answers:
              - R2에 복제 대상과 관련 로그·백업을 두고 복제본의 7년 보존을 구성한다
              - R2 대상 KMS 키 정책과 복구 역할 IAM에 필요한 복호화 권한을 부여한다
            options:
              - R2에 복제 대상과 관련 로그·백업을 두고 복제본의 7년 보존을 구성한다
              - R2 대상 KMS 키 정책과 복구 역할 IAM에 필요한 복호화 권한을 부여한다
              - 승인되지 않은 R3에 암호화 복제본을 두고 키를 R1에 유지한다
              - R1 키 정책에 복구 역할을 허용하고 R2 대상 키 정책은 앱 전용으로 둔다
              - R2 복제본에 30일 만료를 적용하고 복구 역할에는 원본 버킷 읽기를 준다
      - id: Q27-20
        type: mcq
        title: Q27-20 · 모의고사 C
        explain: |
          <p>대상과 저장소의 비밀값이 일치하므로 남은 문제는 앱의 이전 값과 연결 수명 주기다. 갱신·재연결을 설계하면 코드에 비밀번호를 고정하지 않고 교체를 따라갈 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>이전 값 캐시는 유지하고 DB 비밀번호만 매번 이전 값으로 되돌린다</td>
          <td>자동 교체를 따라가는 대신 이전 값에 맞춰 되돌리므로 요구한 일관된 비밀값 수명 주기와 다르다.</td>
          </tr>
          <tr>
          <td>DB 연결만 계속 재시도하면서 캐시 값의 갱신은 하지 않는다</td>
          <td>이미 만료된 자격 증명으로 반복 연결해도 새로운 비밀번호를 사용하지 못한다.</td>
          </tr>
          <tr>
          <td>Lambda 환경 변수에 최신 비밀번호를 수동 배포하고 다음 교체까지 고정한다</td>
          <td>수동 배포와 고정 값이 남아 자동 교체를 앱이 안정적으로 따라가는 구조가 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/secretsmanager/latest/userguide/retrieving-secrets.html">Get secrets from AWS Secrets Manager - AWS Secrets Manager</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 비밀값 자동 교체 후 새 Lambda 호출 일부가 RDS에 로그인하지 못한다. Secrets Manager의 최신 값과 DB 비밀번호는
              일치하지만 앱이 이전 값을 장시간 메모리에 보관한다. 비밀값을 코드에 다시 넣지 않고 해결하는 방법은?
            answer: 앱의 비밀값 캐시 갱신과 실패 시 재조회·DB 재연결 흐름을 조정한다
            wrong:
              - 이전 값 캐시는 유지하고 DB 비밀번호만 매번 이전 값으로 되돌린다
              - DB 연결만 계속 재시도하면서 캐시 값의 갱신은 하지 않는다
              - Lambda 환경 변수에 최신 비밀번호를 수동 배포하고 다음 교체까지 고정한다
      - id: Q27-21
        type: mcq
        title: Q27-21 · 모의고사 C
        explain: |
          <p>큐가 접수와 처리 속도를 분리하고 작업을 보관하므로 소비자의 일시 중단을 흡수한다. 접수 상태와 완료 상태를 별도 저장하고 재처리를 안전하게 설계해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>API Gateway 응답 제한 시간만 늘리고 PDF를 같은 호출에서 생성한다</td>
          <td>동기 대기를 유지하므로 빠른 접수 응답과 독립 확장이 이루어지지 않는다.</td>
          </tr>
          <tr>
          <td>API 함수가 메모리 목록에 작업을 쌓고 다음 호출에서 처리한다</td>
          <td>실행 환경 메모리는 영속 작업 저장소가 아니며 환경 교체 시 사라질 수 있다.</td>
          </tr>
          <tr>
          <td>동기 호출을 SNS 토픽 하나로 바꾸고 구독 실패 처리는 생략한다</td>
          <td>전달 실패를 다루지 않는 토픽만으로 내구성 있는 작업 대기를 구성하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html">Amazon SQS standard queues - Amazon Simple Queue Service</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 주문 접수 API가 영수증 PDF 생성까지 기다려 응답 시간이 길어졌다. 주문 접수는 빠르게 응답하고 PDF 생성기는 별도로 확장해야
              하며, 생성기가 잠시 중단되어도 접수한 작업을 잃지 않아야 한다. 가장 적합한 구조는?
            answer: 내구성 있는 SQS 작업 큐와 독립 소비자를 두고 작업 상태를 저장한다
            wrong:
              - API Gateway 응답 제한 시간만 늘리고 PDF를 같은 호출에서 생성한다
              - API 함수가 메모리 목록에 작업을 쌓고 다음 호출에서 처리한다
              - 동기 호출을 SNS 토픽 하나로 바꾸고 구독 실패 처리는 생략한다
      - id: Q27-22
        type: mcq
        title: Q27-22 · 모의고사 C
        explain: |
          <p>주문과 outbox의 원자적 커밋이 DB·큐 사이 전송 누락을 막는다. 별도 전달자는 outbox를 재시도하며, 소비자는 이벤트 ID의 중복 확인·고유 제약을 이용해 처리 이력과 발송 지시를 같은 트랜잭션으로 기록한다. 따라서 중복 전달도 중복 업무 효과를 만들지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SQS로 먼저 보내고 주문을 커밋하며, 소비자는 이벤트 ID 고유 제약으로 중복을 거르며 처리 이력과 발송 지시를 함께 커밋한다</td>
          <td>중복 처리는 가능하지만 큐 메시지가 소비된 뒤 주문 커밋에 실패하면 존재하지 않는 주문의 발송 지시가 남을 수 있다.</td>
          </tr>
          <tr>
          <td>주문 커밋 뒤 FIFO 큐로 보내고, 소비자는 이벤트 ID 고유 제약으로 중복을 거르며 처리 이력과 발송 지시를 함께 커밋한다</td>
          <td>소비자 중복은 처리하지만 주문 커밋과 큐 전송 사이 중단으로 발송 의도를 잃는 창은 남는다. FIFO도 DB 트랜잭션에 참여하지 않는다.</td>
          </tr>
          <tr>
          <td>주문과 outbox를 함께 커밋하고, 소비자는 발송 지시 커밋 뒤 메시지를 삭제한다</td>
          <td>Outbox는 전송 누락을 해결하지만 소비자의 발송 지시 커밋 후 SQS 삭제 전 중단이면 재전달 시 지시를 다시 기록할 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html">Transactional outbox pattern</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: RDS 주문 커밋 직후 프로세스가 중단되어 SQS 발송 메시지가 빠졌다. 새 설계는 커밋된 주문의 발송 의도를 잃지 않아야 한다. 전달자는
              확인 응답을 잃으면 재전송할 수 있고, 배송 소비자는 같은 이벤트를 여러 번 받아도 배송 DB에 발송 지시를 한 번만
              기록해야 한다. 배송 DB는 처리 이력과 발송 지시를 같은 트랜잭션에 쓸 수 있다. 적절한 구성은?
            answer: 주문과 outbox를 함께 커밋하고, 소비자는 이벤트 ID 고유 제약으로 중복을 거르며 처리 이력과 발송 지시를 함께 커밋한다
            wrong:
              - SQS로 먼저 보내고 주문을 커밋하며, 소비자는 이벤트 ID 고유 제약으로 중복을 거르며 처리 이력과 발송 지시를
                함께 커밋한다
              - 주문 커밋 뒤 FIFO 큐로 보내고, 소비자는 이벤트 ID 고유 제약으로 중복을 거르며 처리 이력과 발송 지시를
                함께 커밋한다
              - 주문과 outbox를 함께 커밋하고, 소비자는 발송 지시 커밋 뒤 메시지를 삭제한다
      - id: Q27-23
        type: mcq
        title: Q27-23 · 모의고사 C
        explain: |
          <p>토픽의 각 구독 큐는 같은 이벤트를 독립적으로 보관하고 처리 속도를 분리한다. 팀별 실패 격리와 재처리·멱등성을 갖춰야 전달 성공과 업무 완료를 구분할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 소비자가 하나의 DLQ 없이 무제한 동기 재시도를 공유하게 한다</td>
          <td>공유된 무제한 재시도는 실패 격리와 팀별 재처리 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>한 SQS 큐를 두 팀이 읽어 각 메시지가 두 팀 모두에게 전달되게 한다</td>
          <td>하나의 큐를 여러 소비자가 읽으면 일반적으로 작업을 분담하며 모든 팀에 방송되지 않는다.</td>
          </tr>
          <tr>
          <td>SNS 전송 성공을 두 소비자의 업무 처리 완료로 간주한다</td>
          <td>토픽 전달과 각 소비자의 실제 업무 완료는 서로 다른 단계다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html">Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing - Amazon Simple Notification Service</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 결제 완료 이벤트를 회계와 배송 시스템이 모두 받아야 한다. 어느 소비자가 느리더라도 다른 소비자는 계속 처리하고, 각 팀이 실패 메시지를
              자기 기준으로 재처리해야 한다. 함께 필요한 구성 두 가지는?
            answer: SNS 토픽에 각 소비자용 SQS 큐를 별도로 구독시킨다
            wrong:
              - 두 소비자가 하나의 DLQ 없이 무제한 동기 재시도를 공유하게 한다
              - 한 SQS 큐를 두 팀이 읽어 각 메시지가 두 팀 모두에게 전달되게 한다
              - SNS 전송 성공을 두 소비자의 업무 처리 완료로 간주한다
            answers:
              - SNS 토픽에 각 소비자용 SQS 큐를 별도로 구독시킨다
              - 소비자별 재시도·DLQ와 업무 멱등성을 구성한다
            options:
              - 두 소비자가 하나의 DLQ 없이 무제한 동기 재시도를 공유하게 한다
              - SNS 토픽에 각 소비자용 SQS 큐를 별도로 구독시킨다
              - 소비자별 재시도·DLQ와 업무 멱등성을 구성한다
              - 한 SQS 큐를 두 팀이 읽어 각 메시지가 두 팀 모두에게 전달되게 한다
              - SNS 전송 성공을 두 소비자의 업무 처리 완료로 간주한다
      - id: Q27-24
        type: mcq
        title: Q27-24 · 모의고사 C
        explain: |
          <p>EventBridge bus의 규칙은 이벤트 필드 조건으로 서로 다른 대상을 선택하며 한 이벤트가 여러 규칙과 일치할 수 있다. 기존 AWS 이벤트와 앱 이벤트를 규칙으로 처리하면 별도 중계 코드 없이 기존 SQS 큐를 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Bus에서 공용 Lambda로 전달하고 Lambda가 이벤트 필드를 검사해 해당 SQS 큐에 전송한다</td>
          <td>Lambda 코드로는 구현 가능하지만 새로운 종류와 라우팅 변화마다 중계 코드를 운영하게 되어 명시한 운영 요구와 다르다.</td>
          </tr>
          <tr>
          <td>Bus 이벤트를 한 SQS에 모아 단일 Pipe로 읽고 출력 이벤트에 따라 세 큐를 대상으로 지정한다</td>
          <td>Pipe는 단일 source에서 단일 target으로 연결하는 모델이다. 한 Pipe에 세 개의 출력 큐를 동적 분기 대상으로 지정하는 구성은 맞지 않는다.</td>
          </tr>
          <tr>
          <td>Bus에서 SNS로 전달하고 각 큐 구독에 메시지 속성 기반 필터만 설정한다</td>
          <td>EventBridge 이벤트 필드는 SNS 메시지 본문에 포함된다. 메시지 속성 필터만으로 주문 금액·EC2 상태 본문을 평가하지 못하며 payload 기반 필터 등의 다른 구성이 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-bus.html">EventBridge event bus rules</a> · <a href="https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering-scope.html">SNS subscription filter scope</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 기존 EventBridge default bus에 EC2 상태 변경 이벤트가 들어오고 주문 앱도 같은 bus에 이벤트를 발행한다. 주문
              금액·EC2 상태에 따라 세 개의 기존 SQS 큐 중 하나 이상으로 즉시 보내야 하며, 새 이벤트 종류가 늘어도 중계
              애플리케이션 코드는 운영하지 않으려 한다. 기존 큐는 유지할 때 적절한 라우팅 구성은?
            answer: 이벤트 패턴별 bus 규칙을 만들고 일치하는 각 규칙의 대상으로 해당 SQS 큐를 연결한다
            wrong:
              - Bus에서 공용 Lambda로 전달하고 Lambda가 이벤트 필드를 검사해 해당 SQS 큐에 전송한다
              - Bus 이벤트를 한 SQS에 모아 단일 Pipe로 읽고 출력 이벤트에 따라 세 큐를 대상으로 지정한다
              - Bus에서 SNS로 전달하고 각 큐 구독에 메시지 속성 기반 필터만 설정한다
      - id: Q27-25
        type: mcq
        title: Q27-25 · 모의고사 C
        explain: |
          <p>상태 머신으로 장기 대기와 오류별 재시도를 조정하고 보상 API를 직접 정의할 수 있다. 외부 시스템을 포함한 업무는 워크플로를 사용해도 자동 원자적 롤백이 되지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>각 단계가 다음 단계를 직접 호출하고 재시도·보상 상태는 프로세스 메모리에만 둔다</td>
          <td>장기 대기·프로세스 중단을 견디는 상태 관리가 없어 신뢰성 있는 순서·보상 조정이 어렵다.</td>
          </tr>
          <tr>
          <td>Lambda 한 호출을 기본 최대 시간 이상 유지하며 모든 단계에서 대기한다</td>
          <td>일반 함수의 호출 제한을 넘는 대기를 한 호출에서 유지할 수 없다.</td>
          </tr>
          <tr>
          <td>SQS FIFO를 사용하면 외부 예약 취소까지 자동 롤백된다고 가정한다</td>
          <td>FIFO의 순서·중복 억제는 외부 예약의 보상 트랜잭션을 자동 수행하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html">Handling errors in Step Functions workflows - AWS Step Functions</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 여행 예약은 항공 좌석 확보 뒤 호텔을 예약하고 최종 결제를 한다. 호텔 실패 시 좌석 반환을 호출하고, 일시적 외부 오류만 제한적으로
              재시도해야 한다. 여러 단계가 수십 분 대기할 수 있어 함수 하나에서 계속 기다리기 어렵다. 적합한 구성은?
            answer: Step Functions로 대기·분기·Retry·Catch와 명시적 보상 단계를 구성한다
            wrong:
              - 각 단계가 다음 단계를 직접 호출하고 재시도·보상 상태는 프로세스 메모리에만 둔다
              - Lambda 한 호출을 기본 최대 시간 이상 유지하며 모든 단계에서 대기한다
              - SQS FIFO를 사용하면 외부 예약 취소까지 자동 롤백된다고 가정한다
      - id: Q27-26
        type: mcq
        title: Q27-26 · 모의고사 C
        explain: |
          <p>기존 ActiveMQ 프로토콜과 API 의존성을 유지해야 하므로 Amazon MQ가 우선 후보이다. 엔진 버전·기능·가용성 구성을 검증해야 하며 다른 메시징 서비스와 호환을 가정하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SNS와 SQS로 새 인터페이스를 만들고 기존 JMS 클라이언트를 모두 수정한다</td>
          <td>신규 설계 후보는 될 수 있으나 단기간 클라이언트 코드 변경을 피하려는 요구와 맞지 않는다.</td>
          </tr>
          <tr>
          <td>SQS로 주소만 바꾸고 기존 JMS 브로커 기능이 동일하다고 가정한다</td>
          <td>SQS는 ActiveMQ 브로커의 기능·프로토콜을 주소 변경만으로 동일하게 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>EventBridge로 프로토콜 변환 계층을 직접 만들고 모든 JMS 동작을 재구현한다</td>
          <td>대규모 메시징 코드 재작성을 피하려는 제한과 브로커 호환 우선 조건에 어긋난다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html">What is Amazon MQ? - Amazon MQ</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 기존 Java 앱은 JMS와 ActiveMQ 브로커 동작을 전제로 작성되어 있다. 단기간에는 메시징 코드를 크게 고칠 수 없지만 브로커
              패치 운영을 줄여야 한다. 단순 큐의 낮은 운영 비용보다 기존 인터페이스 호환이 우선이다. 적합한 선택은?
            answer: 지원되는 ActiveMQ 구성의 Amazon MQ로 호환성과 HA를 검증한다
            wrong:
              - SNS와 SQS로 새 인터페이스를 만들고 기존 JMS 클라이언트를 모두 수정한다
              - SQS로 주소만 바꾸고 기존 JMS 브로커 기능이 동일하다고 가정한다
              - EventBridge로 프로토콜 변환 계층을 직접 만들고 모든 JMS 동작을 재구현한다
      - id: Q27-27
        type: mcq
        title: Q27-27 · 모의고사 C
        explain: |
          <p>수평 확장은 다음 요청이 다른 인스턴스에 도착할 수 있으므로 로컬 상태 의존성을 제거해야 한다. 외부 세션·파일 저장소에도 가용성과 만료·접근 정책을 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Sticky session으로 각 사용자를 기존 서버에 계속 연결하고 상태는 로컬에 유지한다</td>
          <td>정상 서버에 대한 요청 고정은 가능하지만 교체·장애 시 로컬 세션과 파일을 다른 서버에서 사용할 수 있게 만들지는 않는다.</td>
          </tr>
          <tr>
          <td>현재 서버의 디스크 스냅샷으로 새 서버를 시작하고 이후 파일·세션 변경은 동기화하지 않는다</td>
          <td>시작 시점의 디스크 사본은 이후 변경을 공유하지 않으며 RAM 세션도 포함하지 않아 어느 서버에서나 같은 상태를 처리하지 못한다.</td>
          </tr>
          <tr>
          <td>세션 파일을 EBS에 저장하고 인스턴스별로 서로 다른 볼륨을 연결한다</td>
          <td>서버별 디스크로 옮겨도 다른 서버가 동일 상태를 읽는 공유 문제가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_stateless.html">REL05-BP06 Make systems stateless where possible</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: ALB 뒤 서버를 늘리자 일부 회원의 로그인 상태가 사라진다. 세션은 각 서버 메모리에만 있고 업로드 파일도 로컬 디스크에 있다. 서버를
              자주 교체하면서 요청을 어느 서버로 보내도 처리할 수 있게 하려면?
            answer: 세션을 외부 저장소로, 업로드를 공유 가능한 영속 저장소로 분리한다
            wrong:
              - Sticky session으로 각 사용자를 기존 서버에 계속 연결하고 상태는 로컬에 유지한다
              - 현재 서버의 디스크 스냅샷으로 새 서버를 시작하고 이후 파일·세션 변경은 동기화하지 않는다
              - 세션 파일을 EBS에 저장하고 인스턴스별로 서로 다른 볼륨을 연결한다
      - id: Q27-28
        type: mcq
        title: Q27-28 · 모의고사 C
        explain: |
          <p>외부 결제는 안정적인 작업 식별자로 멱등하게 호출해 결제 성공과 내부 기록 사이 실패도 안전하게 재시도한다. 내부 완료 상태도 영속 저장하고 재전달 시 먼저 확인해야 외부 재호출 없이 이미 끝난 작업을 종결한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Standard를 FIFO로 바꾸면 외부 결제의 중복 효과도 자동 제거된다고 본다</td>
          <td>큐 수준 전송 중복 억제만으로 외부 결제와 삭제 사이의 실패가 원자적으로 해결되지 않는다.</td>
          </tr>
          <tr>
          <td>처리 시작 전에 메시지를 삭제해 재전달 가능성만 없앤다</td>
          <td>삭제 뒤 처리 실패하면 작업을 잃어 메시지 손실 방지 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>visibility timeout을 길게 하면 중복 가능성이 완전히 사라진다고 본다</td>
          <td>시간 연장은 불필요한 동시 처리를 줄이지만 모든 중복 전달을 없애지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">Amazon SQS visibility timeout - Amazon Simple Queue Service</a> · <a href="https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/">Making retries safe with idempotent APIs</a> · <a href="https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html">Transactional outbox pattern</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: SQS 소비자가 결제 API 호출에 성공한 뒤 메시지 삭제 전에 중단되었다. 메시지를 잃지 않으면서 외부 결제 중복을 막아야 한다. 내부
              시스템에도 완료 상태를 영속 보관하고, 완료 기록이 있는 작업의 재전달은 외부 API를 다시 호출하지 않고
              확인·종결해야 한다. 필요한 조치 두 가지는?
            answer: 주문·작업 식별자를 사용해 외부 결제 호출도 멱등하게 처리한다
            wrong:
              - Standard를 FIFO로 바꾸면 외부 결제의 중복 효과도 자동 제거된다고 본다
              - 처리 시작 전에 메시지를 삭제해 재전달 가능성만 없앤다
              - visibility timeout을 길게 하면 중복 가능성이 완전히 사라진다고 본다
            answers:
              - 주문·작업 식별자를 사용해 외부 결제 호출도 멱등하게 처리한다
              - 성공 상태를 영속 기록하고 재전달 시 확인한 뒤 메시지를 삭제한다
            options:
              - Standard를 FIFO로 바꾸면 외부 결제의 중복 효과도 자동 제거된다고 본다
              - 주문·작업 식별자를 사용해 외부 결제 호출도 멱등하게 처리한다
              - 성공 상태를 영속 기록하고 재전달 시 확인한 뒤 메시지를 삭제한다
              - 처리 시작 전에 메시지를 삭제해 재전달 가능성만 없앤다
              - visibility timeout을 길게 하면 중복 가능성이 완전히 사라진다고 본다
      - id: Q27-29
        type: mcq
        title: Q27-29 · 모의고사 C
        explain: |
          <p>독립 소비자의 부하는 작업당 처리 시간·처리자당 적체·대기 시간으로 판단한다. 접수와 처리의 확장을 분리해야 큐가 허용하는 지연 안에서 소비량을 조절할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>접수 서버의 평균 CPU만 보고 모든 송장 소비자 수를 고정한다</td>
          <td>접수 CPU는 후속 소비자의 적체와 기한 준수 상태를 직접 나타내지 않는다.</td>
          </tr>
          <tr>
          <td>큐에 들어간 전체 누적 메시지 수를 계속 증가하는 목표로 사용한다</td>
          <td>영구 누적값은 현재 필요한 용량과 무관하게 증가하여 확장 지표로 부적절하다.</td>
          </tr>
          <tr>
          <td>총 접수 요청 수만으로 송장 작업자를 늘리고 실제 적체·처리 시간은 보지 않는다</td>
          <td>건별 작업량과 처리 속도가 달라지면 접수 요청 수만으로 처리 기한 준수 여부를 판단하기 어렵다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html">Scaling policy based on Amazon SQS - Amazon EC2 Auto Scaling</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 파트너 API는 주문 접수 결과만 즉시 필요하고 송장 처리는 최대 한 시간 늦어도 된다. 송장 생성량은 수십 배 변하지만 접수 서버는
              안정적으로 유지하려 한다. 큐를 도입한 뒤 확장 지표로 가장 적합한 것은?
            answer: 처리자 한 개당 적체와 메시지 대기 시간을 보고 소비자 용량을 조정한다
            wrong:
              - 접수 서버의 평균 CPU만 보고 모든 송장 소비자 수를 고정한다
              - 큐에 들어간 전체 누적 메시지 수를 계속 증가하는 목표로 사용한다
              - 총 접수 요청 수만으로 송장 작업자를 늘리고 실제 적체·처리 시간은 보지 않는다
      - id: Q27-30
        type: mcq
        title: Q27-30 · 모의고사 C
        explain: |
          <p>기존 Multi-AZ DB instance의 standby는 HA용이고 일반 조회 대상이 아니다. 지연을 허용하는 통계를 읽기 복제본에 보내면 장애 대응과 조회 분산을 각각 충족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>읽기 복제본 대신 매번 수동 스냅샷에서 새 DB를 복원해 통계에 연결한다</td>
          <td>시점별 분석에는 가능하지만 지속 통계 조회를 위한 반복 복원·전환 운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>현재 standby 엔드포인트로 통계 연결을 직접 분산한다</td>
          <td>해당 배포 유형의 standby는 정상 상태의 일반 읽기를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>기본 DB에만 통계 연결을 더 만들고 Multi-AZ standby는 그대로 둔다</td>
          <td>연결 증가는 기본 DB 읽기 부하 분리 요구를 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html">Working with DB instance read replicas - Amazon Relational Database Service</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 기존 RDS MySQL Multi-AZ DB instance를 사용하는 주문 시스템에 읽기 부하가 커졌다. AZ 장애 시 자동 복구를
              유지하고 통계 조회는 상시 제공하되 약간 지연되어도 된다. 현재 배포의 standby에는 일반 읽기를 보낼 수 없다.
              적합한 확장 방법은?
            answer: 기존 HA를 유지하고 비동기 읽기 복제본으로 통계 조회를 분리한다
            wrong:
              - 읽기 복제본 대신 매번 수동 스냅샷에서 새 DB를 복원해 통계에 연결한다
              - 현재 standby 엔드포인트로 통계 연결을 직접 분산한다
              - 기본 DB에만 통계 연결을 더 만들고 Multi-AZ standby는 그대로 둔다
      - id: Q27-31
        type: mcq
        title: Q27-31 · 모의고사 C
        explain: |
          <p>Multi-AZ DB instance는 DB 장애에 대한 관리형 자동 failover를 제공한다. Zonal NAT는 AZ 의존 자원이므로 각 AZ의 앱이 해당 AZ NAT를 사용해야 다른 AZ 장애 시에도 살아남은 앱의 출구가 남는다. 이는 장애 조치 동안 연결 중단이 없다는 보장은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>AZ B에 RDS 비동기 읽기 복제본을 만들고 두 AZ의 앱 경로를 AZ B NAT로 지정한다</td>
          <td>읽기 복제본의 관리형 자동 쓰기 failover 요구를 충족하지 못하며 AZ B 손실 때 AZ A 앱도 외부 출구를 잃는다.</td>
          </tr>
          <tr>
          <td>RDS를 Multi-AZ DB instance로 전환하고 두 AZ의 앱 경로를 AZ A NAT로 지정한다</td>
          <td>DB 자동 장애 조치는 가능하지만 AZ A가 손실되면 AZ B의 외부 호출도 공유 NAT를 잃는다.</td>
          </tr>
          <tr>
          <td>AZ B에 RDS 비동기 읽기 복제본을 만들고 각 AZ의 앱 경로를 같은 AZ NAT로 지정한다</td>
          <td>출구는 AZ별로 분리되지만 일반 비동기 읽기 복제본의 승격·쓰기 전환은 Multi-AZ DB instance의 자동 장애 조치를 대신하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html">RDS Multi-AZ DB instances</a> · <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html">NAT gateway basics</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 두 AZ의 앱이 단일 AZ RDS MySQL DB instance와 AZ A의 Zonal NAT를 공유한다. AZ 하나가 손실되어도 DB는
              관리형 자동 장애 조치로 쓰기를 재개해야 하고, 살아남은 앱의 외부 결제 호출은 다른 AZ 출구에 의존하면 안 된다.
              앱의 DB 연결 재시도는 구현되어 있다. Zonal NAT를 유지하는 변경안 중 두 요구를 충족하는 것은?
            answer: RDS를 Multi-AZ DB instance로 전환하고 각 AZ의 앱 경로를 같은 AZ NAT로 지정한다
            wrong:
              - AZ B에 RDS 비동기 읽기 복제본을 만들고 두 AZ의 앱 경로를 AZ B NAT로 지정한다
              - RDS를 Multi-AZ DB instance로 전환하고 두 AZ의 앱 경로를 AZ A NAT로 지정한다
              - AZ B에 RDS 비동기 읽기 복제본을 만들고 각 AZ의 앱 경로를 같은 AZ NAT로 지정한다
      - id: Q27-32
        type: mcq
        title: Q27-32 · 모의고사 C
        explain: |
          <p>복구 목표는 DB 사본의 존재만이 아니라 독립적인 운영 접근과 전체 업무 재개로 검증한다. 복제 지연은 데이터 손실 범위, 실제 전환·확장·검증은 복구 시간을 판단하는 근거다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>축소 앱의 현재 대수만 세고 복구 리전 할당량은 제외한다</td>
          <td>실제 확장에는 할당량과 시작 용량이 필요하므로 현재 대수만으로 판단할 수 없다.</td>
          </tr>
          <tr>
          <td>복제 지연이 10분 이내면 로그인과 업무 복구 시간은 측정하지 않는다</td>
          <td>RPO를 만족해도 업무 재개 시간이 길면 RTO는 실패할 수 있다.</td>
          </tr>
          <tr>
          <td>DB 복제본이 있다는 사실만으로 RTO 충족을 기록한다</td>
          <td>DB 준비만으로 앱·인증·네트워크를 포함한 업무 재개 시간이 증명되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_planning_for_recovery_dr_tested.html">REL13-BP03 Test disaster recovery implementation</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 회사는 RPO 10분·RTO 1시간으로 다른 리전 복구를 설계한다. 데이터 복제와 축소 앱은 준비됐지만 최근 훈련은 관리자 콘솔에
              로그인하는 단계에서 막혔다. 목표를 검증하기 위해 함께 확인할 항목 두 가지는?
            answer: 주 리전 의존 없이 인증·KMS·비밀값·네트워크에 접근 가능한지 확인한다
            wrong:
              - 축소 앱의 현재 대수만 세고 복구 리전 할당량은 제외한다
              - 복제 지연이 10분 이내면 로그인과 업무 복구 시간은 측정하지 않는다
              - DB 복제본이 있다는 사실만으로 RTO 충족을 기록한다
            answers:
              - 주 리전 의존 없이 인증·KMS·비밀값·네트워크에 접근 가능한지 확인한다
              - 복제 지연부터 앱 확장·DNS 전환·업무 검증까지 실제 시간을 측정한다
            options:
              - 축소 앱의 현재 대수만 세고 복구 리전 할당량은 제외한다
              - 복제 지연이 10분 이내면 로그인과 업무 복구 시간은 측정하지 않는다
              - 주 리전 의존 없이 인증·KMS·비밀값·네트워크에 접근 가능한지 확인한다
              - 복제 지연부터 앱 확장·DNS 전환·업무 검증까지 실제 시간을 측정한다
              - DB 복제본이 있다는 사실만으로 RTO 충족을 기록한다
      - id: Q27-33
        type: mcq
        title: Q27-33 · 모의고사 C
        explain: |
          <p>논리적 삭제는 복제에도 전달되므로 과거 시점 백업을 사용해야 한다. PITR은 새 DB를 만들며 데이터·권한·앱 접속을 확인한 뒤 운영 연결을 바꿔야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Multi-AZ 장애 조치를 실행하면 standby가 과거 변경을 취소한다</td>
          <td>정상 삭제 트랜잭션은 standby에도 반영되므로 HA 전환은 과거 복구가 아니다.</td>
          </tr>
          <tr>
          <td>현재 DB를 재시작한 뒤 이미 삭제가 반영된 복제본으로 연결을 돌린다</td>
          <td>어느 대상도 삭제 전 상태를 보존하지 않아 과거 데이터 복구가 되지 않는다.</td>
          </tr>
          <tr>
          <td>읽기 복제본 하나를 승격하면 삭제 전 데이터가 자동으로 돌아온다</td>
          <td>이미 전달된 삭제는 복제본 승격으로 되돌아가지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html">Restoring a DB instance to a specified time for Amazon RDS - Amazon Relational Database Service</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 운영자가 주문 테이블을 실수로 삭제했고 이 변경이 모든 읽기 복제본에도 반영되었다. 삭제 직전의 데이터로 복구하되 기존 환경을 바로 덮어써
              추가 손실을 만들고 싶지 않다. 자동 백업 보존 범위 안의 사고다. 적절한 절차는?
            answer: PITR로 삭제 직전의 새 DB를 복원하고 검증 후 연결을 전환한다
            wrong:
              - Multi-AZ 장애 조치를 실행하면 standby가 과거 변경을 취소한다
              - 현재 DB를 재시작한 뒤 이미 삭제가 반영된 복제본으로 연결을 돌린다
              - 읽기 복제본 하나를 승격하면 삭제 전 데이터가 자동으로 돌아온다
      - id: Q27-34
        type: mcq
        title: Q27-34 · 모의고사 C
        explain: |
          <p>앱 실패를 ASG 교체 판단에 반영하려면 ELB 상태 확인을 사용해야 한다. 준비 시간 유예는 새 인스턴스를 너무 일찍 교체하지 않게 돕지만 ALB의 정상 대상 확인은 계속 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ASG 최대 용량만 늘리고 unhealthy 판단은 기존처럼 무시한다</td>
          <td>용량 상한 증가는 앱 unhealthy 신호를 교체 근거로 연결하지 않는다.</td>
          </tr>
          <tr>
          <td>유예 시간을 늘리는 대신 ASG가 ELB 상태를 받는 설정은 생략한다</td>
          <td>유예 시간만으로 ASG가 사용하지 않는 ELB 상태를 새로 반영하지 않는다.</td>
          </tr>
          <tr>
          <td>ALB의 상태 확인을 끄고 EC2 시스템 검사만 계속 사용한다</td>
          <td>앱 장애를 드러내는 신호를 제거하면 적절한 교체 판단을 할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html">Health checks for instances in an Auto Scaling group - Amazon EC2 Auto Scaling</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: ASG의 EC2 시스템 검사는 정상이지만 앱 프로세스가 멈췄다. ALB는 대상을 unhealthy로 보지만 ASG는 이를 교체하지 않는다.
              앱 준비에는 몇 분이 걸리며 배포 직후 불필요한 반복 교체도 막아야 한다. 적절한 설정은?
            answer: ASG에 ELB 상태 확인을 반영하고 앱 준비에 맞는 유예 시간을 설정한다
            wrong:
              - ASG 최대 용량만 늘리고 unhealthy 판단은 기존처럼 무시한다
              - 유예 시간을 늘리는 대신 ASG가 ELB 상태를 받는 설정은 생략한다
              - ALB의 상태 확인을 끄고 EC2 시스템 검사만 계속 사용한다
      - id: Q27-35
        type: mcq
        title: Q27-35 · 모의고사 C
        explain: |
          <p>Warm standby의 이름이 확장 성공을 보장하지 않는다. 목표 시간 내 시작하려면 IP, 할당량, EC2 실제 용량과 앱 준비·업무 검증을 복구 환경에서 시험해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>RPO 수치만 강화하고 실제 앱 확장 시간은 설계 검토에서 제외한다</td>
          <td>데이터 손실 목표만으로 복구 실행 시간과 시작 실패를 해결할 수 없다.</td>
          </tr>
          <tr>
          <td>주 리전의 EC2 할인 약정만 늘려 복구 리전의 시작 용량을 보장한다</td>
          <td>할인 약정과 지정 리전·AZ의 실행 용량 확보는 별개다.</td>
          </tr>
          <tr>
          <td>복구 리전 최소 대수만 낮춰 서브넷 주소 부족을 항상 해결한다</td>
          <td>평상시 주소를 아껴도 장애 시 필요한 전체 주소가 부족하면 같은 실패가 난다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html">REL13-BP02 Use defined recovery strategies to meet the recovery objectives - Reliability Pillar</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 예측 가능한 월말 행사에 대비해 Warm standby를 쓰려 한다. 복구 리전 앱은 작게 운영되고 장애 시 확장하지만 지난 훈련에서는
              서브넷 주소 부족으로 서버 시작이 실패했다. 복구 성공률을 높일 조치는?
            answer: 복구 리전의 IP·할당량·실행 용량과 확장·전환 절차를 실제 부하로 검증한다
            wrong:
              - RPO 수치만 강화하고 실제 앱 확장 시간은 설계 검토에서 제외한다
              - 주 리전의 EC2 할인 약정만 늘려 복구 리전의 시작 용량을 보장한다
              - 복구 리전 최소 대수만 낮춰 서브넷 주소 부족을 항상 해결한다
      - id: Q27-36
        type: mcq
        title: Q27-36 · 모의고사 C
        explain: |
          <p>두 앱 환경을 남겨도 공유 데이터의 비호환 변경까지 되돌리는 것은 아니다. 확장·축소 같은 호환 배포와 백업·복구 계획을 함께 설계해야 실제 복귀 가능성을 확보한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Blue/green은 동일 DB를 공유할 수 없어서 두 DB의 스키마 동기화가 항상 필요하다</td>
          <td>앱의 blue/green 환경은 같은 DB를 공유할 수 있다. 이 사례의 위험은 독립 DB 간 동기화 의무가 아니라 이전 앱이 필요로 하는 열의 삭제다.</td>
          </tr>
          <tr>
          <td>로드 밸런서가 있으면 이전 앱의 DB 연결이 자동으로 새 스키마에 맞춰진다</td>
          <td>로드 밸런서는 SQL과 스키마를 자동 변환하지 않는다.</td>
          </tr>
          <tr>
          <td>두 환경이 있으면 DB 변경은 반드시 서로 다른 데이터에만 적용된다</td>
          <td>두 앱 환경이 같은 DB를 사용할 수 있으므로 데이터 격리를 가정할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/whitepapers/latest/blue-green-deployments/welcome.html">Blue/Green Deployments on AWS - Blue/Green Deployments on AWS</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 새 버전 배포 뒤 결제 오류가 발생해 이전 앱으로 즉시 돌아가려 한다. 새 버전은 DB 열을 삭제했고 이전 앱은 그 열을 사용한다.
              Blue/green 전환만으로 안전한 복귀를 보장할 수 없는 이유는?
            answer: 앱 트래픽 전환과 별개로 데이터 스키마의 이전 버전 호환이 필요하다
            wrong:
              - Blue/green은 동일 DB를 공유할 수 없어서 두 DB의 스키마 동기화가 항상 필요하다
              - 로드 밸런서가 있으면 이전 앱의 DB 연결이 자동으로 새 스키마에 맞춰진다
              - 두 환경이 있으면 DB 변경은 반드시 서로 다른 데이터에만 적용된다
      - id: Q27-37
        type: mcq
        title: Q27-37 · 모의고사 C
        explain: |
          <p>재시도 간격을 늘리고 분산하며 전체 작업 기한과 시도 횟수를 제한해야 회복 중인 시스템에 부하가 몰리지 않는다. 추가 처리의 업무 중복 여부와 진입 제한도 함께 검토한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 호출자가 같은 고정 간격으로 무제한 재시도하도록 통일한다</td>
          <td>동일 시점 재시도가 겹치며 기한 없이 부하를 계속 유지한다.</td>
          </tr>
          <tr>
          <td>연결 수를 늘린 뒤 모든 오류를 성공할 때까지 즉시 재실행한다</td>
          <td>연결 증설만으로 무제한 재시도에 따른 연쇄 과부하를 차단하지 못한다.</td>
          </tr>
          <tr>
          <td>전체 호출 제한 시간을 늘리고 서버마다 같은 고정 간격으로 계속 재시도한다</td>
          <td>긴 제한 시간과 동기화된 반복 재시도는 연결 점유·부하 집중을 늘릴 수 있어 전체 기한과 과부하 제어 요구에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/">Timeouts, retries, and backoff with jitter | AWS Builder Center</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 외부 재고 API 장애가 난 뒤 모든 주문 서버가 즉시 무제한 재시도하여 DB 연결까지 고갈되었다. 재고 조회의 전체 처리 기한은 제한돼
              있고, 일시 장애 때만 재시도하면 된다. 가장 적절한 개선은?
            answer: 지수 백오프·지터와 횟수·전체 기한 제한을 두고 과부하를 제어한다
            wrong:
              - 모든 호출자가 같은 고정 간격으로 무제한 재시도하도록 통일한다
              - 연결 수를 늘린 뒤 모든 오류를 성공할 때까지 즉시 재실행한다
              - 전체 호출 제한 시간을 늘리고 서버마다 같은 고정 간격으로 계속 재시도한다
      - id: Q27-38
        type: mcq
        title: Q27-38 · 모의고사 C
        explain: |
          <p>Regional EFS는 여러 AZ에 데이터를 저장하고 여러 Linux 서버가 공유 파일 경로로 접근할 수 있다. 서버 AZ의 마운트 타깃을 사용하면 해당 경로와 다중 AZ 저장 요구를 연결한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>단일 AZ EBS io2 Multi-Attach 볼륨</td>
          <td>Multi-Attach도 같은 AZ 범위이며 일반 공유 파일 시스템의 다중 AZ 저장과 다르다.</td>
          </tr>
          <tr>
          <td>EFS One Zone과 세 AZ 서버의 교차 AZ 마운트</td>
          <td>다른 AZ 서버가 접근해도 파일 데이터는 한 AZ에 있어 AZ 손실 내성이 부족하다.</td>
          </tr>
          <tr>
          <td>서버별 EBS 볼륨과 주기적인 파일 복사</td>
          <td>즉시 동일 파일 경로 공유가 아니며 파일 복사 지연과 충돌 제어가 별도 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/efs/latest/ug/features.html">Features of Amazon EFS - Amazon Elastic File System</a>
          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: 세 AZ의 Linux 웹 서버가 동일한 업로드 디렉터리를 동시에 사용한다. 기존 앱은 POSIX 파일 경로를 요구해 객체 API로 바꾸기
              어렵고, 한 AZ의 손실에도 데이터 저장 계층이 유지되어야 한다. 가장 적합한 저장소는?
            answer: Regional EFS와 서버 AZ별 마운트 타깃
            wrong:
              - 단일 AZ EBS io2 Multi-Attach 볼륨
              - EFS One Zone과 세 AZ 서버의 교차 AZ 마운트
              - 서버별 EBS 볼륨과 주기적인 파일 복사
      - id: Q27-39
        type: mcq
        title: Q27-39 · 모의고사 C
        explain: |
          <p>S3 File Gateway는 기존 파일 프로토콜과 S3 객체 저장을 연결한다. 로컬에 없는 데이터나 아직 전송되지 않은 변경은 연결·캐시 상태에 영향을 받으므로 버퍼와 장애 동작도 검증한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Volume Gateway cached volumes로 iSCSI 볼륨을 직접 앱에 제공한다</td>
          <td>앱이 유지하려는 SMB 파일 인터페이스가 아니라 블록 인터페이스이다.</td>
          </tr>
          <tr>
          <td>DataSync 예약 작업만으로 기존 SMB 서버와 S3 사이를 매시간 복사한다</td>
          <td>일괄 복사 작업만으로 로컬 캐시를 가진 S3 연계 파일 공유 계층을 제공하지 못한다.</td>
          </tr>
          <tr>
          <td>캐시가 있으므로 원격 데이터 전체가 오프라인에서도 항상 보인다고 가정한다</td>
          <td>캐시는 전체 원격 데이터의 오프라인 사본을 보장하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html">What is Amazon S3 File Gateway - AWS Storage Gateway</a>
          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: 온프레미스 Windows 앱은 SMB 파일 공유를 계속 사용해야 한다. 파일을 S3 객체로 보관하고 자주 읽는 데이터는 로컬에 캐시하되,
              S3를 파일 시스템처럼 직접 마운트하는 방식은 피하려 한다. 함께 적절한 조치 두 가지는?
            answer: S3 File Gateway를 배치해 SMB 인터페이스와 로컬 캐시를 제공한다
            wrong:
              - Volume Gateway cached volumes로 iSCSI 볼륨을 직접 앱에 제공한다
              - DataSync 예약 작업만으로 기존 SMB 서버와 S3 사이를 매시간 복사한다
              - 캐시가 있으므로 원격 데이터 전체가 오프라인에서도 항상 보인다고 가정한다
            answers:
              - S3 File Gateway를 배치해 SMB 인터페이스와 로컬 캐시를 제공한다
              - 캐시·업로드 버퍼와 회선을 산정하고 네트워크 단절 시 동작을 검증한다
            options:
              - S3 File Gateway를 배치해 SMB 인터페이스와 로컬 캐시를 제공한다
              - 캐시·업로드 버퍼와 회선을 산정하고 네트워크 단절 시 동작을 검증한다
              - Volume Gateway cached volumes로 iSCSI 볼륨을 직접 앱에 제공한다
              - DataSync 예약 작업만으로 기존 SMB 서버와 S3 사이를 매시간 복사한다
              - 캐시가 있으므로 원격 데이터 전체가 오프라인에서도 항상 보인다고 가정한다
      - id: Q27-40
        type: mcq
        title: Q27-40 · 모의고사 C
        explain: |
          <p>io2 Block Express는 Nitro에서 단일 볼륨 최대 256,000 IOPS와 1,000 IOPS/GiB 비율을 지원하므로 200GiB·120,000 IOPS 구성이 가능하다. 16KiB I/O에 평균 500마이크로초 미만으로 설계되어 낮은 지연 요구의 후보가 된다. 실제 DB 부하는 별도 부하 시험으로 확인한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>200GiB gp3 한 개에 80,000 IOPS와 2,000MiB/s를 프로비저닝한다</td>
          <td>gp3 단일 볼륨 최대 80,000 IOPS는 요구한 120,000에 미달한다. 높은 처리량 설정이 IOPS 상한을 올리지는 않는다.</td>
          </tr>
          <tr>
          <td>200GiB gp3 두 개에 각각 60,000 IOPS를 주고 RAID 0으로 묶는다</td>
          <td>각 볼륨 설정과 합산 설계는 가능하지만 두 볼륨 RAID는 명시된 DB 인증 조건인 단일 볼륨에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>200GiB io2 Block Express 한 개에 60,000 IOPS를 프로비저닝한다</td>
          <td>저지연 유형은 맞지만 프로비저닝한 IOPS 자체가 지속 120,000 요구의 절반이다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/provisioned-iops.html">EBS io2 Block Express</a> · <a href="https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html">EBS gp3 performance</a>
          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: Nitro EC2 DB는 인증된 구성상 단일 EBS 볼륨만 사용할 수 있다. 데이터는 200GiB이며 16KiB 랜덤 I/O에서 지속
              120,000 IOPS와 평균 1ms 미만 지연이 필요하다. 인스턴스는 해당 IOPS·처리량을 지원하고 AZ 단위
              데이터 보호는 별도로 갖췄다. 현재 제공되는 볼륨 중 요구를 충족할 후보는?
            answer: 200GiB io2 Block Express 한 개에 120,000 IOPS를 프로비저닝한다
            wrong:
              - 200GiB gp3 한 개에 80,000 IOPS와 2,000MiB/s를 프로비저닝한다
              - 200GiB gp3 두 개에 각각 60,000 IOPS를 주고 RAID 0으로 묶는다
              - 200GiB io2 Block Express 한 개에 60,000 IOPS를 프로비저닝한다
      - id: Q27-41
        type: mcq
        title: Q27-41 · 모의고사 C
        explain: |
          <p>평균 동시 실행은 요청률과 평균 실행 시간의 곱으로 추정한다. 400×0.5와 400×2를 비교하면 같은 요청률에서도 필요한 동시 실행과 외부 연결 부하가 네 배가 된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>실행 시간이 늘면 호출이 줄어 평균 동시 실행은 50으로 내려간다</td>
          <td>요청률이 유지되는 조건에서 처리 시간 증가가 동시 실행 감소를 의미하지 않는다.</td>
          </tr>
          <tr>
          <td>Provisioned concurrency를 끄면 실행 시간과 무관하게 동시 실행이 제한된다</td>
          <td>Provisioned concurrency는 준비 환경 설정이며 이 계산의 상한을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>요청률이 같으므로 평균 동시 실행도 200으로 그대로 유지된다</td>
          <td>처리 시간이 길어지면 같은 순간 진행 중인 호출이 더 많이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html">Understanding Lambda Event Function scaling - AWS Lambda</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: 사진 처리 함수가 초당 400건을 받고 평균 0.5초 동안 실행된다. 외부 API가 느려져 평균 시간이 2초로 늘었고 요청률은 같다. 평균
              동시 실행과 제한 검토를 어떻게 바꿔야 하는가? 순간 폭증은 이 계산 뒤 별도 검증한다.
            answer: 평균 동시 실행이 약 200에서 800으로 늘어 한도와 다운스트림을 재검토한다
            wrong:
              - 실행 시간이 늘면 호출이 줄어 평균 동시 실행은 50으로 내려간다
              - Provisioned concurrency를 끄면 실행 시간과 무관하게 동시 실행이 제한된다
              - 요청률이 같으므로 평균 동시 실행도 200으로 그대로 유지된다
      - id: Q27-42
        type: mcq
        title: Q27-42 · 모의고사 C
        explain: |
          <p>Kubernetes 호환과 GPU·호스트 제어가 모두 필요하므로 EKS의 지원 EC2 노드를 검토한다. 관리형 제어 영역을 쓰더라도 노드·드라이버와 앱 운영 책임은 따로 남는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EKS Fargate로 옮겨 모든 GPU·DaemonSet 요구를 그대로 유지한다</td>
          <td>EKS Fargate는 GPU와 노드 수준 요구를 그대로 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>ECS와 GPU EC2로 옮기면서 기존 Kubernetes 배포 정의를 모두 재작성한다</td>
          <td>GPU 실행 후보는 될 수 있지만 Kubernetes 도구·배포 정의 유지 조건을 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>EKS의 CPU 전용 노드로 이전하고 GPU 드라이버만 설치한다</td>
          <td>GPU 하드웨어가 없는 노드에 드라이버만 설치해 장치 요구를 충족할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eks/latest/userguide/fargate.html">Simplify compute management with AWS Fargate - Amazon EKS</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: GPU가 필요한 장기 모델 추론 컨테이너를 운영한다. 팀은 기존 Kubernetes 배포 도구를 유지하고, GPU 노드 유형과 드라이버도
              제어해야 한다. 호스트 운영을 완전히 제거하는 것보다 필요한 장치 지원이 우선이다. 적합한 구성은?
            answer: EKS와 지원되는 GPU EC2 노드로 실행 환경을 구성한다
            wrong:
              - EKS Fargate로 옮겨 모든 GPU·DaemonSet 요구를 그대로 유지한다
              - ECS와 GPU EC2로 옮기면서 기존 Kubernetes 배포 정의를 모두 재작성한다
              - EKS의 CPU 전용 노드로 이전하고 GPU 드라이버만 설치한다
      - id: Q27-43
        type: mcq
        title: Q27-43 · 모의고사 C
        explain: |
          <p>같은 AZ에서 긴밀한 노드 통신의 지연이 핵심이면 Cluster 배치가 우선 후보이다. 장애 분산이 우선인 Spread·Partition과 목적이 다르며 앱의 재실행 조건도 고려한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Partition placement group으로 장애 영역만 나누고 지연 검증은 생략한다</td>
          <td>파티션 분리는 장애 영역 목적이며 짧은 노드 간 통신의 가까운 배치를 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>Spread placement group만으로 노드 간 최소 지연을 보장한다</td>
          <td>Spread는 기반 하드웨어 분산이 목적이며 가까운 배치를 보장하는 전략이 아니다.</td>
          </tr>
          <tr>
          <td>여러 리전으로 노드를 분산해 모든 통신 지연을 줄인다</td>
          <td>리전 간 분산은 일반적으로 짧은 노드 간 통신 지연 요구에 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html">Placement strategies for your placement groups - Amazon Elastic Compute Cloud</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: 같은 AZ의 대규모 병렬 계산 노드가 짧은 메시지를 매우 자주 교환한다. 현재 병목은 노드 간 네트워크 지연이며, 이 작업은 AZ 전체
              손실 시 체크포인트에서 재실행할 수 있다. 하드웨어 배치 측면에서 우선 검토할 전략은?
            answer: Cluster placement group으로 가까운 노드 배치를 검토한다
            wrong:
              - Partition placement group으로 장애 영역만 나누고 지연 검증은 생략한다
              - Spread placement group만으로 노드 간 최소 지연을 보장한다
              - 여러 리전으로 노드를 분산해 모든 통신 지연을 줄인다
      - id: Q27-44
        type: mcq
        title: Q27-44 · 모의고사 C
        explain: |
          <p>LSI는 기본 파티션 키를 유지하면서 다른 정렬과 강력한 읽기를 제공하며 생성 시 정의한다. 다른 파티션 키의 조회는 GSI를 사용하고 상태 값의 편중과 전파 지연을 고려한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>테이블 생성 후 필요할 때 금액 LSI를 추가한다</td>
          <td>LSI는 기존 테이블에 나중에 추가하는 방식이 아니다.</td>
          </tr>
          <tr>
          <td>금액 LSI의 파티션 키도 배송 상태로 바꿔 별도 조회에 사용한다</td>
          <td>LSI의 파티션 키는 기본 테이블과 같아야 한다.</td>
          </tr>
          <tr>
          <td>배송 상태 GSI에 강력한 일관성 읽기를 켜서 최신값을 보장한다</td>
          <td>GSI는 강력한 일관성 읽기를 지원하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SecondaryIndexes.html">Improving data access with secondary indexes in DynamoDB - Amazon DynamoDB</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: DynamoDB 주문 테이블은 고객 ID와 주문 시각을 키로 쓴다. 운영자는 배송 상태별 목록도 필요하며, 고객별 금액 순 조회도 자주
              한다. 고객별 금액 조회는 강력한 일관성이 필요하고 테이블은 아직 만들지 않았다. 올바른 인덱스 설계 두 가지는?
            answer: 고객 키를 유지한 금액 정렬 LSI를 테이블 생성 시 정의한다
            wrong:
              - 테이블 생성 후 필요할 때 금액 LSI를 추가한다
              - 금액 LSI의 파티션 키도 배송 상태로 바꿔 별도 조회에 사용한다
              - 배송 상태 GSI에 강력한 일관성 읽기를 켜서 최신값을 보장한다
            answers:
              - 고객 키를 유지한 금액 정렬 LSI를 테이블 생성 시 정의한다
              - 배송 상태를 다른 파티션 키로 사용하는 GSI를 설계하고 편중을 검토한다
            options:
              - 테이블 생성 후 필요할 때 금액 LSI를 추가한다
              - 금액 LSI의 파티션 키도 배송 상태로 바꿔 별도 조회에 사용한다
              - 고객 키를 유지한 금액 정렬 LSI를 테이블 생성 시 정의한다
              - 배송 상태를 다른 파티션 키로 사용하는 GSI를 설계하고 편중을 검토한다
              - 배송 상태 GSI에 강력한 일관성 읽기를 켜서 최신값을 보장한다
      - id: Q27-45
        type: mcq
        title: Q27-45 · 모의고사 C
        explain: |
          <p>Aurora reader endpoint는 새 연결을 분산하며 한 연결의 모든 SQL을 reader 사이에 나누지 않는다. 앱의 읽기 풀과 연결 재사용 방식을 살펴 연결을 여러 대상으로 분산해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Writer endpoint로 바꾸면 모든 읽기가 reader 네 대에 자동 분산된다</td>
          <td>Writer endpoint는 현재 writer에 연결하며 reader 분산 경로가 아니다.</td>
          </tr>
          <tr>
          <td>Aurora reader 수를 늘리면 기존 한 연결의 대상도 매 쿼리마다 자동 변경된다</td>
          <td>reader 추가만으로 기존 연결이 문장마다 다른 대상으로 옮겨지지 않는다.</td>
          </tr>
          <tr>
          <td>Reader endpoint가 SQL별로 분산하므로 현재의 한 연결도 이미 네 대를 순회한다</td>
          <td>한 연결의 쿼리를 문장별로 분산하는 라우터가 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Reader.html">Reader endpoints for Amazon Aurora - Amazon Aurora</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: Aurora reader가 네 대인데 통계 앱의 대부분 조회가 한 대에 집중된다. 앱은 reader endpoint로 연결 하나를 만든 뒤
              수시간 재사용한다. DB 자체에 쓰기 부하는 없고 읽기를 여러 reader로 나누려 한다. 가장 타당한 설명과 개선은?
            answer: 연결 단위 분산이므로 여러 연결의 풀과 수명을 검토해 읽기 연결을 분산한다
            wrong:
              - Writer endpoint로 바꾸면 모든 읽기가 reader 네 대에 자동 분산된다
              - Aurora reader 수를 늘리면 기존 한 연결의 대상도 매 쿼리마다 자동 변경된다
              - Reader endpoint가 SQL별로 분산하므로 현재의 한 연결도 이미 네 대를 순회한다
      - id: Q27-46
        type: mcq
        title: Q27-46 · 모의고사 C
        explain: |
          <p>캐시의 오래된 값과 동시 채움은 별도 정확성·부하 문제다. 결제의 원본 검증을 유지하면서 갱신·무효화와 요청 집중 제어를 설계해야 성능과 업무 정확성을 함께 지킨다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>가격 캐시 TTL을 길게 늘리고 결제도 캐시 값만 그대로 사용한다</td>
          <td>오래된 가격을 더 오래 유지해 결제 정확성 요구에 어긋난다.</td>
          </tr>
          <tr>
          <td>캐시가 한 번 채워지면 DB가 모든 변경을 자동 반영한다고 가정한다</td>
          <td>일반 cache-aside는 DB 변경을 자동 구독해 갱신하는 방식이 아니다.</td>
          </tr>
          <tr>
          <td>모든 요청에서 캐시 미스가 나면 각 작업자가 동시에 DB를 읽도록 유지한다</td>
          <td>결제 원본 검증 외에도 동시 캐시 채움의 요청 집중을 제어해야 하는 조건을 놓친다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html">Caching strategies for Memcached - Amazon ElastiCache</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: 상품 DB 조회 앞에 cache-aside를 추가하려 한다. 가격 변경 직후에도 캐시에 예전 가격이 남을 수 있고 동시에 많은 요청이 인기
              상품 캐시를 채우려 한다. 결제 금액 정확성은 반드시 유지해야 한다. 적합한 설계는?
            answer: 결제는 원본에서 검증하고 무효화·갱신 및 동시 캐시 채움 제어를 설계한다
            wrong:
              - 가격 캐시 TTL을 길게 늘리고 결제도 캐시 값만 그대로 사용한다
              - 캐시가 한 번 채워지면 DB가 모든 변경을 자동 반영한다고 가정한다
              - 모든 요청에서 캐시 미스가 나면 각 작업자가 동시에 DB를 읽도록 유지한다
      - id: Q27-47
        type: mcq
        title: Q27-47 · 모의고사 C
        explain: |
          <p>S3의 Interface Endpoint는 온프레미스 사설 연결 접근 후보이다. VPN만으로 충분하지 않으므로 DNS, 엔드포인트 SG, 왕복 경로와 S3 권한까지 함께 구성한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>VPN을 유지하고 S3 퍼블릭 이름으로 기존 인터넷 경로를 계속 사용한다</td>
          <td>VPN 존재만으로 S3 서비스 접근이 사설 엔드포인트 경로로 바뀌지 않는다.</td>
          </tr>
          <tr>
          <td>기존 Gateway Endpoint 라우트를 온프레미스에 전파하면 공유 가능하다고 본다</td>
          <td>Gateway Endpoint는 온프레미스에서 경유해 공유하는 연결 방식이 아니다.</td>
          </tr>
          <tr>
          <td>퍼블릭 NAT를 만들고 VPN의 모든 S3 경로를 인터넷으로 보낸다</td>
          <td>NAT 인터넷 경유는 명시된 사설 접근 조건을 어긴다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html">AWS PrivateLink for Amazon S3 - Amazon Simple Storage Service</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 온프레미스에서 S3로 사설 경로를 통해 대용량 파일을 올려야 한다. 이미 VPN 연결이 있고 인터넷 NAT 경유는 허용하지 않는다.
              VPC의 S3 Gateway Endpoint를 온프레미스가 그대로 공유할 수 없다는 제약을 확인했다. 적합한 구성은?
            answer: S3 Interface Endpoint와 하이브리드 DNS·라우팅·권한을 구성한다
            wrong:
              - VPN을 유지하고 S3 퍼블릭 이름으로 기존 인터넷 경로를 계속 사용한다
              - 기존 Gateway Endpoint 라우트를 온프레미스에 전파하면 공유 가능하다고 본다
              - 퍼블릭 NAT를 만들고 VPN의 모든 S3 경로를 인터넷으로 보낸다
      - id: Q27-48
        type: mcq
        title: Q27-48 · 모의고사 C
        explain: |
          <p>Global Accelerator는 정적 Anycast IP와 AWS 네트워크 경로로 TCP·UDP 대상에 트래픽을 보낼 수 있다. 객체 CDN 캐시와 다른 요구이며 지원 endpoint·상태 판단을 구성한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>리전별 NLB 고정 IP를 각각 공개하고 클라이언트가 모든 주소를 직접 고르게 한다</td>
          <td>리전별 고정 주소는 가능하지만 하나의 글로벌 Anycast 진입과 관리형 정상 리전 분산 요구에 못 미친다.</td>
          </tr>
          <tr>
          <td>CloudFront만 배치해 지원 HTTP 배포의 동일 캐시 설정으로 UDP도 처리한다</td>
          <td>CloudFront 배포는 임의 UDP 앱의 고정 진입점 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>Route 53 latency 정책으로 리전을 고르고 고정 IP 진입점은 별도로 두지 않는다</td>
          <td>DNS의 지연 기반 선택은 가능하지만 고정 Anycast IP 진입점 요구가 충족되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html">What is AWS Global Accelerator? - AWS Global Accelerator</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 전 세계 게임 클라이언트가 UDP 세션을 사용한다. 방화벽 허용 목록에 등록할 고정 진입 IP와 하나의 글로벌 Anycast 진입점에서
              정상 리전으로의 트래픽 분산이 필요하고, 객체 콘텐츠를 캐시할 요구는 없다. 가장 적합한 서비스는?
            answer: 표준 Global Accelerator와 지원 endpoint 구성을 검토한다
            wrong:
              - 리전별 NLB 고정 IP를 각각 공개하고 클라이언트가 모든 주소를 직접 고르게 한다
              - CloudFront만 배치해 지원 HTTP 배포의 동일 캐시 설정으로 UDP도 처리한다
              - Route 53 latency 정책으로 리전을 고르고 고정 IP 진입점은 별도로 두지 않는다
      - id: Q27-49
        type: mcq
        title: Q27-49 · 모의고사 C
        explain: |
          <p>동적 라우팅의 TGW VPN ECMP는 여러 흐름을 터널에 분산해 총 처리량을 늘리는 방법이다. 단일 흐름 한도와 장비·패킷 조건은 남으므로 실제 트래픽으로 검증해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 터널이 있다는 사실만으로 모든 단일 TCP 흐름 속도가 두 배라고 본다</td>
          <td>터널 이중화와 단일 연결의 대역폭 합산은 같은 의미가 아니다.</td>
          </tr>
          <tr>
          <td>여러 터널을 만들되 TGW ECMP를 비활성화하고 동일 목적지 경로만 둔다</td>
          <td>ECMP가 꺼져 있으면 동등 경로를 여러 터널로 분산하는 구성이 아니므로 집계를 기대할 수 없다.</td>
          </tr>
          <tr>
          <td>정적 VPN 라우트를 복제하면 TGW가 자동으로 ECMP를 적용한다고 본다</td>
          <td>정적 라우팅 VPN에는 해당 ECMP 기능이 적용되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-quotas.html">AWS Transit Gateway Quotas - Amazon VPC</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 공장과 AWS 사이의 파일 복제가 VPN 한 경로의 처리량에 막혔다. 여러 동시 흐름을 사용할 수 있고 TGW와 동적 라우팅을 운영한다.
              회선을 바꾸기 전 병렬 VPN으로 총 처리량을 늘리되 단일 흐름의 개선과는 구분해야 한다. 적합한 조치는?
            answer: 지원되는 여러 터널에 ECMP를 구성하고 실제 다중 흐름 처리량을 검증한다
            wrong:
              - 두 터널이 있다는 사실만으로 모든 단일 TCP 흐름 속도가 두 배라고 본다
              - 여러 터널을 만들되 TGW ECMP를 비활성화하고 동일 목적지 경로만 둔다
              - 정적 VPN 라우트를 복제하면 TGW가 자동으로 ECMP를 적용한다고 본다
      - id: Q27-50
        type: mcq
        title: Q27-50 · 모의고사 C
        explain: |
          <p>독립 소비 위치와 보존 기간 내 반복 읽기는 스트림의 요구이다. Data Streams의 키·보존·소비자 처리량을 설계하면 일시 중단 후 재생을 지원할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SNS와 소비자별 SQS만 두고 이미 삭제한 메시지의 재생 저장소는 생략한다</td>
          <td>독립 배포는 가능하지만 보존 중 임의 위치부터 반복 읽는 스트림 모델 요구에는 맞지 않는다.</td>
          </tr>
          <tr>
          <td>두 소비자가 작업을 분담하는 SQS 단일 큐</td>
          <td>하나의 작업 큐는 소비자별로 같은 전체 이벤트를 독립 재생하는 모델이 아니다.</td>
          </tr>
          <tr>
          <td>두 소비자의 읽기 위치 없이 목적지에만 전달하는 Data Firehose</td>
          <td>관리형 목적지 전달은 독립 소비자들의 범용 스트림 읽기 위치 저장과 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/streams/latest/dev/introduction.html">What is Amazon Kinesis Data Streams? - Amazon Kinesis Data Streams</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: 클릭 이벤트를 실시간 이상 탐지와 일일 통계 소비자가 각자 읽어야 한다. 소비자가 이미 처리한 과거 이벤트도 보존 범위에서 원하는 위치부터
              다시 읽고, 두 소비자의 읽기 위치는 서로 독립이어야 한다. 적합한 기본 수집 계층은?
            answer: 보존 기간과 키를 설계한 Kinesis Data Streams
            wrong:
              - SNS와 소비자별 SQS만 두고 이미 삭제한 메시지의 재생 저장소는 생략한다
              - 두 소비자가 작업을 분담하는 SQS 단일 큐
              - 두 소비자의 읽기 위치 없이 목적지에만 전달하는 Data Firehose
      - id: Q27-51
        type: mcq
        title: Q27-51 · 모의고사 C
        explain: |
          <p>주된 병목은 데이터 파일이 아니라 대규모 Glue 파티션 메타데이터 조회다. 날짜가 선두인 Glue 인덱스는 날짜 범위 조건으로 등록된 파티션 중 관련 집합을 좁힌다. 인덱스가 ACTIVE가 된 뒤 테이블 속성 partition_filtering.enabled=true로 Athena 사용을 켠다. 희소 조합을 전체 생성하는 projection과 달리 실제 등록된 파티션을 이용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Glue에 tenant_id를 선두로 한 파티션 인덱스를 만들고 Athena partition filtering을 활성화한다</td>
          <td>Glue 파티션 인덱스로 필터링하려면 인덱스의 첫 키 조건이 필요하다. 조회에 tenant_id 조건이 없으므로 이 순서의 인덱스는 날짜 조건을 이용한 인덱스 필터링에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>날짜 범위와 전체 tenant_id 범위를 projection으로 정의하고 Glue 파티션 조회를 대체한다</td>
          <td>Projection은 Glue 조회를 줄이지만 모든 tenant 범위를 생성하면 날짜 범위 안에서도 존재하지 않는 조합을 다수 탐색한다. AWS는 projected 파티션 절반 이상이 비면 전통적인 등록 파티션 사용을 권고한다.</td>
          </tr>
          <tr>
          <td>날짜별 Parquet 객체를 더 큰 압축 객체로 합치고 현재 Glue 파티션 조회 방식을 유지한다</td>
          <td>파일 통합과 압축은 S3 데이터 읽기 비용·시간에 영향을 준다. 이미 파일 읽기가 2초인 이 사례의 40초 메타데이터 조회를 바꾸지 않으며, 파일을 유지하라는 조건과도 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/glue-best-practices-partition-index.html">Athena Glue partition indexing and filtering</a> · <a href="https://docs.aws.amazon.com/glue/latest/dg/partition-indexes.html">Glue partition indexes and leading keys</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html">Athena partition projection limitations</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: Athena의 주문 데이터는 이미 적절한 크기의 Parquet이며 날짜·tenant_id로 파티션되어 있다. 실제 존재하는 100만
              파티션이 Glue에 등록되어 있고 인덱스·projection은 없다. 조회는 tenant_id를 지정하지 않고 날짜
              범위만 AND 조건으로 제한한다. 파일 읽기는 2초지만 파티션 메타데이터 조회는 40초다. 날짜×tenant 전체
              조합의 95%는 S3에 없으며 두 키는 STRING이다. 파일과 파티션 키를 유지하며 주된 지연을 줄일 구성은?
            answer: Glue에 날짜를 선두로 한 파티션 인덱스를 만들고 Athena partition filtering을 활성화한다
            wrong:
              - Glue에 tenant_id를 선두로 한 파티션 인덱스를 만들고 Athena partition filtering을
                활성화한다
              - 날짜 범위와 전체 tenant_id 범위를 projection으로 정의하고 Glue 파티션 조회를 대체한다
              - 날짜별 Parquet 객체를 더 큰 압축 객체로 합치고 현재 Glue 파티션 조회 방식을 유지한다
      - id: Q27-52
        type: mcq
        title: Q27-52 · 모의고사 C
        explain: |
          <p>분석 도구의 열 권한만 제한해도 원본을 직접 읽거나 결과 파일을 넓게 공유하면 의도를 우회할 수 있다. IAM·S3·KMS·결과 저장소까지 전체 데이터 경로를 함께 검토해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>BI 화면에서만 전화번호 열을 숨기고 원본 S3 읽기는 넓게 허용한다</td>
          <td>화면 숨김은 원본 직접 접근을 막지 않으므로 민감 열 우회 경로가 남는다.</td>
          </tr>
          <tr>
          <td>Lake Formation을 켜면 모든 기존 S3 직접 읽기 권한은 자동 제거된다</td>
          <td>Lake Formation 설정이 이미 존재하는 모든 별도 직접 접근 권한을 자동 제거하는 것은 아니다.</td>
          </tr>
          <tr>
          <td>Athena 쿼리 실행만 허용하면 결과 버킷의 접근은 별도 통제할 필요가 없다</td>
          <td>결과 파일에는 조회 데이터가 남을 수 있어 결과 저장소도 보호해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html">What is AWS Lake Formation? - AWS Lake Formation</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/lf-athena-user-permissions.html">Manage Lake Formation and Athena user permissions</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: 분석가는 Athena에서 주문 금액과 지역을 보되 전화번호는 조회하면 안 된다. 정제 S3에는 민감 열이 포함되고 결과 파일도 남는다.
              Lake Formation의 테이블·열 통제를 도입할 때 추가로 지켜야 할 원칙은?
            answer: 직접 S3·결과 버킷·KMS 경로도 확인해 열 제한을 우회하는 권한을 막는다
            wrong:
              - BI 화면에서만 전화번호 열을 숨기고 원본 S3 읽기는 넓게 허용한다
              - Lake Formation을 켜면 모든 기존 S3 직접 읽기 권한은 자동 제거된다
              - Athena 쿼리 실행만 허용하면 결과 버킷의 접근은 별도 통제할 필요가 없다
      - id: Q27-53
        type: mcq
        title: Q27-53 · 모의고사 C
        explain: |
          <p>초기 빈번한 조사와 후기 긴 복원 대기를 나누면 기간별 저장 클래스를 최적화할 수 있다. 법적 보존 중 삭제 방지는 수명 주기와 별도로 설계하고 복원 비용도 합산해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>처음 Standard-IA로 전환하고 90일 뒤 모든 로그를 만료시킨다</td>
          <td>7년보다 이른 삭제는 명시된 보존 의무를 위반한다.</td>
          </tr>
          <tr>
          <td>7년간 Standard에 두고 Versioning만으로 관리자 삭제도 막았다고 본다</td>
          <td>장기 Standard 비용이 남고 버전 관리만으로 권한자의 영구 삭제를 막지 못한다.</td>
          </tr>
          <tr>
          <td>처음부터 Deep Archive에 넣고 처음 3개월의 조사 때마다 복원한다</td>
          <td>초기 빈번한 조사에 복원 대기와 비용이 반복되어 시기별 접근 패턴에 맞춘 비용 최적화에 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: 감사 로그는 7년 보관해야 한다. 첫 3개월에는 즉시 자주 조회해야 하고 이후에는 연 몇 번만 읽으며 복원에 최대 48시간을 기다릴 수
              있다. 법적 보존 기간 내 삭제를 막으면서 장기 저장 비용을 줄이려 한다. 적합한 정책은?
            answer: 초기 Standard에서 이후 Deep Archive로 전환하고 법적 보존을 별도 보호한다
            wrong:
              - 처음 Standard-IA로 전환하고 90일 뒤 모든 로그를 만료시킨다
              - 7년간 Standard에 두고 Versioning만으로 관리자 삭제도 막았다고 본다
              - 처음부터 Deep Archive에 넣고 처음 3개월의 조사 때마다 복원한다
      - id: Q27-54
        type: mcq
        title: Q27-54 · 모의고사 C
        explain: |
          <p>수집 단계에서 묶으면 작은 객체별 PUT과 이후 전환 요청 수가 줄어든다. 드문 장기 조회는 다중 AZ·밀리초 접근을 제공하는 Standard-IA로 전환하며, 집계 객체는 IA의 객체당 최소 과금 크기 부담도 줄인다. 조회 요청·검색 요금까지 포함한 비용은 실제 사용량으로 산정한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 5KiB 객체를 각각 gzip으로 압축해 같은 개수의 객체로 저장한다</td>
          <td>압축해도 객체 개수와 PUT·전환 요청 수가 유지된다. 개별 5KiB는 IA의 최소 과금 크기보다 작아 집계 대안의 비용 효과를 얻지 못한다.</td>
          </tr>
          <tr>
          <td>묶은 객체를 30일 뒤 S3 One Zone-IA로 전환하는 Lifecycle을 설정한다</td>
          <td>즉시 조회와 낮은 저장 단가는 제공하지만 한 AZ에 저장되어 AZ 손실 내성 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>묶은 객체를 30일 뒤 S3 Glacier Flexible Retrieval로 전환하는 Lifecycle을 설정한다</td>
          <td>장기 저장 단가는 낮지만 Flexible Retrieval은 일반 조회 전에 복원이 필요하므로 복원 대기 불가 조건과 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">S3 storage classes</a> · <a href="https://aws.amazon.com/s3/pricing/">S3 pricing and minimum sizes</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: S3에 5KiB 로그가 매일 수백만 개 생긴다. 처음 30일은 자주 조회하고 그 뒤 1년까지 드물게 조회하되 복원 대기 없이 읽어야 한다.
              AZ 하나의 손실에도 보관 데이터가 남아야 하며, 일별 묶음 조회와 최대 1시간 수집 지연은 허용된다. 객체별
              PUT·Lifecycle 전환 수와 장기 저장 비용을 함께 줄일 조치 두 가지는?
            answer: 수집 시 시간대별 로그를 약 128MiB 압축 객체로 묶어 S3에 기록한다
            wrong:
              - 기존 5KiB 객체를 각각 gzip으로 압축해 같은 개수의 객체로 저장한다
              - 묶은 객체를 30일 뒤 S3 One Zone-IA로 전환하는 Lifecycle을 설정한다
              - 묶은 객체를 30일 뒤 S3 Glacier Flexible Retrieval로 전환하는 Lifecycle을 설정한다
            answers:
              - 수집 시 시간대별 로그를 약 128MiB 압축 객체로 묶어 S3에 기록한다
              - 묶은 객체를 30일 뒤 S3 Standard-IA로 전환하는 Lifecycle을 설정한다
            options:
              - 기존 5KiB 객체를 각각 gzip으로 압축해 같은 개수의 객체로 저장한다
              - 묶은 객체를 30일 뒤 S3 One Zone-IA로 전환하는 Lifecycle을 설정한다
              - 묶은 객체를 30일 뒤 S3 Glacier Flexible Retrieval로 전환하는 Lifecycle을 설정한다
              - 수집 시 시간대별 로그를 약 128MiB 압축 객체로 묶어 S3에 기록한다
              - 묶은 객체를 30일 뒤 S3 Standard-IA로 전환하는 Lifecycle을 설정한다
      - id: Q27-55
        type: mcq
        title: Q27-55 · 모의고사 C
        explain: |
          <p>EC2 컴퓨팅 중지와 EBS 저장 비용은 별개이며 EBS는 프로비저닝한 용량 등을 기준으로 과금한다. 데이터 보존과 복원 시간을 고려해 실제 필요한 용량·백업 정책을 따로 최적화해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2가 stopped가 되면 EBS는 실제 40GB만 자동 과금된다</td>
          <td>EBS 용량이 중지에 따라 실제 파일 크기로 자동 축소되지는 않는다.</td>
          </tr>
          <tr>
          <td>데이터를 보존할 별도 복원본 없이 중지 시 EBS를 삭제한다</td>
          <td>복원 경로 없이 볼륨을 삭제하면 데이터 보존 요구를 위반한다.</td>
          </tr>
          <tr>
          <td>200GB를 그대로 유지하고 파일을 압축하면 EBS 청구 용량도 자동 감소한다고 본다</td>
          <td>파일 사용량을 줄여도 프로비저닝한 볼륨 용량이 자동 축소되지는 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html">Amazon EBS volume types - Amazon EBS</a> · <a href="https://aws.amazon.com/ebs/pricing/">Amazon EBS pricing</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: 개발 서버는 200GB gp3 볼륨을 사용하고 현재 40GB만 차 있다. 팀은 EC2를 밤마다 중지하면 볼륨 사용량도 자동 축소되어 비용이
              사라진다고 예상한다. 데이터는 보존해야 하며 운영 시간은 줄일 수 있다. 올바른 비용 판단은?
            answer: 중지해도 프로비저닝한 EBS 비용은 남으므로 용량·스냅샷 정책을 별도 검토한다
            wrong:
              - EC2가 stopped가 되면 EBS는 실제 40GB만 자동 과금된다
              - 데이터를 보존할 별도 복원본 없이 중지 시 EBS를 삭제한다
              - 200GB를 그대로 유지하고 파일을 압축하면 EBS 청구 용량도 자동 감소한다고 본다
      - id: Q27-56
        type: mcq
        title: Q27-56 · 모의고사 C
        explain: |
          <p>중단 후 재실행 가능하고 기한이 유연하므로 Spot 할인과 재시도 설계가 맞는다. 장기 기본 사용량이 없어 큰 약정의 미사용 위험이 높고 용량 확보 상품은 할인과 다르다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>온디맨드 용량 예약으로 필요한 실행 용량을 확보하고 할인과 동일하게 취급한다</td>
          <td>실행 보장은 별도 목적이며 용량 예약 자체는 할인 상품이 아니다.</td>
          </tr>
          <tr>
          <td>전량을 3년 RI로 약정해 불확실한 기본 사용량을 고정한다</td>
          <td>불확실한 사용량을 전량 장기 약정하면 미사용 약정 비용이 생길 수 있다.</td>
          </tr>
          <tr>
          <td>소켓 라이선스 요구가 없어도 Dedicated Hosts를 기본 배치 실행으로 고정한다</td>
          <td>전용 호스트 제어·라이선스 요구가 없고 가변 배치의 유휴 비용 절감에 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html">Spot Instances - Amazon Elastic Compute Cloud</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 새 이미지 변환 서비스는 매일 일감 규모가 다르고 작업은 중단 후 재실행할 수 있다. 결과는 건별 S3에 저장하며 마감은 다음 날까지로
              유연하다. 장기 기본 사용량은 아직 없고 최소 비용이 목표다. 적합한 EC2 구매 방식은?
            answer: 여러 용량 풀의 Spot과 중단·재시도 처리를 검토한다
            wrong:
              - 온디맨드 용량 예약으로 필요한 실행 용량을 확보하고 할인과 동일하게 취급한다
              - 전량을 3년 RI로 약정해 불확실한 기본 사용량을 고정한다
              - 소켓 라이선스 요구가 없어도 Dedicated Hosts를 기본 배치 실행으로 고정한다
      - id: Q27-57
        type: mcq
        title: Q27-57 · 모의고사 C
        explain: |
          <p>Compute Savings Plans는 EC2 구성 변경과 지원 Fargate·Lambda 사용량에 유연하게 적용된다. 기본 소비 가능한 범위만 약정하고 초과분·대상 사용량을 검토해야 미사용 비용을 줄인다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>특정 리전·패밀리의 EC2 Instance Savings Plans에 전부 약정한다</td>
          <td>해당 상품은 선택 리전·EC2 패밀리 밖의 이전 사용량에 유연하게 적용되지 않는다.</td>
          </tr>
          <tr>
          <td>EC2 리전 RI에만 약정하고 Fargate·Lambda 사용량은 할인 적용에서 제외한다</td>
          <td>EC2 밖으로 옮길 기본 사용량에 적용되지 않아 명시된 이전 유연성을 놓친다.</td>
          </tr>
          <tr>
          <td>선택 AZ의 용량 예약만 확보하고 적용 할인 약정은 따로 구매하지 않는다</td>
          <td>용량 예약은 실행 용량 목적이며 요구한 여러 실행 방식의 기본 사용 할인 대안과 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html">Savings Plans types - Savings Plans</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 항상 실행하던 EC2 앱을 향후 1년간 일부 Fargate와 Lambda로 옮길 계획이다. 리전과 EC2 패밀리도 바뀔 수 있지만
              보수적으로 산정한 시간당 기본 사용 금액은 계속 발생한다. 할인 약정으로 우선 검토할 상품은?
            answer: Compute Savings Plans의 적용 사용량과 기본 약정을 검토한다
            wrong:
              - 특정 리전·패밀리의 EC2 Instance Savings Plans에 전부 약정한다
              - EC2 리전 RI에만 약정하고 Fargate·Lambda 사용량은 할인 적용에서 제외한다
              - 선택 AZ의 용량 예약만 확보하고 적용 할인 약정은 따로 구매하지 않는다
      - id: Q27-58
        type: mcq
        title: Q27-58 · 모의고사 C
        explain: |
          <p>G는 GPU 지원과 중단 불가 요구 때문에 기존 GPU EC2가 맞다. GPU가 필요 없는 C는 검증된 동일 성능에서 유휴 풀 비용이 없는 Fargate 추산 60달러가 EC2 풀 250달러보다 낮다. 이 수치는 문제에서 제시한 추산이며 보편적인 가격 우열은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>G와 C를 Spot GPU EC2 풀에 배치하고 용량 중단 시 작업을 재실행한다</td>
          <td>GPU 실행은 가능하지만 Spot은 중단될 수 있으므로 G의 중단 불가 조건에 맞지 않는다. C의 재실행 가능성과 별개이다.</td>
          </tr>
          <tr>
          <td>G와 C를 모두 ECS Fargate로 옮기고 작업별 CPU·메모리를 지정한다</td>
          <td>ECS Fargate는 GPU resourceRequirements를 지원하지 않아 G의 GPU 추론을 같은 구성으로 실행하지 못한다.</td>
          </tr>
          <tr>
          <td>G는 GPU EC2에서 유지하고 C는 별도 EC2 상시 풀에서 실행한다</td>
          <td>두 서비스의 기능은 충족하지만 C 비용이 250달러로 Fargate 60달러보다 높으므로 제시한 최소 비용 목표에 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-gpu.html">ECS GPU workloads</a> · <a href="https://aws.amazon.com/fargate/pricing/">AWS Fargate pricing</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: ECS의 두 서비스를 재배치한다. G는 중단할 수 없는 GPU 추론으로 기존 GPU EC2를 24시간 거의 가득 쓴다. C는 GPU 없는
              Linux 작업으로 건별 2vCPU·4GiB가 필요하며 월 실행 시간 합계는 300시간이고 작업이 없으면 실행 자원은
              필요 없다. C의 성능은 Fargate와 EC2에서 같다고 검증했다. 팀 추산 월 총비용은 C용 EC2 상시 풀
              250달러, C용 Fargate 60달러이며 운영비도 포함했다. 가장 저렴하게 요구를 충족하는 배치는?
            answer: G는 GPU EC2에서 유지하고 C는 ECS Fargate에서 필요할 때 실행한다
            wrong:
              - G와 C를 Spot GPU EC2 풀에 배치하고 용량 중단 시 작업을 재실행한다
              - G와 C를 모두 ECS Fargate로 옮기고 작업별 CPU·메모리를 지정한다
              - G는 GPU EC2에서 유지하고 C는 별도 EC2 상시 풀에서 실행한다
      - id: Q27-59
        type: mcq
        title: Q27-59 · 모의고사 C
        explain: |
          <p>T의 지속 고부하는 크레딧 소비·추가 비용과 연결된다. 일반 계열의 성능과 가격을 실제 부하로 비교해야 요금 절감이 처리량 저하로 바뀌지 않는지 판단할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Unlimited를 Standard로 바꾸면 동일한 지속 성능이 무료로 보장된다고 본다</td>
          <td>Standard는 크레딧 소진 시 기준 성능으로 제한될 수 있어 동일 처리량을 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>메모리 사용률만 확인한 뒤 CPU 크레딧 비용은 비용 보고에서 제외한다</td>
          <td>현재 원인이 CPU 크레딧이므로 이를 제외하면 비용·성능 판단을 놓친다.</td>
          </tr>
          <tr>
          <td>더 작은 T 계열로 바꾸면 추가 크레딧을 무시해도 항상 저렴하다고 본다</td>
          <td>작아진 인스턴스의 기준 성능과 추가 비용이 더 불리할 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/burstable-credits-baseline-concepts.html">Key concepts for burstable performance instances - Amazon Elastic Compute Cloud</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 개발 API의 T 계열 인스턴스 비용이 예상보다 크다. CPU는 하루 종일 높고 Unlimited 추가 크레딧 비용이 발생한다. 서비스는
              계속 실행해야 하지만 처리량 목표를 만족하면서 총비용을 낮춰야 한다. 우선 취할 조치는?
            answer: 지속 부하에 맞는 비버스트 계열과 현재 크기·성능·전체 요금을 측정 비교한다
            wrong:
              - Unlimited를 Standard로 바꾸면 동일한 지속 성능이 무료로 보장된다고 본다
              - 메모리 사용률만 확인한 뒤 CPU 크레딧 비용은 비용 보고에서 제외한다
              - 더 작은 T 계열로 바꾸면 추가 크레딧을 무시해도 항상 저렴하다고 본다
      - id: Q27-60
        type: mcq
        title: Q27-60 · 모의고사 C
        explain: >
          <p>드문 분석이 최신 온라인 복제본을 요구하지 않으므로 S3·Athena 기반 일괄 분석의 비용을 비교할 수 있다. 데이터
          적재·형식·스캔과 기존 복제본 유지 비용을 함께 봐야 한다.</p>

          <table>

          <thead>

          <tr>

          <th>오답</th>

          <th>틀린 이유</th>

          </tr>

          </thead>

          <tbody><tr>

          <td>읽기 복제본을 늘려 미사용 시간의 단가를 자동으로 낮춘다</td>

          <td>복제본 증설은 미사용 인스턴스 비용을 줄이는 수단이 아니다.</td>

          </tr>

          <tr>

          <td>상시 읽기 복제본을 계속 유지하고 통계 없는 시간에도 최대 크기를 고정한다</td>

          <td>최신 데이터가 필요 없는 짧은 일괄 분석에 미사용 시간의 컴퓨팅 비용을 계속 부담한다.</td>

          </tr>

          <tr>

          <td>통계를 기본 운영 DB로 모두 되돌리고 월말 운영 부하 검증은 생략한다</td>

          <td>별도 비용을 줄일 수 있어도 운영 DB 부하와 성능 요구에 미치는 영향을 검증하지 않았다.</td>

          </tr>

          </tbody></table>

          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>

          공식 근거: <a
          href="https://docs.aws.amazon.com/athena/latest/ug/what-is.html">What
          is Amazon Athena? - Amazon Athena</a>

          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: 매일 새벽 30분만 실행되는 통계 조회를 위해 큰 RDS 읽기 복제본을 종일 운영한다. 통계는 하루 전 데이터로 충분하고 복잡한
              조인·SQL이 필요하다. 즉시 복제본 조회가 꼭 필요하지 않을 때 비용을 줄일 대안은?
            answer: S3에 분석 데이터를 적재하고 Athena의 스캔·변환 비용과 비교한다
            wrong:
              - 읽기 복제본을 늘려 미사용 시간의 단가를 자동으로 낮춘다
              - 상시 읽기 복제본을 계속 유지하고 통계 없는 시간에도 최대 크기를 고정한다
              - 통계를 기본 운영 DB로 모두 되돌리고 월말 운영 부하 검증은 생략한다
      - id: Q27-61
        type: mcq
        title: Q27-61 · 모의고사 C
        explain: |
          <p>TTL은 만료 데이터를 나중에 자동 삭제해 직접 정리 부담을 줄인다. 정확한 만료 초에 삭제를 보장하지 않으므로 인증의 유효 기간은 앱에서 직접 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>TTL 삭제 완료 여부만 보고 토큰을 유효하다고 판단한다</td>
          <td>삭제 지연 중 만료 토큰을 허용하게 되어 보안 요구를 위반한다.</td>
          </tr>
          <tr>
          <td>만료 세션용 GSI를 추가해 조회하지만 기존 전체 Scan 삭제도 계속 수행한다</td>
          <td>추가 인덱스 비용이 생기면서 전체 Scan 정리 비용을 제거하지 못한다.</td>
          </tr>
          <tr>
          <td>세션을 그대로 보존하고 서버가 로그아웃 버튼을 누른 사용자만 제거한다</td>
          <td>자동 만료 데이터 정리와 토큰 만료 즉시 거부 요구를 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html">Using time to live (TTL) in DynamoDB - Amazon DynamoDB</a>
          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: DynamoDB 테이블의 대부분은 읽지 않는 만료 세션이다. 토큰은 만료 즉시 앱에서 거부해야 하지만 물리 삭제는 며칠 늦어도 된다. 매일
              전체 테이블을 Scan해 직접 삭제하는 비용을 줄이면서 보안 유효 기간을 유지할 방법은?
            answer: TTL을 설정하고 앱에서 만료 시각을 직접 확인해 유효성을 판단한다
            wrong:
              - TTL 삭제 완료 여부만 보고 토큰을 유효하다고 판단한다
              - 만료 세션용 GSI를 추가해 조회하지만 기존 전체 Scan 삭제도 계속 수행한다
              - 세션을 그대로 보존하고 서버가 로그아웃 버튼을 누른 사용자만 제거한다
      - id: Q27-62
        type: mcq
        title: Q27-62 · 모의고사 C
        explain: |
          <p>16vCPU·128GiB는 100GiB 작업 집합과 관측된 CPU 요구를 수용하고 실제 대표 부하 시험도 통과했다. 월 700달러로 비용 상한을 충족하며 승인된 점검 시간에 변경해 재시작 영향을 관리한다. 메모리 부족을 연결 풀이나 연결 수 변경으로 해결할 수는 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>월 500달러인 16vCPU·64GiB로 바꾸고 RDS Proxy를 추가한다</td>
          <td>이미 메모리 부족으로 실패한 후보이다. RDS Proxy의 연결 풀은 여유 있는 연결 수보다 DB 작업 집합의 메모리 부족 문제를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>월 400달러인 8vCPU·64GiB로 바꾸고 최대 연결 수를 늘린다</td>
          <td>CPU는 충분할 수 있어도 64GiB의 메모리 부족은 그대로다. 연결 수 증가는 메모리 압박을 더할 수 있다.</td>
          </tr>
          <tr>
          <td>현재 크기를 유지하고 월 300달러인 읽기 복제본을 추가한다</td>
          <td>읽기 분산 후보일 수 있지만 현재 인스턴스를 유지하면 총 인스턴스 비용이 월 1,300달러가 되어 800달러 상한에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_BestPractices.html">RDS best practices</a> · <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.DBInstance.Modifying.html">Modify RDS instances</a>
          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: RDS PostgreSQL을 축소해 월 인스턴스 비용 1,000달러를 800달러 이하로 낮추려 한다. 현재 32vCPU·256GiB이며
              월말에도 CPU는 최대 4vCPU 수준, 메모리 작업 집합은 약 100GiB다. 연결 수와 저장 I/O에는 여유가 있고
              앱·쿼리 변경은 이번 범위에 없다. 대표 부하 시험에서 16vCPU·128GiB 후보는 지연 목표를 충족했고 64GiB
              후보들은 swap과 지연 초과가 발생했다. 짧은 재시작은 승인된 점검 시간에 허용한다. 적절한 선택은?
            answer: 월 700달러인 16vCPU·128GiB로 점검 시간에 변경한다
            wrong:
              - 월 500달러인 16vCPU·64GiB로 바꾸고 RDS Proxy를 추가한다
              - 월 400달러인 8vCPU·64GiB로 바꾸고 최대 연결 수를 늘린다
              - 현재 크기를 유지하고 월 300달러인 읽기 복제본을 추가한다
      - id: Q27-63
        type: mcq
        title: Q27-63 · 모의고사 C
        explain: |
          <p>같은 VPC의 같은 리전 S3 접근에는 추가 엔드포인트 요금 없는 Gateway Endpoint를 검토한다. 해당 서비스 경로만 전환하고 일반 외부 API는 NAT 경로를 계속 사용할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 Interface Endpoint를 추가하되 기존 S3 경로는 계속 NAT로 고정한다</td>
          <td>사용 경로를 NAT에 유지하면 원하는 S3 NAT 통과량 감소가 이루어지지 않는다.</td>
          </tr>
          <tr>
          <td>S3 버킷 정책만 바꾸고 네트워크 경로는 기존 NAT를 유지한다</td>
          <td>권한 변경만으로 NAT를 통과하는 네트워크 경로가 달라지지 않는다.</td>
          </tr>
          <tr>
          <td>한 AZ의 Zonal NAT로 경로를 모두 모아 NAT 개수만 줄이고 S3 경유는 유지한다</td>
          <td>NAT 수를 줄여도 S3 처리 요금은 남고 한 AZ 출구 의존과 교차 AZ 전송을 늘릴 수 있어 두 목표에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html">Gateway endpoints - Amazon Virtual Private Cloud</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: 두 AZ의 비공개 앱이 같은 리전 S3로 대량 업로드한다. 현재 모든 파일이 Zonal NAT를 통과해 처리 요금이 크다. 인터넷 외부
              API 호출은 유지하되 S3 통신 비용과 다른 AZ의 NAT 의존을 줄이려 한다. 적합한 변경은?
            answer: 앱 라우팅 테이블에 S3 Gateway Endpoint를 연결하고 S3 권한을 유지한다
            wrong:
              - S3 Interface Endpoint를 추가하되 기존 S3 경로는 계속 NAT로 고정한다
              - S3 버킷 정책만 바꾸고 네트워크 경로는 기존 NAT를 유지한다
              - 한 AZ의 Zonal NAT로 경로를 모두 모아 NAT 개수만 줄이고 S3 경유는 유지한다
      - id: Q27-64
        type: mcq
        title: Q27-64 · 모의고사 C
        explain: |
          <p>청구 상세는 실제 처리·시간 비용의 기준이며, 공용 계정 청구만으로는 최종 소비 팀을 식별하지 못한다. Flow Logs와 ENI/VPC 대응표를 트래픽 배분 근거로 사용하되 경로상 중복·누락을 보정하고 잔여 차이를 공개한다. 로그 바이트를 청구량과 정확히 같다고 간주하는 설계가 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>공용 NAT·TGW의 NetworkTeam 비용 태그를 활성화해 태그값별 청구액으로 팀을 구분한다</td>
          <td>공용 자원의 태그는 소유 계정을 분류하지만 그 자원을 통과한 여러 팀의 사용량 비중을 구분하지 못한다.</td>
          </tr>
          <tr>
          <td>중앙 NAT의 CloudWatch 총 바이트를 팀 수로 나누어 팀별 처리 요금을 배분한다</td>
          <td>총 바이트는 팀별 원천을 구분하지 않으며 균등 분배는 요구한 팀별 트래픽 비중 기준과 다르다.</td>
          </tr>
          <tr>
          <td>팀 EC2의 비용 할당 태그를 활성화해 EC2 컴퓨팅 요금 비율로 공용 처리 요금을 배분한다</td>
          <td>컴퓨팅 지출 비중과 공유 네트워크 처리량 비중은 다를 수 있어 명시한 트래픽 기반 배분 규칙을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/cur/latest/userguide/cur-query-athena.html">Query CUR with Athena</a> · <a href="https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-records-examples.html">Flow logs records and limitations</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: 여러 팀 VPC가 중앙 네트워크 계정의 NAT·TGW를 공유한다. 팀별 원본 ENI/VPC 대응표는 있고 공용 자원 태그는
              NetworkTeam뿐이다. 재무는 NAT·TGW의 처리 요금은 팀별 트래픽 비중으로 배분하고, 시간 요금은 별도 고정
              규칙으로 나누며 미귀속·측정 차이도 표시해 전체 청구와 맞추도록 요구했다. 이 배분표를 만들기 위한 두 단계는?
            answer: CUR 또는 Data Exports를 Athena로 조회해 계정·사용 유형별 실제 처리·시간 요금을 분리한다
            wrong:
              - 공용 NAT·TGW의 NetworkTeam 비용 태그를 활성화해 태그값별 청구액으로 팀을 구분한다
              - 중앙 NAT의 CloudWatch 총 바이트를 팀 수로 나누어 팀별 처리 요금을 배분한다
              - 팀 EC2의 비용 할당 태그를 활성화해 EC2 컴퓨팅 요금 비율로 공용 처리 요금을 배분한다
            answers:
              - CUR 또는 Data Exports를 Athena로 조회해 계정·사용 유형별 실제 처리·시간 요금을 분리한다
              - VPC/TGW Flow Logs의 바이트를 팀에 대응시켜 배분하고 중복 집계·미귀속·청구 차이를 조정한다
            options:
              - CUR 또는 Data Exports를 Athena로 조회해 계정·사용 유형별 실제 처리·시간 요금을 분리한다
              - VPC/TGW Flow Logs의 바이트를 팀에 대응시켜 배분하고 중복 집계·미귀속·청구 차이를 조정한다
              - 공용 NAT·TGW의 NetworkTeam 비용 태그를 활성화해 태그값별 청구액으로 팀을 구분한다
              - 중앙 NAT의 CloudWatch 총 바이트를 팀 수로 나누어 팀별 처리 요금을 배분한다
              - 팀 EC2의 비용 할당 태그를 활성화해 EC2 컴퓨팅 요금 비율로 공용 처리 요금을 배분한다
      - id: Q27-65
        type: mcq
        title: Q27-65 · 모의고사 C
        explain: |
          <p>Regional 자동 모드는 워크로드에 맞춰 AZ 범위를 관리해 반복 배치 작업을 줄인다. NAT ID 하나가 반드시 한 AZ에만 의존한다는 뜻은 아니다. 확장 시간과 실제 AZ별 시간·처리 비용을 검토해야 관리 단순화와 총비용을 비교할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Regional NAT는 공개 서브넷을 AZ마다 직접 지정해야만 생성할 수 있다</td>
          <td>Regional 모드는 VPC 수준 생성으로 NAT 호스팅용 공개 서브넷을 지정하지 않는다.</td>
          </tr>
          <tr>
          <td>Regional 자동 확장을 쓰면 모든 AZ의 시간·처리 비용이 단일 AZ 요금으로 고정된다</td>
          <td>여러 AZ에 확장된 자원의 비용을 무조건 한 AZ 요금으로 고정하는 기능은 아니다.</td>
          </tr>
          <tr>
          <td>Regional NAT ID 하나는 항상 한 AZ이므로 어떤 모드에서도 다중 AZ를 지원하지 않는다</td>
          <td>이는 Zonal 단일 배치의 의존성을 Regional에 그대로 일반화한 것이다.</td>
          </tr>
          </tbody></table>
