          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 강의 신청은 월요일 09시에 시작한다. 앱 서버 준비에 8분이 걸리고 시험 결과 초기 요청을 감당하려면 준비된 서버 40대가 필요하다.
              이후 수요는 최대 200대 범위에서 달라진다. CPU보다 ALB 대상당 요청 수가 처리 부하에 비례한다. 시작 지연을
              피하고 이후 유휴 비용을 줄일 조치 두 가지는?
            answer: 검증된 ALB 대상당 요청 수의 목표 추적 정책과 8분 준비 시간을 반영한 warmup을 구성한다.
            wrong:
              - ASG 서버 수와 관계없이 같은 값을 갖는 전체 누적 요청 수를 목표 추적용 사용자 지정 지표로 구성한다.
              - 08시 50분에 ASG desired·min·max를 모두 200으로 설정하고 신청 기간 동안 이 값을 유지한다.
              - 09시에 ASG desired와 min을 40, max를 200으로 설정하고 초기 신청 구간 뒤 min을 평상시
                수준으로 낮춘다.
            answers:
              - 검증된 ALB 대상당 요청 수의 목표 추적 정책과 8분 준비 시간을 반영한 warmup을 구성한다.
              - 08:50에 ASG desired·min=40, max=200으로 설정하고 초기 구간 뒤 min을 평상시로 낮춘다.
            options:
              - 검증된 ALB 대상당 요청 수의 목표 추적 정책과 8분 준비 시간을 반영한 warmup을 구성한다.
              - ASG 서버 수와 관계없이 같은 값을 갖는 전체 누적 요청 수를 목표 추적용 사용자 지정 지표로 구성한다.
              - 08시 50분에 ASG desired·min·max를 모두 200으로 설정하고 신청 기간 동안 이 값을 유지한다.
              - 08:50에 ASG desired·min=40, max=200으로 설정하고 초기 구간 뒤 min을 평상시로 낮춘다.
              - 09시에 ASG desired와 min을 40, max를 200으로 설정하고 초기 신청 구간 뒤 min을 평상시
                수준으로 낮춘다.
      - id: Q17-11
        type: mcq
        title: Q17-11 · EC2·확장·비용
        explain: |
          <p>세션·파일을 교체 가능한 앱 인스턴스 밖으로 옮겨야 요청이 다른 서버로 가도 상태를 찾을 수 있다. 외부 저장소 자체의 가용성과 보존 정책도 함께 설계해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>앱의 로컬 상태는 그대로 두고 sticky session 기간만 늘려 서버 교체 시의 세션·파일 공유를 해결한다.</td>
          <td>Sticky session은 정상 대상에 요청을 유지하는 도구다. 인스턴스가 교체되면 로컬 세션과 파일에 접근할 수 없는 문제는 남는다.</td>
          </tr>
          <tr>
          <td>모든 앱을 같은 AZ에 두면 요청 이동과 로컬 데이터 손실이 사라진다.</td>
          <td>단일 AZ 배치는 장애 범위를 키운다. 서버 교체·종료로 사라지는 로컬 상태 문제도 해결하지 않는다.</td>
          </tr>
          <tr>
          <td>ASG를 여러 AZ에 나누고 세션·파일은 각 인스턴스 로컬에 계속 독립 저장한다.</td>
          <td>다중 AZ는 서버 배치를 분산하지만 로컬 데이터를 공유하거나 보존하지 않는다. 다른 대상으로 이동한 요청의 상태 문제를 해결하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html">ALB 대상 그룹 속성</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 다중 AZ 앱은 로그인 세션을 EC2 메모리에, 업로드 파일을 로컬 디스크에 저장한다. 평소에는 sticky session으로 동작하지만
              서버 교체 때 재로그인과 파일 유실이 발생한다. 앱 수정이 가능하고 수평 확장을 강화하려면 가장 적절한 구성은
              무엇인가?
            answer: 로그인 세션은 가용성을 고려한 ElastiCache·DynamoDB 등에, 파일은 S3 등에 외부화하고 앱 서버 교체를
              독립시킨다.
            wrong:
              - 앱의 로컬 상태는 그대로 두고 sticky session 기간만 늘려 서버 교체 시의 세션·파일 공유를 해결한다.
              - 모든 앱을 같은 AZ에 두면 요청 이동과 로컬 데이터 손실이 사라진다.
              - ASG를 여러 AZ에 나누고 세션·파일은 각 인스턴스 로컬에 계속 독립 저장한다.
      - id: Q17-12
        type: mcq
        title: Q17-12 · EC2·확장·비용
        explain: |
          <p>실행 템플릿 변경은 기존 인스턴스를 자동으로 이미지 교체하지 않는다. Instance refresh 같은 점진 교체 절차와 상태·준비 시간 설정으로 서비스 용량을 유지하면서 새 구성을 검증해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>AMI ID를 바꾸면 기존 EC2 루트 볼륨도 즉시 그 이미지로 바뀌므로 아무 작업이 없다.</td>
          <td>기존 EC2의 디스크가 템플릿 변경으로 즉시 바뀌지는 않는다. 실제 인스턴스 교체 절차가 필요하다.</td>
          </tr>
          <tr>
          <td>모든 기존 EC2를 동시에 종료하고 대상 상태 확인은 교체가 끝날 때까지 끈다.</td>
          <td>동시 종료와 상태 검사 중단은 무중단 처리 요구를 해치며 준비되지 않은 서버로 요청을 보낼 위험을 높인다.</td>
          </tr>
          <tr>
          <td>사용자 요청을 기존 EC2로 고정하고 새 이미지는 다음 장애가 발생할 때까지 검증 없이 보관한다.</td>
          <td>새 버전 검증·교체가 이루어지지 않아 배포 요구를 달성하지 못한다. 장애 때만 검증 없이 적용하면 복구 위험도 커진다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh.html">ASG Instance refresh</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: ASG의 새 AMI를 적용하려 한다. 기존 서버에서 수동 패치하지 않고 새 인스턴스로 교체하면서 요청을 계속 처리해야 한다. 실행 템플릿의
              새 버전은 만들었지만 기존 EC2는 이전 버전이다. 가장 적절한 후속 조치는 무엇인가?
            answer: 새 템플릿 버전으로 그룹을 갱신하고 Instance refresh에서 건강한 용량·준비 시간을 고려해 교체한다.
            wrong:
              - AMI ID를 바꾸면 기존 EC2 루트 볼륨도 즉시 그 이미지로 바뀌므로 아무 작업이 없다.
              - 모든 기존 EC2를 동시에 종료하고 대상 상태 확인은 교체가 끝날 때까지 끈다.
              - 사용자 요청을 기존 EC2로 고정하고 새 이미지는 다음 장애가 발생할 때까지 검증 없이 보관한다.
      - id: Q17-13
        type: mcq
        title: Q17-13 · EC2·확장·비용
        explain: |
          <p>축소 환경의 존재는 실제 전체 부하 복구 능력과 다르다. 필요한 용량·할당량을 확보하고 동시 재시도 폭증을 제한해야 하며 결제는 재처리 시 중복 결과가 나지 않는지 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>실패한 결제는 성공할 때까지 지연 없이 무제한 동시 재시도한다.</td>
          <td>즉시 무제한 재시도는 대상 API 부하와 스로틀링을 악화시키고 중복 결제 위험도 높인다.</td>
          </tr>
          <tr>
          <td>복구 리전의 ASG 최대값만 크게 올리고 서비스 할당량과 서브넷 IP는 평상시 축소 용량 수준으로 유지한다.</td>
          <td>ASG 최대값은 서비스 할당량과 IP를 늘리지 않는다. 목표를 높여도 실제 시작에 필요한 자원이 부족하면 복구를 지연시킨다.</td>
          </tr>
          <tr>
          <td>복구 환경이 켜져 있다는 사실만 기록하고 전체 부하 전환 시험은 생략한다.</td>
          <td>전체 전환을 검증하지 않으면 실제 확장 시간과 외부 API 한도를 알 수 없다. 이번 훈련 실패 조건도 그대로 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_limit_retries.html">재시도 제한과 지터</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html">EC2 용량 예약</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 다른 리전의 축소 복구 환경은 평소 정상이다. 훈련에서 트래픽을 전환하자 EC2 할당량 부족과 결제 API 재시도 폭증 때문에 RTO를
              넘겼다. 복구 설계에서 함께 보완할 조치 두 가지는 무엇인가?
            answer: 재시도에 횟수·시간 상한과 지수 백오프·지터를 적용하고 결제 중복 실행 방지를 검증한다.
            wrong:
              - 실패한 결제는 성공할 때까지 지연 없이 무제한 동시 재시도한다.
              - 복구 리전의 ASG 최대값만 크게 올리고 서비스 할당량과 서브넷 IP는 평상시 축소 용량 수준으로 유지한다.
              - 복구 환경이 켜져 있다는 사실만 기록하고 전체 부하 전환 시험은 생략한다.
            answers:
              - 재시도에 횟수·시간 상한과 지수 백오프·지터를 적용하고 결제 중복 실행 방지를 검증한다.
              - 복구에 필요한 리전별 할당량·IP·실행 용량과 확장 시간을 사전에 검증하고 필요한 한도를 확보한다.
            options:
              - 재시도에 횟수·시간 상한과 지수 백오프·지터를 적용하고 결제 중복 실행 방지를 검증한다.
              - 실패한 결제는 성공할 때까지 지연 없이 무제한 동시 재시도한다.
              - 복구 리전의 ASG 최대값만 크게 올리고 서비스 할당량과 서브넷 IP는 평상시 축소 용량 수준으로 유지한다.
              - 복구 환경이 켜져 있다는 사실만 기록하고 전체 부하 전환 시험은 생략한다.
              - 복구에 필요한 리전별 할당량·IP·실행 용량과 확장 시간을 사전에 검증하고 필요한 한도를 확보한다.
      - id: Q17-14
        type: mcq
        title: Q17-14 · EC2·확장·비용
        explain: |
          <p>EBS 기반 인스턴스 중지는 데이터 볼륨을 유지하며 실행 비용을 줄이는 방법이다. 하지만 저장소나 별도 리소스 비용과 구매한 할인 약정까지 전부 취소하는 기능은 아니므로 전체 비용을 따로 계산한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>중지하면 모든 EBS가 자동 삭제되므로 매일 종료와 동일하게 취급한다.</td>
          <td>일반 중지는 EBS 볼륨을 삭제하지 않는다. 종료 시의 DeleteOnTermination 설정과 구분해야 한다.</td>
          </tr>
          <tr>
          <td>EBS 중지 대신 종료를 예약하되 루트 볼륨 삭제 설정은 기본값으로 두고 다음 날 같은 데이터로 새로 시작한다.</td>
          <td>기본적인 종료 설정에서는 루트 볼륨이 삭제될 수 있다. 데이터를 그대로 유지해야 하는 조건에서 삭제 설정 검토 없는 종료는 적절하지 않다.</td>
          </tr>
          <tr>
          <td>중지 후에도 인스턴스 스토어의 임시 작업 파일은 유지된다고 보고 EBS 데이터를 그곳으로 옮긴다.</td>
          <td>인스턴스 스토어 데이터는 중지 시 유지되지 않는다. 다음 날 필요한 작업 데이터를 임시 로컬 저장소로 옮기면 손실 위험이 생긴다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html">EC2 인스턴스 수명 주기</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 개발 서버는 평일 업무 시간에만 쓰지만 EBS의 작업 데이터는 다음 날 그대로 필요하다. 인스턴스는 EBS 루트 볼륨이며 RAM 상태
              보존은 필요 없다. 운영자는 밤에 중지하면 관련 모든 비용도 사라진다고 주장한다. 적절한 운영·비용 판단은 무엇인가?
            answer: 업무 외에는 인스턴스를 중지해 실행 요금을 줄일 수 있지만 EBS와 별도 리소스·기존 약정 비용은 따로 남을 수 있다.
            wrong:
              - 중지하면 모든 EBS가 자동 삭제되므로 매일 종료와 동일하게 취급한다.
              - EBS 중지 대신 종료를 예약하되 루트 볼륨 삭제 설정은 기본값으로 두고 다음 날 같은 데이터로 새로 시작한다.
              - 중지 후에도 인스턴스 스토어의 임시 작업 파일은 유지된다고 보고 EBS 데이터를 그곳으로 옮긴다.
      - id: Q17-15
        type: mcq
        title: Q17-15 · EC2·확장·비용
        explain: |
          <p>HostId 지정은 신규 배포의 물리 호스트를 고정하고 host affinity는 중지 후 같은 호스트의 재시작 관계를 유지한다. Auto-placement를 끄면 해당 호스트는 HostId를 명시한 실행만 받아 의도한 배치 통제가 가능하다. 용량 부족·호스트 장애 대응은 계약 범위에서 별도로 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>호환 호스트 전체의 auto-placement를 활성화하고 HostId 없이 host 테넌시와 기본 affinity로 실행한다.</td>
          <td>HostId 없는 실행은 호환되는 다른 auto-placement 호스트에도 배치될 수 있다. 기본 affinity도 동일 호스트 재시작을 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>등록 HostId와 기본 affinity를 지정하고 호환 호스트 전체의 auto-placement를 켠다.</td>
          <td>최초 배치는 맞지만 기본 affinity의 재시작은 이전 호스트가 최선 노력 대상이다. 등록 밖의 호환 호스트로 이동할 가능성이 남는다.</td>
          </tr>
          <tr>
          <td>등록된 호스트의 auto-placement를 비활성화하고 새 인스턴스를 dedicated 테넌시로 실행한다.</td>
          <td>Dedicated 테넌시는 Dedicated Instances 방식으로 물리 격리를 제공하지만 두 Dedicated Host ID의 소켓·코어 배치를 지정하는 설정과 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-understanding.html">Dedicated Host 배치와 affinity</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 상용 소프트웨어 계약은 등록된 물리 호스트 두 대의 소켓·코어에 한해 BYOL을 허용한다. 같은 계정에는 다른 용도의 호환
              Dedicated Hosts도 있다. 앱은 밤에 중지하고 아침에 같은 호스트에서 재시작해야 하며, 새 배포 인스턴스도
              등록된 두 호스트에 배치해야 한다. 두 호스트에는 필요한 여유 용량이 있다. 적절한 배치 설정은?
            answer: 등록 HostId와 host affinity를 지정하고 해당 호스트의 auto-placement를 끈다.
            wrong:
              - 호환 호스트 전체의 auto-placement를 활성화하고 HostId 없이 host 테넌시와 기본
                affinity로 실행한다.
              - 등록 HostId와 기본 affinity를 지정하고 호환 호스트 전체의 auto-placement를 켠다.
              - 등록된 호스트의 auto-placement를 비활성화하고 새 인스턴스를 dedicated 테넌시로 실행한다.
