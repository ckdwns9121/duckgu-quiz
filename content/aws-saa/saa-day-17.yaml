id: saa-day-17
name: EC2·확장·비용
part: 17일 차
color: "#8b5cf6"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: Q17-01
        type: mcq
        title: Q17-01 · EC2·확장·비용
        explain: |
          <p>패밀리·AZ가 다른 풀을 사용하면 단일 풀의 회수 위험에 대한 의존을 낮춘다. Price-capacity-optimized는 가용 용량과 가격을 함께 고려한다. 작업이 매월 짧게 실행되고 상시 소비가 없으므로 장기 최대 용량 약정보다 Spot과 재시도 특성을 활용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>가장 싼 인스턴스 유형 하나와 AZ 하나로 Spot 풀을 제한하고 동일 풀에서 작업자를 재시작한다.</td>
          <td>저렴한 풀 하나는 구매 단가를 줄일 수 있으나 그 풀의 용량 부족·회수에 재실행이 집중된다. 다양한 풀을 사용할 수 있는 조건을 활용하지 못한다.</td>
          </tr>
          <tr>
          <td>여러 AZ의 온디맨드 작업자로 최대 작업량을 처리하고 작업이 끝나면 인스턴스를 종료한다.</td>
          <td>중단 위험은 낮추지만 재시도와 유연한 마감으로 Spot을 사용할 수 있는 작업에서 전체를 온디맨드로 실행하면 비용 절감 기회가 작다.</td>
          </tr>
          <tr>
          <td>최대 동시 작업량의 1년 Compute Savings Plans를 구매하고 그 범위의 온디맨드 작업자를 매월 실행한다.</td>
          <td>할인된 온디맨드를 사용할 수 있지만 매월 일주일 외 시간에도 약정 비용을 부담한다. 다른 안정적 사용량이 없어 최대치의 장기 약정이 부적절하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-fleet-allocation-strategy.html">Spot 할당 전략</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 연구팀은 매달 재시도 가능한 이미지 변환을 일주일 동안 실행한다. x86의 여러 인스턴스 패밀리와 AZ에서 같은 작업을 처리할 수 있으며
              결과·체크포인트는 S3에 저장한다. 큐 적체가 마감 전에 소진될 여유는 있으나 회수 때마다 긴 재작업이 발생해 이를
              줄이고 싶다. 상시 약정할 다른 사용량은 없다. 비용과 중단 위험을 함께 줄일 구성은?
            answer: 여러 패밀리·AZ의 Spot 용량 풀을 사용하는 플릿에 price-capacity-optimized 할당을 적용한다.
            wrong:
              - 가장 싼 인스턴스 유형 하나와 AZ 하나로 Spot 풀을 제한하고 동일 풀에서 작업자를 재시작한다.
              - 여러 AZ의 온디맨드 작업자로 최대 작업량을 처리하고 작업이 끝나면 인스턴스를 종료한다.
              - 최대 동시 작업량의 1년 Compute Savings Plans를 구매하고 그 범위의 온디맨드 작업자를 매월
                실행한다.
      - id: Q17-02
        type: mcq
        title: Q17-02 · EC2·확장·비용
        explain: |
          <p>Compute Savings Plans는 적용 대상 EC2 사용 구성 변화와 Fargate·Lambda까지 포괄하는 유연성이 있다. 시간당 약정은 미사용이어도 남으므로 안정적으로 소비하는 범위와 초과량을 따로 판단한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>온디맨드 용량 예약을 하면 Fargate와 Lambda 사용 요금까지 같은 비율로 자동 할인된다.</td>
          <td>용량 예약은 EC2 실행 용량 확보 기능이다. Fargate·Lambda의 시간당 사용 약정 할인 기능을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>현재 EC2 패밀리·리전의 EC2 Instance Savings Plans만으로 모든 예정 서비스까지 할인한다.</td>
          <td>EC2 Instance Savings Plans는 선택 리전·패밀리의 EC2에 범위가 묶인다. 다른 서비스까지 자동 적용되지 않는다.</td>
          </tr>
          <tr>
          <td>현재 AZ의 Standard RI로 약정하면 다른 리전 Lambda 사용에도 자동 할인된다.</td>
          <td>EC2 RI는 Lambda 할인 상품이 아니며 지정 범위와 조건이 달라지면 적용을 받을 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html">Savings Plans 유형</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 회사는 1년 이상 기본 컴퓨팅 사용액이 일정하지만 EC2 패밀리와 리전을 바꾸고 일부 기능을 Fargate·Lambda로 옮길 계획이다.
              특정 AZ 실행 용량 보장은 별도 해결한다. 변경 중에도 적용 범위를 넓게 유지할 할인 상품은 무엇인가?
            answer: Compute Savings Plans를 꾸준히 소비할 범위로 약정하고 초과·비적용 사용량은 따로 고려한다.
            wrong:
              - 온디맨드 용량 예약을 하면 Fargate와 Lambda 사용 요금까지 같은 비율로 자동 할인된다.
              - 현재 EC2 패밀리·리전의 EC2 Instance Savings Plans만으로 모든 예정 서비스까지 할인한다.
              - 현재 AZ의 Standard RI로 약정하면 다른 리전 Lambda 사용에도 자동 할인된다.
      - id: Q17-03
        type: mcq
        title: Q17-03 · EC2·확장·비용
        explain: |
          <p>온디맨드 용량 예약은 특정 AZ에서 조건에 맞는 실행 용량을 확보하는 기능이다. 할인 상품만으로 부족 용량이 보장되지 않으며 사용하지 않는 예약 용량에도 비용이 발생할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>해당 리전 범위 RI만 구입하면 모든 AZ에서 필요한 실행 용량이 보장된다.</td>
          <td>리전 RI는 할인 범위와 관련되며 지정 AZ 용량 예약을 제공하는 AZ RI와 다르다.</td>
          </tr>
          <tr>
          <td>장애가 난 뒤 인스턴스 시작 요청을 백오프로 재시도하는 절차만 마련하고 용량은 미리 확보하지 않는다.</td>
          <td>재시도는 일시적인 요청 실패에 도움을 줄 수 있지만 특정 시점·AZ의 필요한 실행 용량을 사전에 확보하라는 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>Compute Savings Plans 약정 금액을 늘려 실행 용량을 자동 예약한다.</td>
          <td>Savings Plans는 사용 요금 할인 약정이다. 특정 AZ의 EC2 시작 용량을 예약하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html">EC2 용량 예약</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html">RI 범위와 용량</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 재난 복구 훈련에서 지정 AZ의 온디맨드 EC2를 시작하지 못했다. 계정 할당량과 IP는 충분했지만 요청 사양의 가용 용량이 부족했다.
              회사는 다음 분기 같은 AZ·사양의 복구 용량을 미리 확보해야 한다. 가장 직접적인 조치는 무엇인가?
            answer: 해당 AZ와 사양에 맞는 온디맨드 용량 예약을 구성하고 예약 매칭 조건과 미사용 요금을 검토한다.
            wrong:
              - 해당 리전 범위 RI만 구입하면 모든 AZ에서 필요한 실행 용량이 보장된다.
              - 장애가 난 뒤 인스턴스 시작 요청을 백오프로 재시도하는 절차만 마련하고 용량은 미리 확보하지 않는다.
              - Compute Savings Plans 약정 금액을 늘려 실행 용량을 자동 예약한다.
      - id: Q17-04
        type: mcq
        title: Q17-04 · EC2·확장·비용
        explain: |
          <p>지원되는 Linux/UNIX·기본 테넌시 리전 RI는 같은 패밀리 안에서 인스턴스 크기와 AZ 유연성이 있다. Large 네 대와 xlarge 두 대의 정규화 사용량이 같으므로 리전 large 네 개가 변경 전후 전체 사용량에 맞는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현재 AZ 범위 m6i.large Standard RI 네 개를 구매한다.</td>
          <td>AZ 범위 RI는 지정 AZ와 크기에 맞는 사용량을 대상으로 한다. 크기와 AZ가 바뀌는 계획에서 같은 구매안을 유지한 채 전체 할인을 적용하기 어렵다.</td>
          </tr>
          <tr>
          <td>리전 범위 m6i.xlarge Standard RI 네 개를 구매한다.</td>
          <td>리전·크기 유연성은 있지만 xlarge 네 개는 필요한 정규화 사용량의 두 배라 미사용 예약 비용이 발생한다.</td>
          </tr>
          <tr>
          <td>리전 범위 m6i.large Standard RI 두 개를 구매한다.</td>
          <td>리전·크기 유연성은 있지만 large 두 개는 필요한 정규화 사용량의 절반이다. 전체 사용량을 할인하려는 조건에 부족하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html">RI 범위와 크기 유연성</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/apply_ri.html">RI 정규화 적용</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 앱은 1년간 같은 리전에서 Linux/UNIX·기본 테넌시의 m6i를 사용한다. 현재 m6i.large 네 대를 다음 달
              m6i.xlarge 두 대로 바꾸고 AZ 사이 배치도 조정한다. 두 구성의 정규화 사용량은 같다. 용량 예약은 필요
              없고, 아래 구매안 중 이 전체 사용량을 계속 할인하면서 사용하지 않는 예약을 만들지 않을 것은?
            answer: 리전 범위 m6i.large Standard RI 네 개를 구매한다.
            wrong:
              - 현재 AZ 범위 m6i.large Standard RI 네 개를 구매한다.
              - 리전 범위 m6i.xlarge Standard RI 네 개를 구매한다.
              - 리전 범위 m6i.large Standard RI 두 개를 구매한다.
      - id: Q17-05
        type: mcq
        title: Q17-05 · EC2·확장·비용
        explain: |
          <p>정확한 /api와 그 아래 /api/*를 함께 조건으로 지정해야 경계가 맞는다. /apiv2는 두 조건에 일치하지 않아 기본 카탈로그로 간다. 포괄적인 규칙을 먼저 놓으면 이후 API 규칙이 실행되지 않으므로 우선순위도 중요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>우선순위 10의 /api/* 규칙을 API로 보내고 기본 동작을 카탈로그로 정한다.</td>
          <td>/api/*는 슬래시가 없는 정확한 /api에 일치하지 않는다. 그 요청이 기본 카탈로그로 간다.</td>
          </tr>
          <tr>
          <td>우선순위 10의 /* 규칙을 카탈로그로, 우선순위 20의 /api 및 /api/* 규칙을 API로 보낸다.</td>
          <td>/*가 먼저 모든 요청을 잡기 때문에 뒤의 API 규칙에 도달하지 못한다. 규칙 조건 자체가 맞아도 평가 순서가 잘못됐다.</td>
          </tr>
          <tr>
          <td>우선순위 10의 /api* 규칙을 API로 보내고 기본 동작을 카탈로그로 정한다.</td>
          <td>/api*는 /apiv2에도 일치한다. API 하위 경로는 처리하지만 접두사가 비슷한 다른 경로를 카탈로그로 보내지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-rules.html">ALB 리스너 규칙 평가</a> · <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-condition-types.html">ALB 경로 조건</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: 같은 호스트의 요청을 ALB로 분기한다. /api 및 /api/로 시작하는 경로는 API 대상 그룹, /apiv2와 그 밖의 경로는
              카탈로그 대상 그룹이어야 한다. 경로 재작성 없이 앱 서버는 프라이빗 서브넷에 둔다. ALB의 낮은 번호 규칙이 먼저
              평가될 때 적절한 구성은?
            answer: 우선순위 10의 /api 및 /api/* 규칙을 API로 보내고 기본 동작을 카탈로그로 정한다.
            wrong:
              - 우선순위 10의 /api/* 규칙을 API로 보내고 기본 동작을 카탈로그로 정한다.
              - 우선순위 10의 /* 규칙을 카탈로그로, 우선순위 20의 /api 및 /api/* 규칙을 API로 보낸다.
              - 우선순위 10의 /api* 규칙을 API로 보내고 기본 동작을 카탈로그로 정한다.
      - id: Q17-06
        type: mcq
        title: Q17-06 · EC2·확장·비용
        explain: |
          <p>UDP 대상도 TCP·HTTP·HTTPS의 별도 상태 확인을 사용할 수 있다. UDP 앱의 실제 준비 상태와 연결된 /ready를 사용하면 포트가 먼저 열려도 매치 처리가 준비되기 전에는 healthy가 되지 않는다. 정상 대상이 있는 상태에서 신규 대상을 편입하는 구성이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>UDP 9000 대상 그룹에 TCP 8080 상태 확인을 구성한다.</td>
          <td>HTTP 서버의 TCP 포트가 열렸는지는 확인하지만 게임 매치 준비 여부를 판정하지 않는다.</td>
          </tr>
          <tr>
          <td>UDP 9000 대상 그룹에 HTTP 8080 /live 상태 확인을 구성한다.</td>
          <td>/live는 프로세스 생존을 의미해 준비 중에도 200을 반환하므로 3분 초기화 구간을 보호하지 못한다.</td>
          </tr>
          <tr>
          <td>UDP 9000 대상 그룹에 TCP 9000 상태 확인을 구성한다.</td>
          <td>게임 포트는 UDP만 수신하므로 같은 번호로 TCP 연결을 검사하면 정상 UDP 서버도 healthy가 되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/network/target-group-health-checks.html">NLB UDP 대상 상태 확인</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: 게임 앱은 NLB의 UDP 9000 리스너로 서비스하며 AZ별 고정 주소는 이미 등록됐다. EC2는 UDP 9000과 HTTP 8080을
              연다. HTTP /live는 프로세스가 살아 있으면 200, /ready는 게임 매치 처리가 준비됐을 때 200을
              반환한다. 기존 정상 대상은 여러 AZ에 충분하며 새 인스턴스는 부팅 후 3분 동안 준비 중이다. 준비 전 대상에
              UDP를 보내지 않게 할 대상 그룹 설정은?
            answer: UDP 9000 대상 그룹에 HTTP 8080 /ready 상태 확인을 구성한다.
            wrong:
              - UDP 9000 대상 그룹에 TCP 8080 상태 확인을 구성한다.
              - UDP 9000 대상 그룹에 HTTP 8080 /live 상태 확인을 구성한다.
              - UDP 9000 대상 그룹에 TCP 9000 상태 확인을 구성한다.
      - id: Q17-07
        type: mcq
        title: Q17-07 · EC2·확장·비용
        explain: |
          <p>ELB 상태 확인을 ASG에 반영해야 앱 프로세스 장애를 교체 판단에 사용할 수 있다. 또한 초기화에 6분이 필요한 새 서버를 조기에 반복 교체하지 않도록 충분한 유예 기간을 설정하고 실제 준비 여부를 검사해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>대상 그룹 상태 확인을 끄고 EC2 시스템 검사만 계속 사용한다.</td>
          <td>로드 밸런서 검사를 끄면 앱 장애를 나타내는 신호가 줄어든다. EC2 검사만으로 앱 프로세스 건강을 보장하지 못한다.</td>
          </tr>
          <tr>
          <td>앱이 응답하지 않을 때도 /health가 항상 성공하도록 바꿔 교체를 막는다.</td>
          <td>무조건 성공하는 검사 경로는 앱 실패를 숨긴다. 실제 요청 실패와 자동 복구 지연이 계속된다.</td>
          </tr>
          <tr>
          <td>ASG 최대 용량만 늘리면 기존 unhealthy 대상이 반드시 교체된다.</td>
          <td>최대 용량은 확장 상한이다. 사용하지 않는 앱 상태 확인을 대신 활성화하거나 비정상 판정을 만들지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html">ASG 상태 확인</a> · <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-check-grace-period.html">상태 확인 유예 기간</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: ALB 상태 확인에서 앱 프로세스가 멈춘 인스턴스가 unhealthy지만 EC2 검사는 통과해 ASG가 교체하지 않는다. ASG는 EC2
              검사만 사용한다. 새 서버는 초기화에 6분이 걸려 그동안 앱 검사에 실패한다. 앱 장애 복구와 새 서버의 불필요한 조기
              교체를 함께 방지할 조치 두 가지는 무엇인가?
            answer: ASG에서 ELB 상태 확인을 사용해 대상 그룹의 비정상 상태를 교체 판단에 반영한다.
            wrong:
              - 대상 그룹 상태 확인을 끄고 EC2 시스템 검사만 계속 사용한다.
              - 앱이 응답하지 않을 때도 /health가 항상 성공하도록 바꿔 교체를 막는다.
              - ASG 최대 용량만 늘리면 기존 unhealthy 대상이 반드시 교체된다.
            answers:
              - ASG에서 ELB 상태 확인을 사용해 대상 그룹의 비정상 상태를 교체 판단에 반영한다.
              - 앱 초기화 시간을 고려한 유예 기간과 실제 앱 상태를 확인하는 경로를 검토한다.
            options:
              - 대상 그룹 상태 확인을 끄고 EC2 시스템 검사만 계속 사용한다.
              - 앱이 응답하지 않을 때도 /health가 항상 성공하도록 바꿔 교체를 막는다.
              - ASG에서 ELB 상태 확인을 사용해 대상 그룹의 비정상 상태를 교체 판단에 반영한다.
              - 앱 초기화 시간을 고려한 유예 기간과 실제 앱 상태를 확인하는 경로를 검토한다.
              - ASG 최대 용량만 늘리면 기존 unhealthy 대상이 반드시 교체된다.
      - id: Q17-08
        type: mcq
        title: Q17-08 · EC2·확장·비용
        explain: |
          <p>수집과 변환을 큐로 분리하면 순간 입력량을 버퍼링하고 작업자 용량을 조절할 수 있다. 작업 성공 후 메시지를 삭제하고 중복 처리에 대비해야 서버 중단 시에도 재처리할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>업로드 API가 각 변환 종료를 기다리게 하고 ALB 대기 시간만 늘린다.</td>
          <td>대기 시간만 늘려도 변환 처리 용량과 입력 버퍼는 생기지 않는다. 동기 연결이 오래 유지되며 시간 초과 문제도 남을 수 있다.</td>
          </tr>
          <tr>
          <td>변환 시작 직후 큐 항목을 제거하고 원본·작업 식별자는 작업자 RAM에만 남긴다.</td>
          <td>완료 전에 메시지를 삭제하면 작업자 중단 시 미완료 항목을 다시 찾지 못할 수 있다. RAM만으로 재처리 상태를 유지하면 유실 위험이 있다.</td>
          </tr>
          <tr>
          <td>업로드 API의 재시도 횟수를 무제한으로 늘리고 변환 작업자 수는 고정한다.</td>
          <td>고정된 처리 능력을 넘는 재시도는 부하를 더 만들고 입력·처리 단계의 결합도 그대로 유지한다. 적체를 관리하며 처리량을 늘리는 구조가 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html">SQS 적체량으로 ASG 확장</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: 사진 서비스가 업로드 완료 이벤트를 받아 썸네일을 만든다. 업로드가 몰릴 때 EC2 변환 작업자가 즉시 모두 처리하지 못해 API가 시간
              초과된다. 결과 반영은 수 분 지연돼도 되고 원본은 이미 S3에 보관한다. 입력 유실 없이 변환 처리량을 늘리는 설계는
              무엇인가?
            answer: SQS에 버퍼링해 완료한 항목만 지우고 작업자당 적체량으로 ASG를 조절한다.
            wrong:
              - 업로드 API가 각 변환 종료를 기다리게 하고 ALB 대기 시간만 늘린다.
              - 변환 시작 직후 큐 항목을 제거하고 원본·작업 식별자는 작업자 RAM에만 남긴다.
              - 업로드 API의 재시도 횟수를 무제한으로 늘리고 변환 작업자 수는 고정한다.
      - id: Q17-09
        type: mcq
        title: Q17-09 · EC2·확장·비용
        explain: |
          <p>목표 추적에는 서버를 늘리면 단위당 부하가 줄어드는 지표가 적합하다. 대상당 요청 수가 처리 부하를 반영하는지 검증하고 새 인스턴스의 준비 시간을 고려해야 왜곡된 확장을 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>서버 수와 무관한 전체 누적 요청 수를 목표 추적해 지표가 내려올 때까지 서버를 계속 추가한다.</td>
          <td>전체 누적값은 서버 추가로 줄어들지 않는다. 용량과 반비례하지 않는 지표는 적절한 목표 추적을 어렵게 만든다.</td>
          </tr>
          <tr>
          <td>CPU 지표만 그대로 사용하고 목표를 더 높이면 DB 대기 중에도 필요한 서버가 빨리 늘어난다.</td>
          <td>현재 CPU가 병목을 반영하지 못한다는 조건이다. 목표를 높이면 확장 반응이 더 늦어질 수 있다.</td>
          </tr>
          <tr>
          <td>CPU가 낮으므로 동적 정책을 제거하고 현재 목표 대수를 고정해 API 부하 변화에 대응한다.</td>
          <td>고정 목표는 트래픽 변화에 맞춘 자동 조절 요구를 충족하지 못한다. CPU 대신 적합한 단위당 부하 지표를 검토해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html">목표 추적 확장 정책</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 동일 크기 API 서버를 늘리면 서버당 요청 수가 줄어든다. CPU는 I/O 대기 때문에 낮지만 DB에는 처리 여유가 충분하며 부하
              시험에서 앱 서버 추가로 전체 처리량이 증가함을 확인했다. 트래픽 변화에 맞춰 자동으로 서버 수를 조정하려 한다. 가장
              적절한 정책은 무엇인가?
            answer: 요청 분산과 부하 상관관계를 검증한 대상당 요청 수 지표로 목표 추적 정책을 구성하고 warmup을 설정한다.
            wrong:
              - 서버 수와 무관한 전체 누적 요청 수를 목표 추적해 지표가 내려올 때까지 서버를 계속 추가한다.
              - CPU 지표만 그대로 사용하고 목표를 더 높이면 DB 대기 중에도 필요한 서버가 빨리 늘어난다.
              - CPU가 낮으므로 동적 정책을 제거하고 현재 목표 대수를 고정해 API 부하 변화에 대응한다.
      - id: Q17-10
        type: mcq
        title: Q17-10 · EC2·확장·비용
        explain: |
          <p>예약 확장이 8분 준비 시간보다 먼저 기본 40대를 확보해야 시작 부하를 받을 수 있다. 이후에는 서버를 늘릴수록 단위당 부하가 내려가는 대상당 요청 수로 추적하고 하한을 낮춰 유휴 비용을 줄인다. 예약과 동적 확장은 서로 다른 시간대 요구를 담당한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ASG 서버 수와 관계없이 같은 값을 갖는 전체 누적 요청 수를 목표 추적용 사용자 지정 지표로 구성한다.</td>
          <td>전체 누적 요청 수는 서버를 추가해도 감소하지 않아 목표 추적이 용량과 반대로 움직이는 적절한 활용률 지표가 아니다.</td>
          </tr>
          <tr>
          <td>08시 50분에 ASG desired·min·max를 모두 200으로 설정하고 신청 기간 동안 이 값을 유지한다.</td>
          <td>시작 용량은 충분하지만 모든 값을 200으로 고정해 초기 필요량 40대와 이후 가변 수요에 비해 유휴 비용이 커진다.</td>
          </tr>
          <tr>
          <td>09시에 ASG desired와 min을 40, max를 200으로 설정하고 초기 신청 구간 뒤 min을 평상시 수준으로 낮춘다.</td>
          <td>09시부터 서버를 시작하면 초기 8분의 부족 용량을 피할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
