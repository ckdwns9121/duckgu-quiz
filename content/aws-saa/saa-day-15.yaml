          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html">IAM 보안 권장 사항</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html">EC2의 IAM 역할</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: EC2에서 S3를 읽는 앱이 IAM 사용자의 장기 키를 환경 변수로 사용했다. 같은 앱은 서버 교체가 잦고 유출된 키가 외부에서도 쓰인
              흔적이 확인됐다. 앱 접근을 유지하면서 키 재유출 위험과 기존 유출 키의 사용을 함께 줄일 조치는 무엇인가?
            answer: 필요한 S3 읽기 권한의 EC2 역할로 SDK 자격 증명 사용을 전환하고 검증 후 유출된 장기 키를 비활성화·삭제한다.
            wrong:
              - 장기 키에 MFA 조건만 추가하되 앱 자격 증명 전달과 유출 키 수명 주기는 바꾸지 않는다.
              - EC2 인바운드 SG를 관리 IP로 제한하면 외부에서 쓰는 유출 키도 더 이상 AWS API를 호출할 수 없다.
              - 장기 키를 AMI 대신 사용자 데이터에 옮기고 기존 키는 호환성을 위해 활성화 상태로 둔다.
