id: saa-day-15
name: 보안·IAM
part: 15일 차
color: "#FF9900"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: Q15-01
        type: mcq
        title: Q15-01 · 보안·IAM
        explain: |
          <p>교차 계정 역할은 장기 키 없이 세션 권한으로 접근하게 한다. 호출자의 역할 호출 권한, 대상 역할의 신뢰와 보고서 범위 읽기 권한을 함께 구성해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>운영 계정 역할의 신뢰 정책만 분석 계정 전체에 열고 역할 권한 정책은 비워 둔다.</td>
          <td>신뢰 정책은 역할을 맡을 주체를 정한다. 보고서를 읽을 역할의 작업 권한까지 부여하지 않는다.</td>
          </tr>
          <tr>
          <td>운영 계정에 분석가 공용 IAM 사용자를 만들고 그 키를 회사 비밀 저장소에 보관해 공유한다.</td>
          <td>공용 장기 키는 사람별 추적과 회수가 어렵고 장기 키 생성 금지 조건도 어긴다.</td>
          </tr>
          <tr>
          <td>분석 계정의 IAM 역할에 운영 계정 S3 읽기 정책만 추가하고 운영 계정의 신뢰·리소스 정책은 변경하지 않는다.</td>
          <td>다른 계정 리소스에 호출자 측 정책만 추가해서 대상 계정의 허용 없이 접근할 수는 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html">교차 계정 역할 위임</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 분석 계정의 직원들이 운영 계정의 특정 S3 보고서만 읽어야 한다. 직원은 회사 연동 로그인으로 분석 계정에 접속하며 운영 계정에 사람별
              장기 키를 만들 수 없다. 접근을 회수하기 쉽고 읽기 범위를 제한하는 가장 적절한 구성은 무엇인가?
            answer: 운영 계정에 보고서 읽기 역할을 만들고 분석 계정의 허용된 역할을 신뢰한다. 호출자에게 AssumeRole 권한을 부여한다.
            wrong:
              - 운영 계정 역할의 신뢰 정책만 분석 계정 전체에 열고 역할 권한 정책은 비워 둔다.
              - 운영 계정에 분석가 공용 IAM 사용자를 만들고 그 키를 회사 비밀 저장소에 보관해 공유한다.
              - 분석 계정의 IAM 역할에 운영 계정 S3 읽기 정책만 추가하고 운영 계정의 신뢰·리소스 정책은 변경하지 않는다.
      - id: Q15-02
        type: mcq
        title: Q15-02 · 보안·IAM
        explain: |
          <p>권한 경계는 신원 정책이 부여할 수 있는 범위의 상한을 정한다. 경계를 필수로 적용하고 제거·교체 경로도 통제해야 관리자 정책 연결로 상한을 우회하지 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>역할 생성은 허용하되 개발자 자신의 신원 정책에만 승인 서비스 Allow를 두고 생성 역할의 경계는 강제하지 않는다.</td>
          <td>개발자 자신의 API 허용과 생성 역할이 얻을 권한은 별개다. 생성 역할에 관리자 정책을 연결할 수 있다면 개발자 자신의 서비스 목록만으로 역할 권한 상승을 막지 못한다.</td>
          </tr>
          <tr>
          <td>모든 생성 역할에 ReadOnlyAccess를 추가로 연결해 관리자 정책과 상쇄한다.</td>
          <td>여러 허용 정책은 더해진다. 읽기 전용 정책을 추가해도 이미 허용된 관리자 작업을 취소하지 않는다.</td>
          </tr>
          <tr>
          <td>개발자가 생성한 역할의 신뢰 정책에 EC2만 넣으면 역할의 모든 AWS API 권한이 제한된다.</td>
          <td>신뢰 정책은 역할을 맡는 주체를 제한할 뿐 맡은 뒤 실행할 서비스 작업의 상한을 정하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html">IAM 권한 경계</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 플랫폼 팀은 개발자가 배포용 IAM 역할을 직접 만들게 하려 한다. 다만 개발자가 생성한 역할에 관리자 정책을 연결해도 승인된 서비스
              범위를 넘지 못해야 한다. 개발자에게 역할 생성 권한을 유지하면서 우회를 막는 설계는 무엇인가?
            answer: 역할 생성·변경 정책에서 지정된 권한 경계 적용을 강제하고 경계 제거·교체도 제한한다.
            wrong:
              - 역할 생성은 허용하되 개발자 자신의 신원 정책에만 승인 서비스 Allow를 두고 생성 역할의 경계는 강제하지 않는다.
              - 모든 생성 역할에 ReadOnlyAccess를 추가로 연결해 관리자 정책과 상쇄한다.
              - 개발자가 생성한 역할의 신뢰 정책에 EC2만 넣으면 역할의 모든 AWS API 권한이 제한된다.
      - id: Q15-03
        type: mcq
        title: Q15-03 · 보안·IAM
        explain: |
          <p>ABAC는 지원 작업에서 주체와 리소스 속성을 비교해 반복 정책을 줄인다. 그러나 사용자가 권한 판단용 태그를 임의 변경하면 다른 프로젝트로 가장할 수 있으므로 태그 변경도 통제해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>개발자에게 자신의 주체 태그와 모든 리소스의 프로젝트 태그를 자유롭게 바꾸게 한다.</td>
          <td>권한 조건에 쓰는 태그를 자유롭게 바꾸면 다른 팀의 태그를 붙여 접근할 수 있어 경계가 무너진다.</td>
          </tr>
          <tr>
          <td>리소스에 태그만 붙이고 모든 개발자에게 전체 서비스 관리자 권한을 준다.</td>
          <td>태그 자체는 권한을 부여하거나 제한하지 않는다. 전체 관리자 허용은 팀별 격리를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>주체 태그와의 일치 비교 없이 리소스에 project 태그가 존재하는지만 검사한다.</td>
          <td>태그 존재만 확인하면 다른 프로젝트 리소스도 조건을 통과한다. 주체와 리소스의 프로젝트 값이 맞는지 평가해야 팀별 경계를 유지한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html">IAM 속성 기반 접근 제어</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 프로젝트별 개발 팀이 수십 개이며 신규 프로젝트마다 IAM 정책을 복제하는 일이 늘었다. 각 팀은 자기 프로젝트 태그가 있는 지원 리소스만
              수정해야 한다. 태그 값으로 다른 팀에 접근하는 우회도 막아야 한다. 필요한 조치 두 가지는 무엇인가?
            answer: 주체·리소스의 권한 판단용 태그를 변경할 주체와 생성 시 태그 조건을 제한한다.
            wrong:
              - 개발자에게 자신의 주체 태그와 모든 리소스의 프로젝트 태그를 자유롭게 바꾸게 한다.
              - 리소스에 태그만 붙이고 모든 개발자에게 전체 서비스 관리자 권한을 준다.
              - 주체 태그와의 일치 비교 없이 리소스에 project 태그가 존재하는지만 검사한다.
            answers:
              - 주체·리소스의 권한 판단용 태그를 변경할 주체와 생성 시 태그 조건을 제한한다.
              - 주체의 프로젝트 태그와 리소스 태그의 일치를 조건으로 허용하는 ABAC 정책을 적용한다.
            options:
              - 개발자에게 자신의 주체 태그와 모든 리소스의 프로젝트 태그를 자유롭게 바꾸게 한다.
              - 주체·리소스의 권한 판단용 태그를 변경할 주체와 생성 시 태그 조건을 제한한다.
              - 리소스에 태그만 붙이고 모든 개발자에게 전체 서비스 관리자 권한을 준다.
              - 주체 태그와의 일치 비교 없이 리소스에 project 태그가 존재하는지만 검사한다.
              - 주체의 프로젝트 태그와 리소스 태그의 일치를 조건으로 허용하는 ABAC 정책을 적용한다.
      - id: Q15-04
        type: mcq
        title: Q15-04 · 보안·IAM
        explain: |
          <p>SCP의 명시적 거부는 상위 계층에서 적용되므로 그 거부문 자체의 범위를 좁혀야 한다. 리전과 정확한 역할 ARN을 함께 조건에 사용하면 승인된 조합의 요청만 거부에서 빠지며, 실제 권한은 기존 IAM 정책에서 얻는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>루트 SCP의 허용 리전 목록에 시드니를 추가하고 운영 계정의 DRDeploy에 배포 정책을 연결한다.</td>
          <td>시드니를 조직 공통 허용 리전에 추가하면 다른 계정·역할까지 리전 제한이 완화된다.</td>
          </tr>
          <tr>
          <td>운영 계정을 새 DR OU로 옮기고 그 OU에 시드니 EC2 작업을 허용하는 SCP를 연결한다.</td>
          <td>루트 SCP는 OU를 바꿔도 상속된다. 하위 OU의 Allow로 루트의 명시적 거부를 넘을 수 없다.</td>
          </tr>
          <tr>
          <td>루트 SCP에서 운영 계정을 리전 거부 대상에서 제외하고 DRDeploy의 IAM 정책으로 시드니 배포 범위를 정한다.</td>
          <td>계정 전체를 제외하면 그 계정의 다른 역할까지 기존 SCP 리전 제한에서 빠진다. 역할 IAM 제한은 다른 역할의 상한을 대신하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_syntax.html">SCP 조건과 리전 제한</a> · <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html">PrincipalArn 역할 ARN</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 조직 루트의 SCP는 서울 외 리전의 EC2 작업을 거부한다. 운영 계정의 DRDeploy 역할에만 시드니 리전의 EC2 배포를 허용해야
              하며, 다른 역할과 다른 계정의 리전 제한은 유지해야 한다. DRDeploy의 IAM 정책은 필요한 배포 작업을
              허용한다. 상위에서 적용되는 다른 거부는 없다. 가장 좁은 예외를 만드는 변경은 무엇인가?
            answer: 루트 SCP의 리전 거부 조건에서 운영 계정 DRDeploy의 정확한 역할 ARN과 시드니 리전의 조합을 예외로 만든다.
            wrong:
              - 루트 SCP의 허용 리전 목록에 시드니를 추가하고 운영 계정의 DRDeploy에 배포 정책을 연결한다.
              - 운영 계정을 새 DR OU로 옮기고 그 OU에 시드니 EC2 작업을 허용하는 SCP를 연결한다.
              - 루트 SCP에서 운영 계정을 리전 거부 대상에서 제외하고 DRDeploy의 IAM 정책으로 시드니 배포 범위를
                정한다.
      - id: Q15-05
        type: mcq
        title: Q15-05 · 보안·IAM
        explain: |
          <p>교차 계정 KMS 사용은 키 소유 계정의 키 정책과 호출자 계정의 IAM 허용이 모두 필요하다. S3 객체 권한이 이미 있어도 암호화 키 사용 권한은 별도로 평가한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>해당 KMS 키의 자동 회전을 켜고 계정 간 키 사용 정책은 변경하지 않는다.</td>
          <td>키 재료 회전은 허용 주체나 작업 권한을 추가하지 않는다. 교차 계정 복호화의 정책 부족은 그대로 남는다.</td>
          </tr>
          <tr>
          <td>분석 역할에 kms:ListKeys만 허용해 키 목록이 보이도록 한다.</td>
          <td>키 열람 작업은 암호문 복호화 작업과 다르다. ListKeys만으로 Decrypt를 수행할 수 없다.</td>
          </tr>
          <tr>
          <td>KMS 키 정책은 유지하고 S3 버킷 정책에 kms:Decrypt 허용문만 추가한다.</td>
          <td>S3 버킷 정책은 KMS 키 사용을 승인하는 키 정책을 대신하지 않는다. KMS와 S3는 각각의 리소스 권한을 평가한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html">교차 계정 KMS 키 사용</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 계정 A는 고객 관리형 KMS 키로 암호화한 S3 보고서를 보관한다. 계정 B의 분석 역할은 이미 교차 계정 객체 읽기 권한이 있지만
              복호화에서 거부된다. 네트워크는 정상이며 명시적 거부는 없다. 추가로 확인해야 할 허용 두 가지는 무엇인가?
            answer: 계정 B의 분석 역할 IAM 정책이 해당 키에 필요한 kms:Decrypt를 허용하는지 확인한다.
            wrong:
              - 해당 KMS 키의 자동 회전을 켜고 계정 간 키 사용 정책은 변경하지 않는다.
              - 분석 역할에 kms:ListKeys만 허용해 키 목록이 보이도록 한다.
              - KMS 키 정책은 유지하고 S3 버킷 정책에 kms:Decrypt 허용문만 추가한다.
            answers:
              - 계정 B의 분석 역할 IAM 정책이 해당 키에 필요한 kms:Decrypt를 허용하는지 확인한다.
              - 계정 A의 해당 KMS 키 정책이 분석 역할의 필요한 키 사용을 허용하는지 확인한다.
            options:
              - 계정 B의 분석 역할 IAM 정책이 해당 키에 필요한 kms:Decrypt를 허용하는지 확인한다.
              - 해당 KMS 키의 자동 회전을 켜고 계정 간 키 사용 정책은 변경하지 않는다.
              - 분석 역할에 kms:ListKeys만 허용해 키 목록이 보이도록 한다.
              - 계정 A의 해당 KMS 키 정책이 분석 역할의 필요한 키 사용을 허용하는지 확인한다.
              - KMS 키 정책은 유지하고 S3 버킷 정책에 kms:Decrypt 허용문만 추가한다.
      - id: Q15-06
        type: mcq
        title: Q15-06 · 보안·IAM
        explain: |
          <p>교대 사용자 회전은 한 사용자의 비밀번호를 바꾸는 동안 다른 사용자의 유효한 자격 증명을 제공한다. DB 권한을 두 사용자에 맞추고 회전용 관리자 비밀을 제공할 수 있으므로 관리형 회전 틀을 활용해 가용성과 코드 운영 축소 요구를 함께 만족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Secrets Manager의 단일 사용자 회전을 사용하고 인증 실패 시 현재 비밀값으로 연결을 재시도한다.</td>
          <td>단일 사용자 방식은 DB 비밀번호 변경과 현재 비밀 버전 전환 사이에 짧은 인증 거부 구간이 생길 수 있다. 재시도는 이를 완화하지만 회전 중 최초 신규 연결도 유효해야 한다는 요구와 다르다.</td>
          </tr>
          <tr>
          <td>Parameter Store SecureString 두 개와 예약 Lambda로 사용자 교대·DB 변경·활성 버전 전환을 구현한다.</td>
          <td>두 사용자 교대는 구현할 수 있지만 스케줄·단계별 실패·버전 전환 코드를 팀이 유지해야 해 지원되는 Secrets Manager 회전보다 운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>Secrets Manager의 단일 사용자 회전을 매월 배포 창에서 실행하고 그동안 신규 요청을 대기시킨다.</td>
          <td>배포 창 동안 대기는 회전을 조정할 수 있으나 신규 요청이 회전 중에도 접속해야 하는 가용성 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotation-strategy.html">단일·교대 사용자 회전 전략</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 주문 앱은 RDS MySQL의 공통 접근 역할을 부여받은 DB 사용자로 접속한다. 30일마다 비밀번호를 교체해야 하며 회전 도중 비밀값을
              조회한 신규 연결도 유효한 자격 증명을 받아야 한다. 동등한 권한의 사용자 두 명과 회전용 관리자 비밀을 사용할 수
              있다. 앱은 연결 생성 시 현재 비밀값을 조회한다. 별도 회전 스케줄러 코드를 가장 적게 운영할 설계는?
            answer: Secrets Manager의 교대 사용자 회전을 사용하고 앱이 현재 버전의 사용자 이름과 비밀번호로 연결한다.
            wrong:
              - Secrets Manager의 단일 사용자 회전을 사용하고 인증 실패 시 현재 비밀값으로 연결을 재시도한다.
              - Parameter Store SecureString 두 개와 예약 Lambda로 사용자 교대·DB 변경·활성 버전
                전환을 구현한다.
              - Secrets Manager의 단일 사용자 회전을 매월 배포 창에서 실행하고 그동안 신규 요청을 대기시킨다.
      - id: Q15-07
        type: mcq
        title: Q15-07 · 보안·IAM
        explain: |
          <p>WAF는 지원 웹 리소스의 HTTP 요청 조건을 검사하며 관리형 규칙과 속도 기반 규칙으로 해당 공격을 줄일 수 있다. 정상 요청의 오탐 여부도 확인하면서 적용해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Shield의 DDoS 보호만 사용하고 HTTP 요청 내용 검사 규칙은 구성하지 않는다.</td>
          <td>DDoS 보호만으로 로그인·주문 API의 SQL 패턴을 검사하는 요구를 충족하지 못한다. HTTP 계층의 WAF 규칙을 함께 검토해야 한다.</td>
          </tr>
          <tr>
          <td>ALB 보안 그룹에서 HTTP 본문에 SQL 구문이 포함된 패킷을 거부한다.</td>
          <td>SG는 주소·프로토콜·포트를 제어하지만 HTTP 본문의 SQL 패턴을 해석하는 방화벽은 아니다.</td>
          </tr>
          <tr>
          <td>ALB를 TLS 종료 NLB로 교체하고 보안 그룹의 TCP 443 허용만 유지한다.</td>
          <td>NLB의 TLS 종료와 포트 허용만으로 HTTP 본문의 SQL 패턴이나 요청 속도 기반 검사를 수행하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">AWS WAF</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 공개 ALB 뒤 주문 API에서 SQL 인젝션 패턴과 특정 IP의 과도한 HTTP 요청이 관찰된다. 정상 HTTPS 사용자는 유지해야 하며
              앱 수정 전까지 관리형 계층에서 해당 요청을 제한하려 한다. 현재 SG는 인터넷의 443만 허용한다. 가장 적절한
              조치는 무엇인가?
            answer: ALB에 WAF 웹 ACL을 연결하고 적절한 관리형·속도 기반 규칙을 관측하며 적용한다.
            wrong:
              - Shield의 DDoS 보호만 사용하고 HTTP 요청 내용 검사 규칙은 구성하지 않는다.
              - ALB 보안 그룹에서 HTTP 본문에 SQL 구문이 포함된 패킷을 거부한다.
              - ALB를 TLS 종료 NLB로 교체하고 보안 그룹의 TCP 443 허용만 유지한다.
      - id: Q15-08
        type: mcq
        title: Q15-08 · 보안·IAM
        explain: |
          <p>인증된 사용자가 단말에서 직접 AWS 리소스에 접근하려면 Identity pool의 임시 자격 증명과 제한된 역할을 사용할 수 있다. 로그인 인증과 사용자별 S3 인가는 각각 구성해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Cognito User pool의 JWT 문자열을 AWS 액세스 키 ID로 넣어 S3 SDK 요청에 서명한다.</td>
          <td>User pool JWT는 로그인 토큰이다. AWS SigV4 서명에 필요한 액세스 키와 세션 자격 증명 그 자체가 아니다.</td>
          </tr>
          <tr>
          <td>모든 앱 설치본에 같은 IAM 사용자 키를 넣고 앱 화면에서 다른 폴더를 숨긴다.</td>
          <td>공유 장기 키는 추출·재사용될 수 있다. UI에서 폴더를 숨겨도 AWS API 권한은 제한되지 않는다.</td>
          </tr>
          <tr>
          <td>업로드 버킷의 모든 객체에 익명 쓰기를 허용하고 로그인 화면만 별도로 유지한다.</td>
          <td>익명 쓰기는 로그인 사용자만 자기 경로에 업로드한다는 요구를 지키지 못하고 남용 위험을 만든다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html">Cognito 사용자·자격 증명 풀</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 모바일 앱 사용자는 소셜 로그인을 사용한다. 로그인 후 단말에서 자기 사용자 경로에만 S3 사진을 업로드해야 하고 단말에 장기 AWS 키를
              저장할 수 없다. 서버가 업로드 파일을 중계하지 않는 조건에서 적절한 설계는 무엇인가?
            answer: Cognito 인증 결과를 신뢰하는 Identity pool로 임시 AWS 자격 증명을 발급하고 역할 정책을 사용자 경로로
              제한한다.
            wrong:
              - Cognito User pool의 JWT 문자열을 AWS 액세스 키 ID로 넣어 S3 SDK 요청에 서명한다.
              - 모든 앱 설치본에 같은 IAM 사용자 키를 넣고 앱 화면에서 다른 폴더를 숨긴다.
              - 업로드 버킷의 모든 객체에 익명 쓰기를 허용하고 로그인 화면만 별도로 유지한다.
      - id: Q15-09
        type: mcq
        title: Q15-09 · 보안·IAM
        explain: |
          <p>IAM Identity Center는 직원의 다중 계정 접근과 권한 세트 배정을 중앙화한다. 회사 신원 공급자와 연동하고 그룹별 계정 권한을 관리하면 사람별 장기 키와 계정별 사용자 복제를 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>회사 IdP의 SAML 신뢰를 각 계정에 따로 구성하고 직무별 역할·정책과 계정 배정을 각각 수동 유지한다.</td>
          <td>SAML 역할 연동은 임시 접근을 제공할 수 있지만 계정별 신뢰와 역할 배정을 직접 관리해야 하므로 중앙 배정과 수동 운영 축소 요구에는 Identity Center가 더 적합하다.</td>
          </tr>
          <tr>
          <td>각 계정에 동일 이름의 IAM 사용자를 만들고 회사 암호와 같은 비밀번호를 수동 설정한다.</td>
          <td>계정마다 사용자와 암호를 복제하는 방식은 중앙 수명 주기 관리를 달성하지 못하고 수동 운영을 유지한다.</td>
          </tr>
          <tr>
          <td>Organizations에서 계정을 묶고 직무별 SCP의 Allow 문으로 각 직원의 AWS 접근 권한을 직접 부여한다.</td>
          <td>SCP는 계정의 권한 상한을 제어하며 직원 인증과 직무별 실제 작업 권한을 부여하는 중앙 접근 관리 기능을 대신하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html">IAM Identity Center</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 회사 직원 300명이 여러 AWS 계정에 접근한다. 입사·퇴사와 부서 이동을 기존 회사 신원 공급자에서 관리하며 계정마다 IAM 사용자를
              복제하는 운영을 없애고 싶다. 직무별 권한과 계정 배정을 중앙에서 관리하고 계정마다 연동을 수동 구성하는 부담도
              줄이려면 무엇이 적절한가?
            answer: IAM Identity Center를 회사 신원 공급자와 연동하고 그룹별 권한 세트를 계정에 배정한다.
            wrong:
              - 회사 IdP의 SAML 신뢰를 각 계정에 따로 구성하고 직무별 역할·정책과 계정 배정을 각각 수동 유지한다.
              - 각 계정에 동일 이름의 IAM 사용자를 만들고 회사 암호와 같은 비밀번호를 수동 설정한다.
              - Organizations에서 계정을 묶고 직무별 SCP의 Allow 문으로 각 직원의 AWS 접근 권한을 직접
                부여한다.
      - id: Q15-10
        type: mcq
        title: Q15-10 · 보안·IAM
        explain: |
          <p>변경 주체 감사와 구성 준수 평가는 서로 다른 요구다. CloudTrail에서 API 행위자를 조사하고 Config 기록·규칙으로 보안 그룹 구성의 이력과 지속적인 위반 평가를 수행한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>CloudTrail에서 S3 객체 읽기 데이터 이벤트만 조회해 보안 그룹 변경 행위자를 찾는다.</td>
          <td>S3 객체 읽기 기록은 EC2 보안 그룹 변경 API의 관리 이벤트가 아니다. 조사할 작업에 맞는 이벤트 유형을 사용해야 한다.</td>
          </tr>
          <tr>
          <td>CloudTrail 관리 이벤트는 수집하되 정기적인 수동 검토만 하고 공개 포트 구성의 지속 평가를 만들지 않는다.</td>
          <td>관리 API 감사로 변경 주체를 조사할 수는 있지만 공개 포트의 지속적인 구성 준수 평가 요구가 남는다. Config 규칙 같은 평가 경로가 필요하다.</td>
          </tr>
          <tr>
          <td>Inspector의 EC2 패키지 취약점 스캔만 구성하고 보안 그룹의 구성 규칙 평가는 생략한다.</td>
          <td>패키지 취약점 평가는 어떤 주체가 SG 규칙을 바꿨는지나 해당 구성의 지속 준수 여부를 모두 답하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-management-events-with-cloudtrail.html">CloudTrail 이벤트 로깅</a> · <a href="https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html">AWS Config</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 외부에서 SSH 접속이 가능해진 보안 그룹이 발견됐다. 보안 팀은 누가 규칙을 바꿨는지와 이후에도 비슷한 구성 위반을 지속 탐지하는 체계를
              모두 요구한다. 과거 CPU 사용량만으로는 변경 주체를 알 수 없었다. 적절한 조치 두 가지는 무엇인가?
            answer: AWS Config 기록·규칙으로 보안 그룹의 구성 변경과 허용하지 않는 공개 포트를 평가한다.
            wrong:
              - CloudTrail에서 S3 객체 읽기 데이터 이벤트만 조회해 보안 그룹 변경 행위자를 찾는다.
              - CloudTrail 관리 이벤트는 수집하되 정기적인 수동 검토만 하고 공개 포트 구성의 지속 평가를 만들지 않는다.
              - Inspector의 EC2 패키지 취약점 스캔만 구성하고 보안 그룹의 구성 규칙 평가는 생략한다.
            answers:
              - AWS Config 기록·규칙으로 보안 그룹의 구성 변경과 허용하지 않는 공개 포트를 평가한다.
              - CloudTrail 관리 이벤트로 보안 그룹 변경 API의 호출 주체와 시점을 조사한다.
            options:
              - CloudTrail에서 S3 객체 읽기 데이터 이벤트만 조회해 보안 그룹 변경 행위자를 찾는다.
              - AWS Config 기록·규칙으로 보안 그룹의 구성 변경과 허용하지 않는 공개 포트를 평가한다.
              - CloudTrail 관리 이벤트는 수집하되 정기적인 수동 검토만 하고 공개 포트 구성의 지속 평가를 만들지 않는다.
              - Inspector의 EC2 패키지 취약점 스캔만 구성하고 보안 그룹의 구성 규칙 평가는 생략한다.
              - CloudTrail 관리 이벤트로 보안 그룹 변경 API의 호출 주체와 시점을 조사한다.
      - id: Q15-11
        type: mcq
        title: Q15-11 · 보안·IAM
        explain: |
          <p>Object Lock compliance 보존은 설정 기간 동안 보호된 버전의 영구 삭제를 제한한다. 같은 객체 키의 새 버전 작성과 기존 보호 버전 삭제는 달라 후속 기록 요구와 양립할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 Object Lock의 governance 모드와 우회 권한을 모든 운영자에게 함께 준다.</td>
          <td>Governance 모드는 적절한 우회 권한으로 보존을 우회할 수 있어 관리자도 삭제할 수 없다는 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>버전 관리와 복제만 사용하고 원본·복제본의 영구 버전 삭제 권한은 운영자에게 유지한다.</td>
          <td>복제와 버전 관리는 보호 버전의 삭제 권한을 없애지 않는다. 같은 권한으로 원본·복제본을 영구 삭제할 수 있어 불변 보관 조건을 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>S3 Versioning만 켜고 모든 운영자에게 DeleteObjectVersion 권한을 유지한다.</td>
          <td>버전 관리는 이전 버전을 남기지만 DeleteObjectVersion 권한을 가진 주체의 영구 삭제를 막는 불변 보관은 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html">S3 Object Lock</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 감사 기록을 S3에서 7년 보관해야 한다. 기간 중에는 관리자 권한을 가진 운영자도 보호된 객체 버전을 영구 삭제할 수 없어야 하며 같은
              키로 후속 기록을 저장하는 일은 허용된다. 규정에 가장 맞는 저장 통제는 무엇인가?
            answer: S3 Object Lock의 compliance 모드로 필요한 객체 버전에 보존 기간을 설정한다.
            wrong:
              - S3 Object Lock의 governance 모드와 우회 권한을 모든 운영자에게 함께 준다.
              - 버전 관리와 복제만 사용하고 원본·복제본의 영구 버전 삭제 권한은 운영자에게 유지한다.
              - S3 Versioning만 켜고 모든 운영자에게 DeleteObjectVersion 권한을 유지한다.
      - id: Q15-12
        type: mcq
        title: Q15-12 · 보안·IAM
        explain: |
          <p>자동 회전은 키 재료를 갱신하지만 기존 저장 데이터를 일괄 재암호화하지 않는다. KMS는 기존 암호문을 읽을 수 있도록 이전 키 재료를 관리하므로 별도의 전체 재암호화 요구와 구분해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>키 ID가 유지되면 키 재료도 바뀌지 않으므로 회전 설정은 아무 효과가 없다.</td>
          <td>같은 키 식별자를 유지하면서 내부 키 재료를 교체하는 것이 자동 회전의 동작이다. 식별자 유지가 무효를 뜻하지 않는다.</td>
          </tr>
          <tr>
          <td>자동 회전을 켜는 순간 S3가 모든 기존 객체를 읽어 새 암호문으로 다시 저장한다.</td>
          <td>키 회전 설정은 기존 S3 객체를 자동으로 다시 쓰는 작업이 아니다. 재암호화가 요구되면 별도 작업을 계획해야 한다.</td>
          </tr>
          <tr>
          <td>이전 키 재료는 즉시 삭제되므로 회전 전에 모든 객체를 평문으로 내보내야 한다.</td>
          <td>정상적인 키 회전은 과거 데이터 복호화를 위해 이전 키 재료를 유지하므로 평문 반출은 필요하지 않다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html">KMS 키 회전</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: S3 암호화에 사용하는 고객 관리형 대칭 KMS 키의 자동 회전을 켰다. 감사 담당자는 기존 객체도 새 키 재료로 전부 다시 암호화됐다고
              보고하려 한다. 오래된 객체는 계속 읽혀야 한다. 현재 상태를 가장 정확히 설명한 것은 무엇인가?
            answer: 회전은 새 암호화에 쓸 키 재료를 바꾸며 기존 암호문은 보존된 이전 키 재료로 복호화할 수 있다.
            wrong:
              - 키 ID가 유지되면 키 재료도 바뀌지 않으므로 회전 설정은 아무 효과가 없다.
              - 자동 회전을 켜는 순간 S3가 모든 기존 객체를 읽어 새 암호문으로 다시 저장한다.
              - 이전 키 재료는 즉시 삭제되므로 회전 전에 모든 객체를 평문으로 내보내야 한다.
      - id: Q15-13
        type: mcq
        title: Q15-13 · 보안·IAM
        explain: |
          <p>GuardDuty와 Inspector는 계정과 리전 범위를 맞춰 조직 관리해야 한다. 사용 중인 두 리전에서 신규 계정의 탐지와 EC2 패키지 스캔을 자동 활성화하면 원천 탐지·평가를 중앙 관리하면서 자체 수집·분석 코드를 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 리전에 GuardDuty 조직 관리를 설정하고 Inspector ECR 이미지 스캔 결과를 Security Hub에 집계한다.</td>
          <td>GuardDuty와 이미지 취약점 범위는 갖추지만 EC2 호스트에 설치된 패키지의 취약점 평가는 ECR 이미지 스캔과 다른 범위다.</td>
          </tr>
          <tr>
          <td>두 리전의 CloudTrail·VPC 흐름 로그·SSM 패키지 목록을 모아 예약 Lambda로 위협·CVE 규칙을 실행한다.</td>
          <td>로그와 패키지 목록으로 자체 분석을 만들 수 있지만 규칙 작성·CVE 대조·코드 운영을 팀이 부담한다. 관리형 탐지·평가를 직접 사용하는 선택보다 운영 요구에 불리하다.</td>
          </tr>
          <tr>
          <td>서울에서 GuardDuty·Inspector의 조직 자동 활성화를 구성하고 두 리전의 Config 리소스 목록을 서울에 집계한다.</td>
          <td>Config 리소스 집계는 도쿄의 GuardDuty 탐지나 Inspector EC2 스캔을 활성화하지 않는다. 탐지 서비스도 리전별 범위가 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html">GuardDuty 다중 계정·리전 관리</a> · <a href="https://docs.aws.amazon.com/inspector/latest/user/managing-multiple-accounts.html">Inspector 조직 관리</a> · <a href="https://docs.aws.amazon.com/inspector/latest/user/designating-admin.html">Inspector 리전별 위임 관리자</a> · <a href="https://docs.aws.amazon.com/inspector/latest/user/adding-member-accounts.html">신규 계정 스캔 자동 활성화</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 회사는 Organizations의 30개 계정에서 서울·도쿄의 EC2를 운영한다. 의심스러운 자격 증명 사용·통신 탐지와 EC2 패키지
              CVE 평가를 중앙 보안 계정에서 관리해야 한다. 신규 멤버 계정에도 같은 범위를 자동 적용해야 하며 자체 탐지
              규칙·수집 코드는 줄이려 한다. 가장 적절한 구성은?
            answer: 서울·도쿄에서 GuardDuty·Inspector 조직 위임 관리와 신규 계정의 GuardDuty·EC2 스캔 자동 활성화를
              설정한다.
            wrong:
              - 두 리전에 GuardDuty 조직 관리를 설정하고 Inspector ECR 이미지 스캔 결과를 Security
                Hub에 집계한다.
              - 두 리전의 CloudTrail·VPC 흐름 로그·SSM 패키지 목록을 모아 예약 Lambda로 위협·CVE 규칙을
                실행한다.
              - 서울에서 GuardDuty·Inspector의 조직 자동 활성화를 구성하고 두 리전의 Config 리소스 목록을
                서울에 집계한다.
      - id: Q15-14
        type: mcq
        title: Q15-14 · 보안·IAM
        explain: |
          <p>사용자 지정 식별자는 사내 형식의 정규식과 키워드 근접 조건을 조합할 수 있다. 알려진 공개 테스트 값은 허용 목록으로 제외하면 전체 번호 형식을 숨기지 않으면서 분류 정확도를 높이고 자체 검사 코드를 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Macie 사용자 지정 데이터 식별자에 번호 정규식을 설정하고 발견된 번호를 모두 민감정보 결과로 분류한다.</td>
          <td>정규식은 실제 번호를 찾지만 같은 형식의 공개 예시도 검출해 주어진 문맥 조건과 테스트 값 예외를 활용하지 못한다.</td>
          </tr>
          <tr>
          <td>Macie 허용 목록에 CUST-와 숫자 8자리의 정규식을 등록하고 관리형 식별자로 개인정보를 검색한다.</td>
          <td>허용 목록에 전체 번호 형식을 넣으면 실제 고객 번호까지 검사 결과에서 제외된다. 관리형 식별자가 사내 고유 번호 형식을 대신 정의하지 않는다.</td>
          </tr>
          <tr>
          <td>S3 객체 생성 이벤트로 Lambda를 실행해 정규식·근접 조건·테스트 값 제외 로직을 구현하고 결과를 DynamoDB에 저장한다.</td>
          <td>요구한 분류는 구현 가능하지만 파일 파싱·검사·결과 저장·실패 재처리 코드를 팀이 운영해야 한다. 지원 형식에서 Macie 기능을 조합하는 것보다 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/macie/latest/user/custom-data-identifiers.html">사용자 지정 데이터 식별자</a> · <a href="https://docs.aws.amazon.com/macie/latest/user/allow-lists-options.html">Macie 허용 목록</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: S3 데이터 레이크의 지원되는 텍스트 파일에서 사내 고객 번호 유출을 찾으려 한다. 번호는 CUST-와 숫자 8자리지만 공개 주문 예시에도
              같은 형식이 쓰인다. 실제 개인정보 문서에는 번호 앞 20자 안에 customer_id가 있고 공개 테스트 값 목록은
              별도 관리된다. 자동 분류를 사용하면서 오탐과 자체 코드 운영을 줄이는 구성은?
            answer: Macie 사용자 지정 데이터 식별자에 번호 정규식·customer_id 근접 조건을 설정하고 공개 테스트 값 허용 목록을
              적용한다.
            wrong:
              - Macie 사용자 지정 데이터 식별자에 번호 정규식을 설정하고 발견된 번호를 모두 민감정보 결과로 분류한다.
              - Macie 허용 목록에 CUST-와 숫자 8자리의 정규식을 등록하고 관리형 식별자로 개인정보를 검색한다.
              - S3 객체 생성 이벤트로 Lambda를 실행해 정규식·근접 조건·테스트 값 제외 로직을 구현하고 결과를
                DynamoDB에 저장한다.
      - id: Q15-15
        type: mcq
        title: Q15-15 · 보안·IAM
        explain: |
          <p>EC2 역할의 임시 자격 증명으로 전환하면 배포 파일에 장기 키를 넣을 필요가 줄어든다. 다만 새 역할 연결만으로 이미 유출된 사용자 키는 폐기되지 않으므로 전환을 검증하고 별도로 비활성화·삭제해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>장기 키에 MFA 조건만 추가하되 앱 자격 증명 전달과 유출 키 수명 주기는 바꾸지 않는다.</td>
          <td>무인 앱의 자격 증명 구조를 개선하지 않으며 MFA 조건만으로 이미 사용 중인 키의 수명 주기와 앱 연동 문제를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>EC2 인바운드 SG를 관리 IP로 제한하면 외부에서 쓰는 유출 키도 더 이상 AWS API를 호출할 수 없다.</td>
          <td>EC2 인바운드 규칙은 외부 공격자가 자신의 환경에서 유출 키로 보내는 AWS API 요청을 차단하지 않는다.</td>
          </tr>
          <tr>
          <td>장기 키를 AMI 대신 사용자 데이터에 옮기고 기존 키는 호환성을 위해 활성화 상태로 둔다.</td>
          <td>사용자 데이터로 옮겨도 장기 비밀값을 배포하는 구조와 기존 유출 키의 외부 사용 가능성이 남는다.</td>
          </tr>
          </tbody></table>
