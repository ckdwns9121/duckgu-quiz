      - id: saa-r2-Q17-11
        source_id: Q17-11
        type: mcq
        title: Q17-11 · EC2·확장·비용
        explain: |
          <p>서버 수평 확장과 교체를 위해 세션·파일을 인스턴스 생명 주기 밖의 공유 저장소로 외부화해야 한다. 세션·파일을 교체 가능한 앱 인스턴스 밖으로 옮겨야 요청이 다른 서버로 가도 상태를 찾을 수 있다. 외부 저장소 자체의 가용성과 보존 정책도 함께 설계해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>sticky session 유지 시간을 늘리고 각 EC2 로컬 상태와 파일을 더 큰 EBS에 저장한다.</td>
          <td>더 큰 디스크와 긴 고정 세션은 다른 서버가 로컬 상태를 즉시 공유하게 하지 않으며 원래 서버 장애 문제도 남는다.</td>
          </tr>
          <tr>
          <td>인스턴스 종료 시 세션·파일을 백업하고 다음 서버 시작 때 백업을 복원한다.</td>
          <td>종료 시 백업은 예고 없는 장애에 실행되지 않을 수 있고 즉시 공유·연속 접근 요구를 만족시키기 어렵다.</td>
          </tr>
          <tr>
          <td>같은 AZ의 서버 수를 늘리고 세션·파일을 각 EC2 로컬에 복제 없이 저장한다.</td>
          <td>같은 AZ에 용량을 늘려도 서버·AZ 장애 때 로컬 데이터가 다른 서버에 자동 공유되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html">ALB 대상 그룹 속성</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EC%84%B8%EC%85%98%EC%9D%84-%EC%99%B8%EB%B6%80%EB%A1%9C-%EC%98%AE%EA%B2%A8-%EC%84%9C%EB%B2%84-%EA%B5%90%EC%B2%B4%EB%A5%BC-%ED%97%88%EC%9A%A9%ED%95%98%EA%B8%B0">서버 수평 확장과 교체를 위해 세션·파일을 인스턴스 생명 주기 밖의 공유 저장소로 외부화해야 한다.</a></p>
        quizzes:
          - q: 웹 앱은 로그인 세션을 EC2 메모리에, 업로드 파일을 인스턴스 로컬 디스크에 둔다. ALB sticky session으로 평소 동작하지만
              ASG 교체나 AZ 장애 뒤 재로그인·파일 유실이 발생한다. 앱 코드를 바꿀 수 있으며 인스턴스가 교체돼도 다른 서버가
              즉시 같은 사용자 상태와 파일을 읽어야 한다. 적절한 구성은?
            answer: 세션은 가용성을 갖춘 ElastiCache·DynamoDB 등에, 업로드는 S3에 두고 앱 서버를 교체한다.
            wrong:
              - sticky session 유지 시간을 늘리고 각 EC2 로컬 상태와 파일을 더 큰 EBS에 저장한다.
              - 인스턴스 종료 시 세션·파일을 백업하고 다음 서버 시작 때 백업을 복원한다.
              - 같은 AZ의 서버 수를 늘리고 세션·파일을 각 EC2 로컬에 복제 없이 저장한다.
      - id: saa-r2-Q17-12
        source_id: Q17-12
        type: mcq
        title: Q17-12 · EC2·확장·비용
        explain: |
          <p>실행 템플릿 변경과 현재 인스턴스 교체는 별도이므로 정상 용량·준비 시간을 둔 점진적 refresh가 필요하다. 실행 템플릿 변경은 기존 인스턴스를 자동으로 이미지 교체하지 않는다. Instance refresh 같은 점진 교체 절차와 상태·준비 시간 설정으로 서비스 용량을 유지하면서 새 구성을 검증해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>그룹의 희망 용량은 그대로 두고 다음 자연 장애 때 새 이미지가 적용될 때까지 기다린다.</td>
          <td>템플릿 변경은 이후 시작할 인스턴스에 적용될 뿐 현재 서버 전체의 계획된 교체를 완료하지 못한다.</td>
          </tr>
          <tr>
          <td>그룹의 기존 인스턴스를 동시에 종료하고 희망 용량에 따라 새 AMI 서버를 다시 만든다.</td>
          <td>기존 정상 용량을 한꺼번에 없애고 5분 준비를 기다리면 연속 요청 처리 요구를 충족하지 못할 수 있다.</td>
          </tr>
          <tr>
          <td>Systems Manager로 기존 서버의 실행 파일만 새 AMI 버전과 같게 직접 패치한다.</td>
          <td>인스턴스 내 직접 패치를 피하고 AMI 기반 교체를 한다는 배포 요구와 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh.html">ASG Instance refresh</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EC%83%88-%EC%9D%B4%EB%AF%B8%EC%A7%80-%EB%B0%B0%ED%8F%AC%EC%99%80-%EB%90%98%EB%8F%8C%EB%A6%AC%EA%B8%B0%EC%9D%98-%EB%B2%94%EC%9C%84">실행 템플릿 변경과 현재 인스턴스 교체는 별도이므로 정상 용량·준비 시간을 둔 점진적 refresh가 필요하다.</a></p>
        quizzes:
          - q: ASG의 새 AMI를 담은 실행 템플릿 버전을 준비했다. 요청은 계속 처리해야 하고 기존 서버에서 직접 패치하지 않으려 한다. 그룹에는
              최소 정상 용량을 유지하며 순차 교체할 여유가 있다. 새 이미지의 앱 준비는 5분 걸린다. 템플릿을 그룹에 적용한 다음
              수행할 적절한 배포는?
            answer: 최소 정상 용량과 준비 시간을 지정한 Instance refresh로 새 인스턴스를 점진 교체한다.
            wrong:
              - 그룹의 희망 용량은 그대로 두고 다음 자연 장애 때 새 이미지가 적용될 때까지 기다린다.
              - 그룹의 기존 인스턴스를 동시에 종료하고 희망 용량에 따라 새 AMI 서버를 다시 만든다.
              - Systems Manager로 기존 서버의 실행 파일만 새 AMI 버전과 같게 직접 패치한다.
      - id: saa-r2-Q17-13
        source_id: Q17-13
        type: mcq
        title: Q17-13 · EC2·확장·비용
        explain: |
          <p>복구 시점의 실제 확장 가능 용량과 의존 서비스의 재시도 폭증을 별도 장애 원인으로 보완해야 한다. 축소 환경의 존재는 실제 전체 부하 복구 능력과 다르다. 필요한 용량·할당량을 확보하고 동시 재시도 폭증을 제한해야 하며 결제는 재처리 시 중복 결과가 나지 않는지 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>결제 요청의 중복 식별자만 추가하고 기존의 즉시·무제한 재시도 횟수를 유지한다.</td>
          <td>중복 식별자는 이중 결제 위험을 줄일 수 있지만 무제한 즉시 재시도에 의한 부하 증폭을 막지 못한다.</td>
          </tr>
          <tr>
          <td>복구 ASG의 max만 크게 올리고 리전 할당량 승인은 트래픽 전환 뒤 요청한다.</td>
          <td>ASG max는 계정 할당량을 올리지 않으며 사고 뒤 승인 대기는 RTO에 포함된다.</td>
          </tr>
          <tr>
          <td>축소 환경의 ALB 상태 확인 주기를 줄이고 서버 수와 재시도 동작은 유지한다.</td>
          <td>빠른 상태 확인은 복구 용량 부족이나 결제 재시도 폭증의 원인을 해결하지 않는다.</td>
          </tr>
