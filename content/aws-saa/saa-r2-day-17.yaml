          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>전체 요청 수의 고정 목표 추적 정책을 사용하고 서버 준비 시간은 기본값으로 둔다.</td>
          <td>전체 요청 수는 용량을 늘려도 비례해 내려가지 않으며 준비 시간도 부하 계산에 반영하지 못한다.</td>
          </tr>
          <tr>
          <td>08:50에 desired·min·max=200으로 고정하고 신청 기간 동안 유지한다.</td>
          <td>처리 용량은 확보하지만 초기 필요 40대보다 훨씬 큰 200대를 계속 유지해 이후 유휴 비용 절감 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>09:00에 desired·min=40, max=200으로 예약 확장하고 초기 구간 뒤 min을 낮춘다.</td>
          <td>08분의 초기화가 필요하므로 09시에 시작하면 신청 첫 구간에 준비된 40대가 없다.</td>
          </tr>
          </tbody></table>
