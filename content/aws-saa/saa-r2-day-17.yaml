      - id: saa-r2-Q17-14
        source_id: Q17-14
        type: mcq
        title: Q17-14 · EC2·확장·비용
        explain: |
          <p>EBS 기반 인스턴스의 중지·시작은 현재 인스턴스 ID와 디스크 데이터를 유지하면서 stopped 상태의 컴퓨팅 실행 요금을 줄인다. 앱 프로세스만 멈추면 EC2 사용 요금은 남고, 종료 후 새 인스턴스 연결은 ID를 바꾼다. 최대 절전은 이번 구성에서 지원되지 않아 새 구성으로 이관해야 하므로 요구에 맞지 않는다. 중지해도 EBS·별도 리소스·기존 약정 비용까지 사라지는 것은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>매일 업무가 끝나면 앱 프로세스만 정지하고 EC2는 다음 날까지 실행 상태로 둔다.</td>
          <td>애플리케이션 프로세스만 멈추어도 EC2는 실행 상태이므로 야간 컴퓨팅 사용 요금이 계속 발생한다.</td>
          </tr>
          <tr>
          <td>루트 EBS를 보존하며 EC2를 종료하고 다음 날 새 인스턴스에 해당 볼륨을 연결한다.</td>
          <td>디스크를 보존해 새 인스턴스에 붙이는 복구는 가능하지만 기존 인스턴스 ID 유지 요구를 어기며 매일 재생성 작업이 추가된다.</td>
          </tr>
          <tr>
          <td>최대 절전을 지원하는 새 인스턴스로 디스크를 이관한 뒤 매일 최대 절전·재개한다.</td>
          <td>지원 구성으로 이관하면 최대 절전할 수 있지만 현재 인스턴스 ID를 유지하고 이관하지 않는다는 요구를 어긴다. RAM 복원도 요구되지 않았다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html">EC2 인스턴스 수명 주기</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%EC%A4%91%EC%A7%80%EC%B5%9C%EB%8C%80-%EC%A0%88%EC%A0%84%EC%A2%85%EB%A3%8C%EC%99%80-%EB%8D%B0%EC%9D%B4%ED%84%B0">현재 인스턴스 ID·EBS 데이터를 유지하고 최대 절전 미지원 구성에서 이관 없이 야간 컴퓨팅 실행 요금을 최소화해야 한다.</a> · <a href="/study/lessons/deep-dive/day-02.html#%EC%A4%91%EC%A7%80%EC%B5%9C%EB%8C%80-%EC%A0%88%EC%A0%84%EC%A2%85%EB%A3%8C%EC%99%80-%EB%8D%B0%EC%9D%B4%ED%84%B0">현재 인스턴스 ID·EBS 데이터를 유지하고 최대 절전 미지원 구성에서 이관 없이 야간 컴퓨팅 실행 요금을 최소화해야 한다.</a> · <a href="/study/lessons/deep-dive/day-02.html#%EC%A4%91%EC%A7%80%EC%B5%9C%EB%8C%80-%EC%A0%88%EC%A0%84%EC%A2%85%EB%A3%8C%EC%99%80-%EB%8D%B0%EC%9D%B4%ED%84%B0">최대 절전은 지원 OS·인스턴스와 사전 구성이 필요하며 임의의 실행 인스턴스에서 바로 사용할 수 없다.</a></p>
        quizzes:
          - q: EBS 루트 볼륨을 쓰는 개발 EC2는 평일 업무 시간에만 필요하다. 현재 인스턴스 ID와 디스크 데이터를 유지해야 하며 RAM 복원은
              필요 없다. 현재 OS·인스턴스 구성은 최대 절전을 지원하지 않는다. 다른 인스턴스로 이관하지 않고 야간 실행 요금과
              반복 운영 작업을 가장 줄일 방법은?
            answer: 매일 업무가 끝나면 EC2를 중지하고 다음 업무 시작 전에 같은 인스턴스를 시작한다.
            wrong:
              - 매일 업무가 끝나면 앱 프로세스만 정지하고 EC2는 다음 날까지 실행 상태로 둔다.
              - 루트 EBS를 보존하며 EC2를 종료하고 다음 날 새 인스턴스에 해당 볼륨을 연결한다.
              - 최대 절전을 지원하는 새 인스턴스로 디스크를 이관한 뒤 매일 최대 절전·재개한다.
      - id: saa-r2-Q17-15
        source_id: Q17-15
        type: mcq
        title: Q17-15 · EC2·확장·비용
        explain: |
          <p>HostId는 새 인스턴스를 등록한 물리 호스트에 배치하고 host affinity는 중지 후 같은 호스트로 돌아오게 한다. 최초 배치만 맞추고 기본 affinity를 쓰면 다음 시작 때 다른 호스트로 이동할 수 있다. Dedicated Instances는 특정 호스트 ID와 소켓·코어 배치를 직접 관리하는 Dedicated Hosts와 다르다. 지문에서 속성의 의미를 제공했으므로 이를 BYOL의 최초 배치·재시작 조건에 적용해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>호환 Dedicated Hosts 전체의 자동 배치를 허용하고 기본 affinity로 실행한다.</td>
          <td>자동 배치의 호환 호스트 범위가 등록된 두 대보다 넓고 기본 affinity는 같은 호스트 재시작을 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>등록 HostId로 최초 배치하되 기본 affinity를 사용해 재시작 위치를 자동 선택한다.</td>
          <td>최초 배치만 맞추어도 기본 affinity에서 재시작은 다른 사용 가능한 호스트로 옮겨질 수 있다.</td>
          </tr>
          <tr>
          <td>Dedicated Instances 테넌시를 사용하고 인스턴스 크기를 계약의 코어 수에 맞춘다.</td>
          <td>Dedicated Instances의 전용 하드웨어 격리는 특정 물리 호스트 ID·소켓·코어 배치 제어와 같지 않다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-understanding.html">Dedicated Host 배치와 affinity</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-understanding.html">Dedicated Host 배치와 affinity</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%EB%B0%B0%EC%B9%98-%EA%B7%B8%EB%A3%B9%EA%B3%BC-dedicated-host">특정 물리 호스트의 라이선스 준수를 위해 최초 배치와 재시작 위치를 모두 통제해야 한다.</a></p>
        quizzes:
          - q: 소켓·코어 기반 BYOL 계약은 등록된 전용 물리 호스트 두 대에서만 소프트웨어 실행을 허용한다. 회사 계정에는 다른 Dedicated
              Hosts도 있다. 새 서버와 야간 중지 후 재시작한 서버가 등록된 두 대를 벗어나면 안 된다. Host
              affinity는 같은 호스트 재시작을, HostId는 최초 배치 대상을 지정한다고 할 때 적절한 설계는?
            answer: 등록 Dedicated Hosts의 HostId를 지정해 배치하고 인스턴스에 Host affinity를 적용한다.
            wrong:
              - 호환 Dedicated Hosts 전체의 자동 배치를 허용하고 기본 affinity로 실행한다.
              - 등록 HostId로 최초 배치하되 기본 affinity를 사용해 재시작 위치를 자동 선택한다.
              - Dedicated Instances 테넌시를 사용하고 인스턴스 크기를 계약의 코어 수에 맞춘다.
