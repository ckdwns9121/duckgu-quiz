        quizzes:
          - q: 매주 월요일 09시에 신청이 열리며 최초 부하에는 준비된 서버 40대가 필요하다. 새 서버는 8분 후 요청을 처리한다. 이후 수요는 최대
              200대까지 변하고 ALB 대상당 요청 수가 서버 부하를 잘 나타낸다. 시작부터 처리하고 이후 유휴 비용도 줄일 조치
