id: saa-r2-day-17
name: EC2·확장·비용
part: 17일 차
color: "#8b5cf6"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: saa-r2-Q17-01
        source_id: Q17-01
        type: mcq
        title: Q17-01 · EC2·확장·비용
        explain: |
          <p>중단 가능한 비정기 작업은 Spot을 활용하되 여러 용량 풀과 가격·가용 용량을 함께 고려해야 한다. 패밀리·AZ가 다른 풀을 사용하면 단일 풀의 회수 위험에 대한 의존을 낮춘다. Price-capacity-optimized는 가용 용량과 가격을 함께 고려한다. 작업이 매월 짧게 실행되고 상시 소비가 없으므로 장기 최대 용량 약정보다 Spot과 재시도 특성을 활용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>가장 싼 Spot 유형 하나와 AZ 하나를 고정하고 그 풀에서만 작업자를 재시작한다.</td>
          <td>가격만 보고 풀을 하나로 좁히면 해당 풀의 용량 부족·회수에 집중 노출되어 재작업을 줄이는 요구에 불리하다.</td>
          </tr>
          <tr>
          <td>여러 AZ에서 온디맨드 최대 용량을 사용하고 작업이 끝나면 모든 인스턴스를 종료한다.</td>
          <td>중단 위험은 줄지만 재시도·마감 여유를 활용해 비용을 낮추는 Spot보다 비싼 사용 방식이다.</td>
          </tr>
          <tr>
          <td>최대 동시 사용량에 맞춘 1년 Compute Savings Plans로 온디맨드 작업자를 실행한다.</td>
          <td>매달 한 주만 쓰는 최대 용량을 시간별로 약정하면 나머지 시간의 미사용 약정 비용이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-fleet-allocation-strategy.html">Spot 할당 전략</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#spot-%EC%A4%91%EB%8B%A8%EA%B3%BC-%EC%9A%A9%EB%9F%89-%ED%92%80">중단 가능한 비정기 작업은 Spot을 활용하되 여러 용량 풀과 가격·가용 용량을 함께 고려해야 한다.</a> · <a href="/study/lessons/deep-dive/day-02.html#spot-%EC%A4%91%EB%8B%A8%EA%B3%BC-%EC%9A%A9%EB%9F%89-%ED%92%80">중단 가능한 비정기 작업은 Spot을 활용하되 여러 용량 풀과 가격·가용 용량을 함께 고려해야 한다.</a></p>
        quizzes:
          - q: 매달 한 주 동안만 동영상 변환 작업을 실행한다. 작업은 여러 x86 패밀리·AZ에서 실행할 수 있고 결과와 체크포인트를 S3에 저장한다.
              회수되면 재시도할 수 있으며 마감에는 여유가 있다. 월 내내 소비할 컴퓨팅 약정은 없다. 온디맨드보다 비용을 낮추면서
              중단 재작업도 줄이려면 적절한 구매·배치 조합은?
            answer: 여러 패밀리·AZ의 Spot 풀을 허용하고 가격과 용량을 고려하는 할당 전략을 사용한다.
            wrong:
              - 가장 싼 Spot 유형 하나와 AZ 하나를 고정하고 그 풀에서만 작업자를 재시작한다.
              - 여러 AZ에서 온디맨드 최대 용량을 사용하고 작업이 끝나면 모든 인스턴스를 종료한다.
              - 최대 동시 사용량에 맞춘 1년 Compute Savings Plans로 온디맨드 작업자를 실행한다.
      - id: saa-r2-Q17-02
        source_id: Q17-02
        type: mcq
        title: Q17-02 · EC2·확장·비용
        explain: |
          <p>인스턴스 구성보다 시간당 기본 사용액을 약정하고 EC2·Fargate·Lambda로 적용 범위를 유지하는 Compute Savings Plans가 맞다. Compute Savings Plans는 적용 대상 EC2 사용 구성 변화와 Fargate·Lambda까지 포괄하는 유연성이 있다. 시간당 약정은 미사용이어도 남으므로 안정적으로 소비하는 범위와 초과량을 따로 판단한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현재 리전·유형의 Convertible RI를 구매하고 Fargate 이전 때까지 교환한다.</td>
          <td>Convertible RI 교환도 EC2 예약 할인 범위 안의 변경이며 Fargate·Lambda 사용 할인으로 전환하는 상품이 아니다.</td>
          </tr>
          <tr>
          <td>현재 리전·패밀리의 EC2 Instance Savings Plans를 기본 사용액만큼 구매한다.</td>
          <td>EC2 Instance Savings Plans는 선택 리전·패밀리 범위를 벗어나는 EC2와 예정한 Fargate·Lambda까지 포괄하지 않는다.</td>
          </tr>
          <tr>
          <td>현재 AZ·인스턴스 유형의 Standard RI를 기본 사용량에 맞춰 구매한다.</td>
          <td>현재 AZ·구성의 RI 할인은 다양한 리전·패밀리 및 Fargate·Lambda 사용으로 자동 이어지지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html">Savings Plans 유형</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">인스턴스 구성보다 시간당 기본 사용액을 약정하고 EC2·Fargate·Lambda로 적용 범위를 유지하는 Compute Savings Plans가 맞다.</a> · <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">인스턴스 구성보다 시간당 기본 사용액을 약정하고 EC2·Fargate·Lambda로 적용 범위를 유지하는 Compute Savings Plans가 맞다.</a></p>
        quizzes:
          - q: 앱은 앞으로 1년 동안 시간당 기본 컴퓨팅 사용액을 꾸준히 유지할 것으로 예상된다. 그동안 EC2의 패밀리·리전을 바꾸고 일부 기능을
              Fargate·Lambda로 옮길 계획이다. 용량 확보는 따로 처리하며, 변경 후에도 할인 적용을 유지하는 것이
              우선이다. 어떤 약정이 적절한가?
            answer: Compute Savings Plans를 꾸준히 소비할 기본 사용액 범위로 구매한다.
            wrong:
              - 현재 리전·유형의 Convertible RI를 구매하고 Fargate 이전 때까지 교환한다.
              - 현재 리전·패밀리의 EC2 Instance Savings Plans를 기본 사용액만큼 구매한다.
              - 현재 AZ·인스턴스 유형의 Standard RI를 기본 사용량에 맞춰 구매한다.
      - id: saa-r2-Q17-03
        source_id: Q17-03
        type: mcq
        title: Q17-03 · EC2·확장·비용
        explain: |
          <p>실행 용량 부족은 요금 할인과 별개이므로 지정 AZ의 용량 예약을 별도로 구성해야 한다. 온디맨드 용량 예약은 특정 AZ에서 조건에 맞는 실행 용량을 확보하는 기능이다. 할인 상품만으로 부족 용량이 보장되지 않으며 사용하지 않는 예약 용량에도 비용이 발생할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>리전 범위의 Standard RI를 지정 사양으로 구매하고 필요한 AZ에서 시작한다.</td>
          <td>리전 범위 RI는 할인용이며 지정 AZ의 용량 예약을 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>훈련 때 여러 AZ에서 온디맨드 시작을 재시도하도록 복구 자동화를 변경한다.</td>
          <td>재시도와 AZ 분산은 가용성에 도움이 될 수 있지만 이번에는 같은 AZ·사양의 용량을 사전 확보해야 한다.</td>
          </tr>
          <tr>
          <td>Compute Savings Plans의 시간당 약정 금액을 훈련 최대 사용량까지 늘린다.</td>
          <td>Savings Plans는 할인 약정이며 지정 AZ에 실행 가능한 용량을 확보하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html">EC2 용량 예약</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html">RI 범위와 용량</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">실행 용량 부족은 요금 할인과 별개이므로 지정 AZ의 용량 예약을 별도로 구성해야 한다.</a></p>
        quizzes:
          - q: 복구 훈련에서 지정 AZ의 온디맨드 EC2 시작이 용량 부족으로 실패했다. 계정 할당량과 서브넷 IP는 충분하다. 다음 분기 훈련에도 같은
              AZ·사양이 필요하며 기존 Savings Plans 할인은 계속 활용하려 한다. 추가 할인 약정이 아니라 실행 용량을
              확보하는 직접적인 방법은?
            answer: 지정 AZ·사양의 온디맨드 용량 예약을 구성하고 인스턴스 매칭과 미사용 요금을 확인한다.
            wrong:
              - 리전 범위의 Standard RI를 지정 사양으로 구매하고 필요한 AZ에서 시작한다.
              - 훈련 때 여러 AZ에서 온디맨드 시작을 재시도하도록 복구 자동화를 변경한다.
              - Compute Savings Plans의 시간당 약정 금액을 훈련 최대 사용량까지 늘린다.
      - id: saa-r2-Q17-04
        source_id: Q17-04
        type: mcq
        title: Q17-04 · EC2·확장·비용
        explain: |
          <p>리전 RI의 적용 가능한 크기·AZ 유연성을 사용하고 동일 정규화 사용량만 구매해야 한다. 지원되는 Linux/UNIX·기본 테넌시 리전 RI는 같은 패밀리 안에서 인스턴스 크기와 AZ 유연성이 있다. Large 네 대와 xlarge 두 대의 정규화 사용량이 같으므로 리전 large 네 개가 변경 전후 전체 사용량에 맞는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현재 AZ 범위 m6i.large Standard RI 네 개를 구매한다.</td>
          <td>AZ 범위 RI는 지정 AZ·크기의 용량과 할인 조건을 사용하므로 예정된 크기·AZ 변경 전체에 리전 유연성을 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>리전 범위 m6i.2xlarge Standard RI 두 개를 구매한다.</td>
          <td>2xlarge 두 대는 xlarge 두 대보다 정규화 용량이 두 배여서 미사용 예약이 생긴다.</td>
          </tr>
          <tr>
          <td>리전 범위 m6i.xlarge Standard RI 한 개를 구매한다.</td>
          <td>xlarge 한 대는 현재와 예정된 정규화 사용량의 절반만 충당한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html">RI 범위와 크기 유연성</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/apply_ri.html">RI 정규화 적용</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">리전 RI의 적용 가능한 크기·AZ 유연성을 사용하고 동일 정규화 사용량만 구매해야 한다.</a> · <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">리전 RI의 적용 가능한 크기·AZ 유연성을 사용하고 동일 정규화 사용량만 구매해야 한다.</a></p>
        quizzes:
          - q: Linux/UNIX 기본 테넌시의 m6i.large 네 대를 1년간 사용하며 다음 달에는 m6i.xlarge 두 대로 바꾼다. 두 구성의
              정규화 사용량은 같고 AZ 배치도 바뀔 수 있다. 다른 패밀리로 옮길 계획과 용량 예약 요구는 없다. Standard
              RI로 전체 사용량에 할인받되 예약을 과다 구매하지 않을 선택은?
            answer: AZ에 한정하지 않은 m6i.large Standard RI 네 개를 구매한다.
            wrong:
              - 현재 AZ 범위 m6i.large Standard RI 네 개를 구매한다.
              - 리전 범위 m6i.2xlarge Standard RI 두 개를 구매한다.
              - 리전 범위 m6i.xlarge Standard RI 한 개를 구매한다.
      - id: saa-r2-Q17-05
        source_id: Q17-05
        type: mcq
        title: Q17-05 · EC2·확장·비용
        explain: |
          <p>정확한 /api와 하위 경로 /api/<em>를 모두 포함하되 더 넓은 /api</em>와 먼저 일치하는 포괄 규칙은 피해야 한다. 정확한 /api와 그 아래 /api/*를 함께 조건으로 지정해야 경계가 맞는다. /apiv2는 두 조건에 일치하지 않아 기본 카탈로그로 간다. 포괄적인 규칙을 먼저 놓으면 이후 API 규칙이 실행되지 않으므로 우선순위도 중요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>우선순위 10에 /api/*→API를 두고 기본 동작을 카탈로그로 설정한다.</td>
          <td>/api/*는 끝에 슬래시가 없는 정확한 /api 요청을 포함하지 않는다.</td>
          </tr>
          <tr>
          <td>우선순위 10에 /<em>→카탈로그, 20에 /api와 /api/</em>→API를 설정한다.</td>
          <td>앞선 /* 규칙이 모두 먼저 일치해 뒤의 API 규칙에 도달하지 않는다.</td>
          </tr>
          <tr>
          <td>우선순위 10에 /api*→API를 두고 기본 동작을 카탈로그로 설정한다.</td>
          <td>/api*는 /apiv2도 포함하므로 API와 카탈로그의 경로 경계를 넘는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-rules.html">ALB 리스너 규칙 평가</a> · <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-condition-types.html">ALB 경로 조건</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#alb-%EA%B7%9C%EC%B9%99%EC%9D%80-%EB%82%AE%EC%9D%80-%EB%B2%88%ED%98%B8%EB%B6%80%ED%84%B0-%EC%B2%98%EC%9D%8C-%EC%9D%BC%EC%B9%98%ED%95%9C-%EA%B2%83%EC%9D%84-%EC%A0%81%EC%9A%A9%ED%95%9C%EB%8B%A4">정확한 /api와 하위 경로 /api/<em>를 모두 포함하되 더 넓은 /api</em>와 먼저 일치하는 포괄 규칙은 피해야 한다.</a></p>
        quizzes:
          - q: 기존 ALB의 같은 도메인으로 카탈로그와 새 API를 제공한다. 정확한 /api와 /api/ 하위 경로만 API 대상 그룹으로 보내고
              /apiv2를 포함한 나머지는 카탈로그로 보내야 한다. ALB는 낮은 우선순위 번호부터 처음 맞는 규칙을 적용한다.
              경로 재작성 없이 추가할 규칙은?
            answer: 우선순위 10에 /api와 /api/*→API를 두고 기본 동작을 카탈로그로 설정한다.
            wrong:
              - 우선순위 10에 /api/*→API를 두고 기본 동작을 카탈로그로 설정한다.
              - 우선순위 10에 /*→카탈로그, 20에 /api와 /api/*→API를 설정한다.
              - 우선순위 10에 /api*→API를 두고 기본 동작을 카탈로그로 설정한다.
      - id: saa-r2-Q17-06
        source_id: Q17-06
        type: mcq
        title: Q17-06 · EC2·확장·비용
        explain: |
          <p>포트가 열리거나 프로세스가 살아 있는 상태 대신 실제 요청 처리 준비를 나타내는 HTTP 경로를 검사해야 한다. UDP 대상도 TCP·HTTP·HTTPS의 별도 상태 확인을 사용할 수 있다. UDP 앱의 실제 준비 상태와 연결된 /ready를 사용하면 포트가 먼저 열려도 매치 처리가 준비되기 전에는 healthy가 되지 않는다. 정상 대상이 있는 상태에서 신규 대상을 편입하는 구성이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>UDP 대상 그룹의 상태 확인을 TCP 8080으로 설정한다.</td>
          <td>HTTP 포트가 TCP 연결을 받는다는 사실만 확인해 매치 처리 준비 여부를 구분하지 못한다.</td>
          </tr>
          <tr>
          <td>UDP 대상 그룹의 상태 확인을 HTTP 8080 /live로 설정한다.</td>
          <td>프로세스 생존은 준비 완료와 다르므로 준비되지 않은 서버를 정상으로 판정할 수 있다.</td>
          </tr>
          <tr>
          <td>UDP 대상 그룹의 상태 확인을 TCP 9000으로 설정한다.</td>
          <td>UDP 서비스 포트에 TCP 상태 확인을 보내는 것은 지문이 제공한 HTTP 준비 신호를 확인하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/network/target-group-health-checks.html">NLB UDP 대상 상태 확인</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#nlb-udp-%EC%84%9C%EB%B9%84%EC%8A%A4%EC%9D%98-%EC%A4%80%EB%B9%84-%EC%83%81%ED%83%9C%EB%A5%BC-%ED%99%95%EC%9D%B8%ED%95%98%EA%B8%B0">포트가 열리거나 프로세스가 살아 있는 상태 대신 실제 요청 처리 준비를 나타내는 HTTP 경로를 검사해야 한다.</a></p>
        quizzes:
          - q: UDP 9000 게임 서비스가 NLB 뒤에서 실행된다. EC2는 HTTP 8080의 /live에서 프로세스 생존을, /ready에서 실제
              매치 처리 준비를 알려준다. 새 서버는 3분간 살아 있지만 준비되지 않았으며 기존 정상 대상은 충분하다. 준비 전
              서버로 UDP 요청을 보내지 않으려면 어떤 상태 확인을 쓰는가?
            answer: UDP 대상 그룹의 상태 확인을 HTTP 8080 /ready로 설정한다.
            wrong:
              - UDP 대상 그룹의 상태 확인을 TCP 8080으로 설정한다.
              - UDP 대상 그룹의 상태 확인을 HTTP 8080 /live로 설정한다.
              - UDP 대상 그룹의 상태 확인을 TCP 9000으로 설정한다.
      - id: saa-r2-Q17-07
        source_id: Q17-07
        type: mcq
        title: Q17-07 · EC2·확장·비용
        explain: |
          <p>ASG의 교체 판단에 ALB 상태를 추가하고 초기화 동안 건강 판정을 유예하는 두 설정을 함께 적용해야 한다. ELB 상태 확인을 ASG에 반영해야 앱 프로세스 장애를 교체 판단에 사용할 수 있다. 또한 초기화에 6분이 필요한 새 서버를 조기에 반복 교체하지 않도록 충분한 유예 기간을 설정하고 실제 준비 여부를 검사해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ALB 상태 확인을 프로세스 상태와 무관하게 항상 200을 반환하는 경로로 바꾼다.</td>
          <td>새 서버의 교체는 줄 수 있어도 실제 앱 장애를 숨겨 요청을 정상 처리하지 못하는 인스턴스가 남는다.</td>
          </tr>
          <tr>
          <td>ASG의 최대 크기를 늘리고 EC2 상태 확인 설정과 유예 기간은 유지한다.</td>
          <td>최대 크기 증가는 앱 장애를 탐지하거나 새 서버의 초기화 시간을 보호하지 않는다.</td>
          </tr>
          <tr>
          <td>ASG의 인스턴스 warmup만 6분으로 늘리고 EC2 상태 확인 설정은 유지한다.</td>
          <td>warmup은 확장 지표와 용량 계산에 관련되며 ALB 앱 상태를 ASG 교체 판단에 넣는 설정이나 건강 유예를 대신하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html">ASG 상태 확인</a> · <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-check-grace-period.html">상태 확인 유예 기간</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#health-grace%EC%99%80-warmup%EC%9D%80-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%8B%9C%EA%B0%84%EC%9D%84-%EB%B3%B4%ED%98%B8%ED%95%9C%EB%8B%A4">ASG의 교체 판단에 ALB 상태를 추가하고 초기화 동안 건강 판정을 유예하는 두 설정을 함께 적용해야 한다.</a> · <a href="/study/lessons/deep-dive/day-06.html#health-grace%EC%99%80-warmup%EC%9D%80-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%8B%9C%EA%B0%84%EC%9D%84-%EB%B3%B4%ED%98%B8%ED%95%9C%EB%8B%A4">ASG의 교체 판단에 ALB 상태를 추가하고 초기화 동안 건강 판정을 유예하는 두 설정을 함께 적용해야 한다.</a></p>
        quizzes:
          - q: ALB는 앱이 멈춘 EC2를 unhealthy로 보지만 ASG는 EC2 검사만 사용해 그 인스턴스를 남겨 둔다. 새 서버는 6분 초기화 후
              정상 요청을 처리한다. 앱이 멈춘 서버를 교체하면서 새 서버가 준비되기 전에 반복 교체되는 것도 막아야 한다. 필요한
              조치 두 가지는?
            answer: ASG에서 ELB 상태 확인을 사용해 ALB 대상의 비정상 상태를 교체 판단에 포함한다.
            wrong:
              - ALB 상태 확인을 프로세스 상태와 무관하게 항상 200을 반환하는 경로로 바꾼다.
              - ASG의 최대 크기를 늘리고 EC2 상태 확인 설정과 유예 기간은 유지한다.
              - ASG의 인스턴스 warmup만 6분으로 늘리고 EC2 상태 확인 설정은 유지한다.
            answers:
              - ASG에서 ELB 상태 확인을 사용해 ALB 대상의 비정상 상태를 교체 판단에 포함한다.
              - 앱 초기화에 충분한 ASG 상태 확인 유예 기간을 두고 실제 앱 상태 확인 경로를 사용한다.
            options:
              - ALB 상태 확인을 프로세스 상태와 무관하게 항상 200을 반환하는 경로로 바꾼다.
              - ASG의 최대 크기를 늘리고 EC2 상태 확인 설정과 유예 기간은 유지한다.
              - ASG에서 ELB 상태 확인을 사용해 ALB 대상의 비정상 상태를 교체 판단에 포함한다.
              - 앱 초기화에 충분한 ASG 상태 확인 유예 기간을 두고 실제 앱 상태 확인 경로를 사용한다.
              - ASG의 인스턴스 warmup만 6분으로 늘리고 EC2 상태 확인 설정은 유지한다.
      - id: saa-r2-Q17-08
        source_id: Q17-08
        type: mcq
        title: Q17-08 · EC2·확장·비용
        explain: |
          <p>API는 작업을 내구성 있는 큐에 맡기고 작업자는 완료한 뒤 확인해야 하며 적체량에 맞춰 처리 용량을 늘려야 한다. 수집과 변환을 큐로 분리하면 순간 입력량을 버퍼링하고 작업자 용량을 조절할 수 있다. 작업 성공 후 메시지를 삭제하고 중복 처리에 대비해야 서버 중단 시에도 재처리할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>API가 완료까지 기다리게 유지하고 ALB idle timeout과 작업자 최대 인스턴스 크기를 늘린다.</td>
          <td>대기 시간을 늘려도 API가 변환 병목과 직접 결합되어 피크 시 응답 지연과 작업자 장애 재처리 문제를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>작업을 SQS에 넣고 수신 즉시 삭제하며 변환 중 상태는 작업자 RAM에 유지한다.</td>
          <td>완료 전에 메시지를 삭제하면 작업자가 죽었을 때 큐에 미완료 작업이 남지 않아 재처리할 수 없다.</td>
          </tr>
          <tr>
          <td>업로드 요청 수로만 ASG를 확장하고 API가 변환 완료를 동기적으로 기다리게 유지한다.</td>
          <td>확장 신호를 바꿔도 동기 처리 결합을 유지해 느린 변환이 API 응답을 지연시킨다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html">SQS 적체량으로 ASG 확장</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%ED%81%90-%EC%9E%91%EC%97%85%EC%9E%90%EC%9D%98-%EC%A0%81%EC%B2%B4%EB%9F%89%EC%9D%84-%EA%B3%84%EC%82%B0%ED%95%98%EA%B8%B0">API는 작업을 내구성 있는 큐에 맡기고 작업자는 완료한 뒤 확인해야 하며 적체량에 맞춰 처리 용량을 늘려야 한다.</a></p>
        quizzes:
          - q: 업로드 API가 S3 원본 저장 뒤 EC2 썸네일 변환이 끝날 때까지 기다려 피크 때 시간 초과된다. 결과는 수분 늦어도 되며 작업자 장애
              후에도 미완료 변환을 다시 처리해야 한다. 중복 실행은 작업 ID로 안전하게 처리한다. API 응답과 변환 처리를
              분리하고 작업량에 따라 확장하는 방법은?
            answer: 작업을 SQS에 넣고 완료 후 삭제하며 작업자당 적체량으로 ASG를 확장한다.
            wrong:
              - API가 완료까지 기다리게 유지하고 ALB idle timeout과 작업자 최대 인스턴스 크기를 늘린다.
              - 작업을 SQS에 넣고 수신 즉시 삭제하며 변환 중 상태는 작업자 RAM에 유지한다.
              - 업로드 요청 수로만 ASG를 확장하고 API가 변환 완료를 동기적으로 기다리게 유지한다.
      - id: saa-r2-Q17-09
        source_id: Q17-09
        type: mcq
        title: Q17-09 · EC2·확장·비용
        explain: |
          <p>용량이 증가하면 비례해 내려가고 실제 부하를 반영하는 서버당 요청 수를 목표 추적 지표로 선택한다. 목표 추적에는 서버를 늘리면 단위당 부하가 줄어드는 지표가 적합하다. 대상당 요청 수가 처리 부하를 반영하는지 검증하고 새 인스턴스의 준비 시간을 고려해야 왜곡된 확장을 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ALB 전체 RequestCount의 목표 추적 정책을 사용하고 새 서버 준비 시간을 반영한다.</td>
          <td>전체 요청 수는 서버를 늘려도 같은 수요에서 내려가지 않으므로 목표 추적의 용량당 이용률 신호에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>ASG 평균 CPU 사용률을 높은 목표로 설정하고 CPU 기준의 목표 추적 정책을 사용한다.</td>
          <td>CPU가 실제 병목을 반영하지 않고 낮게 유지되는 상황에서 더 높은 목표는 필요한 확장을 늦춘다.</td>
          </tr>
          <tr>
          <td>매일 같은 시각에 ASG를 최대 크기로 확장하는 예약 정책만 사용한다.</td>
          <td>예측하기 어려운 트래픽에 고정 시각 최대 확장만 사용하면 응답성과 유휴 비용을 함께 맞추기 어렵다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html">목표 추적 확장 정책</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EC%84%9C%EB%B2%84%EB%A5%BC-%EB%8A%98%EB%A6%AC%EB%A9%B4-%EB%82%B4%EB%A0%A4%EA%B0%80%EB%8A%94-%EC%A7%80%ED%91%9C%EB%A5%BC-%EA%B3%A0%EB%A5%B4%EA%B8%B0">용량이 증가하면 비례해 내려가고 실제 부하를 반영하는 서버당 요청 수를 목표 추적 지표로 선택한다.</a></p>
        quizzes:
          - q: ALB 뒤 동일 사양의 API 서버는 네트워크 I/O 대기가 많아 CPU 사용률이 낮다. DB에는 여유가 있고 시험에서 서버를 두 배
              늘리면 서버당 요청 수가 절반으로 내려가며 전체 처리량이 늘었다. 트래픽 시각은 예측하기 어렵다. 자동 확장 지표와
              정책으로 적절한 조합은?
            answer: ALB 대상당 요청 수의 목표 추적 정책을 사용하고 새 서버 준비 시간을 반영한다.
            wrong:
              - ALB 전체 RequestCount의 목표 추적 정책을 사용하고 새 서버 준비 시간을 반영한다.
              - ASG 평균 CPU 사용률을 높은 목표로 설정하고 CPU 기준의 목표 추적 정책을 사용한다.
              - 매일 같은 시각에 ASG를 최대 크기로 확장하는 예약 정책만 사용한다.
      - id: saa-r2-Q17-10
