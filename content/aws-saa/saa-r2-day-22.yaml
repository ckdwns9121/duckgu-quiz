id: saa-r2-day-22
name: 모의고사 A
part: 22일 차
color: "#8b5cf6"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: saa-r2-Q22-01
        source_id: Q22-01
        type: mcq
        title: Q22-01 · 모의고사 A
        explain: |
          <p>Flexible Retrieval의 Standard 검색은 통상 3~5시간으로 제시한 접근 목표에 맞는다. 즉시 접근 계층의 비용을 지불할 필요는 없다. 통상 복원 시간은 SLA 보장이 아니며 대량 복원은 별도 평가한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Glacier Deep Archive로 전환하고 Standard 검색으로 복원한다.</td>
          <td>Deep Archive는 저장비가 낮지만 일반 Standard 검색이 통상 12시간이므로 6시간 목표에서 탈락한다.</td>
          </tr>
          <tr>
          <td>Glacier Instant Retrieval로 전환하고 GET으로 바로 읽는다.</td>
          <td>즉시 GET은 요구보다 높은 접근성을 제공한다. 이 보관 패턴에서는 Flexible Retrieval보다 높은 저장 단가를 정당화하지 못한다.</td>
          </tr>
          <tr>
          <td>Standard-IA로 전환하고 GET으로 바로 읽는다.</td>
          <td>Standard-IA는 즉시 조회할 때 검토할 수 있으나, 복원 대기가 가능한 장기 영상의 저장비 최소화에 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html">S3 아카이브 검색 옵션</a> · <a href="https://aws.amazon.com/s3/storage-classes/glacier/">S3 Glacier 계층 비용과 사용 사례</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#%EC%A0%80%EC%9E%A5-%ED%81%B4%EB%9E%98%EC%8A%A4%EC%99%80-%EB%B3%B5%EC%9B%90-%EC%8B%9C%EA%B0%84%EC%9D%98-%EC%84%A0%ED%83%9D">7년 장기 보관이므로 최소 저장 기간보다 이른 삭제는 판단 요인이 아니다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EC%A0%80%EC%9E%A5-%ED%81%B4%EB%9E%98%EC%8A%A4%EC%99%80-%EB%B3%B5%EC%9B%90-%EC%8B%9C%EA%B0%84%EC%9D%98-%EC%84%A0%ED%83%9D">일반 표준 검색이 통상 3~5시간인 Glacier Flexible Retrieval이 6시간 목표에 맞고, 즉시 읽기를 제공하는 계층보다 낮은 저장 비용을 선택할 수 있다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EC%A0%80%EC%9E%A5-%ED%81%B4%EB%9E%98%EC%8A%A4%EC%99%80-%EB%B3%B5%EC%9B%90-%EC%8B%9C%EA%B0%84%EC%9D%98-%EC%84%A0%ED%83%9D">Deep Archive의 일반 표준 검색은 통상 12시간이다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EC%A0%80%EC%9E%A5-%ED%81%B4%EB%9E%98%EC%8A%A4%EC%99%80-%EB%B3%B5%EC%9B%90-%EC%8B%9C%EA%B0%84%EC%9D%98-%EC%84%A0%ED%83%9D">이는 검색 시간 SLA 보장을 뜻하지 않으며 대량 복원은 별도 용량 계획이 필요하다</a></p>
        quizzes:
          - q: 보험사는 감사 영상 400TB를 7년 보관한다. premium/ 계약 파일은 계속 Standard에 두고, 나머지 영상은 연 1~2회
              소량만 복원한다. 일반 RestoreObject의 Standard 검색으로 통상 6시간 이내 접근 가능한 등급 중
              저장비를 최소화해야 한다. 즉시 GET은 필요 없고 대량 일괄 복원도 아니다. 영상 경로에 적용할 정책은?
            answer: Glacier Flexible Retrieval로 전환하고 Standard 검색으로 복원한다.
            wrong:
              - Glacier Deep Archive로 전환하고 Standard 검색으로 복원한다.
              - Glacier Instant Retrieval로 전환하고 GET으로 바로 읽는다.
              - Standard-IA로 전환하고 GET으로 바로 읽는다.
      - id: saa-r2-Q22-02
        source_id: Q22-02
        type: mcq
        title: Q22-02 · 모의고사 A
        explain: |
          <p>Athena는 S3 데이터를 서버를 직접 운영하지 않고 SQL로 조회한다. 날짜 파티션과 열 지향 형식은 이 쿼리의 스캔 범위를 줄인다. 실제 실행 시간과 스캔 비용은 데이터량으로 검증한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>보고서용 RDS 읽기 복제본을 상시 유지하고 새벽 집계 쿼리를 보낸다.</td>
          <td>읽기 복제본은 운영 DB 조회를 분리하지만 하루 한 번의 S3 집계를 위해 상시 DB 비용과 관리를 유지한다.</td>
          </tr>
          <tr>
          <td>Redshift 프로비저닝 클러스터를 상시 유지하고 매일 데이터를 적재한다.</td>
          <td>상시 웨어하우스가 필요한 반복 분석에는 적합하지만 이 경우 유휴 리소스 비용이 남는다.</td>
          </tr>
          <tr>
          <td>매일 임시 EC2를 시작해 SQL 엔진을 설치하고 종료 시 디스크를 보존한다.</td>
          <td>임시 실행은 계산 유휴비를 줄일 수 있으나 엔진 설치·패치·실패 복구를 직접 운영해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/what-is.html">Amazon Athena</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">이미 S3에 있고 비정기적인 SQL 분석이라면 Athena로 상시 분석 서버를 줄일 수 있다</a> · <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">실제 비용은 스캔량·데이터 형식·조회 빈도 등을 비교해 판단하며 운영 거래 부하도 분리한다</a></p>
        quizzes:
          - q: 판매 분석팀은 주문 DB가 매일 내보낸 S3 데이터를 새벽 한 번 SQL로 집계한다. 조회는 15분 안에 끝나면 되고 나머지 시간에는 분석
              요청이 없다. 일별 경로와 필요한 열만 조회하도록 바꿀 수 있다. 상시 분석 서버의 유휴 비용과 운영을 줄이면서
              SQL을 유지할 구성은?
            answer: S3 데이터를 날짜별 Parquet로 구성하고 Athena로 필요한 범위만 조회한다.
            wrong:
              - 보고서용 RDS 읽기 복제본을 상시 유지하고 새벽 집계 쿼리를 보낸다.
              - Redshift 프로비저닝 클러스터를 상시 유지하고 매일 데이터를 적재한다.
              - 매일 임시 EC2를 시작해 SQL 엔진을 설치하고 종료 시 디스크를 보존한다.
      - id: saa-r2-Q22-03
        source_id: Q22-03
        type: mcq
        title: Q22-03 · 모의고사 A
        explain: |
          <p>Identity Center의 연동·그룹·권한 세트 배정을 사용하면 직원 계정을 AWS 계정별로 복제하지 않고 접근을 관리할 수 있다. 이미 발급된 세션의 종료와 신규 로그인 차단은 구분한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>중앙 IAM 사용자 키 하나를 비밀 저장소에 넣고 부서별로 열람을 제한한다.</td>
          <td>공용 장기 키는 직원별 추적·회수와 장기 키 금지 조건을 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>계정마다 IAM 역할을 만들고 직원별 IAM 사용자에서 수동으로 전환하게 한다.</td>
          <td>계정 간 역할은 가능하지만 사람별 IAM 사용자와 수동 배정 운영이 남아 중앙 직원 관리 요구에 불리하다.</td>
          </tr>
          <tr>
          <td>계정별 IAM 사용자를 만들고 동일한 암호 정책과 그룹 이름을 사용한다.</td>
          <td>그룹 이름과 암호 정책이 같아도 계정별 IAM 사용자 수명 주기는 IdP 비활성화와 자동으로 일치하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html">IAM Identity Center</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EC%A7%81%EC%9B%90-%EC%A0%91%EA%B7%BC%EA%B3%BC-%EC%99%B8%EB%B6%80-%EA%B3%B5%EA%B8%89%EC%97%85%EC%B2%B4-%EC%9C%84%EC%9E%84">기존 회사 IdP 신원을 연동하고 임시 역할 세션 사용</a> · <a href="/study/lessons/deep-dive/day-01.html#%EC%A7%81%EC%9B%90-%EC%A0%91%EA%B7%BC%EA%B3%BC-%EC%99%B8%EB%B6%80-%EA%B3%B5%EA%B8%89%EC%97%85%EC%B2%B4-%EC%9C%84%EC%9E%84">계정별 권한 세트를 중앙 배정하고 장기 키 복제 최소화</a></p>
        quizzes:
          - q: 회사 IdP로 로그인하는 직원에게 12개 AWS 계정의 읽기·배포 권한을 부서별로 배정한다. 인사팀이 직원을 비활성화하면 새 로그인이
              차단돼야 하고 AWS 계정마다 사용자와 장기 키를 복제해서는 안 된다. 부서 변경도 중앙에서 반영할 접근 설계는?
            answer: IdP를 IAM Identity Center에 연동하고 그룹에 계정별 권한 세트를 할당한다.
            wrong:
              - 중앙 IAM 사용자 키 하나를 비밀 저장소에 넣고 부서별로 열람을 제한한다.
              - 계정마다 IAM 역할을 만들고 직원별 IAM 사용자에서 수동으로 전환하게 한다.
              - 계정별 IAM 사용자를 만들고 동일한 암호 정책과 그룹 이름을 사용한다.
      - id: saa-r2-Q22-04
        source_id: Q22-04
        type: mcq
        title: Q22-04 · 모의고사 A
        explain: |
          <p>관련 다중 리전 키는 동일한 키 ID와 키 재료를 공유해 호환되는 암호문을 처리할 수 있다. 키 정책·권한은 리전별로 관리하므로 접근 통제 요구도 분리한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>독립 KMS 키를 리전마다 만들고 두 키에 동일한 별칭을 지정한다.</td>
          <td>별칭은 키 재료를 같게 만들지 않는다. 독립 키는 별칭이 같아도 기존 암호문을 그대로 복호화할 수 없다.</td>
          </tr>
          <tr>
          <td>단일 리전 KMS 키를 두 앱이 호출하고 보조 앱의 재시도 시간을 늘린다.</td>
          <td>단일 리전 키 원격 호출은 원래 리전의 KMS 가용성에 계속 의존한다.</td>
          </tr>
          <tr>
          <td>리전별 독립 KMS 키를 두고 장애 후 원본 파일을 보조 키로 재암호화한다.</td>
          <td>재암호화는 정상 운영 중 이관에는 가능하지만 장애 시 원본 리전에 접근하지 않는다는 조건을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html">Multi-Region KMS keys</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%ED%82%A4-%ED%9A%8C%EC%A0%84%EC%9E%AC%EC%95%94%ED%98%B8%ED%99%94%EC%82%AD%EC%A0%9C-%EB%8C%80%EA%B8%B0">관련 다중 리전 키는 같은 키 재료로 호환 암호 작업을 지원하므로 로컬 리전 키로 처리할 수 있다</a> · <a href="/study/lessons/deep-dive/day-11.html#%ED%82%A4-%ED%9A%8C%EC%A0%84%EC%9E%AC%EC%95%94%ED%98%B8%ED%99%94%EC%82%AD%EC%A0%9C-%EB%8C%80%EA%B8%B0">키 정책 등은 리전별로 관리하므로 가용성과 접근 경계를 함께 설계해야 한다</a></p>
        quizzes:
          - q: 두 리전의 배치 앱이 클라이언트 측에서 KMS로 암호화한 동일 데이터 세트를 처리한다. 장애 리전의 KMS API를 호출하거나 파일을 다시
              암호화하지 않고 다른 리전에서 기존 암호문을 읽어야 한다. 보조 리전 운영자는 그 리전의 키 권한만 관리해야 한다.
              어떤 키 구성이 적합한가?
            answer: KMS 다중 리전 키의 관련 복제본을 두고 각 리전의 키 정책을 따로 설정한다.
            wrong:
              - 독립 KMS 키를 리전마다 만들고 두 키에 동일한 별칭을 지정한다.
              - 단일 리전 KMS 키를 두 앱이 호출하고 보조 앱의 재시도 시간을 늘린다.
              - 리전별 독립 KMS 키를 두고 장애 후 원본 파일을 보조 키로 재암호화한다.
      - id: saa-r2-Q22-05
        source_id: Q22-05
        type: mcq
        title: Q22-05 · 모의고사 A
        explain: |
          <p>Compute Savings Plans는 적용 대상 EC2·Fargate·Lambda 사용량 사이의 유연성을 제공한다. 이 할인 자체는 용량을 확보하지 않으므로 지정 AZ의 용량 예약을 별도로 구성한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2 Instance Savings Plans와 해당 AZ의 별도 온디맨드 용량 예약을 사용한다.</td>
          <td>EC2 Instance Savings Plans는 특정 패밀리·리전 범위여서 계획한 변경과 Fargate·Lambda 이전을 포괄하지 못한다.</td>
          </tr>
          <tr>
          <td>EC2·Fargate·Lambda를 온디맨드로 쓰고 지정 AZ의 EC2 용량만 예약한다.</td>
          <td>용량은 확보하지만 계속 쓰는 기준 사용량의 약정 할인 기회를 사용하지 않는다.</td>
          </tr>
          <tr>
          <td>현재 EC2 사양의 AZ 범위 Standard RI로 할인과 복구 용량을 함께 확보한다.</td>
          <td>AZ 범위 RI는 조건에 맞는 EC2 할인·용량을 제공하나 다른 리전·패밀리와 서버리스 이전의 할인 유연성을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html">Savings Plans types</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html">EC2 Capacity Reservations</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html">리전·AZ 범위 RI의 용량과 할인</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">Compute Savings Plans는 EC2 패밀리·리전 변경 및 Fargate·Lambda 이전에도 적격 사용에 유연하게 적용된다</a> · <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">특정 AZ의 용량은 별도 On-Demand Capacity Reservation으로 확보한다</a> · <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">다른 선택도 용량 확보는 가능하지만 EC2 Instance Savings Plans와 Zonal RI는 할인 범위가 더 좁고, 온디맨드 예약만으로는 할인 약정의 절감 효과가 없다</a></p>
        quizzes:
          - q: 서비스는 매시간 일정한 컴퓨팅 기준 사용량이 있고 1년간 유지될 예정이다. EC2는 다른 패밀리·리전으로 옮길 수 있으며 일부 기능은
              Fargate와 Lambda로 전환한다. 동시에 특정 AZ에서 정해진 EC2 사양의 복구 용량을 확보해야 한다. 할인과
              용량 요구를 각각 충족할 구성은?
            answer: Compute Savings Plans와 해당 AZ의 별도 온디맨드 용량 예약을 사용한다.
            wrong:
              - EC2 Instance Savings Plans와 해당 AZ의 별도 온디맨드 용량 예약을 사용한다.
              - EC2·Fargate·Lambda를 온디맨드로 쓰고 지정 AZ의 EC2 용량만 예약한다.
              - 현재 EC2 사양의 AZ 범위 Standard RI로 할인과 복구 용량을 함께 확보한다.
      - id: saa-r2-Q22-06
        source_id: Q22-06
        type: mcq
        title: Q22-06 · 모의고사 A
        explain: |
          <p>SNS 팬아웃과 소비자별 SQS 큐는 전달 복제와 처리 속도·장애를 분리한다. 큐 보존 기간을 예상 중단과 따라잡기 여유보다 길게 설정하고 중복은 소비자가 멱등 처리한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>소비자별 직접 호출을 순차 실행하고 알림 성공 뒤 재고 처리를 확정한다.</td>
          <td>순차 호출은 알림 실패가 재고 반영을 지연시키므로 실패 격리 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>SQS 큐 하나를 두 소비자 그룹이 읽고 처리에 성공한 메시지를 삭제한다.</td>
          <td>한 큐의 경쟁 소비는 이벤트를 소비자 사이에 나누므로 재고와 알림 모두에게 같은 이벤트를 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>SNS HTTP 구독으로 두 API에 전달하고 각 API의 재시도 엔드포인트를 운영한다.</td>
          <td>HTTP 재시도는 가능하지만 5일 보관·재처리를 확실하게 운영할 큐보다 개별 API의 내구성·복구 부담이 커진다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html">SNS to SQS fanout</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">SNS에서 각 큐로 이벤트를 복제하면 두 시스템이 독립적으로 소비한다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">큐 보존 기간은 지원 최대 기간 이내에서 예상 중단·복구 시간을 넘도록 설정해야 하며, 무기한 미처리 데이터 보존으로 가정해서는 안 된다</a></p>
        quizzes:
          - q: 출고 이벤트 하나를 재고 반영과 고객 알림이 각각 처리해야 한다. 알림 워커가 최대 5일 멈춰도 재고 처리는 정상 진행돼야 하며, 복구 후
              알림이 누락 없이 따라잡아야 한다. 두 소비자의 처리 속도는 다르고 앱은 중복 처리를 방어한다. 이벤트 전달·보관을
              가장 적게 직접 운영할 구성은?
            answer: SNS에서 소비자별 SQS 큐로 전달하고 각 큐의 보존을 최대 중단보다 길게 정한다.
            wrong:
              - 소비자별 직접 호출을 순차 실행하고 알림 성공 뒤 재고 처리를 확정한다.
              - SQS 큐 하나를 두 소비자 그룹이 읽고 처리에 성공한 메시지를 삭제한다.
              - SNS HTTP 구독으로 두 API에 전달하고 각 API의 재시도 엔드포인트를 운영한다.
      - id: saa-r2-Q22-07
        source_id: Q22-07
        type: mcq
        title: Q22-07 · 모의고사 A
        explain: |
          <p>Compliance 보존은 해당 기간 동안 보호된 버전의 영구 삭제와 보존 단축을 제한한다. 동일 키로 새 버전을 추가하는 것은 보호 버전을 삭제하는 작업과 다르다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버전 관리와 리전 간 복제를 사용하고 두 버킷의 버전 삭제 권한을 유지한다.</td>
          <td>복제와 버전 기록은 사본을 남기지만 삭제 권한을 유지하면 두 사본의 보호 버전을 영구 삭제할 수 있다.</td>
          </tr>
          <tr>
          <td>관리자도 변경 가능한 버킷 정책에서 DeleteObjectVersion을 거부한다.</td>
          <td>관리자가 정책 자체를 변경할 수 있다면 삭제 거부를 제거할 수 있어 보존의 불변성을 강제하지 못한다.</td>
          </tr>
          <tr>
          <td>객체 버전에 Object Lock governance를 적용하고 보안 관리자의 우회 권한을 둔다.</td>
          <td>Governance는 적절한 우회 권한이 있으면 보존을 우회할 수 있어 관리자까지 강제하는 조건에 부족하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html">Object Lock retention</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#object-lock%EC%9D%98-%EB%B3%B4%EC%A1%B4-%EA%B8%B0%EA%B0%84%EA%B3%BC-legal-hold">Object Lock compliance 모드는 보존 중인 객체 버전의 삭제와 보존 단축을 강하게 제한한다</a> · <a href="/study/lessons/deep-dive/day-03.html#object-lock%EC%9D%98-%EB%B3%B4%EC%A1%B4-%EA%B8%B0%EA%B0%84%EA%B3%BC-legal-hold">접근 정책과 별개로 버전 단위 WORM 보존을 제공하므로 관리자 실수 방지 요구에 적합하다</a></p>
        quizzes:
          - q: 감사 버킷은 관리자 역할을 포함해 문서 버전의 보존 기간을 줄이거나 영구 삭제하지 못하게 해야 한다. 새 버전 추가는 계속 허용하며 보존
              기간이 지나면 정상 정리할 수 있어야 한다. 버전 관리와 비공개 접근은 이미 구성됐다. 어떤 통제가 이 요구를
              강제하는가?
            answer: 객체 버전에 S3 Object Lock compliance 보존 기간을 적용한다.
            wrong:
              - 버전 관리와 리전 간 복제를 사용하고 두 버킷의 버전 삭제 권한을 유지한다.
              - 관리자도 변경 가능한 버킷 정책에서 DeleteObjectVersion을 거부한다.
              - 객체 버전에 Object Lock governance를 적용하고 보안 관리자의 우회 권한을 둔다.
      - id: saa-r2-Q22-08
        source_id: Q22-08
        type: mcq
        title: Q22-08 · 모의고사 A
        explain: |
          <p>Global Accelerator는 고정 진입 IP와 AWS 글로벌 네트워크를 사용해 지원되는 정상 엔드포인트로 연결을 라우팅한다. 프로토콜을 HTTP로 바꾸지 않고 리전 엔드포인트를 분리할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Route 53 지연 기반 레코드와 상태 확인으로 두 리전 NLB를 응답한다.</td>
          <td>DNS 상태 기반 라우팅은 가능하지만 고객이 받은 주소와 DNS 캐시가 갱신돼야 하며 고정된 글로벌 진입 IP를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>CloudFront 배포에 두 리전 ALB 원본 그룹을 연결한다.</td>
          <td>CloudFront는 HTTP 계열 전송에 적합하며 일반 TCP 접수 프로토콜을 그대로 전달하는 해법이 아니다.</td>
          </tr>
          <tr>
          <td>주 리전 NLB의 고정 IP를 등록하고 장애 시 보조 NLB의 IP로 고객 설정을 바꾼다.</td>
          <td>리전별 고정 IP 자체는 가능하지만 장애 시 고객 허용 목록 변경이 필요해 조건을 어긴다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html">Global Accelerator</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#dns-cdn%EA%B3%BC-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%84%A4%ED%8A%B8%EC%9B%8C%ED%81%AC-%EA%B0%80%EC%86%8D">Global Accelerator는 고정 IP 진입점과 AWS 글로벌 네트워크를 이용해 지원 엔드포인트로 TCP·UDP 트래픽을 전달한다</a> · <a href="/study/lessons/deep-dive/day-09.html#dns-cdn%EA%B3%BC-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%84%A4%ED%8A%B8%EC%9B%8C%ED%81%AC-%EA%B0%80%EC%86%8D">DNS 이름과 캐시가 아니라 고정 IP와 네트워크 경로 요구에 맞는다</a></p>
        quizzes:
          - q: 게임 회사의 TCP 접수 서비스가 두 리전에 있다. 고객 방화벽에는 소수의 고정 퍼블릭 IP만 등록할 수 있고 장애 때 IP 목록을 바꿀
              수 없다. DNS 캐시 만료를 기다리지 않고 정상 리전으로 새 연결을 보내며 원래 TCP 프로토콜을 유지해야 한다.
              적합한 앞단 구성은?
            answer: Global Accelerator 표준 가속기에 두 리전의 지원 엔드포인트를 등록한다.
            wrong:
              - Route 53 지연 기반 레코드와 상태 확인으로 두 리전 NLB를 응답한다.
              - CloudFront 배포에 두 리전 ALB 원본 그룹을 연결한다.
              - 주 리전 NLB의 고정 IP를 등록하고 장애 시 보조 NLB의 IP로 고객 설정을 바꾼다.
      - id: saa-r2-Q22-09
        source_id: Q22-09
        type: mcq
        title: Q22-09 · 모의고사 A
        explain: |
          <p>그룹 크기에 따라 줄어드는 평균 CPU는 target tracking에 적절하다. 준비 시간을 워밍업에 반영하면 초기화 중인 용량의 영향을 잘못 해석하는 위험을 줄인다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>CPU 임계치마다 직접 정한 증감 수량의 step scaling만 사용한다.</td>
          <td>Step scaling도 설계 가능하지만 운영자가 임계치별 수량을 관리해야 해 목표 평균을 자동 유지하려는 요구에 덜 적합하다.</td>
          </tr>
          <tr>
          <td>전체 인스턴스 CPU 합계를 고정 목표로 하는 사용자 지정 target tracking을 쓴다.</td>
          <td>총 CPU 합계는 서버 수에 비례해 낮아지는 지표가 아니므로 용량과 반비례하는 target tracking 지표 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>매일 같은 시각에 서버를 늘리는 예약 확장을 단독으로 사용한다.</td>
          <td>예약 확장은 예측 가능한 패턴에 적합하지만 이번 임의 시간의 부하 변화만으로는 대응하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html">Target tracking</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EC%84%9C%EB%B2%84%EB%A5%BC-%EB%8A%98%EB%A6%AC%EB%A9%B4-%EB%82%B4%EB%A0%A4%EA%B0%80%EB%8A%94-%EC%A7%80%ED%91%9C%EB%A5%BC-%EA%B3%A0%EB%A5%B4%EA%B8%B0">부하에 비례하는 평균 CPU는 목표 추적 확장에 적합한 지표다</a> · <a href="/study/lessons/deep-dive/day-06.html#health-grace%EC%99%80-warmup%EC%9D%80-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%8B%9C%EA%B0%84%EC%9D%84-%EB%B3%B4%ED%98%B8%ED%95%9C%EB%8B%A4">워밍업을 고려해 새 용량이 준비되기 전 지표와 확장 판단을 잘못 해석하지 않도록 구성한다</a></p>
        quizzes:
          - q: 무상태 API의 ASG는 정상 인스턴스가 늘면 인스턴스당 CPU 사용률이 낮아진다. 요청 증가는 예측할 수 없고 새 인스턴스가 준비되기까지
              6분이 걸린다. 운영자는 단계별 서버 수를 직접 정하기보다 평균 CPU 55% 부근을 유지하려 한다. 어떤 확장 정책이
              적합한가?
            answer: 평균 CPU target tracking에 실제 준비 시간을 반영한 워밍업을 설정한다.
            wrong:
              - CPU 임계치마다 직접 정한 증감 수량의 step scaling만 사용한다.
              - 전체 인스턴스 CPU 합계를 고정 목표로 하는 사용자 지정 target tracking을 쓴다.
              - 매일 같은 시각에 서버를 늘리는 예약 확장을 단독으로 사용한다.
      - id: saa-r2-Q22-10
        source_id: Q22-10
        type: mcq
        title: Q22-10 · 모의고사 A
        explain: |
          <p>ExternalId를 고객별로 구분해 신뢰 정책에서 요구하면 혼동된 대리인 문제를 완화한다. 이는 비밀 암호 대신 SaaS가 누구를 대신하는지 확인하는 조건이며 최소 권한과 함께 적용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>지정 SaaS 역할을 신뢰하고 호출 때마다 고유한 세션 이름만 요구한다.</td>
          <td>고유 세션 이름은 추적에 도움되지만 요청이 승인된 고객을 위한 것인지 증명하는 고객별 위임 조건을 대신하지 못한다.</td>
          </tr>
          <tr>
          <td>지정 SaaS 역할을 신뢰하고 비용 조회 전용 권한만 대상 역할에 연결한다.</td>
          <td>읽기 범위 제한은 피해 범위를 줄이지만 다른 고객을 대신한 잘못된 역할 호출 자체를 구분하지 않는다.</td>
          </tr>
          <tr>
          <td>지정 SaaS 역할을 신뢰하고 SaaS의 모든 고객에게 동일 ExternalId를 배포한다.</td>
          <td>공통 ExternalId는 고객별 구분을 제공하지 않아 다른 고객 요청과 분리하려는 목적을 잃는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html">External ID</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EC%A7%81%EC%9B%90-%EC%A0%91%EA%B7%BC%EA%B3%BC-%EC%99%B8%EB%B6%80-%EA%B3%B5%EA%B8%89%EC%97%85%EC%B2%B4-%EC%9C%84%EC%9E%84">제삼자가 역할을 맡는 교차 계정 위임에서는 신뢰할 업체 주체와 고객별 external ID 조건을 함께 사용해 혼동된 대리인 문제를 완화한다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EC%A7%81%EC%9B%90-%EC%A0%91%EA%B7%BC%EA%B3%BC-%EC%99%B8%EB%B6%80-%EA%B3%B5%EA%B8%89%EC%97%85%EC%B2%B4-%EC%9C%84%EC%9E%84">외부 ID는 비밀번호를 대신하는 비밀값이 아니다</a></p>
        quizzes:
          - q: 다중 고객을 운영하는 감사 SaaS가 고객 계정의 비용 조회 역할을 맡는다. 호출자는 SaaS 계정의 지정 역할이며 그 역할에
              AssumeRole 권한도 있다. 다른 고객이 SaaS에 이 회사 역할 ARN을 제출해 대신 접근하게 만드는 혼동을
              막으려 한다. 역할 신뢰를 어떻게 구성해야 하는가?
            answer: 지정 SaaS 역할을 신뢰하고 SaaS가 발급한 고객별 ExternalId 조건을 요구한다.
            wrong:
              - 지정 SaaS 역할을 신뢰하고 호출 때마다 고유한 세션 이름만 요구한다.
              - 지정 SaaS 역할을 신뢰하고 비용 조회 전용 권한만 대상 역할에 연결한다.
              - 지정 SaaS 역할을 신뢰하고 SaaS의 모든 고객에게 동일 ExternalId를 배포한다.
      - id: saa-r2-Q22-11
        source_id: Q22-11
        type: mcq
        title: Q22-11 · 모의고사 A
        explain: |
          <p>지원 플랫폼의 Fargate 임시 저장 공간을 늘리면 기존 파일 경로를 유지하면서 별도 파일 시스템이나 호스트를 추가하지 않는다. 이미지가 차지하는 공간까지 포함해 여유를 계산한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Regional EFS를 만들고 작업 디렉터리를 네트워크 파일 시스템으로 마운트한다.</td>
          <td>EFS는 공유·영속 파일에 적합하지만 작업 수명만 필요한 로컬 공간을 위해 별도 파일 시스템·접근 구성을 추가한다.</td>
          </tr>
          <tr>
          <td>ECS EC2 용량 공급자를 만들고 호스트에 100GiB EBS 작업 디스크를 연결한다.</td>
          <td>EC2+EBS도 공간을 제공하지만 호스트와 용량을 관리해야 해 운영 최소화 조건에 불리하다.</td>
          </tr>
          <tr>
          <td>인스턴스 스토어가 있는 EC2 용량 공급자로 옮겨 호스트의 임시 디스크를 쓴다.</td>
          <td>인스턴스 스토어는 임시 공간을 제공하지만 EC2 호스트 운영을 도입해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-task-storage.html">Fargate 임시 저장 공간</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/using_data_volumes.html">ECS 저장 옵션</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">Fargate Linux 1.4.0 이상은 기본 20GiB 임시 저장 공간을 제공하며 작업 정의에서 최대 200GiB까지 늘릴 수 있다</a> · <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">이미지의 압축·해제 공간도 같은 할당량을 사용하므로 합계 46GiB보다 여유 있는 60GiB를 선택한다</a> · <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">파일을 공유하거나 작업 종료 후 보존할 필요가 없어 EFS나 직접 관리하는 EC2 호스트를 추가할 이유가 없다</a></p>
        quizzes:
          - q: ECS 변환 작업은 Linux Fargate 1.4.0에서 20분 실행된다. 이미지와 임시 작업 파일을 합쳐 최대 46GiB를 쓰며 작업
              종료 뒤 보존·공유할 파일은 없다. 기존 로컬 파일 경로를 유지하고 파일 서버나 EC2 호스트를 운영하지 않으려 한다.
              디스크 부족을 해결할 가장 단순한 구성은?
            answer: Fargate 작업 정의의 ephemeralStorage를 60GiB로 설정한다.
            wrong:
              - Regional EFS를 만들고 작업 디렉터리를 네트워크 파일 시스템으로 마운트한다.
              - ECS EC2 용량 공급자를 만들고 호스트에 100GiB EBS 작업 디스크를 연결한다.
              - 인스턴스 스토어가 있는 EC2 용량 공급자로 옮겨 호스트의 임시 디스크를 쓴다.
      - id: saa-r2-Q22-12
        source_id: Q22-12
        type: mcq
        title: Q22-12 · 모의고사 A
        explain: |
          <p>세션을 외부의 다중 AZ 저장소로 분리하고 웹 계층도 여러 AZ에 배치해야 상태와 실행 용량의 장애 범위를 함께 줄인다. ALB 고정 세션만으로는 사라진 서버의 RAM을 복구하지 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ALB 고정 세션 시간을 늘리고 각 EC2의 RAM 세션을 계속 사용한다.</td>
          <td>고정 세션은 같은 서버로 보내는 동작이며 그 서버나 AZ가 사라졌을 때 세션을 보존하지 않는다.</td>
          </tr>
          <tr>
          <td>세션 파일을 단일 AZ의 NFS 서버에 모아 모든 웹 서버가 마운트한다.</td>
          <td>파일을 공유해도 단일 AZ의 파일 서버가 세션 계층의 단일 장애 지점이 된다.</td>
          </tr>
          <tr>
          <td>단일 AZ의 ASG에 더 많은 웹 인스턴스를 배치한다.</td>
          <td>서버 수 증가는 인스턴스 장애를 완화할 수 있지만 같은 AZ 장애에 모두 영향을 받는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_mitigate_interaction_failure_stateless.html">Externalize session state</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#%EC%84%B8%EC%85%98%EC%9D%98-%EC%83%A4%EB%93%9C%EC%99%80-%EB%B3%B5%EC%A0%9C%EB%B3%B8">웹 계층을 여러 장애 영역에 배치하고 세션 상태를 개별 인스턴스 밖에 두면 서버 장애와 교체에도 요청을 이어갈 수 있다</a> · <a href="/study/lessons/deep-dive/day-08.html#%EC%84%B8%EC%85%98%EC%9D%98-%EC%83%A4%EB%93%9C%EC%99%80-%EB%B3%B5%EC%A0%9C%EB%B3%B8">외부 저장소 자체의 복원력도 함께 확보해야 한다</a></p>
        quizzes:
          - q: 웹 앱은 두 대의 EC2에 각각 로그인 세션을 RAM으로 보관한다. 현재 ALB 고정 세션으로 로그인은 유지되지만 서버 종료 때 사용자가
              다시 로그인해야 한다. AZ 하나를 잃어도 세션과 웹 응답을 유지하도록 앱을 수정할 수 있다. 두 계층의 단일 장애
              지점을 없앨 조치 두 가지는?
            answer: 세션을 다중 AZ 가용성을 갖춘 공유 세션 저장소로 옮긴다.
            wrong:
              - ALB 고정 세션 시간을 늘리고 각 EC2의 RAM 세션을 계속 사용한다.
              - 세션 파일을 단일 AZ의 NFS 서버에 모아 모든 웹 서버가 마운트한다.
              - 단일 AZ의 ASG에 더 많은 웹 인스턴스를 배치한다.
            answers:
              - 세션을 다중 AZ 가용성을 갖춘 공유 세션 저장소로 옮긴다.
              - ALB와 여러 AZ의 ASG로 웹 인스턴스를 배치한다.
            options:
              - 세션을 다중 AZ 가용성을 갖춘 공유 세션 저장소로 옮긴다.
              - ALB와 여러 AZ의 ASG로 웹 인스턴스를 배치한다.
              - ALB 고정 세션 시간을 늘리고 각 EC2의 RAM 세션을 계속 사용한다.
              - 세션 파일을 단일 AZ의 NFS 서버에 모아 모든 웹 서버가 마운트한다.
              - 단일 AZ의 ASG에 더 많은 웹 인스턴스를 배치한다.
      - id: saa-r2-Q22-13
        source_id: Q22-13
        type: mcq
        title: Q22-13 · 모의고사 A
        explain: |
          <p>Cluster 배치는 가까운 노드 배치를 지향하며 지원 인스턴스·네트워크 기능을 함께 선택해야 네트워크 병목을 줄일 수 있다. 배치 전략만 바꿔 인스턴스 대역폭 한도가 사라지는 것은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>spread placement group으로 기반 하드웨어 간 장애 격리를 우선한다.</td>
          <td>Spread는 하드웨어 장애 격리에 유용하지만 요구한 밀집 배치·노드 간 통신 최적화를 우선하지 않는다.</td>
          </tr>
          <tr>
          <td>여러 AZ의 partition placement group으로 노드를 넓게 분산한다.</td>
          <td>여러 AZ 분산은 장애 범위를 줄이지만 이번에 수용한 AZ 위험 대신 통신 지연·전송 비용을 늘릴 수 있다.</td>
          </tr>
          <tr>
          <td>현재 네트워크 사양을 유지하고 CPU 코어 수만 두 배로 늘린다.</td>
          <td>관측된 병목이 네트워크이므로 CPU 증가만으로 필요한 지연·대역폭을 확보하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-groups.html">Placement groups</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/enhanced-networking.html">Enhanced networking</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%EB%B0%B0%EC%B9%98-%EA%B7%B8%EB%A3%B9%EA%B3%BC-dedicated-host">Cluster 배치는 같은 AZ 안의 가까운 네트워크 배치로 통신 성능을 높이는 데 사용된다</a> · <a href="/study/lessons/deep-dive/day-02.html#%EB%B0%B0%EC%B9%98-%EA%B7%B8%EB%A3%B9%EA%B3%BC-dedicated-host">실제 성능은 인스턴스 네트워크·드라이버·워크로드에 맞는 지원 기능까지 함께 확인해야 한다</a></p>
        quizzes:
          - q: MPI 기반 계산은 수십 노드 사이에 지속적인 대용량 통신을 한다. CPU는 여유가 있지만 노드 간 지연·대역폭이 병목이다. 같은 AZ에
              모여 실행해도 되고 장애 시 체크포인트로 다시 계산한다. 배치와 네트워크 병목을 함께 개선할 선택 두 가지는?
            answer: 지원 인스턴스를 같은 AZ의 cluster placement group에 배치한다.
            wrong:
              - spread placement group으로 기반 하드웨어 간 장애 격리를 우선한다.
              - 여러 AZ의 partition placement group으로 노드를 넓게 분산한다.
              - 현재 네트워크 사양을 유지하고 CPU 코어 수만 두 배로 늘린다.
            answers:
              - 지원 인스턴스를 같은 AZ의 cluster placement group에 배치한다.
              - 요구 대역폭의 인스턴스와 지원되는 ENA·필요한 EFA 구성을 사용한다.
            options:
              - 지원 인스턴스를 같은 AZ의 cluster placement group에 배치한다.
              - 요구 대역폭의 인스턴스와 지원되는 ENA·필요한 EFA 구성을 사용한다.
              - spread placement group으로 기반 하드웨어 간 장애 격리를 우선한다.
              - 여러 AZ의 partition placement group으로 노드를 넓게 분산한다.
              - 현재 네트워크 사양을 유지하고 CPU 코어 수만 두 배로 늘린다.
      - id: saa-r2-Q22-14
        source_id: Q22-14
        type: mcq
        title: Q22-14 · 모의고사 A
        explain: |
          <p>일반 Multi-AZ 대기는 읽기 분산 대상이 아니므로 읽기 복제본을 추가한다. 주문용 Multi-AZ의 장애 복구 목적과 비동기 읽기 복제본의 조회 분산 목적을 구분한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Multi-AZ를 읽기 복제본으로 교체하고 장애 때 운영자가 수동 승격한다.</td>
          <td>조회 분산은 가능하지만 기존 Multi-AZ 자동 복구를 수동 승격으로 대체해 가용성 조건을 낮춘다.</td>
          </tr>
          <tr>
          <td>매일 복원한 보고서 전용 DB에 모든 보고서를 보내고 원본은 Multi-AZ로 둔다.</td>
          <td>일일 복원은 보고서에 허용한 수분보다 오래된 데이터를 제공한다.</td>
          </tr>
          <tr>
          <td>Multi-AZ 주 인스턴스를 크게 늘리고 보고서도 계속 같은 엔드포인트로 보낸다.</td>
          <td>확장으로 여유를 늘릴 수 있지만 조회와 쓰기 경로는 계속 공유하므로 요청한 부하 분리가 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html">RDS Multi-AZ DB instances</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#%EA%B0%80%EC%9A%A9%EC%84%B1-%EC%9D%BD%EA%B8%B0-%ED%99%95%EC%9E%A5%EA%B3%BC-%EC%97%B0%EA%B2%B0-%EC%88%98">일반 Multi-AZ DB 인스턴스의 대기는 장애 조치용이며 읽기 서비스용이 아니다</a> · <a href="/study/lessons/deep-dive/day-07.html#%EA%B0%80%EC%9A%A9%EC%84%B1-%EC%9D%BD%EA%B8%B0-%ED%99%95%EC%9E%A5%EA%B3%BC-%EC%97%B0%EA%B2%B0-%EC%88%98">읽기 복제본은 조회를 분리하지만 비동기 지연을 고려해야 하므로 기존 장애 복구 구성과 함께 사용한다</a></p>
        quizzes:
          - q: 주문용 RDS PostgreSQL은 일반 Multi-AZ DB 인스턴스 배포다. 피크 때 보고서 조회가 쓰기 지연을 높인다. AZ 장애
              자동 복구는 유지해야 하고 보고서는 최대 수분의 복제 지연을 허용한다. 기존 주문 쓰기 경로를 바꾸지 않고 부하를
              분리할 설계는?
            answer: Multi-AZ를 유지하고 별도 읽기 복제본 엔드포인트로 보고서를 보낸다.
            wrong:
              - Multi-AZ를 읽기 복제본으로 교체하고 장애 때 운영자가 수동 승격한다.
              - 매일 복원한 보고서 전용 DB에 모든 보고서를 보내고 원본은 Multi-AZ로 둔다.
              - Multi-AZ 주 인스턴스를 크게 늘리고 보고서도 계속 같은 엔드포인트로 보낸다.
      - id: saa-r2-Q22-15
        source_id: Q22-15
        type: mcq
        title: Q22-15 · 모의고사 A
        explain: |
          <p>앱은 고객 인가를 확인한 뒤 제한된 객체·작업·만료의 사전 서명 URL을 발급한다. 고객은 S3에서 직접 파일을 받으며 URL 보유자는 만료 전 사용할 수 있으므로 전달 범위도 통제해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 파일을 읽어 앱 서버가 만든 10분 유효 다운로드 스트리밍 응답</td>
          <td>시간 제한은 구현 가능하지만 파일 바이트가 앱 서버를 통과해 지문에서 제거하려는 병목을 유지한다.</td>
          </tr>
          <tr>
          <td>고객용 IAM 사용자에 연결한 객체 읽기 정책과 그 사용자의 액세스 키</td>
          <td>사용자·장기 키 발급은 고객의 AWS 자격 증명 관리가 필요하고 짧은 파일 접근에 운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>객체 ACL을 공개 읽기로 바꾸고 10분 뒤 다시 비공개로 만드는 예약 작업</td>
          <td>공개 상태의 객체는 승인 고객 외에도 접근할 수 있어 비공개 유지 요구를 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html">Presigned URLs</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#%EC%97%85%EB%A1%9C%EB%93%9C%EC%A7%91%EA%B3%84%EC%9A%94%EA%B8%88-%EB%B6%80%EB%8B%B4-%EC%A3%BC%EC%B2%B4">사전 서명 URL은 발급 주체 권한 범위에서 지정 객체에 시간 제한 접근을 제공한다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EC%97%85%EB%A1%9C%EB%93%9C%EC%A7%91%EA%B3%84%EC%9A%94%EA%B8%88-%EB%B6%80%EB%8B%B4-%EC%A3%BC%EC%B2%B4">인증·권한 검사는 앱에서 수행하고 데이터 전송은 S3에서 직접 하므로 서버 중계 부하를 줄인다</a></p>
        quizzes:
          - q: 비공개 S3의 계약서 한 개를 앱에서 권한 확인한 고객에게 10분간 제공한다. 고객에게 AWS 계정을 만들게 할 수 없고 다운로드 바이트가
              앱 서버를 거치면 전송 비용과 연결 수가 병목이 된다. CDN은 도입하지 않는다. 권한 확인 뒤 앱이 반환할 것은?
            answer: 읽기 권한이 있는 역할로 서명한 해당 객체의 짧은 S3 사전 서명 URL
            wrong:
              - S3 파일을 읽어 앱 서버가 만든 10분 유효 다운로드 스트리밍 응답
              - 고객용 IAM 사용자에 연결한 객체 읽기 정책과 그 사용자의 액세스 키
              - 객체 ACL을 공개 읽기로 바꾸고 10분 뒤 다시 비공개로 만드는 예약 작업
      - id: saa-r2-Q22-16
        source_id: Q22-16
        type: mcq
        title: Q22-16 · 모의고사 A
        explain: |
          <p>온디맨드는 불규칙한 요청과 용량 계획 부담을 줄이는 출발점이다. 무제한 처리 보장을 뜻하지 않으므로 할당량·급격한 신규 피크와 실제 비용을 계속 확인한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>최대 피크를 provisioned로 고정하고 장기 예약 용량을 구매한다.</td>
          <td>피크가 짧고 지속 기준 부하가 없으므로 연중 예약한 용량의 유휴 비용이 크다.</td>
          </tr>
          <tr>
          <td>최저 provisioned 용량으로 시작하고 throttling 요청을 장시간 재시도한다.</td>
          <td>재시도만으로 지연·처리량 요구를 충족한다고 볼 수 없고 낮은 고정 용량의 제한이 남는다.</td>
          </tr>
          <tr>
          <td>최근 평균 요청의 provisioned 용량을 고정하고 행사 전에 수동 증설한다.</td>
          <td>수동 증설은 행사 피크를 미리 예측하고 운영해야 하므로 이번 요구보다 운영 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/capacity-mode.html">DynamoDB capacity modes</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#%ED%95%AD%EB%AA%A9-%ED%81%AC%EA%B8%B0%EC%99%80-%EC%B2%98%EB%A6%AC-%EC%9A%A9%EB%9F%89-%EA%B3%84%EC%82%B0">온디맨드는 불확실하고 가변적인 요청에 대해 상시 고정 용량 계획을 줄이는 선택지다</a> · <a href="/study/lessons/deep-dive/day-08.html#%ED%95%AD%EB%AA%A9-%ED%81%AC%EA%B8%B0%EC%99%80-%EC%B2%98%EB%A6%AC-%EC%9A%A9%EB%9F%89-%EA%B3%84%EC%82%B0">단일 키 집중이나 급격한 변화 등 서비스 특성은 남으므로 측정과 비용 검토를 계속해야 한다</a></p>
        quizzes:
          - q: DynamoDB 티켓 조회는 월간 행사의 불규칙한 며칠에 급증하고 나머지 날은 거의 없다. 아직 매시간 지속되는 기준 부하는 없으며 키는
              고르게 분산돼 있다. 팀은 피크를 미리 추정해 용량을 예약하기보다 실제 요청에 따라 지불하고 싶다. 시작점으로 적합한
              용량 전략은?
            answer: 온디맨드 모드로 시작하고 실제 요청 비용·피크 동작을 관찰한다.
            wrong:
              - 최대 피크를 provisioned로 고정하고 장기 예약 용량을 구매한다.
              - 최저 provisioned 용량으로 시작하고 throttling 요청을 장시간 재시도한다.
              - 최근 평균 요청의 provisioned 용량을 고정하고 행사 전에 수동 증설한다.
      - id: saa-r2-Q22-17
        source_id: Q22-17
        type: mcq
        title: Q22-17 · 모의고사 A
        explain: |
          <p>권한 경계는 신원 기반 정책이 부여할 수 있는 권한의 상한이다. 생성·변경 경로에서 지정 경계를 강제하고 변경·제거·경계 정책 변조도 제한해야 상한을 우회하지 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>팀별 ReadOnlyAccess를 관리자 정책과 함께 연결하고 정책 사용을 감사한다.</td>
          <td>추가 Allow 정책은 이미 있는 관리자 Allow를 취소하지 않는다. 사용 감사도 사전 상한을 대신하지 못한다.</td>
          </tr>
          <tr>
          <td>생성된 역할의 신뢰 주체를 개발자로 제한하고 권한 정책은 자유롭게 연결한다.</td>
          <td>신뢰 정책은 누가 역할을 맡을지 정하며 맡은 역할의 서비스 작업 상한을 정하지 않는다.</td>
          </tr>
          <tr>
          <td>개발자 자신의 정책을 승인 서비스로 제한하고 생성 역할의 경계는 두지 않는다.</td>
          <td>개발자 자신의 작업 허용과 새 역할이 얻는 권한은 별개이므로 생성 역할의 권한 상승 경로가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html">Permissions boundaries</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">Permissions boundary는 역할이 가질 수 있는 최대 권한을 제한한다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">생성 시 지정 경계를 강제하고 개발자의 경계 제거·교체·경계 정책 변조도 막아야 상한을 우회하지 못한다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">실제 업무 권한은 별도 정책으로 부여한다</a></p>
        quizzes:
          - q: 개발자는 자신의 배포 역할을 만들고 팀별 업무 정책을 연결할 수 있다. 보안팀은 역할 생성 자체를 중앙 승인제로 바꾸지 않으면서, 개발자가
              관리자 정책을 연결해도 승인 서비스 밖으로 권한을 넓히지 못하게 해야 한다. 어떤 위임 정책이 적합한가?
            answer: 지정 권한 경계의 연결을 강제하고 경계 제거·교체·정책 변조를 통제한다.
            wrong:
              - 팀별 ReadOnlyAccess를 관리자 정책과 함께 연결하고 정책 사용을 감사한다.
              - 생성된 역할의 신뢰 주체를 개발자로 제한하고 권한 정책은 자유롭게 연결한다.
              - 개발자 자신의 정책을 승인 서비스로 제한하고 생성 역할의 경계는 두지 않는다.
      - id: saa-r2-Q22-18
        source_id: Q22-18
        type: mcq
        title: Q22-18 · 모의고사 A
        explain: |
          <p>쓰기 샤딩은 집중된 고객 쓰기를 여러 키로 분산한다. 최근 항목을 찾으려면 샤드별 결과를 모아 정렬·병합해야 하므로 읽기 접근 패턴을 함께 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DAX를 추가하고 이벤트 쓰기와 고객 ID 키 구조는 그대로 둔다.</td>
          <td>DAX는 반복 읽기 캐시이며 쓰기가 집중되는 파티션 키 구조를 분산하지 않는다.</td>
          </tr>
          <tr>
          <td>고객 ID는 유지하고 이벤트 시간의 정렬 순서만 역순으로 바꾼다.</td>
          <td>정렬 키 표현만 바꿔도 동일 파티션 키로 모이는 쓰기 집중은 유지된다.</td>
          </tr>
          <tr>
          <td>같은 파티션 키를 유지한 채 테이블 전체 쓰기 용량만 크게 늘린다.</td>
          <td>전체 용량만 늘려도 특정 파티션·키 집중의 한계를 직접 해결하지 못할 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html">DynamoDB partition key design</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#hot-key%EC%99%80-lsi-item-collection">전체 용량과 특정 키의 집중은 다른 문제다</a> · <a href="/study/lessons/deep-dive/day-08.html#hot-key%EC%99%80-lsi-item-collection">쓰기를 여러 키로 분산하되 조회가 필요한 샤드를 읽고 합치도록 모델을 바꾸면 쓰기 분산과 업무 조회 요구를 함께 검토할 수 있다</a></p>
        quizzes:
          - q: DynamoDB 테이블은 고객 ID를 파티션 키, 이벤트 시간을 정렬 키로 쓴다. 고객 한 곳의 쓰기만 급증해 throttling이 나고
              전체 테이블의 사용량은 여유가 있다. 고객별 최근 이벤트 조회는 유지해야 하지만 읽을 때 여러 결과를 합치는 앱 수정은
              가능하다. 적합한 키 설계는?
            answer: 고객 키에 분산 접미사를 둔 쓰기 샤딩과 최근 결과 병합 조회를 구성한다.
            wrong:
              - DAX를 추가하고 이벤트 쓰기와 고객 ID 키 구조는 그대로 둔다.
              - 고객 ID는 유지하고 이벤트 시간의 정렬 순서만 역순으로 바꾼다.
              - 같은 파티션 키를 유지한 채 테이블 전체 쓰기 용량만 크게 늘린다.
      - id: saa-r2-Q22-19
        source_id: Q22-19
        type: mcq
        title: Q22-19 · 모의고사 A
        explain: |
          <p>DAX는 호환 DynamoDB 읽기 경로에 관리형 캐시를 제공한다. 강한 일관성을 요구하는 읽기는 이 캐시 이점을 그대로 얻는 경우와 구분하며 TTL·용량·보안도 설정한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>고정 보고서 결과를 S3로 내보내고 API가 매번 S3에서 결과를 읽게 한다.</td>
          <td>S3 결과 파일은 고정·배치 보고서에는 유용하지만 현재 키별 API 데이터 갱신과 호환 호출을 크게 바꾼다.</td>
          </tr>
          <tr>
          <td>DynamoDB 강한 일관성 읽기로 바꾸고 원본 읽기 용량을 증설한다.</td>
          <td>강한 일관성은 이번 요구보다 강하지만 반복 원본 읽기를 줄이지 못한다.</td>
          </tr>
          <tr>
          <td>ElastiCache에 cache-aside 조회·갱신·무효화 로직을 직접 구현한다.</td>
          <td>ElastiCache도 캐시를 제공하지만 직접 채우기·갱신·무효화 로직을 관리해야 해 인력 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html">DAX</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#%EB%8B%A4%EC%A4%91-%EB%A6%AC%EC%A0%84-%EC%9D%BC%EA%B4%80%EC%84%B1%EA%B3%BC-%EC%BA%90%EC%8B%9C">DAX는 DynamoDB 읽기 캐시로 반복 읽기와 허용 가능한 최종 일관성 요구에 적합하다</a> · <a href="/study/lessons/deep-dive/day-08.html#%EB%8B%A4%EC%A4%91-%EB%A6%AC%EC%A0%84-%EC%9D%BC%EA%B4%80%EC%84%B1%EA%B3%BC-%EC%BA%90%EC%8B%9C">캐시 지원·일관성 특성을 확인하고 원본 DB를 대체하는 영구 저장소로 보지 않아야 한다</a></p>
        quizzes:
          - q: 상품 API는 DynamoDB의 동일 키를 초당 수천 번 읽으며 수초의 오래된 값은 허용한다. 앱은 호환되는 DynamoDB 읽기 API를
              쓰고 있다. 캐시 채우기·만료·무효화 로직을 별도로 개발할 인력이 없을 때 반복 조회 지연과 원본 읽기를 줄일 방안은?
            answer: 호환되는 DynamoDB 호출 경로에 DAX 클라이언트와 캐시를 도입한다.
            wrong:
              - 고정 보고서 결과를 S3로 내보내고 API가 매번 S3에서 결과를 읽게 한다.
              - DynamoDB 강한 일관성 읽기로 바꾸고 원본 읽기 용량을 증설한다.
              - ElastiCache에 cache-aside 조회·갱신·무효화 로직을 직접 구현한다.
      - id: saa-r2-Q22-20
        source_id: Q22-20
        type: mcq
        title: Q22-20 · 모의고사 A
        explain: |
          <p>외부 서버의 443에서 EC2의 임시 포트로 돌아오는 응답을 인바운드 NACL에서 허용해야 한다. 지문에 제공한 실제 클라이언트 포트 범위와 외부 주소를 사용하면 과도한 개방을 피할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2 보안 그룹에 외부 API 주소의 인바운드 목적지 443 허용을 추가한다.</td>
          <td>정상인 상태 저장 보안 그룹을 바꿔도 NACL에서 거부되는 응답은 통과하지 못한다.</td>
          </tr>
          <tr>
          <td>아웃바운드 NACL에 외부 API 주소의 목적지 49152~65535 허용을 추가한다.</td>
          <td>반환 응답은 인바운드 방향이므로 아웃바운드 임시 포트 허용으로 드롭 원인을 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>인바운드 NACL의 목적지 443 허용 규칙을 더 낮은 규칙 번호로 옮긴다.</td>
          <td>응답의 목적지는 443이 아니므로 기존 인바운드 443 규칙의 순서만 바꿔도 조건이 일치하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html">Network ACL rules</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#nacl%EC%97%90%EC%84%9C-%EC%9A%94%EC%B2%AD%EA%B3%BC-%EC%9D%91%EB%8B%B5%EC%9D%98-%EB%AA%A9%EC%A0%81%EC%A7%80-%ED%8F%AC%ED%8A%B8-%EC%B0%BE%EA%B8%B0">NACL은 상태 비저장이라 외부로 시작한 연결의 응답도 별도 인바운드 규칙이 필요하다</a> · <a href="/study/lessons/deep-dive/day-04.html#%ED%8C%A8%ED%82%B7%EA%B3%BC-%EC%97%B0%EA%B2%B0%EC%9D%84-%EA%B5%AC%EB%B6%84%ED%95%B4-%EC%9D%BD%EA%B8%B0">반환 패킷은 앱이 사용한 임시 소스 포트를 목적지로 하므로 해당 범위를 허용해야 한다</a></p>
        quizzes:
          - q: 사설 EC2는 외부 HTTPS API의 443으로 연결할 때 소스 포트 49152~65535를 쓴다. NAT·라우팅·보안 그룹은 정상이다.
              새 NACL은 아웃바운드 목적지 443, 인바운드 목적지 443만 허용하며 응답 패킷을 드롭한다. 가장 좁게 이 연결을
              복구할 변경은?
            answer: 인바운드 NACL에 외부 API 주소의 목적지 49152~65535 허용을 추가한다.
            wrong:
              - EC2 보안 그룹에 외부 API 주소의 인바운드 목적지 443 허용을 추가한다.
              - 아웃바운드 NACL에 외부 API 주소의 목적지 49152~65535 허용을 추가한다.
              - 인바운드 NACL의 목적지 443 허용 규칙을 더 낮은 규칙 번호로 옮긴다.
      - id: saa-r2-Q22-21
        source_id: Q22-21
        type: mcq
        title: Q22-21 · 모의고사 A
        explain: |
          <p>S3에 내구성 있게 파일을 보관하고 SQS에는 파일 참조를 전달하면 요청 수명과 워커 수명을 분리한다. 워커는 성공 후 메시지를 지우며 재전달에는 멱등하게 대응한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>API 서버가 원본을 EBS에 저장하고 변환 완료까지 ALB 연결을 유지한다.</td>
          <td>파일은 남길 수 있지만 장시간 HTTP 연결과 API 실행 수명이 변환에 묶여 피크 타임아웃 문제가 계속된다.</td>
          </tr>
          <tr>
          <td>S3에 원본을 보관하고 API 요청 안에서 동기 Lambda 변환 완료를 기다린다.</td>
          <td>계산 실행 위치를 옮겨도 동기 응답 대기를 유지하므로 즉시 접수 ID를 반환하는 구조가 아니다.</td>
          </tr>
          <tr>
          <td>API 서버가 비동기 스레드를 만들고 접수 응답 뒤 같은 프로세스에서 변환한다.</td>
          <td>응답은 빨라질 수 있으나 API 프로세스가 교체되면 실행 중 작업 상태가 사라질 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html">SQS distributed architecture</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">파일은 내구성 있는 저장소에 보관하고 작업은 큐로 분리하면 접수 응답과 긴 처리를 독립적으로 확장할 수 있다</a> · <a href="/study/lessons/day-10.html#1-%EC%9A%94%EC%B2%AD%EC%9D%84-%EA%B8%B0%EB%8B%A4%EB%A6%AC%EB%8A%94-%EC%9E%91%EC%97%85%EA%B3%BC-%EB%82%98%EC%A4%91%EC%97%90-%EC%B2%98%EB%A6%AC%ED%95%A0-%EC%9E%91%EC%97%85">서버 교체에도 원본과 대기 작업이 남아 재시도할 수 있다</a></p>
        quizzes:
          - q: 영상 업로드 API가 변환이 끝날 때까지 응답을 기다려 피크에 타임아웃이 난다. 파일은 수백 MB이고 변환 시간은 수분 이상이다. 고객은
              접수 ID를 바로 받고 나중에 결과를 조회해도 된다. API 서버 교체·변환 워커 장애에도 접수 작업을 잃지 않을
              설계는?
            answer: 원본은 S3에 보관하고 SQS에 작업 참조를 넣어 별도 워커가 변환한다.
            wrong:
              - API 서버가 원본을 EBS에 저장하고 변환 완료까지 ALB 연결을 유지한다.
              - S3에 원본을 보관하고 API 요청 안에서 동기 Lambda 변환 완료를 기다린다.
              - API 서버가 비동기 스레드를 만들고 접수 응답 뒤 같은 프로세스에서 변환한다.
      - id: saa-r2-Q22-22
        source_id: Q22-22
        type: mcq
        title: Q22-22 · 모의고사 A
        explain: |
          <p>비현재 버전 만료와 미완료 멀티파트 중단은 서로 다른 수명 주기 동작이다. 현재 객체 만료와 혼동하지 않고 필요한 30일 복구·7일 업로드 기준을 각각 적용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버전 관리를 일시 중지하고 현재 객체만 유지하도록 신규 쓰기를 전환한다.</td>
          <td>버전 관리 중지는 기존 비현재 버전이나 멀티파트 조각을 자동 삭제하지 않는다.</td>
          </tr>
          <tr>
          <td>새 객체와 비현재 버전을 Intelligent-Tiering으로 전환한다.</td>
          <td>계층 전환은 저장비를 바꾸지만 보존 요구를 넘긴 버전의 삭제와 미완료 조각 중단을 직접 수행하지 않는다.</td>
          </tr>
          <tr>
          <td>현재 버전이 30일이 되면 만료시키는 수명 주기만 설정한다.</td>
          <td>현재 버전 만료는 최신 객체를 삭제 마커로 가릴 수 있고 오래된 비현재 버전·미완료 조각의 정리를 대신하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html">S3 lifecycle actions</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#lifecycle%EA%B3%BC-%EC%9A%A9%EB%9F%89-%EC%82%B0%EC%A0%95">비현재 버전과 미완료 멀티파트는 별도로 비용을 만들 수 있다</a> · <a href="/study/lessons/deep-dive/day-03.html#lifecycle%EA%B3%BC-%EC%9A%A9%EB%9F%89-%EC%82%B0%EC%A0%95">복구 정책에 맞는 버전 보존·만료와 미완료 업로드 중단을 각각 설정하면 필요한 최신 데이터는 유지하며 낭비를 줄일 수 있다</a></p>
        quizzes:
          - q: 버전 관리 S3 버킷은 최신 객체와 최근 30일의 이전 버전을 복구용으로 유지해야 한다. 비용 분석에서 30일을 넘긴 비현재 버전과 7일
              넘게 완료되지 않은 멀티파트 조각이 대부분을 차지한다. 정상 객체의 접근 방식은 바꾸지 않고 두 비용 원인을 제거할
              변경 두 가지는?
            answer: 복구 조건을 반영해 비현재 버전이 된 뒤 30일을 넘긴 버전의 만료를 설정한다.
            wrong:
              - 버전 관리를 일시 중지하고 현재 객체만 유지하도록 신규 쓰기를 전환한다.
              - 새 객체와 비현재 버전을 Intelligent-Tiering으로 전환한다.
              - 현재 버전이 30일이 되면 만료시키는 수명 주기만 설정한다.
            answers:
              - 복구 조건을 반영해 비현재 버전이 된 뒤 30일을 넘긴 버전의 만료를 설정한다.
              - 7일 넘게 미완료인 멀티파트 업로드를 중단하는 수명 주기를 설정한다.
            options:
              - 버전 관리를 일시 중지하고 현재 객체만 유지하도록 신규 쓰기를 전환한다.
              - 새 객체와 비현재 버전을 Intelligent-Tiering으로 전환한다.
              - 복구 조건을 반영해 비현재 버전이 된 뒤 30일을 넘긴 버전의 만료를 설정한다.
              - 7일 넘게 미완료인 멀티파트 업로드를 중단하는 수명 주기를 설정한다.
              - 현재 버전이 30일이 되면 만료시키는 수명 주기만 설정한다.
      - id: saa-r2-Q22-23
        source_id: Q22-23
        type: mcq
        title: Q22-23 · 모의고사 A
        explain: |
          <p>Regional EFS는 여러 AZ의 클라이언트가 같은 관리형 파일 시스템을 사용할 수 있게 한다. 각 AZ의 마운트 경로와 네트워크 접근을 구성하고 애플리케이션의 동시 쓰기 방식도 검토한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>각 AZ의 컨테이너에 개별 EBS를 연결하고 매일 스냅샷으로 파일을 맞춘다.</td>
          <td>개별 디스크와 일일 스냅샷은 동시에 같은 파일을 읽고 쓰는 공유 파일 시스템의 일관된 접근을 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>EFS One Zone을 만들고 다른 AZ의 컨테이너도 그 파일 시스템을 마운트한다.</td>
          <td>다른 AZ에서 마운트해도 One Zone 저장소 자체의 AZ 장애 위험은 사라지지 않는다.</td>
          </tr>
          <tr>
          <td>EC2 NFS 서버 한 대와 EBS를 두고 모든 컨테이너가 같은 경로를 마운트한다.</td>
          <td>NFS 공유는 기능적으로 가능하지만 단일 서버·AZ 장애와 OS 패치·복구 운영이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html">Amazon EFS</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#efs-%EB%A7%88%EC%9A%B4%ED%8A%B8%EC%99%80-%EC%B2%98%EB%A6%AC%EB%9F%89">Regional EFS는 여러 AZ의 Linux 워크로드가 네트워크 파일 시스템을 공유하도록 하는 관리형 선택지다</a> · <a href="/study/lessons/deep-dive/day-03.html#efs-%EB%A7%88%EC%9A%B4%ED%8A%B8%EC%99%80-%EC%B2%98%EB%A6%AC%EB%9F%89">마운트 대상과 네트워크 접근을 구성하면 앱의 파일 인터페이스를 유지할 수 있다</a></p>
        quizzes:
          - q: Linux 웹 컨테이너가 여러 AZ에서 같은 업로드 파일을 POSIX 경로로 동시에 읽고 쓴다. 컨테이너가 교체돼도 파일은 남아야 하며
              AZ 장애 때 다른 AZ에서 접근해야 한다. 파일 API 수정과 파일 서버 OS 운영을 피할 구성은?
            answer: Regional EFS와 각 사용 AZ의 마운트 대상·접근 규칙을 구성한다.
            wrong:
              - 각 AZ의 컨테이너에 개별 EBS를 연결하고 매일 스냅샷으로 파일을 맞춘다.
              - EFS One Zone을 만들고 다른 AZ의 컨테이너도 그 파일 시스템을 마운트한다.
              - EC2 NFS 서버 한 대와 EBS를 두고 모든 컨테이너가 같은 경로를 마운트한다.
      - id: saa-r2-Q22-24
        source_id: Q22-24
        type: mcq
        title: Q22-24 · 모의고사 A
        explain: |
          <p>PrivateLink는 제공자의 NLB 기반 서비스에 소비자 VPC의 엔드포인트로 접근하게 한다. 전체 VPC 간 라우팅 대신 서비스 연결을 제공해 중복 CIDR 고객에 대한 네트워크 운영을 줄인다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>고객마다 주소 변환을 설계하고 Transit Gateway로 전체 VPC 경로를 연결한다.</td>
          <td>주소 변환과 TGW로 설계할 수 있지만 전체 네트워크 경로·주소 변환을 고객별로 운영해야 해 서비스 단위 노출보다 복잡하다.</td>
          </tr>
          <tr>
          <td>각 고객에 인터넷 공개 NLB 주소를 제공하고 허용 IP로 접근을 제한한다.</td>
          <td>IP 제한을 해도 퍼블릭 엔드포인트를 사용하는 구성이므로 비공개 서비스 연결 요구와 다르다.</td>
          </tr>
          <tr>
          <td>고객 VPC와 VPN·주소 변환 장비를 연결하고 서비스 경로를 개별 광고한다.</td>
          <td>VPN+변환도 구성 가능하지만 각 고객의 터널·경로·주소 변환을 관리해야 하므로 PrivateLink보다 운영 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-share-your-services.html">PrivateLink endpoint services</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#%EC%84%9C%EB%B9%84%EC%8A%A4%EB%A7%8C-%EC%97%B0%EA%B2%B0%ED%95%98%EB%8A%94-privatelink">PrivateLink 엔드포인트 서비스는 고객이 사설 엔드포인트로 지정 서비스에 접근하는 모델이다</a> · <a href="/study/lessons/deep-dive/day-05.html#%EC%84%9C%EB%B9%84%EC%8A%A4%EB%A7%8C-%EC%97%B0%EA%B2%B0%ED%95%98%EB%8A%94-privatelink">전체 VPC 간 라우팅 관계를 만들지 않고 서비스 단위 연결을 제공해 중복 CIDR 고객을 수용하는 데 적합하다</a></p>
        quizzes:
          - q: 파트너는 자체 VPC의 TCP 결제 서비스를 고객 40곳에 비공개로 제공한다. 고객 VPC 사이에는 겹치는 CIDR도 있으며 고객이
              파트너의 다른 서버로 접근해서는 안 된다. 제공자가 서비스 서버를 계속 운영하고 고객별 전체 네트워크 연결을 피하려면
              무엇을 사용하는가?
            answer: NLB 엔드포인트 서비스를 만들고 고객이 PrivateLink 인터페이스 엔드포인트로 접속한다.
            wrong:
              - 고객마다 주소 변환을 설계하고 Transit Gateway로 전체 VPC 경로를 연결한다.
              - 각 고객에 인터넷 공개 NLB 주소를 제공하고 허용 IP로 접근을 제한한다.
              - 고객 VPC와 VPN·주소 변환 장비를 연결하고 서비스 경로를 개별 광고한다.
      - id: saa-r2-Q22-25
        source_id: Q22-25
        type: mcq
        title: Q22-25 · 모의고사 A
        explain: |
          <p>경로와 장비를 서로 다른 장애 영역으로 분리하고 실제 전송 구간을 암호화해야 한다. DX의 전용 경로 자체는 자동 암호화를 뜻하지 않으며 MACsec은 지원·보호 구간을 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DX 전용 연결을 유지하고 회사 라우터의 암호화 없는 BGP 세션을 복제한다.</td>
          <td>BGP 세션 중복은 같은 장비·회선 장애를 제거하지 않고 전송 데이터도 암호화하지 않는다.</td>
          </tr>
          <tr>
          <td>공장 내부 파일만 암호화하고 기존 DX 전송 경로는 유지한다.</td>
          <td>저장 파일 암호화는 별도 보호이며 앱이 전송하는 전체 트래픽의 암호화 조건을 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>같은 DX 포트와 라우터에 가상 인터페이스를 하나 더 만든다.</td>
          <td>VIF를 추가해도 포트·회선·라우터의 공통 장애 지점이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/directconnect/latest/UserGuide/encryption-in-transit.html">Direct Connect encryption</a> · <a href="https://docs.aws.amazon.com/directconnect/latest/UserGuide/resiliency_toolkit.html">DX resiliency</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#vpn-%EC%95%94%ED%98%B8%ED%99%94%EC%9D%98-%EC%8B%9C%EC%9E%91%EA%B3%BC-%EB%81%9D">물리 장애 대응은 실제 연결·장비·경로를 분리해야 하며 논리 인터페이스 추가만으로 해결되지 않는다</a> · <a href="/study/lessons/deep-dive/day-13.html#vpn-%EC%95%94%ED%98%B8%ED%99%94%EC%9D%98-%EC%8B%9C%EC%9E%91%EA%B3%BC-%EB%81%9D">DX는 기본 암호화가 아니므로 필요한 보호 구간에 맞는 전송 암호화를 별도 구성한다</a></p>
        quizzes:
          - q: 공장은 단일 DX 회선과 라우터를 통해 AWS 생산 API를 사용한다. 한 회선이나 장비 장애에도 조회를 유지해야 하며, 사설 전용 경로
              여부와 무관하게 공장부터 AWS 측까지 전송 데이터가 암호화돼야 한다. 앱 프로토콜 수정 없이 개선할 조치 두 가지는?
            answer: 서로 다른 회선·장비·위치나 검증된 보조 VPN으로 독립 장애 경로를 만든다.
            wrong:
              - DX 전용 연결을 유지하고 회사 라우터의 암호화 없는 BGP 세션을 복제한다.
              - 공장 내부 파일만 암호화하고 기존 DX 전송 경로는 유지한다.
              - 같은 DX 포트와 라우터에 가상 인터페이스를 하나 더 만든다.
            answers:
              - 서로 다른 회선·장비·위치나 검증된 보조 VPN으로 독립 장애 경로를 만든다.
              - DX 위의 IPsec VPN 등 요구 구간을 보호하는 지원 암호화 경로를 구성한다.
            options:
              - DX 전용 연결을 유지하고 회사 라우터의 암호화 없는 BGP 세션을 복제한다.
              - 공장 내부 파일만 암호화하고 기존 DX 전송 경로는 유지한다.
              - 서로 다른 회선·장비·위치나 검증된 보조 VPN으로 독립 장애 경로를 만든다.
              - DX 위의 IPsec VPN 등 요구 구간을 보호하는 지원 암호화 경로를 구성한다.
              - 같은 DX 포트와 라우터에 가상 인터페이스를 하나 더 만든다.
      - id: saa-r2-Q22-26
        source_id: Q22-26
        type: mcq
        title: Q22-26 · 모의고사 A
        explain: |
          <p>Session Manager는 필요한 에이전트·역할·서비스 연결을 갖춘 관리형 노드에 IAM 기반 셸을 제공한다. 기본 셸 기록을 S3·CloudWatch로 보낼 수 있으며 SSH 터널·포트 포워딩 기록 범위와 구분한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2 Instance Connect Endpoint를 만들고 임시 SSH 키로 사설 서버에 접속한다.</td>
          <td>임시 키와 사설 진입점은 SSH 운영을 개선하지만 대상의 SSH 접속과 키를 사용하므로 금지 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>Client VPN에서 사설 서버의 SSH 포트로 연결하고 개인 SSH 키를 사용한다.</td>
          <td>VPN은 네트워크 접속을 제공하며 대상의 SSH 포트·키와 셸 기록 운영을 제거하지 않는다.</td>
          </tr>
          <tr>
          <td>사설 Bastion에 세션 녹화를 설정하고 Bastion의 SSH 키로 대상에 접속한다.</td>
          <td>Bastion은 중앙 진입점을 제공하지만 Bastion 호스트 운영과 대상 SSH 키·포트가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html">Session Manager</a> · <a href="https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-logging.html">세션 로깅 범위</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#%EA%B3%B5%EA%B0%9C%EC%99%80-%EB%B9%84%EA%B3%B5%EA%B0%9C%EB%A5%BC-%EC%84%B8-%EA%B0%80%EC%A7%80-%EC%84%A4%EC%A0%95%EC%9C%BC%EB%A1%9C-%EB%82%98%EB%88%84%EA%B8%B0">Session Manager는 관리형 인스턴스의 에이전트와 IAM 권한, 서비스 연결을 이용해 인바운드 SSH 없이 접속할 수 있다</a> · <a href="/study/lessons/deep-dive/day-05.html#%EA%B3%B5%EA%B0%9C%EC%99%80-%EB%B9%84%EA%B3%B5%EA%B0%9C%EB%A5%BC-%EC%84%B8-%EA%B0%80%EC%A7%80-%EC%84%A4%EC%A0%95%EC%9C%BC%EB%A1%9C-%EB%82%98%EB%88%84%EA%B8%B0">지원 세션 유형의 중앙 로깅을 구성해 작업 추적 요구를 만족시킨다</a> · <a href="/study/lessons/exam-supplement/day-22.html#session-manager%EC%9D%98-%EA%B8%B0%EB%B3%B8-%EC%85%B8%EA%B3%BC-ssh-%ED%84%B0%EB%84%90-%EA%B8%B0%EB%A1%9D%EC%9D%80-%EB%8B%A4%EB%A5%B4%EB%8B%A4">기본 셸 세션의 로그는 SSH·포트 포워딩 터널 기록과 구분한다</a></p>
        quizzes:
          - q: 보안팀은 사설 EC2의 유지보수 셸을 승인된 IAM 작업자에게만 허용하려 한다. 인스턴스에 SSH 인바운드 포트나 SSH 키를 두지 않고
              기본 셸 세션의 명령 기록을 중앙 저장해야 한다. 관리형 노드에 필요한 에이전트·연결은 구성할 수 있다. 적합한
              접근은?
            answer: Session Manager에 IAM 권한과 연결 경로를 설정하고 셸 세션 로깅을 켠다.
            wrong:
              - EC2 Instance Connect Endpoint를 만들고 임시 SSH 키로 사설 서버에 접속한다.
              - Client VPN에서 사설 서버의 SSH 포트로 연결하고 개인 SSH 키를 사용한다.
              - 사설 Bastion에 세션 녹화를 설정하고 Bastion의 SSH 키로 대상에 접속한다.
      - id: saa-r2-Q22-27
        source_id: Q22-27
        type: mcq
        title: Q22-27 · 모의고사 A
        explain: |
          <p>WAF는 ALB의 HTTP 요청을 검사하는 관리형 계층이다. Count로 영향을 확인하고 차단·세부 예외를 적용하면 정상 트래픽을 관측하면서 앱 앞단의 공격을 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Shield Advanced를 활성화하고 네트워크 DDoS 보호만으로 본문 공격에 대응한다.</td>
          <td>DDoS 보호만으로 SQL 본문 검사와 세부 오탐 조정 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>EC2 프록시에 자체 본문 검사 규칙을 배포하고 각 서버의 패치·규칙을 관리한다.</td>
          <td>자체 프록시도 검사는 가능하지만 호스트 패치와 규칙 배포를 직접 운영하므로 관리형 WAF보다 운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>ALB 앞의 보안 그룹에서 공격 IP 목록을 갱신하고 정상 443 연결을 허용한다.</td>
          <td>SG는 IP·프로토콜·포트 경계이므로 같은 443 요청 안의 SQL 본문을 구분하지 못하고 여러 IP에도 수동 대응이 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">AWS WAF</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#waf-%EB%8B%A8%EC%9D%BC-%EA%B7%9C%EC%B9%99-%EC%98%88%EC%99%B8%EC%99%80-%EB%82%98%EB%A8%B8%EC%A7%80-%EB%B3%B4%ED%98%B8">WAF는 ALB 같은 지원 자원에 연결해 HTTP 요청을 규칙으로 검사한다</a> · <a href="/study/lessons/deep-dive/day-11.html#waf-%EB%8B%A8%EC%9D%BC-%EA%B7%9C%EC%B9%99-%EC%98%88%EC%99%B8%EC%99%80-%EB%82%98%EB%A8%B8%EC%A7%80-%EB%B3%B4%ED%98%B8">관리형 규칙을 검토·적용하면 SQL 삽입 같은 애플리케이션 계층 패턴을 제어하면서 정상 트래픽을 유지할 수 있다</a></p>
        quizzes:
          - q: ALB 뒤 주문 API에서 다수 IP가 정상 주문과 유사한 HTTPS 요청에 SQL 구문을 섞어 보낸다. 국가·주소 전체 차단은 정상
              고객을 막고 앱 수정까지 시간이 필요하다. HTTP 본문을 검사하되 규칙 오탐을 먼저 확인하면서 관리 부담을 줄일
              방안은?
            answer: ALB의 WAF 관리형 규칙을 Count로 관측한 뒤 적절한 차단·예외를 적용한다.
            wrong:
              - Shield Advanced를 활성화하고 네트워크 DDoS 보호만으로 본문 공격에 대응한다.
              - EC2 프록시에 자체 본문 검사 규칙을 배포하고 각 서버의 패치·규칙을 관리한다.
              - ALB 앞의 보안 그룹에서 공격 IP 목록을 갱신하고 정상 443 연결을 허용한다.
      - id: saa-r2-Q22-28
        source_id: Q22-28
        type: mcq
        title: Q22-28 · 모의고사 A
        explain: |
          <p>EC2 인스턴스 프로파일의 역할은 SDK가 임시 자격 증명을 받아 갱신하는 경로를 제공한다. 역할의 객체 ARN·접두사 범위를 제한하며 네트워크 경로 제한은 별도로 적용할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>입력 버킷을 VPC 엔드포인트 경로로만 제한하고 해당 경로의 모든 주체를 허용한다.</td>
          <td>엔드포인트 제한은 경로를 통제하지만 워커의 신원별 입력 읽기 권한과 자격 증명 공급을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>읽기 전용 IAM 사용자 키를 Secrets Manager에 넣고 부팅 스크립트로 배포한다.</td>
          <td>키를 코드 밖으로 옮겨도 IAM 사용자 장기 키와 부팅 시 배포·회전 경로가 남는다.</td>
          </tr>
          <tr>
          <td>운영자가 STS 세션을 발급해 매번 워커의 로컬 설정 파일로 전달한다.</td>
          <td>임시 자격 증명도 수동 발급·전달하면 인스턴스 교체와 세션 만료를 자동으로 처리하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html">IAM roles for EC2</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#ec2-%EC%97%AD%ED%95%A0%EA%B3%BC-sdk-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85-%EC%A0%9C%EA%B3%B5%EC%9E%90">인스턴스 프로파일로 연결한 IAM 역할은 EC2 워크로드에 임시 자격 증명을 제공한다</a> · <a href="/study/lessons/deep-dive/day-01.html#ec2-%EC%97%AD%ED%95%A0%EA%B3%BC-sdk-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85-%EC%A0%9C%EA%B3%B5%EC%9E%90">필요한 S3 리소스만 허용하면 이미지나 설정에 장기 키를 배포하지 않아도 된다</a></p>
        quizzes:
          - q: ASG가 매일 새 EC2로 배치 워커를 교체한다. 워커는 특정 S3 접두사의 입력만 읽고 출력 버킷에는 접근하지 않아야 한다.
              AMI·사용자 데이터·운영자 파일 전달에 AWS 키를 넣지 않으면서 자격 증명 갱신도 자동화하려면 무엇을 해야 하는가?
            answer: 입력 접두사 읽기만 허용한 IAM 역할을 인스턴스 프로파일로 연결한다.
            wrong:
              - 입력 버킷을 VPC 엔드포인트 경로로만 제한하고 해당 경로의 모든 주체를 허용한다.
              - 읽기 전용 IAM 사용자 키를 Secrets Manager에 넣고 부팅 스크립트로 배포한다.
              - 운영자가 STS 세션을 발급해 매번 워커의 로컬 설정 파일로 전달한다.
      - id: saa-r2-Q22-29
        source_id: Q22-29
        type: mcq
        title: Q22-29 · 모의고사 A
        explain: |
          <p>CloudTrail 기반 정책 생성은 사용 활동으로 권한을 줄일 초안을 제공한다. 활동에 나타나지 않은 작업이 불필요하다는 보장은 아니므로 드문 배포·복구 경로와 지원 범위를 검토한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>IAM Access Analyzer의 외부 접근 결과만 보고 내부 작업 허용 목록을 확정한다.</td>
          <td>외부 접근 분석은 누가 외부에서 접근할 수 있는지 보는 목적이며 내부 역할의 실제 사용 API 초안 생성과 다르다.</td>
          </tr>
          <tr>
          <td>IAM 자격 증명 보고서의 최근 로그인 날짜로 역할 API의 리소스 범위를 정한다.</td>
          <td>자격 증명 보고서는 사용자 자격 증명 상태를 보여주며 역할의 리소스별 API 사용 정책을 생성하지 않는다.</td>
          </tr>
          <tr>
          <td>역할의 모든 권한을 서비스별 ReadOnlyAccess로 바꾼 뒤 배포 오류를 조사한다.</td>
          <td>일괄 읽기 전용 전환은 필요한 배포 작업을 깨뜨릴 수 있으며 관측된 API 기반의 점진적인 권한 조정이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-policy-generation.html">Generate policies based on activity</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EC%A7%81%EC%9B%90-%EC%A0%91%EA%B7%BC%EA%B3%BC-%EC%99%B8%EB%B6%80-%EA%B3%B5%EA%B8%89%EC%97%85%EC%B2%B4-%EC%9C%84%EC%9E%84">CloudTrail 활동을 이용한 정책 생성은 실제 API 사용을 바탕으로 최소 권한 초안을 만드는 데 도움이 된다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EC%A7%81%EC%9B%90-%EC%A0%91%EA%B7%BC%EA%B3%BC-%EC%99%B8%EB%B6%80-%EA%B3%B5%EA%B8%89%EC%97%85%EC%B2%B4-%EC%9C%84%EC%9E%84">관측되지 않은 복구·정기 업무까지 불필요하다고 단정하지 않고 검토해야 한다</a></p>
        quizzes:
          - q: 배포 역할에 AWS 관리형 전체 접근 정책이 누적됐다. 보안팀은 지난 90일의 실제 API 사용으로 최소 권한 정책의 초안을 만들고,
              관측되지 않은 분기별 복구 작업은 담당자와 별도 검토하려 한다. 최근 활동을 정책 문장으로 제안받을 출발점은?
            answer: IAM Access Analyzer에서 CloudTrail 활동 기반 정책 생성을 실행하고 검토한다.
            wrong:
              - IAM Access Analyzer의 외부 접근 결과만 보고 내부 작업 허용 목록을 확정한다.
              - IAM 자격 증명 보고서의 최근 로그인 날짜로 역할 API의 리소스 범위를 정한다.
              - 역할의 모든 권한을 서비스별 ReadOnlyAccess로 바꾼 뒤 배포 오류를 조사한다.
      - id: saa-r2-Q22-30
        source_id: Q22-30
        type: mcq
        title: Q22-30 · 모의고사 A
        explain: |
          <p>Secret 저장소와 DB를 함께 갱신·시험할 경로, 앱이 오래된 캐시에서 벗어날 경로가 모두 필요하다. 기존 연결 유지와 새 인증 실패를 구분해 회전 단계와 캐시 동작을 관찰한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Secrets Manager 저장값만 갱신하고 DB 사용자의 기존 비밀번호는 고정한다.</td>
          <td>저장소 값만 바꾸면 실제 DB 인증값과 불일치할 수 있어 자동 회전이 완성되지 않는다.</td>
          </tr>
          <tr>
          <td>회전 뒤 새 비밀번호를 AMI에 넣고 다음 정기 배포까지 기존 서버는 유지한다.</td>
          <td>이미지에 값을 고정하면 회전 주기와 서버 배포 주기가 어긋나며 키 없는 갱신 운영 요구도 잃는다.</td>
          </tr>
          <tr>
          <td>비밀번호 갱신을 중단하고 DB 연결 풀의 최대 크기만 늘린다.</td>
          <td>연결 풀 증가는 자격 증명 불일치나 회전 경로 문제를 수정하지 않고 자동 교체도 중단한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_turn-on-for-db.html">Database secret rotation</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%EA%B5%90%EB%8C%80-%EC%82%AC%EC%9A%A9%EC%9E%90-%ED%9A%8C%EC%A0%84%EC%9D%98-%EB%84%A4-%EB%8B%A8%EA%B3%84">자동 교체는 비밀 저장소와 DB 값을 일관되게 바꾸는 과정이며 교체 함수의 양쪽 접근이 필요하다</a> · <a href="/study/lessons/deep-dive/day-11.html#%EA%B5%90%EB%8C%80-%EC%82%AC%EC%9A%A9%EC%9E%90-%ED%9A%8C%EC%A0%84%EC%9D%98-%EB%84%A4-%EB%8B%A8%EA%B3%84">앱도 새 비밀값을 사용하도록 해야 교체 유지와 지속 접속 요구를 함께 만족한다</a></p>
        quizzes:
          - q: Secrets Manager의 DB 비밀 자동 회전을 켠 뒤 신규 접속만 간헐적으로 실패한다. 앱은 시작 시 읽은 비밀번호를 계속
              캐시하고, 회전 Lambda와 DB는 사설 서브넷에 있다. 자동 회전을 유지하면서 회전 완료와 앱의 새 인증을 모두
              보장하기 위해 점검할 두 경로는?
            answer: 앱의 비밀값 조회·캐시 갱신과 인증 실패 시 새 값으로 재시도하는 방식을 검증한다.
            wrong:
              - Secrets Manager 저장값만 갱신하고 DB 사용자의 기존 비밀번호는 고정한다.
              - 회전 뒤 새 비밀번호를 AMI에 넣고 다음 정기 배포까지 기존 서버는 유지한다.
              - 비밀번호 갱신을 중단하고 DB 연결 풀의 최대 크기만 늘린다.
            answers:
              - 앱의 비밀값 조회·캐시 갱신과 인증 실패 시 새 값으로 재시도하는 방식을 검증한다.
              - 회전 Lambda의 Secrets Manager·DB 권한과 네트워크 도달 경로를 검증한다.
            options:
              - 앱의 비밀값 조회·캐시 갱신과 인증 실패 시 새 값으로 재시도하는 방식을 검증한다.
              - Secrets Manager 저장값만 갱신하고 DB 사용자의 기존 비밀번호는 고정한다.
              - 회전 뒤 새 비밀번호를 AMI에 넣고 다음 정기 배포까지 기존 서버는 유지한다.
              - 비밀번호 갱신을 중단하고 DB 연결 풀의 최대 크기만 늘린다.
              - 회전 Lambda의 Secrets Manager·DB 권한과 네트워크 도달 경로를 검증한다.
      - id: saa-r2-Q22-31
        source_id: Q22-31
        type: mcq
        title: Q22-31 · 모의고사 A
        explain: |
          <p>복제는 가용성 경로이고 잘못된 변경도 전파한다. 과거 시점 백업과 복원 절차를 마련하고 그 백업의 보존·삭제 권한을 일반 운영 경로와 분리해야 실제 복구 선택지가 남는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>리전 복제 지연을 더 줄이고 장애 시 최신 복제본을 바로 승격한다.</td>
          <td>빠른 최신 복제본도 오류가 반영된 현재 상태이므로 과거 정상 시점 복구를 대신하지 못한다.</td>
          </tr>
          <tr>
          <td>현재 DB 크기를 늘리고 변경 직후의 새 스냅샷만 장기 보관한다.</td>
          <td>변경 직후 스냅샷에는 이미 오류가 들어 있고 인스턴스 크기는 과거 데이터를 복원하지 않는다.</td>
          </tr>
          <tr>
          <td>복제본을 더 만들고 모든 복제본에 원본의 변경을 즉시 반영한다.</td>
          <td>동일 변경을 복제하는 사본 수 증가는 논리 오류로부터 격리된 과거 복구 지점을 만들지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_CommonTasks.BackupRestore.html">RDS backup and restore</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EC%A0%9C%EC%99%80-%EC%82%AD%EC%A0%9C-%EB%B0%A9%EC%A7%80-%EB%B0%B1%EC%97%85%EC%9D%98-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%9E%A5%EC%95%A0">복제는 잘못된 변경도 전달하므로 과거 시점 복원 수단이 필요하다</a> · <a href="/study/lessons/deep-dive/day-07.html#pitr%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7%EC%97%90%EC%84%9C-%EC%84%9C%EB%B9%84%EC%8A%A4-%EB%B3%B5%EA%B5%AC%EA%B9%8C%EC%A7%80">정상 복구 지점 보존과 독립된 삭제 통제를 갖추고 실제 복원까지 확인해야 운영 실수에 대응할 수 있다</a></p>
        quizzes:
          - q: 주문 DB의 잘못된 대량 UPDATE가 리전 간 복제본에도 반영됐다. 회사는 리전 장애용 복제를 유지하면서 운영 계정의 실수나 백업
              삭제에도 수정 전 정상 데이터로 복구할 수 있어야 한다. 복제본을 추가하는 대신 준비할 조치 두 가지는?
            answer: 백업 보존·삭제 권한을 일반 운영 변경 권한과 분리해 복구 지점을 보호한다.
            wrong:
              - 리전 복제 지연을 더 줄이고 장애 시 최신 복제본을 바로 승격한다.
              - 현재 DB 크기를 늘리고 변경 직후의 새 스냅샷만 장기 보관한다.
              - 복제본을 더 만들고 모든 복제본에 원본의 변경을 즉시 반영한다.
            answers:
              - 백업 보존·삭제 권한을 일반 운영 변경 권한과 분리해 복구 지점을 보호한다.
              - 잘못된 수정 전으로 돌아갈 백업·PITR 보존과 실제 복원 시험을 구성한다.
            options:
              - 백업 보존·삭제 권한을 일반 운영 변경 권한과 분리해 복구 지점을 보호한다.
              - 리전 복제 지연을 더 줄이고 장애 시 최신 복제본을 바로 승격한다.
              - 현재 DB 크기를 늘리고 변경 직후의 새 스냅샷만 장기 보관한다.
              - 복제본을 더 만들고 모든 복제본에 원본의 변경을 즉시 반영한다.
              - 잘못된 수정 전으로 돌아갈 백업·PITR 보존과 실제 복원 시험을 구성한다.
      - id: saa-r2-Q22-32
        source_id: Q22-32
        type: mcq
        title: Q22-32 · 모의고사 A
        explain: |
          <p>Materialized view는 계산 결과를 저장해 공통 집계를 재사용한다. 적재 후 갱신하면 허용한 데이터 시점에 맞출 수 있으며 갱신·조회가 지원되는 형태인지 검증한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>동일 집계의 일반 SQL view를 만들고 모든 대시보드가 그 뷰를 조회한다.</td>
          <td>일반 view는 쿼리 정의를 재사용하지만 저장된 집계 결과를 제공하지 않아 계산이 반복될 수 있다.</td>
          </tr>
          <tr>
          <td>결과 캐시를 사용하고 서로 다른 필터의 전체 SQL 결과가 재사용되게 한다.</td>
          <td>전체 결과 캐시는 쿼리·데이터 등의 재사용 조건을 따르므로 서로 다른 필터 쿼리의 공통 집계를 저장하는 대안과 다르다.</td>
          </tr>
          <tr>
          <td>대시보드용 WLM 큐를 분리하고 집계 쿼리의 실행 우선순위를 높인다.</td>
          <td>WLM은 실행 자원과 우선순위를 조절하며 같은 집계의 반복 계산 자체를 제거하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-overview.html">Redshift materialized view</a> · <a href="https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-refresh.html">Materialized view 갱신</a> · <a href="https://docs.aws.amazon.com/redshift/latest/dg/c_challenges_achieving_high_performance_queries.html">Redshift 결과 캐시</a> · <a href="https://docs.aws.amazon.com/redshift/latest/dg/query-priority.html">Redshift WLM 우선순위</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#spark-%EB%B3%80%ED%99%98%EA%B3%BC-redshift-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">공통 JOIN과 집계를 물리화한 결과를 적재 주기에 맞춰 갱신하면 사용자별 필터가 달라도 같은 원본 집계를 다시 계산하지 않는다</a> · <a href="/study/lessons/deep-dive/day-14.html#spark-%EB%B3%80%ED%99%98%EA%B3%BC-redshift-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">적재 직후 갱신이 허용되는 신선도 경계가 명시되어 있어 갱신된 materialized view를 사용할 수 있다</a> · <a href="/study/lessons/deep-dive/day-14.html#spark-%EB%B3%80%ED%99%98%EA%B3%BC-redshift-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">일반 view·결과 캐시·WLM도 유효한 기능이지만 서로 다른 필터 쿼리의 공통 계산을 저장하는 역할과는 다르다</a></p>
        quizzes:
          - q: Redshift 대시보드는 주문 적재 후 상품·일자별 SUM과 JOIN을 반복한다. 사용자마다 필터가 달라 SQL 전체 문장은 자주
              바뀌지만 공통 집계는 같다. 다음 시간의 적재 전까지 이전 적재 결과를 써도 된다. 노드 증설 없이 공통 계산을
              재사용할 방법은?
            answer: 공통 집계 materialized view를 만들고 적재 완료마다 갱신한다.
            wrong:
              - 동일 집계의 일반 SQL view를 만들고 모든 대시보드가 그 뷰를 조회한다.
              - 결과 캐시를 사용하고 서로 다른 필터의 전체 SQL 결과가 재사용되게 한다.
              - 대시보드용 WLM 큐를 분리하고 집계 쿼리의 실행 우선순위를 높인다.
      - id: saa-r2-Q22-33
        source_id: Q22-33
        type: mcq
        title: Q22-33 · 모의고사 A
        explain: |
          <p>Secrets Manager의 인터페이스 엔드포인트에 사설 경로와 DNS 해석을 연결한다. DX 연결만으로 서비스의 공개 DNS가 자동 사설 주소로 바뀌지 않으므로 Resolver 등 DNS 설계를 함께 확인한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>사설 EC2 프록시를 만들고 직원이 셸 로그인 후 저장된 스크립트를 실행하게 한다.</td>
          <td>프록시 자체는 운영할 수 있지만 직원의 셸 로그인 중계를 강제해 직접 API 사용 조건과 운영 최소화에 불리하다.</td>
          </tr>
          <tr>
          <td>VPC의 S3 게이트웨이 엔드포인트를 만들고 회사 DNS에 그 서비스 주소를 등록한다.</td>
          <td>S3 게이트웨이 엔드포인트는 Secrets Manager API를 위한 범용 사설 엔드포인트가 아니다.</td>
          </tr>
          <tr>
          <td>VPC의 NAT Gateway와 IGW를 두고 직원 요청을 Secrets Manager 공개 주소로 보낸다.</td>
          <td>공개 API로 향하는 NAT·IGW 경로는 퍼블릭 인터넷 경유 금지 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/secretsmanager/latest/userguide/vpc-endpoint-overview.html">Secrets Manager VPC endpoint</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#interface-endpoint%EC%97%90%EC%84%9C-dns%EC%99%80-eni%EB%A5%BC-%ED%95%A8%EA%BB%98-%ED%99%95%EC%9D%B8%ED%95%98%EA%B8%B0">인터페이스 VPC 엔드포인트는 지원 서비스 API의 사설 IP 접점을 제공한다</a> · <a href="/study/lessons/deep-dive/day-05.html#interface-endpoint%EC%97%90%EC%84%9C-dns%EC%99%80-eni%EB%A5%BC-%ED%95%A8%EA%BB%98-%ED%99%95%EC%9D%B8%ED%95%98%EA%B8%B0">회사에서 그 IP로 갈 라우팅과 DNS 해석을 구성하면 EC2에 로그인하지 않고 사설 경로로 API를 호출할 수 있다</a></p>
        quizzes:
          - q: 직원 PC의 자동화 도구가 온프레미스에서 DX 사설 경로로 Secrets Manager API를 호출한다. VPC의 EC2에 로그인하거나
              퍼블릭 인터넷을 거치면 안 된다. IAM 권한은 이미 있고 도구는 AWS 서비스 DNS 이름을 계속 사용한다. 필요한
              VPC·DNS 구성은?
            answer: Secrets Manager 인터페이스 엔드포인트와 온프레미스 DNS·사설 경로를 구성한다.
            wrong:
              - 사설 EC2 프록시를 만들고 직원이 셸 로그인 후 저장된 스크립트를 실행하게 한다.
              - VPC의 S3 게이트웨이 엔드포인트를 만들고 회사 DNS에 그 서비스 주소를 등록한다.
              - VPC의 NAT Gateway와 IGW를 두고 직원 요청을 Secrets Manager 공개 주소로 보낸다.
      - id: saa-r2-Q22-34
        source_id: Q22-34
        type: mcq
        title: Q22-34 · 모의고사 A
        explain: |
          <p>DLQ redrive 정책은 수신 횟수 기준으로 실패 메시지를 격리한다. 보존·경보·redrive 절차를 마련하면 정상 작업을 계속 처리하며 수정 후 재투입할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>원본 큐의 가시성 시간을 크게 늘리고 실패 메시지를 같은 큐에 유지한다.</td>
          <td>가시성 연장은 재등장을 늦출 뿐 반복 실패 메시지를 별도 격리하거나 분석용 큐로 보내지 않는다.</td>
          </tr>
          <tr>
          <td>수신 즉시 메시지를 지우고 실패한 본문을 워커의 로컬 로그 파일에만 저장한다.</td>
          <td>삭제 후 로컬 로그만 남기면 워커 교체 때 원문을 잃을 수 있고 안정적인 재처리 경로가 없다.</td>
          </tr>
          <tr>
          <td>별도 실패 테이블과 주기적 재투입 Lambda를 직접 만들어 메시지를 보관한다.</td>
          <td>직접 구현도 가능하지만 별도 DB·수집·재투입 코드를 운영하므로 관리형 큐 기능보다 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html">SQS dead-letter queues</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">DLQ는 반복 실패 메시지를 주 큐와 분리해 정상 처리 흐름을 보호한다</a> · <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">실패 데이터를 보존하고 경보·분석·재처리 절차를 준비하면 원인 해결과 복구를 이어갈 수 있다</a></p>
        quizzes:
          - q: SQS 워커는 일시 오류를 재시도하지만 형식이 잘못된 일부 메시지가 반복 실패해 정상 작업까지 지연시킨다. 실패 메시지를 일정 횟수 후
              격리하고 원인을 고친 뒤 다시 처리해야 한다. 앱에 별도 실패 보관 DB를 만들지 않을 구성은?
            answer: 적절한 maxReceiveCount의 redrive 정책·DLQ와 DLQ 적재 경보를 구성한다.
            wrong:
              - 원본 큐의 가시성 시간을 크게 늘리고 실패 메시지를 같은 큐에 유지한다.
              - 수신 즉시 메시지를 지우고 실패한 본문을 워커의 로컬 로그 파일에만 저장한다.
              - 별도 실패 테이블과 주기적 재투입 Lambda를 직접 만들어 메시지를 보관한다.
      - id: saa-r2-Q22-35
        source_id: Q22-35
        type: mcq
        title: Q22-35 · 모의고사 A
        explain: |
          <p>Parquet는 필요한 열 중심의 읽기를 돕고 partition projection은 정해진 경로 규칙에서 파티션을 계산해 개별 등록을 없앤다. 경로가 거의 연속이므로 과도한 빈 파티션 탐색 조건도 피한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 파티션을 찾는 Glue 파티션 인덱스를 생성한다.</td>
          <td>파티션 인덱스는 등록된 파티션의 탐색을 개선하지만 새 파티션의 등록 자체를 없애지 않는다.</td>
          </tr>
          <tr>
          <td>CSV 파일을 gzip으로 압축하고 기존 파티션 등록 방식을 유지한다.</td>
          <td>CSV gzip은 전송·저장량을 줄일 수 있으나 필요한 열만 읽는 열 형식과 파티션 등록 제거를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>Glue Crawler의 실행 주기를 줄여 새 시간 경로를 더 자주 등록한다.</td>
          <td>Crawler 주기를 줄여도 다음 수집·등록 전까지 조회 지연과 등록 작업이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/columnar-storage.html">Athena 열 형식</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html">Athena partition projection</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">Parquet는 필요한 열과 데이터 블록만 읽도록 해 150개 열 중 4개를 조회하는 비용을 줄인다</a> · <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">규칙적이고 거의 비어 있지 않은 날짜·시간 경로에는 partition projection으로 위치를 계산하면 새 파티션의 카탈로그 등록을 기다리지 않는다</a> · <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">두 변경은 열 접근과 파티션 발견이라는 서로 다른 요구를 각각 충족한다</a></p>
        quizzes:
          - q: Athena가 S3의 날짜·시간별 로그를 읽는다. 새 시간 경로마다 파일이 연속 도착하고 쿼리는 150개 열 중 4개와 짧은 시간 범위만
              사용한다. 카탈로그 파티션 등록 지연 없이 새 경로를 바로 조회해야 한다. 스캔량과 등록 운영을 각각 줄일 변경 두
