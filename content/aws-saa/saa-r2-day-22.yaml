      - id: saa-r2-Q22-36
        source_id: Q22-36
        type: mcq
        title: Q22-36 · 모의고사 A
        explain: |
          <p>같은 인덱스를 잇는 N_TO_N 의존성을 사용하면 해당 전처리가 끝난 시료의 분석을 시작할 수 있다. 지문이 기능 의미를 제공하므로 속성 이름 암기보다 불필요한 전체 대기와 운영 코드를 비교한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>동일 크기의 A·B array job을 제출하고 B가 A 전체 성공 뒤 시작하게 한다.</td>
          <td>배열 전체 성공을 기다리면 빠른 시료의 분석도 가장 느린 전처리에 묶여 허용한 병렬성을 잃는다.</td>
          </tr>
          <tr>
          <td>A 전체 성공 뒤 B array job을 SEQUENTIAL로 실행한다.</td>
          <td>전체 전처리 대기와 B의 순차 처리까지 더해져 시료별 독립 병렬 처리가 줄어든다.</td>
          </tr>
          <tr>
          <td>각 시료의 A·B를 개별 제출하고 앱이 대응 작업 ID·상태를 관리한다.</td>
          <td>의존성을 만들 수 있지만 시료별 개별 작업 제출·ID 대응·상태 관리 코드를 직접 유지해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/batch/latest/userguide/array_jobs.html">Batch array job과 의존성</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#batch%EC%9D%98-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EC%99%80-beanstalk%EC%9D%98-%EC%95%B1-%ED%99%98%EA%B2%BD">Batch array job의 N_TO_N 의존성은 B의 각 인덱스가 A의 같은 인덱스 성공을 기다리게 한다</a> · <a href="/study/lessons/deep-dive/day-14.html#batch%EC%9D%98-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EC%99%80-beanstalk%EC%9D%98-%EC%95%B1-%ED%99%98%EA%B2%BD">느린 다른 시료 때문에 전체 단계 사이에 장벽을 만들지 않으면서 두 번의 array job 제출로 1,000쌍을 관리할 수 있다</a> · <a href="/study/lessons/deep-dive/day-14.html#batch%EC%9D%98-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EC%99%80-beanstalk%EC%9D%98-%EC%95%B1-%ED%99%98%EA%B2%BD">개별 작업 간 의존성도 실행 가능하지만 2,000개 제출과 ID 매핑을 관리해야 한다</a></p>
        quizzes:
          - q: Batch 파이프라인은 시료 1,000개의 전처리 A와 분석 B를 서로 다른 작업 정의로 실행한다. B[i]는 A[i]가 성공하면 시작할
              수 있고 다른 시료를 기다릴 이유는 없다. Batch의 N_TO_N은 같은 배열 인덱스끼리 의존성을 연결한다. 별도
              상태 추적 코드를 최소화할 제출 방식은?
            answer: 동일 크기의 A·B array job을 제출하고 B에 A의 N_TO_N 의존성을 지정한다.
            wrong:
              - 동일 크기의 A·B array job을 제출하고 B가 A 전체 성공 뒤 시작하게 한다.
              - A 전체 성공 뒤 B array job을 SEQUENTIAL로 실행한다.
              - 각 시료의 A·B를 개별 제출하고 앱이 대응 작업 ID·상태를 관리한다.
      - id: saa-r2-Q22-37
        source_id: Q22-37
        type: mcq
        title: Q22-37 · 모의고사 A
        explain: |
          <p>교차 계정 AssumeRole은 공급업체 호출자의 대상 역할 호출 권한과 고객 역할의 신뢰를 함께 평가한다. 역할이 맡겨진 뒤의 S3 작업 권한은 이 세션 발급 판단과 분리한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>고객의 S3 객체 읽기 정책에만 추가적인 sts:AssumeRole Allow를 넣는다.</td>
          <td>S3 읽기 권한에 추가해도 공급업체 호출자의 AssumeRole 허용과 대상 신뢰를 동시에 완성하지 못한다.</td>
          </tr>
          <tr>
          <td>공급업체 역할의 신뢰 정책에 고객 계정이 공급업체 역할을 맡도록 허용한다.</td>
          <td>신뢰 방향을 반대로 설정하면 고객이 공급업체 역할을 맡게 할 뿐 현재 요청을 허용하지 않는다.</td>
          </tr>
          <tr>
          <td>고객 역할의 최대 세션 시간을 늘리고 기존 두 계정의 정책은 유지한다.</td>
          <td>세션 시간은 성공한 세션의 길이 조건이며 허용되지 않은 위임 요청을 허용으로 바꾸지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html">Cross-account access</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#assumerole%EA%B3%BC-%EB%91%90-%EB%B2%88%EC%9D%98-%EA%B6%8C%ED%95%9C-%ED%8C%90%EB%8B%A8">교차 계정 역할 위임에는 대상 역할이 호출자를 신뢰하고 호출자 쪽에서도 대상 역할을 맡는 작업이 허용돼야 한다</a> · <a href="/study/lessons/deep-dive/day-01.html#assumerole%EA%B3%BC-%EB%91%90-%EB%B2%88%EC%9D%98-%EA%B6%8C%ED%95%9C-%ED%8C%90%EB%8B%A8">역할을 맡은 뒤 수행할 S3 권한과 위임 자체의 권한은 별개다</a></p>
        quizzes:
          - q: 공급업체 계정의 배포 역할이 고객 계정의 S3 읽기 역할을 맡으려 한다. 고객 역할의 S3 권한과 객체·키 접근은 이미 허용됐고 다른
              명시적 거부는 없다. AssumeRole 자체가 AccessDenied일 때 교차 계정 위임을 구성하는 데 확인해야 할
              양쪽 설정 두 가지는?
            answer: 고객 역할의 신뢰 정책에서 공급업체의 지정 호출 주체를 허용한다.
            wrong:
              - 고객의 S3 객체 읽기 정책에만 추가적인 sts:AssumeRole Allow를 넣는다.
              - 공급업체 역할의 신뢰 정책에 고객 계정이 공급업체 역할을 맡도록 허용한다.
              - 고객 역할의 최대 세션 시간을 늘리고 기존 두 계정의 정책은 유지한다.
            answers:
              - 고객 역할의 신뢰 정책에서 공급업체의 지정 호출 주체를 허용한다.
              - 공급업체 호출 주체의 정책에서 고객 역할의 sts:AssumeRole을 허용한다.
            options:
              - 고객 역할의 신뢰 정책에서 공급업체의 지정 호출 주체를 허용한다.
              - 공급업체 호출 주체의 정책에서 고객 역할의 sts:AssumeRole을 허용한다.
              - 고객의 S3 객체 읽기 정책에만 추가적인 sts:AssumeRole Allow를 넣는다.
              - 공급업체 역할의 신뢰 정책에 고객 계정이 공급업체 역할을 맡도록 허용한다.
              - 고객 역할의 최대 세션 시간을 늘리고 기존 두 계정의 정책은 유지한다.
      - id: saa-r2-Q22-38
        source_id: Q22-38
        type: mcq
        title: Q22-38 · 모의고사 A
        explain: |
          <p>Failover 정책은 주·보조 관계와 상태 확인을 사용해 정상 주 대상과 장애 시 보조 대상을 선택한다. TTL을 줄여도 클라이언트 캐시나 기존 연결이 즉시 바뀌는 것은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 리전의 latency 레코드와 상태 확인으로 가까운 정상 대상을 응답한다.</td>
          <td>지연 기반 라우팅은 가까운 정상을 선택하며 정해진 주·보조 우선순위를 보장하는 정책이 아니다.</td>
          </tr>
          <tr>
          <td>두 리전 주소를 하나의 simple 레코드 값으로 두고 TTL을 짧게 설정한다.</td>
          <td>Simple 다중 값과 짧은 TTL만으로 서비스 실패를 평가하고 보조 대상으로 자동 전환하지 않는다.</td>
          </tr>
          <tr>
          <td>두 리전의 weighted 레코드를 50:50으로 두고 상태 확인을 연결한다.</td>
          <td>50:50 가중치는 평상시에도 두 대상으로 트래픽을 분산하므로 주 대상만 사용하는 정책과 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-failover.html">Route 53 failover</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#dns-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%A0%84%ED%99%98-%EC%8B%9C%EA%B0%84">Failover 라우팅은 주 대상의 상태에 따라 보조 대상으로 응답하도록 구성할 수 있다</a> · <a href="/study/lessons/deep-dive/day-09.html#dns-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%A0%84%ED%99%98-%EC%8B%9C%EA%B0%84">DNS 캐시와 상태 감지 때문에 즉시 전환을 보장하지 않으며 별도 데이터·앱 준비와 함께 사용한다</a></p>
        quizzes:
          - q: 두 리전에 준비된 API가 있고 기본적으로 주 리전만 요청을 처리한다. 주 대상이 실패하면 기존 DNS 이름으로 보조 대상에 새 요청을
              보내고 복구 후 운영 정책에 따라 주 대상으로 돌아가려 한다. DNS 캐시로 인한 전환 지연은 수용한다. 적합한
              Route 53 구성은?
            answer: 주·보조 failover 레코드에 서비스 실패를 반영하는 상태 확인을 연결한다.
            wrong:
              - 두 리전의 latency 레코드와 상태 확인으로 가까운 정상 대상을 응답한다.
              - 두 리전 주소를 하나의 simple 레코드 값으로 두고 TTL을 짧게 설정한다.
              - 두 리전의 weighted 레코드를 50:50으로 두고 상태 확인을 연결한다.
      - id: saa-r2-Q22-39
        source_id: Q22-39
        type: mcq
        title: Q22-39 · 모의고사 A
        explain: |
          <p>EventBridge 패턴과 대상 연결은 발행자가 대상별 주소를 알지 않고 내용 기반으로 이벤트를 라우팅하게 한다. 대상 추가와 필드 조건을 버스 규칙에서 관리하고 전달 실패·재시도도 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SQS 큐 하나를 세 시스템이 경쟁 소비하고 받은 이벤트만 각자 분류한다.</td>
          <td>경쟁 소비는 한 메시지를 세 시스템 모두에게 전달하지 않으므로 필수 대상이 이벤트를 놓칠 수 있다.</td>
          </tr>
          <tr>
          <td>각 시스템 앞에 폴링 Lambda를 두고 공통 S3 로그를 읽어 필드별로 분류한다.</td>
          <td>로그 폴링·분류·체크포인트를 직접 운영해야 하므로 관리형 이벤트 라우팅보다 운영 부담과 지연이 크다.</td>
          </tr>
          <tr>
          <td>모든 파트너가 소비자별 API 주소와 분기·재시도 코드를 갖게 한다.</td>
          <td>직접 분기는 소비자 변화마다 파트너 코드와 재시도 경로를 바꿔야 해 결합도를 유지한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html">EventBridge event patterns</a> · <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-transform-target-input.html">EventBridge 입력 변환</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">EventBridge는 이벤트 패턴을 기준으로 대상에 이벤트를 전달하므로 생산자에서 소비자 주소를 분리하고 규칙을 중앙 관리할 수 있다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">대상 실패 처리와 필요한 재시도도 설계해야 한다</a> · <a href="/study/lessons/exam-supplement/day-22.html#eventbridge%EC%97%90%EC%84%9C-%EB%B6%84%EB%A5%98%EC%99%80-%EC%A0%84%EB%8B%AC-%ED%98%95%ED%83%9C%EB%A5%BC-%EB%B6%84%EB%A6%AC%ED%95%9C%EB%8B%A4">EventBridge 입력 변환은 라우팅 패턴과 별도로 대상 입력을 구성한다</a></p>
        quizzes:
          - q: 주문 이벤트를 파트너가 공통 버스로 발행한다. 이벤트 source·detail-type·detail의 지역과 주문 상태를 조합해
              물류·분석·알림 대상으로 전달해야 하고 대상이 추가돼도 파트너 코드는 바꾸지 않으려 한다. 대상별 변환도 관리형으로
              구성할 연결 방식은?
            answer: EventBridge 버스의 이벤트 패턴 규칙·대상·입력 변환을 구성한다.
            wrong:
              - SQS 큐 하나를 세 시스템이 경쟁 소비하고 받은 이벤트만 각자 분류한다.
              - 각 시스템 앞에 폴링 Lambda를 두고 공통 S3 로그를 읽어 필드별로 분류한다.
              - 모든 파트너가 소비자별 API 주소와 분기·재시도 코드를 갖게 한다.
      - id: saa-r2-Q22-40
        source_id: Q22-40
        type: mcq
        title: Q22-40 · 모의고사 A
        explain: |
          <p>Zonal NAT를 각 AZ에 배치하고 해당 AZ 서브넷에서 로컬 NAT를 쓰면 다른 AZ의 NAT 장애와 정상 상태의 교차 AZ 경유를 줄일 수 있다. 각 AZ의 퍼블릭 경로·비용도 함께 검토한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>첫 AZ NAT를 유지하고 장애 시 다른 AZ NAT로 모든 경로를 수동 변경한다.</td>
          <td>대기 NAT는 복구 경로가 될 수 있지만 평상시 중앙 NAT 경유 비용과 장애 시 수동 전환 지연이 남는다.</td>
          </tr>
          <tr>
          <td>두 AZ의 EC2를 유지하고 첫 AZ NAT에 Elastic IP만 추가한다.</td>
          <td>Elastic IP 추가는 NAT의 AZ 장애 범위를 바꾸지 않는다.</td>
          </tr>
          <tr>
          <td>첫 AZ에 NAT를 하나 더 만들고 서브넷 기본 경로를 두 NAT에 나누어 연결한다.</td>
          <td>NAT 수가 늘어도 같은 AZ에 모여 있으면 AZ 장애 때 함께 사라진다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html">NAT Gateway availability</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-04.html#zonal%EA%B3%BC-regional%EC%9D%98-%EC%9E%A5%EC%95%A0-%EB%B2%94%EC%9C%84%EC%99%80-%EB%B9%84%EC%9A%A9">Zonal NAT Gateway는 배치한 AZ의 자원이므로 AZ별 Zonal NAT와 로컬 라우팅은 단일 AZ 의존성과 일상 교차 AZ 경로를 줄인다</a> · <a href="/study/lessons/deep-dive/day-04.html#zonal%EA%B3%BC-regional%EC%9D%98-%EC%9E%A5%EC%95%A0-%EB%B2%94%EC%9C%84%EC%99%80-%EB%B9%84%EC%9A%A9">가용성 요구와 NAT 추가 비용을 함께 고려한다</a> · <a href="/study/lessons/deep-dive/day-04.html#zonal%EA%B3%BC-regional%EC%9D%98-%EC%9E%A5%EC%95%A0-%EB%B2%94%EC%9C%84%EC%99%80-%EB%B9%84%EC%9A%A9">이 문항은 Regional NAT 구성이 아닌 Zonal NAT를 전제로 한다</a></p>
        quizzes:
          - q: 웹 ASG는 두 AZ에 있지만 사설 서버의 결제 API 호출은 모두 첫 AZ의 Zonal NAT Gateway를 지난다. 첫 AZ가
              중단되자 다른 AZ의 웹 서버도 결제를 못 했다. Zonal NAT를 유지하면서 각 AZ가 독립적으로 외부에 연결되고
              정상 시 교차 AZ 전송도 줄일 설계는?
            answer: 각 AZ에 NAT를 만들고 사설 서브넷의 기본 경로를 같은 AZ의 NAT로 지정한다.
            wrong:
              - 첫 AZ NAT를 유지하고 장애 시 다른 AZ NAT로 모든 경로를 수동 변경한다.
              - 두 AZ의 EC2를 유지하고 첫 AZ NAT에 Elastic IP만 추가한다.
              - 첫 AZ에 NAT를 하나 더 만들고 서브넷 기본 경로를 두 NAT에 나누어 연결한다.
      - id: saa-r2-Q22-41
        source_id: Q22-41
        type: mcq
        title: Q22-41 · 모의고사 A
        explain: |
          <p>실행 중인 소규모 복구 환경은 11분으로 RTO를 만족하면서 상시 20대보다 비용이 낮다. RPO 충족 여부와 앱 확장·DNS 전환의 RTO는 별도로 검증한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>복구 ASG를 0대로 두고 장애 감지 후 20대를 시작한다.</td>
          <td>0대 방식은 상시 비용은 낮지만 계산한 23분이 15분 RTO를 초과한다.</td>
          </tr>
          <tr>
          <td>복구 리전에 20대를 상시 두고 장애 때 DNS만 전환한다.</td>
          <td>전체 용량을 대기하면 목표는 만족하지만 2대로도 가능한 복구를 위해 더 많은 상시 비용을 지불한다.</td>
          </tr>
          <tr>
          <td>양 리전에 20대씩 두고 평소에도 양쪽 앱에 트래픽을 보낸다.</td>
          <td>Active/active는 빠른 복구·분산에 적합할 수 있으나 최저 상시 비용 조건에 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_planning_for_recovery_disaster_recovery.html">복구 목표에 따른 DR 전략</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">소규모지만 동작 중인 앱을 유지하는 warm standby는 8분 확장과 3분 전환을 보수적으로 합쳐도 11분으로 RTO에 맞는다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">0대에서 복구하는 구성은 초기화만 20분이므로 목표를 넘는다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">두 리전의 DB 복제·인증·용량은 준비돼 있다는 전제에서 20대를 상시 유지하는 두 대안보다 앱의 평상시 비용이 낮다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">실제 목표 달성 여부는 전체 복구 훈련으로 검증한다</a></p>
        quizzes:
          - q: 피크에 앱 서버 20대가 필요한 주문 시스템의 DR을 설계한다. DB는 이미 RPO 1분을 만족하고 승격·DNS 전환은 3분이다. 앱
              0대에서 시작하면 준비에 20분, 실행 중인 2대에서 20대로 확장하면 8분이다. 복구 용량과 인증은 사전 확보했고 이
              시간은 함께 합산한다. RTO 15분을 만족하는 최저 상시 비용은?
            answer: 복구 ASG에 2대를 상시 두고 장애 때 20대로 확장한다.
            wrong:
              - 복구 ASG를 0대로 두고 장애 감지 후 20대를 시작한다.
              - 복구 리전에 20대를 상시 두고 장애 때 DNS만 전환한다.
              - 양 리전에 20대씩 두고 평소에도 양쪽 앱에 트래픽을 보낸다.
      - id: saa-r2-Q22-42
        source_id: Q22-42
        type: mcq
        title: Q22-42 · 모의고사 A
        explain: |
          <p>사용 조건에 맞는 RDS 예약 DB 인스턴스는 동일한 실행 구성을 유지하면서 요금 할인을 제공한다. 실제 약정 적용 범위와 지속 사용량을 구매 전에 확인한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>야간에 RDS를 중지하고 오전에 시작하도록 예약한다.</td>
          <td>야간 쓰기가 있으므로 중지하면 상시 서비스 조건을 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>더 작은 RDS 사양을 1년 예약하고 피크 때만 큰 사양으로 변경한다.</td>
          <td>작은 사양을 기준으로 바꾸면 검증된 피크 성능을 유지한다는 조건을 바꾸고 예약 적용 범위도 따로 고려해야 한다.</td>
          </tr>
          <tr>
          <td>EC2 Compute Savings Plans를 구매하고 RDS에도 자동 할인되게 한다.</td>
          <td>EC2용 Savings Plans는 RDS 인스턴스 요금에 그대로 적용되는 상품이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithReservedDBInstances.html">RDS reserved instances</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#%EC%A4%91%EC%A7%80%EC%99%80-%EC%B6%95%EC%86%8C%EC%9D%98-%EB%B9%84%EC%9A%A9-%EA%B2%BD%EA%B3%84">RDS 예약 DB 인스턴스는 조건에 맞는 지속 사용에 적용되는 요금 할인이다</a> · <a href="/study/lessons/deep-dive/day-07.html#%EC%A4%91%EC%A7%80%EC%99%80-%EC%B6%95%EC%86%8C%EC%9D%98-%EB%B9%84%EC%9A%A9-%EA%B2%BD%EA%B3%84">기존 운영 형태를 유지하며 구성·약정의 일치를 확인하면 제시된 조건에서 비용 절감을 검토할 수 있다</a></p>
        quizzes:
          - q: RDS DB는 매시간 운영되고 검증된 현재 엔진·리전·인스턴스 구성을 향후 1년 유지한다. 야간에도 쓰기가 있고 피크 성능과
              Multi-AZ는 줄일 수 없다. 사용량 변경 없이 기존 인스턴스 요금을 줄이는 선택은?
            answer: 현재 사용 구성에 맞는 1년 RDS 예약 DB 인스턴스를 구매한다.
            wrong:
              - 야간에 RDS를 중지하고 오전에 시작하도록 예약한다.
              - 더 작은 RDS 사양을 1년 예약하고 피크 때만 큰 사양으로 변경한다.
              - EC2 Compute Savings Plans를 구매하고 RDS에도 자동 할인되게 한다.
      - id: saa-r2-Q22-43
        source_id: Q22-43
        type: mcq
        title: Q22-43 · 모의고사 A
        explain: |
          <p>허용 속도 25MB/s와 100MB/s를 각 12시간 쓰면 하루 5.4TB다. 초회·변경분과 1일 검증을 고려해도 기존 회선으로 기한을 만족하므로 추가 회선의 고정 비용을 피한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 회선에서 야간 12시간만 75MB/s로 전송하고 주간에는 작업을 멈춘다.</td>
          <td>야간75MB/s만 쓰면 하루3.24TB로13일에42.12TB여서 초회·변경분을 기한 내 옮기지 못한다.</td>
          </tr>
          <tr>
          <td>업무 영향을 줄이기 위해 종일 25MB/s로 제한해 초회·증분 전송한다.</td>
          <td>25MB/s를 종일 사용하면 하루 2.16TB로 13일에 약28TB여서 50TB 초회도 완료하지 못한다.</td>
          </tr>
          <tr>
          <td>3일 뒤 개통되는 유료 임시 1Gbps 회선을 추가해 초회·증분 전송한다.</td>
          <td>기한을 맞출 수 있더라도 기존 회선으로 가능한 업무에 추가 고정 비용을 지출한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/datasync/latest/userguide/configure-bandwidth.html">DataSync 대역폭 제한</a> · <a href="https://docs.aws.amazon.com/datasync/latest/userguide/datasync-large-migration-running-tasks.html">DataSync 초회·증분 이전</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#datasync-%EC%A0%84%EC%86%A1%EB%9F%89%EA%B3%BC-%EB%B3%80%EA%B2%BD-%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%9D%98-%EC%88%98%EB%A0%B4">현재 회선으로 하루 전송 가능한 양은 (200+800)Mbps×12시간÷8로 약 5.4TB이다</a> · <a href="/study/lessons/deep-dive/day-13.html#datasync-%EC%A0%84%EC%86%A1%EB%9F%89%EA%B3%BC-%EB%B3%80%EA%B2%BD-%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%9D%98-%EC%88%98%EB%A0%B4">13일 동안 70.2TB를 보낼 수 있어 초회 50TB와 최대 약 1.3TB의 증분을 전송하고 검증 하루를 남길 여유가 있다</a> · <a href="/study/lessons/deep-dive/day-13.html#datasync-%EC%A0%84%EC%86%A1%EB%9F%89%EA%B3%BC-%EB%B3%80%EA%B2%BD-%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%9D%98-%EC%88%98%EB%A0%B4">DataSync의 실행 중 대역폭 제한 변경과 증분 전송을 이용하면 별도 회선의 고정 비용을 추가하지 않는다</a> · <a href="/study/lessons/deep-dive/day-13.html#datasync-%EC%A0%84%EC%86%A1%EB%9F%89%EA%B3%BC-%EB%B3%80%EA%B2%BD-%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%9D%98-%EC%88%98%EB%A0%B4">제시된 MB/s는 십진이며 API에서는 바이트/초로 설정한다</a></p>
        quizzes:
          - q: DataSync Basic 모드로 50TB를 14일 안에 S3에 옮긴다. 원본은 하루 0.1TB 변경되고 마지막 검증에 1일이 필요하다.
              매일 12시간씩 이전에 쓸 실효 대역폭은 주간 200Mbps, 야간 800Mbps이며 이를 넘기면 업무가 지연된다.
              TB는 십진 단위다. 유료 회선 추가를 최소화할 전송 계획은?
            answer: 주간 25MB/s·야간 100MB/s로 제한하고 초회와 증분 전송을 수행한다.
            wrong:
              - 기존 회선에서 야간 12시간만 75MB/s로 전송하고 주간에는 작업을 멈춘다.
              - 업무 영향을 줄이기 위해 종일 25MB/s로 제한해 초회·증분 전송한다.
              - 3일 뒤 개통되는 유료 임시 1Gbps 회선을 추가해 초회·증분 전송한다.
      - id: saa-r2-Q22-44
        source_id: Q22-44
        type: mcq
        title: Q22-44 · 모의고사 A
        explain: |
          <p>OAC와 버킷 정책은 특정 CloudFront 배포의 원본 접근을 허용하고 서명 쿠키는 뷰어의 여러 파일 접근을 기간·경로 조건으로 제한한다. 두 기능이 보호하는 요청 구간은 다르다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>OAC·버킷 정책만 적용하고 모든 CloudFront 뷰어 요청은 허용한다.</td>
          <td>원본은 보호하지만 CloudFront 주소를 아는 비구독 뷰어를 구분하지 않는다.</td>
          </tr>
          <tr>
          <td>CloudFront 서명 쿠키만 적용하고 S3의 공개 객체 읽기는 유지한다.</td>
          <td>뷰어 검증을 해도 공개 S3 직접 경로로 서명 검증을 우회할 수 있다.</td>
          </tr>
          <tr>
          <td>원본을 비공개로 두고 파일마다 짧은 S3 사전 서명 URL을 발급한다.</td>
          <td>객체별 접근은 가능하지만 파일마다 URL을 발급·교체해야 하므로 기존 링크와 다수 파일 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html">CloudFront signed cookies</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EA%B5%AC%EB%A7%A4%EC%9E%90-%EA%B6%8C%ED%95%9C%EA%B3%BC-s3-%EC%9B%90%EB%B3%B8-%EA%B6%8C%ED%95%9C">OAC와 버킷 정책은 해당 배포를 통한 원본 접근을 통제하고 서명 쿠키는 여러 제한 콘텐츠에 시간 조건을 제공한다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EA%B5%AC%EB%A7%A4%EC%9E%90-%EA%B6%8C%ED%95%9C%EA%B3%BC-s3-%EC%9B%90%EB%B3%B8-%EA%B6%8C%ED%95%9C">원본 보호와 최종 사용자 접근 통제를 함께 구성해야 한다</a></p>
        quizzes:
          - q: 구독 고객이 CloudFront로 유료 문서 수백 개를 1시간 열람한다. S3 직접 URL은 차단해야 하고 앱은 파일마다 새 URL을
              만들지 않으려 한다. 기존 문서 링크는 바꾸지 않고 로그인 결과로 열람 기간을 제한할 두 경계의 구성은?
            answer: OAC·버킷 정책으로 원본을 제한하고 CloudFront 서명 쿠키로 열람을 허용한다.
            wrong:
              - OAC·버킷 정책만 적용하고 모든 CloudFront 뷰어 요청은 허용한다.
              - CloudFront 서명 쿠키만 적용하고 S3의 공개 객체 읽기는 유지한다.
              - 원본을 비공개로 두고 파일마다 짧은 S3 사전 서명 URL을 발급한다.
      - id: saa-r2-Q22-45
        source_id: Q22-45
        type: mcq
        title: Q22-45 · 모의고사 A
        explain: |
          <p>안정된 주문 멱등성 키는 API가 보관하는7일 범위에서 재시도·재발행을 동일 거래로 처리한다. 이벤트 소스 동시성8은 지문의 호출 구조에서 진행 중 결제 API 호출 수를 제한한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>FIFO 큐로 옮기고 주문 ID를 message deduplication ID로 사용한다.</td>
          <td>FIFO 중복 제거 창만으로3일 뒤 다시 발행되는 같은 주문의 외부 결제를 막지 못한다.</td>
          </tr>
          <tr>
          <td>부분 배치 실패 응답을 활성화해 성공 메시지를 다시 받지 않게 한다.</td>
          <td>부분 배치 응답은 실패 항목 재시도를 줄이는 기능이며 이미 별개 메시지로 재발행된 주문의 결제를 통제하지 않는다.</td>
          </tr>
          <tr>
          <td>SQS 가시성 시간을 Lambda 제한 시간보다 충분히 길게 설정한다.</td>
          <td>가시성 시간은 불필요한 재전달을 줄이지만 별개 재발행과 외부 API 동시 호출 상한을 직접 보장하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html">SQS 매핑 동시성</a> · <a href="https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/">멱등 API 설계</a> · <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-key-terms.html">FIFO 중복 제거 시간</a> · <a href="https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html">부분 배치 실패 처리</a> · <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-lambda-function-trigger.html">Lambda 큐 가시성 시간</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#outboxinbox%EC%99%80-%EC%99%B8%EB%B6%80-%EA%B2%B0%EC%A0%9C%EC%9D%98-%EA%B2%BD%EA%B3%84">동일 주문 ID를 결제 API의 멱등성 키로 재사용하면 API의 7일 보관 범위 안인 3일 재발행에서도 같은 결제를 재실행하지 않는다</a> · <a href="/study/lessons/deep-dive/day-10.html#lambda-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%EC%96%B4">배치 크기 1이고 각 호출이 직렬로 API를 사용하므로 해당 소스의 Lambda 동시성을 8로 제한하면 결제 동시 호출도 8 이하다</a> · <a href="/study/lessons/deep-dive/day-10.html#outboxinbox%EC%99%80-%EC%99%B8%EB%B6%80-%EA%B2%B0%EC%A0%9C%EC%9D%98-%EA%B2%BD%EA%B3%84">두 조치는 중복과 동시성이라는 다른 위험을 각각 제어한다</a></p>
        quizzes:
          - q: 결제 Lambda는 표준 SQS의 메시지를 배치 크기1로 받아 API를 한 번 호출한 뒤 반환한다. API는 동시8개를 허용하고 같은
              멱등성 키의 결과를7일 보관한다. 같은 주문은3일 안에 다시 발행될 수 있고 재시도·DLQ는 이미 구성됐다. 며칠 뒤의
              중복 결제와 동시 초과를 직접 막을 두 조치는?
            answer: 재시도와 재발행에도 같은 주문 ID를 결제 API의 멱등성 키로 사용한다.
            wrong:
              - FIFO 큐로 옮기고 주문 ID를 message deduplication ID로 사용한다.
              - 부분 배치 실패 응답을 활성화해 성공 메시지를 다시 받지 않게 한다.
              - SQS 가시성 시간을 Lambda 제한 시간보다 충분히 길게 설정한다.
            answers:
              - 재시도와 재발행에도 같은 주문 ID를 결제 API의 멱등성 키로 사용한다.
              - 이 큐 이벤트 소스 매핑의 maximum concurrency를8로 설정한다.
            options:
              - 재시도와 재발행에도 같은 주문 ID를 결제 API의 멱등성 키로 사용한다.
              - 이 큐 이벤트 소스 매핑의 maximum concurrency를8로 설정한다.
              - FIFO 큐로 옮기고 주문 ID를 message deduplication ID로 사용한다.
              - 부분 배치 실패 응답을 활성화해 성공 메시지를 다시 받지 않게 한다.
              - SQS 가시성 시간을 Lambda 제한 시간보다 충분히 길게 설정한다.
      - id: saa-r2-Q22-46
        source_id: Q22-46
        type: mcq
        title: Q22-46 · 모의고사 A
        explain: |
          <p>준비 상태를 반영하는 헬스 체크를 통해 새 작업을 트래픽 대상으로 삼고 초기 로딩 시간에는 적절한 헬스 체크 유예를 둔다. 최소 정상 용량·최대 배포 용량을 함께 설정해 기존 처리를 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ALB 유휴 타임아웃을3분 늘리고 컨테이너 프로세스 시작을 정상으로 간주한다.</td>
          <td>유휴 타임아웃은 연결 대기를 조정하며 준비되지 않은 작업으로 요청을 보내는 대상 판단을 바꾸지 않는다.</td>
          </tr>
          <tr>
          <td>정상 용량을 유지하되 ALB 헬스 체크 경로는 항상200을 반환하게 한다.</td>
          <td>항상 성공하는 경로는 초기화가 끝나지 않아도 대상을 정상으로 판단해 원래 실패를 유지한다.</td>
          </tr>
          <tr>
          <td>새 작업을 더 많이 시작하고 고정3분 뒤 준비 상태와 무관하게 기존 작업을 교체한다.</td>
          <td>고정 대기는 초기화 시간이 변하면 너무 짧거나 불필요하게 길 수 있어 실제 준비 상태 기준의 전환을 제공하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service_definition_parameters.html">ECS service health checks</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#health-grace%EC%99%80-warmup%EC%9D%80-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%8B%9C%EA%B0%84%EC%9D%84-%EB%B3%B4%ED%98%B8%ED%95%9C%EB%8B%A4">프로세스 생성과 요청 처리 준비는 다르므로 실제 준비 상태를 검사하고 초기화 시간을 고려해야 한다</a> · <a href="/study/lessons/deep-dive/day-14.html#%EC%BB%A8%ED%85%8C%EC%9D%B4%EB%84%88%EA%B0%80-%EC%8B%9C%EC%9E%91%EB%90%A0-%EB%95%8C%EC%99%80-%EC%95%B1%EC%9D%B4-api%EB%A5%BC-%ED%98%B8%EC%B6%9C%ED%95%A0-%EB%95%8C">정상 작업을 유지한 배포 설정으로 새 대상이 준비된 후 요청을 받게 구성한다</a></p>
        quizzes:
          - q: ECS 서비스는 ALB 뒤에서 롤링 배포한다. 새 컨테이너의 프로세스는 즉시 실행되지만 참조 데이터 로딩에3분 걸려 그 전 요청은
              실패한다. 기존 작업은 계속 처리할 수 있다. 배포 시간을 무조건 늘리기보다 실제 준비 상태에 따라 새 작업으로
              전환하려면 어떻게 구성하는가?
            answer: 준비 완료를 검사하는 ALB 헬스 체크와 ECS 유예·정상 용량 배포 설정을 구성한다.
            wrong:
              - ALB 유휴 타임아웃을3분 늘리고 컨테이너 프로세스 시작을 정상으로 간주한다.
              - 정상 용량을 유지하되 ALB 헬스 체크 경로는 항상200을 반환하게 한다.
              - 새 작업을 더 많이 시작하고 고정3분 뒤 준비 상태와 무관하게 기존 작업을 교체한다.
      - id: saa-r2-Q22-47
        source_id: Q22-47
        type: mcq
        title: Q22-47 · 모의고사 A
        explain: |
          <p>일반 작업은 다수 Spot 풀로 비용·용량 위험을 분산하고 긴급 작업은 온디맨드로 회수 위험을 분리한다. 온디맨드도 하드웨어 장애나 신규 용량 보장까지 제공하는 것은 아니므로 별도 복구를 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>연중 매시간 쓰지 않는 최대 야간 용량 전체를 장기 약정으로 할인받는다.</td>
          <td>밤에만 사용하는 피크 전체 약정은 낮의 미사용 약정까지 지불하므로 지속 기준 사용량 없이 최저 비용으로 단정할 수 없다.</td>
          </tr>
          <tr>
          <td>두 큐를 모두 Spot 워커가 처리하되 긴급 큐의 우선순위를 높인다.</td>
          <td>큐 우선순위는 실행 용량의 Spot 회수를 막지 못하므로 긴급 작업이 함께 중단될 수 있다.</td>
          </tr>
          <tr>
          <td>전체 최대 야간 용량을 온디맨드로 유지하고 낮에는 워커를 중지한다.</td>
          <td>긴급 조건은 충족하지만 중단을 허용하는95%에도 온디맨드 비용을 지불한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html">Spot Instances</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#spot-%EC%A4%91%EB%8B%A8%EA%B3%BC-%EC%9A%A9%EB%9F%89-%ED%92%80">작업별 중단 허용 조건이 다르므로 일반 작업에 Spot 절감을 적용하고 긴급 작업은 온디맨드 경로로 분리한다</a> · <a href="/study/lessons/deep-dive/day-02.html#spot-%EC%A4%91%EB%8B%A8%EA%B3%BC-%EC%9A%A9%EB%9F%89-%ED%92%80">온디맨드도 모든 장애를 없애지는 않지만 Spot 용량 회수의 영향을 분리할 수 있다</a></p>
        quizzes:
          - q: 야간 이미지 변환의95%는 개별 파일별 재실행과 다음 날까지 지연이 가능하며 결과는 S3에 저장된다. 나머지5% 긴급 작업은 Spot
              회수로 지연되면 안 된다. 큐 분리는 가능하고 워커는 중단 처리를 지원한다. 긴급 작업의 조건을 유지하면서 일반
              처리비를 줄일 설계는?
            answer: 일반 큐는 여러 Spot 풀, 긴급 큐는 별도 온디맨드 워커로 처리한다.
            wrong:
              - 연중 매시간 쓰지 않는 최대 야간 용량 전체를 장기 약정으로 할인받는다.
              - 두 큐를 모두 Spot 워커가 처리하되 긴급 큐의 우선순위를 높인다.
              - 전체 최대 야간 용량을 온디맨드로 유지하고 낮에는 워커를 중지한다.
      - id: saa-r2-Q22-48
        source_id: Q22-48
        type: mcq
        title: Q22-48 · 모의고사 A
        explain: |
          <p>일반 처리 시간에 맞는 가시성을 두고 긴 작업은 ChangeMessageVisibility 등으로 연장한다. 성공 후 삭제하면 워커가 실패할 때 큐가 재처리 경로를 유지한다. 표준 큐의 중복 가능성에는 멱등성도 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>가시성을12시간으로 고정하고 진행 상태와 무관하게 모든 실패 재시도를 기다린다.</td>
          <td>고정12시간은 워커가 실패해도 메시지를 오래 숨겨20분 안 재시작 조건을 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>수신 직후 메시지를 삭제하고 검사 완료 여부는 워커 메모리에 보관한다.</td>
          <td>먼저 삭제하면 워커 실패 시 큐에서 복구할 메시지가 사라져 내구성 있는 재처리를 잃는다.</td>
          </tr>
          <tr>
          <td>큐 보존을7일로 늘리고 가시성30초와 기존 소비자 동작은 유지한다.</td>
          <td>보존 기간은 메시지가 큐에 남는 총시간이며30초 뒤 재전달되는 문제를 바꾸지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">SQS visibility timeout</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">처리 중 가시성 시간이 끝나면 메시지가 다시 노출될 수 있다</a> · <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">충분한 가시성 시간과 필요 시 연장, 성공 뒤 삭제를 사용하면 재시도를 보존하면서 겹친 처리를 줄일 수 있다</a></p>
        quizzes:
          - q: SQS 파일 검사 워커의 처리 시간은 보통3분이지만 큰 파일은8분 걸린다. 큐 가시성 시간은30초여서 아직 처리 중인 파일을 다른 워커가
              다시 받는다. 워커가 실패한 작업은 다른 워커가20분 안에 다시 시작해야 하며 완료한 작업만 제거한다. 중복 처리와
              실패 재시도 지연을 함께 줄일 구성은?
            answer: 처리 시간을 반영한 가시성과 진행 중 연장을 사용하고 성공 뒤 메시지를 삭제한다.
            wrong:
              - 가시성을12시간으로 고정하고 진행 상태와 무관하게 모든 실패 재시도를 기다린다.
              - 수신 직후 메시지를 삭제하고 검사 완료 여부는 워커 메모리에 보관한다.
              - 큐 보존을7일로 늘리고 가시성30초와 기존 소비자 동작은 유지한다.
      - id: saa-r2-Q22-49
        source_id: Q22-49
        type: mcq
        title: Q22-49 · 모의고사 A
        explain: |
          <p>Standard는 초기 빈번한 접근에 맞고 이후 Standard-IA는 다중 AZ에 저장하면서 즉시 읽는 희소 접근에 적합하다. 실제 전환 비용·최소 보관·객체 크기를 함께 계산한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>처음30일은 Standard에 두고 이후 One Zone-IA로 전환한다.</td>
          <td>One Zone-IA는 이후 저장비를 줄일 수 있지만 원본을 잃을 수 없는 다중 AZ 저장 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>처음30일은 Standard에 두고 이후 Glacier Flexible Retrieval로 전환한다.</td>
          <td>Flexible Retrieval은 읽기 전에 복원 요청이 필요하므로 이후 즉시 조회 조건을 만족하지 못한다.</td>
          </tr>
          <tr>
          <td>처음부터 Standard-IA에 두고 전체 수명 동안 같은 계층을 유지한다.</td>
          <td>Standard-IA는 읽기에 데이터 검색료가 있으므로 초기에 빈번한 조회와 검색료 회피 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">S3 storage classes</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#%EC%A0%80%EC%9E%A5-%ED%81%B4%EB%9E%98%EC%8A%A4%EC%99%80-%EB%B3%B5%EC%9B%90-%EC%8B%9C%EA%B0%84%EC%9D%98-%EC%84%A0%ED%83%9D">접근 감소가 일정하고 즉시 조회와 다중 AZ 저장이 필요하므로 Standard에서 Standard-IA로 전환을 검토한다</a> · <a href="/study/lessons/deep-dive/day-03.html#lifecycle%EA%B3%BC-%EC%9A%A9%EB%9F%89-%EC%82%B0%EC%A0%95">전환·최소 보관·조회 비용을 포함해 절감 여부를 계산해야 한다</a></p>
        quizzes:
          - q: 진단 영상은 생성 후30일간 빈번하게 읽고 이후 수년간 드물게 조회한다. 첫30일은 별도 데이터 검색료를 피하고, 이후에도 복원 요청 없이
              바로 읽어야 한다. 원본을 다시 만들 수 없어 단일 AZ 저장은 허용하지 않는다. 확인된 접근 패턴에 맞는 저장
              전략은?
            answer: 처음30일은 Standard에 두고 이후 Standard-IA로 전환한다.
            wrong:
              - 처음30일은 Standard에 두고 이후 One Zone-IA로 전환한다.
              - 처음30일은 Standard에 두고 이후 Glacier Flexible Retrieval로 전환한다.
              - 처음부터 Standard-IA에 두고 전체 수명 동안 같은 계층을 유지한다.
      - id: saa-r2-Q22-50
        source_id: Q22-50
        type: mcq
        title: Q22-50 · 모의고사 A
        explain: |
          <p>S3 게이트웨이 엔드포인트를 관련 라우트에 연결하면 해당 백업을 NAT 처리 경로에서 제외할 수 있다. IAM·버킷·엔드포인트 정책으로 비공개 인가를 유지하고 다른 인터넷 호출은 NAT로 보낸다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현재 NAT Gateway를 NAT 인스턴스로 교체하고 패치·용량 확장을 직접 운영한다.</td>
          <td>NAT 인스턴스는 자체 운영·확장·장애 대응이 필요하며 S3 전용 경로로 트래픽을 빼는 것보다 부담이 크다.</td>
          </tr>
          <tr>
          <td>S3 인터페이스 엔드포인트를 두 AZ에 만들고 백업도 그 ENI로 보낸다.</td>
          <td>인터페이스 엔드포인트도 사설 S3 접근을 제공하지만 시간·데이터 처리 요금이 있어 새 엔드포인트의 별도 요금을 피하는 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>두 AZ의 NAT Gateway로 백업을 분산하고 S3 요청 경로는 NAT로 유지한다.</td>
          <td>NAT를 나누어도 S3 데이터가 계속 NAT 처리 요금 대상이므로 직접적인 비용 원인을 제거하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html">NAT gateway pricing</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#gateway-endpoint%EB%8A%94-%EC%84%9C%EB%B9%84%EC%8A%A4%EB%B3%84-%EA%B2%BD%EB%A1%9C%EB%8B%A4">같은 리전 S3 트래픽은 추가 엔드포인트 사용료 없는 게이트웨이 엔드포인트로 NAT 처리를 피할 수 있다</a> · <a href="/study/lessons/deep-dive/day-05.html#gateway-endpoint%EB%8A%94-%EC%84%9C%EB%B9%84%EC%8A%A4%EB%B3%84-%EA%B2%BD%EB%A1%9C%EB%8B%A4">인터넷 호출용 NAT는 유지하고 트래픽 경로별 비용을 분리해 최적화한다</a></p>
        quizzes:
          - q: 동일 리전 사설 EC2가 S3로 매일 대량 백업을 보내며 NAT의 처리량 요금이 크다. 외부 결제 API는 인터넷 경로가 계속 필요하고
              S3 버킷도 비공개여야 한다. S3 전송을 NAT에서 분리하면서 새 엔드포인트의 시간·데이터 처리 요금도 추가하지 않을
              선택은?
            answer: S3 게이트웨이 엔드포인트를 라우트에 연결하고 일반 인터넷 요청은 NAT로 보낸다.
            wrong:
              - 현재 NAT Gateway를 NAT 인스턴스로 교체하고 패치·용량 확장을 직접 운영한다.
              - S3 인터페이스 엔드포인트를 두 AZ에 만들고 백업도 그 ENI로 보낸다.
              - 두 AZ의 NAT Gateway로 백업을 분산하고 S3 요청 경로는 NAT로 유지한다.
      - id: saa-r2-Q22-51
        source_id: Q22-51
        type: mcq
        title: Q22-51 · 모의고사 A
        explain: |
          <p>SSE-KMS 객체 읽기에는 S3 인가와 해당 키의 복호화 사용 인가가 필요하다. 키 정책이 IAM을 통한 허용을 위임하는지 또는 주체를 직접 허용하는지 실제 권한 경로를 함께 확인한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>같은 객체에 s3:GetObject Allow를 추가하고 KMS 정책은 유지한다.</td>
          <td>이미 허용된 S3 작업을 반복 추가해도 KMS 키 사용의 별도 거부가 해소되지 않는다.</td>
          </tr>
          <tr>
          <td>역할에 kms:Encrypt 권한만 추가하고 기존 읽기 경로를 재시도한다.</td>
          <td>Encrypt는 새 암호화 작업이고 기존 보고서의 복호화를 위한 Decrypt를 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>버킷 기본 암호화에 새 KMS 키를 지정하고 기존 객체를 그대로 둔다.</td>
          <td>기본 암호화 변경은 새 쓰기에 영향을 주며 기존 보고서를 새 키로 자동 재암호화하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html">S3 SSE-KMS permissions</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%ED%82%A4%EC%9D%98-%EC%83%9D%EC%84%B1%EA%B3%BC-%EA%B5%90%EC%B0%A8-%EA%B3%84%EC%A0%95-%EA%B6%8C%ED%95%9C">SSE-KMS 객체 읽기에는 S3 읽기 권한뿐 아니라 해당 KMS 키를 복호화에 사용할 수 있는 권한 경로가 필요하다</a> · <a href="/study/lessons/deep-dive/day-11.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%ED%82%A4%EC%9D%98-%EC%83%9D%EC%84%B1%EA%B3%BC-%EA%B5%90%EC%B0%A8-%EA%B3%84%EC%A0%95-%EA%B6%8C%ED%95%9C">IAM 정책과 키 정책의 관계를 확인해야 암호화를 유지하며 접근을 해결한다</a></p>
        quizzes:
          - q: 동일 계정의 앱 역할은 S3 객체 읽기를 허용받았으나 SSE-KMS 보고서만 AccessDenied가 난다. 일반 비암호화 객체는 읽고
              네트워크도 정상이다. 암호화된 객체를 재작성하지 않고 최소 권한으로 해결할 때 확인할 경계는?
            answer: 역할의 kms:Decrypt 허용과 해당 KMS 키 정책의 사용 허용을 확인한다.
            wrong:
              - 같은 객체에 s3:GetObject Allow를 추가하고 KMS 정책은 유지한다.
              - 역할에 kms:Encrypt 권한만 추가하고 기존 읽기 경로를 재시도한다.
              - 버킷 기본 암호화에 새 KMS 키를 지정하고 기존 객체를 그대로 둔다.
      - id: saa-r2-Q22-52
        source_id: Q22-52
        type: mcq
        title: Q22-52 · 모의고사 A
        explain: |
          <p>CloudFront에서 S3 원본을 캐시하면 반복 다운로드를 엣지에서 처리하고 앱의 파일 중계를 제거한다. 비공개 원본과 뷰어 인가는 OAC·정책·서명 등 요구에 맞게 별도로 구성한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 사전 서명 URL만 발급해 매번 S3 원본에서 직접 다운로드시킨다.</td>
          <td>앱 중계는 제거하지만 엣지 캐시가 없어 글로벌 반복 파일 전송의 캐시 활용 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>두 번째 리전에 S3를 복제하되 모든 파일은 기존 EC2 API가 계속 중계한다.</td>
          <td>복제는 다른 리전의 사본을 제공하지만 기존 EC2 중계 경로를 유지하면 관측된 앱 병목은 계속된다.</td>
          </tr>
          <tr>
          <td>EC2 ASG를 늘리고 각 서버가 S3에서 같은 파일을 읽어 중계하게 한다.</td>
          <td>서버를 늘려도 동일 바이트의 앱 중계와 원본 반복 조회가 남아 비용·병목 원인을 유지한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/ServingCompressedFiles.html">CloudFront caching</a> · <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HowCloudFrontWorks.html">CloudFront operation</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EB%B9%84%EC%9A%A9%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%ED%95%9C">변경이 적고 반복 다운로드되는 파일은 CDN 캐시로 원본 반복 읽기와 앱 중계를 줄일 수 있다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EB%B9%84%EC%9A%A9%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%ED%95%9C">CloudFront와 S3의 실제 요청·전송 요금까지 비교하면서 사용자 가까운 전달 경로를 만든다</a></p>
        quizzes:
          - q: 글로벌 고객이 같은 대형 설치 파일을 반복 다운로드한다. 현재 EC2 API가 권한을 확인한 뒤 S3에서 파일을 읽어 중계해 네트워크와
              연결 수가 병목이다. 파일은 드물게 바뀌고 다운로드 인가는 유지할 수 있다. 앱 서버의 전송을 제거하며 캐시를 활용할
              구성은?
            answer: CloudFront의 비공개 S3 원본 캐시와 뷰어 인가를 사용해 직접 다운로드시킨다.
            wrong:
              - S3 사전 서명 URL만 발급해 매번 S3 원본에서 직접 다운로드시킨다.
              - 두 번째 리전에 S3를 복제하되 모든 파일은 기존 EC2 API가 계속 중계한다.
              - EC2 ASG를 늘리고 각 서버가 S3에서 같은 파일을 읽어 중계하게 한다.
      - id: saa-r2-Q22-53
        source_id: Q22-53
        type: mcq
        title: Q22-53 · 모의고사 A
        explain: |
          <p>MRSC는 지원되는 세 참여 리전을 세 전체 복제본 또는 두 복제본과 witness로 구성한다. 이 경우 업무 리전의 두 전체 복제본과 제3리전 witness가 요구를 충족하며 전체 사본을 줄인다. MRSC 지원 리전은 현행 공식 목록에서 확인하며 과거의 고정 리전 묶음으로 외우지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>주 리전 단일 테이블을 두 업무 앱이 호출하고 읽기에 강한 일관성을 지정한다.</td>
          <td>로컬 강한 읽기는 가능하지만 단일 테이블 리전이 실패하면 다른 리전의 독립 복제본으로 최신 값을 읽는 구성이 아니다.</td>
          </tr>
          <tr>
          <td>업무 두 리전에 MREC 복제본을 두고 각 리전에서 강한 일관성 읽기를 쓴다.</td>
          <td>MREC의 다른 리전 변경은 비동기 복제되므로 로컬 강한 읽기를 사용해도 즉시 리전 상실 시 최신 값을 보장하지 못한다.</td>
          </tr>
          <tr>
          <td>세 리전 모두에 MRSC 전체 복제본을 두고 강한 일관성 읽기를 쓴다.</td>
          <td>요구한 강한 일관성은 제공하지만 전체 데이터 사본이3개라 witness를 사용하는2개 사본보다 많다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-global-table-design.html">글로벌 테이블 MREC·MRSC 및 witness</a> · <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html">DynamoDB 읽기 일관성</a> · <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html">MRSC current supported Regions and three-Region deployment</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#%EB%8B%A4%EC%A4%91-%EB%A6%AC%EC%A0%84-%EC%9D%BC%EA%B4%80%EC%84%B1%EA%B3%BC-%EC%BA%90%EC%8B%9C">현재 MRSC 지원 목록의 세 리전 선택과 과거 고정 그룹 제약 구분</a> · <a href="/study/lessons/deep-dive/day-08.html#%EB%8B%A4%EC%A4%91-%EB%A6%AC%EC%A0%84-%EC%9D%BC%EA%B4%80%EC%84%B1%EA%B3%BC-%EC%BA%90%EC%8B%9C">MRSC는 쓰기 성공 전 다른 참여 리전으로 동기 복제하며 어느 복제본에서도 강한 읽기로 최신 항목을 조회한다</a> · <a href="/study/lessons/deep-dive/day-08.html#%EB%8B%A4%EC%A4%91-%EB%A6%AC%EC%A0%84-%EC%9D%BC%EA%B4%80%EC%84%B1%EA%B3%BC-%EC%BA%90%EC%8B%9C">두 전체 복제본과 한 witness 구성이므로 세 전체 복제본보다 복제본 수가 적고 한 리전 장애에도 다른 두 참여 리전이 남는다</a> · <a href="/study/lessons/deep-dive/day-08.html#%EB%8B%A4%EC%A4%91-%EB%A6%AC%EC%A0%84-%EC%9D%BC%EA%B4%80%EC%84%B1%EA%B3%BC-%EC%BA%90%EC%8B%9C">witness는 일반 테이블처럼 전체 항목을 조회하는 복제본이 아니다</a></p>
        quizzes:
          - q: 지원되는 버지니아 북부·오하이오 리전의 새 DynamoDB 앱은 동일 항목을 양쪽에서 읽고 쓴다. 성공 응답한 쓰기는 즉시 해당 리전을
              잃어도 다른 리전의 강한 GetItem에서 최신이어야 한다. 오리건을 세 번째 참여 리전으로 쓸 수 있고 리전 간
              지연은 허용한다. 전체 데이터 사본 수를 최소화할 구성은?
            answer: 업무 두 리전에 MRSC 복제본을 두고 오리건에는 witness를 구성한다.
            wrong:
              - 주 리전 단일 테이블을 두 업무 앱이 호출하고 읽기에 강한 일관성을 지정한다.
              - 업무 두 리전에 MREC 복제본을 두고 각 리전에서 강한 일관성 읽기를 쓴다.
              - 세 리전 모두에 MRSC 전체 복제본을 두고 강한 일관성 읽기를 쓴다.
      - id: saa-r2-Q22-54
        source_id: Q22-54
        type: mcq
        title: Q22-54 · 모의고사 A
        explain: |
          <p>FSR을 해당 스냅샷·AZ에서 활성화하면 복원 직후 초기화 지연을 줄인 준비된 볼륨을 얻을 수 있다. 결과 볼륨은 종료 시 삭제를 해제해 최신 쓰기가 담긴 볼륨 자체를 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2의 EBS 대역폭만 높이고 현재 두 볼륨의 설정을 유지한다.</td>
          <td>대역폭도 이미 충분하다는 전제에서 EC2 교체만으로 초기화와 종료 삭제 두 문제를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>결과 볼륨을5분마다 스냅샷으로 저장하고 종료 시 삭제 설정은 유지한다.</td>
          <td>스냅샷 주기를 줄여도 마지막 스냅샷 뒤 종료 직전 쓰기를 잃을 수 있어 볼륨 자체의 최신 보존을 대신하지 못한다.</td>
          </tr>
          <tr>
          <td>기준 볼륨의 IOPS만24,000으로 올리고 스냅샷 초기화 경로는 유지한다.</td>
          <td>IOPS 증설은 이미 충분한 설정 성능을 바꿀 뿐 아직 초기화되지 않은 첫 블록 읽기의 원인을 직접 제거하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/ebs-fast-snapshot-restore.html">EBS Fast Snapshot Restore</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/how-ec2-instance-termination-works.html">EC2 종료와 데이터 보존</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">FSR은 지정 기준 스냅샷과 AZ에서 초기화된 새 볼륨을 생성해 처음 접근하는 블록의 로딩 지연을 없앤다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">활성화 완료와 볼륨 생성 크레딧이 준비돼야 하며 12,000 IOPS·500MiB/s는 FSR 지원 범위 안이다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">이와 별개인 결과 볼륨에는 DeleteOnTermination=false를 설정해 인스턴스 종료 후에도 최신 쓰기를 남긴다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">기준 데이터의 신규 복원 성능과 운영 결과의 종료 시 보존을 각각 해결해야 한다</a></p>
        quizzes:
          - q: 분석 EC2를 교체할 때 같은 AZ의1TiB 스냅샷에서 기준 볼륨을 매번 복원한다. 설정한12,000IOPS·500MiB/s는 충분하지만
              처음 읽는 블록에서만 지연이 크다. 미리 전체 블록을 읽을 시간은 없다. 별도 결과 EBS는 현재 종료 시 삭제되지만
              종료 직전 쓰기까지 보존해야 한다. 두 원인을 해결할 변경 두 가지는?
            answer: 기준 스냅샷의 복원 AZ에 Fast Snapshot Restore를 미리 활성화한다.
            wrong:
              - EC2의 EBS 대역폭만 높이고 현재 두 볼륨의 설정을 유지한다.
              - 결과 볼륨을5분마다 스냅샷으로 저장하고 종료 시 삭제 설정은 유지한다.
              - 기준 볼륨의 IOPS만24,000으로 올리고 스냅샷 초기화 경로는 유지한다.
            answers:
              - 기준 스냅샷의 복원 AZ에 Fast Snapshot Restore를 미리 활성화한다.
              - 결과 볼륨의 DeleteOnTermination을 false로 지정한다.
            options:
              - EC2의 EBS 대역폭만 높이고 현재 두 볼륨의 설정을 유지한다.
              - 결과 볼륨을5분마다 스냅샷으로 저장하고 종료 시 삭제 설정은 유지한다.
              - 기준 스냅샷의 복원 AZ에 Fast Snapshot Restore를 미리 활성화한다.
              - 결과 볼륨의 DeleteOnTermination을 false로 지정한다.
              - 기준 볼륨의 IOPS만24,000으로 올리고 스냅샷 초기화 경로는 유지한다.
      - id: saa-r2-Q22-55
        source_id: Q22-55
        type: mcq
        title: Q22-55 · 모의고사 A
        explain: |
          <p>Express는 짧은 대량 이벤트 처리에 적합하며 비동기 실행은 접수 API와 완료를 분리한다. Standard의 상태 전환 과금과 다른 실행시간·메모리 기반 비용을 실제 사용량으로 비교한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>동기 Express 워크플로를 StartSyncExecution으로 시작하고 완료 응답을 기다린다.</td>
          <td>동기 Express도 짧은 처리를 지원하지만 호출 API가 작업 완료를 기다리므로 비동기 접수 조건과 다르다.</td>
          </tr>
          <tr>
          <td>Standard 워크플로를 StartExecution으로 시작하고 각 상태 전환으로 과금한다.</td>
          <td>Standard도 실행 가능하지만50단계의 대량 상태 전환에 비용이 누적되며 이 경우 장기·감사·비멱등 실행의 장점은 필요하지 않다.</td>
          </tr>
          <tr>
          <td>SQS·Lambda·DynamoDB로 단계 상태와 다음 작업 전달을 직접 구현한다.</td>
          <td>단계 제어를 구현할 수 있지만 기존 상태 정의 재사용과 관리형 조정의 운영 이점을 잃는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html">Standard·Express 실행 유형과 보장</a> · <a href="https://aws.amazon.com/step-functions/pricing/">Step Functions 과금 방식</a> · <a href="https://docs.aws.amazon.com/step-functions/latest/apireference/API_StartExecution.html">비동기 실행 시작 API</a> · <a href="https://docs.aws.amazon.com/step-functions/latest/apireference/API_StartSyncExecution.html">동기 Express 실행 API</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">짧고 많은 상태 전환을 가진 멱등 워크플로는 Express에 적합하다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">Express는 상태 전환 건수 대신 실행 요청·시간·메모리로 과금하므로 2초 동안 50단계를 처리하는 고빈도 작업의 조정 비용을 줄일 수 있다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">비동기 StartExecution은 완료를 기다리지 않고 접수를 반환한다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">중복 실행 가능성을 이벤트 ID 멱등 처리로 수용하고 CloudWatch Logs로 이력을 보관한다</a></p>
        quizzes:
          - q: 기존 Step Functions 정의의50단계 정규화는 실행당2초이며 초당1,000건을 처리한다. 단계는 모두 멱등하고 콜백·승인·장기
              대기는 없으며 상세 기록은 CloudWatch Logs로 충분하다. 접수 API는 완료를 기다리지 않는다. 같은 단계
              정의를 재사용하면서 짧은 대량 실행의 조정비를 줄일 선택은?
            answer: 비동기 Express 워크플로를 StartExecution으로 시작한다.
            wrong:
              - 동기 Express 워크플로를 StartSyncExecution으로 시작하고 완료 응답을 기다린다.
              - Standard 워크플로를 StartExecution으로 시작하고 각 상태 전환으로 과금한다.
              - SQS·Lambda·DynamoDB로 단계 상태와 다음 작업 전달을 직접 구현한다.
      - id: saa-r2-Q22-56
        source_id: Q22-56
        type: mcq
        title: Q22-56 · 모의고사 A
        explain: |
          <p>웹 서버 SG를 DB 포트의 소스로 참조하면 그 SG가 연결된 웹 인스턴스의 통신을 허용하면서 ASG 주소 목록을 수동 갱신하지 않아도 된다. 참조 SG의 연결 권한과 멤버 범위도 통제한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>웹 인스턴스의 현재 사설 IP를 DB SG에/32로 등록하고 변경 때 갱신한다.</td>
          <td>주소로 제한할 수는 있지만 ASG 교체마다 IP를 갱신해야 하므로 운영 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>DB SG의5432 인바운드를 웹·다른 앱이 함께 쓰는 VPC CIDR로 제한한다.</td>
          <td>VPC CIDR 전체는 다른 앱과 VPN 주소까지 포함할 수 있어 웹 계층만 허용한다는 최소 범위를 넘는다.</td>
          </tr>
          <tr>
          <td>DB SG의5432 인바운드 소스를 ALB에 연결한 SG로 제한한다.</td>
          <td>DB 연결은 웹 서버가 시작하므로 ALB SG만 허용하면 실제 웹→DB 경로의 주체와 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html">Security group referencing</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#sg-%EC%B0%B8%EC%A1%B0%EB%A1%9C-%EA%B3%84%EC%B8%B5%EC%9D%84-%EC%97%B0%EA%B2%B0%ED%95%98%EA%B8%B0">DB에 실제 연결을 시작하는 주체는 웹 서버이므로 웹 서버 보안 그룹 참조로 DB 포트만 허용한다</a> · <a href="/study/lessons/deep-dive/day-05.html#sg-%EC%B0%B8%EC%A1%B0%EB%A1%9C-%EA%B3%84%EC%B8%B5%EC%9D%84-%EC%97%B0%EA%B2%B0%ED%95%98%EA%B8%B0">보안 그룹 참조는 서버 교체 시 IP 목록을 갱신하는 부담도 줄인다</a></p>
        quizzes:
          - q: 인터넷 ALB 뒤의 웹 ASG가 같은 VPC의 DB5432포트에 접속한다. ASG 주소는 자주 바뀌고 같은 VPC에는 운영자 노트북
              VPN과 다른 앱도 있다. DB에는 이 웹 계층의 인스턴스만 접속하게 하고 IP목록 운영을 피할 규칙은?
            answer: DB SG의5432 인바운드 소스를 웹 인스턴스에 연결한 SG로 제한한다.
            wrong:
              - 웹 인스턴스의 현재 사설 IP를 DB SG에/32로 등록하고 변경 때 갱신한다.
              - DB SG의5432 인바운드를 웹·다른 앱이 함께 쓰는 VPC CIDR로 제한한다.
              - DB SG의5432 인바운드 소스를 ALB에 연결한 SG로 제한한다.
      - id: saa-r2-Q22-57
        source_id: Q22-57
        type: mcq
        title: Q22-57 · 모의고사 A
        explain: |
          <p>게이트웨이 엔드포인트는 VPC의 S3 경로를 제공하며 버킷 정책의 엔드포인트 조건은 다른 위치의 요청을 제한한다. 엔드포인트 정책 자체는 그 엔드포인트를 사용하지 않는 요청을 통제하지 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>엔드포인트 정책에만 버킷 쓰기를 허용하고 버킷의 다른 경로 허용은 유지한다.</td>
          <td>엔드포인트 정책은 해당 경로로 들어오는 요청만 평가하므로 외부 위치의 다른 허용 경로를 막지 못한다.</td>
          </tr>
          <tr>
          <td>NAT Gateway를 만들고 해당 역할의 버킷 쓰기를 소스 경로와 무관하게 허용한다.</td>
          <td>쓰기 자체는 가능하지만 NAT 없는 요구와 위치 외 접근 차단을 모두 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>EC2 SG의 아웃바운드를 S3 접두사 목록으로 제한하고 기존 서비스 경로는 두지 않는다.</td>
          <td>SG의 목적지 제한은 라우팅 경로를 만들지 않고 다른 위치에서 같은 역할을 쓰는 버킷 요청도 제한하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html">S3 gateway endpoints</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#gateway-endpoint%EB%8A%94-%EC%84%9C%EB%B9%84%EC%8A%A4%EB%B3%84-%EA%B2%BD%EB%A1%9C%EB%8B%A4">게이트웨이 엔드포인트는 NAT나 인터넷 게이트웨이 없이 같은 리전 S3 경로를 제공한다</a> · <a href="/study/lessons/deep-dive/day-05.html#endpoint-%EC%A0%95%EC%B1%85%EA%B3%BC-%EB%AA%85%EC%8B%9C%EC%A0%81-%EA%B1%B0%EB%B6%80%EC%9D%98-%EA%B5%90%EC%A7%91%ED%95%A9">버킷 정책의 SourceVpce 조건으로 지정 경로 접근을 통제하면 네트워크와 리소스 권한 조건을 함께 만족한다</a></p>
        quizzes:
          - q: 사설 EC2는 같은 리전 S3의 전용 버킷에 대량 파일을 쓴다. 역할의 객체 쓰기 권한은 있다. NAT·IGW 없이 전송하고, 그 역할의
              키가 다른 위치에서 사용돼도 지정 VPC 엔드포인트 밖에서는 버킷 쓰기가 거부돼야 한다. 필요한 두 구성은?
            answer: 버킷 정책에서 지정 VPC 엔드포인트를 통과하지 않은 요청을 제한한다.
            wrong:
              - 엔드포인트 정책에만 버킷 쓰기를 허용하고 버킷의 다른 경로 허용은 유지한다.
              - NAT Gateway를 만들고 해당 역할의 버킷 쓰기를 소스 경로와 무관하게 허용한다.
              - EC2 SG의 아웃바운드를 S3 접두사 목록으로 제한하고 기존 서비스 경로는 두지 않는다.
            answers:
              - 버킷 정책에서 지정 VPC 엔드포인트를 통과하지 않은 요청을 제한한다.
              - S3 게이트웨이 엔드포인트를 만들고 사용 서브넷의 라우트 테이블에 연결한다.
            options:
              - 버킷 정책에서 지정 VPC 엔드포인트를 통과하지 않은 요청을 제한한다.
              - 엔드포인트 정책에만 버킷 쓰기를 허용하고 버킷의 다른 경로 허용은 유지한다.
              - NAT Gateway를 만들고 해당 역할의 버킷 쓰기를 소스 경로와 무관하게 허용한다.
              - EC2 SG의 아웃바운드를 S3 접두사 목록으로 제한하고 기존 서비스 경로는 두지 않는다.
              - S3 게이트웨이 엔드포인트를 만들고 사용 서브넷의 라우트 테이블에 연결한다.
      - id: saa-r2-Q22-58
        source_id: Q22-58
        type: mcq
        title: Q22-58 · 모의고사 A
        explain: |
          <p>Compliance Vault Lock은 검증 유예가 끝난 뒤 잠금 변경·제거를 제한한다. 최소·최대 보존을 복사 작업의90일과 맞추면 단축 금지와 정상 만료를 함께 구성할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>최소·최대90일의 Vault Lock governance를 쓰고 관리자에게 변경 권한을 둔다.</td>
          <td>Governance는 충분한 권한으로 잠금을 변경할 수 있어 root까지 탈취한 위협 모델을 강제하지 못한다.</td>
          </tr>
          <tr>
          <td>보관함 정책으로 복구 지점 삭제를 거부하고 root가 정책을 관리하게 한다.</td>
          <td>삭제 거부 정책을 주체가 제거할 수 있으면 불변 보관 통제가 아니다.</td>
          </tr>
          <tr>
          <td>복사 작업의 보존을90일로 설정하고 삭제 API의 CloudTrail 경보를 켠다.</td>
          <td>수명 주기와 사후 경보는 유용하지만 권한자가 보존을 줄이거나 삭제하는 행위를 예방하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html">AWS Backup Vault Lock 모드와 유예 기간</a> · <a href="https://docs.aws.amazon.com/aws-backup/latest/devguide/create-a-vault-access-policy.html">보관함 접근 정책</a> · <a href="https://docs.aws.amazon.com/aws-backup/latest/APIReference/API_DeleteBackupVaultAccessPolicy.html">보관함 접근 정책 삭제 API</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EC%A0%9C%EC%99%80-%EC%82%AD%EC%A0%9C-%EB%B0%A9%EC%A7%80-%EB%B0%B1%EC%97%85%EC%9D%98-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%9E%A5%EC%95%A0">Compliance Vault Lock은 유예 기간이 끝난 뒤 복구 지점이 남아 있는 동안 관리자·root도 잠금과 복구 지점의 보호를 변경할 수 없게 한다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EC%A0%9C%EC%99%80-%EC%82%AD%EC%A0%9C-%EB%B0%A9%EC%A7%80-%EB%B0%B1%EC%97%85%EC%9D%98-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%9E%A5%EC%95%A0">최소·최대 90일과 복사 시 90일 수명 주기를 맞추면 조기 삭제를 막으면서 만료 후 불필요한 영구 보존을 피한다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EC%A0%9C%EC%99%80-%EC%82%AD%EC%A0%9C-%EB%B0%A9%EC%A7%80-%EB%B0%B1%EC%97%85%EC%9D%98-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%9E%A5%EC%95%A0">기존 복구 지점이 있다면 각각의 수명 주기를 고정 전에 검증해야 하며, 계정 폐쇄 위협은 지문에서 별도 통제로 제외했다</a></p>
        quizzes:
          - q: 별도 보관 계정의 Backup 보관함으로 EBS 복구 지점을 복사하고90일 뒤 만료시킨다. 보관 계정의 관리자와 root까지 탈취돼도90일
              전에 삭제·보존 단축을 못 하게 해야 한다. 계정 폐쇄는 별도로 막았고 설정 검증 유예를 거친 뒤 고정할 수 있다.
              적합한 보관함 통제는?
            answer: 최소·최대90일의 Vault Lock compliance를 검증 유예 후 고정한다.
            wrong:
              - 최소·최대90일의 Vault Lock governance를 쓰고 관리자에게 변경 권한을 둔다.
              - 보관함 정책으로 복구 지점 삭제를 거부하고 root가 정책을 관리하게 한다.
              - 복사 작업의 보존을90일로 설정하고 삭제 API의 CloudTrail 경보를 켠다.
      - id: saa-r2-Q22-59
        source_id: Q22-59
        type: mcq
        title: Q22-59 · 모의고사 A
        explain: |
          <p>라우트·출발 AZ·목적지·전송량으로 비용 원인을 확인하고 AZ별 로컬 NAT의 추가 고정비와 절감될 전송비를 합산한다. NAT 수를 늘렸다고 NAT 처리 데이터량 자체가 줄어든다고 가정하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>전체 앱을 단일 AZ로 모아 교차 AZ 요금을 제거하는 안을 우선한다.</td>
          <td>단일 AZ 집중은 비용 항목을 줄일 수 있지만 유지해야 하는 AZ 가용성을 낮춘다.</td>
          </tr>
          <tr>
          <td>NAT 처리량 지표만 사용하고 트래픽의 출발 AZ·목적지는 합산한다.</td>
          <td>합계 처리량만으로는 어떤 트래픽이 AZ 경계를 넘는지 몰라 로컬 경로의 절감 효과를 계산할 수 없다.</td>
          </tr>
          <tr>
          <td>NAT 시간 요금만 비교해 항상 NAT 수가 적은 설계를 선택한다.</td>
          <td>NAT 시간 요금만 보면 대량 교차 AZ 전송비와 가용성 요구를 놓친다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html">NAT pricing considerations</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-04.html#zonal%EA%B3%BC-regional%EC%9D%98-%EC%9E%A5%EC%95%A0-%EB%B2%94%EC%9C%84%EC%99%80-%EB%B9%84%EC%9A%A9">NAT 수만 줄이면 교차 AZ 경로 비용과 장애 의존성이 늘 수 있다</a> · <a href="/study/lessons/deep-dive/day-04.html#zonal%EA%B3%BC-regional%EC%9D%98-%EC%9E%A5%EC%95%A0-%EB%B2%94%EC%9C%84%EC%99%80-%EB%B9%84%EC%9A%A9">실제 경로·전송량을 파악하고 추가 NAT 고정 비용과 절감 전송 비용을 함께 비교해야 가용성을 유지한 최적화를 할 수 있다</a></p>
        quizzes:
          - q: 두 AZ의 사설 서버가 다른 AZ의 단일 Zonal NAT를 통해 외부로 대량 전송한다. 비용 보고서에 NAT 처리 요금과 교차 AZ
              전송이 함께 늘었다. AZ별 NAT로 바꾸면 추가 시간 요금이 발생한다. 가용성을 유지한 비용 비교에 반드시 포함할 두
              입력은?
            answer: 실제 서브넷 라우트와 목적지별 교차 AZ 전송량을 측정한다.
            wrong:
              - 전체 앱을 단일 AZ로 모아 교차 AZ 요금을 제거하는 안을 우선한다.
              - NAT 처리량 지표만 사용하고 트래픽의 출발 AZ·목적지는 합산한다.
              - NAT 시간 요금만 비교해 항상 NAT 수가 적은 설계를 선택한다.
            answers:
              - 실제 서브넷 라우트와 목적지별 교차 AZ 전송량을 측정한다.
              - AZ별 NAT 추가 시간 요금과 줄어드는 교차 AZ·처리 경로 비용을 합산한다.
            options:
              - 전체 앱을 단일 AZ로 모아 교차 AZ 요금을 제거하는 안을 우선한다.
              - NAT 처리량 지표만 사용하고 트래픽의 출발 AZ·목적지는 합산한다.
              - 실제 서브넷 라우트와 목적지별 교차 AZ 전송량을 측정한다.
              - AZ별 NAT 추가 시간 요금과 줄어드는 교차 AZ·처리 경로 비용을 합산한다.
              - NAT 시간 요금만 비교해 항상 NAT 수가 적은 설계를 선택한다.
      - id: saa-r2-Q22-60
        source_id: Q22-60
        type: mcq
        title: Q22-60 · 모의고사 A
        explain: |
          <p>EBS 기반 인스턴스의 중지·시작은 인스턴스 ID와 EBS를 유지하고 중지된 시간의 인스턴스 계산 요금을 줄인다. 자동 할당 퍼블릭 IP는 바뀔 수 있어 고정 주소에는 Elastic IP를 사용한다. EBS·IP 등 별도 요금은 남는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Elastic IP와 EBS를 유지하고 야간에는 앱 프로세스만 종료한다.</td>
          <td>앱만 종료하면 인스턴스는 계속 running이므로 야간 EC2 계산 요금이 유지된다.</td>
          </tr>
          <tr>
          <td>Elastic IP를 보관하고 매일 스냅샷 후 종료한 뒤 아침에 새 EC2를 복원한다.</td>
          <td>복원은 새 인스턴스이므로 같은 인스턴스 ID 요구를 충족하지 못하고 마지막 스냅샷 이후 쓰기도 따로 고려해야 한다.</td>
          </tr>
          <tr>
          <td>자동 할당 퍼블릭 IPv4를 유지한 채 같은 EC2의 중지·시작을 예약한다.</td>
          <td>중지·시작 때 자동 할당 퍼블릭 IPv4는 일반적으로 변경돼 외부 허용 목록의 고정 주소 조건을 잃는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Stop_Start.html">EC2 stop and start</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/elastic-ip-addresses-eip.html">Elastic IP addresses</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/day-02.html#%EC%A4%91%EC%A7%80-%ED%9B%84-%EB%8B%A4%EC%8B%9C-%EC%8B%9C%EC%9E%91">EBS 기반 EC2를 중지해 데이터는 유지하고 미사용 컴퓨팅 시간을 줄인다</a> · <a href="/study/lessons/deep-dive/day-02.html#%EC%A4%91%EC%A7%80%EC%B5%9C%EB%8C%80-%EC%A0%88%EC%A0%84%EC%A2%85%EB%A3%8C%EC%99%80-%EB%8D%B0%EC%9D%B4%ED%84%B0">자동 퍼블릭 IPv4는 재시작 때 바뀔 수 있으므로 고정 허용 목록에는 Elastic IP를 사용하며 EBS와 IPv4 등 별도 과금은 남는다</a></p>
        quizzes:
          - q: 시험 EC2는 평일 낮에만 필요하고 밤에는 앱·계산을 쓰지 않는다. EBS의 최신 파일과 EC2 인스턴스 ID는 다음 날 유지해야 하며
              RAM은 필요 없다. 외부 시험 API는 고정 퍼블릭 IPv4를 허용한다. 기존 인스턴스의 야간 계산 요금을 줄일 가장
              직접적인 조치는?
            answer: Elastic IP를 연결하고 업무 외 시간의 EC2 중지·시작을 예약한다.
            wrong:
              - Elastic IP와 EBS를 유지하고 야간에는 앱 프로세스만 종료한다.
              - Elastic IP를 보관하고 매일 스냅샷 후 종료한 뒤 아침에 새 EC2를 복원한다.
              - 자동 할당 퍼블릭 IPv4를 유지한 채 같은 EC2의 중지·시작을 예약한다.
      - id: saa-r2-Q22-61
        source_id: Q22-61
        type: mcq
        title: Q22-61 · 모의고사 A
        explain: |
          <p>캐시 정책은 응답 사본의 구분을, 원본 요청 정책은 추가 전달을 정한다. lang을 키에 두어 언어별 응답을 분리하고 tracking은 원본 요청에만 추가해 불필요한 캐시 사본을 줄인다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>캐시 키에 lang·tracking을 모두 넣고 원본에 두 값을 전달한다.</td>
          <td>내용과 무관한 tracking마다 캐시가 나뉘어 적중률이 떨어진다.</td>
          </tr>
          <tr>
          <td>쿼리를 캐시 키에서 모두 빼고 origin request policy로 lang·tracking을 전달한다.</td>
          <td>원본에 언어를 전달해도 캐시 키에서 언어가 빠지면 기존 다른 언어 응답을 재사용할 수 있다.</td>
          </tr>
          <tr>
          <td>캐시를 비활성화하고 모든 요청의 lang·tracking을 원본에 전달한다.</td>
          <td>내용은 정확할 수 있지만 캐시 공유를 포기해 원본 요청과 지연을 늘린다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html">CloudFront 캐시 키 정책</a> · <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-origin-requests.html">CloudFront 원본 요청 정책</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EC%BA%90%EC%8B%9C-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%9B%90%EB%B3%B8-%EC%A0%84%EB%8B%AC-%EC%A0%95%EC%B1%85">응답을 바꾸는 lang은 캐시 키에 포함해야 언어가 다른 응답이 섞이지 않는다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EC%BA%90%EC%8B%9C-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%9B%90%EB%B3%B8-%EC%A0%84%EB%8B%AC-%EC%A0%95%EC%B1%85">응답과 무관한 tracking을 키에서 빼면 방문마다 캐시가 분할되지 않는다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EC%BA%90%EC%8B%9C-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%9B%90%EB%B3%B8-%EC%A0%84%EB%8B%AC-%EC%A0%95%EC%B1%85">키에 포함한 lang은 원본으로 자동 전달되고, 별도 origin request policy로 tracking을 캐시 미스 원본 요청에 추가한다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EC%BA%90%EC%8B%9C-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%9B%90%EB%B3%B8-%EC%A0%84%EB%8B%AC-%EC%A0%95%EC%B1%85">모든 방문의 집계가 아니라 캐시 미스 집계라는 요구이므로 원본 전달만으로 충분하다</a></p>
        quizzes:
          - q: CloudFront의 같은 매뉴얼 경로는 lang=ko/en에 따라 본문이 달라진다. tracking 값은 매번 바뀌지만 본문에는 영향이
              없고 원본은 캐시 미스 때 이 값을 받아 집계하면 된다. 언어가 섞이지 않게 하면서 같은 언어의 캐시를 최대한 공유할
              정책은?
            answer: 캐시 키에 lang만 넣고 origin request policy로 tracking도 원본에 전달한다.
            wrong:
              - 캐시 키에 lang·tracking을 모두 넣고 원본에 두 값을 전달한다.
              - 쿼리를 캐시 키에서 모두 빼고 origin request policy로 lang·tracking을 전달한다.
              - 캐시를 비활성화하고 모든 요청의 lang·tracking을 원본에 전달한다.
      - id: saa-r2-Q22-62
        source_id: Q22-62
        type: mcq
        title: Q22-62 · 모의고사 A
        explain: |
          <p>72시간 보존은 중단·따라잡기에 여유를 주고 기존 체크포인트는 완료 지점 이후에서 재개하게 한다. 보존 연장은 이미 만료된 기록을 되살리지 않으므로 정비 전에 적용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>정비 전에 보존을72시간으로 늘리고 새 lease table의 LATEST에서 시작한다.</td>
          <td>LATEST는 재시작 이후의 새 기록부터 읽어 중단 중에 누적된 데이터를 건너뛸 수 있다.</td>
          </tr>
          <tr>
          <td>보존24시간을 유지하고 기존 체크포인트로 enhanced fan-out 소비를 재개한다.</td>
          <td>처리량을 늘려도 중단48시간 동안24시간을 넘겨 만료된 기록은 복구하지 못한다.</td>
          </tr>
          <tr>
          <td>정비 전에 보존을72시간으로 늘리고 새 lease table의 TRIM_HORIZON에서 시작한다.</td>
          <td>TRIM_HORIZON은 남아 있는 가장 오래된 기록부터 읽어 이미 완료한 데이터를 불필요하게 다시 처리한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/streams/latest/dev/kinesis-extended-retention.html">Kinesis 보존 기간 조정</a> · <a href="https://docs.aws.amazon.com/streams/latest/dev/kcl-concepts.html">KCL 체크포인트와 재시작</a> · <a href="https://docs.aws.amazon.com/streams/latest/dev/kcl-dynamoDB.html">KCL lease table 상태</a> · <a href="https://docs.aws.amazon.com/kinesis/latest/APIReference/API_StartingPosition.html">스트림 읽기 시작 위치</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">48시간 중단과 따라잡기 여유를 수용하도록 보존을 사전에 72시간으로 늘린다</a> · <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">기존 lease table의 체크포인트를 재사용하면 마지막 확정 처리 위치부터 이어 읽는다</a> · <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">새 lease table의 LATEST는 중단 중 레코드를 건너뛰고, TRIM_HORIZON은 보존 중인 가장 오래된 데이터부터 읽어 중단 전 이미 처리한 분량까지 다시 읽는다</a> · <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">EFO는 읽기 처리량을 분리하지만 만료된 레코드를 복원하지 않는다</a></p>
        quizzes:
          - q: Kinesis의 KCL 소비자를48시간 정비로 멈추지만 생산자는 계속 기록한다. 정비 직전까지 처리는 최신이고 기존 lease table
              체크포인트는 보존한다. 재시작 뒤12시간 안에 따라잡을 처리량이 있고 로직은 멱등하다. 보존은24시간이다. 누락 방지와
              불필요한 과거 재처리 최소화를 위한 변경은?
            answer: 정비 전에 보존을72시간으로 늘리고 기존 lease table 체크포인트에서 재개한다.
            wrong:
              - 정비 전에 보존을72시간으로 늘리고 새 lease table의 LATEST에서 시작한다.
              - 보존24시간을 유지하고 기존 체크포인트로 enhanced fan-out 소비를 재개한다.
              - 정비 전에 보존을72시간으로 늘리고 새 lease table의 TRIM_HORIZON에서 시작한다.
      - id: saa-r2-Q22-63
        source_id: Q22-63
        type: mcq
        title: Q22-63 · 모의고사 A
        explain: |
          <p>SCP의 명시적 거부는 적용되는 멤버 계정의 IAM 관리자 허용보다 우선한다. SCP는 실제 사용 권한을 부여하지 않으므로 허용 리전의 IAM 업무 권한은 별도로 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>관리자 역할에 리전 조건의 IAM 정책을 연결하고 계정 관리자가 관리하게 한다.</td>
          <td>해당 계정 관리자가 정책을 바꿀 수 있으면 조직이 요구한 변경 불가 상한이 아니다.</td>
          </tr>
          <tr>
          <td>각 역할의 권한 경계를 계정 관리자가 필요에 따라 제거·교체하게 한다.</td>
          <td>제거·교체를 자유롭게 하면 경계로 설정한 상한을 우회할 수 있다.</td>
          </tr>
          <tr>
          <td>금지 리전의 EC2 생성을 Config로 탐지하고 Lambda로 나중에 종료한다.</td>
          <td>사후 종료는 리소스 생성 자체를 막지 않아 금지 작업의 예방 통제를 대신하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html">Service control policies</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-12.html#scp-%EB%A6%AC%EC%A0%84-%EC%98%88%EC%99%B8%EC%9D%98-%EB%85%BC%EB%A6%AC">멤버 계정에 적용되는 SCP의 명시적 거부는 계정 내부 관리자 허용보다 우선하므로 개별 역할 변경으로 우회할 수 없는 조직 권한 상한을 구성할 수 있다</a> · <a href="/study/lessons/deep-dive/day-12.html#scp-%EB%A6%AC%EC%A0%84-%EC%98%88%EC%99%B8%EC%9D%98-%EB%85%BC%EB%A6%AC">실제 업무 권한은 별도로 필요하다</a></p>
        quizzes:
          - q: 개발자가 Organizations 멤버 계정의 IAM 관리자 권한을 갖는다. 회사는 특정 리전에서 EC2 생성을 금지하고, 그 계정
              관리자가 역할 정책을 바꿔도 금지를 풀지 못하게 해야 한다. 조직 관리자가 통제를 운영하며 허용 리전의 업무 권한은
              계정에서 정한다. 적합한 상한은?
            answer: 멤버 계정의 OU에 금지 리전 EC2 작업을 명시적으로 거부하는 SCP를 적용한다.
            wrong:
              - 관리자 역할에 리전 조건의 IAM 정책을 연결하고 계정 관리자가 관리하게 한다.
              - 각 역할의 권한 경계를 계정 관리자가 필요에 따라 제거·교체하게 한다.
              - 금지 리전의 EC2 생성을 Config로 탐지하고 Lambda로 나중에 종료한다.
      - id: saa-r2-Q22-64
        source_id: Q22-64
        type: mcq
        title: Q22-64 · 모의고사 A
        explain: |
          <p>전체 적재와 CDC로 원본 변경을 추적하고 스키마 변환·앱 코드를 평가한다. 최종 쓰기 중지·지연 소진·데이터 검증·연결 전환을 계획해야 짧은 중단으로 이기종 이전을 완료할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DMS 전체 적재만 실행하고 수일 뒤 대상 적재가 끝나면 엔드포인트를 바꾼다.</td>
          <td>전체 적재만으로는 초기 적재 중과 이후 원본에 추가된 변경을 지속 반영하지 못한다.</td>
          </tr>
          <tr>
          <td>DMS 전체 적재+CDC를 실행하고 앱 SQL·프로시저는 기존 코드를 그대로 사용한다.</td>
          <td>데이터 변경을 따라가도 다른 엔진에서 SQL·프로시저가 그대로 동작한다고 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>초기 적재 전부터 원본 쓰기를 멈추고 변환한 백업을 한 번 복원한다.</td>
          <td>수일 동안 원본을 중지하면 최종 전환 때만 짧게 중단할 수 있다는 조건을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html">DMS ongoing replication</a> · <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html">DMS schema conversion</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%ED%8C%8C%EC%9D%BC-%EC%A0%91%EC%86%8D-%EA%B3%84%EC%B8%B5%EA%B3%BC-db-%EB%B3%80%EA%B2%BD-%EB%B3%B5%EC%A0%9C%EB%A5%BC-%EA%B5%AC%EB%B3%84%ED%95%9C%EB%8B%A4">이기종 DB 이전은 스키마·코드 호환성과 데이터 이관을 함께 다뤄야 한다</a> · <a href="/study/lessons/deep-dive/day-13.html#%ED%8C%8C%EC%9D%BC-%EC%A0%91%EC%86%8D-%EA%B3%84%EC%B8%B5%EA%B3%BC-db-%EB%B3%80%EA%B2%BD-%EB%B3%B5%EC%A0%9C%EB%A5%BC-%EA%B5%AC%EB%B3%84%ED%95%9C%EB%8B%A4">전체 적재 뒤 CDC로 변경을 따라가고 전환 시 쓰기·지연·정합성을 검증하면 중단을 줄일 수 있다</a></p>
        quizzes:
          - q: 온프레미스 주문 DB를 지원되는 다른 엔진의 AWS DB로 이전한다. 수일 걸리는 초기 적재 동안 원본 쓰기를 계속하고 최종 전환 때만
              짧게 멈출 수 있다. 테이블뿐 아니라 앱 SQL·저장 프로시저의 호환성도 검증해야 한다. 적합한 이관 순서는?
            answer: 스키마·코드 변환을 평가하고 DMS 전체 적재+CDC 후 지연·검증을 확인해 전환한다.
            wrong:
              - DMS 전체 적재만 실행하고 수일 뒤 대상 적재가 끝나면 엔드포인트를 바꾼다.
              - DMS 전체 적재+CDC를 실행하고 앱 SQL·프로시저는 기존 코드를 그대로 사용한다.
              - 초기 적재 전부터 원본 쓰기를 멈추고 변환한 백업을 한 번 복원한다.
      - id: saa-r2-Q22-65
        source_id: Q22-65
        type: mcq
        title: Q22-65 · 모의고사 A
        explain: |
          <p>요구 IOPS·지연에 맞는 프로비저닝 IOPS SSD와 인스턴스 EBS 성능을 함께 확인한다. io2 선택만으로 인스턴스 한도를 넘을 수 없으며 실제 작업으로 성능·비용을 검증한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>gp2 용량만 크게 늘려 IOPS를 확보하고 인스턴스의 EBS 한도는 유지한다.</td>
          <td>gp2 크기 증가로 성능을 얻을 수 있지만 불필요한 용량을 사고 인스턴스 한도도 해결하지 못할 수 있다.</td>
          </tr>
          <tr>
          <td>동일 용량 st1 HDD로 바꾸고 큰 순차 I/O 처리량을 확보한다.</td>
          <td>st1은 큰 순차 I/O에 적합하며 작은 랜덤 I/O와 지연 중심 DB의 요구와 맞지 않는다.</td>
          </tr>
          <tr>
          <td>현재 EBS는 유지하고 CPU 코어가 더 많은 인스턴스로만 변경한다.</td>
          <td>CPU 사용률이 낮고 EBS IOPS가 포화된 상황이므로 코어 증가만으로 스토리지 병목을 직접 제거하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html">EBS volume types</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">작은 랜덤 I/O의 지속 IOPS와 지연 요구에는 프로비저닝 IOPS SSD를 검토한다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">볼륨만 높여도 인스턴스 EBS 대역폭에 막힐 수 있으므로 양쪽 한계를 맞춰야 한다</a></p>
        quizzes:
          - q: EC2 DB의 작은 랜덤 읽기·쓰기가 일정하게 많다. CPU는 여유가 있지만 EBS IOPS 한도에 반복 도달한다. 용량을 더 저장할
              필요는 없고 p99 지연과 지속 I/O를 우선한다. HDD 순차 처리량보다 이 병목에 맞춰 비교할 구성은?
            answer: 필요 IOPS의 io2와 그 I/O를 지원하는 EBS 최적화 인스턴스를 선택한다.
            wrong:
              - gp2 용량만 크게 늘려 IOPS를 확보하고 인스턴스의 EBS 한도는 유지한다.
              - 동일 용량 st1 HDD로 바꾸고 큰 순차 I/O 처리량을 확보한다.
              - 현재 EBS는 유지하고 CPU 코어가 더 많은 인스턴스로만 변경한다.
