id: saa-day-29
name: 최종 통합·변형 문제
part: 29일 차
color: "#8b5cf6"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: Q29-01
        type: mcq
        title: Q29-01 · 최종 통합·변형 문제
        explain: |
          <p>ActiveMQ active/standby 배포는 여러 AZ의 브로커와 공유 메시지 저장소를 사용해 관리형 장애 조치를 제공한다. 클라이언트는 두 endpoint의 failover transport를 사용해 활성 브로커로 재접속한다. 메시지 영속성과 재연결 동작은 실제 실패 시험으로 함께 검증해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 AZ의 단일 브로커 두 개를 독립 운영하고 클라이언트 절반씩을 각 주소에 연결한다</td>
          <td>독립 브로커에 부하를 나눌 수 있지만 한 브로커의 persistent 메시지와 연결을 다른 브로커가 자동 이어받는 active/standby 구성이 아니다.</td>
          </tr>
          <tr>
          <td>기존 단일 브로커의 인스턴스 크기를 높이고 클라이언트 연결 풀과 재시도를 늘린다</td>
          <td>평상시 성능·재연결 빈도는 개선할 수 있어도 단일 AZ 브로커의 장애 경계를 바꾸지 않는다.</td>
          </tr>
          <tr>
          <td>단일 AZ의 EBS 기반 단일 브로커 배포를 사용하고 클라이언트의 재연결 옵션을 설정한다</td>
          <td>프로세스·연결 장애에 대한 재접속은 가능하지만 단일 AZ의 EBS 기반 브로커를 다른 AZ의 대기 브로커가 이어받는 구성은 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-broker-architecture.html">ActiveMQ active/standby 배포</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 단일 인스턴스 Amazon MQ for ActiveMQ를 쓰는 JMS 주문 앱을 개선한다. persistent 메시지와 기존 JMS
              클라이언트를 유지하면서 AZ 한 곳이 손실되어도 운영자 재생성 없이 브로커를 복구하고 클라이언트도 재접속해야 한다.
              클라이언트 설정 변경은 가능하다. 가장 적절한 배포·접속 조합은 무엇인가?
            answer: 두 AZ active/standby 브로커와 양쪽 주소를 담은 failover transport를 쓴다
            wrong:
              - 두 AZ의 단일 브로커 두 개를 독립 운영하고 클라이언트 절반씩을 각 주소에 연결한다
              - 기존 단일 브로커의 인스턴스 크기를 높이고 클라이언트 연결 풀과 재시도를 늘린다
              - 단일 AZ의 EBS 기반 단일 브로커 배포를 사용하고 클라이언트의 재연결 옵션을 설정한다
      - id: Q29-02
        type: mcq
        title: Q29-02 · 최종 통합·변형 문제
        explain: |
          <p>수정 시각 기반 증분 전송은 신규와 수정 레코드를 모두 포착하면서 반복 전송량을 줄인다. 전송 필드 매핑에서 SSN을 제외해야 S3 저장 금지를 충족한다. CreatedDate만 사용하면 기존 거래 수정이 누락될 수 있다. 실제 timestamp 지원과 지연 offset은 커넥터 설정에서 검증한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>AppFlow 전체 전송 뒤 Glue 작업으로 SSN을 제거해 정제 버킷에 저장한다</td>
          <td>정제 결과에는 SSN이 없지만 최초 S3 적재에 SSN을 저장하며 전체 전송량도 유지한다.</td>
          </tr>
          <tr>
          <td>AppFlow 전체 전송을 예약하고 매핑에서 SSN을 제외한다</td>
          <td>민감 필드 저장은 피할 수 있지만 매번 전체 이력을 전송해 증분량만 옮기려는 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>AppFlow 증분 전송의 기준을 CreatedDate로 정하고 매핑에서 SSN을 제외한다</td>
          <td>신규 레코드는 포착하지만 생성 후 금액이 바뀐 레코드는 CreatedDate가 그대로여서 증분 범위에서 빠질 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/appflow/latest/userguide/flow-triggers.html">AppFlow 증분 전송의 timestamp와 offset</a> · <a href="https://docs.aws.amazon.com/appflow/latest/userguide/create-flow-console.html">AppFlow 필드 매핑</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: Salesforce 거래 객체의 초기 이력은 S3에 적재했다. 이후 매일 신규 거래와 금액이 수정된 기존 거래를 반영하되 전체 이력을 다시
              전송하는 양은 줄여야 한다. 개인 식별 필드 SSN은 S3에 저장할 수 없다. 삭제 전파는 이번 범위가 아니며 해당
              객체는 CreatedDate와 LastModifiedDate를 제공한다. 커스텀 수집 코드를 최소화할 후속 흐름은
              무엇인가?
            answer: AppFlow 증분 전송의 기준을 LastModifiedDate로 정하고 SSN을 제외한 필드만 매핑한다
            wrong:
              - AppFlow 전체 전송 뒤 Glue 작업으로 SSN을 제거해 정제 버킷에 저장한다
              - AppFlow 전체 전송을 예약하고 매핑에서 SSN을 제외한다
              - AppFlow 증분 전송의 기준을 CreatedDate로 정하고 매핑에서 SSN을 제외한다
      - id: Q29-03
        type: mcq
        title: Q29-03 · 최종 통합·변형 문제
        explain: |
          <p>입력과 SQL이 동일하고 허용된 나이 안이라면 결과 재사용으로 반복 스캔을 피할 수 있다. 쿼리별 데이터 한도는 개별 쿼리가 한도를 넘을 때 취소하는 별도 통제다. 한도 도달 전 이미 스캔한 비용은 발생하며 완전한 무과금 상한은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>workgroup의 총 스캔량 임계값에 SNS 알림을 설정한다</td>
          <td>workgroup 총량 임계값 알림은 누적 사용량을 알려 주지만 개별 쿼리를 해당 바이트 한도에서 자동 취소하는 설정과 다르다.</td>
          </tr>
          <tr>
          <td>쿼리 동시 실행 할당량을 늘려 대기 시간을 줄인다</td>
          <td>동시 실행 용량을 늘려도 같은 쿼리의 스캔 바이트를 줄이거나 과도한 쿼리를 취소하지 않는다.</td>
          </tr>
          <tr>
          <td>확정 파티션 집계 쿼리의 실행 시간 제한을 늘린다</td>
          <td>복잡한 쿼리의 완료 가능성은 높일 수 있지만 반복 읽기 비용과 잘못된 전체 스캔의 중단 조건을 해결하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/reusing-query-results.html">Athena 결과 재사용</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/workgroups-setting-control-limits-cloudwatch.html">Athena workgroup 사용량 통제</a>
          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: Athena 데이터는 Glue Data Catalog의 일반 외부 테이블로, 이미 날짜별 Parquet이며 전날 확정 파티션은 변경되지
              않는다. 동일 workgroup의 팀이 같은 전날 집계 SQL을 10분마다 반복 실행한다. 결과 접근 권한은 갖췄고
              최대 1시간 전 결과를 허용한다. 동시에 실수로 전체 이력을 읽는 쿼리 한 건의 과도한 스캔을 실행 중 중단하고 싶다.
              필요한 설정 두 가지는 무엇인가?
            answer: workgroup에 쿼리별 스캔 바이트 한도를 설정한다
            wrong:
              - workgroup의 총 스캔량 임계값에 SNS 알림을 설정한다
              - 쿼리 동시 실행 할당량을 늘려 대기 시간을 줄인다
              - 확정 파티션 집계 쿼리의 실행 시간 제한을 늘린다
            answers:
              - workgroup에 쿼리별 스캔 바이트 한도를 설정한다
              - 허용 최대 나이 60분으로 Athena 쿼리 결과 재사용을 활성화한다
            options:
              - workgroup에 쿼리별 스캔 바이트 한도를 설정한다
              - workgroup의 총 스캔량 임계값에 SNS 알림을 설정한다
              - 쿼리 동시 실행 할당량을 늘려 대기 시간을 줄인다
              - 확정 파티션 집계 쿼리의 실행 시간 제한을 늘린다
              - 허용 최대 나이 60분으로 Athena 쿼리 결과 재사용을 활성화한다
      - id: Q29-04
        type: mcq
        title: Q29-04 · 최종 통합·변형 문제
        explain: |
          <p>EVEN은 fact의 특정 customer_id 집중을 분산하고 작은 dimension의 ALL 복제는 fact가 위치한 노드에서 조인하도록 돕는다. 큰 fact 대신 작은 표만 복제하므로 저장·갱신 부담도 제한된다. 이 선택은 제시된 skew와 테이블 크기를 전제로 하며 모든 워크로드의 일반 기본값은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>fact와 dimension 모두 ALL로 배치하고 날짜 sort key를 추가한다</td>
          <td>조인 재분배는 줄어도 1TB fact를 노드마다 복제하는 저장·적재 부담이 예산 조건과 충돌한다.</td>
          </tr>
          <tr>
          <td>fact와 dimension 모두 EVEN으로 나누고 조인 시 재분배하도록 구성한다</td>
          <td>데이터 분포는 고르게 할 수 있으나 작은 dimension까지 분산해 조인 시 네트워크 이동이 남는다.</td>
          </tr>
          <tr>
          <td>fact와 dimension 모두 customer_id KEY로 배치하고 날짜 sort key를 추가한다</td>
          <td>동일 키 배치는 조인 재분배를 줄일 수 있지만 대형 고객의 fact 행이 같은 slice에 집중되는 skew가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/redshift/latest/dg/c_best-practices-best-dist-key.html">Redshift 분산 스타일 선택</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: Redshift의 판매 fact 테이블은 1TB이고 customer_id DISTKEY를 사용한다. 한 고객의 행이 절반이어서 slice
              데이터·실행 시간이 크게 치우친다. 매일 갱신하는 고객 dimension은 압축 후 500MB이며, 두 테이블 조인에서
              네트워크 재분배가 병목이다. fact 전체 복제는 저장 예산상 어렵다. skew와 조인 재분배를 함께 줄일 선택은
              무엇인가?
            answer: fact는 EVEN으로 고르게 나누고 작은 dimension은 ALL로 각 노드에 배치한다
            wrong:
              - fact와 dimension 모두 ALL로 배치하고 날짜 sort key를 추가한다
              - fact와 dimension 모두 EVEN으로 나누고 조인 시 재분배하도록 구성한다
              - fact와 dimension 모두 customer_id KEY로 배치하고 날짜 sort key를 추가한다
      - id: Q29-05
        type: mcq
        title: Q29-05 · 최종 통합·변형 문제
        explain: |
          <p>공유 GetRecords 읽기의 shard당 2MB/s는 두 앱의 합계 3MB/s 요구에 부족하다. Enhanced fan-out은 등록 소비자별 shard당 전용 처리량을 제공하고 push 방식으로 짧은 전달 지연을 지원한다. shard 수는 유지할 수 있지만 소비자 관련 요금은 별도 비교한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>shard 수를 두 배로 늘리고 두 앱은 기존 GetRecords 방식으로 읽는다</td>
          <td>공유 읽기 총용량은 늘 수 있지만 shard별 상태와 shard 수를 유지해야 하는 운영 제약을 바꾼다.</td>
          </tr>
          <tr>
          <td>두 앱의 GetRecords polling 간격을 줄이고 기존 shard를 공유한다</td>
          <td>polling을 자주 해도 공유 shard의 총 읽기 대역폭은 늘지 않으며 API 제한에 더 빨리 도달할 수 있다.</td>
          </tr>
          <tr>
          <td>Data Firehose를 S3에 전달하고 두 앱이 생성된 파일을 주기적으로 읽는다</td>
          <td>S3 전달·파일 polling은 배치 분석에 유용하지만 이 문제의 500ms 수준 연속 소비 요구에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html">Kinesis enhanced fan-out</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: Kinesis Data Streams의 한 shard를 두 분석 앱이 공유 읽기로 소비한다. 생산 쓰기는 여유가 있고 각 앱은 shard당
              1.5MB/s를 지속 읽어야 하지만 함께 읽으면 지연이 증가한다. 500ms 수준의 전달 지연을 원하며
              downstream의 shard별 상태 관리 때문에 shard 수는 유지해야 한다. 적절한 변경은 무엇인가?
            answer: 두 소비자를 enhanced fan-out으로 등록하고 SubscribeToShard로 읽는다
            wrong:
              - shard 수를 두 배로 늘리고 두 앱은 기존 GetRecords 방식으로 읽는다
              - 두 앱의 GetRecords polling 간격을 줄이고 기존 shard를 공유한다
              - Data Firehose를 S3에 전달하고 두 앱이 생성된 파일을 주기적으로 읽는다
      - id: Q29-06
        type: mcq
        title: Q29-06 · 최종 통합·변형 문제
        explain: |
          <p>DataSync는 지원 온프레미스 파일 시스템과 AWS 저장소 사이의 파일 전송·검증에 적합하다. 이 문제는 이관 작업이므로 계속 로컬 파일 인터페이스를 제공하는 게이트웨이와 구분하고 최종 변경분 전환도 계획한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 NFS를 Direct Connect로 연결해 AWS 앱이 원격 마운트하고 온프레미스 파일 서버 운영을 계속한다</td>
          <td>네트워크로 기존 파일을 쓸 수는 있지만 목표 EFS로의 데이터 이관과 기존 파일 서버 운영 정리를 달성하지 못한다.</td>
          </tr>
          <tr>
          <td>S3 File Gateway로 로컬 캐시와 S3 파일 저장을 제공하고 이관 완료 후에도 온프레미스 경로를 유지한다</td>
          <td>이 설계는 지속적인 로컬 파일 게이트웨이 운영이며 목표 EFS로의 검증된 파일 이관 요구와 다르다.</td>
          </tr>
          <tr>
          <td>EC2 중계 서버에서 직접 파일 복사 스크립트를 운영하고 증분·무결성 검증도 자체 구현한다</td>
          <td>파일을 옮길 수는 있지만 전송·검증을 관리형으로 구성하는 DataSync보다 자체 운영·검증 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html">AWS DataSync</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: 설계 파일 80TB가 온프레미스 NFS 서버에 있으며, 이관 완료 뒤에는 AWS EFS를 새 업무 저장소로 사용할 계획이다. 기존 파일을
              네트워크로 옮기고 변경분을 반복 전송하며 전송 결과도 검증하려 한다. 전송·검증의 자체 운영 부담도 줄여야 하며
              지속적인 로컬 파일 게이트웨이가 필요한 것은 아니다. 적절한 서비스는 무엇인가?
            answer: AWS DataSync로 NFS와 EFS 사이의 전송 작업을 구성한다
            wrong:
              - 기존 NFS를 Direct Connect로 연결해 AWS 앱이 원격 마운트하고 온프레미스 파일 서버 운영을 계속한다
              - S3 File Gateway로 로컬 캐시와 S3 파일 저장을 제공하고 이관 완료 후에도 온프레미스 경로를 유지한다
              - EC2 중계 서버에서 직접 파일 복사 스크립트를 운영하고 증분·무결성 검증도 자체 구현한다
      - id: Q29-07
        type: mcq
        title: Q29-07 · 최종 통합·변형 문제
        explain: |
          <p>원본 변경 수집 지연은 작고 대상 지연과 대상 디스크 대기가 함께 크므로 적용 단계의 저장 I/O가 우선 병목이다. 대상의 지원 IOPS·처리량을 높이는 변경이 지표와 직접 연결된다. 변경 후 같은 쓰기 부하에서 지연 감소를 확인하고 최종 전환 전에는 별도 쓰기 통제·정합성 검증이 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DMS 작업을 새 전체 로드와 CDC 작업으로 다시 생성한다</td>
          <td>재로드는 전체 데이터를 다시 읽고 적재하는 부하를 만들며 대상 저장 한도 자체를 높이지 않는다.</td>
          </tr>
          <tr>
          <td>복제 인스턴스를 메모리 용량이 두 배인 클래스로 바꾼다</td>
          <td>복제 인스턴스에 자원 여유가 있으므로 메모리 증설은 관측된 대상 저장 I/O 포화를 직접 해소하지 않는다.</td>
          </tr>
          <tr>
          <td>원본 DB를 CPU 성능이 두 배인 클래스로 바꾼다</td>
          <td>원본 변경 수집이 이미 빠르므로 원본 CPU 증설로 대상의 쓰기 적용 용량이 늘지는 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Troubleshooting.html">DMS CDC 지연 문제 해결</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: DMS 전체 로드가 끝난 CDC 작업에서 CDCLatencySource는 1초, CDCLatencyTarget은 120초로 증가한다. 복제
              인스턴스 CPU 25%·메모리 여유·디스크 큐 정상이며 네트워크도 충분하다. 대상 RDS는 저장 IOPS 한도에
              도달했고 DiskQueueDepth와 쓰기 지연이 높다. 원본 쓰기를 이어가면서 지연을 줄일 가장 직접적인 변경은
              무엇인가?
            answer: 대상 DB의 지원 저장소 IOPS와 처리량을 높여 변경 적용 병목을 완화한다
            wrong:
              - DMS 작업을 새 전체 로드와 CDC 작업으로 다시 생성한다
              - 복제 인스턴스를 메모리 용량이 두 배인 클래스로 바꾼다
              - 원본 DB를 CPU 성능이 두 배인 클래스로 바꾼다
      - id: Q29-08
        type: mcq
        title: Q29-08 · 최종 통합·변형 문제
        explain: |
          <p>Private IP VPN over Direct Connect는 transit VIF와 Direct Connect gateway를 통해 TGW에 연결하는 구성을 사용한다. 사설 VPN 종단 주소와 IPsec을 함께 만족한다. DX의 10Gbps가 VPN 단일 터널의 처리량을 뜻하는 것은 아니므로 실제 터널·흐름별 한도도 별도 검토한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>지원 Direct Connect 링크의 MACsec을 켜고 private VIF로 VPC에 연결한다</td>
          <td>MACsec은 데이터센터와 Direct Connect 위치 사이 링크를 보호하며 고객 라우터부터 VPN 종단까지의 IPsec 터널을 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>private VIF로 EC2 TLS 프록시에 연결하고 프록시에서 앱별 TLS를 종료한다</td>
          <td>TLS로 애플리케이션 연결을 보호할 수 있지만 라우터와 VPN 종단 사이 IPsec 요구 및 앱 코드 변경 제약과 다른 계층의 설계다.</td>
          </tr>
          <tr>
          <td>Direct Connect public VIF와 공개 주소 Site-to-Site VPN endpoint를 결합한다</td>
          <td>IPsec을 DX 경로에 결합할 수 있지만 VPN 종단이 공개 IP이므로 해당 보안 정책과 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpn/latest/s2svpn/private-ip-dx.html">Private IP VPN over Direct Connect</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 데이터센터에서 AWS TGW 뒤 VPC로 10Gbps Direct Connect를 운영한다. 정책은 고객 라우터부터 AWS VPN 종단까지
              IPsec을 요구하고 VPN 종단에 공개 IP를 사용할 수 없다. 앱 TLS 코드는 변경하기 어렵다. 지원 연결·장비
              조건과 처리량을 검토한 뒤 선택할 구성은 무엇인가?
            answer: DX transit VIF·DX gateway·TGW에 사설 IP Site-to-Site VPN을 구성한다
            wrong:
              - 지원 Direct Connect 링크의 MACsec을 켜고 private VIF로 VPC에 연결한다
              - private VIF로 EC2 TLS 프록시에 연결하고 프록시에서 앱별 TLS를 종료한다
              - Direct Connect public VIF와 공개 주소 Site-to-Site VPN endpoint를 결합한다
      - id: Q29-09
        type: mcq
        title: Q29-09 · 최종 통합·변형 문제
        explain: |
          <p>Transit Gateway는 여러 VPC와 온프레미스 네트워크를 잇는 전이 허브다. 연결과 라우팅 테이블을 설계해 허용 경로를 구분하며 각 VPC 라우팅·보안 규칙과 겹치지 않는 주소도 함께 관리해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>각 VPC에 별도 VPN 허브 EC2를 운영하고 라우팅·패치·장애 조치를 직접 관리한다</td>
          <td>가상 장비로 구현할 수는 있으나 중앙 관리형 허브 요구에서 직접 운영·가용성 부담이 커진다.</td>
          </tr>
          <tr>
          <td>각 VPC에 피어링을 모두 추가하고 허용·거부 경로를 연결별로 수동 관리한다</td>
          <td>전체 연결은 가능할 수 있지만 증가하는 쌍별 피어링 운영을 중앙 허브로 단순화하려는 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>각 VPC를 공통 VPC에만 피어링하고 그 VPC를 통한 피어링 전이 경로를 가정한다</td>
          <td>VPC 피어링은 다른 피어링 연결을 통한 전이 라우팅을 지원하지 않아 허브처럼 쓸 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html">Transit Gateway</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 여러 부서의 VPC 수십 개와 데이터센터를 연결하면서 모든 VPC 쌍에 피어링을 추가하는 관리가 복잡해졌다. 직접 운영할 네트워크 장비를
              늘리지 않고 중앙 허브로 연결을 모으되 운영·개발 간 직접 통신은 경로 정책으로 분리하고 싶다. 가장 적합한 네트워크
              구성은 무엇인가?
            answer: Transit Gateway와 연결·라우팅 테이블을 이용해 허브와 분리 경로를 구성한다
            wrong:
              - 각 VPC에 별도 VPN 허브 EC2를 운영하고 라우팅·패치·장애 조치를 직접 관리한다
              - 각 VPC에 피어링을 모두 추가하고 허용·거부 경로를 연결별로 수동 관리한다
              - 각 VPC를 공통 VPC에만 피어링하고 그 VPC를 통한 피어링 전이 경로를 가정한다
      - id: Q29-10
        type: mcq
        title: Q29-10 · 최종 통합·변형 문제
        explain: |
          <p>S3 File Gateway는 기존 앱에 파일 프로토콜 인터페이스를 제공하면서 S3에 파일 데이터를 저장하고 로컬 캐시를 활용하는 요구에 맞는다. 단순한 일괄 파일 이관과 구분하고 캐시·업로드 상태·접근 방식의 제한을 확인한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Volume Gateway의 iSCSI 블록 볼륨을 기존 NFS 앱에 그대로 제시한다</td>
          <td>Volume Gateway는 블록 인터페이스이므로 NFS 파일 경로 유지와 S3 파일 객체 기반 보관이라는 요구에 직접 부합하지 않는다.</td>
          </tr>
          <tr>
          <td>FSx for Windows File Server를 만들어 기존 NFS와 S3 객체 원본을 변경 없이 유지한다고 가정한다</td>
          <td>Windows 파일 서버는 SMB 파일 공유이며 요구한 NFS 인터페이스와 S3 File Gateway의 객체 저장·캐시 구성을 그대로 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>DataSync의 정기 전송으로만 S3에 복사하고 앱의 지속 NFS 접근 계층은 별도로 두지 않는다</td>
          <td>DataSync는 파일 전송에 적합하지만 앱이 계속 사용할 NFS 인터페이스·로컬 캐시를 제공하는 게이트웨이는 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html">Amazon S3 File Gateway</a> · <a href="https://docs.aws.amazon.com/filegateway/latest/files3/file-gateway-concepts.html">파일 저장과 캐시 동작</a>
          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: 온프레미스 문서 앱이 당분간 NFS 파일 경로를 유지해야 하지만 파일의 원본 보관은 S3에 두려 한다. 자주 읽는 파일은 로컬 캐시로
              접근하고, 앱을 객체 API 방식으로 즉시 다시 작성하지 않으려 한다. 가장 적절한 서비스는 무엇인가?
            answer: S3 File Gateway를 배치해 NFS 파일 인터페이스와 로컬 캐시를 제공한다
            wrong:
              - Volume Gateway의 iSCSI 블록 볼륨을 기존 NFS 앱에 그대로 제시한다
              - FSx for Windows File Server를 만들어 기존 NFS와 S3 객체 원본을 변경 없이 유지한다고
                가정한다
              - DataSync의 정기 전송으로만 S3에 복사하고 앱의 지속 NFS 접근 계층은 별도로 두지 않는다
      - id: Q29-11
        type: mcq
        title: Q29-11 · 최종 통합·변형 문제
        explain: |
          <p>HTTP 공격 패턴은 WAF 규칙으로 통제하고 여러 계정·새 리소스에 일관되게 적용하는 관리는 Firewall Manager로 구성한다. 조직·대상·권한 등 전제 조건을 확인하며 워크로드 패치와 감사 기록도 별도로 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Shield DDoS 보호만 중앙 적용하고 HTTP 입력 패턴용 WAF 정책은 배포하지 않는다</td>
          <td>DDoS 보호만으로 공통 HTTP 요청 검사 규칙을 여러 계정에 유지하는 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>계정마다 WAF 정책을 수동 생성하고 새 계정·리소스 추가 때 운영자가 복사한다</td>
          <td>개별 적용은 가능하지만 여러 계정과 신규 리소스에 중앙에서 누락을 줄이려는 요구를 충족하기 어렵다.</td>
          </tr>
          <tr>
          <td>SCP로 WAF API 사용 범위만 제한하고 실제 web ACL 배포는 구성하지 않는다</td>
          <td>SCP는 API 권한 상한으로 실제 WAF 규칙을 각 리소스에 배포·연결하는 기능을 수행하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">WAF</a> · <a href="https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html">Firewall Manager</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 회사는 Organizations의 여러 계정에 ALB와 CloudFront 배포를 운영한다. 보안 팀은 공통 WAF 규칙을 유지하고 새
              계정·리소스에도 정책 적용 누락을 줄이려 한다. 개별 앱의 취약점 패치도 별도로 수행한다. 요구에 맞는 구성 요소 두
              가지는 무엇인가?
            answer: 지원 리소스에 적용할 AWS WAF 규칙·web ACL 정책을 정의한다
            wrong:
              - Shield DDoS 보호만 중앙 적용하고 HTTP 입력 패턴용 WAF 정책은 배포하지 않는다
              - 계정마다 WAF 정책을 수동 생성하고 새 계정·리소스 추가 때 운영자가 복사한다
              - SCP로 WAF API 사용 범위만 제한하고 실제 web ACL 배포는 구성하지 않는다
            answers:
              - 지원 리소스에 적용할 AWS WAF 규칙·web ACL 정책을 정의한다
              - Firewall Manager로 대상 계정·리소스의 보호 정책을 중앙 관리한다
            options:
              - Shield DDoS 보호만 중앙 적용하고 HTTP 입력 패턴용 WAF 정책은 배포하지 않는다
              - 지원 리소스에 적용할 AWS WAF 규칙·web ACL 정책을 정의한다
              - Firewall Manager로 대상 계정·리소스의 보호 정책을 중앙 관리한다
              - 계정마다 WAF 정책을 수동 생성하고 새 계정·리소스 추가 때 운영자가 복사한다
              - SCP로 WAF API 사용 범위만 제한하고 실제 web ACL 배포는 구성하지 않는다
      - id: Q29-12
        type: mcq
        title: Q29-12 · 최종 통합·변형 문제
        explain: |
          <p>상세 비용 원장은 CUR·Data Exports로 분석하고 지원 컨테이너의 split cost allocation data를 활용해 공유 컴퓨팅 비용을 세분화할 수 있다. 누락·공유 항목의 배분 규칙과 전체 비용 대사를 별도로 유지해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Cost Explorer 계정별 월 합계만 사용해 컨테이너별 실제 사용량 배분을 확정한다</td>
          <td>계정 단위 월 합계만으로 공유 인스턴스의 컨테이너별 사용량을 상세 배분할 근거가 충분하지 않다.</td>
          </tr>
          <tr>
          <td>팀별 Budgets 알림만 만들고 공유 컴퓨팅 사용 데이터는 별도로 수집하지 않는다</td>
          <td>예산 알림은 지출 기준을 감시하지만 컨테이너별 CPU·메모리의 상세 배분 근거를 생성하지 않는다.</td>
          </tr>
          <tr>
          <td>리소스 태그 하나로 모든 미할당 공용 비용이 정확히 귀속된다고 가정한다</td>
          <td>태그가 없는 항목이나 공용·전송 비용 등은 별도 배분 규칙이 필요할 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/cur/latest/userguide/what-is-cur.html">CUR</a> · <a href="https://docs.aws.amazon.com/cur/latest/userguide/split-cost-allocation-data.html">컨테이너 비용 세분화</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 플랫폼팀은 여러 팀의 컨테이너가 공유하는 컴퓨팅 비용을 월말에 배분하려 한다. 단순 계정 합계보다 상세 사용 항목이 필요하고, 지원되는
              컨테이너에 CPU·메모리 기반 세분화 자료도 활용하고 싶다. 적절한 조치 두 가지는 무엇인가?
            answer: 지원 컨테이너의 split cost allocation data를 활성화·분석한다
            wrong:
              - Cost Explorer 계정별 월 합계만 사용해 컨테이너별 실제 사용량 배분을 확정한다
              - 팀별 Budgets 알림만 만들고 공유 컴퓨팅 사용 데이터는 별도로 수집하지 않는다
              - 리소스 태그 하나로 모든 미할당 공용 비용이 정확히 귀속된다고 가정한다
            answers:
              - 지원 컨테이너의 split cost allocation data를 활성화·분석한다
              - CUR 또는 지원 Data Exports 상세 비용 데이터를 수집해 배분한다
            options:
              - Cost Explorer 계정별 월 합계만 사용해 컨테이너별 실제 사용량 배분을 확정한다
              - 지원 컨테이너의 split cost allocation data를 활성화·분석한다
              - 팀별 Budgets 알림만 만들고 공유 컴퓨팅 사용 데이터는 별도로 수집하지 않는다
              - 리소스 태그 하나로 모든 미할당 공용 비용이 정확히 귀속된다고 가정한다
              - CUR 또는 지원 Data Exports 상세 비용 데이터를 수집해 배분한다
      - id: Q29-13
        type: mcq
        title: Q29-13 · 최종 통합·변형 문제
        explain: |
          <p>기존 계정을 enroll하면 기존 리소스를 새 계정으로 옮기지 않고 Control Tower 거버넌스에 편입할 수 있다. OU 이동이나 Identity Center 권한 배정 자체는 계정 baseline 등록 절차를 대신하지 않는다. 기존 계정의 사전 조건·충돌 리소스는 등록 전에 점검해야 하며 문제에서는 완료된 것으로 주어졌다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 계정에 Identity Center 권한 세트를 다시 provision하여 계정 baseline을 배포한다</td>
          <td>권한 세트 provisioning은 직원의 계정 접근 역할·정책을 배포하며 Control Tower 계정 등록과 baseline을 수행하지 않는다.</td>
          </tr>
          <tr>
          <td>기존 계정에 CloudTrail 수집과 Config 기록을 별도 StackSet으로 배포해 관리한다</td>
          <td>로그·구성 기록을 직접 배포할 수 있지만 Control Tower 등록·통제 수명주기와 별도로 운영해야 하므로 요구한 랜딩 존 편입보다 자체 관리가 늘어난다.</td>
          </tr>
          <tr>
          <td>Account Factory로 새 계정을 만들고 기존 VPC·DB를 새 계정에 재구축한다</td>
          <td>새 계정 기반 표준화는 가능하지만 기존 VPC·DB 식별자 유지와 최소 이관 작업 조건에 부합하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/controltower/latest/userguide/enroll-account.html">기존 계정 Control Tower 등록</a> · <a href="https://docs.aws.amazon.com/controltower/latest/userguide/quick-account-provisioning.html">기존 계정 수동 enroll 절차</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: Control Tower 랜딩 존을 운영하는 회사가 인수 회사의 기존 AWS 계정을 Organizations에 초대했다. 자동 계정 등록
              기능은 꺼져 있다. 계정은 등록된 OU로 옮겼지만 아직 Control Tower에 등록하지 않았다. 기존 VPC·DB의
              식별자와 데이터는 유지하며 랜딩 존의 기준 통제를 적용하려 한다. 직원의 Identity Center 계정 배정은 이미
              끝났고 계정 등록 사전 조건도 충족한다. 가장 적은 이관 작업으로 진행할 방법은 무엇인가?
            answer: 기존 계정을 Control Tower에 enroll하여 등록된 OU의 기준 통제 적용을 진행한다
            wrong:
              - 기존 계정에 Identity Center 권한 세트를 다시 provision하여 계정 baseline을 배포한다
              - 기존 계정에 CloudTrail 수집과 Config 기록을 별도 StackSet으로 배포해 관리한다
              - Account Factory로 새 계정을 만들고 기존 VPC·DB를 새 계정에 재구축한다
      - id: Q29-14
        type: mcq
        title: Q29-14 · 최종 통합·변형 문제
        explain: |
          <p>Standard 워크플로의 지원 callback 패턴은 외부 승인 동안 상태를 보존하고 task token을 사용해 다음 단계를 재개할 수 있다. 며칠 동안 일반 함수 실행을 유지하지 않고 timeout과 token의 안전한 전달·권한도 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>일반 Lambda 호출 하나를 승인될 때까지 실행하며 프로세스 메모리에 상태를 둔다</td>
          <td>일반 Lambda 단일 호출은 며칠의 실행 대기를 유지하는 용도가 아니며 메모리도 영속 워크플로 상태 저장소가 아니다.</td>
          </tr>
          <tr>
          <td>SQS 소비자가 한 메시지를 받은 채 며칠간 연결·실행을 유지하고 완료 신호를 기다린다</td>
          <td>소비자를 며칠 실행·대기시키는 방식은 불필요한 컴퓨팅 운영과 메시지 가시성 관리 부담을 만들며 요구한 상태 머신 대기보다 부적합하다.</td>
          </tr>
          <tr>
          <td>SNS 구독자들이 각 단계를 독립 실행하고 승인 대기 상태·기한은 저장하지 않는다</td>
          <td>독립 전달만으로 장기 승인 대기 상태와 완료·기한 초과에 따른 단계 재개가 관리되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html#connect-wait-token">Step Functions callback</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 보험 청구는 서류 검증 후 담당자의 승인에 며칠이 걸릴 수 있다. 대기하는 동안 컴퓨팅 함수를 계속 실행하지 않고 처리 상태를 보존하며,
              승인 API가 도착하면 다음 단계를 재개하고 기한 초과도 추적해야 한다. 가장 적절한 구성은 무엇인가?
            answer: Step Functions Standard에 task token 콜백 대기와 기한 초과 처리를 구성한다
            wrong:
              - 일반 Lambda 호출 하나를 승인될 때까지 실행하며 프로세스 메모리에 상태를 둔다
              - SQS 소비자가 한 메시지를 받은 채 며칠간 연결·실행을 유지하고 완료 신호를 기다린다
              - SNS 구독자들이 각 단계를 독립 실행하고 승인 대기 상태·기한은 저장하지 않는다
      - id: Q29-15
        type: mcq
        title: Q29-15 · 최종 통합·변형 문제
        explain: |
          <p>UpdateReplacePolicy는 교체되어 빠지는 이전 물리 리소스에 적용되므로 Retain으로 실행 가능한 DB를 남긴다. DeletionPolicy Snapshot은 이후 스택 삭제 시 현재 관리 중인 DB의 스냅샷을 만든 뒤 DB를 삭제한다. Retain된 이전 DB는 스택 관리 밖에서 비용·보안·정리 책임을 별도로 관리해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>UpdateReplacePolicy: Snapshot, DeletionPolicy: Retain</td>
          <td>교체 시 이전 DB는 스냅샷 후 삭제되어 실행 가능한 검증 원본이 남지 않고, 스택 삭제 때 현재 DB도 Retain되어 요구와 다르다.</td>
          </tr>
          <tr>
          <td>UpdateReplacePolicy: Snapshot, DeletionPolicy: Snapshot</td>
          <td>스택 삭제 시 스냅샷은 맞지만 교체 시 이전 DB가 스냅샷 후 삭제되므로 실행 상태 보존 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>UpdateReplacePolicy: Retain, DeletionPolicy: Retain</td>
          <td>교체 시 이전 DB는 보존하지만 스택 삭제 때 현재 DB도 실행 상태로 남아 최종 스냅샷 후 DB 삭제 요구와 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatereplacepolicy.html">UpdateReplacePolicy</a> · <a href="https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html">DeletionPolicy</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: CloudFormation change set이 RDS DB 인스턴스의 Replacement를 표시한다. 새 DB로의 데이터 이관은 별도
              준비했고, 교체 후 검증 기간에는 이전 물리 DB를 실행 가능한 상태로 남겨야 한다. 향후 스택 자체를 삭제할 때는
              그때 관리 중인 DB의 최종 스냅샷을 남기고 DB를 삭제하려 한다. DB 리소스에 적용할 속성 조합은 무엇인가?
            answer: "UpdateReplacePolicy: Retain, DeletionPolicy: Snapshot"
            wrong:
              - "UpdateReplacePolicy: Snapshot, DeletionPolicy: Retain"
              - "UpdateReplacePolicy: Snapshot, DeletionPolicy: Snapshot"
              - "UpdateReplacePolicy: Retain, DeletionPolicy: Retain"
