id: saa-r2-day-29
name: 최종 통합·변형 문제
part: 29일 차
color: "#8b5cf6"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: saa-r2-Q29-01
        source_id: Q29-01
        type: mcq
        title: Q29-01 · 최종 통합·변형 문제
        explain: |
          <p>active/standby는 서로 다른 AZ의 중복 브로커와 다중 AZ 저장을 사용해 장애 시 standby를 활성화한다. 클라이언트도 두 endpoint를 가진 failover transport를 사용해야 활성 브로커가 바뀌었을 때 수동 주소 변경 없이 재접속할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>다중 AZ active/standby를 사용하되 현재 active endpoint 하나로만 연결한다.</td>
          <td>서버 쪽 standby가 있어도 클라이언트가 기존 한 endpoint만 재시도하면 새 활성 endpoint로의 자동 재접속을 갖추지 못한다.</td>
          </tr>
          <tr>
          <td>두 AZ에 독립 단일 브로커를 만들고 클라이언트를 절반씩 나눠 연결한다.</td>
          <td>독립 브로커로 분산하면 한쪽 persistent 메시지의 상태가 다른 브로커에 같은 대기 상태로 제공되는 중복 쌍이 아니다.</td>
          </tr>
          <tr>
          <td>단일 브로커를 더 큰 유형으로 바꾸고 같은 endpoint로 재시도한다.</td>
          <td>용량 증가는 단일 AZ 장애 범위를 바꾸지 않으며 같은 endpoint의 재시도만으로 다른 AZ의 브로커가 생기지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-broker-architecture.html">Amazon MQ 배포와 장애 조치</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EB%A0%88%EA%B1%B0%EC%8B%9C-%EB%B8%8C%EB%A1%9C%EC%BB%A4%EC%99%80-saas-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">JMS·persistent 메시지 유지와 서버·클라이언트 양쪽의 AZ 장애 전환</a></p>
        quizzes:
          - q: JMS 주문 앱은 Amazon MQ for ActiveMQ의 단일 브로커에 persistent 메시지를 저장한다. 앱 코드는 유지하되 연결
              문자열은 바꿀 수 있다. 한 AZ가 손실돼도 운영자가 브로커를 다시 만들거나 주소를 수동 교체하지 않고 처리를 재개해야
              한다. 가장 적합한 배포와 클라이언트 설정은?
            answer: 다중 AZ active/standby를 사용하고 두 endpoint를 failover transport에 등록한다.
            wrong:
              - 다중 AZ active/standby를 사용하되 현재 active endpoint 하나로만 연결한다.
              - 두 AZ에 독립 단일 브로커를 만들고 클라이언트를 절반씩 나눠 연결한다.
              - 단일 브로커를 더 큰 유형으로 바꾸고 같은 endpoint로 재시도한다.
      - id: saa-r2-Q29-02
        source_id: Q29-02
        type: mcq
        title: Q29-02 · 최종 통합·변형 문제
        explain: |
          <p>전송량을 줄이면서 기존 거래의 변경까지 가져오려면 수정 시각을 기준으로 증분 전송해야 한다. SSN이 어느 S3에도 들어갈 수 없으므로 적재 후 정제가 아니라 AppFlow 필드 매핑에서 먼저 제외한다. 실제 커넥터의 증분 지원과 시간 구간 처리도 확인한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>AppFlow 전체 전송 후 Glue에서 SSN을 제거해 별도 정제 버킷에 쓴다.</td>
          <td>정제 결과에서 제거해도 원본 S3에 SSN이 먼저 저장되므로 보관 금지 조건을 이미 어긴다.</td>
          </tr>
          <tr>
          <td>AppFlow 전체 전송을 예약하고 SSN 필드를 매핑에서 제외한다.</td>
          <td>SSN 저장 금지는 지키지만 전체 이력을 매일 다시 읽고 전송하므로 증분 전송량 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>AppFlow 증분 기준을 CreatedDate로 설정하고 SSN 필드를 제외한다.</td>
          <td>CreatedDate는 신규 거래를 찾지만 생성 후 금액이 바뀐 기존 거래를 수정 시각 기준으로 가져오지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/appflow/latest/userguide/flow-triggers.html">AppFlow 증분 전송의 timestamp와 offset</a> · <a href="https://docs.aws.amazon.com/appflow/latest/userguide/create-flow-console.html">AppFlow 필드 매핑</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#%EC%A0%84%EB%8B%AC%EB%8F%85%EB%A6%BD-%EC%86%8C%EB%B9%84saas-%EC%A6%9D%EB%B6%84%EC%9D%98-%EC%8B%A4%EC%A0%9C-%EC%9E%85%EC%B6%9C%EB%A0%A5">신규·수정분 증분과 민감 필드의 S3 최초 적재 전 제외</a></p>
        quizzes:
          - q: Salesforce 거래 이력을 이미 S3에 적재했다. 이후 하루 동안 새로 생긴 거래와 금액이 수정된 기존 거래만 매일 반영해야 한다.
              객체는 CreatedDate와 LastModifiedDate를 제공하며 삭제 전파는 필요 없다. SSN은 원본 S3에도
              저장하면 안 되고 자체 수집 코드는 줄이려 한다. 가장 적합한 후속 전송은?
            answer: AppFlow 증분 기준을 LastModifiedDate로 설정하고 SSN을 제외한 필드를 매핑한다.
            wrong:
              - AppFlow 전체 전송 후 Glue에서 SSN을 제거해 별도 정제 버킷에 쓴다.
              - AppFlow 전체 전송을 예약하고 SSN 필드를 매핑에서 제외한다.
              - AppFlow 증분 기준을 CreatedDate로 설정하고 SSN 필드를 제외한다.
      - id: saa-r2-Q29-03
        source_id: Q29-03
        type: mcq
        title: Q29-03 · 최종 통합·변형 문제
        explain: |
          <p>입력이 고정되고 최대 한 시간의 결과가 허용되므로 결과 재사용으로 같은 조회를 다시 스캔하지 않을 수 있다. 개별 쿼리의 과도한 스캔을 실행 중 취소하려면 per-query scan limit이 필요하다. 누적 스캔량 알림은 사용자에게 통지하는 별도 제어다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>workgroup의 하루 누적 스캔량 임계값에 SNS 알림을 설정한다.</td>
          <td>누적 임계값 알림은 예산 관측에 유용하지만 개별 쿼리를 그 스캔량에서 자동 취소하는 설정을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>쿼리 실행 시간 제한을 늘려 대용량 집계가 끝까지 완료되게 한다.</td>
          <td>완료 대기 시간만 늘려 과도한 읽기를 허용한다. 재사용이나 스캔 바이트 제한이 아니다.</td>
          </tr>
          <tr>
          <td>workgroup별 동시 실행 할당량을 늘려 반복 쿼리를 더 병렬로 처리한다.</td>
          <td>대기 시간은 줄일 수 있지만 같은 쿼리의 중복 스캔과 한 쿼리의 스캔 상한을 해결하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/reusing-query-results.html">Athena 결과 재사용</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/workgroups-setting-control-limits-cloudwatch.html">Athena workgroup 사용량 통제</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%A0%88%EC%9D%B4%ED%81%AC-%EA%B6%8C%ED%95%9C%EA%B3%BC-%EB%B9%84%EC%9A%A9-%EC%83%81%ED%95%9C">고정 입력의 반복 재사용과 한 쿼리 실행 중 스캔 차단은 별도 설정</a> · <a href="/study/lessons/deep-dive/day-14.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%A0%88%EC%9D%B4%ED%81%AC-%EA%B6%8C%ED%95%9C%EA%B3%BC-%EB%B9%84%EC%9A%A9-%EC%83%81%ED%95%9C">개별 쿼리 스캔 취소와 누적 사용량 알림의 차이</a></p>
        quizzes:
          - q: 팀은 Athena에서 변경되지 않는 전날 Parquet 파티션을 같은 SQL로 10분마다 집계한다. 같은
              workgroup·Catalog·결과 위치를 사용하며 필요한 접근 권한과 결과 재사용 지원 조건을 충족한다. 결과는
              1시간 전 값이어도 된다. 반복 스캔 비용을 줄이고 실수로 전체 이력을 읽는 개별 쿼리는 실행 중 차단할 설정 두
              가지는?
            answer: workgroup에 쿼리별 스캔 바이트 상한을 설정한다.
            wrong:
              - workgroup의 하루 누적 스캔량 임계값에 SNS 알림을 설정한다.
              - 쿼리 실행 시간 제한을 늘려 대용량 집계가 끝까지 완료되게 한다.
              - workgroup별 동시 실행 할당량을 늘려 반복 쿼리를 더 병렬로 처리한다.
            answers:
              - workgroup에 쿼리별 스캔 바이트 상한을 설정한다.
              - 집계 요청의 쿼리 결과 재사용을 켜고 최대 나이를 60분으로 설정한다.
            options:
              - workgroup에 쿼리별 스캔 바이트 상한을 설정한다.
              - workgroup의 하루 누적 스캔량 임계값에 SNS 알림을 설정한다.
              - 쿼리 실행 시간 제한을 늘려 대용량 집계가 끝까지 완료되게 한다.
              - workgroup별 동시 실행 할당량을 늘려 반복 쿼리를 더 병렬로 처리한다.
              - 집계 요청의 쿼리 결과 재사용을 켜고 최대 나이를 60분으로 설정한다.
      - id: saa-r2-Q29-04
        source_id: Q29-04
        type: mcq
        title: Q29-04 · 최종 통합·변형 문제
        explain: |
          <p>큰 fact를 EVEN으로 분산하면 하나의 고객 키에 묶인 slice 편중을 줄일 수 있다. 작은 dimension을 ALL로 두면 각 노드가 그 복사본과 조인해 dimension 재분배도 줄인다. 이 조건에서는 저장·갱신 부담을 감당할 수 있는 작은 표만 복제하는 것이 핵심이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>fact와 dimension을 모두 ALL로 복제해 모든 조인을 로컬에서 처리한다.</td>
          <td>조인 이동은 줄이지만 큰 fact까지 복제해 저장·적재 예산 조건을 어긴다.</td>
          </tr>
          <tr>
          <td>fact와 dimension을 모두 EVEN으로 나누고 조인 시 필요한 행을 재분배한다.</td>
          <td>fact 편중은 줄일 수 있지만 두 표의 행이 같은 노드에 있지 않아 조인 시 네트워크 재분배가 남는다.</td>
          </tr>
          <tr>
          <td>fact와 dimension의 customer_id KEY를 유지하고 날짜 sort key를 추가한다.</td>
          <td>같은 KEY의 조인 위치는 맞출 수 있지만 인기 고객의 fact 행은 여전히 한 slice에 몰린다. sort key는 그 분포를 바꾸지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/redshift/latest/dg/c_best-practices-best-dist-key.html">Redshift 분산 스타일 선택</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#spark-%EB%B3%80%ED%99%98%EA%B3%BC-redshift-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">대형 fact의 키 편중과 작은 dimension 조인 이동을 동시에 완화</a></p>
        quizzes:
          - q: Redshift 조회 계획을 보니 큰 fact 테이블의 customer_id KEY 분포에서 한 고객이 전체 행의 절반을 차지해 한
              slice가 느리다. 조인하는 작은 dimension은 자주 갱신되지 않으며 모든 노드에 복사할 여유가 있지만 fact
              전체 복제는 어렵다. 운영팀이 직접 분포를 지정할 때 편중과 조인 데이터 이동을 함께 줄일 선택은?
            answer: fact는 EVEN으로 나누고 작은 dimension은 ALL로 각 노드에 복제한다.
            wrong:
              - fact와 dimension을 모두 ALL로 복제해 모든 조인을 로컬에서 처리한다.
              - fact와 dimension을 모두 EVEN으로 나누고 조인 시 필요한 행을 재분배한다.
              - fact와 dimension의 customer_id KEY를 유지하고 날짜 sort key를 추가한다.
      - id: saa-r2-Q29-05
        source_id: Q29-05
        type: mcq
        title: Q29-05 · 최종 통합·변형 문제
        explain: |
          <p>이번 병목은 생산 쓰기가 아니라 소비자들이 나눠 쓰는 읽기 대역폭이다. 각 앱의 요구량이 EFO의 소비자별 전용 처리량 안에 있으므로 shard 수를 유지하면서 두 독립 앱의 읽기 경쟁을 줄일 수 있다. push 전달을 사용하되 1초 미만이라는 목표는 해당 부하 시험에서 검증해야 하며 일반적인 전달 SLA를 뜻하지 않는다. 추가 소비자 요금도 함께 검토한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>shard를 늘리고 두 앱은 기존 공유 GetRecords 방식으로 계속 읽는다.</td>
          <td>샤드 증가는 유효한 확장 대안일 수 있지만 이번에는 상태 관리 때문에 shard 수를 유지해야 한다.</td>
          </tr>
          <tr>
          <td>두 앱의 GetRecords 폴링 주기를 줄여 같은 공유 처리량을 더 자주 요청한다.</td>
          <td>폴링을 더 자주 해도 같은 공유 대역폭의 상한이 늘어나지 않아 지속적인 읽기 경쟁이 남는다.</td>
          </tr>
          <tr>
          <td>스트림을 Firehose로 S3에 전달하고 두 앱이 완료된 파일을 주기적으로 읽는다.</td>
          <td>S3 버퍼 파일 소비는 별도 분석 경로지만 파일 전달·폴링 지연 때문에 요구한 짧은 실시간 전달에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html">Kinesis enhanced fan-out</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">독립 소비자 공유 읽기 병목이며 shard 수를 바꾸지 않아야 함</a></p>
        quizzes:
          - q: Kinesis Data Streams의 두 분석 앱은 같은 레코드를 각각 모두 읽는다. 각 앱의 shard당 요구량은 1.5MB/s로
              EFO의 소비자별 처리량 범위 안이지만 공유 GetRecords 한도는 합계 수요를 감당하지 못한다. 생산 쓰기와 처리
              코드에는 여유가 있다. 기존 shard 수를 유지하며 부하 시험에서 1초 미만 전달 지연을 목표로 할 변경은?
            answer: 두 앱을 enhanced fan-out 소비자로 등록하고 전용 읽기 처리량을 사용한다.
            wrong:
              - shard를 늘리고 두 앱은 기존 공유 GetRecords 방식으로 계속 읽는다.
              - 두 앱의 GetRecords 폴링 주기를 줄여 같은 공유 처리량을 더 자주 요청한다.
              - 스트림을 Firehose로 S3에 전달하고 두 앱이 완료된 파일을 주기적으로 읽는다.
      - id: saa-r2-Q29-06
        source_id: Q29-06
        type: mcq
        title: Q29-06 · 최종 통합·변형 문제
        explain: |
          <p>최종 업무 저장소는 EFS이며 NFS에서 초기·변경분 전송과 검증을 관리형으로 수행해야 하므로 DataSync가 맞는다. 초기 복사 뒤 쓰기량과 남은 전송량을 비교하고 최종 동기화·전환을 검증한다. File Gateway는 지속 파일 접근 계층이지 이번 EFS 이관 작업의 대체물이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DX로 원본 NFS를 연결하고 AWS 앱이 현장 파일 서버를 계속 원격 마운트한다.</td>
          <td>연결은 제공하지만 원본 NFS 서버를 계속 운영하므로 EFS로 이관하고 현장 서버를 폐기하는 목표에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>S3 File Gateway를 배치하고 앱의 영구 저장소를 S3 객체와 로컬 캐시로 바꾼다.</td>
          <td>파일 접근을 제공하지만 최종 저장 대상을 S3로 바꾸어 EFS를 새 업무 저장소로 삼는 요구와 다르다.</td>
          </tr>
          <tr>
          <td>EC2에서 rsync와 별도 검증 스크립트를 운영해 NFS 변경분을 EFS로 복사한다.</td>
          <td>이관은 가능하지만 반복 전송·검증·오류 대응을 직접 운영해야 해 관리 부담 최소화 조건에 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html">AWS DataSync</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#datasync-%EC%A0%84%EC%86%A1%EB%9F%89%EA%B3%BC-%EB%B3%80%EA%B2%BD-%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%9D%98-%EC%88%98%EB%A0%B4">현장 파일 서버 폐기와 EFS로의 반복 변경분 이관·검증</a></p>
        quizzes:
          - q: 온프레미스 NFS의 80TB 설계 파일을 EFS로 옮긴 뒤 현장 파일 서버를 폐기하려 한다. 이관 중 원본 수정이 계속되므로 초기 복사 후
              변경분을 반복 전송하고 최종 전송 결과를 검증해야 한다. 현장 NFS를 계속 제공하는 게이트웨이는 필요 없다. 자체
              복사·검증 코드 운영을 최소화할 방법은?
            answer: DataSync 에이전트와 NFS·EFS 위치로 반복 전송 작업 및 검증을 구성한다.
            wrong:
              - DX로 원본 NFS를 연결하고 AWS 앱이 현장 파일 서버를 계속 원격 마운트한다.
              - S3 File Gateway를 배치하고 앱의 영구 저장소를 S3 객체와 로컬 캐시로 바꾼다.
              - EC2에서 rsync와 별도 검증 스크립트를 운영해 NFS 변경분을 EFS로 복사한다.
      - id: saa-r2-Q29-07
        source_id: Q29-07
        type: mcq
        title: Q29-07 · 최종 통합·변형 문제
        explain: |
          <p>원본 수집 지연은 낮고 복제 자원도 여유가 있으며 대상 저장소만 포화됐으므로 변경 적용 경로가 직접 병목이다. 대상의 지원 IOPS·처리량을 높이고 적용 지연이 줄어드는지 관찰하는 것이 제시된 증거에 맞는 첫 조치다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 작업을 중단하고 새 전체 로드·CDC 작업으로 대상 테이블을 다시 적재한다.</td>
          <td>재적재는 불필요한 읽기·쓰기와 운영 위험을 추가하며 대상 IOPS 병목을 그대로 남긴다.</td>
          </tr>
          <tr>
          <td>DMS 복제 인스턴스를 더 큰 메모리 유형으로 변경한다.</td>
          <td>복제 인스턴스의 여유가 확인됐으므로 메모리 증가만으로 대상 저장소의 쓰기 포화를 해소하지 못한다.</td>
          </tr>
          <tr>
          <td>원본 DB의 CPU·메모리를 늘려 변경 로그 생성을 빠르게 한다.</td>
          <td>원본 수집은 이미 지연이 낮다. 원본을 늘려도 대상 적용 능력은 늘지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Troubleshooting.html">DMS CDC 지연 문제 해결</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%ED%8C%8C%EC%9D%BC-%EC%A0%91%EC%86%8D-%EA%B3%84%EC%B8%B5%EA%B3%BC-db-%EB%B3%80%EA%B2%BD-%EB%B3%B5%EC%A0%9C%EB%A5%BC-%EA%B5%AC%EB%B3%84%ED%95%9C%EB%8B%A4">수집·복제 자원은 정상이고 대상 저장소의 변경 적용만 포화</a></p>
        quizzes:
          - q: DMS 전체 로드 후 CDC를 계속하는 중 대상 데이터 반영이 늦어진다. CDCLatencySource는 낮지만
              CDCLatencyTarget은 계속 증가한다. 복제 인스턴스의 CPU·메모리·디스크와 네트워크에는 여유가 있고 대상
              RDS만 IOPS 한도·디스크 대기·쓰기 지연이 높다. 원본 쓰기를 멈추지 않고 가장 먼저 적용할 변경은?
            answer: 대상 DB의 지원 저장소 IOPS·처리량을 높이고 변경 적용 지연을 재측정한다.
            wrong:
              - 기존 작업을 중단하고 새 전체 로드·CDC 작업으로 대상 테이블을 다시 적재한다.
              - DMS 복제 인스턴스를 더 큰 메모리 유형으로 변경한다.
              - 원본 DB의 CPU·메모리를 늘려 변경 로그 생성을 빠르게 한다.
      - id: saa-r2-Q29-08
        source_id: Q29-08
        type: mcq
        title: Q29-08 · 최종 통합·변형 문제
        explain: |
          <p>고객 라우터에서 AWS VPN 종단까지 IPsec으로 보호하면서 공개 종단 주소를 쓰지 않아야 하므로 Direct Connect 위 private IP VPN을 선택한다. transit VIF·DX gateway·TGW 경로와 지원 조건을 확인한다. MACsec과 앱 TLS는 암호화 구간·계층이 다르다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>지원 DX 링크에 MACsec을 적용하고 기존 private VIF 연결을 유지한다.</td>
          <td>MACsec은 지원 DX 링크의 구간 암호화이며 고객 라우터부터 AWS VPN 종단까지의 IPsec 요구를 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>VPC에 TLS 프록시를 배치하고 앱별 연결을 해당 프록시로 변경한다.</td>
          <td>앱 TLS는 앱 연결 보호이고 IPsec VPN 종단 요구를 충족하지 않는다. 앱 연결 변경도 필요해진다.</td>
          </tr>
          <tr>
          <td>DX public VIF 경로로 AWS 공개 VPN 종단에 Site-to-Site IPsec을 연결한다.</td>
          <td>IPsec은 제공하지만 VPN 종단이 공개 주소이므로 이번 주소 정책에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpn/latest/s2svpn/private-ip-dx.html">Private IP VPN over Direct Connect</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#vpn-%EC%95%94%ED%98%B8%ED%99%94%EC%9D%98-%EC%8B%9C%EC%9E%91%EA%B3%BC-%EB%81%9D">공개 종단 없이 고객 라우터부터 AWS VPN 종단까지 IPsec</a></p>
        quizzes:
          - q: 데이터센터는 Direct Connect와 TGW를 통해 여러 VPC에 연결돼 있다. 보안 기준이 고객 라우터부터 AWS VPN 종단까지
              IPsec을 요구하도록 바뀌었고 VPN 종단에도 공개 IP를 둘 수 없다. 전용 장비·처리량의 지원 조건은 충족하며 앱
              코드를 바꾸지 않으려 한다. 요구를 만족할 변경은?
            answer: DX transit VIF·DX gateway·TGW에 private IP Site-to-Site VPN을 구성한다.
            wrong:
              - 지원 DX 링크에 MACsec을 적용하고 기존 private VIF 연결을 유지한다.
              - VPC에 TLS 프록시를 배치하고 앱별 연결을 해당 프록시로 변경한다.
              - DX public VIF 경로로 AWS 공개 VPN 종단에 Site-to-Site IPsec을 연결한다.
      - id: saa-r2-Q29-09
        source_id: Q29-09
        type: mcq
        title: Q29-09 · 최종 통합·변형 문제
        explain: |
          <p>TGW는 VPC와 온프레미스 연결을 모으는 관리형 허브다. 운영·개발별 라우팅 테이블의 association·propagation을 나누고 공통 DNS에 필요한 왕복 경로만 제공하면 중앙 허브와 분리 요구를 함께 다룰 수 있다. 리소스의 SG 등 통신 통제도 별도로 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>공유 VPC의 EC2 VPN 라우터를 이중화하고 각 VPC·데이터센터의 경로를 연결한다.</td>
          <td>허브는 만들 수 있지만 라우터의 OS·패치·장애 조치를 직접 운영해야 하므로 자체 장비 운영 최소화 요구에 불리하다.</td>
          </tr>
          <tr>
          <td>VPC 전체를 full-mesh 피어링하고 각 VPC 라우팅 테이블에서 분리를 관리한다.</td>
          <td>통신은 구성할 수 있지만 피어링과 분산 경로의 수동 관리가 계속 늘어 허브·중앙 관리 목표를 달성하지 못한다.</td>
          </tr>
          <tr>
          <td>모든 VPC를 같은 TGW 라우팅 테이블에 연결·전파하고 부서별 구분을 태그로 기록한다.</td>
          <td>TGW를 쓰는 것만으로 부서가 분리되지 않는다. 같은 테이블에 모든 경로를 전파하면 상호 직접 경로가 생기며 태그가 이를 막지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html">Transit Gateway</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#tgw%EC%97%90%EC%84%9C-%EC%97%B0%EA%B2%B0%EA%B3%BC-%ED%97%88%EC%9A%A9-%EA%B2%BD%EB%A1%9C%EB%A5%BC-%EB%B6%84%EB%A6%AC%ED%95%9C%EB%8B%A4">공유 서비스 접근은 허용하면서 운영·개발의 직접 경로를 중앙에서 분리</a></p>
        quizzes:
          - q: 여러 부서의 VPC 40개와 데이터센터가 연결돼 있다. 피어링 쌍과 경로가 늘어 운영이 어려워졌다. 운영·개발은 공통 DNS VPC에
              접근해야 하지만 서로 직접 통신하면 안 된다. 자체 VPN 장비 없이 허브로 연결을 모으고 경로 정책을 중앙 관리하려면
              어떤 구성이 적절한가?
            answer: TGW에 VPC·데이터센터를 연결하고 부서별 라우팅 테이블의 연결·전파를 분리한다.
            wrong:
              - 공유 VPC의 EC2 VPN 라우터를 이중화하고 각 VPC·데이터센터의 경로를 연결한다.
              - VPC 전체를 full-mesh 피어링하고 각 VPC 라우팅 테이블에서 분리를 관리한다.
              - 모든 VPC를 같은 TGW 라우팅 테이블에 연결·전파하고 부서별 구분을 태그로 기록한다.
      - id: saa-r2-Q29-10
        source_id: Q29-10
        type: mcq
        title: Q29-10 · 최종 통합·변형 문제
        explain: |
          <p>기존 NFS 경로와 로컬 캐시를 제공하면서 객체를 S3에 보관하는 지속 접근 계층은 S3 File Gateway다. 현장에는 게이트웨이를 배치하지만 전체 파일 복사·캐시 구현을 직접 만들 필요는 없다. DataSync의 반복 복사와 EFS 원본 선택은 다른 요구를 해결한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DataSync로 현장 NFS를 S3에 주기적으로 복사하고 현장 파일 서버를 계속 운영한다.</td>
          <td>복사는 가능하지만 현장 NFS 서버를 계속 원본 접근 계층으로 운영하게 된다. 관리형 S3 파일·캐시 접근 계층과 다르다.</td>
          </tr>
          <tr>
          <td>EFS를 새 원본으로 두고 DX를 통해 지점 앱이 파일을 직접 마운트하게 한다.</td>
          <td>NFS 저장소는 제공하지만 최종 원본이 EFS이며 로컬 캐시가 포함된 S3 파일 접근 요구와 다르다.</td>
          </tr>
          <tr>
          <td>현장 NFS 서버에서 S3 파일 복사·캐시 무효화 스크립트를 직접 운영한다.</td>
          <td>구현은 가능해도 복사·충돌·캐시 갱신과 파일 서버를 직접 운영해야 하므로 운영 부담을 줄이지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html">Amazon S3 File Gateway</a> · <a href="https://docs.aws.amazon.com/filegateway/latest/files3/file-gateway-concepts.html">파일 저장과 캐시 동작</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%ED%8C%8C%EC%9D%BC-%EC%A0%91%EC%86%8D-%EA%B3%84%EC%B8%B5%EA%B3%BC-db-%EB%B3%80%EA%B2%BD-%EB%B3%B5%EC%A0%9C%EB%A5%BC-%EA%B5%AC%EB%B3%84%ED%95%9C%EB%8B%A4">S3 객체 원본·NFS 인터페이스·로컬 캐시를 동시에 유지</a></p>
        quizzes:
          - q: 지점의 레거시 문서 앱은 NFS 파일 경로로만 읽고 쓸 수 있다. 원본 보관은 S3로 옮기되 지점에서 자주 읽는 파일은 로컬 캐시로
              접근해야 한다. 파일 서버 전체를 계속 관리하거나 앱을 객체 API로 다시 쓰는 방식은 피하려 한다. 가장 적합한 접근
              계층은?
            answer: S3 File Gateway를 지점에 배치해 NFS 파일 공유와 로컬 캐시를 제공한다.
            wrong:
              - DataSync로 현장 NFS를 S3에 주기적으로 복사하고 현장 파일 서버를 계속 운영한다.
              - EFS를 새 원본으로 두고 DX를 통해 지점 앱이 파일을 직접 마운트하게 한다.
              - 현장 NFS 서버에서 S3 파일 복사·캐시 무효화 스크립트를 직접 운영한다.
      - id: saa-r2-Q29-11
        source_id: Q29-11
        type: mcq
        title: Q29-11 · 최종 통합·변형 문제
        explain: |
          <p>HTTP 요청 검사는 WAF 규칙으로 정의하고, 여러 계정과 신규 리소스에 지속적으로 적용하는 관리는 Firewall Manager로 구성한다. 범위·자동 복구 설정과 예외를 검토해야 하며 중앙 배포가 애플리케이션 자체 패치를 대신하는 것은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Shield의 DDoS 보호를 적용하고 HTTP 입력 검사는 앱 배포 때만 추가한다.</td>
          <td>DDoS 보호와 앱 수정만으로 공통 HTTP 입력 검사 규칙을 새 리소스에 자동 적용하지 못한다.</td>
          </tr>
          <tr>
          <td>공통 WAF 규칙을 문서화하고 각 계정 운영자가 새 리소스에 수동 연결하게 한다.</td>
          <td>동일 규칙을 사용할 수는 있지만 수동 연결은 신규 계정·리소스 자동 적용 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>조직 SCP에서 WAF API 호출 권한을 제한해 리소스별 보호 구성을 대신한다.</td>
          <td>SCP는 API 권한의 상한을 제한한다. 실제 WAF 보호 정책을 대상 리소스에 배포하는 기능은 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">WAF</a> · <a href="https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html">Firewall Manager</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/exam-supplement/day-26-29.html#waf-%EA%B7%9C%EC%B9%99%EA%B3%BC-%EC%A1%B0%EC%A7%81-%EB%B0%B0%ED%8F%AC">HTTP 검사 규칙 자체와 조직의 기존·신규 대상 자동 적용을 함께 구성</a></p>
        quizzes:
          - q: Organizations의 여러 계정에서 ALB와 CloudFront를 운영한다. 보안팀은 승인한 HTTP 입력 검사 규칙을 모든 대상에
              적용하고, 새 계정·리소스에도 자동으로 적용되게 하려 한다. Firewall Manager의 사전 조건은 준비돼 있으며
              개별 앱 패치는 별도다. 필요한 구성 요소 두 가지는?
            answer: 지원 리소스에 적용할 AWS WAF rule group과 web ACL 정책을 정의한다.
            wrong:
              - Shield의 DDoS 보호를 적용하고 HTTP 입력 검사는 앱 배포 때만 추가한다.
              - 공통 WAF 규칙을 문서화하고 각 계정 운영자가 새 리소스에 수동 연결하게 한다.
              - 조직 SCP에서 WAF API 호출 권한을 제한해 리소스별 보호 구성을 대신한다.
            answers:
              - 지원 리소스에 적용할 AWS WAF rule group과 web ACL 정책을 정의한다.
              - Firewall Manager 정책의 계정·리소스 범위와 자동 적용을 구성한다.
            options:
              - Shield의 DDoS 보호를 적용하고 HTTP 입력 검사는 앱 배포 때만 추가한다.
              - 지원 리소스에 적용할 AWS WAF rule group과 web ACL 정책을 정의한다.
              - Firewall Manager 정책의 계정·리소스 범위와 자동 적용을 구성한다.
              - 공통 WAF 규칙을 문서화하고 각 계정 운영자가 새 리소스에 수동 연결하게 한다.
              - 조직 SCP에서 WAF API 호출 권한을 제한해 리소스별 보호 구성을 대신한다.
      - id: saa-r2-Q29-12
        source_id: Q29-12
        type: mcq
        title: Q29-12 · 최종 통합·변형 문제
        explain: |
          <p>상세 비용 원장은 CUR 또는 지원 Data Exports로 수집하고, 지원 ECS task·EKS pod의 CPU·메모리 소비에 따른 분할 비용 자료를 활성화해 공유 컴퓨팅 배분에 사용한다. 컨테이너 비용 자료가 모든 공용 비용을 자동 귀속하는 것은 아니므로 별도 배분 기준과 대사해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Cost Explorer의 계정별 월 합계를 팀 수로 나누어 컨테이너 사용량 배분을 확정한다.</td>
          <td>계정 합계를 균등 분할하는 규칙은 만들 수 있지만 컨테이너별 실제 CPU·메모리 소비에 따른 배분이 아니다.</td>
          </tr>
          <tr>
          <td>팀별 AWS Budgets 임계값 알림을 배분 원장으로 사용한다.</td>
          <td>Budgets는 비용 임계값을 관측·알림하는 도구로, 상세 컨테이너 사용량을 가진 배분 원장을 대신하지 못한다.</td>
          </tr>
          <tr>
          <td>EC2 인스턴스의 Owner 태그만으로 같은 호스트의 모든 팀 사용 비율을 산정한다.</td>
          <td>호스트의 태그만으로 그 위 여러 팀의 컨테이너가 소비한 CPU·메모리 비율을 구분할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/cur/latest/userguide/what-is-cur.html">CUR</a> · <a href="https://docs.aws.amazon.com/cur/latest/userguide/split-cost-allocation-data.html">컨테이너 비용 세분화</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-12.html#%EB%B9%84%EC%9A%A9-%EC%9B%90%EC%9E%A5%EC%83%81%EA%B0%81%EC%BB%A8%ED%85%8C%EC%9D%B4%EB%84%88-%EB%B0%B0%EB%B6%84">계정 합계가 아닌 지원 컨테이너의 CPU·메모리 기반 상세 원장</a></p>
        quizzes:
          - q: 여러 팀의 ECS·EKS 작업이 EC2 컴퓨팅을 공유한다. 월말에 계정별 총액이 아니라 지원 컨테이너의 CPU·메모리 소비를 반영한 상세
              비용으로 팀별 배분을 검증해야 한다. 공용 비용의 별도 배분 기준도 유지한다. 사용할 데이터와 설정 두 가지는?
            answer: 지원 컨테이너의 split cost allocation data를 활성화해 상세 자료에 반영한다.
            wrong:
              - Cost Explorer의 계정별 월 합계를 팀 수로 나누어 컨테이너 사용량 배분을 확정한다.
              - 팀별 AWS Budgets 임계값 알림을 배분 원장으로 사용한다.
              - EC2 인스턴스의 Owner 태그만으로 같은 호스트의 모든 팀 사용 비율을 산정한다.
            answers:
              - 지원 컨테이너의 split cost allocation data를 활성화해 상세 자료에 반영한다.
              - CUR 또는 지원 Data Exports의 상세 비용·사용량 데이터를 수집한다.
            options:
              - Cost Explorer의 계정별 월 합계를 팀 수로 나누어 컨테이너 사용량 배분을 확정한다.
              - 지원 컨테이너의 split cost allocation data를 활성화해 상세 자료에 반영한다.
              - 팀별 AWS Budgets 임계값 알림을 배분 원장으로 사용한다.
              - EC2 인스턴스의 Owner 태그만으로 같은 호스트의 모든 팀 사용 비율을 산정한다.
              - CUR 또는 지원 Data Exports의 상세 비용·사용량 데이터를 수집한다.
      - id: saa-r2-Q29-13
        source_id: Q29-13
        type: mcq
        title: Q29-13 · 최종 통합·변형 문제
        explain: |
          <p>직원 접근 배정과 계정의 Control Tower 등록은 별개다. 사전 조건을 충족한 기존 계정을 enroll하면 현재 리소스를 새 계정으로 옮기지 않고 랜딩 존의 기준 통제·baseline 적용을 진행할 수 있다. 등록 상태와 통제 준수 결과는 이후 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Identity Center 권한 세트를 다시 배정하고 기존 계정은 Control Tower 미등록으로 둔다.</td>
          <td>권한 세트는 직원 접근을 부여한다. 계정 baseline과 Control Tower 등록을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>기존 계정에 감사용 CloudTrail·Config StackSet만 별도로 배포한다.</td>
          <td>감사 구성은 일부 제공하지만 Control Tower의 계정 등록·기준 거버넌스를 적용하는 절차 전체가 아니다.</td>
          </tr>
          <tr>
          <td>Account Factory에서 새 계정을 만든 뒤 기존 VPC와 DB를 그 계정에 재구축한다.</td>
          <td>새 계정 생성과 리소스 이관은 가능하지만 식별자·데이터를 유지하며 이관을 최소화하는 기존 계정 등록보다 작업이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/controltower/latest/userguide/enroll-account.html">기존 계정 Control Tower 등록</a> · <a href="https://docs.aws.amazon.com/controltower/latest/userguide/quick-account-provisioning.html">기존 계정 수동 enroll 절차</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-12.html#%EC%A7%81%EC%9B%90-%EB%B0%B0%EC%A0%95%EA%B3%BC-%EA%B8%B0%EC%A1%B4-%EA%B3%84%EC%A0%95-%EB%93%B1%EB%A1%9D">직원 접근은 이미 준비됐고 기존 리소스를 유지하며 계정 거버넌스를 적용</a></p>
        quizzes:
          - q: 인수한 회사의 기존 AWS 계정을 Organizations에 초대했다. Control Tower 자동 계정 등록은 꺼져 있고 해당 계정은
              아직 미등록이다. 기존 VPC·DB 식별자와 데이터를 유지하면서 랜딩 존의 기준 통제를 적용해야 한다. 등록 사전
              조건과 직원의 Identity Center 배정은 충족했다. 가장 적은 이관 작업으로 진행할 방법은?
            answer: 기존 계정을 Control Tower에 등록해 거버넌스가 적용되는 OU의 기준 통제를 배포한다.
            wrong:
              - Identity Center 권한 세트를 다시 배정하고 기존 계정은 Control Tower 미등록으로 둔다.
              - 기존 계정에 감사용 CloudTrail·Config StackSet만 별도로 배포한다.
              - Account Factory에서 새 계정을 만든 뒤 기존 VPC와 DB를 그 계정에 재구축한다.
      - id: saa-r2-Q29-14
        source_id: Q29-14
        type: mcq
        title: Q29-14 · 최종 통합·변형 문제
        explain: |
          <p>Standard 워크플로의 callback task는 task token이 돌아올 때까지 상태를 보존하며 지원된 범위에서 장기 대기와 시간 초과를 처리한다. 승인 API가 성공·실패 콜백을 전달하게 하면 함수를 계속 실행하거나 자체 타이머·상태 전이를 구현할 필요를 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SQS 승인 대기열의 메시지를 워커가 반복 수신하며 기한과 처리 상태를 직접 관리한다.</td>
          <td>큐 재수신만으로 장기 승인 흐름 전체가 관리되지는 않는다. 상태·기한·중복 처리·재개 로직이 별도로 필요하다.</td>
          </tr>
          <tr>
          <td>예약 Lambda가 DynamoDB의 승인 상태를 주기적으로 조회해 다음 단계를 호출한다.</td>
          <td>함수의 상시 실행은 피하지만 주기 조회·중복 호출·기한 만료와 상태 전이를 자체 구현해야 한다.</td>
          </tr>
          <tr>
          <td>SNS로 승인 요청을 알리고 DynamoDB 상태·Scheduler 기한 처리를 직접 조정한다.</td>
          <td>구성할 수 있지만 상태 전이·알림·타이머의 일관성과 재시도를 직접 조정해야 해 관리형 워크플로보다 운영 코드가 많다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html#connect-wait-token">Step Functions callback</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">수일 승인 대기·상태·기한을 컴퓨팅 상시 실행과 자체 조정 코드 없이 관리</a></p>
        quizzes:
          - q: 보험 청구는 자동 검증 뒤 사람의 승인에 최대 3일을 기다린다. 대기 중 Lambda를 계속 실행하지 않고 처리 상태와 기한을 보존해야
              한다. 승인 API가 오면 다음 단계를 재개하며 운영팀의 자체 상태 전이·타이머 구현은 줄이려 한다. 가장 적합한
              구성은?
            answer: Step Functions Standard의 task token 콜백 대기와 시간 초과 처리를 사용한다.
            wrong:
              - SQS 승인 대기열의 메시지를 워커가 반복 수신하며 기한과 처리 상태를 직접 관리한다.
              - 예약 Lambda가 DynamoDB의 승인 상태를 주기적으로 조회해 다음 단계를 호출한다.
              - SNS로 승인 요청을 알리고 DynamoDB 상태·Scheduler 기한 처리를 직접 조정한다.
      - id: saa-r2-Q29-15
        source_id: Q29-15
        type: mcq
        title: Q29-15 · 최종 통합·변형 문제
        explain: |
          <p>교체 시 이전 물리 DB를 실행 가능한 자원으로 남기는 동작은 UpdateReplacePolicy: Retain이다. 이후 스택 삭제 시 그 시점의 관리 대상 DB를 스냅샷 후 삭제하는 동작은 DeletionPolicy: Snapshot이다. 교체로 Retain된 이전 DB는 스택 관리 밖에서 별도로 정리해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>UpdateReplacePolicy는 Snapshot, DeletionPolicy는 Retain으로 지정한다.</td>
          <td>교체 때 이전 DB를 스냅샷으로만 남겨 실행 가능한 이전 인스턴스를 유지하지 못하고, 스택 삭제 때도 목표와 반대로 DB를 남긴다.</td>
          </tr>
          <tr>
          <td>UpdateReplacePolicy와 DeletionPolicy를 모두 Snapshot으로 지정한다.</td>
          <td>스택 삭제 동작은 맞지만 교체 때 Snapshot은 이전 DB를 계속 실행 가능한 형태로 남기지 않는다.</td>
          </tr>
          <tr>
          <td>UpdateReplacePolicy와 DeletionPolicy를 모두 Retain으로 지정한다.</td>
          <td>교체 뒤 이전 DB 보존은 맞지만 이후 스택 삭제에서도 당시 DB를 남겨 최종 스냅샷 후 삭제하려는 요구와 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatereplacepolicy.html">UpdateReplacePolicy</a> · <a href="https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html">DeletionPolicy</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-12.html#%EB%A6%AC%EC%86%8C%EC%8A%A4-%EA%B5%90%EC%B2%B4%EC%82%AD%EC%A0%9Crollback">리소스 교체 때 이전 인스턴스 유지와 나중의 스택 삭제 시 스냅샷은 별도 정책</a></p>
        quizzes:
          - q: CloudFormation change set에서 RDS DB의 교체가 예고됐다. 데이터 이관은 따로 준비됐지만 교체 뒤 검증·복귀
              기간에는 이전 물리 DB를 실행 가능한 상태로 남겨야 한다. 검증 후 남긴 이전 DB는 별도 관리하며, 나중에 스택을
              삭제할 때는 그때 관리 중인 DB의 최종 스냅샷을 남기려 한다. 알맞은 속성 조합은?
            answer: UpdateReplacePolicy는 Retain, DeletionPolicy는 Snapshot으로 지정한다.
            wrong:
              - UpdateReplacePolicy는 Snapshot, DeletionPolicy는 Retain으로 지정한다.
              - UpdateReplacePolicy와 DeletionPolicy를 모두 Snapshot으로 지정한다.
              - UpdateReplacePolicy와 DeletionPolicy를 모두 Retain으로 지정한다.
