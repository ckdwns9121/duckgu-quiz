id: saa-day-22
name: 모의고사 A
part: 22일 차
color: "#8b5cf6"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: Q22-01
        type: mcq
        title: Q22-01 · 모의고사 A
        explain: |
          <p>7년 장기 보관이므로 최소 저장 기간보다 이른 삭제는 판단 요인이 아니다. 일반 표준 검색이 통상 3~5시간인 Glacier Flexible Retrieval이 6시간 목표에 맞고, 즉시 읽기를 제공하는 계층보다 낮은 저장 비용을 선택할 수 있다. Deep Archive의 일반 표준 검색은 통상 12시간이다. 이는 검색 시간 SLA 보장을 뜻하지 않으며 대량 복원은 별도 용량 계획이 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 Glacier Deep Archive로 전환하고 Standard 검색을 사용한다.</td>
          <td>Deep Archive는 저장 단가가 낮지만 일반 표준 검색이 통상 12시간이므로 제시한 복원 목표에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>S3 Glacier Instant Retrieval로 전환하고 GET으로 바로 읽는다.</td>
          <td>즉시 GET이 가능하지만 이 업무는 수시간 대기를 허용한다. Flexible Retrieval보다 높은 저장 단가를 부담할 이유가 없다.</td>
          </tr>
          <tr>
          <td>S3 Standard-IA로 전환하고 GET으로 바로 읽는다.</td>
          <td>즉시 읽기와 다중 AZ 내구성은 제공하나 장기·희소 조회에 Flexible Retrieval보다 저장 비용이 높다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html">S3 아카이브 검색 옵션</a> · <a href="https://aws.amazon.com/s3/storage-classes/glacier/">S3 Glacier 계층 비용과 사용 사례</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: S3의 premium/ 계약 파일은 Standard에 유지하고 나머지 대형 증거 파일은 7년 보관한다. 증거 파일은 연 1~2회 소량만
              복원하며 저장 요금이 총비용의 대부분이다. 복원은 일반 RestoreObject의 표준 검색으로 통상 6시간 이내
              완료되는 등급이면 되고 즉시 읽기는 필요 없다. 모든 제안은 premium/을 전환 대상에서 제외한다. 증거 파일의
              저장 비용을 가장 낮추는 선택은 무엇인가?
            answer: S3 Glacier Flexible Retrieval로 전환하고 Standard 검색을 사용한다.
            wrong:
              - S3 Glacier Deep Archive로 전환하고 Standard 검색을 사용한다.
              - S3 Glacier Instant Retrieval로 전환하고 GET으로 바로 읽는다.
              - S3 Standard-IA로 전환하고 GET으로 바로 읽는다.
      - id: Q22-02
        type: mcq
        title: Q22-02 · 모의고사 A
        explain: |
          <p>이미 S3에 있고 비정기적인 SQL 분석이라면 Athena로 상시 분석 서버를 줄일 수 있다. 실제 비용은 스캔량·데이터 형식·조회 빈도 등을 비교해 판단하며 운영 거래 부하도 분리한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>같은 크기의 분석 RDS를 상시 유지하고 읽기 복제본 하나를 추가한다.</td>
          <td>서버 유휴 시간과 운영 부담을 줄이지 않고 상시 자원 비용을 늘린다.</td>
          </tr>
          <tr>
          <td>분석 전용 Provisioned Redshift 클러스터를 24시간 운영한다.</td>
          <td>웨어하우스가 유리한 경우도 있지만 이 비정기 S3 SQL 요구에서는 상시 실행 자원이 남는다.</td>
          </tr>
          <tr>
          <td>S3 원본을 매일 새 EC2에 내려받아 자체 SQL 엔진을 설치해 처리한다.</td>
          <td>일시 실행은 가능하지만 자체 서버와 분석 엔진 운영을 계속해야 해 관리 부담 최소화에 덜 적합하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/what-is.html">Amazon Athena</a>
          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: 운영 DB에서 새벽마다 대규모 통계를 계산하지만 분석은 하루에 한 번이며 데이터는 이미 S3에 내보낸다. 분석 전용 DB 서버가 하루 종일
              유휴 상태다. SQL을 유지하며 서버 운영과 유휴 계산 비용을 줄이려면 무엇을 선택하는가?
            answer: 파티션·열 형식을 갖춘 S3 데이터를 Athena에서 필요할 때 조회한다.
            wrong:
              - 같은 크기의 분석 RDS를 상시 유지하고 읽기 복제본 하나를 추가한다.
              - 분석 전용 Provisioned Redshift 클러스터를 24시간 운영한다.
              - S3 원본을 매일 새 EC2에 내려받아 자체 SQL 엔진을 설치해 처리한다.
      - id: Q22-03
        type: mcq
        title: Q22-03 · 모의고사 A
        explain: |
          <p>중앙 IdP와의 연동 및 계정별 권한 세트는 기존 신원을 재사용하면서 임시 세션으로 접근하도록 하므로 장기 사용자 키를 늘리지 않고 중앙에서 접근을 통제할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>팀 공용 IAM 사용자 키를 발급해 각 직원의 CLI 프로파일에 배포한다.</td>
          <td>장기 키 공유는 배포 회수를 어렵게 하고 직원별 접근 추적도 약해진다.</td>
          </tr>
          <tr>
          <td>각 계정의 IAM 그룹에 직원을 배정하되 별도 사용자 암호를 유지한다.</td>
          <td>그룹은 계정 안의 권한 묶음이며 회사 디렉터리와 다중 계정의 통합 신원 수명 주기를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>계정별 IAM 사용자와 암호를 만들고 회사 디렉터리와 별도로 수명 주기를 관리한다.</td>
          <td>분리된 계정 수명 주기는 회사 신원 비활성화와 접근 회수를 일원화하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html">IAM Identity Center</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 회계팀 직원은 회사 디렉터리 계정으로 여러 AWS 계정에 접속한다. 퇴사자의 신규 접속은 회사 계정 비활성화에 따라 차단해야 하고,
              계정마다 장기 액세스 키를 발급하는 운영은 피해야 한다. 적합한 접근 체계는 무엇인가?
            answer: 회사 IdP를 IAM Identity Center와 연동하고 권한 세트로 계정별 접근을 할당한다.
            wrong:
              - 팀 공용 IAM 사용자 키를 발급해 각 직원의 CLI 프로파일에 배포한다.
              - 각 계정의 IAM 그룹에 직원을 배정하되 별도 사용자 암호를 유지한다.
              - 계정별 IAM 사용자와 암호를 만들고 회사 디렉터리와 별도로 수명 주기를 관리한다.
      - id: Q22-04
        type: mcq
        title: Q22-04 · 모의고사 A
        explain: |
          <p>관련 다중 리전 키는 같은 키 재료로 호환 암호 작업을 지원하므로 로컬 리전 키로 처리할 수 있다. 키 정책 등은 리전별로 관리하므로 가용성과 접근 경계를 함께 설계해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>각 리전에 독립 KMS 키를 만들고 동일 별칭으로 기존 암호문을 바로 복호화한다.</td>
          <td>같은 별칭이어도 키 재료가 달라 기존 암호문을 호환 복호화할 수 없다.</td>
          </tr>
          <tr>
          <td>한 리전의 키를 두 앱이 원격 호출하고 호출 재시도 횟수만 늘린다.</td>
          <td>주 리전 KMS 의존성이 남아 원래 리전 장애 때 로컬 처리 요구를 만족하지 못한다.</td>
          </tr>
          <tr>
          <td>주 리전에서 복호화 후 다른 리전의 독립 키로 재암호화하는 절차를 장애 때 실행한다.</td>
          <td>주 리전 키가 필요한 장애 시점 변환은 원래 리전 의존성을 제거하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html">Multi-Region KMS keys</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 양쪽 리전의 애플리케이션이 클라이언트 측에서 암호화한 동일 데이터를 처리한다. 장애 때 원래 리전 KMS 호출에 의존하지 않고 다른
              리전에서 복호화해야 하며 각 리전의 키 접근은 따로 통제해야 한다. 적합한 방법은 무엇인가?
            answer: 관련된 KMS 다중 리전 키를 구성하고 리전별 키 정책·권한을 관리한다.
            wrong:
              - 각 리전에 독립 KMS 키를 만들고 동일 별칭으로 기존 암호문을 바로 복호화한다.
              - 한 리전의 키를 두 앱이 원격 호출하고 호출 재시도 횟수만 늘린다.
              - 주 리전에서 복호화 후 다른 리전의 독립 키로 재암호화하는 절차를 장애 때 실행한다.
      - id: Q22-05
        type: mcq
        title: Q22-05 · 모의고사 A
        explain: |
          <p>Compute Savings Plans는 EC2 패밀리·리전 변경 및 Fargate·Lambda 이전에도 적격 사용에 유연하게 적용된다. 특정 AZ의 용량은 별도 On-Demand Capacity Reservation으로 확보한다. 다른 선택도 용량 확보는 가능하지만 EC2 Instance Savings Plans와 Zonal RI는 할인 범위가 더 좁고, 온디맨드 예약만으로는 할인 약정의 절감 효과가 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2 Instance Savings Plans로 할인받고 DR 용량은 지정 AZ의 별도 용량 예약으로 확보한다.</td>
          <td>별도 용량 예약으로 DR 용량은 확보하지만 EC2 Instance Savings Plans는 선택한 패밀리·리전 범위에 묶이며 Fargate·Lambda 이전에는 적용되지 않는다.</td>
          </tr>
          <tr>
          <td>EC2 피크 용량을 지정 AZ에 온디맨드 예약하고 Fargate·Lambda도 온디맨드 요금으로 사용한다.</td>
          <td>EC2 용량은 확보하고 다른 서비스로 이전할 수도 있지만 온디맨드 용량 예약 자체가 요금 할인 약정은 아니다. 지속 사용량의 할인 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>현재 EC2 유형의 Zonal Standard RI로 할인과 지정 AZ의 DR 용량을 함께 확보한다.</td>
          <td>Zonal RI는 해당 EC2 구성에 대한 할인과 AZ 용량 예약을 제공한다. 다만 리전·패밀리·Fargate·Lambda 변경에 Compute Savings Plans 수준의 유연성을 제공하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html">Savings Plans types</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html">EC2 Capacity Reservations</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html">리전·AZ 범위 RI의 용량과 할인</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 앱은 매시간 일정 금액 이상의 컴퓨팅을 계속 사용한다. 다음 해에는 EC2 패밀리와 리전을 바꾸거나 일부를 Fargate·Lambda로
              옮길 수 있다. 할인은 적용 범위 유연성을 유지해야 한다. 별도로 특정 AZ에서 장애 복구용 EC2 용량도 확보해야
              하며 할인 구매만으로 용량이 확보된다고 가정해서는 안 된다. 적합한 선택은 무엇인가?
            answer: Compute Savings Plans로 할인받고 DR 용량은 지정 AZ의 별도 용량 예약으로 확보한다.
            wrong:
              - EC2 Instance Savings Plans로 할인받고 DR 용량은 지정 AZ의 별도 용량 예약으로 확보한다.
              - EC2 피크 용량을 지정 AZ에 온디맨드 예약하고 Fargate·Lambda도 온디맨드 요금으로 사용한다.
              - 현재 EC2 유형의 Zonal Standard RI로 할인과 지정 AZ의 DR 용량을 함께 확보한다.
      - id: Q22-06
        type: mcq
        title: Q22-06 · 모의고사 A
        explain: |
          <p>SNS에서 각 큐로 이벤트를 복제하면 두 시스템이 독립적으로 소비한다. 큐 보존 기간은 지원 최대 기간 이내에서 예상 중단·복구 시간을 넘도록 설정해야 하며, 무기한 미처리 데이터 보존으로 가정해서는 안 된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SQS FIFO의 같은 메시지 그룹을 두 시스템이 경쟁 소비하도록 한다.</td>
          <td>FIFO의 순서 제어는 팬아웃이 아니므로 두 시스템 모두에 같은 메시지 복사본을 주지 않는다.</td>
          </tr>
          <tr>
          <td>두 시스템이 하나의 SQS 큐를 경쟁 소비하도록 설정한다.</td>
          <td>공유 큐 경쟁 소비는 작업을 분배하므로 두 시스템 모두가 이벤트를 받는 요구와 다르다.</td>
          </tr>
          <tr>
          <td>SNS에서 두 시스템의 HTTP 엔드포인트로 직접 전달하고 별도 큐는 두지 않는다.</td>
          <td>직접 구독도 가능하지만 이 조건에서는 장기 소비 장애에 대한 큐 버퍼와 독립 재처리 경계가 더 적합하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html">SNS to SQS fanout</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 출고 확정 이벤트를 재고 시스템과 고객 알림 시스템이 각각 빠짐없이 처리해야 한다. 두 시스템은 처리 속도와 실패 빈도가 다르고 소비자가
              예상 최대 5일 중단돼도 이벤트를 보관·재처리해야 하며, 알림 장애 때문에 재고 소비가 지연되어서는 안 된다. 적합한
              구성은 무엇인가?
            answer: SNS에서 시스템별 SQS 큐로 팬아웃하고, 지원 한도 내에서 예상 중단보다 긴 보존 기간을 설정한다.
            wrong:
              - SQS FIFO의 같은 메시지 그룹을 두 시스템이 경쟁 소비하도록 한다.
              - 두 시스템이 하나의 SQS 큐를 경쟁 소비하도록 설정한다.
              - SNS에서 두 시스템의 HTTP 엔드포인트로 직접 전달하고 별도 큐는 두지 않는다.
      - id: Q22-07
        type: mcq
        title: Q22-07 · 모의고사 A
        explain: |
          <p>Object Lock compliance 모드는 보존 중인 객체 버전의 삭제와 보존 단축을 강하게 제한한다. 접근 정책과 별개로 버전 단위 WORM 보존을 제공하므로 관리자 실수 방지 요구에 적합하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Object Lock governance 모드로 설정하고 관리자에게 우회 권한을 유지한다.</td>
          <td>governance 우회 권한이 있으면 관리자도 삭제할 수 없어야 한다는 조건을 만족하지 못한다.</td>
          </tr>
          <tr>
          <td>버킷 정책에서 일반 운영자의 DeleteObject만 거부하고 관리자는 정책을 수정할 수 있게 한다.</td>
          <td>관리자가 정책을 바꾸거나 버전 삭제 경로를 이용할 수 있어 강제 보존 요구보다 약하다.</td>
          </tr>
          <tr>
          <td>S3 Versioning만 켜고 모든 관리자에게 버전 삭제를 허용한다.</td>
          <td>버전 관리만으로 삭제 권한을 가진 관리자의 버전 영구 삭제를 막을 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html">Object Lock retention</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 법무팀이 S3에 증거 문서를 보관한다. 각 문서 버전은 정해진 보존 기간 동안 관리자도 삭제할 수 없어야 하고, 기간을 잘못 줄이는 운영
              실수도 막아야 한다. 비공개 접근 정책은 이미 구성돼 있다. 적합한 저장 통제는 무엇인가?
            answer: S3 Object Lock compliance 모드에 요구 보존 기간을 설정한다.
            wrong:
              - Object Lock governance 모드로 설정하고 관리자에게 우회 권한을 유지한다.
              - 버킷 정책에서 일반 운영자의 DeleteObject만 거부하고 관리자는 정책을 수정할 수 있게 한다.
              - S3 Versioning만 켜고 모든 관리자에게 버전 삭제를 허용한다.
      - id: Q22-08
        type: mcq
        title: Q22-08 · 모의고사 A
        explain: |
          <p>Global Accelerator는 고정 IP 진입점과 AWS 글로벌 네트워크를 이용해 지원 엔드포인트로 TCP·UDP 트래픽을 전달한다. DNS 이름과 캐시가 아니라 고정 IP와 네트워크 경로 요구에 맞는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>CloudFront 배포에 ALB를 연결하고 서비스가 HTTP로만 동작하도록 바꾼다.</td>
          <td>기존 임의 TCP 서비스를 그대로 유지하는 요구에서 HTTP 전환은 범위가 맞지 않는다.</td>
          </tr>
          <tr>
          <td>Route 53 latency 레코드로 각 리전 NLB를 선택하고 고객은 DNS 변경을 따라가게 한다.</td>
          <td>지연 기반 DNS는 가능하지만 고객의 변경되지 않는 고정 IP 요구를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>한 리전의 NLB 고정 IP만 고객에게 주고 다른 리전은 수동으로 주소를 알린다.</td>
          <td>주 리전 장애 시 같은 IP 진입점을 통한 다중 리전 전달 요구에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html">Global Accelerator</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 사내 TCP 서비스가 여러 리전에 있고 글로벌 고객은 변경되지 않는 고정 IP로 접속해야 한다. HTTP 캐시보다는 AWS 글로벌
              네트워크를 통한 안정적 경로와 정상 엔드포인트로의 전달이 중요하다. 적합한 서비스는 무엇인가?
            answer: AWS Global Accelerator에 지원되는 리전 엔드포인트를 등록한다.
            wrong:
              - CloudFront 배포에 ALB를 연결하고 서비스가 HTTP로만 동작하도록 바꾼다.
              - Route 53 latency 레코드로 각 리전 NLB를 선택하고 고객은 DNS 변경을 따라가게 한다.
              - 한 리전의 NLB 고정 IP만 고객에게 주고 다른 리전은 수동으로 주소를 알린다.
      - id: Q22-09
        type: mcq
        title: Q22-09 · 모의고사 A
        explain: |
          <p>부하에 비례하는 평균 CPU는 목표 추적 확장에 적합한 지표다. 워밍업을 고려해 새 용량이 준비되기 전 지표와 확장 판단을 잘못 해석하지 않도록 구성한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>그룹 전체 CPU 합계를 고정 목표로 삼아 target tracking을 구성한다.</td>
          <td>인스턴스 수가 늘어도 전체 CPU 합계는 부하에 따라 유지될 수 있어 용량에 비례하는 평균 지표와 다르다.</td>
          </tr>
          <tr>
          <td>평균 CPU에 반응하되 새 인스턴스 준비 시간을 0으로 가정한다.</td>
          <td>아직 준비되지 않은 용량을 반영하면 초기화 동안 판단이 흔들릴 수 있어 주어진 준비 시간을 고려해야 한다.</td>
          </tr>
          <tr>
          <td>하루 한 번 인스턴스 수를 고정하는 예약 확장만 구성한다.</td>
          <td>불규칙한 시간의 변화를 고정된 하루 일정만으로 따라갈 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html">Target tracking</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: 새 API의 CPU 부하는 요청 수에 비례하며 하루 중 예측하기 어려운 시간에 증가한다. 앱은 상태를 외부에 저장했고 인스턴스는 시작 후
              준비 시간이 필요하다. 지속적으로 목표 CPU 수준을 유지하면서 자동 확장하려면 무엇을 사용해야 하는가?
            answer: 준비 시간을 반영한 워밍업과 평균 CPU 기반 target tracking을 구성한다.
            wrong:
              - 그룹 전체 CPU 합계를 고정 목표로 삼아 target tracking을 구성한다.
              - 평균 CPU에 반응하되 새 인스턴스 준비 시간을 0으로 가정한다.
              - 하루 한 번 인스턴스 수를 고정하는 예약 확장만 구성한다.
      - id: Q22-10
        type: mcq
        title: Q22-10 · 모의고사 A
        explain: |
          <p>제삼자가 역할을 맡는 교차 계정 위임에서는 신뢰할 업체 주체와 고객별 external ID 조건을 함께 사용해 혼동된 대리인 문제를 완화한다. 외부 ID는 비밀번호를 대신하는 비밀값이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>업체 계정만 신뢰하되 모든 고객 요청에서 같은 역할 세션 이름을 사용한다.</td>
          <td>고정 세션 이름은 고객별 요청 구분 조건을 제공하지 않아 혼동된 대리인 문제를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>대상 역할에 읽기 전용 정책만 붙이고 신뢰 정책에는 고객별 조건을 두지 않는다.</td>
          <td>작업 범위를 제한해도 어느 고객을 대신한 요청인지 검증하는 요구는 남는다.</td>
          </tr>
          <tr>
          <td>업체의 모든 고객이 같은 외부 ID를 사용하도록 계약에 정한다.</td>
          <td>고객별로 구별되지 않는 값은 다른 고객 요청과의 혼동을 줄이는 조건으로 충분하지 않다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html">External ID</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 외부 감사 업체의 자동화 도구가 고객 계정의 읽기 전용 역할을 맡아 비용 자료를 가져온다. 같은 업체가 여러 고객을 운영하므로 다른 고객이
              해당 도구를 이용해 이 회사 역할을 잘못 사용하게 만드는 상황을 막아야 한다. 어떤 구성이 적합한가?
            answer: 감사 업체가 발급한 고객별 외부 ID를 신뢰 정책 조건으로 요구한다.
            wrong:
              - 업체 계정만 신뢰하되 모든 고객 요청에서 같은 역할 세션 이름을 사용한다.
              - 대상 역할에 읽기 전용 정책만 붙이고 신뢰 정책에는 고객별 조건을 두지 않는다.
              - 업체의 모든 고객이 같은 외부 ID를 사용하도록 계약에 정한다.
      - id: Q22-11
        type: mcq
        title: Q22-11 · 모의고사 A
        explain: |
          <p>Fargate Linux 1.4.0 이상은 기본 20GiB 임시 저장 공간을 제공하며 작업 정의에서 최대 200GiB까지 늘릴 수 있다. 이미지의 압축·해제 공간도 같은 할당량을 사용하므로 합계 46GiB보다 여유 있는 60GiB를 선택한다. 파일을 공유하거나 작업 종료 후 보존할 필요가 없어 EFS나 직접 관리하는 EC2 호스트를 추가할 이유가 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Fargate 작업에 EFS 파일 시스템과 마운트 대상을 연결한다.</td>
          <td>EFS는 파일 경로와 필요한 공간을 제공하나 공유·영속성이 필요 없는 임시 작업에 파일 시스템·마운트 대상·접근 규칙 운영이 추가된다.</td>
          </tr>
          <tr>
          <td>ECS용 EC2 Auto Scaling 그룹에 100GiB EBS 작업 공간을 둔다.</td>
          <td>작업 공간은 확보하지만 EC2 호스트 이미지·패치·용량 배치를 관리해야 해 Fargate 설정 변경보다 운영 범위가 크다.</td>
          </tr>
          <tr>
          <td>로컬 인스턴스 스토어를 갖춘 ECS용 EC2 Auto Scaling 그룹을 둔다.</td>
          <td>재생성 가능한 임시 공간에는 적합하지만 호스트의 인스턴스 유형·용량·수명 주기를 운영해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-task-storage.html">Fargate 임시 저장 공간</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/using_data_volumes.html">ECS 저장 옵션</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: ECS의 Linux 변환 작업은 20분 동안 실행되고 완료 후 모든 임시 파일을 지워도 된다. 이미지 저장 공간 6GiB와 작업 공간
              40GiB가 필요하며 GPU·호스트 특권 기능·작업 간 파일 공유는 없다. 현재 Fargate Linux 1.4.0의
              기본 저장 공간에서 디스크 부족이 발생한다. 호스트와 별도 파일 시스템의 운영을 최소화하며 기존 파일 경로를 유지할
              방안은 무엇인가?
            answer: Fargate 작업의 ephemeralStorage를 60GiB로 지정한다.
            wrong:
              - Fargate 작업에 EFS 파일 시스템과 마운트 대상을 연결한다.
              - ECS용 EC2 Auto Scaling 그룹에 100GiB EBS 작업 공간을 둔다.
              - 로컬 인스턴스 스토어를 갖춘 ECS용 EC2 Auto Scaling 그룹을 둔다.
      - id: Q22-12
        type: mcq
        title: Q22-12 · 모의고사 A
        explain: |
          <p>웹 계층을 여러 장애 영역에 배치하고 세션 상태를 개별 인스턴스 밖에 두면 서버 장애와 교체에도 요청을 이어갈 수 있다. 외부 저장소 자체의 복원력도 함께 확보해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>세션을 한 AZ의 단일 EC2 파일 서버에 저장하고 모든 웹 서버가 공유한다.</td>
          <td>웹 서버 바깥으로 옮겨도 단일 세션 서버와 AZ 의존성이 남는다.</td>
          </tr>
          <tr>
          <td>ALB 고정 세션만 켜고 세션 데이터는 각 서버 RAM에 둔다.</td>
          <td>고정 세션은 정상 시 라우팅을 고정할 뿐 서버 장애 후 메모리 데이터를 복원하지 못한다.</td>
          </tr>
          <tr>
          <td>한 AZ 안의 두 웹 서버로 Auto Scaling 그룹을 구성한다.</td>
          <td>인스턴스 한 대 장애는 완화할 수 있으나 여러 AZ 장애 영역 분리 요구를 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_mitigate_interaction_failure_stateless.html">Externalize session state</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 오래된 웹 앱은 로그인 세션을 각 EC2 메모리에 보관한다. 여러 AZ로 서버를 늘리고 장애 때 다른 서버가 세션을 이어받도록 하려 한다.
              앱 수정은 허용되지만 특정 서버에 사용자를 계속 고정하는 방식만으로는 충분하지 않다. 어떤 두 조치가 적합한가?
            answer: 세션을 다중 AZ 가용성을 갖춘 외부 세션 저장소로 옮긴다.
            wrong:
              - 세션을 한 AZ의 단일 EC2 파일 서버에 저장하고 모든 웹 서버가 공유한다.
              - ALB 고정 세션만 켜고 세션 데이터는 각 서버 RAM에 둔다.
              - 한 AZ 안의 두 웹 서버로 Auto Scaling 그룹을 구성한다.
            answers:
              - 세션을 다중 AZ 가용성을 갖춘 외부 세션 저장소로 옮긴다.
              - ALB와 여러 AZ의 Auto Scaling 그룹으로 웹 계층을 구성한다.
            options:
              - 세션을 다중 AZ 가용성을 갖춘 외부 세션 저장소로 옮긴다.
              - ALB와 여러 AZ의 Auto Scaling 그룹으로 웹 계층을 구성한다.
              - 세션을 한 AZ의 단일 EC2 파일 서버에 저장하고 모든 웹 서버가 공유한다.
              - ALB 고정 세션만 켜고 세션 데이터는 각 서버 RAM에 둔다.
              - 한 AZ 안의 두 웹 서버로 Auto Scaling 그룹을 구성한다.
      - id: Q22-13
        type: mcq
        title: Q22-13 · 모의고사 A
        explain: |
          <p>Cluster 배치는 같은 AZ 안의 가까운 네트워크 배치로 통신 성능을 높이는 데 사용된다. 실제 성능은 인스턴스 네트워크·드라이버·워크로드에 맞는 지원 기능까지 함께 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>노드 사이를 여러 AZ로 나누는 partition placement group을 우선 사용한다.</td>
          <td>장애 영역 분리에 적합하지만 이 문제는 장애 위험을 수용하고 가장 가까운 통신 배치를 우선한다.</td>
          </tr>
          <tr>
          <td>spread placement group으로 모든 노드를 서로 다른 하드웨어에 배치한다.</td>
          <td>장애 분산 목적이며 통신 집약 작업의 cluster 배치 성능 요구와는 우선순위가 다르다.</td>
          </tr>
          <tr>
          <td>큰 CPU 인스턴스로만 교체하고 네트워크 대역폭·드라이버는 확인하지 않는다.</td>
          <td>네트워크가 병목인 작업에서 CPU 증설만으로 대역폭과 지연 조건을 충족한다고 판단할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-groups.html">Placement groups</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/enhanced-networking.html">Enhanced networking</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 분산 계산 작업의 노드들은 같은 리전 안에서 서로 많은 데이터를 주고받고 지연에 민감하다. 노드 간 통신 성능을 우선하며 같은 AZ에
              모이는 장애 위험은 체크포인트·재실행으로 수용한다. 어떤 두 선택이 적합한가?
            answer: 지원되는 인스턴스를 cluster placement group에 배치한다.
            wrong:
              - 노드 사이를 여러 AZ로 나누는 partition placement group을 우선 사용한다.
              - spread placement group으로 모든 노드를 서로 다른 하드웨어에 배치한다.
              - 큰 CPU 인스턴스로만 교체하고 네트워크 대역폭·드라이버는 확인하지 않는다.
            answers:
              - 지원되는 인스턴스를 cluster placement group에 배치한다.
              - 요구 대역폭을 지원하는 인스턴스와 적절한 ENA·필요 시 EFA 지원을 검토한다.
            options:
              - 지원되는 인스턴스를 cluster placement group에 배치한다.
              - 요구 대역폭을 지원하는 인스턴스와 적절한 ENA·필요 시 EFA 지원을 검토한다.
              - 노드 사이를 여러 AZ로 나누는 partition placement group을 우선 사용한다.
              - spread placement group으로 모든 노드를 서로 다른 하드웨어에 배치한다.
              - 큰 CPU 인스턴스로만 교체하고 네트워크 대역폭·드라이버는 확인하지 않는다.
      - id: Q22-14
        type: mcq
        title: Q22-14 · 모의고사 A
        explain: |
          <p>일반 Multi-AZ DB 인스턴스의 대기는 장애 조치용이며 읽기 서비스용이 아니다. 읽기 복제본은 조회를 분리하지만 비동기 지연을 고려해야 하므로 기존 장애 복구 구성과 함께 사용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>일반 Multi-AZ 대기 인스턴스 주소에 모든 보고서를 직접 보낸다.</td>
          <td>일반 단일 대기 Multi-AZ 배포의 대기 인스턴스는 읽기 쿼리를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>Multi-AZ를 끄고 기존 주 DB 하나만 더 크게 만든다.</td>
          <td>일부 성능은 개선될 수 있지만 AZ 장애의 자동 복구를 유지하는 조건을 잃는다.</td>
          </tr>
          <tr>
          <td>별도 DB를 일일 스냅샷으로 복원해 하루 종일 보고서에 사용한다.</td>
          <td>조회 서버는 생기지만 하루 가까이 오래된 데이터를 보게 될 수 있어 지속 조회 분리 대안보다 부적합하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html">RDS Multi-AZ DB instances</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 주문 DB는 일반 RDS Multi-AZ DB 인스턴스 배포로 운영 중이다. 회사는 AZ 장애 때 자동 복구를 유지하면서 수분 이내의
              데이터 지연을 허용하는 조회 부하도 줄이려 한다. 대기 인스턴스로 보고서 쿼리를 보내려는 제안에 대한 올바른 대안은
              무엇인가?
            answer: Multi-AZ는 유지하고 별도 읽기 복제본으로 허용 가능한 지연의 조회를 분리한다.
            wrong:
              - 일반 Multi-AZ 대기 인스턴스 주소에 모든 보고서를 직접 보낸다.
              - Multi-AZ를 끄고 기존 주 DB 하나만 더 크게 만든다.
              - 별도 DB를 일일 스냅샷으로 복원해 하루 종일 보고서에 사용한다.
      - id: Q22-15
        type: mcq
        title: Q22-15 · 모의고사 A
        explain: |
          <p>사전 서명 URL은 발급 주체 권한 범위에서 지정 객체에 시간 제한 접근을 제공한다. 인증·권한 검사는 앱에서 수행하고 데이터 전송은 S3에서 직접 하므로 서버 중계 부하를 줄인다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>고객별 IAM 액세스 키를 만들어 해당 객체의 읽기 권한과 함께 전달한다.</td>
          <td>장기 자격 증명 배포·회수가 추가되어 짧은 일회성 파일 접근에 과도하다.</td>
          </tr>
          <tr>
          <td>인증이 끝나면 객체 ACL을 public-read로 바꾸고 시간이 지나면 수동으로 되돌린다.</td>
          <td>그 시간 동안 링크를 아는 다른 주체도 읽을 수 있어 비공개 객체와 고객별 허가를 유지하지 못한다.</td>
          </tr>
          <tr>
          <td>앱 서버에 파일을 복사한 뒤 모든 다운로드를 서버가 중계한다.</td>
          <td>서버 중계는 가능하지만 앱의 파일 전송 부하를 피하려는 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html">Presigned URLs</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 외부 고객이 인증된 앱을 통해 특정 S3 파일 하나를 짧은 시간 내려받아야 한다. 파일은 비공개로 유지하고 파일 바이트가 앱 서버를 거쳐
              전송되는 부하도 피하려 한다. 별도 CDN은 사용하지 않는다. 적합한 방법은 무엇인가?
            answer: 앱이 권한 확인 후 해당 객체용 짧은 유효기간의 S3 사전 서명 URL을 발급한다.
            wrong:
              - 고객별 IAM 액세스 키를 만들어 해당 객체의 읽기 권한과 함께 전달한다.
              - 인증이 끝나면 객체 ACL을 public-read로 바꾸고 시간이 지나면 수동으로 되돌린다.
              - 앱 서버에 파일을 복사한 뒤 모든 다운로드를 서버가 중계한다.
      - id: Q22-16
        type: mcq
        title: Q22-16 · 모의고사 A
        explain: |
          <p>온디맨드는 불확실하고 가변적인 요청에 대해 상시 고정 용량 계획을 줄이는 선택지다. 단일 키 집중이나 급격한 변화 등 서비스 특성은 남으므로 측정과 비용 검토를 계속해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>연중 최대 행사 용량을 provisioned로 고정한다.</td>
          <td>불규칙한 짧은 행사 외에도 높은 고정 용량 비용이 남는다.</td>
          </tr>
          <tr>
          <td>낮은 provisioned 용량을 고정하고 제한 오류는 재시도만으로 처리한다.</td>
          <td>비용은 낮을 수 있으나 행사 처리량 요구와 재시도 폭주 위험을 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>최근 최대 피크 기준으로 예약 용량을 장기 구매한다.</td>
          <td>장기간 꾸준히 소비할 기준 부하가 없으므로 미사용 약정 위험이 높다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/capacity-mode.html">DynamoDB capacity modes</a>
          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: DynamoDB 테이블은 월간 행사가 열리는 며칠에만 불규칙하게 요청이 몰린다. 평소 요청은 낮고 예측 가능한 장기 기준 부하도 아직
              없다. 성능 요구를 유지하면서 미사용 프로비저닝 용량과 용량 계획 부담을 줄일 선택은 무엇인가?
            answer: 온디맨드 용량 모드를 검토하고 키 분포·제한·실제 요청 비용을 관찰한다.
            wrong:
              - 연중 최대 행사 용량을 provisioned로 고정한다.
              - 낮은 provisioned 용량을 고정하고 제한 오류는 재시도만으로 처리한다.
              - 최근 최대 피크 기준으로 예약 용량을 장기 구매한다.
      - id: Q22-17
        type: mcq
        title: Q22-17 · 모의고사 A
        explain: |
          <p>Permissions boundary는 역할이 가질 수 있는 최대 권한을 제한한다. 생성 시 지정 경계를 강제하고 개발자의 경계 제거·교체·경계 정책 변조도 막아야 상한을 우회하지 못한다. 실제 업무 권한은 별도 정책으로 부여한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 생성 역할에 관리자 정책을 붙이고 CloudTrail 알림으로 사후 확인한다.</td>
          <td>사후 기록은 업무 범위 밖 역할의 생성 자체를 막는 권한 상한이 아니다.</td>
          </tr>
          <tr>
          <td>역할 생성 권한만 허용하고 생성된 역할의 정책 연결은 개발자가 자유롭게 하게 한다.</td>
          <td>역할 정책을 자유롭게 연결하면 업무 상한보다 넓은 권한을 만드는 경로가 남는다.</td>
          </tr>
          <tr>
          <td>권한 경계에 허용을 넣은 뒤 별도 업무 권한 정책을 생략한다.</td>
          <td>경계는 권한을 부여하지 않으므로 별도 허용 정책 없이 필요한 작업 권한이 생기지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html">Permissions boundaries</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 개발자가 새 IAM 역할을 생성할 수 있어야 하지만 자신의 업무 범위를 넘는 관리자 역할을 만들어서는 안 된다. 보안팀은 생성되는 역할의
              권한 상한을 강제하고 실제 업무 권한은 팀별로 달리 부여하려 한다. 어떤 조합을 사용해야 하는가?
            answer: 지정 권한 경계 사용을 강제하고 경계 제거·교체와 경계 정책 변조 권한을 제한한다.
            wrong:
              - 모든 생성 역할에 관리자 정책을 붙이고 CloudTrail 알림으로 사후 확인한다.
              - 역할 생성 권한만 허용하고 생성된 역할의 정책 연결은 개발자가 자유롭게 하게 한다.
              - 권한 경계에 허용을 넣은 뒤 별도 업무 권한 정책을 생략한다.
      - id: Q22-18
        type: mcq
        title: Q22-18 · 모의고사 A
        explain: |
          <p>전체 용량과 특정 키의 집중은 다른 문제다. 쓰기를 여러 키로 분산하되 조회가 필요한 샤드를 읽고 합치도록 모델을 바꾸면 쓰기 분산과 업무 조회 요구를 함께 검토할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DAX를 붙이고 쓰기 키 구조는 바꾸지 않는다.</td>
          <td>읽기 캐시는 원본의 쓰기 키 집중을 분산하지 않는다.</td>
          </tr>
          <tr>
          <td>테이블 전체 provisioned 쓰기 용량만 늘리고 파티션 키는 그대로 유지한다.</td>
          <td>특정 키의 집중이 원인이라면 전체 용량 증가만으로 병목을 충분히 해결하지 못할 수 있다.</td>
          </tr>
          <tr>
          <td>이벤트 시간만 sort key로 추가하고 모든 쓰기는 같은 고객 ID에 유지한다.</td>
          <td>sort key 변경만으로 단일 파티션 키에 집중한 트래픽이 분산되는 것은 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html">DynamoDB partition key design</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: DynamoDB 이벤트 테이블은 고객 ID를 파티션 키로 쓴다. 한 대형 고객의 쓰기만 급증해 제한 오류가 나지만 다른 고객 트래픽은
              낮다. 고객별 최신 이벤트 조회를 유지하면서 특정 키 집중을 완화하려면 무엇을 검토해야 하는가?
            answer: 쓰기 샤딩 등 키 분산을 적용하고 분산된 결과를 조회·병합하는 접근 패턴을 설계한다.
            wrong:
              - DAX를 붙이고 쓰기 키 구조는 바꾸지 않는다.
              - 테이블 전체 provisioned 쓰기 용량만 늘리고 파티션 키는 그대로 유지한다.
              - 이벤트 시간만 sort key로 추가하고 모든 쓰기는 같은 고객 ID에 유지한다.
      - id: Q22-19
        type: mcq
        title: Q22-19 · 모의고사 A
        explain: |
          <p>DAX는 DynamoDB 읽기 캐시로 반복 읽기와 허용 가능한 최종 일관성 요구에 적합하다. 캐시 지원·일관성 특성을 확인하고 원본 DB를 대체하는 영구 저장소로 보지 않아야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>테이블의 provisioned 읽기 용량만 높이고 모든 반복 요청을 원본에서 처리한다.</td>
          <td>제한 오류 완화에는 도움 될 수 있지만 캐시를 통한 지연·원본 반복 읽기 감소를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>모든 읽기를 강한 일관성으로 바꾸고 원본만 조회한다.</td>
          <td>허용된 오래된 읽기를 활용하지 않고 원본 반복 조회가 남아 지연·부하 절감 목적에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>ElastiCache를 별도로 만들고 앱에 cache-aside 조회·갱신·무효화를 구현한다.</td>
          <td>유효한 캐시 설계이지만 별도 캐시 관리 로직을 개발해야 하므로 이번 변경 범위에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html">DAX</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: 상품 카탈로그 API가 DynamoDB의 같은 상품 항목을 반복 조회한다. 읽기는 매우 많고 약간 오래된 값은 허용되며 기존
              DynamoDB 호출 구조를 크게 바꾸고 싶지 않으며 별도 캐시 채우기·무효화 로직을 새로 개발할 여력이 없다. 읽기
              지연과 원본 부하를 줄일 방법은 무엇인가?
            answer: 호환되는 조회 경로에 DAX 캐시를 사용한다.
            wrong:
              - 테이블의 provisioned 읽기 용량만 높이고 모든 반복 요청을 원본에서 처리한다.
              - 모든 읽기를 강한 일관성으로 바꾸고 원본만 조회한다.
              - ElastiCache를 별도로 만들고 앱에 cache-aside 조회·갱신·무효화를 구현한다.
      - id: Q22-20
        type: mcq
        title: Q22-20 · 모의고사 A
        explain: |
          <p>NACL은 상태 비저장이라 외부로 시작한 연결의 응답도 별도 인바운드 규칙이 필요하다. 반환 패킷은 앱이 사용한 임시 소스 포트를 목적지로 하므로 해당 범위를 허용해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>앱 서브넷 NACL의 아웃바운드 443만 다시 허용하고 인바운드는 유지한다.</td>
          <td>외부로 보내는 규칙만 바꿔도 상태 비저장 NACL의 반환 인바운드 누락은 남는다.</td>
          </tr>
          <tr>
          <td>앱 보안 그룹에만 인바운드 443을 추가한다.</td>
          <td>보안 그룹은 정상이고 상태 저장형이므로 NACL 반환 규칙 누락을 수정하지 못한다.</td>
          </tr>
          <tr>
          <td>앱 서브넷 NACL의 인바운드에 외부 API 서버의 소스 포트 443을 목적지 포트로 등록한다.</td>
          <td>반환 패킷의 목적지는 앱의 임시 소스 포트이므로 API의 수신 포트와 구별해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html">Network ACL rules</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 웹 서비스의 ALB는 요청을 받지만 사설 서브넷의 앱 서버가 보낸 외부 API 요청은 응답을 받지 못한다. 보안 그룹과 라우트는 정상이며
              새 NACL은 인바운드 443만 허용하고 아웃바운드는 외부 API의 443을 허용한다. 이외에 영향을 주는 차단 규칙은
              없다. 앱은 외부 서버의 443 포트로 연결하고 임시 소스 포트를 사용한다. 무엇을 수정해야 하는가?
            answer: 앱 서브넷 NACL에서 반환 트래픽의 임시 목적지 포트를 허용한다.
            wrong:
              - 앱 서브넷 NACL의 아웃바운드 443만 다시 허용하고 인바운드는 유지한다.
              - 앱 보안 그룹에만 인바운드 443을 추가한다.
              - 앱 서브넷 NACL의 인바운드에 외부 API 서버의 소스 포트 443을 목적지 포트로 등록한다.
      - id: Q22-21
        type: mcq
        title: Q22-21 · 모의고사 A
        explain: |
          <p>파일은 내구성 있는 저장소에 보관하고 작업은 큐로 분리하면 접수 응답과 긴 처리를 독립적으로 확장할 수 있다. 서버 교체에도 원본과 대기 작업이 남아 재시도할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ALB의 유휴 타임아웃만 늘리고 모든 변환을 API 서버 RAM에 둔다.</td>
          <td>타임아웃만 늘리면 동기 결합과 RAM 작업 유실 문제가 남는다.</td>
          </tr>
          <tr>
          <td>원본을 EC2 인스턴스 스토어에 두고 해당 서버 주소를 사용자에게 준다.</td>
          <td>인스턴스 종료 시 원본이 사라질 수 있고 특정 서버에 처리가 묶인다.</td>
          </tr>
          <tr>
          <td>원본은 S3에 두되 모든 변환을 API 요청 안에서 동기 실행하고 ALB 대기만 늘린다.</td>
          <td>파일 유실은 줄일 수 있지만 빠른 접수와 긴 처리 분리 요구는 만족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html">SQS distributed architecture</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 영상 처리 웹앱은 업로드가 몰리면 HTTP 요청 안에서 변환을 마칠 때까지 대기해 타임아웃이 난다. 사용자는 접수 확인을 빨리 받고 결과는
              나중에 받아도 되며, 서버 수를 늘려도 처리할 작업이 사라지면 안 된다. 어떤 구조가 적합한가?
            answer: 원본을 S3에 저장하고 SQS에 작업 참조를 넣어 별도 작업자가 처리한다.
            wrong:
              - ALB의 유휴 타임아웃만 늘리고 모든 변환을 API 서버 RAM에 둔다.
              - 원본을 EC2 인스턴스 스토어에 두고 해당 서버 주소를 사용자에게 준다.
              - 원본은 S3에 두되 모든 변환을 API 요청 안에서 동기 실행하고 ALB 대기만 늘린다.
      - id: Q22-22
        type: mcq
        title: Q22-22 · 모의고사 A
        explain: |
          <p>비현재 버전과 미완료 멀티파트는 별도로 비용을 만들 수 있다. 복구 정책에 맞는 버전 보존·만료와 미완료 업로드 중단을 각각 설정하면 필요한 최신 데이터는 유지하며 낭비를 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버전 관리를 중지하고 기존 비현재 버전 정리 규칙은 두지 않는다.</td>
          <td>기존 버전은 남을 수 있어 이미 누적된 비용 원인을 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>저장 중인 버전은 그대로 두고 신규 객체만 Intelligent-Tiering으로 전환한다.</td>
          <td>신규 객체 접근 비용 최적화는 가능하지만 이미 누적된 비현재 버전과 미완료 업로드의 보관 원인을 정리하지 않는다.</td>
          </tr>
          <tr>
          <td>현재 버전 만료 규칙만 추가하고 비현재 버전·미완료 업로드는 그대로 둔다.</td>
          <td>현재 객체 만료는 비현재 버전과 미완료 업로드를 모두 정리하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html">S3 lifecycle actions</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: S3 비용을 조사하니 버전 관리가 켜진 버킷의 오래된 비현재 버전과 완료되지 않은 멀티파트 조각이 계속 쌓인다. 최신 파일과 최근 복구
              버전은 유지해야 한다. 필요한 두 개선은 무엇인가?
            answer: 복구 보존 요구에 맞는 비현재 버전 만료 수명 주기를 구성한다.
            wrong:
              - 버전 관리를 중지하고 기존 비현재 버전 정리 규칙은 두지 않는다.
              - 저장 중인 버전은 그대로 두고 신규 객체만 Intelligent-Tiering으로 전환한다.
              - 현재 버전 만료 규칙만 추가하고 비현재 버전·미완료 업로드는 그대로 둔다.
            answers:
              - 복구 보존 요구에 맞는 비현재 버전 만료 수명 주기를 구성한다.
              - 오래된 미완료 멀티파트 업로드를 중단하는 수명 주기 규칙을 구성한다.
            options:
              - 버전 관리를 중지하고 기존 비현재 버전 정리 규칙은 두지 않는다.
              - 저장 중인 버전은 그대로 두고 신규 객체만 Intelligent-Tiering으로 전환한다.
              - 복구 보존 요구에 맞는 비현재 버전 만료 수명 주기를 구성한다.
              - 오래된 미완료 멀티파트 업로드를 중단하는 수명 주기 규칙을 구성한다.
              - 현재 버전 만료 규칙만 추가하고 비현재 버전·미완료 업로드는 그대로 둔다.
      - id: Q22-23
        type: mcq
        title: Q22-23 · 모의고사 A
        explain: >
          <p>Regional EFS는 여러 AZ의 Linux 워크로드가 네트워크 파일 시스템을 공유하도록 하는 관리형 선택지다.
          마운트 대상과 네트워크 접근을 구성하면 앱의 파일 인터페이스를 유지할 수 있다.</p>

          <table>

          <thead>

          <tr>

          <th>오답</th>

          <th>틀린 이유</th>

          </tr>

          </thead>

          <tbody><tr>

          <td>S3 객체 API로 저장하도록 모든 파일 I/O 코드를 변경한다.</td>

          <td>유효한 재설계일 수 있으나 이번에는 객체 API로 앱을 수정하지 않는다는 범위와 다르다.</td>

          </tr>

          <tr>

          <td>각 컨테이너에 EBS 볼륨을 하나씩 연결하고 서로 다른 파일 사본을 유지한다.</td>

          <td>작업별 저장소는 같은 파일을 동시에 공유하는 의미를 제공하지 않는다.</td>

          </tr>

          <tr>

          <td>같은 AZ의 EBS Multi-Attach로 모든 AZ의 컨테이너를 연결한다.</td>

          <td>Multi-Attach도 다른 AZ까지 하나의 볼륨을 연결하는 기능이 아니다.</td>

          </tr>

          </tbody></table>

          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a
          href="/study/lessons/day-14.html">14일 차 개념</a>

          공식 근거: <a
          href="https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html">Amazon
          EFS</a>

          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: 여러 AZ의 Linux 컨테이너가 같은 업로드 디렉터리의 파일을 동시에 읽고 써야 한다. 애플리케이션은 POSIX 파일 경로를 사용하며
              객체 API로의 수정은 이번 이전 범위에 없다. 파일 서버 OS를 관리하지 않으려면 무엇을 선택하는가?
            answer: Regional EFS와 필요한 AZ별 마운트 대상·접근 규칙을 구성한다.
            wrong:
              - S3 객체 API로 저장하도록 모든 파일 I/O 코드를 변경한다.
              - 각 컨테이너에 EBS 볼륨을 하나씩 연결하고 서로 다른 파일 사본을 유지한다.
              - 같은 AZ의 EBS Multi-Attach로 모든 AZ의 컨테이너를 연결한다.
      - id: Q22-24
        type: mcq
        title: Q22-24 · 모의고사 A
        explain: |
          <p>PrivateLink 엔드포인트 서비스는 고객이 사설 엔드포인트로 지정 서비스에 접근하는 모델이다. 전체 VPC 간 라우팅 관계를 만들지 않고 서비스 단위 연결을 제공해 중복 CIDR 고객을 수용하는 데 적합하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>고객 VPC 전체를 모두 VPC Peering으로 직접 연결한다.</td>
          <td>VPC Peering은 겹치는 CIDR을 지원하지 않으며 요구보다 넓은 네트워크 연결을 만든다.</td>
          </tr>
          <tr>
          <td>Transit Gateway에서 고객 attachment의 중복 CIDR을 전부 같은 라우트 테이블로 전파한다.</td>
          <td>중복 CIDR 고객을 그 방식으로 자동 변환·식별할 수 없다.</td>
          </tr>
          <tr>
          <td>각 고객과 일반 Site-to-Site VPN을 만들고 중복 CIDR을 같은 대상 경로로 광고한다.</td>
          <td>VPN 생성 자체는 중복 주소 문제를 해결하지 않으며 서비스 단위 접근보다 넓은 라우팅 관리가 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-share-your-services.html">PrivateLink endpoint services</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 파트너가 운영하는 VPC의 특정 TCP 서비스를 여러 고객 VPC에 제공하려 한다. 고객들의 IP 대역은 서로 겹칠 수 있고 고객 VPC
              전체와 양방향 네트워크를 연결할 필요는 없다. 서비스 제공자는 운영 책임을 유지해야 한다. 적합한 선택은 무엇인가?
            answer: NLB 기반 엔드포인트 서비스를 AWS PrivateLink로 제공한다.
            wrong:
              - 고객 VPC 전체를 모두 VPC Peering으로 직접 연결한다.
              - Transit Gateway에서 고객 attachment의 중복 CIDR을 전부 같은 라우트 테이블로 전파한다.
              - 각 고객과 일반 Site-to-Site VPN을 만들고 중복 CIDR을 같은 대상 경로로 광고한다.
      - id: Q22-25
        type: mcq
        title: Q22-25 · 모의고사 A
        explain: |
          <p>물리 장애 대응은 실제 연결·장비·경로를 분리해야 하며 논리 인터페이스 추가만으로 해결되지 않는다. DX는 기본 암호화가 아니므로 필요한 보호 구간에 맞는 전송 암호화를 별도 구성한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>전용 DX 경로만 사용하고 별도 전송 암호화는 두지 않는다.</td>
          <td>DX 전용 연결만으로는 전송 중 암호화 요구를 만족하지 않는다.</td>
          </tr>
          <tr>
          <td>같은 장비·회선에 두 BGP 세션을 만들고 나머지 구성은 유지한다.</td>
          <td>논리 세션 수만 늘리면 물리 장비·회선 장애의 단일 지점은 남는다.</td>
          </tr>
          <tr>
          <td>같은 DX 물리 연결에 가상 인터페이스 두 개만 추가한다.</td>
          <td>인터페이스들은 같은 물리 연결 장애를 공유한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/directconnect/latest/UserGuide/encryption-in-transit.html">Direct Connect encryption</a> · <a href="https://docs.aws.amazon.com/directconnect/latest/UserGuide/resiliency_toolkit.html">DX resiliency</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 공장과 AWS 사이의 DX 단일 연결 장애가 생산 현황 조회를 중단시켰다. 공장은 경로가 하나 끊어져도 조회를 유지해야 하고 모든 회사에서
              AWS로 가는 데이터는 전송 중 암호화돼야 한다. 필요한 두 설계는 무엇인가?
            answer: 서로 다른 장애 영역의 물리 연결·장비·위치 또는 검증된 보조 VPN 경로를 마련한다.
            wrong:
              - 전용 DX 경로만 사용하고 별도 전송 암호화는 두지 않는다.
              - 같은 장비·회선에 두 BGP 세션을 만들고 나머지 구성은 유지한다.
              - 같은 DX 물리 연결에 가상 인터페이스 두 개만 추가한다.
            answers:
              - 서로 다른 장애 영역의 물리 연결·장비·위치 또는 검증된 보조 VPN 경로를 마련한다.
              - 요구 구간에 맞게 지원 MACsec 또는 DX 위의 IPsec VPN 등 암호화 방식을 구성한다.
            options:
              - 전용 DX 경로만 사용하고 별도 전송 암호화는 두지 않는다.
              - 같은 장비·회선에 두 BGP 세션을 만들고 나머지 구성은 유지한다.
              - 서로 다른 장애 영역의 물리 연결·장비·위치 또는 검증된 보조 VPN 경로를 마련한다.
              - 요구 구간에 맞게 지원 MACsec 또는 DX 위의 IPsec VPN 등 암호화 방식을 구성한다.
              - 같은 DX 물리 연결에 가상 인터페이스 두 개만 추가한다.
      - id: Q22-26
        type: mcq
        title: Q22-26 · 모의고사 A
        explain: |
          <p>Session Manager는 관리형 인스턴스의 에이전트와 IAM 권한, 서비스 연결을 이용해 인바운드 SSH 없이 접속할 수 있다. 지원 세션 유형의 중앙 로깅을 구성해 작업 추적 요구를 만족시킨다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>회사 IP만 허용한 SSH Bastion과 서버별 SSH 키를 배포한다.</td>
          <td>일반적인 접근 방식이지만 SSH 키와 인바운드 접속이 필요해 주어진 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>EC2 Instance Connect로 임시 SSH 키를 주입하고 SSH 포트를 사용한다.</td>
          <td>장기 키 관리는 줄여도 SSH 인바운드 경로에 의존하므로 모든 인바운드 포트 금지 조건과 다르다.</td>
          </tr>
          <tr>
          <td>Client VPN으로 접속한 뒤 사설 EC2의 SSH 포트에 연결한다.</td>
          <td>사설 경로라도 인스턴스 인바운드 SSH 허용과 SSH 방식의 접속 구성이 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html">Session Manager</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 보안팀은 운영 EC2에 SSH 키를 배포하지 않고 승인된 작업자의 유지보수 접속을 허용하려 한다. 인스턴스에는 인터넷 인바운드 포트를 열
              수 없으며 작업 내역을 중앙에 남겨야 한다. 적합한 방식은 무엇인가?
            answer: Systems Manager Session Manager와 필요한 역할·에이전트·연결 및 로깅을 구성한다.
            wrong:
              - 회사 IP만 허용한 SSH Bastion과 서버별 SSH 키를 배포한다.
              - EC2 Instance Connect로 임시 SSH 키를 주입하고 SSH 포트를 사용한다.
              - Client VPN으로 접속한 뒤 사설 EC2의 SSH 포트에 연결한다.
      - id: Q22-27
        type: mcq
        title: Q22-27 · 모의고사 A
        explain: |
          <p>WAF는 ALB 같은 지원 자원에 연결해 HTTP 요청을 규칙으로 검사한다. 관리형 규칙을 검토·적용하면 SQL 삽입 같은 애플리케이션 계층 패턴을 제어하면서 정상 트래픽을 유지할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Shield Standard 보호만 사용하고 별도 웹 요청 검사 규칙은 두지 않는다.</td>
          <td>네트워크 DDoS 보호만으로 SQL 삽입 요청 내용 검사 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>ALB 리스너가 URL 경로만 검사하게 하고 HTTP 본문 검사는 두지 않는다.</td>
          <td>경로 기반 전달은 본문의 SQL 삽입 등 요청 패턴 검사를 충분히 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>보안 그룹에서 관측된 공격 IP만 반복 차단한다.</td>
          <td>일부 주체를 막을 수 있으나 HTTP 요청 내용을 검사하지 않아 요구된 패턴 차단과 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">AWS WAF</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 공개 웹 API에 정상 사용자와 함께 SQL 삽입 시도가 반복된다. 서비스는 ALB 뒤에서 동작하며 전체 국가를 차단하지 않고 HTTP
              요청 내용을 기준으로 악성 패턴을 걸러야 한다. 운영 부담을 줄이는 방안은 무엇인가?
            answer: ALB에 연결한 AWS WAF 웹 ACL에 적합한 관리형 규칙을 적용한다.
            wrong:
              - Shield Standard 보호만 사용하고 별도 웹 요청 검사 규칙은 두지 않는다.
              - ALB 리스너가 URL 경로만 검사하게 하고 HTTP 본문 검사는 두지 않는다.
              - 보안 그룹에서 관측된 공격 IP만 반복 차단한다.
      - id: Q22-28
        type: mcq
        title: Q22-28 · 모의고사 A
        explain: |
          <p>인스턴스 프로파일로 연결한 IAM 역할은 EC2 워크로드에 임시 자격 증명을 제공한다. 필요한 S3 리소스만 허용하면 이미지나 설정에 장기 키를 배포하지 않아도 된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버킷 정책에서 EC2 서브넷의 모든 주체를 허용하고 인스턴스 역할은 만들지 않는다.</td>
          <td>네트워크 위치만으로 필요한 배치 신원을 식별하거나 SDK용 자격 증명을 제공하지 못한다.</td>
          </tr>
          <tr>
          <td>동일한 IAM 사용자 키를 AMI의 환경 변수에 넣고 주기적으로 교체한다.</td>
          <td>AMI에 포함된 키는 교체 인스턴스 전체에 복제되고 수동 비밀값 관리가 남는다.</td>
          </tr>
          <tr>
          <td>각 인스턴스를 시작할 때 운영자가 단기 키를 파일로 전달한다.</td>
          <td>단기 키라도 교체마다 수동 배포하는 부담이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html">IAM roles for EC2</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 배치 프로그램이 매번 새 EC2 인스턴스에서 실행되며 특정 S3 경로만 읽어야 한다. 운영팀은 AMI에 키를 저장하지 않고 인스턴스 교체
              때 자격 증명을 수동 배포하지 않으려 한다. 가장 적절한 구성은 무엇인가?
            answer: 필요 경로 읽기 권한의 IAM 역할을 인스턴스 프로파일로 연결한다.
            wrong:
              - 버킷 정책에서 EC2 서브넷의 모든 주체를 허용하고 인스턴스 역할은 만들지 않는다.
              - 동일한 IAM 사용자 키를 AMI의 환경 변수에 넣고 주기적으로 교체한다.
              - 각 인스턴스를 시작할 때 운영자가 단기 키를 파일로 전달한다.
      - id: Q22-29
        type: mcq
        title: Q22-29 · 모의고사 A
        explain: |
          <p>CloudTrail 활동을 이용한 정책 생성은 실제 API 사용을 바탕으로 최소 권한 초안을 만드는 데 도움이 된다. 관측되지 않은 복구·정기 업무까지 불필요하다고 단정하지 않고 검토해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>IAM credential report만으로 역할이 호출한 리소스별 API 정책을 자동 확정한다.</td>
          <td>자격 증명 보고서는 API 활동 기반 역할 정책 생성 근거와 다르다.</td>
          </tr>
          <tr>
          <td>IAM Access Analyzer의 외부 접근 결과만으로 내부 역할의 모든 미사용 작업을 제거한다.</td>
          <td>외부 공유 탐지와 실제 내부 API 사용에서 정책을 생성하는 기능은 다른 목적이다.</td>
          </tr>
          <tr>
          <td>서비스별 관리형 전체 접근 정책을 붙이고 드문 작업은 사용되지 않아도 계속 모두 허용한다.</td>
          <td>사용 근거로 불필요 권한을 줄이려는 목표를 달성하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-policy-generation.html">Generate policies based on activity</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 운영팀은 여러 애플리케이션 역할이 실제로 사용하지 않는 권한을 줄이려 한다. 팀은 지난 운영 기간의 API 사용을 근거로 정책 초안을
              만들고, 향후 드물게 수행할 복구 작업은 별도로 검토하려 한다. 적합한 방법은 무엇인가?
            answer: IAM Access Analyzer의 CloudTrail 기반 정책 생성 결과를 검토해 적용한다.
            wrong:
              - IAM credential report만으로 역할이 호출한 리소스별 API 정책을 자동 확정한다.
              - IAM Access Analyzer의 외부 접근 결과만으로 내부 역할의 모든 미사용 작업을 제거한다.
              - 서비스별 관리형 전체 접근 정책을 붙이고 드문 작업은 사용되지 않아도 계속 모두 허용한다.
      - id: Q22-30
        type: mcq
        title: Q22-30 · 모의고사 A
        explain: |
          <p>자동 교체는 비밀 저장소와 DB 값을 일관되게 바꾸는 과정이며 교체 함수의 양쪽 접근이 필요하다. 앱도 새 비밀값을 사용하도록 해야 교체 유지와 지속 접속 요구를 함께 만족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>비밀번호를 이미지에 다시 넣고 신규 서버 배포 때만 교체한다.</td>
          <td>이미지에 고정한 비밀번호는 자동 교체 뒤 오래된 값이 되며 비밀 분리 요구를 위반한다.</td>
          </tr>
          <tr>
          <td>교체 함수가 Secrets Manager에만 접근하게 하고 DB 자격 증명 변경 경로는 두지 않는다.</td>
          <td>DB와 비밀 저장소 양쪽에 일관된 변경을 해야 하므로 저장소 접근만으로 부족하다.</td>
          </tr>
          <tr>
          <td>Secrets Manager에 새 값만 쓰고 DB 사용자 비밀번호는 그대로 둔다.</td>
          <td>저장값과 DB 실제 자격 증명이 다르면 새 값을 조회해도 인증에 실패한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_turn-on-for-db.html">Database secret rotation</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 앱의 DB 비밀번호가 Secrets Manager에 있지만 정기 교체 후 접속이 끊어진다. 팀은 자동 교체를 유지하고 코드에 비밀번호를
              고정하지 않으려 한다. 교체 경로를 점검할 때 필요한 두 사항은 무엇인가?
            answer: 앱이 오래된 비밀값만 계속 쓰지 않도록 조회·캐시 갱신 전략을 점검한다.
            wrong:
              - 비밀번호를 이미지에 다시 넣고 신규 서버 배포 때만 교체한다.
              - 교체 함수가 Secrets Manager에만 접근하게 하고 DB 자격 증명 변경 경로는 두지 않는다.
              - Secrets Manager에 새 값만 쓰고 DB 사용자 비밀번호는 그대로 둔다.
