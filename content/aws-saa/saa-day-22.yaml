      - id: Q22-31
        type: mcq
        title: Q22-31 · 모의고사 A
        explain: |
          <p>복제는 잘못된 변경도 전달하므로 과거 시점 복원 수단이 필요하다. 정상 복구 지점 보존과 독립된 삭제 통제를 갖추고 실제 복원까지 확인해야 운영 실수에 대응할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>리전 간 현재 변경 복제의 빈도만 높이고 과거 복구 지점은 두지 않는다.</td>
          <td>잘못된 변경도 더 빨리 전파되므로 과거 시점으로 되돌리는 요구를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>잘못된 변경 이후에만 새 스냅샷을 만들고 그 스냅샷만 보관한다.</td>
          <td>오류 반영 이후 시점만 보관하면 수정 전 정상 데이터를 복원할 수 없다.</td>
          </tr>
          <tr>
          <td>복제본을 승격한 뒤 DB 엔드포인트만 그쪽으로 전환한다.</td>
          <td>이미 오류가 전파된 데이터를 승격해도 정상 과거 값으로 돌아가지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_CommonTasks.BackupRestore.html">RDS backup and restore</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 운영 DB의 잘못된 대량 수정이 복제본에도 반영됐다. 회사는 리전 장애 대비용 복제는 계속 유지하되 같은 운영 실수에서 정상 데이터로
              되돌릴 수 있어야 한다. 어떤 두 조치가 적합한가?
            answer: 백업 보존과 삭제 권한을 운영 변경 경로와 분리해 복구 지점을 보호한다.
            wrong:
              - 리전 간 현재 변경 복제의 빈도만 높이고 과거 복구 지점은 두지 않는다.
              - 잘못된 변경 이후에만 새 스냅샷을 만들고 그 스냅샷만 보관한다.
              - 복제본을 승격한 뒤 DB 엔드포인트만 그쪽으로 전환한다.
            answers:
              - 백업 보존과 삭제 권한을 운영 변경 경로와 분리해 복구 지점을 보호한다.
              - 수정 전 정상 시점으로 복원 가능한 백업·PITR을 구성하고 복원 절차를 시험한다.
            options:
              - 백업 보존과 삭제 권한을 운영 변경 경로와 분리해 복구 지점을 보호한다.
              - 리전 간 현재 변경 복제의 빈도만 높이고 과거 복구 지점은 두지 않는다.
              - 잘못된 변경 이후에만 새 스냅샷을 만들고 그 스냅샷만 보관한다.
              - 복제본을 승격한 뒤 DB 엔드포인트만 그쪽으로 전환한다.
              - 수정 전 정상 시점으로 복원 가능한 백업·PITR을 구성하고 복원 절차를 시험한다.
      - id: Q22-32
        type: mcq
        title: Q22-32 · 모의고사 A
        explain: |
          <p>공통 JOIN과 집계를 물리화한 결과를 적재 주기에 맞춰 갱신하면 사용자별 필터가 달라도 같은 원본 집계를 다시 계산하지 않는다. 적재 직후 갱신이 허용되는 신선도 경계가 명시되어 있어 갱신된 materialized view를 사용할 수 있다. 일반 view·결과 캐시·WLM도 유효한 기능이지만 서로 다른 필터 쿼리의 공통 계산을 저장하는 역할과는 다르다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>상품·일자별 집계의 일반 SQL view를 만들고 대시보드가 조회하게 한다.</td>
          <td>일반 view는 SQL을 재사용하지만 조회할 때 underlying 집계를 실행하므로 공통 계산 결과를 물리적으로 재사용하지 않는다.</td>
          </tr>
          <tr>
          <td>Redshift 결과 캐시를 활성화하고 사용자별 필터가 있는 쿼리를 실행한다.</td>
          <td>결과 캐시는 유효한 동일 쿼리의 결과를 재사용한다. 필터 조합이 계속 달라지는 쿼리 전체에 공통 집계 결과를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>대시보드용 WLM 큐를 분리하고 해당 쿼리의 우선순위를 높인다.</td>
          <td>WLM 분리는 대기·우선순위를 제어하지만 같은 집계를 수행하는 데 필요한 계산 자체를 줄이지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-overview.html">Redshift materialized view</a> · <a href="https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-refresh.html">Materialized view 갱신</a> · <a href="https://docs.aws.amazon.com/redshift/latest/dg/c_challenges_achieving_high_performance_queries.html">Redshift 결과 캐시</a> · <a href="https://docs.aws.amazon.com/redshift/latest/dg/query-priority.html">Redshift WLM 우선순위</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: RDS에서 분리한 Redshift 분석 DB에 매시간 주문 데이터를 적재한다. 대시보드는 동일한 상품·일자별 SUM과 JOIN을 사용하지만
              사용자마다 상품·날짜 필터 조합이 달라 원본 집계를 반복 계산한다. 적재 완료 후 새 데이터가 반영되면 되고 다음
              적재까지 값이 같아도 된다. 노드 증설 없이 반복 집계의 계산량을 줄일 방법은 무엇인가?
            answer: 상품·일자별 집계 materialized view를 만들고 매 적재 완료 후 갱신한다.
            wrong:
              - 상품·일자별 집계의 일반 SQL view를 만들고 대시보드가 조회하게 한다.
              - Redshift 결과 캐시를 활성화하고 사용자별 필터가 있는 쿼리를 실행한다.
              - 대시보드용 WLM 큐를 분리하고 해당 쿼리의 우선순위를 높인다.
      - id: Q22-33
        type: mcq
        title: Q22-33 · 모의고사 A
        explain: |
          <p>인터페이스 VPC 엔드포인트는 지원 서비스 API의 사설 IP 접점을 제공한다. 회사에서 그 IP로 갈 라우팅과 DNS 해석을 구성하면 EC2에 로그인하지 않고 사설 경로로 API를 호출할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>VPC의 EC2 점프 서버에 로그인한 뒤 그 서버에서 API를 대신 호출한다.</td>
          <td>네트워크 경로는 만들 수 있으나 직원에게 가상 머신 접속을 강제하지 않는 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>회사에서 DX로 연결한 VPC의 S3 게이트웨이 엔드포인트를 Secrets Manager에 사용한다.</td>
          <td>게이트웨이 유형은 Secrets Manager API 접점을 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>Secrets Manager 퍼블릭 API를 인터넷 NAT 경유로 호출한다.</td>
          <td>작동할 수 있어도 퍼블릭 인터넷 금지 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/secretsmanager/latest/userguide/vpc-endpoint-overview.html">Secrets Manager VPC endpoint</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 회사 직원이 온프레미스에서 Direct Connect를 통해 Secrets Manager API를 호출해야 한다. 회사 정책상 API
              호출은 퍼블릭 인터넷을 통과하면 안 되고, 직원에게 AWS VPC의 가상 머신 접속을 강제하고 싶지 않다. 적합한
              구성은 무엇인가?
            answer: Secrets Manager 인터페이스 엔드포인트와 온프레미스 DNS·사설 라우팅을 구성한다.
            wrong:
              - VPC의 EC2 점프 서버에 로그인한 뒤 그 서버에서 API를 대신 호출한다.
              - 회사에서 DX로 연결한 VPC의 S3 게이트웨이 엔드포인트를 Secrets Manager에 사용한다.
              - Secrets Manager 퍼블릭 API를 인터넷 NAT 경유로 호출한다.
      - id: Q22-34
        type: mcq
        title: Q22-34 · 모의고사 A
        explain: |
          <p>DLQ는 반복 실패 메시지를 주 큐와 분리해 정상 처리 흐름을 보호한다. 실패 데이터를 보존하고 경보·분석·재처리 절차를 준비하면 원인 해결과 복구를 이어갈 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>주 큐의 수신 횟수 제한 없이 가시성 시간만 계속 늘린다.</td>
          <td>반복 실패 메시지를 격리하지 못하고 정상 자원을 계속 점유할 수 있다.</td>
          </tr>
          <tr>
          <td>실패 메시지와 정상 메시지를 같은 큐에 두고 모든 작업자의 수를 계속 늘린다.</td>
          <td>추가 자원은 잘못된 입력 자체를 고치거나 실패 메시지를 분리하지 못한다.</td>
          </tr>
          <tr>
          <td>메시지 수신 직후 삭제하고 오류가 나면 로그만 남긴다.</td>
          <td>메시지 데이터와 재처리 경로를 보존하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html">SQS dead-letter queues</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 작업 큐의 일부 잘못된 메시지가 매번 실패해 처리 자원을 반복 소비한다. 정상 작업은 계속 처리하면서 실패 원인을 나중에 분석하고 수정 후
              재처리해야 한다. 운영 부담을 줄이는 방법은 무엇인가?
            answer: 적절한 수신 횟수의 redrive 정책과 DLQ를 구성하고 DLQ 적재를 경보한다.
            wrong:
              - 주 큐의 수신 횟수 제한 없이 가시성 시간만 계속 늘린다.
              - 실패 메시지와 정상 메시지를 같은 큐에 두고 모든 작업자의 수를 계속 늘린다.
              - 메시지 수신 직후 삭제하고 오류가 나면 로그만 남긴다.
      - id: Q22-35
        type: mcq
        title: Q22-35 · 모의고사 A
        explain: |
          <p>Parquet는 필요한 열과 데이터 블록만 읽도록 해 150개 열 중 4개를 조회하는 비용을 줄인다. 규칙적이고 거의 비어 있지 않은 날짜·시간 경로에는 partition projection으로 위치를 계산하면 새 파티션의 카탈로그 등록을 기다리지 않는다. 두 변경은 열 접근과 파티션 발견이라는 서로 다른 요구를 각각 충족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Glue Data Catalog 테이블에 날짜·시간 파티션 인덱스를 구성한다.</td>
          <td>파티션 인덱스는 등록된 파티션의 메타데이터 탐색을 개선한다. 새 시간 경로를 자동으로 계산하거나 등록을 대체하지 않는다.</td>
          </tr>
          <tr>
          <td>각 시간 경로의 CSV 파일을 gzip으로 압축해 저장한다.</td>
          <td>gzip은 저장·읽기 바이트를 줄일 수 있지만 행 형식 CSV에서 필요한 열만 골라 읽는 열 기반 구조를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>Glue Crawler가 시간별 경로를 찾아 파티션을 등록하도록 예약한다.</td>
          <td>Crawler는 새 경로를 발견해 등록하는 유효한 방식이나 실행·등록 완료 전에 도착한 데이터는 파티션으로 조회되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/columnar-storage.html">Athena 열 형식</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html">Athena partition projection</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: Athena로 S3 로그를 조회한다. 파일은 매시간 dt=YYYY-MM-DD/hour=HH 경로에 연속해서 도착하며 빈 시간 구간은 거의
              없다. 현재 CSV에는 150개 열이 있지만 쿼리는 시간 범위를 지정하고 4개 열만 읽는다. 새 시간 경로는 카탈로그
              등록을 기다리지 않고 조회돼야 한다. 열 읽기를 줄이고 새 파티션 등록 작업도 없애는 두 변경은 무엇인가?
            answer: 날짜·시간 범위와 S3 경로 템플릿으로 partition projection을 구성한다.
            wrong:
              - Glue Data Catalog 테이블에 날짜·시간 파티션 인덱스를 구성한다.
              - 각 시간 경로의 CSV 파일을 gzip으로 압축해 저장한다.
              - Glue Crawler가 시간별 경로를 찾아 파티션을 등록하도록 예약한다.
            answers:
              - 날짜·시간 범위와 S3 경로 템플릿으로 partition projection을 구성한다.
              - 시간별 경로를 유지하며 로그를 압축된 Parquet 형식으로 변환한다.
            options:
              - Glue Data Catalog 테이블에 날짜·시간 파티션 인덱스를 구성한다.
              - 각 시간 경로의 CSV 파일을 gzip으로 압축해 저장한다.
              - Glue Crawler가 시간별 경로를 찾아 파티션을 등록하도록 예약한다.
              - 날짜·시간 범위와 S3 경로 템플릿으로 partition projection을 구성한다.
              - 시간별 경로를 유지하며 로그를 압축된 Parquet 형식으로 변환한다.
      - id: Q22-36
        type: mcq
        title: Q22-36 · 모의고사 A
        explain: |
          <p>Batch array job의 N_TO_N 의존성은 B의 각 인덱스가 A의 같은 인덱스 성공을 기다리게 한다. 느린 다른 시료 때문에 전체 단계 사이에 장벽을 만들지 않으면서 두 번의 array job 제출로 1,000쌍을 관리할 수 있다. 개별 작업 간 의존성도 실행 가능하지만 2,000개 제출과 ID 매핑을 관리해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>A와 B를 같은 크기의 array job으로 제출하고 B가 A 전체 성공에 의존하게 한다.</td>
          <td>의존성은 보장되지만 가장 느린 A까지 모두 끝나야 B를 시작하므로 시료별로 준비된 분석을 진행하는 병렬성이 줄어든다.</td>
          </tr>
          <tr>
          <td>A array job 뒤에 SEQUENTIAL 방식의 B array job을 연결한다.</td>
          <td>전처리 이후 분석할 수 있지만 B를 인덱스 순서로 직렬화하므로 서로 독립적인 시료를 병렬 실행하지 못한다.</td>
          </tr>
          <tr>
          <td>시료별 A와 B를 개별 작업으로 제출하고 각 B에 대응 A의 작업 ID를 연결한다.</td>
          <td>원하는 실행 관계는 구현하지만 개별 2,000개 작업 제출과 대응 ID 관리를 구현해야 하므로 두 array job보다 코드·운영이 늘어난다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/batch/latest/userguide/array_jobs.html">Batch array job과 의존성</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: 연구소가 AWS Batch에서 시료 1,000개를 처리한다. 각 시료는 전처리 A[i]가 끝난 뒤 분석 B[i]를 실행해야 하지만 다른
              시료의 전처리 완료를 기다릴 필요는 없다. 두 단계는 서로 다른 작업 정의를 사용하며 실행 시간이 시료마다 크게
              다르다. 개별 작업 제출·상태 추적 코드를 최소화하면서 가능한 병렬성을 유지할 구성은 무엇인가?
            answer: A와 B를 같은 크기의 array job으로 제출하고 B에 A의 N_TO_N 의존성을 둔다.
            wrong:
              - A와 B를 같은 크기의 array job으로 제출하고 B가 A 전체 성공에 의존하게 한다.
              - A array job 뒤에 SEQUENTIAL 방식의 B array job을 연결한다.
              - 시료별 A와 B를 개별 작업으로 제출하고 각 B에 대응 A의 작업 ID를 연결한다.
      - id: Q22-37
        type: mcq
        title: Q22-37 · 모의고사 A
        explain: |
          <p>교차 계정 역할 위임에는 대상 역할이 호출자를 신뢰하고 호출자 쪽에서도 대상 역할을 맡는 작업이 허용돼야 한다. 역할을 맡은 뒤 수행할 S3 권한과 위임 자체의 권한은 별개다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>고객 역할의 S3 권한에만 sts:AssumeRole을 추가한다.</td>
          <td>호출자 측 역할 위임 권한과 대상 신뢰가 필요하며 대상의 업무 권한 추가만으로 해결되지 않는다.</td>
          </tr>
          <tr>
          <td>공급업체 역할의 신뢰 정책에만 고객 계정을 등록한다.</td>
          <td>이 방향은 공급업체 역할을 누가 맡는지 정하며 고객의 대상 역할을 맡는 신뢰 방향과 다르다.</td>
          </tr>
          <tr>
          <td>고객 역할의 세션 시간만 늘리고 대상 신뢰 정책은 변경하지 않는다.</td>
          <td>세션 시간은 위임 요청 자체에 필요한 신뢰·호출 허용을 제공하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html">Cross-account access</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 고객 계정의 역할을 공급업체 계정에서 맡도록 구성하고 있다. 역할에는 S3 읽기 권한이 있지만 공급업체는 아직 AssumeRole에
              실패한다. 정적 키를 공유하지 않고 교차 계정 역할 위임을 완성하려면 무엇을 확인해야 하는가?
            answer: 고객 역할의 신뢰 정책이 공급업체의 지정 주체를 허용하는지 확인한다.
            wrong:
              - 고객 역할의 S3 권한에만 sts:AssumeRole을 추가한다.
              - 공급업체 역할의 신뢰 정책에만 고객 계정을 등록한다.
              - 고객 역할의 세션 시간만 늘리고 대상 신뢰 정책은 변경하지 않는다.
            answers:
              - 고객 역할의 신뢰 정책이 공급업체의 지정 주체를 허용하는지 확인한다.
              - 공급업체 주체에 대상 역할의 sts:AssumeRole 호출 권한이 있는지 확인한다.
            options:
              - 고객 역할의 신뢰 정책이 공급업체의 지정 주체를 허용하는지 확인한다.
              - 공급업체 주체에 대상 역할의 sts:AssumeRole 호출 권한이 있는지 확인한다.
              - 고객 역할의 S3 권한에만 sts:AssumeRole을 추가한다.
              - 공급업체 역할의 신뢰 정책에만 고객 계정을 등록한다.
              - 고객 역할의 세션 시간만 늘리고 대상 신뢰 정책은 변경하지 않는다.
      - id: Q22-38
        type: mcq
        title: Q22-38 · 모의고사 A
        explain: |
          <p>Failover 라우팅은 주 대상의 상태에 따라 보조 대상으로 응답하도록 구성할 수 있다. DNS 캐시와 상태 감지 때문에 즉시 전환을 보장하지 않으며 별도 데이터·앱 준비와 함께 사용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>같은 이름에 두 리전의 simple 레코드 값을 등록하고 상태 확인은 생략한다.</td>
          <td>단순 복수 값만으로 주·보조 우선순위와 실패 기반 전환을 구현하지 못한다.</td>
          </tr>
          <tr>
          <td>주 리전 레코드 TTL만 줄이고 보조 대상 레코드는 만들지 않는다.</td>
          <td>캐시 시간을 줄여도 실패 시 응답할 다른 리전 대상과 상태 판단이 없다.</td>
          </tr>
          <tr>
          <td>Route 53 weighted 레코드에 두 대상을 같은 가중치로만 고정한다.</td>
          <td>고정 동일 가중치는 건강한 주 대상을 우선하고 실패 시 보조로 보내는 요구를 그대로 구현하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-failover.html">Route 53 failover</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 한 리전의 API가 실패하면 다른 리전의 준비된 환경으로 새 요청을 보내야 한다. 운영팀은 DNS 이름을 유지하면서 정상 상태에 따라
              주·보조 대상을 바꾸고 싶다. 앱 데이터 복구는 별도 준비돼 있다. 적합한 선택은 무엇인가?
            answer: Route 53 failover 레코드와 적절한 상태 확인을 구성한다.
            wrong:
              - 같은 이름에 두 리전의 simple 레코드 값을 등록하고 상태 확인은 생략한다.
              - 주 리전 레코드 TTL만 줄이고 보조 대상 레코드는 만들지 않는다.
              - Route 53 weighted 레코드에 두 대상을 같은 가중치로만 고정한다.
      - id: Q22-39
        type: mcq
        title: Q22-39 · 모의고사 A
        explain: |
          <p>EventBridge는 이벤트 패턴을 기준으로 대상에 이벤트를 전달하므로 생산자에서 소비자 주소를 분리하고 규칙을 중앙 관리할 수 있다. 대상 실패 처리와 필요한 재시도도 설계해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>단일 SQS 큐에 모든 이벤트를 넣고 각 대상이 모든 메시지를 경쟁 소비한다.</td>
          <td>조건별 여러 대상으로 독립 라우팅하는 요구와 다르며 메시지가 경쟁 분배된다.</td>
          </tr>
          <tr>
          <td>SNS 토픽에 필터 없이 모든 대상을 구독시키고 각 소비자 코드에서만 분류한다.</td>
          <td>이벤트 필드별 규칙을 중앙에서 관리하려는 요구 대신 소비자마다 분류 로직이 남는다.</td>
          </tr>
          <tr>
          <td>모든 생산자 코드에 각 소비자의 주소와 재시도 코드를 직접 넣는다.</td>
          <td>직접 주소를 넣으면 소비자 변경 시 생산자 수정이 필요해 결합을 줄이지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html">EventBridge event patterns</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 여러 파트너가 보낸 주문 상태 이벤트를 조건별로 물류·알림·분석 대상으로 전달해야 한다. 이벤트의 세부 필드로 규칙을 바꾸고 소비자와
              생산자 간 직접 호출을 줄이는 것이 목표다. 적합한 관리형 연결 방식은 무엇인가?
            answer: EventBridge 이벤트 버스의 패턴 규칙과 대상 연결을 사용한다.
            wrong:
              - 단일 SQS 큐에 모든 이벤트를 넣고 각 대상이 모든 메시지를 경쟁 소비한다.
              - SNS 토픽에 필터 없이 모든 대상을 구독시키고 각 소비자 코드에서만 분류한다.
              - 모든 생산자 코드에 각 소비자의 주소와 재시도 코드를 직접 넣는다.
      - id: Q22-40
        type: mcq
        title: Q22-40 · 모의고사 A
        explain: |
          <p>Zonal NAT Gateway는 배치한 AZ의 자원이므로 AZ별 Zonal NAT와 로컬 라우팅은 단일 AZ 의존성과 일상 교차 AZ 경로를 줄인다. 가용성 요구와 NAT 추가 비용을 함께 고려한다. 이 문항은 Regional NAT 구성이 아닌 Zonal NAT를 전제로 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>여러 AZ의 사설 서브넷 경로를 동일 AZ의 두 NAT에 나누어 연결한다.</td>
          <td>NAT 수는 늘어도 한 AZ 장애에 모두 의존하는 문제는 남는다.</td>
          </tr>
          <tr>
          <td>보조 AZ에 NAT를 만들되 모든 서브넷은 기존 NAT만 계속 기본 경로로 사용한다.</td>
          <td>실제 라우팅이 기존 AZ에 의존하고 자동 전환도 없으므로 구성만으로 업무 경로를 보호하지 못한다.</td>
          </tr>
          <tr>
          <td>같은 AZ의 기존 NAT Gateway에 Elastic IP만 추가한다.</td>
          <td>IP 추가는 NAT가 의존하는 AZ 장애 영역을 분리하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html">NAT Gateway availability</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 웹 서버는 여러 AZ에 있지만 모든 사설 서브넷이 한 AZ의 Zonal NAT Gateway로 외부 결제 API를 호출한다. 해당 AZ
              장애 시 결제가 중단됐다. AZ 장애를 견디며 불필요한 교차 AZ 경로도 줄이려면 어떻게 구성하는가?
            answer: 각 AZ에 Zonal NAT Gateway를 두고 각 사설 서브넷을 같은 AZ의 NAT로 라우팅한다.
            wrong:
              - 여러 AZ의 사설 서브넷 경로를 동일 AZ의 두 NAT에 나누어 연결한다.
              - 보조 AZ에 NAT를 만들되 모든 서브넷은 기존 NAT만 계속 기본 경로로 사용한다.
              - 같은 AZ의 기존 NAT Gateway에 Elastic IP만 추가한다.
      - id: Q22-41
        type: mcq
        title: Q22-41 · 모의고사 A
        explain: |
          <p>소규모지만 동작 중인 앱을 유지하는 warm standby는 8분 확장과 3분 전환을 보수적으로 합쳐도 11분으로 RTO에 맞는다. 0대에서 복구하는 구성은 초기화만 20분이므로 목표를 넘는다. 두 리전의 DB 복제·인증·용량은 준비돼 있다는 전제에서 20대를 상시 유지하는 두 대안보다 앱의 평상시 비용이 낮다. 실제 목표 달성 여부는 전체 복구 훈련으로 검증한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>복구 리전 ASG의 최소 용량을 0대로 두고 장애 시 20대를 시작한다.</td>
          <td>평상시 앱 비용은 가장 낮지만 초기화 20분과 전환 시간이 필요해 피크 RTO 15분을 만족하지 못한다.</td>
          </tr>
          <tr>
          <td>복구 리전에 20대를 유지하고 주 리전 장애 시 그쪽으로 전환한다.</td>
          <td>빠른 전환은 가능하지만 2대 warm standby로도 RTO를 충족하므로 복구 앱 20대의 상시 비용이 불필요하다.</td>
          </tr>
          <tr>
          <td>양쪽 리전에 20대씩 유지하고 평소에도 두 앱 계층으로 요청을 분산한다.</td>
          <td>앱 계층의 즉시 수용 능력은 높지만 복구 측 20대를 계속 실행하므로 주어진 RTO를 달성하는 최소 비용 구성이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_planning_for_recovery_disaster_recovery.html">복구 목표에 따른 DR 전략</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 한 리전의 주문 앱은 피크에 EC2 20대가 필요하다. 복구 리전의 DB 복제는 RPO 1분을 충족하고 DB 승격과 DNS 전환에는 합계
              3분이 걸린다. 앱은 0대에서 시작하면 이미지 초기화에 20분이 필요하지만, 실행 중인 2대에서 20대로 확장하는 데는
              8분이 걸린다. 용량·외부 인증은 사전 확보했다. 피크 부하의 RTO 15분을 만족하며 평상시 복구 리전 비용이 가장
              낮은 구성은 무엇인가?
            answer: 복구 리전 ASG의 최소 용량을 2대로 유지하고 장애 시 20대로 확장한다.
            wrong:
              - 복구 리전 ASG의 최소 용량을 0대로 두고 장애 시 20대를 시작한다.
              - 복구 리전에 20대를 유지하고 주 리전 장애 시 그쪽으로 전환한다.
              - 양쪽 리전에 20대씩 유지하고 평소에도 두 앱 계층으로 요청을 분산한다.
      - id: Q22-42
        type: mcq
        title: Q22-42 · 모의고사 A
        explain: |
          <p>RDS 예약 DB 인스턴스는 조건에 맞는 지속 사용에 적용되는 요금 할인이다. 기존 운영 형태를 유지하며 구성·약정의 일치를 확인하면 제시된 조건에서 비용 절감을 검토할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>운영 DB를 업무 시간 외 중지해 약정 없이 실행 시간을 줄인다.</td>
          <td>주어진 24시간 운영 조건을 위반한다.</td>
          </tr>
          <tr>
          <td>인스턴스를 한 단계 줄이고 현재 피크 성능은 별도 측정하지 않는다.</td>
          <td>요금은 줄 수 있으나 성능 유지 조건을 검증하지 않은 변경이다.</td>
          </tr>
          <tr>
          <td>EC2 Instance Savings Plans를 구매해 RDS 사용 요금을 직접 할인한다.</td>
          <td>EC2 Instance Savings Plans는 RDS 예약 DB 할인과 다른 상품으로 RDS 사용에 직접 적용되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithReservedDBInstances.html">RDS reserved instances</a>
          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: RDS 데이터베이스의 사용 엔진·리전·인스턴스 구성을 앞으로 1년간 유지할 예정이며 매시간 운영한다. 성능과 장애 복구 구성은 유지하면서
              인스턴스 사용 비용을 줄이고자 한다. 제시된 선택 중 적합한 방안은 무엇인가?
            answer: 사용 구성과 일치하는 RDS 예약 DB 인스턴스 할인을 검토한다.
            wrong:
              - 운영 DB를 업무 시간 외 중지해 약정 없이 실행 시간을 줄인다.
              - 인스턴스를 한 단계 줄이고 현재 피크 성능은 별도 측정하지 않는다.
              - EC2 Instance Savings Plans를 구매해 RDS 사용 요금을 직접 할인한다.
      - id: Q22-43
        type: mcq
        title: Q22-43 · 모의고사 A
        explain: |
          <p>현재 회선으로 하루 전송 가능한 양은 (200+800)Mbps×12시간÷8로 약 5.4TB이다. 13일 동안 70.2TB를 보낼 수 있어 초회 50TB와 최대 약 1.3TB의 증분을 전송하고 검증 하루를 남길 여유가 있다. DataSync의 실행 중 대역폭 제한 변경과 증분 전송을 이용하면 별도 회선의 고정 비용을 추가하지 않는다. 제시된 MB/s는 십진이며 API에서는 바이트/초로 설정한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>21일 후 개통되는 10Gbps Direct Connect를 계약해 DataSync로 전송한다.</td>
          <td>개통 후 처리량은 충분하지만 회선 준비 21일이 이전 기한 14일보다 길다.</td>
          </tr>
          <tr>
          <td>DataSync를 종일 25MB/s로 제한하고 초회·증분 전송을 수행한다.</td>
          <td>업무 트래픽 한도는 지키지만 하루 약 2.16TB, 13일에 약 28.08TB여서 초회 50TB도 완료하지 못한다.</td>
          </tr>
          <tr>
          <td>3일 후 개통되는 유료 임시 1Gbps 회선을 추가해 DataSync로 전송한다.</td>
          <td>기한 내 전송은 가능하지만 기존 회선의 주야간 가용량으로도 완료할 수 있어 임시 회선 고정 비용이 추가된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/datasync/latest/userguide/configure-bandwidth.html">DataSync 대역폭 제한</a> · <a href="https://docs.aws.amazon.com/datasync/latest/userguide/datasync-large-migration-running-tasks.html">DataSync 초회·증분 이전</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: DataSync Basic 모드로 50TB 온프레미스 파일을 14일 안에 S3로 옮기며 데이터는 하루 0.1TB씩 바뀐다. 현재 회선의
              이전용 실효 속도는 매일 주간 12시간 200Mbps, 야간 12시간 800Mbps이고 이 한도를 지켜야 업무가
              정상이다. 속도는 프로토콜 오버헤드를 반영한 값이며 별도 최종 검증에 하루가 필요하다. TB는 십진 단위다. 새 회선의
              고정 비용을 최소화하며 기한을 맞출 방안은 무엇인가?
            answer: DataSync를 주간 25MB/s·야간 100MB/s로 제한하고 초회·증분 전송을 수행한다.
            wrong:
              - 21일 후 개통되는 10Gbps Direct Connect를 계약해 DataSync로 전송한다.
              - DataSync를 종일 25MB/s로 제한하고 초회·증분 전송을 수행한다.
              - 3일 후 개통되는 유료 임시 1Gbps 회선을 추가해 DataSync로 전송한다.
      - id: Q22-44
        type: mcq
        title: Q22-44 · 모의고사 A
        explain: |
          <p>OAC와 버킷 정책은 해당 배포를 통한 원본 접근을 통제하고 서명 쿠키는 여러 제한 콘텐츠에 시간 조건을 제공한다. 원본 보호와 최종 사용자 접근 통제를 함께 구성해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>원본은 OAC로 보호하고 CloudFront 사용자 서명 검증은 생략한다.</td>
          <td>원본 보호만으로 배포에 접속한 사용자의 결제·시간 제한을 검증하지 못한다.</td>
          </tr>
          <tr>
          <td>서명 쿠키만 사용하고 S3 원본은 퍼블릭 읽기를 유지한다.</td>
          <td>배포 접근은 통제해도 S3 직접 URL로 콘텐츠를 우회 조회할 수 있다.</td>
          </tr>
          <tr>
          <td>파일마다 짧은 S3 사전 서명 URL을 발급하고 CloudFront 경로는 사용하지 않는다.</td>
          <td>가능한 파일 전달 방식이지만 CloudFront를 통해 여러 파일을 쿠키로 이용하려는 주어진 요구와 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html">CloudFront signed cookies</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: CloudFront를 통해만 유료 자료를 제공하며 S3 원본은 비공개로 유지하려 한다. 로그인한 고객은 여러 파일을 정해진 시간 동안
              이용하므로 파일마다 다른 링크를 다시 발급하는 방식은 피하고 싶다. 어떤 조합이 적합한가?
            answer: OAC와 버킷 정책으로 원본을 보호하고 CloudFront 서명 쿠키로 사용자 접근을 제한한다.
            wrong:
              - 원본은 OAC로 보호하고 CloudFront 사용자 서명 검증은 생략한다.
              - 서명 쿠키만 사용하고 S3 원본은 퍼블릭 읽기를 유지한다.
              - 파일마다 짧은 S3 사전 서명 URL을 발급하고 CloudFront 경로는 사용하지 않는다.
      - id: Q22-45
        type: mcq
        title: Q22-45 · 모의고사 A
        explain: |
          <p>동일 주문 ID를 결제 API의 멱등성 키로 재사용하면 API의 7일 보관 범위 안인 3일 재발행에서도 같은 결제를 재실행하지 않는다. 배치 크기 1이고 각 호출이 직렬로 API를 사용하므로 해당 소스의 Lambda 동시성을 8로 제한하면 결제 동시 호출도 8 이하다. 두 조치는 중복과 동시성이라는 다른 위험을 각각 제어한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>FIFO 큐로 옮기고 주문 ID를 message deduplication ID로 사용한다.</td>
          <td>FIFO 송신 중복 제거는 5분 창에 적용된다. 3일 이내 재발행과 처리 중 재시도에 대한 결제 API 수준의 멱등성을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>이벤트 소스 매핑에 ReportBatchItemFailures 응답 처리를 적용한다.</td>
          <td>부분 배치 응답은 성공한 다른 항목의 불필요한 재처리를 줄인다. 배치 크기 1인 이 구성의 별도 재발행이나 동시 호출 상한을 제어하지 않는다.</td>
          </tr>
          <tr>
          <td>SQS 가시성 시간을 Lambda 제한 시간의 6배 이상으로 설정한다.</td>
          <td>가시성 시간 여유는 처리 중 재수신을 줄이는 권장 설정이지만 독립적으로 다시 발행된 주문과 여러 메시지의 동시 호출을 제한하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html">SQS 매핑 동시성</a> · <a href="https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/">멱등 API 설계</a> · <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-key-terms.html">FIFO 중복 제거 시간</a> · <a href="https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html">부분 배치 실패 처리</a> · <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-lambda-function-trigger.html">Lambda 큐 가시성 시간</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 결제 Lambda는 표준 SQS 큐에서 배치 크기 1로 호출되고 한 호출은 외부 결제 API를 한 번에 하나씩 실행하며 API 호출 종료
              후 반환한다. 결제 API는 동시 요청 8개까지만 허용하며 같은 멱등성 키의 결과를 7일 보관한다. 주문 이벤트는 같은
              주문 ID로 3일 안에 다시 발행될 수 있다. DLQ·재처리와 지수 백오프는 이미 구성돼 있다. 중복 결제와 동시 요청
              초과를 각각 직접 막는 두 변경은 무엇인가?
            answer: 결제 API의 멱등성 키에 재시도·재발행 간 동일한 주문 ID를 사용한다.
            wrong:
              - FIFO 큐로 옮기고 주문 ID를 message deduplication ID로 사용한다.
              - 이벤트 소스 매핑에 ReportBatchItemFailures 응답 처리를 적용한다.
              - SQS 가시성 시간을 Lambda 제한 시간의 6배 이상으로 설정한다.
            answers:
              - 결제 API의 멱등성 키에 재시도·재발행 간 동일한 주문 ID를 사용한다.
              - 해당 SQS 이벤트 소스 매핑의 maximum concurrency를 8로 지정한다.
            options:
              - 결제 API의 멱등성 키에 재시도·재발행 간 동일한 주문 ID를 사용한다.
              - 해당 SQS 이벤트 소스 매핑의 maximum concurrency를 8로 지정한다.
              - FIFO 큐로 옮기고 주문 ID를 message deduplication ID로 사용한다.
              - 이벤트 소스 매핑에 ReportBatchItemFailures 응답 처리를 적용한다.
              - SQS 가시성 시간을 Lambda 제한 시간의 6배 이상으로 설정한다.
      - id: Q22-46
        type: mcq
        title: Q22-46 · 모의고사 A
        explain: |
          <p>프로세스 생성과 요청 처리 준비는 다르므로 실제 준비 상태를 검사하고 초기화 시간을 고려해야 한다. 정상 작업을 유지한 배포 설정으로 새 대상이 준비된 후 요청을 받게 구성한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>컨테이너 프로세스가 생성되면 즉시 모든 기존 작업을 종료한다.</td>
          <td>기존 작업을 모두 먼저 없애면 초기화가 끝나지 않은 기간에 처리 용량이 사라진다.</td>
          </tr>
          <tr>
          <td>ALB의 헬스 체크를 항상 성공하는 고정 경로로 바꾼다.</td>
          <td>항상 성공하는 경로는 준비되지 않은 대상까지 정상으로 판단하게 한다.</td>
          </tr>
          <tr>
          <td>동일한 이미지로 작업 수만 두 배 늘리고 준비 상태 판단은 바꾸지 않는다.</td>
          <td>초기화 미완료 대상을 정상으로 보는 문제는 작업 수 증가만으로 해결되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service_definition_parameters.html">ECS service health checks</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: ECS 웹 서비스가 새 버전으로 배포될 때 시작 직후 일부 요청이 실패한다. 컨테이너는 프로세스를 실행했지만 초기 데이터 로딩은 아직
              끝나지 않았다. 여러 작업을 유지하며 준비되지 않은 버전으로 사용자 요청이 가지 않게 하려면 무엇을 해야 하는가?
            answer: 앱 준비 상태를 반영하는 헬스 체크와 배포 유예·교체 설정을 구성한다.
            wrong:
              - 컨테이너 프로세스가 생성되면 즉시 모든 기존 작업을 종료한다.
              - ALB의 헬스 체크를 항상 성공하는 고정 경로로 바꾼다.
              - 동일한 이미지로 작업 수만 두 배 늘리고 준비 상태 판단은 바꾸지 않는다.
      - id: Q22-47
        type: mcq
        title: Q22-47 · 모의고사 A
        explain: |
          <p>작업별 중단 허용 조건이 다르므로 일반 작업에 Spot 절감을 적용하고 긴급 작업은 온디맨드 경로로 분리한다. 온디맨드도 모든 장애를 없애지는 않지만 Spot 용량 회수의 영향을 분리할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>항상 쓰지 않는 피크 용량 전체에 장기 RI를 구매한다.</td>
          <td>지속 사용 근거 없이 피크 전체를 약정하면 미사용 비용 위험이 있다.</td>
          </tr>
          <tr>
          <td>두 큐의 모든 작업을 Spot으로 통합하고 긴급 작업의 재시도 우선순위만 높인다.</td>
          <td>재시도 우선순위는 Spot 회수 시 실행 용량을 보장하지 않아 긴급 작업 조건을 만족하지 못한다.</td>
          </tr>
          <tr>
          <td>피크 용량 전체를 온디맨드로 상시 유지한다.</td>
          <td>실행은 가능하지만 유연한 기한과 중단 허용이라는 절감 조건을 활용하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html">Spot Instances</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 밤마다 이미지 100만 장을 변환하며 작업은 개별 파일 단위로 재실행할 수 있다. 완료 기한은 유연하고 중간 결과는 S3에 남긴다. 일반
              변환에는 중단 처리 코드가 준비돼 있다. 다만 전체 중 소수의 긴급 고객 작업은 Spot 용량 회수로 지연되면 안
              되므로 큐를 분리할 수 있다. 실행 비용을 줄일 구매 방식은 무엇인가?
            answer: 일반 작업은 여러 풀의 Spot으로 처리하고 긴급 작업은 분리한 큐와 온디맨드 실행 용량으로 처리한다.
            wrong:
              - 항상 쓰지 않는 피크 용량 전체에 장기 RI를 구매한다.
              - 두 큐의 모든 작업을 Spot으로 통합하고 긴급 작업의 재시도 우선순위만 높인다.
              - 피크 용량 전체를 온디맨드로 상시 유지한다.
      - id: Q22-48
        type: mcq
        title: Q22-48 · 모의고사 A
        explain: |
          <p>처리 중 가시성 시간이 끝나면 메시지가 다시 노출될 수 있다. 충분한 가시성 시간과 필요 시 연장, 성공 뒤 삭제를 사용하면 재시도를 보존하면서 겹친 처리를 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>소비자 수만 줄이고 작업 시간보다 짧은 가시성은 그대로 둔다.</td>
          <td>동시 작업 수는 줄일 수 있어도 메시지 재노출과 중복 실행 위험은 남는다.</td>
          </tr>
          <tr>
          <td>메시지 수신 직후 삭제하고 작업 실패 때 작업자가 직접 새 메시지를 만든다.</td>
          <td>작업자가 실패해 재발행하지 못하면 처리할 메시지가 사라질 수 있다.</td>
          </tr>
          <tr>
          <td>보존 기간만 늘리고 짧은 가시성 시간은 유지한다.</td>
          <td>보존과 가시성은 다르므로 처리 중 다른 소비자에게 재노출되는 원인을 해결하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">SQS visibility timeout</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 파일 검사 작업은 보통 수분이 걸리지만 SQS의 가시성 시간은 훨씬 짧다. 같은 파일을 여러 작업자가 동시에 검사하는 문제가 발생한다.
              검사 실패 때 재시도 가능성을 유지하면서 중복 작업을 줄이려면 무엇을 해야 하는가?
            answer: 처리 시간에 맞춰 가시성 시간을 정하고 긴 작업은 연장하며 성공 후 삭제한다.
            wrong:
              - 소비자 수만 줄이고 작업 시간보다 짧은 가시성은 그대로 둔다.
              - 메시지 수신 직후 삭제하고 작업 실패 때 작업자가 직접 새 메시지를 만든다.
              - 보존 기간만 늘리고 짧은 가시성 시간은 유지한다.
      - id: Q22-49
        type: mcq
        title: Q22-49 · 모의고사 A
        explain: |
          <p>접근 감소가 일정하고 즉시 조회와 다중 AZ 저장이 필요하므로 Standard에서 Standard-IA로 전환을 검토한다. 전환·최소 보관·조회 비용을 포함해 절감 여부를 계산해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>한 달 뒤 Glacier Flexible Retrieval로 전환하고 요청 때 복원한다.</td>
          <td>보관은 저렴해질 수 있지만 복원 대기 때문에 즉시 조회 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>처음부터 전체 수명 동안 Standard-IA로 유지한다.</td>
          <td>처음 한 달의 잦은 조회에서 검색 비용·최소 저장 조건을 부담하므로 확인된 수명 단계별 최적화보다 부적합하다.</td>
          </tr>
          <tr>
          <td>한 달 뒤 One Zone-IA로 전환한다.</td>
          <td>접근은 빠르지만 단일 AZ 저장으로 요구된 AZ 장애 내성을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">S3 storage classes</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: 의료 영상은 여러 AZ 장애에 견뎌야 하고 생성 후 한 달은 자주 조회하므로 이 기간에는 별도 데이터 검색 요금 없는 계층을 원한다. 그
              뒤에는 거의 조회하지 않지만 요청 시 즉시 읽어야 하며 수년간 보관한다. 일정한 접근 감소가 확인됐다. 적합한 비용
              최적화는 무엇인가?
            answer: 초기는 S3 Standard를 쓰고 이후 Standard-IA로 전환하는 수명 주기를 구성한다.
            wrong:
              - 한 달 뒤 Glacier Flexible Retrieval로 전환하고 요청 때 복원한다.
              - 처음부터 전체 수명 동안 Standard-IA로 유지한다.
              - 한 달 뒤 One Zone-IA로 전환한다.
      - id: Q22-50
        type: mcq
        title: Q22-50 · 모의고사 A
        explain: |
          <p>같은 리전 S3 트래픽은 추가 엔드포인트 사용료 없는 게이트웨이 엔드포인트로 NAT 처리를 피할 수 있다. 인터넷 호출용 NAT는 유지하고 트래픽 경로별 비용을 분리해 최적화한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>NAT 인스턴스를 직접 운영하고 백업량 증가에 맞춰 패치·확장을 관리한다.</td>
          <td>대안은 될 수 있으나 관리 부담과 성능·가용성 설계가 늘고 무료 게이트웨이 경로보다 직접적이지 않다.</td>
          </tr>
          <tr>
          <td>모든 S3 트래픽에 인터페이스 엔드포인트만 추가한다.</td>
          <td>가능한 사설 경로지만 추가 시간·데이터 비용이 있어 게이트웨이 사용이 가능한 이 조건에서는 불필요한 비용이 될 수 있다.</td>
          </tr>
          <tr>
          <td>다른 AZ에 NAT를 하나 더 만들고 S3 전송을 둘로 분산한다.</td>
          <td>처리량은 나눌 수 있으나 S3 트래픽의 NAT 처리 과금 자체는 남고 NAT 고정 비용이 늘어난다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html">NAT gateway pricing</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: 여러 사설 EC2가 같은 리전 S3로 백업을 보내며 NAT 처리 비용이 전체 네트워크 비용의 대부분이다. 다른 인터넷 API 호출에는 기존
              NAT가 계속 필요하다. S3는 비공개로 유지하면서 가장 직접적으로 비용을 줄일 방법은 무엇인가?
            answer: S3 게이트웨이 엔드포인트 경로로 백업을 보내고 나머지 인터넷 호출은 NAT에 남긴다.
            wrong:
              - NAT 인스턴스를 직접 운영하고 백업량 증가에 맞춰 패치·확장을 관리한다.
              - 모든 S3 트래픽에 인터페이스 엔드포인트만 추가한다.
              - 다른 AZ에 NAT를 하나 더 만들고 S3 전송을 둘로 분산한다.
      - id: Q22-51
        type: mcq
        title: Q22-51 · 모의고사 A
        explain: |
          <p>SSE-KMS 객체 읽기에는 S3 읽기 권한뿐 아니라 해당 KMS 키를 복호화에 사용할 수 있는 권한 경로가 필요하다. IAM 정책과 키 정책의 관계를 확인해야 암호화를 유지하며 접근을 해결한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>역할에 S3 객체 읽기 권한만 다시 추가하고 키 정책은 점검하지 않는다.</td>
          <td>이미 S3 읽기는 허용되어 있고 별도의 KMS 사용 허용 문제가 남는다.</td>
          </tr>
          <tr>
          <td>역할에 kms:Encrypt만 추가하고 Decrypt는 허용하지 않는다.</td>
          <td>암호화 권한과 복호화 권한은 다른 작업이므로 읽기 실패를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>버킷 기본 암호화 키를 새 키로 바꾸고 기존 보고서는 다시 암호화하지 않는다.</td>
          <td>기본 설정 변경만으로 기존 객체에 사용된 키가 바뀌지 않아 기존 키 복호화 권한 문제가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html">S3 SSE-KMS permissions</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 앱이 고객 관리형 KMS 키로 암호화된 S3 보고서를 읽는다. 역할의 s3:GetObject는 허용되어 있지만 복호화가 거부된다. 앱은
              같은 계정에 있으며 네트워크는 정상이다. 암호화를 제거하지 않고 해결하려면 무엇을 확인해야 하는가?
            answer: 역할의 kms:Decrypt 권한과 KMS 키 정책의 해당 사용 허용을 확인한다.
            wrong:
              - 역할에 S3 객체 읽기 권한만 다시 추가하고 키 정책은 점검하지 않는다.
              - 역할에 kms:Encrypt만 추가하고 Decrypt는 허용하지 않는다.
              - 버킷 기본 암호화 키를 새 키로 바꾸고 기존 보고서는 다시 암호화하지 않는다.
      - id: Q22-52
        type: mcq
        title: Q22-52 · 모의고사 A
        explain: |
          <p>변경이 적고 반복 다운로드되는 파일은 CDN 캐시로 원본 반복 읽기와 앱 중계를 줄일 수 있다. CloudFront와 S3의 실제 요청·전송 요금까지 비교하면서 사용자 가까운 전달 경로를 만든다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 리전 간 복제를 추가하되 모든 다운로드는 기존 EC2에서 계속 중계한다.</td>
          <td>복제 위치가 늘어도 기존 앱의 중계 실행·전송 비용 원인이 유지된다.</td>
          </tr>
          <tr>
          <td>모든 파일을 Lambda가 메모리로 읽어 동기 중계하도록 바꾼다.</td>
          <td>다른 실행 자원으로 중계를 옮겨도 반복 원본 읽기·데이터 중계가 남는다.</td>
          </tr>
          <tr>
          <td>EC2 수만 늘려 같은 파일을 매번 앱 서버가 중계하게 한다.</td>
          <td>같은 중계 구조의 서버 증설은 반복 전송과 실행 비용의 원인을 유지한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/ServingCompressedFiles.html">CloudFront caching</a> · <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HowCloudFrontWorks.html">CloudFront operation</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: 글로벌 사용자가 자주 내려받는 동일 대형 파일을 EC2 웹 서버가 매번 S3에서 읽어 전달한다. 파일은 자주 바뀌지 않으며 앱 서버의
              네트워크·실행 비용을 줄이고 응답도 빠르게 하려 한다. 적합한 개선은 무엇인가?
            answer: CloudFront에서 S3 원본을 캐시하고 다운로드를 앱 서버 경로에서 분리한다.
            wrong:
              - S3 리전 간 복제를 추가하되 모든 다운로드는 기존 EC2에서 계속 중계한다.
              - 모든 파일을 Lambda가 메모리로 읽어 동기 중계하도록 바꾼다.
              - EC2 수만 늘려 같은 파일을 매번 앱 서버가 중계하게 한다.
      - id: Q22-53
        type: mcq
        title: Q22-53 · 모의고사 A
        explain: |
          <p>문제의 미국 세 리전은 현재 MRSC 지원 리전에 포함된다. MRSC는 현재 지원 목록 안에서 대륙에 관계없이 세 리전의 조합을 선택할 수 있다. MRSC는 쓰기 성공 전 다른 참여 리전으로 동기 복제하며 어느 복제본에서도 강한 읽기로 최신 항목을 조회한다. 두 전체 복제본과 한 witness 구성이므로 세 전체 복제본보다 복제본 수가 적고 한 리전 장애에도 다른 두 참여 리전이 남는다. witness는 일반 테이블처럼 전체 항목을 조회하는 복제본이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버지니아 북부의 단일 리전 테이블로 모으고 두 앱이 강한 일관성 읽기를 쓴다.</td>
          <td>강한 읽기는 가능하지만 테이블을 둔 리전이 장애 나면 다른 리전의 독립 복제본으로 계속 읽고 쓸 수 없다.</td>
          </tr>
          <tr>
          <td>두 업무 리전에 MREC 복제본을 두고 각 복제본에 강한 일관성 읽기를 쓴다.</td>
          <td>MREC의 강한 읽기는 해당 리전의 최신 상태를 읽지만 다른 리전에서 아직 비동기 전파되지 않은 쓰기까지 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>세 리전에 MRSC 전체 복제본을 두고 각 복제본에 강한 일관성 읽기를 쓴다.</td>
          <td>최신 읽기와 장애 복원력은 충족하지만 사용하지 않는 세 번째 전체 복제본까지 유지하므로 복제본 수 최소화 조건에서 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-global-table-design.html">글로벌 테이블 MREC·MRSC 및 witness</a> · <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html">DynamoDB 읽기 일관성</a> · <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html">MRSC current supported Regions and three-Region deployment</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 새 DynamoDB 업무는 버지니아 북부와 오하이오에서 같은 항목을 읽고 쓴다. 한 리전에서 성공 응답한 쓰기는 그 리전이 즉시 장애 나도
              다른 리전에서 최신 값으로 읽혀야 한다. 리전 간 통신 지연은 수용하며 GetItem을 사용한다. 오리건도 참여시킬 수
              있지만 전체 데이터 복제본 수는 최소화하려 한다. 앱의 장애 조치는 별도 준비됐다. 가장 적합한 구성은 무엇인가?
            answer: 두 업무 리전에 MRSC 복제본, 오리건에 witness를 두고 강한 일관성 읽기를 쓴다.
            wrong:
              - 버지니아 북부의 단일 리전 테이블로 모으고 두 앱이 강한 일관성 읽기를 쓴다.
              - 두 업무 리전에 MREC 복제본을 두고 각 복제본에 강한 일관성 읽기를 쓴다.
              - 세 리전에 MRSC 전체 복제본을 두고 각 복제본에 강한 일관성 읽기를 쓴다.
      - id: Q22-54
        type: mcq
        title: Q22-54 · 모의고사 A
        explain: |
          <p>FSR은 지정 기준 스냅샷과 AZ에서 초기화된 새 볼륨을 생성해 처음 접근하는 블록의 로딩 지연을 없앤다. 활성화 완료와 볼륨 생성 크레딧이 준비돼야 하며 12,000 IOPS·500MiB/s는 FSR 지원 범위 안이다. 이와 별개인 결과 볼륨에는 DeleteOnTermination=false를 설정해 인스턴스 종료 후에도 최신 쓰기를 남긴다. 기준 데이터의 신규 복원 성능과 운영 결과의 종료 시 보존을 각각 해결해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>교체 서버를 EBS 대역폭이 더 큰 인스턴스 유형으로 변경한다.</td>
          <td>인스턴스 EBS 한계가 병목이면 유효하지만 스냅샷 블록의 첫 접근 초기화와 종료 시 볼륨 삭제 설정은 별개다.</td>
          </tr>
          <tr>
          <td>결과 볼륨의 스냅샷 생성 주기를 1시간에서 5분으로 줄인다.</td>
          <td>백업 시점은 최신에 가까워지지만 직전 스냅샷 이후 쓰기까지 현재 볼륨에 남기는 요구와 첫 읽기 지연을 직접 해결하지 않는다.</td>
          </tr>
          <tr>
          <td>복원 볼륨의 프로비저닝 IOPS를 12,000에서 24,000으로 올린다.</td>
          <td>정상시 필요한 IOPS에는 이미 여유가 있다. IOPS 상향만으로 스냅샷의 아직 초기화되지 않은 블록을 미리 로드하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/ebs-fast-snapshot-restore.html">EBS Fast Snapshot Restore</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/how-ec2-instance-termination-works.html">EC2 종료와 데이터 보존</a>
          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: 같은 AZ의 EC2 분석 서버는 실행할 때마다 기준 1TiB 스냅샷에서 새 읽기용 볼륨을 만들며, 별도 EBS 결과 볼륨에 최신 결과를
              기록한다. 기준 볼륨은 12,000 IOPS·500MiB/s면 충분하지만 처음 읽는 블록에서 지연이 커진다. 전체
              블록을 사전에 읽을 시간 없이 시작 직후 설정 성능이 필요하다. 결과 볼륨은 서버가 종료돼도 최신 쓰기가 남아야 하며
              현재 DeleteOnTermination=true다. 필요한 두 변경은 무엇인가?
            answer: 기준 스냅샷의 복원 AZ에 Fast Snapshot Restore를 사전 활성화한다.
            wrong:
              - 교체 서버를 EBS 대역폭이 더 큰 인스턴스 유형으로 변경한다.
              - 결과 볼륨의 스냅샷 생성 주기를 1시간에서 5분으로 줄인다.
              - 복원 볼륨의 프로비저닝 IOPS를 12,000에서 24,000으로 올린다.
            answers:
              - 기준 스냅샷의 복원 AZ에 Fast Snapshot Restore를 사전 활성화한다.
              - 결과 볼륨의 DeleteOnTermination을 false로 지정한다.
            options:
              - 교체 서버를 EBS 대역폭이 더 큰 인스턴스 유형으로 변경한다.
              - 결과 볼륨의 스냅샷 생성 주기를 1시간에서 5분으로 줄인다.
              - 기준 스냅샷의 복원 AZ에 Fast Snapshot Restore를 사전 활성화한다.
              - 결과 볼륨의 DeleteOnTermination을 false로 지정한다.
              - 복원 볼륨의 프로비저닝 IOPS를 12,000에서 24,000으로 올린다.
      - id: Q22-55
        type: mcq
        title: Q22-55 · 모의고사 A
        explain: |
          <p>짧고 많은 상태 전환을 가진 멱등 워크플로는 Express에 적합하다. Express는 상태 전환 건수 대신 실행 요청·시간·메모리로 과금하므로 2초 동안 50단계를 처리하는 고빈도 작업의 조정 비용을 줄일 수 있다. 비동기 StartExecution은 완료를 기다리지 않고 접수를 반환한다. 중복 실행 가능성을 이벤트 ID 멱등 처리로 수용하고 CloudWatch Logs로 이력을 보관한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>동기 Express 워크플로를 호출 API에서 StartSyncExecution으로 실행한다.</td>
          <td>동기 Express도 2초 작업을 처리할 수 있지만 호출은 실행 결과가 나올 때까지 기다린다. 접수를 즉시 반환하는 호출 방식이 아니다.</td>
          </tr>
          <tr>
          <td>Standard 워크플로를 StartExecution으로 시작한다.</td>
          <td>비동기 접수와 실행 자체는 충족하지만 50단계의 상태 전환마다 과금된다. 짧은 고빈도 멱등 처리에 Express보다 조정 비용이 높다.</td>
          </tr>
          <tr>
          <td>SQS·Lambda·DynamoDB로 단계 진행 상태와 다음 단계 전달을 구현한다.</td>
          <td>비동기 처리와 내구성 상태는 구현할 수 있으나 단계 전달·상태 저장·재시도 코드를 새로 작성해야 한다. 기존 단계 정의를 재사용하는 관리형 실행보다 운영 범위가 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html">Standard·Express 실행 유형과 보장</a> · <a href="https://aws.amazon.com/step-functions/pricing/">Step Functions 과금 방식</a> · <a href="https://docs.aws.amazon.com/step-functions/latest/apireference/API_StartExecution.html">비동기 실행 시작 API</a> · <a href="https://docs.aws.amazon.com/step-functions/latest/apireference/API_StartSyncExecution.html">동기 Express 실행 API</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 이벤트 정규화 파이프라인은 50개 짧은 단계의 기존 Step Functions 정의로 구성돼 실행에 2초가 걸린다. 필요 할당량은
              확보했으며 초당 1,000건을 처리한다. 모든 단계는 이벤트 ID로 멱등하다. 별도 승인·callback·장기 대기는
              없고 상세 이력은 CloudWatch Logs로 보관하면 된다. 호출 API는 작업 완료를 기다리지 않고 접수를
              반환해야 한다. 단계 정의를 재사용하면서 조정 비용을 줄일 가장 적합한 방식은 무엇인가?
            answer: 비동기 Express 워크플로를 StartExecution으로 시작한다.
            wrong:
              - 동기 Express 워크플로를 호출 API에서 StartSyncExecution으로 실행한다.
              - Standard 워크플로를 StartExecution으로 시작한다.
              - SQS·Lambda·DynamoDB로 단계 진행 상태와 다음 단계 전달을 구현한다.
      - id: Q22-56
        type: mcq
        title: Q22-56 · 모의고사 A
        explain: |
          <p>DB에 실제 연결을 시작하는 주체는 웹 서버이므로 웹 서버 보안 그룹 참조로 DB 포트만 허용한다. 보안 그룹 참조는 서버 교체 시 IP 목록을 갱신하는 부담도 줄인다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DB 보안 그룹에서 ALB 보안 그룹만 소스로 DB 포트를 허용한다.</td>
          <td>이 구성에서 DB 접속 주체는 ALB가 아니라 웹 서버이므로 정상 DB 연결을 허용하지 못한다.</td>
          </tr>
          <tr>
          <td>DB 보안 그룹에서 VPC 전체 CIDR의 모든 포트를 허용한다.</td>
          <td>VPC 전체와 모든 포트 허용은 필요한 웹 계층만 접근시키는 요구보다 범위가 넓다.</td>
          </tr>
          <tr>
          <td>DB 보안 그룹에서 인터넷 전체의 DB 포트를 허용한다.</td>
          <td>인터넷 전체 허용은 운영 노트북 등 불필요한 경로까지 열게 된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html">Security group referencing</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 인터넷에 노출된 ALB 뒤의 EC2 웹 서버가 같은 VPC의 DB에 접속한다. DB는 웹 서버에서 오는 접속만 받고 운영자의 임의
              노트북에서는 직접 접근할 수 없어야 한다. 서버 수가 바뀌어도 IP 목록을 수동 수정하지 않으려면 어떻게 구성하는가?
            answer: DB 보안 그룹에서 웹 서버 보안 그룹을 소스로 한 DB 포트만 허용한다.
            wrong:
              - DB 보안 그룹에서 ALB 보안 그룹만 소스로 DB 포트를 허용한다.
              - DB 보안 그룹에서 VPC 전체 CIDR의 모든 포트를 허용한다.
              - DB 보안 그룹에서 인터넷 전체의 DB 포트를 허용한다.
      - id: Q22-57
        type: mcq
        title: Q22-57 · 모의고사 A
        explain: |
          <p>게이트웨이 엔드포인트는 NAT나 인터넷 게이트웨이 없이 같은 리전 S3 경로를 제공한다. 버킷 정책의 SourceVpce 조건으로 지정 경로 접근을 통제하면 네트워크와 리소스 권한 조건을 함께 만족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 엔드포인트 정책만 쓰고 버킷의 다른 경로 접근 허용은 그대로 둔다.</td>
          <td>엔드포인트 정책은 그 경로의 사용을 제한하지만 다른 경로에서 버킷 접근을 막는 정책을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>인터넷 NAT를 만들고 버킷 정책에는 역할 허용만 설정한다.</td>
          <td>인터넷 없는 지정 엔드포인트 경로 제한 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>보안 그룹 아웃바운드에서 S3 주소만 허용하고 서비스 경로는 만들지 않는다.</td>
          <td>트래픽 허용만으로 NAT 없는 S3 연결 경로가 생기지 않고 버킷의 경로 제한도 설정되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html">S3 gateway endpoints</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 사설 EC2가 같은 리전의 S3 버킷으로만 대량 파일을 올린다. 인터넷 경로를 만들지 않고 해당 VPC의 지정 경로에서만 버킷에 접근시키려
              한다. S3 객체 쓰기 권한은 이미 역할에 있다. 어떤 두 구성이 필요한가?
            answer: 버킷 정책에서 지정한 VPC 엔드포인트를 통과한 접근으로 제한한다.
            wrong:
              - S3 엔드포인트 정책만 쓰고 버킷의 다른 경로 접근 허용은 그대로 둔다.
              - 인터넷 NAT를 만들고 버킷 정책에는 역할 허용만 설정한다.
              - 보안 그룹 아웃바운드에서 S3 주소만 허용하고 서비스 경로는 만들지 않는다.
            answers:
              - 버킷 정책에서 지정한 VPC 엔드포인트를 통과한 접근으로 제한한다.
              - S3 게이트웨이 엔드포인트를 생성하고 해당 서브넷 라우트 테이블에 연결한다.
            options:
              - 버킷 정책에서 지정한 VPC 엔드포인트를 통과한 접근으로 제한한다.
              - S3 엔드포인트 정책만 쓰고 버킷의 다른 경로 접근 허용은 그대로 둔다.
              - 인터넷 NAT를 만들고 버킷 정책에는 역할 허용만 설정한다.
              - 보안 그룹 아웃바운드에서 S3 주소만 허용하고 서비스 경로는 만들지 않는다.
              - S3 게이트웨이 엔드포인트를 생성하고 해당 서브넷 라우트 테이블에 연결한다.
      - id: Q22-58
        type: mcq
        title: Q22-58 · 모의고사 A
        explain: |
          <p>Compliance Vault Lock은 유예 기간이 끝난 뒤 복구 지점이 남아 있는 동안 관리자·root도 잠금과 복구 지점의 보호를 변경할 수 없게 한다. 최소·최대 90일과 복사 시 90일 수명 주기를 맞추면 조기 삭제를 막으면서 만료 후 불필요한 영구 보존을 피한다. 기존 복구 지점이 있다면 각각의 수명 주기를 고정 전에 검증해야 하며, 계정 폐쇄 위협은 지문에서 별도 통제로 제외했다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>최소·최대 보존 90일의 Vault Lock governance를 설정하고 관리자 승인을 받게 한다.</td>
          <td>Governance는 권한 있는 주체가 잠금을 제거할 수 있다. 관리자 승인 절차가 같은 계정의 root 탈취에 대한 불변성을 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>보관함 접근 정책으로 DeleteRecoveryPoint를 거부하고 백업의 만료를 90일로 둔다.</td>
          <td>삭제 거부 정책은 일반 작업을 막지만 그 정책 자체를 변경·삭제할 권한을 가진 계정 관리자·root에 대한 불변 보존이 아니다.</td>
          </tr>
          <tr>
          <td>복사 작업의 보존 기간을 90일로 지정하고 삭제 작업의 CloudTrail 경보를 설정한다.</td>
          <td>수명 주기는 정상 만료를 정하고 CloudTrail은 작업을 탐지한다. 권한 탈취 주체의 조기 삭제를 예방하는 잠금은 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html">AWS Backup Vault Lock 모드와 유예 기간</a> · <a href="https://docs.aws.amazon.com/aws-backup/latest/devguide/create-a-vault-access-policy.html">보관함 접근 정책</a> · <a href="https://docs.aws.amazon.com/aws-backup/latest/APIReference/API_DeleteBackupVaultAccessPolicy.html">보관함 접근 정책 삭제 API</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: EBS 백업을 별도 보관 계정의 AWS Backup 보관함에 복사한다. 복사 작업은 새 복구 지점에 90일 수명 주기를 지정하며 만료 후
              삭제돼야 한다. 이번 위협 모델은 보관 계정의 관리자와 root 자격 증명까지 탈취되는 경우이며, 계정 폐쇄는 별도
              조직 통제로 막았다. 검증 기간을 거친 뒤에는 90일 이전 삭제나 보존 단축을 그 주체들도 할 수 없어야 한다. 적합한
              설정은 무엇인가?
            answer: 최소·최대 보존 90일의 Vault Lock compliance를 설정하고 유예 기간 후 고정한다.
            wrong:
              - 최소·최대 보존 90일의 Vault Lock governance를 설정하고 관리자 승인을 받게 한다.
              - 보관함 접근 정책으로 DeleteRecoveryPoint를 거부하고 백업의 만료를 90일로 둔다.
              - 복사 작업의 보존 기간을 90일로 지정하고 삭제 작업의 CloudTrail 경보를 설정한다.
      - id: Q22-59
        type: mcq
        title: Q22-59 · 모의고사 A
        explain: |
          <p>NAT 수만 줄이면 교차 AZ 경로 비용과 장애 의존성이 늘 수 있다. 실제 경로·전송량을 파악하고 추가 NAT 고정 비용과 절감 전송 비용을 함께 비교해야 가용성을 유지한 최적화를 할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 앱을 단일 AZ로 이전해 교차 AZ 경로를 없앤다.</td>
          <td>전송 비용은 줄 수 있지만 가용성을 유지해야 한다는 조건을 위반한다.</td>
          </tr>
          <tr>
          <td>모든 S3·인터넷 목적지를 한 AZ의 중앙 NAT로 통합하고 대역폭만 늘린다.</td>
          <td>목적지별 경로 최적화 없이 중앙 집중하면 교차 AZ 경로와 AZ 의존성이 계속 남는다.</td>
          </tr>
          <tr>
          <td>NAT 시간 요금만 비교하고 교차 AZ 전송량은 비용 모델에서 제외한다.</td>
          <td>고정 비용만 보면 대량 교차 AZ 경로의 비용을 놓쳐 총비용 결론이 틀릴 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html">NAT pricing considerations</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: 국내 앱 서버가 주로 같은 AZ의 백엔드와 통신하도록 배치돼 있지만 비용 보고서는 대량 교차 AZ 전송을 보여 준다. 모든 사설 서버가
              다른 AZ의 한 NAT를 거쳐 인터넷 데이터를 받는다. 가용성을 유지하며 비용 판단에 필요한 두 조치는 무엇인가?
            answer: 서브넷별 실제 NAT 경로와 교차 AZ 데이터 양을 확인한다.
            wrong:
              - 모든 앱을 단일 AZ로 이전해 교차 AZ 경로를 없앤다.
              - 모든 S3·인터넷 목적지를 한 AZ의 중앙 NAT로 통합하고 대역폭만 늘린다.
              - NAT 시간 요금만 비교하고 교차 AZ 전송량은 비용 모델에서 제외한다.
            answers:
              - 서브넷별 실제 NAT 경로와 교차 AZ 데이터 양을 확인한다.
              - AZ별 로컬 NAT 비용과 기존 교차 AZ·처리 비용을 합산해 비교한다.
            options:
              - 모든 앱을 단일 AZ로 이전해 교차 AZ 경로를 없앤다.
              - 모든 S3·인터넷 목적지를 한 AZ의 중앙 NAT로 통합하고 대역폭만 늘린다.
              - 서브넷별 실제 NAT 경로와 교차 AZ 데이터 양을 확인한다.
              - AZ별 로컬 NAT 비용과 기존 교차 AZ·처리 비용을 합산해 비교한다.
              - NAT 시간 요금만 비교하고 교차 AZ 전송량은 비용 모델에서 제외한다.
      - id: Q22-60
        type: mcq
        title: Q22-60 · 모의고사 A
        explain: |
          <p>EBS 기반 EC2를 중지해 데이터는 유지하고 미사용 컴퓨팅 시간을 줄인다. 자동 퍼블릭 IPv4는 재시작 때 바뀔 수 있으므로 고정 허용 목록에는 Elastic IP를 사용하며 EBS와 IPv4 등 별도 과금은 남는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Elastic IP와 EBS를 유지하고 업무 외에는 앱 프로세스의 종료·시작을 예약한다.</td>
          <td>주소와 데이터는 유지하지만 EC2가 running인 동안 앱 프로세스가 없어도 인스턴스 사용 비용이 발생한다.</td>
          </tr>
          <tr>
          <td>Elastic IP를 보관하고 매일 스냅샷 후 EC2를 종료해 아침에 복원·주소 재연결한다.</td>
          <td>백업·복원·Elastic IP 재연결 자동화로 구현할 수는 있다. 그러나 EBS 기반 인스턴스를 중지해 그대로 다시 시작하는 것보다 매일 복구 절차와 추가 스냅샷 관리가 필요하다.</td>
          </tr>
          <tr>
          <td>EBS와 자동 할당 퍼블릭 IPv4 설정을 유지하고 EC2 중지·시작을 예약한다.</td>
          <td>미사용 컴퓨팅 시간은 줄이고 EBS도 남지만 자동 할당 퍼블릭 IPv4는 재시작 시 달라질 수 있어 고정 허용 목록 요구를 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Stop_Start.html">EC2 stop and start</a> · <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/elastic-ip-addresses-eip.html">Elastic IP addresses</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 테스트용 EC2는 평일 낮에만 필요하고 밤에는 계산을 하지 않는다. EBS 데이터는 다음 날 그대로 필요하지만 RAM 보존은 필요 없다.
              지금은 24시간 켜져 있다. 외부 시험 API는 서버의 고정 퍼블릭 IPv4를 허용 목록에 넣었으므로 재시작 후에도
              주소가 같아야 한다. 약정을 새로 사기 전에 할 수 있는 가장 직접적인 절감은 무엇인가?
            answer: Elastic IP를 연결하고 업무 외 시간의 EC2 중지·시작을 예약한다.
            wrong:
              - Elastic IP와 EBS를 유지하고 업무 외에는 앱 프로세스의 종료·시작을 예약한다.
              - Elastic IP를 보관하고 매일 스냅샷 후 EC2를 종료해 아침에 복원·주소 재연결한다.
              - EBS와 자동 할당 퍼블릭 IPv4 설정을 유지하고 EC2 중지·시작을 예약한다.
      - id: Q22-61
        type: mcq
        title: Q22-61 · 모의고사 A
        explain: |
          <p>응답을 바꾸는 lang은 캐시 키에 포함해야 언어가 다른 응답이 섞이지 않는다. 응답과 무관한 tracking을 키에서 빼면 방문마다 캐시가 분할되지 않는다. 키에 포함한 lang은 원본으로 자동 전달되고, 별도 origin request policy로 tracking을 캐시 미스 원본 요청에 추가한다. 모든 방문의 집계가 아니라 캐시 미스 집계라는 요구이므로 원본 전달만으로 충분하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>캐시 키에 lang과 tracking을 모두 넣고 원본에 두 값을 전달한다.</td>
          <td>언어별 응답과 원본 집계는 맞지만 요청마다 다른 tracking이 캐시를 잘게 나누어 적중률을 낮춘다.</td>
          </tr>
          <tr>
          <td>캐시 키에서 쿼리를 제외하고 origin request policy로 두 값을 전달한다.</td>
          <td>캐시 미스에서는 원본이 언어를 구분하지만 lang이 키에 없으므로 이후 다른 언어 요청에 이미 캐시된 응답을 줄 수 있다.</td>
          </tr>
          <tr>
          <td>CachingDisabled 정책을 사용하고 origin request policy로 두 값을 전달한다.</td>
          <td>언어 정확성과 원본 전달은 충족하지만 매번 원본을 호출하므로 목표인 캐시 적중률 개선을 제공하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html">CloudFront 캐시 키 정책</a> · <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-origin-requests.html">CloudFront 원본 요청 정책</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: CloudFront와 ALB 원본으로 공개 매뉴얼을 제공한다. 같은 경로라도 lang=ko와 lang=en의 응답 내용이 다르다.
              tracking 쿼리 값은 요청마다 바뀌지만 응답 내용에는 영향을 주지 않는다. 원본은 캐시 미스 때 tracking
              값을 받아 접속을 집계해야 한다. 언어별 정확한 응답을 유지하면서 캐시 적중률을 높일 정책 조합은 무엇인가?
            answer: 캐시 키에는 lang을 넣고 origin request policy로 tracking을 추가 전달한다.
            wrong:
              - 캐시 키에 lang과 tracking을 모두 넣고 원본에 두 값을 전달한다.
              - 캐시 키에서 쿼리를 제외하고 origin request policy로 두 값을 전달한다.
              - CachingDisabled 정책을 사용하고 origin request policy로 두 값을 전달한다.
      - id: Q22-62
        type: mcq
        title: Q22-62 · 모의고사 A
        explain: |
          <p>48시간 중단과 따라잡기 여유를 수용하도록 보존을 사전에 72시간으로 늘린다. 기존 lease table의 체크포인트를 재사용하면 마지막 확정 처리 위치부터 이어 읽는다. 새 lease table의 LATEST는 중단 중 레코드를 건너뛰고, TRIM_HORIZON은 보존 중인 가장 오래된 데이터부터 읽어 중단 전 이미 처리한 분량까지 다시 읽는다. EFO는 읽기 처리량을 분리하지만 만료된 레코드를 복원하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>중단 전에 보존을 72시간으로 늘리고 새 lease table에서 LATEST로 시작한다.</td>
          <td>72시간 보존으로 데이터는 남지만 새 lease의 LATEST는 재시작 시점의 최신 끝에서 시작하므로 중단 중 쌓인 레코드를 처리하지 않는다.</td>
          </tr>
          <tr>
          <td>보존은 24시간으로 두고 기존 체크포인트를 사용하며 enhanced fan-out으로 전환한다.</td>
          <td>48시간 후에는 중단 초반 레코드가 24시간 보존 범위를 벗어난다. Enhanced fan-out으로 빨리 읽어도 이미 만료된 레코드는 복구할 수 없다.</td>
          </tr>
          <tr>
          <td>중단 전에 보존을 72시간으로 늘리고 새 lease table에서 TRIM_HORIZON으로 시작한다.</td>
          <td>누락을 피할 수 있지만 72시간 보존의 가장 오래된 레코드부터 다시 읽는다. 중단 직전까지 이미 처리한 과거 분량도 재처리하므로 기존 체크포인트 재사용보다 비용이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/streams/latest/dev/kinesis-extended-retention.html">Kinesis 보존 기간 조정</a> · <a href="https://docs.aws.amazon.com/streams/latest/dev/kcl-concepts.html">KCL 체크포인트와 재시작</a> · <a href="https://docs.aws.amazon.com/streams/latest/dev/kcl-dynamoDB.html">KCL lease table 상태</a> · <a href="https://docs.aws.amazon.com/kinesis/latest/APIReference/API_StartingPosition.html">스트림 읽기 시작 위치</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: KCL 소비자를 계획된 정비로 48시간 중지하는 동안에도 Kinesis Data Streams 유입은 계속된다. 중단 직전까지 처리는
              최신이며 DynamoDB lease table의 체크포인트는 정상 보존된다. 재시작 후 12시간 이내 따라잡을 처리
              용량을 확보했고 로직은 멱등하다. 기본 보존 기간은 24시간이다. 중단 중 데이터의 누락을 막고 이미 처리한 과거
              데이터의 불필요한 재처리 비용을 줄일 구성은 무엇인가?
            answer: 중단 전에 보존을 72시간으로 늘리고 기존 lease table의 체크포인트에서 재개한다.
            wrong:
              - 중단 전에 보존을 72시간으로 늘리고 새 lease table에서 LATEST로 시작한다.
              - 보존은 24시간으로 두고 기존 체크포인트를 사용하며 enhanced fan-out으로 전환한다.
              - 중단 전에 보존을 72시간으로 늘리고 새 lease table에서 TRIM_HORIZON으로 시작한다.
      - id: Q22-63
        type: mcq
        title: Q22-63 · 모의고사 A
        explain: |
          <p>멤버 계정에 적용되는 SCP의 명시적 거부는 계정 내부 관리자 허용보다 우선하므로 개별 역할 변경으로 우회할 수 없는 조직 권한 상한을 구성할 수 있다. 실제 업무 권한은 별도로 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>개발 역할에 리전별 허용을 추가한 고객 관리형 정책만 배포한다.</td>
          <td>같은 계정의 관리자가 허용 정책을 변경할 수 있어 조직 상한을 강제하지 못한다.</td>
          </tr>
          <tr>
          <td>각 개발 역할의 permissions boundary만 계정 관리자가 자유롭게 수정하도록 설정한다.</td>
          <td>경계 자체는 상한이지만 계정 관리자에게 수정이 허용되면 조직 차원의 우회 불가 통제가 아니다.</td>
          </tr>
          <tr>
          <td>리전 사용을 CloudTrail로 감지해 알림만 보내고 생성 권한은 그대로 둔다.</td>
          <td>사후 감사는 금지 리전 생성의 예방적 거부를 대신하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html">Service control policies</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 조직의 한 멤버 계정에서 개발 역할에 관리자 권한을 부여했다. 그러나 조직에서 금지한 리전의 EC2 생성은 계속 거부돼야 하고, 관리자는
              개별 역할 정책 변경으로 이 제한을 풀 수 없어야 한다. 어떤 통제가 적합한가?
            answer: 해당 계정이 속한 OU의 SCP에서 금지 리전 작업을 명시적으로 거부한다.
            wrong:
              - 개발 역할에 리전별 허용을 추가한 고객 관리형 정책만 배포한다.
              - 각 개발 역할의 permissions boundary만 계정 관리자가 자유롭게 수정하도록 설정한다.
              - 리전 사용을 CloudTrail로 감지해 알림만 보내고 생성 권한은 그대로 둔다.
      - id: Q22-64
        type: mcq
        title: Q22-64 · 모의고사 A
        explain: |
          <p>이기종 DB 이전은 스키마·코드 호환성과 데이터 이관을 함께 다뤄야 한다. 전체 적재 뒤 CDC로 변경을 따라가고 전환 시 쓰기·지연·정합성을 검증하면 중단을 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>전체 적재만 수행하고 원본의 이후 쓰기는 전환 때까지 별도로 반영하지 않는다.</td>
          <td>원본 변경이 계속 발생하므로 전환 시 최신 데이터 격차가 남는다.</td>
          </tr>
          <tr>
          <td>DMS 전체 적재·CDC를 사용하되 스키마·SQL 호환성 평가는 생략한다.</td>
          <td>데이터 복제만으로 이기종 엔진의 저장 프로시저·자료형·SQL 차이가 해결되지는 않는다.</td>
          </tr>
          <tr>
          <td>원본 전체 쓰기를 이관 전 기간 중지하고 백업을 대상에 한 번 복원한다.</td>
          <td>가능한 오프라인 방식이지만 전환 직전까지 원본 쓰기를 유지하려는 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html">DMS ongoing replication</a> · <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html">DMS schema conversion</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: 온프레미스 주문 DB를 지원되는 다른 엔진으로 옮긴다. 원본은 전환 직전까지 쓰기를 계속해야 하며 단순 파일 복사 대신 변경 데이터를
              따라가야 한다. 앱 SQL과 저장 프로시저의 호환성도 확인해야 한다. 적합한 이관 방식은 무엇인가?
            answer: 스키마 변환을 평가·수정하고 DMS 전체 적재와 CDC 후 지연을 확인해 전환한다.
            wrong:
              - 전체 적재만 수행하고 원본의 이후 쓰기는 전환 때까지 별도로 반영하지 않는다.
              - DMS 전체 적재·CDC를 사용하되 스키마·SQL 호환성 평가는 생략한다.
              - 원본 전체 쓰기를 이관 전 기간 중지하고 백업을 대상에 한 번 복원한다.
      - id: Q22-65
        type: mcq
        title: Q22-65 · 모의고사 A
        explain: |
          <p>작은 랜덤 I/O의 지속 IOPS와 지연 요구에는 프로비저닝 IOPS SSD를 검토한다. 볼륨만 높여도 인스턴스 EBS 대역폭에 막힐 수 있으므로 양쪽 한계를 맞춰야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>같은 EBS 볼륨을 유지하고 EC2 CPU 코어만 늘린다.</td>
          <td>현재 관측 병목은 낮은 CPU가 아니라 볼륨 IOPS이므로 CPU 증설만으로 원인을 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>st1 HDD로 바꿔 큰 순차 I/O의 처리량을 우선한다.</td>
          <td>큰 순차 처리량 중심 HDD는 작은 랜덤 IOPS·지연 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>현재 gp2 볼륨 용량만 늘리고 인스턴스 EBS 한계는 확인하지 않는다.</td>
          <td>IOPS 일부는 달라질 수 있으나 불필요 용량 증설과 실제 인스턴스 병목을 함께 고려하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html">EBS volume types</a>
          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: DB를 직접 운영하는 EC2에서 작은 랜덤 읽기·쓰기가 많고 지연이 중요하다. CPU 사용률은 낮지만 현재 범용 EBS의 IOPS 한계에
              도달했다. 용량을 불필요하게 크게 늘리지 않고 지속적인 고성능 블록 I/O를 확보하려면 무엇을 검토하는가?
            answer: 필요 IOPS의 io2 볼륨과 해당 성능을 지원하는 EBS 최적화 인스턴스를 사용한다.
            wrong:
              - 같은 EBS 볼륨을 유지하고 EC2 CPU 코어만 늘린다.
              - st1 HDD로 바꿔 큰 순차 I/O의 처리량을 우선한다.
              - 현재 gp2 볼륨 용량만 늘리고 인스턴스 EBS 한계는 확인하지 않는다.
