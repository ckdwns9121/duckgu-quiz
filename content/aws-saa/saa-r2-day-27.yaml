      - id: saa-r2-Q27-65
        source_id: Q27-65
        type: mcq
        title: Q27-65 · 모의고사 C
        explain: |
          <p>Regional NAT 자동 모드는 워크로드 AZ에 맞춘 확장을 통해 AZ별 NAT 운영 부담을 줄일 수 있다. 실제 AZ 확장 시간·라우팅과 비용을 검증해야 하며 하나의 ID가 모든 AZ를 단일 AZ 가격으로 제공한다는 뜻은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 Zonal NAT를 AZ마다 유지하고 신규 AZ를 열 때마다 같은 수동 절차를 반복한다</td>
          <td>AZ별 Zonal NAT는 가용성을 구성할 수 있지만 신규 AZ마다 반복하는 현재 운영 부담을 줄이지 못한다.</td>
          </tr>
          <tr>
          <td>NAT 인스턴스 ASG를 AZ마다 두고 패치와 경로 전환을 자체 자동화한다</td>
          <td>NAT 인스턴스로 출구를 만들 수는 있지만 OS 패치·용량·장애 전환·경로 관리를 직접 운영해야 해 관리형 자동 확장보다 운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>한 AZ의 Zonal NAT로 모든 경로를 모아 NAT 생성 작업과 시간 요금만 줄인다</td>
          <td>중앙 Zonal NAT는 다른 AZ 앱의 출구까지 한 AZ에 의존하게 하므로 높은 가용성 조건을 약화시키고 교차 AZ 비용도 생길 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html">Regional NAT gateways for automatic multi-AZ expansion - Amazon Virtual Private Cloud</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-04.html#zonal%EA%B3%BC-regional%EC%9D%98-%EC%9E%A5%EC%95%A0-%EB%B2%94%EC%9C%84%EC%99%80-%EB%B9%84%EC%9A%A9">Regional 자동 모드는 워크로드에 맞춰 AZ 범위를 관리해 반복 배치 작업을 줄인다</a> · <a href="/study/lessons/deep-dive/day-04.html#zonal%EA%B3%BC-regional%EC%9D%98-%EC%9E%A5%EC%95%A0-%EB%B2%94%EC%9C%84%EC%99%80-%EB%B9%84%EC%9A%A9">NAT ID 하나가 반드시 한 AZ에만 의존한다는 뜻은 아니다</a> · <a href="/study/lessons/deep-dive/day-04.html#zonal%EA%B3%BC-regional%EC%9D%98-%EC%9E%A5%EC%95%A0-%EB%B2%94%EC%9C%84%EC%99%80-%EB%B9%84%EC%9A%A9">확장 시간과 실제 AZ별 시간·처리 비용을 검토해야 관리 단순화와 총비용을 비교할 수 있다</a></p>
        quizzes:
          - q: 인터넷 API를 호출하는 비공개 앱이 AZ를 자주 추가한다. 팀은 각 AZ의 Zonal NAT와 경로를 수동 추가하는 작업을 줄이면서 높은
              가용성을 유지하려 한다. 해당 리전은 Regional NAT 자동 모드를 지원한다. 가장 적절한 도입 판단은?
            answer: Regional 자동 모드의 AZ 확장·출구 경로와 AZ별 비용을 확인해 전환을 검증한다
            wrong:
              - 기존 Zonal NAT를 AZ마다 유지하고 신규 AZ를 열 때마다 같은 수동 절차를 반복한다
              - NAT 인스턴스 ASG를 AZ마다 두고 패치와 경로 전환을 자체 자동화한다
              - 한 AZ의 Zonal NAT로 모든 경로를 모아 NAT 생성 작업과 시간 요금만 줄인다
