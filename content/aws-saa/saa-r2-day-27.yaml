id: saa-r2-day-27
name: 모의고사 C
part: 27일 차
color: "#4385ef"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: saa-r2-Q27-01
        source_id: Q27-01
        type: mcq
        title: Q27-01 · 모의고사 C
        explain: |
          <p>기존 ReportRole의 제한된 작업 권한을 그대로 사용하려면 개발 역할의 sts:AssumeRole 허용과 운영 역할의 신뢰가 모두 필요하다. 회사 로그인에서 해당 역할을 받을 그룹을 관리하면 신규 세션 발급도 중앙에서 통제할 수 있다. 이미 발급된 세션의 즉시 회수까지 보장한다는 뜻은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>개발 역할에 보고서 GetObject를 허용하고 운영 역할의 신뢰 정책은 그대로 둔다</td>
          <td>GetObject 신원 허용만으로 신뢰가 없는 대상 역할을 맡을 수 없다. 이 설계는 기존 ReportRole을 사용하는 요구를 해결하지 않는다.</td>
          </tr>
          <tr>
          <td>운영 IAM 사용자 키를 Secrets Manager에 보관해 분석가 그룹이 조회하게 한다</td>
          <td>비밀 저장소는 키 배포를 숨길 뿐 운영 계정의 장기 사용자 키를 만들고 공유해야 하는 구조가 남는다.</td>
          </tr>
          <tr>
          <td>운영 관리자 역할을 개발 계정에 위임하고 콘솔의 보고서 경로만 안내한다</td>
          <td>관리자 역할의 실제 권한은 콘솔에서 안내한 경로로 제한되지 않는다. 지정 보고서만 읽는 최소 권한을 벗어난다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html">IAM tutorial: Delegate access across AWS accounts using IAM roles - AWS Identity and Access Management</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#assumerole%EA%B3%BC-%EB%91%90-%EB%B2%88%EC%9D%98-%EA%B6%8C%ED%95%9C-%ED%8C%90%EB%8B%A8">교차 계정 역할 전환은 호출자 허용과 대상 역할의 신뢰를 연결한다</a> · <a href="/study/lessons/deep-dive/day-01.html#assumerole%EA%B3%BC-%EB%91%90-%EB%B2%88%EC%9D%98-%EA%B6%8C%ED%95%9C-%ED%8C%90%EB%8B%A8">대상 역할의 S3 범위를 보고서로 제한하면 장기 키 배포 없이 필요한 접근만 제공한다</a></p>
        quizzes:
          - q: 개발 계정의 분석가들은 회사 로그인으로 접속한다. 운영 계정의 ReportRole은 보고서 접두사 읽기만 허용하지만 아직 교차 계정 신뢰가
              없다. 퇴사자 그룹 배정은 중앙에서 회수하며 기존 회사·AWS 세션의 만료 이후 신규 접근을 막으면 된다. 운영 계정에
              사용자 키를 발급하지 않을 때 가장 적절한 연결은?
            answer: ReportRole이 지정 개발 역할을 신뢰하게 하고 그 역할에 AssumeRole을 허용한다
            wrong:
              - 개발 역할에 보고서 GetObject를 허용하고 운영 역할의 신뢰 정책은 그대로 둔다
              - 운영 IAM 사용자 키를 Secrets Manager에 보관해 분석가 그룹이 조회하게 한다
              - 운영 관리자 역할을 개발 계정에 위임하고 콘솔의 보고서 경로만 안내한다
      - id: saa-r2-Q27-02
        source_id: Q27-02
        type: mcq
        title: Q27-02 · 모의고사 C
        explain: |
          <p>생성 시 지정 경계를 강제하고 이후 제거·교체 경로를 함께 제한해야 상한이 계속 유지된다. 경계는 역할이 사용할 수 있는 권한의 최대 범위이며 별도의 업무 Allow 정책이 있어야 실제 작업이 가능하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>개발자 자신의 역할에만 경계를 연결하고 생성 역할에는 적용하지 않는다</td>
          <td>개발자 본인의 경계가 그 개발자가 새로 만든 역할에 자동으로 상속되지는 않는다.</td>
          </tr>
          <tr>
          <td>역할 생성 후 Config로 경계 누락을 탐지하고 다음 날 일괄 수정한다</td>
          <td>사후 탐지는 경계 없는 역할을 사용할 수 있는 시간 창을 남기므로 생성 시점부터 우회를 막으라는 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>생성 역할의 신뢰를 EC2로 제한하고 연결할 작업 정책은 자유롭게 둔다</td>
          <td>신뢰 정책은 역할을 맡는 주체를 정한다. EC2가 역할을 맡은 뒤 실행하는 AWS API 권한의 상한을 대신하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html">Permissions boundaries for IAM entities - AWS Identity and Access Management</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">권한 경계는 최대 범위이며 자체로 권한을 주지 않는다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">역할 생성 시 지정 경계를 강제하고 변경·제거 경로도 통제해야 개발자의 새 역할 생성으로 상한을 우회하지 못한다</a></p>
        quizzes:
          - q: 개발자는 승인된 서비스만 사용하는 배포 역할을 직접 생성해야 한다. 회사는 지정 permissions boundary를 상한으로 사용하며
              업무 권한은 각 역할에 별도 연결한다. 개발자에게 CreateRole과 정책 연결을 계속 허용하면서, 경계 없는 역할을
              만들거나 나중에 경계를 바꾸는 우회를 막으려면 어떤 두 통제가 필요한가?
            answer: CreateRole 허용 조건에서 지정 경계 ARN의 연결을 요구한다
            wrong:
              - 개발자 자신의 역할에만 경계를 연결하고 생성 역할에는 적용하지 않는다
              - 역할 생성 후 Config로 경계 누락을 탐지하고 다음 날 일괄 수정한다
              - 생성 역할의 신뢰를 EC2로 제한하고 연결할 작업 정책은 자유롭게 둔다
            answers:
              - CreateRole 허용 조건에서 지정 경계 ARN의 연결을 요구한다
              - 개발자의 경계 제거와 승인되지 않은 경계로의 변경을 제한한다
            options:
              - 개발자 자신의 역할에만 경계를 연결하고 생성 역할에는 적용하지 않는다
              - 역할 생성 후 Config로 경계 누락을 탐지하고 다음 날 일괄 수정한다
              - 생성 역할의 신뢰를 EC2로 제한하고 연결할 작업 정책은 자유롭게 둔다
              - CreateRole 허용 조건에서 지정 경계 ARN의 연결을 요구한다
              - 개발자의 경계 제거와 승인되지 않은 경계로의 변경을 제한한다
      - id: saa-r2-Q27-03
        source_id: Q27-03
        type: mcq
        title: Q27-03 · 모의고사 C
        explain: |
          <p>IAM Identity Center는 외부 신원 공급자와 그룹, 권한 세트, 계정 배정을 중앙에서 관리하는 용도다. 계정별 SAML 연동도 인증은 가능하지만 현재 문제인 다중 계정 권한 배정과 회수의 개별 운영을 계속 남긴다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>회사 IdP에서 인증한 뒤 계정별 IAM 사용자 키를 저장소에서 가져오게 한다</td>
          <td>SAML 인증 뒤에도 사람별 장기 IAM 키의 발급·회전·회수 체계가 남아 중앙 역할 배정보다 운영이 많다.</td>
          </tr>
          <tr>
          <td>계정마다 같은 이름의 IAM 그룹을 만들고 별도 사용자 목록을 동기화한다</td>
          <td>IAM 그룹은 계정 간 공통 신원이 아니므로 같은 이름을 붙여도 여러 계정의 권한 배정을 중앙화하지 못한다.</td>
          </tr>
          <tr>
          <td>각 계정에 SAML 역할을 유지하고 퇴사 때 모든 역할의 신뢰를 개별 수정한다</td>
          <td>직접 SAML 역할을 계정별로 관리하는 방식은 가능하지만 문제의 개별 신뢰·정책 관리 부담을 없애지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html">What is IAM Identity Center? - AWS IAM Identity Center</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-12.html#%EC%A7%81%EC%9B%90-%EB%B0%B0%EC%A0%95%EA%B3%BC-%EA%B8%B0%EC%A1%B4-%EA%B3%84%EC%A0%95-%EB%93%B1%EB%A1%9D">직원들의 다중 계정 접근과 권한 세트 배정은 IAM Identity Center의 용도다</a> · <a href="/study/lessons/deep-dive/day-11.html#%ED%9A%8C%EC%9B%90-%EC%9D%B8%EC%A6%9Daws-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85%EC%A7%81%EC%9B%90-%EB%94%94%EB%A0%89%ED%84%B0%EB%A6%AC">외부 신원 연동의 지원 방식도 확인하면서 중앙 사용자 수명 주기와 계정 접근을 연결한다</a></p>
        quizzes:
          - q: 인수한 자회사를 포함해 AWS 계정이 40개다. 직원은 기존 SAML IdP로 로그인하고 직무별 AWS 접근을 중앙에서 배정해야 한다.
              현재는 계정마다 SAML 역할과 정책을 고쳐 퇴사자 제거가 누락된다. 계정별 설정 복제를 가장 줄이는 방법은?
            answer: 외부 IdP를 IAM Identity Center와 연동하고 그룹·권한 세트를 계정에 배정한다
            wrong:
              - 회사 IdP에서 인증한 뒤 계정별 IAM 사용자 키를 저장소에서 가져오게 한다
              - 계정마다 같은 이름의 IAM 그룹을 만들고 별도 사용자 목록을 동기화한다
              - 각 계정에 SAML 역할을 유지하고 퇴사 때 모든 역할의 신뢰를 개별 수정한다
      - id: saa-r2-Q27-04
        source_id: Q27-04
        type: mcq
        title: Q27-04 · 모의고사 C
        explain: |
          <p>인스턴스 프로파일 역할은 EC2 앱에 임시 자격 증명을 제공하며 SDK 기본 제공자는 갱신된 값을 사용한다. 역할 정책에서 settlements/*의 GetObject만 허용하면 권한 범위도 제한된다. 다른 자격 증명을 환경 변수에 고정하면 기본 역할 경로보다 우선해 갱신을 방해할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>첫 부팅 때 STS 세션을 한 번 받아 파일에 저장하고 이후 파일만 읽게 한다</td>
          <td>한 번 발급한 STS 값은 만료된다. 파일만 계속 읽는 앱은 갱신된 임시 자격 증명을 가져오지 못한다.</td>
          </tr>
          <tr>
          <td>IAM 사용자 키를 부팅 시 Secrets Manager에서 받아 환경 변수에 고정한다</td>
          <td>Secret에 보관해도 장기 사용자 키의 회전과 부트스트랩 권한이 필요하다. 파일·환경 변수에 고정한 값은 자동 역할 갱신 경로를 활용하지 않는다.</td>
          </tr>
          <tr>
          <td>배포 파이프라인이 AssumeRole한 값을 AMI에 기록하고 매월 이미지를 교체한다</td>
          <td>AMI에 임시 값을 기록하면 금지된 자격 증명 포함과 세션 만료를 모두 해결하지 못한다. 월 단위 이미지 교체로 세션 수명을 늘릴 수도 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html">Use an IAM role to grant permissions to applications running on Amazon EC2 instances - AWS Identity and Access Management</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#ec2-%EC%97%AD%ED%95%A0%EA%B3%BC-sdk-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85-%EC%A0%9C%EA%B3%B5%EC%9E%90">EC2 역할은 임시 자격 증명을 제공하고 SDK는 지원 경로로 이를 사용·갱신한다</a> · <a href="/study/lessons/deep-dive/day-01.html#ec2-%EC%97%AD%ED%95%A0%EA%B3%BC-sdk-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85-%EC%A0%9C%EA%B3%B5%EC%9E%90">역할 정책의 리소스를 접두사로 한정하면 이미지에 장기 키를 넣지 않아도 된다</a></p>
        quizzes:
          - q: Auto Scaling 그룹의 EC2 정산 앱은 매시간 S3의 settlements/ 객체를 읽는다. 새 인스턴스는 같은 AMI로 교체되며
              앱은 AWS SDK를 사용한다. 자격 증명을 AMI에 넣을 수 없고, 만료될 때마다 배포하거나 파일을 바꾸지 않아야
              한다. 가장 적절한 구성은?
            answer: 접두사 읽기 역할을 인스턴스 프로파일로 연결하고 SDK 기본 제공자를 사용한다
            wrong:
              - 첫 부팅 때 STS 세션을 한 번 받아 파일에 저장하고 이후 파일만 읽게 한다
              - IAM 사용자 키를 부팅 시 Secrets Manager에서 받아 환경 변수에 고정한다
              - 배포 파이프라인이 AssumeRole한 값을 AMI에 기록하고 매월 이미지를 교체한다
      - id: saa-r2-Q27-05
        source_id: Q27-05
        type: mcq
        title: Q27-05 · 모의고사 C
        explain: |
          <p>값의 일치를 검사하는 ABAC 정책과 권한 판단용 태그의 통제가 함께 필요하다. 일치 검사만 두고 사용자가 주체·세션·리소스 태그를 임의로 바꿀 수 있으면 다른 프로젝트로 가장할 수 있다. 생성 시 요청 태그와 이후 변경 경로를 함께 관리한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>리소스에 Project 태그가 있는지만 확인하는 공통 허용 조건을 둔다</td>
          <td>태그의 존재 여부는 프로젝트 소속 일치를 보장하지 않아 다른 팀의 태그 있는 자원도 통과할 수 있다.</td>
          </tr>
          <tr>
          <td>프로젝트별 ARN 목록 정책을 복제하고 태그 변경은 각 팀에 맡긴다</td>
          <td>ARN별 정책 복제는 프로젝트 증가에 따른 반복 관리를 남긴다. 이 선택은 공유 태그 정책을 안전하게 재사용하려는 요구와 다르다.</td>
          </tr>
          <tr>
          <td>비용 할당 태그를 켜고 태그가 같은 비용 센터의 변경 요청을 모두 허용한다</td>
          <td>비용 할당 태그는 청구 분류 용도이며 그 설정 자체가 API 인가를 수행하거나 태그 변조를 막지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html">Define permissions based on attributes with ABAC authorization - AWS Identity and Access Management</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">속성 기반 접근은 정책이 태그를 조건으로 평가할 때 작동한다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">태그가 권한 경계의 일부라면 태그 편집도 제한해야 속성을 바꿔 접근을 우회하는 것을 막을 수 있다</a></p>
        quizzes:
          - q: 수십 개 프로젝트가 동일한 개발 역할 정책을 재사용한다. 지원되는 API에서 주체와 리소스의 Project 값이 같을 때만 변경을 허용하고
              싶다. 개발자는 자원을 만들 수 있지만 자기 Project 값을 바꾸거나 다른 프로젝트 자원에 자기 태그를 붙여
              접근하면 안 된다. 함께 적용할 두 설계는?
            answer: 권한 판단용 태그의 생성 값과 변경 주체를 제한한다
            wrong:
              - 리소스에 Project 태그가 있는지만 확인하는 공통 허용 조건을 둔다
              - 프로젝트별 ARN 목록 정책을 복제하고 태그 변경은 각 팀에 맡긴다
              - 비용 할당 태그를 켜고 태그가 같은 비용 센터의 변경 요청을 모두 허용한다
            answers:
              - 권한 판단용 태그의 생성 값과 변경 주체를 제한한다
              - 주체·리소스의 Project 값 일치를 비교하는 ABAC 허용 조건을 둔다
            options:
              - 권한 판단용 태그의 생성 값과 변경 주체를 제한한다
              - 리소스에 Project 태그가 있는지만 확인하는 공통 허용 조건을 둔다
              - 프로젝트별 ARN 목록 정책을 복제하고 태그 변경은 각 팀에 맡긴다
              - 비용 할당 태그를 켜고 태그가 같은 비용 센터의 변경 요청을 모두 허용한다
              - 주체·리소스의 Project 값 일치를 비교하는 ABAC 허용 조건을 둔다
      - id: saa-r2-Q27-06
        source_id: Q27-06
        type: mcq
        title: Q27-06 · 모의고사 C
        explain: |
          <p>멤버 계정에 적용되는 SCP의 명시적 Deny는 그 계정의 새 역할에 관리자 Allow를 연결해도 우회할 수 없다. 필요한 중지 API만 대상으로 삼으면 다른 관리자 작업을 유지할 수 있다. 이 질문은 Organizations 관리 계정 자체의 권한 제한을 묻지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>조직 Config 규칙으로 중지된 추적을 탐지하고 운영자에게 재시작을 요청한다</td>
          <td>Config의 사후 탐지는 감사 로깅 중단을 처음부터 차단하는 예방 통제와 다르다.</td>
          </tr>
          <tr>
          <td>현재 역할에 중지 거부 정책을 붙이고 새 역할의 정책은 계정 담당자가 관리한다</td>
          <td>현재 역할의 명시적 거부는 그 역할에만 적용된다. 새 역할이 동일 제한을 자동으로 상속하지 않는다.</td>
          </tr>
          <tr>
          <td>현재 운영 역할에서 추적 중지 Allow를 지우고 계정별 역할 생성은 유지한다</td>
          <td>현재 역할의 Allow를 제거해도 다른 Allow 정책이나 새 역할에서 다시 허용할 수 있어 계정 전체의 상한이 되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html">Service control policies (SCPs) - AWS Organizations</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-12.html#scp-%EB%A6%AC%EC%A0%84-%EC%98%88%EC%99%B8%EC%9D%98-%EB%85%BC%EB%A6%AC">멤버 계정에 적용되는 SCP의 명시적 거부는 계정 내 IAM Allow로 넘을 수 없다</a> · <a href="/study/lessons/deep-dive/day-12.html#scp-%EB%A6%AC%EC%A0%84-%EC%98%88%EC%99%B8%EC%9D%98-%EB%85%BC%EB%A6%AC">특정 중지 작업을 거부하면 다른 관리 권한을 유지하면서 조직 수준 제한을 둘 수 있다</a></p>
        quizzes:
          - q: 보안팀은 각 Organizations 멤버 계정이 직접 관리하는 계정 수준 CloudTrail 추적을 보호하려 한다. 운영자가 새 IAM
              역할을 만들어도 로깅을 중지하지 못해야 하지만 나머지 관리자 작업과 역할 생성은 계속 허용한다. 계정 담당자가 추가한
              Allow 정책으로도 넘지 못할 통제는?
            answer: 멤버 계정에 상속되는 SCP에서 필요한 추적 중지 API를 명시적으로 거부한다
            wrong:
              - 조직 Config 규칙으로 중지된 추적을 탐지하고 운영자에게 재시작을 요청한다
              - 현재 역할에 중지 거부 정책을 붙이고 새 역할의 정책은 계정 담당자가 관리한다
              - 현재 운영 역할에서 추적 중지 Allow를 지우고 계정별 역할 생성은 유지한다
      - id: saa-r2-Q27-07
        source_id: Q27-07
        type: mcq
        title: Q27-07 · 모의고사 C
        explain: |
          <p>역할 ARN에 대한 리소스 정책 허용도 이 역할의 권한 경계에 의한 암묵적 거부를 넘지 못한다. 기존 신원·버킷 허용은 이미 맞으므로 경계에 필요한 객체 읽기만 추가하는 것이 가장 좁은 변경이다. 계정 루트 ARN으로 Principal을 바꿔도 이 역할의 경계가 자동으로 넓어지지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 경계를 모든 S3 작업을 허용하는 경계로 교체한다</td>
          <td>모든 S3 작업을 허용하면 동작할 수 있지만 지정 보고서 읽기만 추가하는 변경보다 권한 상한을 불필요하게 넓힌다.</td>
          </tr>
          <tr>
          <td>신원 정책의 GetObject Resource를 모든 S3 객체로 넓힌다</td>
          <td>신원 Allow를 넓혀도 현재 경계는 GetObject를 허용하지 않는다. 읽기 실패를 해결하지 못하면서 신원 정책 범위만 커진다.</td>
          </tr>
          <tr>
          <td>버킷 정책의 Principal을 같은 계정의 역할에서 계정 루트 ARN으로 바꾼다</td>
          <td>계정에 위임하는 Principal 변경은 경계의 누락된 GetObject를 추가하지 않으므로 동일 역할의 요청이 계속 제한된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html">IAM permissions boundaries</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">교차 계정의 신원·버킷 허용이 있어도 역할 ARN에 부여한 권한은 permissions boundary의 상한을 넘지 못한다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">경계에 지정 보고서의 GetObject를 추가하면 기존 양쪽 허용과 교집합이 생기며 보고서 범위도 유지된다</a></p>
        quizzes:
          - q: 분석 계정 ReportRole이 운영 계정 S3 보고서를 읽으면 거부된다. 신원 정책과 버킷 정책은 해당 객체 GetObject를 허용하고
              버킷 Principal은 역할 ARN이다. 경계는 ListBucket만 허용하며 SCP·세션 정책·명시적 Deny는
              없다. 객체는 SSE-S3다. 경계를 유지하면서 최소 변경으로 읽기를 허용하려면?
            answer: 경계에 해당 보고서 객체 ARN의 GetObject를 추가한다
            wrong:
              - 기존 경계를 모든 S3 작업을 허용하는 경계로 교체한다
              - 신원 정책의 GetObject Resource를 모든 S3 객체로 넓힌다
              - 버킷 정책의 Principal을 같은 계정의 역할에서 계정 루트 ARN으로 바꾼다
      - id: saa-r2-Q27-08
        source_id: Q27-08
        type: mcq
        title: Q27-08 · 모의고사 C
        explain: |
          <p>앱 전용 보안 그룹을 소스로 참조하면 새 앱 인스턴스에도 동일 그룹을 연결하는 것으로 DB 접근 범위를 유지할 수 있다. 같은 서브넷의 다른 인스턴스까지 허용하지 않으며 앱이 DB 연결을 시작하는 실제 출발지와도 일치한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>소스를 ALB 보안 그룹으로 지정해 TCP 3306을 허용한다</td>
          <td>ALB는 앱에 요청을 보내지만 일반적인 앱의 DB 연결을 대신 시작하지 않는다. DB 연결의 출발지는 앱 인스턴스다.</td>
          </tr>
          <tr>
          <td>소스를 현재 앱 프라이빗 IP의 /32 목록으로 지정해 TCP 3306을 허용한다</td>
          <td>현재 IP 목록은 당장의 연결에는 맞을 수 있지만 인스턴스 확장·교체 때마다 규칙을 갱신해야 한다.</td>
          </tr>
          <tr>
          <td>소스를 두 앱 서브넷 CIDR로 지정해 TCP 3306을 허용한다</td>
          <td>서브넷 CIDR는 같은 범위의 배치 서버도 포함한다. 앱 계층만 허용한다는 보안 조건보다 넓다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html">Security group rules - Amazon Virtual Private Cloud</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#sg-%EC%B0%B8%EC%A1%B0%EB%A1%9C-%EA%B3%84%EC%B8%B5%EC%9D%84-%EC%97%B0%EA%B2%B0%ED%95%98%EA%B8%B0">DB에 실제 연결을 시작하는 앱의 보안 그룹을 출발지로 참조하면 IP 교체에 대응하면서 계층 범위를 제한한다</a> · <a href="/study/lessons/deep-dive/day-05.html#sg-%EC%B0%B8%EC%A1%B0%EB%A1%9C-%EA%B3%84%EC%B8%B5%EC%9D%84-%EC%97%B0%EA%B2%B0%ED%95%98%EA%B8%B0">필요한 DB 포트만 허용하고 앱 아웃바운드도 확인한다</a></p>
        quizzes:
          - q: 두 AZ의 EC2 앱이 RDS MySQL에 연결한다. 앱은 Auto Scaling으로 자주 교체되고 같은 서브넷에 배치 서버도 있다.
              DB는 앱 인스턴스가 시작한 연결만 받아야 하며 확장 때 DB 규칙을 수정하고 싶지 않다. 전용 앱 보안 그룹을 사용할
              수 있을 때 가장 적절한 DB 규칙은?
            answer: 소스를 앱 보안 그룹으로 지정해 TCP 3306을 허용한다
            wrong:
              - 소스를 ALB 보안 그룹으로 지정해 TCP 3306을 허용한다
              - 소스를 현재 앱 프라이빗 IP의 /32 목록으로 지정해 TCP 3306을 허용한다
              - 소스를 두 앱 서브넷 CIDR로 지정해 TCP 3306을 허용한다
      - id: saa-r2-Q27-09
        source_id: Q27-09
        type: mcq
        title: Q27-09 · 모의고사 C
        explain: |
          <p>계정 경로를 별도 behavior로 나누어 캐시를 비활성화하고 인증에 필요한 쿠키를 원본에 전달하면 개인 응답을 공유하지 않는다. 정적 이미지의 캐시 정책은 그대로 둘 수 있다. 원본에 전달하는 값과 캐시 키에 포함하는 값은 별도 설정이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>계정 경로의 원본 요청 정책에 쿠키를 추가하고 기존 캐시 정책은 유지한다</td>
          <td>원본 요청 정책만 바꿔도 이미 경로 기준으로 저장한 응답을 다른 사용자에게 재사용할 수 있어 캐시 오염 원인이 남는다.</td>
          </tr>
          <tr>
          <td>원본 계정 응답에 private를 추가하고 CloudFront 최소 TTL은 양수로 유지한다</td>
          <td>양수 최소 TTL은 원본의 private·no-store 같은 지시에도 CloudFront가 최소 시간 캐시할 수 있어 이 조건의 안전한 해결이 아니다.</td>
          </tr>
          <tr>
          <td>계정 화면용 원본을 새로 만들고 같은 경로 기반 캐시 정책을 연결한다</td>
          <td>원본 위치를 바꿔도 공유 캐시 키가 사용자 응답을 구분하지 않는 구조는 그대로 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html">Control the cache key with a policy - Amazon CloudFront</a> · <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html">CloudFront 캐시 만료와 최소 TTL</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EC%BA%90%EC%8B%9C-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%9B%90%EB%B3%B8-%EC%A0%84%EB%8B%AC-%EC%A0%95%EC%B1%85">개인화 경로의 공유 캐시를 끄고 필요한 인증 쿠키를 원본으로 전달하면 잘못 공유된 캐시 문제를 제거한다</a> · <a href="/study/lessons/deep-dive/day-09.html#cache-control%EA%B3%BC-ttl%EC%9D%98-%EA%B2%BD%EA%B3%84">정적 경로는 별도 behavior로 계속 캐시할 수 있다</a></p>
        quizzes:
          - q: CloudFront가 쿠키로 인증하는 쇼핑몰의 상품 이미지와 /account/*를 전달한다. 계정 화면 캐시 키는 경로뿐이며 다른 회원
              정보가 보였다. 이미지는 계속 캐시하되 개인 화면은 캐시할 필요가 없다. 쿠키 인증을 유지하면서 재발을 막는 가장
              적절한 변경은?
            answer: 계정 경로에 캐시 비활성화 정책을 적용하고 인증 쿠키를 원본에 전달한다
            wrong:
              - 계정 경로의 원본 요청 정책에 쿠키를 추가하고 기존 캐시 정책은 유지한다
              - 원본 계정 응답에 private를 추가하고 CloudFront 최소 TTL은 양수로 유지한다
              - 계정 화면용 원본을 새로 만들고 같은 경로 기반 캐시 정책을 연결한다
      - id: saa-r2-Q27-10
        source_id: Q27-10
        type: mcq
        title: Q27-10 · 모의고사 C
        explain: |
          <p>OAC와 배포로 제한한 버킷 정책은 원본 직접 접근을 막고, CloudFront 서명 쿠키는 여러 HLS 조각에 사용자별 시간 제한을 적용한다. 사용자 승인과 원본 보호는 서로 다른 경계다. 서명 쿠키를 사용하려면 behavior에 신뢰할 키 그룹 등 검증 구성이 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>OAC만 연결하고 CloudFront behavior의 신뢰할 키 그룹 설정은 사용하지 않는다</td>
          <td>OAC는 CloudFront에서 S3로 가는 요청을 보호한다. 시청자 요청의 구매 확인과 두 시간 제한은 수행하지 않는다.</td>
          </tr>
          <tr>
          <td>S3 버킷을 공개하고 CloudFront에만 서명 쿠키 검증을 구성한다</td>
          <td>CloudFront의 서명 검증을 통과하지 않고 공개 S3 URL로 직접 받을 수 있어 원본 우회 금지에 어긋난다.</td>
          </tr>
          <tr>
          <td>S3 presigned URL을 조각별 발급하고 발급 역할의 S3 직접 읽기를 허용한다</td>
          <td>S3 presigned URL은 S3로 직접 접근하는 경로이므로 CloudFront 경유를 강제하는 요구를 충족하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html">Restrict access to an Amazon S3 origin - Amazon CloudFront</a> · <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html">CloudFront 서명 쿠키</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EA%B5%AC%EB%A7%A4%EC%9E%90-%EA%B6%8C%ED%95%9C%EA%B3%BC-s3-%EC%9B%90%EB%B3%B8-%EA%B6%8C%ED%95%9C">OAC와 버킷 정책은 원본을 읽는 CloudFront의 경계를 제한한다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EA%B5%AC%EB%A7%A4%EC%9E%90-%EA%B6%8C%ED%95%9C%EA%B3%BC-s3-%EC%9B%90%EB%B3%B8-%EA%B6%8C%ED%95%9C">서명 쿠키는 여러 제한 파일에 대한 회원의 기간별 접근을 검증하므로 두 서로 다른 경계가 모두 필요하다</a></p>
        quizzes:
          - q: 강의 앱은 비공개 S3 REST 원본의 수백 개 HLS 조각을 CloudFront로 보낸다. 서버는 구매 여부를 확인할 수 있다. 회원은
              한 번 승인받아 여러 조각을 두 시간만 읽고, S3 URL로 직접 접근해서는 안 된다. 필요한 두 조치는?
            answer: OAC를 연결하고 버킷 정책에서 해당 CloudFront 배포의 읽기만 허용한다
            wrong:
              - OAC만 연결하고 CloudFront behavior의 신뢰할 키 그룹 설정은 사용하지 않는다
              - S3 버킷을 공개하고 CloudFront에만 서명 쿠키 검증을 구성한다
              - S3 presigned URL을 조각별 발급하고 발급 역할의 S3 직접 읽기를 허용한다
            answers:
              - OAC를 연결하고 버킷 정책에서 해당 CloudFront 배포의 읽기만 허용한다
              - 구매 확인 후 두 시간 만료의 CloudFront 서명 쿠키를 발급한다
            options:
              - OAC만 연결하고 CloudFront behavior의 신뢰할 키 그룹 설정은 사용하지 않는다
              - S3 버킷을 공개하고 CloudFront에만 서명 쿠키 검증을 구성한다
              - S3 presigned URL을 조각별 발급하고 발급 역할의 S3 직접 읽기를 허용한다
              - OAC를 연결하고 버킷 정책에서 해당 CloudFront 배포의 읽기만 허용한다
              - 구매 확인 후 두 시간 만료의 CloudFront 서명 쿠키를 발급한다
      - id: saa-r2-Q27-11
        source_id: Q27-11
        type: mcq
        title: Q27-11 · 모의고사 C
        explain: |
          <p>WAF는 HTTP 요청 내용을 검사할 수 있고 Count 모드로 정상 요청에 미치는 영향을 먼저 관측할 수 있다. 관리형 규칙의 오탐 범위를 조정한 뒤 차단하면 앱 배포 전 방어와 정상 요청 유지 조건을 함께 고려할 수 있다. 앱의 사용자별 인가는 계속 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>서브넷 NACL에서 알려진 공격 IP를 거부하고 나머지 HTTPS 연결은 허용한다</td>
          <td>NACL의 주소 기반 거부는 특정 출발지 접근을 막을 수 있지만 새 IP로 들어오는 동일 SQL 패턴을 검사하지 못한다. 정상 JSON 오탐을 HTTP 조건별로 관측하는 대안도 아니다.</td>
          </tr>
          <tr>
          <td>ALB를 NLB로 교체해 TLS를 종료하고 기존 앱의 인증 검사를 계속 사용한다</td>
          <td>TLS 종료는 암호화된 연결을 처리하는 기능이다. NLB로 바꿔도 HTTP 요청 본문의 SQL 패턴 검사·관측 규칙이 생기지 않는다.</td>
          </tr>
          <tr>
          <td>Shield Advanced에 ALB를 등록하고 애플리케이션 HTTP 규칙은 추가하지 않는다</td>
          <td>DDoS 보호는 유용하지만 SQL 인젝션 요청 본문을 조건으로 제한하려는 HTTP 계층 규칙을 대신하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">What are AWS WAF, AWS Shield Advanced, AWS Shield network security director and AWS Firewall Manager? - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director</a> · <a href="https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-testing.html">WAF Count 모드 관측과 튜닝</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#waf-%EB%8B%A8%EC%9D%BC-%EA%B7%9C%EC%B9%99-%EC%98%88%EC%99%B8%EC%99%80-%EB%82%98%EB%A8%B8%EC%A7%80-%EB%B3%B4%ED%98%B8">WAF는 지원 웹 리소스의 요청 패턴을 검사할 수 있다</a> · <a href="/study/lessons/deep-dive/day-11.html#waf-%EB%8B%A8%EC%9D%BC-%EA%B7%9C%EC%B9%99-%EC%98%88%EC%99%B8%EC%99%80-%EB%82%98%EB%A8%B8%EC%A7%80-%EB%B3%B4%ED%98%B8">규칙을 시험하고 오탐을 조정하면서 적용해야 하며, 앱의 업무 인가를 대신하는 것으로 보지 않는다</a></p>
        quizzes:
          - q: ALB의 주문 API에 SQL 인젝션 요청이 들어온다. 일부 정상 주문의 JSON에도 SQL과 비슷한 문자열이 있어 즉시 광범위 차단하면
              안 된다. 소스 배포는 다음 주이며 그전까지 관리형 방어를 추가해야 한다. 기존 인증은 유지할 때 가장 적절한 조치는?
            answer: ALB의 WAF 규칙을 Count로 관측하고 오탐 범위를 조정한 뒤 차단으로 전환한다
            wrong:
              - 서브넷 NACL에서 알려진 공격 IP를 거부하고 나머지 HTTPS 연결은 허용한다
              - ALB를 NLB로 교체해 TLS를 종료하고 기존 앱의 인증 검사를 계속 사용한다
              - Shield Advanced에 ALB를 등록하고 애플리케이션 HTTP 규칙은 추가하지 않는다
      - id: saa-r2-Q27-12
        source_id: Q27-12
        type: mcq
        title: Q27-12 · 모의고사 C
        explain: |
          <p>Session Manager는 SSH 인바운드·개인 SSH 키 없이 승인된 IAM 주체의 세션을 제공한다. 직원의 세션 시작 권한, 노드의 서비스 권한, Agent가 Systems Manager와 통신할 경로가 각각 필요하다. 인터넷 출구가 없는 조건에서는 필요한 VPC 엔드포인트와 보안 규칙을 준비한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>관리용 배스천을 퍼블릭 서브넷에 두고 직원 SSH 키로 내부 EC2에 연결한다</td>
          <td>배스천 경유 방식은 가능한 관리 패턴이지만 직원 SSH 키를 계속 배포해야 하므로 명시된 제약을 어긴다.</td>
          </tr>
          <tr>
          <td>직원에게 StartSession을 허용하고 노드의 기존 역할·서비스 연결은 유지한다</td>
          <td>사용자 권한만으로는 Agent의 서비스 인증과 네트워크 경로가 생기지 않는다. 현재 노드가 관리 대상으로 연결되지 않으면 세션을 열 수 없다.</td>
          </tr>
          <tr>
          <td>노드 역할에 SSM 권한을 추가하고 외부 서비스 연결 없이 직원에게 콘솔을 연다</td>
          <td>노드 역할이 있어도 Agent의 서비스 연결 경로가 필요하다. 직원의 별도 세션 권한도 콘솔을 연다는 사실만으로 부여되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-prerequisites.html">Step 1: Complete Session Manager prerequisites - AWS Systems Manager</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-12.html#systems-manager-%EC%9A%B4%EC%98%81%EC%9D%98-%EC%A0%84%EC%A0%9C-%EC%A1%B0%EA%B1%B4">Session Manager는 직접 SSH 인바운드 없이 관리 세션을 제공한다</a> · <a href="/study/lessons/deep-dive/day-12.html#systems-manager-%EC%9A%B4%EC%98%81%EC%9D%98-%EC%A0%84%EC%A0%9C-%EC%A1%B0%EA%B1%B4">직원의 세션 권한, 노드 IAM 역할과 서비스 엔드포인트 연결을 모두 갖춰야 접속할 수 있다</a></p>
        quizzes:
          - q: 지원 OS와 SSM Agent가 설치된 EC2를 프라이빗 서브넷에 배치했다. 직원의 SSH 키 배포와 인터넷 인바운드는 금지하지만 승인된
              직원이 장애 조사 세션을 열어야 한다. 인스턴스에는 인터넷 출구가 없다. 가장 적절한 구성은?
            answer: 직원 세션 권한·노드 역할과 필요한 Systems Manager VPC 엔드포인트를 구성한다
            wrong:
              - 관리용 배스천을 퍼블릭 서브넷에 두고 직원 SSH 키로 내부 EC2에 연결한다
              - 직원에게 StartSession을 허용하고 노드의 기존 역할·서비스 연결은 유지한다
              - 노드 역할에 SSM 권한을 추가하고 외부 서비스 연결 없이 직원에게 콘솔을 연다
      - id: saa-r2-Q27-13
        source_id: Q27-13
        type: mcq
        title: Q27-13 · 모의고사 C
        explain: |
          <p>User pool은 소비자 로그인과 토큰 발급을 관리하며 API가 토큰을 검증하는 구조에 맞는다. Identity pool은 AWS 리소스용 임시 자격 증명이 필요한 경우에 해당한다. 이 앱은 서버 역할이 S3에 접근하므로 브라우저 AWS 자격 증명이 필요하지 않다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Cognito identity pool에서 브라우저용 AWS 자격 증명을 발급해 API를 호출한다</td>
          <td>Identity pool의 AWS 자격 증명 발급은 요구하지 않은 브라우저 권한 경로를 추가한다. 회원 인증·JWT 발급의 직접 대응은 user pool이다.</td>
          </tr>
          <tr>
          <td>IAM Identity Center 권한 세트에 소비자를 등록해 AWS 계정 세션을 발급한다</td>
          <td>직원의 AWS 계정 접근을 관리하는 Identity Center 권한 세트는 이 소비자 앱의 회원 인증·API 토큰 체계를 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>기존 회원 서버를 EC2 Auto Scaling으로 이전하고 JWT 발급 로직을 계속 운영한다</td>
          <td>서버를 Auto Scaling으로 옮겨도 비밀번호 검증과 토큰 발급 소프트웨어를 직접 관리하는 부담이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html">What is Amazon Cognito? - Amazon Cognito</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%ED%9A%8C%EC%9B%90-%EC%9D%B8%EC%A6%9Daws-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85%EC%A7%81%EC%9B%90-%EB%94%94%EB%A0%89%ED%84%B0%EB%A6%AC">앱 회원 로그인과 토큰 발급은 user pool의 역할이다</a> · <a href="/study/lessons/deep-dive/day-11.html#%ED%9A%8C%EC%9B%90-%EC%9D%B8%EC%A6%9Daws-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85%EC%A7%81%EC%9B%90-%EB%94%94%EB%A0%89%ED%84%B0%EB%A6%AC">서버가 AWS 리소스 접근을 담당하므로 브라우저에 identity pool 임시 자격 증명을 제공할 필요가 없다</a></p>
        quizzes:
          - q: 소비자 웹 앱은 자체 회원 비밀번호 서버의 운영을 줄이려 한다. 로그인 후 JWT로 주문 API를 호출하며 S3는 API 서버의 IAM
              역할로만 읽는다. 직원의 AWS 콘솔 접근은 이미 별도 체계가 있다. 브라우저에 AWS 자격 증명을 주지 않는 가장
              적절한 인증 구조는?
            answer: Cognito user pool에서 회원을 인증하고 API에서 발급 토큰을 검증한다
            wrong:
              - Cognito identity pool에서 브라우저용 AWS 자격 증명을 발급해 API를 호출한다
              - IAM Identity Center 권한 세트에 소비자를 등록해 AWS 계정 세션을 발급한다
              - 기존 회원 서버를 EC2 Auto Scaling으로 이전하고 JWT 발급 로직을 계속 운영한다
      - id: saa-r2-Q27-14
        source_id: Q27-14
        type: mcq
        title: Q27-14 · 모의고사 C
        explain: |
          <p>Macie의 분류 작업이 SSE-KMS 객체를 읽으려면 Macie가 사용하는 역할의 키 접근이 필요하다. 비정상 S3 객체 API 행위 탐지는 GuardDuty S3 Protection의 범위다. 서비스 역할의 복호화와 객체 접근, 탐지 기능을 함께 설정해야 두 요구를 만족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Macie 서비스 역할의 키 사용을 허용해 분류하고 GuardDuty 기본 보호만 유지한다</td>
          <td>분류는 가능해져도 기본 GuardDuty만으로 S3 Protection의 객체 수준 위협 탐지 범위가 활성화되는 것은 아니다.</td>
          </tr>
          <tr>
          <td>분석가 역할에 키 사용을 허용한 뒤 Macie 분류와 GuardDuty S3 Protection을 켠다</td>
          <td>사람인 분석가의 복호화 권한은 Macie 서비스 역할의 권한으로 전달되지 않아 분류 작업의 읽기 실패가 남는다.</td>
          </tr>
          <tr>
          <td>Athena로 개인정보 SQL을 실행하고 CloudTrail Lake에서 이상 조회 규칙을 운영한다</td>
          <td>분류·이상 탐지 규칙을 직접 작성하고 유지해야 하므로 관리형 기능으로 자체 엔진 운영을 줄이려는 조건에 덜 적합하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/macie/latest/user/discovery-supported-encryption-types.html">Macie encrypted objects</a> · <a href="https://docs.aws.amazon.com/guardduty/latest/ug/s3-protection.html">GuardDuty S3 Protection</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#macie-%EB%AC%B8%EB%A7%A5%EA%B3%BC-%ED%97%88%EC%9A%A9-%EB%AA%A9%EB%A1%9D%EC%9D%98-%EA%B2%80%EC%A6%9D">Macie가 고객 관리형 KMS 암호문을 분류하려면 Macie 서비스 연결 역할이 해당 키를 사용할 수 있어야 한다</a> · <a href="/study/lessons/deep-dive/day-11.html#macie-%EB%AC%B8%EB%A7%A5%EA%B3%BC-%ED%97%88%EC%9A%A9-%EB%AA%A9%EB%A1%9D%EC%9D%98-%EA%B2%80%EC%A6%9D">GetObject 같은 객체 수준의 의심 활동은 GuardDuty S3 Protection 대상이며, 기본 관리 이벤트 모니터링과 구분된다</a></p>
        quizzes:
          - q: SSE-KMS CSV에서 개인정보를 정기 분류하고, 정상 자격 증명으로 발생하는 비정상 S3 읽기도 관리형으로 탐지해야 한다. 키 정책은
              앱 역할만 허용하고 기본 GuardDuty만 켜져 있다. 암호화를 유지하며 자체 분석 엔진 개발을 줄이는 구성은?
            answer: Macie 서비스 역할의 키 사용을 허용해 분류하고 GuardDuty S3 Protection을 켠다
            wrong:
              - Macie 서비스 역할의 키 사용을 허용해 분류하고 GuardDuty 기본 보호만 유지한다
              - 분석가 역할에 키 사용을 허용한 뒤 Macie 분류와 GuardDuty S3 Protection을 켠다
              - Athena로 개인정보 SQL을 실행하고 CloudTrail Lake에서 이상 조회 규칙을 운영한다
      - id: saa-r2-Q27-15
        source_id: Q27-15
        type: mcq
        title: Q27-15 · 모의고사 C
        explain: |
          <p>교차 계정 KMS 사용은 키 소유자의 키 정책 허용과 호출자 계정의 IAM 허용이 함께 필요하다. S3 읽기 허용은 이미 충족했으며 실제 거부 지점이 Decrypt이므로 두 곳을 해당 키와 분석 역할로 좁혀 추가한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버킷 정책에 같은 GetObject Allow를 추가해 객체 읽기 허용을 중복한다</td>
          <td>S3 객체 인가와 KMS 복호화 인가는 별개이므로 중복 GetObject Allow로 KMS의 거부를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>분석 역할의 신뢰 정책에 S3를 추가하고 기존 키 사용 정책은 유지한다</td>
          <td>역할 신뢰는 누가 역할을 맡는지 정한다. 역할이 해당 키를 복호화할 권한을 부여하지 않는다.</td>
          </tr>
          <tr>
          <td>키 소유 계정 역할에 Decrypt를 추가하고 분석 역할의 IAM 정책은 유지한다</td>
          <td>다른 키 소유 계정 역할의 IAM 정책은 실제 호출자인 분석 역할의 허용을 대신하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html">Allowing users in other accounts to use a KMS key - AWS Key Management Service</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%ED%82%A4%EC%9D%98-%EC%83%9D%EC%84%B1%EA%B3%BC-%EA%B5%90%EC%B0%A8-%EA%B3%84%EC%A0%95-%EA%B6%8C%ED%95%9C">교차 계정 KMS 사용은 키 소유 계정의 키 정책과 호출자 계정 IAM 허용을 함께 갖춰야 한다</a> · <a href="/study/lessons/deep-dive/day-11.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%ED%82%A4%EC%9D%98-%EC%83%9D%EC%84%B1%EA%B3%BC-%EA%B5%90%EC%B0%A8-%EA%B3%84%EC%A0%95-%EA%B6%8C%ED%95%9C">기존 S3 읽기와 별개인 복호화 경계를 해당 역할과 키로 제한해 허용한다</a></p>
        quizzes:
          - q: 분석 계정 역할이 다른 계정의 SSE-KMS S3 객체를 읽는다. 양쪽 S3 정책의 GetObject는 이미 허용되었으며 거부 로그는
              KMS Decrypt를 가리킨다. 현재 키 정책은 키 소유 계정의 앱만 허용하고 분석 역할에도 KMS Allow가
              없다. 최소 범위로 필요한 두 변경은?
            answer: 키 정책에서 지정 분석 역할에 필요한 해당 키 사용을 허용한다
            wrong:
              - 버킷 정책에 같은 GetObject Allow를 추가해 객체 읽기 허용을 중복한다
              - 분석 역할의 신뢰 정책에 S3를 추가하고 기존 키 사용 정책은 유지한다
              - 키 소유 계정 역할에 Decrypt를 추가하고 분석 역할의 IAM 정책은 유지한다
            answers:
              - 키 정책에서 지정 분석 역할에 필요한 해당 키 사용을 허용한다
              - 분석 역할의 IAM 정책에서 해당 키 ARN의 Decrypt를 허용한다
            options:
              - 버킷 정책에 같은 GetObject Allow를 추가해 객체 읽기 허용을 중복한다
              - 분석 역할의 신뢰 정책에 S3를 추가하고 기존 키 사용 정책은 유지한다
              - 키 소유 계정 역할에 Decrypt를 추가하고 분석 역할의 IAM 정책은 유지한다
              - 키 정책에서 지정 분석 역할에 필요한 해당 키 사용을 허용한다
              - 분석 역할의 IAM 정책에서 해당 키 ARN의 Decrypt를 허용한다
      - id: saa-r2-Q27-16
        source_id: Q27-16
        type: mcq
        title: Q27-16 · 모의고사 C
        explain: |
          <p>Compliance 보존은 보존 중인 버전의 영구 삭제를 루트 사용자에게도 허용하지 않는다. 같은 키의 새 버전 추가와 기존 보호 버전 삭제는 다른 작업이므로 정정본 업로드와 과거 버전 보호가 양립한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Versioning을 사용하고 운영자 역할에서 DeleteObjectVersion Allow를 제거한다</td>
          <td>현재 운영자의 IAM 허용을 제거해도 루트·정책 변경 권한자까지 포함한 불변 보존의 강제가 되지는 않는다.</td>
          </tr>
          <tr>
          <td>Object Lock Governance를 적용하고 긴급 대응 관리자에게 우회 권한을 둔다</td>
          <td>Governance는 적절한 우회 권한으로 보존을 넘을 수 있어 모든 관리자와 루트의 삭제를 금지하는 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>CRR로 다른 계정에 복제하고 양쪽 운영자에게 버전 삭제 권한을 유지한다</td>
          <td>다른 위치의 사본과 버전 관리만으로 허용된 영구 버전 삭제를 차단하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html">Locking objects with Object Lock - Amazon Simple Storage Service</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#object-lock%EC%9D%98-%EB%B3%B4%EC%A1%B4-%EA%B8%B0%EA%B0%84%EA%B3%BC-legal-hold">Compliance 보존은 기간 중 보호된 버전의 영구 삭제를 강하게 제한한다</a> · <a href="/study/lessons/deep-dive/day-03.html#object-lock%EC%9D%98-%EB%B3%B4%EC%A1%B4-%EA%B8%B0%EA%B0%84%EA%B3%BC-legal-hold">같은 키에 새 버전을 생성하는 것과 보호된 과거 버전의 삭제는 구분되므로 수정본 보관 요구에도 맞는다</a></p>
        quizzes:
          - q: 감사 보고서를 S3에 7년 보관하며 그동안 루트 사용자를 포함한 운영자가 보호된 버전을 영구 삭제해서는 안 된다. 같은 키로 정정 보고서를
              추가하고 과거 버전도 조회할 수 있어야 한다. 가장 적절한 저장 통제는?
            answer: Versioning을 사용하고 각 보고서 버전에 Object Lock Compliance 보존을 적용한다
            wrong:
              - Versioning을 사용하고 운영자 역할에서 DeleteObjectVersion Allow를 제거한다
              - Object Lock Governance를 적용하고 긴급 대응 관리자에게 우회 권한을 둔다
              - CRR로 다른 계정에 복제하고 양쪽 운영자에게 버전 삭제 권한을 유지한다
      - id: saa-r2-Q27-17
        source_id: Q27-17
        type: mcq
        title: Q27-17 · 모의고사 C
        explain: |
          <p>보존 기간과 legal hold는 독립적으로 적용된다. hold를 해제해도 Compliance 보존 90일은 남고, 보존 만료 뒤에도 hold가 남으면 삭제할 수 없다. 두 제한이 모두 끝난 시점에 해당 버전 ID로 삭제해야 실제 보호 버전이 제거된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>hold를 해제한 즉시 Governance 우회 옵션으로 버전 ID를 지정해 삭제한다</td>
          <td>Governance 우회는 Compliance 보존 기간을 단축하거나 무시하는 권한이 아니므로 30일째 영구 삭제할 수 없다.</td>
          </tr>
          <tr>
          <td>30일째 버전 ID 없는 DeleteObject를 보내고 삭제 마커 생성으로 완료 처리한다</td>
          <td>버전 ID 없는 삭제는 삭제 마커를 만들 수 있지만 그 아래 보호된 기존 버전을 영구 삭제하지 않는다.</td>
          </tr>
          <tr>
          <td>hold를 유지한 채 90일 보존이 끝나면 버전 ID를 지정해 삭제한다</td>
          <td>legal hold는 기간 보존과 독립적이므로 90일이 지나도 hold가 켜져 있으면 삭제가 계속 제한된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html">S3 Object Lock</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#object-lock%EC%9D%98-%EB%B3%B4%EC%A1%B4-%EA%B8%B0%EA%B0%84%EA%B3%BC-legal-hold">Legal hold와 보존 기간은 독립적인 보호이다</a> · <a href="/study/lessons/deep-dive/day-03.html#object-lock%EC%9D%98-%EB%B3%B4%EC%A1%B4-%EA%B8%B0%EA%B0%84%EA%B3%BC-legal-hold">Hold를 해제해도 Compliance 보존은 90일까지 남으며 Governance 우회 권한으로 해제할 수 없다</a> · <a href="/study/lessons/deep-dive/day-03.html#object-lock%EC%9D%98-%EB%B3%B4%EC%A1%B4-%EA%B8%B0%EA%B0%84%EA%B3%BC-legal-hold">두 보호가 모두 끝난 뒤 해당 version ID를 삭제해야 영구 삭제가 된다</a></p>
        quizzes:
          - q: S3의 한 버전은 생성일부터 90일 Compliance 보존과 legal hold가 동시에 적용되어 있다. 30일째 법무가 hold 해제를
              승인했으며 추가 보존 의무는 없다. 담당자는 hold 해제와 버전 삭제 권한이 있다. 이 버전을 가장 빨리 영구
              삭제하는 절차는?
            answer: hold를 해제한 뒤 90일 보존이 끝나면 버전 ID를 지정해 삭제한다
            wrong:
              - hold를 해제한 즉시 Governance 우회 옵션으로 버전 ID를 지정해 삭제한다
              - 30일째 버전 ID 없는 DeleteObject를 보내고 삭제 마커 생성으로 완료 처리한다
              - hold를 유지한 채 90일 보존이 끝나면 버전 ID를 지정해 삭제한다
      - id: saa-r2-Q27-18
        source_id: Q27-18
        type: mcq
        title: Q27-18 · 모의고사 C
        explain: |
          <p>지원되는 대칭 키의 자동 회전은 키 ARN을 유지하면서 이후 암호화에 새 키 재료를 사용한다. KMS는 기존 암호문에 필요한 이전 재료를 유지한다. 회전이 과거 저장 데이터를 자동 재암호화하는 것은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>원래 키의 사용을 중지하고 신규 암호화 요청마다 별도 키를 만들어 사용한다</td>
          <td>키를 비활성화하면 기존 암호문 읽기가 막힐 수 있고 요청별 키 생성은 안정된 키 식별자와 운영 최소화 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>새 독립 키를 정기 생성해 별칭을 옮기고 이전 키를 즉시 삭제 예약한다</td>
          <td>새 독립 키·별칭 이전은 별도 수명주기 관리가 필요하며 과거 데이터가 이전 키에 의존하는 동안 키를 삭제하면 읽기 연속성을 위험하게 한다.</td>
          </tr>
          <tr>
          <td>회전 때마다 새 키로 모든 과거 데이터를 재암호화하고 앱의 키 ARN도 바꾼다</td>
          <td>전체 재암호화와 앱 ARN 변경은 제시한 회전 요구보다 큰 변경이며 안정적인 키 식별자를 유지하라는 조건에도 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html">Rotate AWS KMS keys - AWS Key Management Service</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%ED%82%A4-%ED%9A%8C%EC%A0%84%EC%9E%AC%EC%95%94%ED%98%B8%ED%99%94%EC%82%AD%EC%A0%9C-%EB%8C%80%EA%B8%B0">지원되는 KMS 자동 회전은 같은 논리 키를 유지하며 키 재료를 바꾼다</a> · <a href="/study/lessons/deep-dive/day-11.html#%ED%82%A4-%ED%9A%8C%EC%A0%84%EC%9E%AC%EC%95%94%ED%98%B8%ED%99%94%EC%82%AD%EC%A0%9C-%EB%8C%80%EA%B8%B0">기존 암호문 복호화에 필요한 재료도 관리하므로 데이터 전체 재암호화나 앱 ARN 변경과 다르다</a></p>
        quizzes:
          - q: 대칭 고객 관리형 KMS 키를 쓰는 앱이 수년간의 암호문을 보관한다. 보안팀은 정기 키 회전을 요구하지만 앱이 참조하는 키 ARN과 기존
              암호문 읽기는 유지해야 한다. 기존 데이터를 모두 다시 쓰라는 요구는 없다. 운영 변경이 가장 적은 방법은?
            answer: 지원 키의 자동 회전을 켜고 기존 키 ARN으로 암호화·복호화를 계속한다
            wrong:
              - 원래 키의 사용을 중지하고 신규 암호화 요청마다 별도 키를 만들어 사용한다
              - 새 독립 키를 정기 생성해 별칭을 옮기고 이전 키를 즉시 삭제 예약한다
              - 회전 때마다 새 키로 모든 과거 데이터를 재암호화하고 앱의 키 ARN도 바꾼다
      - id: saa-r2-Q27-19
        source_id: Q27-19
        type: mcq
        title: Q27-19 · 모의고사 C
        explain: |
          <p>보관 위치와 보존 기간은 암호화 여부와 별개로 충족해야 한다. R2의 보호된 복제본과 로그·백업을 준비하고 대상 키 정책과 복구 역할의 IAM에 복호화를 허용해야 원본 계정 없이 대상 버전을 읽을 수 있다. 복제 쓰기에 필요한 기존 권한은 준비되었다는 전제다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>복제 대상은 R3에 두고 R1의 키를 사용해 승인 지역에 키만 유지한다</td>
          <td>키만 승인 리전에 두어도 환자 데이터의 복제본 자체가 R3에 있으면 위치 규정을 위반한다.</td>
          </tr>
          <tr>
          <td>R1 원본 키에만 복구 역할을 허용하고 R2 대상 키의 기존 정책을 유지한다</td>
          <td>R2 대상 암호문의 복호화에는 대상 키의 접근이 필요하다. 원본 키만 허용해도 기존 대상 키의 앱 전용 정책을 넘을 수 없다.</td>
          </tr>
          <tr>
          <td>R2 복제본에 30일 만료를 두고 장기 조회는 R1 원본 버킷으로 연결한다</td>
          <td>30일 만료는 복제본 7년 보호에 어긋나고 장기 조회를 원본에 의존하게 하여 독립 복구 조건도 충족하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-config-for-kms-objects.html">S3 replication of encrypted objects</a> · <a href="https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html">Cross-account KMS permissions</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%EB%B6%88%EB%B3%80-%EB%B3%B4%EA%B4%80%EA%B3%BC-legal-hold">복제본뿐 아니라 로그·백업도 허용 리전과 보존 요건을 충족해야 한다</a> · <a href="/study/lessons/deep-dive/day-11.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%ED%82%A4%EC%9D%98-%EC%83%9D%EC%84%B1%EA%B3%BC-%EA%B5%90%EC%B0%A8-%EA%B3%84%EC%A0%95-%EA%B6%8C%ED%95%9C">복구 계정에서 R2 암호문을 읽으려면 실제 대상 키에 대한 키 정책과 호출자 IAM 허용을 갖춰야 원본 앱 신원에 의존하지 않는다</a></p>
        quizzes:
          - q: 병원은 승인 리전 R1의 SSE-KMS 환자 파일을 복구 계정에 복제한다. 복제 설정 자체는 준비되었지만 대상 키 정책은 앱 역할만
              허용한다. 데이터·로그·백업은 R1/R2에서만 보관하고 복제 버전도 7년 보호해야 한다. 원본 계정 없이 복구 역할이
              대상 파일을 읽도록 추가할 두 조치는?
            answer: 대상·관련 로그·백업을 R2에 두고 복제 버전의 7년 보존을 구성한다
            wrong:
              - 복제 대상은 R3에 두고 R1의 키를 사용해 승인 지역에 키만 유지한다
              - R1 원본 키에만 복구 역할을 허용하고 R2 대상 키의 기존 정책을 유지한다
              - R2 복제본에 30일 만료를 두고 장기 조회는 R1 원본 버킷으로 연결한다
            answers:
              - 대상·관련 로그·백업을 R2에 두고 복제 버전의 7년 보존을 구성한다
              - 대상 키 정책과 복구 역할 IAM에 필요한 복호화 권한을 부여한다
            options:
              - 대상·관련 로그·백업을 R2에 두고 복제 버전의 7년 보존을 구성한다
              - 대상 키 정책과 복구 역할 IAM에 필요한 복호화 권한을 부여한다
              - 복제 대상은 R3에 두고 R1의 키를 사용해 승인 지역에 키만 유지한다
              - R1 원본 키에만 복구 역할을 허용하고 R2 대상 키의 기존 정책을 유지한다
              - R2 복제본에 30일 만료를 두고 장기 조회는 R1 원본 버킷으로 연결한다
      - id: saa-r2-Q27-20
        source_id: Q27-20
        type: mcq
        title: Q27-20 · 모의고사 C
        explain: |
          <p>최신 secret과 DB는 이미 일치하므로 문제는 앱의 오래된 자격 증명 캐시다. 적절한 캐시 갱신과 인증 실패 시 최신 값 재조회·새 DB 연결을 구현해야 회전 후 새 값이 반영된다. 캐시 정책과 재시도 횟수는 호출 비용과 연결 부하도 고려한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Lambda 타임아웃을 늘리고 같은 캐시 값으로 연결 재시도 횟수를 늘린다</td>
          <td>같은 오래된 암호로 더 오래 재시도해도 DB 인증이 성공하지 않는다. 지연과 연결 부하만 늘 수 있다.</td>
          </tr>
          <tr>
          <td>환경 변수에 AWSCURRENT 값을 한 번 복사하고 회전 때 운영자가 다시 배포한다</td>
          <td>환경 변수 복사와 수동 재배포는 새 값을 반영할 수 있지만 재배포 없이 회전을 따라가야 한다는 운영 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>Secrets Manager 조회에 재시도만 추가하고 실행 환경의 기존 값은 계속 쓴다</td>
          <td>Secret 조회 자체의 실패가 아니라 조회한 값을 갱신하지 않는 문제이므로 조회 재시도만으로 기존 캐시·연결을 교체하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/secretsmanager/latest/userguide/retrieving-secrets.html">Get secrets from AWS Secrets Manager - AWS Secrets Manager</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%EA%B5%90%EB%8C%80-%EC%82%AC%EC%9A%A9%EC%9E%90-%ED%9A%8C%EC%A0%84%EC%9D%98-%EB%84%A4-%EB%8B%A8%EA%B3%84">대상과 저장소의 비밀값이 일치하므로 남은 문제는 앱의 이전 값과 연결 수명 주기다</a> · <a href="/study/lessons/deep-dive/day-11.html#%EA%B5%90%EB%8C%80-%EC%82%AC%EC%9A%A9%EC%9E%90-%ED%9A%8C%EC%A0%84%EC%9D%98-%EB%84%A4-%EB%8B%A8%EA%B3%84">갱신·재연결을 설계하면 코드에 비밀번호를 고정하지 않고 교체를 따라갈 수 있다</a></p>
        quizzes:
          - q: Lambda가 Secrets Manager에서 읽은 RDS 암호를 실행 환경에 캐시한다. 자동 회전 뒤 DB와 AWSCURRENT는
              일치하지만 오래 살아 있는 실행 환경만 인증에 실패한다. 자동 회전은 유지하고 재배포 없이 실패를 줄이는 가장 적절한
              앱 변경은?
            answer: 비밀값 캐시 수명을 제한하고 인증 실패 때 재조회한 뒤 DB 연결을 다시 만든다
            wrong:
              - Lambda 타임아웃을 늘리고 같은 캐시 값으로 연결 재시도 횟수를 늘린다
              - 환경 변수에 AWSCURRENT 값을 한 번 복사하고 회전 때 운영자가 다시 배포한다
              - Secrets Manager 조회에 재시도만 추가하고 실행 환경의 기존 값은 계속 쓴다
      - id: saa-r2-Q27-21
        source_id: Q27-21
        type: mcq
        title: Q27-21 · 모의고사 C
        explain: |
          <p>내구성 있는 SQS 큐와 독립 소비자는 요청 접수와 PDF 처리의 속도·확장·일시 중단을 분리한다. 접수한 주문과 작업 상태를 영속 보관하고 소비자가 처리 후 완료를 기록해야 한다. 주문 저장과 큐 기록의 원자성이 필요하면 outbox 같은 별도 전달 보장도 검토한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>API 서버의 동시 연결 수와 타임아웃을 늘려 같은 요청에서 PDF를 생성한다</td>
          <td>타임아웃과 연결 수를 늘려도 API가 PDF 완료를 기다리는 결합은 남는다. 빠른 접수와 생성기 독립 확장을 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>API가 워커를 직접 비동기 HTTP 호출하고 워커가 배포 중이면 호출을 종료한다</td>
          <td>일회성 직접 HTTP 호출은 워커가 요청을 받지 못한 동안 작업을 보관하는 내구성 큐를 대신하지 못한다.</td>
          </tr>
          <tr>
          <td>각 API 서버의 EBS 파일에 작업을 쌓고 해당 서버에서 PDF 생성기를 함께 실행한다</td>
          <td>서버별 디스크 큐와 같은 서버의 생성기는 작업 분배·서버 교체·개별 확장을 직접 관리해야 해 제시한 분리 요구에 덜 적합하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html">Amazon SQS standard queues - Amazon Simple Queue Service</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/day-10.html#4-sqs-%EC%9E%91%EC%97%85%EC%9D%84-%EB%B3%B4%EA%B4%80%ED%95%98%EA%B3%A0-%EB%8B%A4%EC%8B%9C-%EC%A0%84%EB%8B%AC%ED%95%98%EA%B8%B0">큐가 접수와 처리 속도를 분리하고 작업을 보관하므로 소비자의 일시 중단을 흡수한다</a> · <a href="/study/lessons/day-10.html#1-%EC%9A%94%EC%B2%AD%EC%9D%84-%EA%B8%B0%EB%8B%A4%EB%A6%AC%EB%8A%94-%EC%9E%91%EC%97%85%EA%B3%BC-%EB%82%98%EC%A4%91%EC%97%90-%EC%B2%98%EB%A6%AC%ED%95%A0-%EC%9E%91%EC%97%85">접수 상태와 완료 상태를 별도 저장하고 재처리를 안전하게 설계해야 한다</a></p>
        quizzes:
          - q: 주문 API가 영수증 PDF 생성까지 동기 호출해 처리량이 떨어진다. 주문은 빠르게 접수하고 PDF 작업자는 별도로 늘려야 한다. 작업자는
              배포 중 몇 분 멈출 수 있으며 그동안 접수된 작업도 나중에 처리해야 한다. 가장 적절한 구조는?
            answer: 주문 상태를 저장하고 SQS 작업 큐에 연결한 독립 소비자가 PDF를 생성한다
            wrong:
              - API 서버의 동시 연결 수와 타임아웃을 늘려 같은 요청에서 PDF를 생성한다
              - API가 워커를 직접 비동기 HTTP 호출하고 워커가 배포 중이면 호출을 종료한다
              - 각 API 서버의 EBS 파일에 작업을 쌓고 해당 서버에서 PDF 생성기를 함께 실행한다
      - id: saa-r2-Q27-22
        source_id: Q27-22
        type: mcq
        title: Q27-22 · 모의고사 C
        explain: |
          <p>주문과 outbox를 한 트랜잭션에 쓰면 주문만 남고 전달 의도가 빠지는 실패 창을 없앤다. 전달자는 재전송할 수 있으므로 소비자도 이벤트 ID의 고유 제약으로 처리 이력과 발송 지시를 원자적으로 기록해야 한다. 전송 내구성과 업무 효과의 멱등성은 별개의 조건이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SQS 전송 후 주문을 커밋하고 소비자는 이벤트 ID 검사·발송 지시를 함께 커밋한다</td>
          <td>전송 후 DB 커밋이 실패하면 실제 주문은 없는데 배송 이벤트만 먼저 처리될 수 있어 주문과 발송 의도를 일치시키지 못한다.</td>
          </tr>
          <tr>
          <td>주문 커밋 후 FIFO로 전송하고 소비자는 이벤트 ID 검사·발송 지시를 함께 커밋한다</td>
          <td>FIFO를 써도 DB 커밋 후 첫 전송 전에 프로세스가 죽으면 메시지가 아예 생성되지 않는다. 소비자 중복 제거는 이 누락을 복구하지 못한다.</td>
          </tr>
          <tr>
          <td>주문·outbox를 함께 커밋하고 소비자는 매 수신마다 지시를 기록한 뒤 메시지를 삭제한다</td>
          <td>Outbox는 발송 의도를 보존하지만 소비자의 지시 커밋 후 메시지 삭제 전에 중단되면 재전달 때 지시를 다시 기록할 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html">Transactional outbox pattern</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#outboxinbox%EC%99%80-%EC%99%B8%EB%B6%80-%EA%B2%B0%EC%A0%9C%EC%9D%98-%EA%B2%BD%EA%B3%84">주문과 outbox의 원자적 커밋이 DB·큐 사이 전송 누락을 막는다</a> · <a href="/study/lessons/deep-dive/day-10.html#outboxinbox%EC%99%80-%EC%99%B8%EB%B6%80-%EA%B2%B0%EC%A0%9C%EC%9D%98-%EA%B2%BD%EA%B3%84">별도 전달자는 outbox를 재시도하며, 소비자는 이벤트 ID의 중복 확인·고유 제약을 이용해 처리 이력과 발송 지시를 같은 트랜잭션으로 기록한다</a> · <a href="/study/lessons/deep-dive/day-10.html#outboxinbox%EC%99%80-%EC%99%B8%EB%B6%80-%EA%B2%B0%EC%A0%9C%EC%9D%98-%EA%B2%BD%EA%B3%84">따라서 중복 전달도 중복 업무 효과를 만들지 않는다</a></p>
        quizzes:
          - q: 주문 DB 커밋 뒤 SQS로 배송 이벤트를 보내기 전에 프로세스가 죽었다. 주문의 발송 의도를 반드시 남겨야 한다. 전달 확인 유실로
              재전송될 수 있으며 배송 DB는 처리 이력과 발송 지시를 같은 트랜잭션에 저장할 수 있다. 발송 의도 누락과 중복
              지시를 모두 막는 구성은?
            answer: 주문·outbox를 함께 커밋하고 소비자는 이벤트 ID 중복 검사·발송 지시를 함께 커밋한다
            wrong:
              - SQS 전송 후 주문을 커밋하고 소비자는 이벤트 ID 검사·발송 지시를 함께 커밋한다
              - 주문 커밋 후 FIFO로 전송하고 소비자는 이벤트 ID 검사·발송 지시를 함께 커밋한다
              - 주문·outbox를 함께 커밋하고 소비자는 매 수신마다 지시를 기록한 뒤 메시지를 삭제한다
      - id: saa-r2-Q27-23
        source_id: Q27-23
        type: mcq
        title: Q27-23 · 모의고사 C
        explain: |
          <p>SNS와 소비자별 SQS 큐의 fanout은 각 팀에 독립 사본과 적체를 제공한다. 팀별 DLQ·재시도와 멱등성은 실패 재처리와 중복 효과 제어에 필요하다. SNS 전달 성공과 후속 소비자의 업무 커밋은 같지 않다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 소비자가 단일 큐와 단일 실패 보관소를 공유해 재처리를 공동 조정한다</td>
          <td>공유 큐는 두 팀에 독립 사본을 제공하지 않고 단일 재처리 조정도 소비자별 장애 격리 요구에 어긋난다.</td>
          </tr>
          <tr>
          <td>한 Standard 큐를 두 소비자가 함께 폴링해 전달 속도를 높인다</td>
          <td>한 큐를 함께 읽으면 소비자들이 메시지를 나눠 갖는 경쟁 소비가 되어 각 이벤트를 두 팀 모두 받는 fanout이 아니다.</td>
          </tr>
          <tr>
          <td>SNS에서 두 HTTP 소비자로 전송하고 성공 응답 직후 처리 상태를 버린다</td>
          <td>HTTP 전달은 가능하지만 해당 선택에는 팀별 내구성 적체·실패 보관이 없으며 전송 성공 후의 업무 실패를 각자 재처리하기 어렵다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html">Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing - Amazon Simple Notification Service</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">토픽의 각 구독 큐는 같은 이벤트를 독립적으로 보관하고 처리 속도를 분리한다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">팀별 실패 격리와 재처리·멱등성을 갖춰야 전달 성공과 업무 완료를 구분할 수 있다</a></p>
        quizzes:
          - q: 결제 이벤트를 회계·배송 팀이 각각 빠짐없이 받아야 한다. 배송 처리가 일시 중단되어도 회계는 계속 처리하고, 각 팀은 실패 메시지를
              보관해 따로 재처리해야 한다. 소비자 변경을 최소화하면서 필요한 두 구성은?
            answer: SNS 토픽에 회계용·배송용 SQS 큐를 각각 구독시킨다
            wrong:
              - 두 소비자가 단일 큐와 단일 실패 보관소를 공유해 재처리를 공동 조정한다
              - 한 Standard 큐를 두 소비자가 함께 폴링해 전달 속도를 높인다
              - SNS에서 두 HTTP 소비자로 전송하고 성공 응답 직후 처리 상태를 버린다
            answers:
              - SNS 토픽에 회계용·배송용 SQS 큐를 각각 구독시킨다
              - 소비자별 DLQ·재시도와 이벤트 ID 기반 업무 멱등성을 구성한다
            options:
              - 두 소비자가 단일 큐와 단일 실패 보관소를 공유해 재처리를 공동 조정한다
              - SNS 토픽에 회계용·배송용 SQS 큐를 각각 구독시킨다
              - 소비자별 DLQ·재시도와 이벤트 ID 기반 업무 멱등성을 구성한다
              - 한 Standard 큐를 두 소비자가 함께 폴링해 전달 속도를 높인다
              - SNS에서 두 HTTP 소비자로 전송하고 성공 응답 직후 처리 상태를 버린다
      - id: saa-r2-Q27-24
        source_id: Q27-24
        type: mcq
        title: Q27-24 · 모의고사 C
        explain: |
          <p>EventBridge 규칙은 이벤트 패턴에 맞는 대상을 연결하며 여러 규칙이 같은 이벤트에 일치하면 필요한 여러 큐로 라우팅할 수 있다. 기존 bus·큐를 유지하면서 필드 조건을 선언적으로 추가하므로 중계 애플리케이션을 운영하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Bus에서 SNS로 보내고 메시지 속성 필터로 JSON 본문의 금액·상태를 선택한다</td>
          <td>MessageAttributes 필터는 JSON 본문 필드와 다른 범위를 검사한다. SNS 본문 필터는 별도 기능이지만 제시한 속성 필터만으로 bus 이벤트 본문 조건을 검사하지 못한다.</td>
          </tr>
          <tr>
          <td>Bus에서 Lambda로 전달하고 함수의 조건문에서 목적지 SQS 큐들을 선택한다</td>
          <td>Lambda로도 라우팅할 수 있지만 조건 변경·재시도·배포 코드를 직접 관리하게 되어 코드 운영을 줄이려는 조건에 불리하다.</td>
          </tr>
          <tr>
          <td>모든 Bus 이벤트를 단일 SQS로 보내고 단일 Pipe로 한 공용 큐에 전달한다</td>
          <td>단일 Pipe와 단일 공용 큐 전달만으로 기존 세 큐에 이벤트 패턴별 fanout을 수행하는 구성이 되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-bus.html">EventBridge event bus rules</a> · <a href="https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering-scope.html">SNS subscription filter scope</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">EventBridge bus의 규칙은 이벤트 필드 조건으로 서로 다른 대상을 선택하며 한 이벤트가 여러 규칙과 일치할 수 있다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">기존 AWS 이벤트와 앱 이벤트를 규칙으로 처리하면 별도 중계 코드 없이 기존 SQS 큐를 유지한다</a></p>
        quizzes:
          - q: EventBridge default bus에 EC2 상태 이벤트와 주문 앱의 JSON 이벤트가 들어온다. 이벤트의 금액·상태 필드에 따라
              세 기존 SQS 큐 중 하나 이상에 즉시 보내야 한다. 같은 이벤트가 여러 조건을 만족할 수 있으며 별도 중계 코드를
              운영하지 않으려 한다. 적절한 라우팅은?
            answer: 필드 조건별 EventBridge 규칙을 만들고 각 규칙에 해당 SQS 대상을 연결한다
            wrong:
              - Bus에서 SNS로 보내고 메시지 속성 필터로 JSON 본문의 금액·상태를 선택한다
              - Bus에서 Lambda로 전달하고 함수의 조건문에서 목적지 SQS 큐들을 선택한다
              - 모든 Bus 이벤트를 단일 SQS로 보내고 단일 Pipe로 한 공용 큐에 전달한다
      - id: saa-r2-Q27-25
        source_id: Q27-25
        type: mcq
        title: Q27-25 · 모의고사 C
        explain: |
          <p>Standard 워크플로는 장시간 대기와 분기·Retry·Catch를 표현할 수 있다. 호텔 최종 실패의 Catch 경로에서 좌석 반환을 명시적으로 호출해야 보상이 일어난다. 워크플로 서비스가 외부 예약을 자동 트랜잭션 롤백하는 것은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>각 단계 Lambda가 다음 함수를 호출하고 별도 테이블로 재시도·보상 상태를 관리한다</td>
          <td>직접 호출과 별도 상태 테이블로 구현은 가능하지만 장시간 상태 전이·재시도·보상 코드를 직접 운영해야 한다.</td>
          </tr>
          <tr>
          <td>Lambda가 모든 단계를 한 호출에서 순차 실행하며 승인 응답을 계속 기다린다</td>
          <td>수십 분 대기는 Lambda 한 호출의 실행 제한과 맞지 않으며 모든 상태·오류 전이를 함수가 직접 관리해야 한다.</td>
          </tr>
          <tr>
          <td>SQS FIFO로 각 단계를 연결하고 호텔 실패 때 처리하던 메시지를 DLQ로 보낸다</td>
          <td>FIFO와 DLQ는 순서·실패 메시지를 관리하지만 이미 완료한 외부 좌석 예약을 자동으로 취소하지 않는다. 보상 단계가 빠져 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html">Handling errors in Step Functions workflows - AWS Step Functions</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">상태 머신으로 장기 대기와 오류별 재시도를 조정하고 보상 API를 직접 정의할 수 있다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">외부 시스템을 포함한 업무는 워크플로를 사용해도 자동 원자적 롤백이 되지 않는다</a></p>
        quizzes:
          - q: 여행 예약은 좌석 확보→호텔 예약→결제를 진행한다. 외부 승인에는 수십 분 걸리고 호텔의 일시 오류는 제한적으로 재시도해야 한다. 호텔
              예약을 최종 포기하면 이미 확보한 좌석을 반환해야 한다. 워크플로 상태를 관리하는 코드 운영을 가장 줄일 방법은?
            answer: Step Functions Standard에 대기·제한 Retry·Catch와 좌석 반환 작업을 둔다
            wrong:
              - 각 단계 Lambda가 다음 함수를 호출하고 별도 테이블로 재시도·보상 상태를 관리한다
              - Lambda가 모든 단계를 한 호출에서 순차 실행하며 승인 응답을 계속 기다린다
              - SQS FIFO로 각 단계를 연결하고 호텔 실패 때 처리하던 메시지를 DLQ로 보낸다
      - id: saa-r2-Q27-26
        source_id: Q27-26
        type: mcq
        title: Q27-26 · 모의고사 C
        explain: |
          <p>Amazon MQ는 기존 메시징 API·프로토콜을 사용하는 앱이 관리형 브로커로 이전할 때 검토할 수 있다. 지원 버전·기능·ActiveMQ 배포와 클라이언트 failover를 확인해야 하며 코드 변경이 거의 없어야 하는 일정에서 브로커 운영을 줄이는 방향이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EventBridge 규칙으로 메시지를 분배하고 JMS 연결용 변환 서비스를 새로 만든다</td>
          <td>프로토콜 변환 서비스를 새로 구현하면 기존 기능 재현과 운영 부담이 늘어 한 달의 제한된 변경 일정에 덜 적합하다.</td>
          </tr>
          <tr>
          <td>SNS·SQS에 기능을 나누고 기존 JMS 트랜잭션·프로토콜을 앱에서 다시 구현한다</td>
          <td>SNS·SQS는 유용한 관리형 패턴이지만 기존 브로커 기능과 인터페이스를 앱에서 재구현하는 대규모 변경이 필요하다.</td>
          </tr>
          <tr>
          <td>ECS의 자체 ActiveMQ 브로커로 옮기고 OS·브로커 패치 절차를 그대로 유지한다</td>
          <td>컨테이너로 이전해도 자체 브로커와 기반 환경의 패치·HA 운영 책임이 남아 운영 감소 요구를 충분히 해결하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html">What is Amazon MQ? - Amazon MQ</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EB%A0%88%EA%B1%B0%EC%8B%9C-%EB%B8%8C%EB%A1%9C%EC%BB%A4%EC%99%80-saas-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">기존 ActiveMQ 프로토콜과 API 의존성을 유지해야 하므로 Amazon MQ가 우선 후보이다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EB%A0%88%EA%B1%B0%EC%8B%9C-%EB%B8%8C%EB%A1%9C%EC%BB%A4%EC%99%80-saas-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">엔진 버전·기능·가용성 구성을 검증해야 하며 다른 메시징 서비스와 호환을 가정하지 않는다</a></p>
        quizzes:
          - q: 회사 Java 앱은 JMS 클라이언트와 ActiveMQ의 기존 브로커 기능을 사용한다. 이달 안에 AWS로 옮겨야 하며 소비자 코드를 대폭
              바꿀 수 없다. 팀은 브로커 패치 부담을 줄이고 다중 AZ 장애 대응도 검증하려 한다. 가장 적절한 이전 방향은?
            answer: Amazon MQ의 지원 ActiveMQ 배포로 옮기고 클라이언트 호환·장애 조치를 검증한다
            wrong:
              - EventBridge 규칙으로 메시지를 분배하고 JMS 연결용 변환 서비스를 새로 만든다
              - SNS·SQS에 기능을 나누고 기존 JMS 트랜잭션·프로토콜을 앱에서 다시 구현한다
              - ECS의 자체 ActiveMQ 브로커로 옮기고 OS·브로커 패치 절차를 그대로 유지한다
      - id: saa-r2-Q27-27
        source_id: Q27-27
        type: mcq
        title: Q27-27 · 모의고사 C
        explain: |
          <p>요청 처리 서버와 세션·업로드의 수명을 분리해야 서버 간 이동과 교체에 안전하다. 외부 세션 저장소와 공유 가능한 영속 파일·객체 저장소를 사용하고 앱의 접근 방식을 맞추면 어느 처리 서버에서도 필요한 상태를 조회할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ALB의 sticky session을 켜고 세션·업로드를 각 서버의 기존 위치에 둔다</td>
          <td>Sticky session은 정상 서버에 대한 친화성을 제공하지만 서버 교체·장애 때 로컬 메모리와 파일을 다른 서버에서 사용할 수 있게 하지 않는다.</td>
          </tr>
          <tr>
          <td>기존 서버의 AMI로 확장하고 요청 분산은 라운드로빈으로 유지한다</td>
          <td>AMI는 생성 시 이미지이지 이후에 변경되는 세션·업로드를 모든 실행 서버에 동기화하는 서비스가 아니다.</td>
          </tr>
          <tr>
          <td>세션과 업로드를 서버별 EBS에 저장하고 각 서버에 자기 볼륨만 연결한다</td>
          <td>서버별 EBS는 개별 디스크의 영속성을 제공할 수 있지만 다른 앱 서버와 세션·파일을 공유하는 구조가 되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_stateless.html">REL05-BP06 Make systems stateless where possible</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EC%84%B8%EC%85%98%EC%9D%84-%EC%99%B8%EB%B6%80%EB%A1%9C-%EC%98%AE%EA%B2%A8-%EC%84%9C%EB%B2%84-%EA%B5%90%EC%B2%B4%EB%A5%BC-%ED%97%88%EC%9A%A9%ED%95%98%EA%B8%B0">수평 확장은 다음 요청이 다른 인스턴스에 도착할 수 있으므로 로컬 상태 의존성을 제거해야 한다</a> · <a href="/study/lessons/deep-dive/day-06.html#%EC%84%B8%EC%85%98%EC%9D%84-%EC%99%B8%EB%B6%80%EB%A1%9C-%EC%98%AE%EA%B2%A8-%EC%84%9C%EB%B2%84-%EA%B5%90%EC%B2%B4%EB%A5%BC-%ED%97%88%EC%9A%A9%ED%95%98%EA%B8%B0">외부 세션·파일 저장소에도 가용성과 만료·접근 정책을 설계한다</a></p>
        quizzes:
          - q: ALB 뒤 앱을 Auto Scaling으로 확장하면 일부 회원의 세션과 업로드가 보이지 않는다. 각 서버 메모리에 세션을, 로컬 디스크에
              업로드를 저장한다. 어느 서버로 요청을 보내도 동작하고 서버를 교체해도 상태를 유지해야 한다. 가장 적절한 변경은?
            answer: 세션을 외부 저장소로 옮기고 업로드를 공유 가능한 영속 저장소에 보관한다
            wrong:
              - ALB의 sticky session을 켜고 세션·업로드를 각 서버의 기존 위치에 둔다
              - 기존 서버의 AMI로 확장하고 요청 분산은 라운드로빈으로 유지한다
              - 세션과 업로드를 서버별 EBS에 저장하고 각 서버에 자기 볼륨만 연결한다
      - id: saa-r2-Q27-28
        source_id: Q27-28
        type: mcq
        title: Q27-28 · 모의고사 C
        explain: |
          <p>내부 기록 전에 죽으면 재시도에서 이전 성공 여부를 모를 수 있으므로 외부 API 자체의 멱등성 키가 필요하다. 완료된 작업은 영속 이력으로 확인해 재호출 없이 종결하고 성공 상태가 안전해진 뒤 메시지를 삭제한다. SQS 전달 특성만으로 외부 업무 효과가 정확히 한 번이 되지는 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>FIFO로 바꾸고 메시지 중복 제거 ID만으로 외부 결제 효과도 제어한다</td>
          <td>FIFO의 중복 제거는 외부 API의 결제 효과와 소비자 완료 기록을 묶는 트랜잭션이 아니다. 지정 실패 창의 업무 멱등성이 여전히 필요하다.</td>
          </tr>
          <tr>
          <td>외부 API 호출 전에 메시지를 삭제해 결제 성공 후 재전달을 없앤다</td>
          <td>처리 전에 삭제하면 결제 호출 전에 프로세스가 죽는 경우 작업을 잃어 메시지 유실 방지 요구에 어긋난다.</td>
          </tr>
          <tr>
          <td>작업 예상 시간보다 visibility timeout을 늘리고 완료 이력은 저장하지 않는다</td>
          <td>가시성 시간을 늘리면 동시 재전달을 줄일 수 있지만 작업자 중단·타임아웃 뒤 재전달과 이미 일어난 결제 효과를 제거하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">Amazon SQS visibility timeout - Amazon Simple Queue Service</a> · <a href="https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/">Making retries safe with idempotent APIs</a> · <a href="https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html">Transactional outbox pattern</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#outboxinbox%EC%99%80-%EC%99%B8%EB%B6%80-%EA%B2%B0%EC%A0%9C%EC%9D%98-%EA%B2%BD%EA%B3%84">외부 결제는 안정적인 작업 식별자로 멱등하게 호출해 결제 성공과 내부 기록 사이 실패도 안전하게 재시도한다</a> · <a href="/study/lessons/deep-dive/day-10.html#outboxinbox%EC%99%80-%EC%99%B8%EB%B6%80-%EA%B2%B0%EC%A0%9C%EC%9D%98-%EA%B2%BD%EA%B3%84">내부 완료 상태도 영속 저장하고 재전달 시 먼저 확인해야 외부 재호출 없이 이미 끝난 작업을 종결한다</a></p>
        quizzes:
          - q: SQS 작업자가 외부 결제 API의 성공 응답을 받은 뒤 로컬 완료 기록과 메시지 삭제 전에 죽었다. 메시지는 다시 전달될 수 있다. 외부
              API는 동일 작업 키의 반복 호출을 한 결제로 처리한다. 내부 완료 이력도 남기면서 결제 중복과 메시지 유실을 줄일
              두 조치는?
            answer: 외부 결제 호출에 주문·작업별로 동일한 멱등성 키를 재사용한다
            wrong:
              - FIFO로 바꾸고 메시지 중복 제거 ID만으로 외부 결제 효과도 제어한다
              - 외부 API 호출 전에 메시지를 삭제해 결제 성공 후 재전달을 없앤다
              - 작업 예상 시간보다 visibility timeout을 늘리고 완료 이력은 저장하지 않는다
            answers:
              - 외부 결제 호출에 주문·작업별로 동일한 멱등성 키를 재사용한다
              - 완료 이력을 영속 저장하고 재전달 시 확인한 뒤 메시지를 삭제한다
            options:
              - FIFO로 바꾸고 메시지 중복 제거 ID만으로 외부 결제 효과도 제어한다
              - 외부 결제 호출에 주문·작업별로 동일한 멱등성 키를 재사용한다
              - 완료 이력을 영속 저장하고 재전달 시 확인한 뒤 메시지를 삭제한다
              - 외부 API 호출 전에 메시지를 삭제해 결제 성공 후 재전달을 없앤다
              - 작업 예상 시간보다 visibility timeout을 늘리고 완료 이력은 저장하지 않는다
      - id: saa-r2-Q27-29
        source_id: Q27-29
        type: mcq
        title: Q27-29 · 모의고사 C
        explain: |
          <p>작업자당 적체 목표는 허용 대기 시간과 평균 처리 시간을 연결해 정할 수 있다. 처리 속도가 바뀌면 목표를 재검토하고 가장 오래된 메시지 나이로 한 시간의 업무 기한도 관측해야 한다. 접수 계층과 소비 계층의 확장은 별개다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>접수 API의 CPU를 목표로 삼고 송장 작업자 수는 같은 비율로 조정한다</td>
          <td>접수 API의 CPU는 생성기의 적체나 처리 속도와 직접 비례하지 않으므로 소비자 지연을 안정적으로 제어하는 지표가 아니다.</td>
          </tr>
          <tr>
          <td>생성 후 누적된 메시지 총수를 목표 추적 지표로 사용해 작업자를 조정한다</td>
          <td>전체 누적 메시지 수는 처리 후에도 계속 증가하며 작업자당 부하처럼 용량 증가에 반비례하는 지표가 아니다.</td>
          </tr>
          <tr>
          <td>SQS의 현재 큐 길이만 같은 목표로 유지하고 작업자 수·처리 시간은 반영하지 않는다</td>
          <td>동일한 총 적체라도 작업자 수와 처리 시간이 달라지면 대기 시간이 달라진다. 고정 총 큐 길이만으로 제시한 기한을 판단하기 어렵다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html">Scaling policy based on Amazon SQS - Amazon EC2 Auto Scaling</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%ED%81%90-%EC%9E%91%EC%97%85%EC%9E%90%EC%9D%98-%EC%A0%81%EC%B2%B4%EB%9F%89%EC%9D%84-%EA%B3%84%EC%82%B0%ED%95%98%EA%B8%B0">독립 소비자의 부하는 작업당 처리 시간·처리자당 적체·대기 시간으로 판단한다</a> · <a href="/study/lessons/deep-dive/day-06.html#%ED%81%90-%EC%9E%91%EC%97%85%EC%9E%90%EC%9D%98-%EC%A0%81%EC%B2%B4%EB%9F%89%EC%9D%84-%EA%B3%84%EC%82%B0%ED%95%98%EA%B8%B0">접수와 처리의 확장을 분리해야 큐가 허용하는 지연 안에서 소비량을 조절할 수 있다</a></p>
        quizzes:
          - q: 접수 API와 분리한 SQS 송장 생성기는 건당 처리 시간이 달라졌다. 같은 큐 길이에서도 작업자가 많으면 대기가 짧고 외부 서비스가
              느리면 대기가 길다. 접수 API는 안정적이며 송장은 한 시간 안에 완료해야 한다. 소비자 Auto Scaling의
              가장 적절한 기준은?
            answer: 작업자당 처리 적체를 처리 시간에 맞춰 목표로 삼고 가장 오래된 메시지 나이도 본다
            wrong:
              - 접수 API의 CPU를 목표로 삼고 송장 작업자 수는 같은 비율로 조정한다
              - 생성 후 누적된 메시지 총수를 목표 추적 지표로 사용해 작업자를 조정한다
              - SQS의 현재 큐 길이만 같은 목표로 유지하고 작업자 수·처리 시간은 반영하지 않는다
      - id: saa-r2-Q27-30
        source_id: Q27-30
        type: mcq
        title: Q27-30 · 모의고사 C
        explain: |
          <p>일반 Multi-AZ DB instance의 standby는 일반 조회 대상이 아니다. HA 배포를 유지하면서 읽기 복제본을 추가하고 보고서 연결을 옮기면 허용된 비동기 지연 안에서 읽기 부하를 분리할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>매일 스냅샷으로 보고서용 DB를 복원하고 종일 필요한 통계를 그 DB에 연결한다</td>
          <td>매일 복원한 정적 시점은 하루 동안 데이터가 계속 변하는 업무에서 수분 지연 조건을 유지하지 못하고 복원 운영도 추가된다.</td>
          </tr>
          <tr>
          <td>기존 standby로 통계 연결을 옮기고 기본 인스턴스는 주문 쓰기만 처리한다</td>
          <td>지문에서 지정한 일반 standby는 읽기용 엔드포인트로 사용할 수 없다. 읽기 가능한 다른 Multi-AZ 유형과 구분해야 한다.</td>
          </tr>
          <tr>
          <td>기본 인스턴스의 DB 연결 한도를 늘리고 보고서 연결도 계속 기본으로 보낸다</td>
          <td>연결 수만 늘려도 같은 기본 DB가 보고서를 계속 실행하므로 읽기 부하가 분리되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html">Working with DB instance read replicas - Amazon Relational Database Service</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#%EA%B0%80%EC%9A%A9%EC%84%B1-%EC%9D%BD%EA%B8%B0-%ED%99%95%EC%9E%A5%EA%B3%BC-%EC%97%B0%EA%B2%B0-%EC%88%98">기존 Multi-AZ DB instance의 standby는 HA용이고 일반 조회 대상이 아니다</a> · <a href="/study/lessons/deep-dive/day-07.html#%EA%B0%80%EC%9A%A9%EC%84%B1-%EC%9D%BD%EA%B8%B0-%ED%99%95%EC%9E%A5%EA%B3%BC-%EC%97%B0%EA%B2%B0-%EC%88%98">지연을 허용하는 통계를 읽기 복제본에 보내면 장애 대응과 조회 분산을 각각 충족한다</a></p>
        quizzes:
          - q: 주문 RDS MySQL은 일반 Multi-AZ DB instance로 자동 장애 조치를 제공한다. 매일 종일 실행되는 통계 조회로 읽기
              부하가 커졌고 통계는 수분 지연을 허용한다. AZ 장애 자동 복구와 주문 쓰기를 유지하며 보고서 부하를 분리할 변경은?
            answer: 기존 Multi-AZ를 유지하고 비동기 읽기 복제본으로 통계 연결을 옮긴다
            wrong:
              - 매일 스냅샷으로 보고서용 DB를 복원하고 종일 필요한 통계를 그 DB에 연결한다
              - 기존 standby로 통계 연결을 옮기고 기본 인스턴스는 주문 쓰기만 처리한다
              - 기본 인스턴스의 DB 연결 한도를 늘리고 보고서 연결도 계속 기본으로 보낸다
      - id: saa-r2-Q27-31
        source_id: Q27-31
        type: mcq
        title: Q27-31 · 모의고사 C
        explain: |
          <p>RDS Multi-AZ DB instance는 관리형 자동 장애 조치 요구를, AZ별 Zonal NAT와 같은 AZ 경로는 한 AZ 출구 손실의 전파를 줄이는 요구를 해결한다. DB 복제와 앱의 인터넷 출구는 별도 의존성이므로 둘 다 변경해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>AZ B에 비동기 읽기 복제본을 만들고 두 AZ 서브넷을 새 AZ B NAT로 보낸다</td>
          <td>일반 읽기 복제본의 자동 승격이 없고 AZ B 출구에 모든 앱이 의존하는 단일 AZ 의존도 남는다.</td>
          </tr>
          <tr>
          <td>RDS Multi-AZ DB instance로 전환하고 두 AZ 서브넷을 기존 AZ A NAT로 보낸다</td>
          <td>DB는 자동 복구할 수 있어도 AZ A 손실 시 AZ B 앱도 AZ A NAT에 의존하여 결제 호출이 막힌다.</td>
          </tr>
          <tr>
          <td>AZ B에 비동기 읽기 복제본을 만들고 각 AZ 서브넷을 같은 AZ NAT로 보낸다</td>
          <td>출구는 분리되지만 일반 비동기 읽기 복제본은 Multi-AZ DB instance와 같은 자동 장애 조치를 제공하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html">RDS Multi-AZ DB instances</a> · <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html">NAT gateway basics</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EB%8B%A4%EC%A4%91-az%EC%9D%98-%EC%97%AC%EC%9C%A0-%EC%9A%A9%EB%9F%89%EA%B3%BC-%EB%B9%84%EC%9A%A9">Multi-AZ DB instance는 DB 장애에 대한 관리형 자동 failover를 제공한다</a> · <a href="/study/lessons/deep-dive/day-06.html#%EB%8B%A4%EC%A4%91-az%EC%9D%98-%EC%97%AC%EC%9C%A0-%EC%9A%A9%EB%9F%89%EA%B3%BC-%EB%B9%84%EC%9A%A9">Zonal NAT는 AZ 의존 자원이므로 각 AZ의 앱이 해당 AZ NAT를 사용해야 다른 AZ 장애 시에도 살아남은 앱의 출구가 남는다</a> · <a href="/study/lessons/deep-dive/day-07.html#%EA%B0%80%EC%9A%A9%EC%84%B1-%EC%9D%BD%EA%B8%B0-%ED%99%95%EC%9E%A5%EA%B3%BC-%EC%97%B0%EA%B2%B0-%EC%88%98">이는 장애 조치 동안 연결 중단이 없다는 보장은 아니다</a></p>
        quizzes:
          - q: AZ A/B 앱이 단일 AZ RDS와 AZ A의 Zonal NAT를 사용한다. 한 AZ가 손실되면 살아남은 앱이 DB 쓰기와 외부 결제
              호출을 재개해야 한다. DB 재연결은 구현되어 있고 Zonal NAT 방식은 유지한다. 관리형 DB 자동 복구와 AZ별
              출구 독립을 함께 얻는 변경은?
            answer: RDS Multi-AZ DB instance로 전환하고 각 AZ 서브넷을 같은 AZ NAT로 보낸다
            wrong:
              - AZ B에 비동기 읽기 복제본을 만들고 두 AZ 서브넷을 새 AZ B NAT로 보낸다
              - RDS Multi-AZ DB instance로 전환하고 두 AZ 서브넷을 기존 AZ A NAT로 보낸다
              - AZ B에 비동기 읽기 복제본을 만들고 각 AZ 서브넷을 같은 AZ NAT로 보낸다
      - id: saa-r2-Q27-32
        source_id: Q27-32
        type: mcq
        title: Q27-32 · 모의고사 C
        explain: |
          <p>복구 환경의 인증·키·비밀값·네트워크가 주 리전 없이 작동해야 준비한 앱을 실제로 시작할 수 있다. RPO는 데이터 손실 범위, RTO는 업무 서비스 복구까지의 시간으로 나누어 전체 전환을 측정해야 한다. 복제 성공만으로 앱 복구 시간을 대신하지 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>주 리전의 인증 경로를 재시작한 뒤 복구 리전 앱 확장 시간만 별도로 측정한다</td>
          <td>실제 주 리전 장애 시 사용할 수 없는 경로를 먼저 복구해 놓고 재면 독립 복구라는 실패 조건을 재현하지 못한다.</td>
          </tr>
          <tr>
          <td>축소 앱을 상시 두 배로 늘리고 남은 인증·DNS 전환 단계는 문서로만 점검한다</td>
          <td>컴퓨팅 대수만 늘려도 인증 의존성 실패는 해결되지 않는다. 문서 점검만으로 실행 가능한 시간 목표를 입증할 수 없다.</td>
          </tr>
          <tr>
          <td>복제 지연이 10분 이내인지만 관측하고 그 수치를 애플리케이션 RTO로 사용한다</td>
          <td>복제 지연은 RPO 판단에 중요하지만 인증·앱 시작·트래픽 전환 시간이 빠져 있어 RTO 충족을 증명하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_planning_for_recovery_dr_tested.html">REL13-BP03 Test disaster recovery implementation</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">복구 목표는 DB 사본의 존재만이 아니라 독립적인 운영 접근과 전체 업무 재개로 검증한다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">복제 지연은 데이터 손실 범위, 실제 전환·확장·검증은 복구 시간을 판단하는 근거다</a></p>
        quizzes:
          - q: 회사는 다른 리전에 복제 데이터와 축소 앱을 준비해 RPO 10분·RTO 1시간을 목표로 한다. 훈련에서는 주 리전에 있는 인증·비밀값
              경로에 접근하지 못해 앱 시작이 지연됐다. 데이터 복제가 정상이라는 것 외에 목표 달성을 검증할 두 항목은?
            answer: 주 리전 장애 중에도 복구 환경의 인증·KMS·비밀값·연결 경로가 작동하는지 시험한다
            wrong:
              - 주 리전의 인증 경로를 재시작한 뒤 복구 리전 앱 확장 시간만 별도로 측정한다
              - 축소 앱을 상시 두 배로 늘리고 남은 인증·DNS 전환 단계는 문서로만 점검한다
              - 복제 지연이 10분 이내인지만 관측하고 그 수치를 애플리케이션 RTO로 사용한다
            answers:
              - 주 리전 장애 중에도 복구 환경의 인증·KMS·비밀값·연결 경로가 작동하는지 시험한다
              - 복제 지연과 앱 확장·연결 전환·업무 검증을 포함한 실제 복구 시간을 측정한다
            options:
              - 주 리전의 인증 경로를 재시작한 뒤 복구 리전 앱 확장 시간만 별도로 측정한다
              - 축소 앱을 상시 두 배로 늘리고 남은 인증·DNS 전환 단계는 문서로만 점검한다
              - 주 리전 장애 중에도 복구 환경의 인증·KMS·비밀값·연결 경로가 작동하는지 시험한다
              - 복제 지연과 앱 확장·연결 전환·업무 검증을 포함한 실제 복구 시간을 측정한다
              - 복제 지연이 10분 이내인지만 관측하고 그 수치를 애플리케이션 RTO로 사용한다
      - id: saa-r2-Q27-33
        source_id: Q27-33
        type: mcq
        title: Q27-33 · 모의고사 C
        explain: |
          <p>PITR은 지정 시점으로 새 DB 인스턴스를 복원하므로 현재 환경을 바로 덮어쓰지 않고 과거 데이터를 검증할 수 있다. 사고 이후 정상 쓰기도 있으므로 복원본 검증과 필요한 데이터 조정·전환 계획이 뒤따라야 한다. 복제와 HA는 논리 삭제를 되돌리는 백업이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Multi-AZ 장애 조치로 standby를 승격한 뒤 새 주문과 삭제 전 주문을 확인한다</td>
          <td>Multi-AZ는 동일 DB 변경을 유지하는 가용성 구조다. standby 승격이 논리 삭제를 취소하지 않는다.</td>
          </tr>
          <tr>
          <td>현재 DB를 최신 시점으로 재시작하고 애플리케이션 연결 풀만 새로 만든다</td>
          <td>재시작과 연결 풀 갱신은 연결 문제를 해결할 수 있지만 삭제된 행을 과거 시점으로 복원하지 못한다.</td>
          </tr>
          <tr>
          <td>읽기 복제본을 즉시 승격하고 삭제 전 주문이 다시 나타나는지 확인한다</td>
          <td>삭제가 이미 복제되었으므로 읽기 복제본을 승격해도 삭제 전 시점으로 되돌아가지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html">Restoring a DB instance to a specified time for Amazon RDS - Amazon Relational Database Service</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#pitr%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7%EC%97%90%EC%84%9C-%EC%84%9C%EB%B9%84%EC%8A%A4-%EB%B3%B5%EA%B5%AC%EA%B9%8C%EC%A7%80">논리적 삭제는 복제에도 전달되므로 과거 시점 백업을 사용해야 한다</a> · <a href="/study/lessons/deep-dive/day-07.html#pitr%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7%EC%97%90%EC%84%9C-%EC%84%9C%EB%B9%84%EC%8A%A4-%EB%B3%B5%EA%B5%AC%EA%B9%8C%EC%A7%80">PITR은 새 DB를 만들며 데이터·권한·앱 접속을 확인한 뒤 운영 연결을 바꿔야 한다</a></p>
        quizzes:
          - q: 운영자가 RDS 주문 테이블을 삭제했고 변경이 모든 읽기 복제본에 전파됐다. 삭제 직전 시점은 자동 백업 보존 범위에 있다. 현재 DB에는
              사고 이후 다른 정상 주문도 들어왔다. 기존 DB를 보존하며 삭제 전 데이터를 검증할 가장 적절한 첫 복구 절차는?
            answer: 삭제 직전으로 새 DB를 PITR 복원하고 검증·데이터 조정 후 연결 전환을 계획한다
            wrong:
              - Multi-AZ 장애 조치로 standby를 승격한 뒤 새 주문과 삭제 전 주문을 확인한다
              - 현재 DB를 최신 시점으로 재시작하고 애플리케이션 연결 풀만 새로 만든다
              - 읽기 복제본을 즉시 승격하고 삭제 전 주문이 다시 나타나는지 확인한다
      - id: saa-r2-Q27-34
        source_id: Q27-34
        type: mcq
        title: Q27-34 · 모의고사 C
        explain: |
          <p>ASG가 ELB 상태를 사용해야 앱 계층의 실패를 인스턴스 교체에 반영한다. Health check grace period는 시작 중 앱 준비 시간을 기다리는 용도다. 스케일링 지표의 instance warmup과 unhealthy 판단 유예는 같은 설정이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ASG의 instance warmup만 4분으로 두고 EC2 시스템 상태만 계속 사용한다</td>
          <td>Warmup은 확장 지표·정책 동작과 관련되며 ELB 상태 확인 사용을 대신하지 않는다. 앱 장애가 EC2 시스템 정상으로 남는 원인이 해결되지 않는다.</td>
          </tr>
          <tr>
          <td>ALB 대상 해제를 지연시키고 ASG의 상태 확인 유예는 0으로 유지한다</td>
          <td>대상 해제 지연은 이미 등록 해제된 요청의 드레이닝이며 신규 서버의 시작 유예나 ASG의 앱 상태 확인 설정을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>ALB의 unhealthy 임계값만 높이고 ASG의 EC2 상태 확인 설정은 유지한다</td>
          <td>ALB 임계값을 바꿔도 ASG가 ELB의 unhealthy를 교체 판단에 사용하지 않으면 앱 실패를 반영하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html">Health checks for instances in an Auto Scaling group - Amazon EC2 Auto Scaling</a> · <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-check-grace-period.html">Auto Scaling 상태 확인 유예</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#health-grace%EC%99%80-warmup%EC%9D%80-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%8B%9C%EA%B0%84%EC%9D%84-%EB%B3%B4%ED%98%B8%ED%95%9C%EB%8B%A4">앱 실패를 ASG 교체 판단에 반영하려면 ELB 상태 확인을 사용해야 한다</a> · <a href="/study/lessons/deep-dive/day-06.html#health-grace%EC%99%80-warmup%EC%9D%80-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%8B%9C%EA%B0%84%EC%9D%84-%EB%B3%B4%ED%98%B8%ED%95%9C%EB%8B%A4">준비 시간 유예는 새 인스턴스를 너무 일찍 교체하지 않게 돕지만 ALB의 정상 대상 확인은 계속 필요하다</a></p>
        quizzes:
          - q: ALB는 HTTP /health가 실패한 앱을 unhealthy로 표시하지만 ASG는 EC2 시스템 검사만 사용해 교체하지 않는다. 새
              서버는 준비에 4분 걸리며 준비 중에는 /health가 실패한다. 장애 앱은 교체하고 정상 시작 과정의 반복 교체는
              줄일 설정은?
            answer: ASG에서 ELB 상태 확인을 사용하고 준비 시간에 맞는 상태 확인 유예를 설정한다
            wrong:
              - ASG의 instance warmup만 4분으로 두고 EC2 시스템 상태만 계속 사용한다
              - ALB 대상 해제를 지연시키고 ASG의 상태 확인 유예는 0으로 유지한다
              - ALB의 unhealthy 임계값만 높이고 ASG의 EC2 상태 확인 설정은 유지한다
      - id: saa-r2-Q27-35
        source_id: Q27-35
        type: mcq
        title: Q27-35 · 모의고사 C
        explain: |
          <p>Warm standby는 장애 때 실제로 목표 용량까지 확장할 수 있어야 한다. 복구 리전의 IP·서비스 할당량·실행 가능 용량을 미리 준비하고 DB 승격 후 앱 확장과 트래픽 전환까지 재시험해야 RTO의 병목을 해결한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>복구 앱 최소 대수를 더 낮춰 평상시 주소를 아끼고 기존 서브넷은 유지한다</td>
          <td>평상시 주소 소비를 줄일 수는 있지만 장애 시 최대 대수를 담을 주소가 부족한 서브넷을 유지하면 같은 확장 실패가 재현될 수 있다.</td>
          </tr>
          <tr>
          <td>복구 앱의 현재 소규모 대수를 유지하고 DB 복제 주기만 더 짧게 설정한다</td>
          <td>복제 주기를 줄여도 EC2가 사용할 주소 부족과 앱 확장 실패는 해결되지 않는다. 데이터 RPO와 앱 RTO의 병목이 다르다.</td>
          </tr>
          <tr>
          <td>주 리전 EC2의 Savings Plans 약정을 늘리고 동일 AMI를 복구 리전에 복사한다</td>
          <td>Savings Plans는 할인 약정이며 복구 리전의 주소나 실행 용량을 확보하지 않는다. AMI 복사만으로 네트워크 용량이 늘지도 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html">REL13-BP02 Use defined recovery strategies to meet the recovery objectives - Reliability Pillar</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">Warm standby의 이름이 확장 성공을 보장하지 않는다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">목표 시간 내 시작하려면 IP, 할당량, EC2 실제 용량과 앱 준비·업무 검증을 복구 환경에서 시험해야 한다</a></p>
        quizzes:
          - q: Warm standby의 복구 리전에는 작은 앱과 복제 DB가 있다. 최근 훈련에서 앱 확장은 서브넷 IP가 부족해 멈췄고, DB는 정상
              승격되었다. RTO를 맞추려면 앱을 즉시 늘릴 수 있어야 한다. 가장 적절한 개선은?
            answer: 복구 서브넷 주소·할당량·실행 용량을 준비하고 최대 확장부터 전환까지 재시험한다
            wrong:
              - 복구 앱 최소 대수를 더 낮춰 평상시 주소를 아끼고 기존 서브넷은 유지한다
              - 복구 앱의 현재 소규모 대수를 유지하고 DB 복제 주기만 더 짧게 설정한다
              - 주 리전 EC2의 Savings Plans 약정을 늘리고 동일 AMI를 복구 리전에 복사한다
      - id: saa-r2-Q27-36
        source_id: Q27-36
        type: mcq
        title: Q27-36 · 모의고사 C
        explain: |
          <p>애플리케이션 트래픽을 되돌릴 수 있어도 공유 DB의 파괴적 변경은 자동 취소되지 않는다. 이전 버전과 호환되는 확장 단계로 전환하고 롤백 기간 이후에 사용하지 않는 열을 제거하는 방식이 빠른 복귀와 신규 쓰기를 함께 고려한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>green 배포 때 열을 삭제하고 장애 시 ALB만 blue로 다시 전환한다</td>
          <td>삭제된 열이 돌아오지 않으므로 ALB를 전환해도 이전 앱의 쿼리가 계속 실패한다.</td>
          </tr>
          <tr>
          <td>blue 인스턴스를 더 오래 켜 두되 두 앱이 사용하는 DB 스키마 변경은 즉시 적용한다</td>
          <td>인스턴스를 보존하는 것과 그 앱이 의존하는 스키마를 보존하는 것은 다르다. 공유 DB의 호환성 실패가 남는다.</td>
          </tr>
          <tr>
          <td>트래픽 전환 전 DB 스냅샷을 만들고 롤백 때 모든 신규 결제 쓰기를 복원본으로 대체한다</td>
          <td>과거 스냅샷으로 전체 DB를 대체하면 신규 결제 쓰기가 사라질 수 있고 복원 시간도 필요해 빠른 앱 롤백의 대안이 되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/whitepapers/latest/blue-green-deployments/welcome.html">Blue/Green Deployments on AWS - Blue/Green Deployments on AWS</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EC%83%88-%EC%9D%B4%EB%AF%B8%EC%A7%80-%EB%B0%B0%ED%8F%AC%EC%99%80-%EB%90%98%EB%8F%8C%EB%A6%AC%EA%B8%B0%EC%9D%98-%EB%B2%94%EC%9C%84">두 앱 환경을 남겨도 공유 데이터의 비호환 변경까지 되돌리는 것은 아니다</a> · <a href="/study/lessons/deep-dive/day-06.html#%EC%83%88-%EC%9D%B4%EB%AF%B8%EC%A7%80-%EB%B0%B0%ED%8F%AC%EC%99%80-%EB%90%98%EB%8F%8C%EB%A6%AC%EA%B8%B0%EC%9D%98-%EB%B2%94%EC%9C%84">확장·축소 같은 호환 배포와 백업·복구 계획을 함께 설계해야 실제 복귀 가능성을 확보한다</a></p>
        quizzes:
          - q: 결제 앱을 blue/green으로 배포한다. 이전 blue 앱은 DB의 discount 열을 읽지만 green 배포가 그 열을 삭제해 롤백
              시험이 실패했다. 두 버전은 같은 DB를 사용하며 향후에도 빠르게 앱 트래픽을 되돌려야 한다. 가장 적절한 배포
              절차는?
            answer: 롤백 기간에는 이전 열을 유지하는 호환 변경을 먼저 하고 이후에 제거한다
            wrong:
              - green 배포 때 열을 삭제하고 장애 시 ALB만 blue로 다시 전환한다
              - blue 인스턴스를 더 오래 켜 두되 두 앱이 사용하는 DB 스키마 변경은 즉시 적용한다
              - 트래픽 전환 전 DB 스냅샷을 만들고 롤백 때 모든 신규 결제 쓰기를 복원본으로 대체한다
      - id: saa-r2-Q27-37
        source_id: Q27-37
        type: mcq
        title: Q27-37 · 모의고사 C
        explain: |
          <p>각 시도의 타임아웃과 전체 5초 기한·횟수를 함께 제한해야 자원이 무한 점유되지 않는다. 지수 백오프는 재시도 압력을 낮추고 지터는 여러 호출자가 동시에 재시도하는 동조를 줄인다. 영구 오류나 비멱등 작업은 별도 판단이 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 서버가 1초 고정 간격으로 5초 안에서 같은 시점에 다시 호출한다</td>
          <td>같은 고정 간격은 호출자들의 재시도를 동조시켜 장애 중 API에 반복적인 부하 파동을 줄 수 있다.</td>
          </tr>
          <tr>
          <td>전체 기한을 1분으로 늘리고 모든 오류에 같은 재시도 정책을 적용한다</td>
          <td>1분은 5초 업무 기한을 넘고 영구 오류까지 재시도하면 회복 가능성 없이 부하만 늘릴 수 있다.</td>
          </tr>
          <tr>
          <td>연결 풀 크기를 늘린 뒤 요청마다 성공할 때까지 즉시 다시 호출한다</td>
          <td>연결 수 확장은 원인인 재시도 증폭을 제한하지 않으며 성공 전까지 무제한 호출하면 다운스트림 과부하도 악화된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/">Timeouts, retries, and backoff with jitter | AWS Builder Center</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EC%9E%A5%EC%95%A0-%EB%95%8C-%ED%99%95%EC%9E%A5%ED%95%98%EB%8A%94-%EB%8A%A5%EB%A0%A5%EB%8F%84-%EB%AF%B8%EB%A6%AC-%ED%99%95%EB%B3%B4%ED%95%98%EA%B8%B0">재시도 간격을 늘리고 분산하며 전체 작업 기한과 시도 횟수를 제한해야 회복 중인 시스템에 부하가 몰리지 않는다</a> · <a href="/study/lessons/deep-dive/day-06.html#%EC%9E%A5%EC%95%A0-%EB%95%8C-%ED%99%95%EC%9E%A5%ED%95%98%EB%8A%94-%EB%8A%A5%EB%A0%A5%EB%8F%84-%EB%AF%B8%EB%A6%AC-%ED%99%95%EB%B3%B4%ED%95%98%EA%B8%B0">추가 처리의 업무 중복 여부와 진입 제한도 함께 검토한다</a></p>
        quizzes:
          - q: 외부 재고 API가 느려지면 모든 주문 서버가 즉시 반복 호출해 연결 풀이 고갈된다. 재고 조회는 5초 이내에 결과나 실패를 반환해야 하며
              재시도는 일시 장애에만 유용하다. 장애 때 호출 폭증을 줄이는 가장 적절한 정책은?
            answer: 호출 타임아웃·총 기한·횟수를 제한하고 지수 백오프에 지터를 적용한다
            wrong:
              - 모든 서버가 1초 고정 간격으로 5초 안에서 같은 시점에 다시 호출한다
              - 전체 기한을 1분으로 늘리고 모든 오류에 같은 재시도 정책을 적용한다
              - 연결 풀 크기를 늘린 뒤 요청마다 성공할 때까지 즉시 다시 호출한다
      - id: saa-r2-Q27-38
        source_id: Q27-38
        type: mcq
        title: Q27-38 · 모의고사 C
        explain: |
          <p>EFS Regional은 여러 AZ에 파일 데이터를 저장하고 공유 POSIX 접근을 제공한다. 각 AZ 마운트 타깃을 통해 앱이 같은 파일 시스템을 사용하게 하면 자체 파일 서버·복제 운영을 줄이면서 AZ 장애 요구를 고려할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EFS One Zone을 만들고 세 AZ 서버가 그 파일 시스템을 마운트한다</td>
          <td>여러 AZ에서 마운트해도 One Zone 파일 데이터의 저장 범위는 한 AZ다. 그 AZ 손실에 대한 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>단일 AZ의 EBS Multi-Attach 볼륨을 지원 인스턴스에 연결한다</td>
          <td>EBS Multi-Attach의 지원 연결은 같은 AZ 범위이며 세 AZ의 관리형 공유 파일 시스템을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>서버마다 EBS 볼륨을 두고 DataSync 예약 작업으로 변경 파일을 복사한다</td>
          <td>주기 복사는 실시간 동시 공유 디렉터리가 아니어서 앱 사이에 파일 변경 지연과 충돌 관리가 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/efs/latest/ug/features.html">Features of Amazon EFS - Amazon Elastic File System</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#efs-%EB%A7%88%EC%9A%B4%ED%8A%B8%EC%99%80-%EC%B2%98%EB%A6%AC%EB%9F%89">Regional EFS는 여러 AZ에 데이터를 저장하고 여러 Linux 서버가 공유 파일 경로로 접근할 수 있다</a> · <a href="/study/lessons/deep-dive/day-03.html#efs-%EB%A7%88%EC%9A%B4%ED%8A%B8%EC%99%80-%EC%B2%98%EB%A6%AC%EB%9F%89">서버 AZ의 마운트 타깃을 사용하면 해당 경로와 다중 AZ 저장 요구를 연결한다</a></p>
        quizzes:
          - q: 세 AZ의 Linux 웹 서버가 동일한 업로드 디렉터리를 동시에 읽고 쓴다. 기존 POSIX 파일 경로를 유지해야 하며 한 AZ가
              손실되어도 파일 계층을 사용할 수 있어야 한다. 파일 서버와 복제 소프트웨어를 직접 운영하지 않는 가장 적절한 저장
              구조는?
            answer: EFS Regional을 만들고 앱이 있는 각 AZ에 마운트 타깃을 둔다
            wrong:
              - EFS One Zone을 만들고 세 AZ 서버가 그 파일 시스템을 마운트한다
              - 단일 AZ의 EBS Multi-Attach 볼륨을 지원 인스턴스에 연결한다
              - 서버마다 EBS 볼륨을 두고 DataSync 예약 작업으로 변경 파일을 복사한다
      - id: saa-r2-Q27-39
        source_id: Q27-39
        type: mcq
        title: Q27-39 · 모의고사 C
        explain: |
          <p>S3 File Gateway는 SMB 파일 인터페이스와 로컬 캐시를 제공하며 객체를 S3에 보관한다. 실제 운영에는 캐시의 미전송 데이터와 업로드 대역폭을 계획하고 네트워크 단절 시 캐시되지 않은 파일을 읽을 수 없다는 조건도 검증해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Volume Gateway의 캐시된 iSCSI 볼륨을 기존 SMB 파일 API 대신 앱에 연결한다</td>
          <td>Volume Gateway는 블록 iSCSI 인터페이스이며 기존 앱이 요구하는 SMB 파일 공유와 다르다.</td>
          </tr>
          <tr>
          <td>DataSync로 기존 SMB 서버와 S3를 매시간 복사하고 SMB 서버를 계속 운영한다</td>
          <td>DataSync는 데이터 전송 작업이고 계속 사용할 파일 서버를 대체하는 SMB 캐시 게이트웨이는 아니다. 기존 서버 운영도 남는다.</td>
          </tr>
          <tr>
          <td>FSx for Windows에 파일을 옮기고 모든 SMB 요청을 VPN 너머 파일 시스템으로 보낸다</td>
          <td>관리형 SMB 파일 시스템은 제공하지만 S3 객체 보관과 온프레미스 로컬 캐시라는 지정 아키텍처와 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html">What is Amazon S3 File Gateway - AWS Storage Gateway</a> · <a href="https://aws.amazon.com/storagegateway/faqs/">Storage Gateway 캐시와 미전송 데이터</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%ED%8C%8C%EC%9D%BC-%EC%A0%91%EC%86%8D-%EA%B3%84%EC%B8%B5%EA%B3%BC-db-%EB%B3%80%EA%B2%BD-%EB%B3%B5%EC%A0%9C%EB%A5%BC-%EA%B5%AC%EB%B3%84%ED%95%9C%EB%8B%A4">S3 File Gateway는 기존 파일 프로토콜과 S3 객체 저장을 연결한다</a> · <a href="/study/lessons/deep-dive/day-13.html#%ED%8C%8C%EC%9D%BC-%EC%A0%91%EC%86%8D-%EA%B3%84%EC%B8%B5%EA%B3%BC-db-%EB%B3%80%EA%B2%BD-%EB%B3%B5%EC%A0%9C%EB%A5%BC-%EA%B5%AC%EB%B3%84%ED%95%9C%EB%8B%A4">로컬에 없는 데이터나 아직 전송되지 않은 변경은 연결·캐시 상태에 영향을 받으므로 버퍼와 장애 동작도 검증한다</a></p>
        quizzes:
          - q: 온프레미스 Windows 앱은 SMB 파일 공유를 계속 사용해야 한다. 원본 파일은 S3 객체로 보관하고 최근 읽은 데이터는 로컬에
              캐시하려 한다. 기존 SMB 서버의 주기 복사보다 관리형 게이트웨이를 선호한다. 서비스 선택과 단절 시 운영을 위해
              필요한 두 조치는?
            answer: S3 File Gateway로 SMB 공유와 로컬 캐시를 제공한다
            wrong:
              - Volume Gateway의 캐시된 iSCSI 볼륨을 기존 SMB 파일 API 대신 앱에 연결한다
              - DataSync로 기존 SMB 서버와 S3를 매시간 복사하고 SMB 서버를 계속 운영한다
              - FSx for Windows에 파일을 옮기고 모든 SMB 요청을 VPN 너머 파일 시스템으로 보낸다
            answers:
              - S3 File Gateway로 SMB 공유와 로컬 캐시를 제공한다
              - 캐시·미전송 데이터·회선을 산정하고 미캐시 파일의 단절 시 접근을 시험한다
            options:
              - S3 File Gateway로 SMB 공유와 로컬 캐시를 제공한다
              - 캐시·미전송 데이터·회선을 산정하고 미캐시 파일의 단절 시 접근을 시험한다
              - Volume Gateway의 캐시된 iSCSI 볼륨을 기존 SMB 파일 API 대신 앱에 연결한다
              - DataSync로 기존 SMB 서버와 S3를 매시간 복사하고 SMB 서버를 계속 운영한다
              - FSx for Windows에 파일을 옮기고 모든 SMB 요청을 VPN 너머 파일 시스템으로 보낸다
      - id: saa-r2-Q27-40
        source_id: Q27-40
        type: mcq
        title: Q27-40 · 모의고사 C
        explain: |
          <p>제시한 사양과 단일 볼륨 인증 조건을 모두 충족하는 후보는 필요한 IOPS를 프로비저닝한 io2 Block Express다. 인스턴스의 EBS 성능도 함께 맞아야 하며 시험으로 지연 목표를 검증해야 한다. 볼륨 한도를 암기하기보다 주어진 요구·사양·허용 구조를 비교하는 문제다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>gp3 한 개에 허용되는 최대 IOPS를 설정하고 인스턴스 메모리만 늘린다</td>
          <td>사양표에서 단일 gp3는 요구를 충족하지 못한다. 인스턴스 메모리를 늘려도 필수 디스크 부하 요구를 충족했다고 볼 수 없다.</td>
          </tr>
          <tr>
          <td>gp3 두 개를 RAID 0으로 묶고 합산 성능으로 요구를 충족하도록 구성한다</td>
          <td>RAID 0의 합산 성능을 활용할 수 있어도 제품 인증이 단일 EBS 볼륨만 허용하므로 제시한 설계 제약을 어긴다.</td>
          </tr>
          <tr>
          <td>io2 Block Express 한 개에 60,000 IOPS를 설정하고 EBS 최적화 연결을 사용한다</td>
          <td>EBS 최적화 연결이 있어도 프로비저닝한 60,000 IOPS는 요구한 지속 120,000 IOPS에 부족하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/provisioned-iops.html">EBS io2 Block Express</a> · <a href="https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html">EBS gp3 performance</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">io2 Block Express는 Nitro에서 단일 볼륨 최대 256,000 IOPS와 1,000 IOPS/GiB 비율을 지원하므로 200GiB·120,000 IOPS 구성이 가능하다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">16KiB I/O에 평균 500마이크로초 미만으로 설계되어 낮은 지연 요구의 후보가 된다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">실제 DB 부하는 별도 부하 시험으로 확인한다</a></p>
        quizzes:
          - q: 인증된 DB 제품은 Nitro EC2에서 단일 EBS 볼륨만 허용한다. 부하 시험은 200GiB 데이터에 지속 120,000 IOPS·평균
              1ms 미만 지연을 요구한다. 인스턴스는 이를 지원한다. 후보 사양표에서 gp3는 이 요구에 못 미치고 io2
              Block Express는 만족한다. 가장 적절한 구성은?
            answer: io2 Block Express 한 개에 120,000 IOPS를 프로비저닝하고 지연을 검증한다
            wrong:
              - gp3 한 개에 허용되는 최대 IOPS를 설정하고 인스턴스 메모리만 늘린다
              - gp3 두 개를 RAID 0으로 묶고 합산 성능으로 요구를 충족하도록 구성한다
              - io2 Block Express 한 개에 60,000 IOPS를 설정하고 EBS 최적화 연결을 사용한다
      - id: saa-r2-Q27-41
        source_id: Q27-41
        type: mcq
        title: Q27-41 · 모의고사 C
        explain: |
          <p>평균 동시 실행은 요청률×평균 실행 시간으로 추정한다. 400×0.5=200에서 400×2=800으로 증가하므로 한도와 외부 API·DB 등 다운스트림을 다시 평가해야 한다. 이 평균 계산은 버스트·분포·Lambda 스케일 속도를 보장하는 값이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Provisioned concurrency만 300으로 두고 전체 동시 실행 한도 검토는 생략한다</td>
          <td>프로비저닝 동시성은 미리 준비한 실행 환경이며 전체 동시 실행을 그 값으로 제한하거나 다운스트림 용량을 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>실행 시간이 길어지므로 초당 호출률도 자동으로 100으로 낮아진다고 계산한다</td>
          <td>지문은 유입 호출률이 같다고 명시했다. 실행 시간 증가가 송신자의 요청률을 자동으로 줄이지 않는다.</td>
          </tr>
          <tr>
          <td>초당 호출률이 그대로이므로 기존 평균 동시 실행 200 기준을 유지한다</td>
          <td>같은 호출률도 각 호출이 자원을 점유하는 시간이 네 배가 되면 동시에 실행 중인 요청이 늘어난다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html">Understanding Lambda Event Function scaling - AWS Lambda</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#lambda-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%EC%96%B4">평균 동시 실행은 요청률과 평균 실행 시간의 곱으로 추정한다</a> · <a href="/study/lessons/deep-dive/day-10.html#lambda-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%EC%96%B4">400×0.5와 400×2를 비교하면 같은 요청률에서도 필요한 동시 실행과 외부 연결 부하가 네 배가 된다</a></p>
        quizzes:
          - q: 사진 API가 Lambda를 초당 400회 호출하며 평균 실행 시간은 0.5초다. 외부 API 지연으로 실행 시간이 2초가 되었지만
              호출률은 같다. 현재 한도와 다운스트림 허용치는 평균 동시 실행 300을 기준으로 준비했다. 순간 폭증은 별도로 검증할
              때 필요한 변경 판단은?
            answer: 평균 동시 실행이 200에서 800으로 늘므로 한도·다운스트림 용량을 재검토한다
            wrong:
              - Provisioned concurrency만 300으로 두고 전체 동시 실행 한도 검토는 생략한다
              - 실행 시간이 길어지므로 초당 호출률도 자동으로 100으로 낮아진다고 계산한다
              - 초당 호출률이 그대로이므로 기존 평균 동시 실행 200 기준을 유지한다
      - id: saa-r2-Q27-42
        source_id: Q27-42
        type: mcq
        title: Q27-42 · 모의고사 C
        explain: |
          <p>지원되는 GPU EC2 노드를 사용하는 EKS는 필요한 장치·드라이버 제어와 기존 Kubernetes 배포 흐름을 함께 유지하는 방향이다. Fargate 등 다른 실행 방식은 운영 부담만 보지 말고 GPU·실행 시간·배포 인터페이스의 지원 조건을 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EKS Fargate 프로파일에 추론 Pod를 배정해 노드 운영을 없앤다</td>
          <td>EKS Fargate는 이 GPU 워크로드와 노드·드라이버 제어 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>ECS의 GPU EC2 용량으로 옮기고 기존 Kubernetes 정의를 새 작업 정의로 바꾼다</td>
          <td>ECS GPU EC2는 장치를 제공할 수 있지만 기존 Kubernetes 도구·정의를 유지하라는 요구에 맞지 않으며 전환 작업이 필요하다.</td>
          </tr>
          <tr>
          <td>Lambda 컨테이너 이미지로 옮기고 장기 추론의 완료까지 한 호출을 유지한다</td>
          <td>Lambda의 실행 시간·장치 지원은 수시간 GPU 추론을 한 호출로 실행하는 요구에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eks/latest/userguide/fargate.html">Simplify compute management with AWS Fargate - Amazon EKS</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">Kubernetes 호환과 GPU·호스트 제어가 모두 필요하므로 EKS의 지원 EC2 노드를 검토한다</a> · <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">관리형 제어 영역을 쓰더라도 노드·드라이버와 앱 운영 책임은 따로 남는다</a></p>
        quizzes:
          - q: GPU 추론 컨테이너가 수시간 실행되며 GPU 드라이버와 노드 유형을 통제해야 한다. 회사는 기존 Kubernetes manifests와
              배포 도구를 유지하려 한다. CPU만 쓰는 별도 API와 달리 이 추론 작업은 장치 지원이 필수다. 가장 적절한 실행
              환경은?
            answer: EKS의 지원 GPU EC2 노드 그룹에 추론 워크로드를 배치한다
            wrong:
              - EKS Fargate 프로파일에 추론 Pod를 배정해 노드 운영을 없앤다
              - ECS의 GPU EC2 용량으로 옮기고 기존 Kubernetes 정의를 새 작업 정의로 바꾼다
              - Lambda 컨테이너 이미지로 옮기고 장기 추론의 완료까지 한 호출을 유지한다
      - id: saa-r2-Q27-43
        source_id: Q27-43
        type: mcq
        title: Q27-43 · 모의고사 C
        explain: |
          <p>Cluster 배치는 같은 AZ에서 가까운 노드 배치를 통해 낮은 네트워크 지연을 추구하는 전략이다. 이 작업은 AZ 장애 시 재실행을 허용하므로 하드웨어 분리보다 측정된 통신 지연이 우선이다. 실제 성능과 인스턴스 지원은 시험해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>노드를 Partition placement group에 나누고 파티션 간 복제 수를 늘린다</td>
          <td>Partition은 파티션 사이 하드웨어 장애 경계를 분리하는 전략으로 가까운 배치에 의한 지연 최소화 목적과 다르다.</td>
          </tr>
          <tr>
          <td>지원 인스턴스를 Spread placement group에 배치해 하드웨어 장애를 분산한다</td>
          <td>Spread는 서로 다른 하드웨어에 분산해 개별 장애 영향을 줄이는 목적이며 이 문제의 우선순위인 노드 간 낮은 지연과 다르다.</td>
          </tr>
          <tr>
          <td>노드를 여러 AZ에 분산하고 각 AZ에 같은 수의 작업자를 배치한다</td>
          <td>다중 AZ는 장애 분산에 유리할 수 있지만 노드 간 통신 경로를 늘려 같은 AZ의 낮은 지연 요구에 우선 적합하지 않다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html">Placement strategies for your placement groups - Amazon Elastic Compute Cloud</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%EB%B0%B0%EC%B9%98-%EA%B7%B8%EB%A3%B9%EA%B3%BC-dedicated-host">같은 AZ에서 긴밀한 노드 통신의 지연이 핵심이면 Cluster 배치가 우선 후보이다</a> · <a href="/study/lessons/deep-dive/day-02.html#%EB%B0%B0%EC%B9%98-%EA%B7%B8%EB%A3%B9%EA%B3%BC-dedicated-host">장애 분산이 우선인 Spread·Partition과 목적이 다르며 앱의 재실행 조건도 고려한다</a></p>
        quizzes:
          - q: 병렬 계산 작업은 같은 AZ의 노드끼리 작은 메시지를 자주 교환한다. CPU·디스크에는 여유가 있고 측정된 병목은 노드 간 네트워크
              지연이다. AZ 장애 시 체크포인트에서 작업을 다시 시작할 수 있다. 지연을 우선 개선할 배치 전략은?
            answer: 지원 인스턴스를 Cluster placement group에 배치해 지연 개선을 시험한다
            wrong:
              - 노드를 Partition placement group에 나누고 파티션 간 복제 수를 늘린다
              - 지원 인스턴스를 Spread placement group에 배치해 하드웨어 장애를 분산한다
              - 노드를 여러 AZ에 분산하고 각 AZ에 같은 수의 작업자를 배치한다
      - id: saa-r2-Q27-44
        source_id: Q27-44
        type: mcq
        title: Q27-44 · 모의고사 C
        explain: |
          <p>LSI는 같은 기본 파티션 키에 다른 정렬 키를 제공하고 강력한 일관성 읽기를 지원하며 테이블 생성 시 정의해야 한다. 다른 파티션 키인 배송 상태는 GSI로 설계할 수 있지만 GSI 조회는 최종 일관성이며 낮은 카디널리티 상태 키의 편중도 검토해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기본 테이블을 먼저 만든 뒤 금액 조회가 늘면 LSI를 추가한다</td>
          <td>LSI는 기존 테이블 생성 후 추가할 수 없으므로 생성 시 요구를 반영해야 한다.</td>
          </tr>
          <tr>
          <td>배송 상태를 LSI 파티션 키로 쓰고 customer_id는 정렬 키로 바꾼다</td>
          <td>LSI는 기본 테이블과 같은 파티션 키를 사용해야 한다. 배송 상태처럼 다른 파티션 키는 GSI 설계 대상이다.</td>
          </tr>
          <tr>
          <td>금액 조회용 GSI를 만들고 강력한 일관성 옵션으로 읽는다</td>
          <td>GSI는 강력한 일관성 읽기를 지원하지 않아 고객별 금액 조회의 최신성 조건을 충족하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SecondaryIndexes.html">Improving data access with secondary indexes in DynamoDB - Amazon DynamoDB</a> · <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/LSI.html">DynamoDB LSI 생성과 일관성</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#hot-key%EC%99%80-lsi-item-collection">LSI는 기본 파티션 키를 유지하면서 다른 정렬과 강력한 읽기를 제공하며 생성 시 정의한다</a> · <a href="/study/lessons/deep-dive/day-08.html#%EC%A0%91%EA%B7%BC-%ED%8C%A8%ED%84%B4%EA%B3%BC-%EC%9D%B8%EB%8D%B1%EC%8A%A4%EC%9D%98-%EC%8B%A4%EC%A0%9C-%EA%B5%AC%EC%84%B1">다른 파티션 키의 조회는 GSI를 사용하고 상태 값의 편중과 전파 지연을 고려한다</a></p>
        quizzes:
          - q: 새 DynamoDB 주문 테이블의 기본 키는 customer_id와 order_time이다. 고객별 금액 순 조회에는 강력한 일관성이
              필요하고, 배송 상태별 목록은 최종 일관성을 허용한다. 기본 키는 유지하며 필요한 인덱스를 생성하려 한다. 적절한 두
              설계는?
            answer: 테이블 생성 시 customer_id·금액을 키로 쓰는 LSI를 정의한다
            wrong:
              - 기본 테이블을 먼저 만든 뒤 금액 조회가 늘면 LSI를 추가한다
              - 배송 상태를 LSI 파티션 키로 쓰고 customer_id는 정렬 키로 바꾼다
              - 금액 조회용 GSI를 만들고 강력한 일관성 옵션으로 읽는다
            answers:
              - 테이블 생성 시 customer_id·금액을 키로 쓰는 LSI를 정의한다
              - 배송 상태를 파티션 키로 쓰는 GSI를 만들고 상태별 부하 편중을 검토한다
            options:
              - 기본 테이블을 먼저 만든 뒤 금액 조회가 늘면 LSI를 추가한다
              - 배송 상태를 LSI 파티션 키로 쓰고 customer_id는 정렬 키로 바꾼다
              - 테이블 생성 시 customer_id·금액을 키로 쓰는 LSI를 정의한다
              - 배송 상태를 파티션 키로 쓰는 GSI를 만들고 상태별 부하 편중을 검토한다
              - 금액 조회용 GSI를 만들고 강력한 일관성 옵션으로 읽는다
      - id: saa-r2-Q27-45
        source_id: Q27-45
        type: mcq
        title: Q27-45 · 모의고사 C
        explain: |
          <p>Aurora reader endpoint는 연결 단위로 reader에 연결하며 한 연결의 SQL을 매번 다른 reader로 보내지 않는다. 여러 연결과 적절한 연결 수명을 검토해야 새 연결이 reader들에 분산된다. 기존 장기 연결의 대상은 DNS TTL만 낮춘다고 바뀌지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>앱을 writer endpoint로 바꾸고 같은 읽기 연결 한 개를 계속 사용한다</td>
          <td>writer endpoint는 쓰기 가능한 인스턴스를 가리키므로 reader들로 조회 연결을 나누는 요구를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>reader endpoint의 DNS TTL만 낮추고 기존 DB 연결은 종료하지 않는다</td>
          <td>이미 수립된 DB 연결은 DNS를 매 쿼리마다 다시 해석하지 않는다. TTL 변경만으로 장기 연결을 새 대상으로 옮기지 못한다.</td>
          </tr>
          <tr>
          <td>reader를 두 대 더 추가하고 앱의 기존 연결 한 개는 그대로 재사용한다</td>
          <td>reader 수를 늘려도 기존 단일 연결이 새 reader로 자동 재분배되지 않아 현재 병목이 남을 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Reader.html">Reader endpoints for Amazon Aurora - Amazon Aurora</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#aurora%EC%9D%98-%EA%B3%B5%EC%9C%A0-%EC%A0%80%EC%9E%A5%EC%86%8C%EC%99%80-%EC%97%B0%EA%B2%B0-%EB%B6%84%EC%82%B0">Aurora reader endpoint는 새 연결을 분산하며 한 연결의 모든 SQL을 reader 사이에 나누지 않는다</a> · <a href="/study/lessons/deep-dive/day-07.html#aurora%EC%9D%98-%EA%B3%B5%EC%9C%A0-%EC%A0%80%EC%9E%A5%EC%86%8C%EC%99%80-%EC%97%B0%EA%B2%B0-%EB%B6%84%EC%82%B0">앱의 읽기 풀과 연결 재사용 방식을 살펴 연결을 여러 대상으로 분산해야 한다</a></p>
        quizzes:
          - q: Aurora reader 네 대 중 한 대에 보고서 부하가 집중된다. 앱은 reader endpoint로 연결 하나를 만들어 수시간
              재사용한다. 각 reader의 사양은 같고 쓰기 병목은 없다. reader를 더 추가하기 전에 우선 적용할 개선은?
            answer: 여러 읽기 연결의 풀과 연결 수명을 조정해 reader들로 새 연결을 분산한다
            wrong:
              - 앱을 writer endpoint로 바꾸고 같은 읽기 연결 한 개를 계속 사용한다
              - reader endpoint의 DNS TTL만 낮추고 기존 DB 연결은 종료하지 않는다
              - reader를 두 대 더 추가하고 앱의 기존 연결 한 개는 그대로 재사용한다
      - id: saa-r2-Q27-46
        source_id: Q27-46
        type: mcq
        title: Q27-46 · 모의고사 C
        explain: |
          <p>목록의 지연 허용과 결제의 정확성은 다르게 처리해야 한다. 결제는 원본 또는 업무적으로 보장된 최신 경로에서 검증하고 목록 캐시는 갱신·무효화를 설계한다. 동시 캐시 채움 제어는 인기 키 만료 시 DB로 몰리는 stampede를 줄이는 별도 조치다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>목록과 결제에 같은 장기 TTL 캐시를 사용하고 DB 읽기 수를 줄인다</td>
          <td>장기 캐시를 결제의 유일한 가격 근거로 쓰면 변경 직후 오래된 금액을 결제할 수 있다.</td>
          </tr>
          <tr>
          <td>캐시 TTL을 매우 짧게 유지하고 만료 때 모든 요청이 DB를 개별 조회하게 한다</td>
          <td>짧은 TTL만으로 최신성 보장이 되지 않으며 만료마다 모든 요청이 DB를 읽으면 주어진 폭증 현상이 반복된다.</td>
          </tr>
          <tr>
          <td>상품 갱신 때마다 DB만 변경하고 캐시는 고정 TTL이 끝날 때까지 사용한다</td>
          <td>일반 cache-aside에서 DB 변경은 캐시에 자동 전파되지 않는다. 결제도 같은 경로라면 만료 전 오래된 가격이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html">Caching strategies for Memcached - Amazon ElastiCache</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#cache-aside%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C%EC%99%80-%EC%8B%A0%EC%84%A0%EB%8F%84">캐시의 오래된 값과 동시 채움은 별도 정확성·부하 문제다</a> · <a href="/study/lessons/deep-dive/day-08.html#cache-aside%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C%EC%99%80-%EC%8B%A0%EC%84%A0%EB%8F%84">결제의 원본 검증을 유지하면서 갱신·무효화와 요청 집중 제어를 설계해야 성능과 업무 정확성을 함께 지킨다</a></p>
        quizzes:
          - q: 상품 조회에 cache-aside를 도입했다. 가격 변경 뒤 캐시가 잠시 오래될 수 있고 인기 상품의 TTL 만료 때 DB 읽기가 동시에
              폭증한다. 상품 목록은 잠깐 지연되어도 되지만 결제 금액은 최신 원본과 맞아야 한다. 가장 적절한 설계는?
            answer: 결제는 원본으로 검증하고 캐시 무효화·갱신과 동시 채움 제어를 구성한다
            wrong:
              - 목록과 결제에 같은 장기 TTL 캐시를 사용하고 DB 읽기 수를 줄인다
              - 캐시 TTL을 매우 짧게 유지하고 만료 때 모든 요청이 DB를 개별 조회하게 한다
              - 상품 갱신 때마다 DB만 변경하고 캐시는 고정 TTL이 끝날 때까지 사용한다
      - id: saa-r2-Q27-47
        source_id: Q27-47
        type: mcq
        title: Q27-47 · 모의고사 C
        explain: |
          <p>S3 Interface Endpoint는 VPN 같은 하이브리드 연결을 통해 사설 IP로 접근하는 구성에 사용할 수 있다. 실제로 엔드포인트 이름을 올바르게 해석할 DNS와 VPN 라우팅·보안·S3 권한을 함께 맞춰야 한다. 기존 Gateway Endpoint를 온프레미스에서 그대로 공유할 수는 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>공장 DNS를 S3 공개 이름으로 유지하고 인터넷 기반 직접 업로드를 사용한다</td>
          <td>S3 공개 엔드포인트의 인터넷 경로는 사설 VPN 경유 접근 요구와 다르다. 이름을 유지하는 것만으로 경로가 사설화되지 않는다.</td>
          </tr>
          <tr>
          <td>기존 S3 Gateway Endpoint의 라우트를 VPN 경로에 광고해 공장망이 사용하게 한다</td>
          <td>Gateway Endpoint는 해당 VPC의 라우팅 사용 범위를 갖는다. 그 경로를 VPN에 광고하는 것만으로 온프레미스가 공유하지 못한다.</td>
          </tr>
          <tr>
          <td>VPN의 기본 경로를 VPC NAT로 보내 S3의 공개 주소에 연결한다</td>
          <td>퍼블릭 NAT를 통해 S3 공개 주소로 나가는 방법은 명시한 인터넷 NAT 경로 금지 조건을 충족하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html">AWS PrivateLink for Amazon S3 - Amazon Simple Storage Service</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#%EC%98%A8%ED%94%84%EB%A0%88%EB%AF%B8%EC%8A%A4%EC%9D%98-s3-dns%EC%99%80-%EB%B9%84%EC%9A%A9-%EB%B6%84%EB%A6%AC">S3의 Interface Endpoint는 온프레미스 사설 연결 접근 후보이다</a> · <a href="/study/lessons/deep-dive/day-05.html#%EC%98%A8%ED%94%84%EB%A0%88%EB%AF%B8%EC%8A%A4%EC%9D%98-s3-dns%EC%99%80-%EB%B9%84%EC%9A%A9-%EB%B6%84%EB%A6%AC">VPN만으로 충분하지 않으므로 DNS, 엔드포인트 SG, 왕복 경로와 S3 권한까지 함께 구성한다</a></p>
        quizzes:
          - q: 공장망은 VPN으로 VPC에 연결되어 있다. 대용량 파일을 S3로 업로드하되 공개 인터넷 NAT 경로는 허용하지 않는다. 기존 VPC 앱은
              S3 Gateway Endpoint를 사용한다. 공장망에도 사설 S3 접근을 추가할 가장 적절한 구성은?
            answer: S3 Interface Endpoint를 두고 온프레미스 DNS·VPN 경로·접근 정책을 구성한다
            wrong:
              - 공장 DNS를 S3 공개 이름으로 유지하고 인터넷 기반 직접 업로드를 사용한다
              - 기존 S3 Gateway Endpoint의 라우트를 VPN 경로에 광고해 공장망이 사용하게 한다
              - VPN의 기본 경로를 VPC NAT로 보내 S3의 공개 주소에 연결한다
      - id: saa-r2-Q27-48
        source_id: Q27-48
        type: mcq
        title: Q27-48 · 모의고사 C
        explain: |
          <p>표준 Global Accelerator는 고정 Anycast 진입 IP와 지원 TCP·UDP 트래픽의 글로벌 라우팅을 제공한다. 리전별 endpoint group과 상태를 구성하면 클라이언트의 주소 목록 변경 대신 글로벌 진입점에서 정상 리전으로 보낼 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>CloudFront 배포에 두 리전 ALB를 연결하고 동일 캐시 behavior를 사용한다</td>
          <td>CloudFront는 이 임의 UDP 세션을 전달하는 서비스가 아니다. HTTP 콘텐츠 전송·캐시 구조와 구분해야 한다.</td>
          </tr>
          <tr>
          <td>Route 53 latency 레코드와 상태 확인으로 리전별 NLB 주소를 응답한다</td>
          <td>DNS 기반 리전 선택은 가능하지만 클라이언트의 캐시·재조회에 영향을 받고 하나의 고정 글로벌 IP 진입점 요구와 다르다.</td>
          </tr>
          <tr>
          <td>각 리전 NLB의 고정 IP를 모두 등록하고 클라이언트가 실패 시 다음 주소를 고른다</td>
          <td>리전별 NLB IP를 직접 등록하면 클라이언트가 주소 목록과 장애 전환을 관리해야 하므로 요구한 글로벌 분산 계층이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html">What is AWS Global Accelerator? - AWS Global Accelerator</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#dns-cdn%EA%B3%BC-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%84%A4%ED%8A%B8%EC%9B%8C%ED%81%AC-%EA%B0%80%EC%86%8D">Global Accelerator는 정적 Anycast IP와 AWS 네트워크 경로로 TCP·UDP 대상에 트래픽을 보낼 수 있다</a> · <a href="/study/lessons/deep-dive/day-09.html#dns-cdn%EA%B3%BC-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%84%A4%ED%8A%B8%EC%9B%8C%ED%81%AC-%EA%B0%80%EC%86%8D">객체 CDN 캐시와 다른 요구이며 지원 endpoint·상태 판단을 구성한다</a></p>
        quizzes:
          - q: 게임 클라이언트는 UDP를 사용하며 고객 방화벽에는 고정 진입 IP만 등록할 수 있다. 두 리전의 정상 서버로 빠르게 분산하고 장애 리전은
              제외해야 한다. 클라이언트가 DNS를 재조회하거나 리전별 IP 목록을 바꾸는 방식은 피하려 한다. 가장 적절한 진입
              계층은?
            answer: 표준 Global Accelerator에 지원 리전별 endpoint group을 구성한다
            wrong:
              - CloudFront 배포에 두 리전 ALB를 연결하고 동일 캐시 behavior를 사용한다
              - Route 53 latency 레코드와 상태 확인으로 리전별 NLB 주소를 응답한다
              - 각 리전 NLB의 고정 IP를 모두 등록하고 클라이언트가 실패 시 다음 주소를 고른다
      - id: saa-r2-Q27-49
        source_id: Q27-49
        type: mcq
        title: Q27-49 · 모의고사 C
        explain: |
          <p>TGW의 지원 VPN ECMP 구성은 여러 터널과 여러 흐름에 걸쳐 총 처리량을 늘리는 데 사용할 수 있다. 흐름 단위 선택을 고려하므로 단일 TCP 흐름의 속도가 터널 수만큼 증가한다고 해석하지 않고 실제 다중 흐름 부하를 시험한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>단일 VPN 연결의 터널 두 개에 단일 TCP 흐름을 보내 두 배 대역폭을 기대한다</td>
          <td>여러 터널의 존재가 한 TCP 흐름을 터널마다 쪼개 전송한다는 뜻은 아니다. 이 질문의 이점은 여러 흐름의 합산 처리량이다.</td>
          </tr>
          <tr>
          <td>동적 라우팅 대신 정적 VPN 경로를 복제하고 동일 목적지의 비용을 같게 맞춘다</td>
          <td>이 TGW VPN ECMP 구성에는 동적 라우팅 지원 조건을 맞춰야 한다. 정적 경로를 복제하는 것만으로 동일한 병렬 VPN 구성이 되지 않는다.</td>
          </tr>
          <tr>
          <td>여러 VPN 터널을 두되 TGW ECMP를 끄고 동일 우선순위 경로를 추가한다</td>
          <td>ECMP를 비활성화하면 같은 비용의 여러 터널을 병렬 사용하려는 구성을 활용하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-quotas.html">AWS Transit Gateway Quotas - Amazon VPC</a> · <a href="https://docs.aws.amazon.com/whitepapers/latest/aws-vpc-connectivity-options/aws-transit-gateway-vpn.html">TGW VPN ECMP</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#tgw%EC%97%90%EC%84%9C-%EC%97%B0%EA%B2%B0%EA%B3%BC-%ED%97%88%EC%9A%A9-%EA%B2%BD%EB%A1%9C%EB%A5%BC-%EB%B6%84%EB%A6%AC%ED%95%9C%EB%8B%A4">동적 라우팅의 TGW VPN ECMP는 여러 흐름을 터널에 분산해 총 처리량을 늘리는 방법이다</a> · <a href="/study/lessons/deep-dive/day-13.html#tgw%EC%97%90%EC%84%9C-%EC%97%B0%EA%B2%B0%EA%B3%BC-%ED%97%88%EC%9A%A9-%EA%B2%BD%EB%A1%9C%EB%A5%BC-%EB%B6%84%EB%A6%AC%ED%95%9C%EB%8B%A4">단일 흐름 한도와 장비·패킷 조건은 남으므로 실제 트래픽으로 검증해야 한다</a></p>
        quizzes:
          - q: 공장과 AWS 사이의 동적 라우팅 Site-to-Site VPN이 파일 복제의 병목이다. 워크로드는 여러 TCP 흐름으로 나눌 수 있고
              Transit Gateway를 사용한다. 물리 회선을 바꾸지 않고 총 처리량을 늘리려 한다. 가장 적절한 구성과
              검증은?
            answer: 여러 VPN 터널에 TGW ECMP를 활성화하고 다중 흐름 합산 처리량을 시험한다
            wrong:
              - 단일 VPN 연결의 터널 두 개에 단일 TCP 흐름을 보내 두 배 대역폭을 기대한다
              - 동적 라우팅 대신 정적 VPN 경로를 복제하고 동일 목적지의 비용을 같게 맞춘다
              - 여러 VPN 터널을 두되 TGW ECMP를 끄고 동일 우선순위 경로를 추가한다
      - id: saa-r2-Q27-50
        source_id: Q27-50
        type: mcq
        title: Q27-50 · 모의고사 C
        explain: |
          <p>Data Streams는 여러 소비자가 같은 스트림을 각자의 위치로 읽고 보존 기간 안에서 재처리하는 기반을 제공한다. 단순 fanout 수신과 이미 삭제한 데이터의 재생은 다른 요구다. 처리량·샤드·보존과 소비자 방식도 실제 부하에 맞게 설계해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Data Firehose를 최종 목적지에 연결하고 소비자별 스트림 위치는 두지 않는다</td>
          <td>Firehose는 목적지 전달을 관리하는 서비스로 두 소비자가 독립 읽기 위치를 갖는 스트림 수집 계층과 다르다.</td>
          </tr>
          <tr>
          <td>한 SQS 큐를 두 소비자가 함께 읽고 처리 후 메시지를 삭제한다</td>
          <td>하나의 SQS 큐를 함께 읽으면 작업을 나눠 가져가며 삭제한 메시지로 독립 과거 재생을 수행하지 못한다.</td>
          </tr>
          <tr>
          <td>SNS와 각 소비자 SQS를 연결하고 처리 완료 후 각 큐의 메시지를 삭제한다</td>
          <td>SNS·소비자 큐는 각자 사본을 제공하지만 이미 처리·삭제한 큐 메시지를 과거 위치로 되돌리는 스트림 보존 계층은 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/streams/latest/dev/introduction.html">What is Amazon Kinesis Data Streams? - Amazon Kinesis Data Streams</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">독립 소비 위치와 보존 기간 내 반복 읽기는 스트림의 요구이다</a> · <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">Data Streams의 키·보존·소비자 처리량을 설계하면 일시 중단 후 재생을 지원할 수 있다</a></p>
        quizzes:
          - q: 클릭 이벤트를 이상 탐지기와 일일 통계기가 각각 읽는다. 소비자는 배포·오류 수정 뒤 이미 읽은 이벤트도 보존 기간 안에서 되돌려 처리해야
              한다. 두 소비자의 읽기 위치는 독립적으로 관리하며 수집기에는 두 번 보내는 로직을 넣지 않으려 한다. 적절한 수집
              계층은?
            answer: Kinesis Data Streams에 보존·파티션 키를 설정하고 소비자별 위치를 관리한다
            wrong:
              - Data Firehose를 최종 목적지에 연결하고 소비자별 스트림 위치는 두지 않는다
              - 한 SQS 큐를 두 소비자가 함께 읽고 처리 후 메시지를 삭제한다
              - SNS와 각 소비자 SQS를 연결하고 처리 완료 후 각 큐의 메시지를 삭제한다
      - id: saa-r2-Q27-51
        source_id: Q27-51
        type: mcq
        title: Q27-51 · 모의고사 C
        explain: |
          <p>병목은 파일 스캔이 아니라 Glue 메타데이터 필터링이다. 날짜만 조건에 있으므로 날짜를 선두로 한 인덱스와 Athena의 partition filtering이 맞는다. 희소한 전체 키 조합을 projection하면 존재하지 않는 조합에 대한 불필요한 S3 탐색이 많아질 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>tenant_id 선두의 Glue 파티션 인덱스와 Athena partition filtering을 사용한다</td>
          <td>tenant_id를 조건에 지정하지 않으므로 해당 키가 선두인 인덱스는 이 날짜-only 필터의 목적에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>날짜와 전체 tenant_id 범위의 partition projection으로 Glue 조회를 대체한다</td>
          <td>Projection은 메타데이터 조회를 대체할 수 있지만 제시한 희소 조합을 대거 생성하면 없는 S3 경로를 탐색하는 부담이 크다.</td>
          </tr>
          <tr>
          <td>Parquet 객체를 더 크게 합치고 Glue 파티션 조회 설정은 그대로 유지한다</td>
          <td>파일 읽기는 이미 2초로 주된 병목이 아니다. 객체 병합만으로 기존 40초 메타데이터 조회를 해결하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/glue-best-practices-partition-index.html">Athena Glue partition indexing and filtering</a> · <a href="https://docs.aws.amazon.com/glue/latest/dg/partition-indexes.html">Glue partition indexes and leading keys</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html">Athena partition projection limitations</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">주된 병목은 데이터 파일이 아니라 대규모 Glue 파티션 메타데이터 조회다</a> · <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">날짜가 선두인 Glue 인덱스는 날짜 범위 조건으로 등록된 파티션 중 관련 집합을 좁힌다</a> · <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">인덱스가 ACTIVE가 된 뒤 테이블 속성 partition_filtering.enabled=true로 Athena 사용을 켠다</a> · <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">희소 조합을 전체 생성하는 projection과 달리 실제 등록된 파티션을 이용한다</a></p>
        quizzes:
          - q: Athena 주문 데이터는 Parquet이고 날짜·tenant_id로 100만 개의 실제 Glue 파티션이 등록돼 있다. 조회는 날짜
              범위만 AND로 제한하며 파일 읽기 2초보다 파티션 조회 40초가 길다. 키 조합의 95%는 S3에 없고 파일·파티션
              키는 유지해야 한다. 가장 적절한 개선은?
            answer: 날짜 선두의 Glue 파티션 인덱스와 Athena partition filtering을 사용한다
            wrong:
              - tenant_id 선두의 Glue 파티션 인덱스와 Athena partition filtering을 사용한다
              - 날짜와 전체 tenant_id 범위의 partition projection으로 Glue 조회를 대체한다
              - Parquet 객체를 더 크게 합치고 Glue 파티션 조회 설정은 그대로 유지한다
      - id: saa-r2-Q27-52
        source_id: Q27-52
        type: mcq
        title: Q27-52 · 모의고사 C
        explain: |
          <p>쿼리 엔진의 열 권한은 다른 API로 원본이나 결과를 직접 읽는 권한을 자동 제거하지 않는다. S3 객체·쿼리 결과·KMS 경로도 함께 제한해야 전화번호가 포함된 데이터를 우회해서 읽을 수 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>BI 보고서에서 전화번호를 숨기고 원본 객체 다운로드 권한은 유지한다</td>
          <td>화면에서 열을 숨기는 것은 데이터 다운로드 인가가 아니다. 원본 객체 접근이 열려 있으면 민감 열을 읽을 수 있다.</td>
          </tr>
          <tr>
          <td>Lake Formation 열 권한만 적용하고 분석가의 기존 원본 S3 읽기는 유지한다</td>
          <td>원본 객체를 직접 다운로드할 수 있으면 Lake Formation의 열 단위 쿼리 제한을 우회할 수 있다.</td>
          </tr>
          <tr>
          <td>Athena 쿼리 실행 권한만 제한하고 이전 결과 파일 읽기는 계속 허용한다</td>
          <td>과거 결과 파일에 민감 정보가 남아 있을 수 있으므로 쿼리 실행 제한만으로 결과 데이터의 접근 경계를 보장하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html">What is AWS Lake Formation? - AWS Lake Formation</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/lf-athena-user-permissions.html">Manage Lake Formation and Athena user permissions</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%A0%88%EC%9D%B4%ED%81%AC-%EA%B6%8C%ED%95%9C%EA%B3%BC-%EB%B9%84%EC%9A%A9-%EC%83%81%ED%95%9C">분석 도구의 열 권한만 제한해도 원본을 직접 읽거나 결과 파일을 넓게 공유하면 의도를 우회할 수 있다</a> · <a href="/study/lessons/deep-dive/day-14.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%A0%88%EC%9D%B4%ED%81%AC-%EA%B6%8C%ED%95%9C%EA%B3%BC-%EB%B9%84%EC%9A%A9-%EC%83%81%ED%95%9C">IAM·S3·KMS·결과 저장소까지 전체 데이터 경로를 함께 검토해야 한다</a></p>
        quizzes:
          - q: Lake Formation에서 분석가에게 주문 테이블의 금액·지역 열만 허용하고 전화번호는 제외했다. 원본 S3 객체에는 전화번호가 남아
              있고 Athena 결과도 별도 S3 버킷에 저장된다. 분석가가 열 제한을 우회하지 못하게 하는 가장 적절한 추가
              설계는?
            answer: 원본·결과 S3와 KMS의 직접 읽기 경로를 검토해 우회 권한을 제한한다
            wrong:
              - BI 보고서에서 전화번호를 숨기고 원본 객체 다운로드 권한은 유지한다
              - Lake Formation 열 권한만 적용하고 분석가의 기존 원본 S3 읽기는 유지한다
              - Athena 쿼리 실행 권한만 제한하고 이전 결과 파일 읽기는 계속 허용한다
      - id: saa-r2-Q27-53
        source_id: Q27-53
        type: mcq
        title: Q27-53 · 모의고사 C
        explain: |
          <p>초기 즉시·빈번 조회는 Standard, 이후 드문 조회와 긴 복원 허용은 Deep Archive를 검토할 조건이다. Lifecycle 전환과 별개로 7년의 Compliance 보존을 구성해야 관리자 삭제 금지 요구를 충족한다. 비용과 불변 보관은 각각의 설정이 필요하다. 통상 검색 시간은 모든 요청의 완료 SLA가 아니며, 대량 복원의 시간·용량은 별도 계획해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>처음부터 Deep Archive와 Compliance 보존을 적용해 모든 조회를 복원한다</td>
          <td>장기 저장 단가는 낮지만 처음 90일의 즉시 조회를 제공하지 못한다.</td>
          </tr>
          <tr>
          <td>7년간 Standard와 Compliance 보존을 유지해 모든 시점에 즉시 조회한다</td>
          <td>요구는 충족할 수 있지만 이후 긴 복원 대기를 허용하는 희소 조회에도 Standard 비용을 계속 부담하여 비용 최소화에 덜 적합하다.</td>
          </tr>
          <tr>
          <td>초기 Standard와 이후 Deep Archive를 쓰고 Versioning만으로 삭제를 보호한다</td>
          <td>Versioning은 이전 버전을 남기지만 허용된 관리자의 영구 버전 삭제를 방지하는 Compliance 보존을 대신하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html">S3 아카이브 객체 검색 방식과 통상 시간</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#%EC%A0%80%EC%9E%A5-%ED%81%B4%EB%9E%98%EC%8A%A4%EC%99%80-%EB%B3%B5%EC%9B%90-%EC%8B%9C%EA%B0%84%EC%9D%98-%EC%84%A0%ED%83%9D">초기 빈번한 조사와 후기 긴 복원 대기를 나누면 기간별 저장 클래스를 최적화할 수 있다</a> · <a href="/study/lessons/deep-dive/day-03.html#lifecycle%EA%B3%BC-%EC%9A%A9%EB%9F%89-%EC%82%B0%EC%A0%95">법적 보존 중 삭제 방지는 수명 주기와 별도로 설계하고 복원 비용도 합산해야 한다</a></p>
        quizzes:
          - q: 감사 로그는 7년 동안 관리자도 삭제할 수 없어야 한다. 첫 90일은 자주 즉시 조회하고 이후에는 연 몇 차례 소량 조회하며 일반 검색의
              통상 48시간 이내 대기를 수용한다. 대량 복원은 별도로 계획한다. 장기 저장 비용을 줄이는 가장 적절한 보관 구성은?
            answer: 초기 Standard와 이후 Deep Archive 수명 주기를 쓰고 Compliance 보존을 적용한다
            wrong:
              - 처음부터 Deep Archive와 Compliance 보존을 적용해 모든 조회를 복원한다
              - 7년간 Standard와 Compliance 보존을 유지해 모든 시점에 즉시 조회한다
              - 초기 Standard와 이후 Deep Archive를 쓰고 Versioning만으로 삭제를 보호한다
      - id: saa-r2-Q27-54
        source_id: Q27-54
        type: mcq
        title: Q27-54 · 모의고사 C
        explain: |
          <p>허용된 시간 단위 집계로 작은 파일을 묶으면 객체별 PUT·전환 요청과 소형 객체 관련 비효율을 줄일 수 있다. 30일 뒤 드문 조회에 Standard-IA는 즉시 접근과 다중 AZ 보관을 유지한다. 실제 묶음 크기·조회 비용은 접근 패턴으로 검증해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>로그를 개별 gzip 파일로 압축하고 같은 수의 객체를 계속 저장한다</td>
          <td>압축은 바이트를 줄일 수 있지만 객체 수가 같아 객체별 PUT·Lifecycle 전환 요청 수 감소라는 요구를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>묶은 객체를 30일 뒤 One Zone-IA로 이동하는 Lifecycle을 구성한다</td>
          <td>One Zone-IA는 단일 AZ 저장이므로 한 AZ 손실에도 보관 데이터를 유지해야 한다는 요구와 맞지 않는다.</td>
          </tr>
          <tr>
          <td>묶은 객체를 30일 뒤 Glacier Flexible Retrieval로 이동한다</td>
          <td>Glacier Flexible Retrieval은 일반 GET 전에 복원이 필요한 아카이브라 복원 대기 없는 읽기 요구를 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">S3 storage classes</a> · <a href="https://aws.amazon.com/s3/pricing/">S3 pricing and minimum sizes</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#%EC%97%85%EB%A1%9C%EB%93%9C%EC%A7%91%EA%B3%84%EC%9A%94%EA%B8%88-%EB%B6%80%EB%8B%B4-%EC%A3%BC%EC%B2%B4">수집 단계에서 묶으면 작은 객체별 PUT과 이후 전환 요청 수가 줄어든다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EC%A0%80%EC%9E%A5-%ED%81%B4%EB%9E%98%EC%8A%A4%EC%99%80-%EB%B3%B5%EC%9B%90-%EC%8B%9C%EA%B0%84%EC%9D%98-%EC%84%A0%ED%83%9D">드문 장기 조회는 다중 AZ·밀리초 접근을 제공하는 Standard-IA로 전환하며, 집계 객체는 IA의 객체당 최소 과금 크기 부담도 줄인다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EC%97%85%EB%A1%9C%EB%93%9C%EC%A7%91%EA%B3%84%EC%9A%94%EA%B8%88-%EB%B6%80%EB%8B%B4-%EC%A3%BC%EC%B2%B4">조회 요청·검색 요금까지 포함한 비용은 실제 사용량으로 산정한다</a></p>
        quizzes:
          - q: 5KiB 로그가 매일 수백만 개 생성된다. 처음 30일은 자주 조회하고 이후 1년까지 드물게 읽지만 복원 대기는 허용하지 않는다. AZ
              손실에도 보관되어야 하며 시간 단위 묶음 조회와 1시간 수집 지연을 허용한다. 객체 요청·전환 수와 장기 저장 비용을
              함께 줄일 두 조치는?
            answer: 수집 단계에서 로그를 시간별 약 128MiB 압축 객체로 묶어 S3에 쓴다
            wrong:
              - 로그를 개별 gzip 파일로 압축하고 같은 수의 객체를 계속 저장한다
              - 묶은 객체를 30일 뒤 One Zone-IA로 이동하는 Lifecycle을 구성한다
              - 묶은 객체를 30일 뒤 Glacier Flexible Retrieval로 이동한다
            answers:
              - 수집 단계에서 로그를 시간별 약 128MiB 압축 객체로 묶어 S3에 쓴다
              - 묶은 객체를 30일 뒤 Standard-IA로 이동하는 Lifecycle을 구성한다
            options:
              - 로그를 개별 gzip 파일로 압축하고 같은 수의 객체를 계속 저장한다
              - 묶은 객체를 30일 뒤 One Zone-IA로 이동하는 Lifecycle을 구성한다
              - 묶은 객체를 30일 뒤 Glacier Flexible Retrieval로 이동한다
              - 수집 단계에서 로그를 시간별 약 128MiB 압축 객체로 묶어 S3에 쓴다
              - 묶은 객체를 30일 뒤 Standard-IA로 이동하는 Lifecycle을 구성한다
      - id: saa-r2-Q27-55
        source_id: Q27-55
        type: mcq
        title: Q27-55 · 모의고사 C
        explain: |
          <p>EBS는 EC2가 중지돼도 프로비저닝 용량 등의 비용이 남는다. 실제 사용 바이트가 자동으로 청구 용량이 되는 것은 아니다. 데이터와 파일 시스템을 검증해 작은 새 볼륨으로 이전하고 복원 가능성을 확인하는 식으로 용량을 별도로 조정해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>야간 중지 시간을 더 늘리고 같은 200GiB 볼륨에 데이터 40GiB를 유지한다</td>
          <td>인스턴스 중지는 컴퓨팅 비용을 줄이지만 그대로 남은 200GiB EBS의 프로비저닝 용량 비용은 줄이지 않는다.</td>
          </tr>
          <tr>
          <td>같은 볼륨의 파일을 압축해 사용량을 20GiB로 줄이고 청구 용량 감소를 기다린다</td>
          <td>같은 200GiB 볼륨 안의 파일 압축은 파일 사용량을 줄이지만 EBS 청구 용량을 자동 축소하지 않는다.</td>
          </tr>
          <tr>
          <td>Stop 시 200GiB 볼륨을 삭제하고 다음 시작 때 빈 40GiB 볼륨을 연결한다</td>
          <td>데이터의 별도 안전한 복원본 없이 삭제하고 빈 디스크를 연결하면 필요한 개발 데이터를 잃는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html">Amazon EBS volume types - Amazon EBS</a> · <a href="https://aws.amazon.com/ebs/pricing/">Amazon EBS pricing</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">EC2 컴퓨팅 중지와 EBS 저장 비용은 별개이며 EBS는 프로비저닝한 용량 등을 기준으로 과금한다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">데이터 보존과 복원 시간을 고려해 실제 필요한 용량·백업 정책을 따로 최적화해야 한다</a></p>
        quizzes:
          - q: 개발 EC2를 야간에 중지한 뒤에도 200GiB gp3의 월 비용이 거의 그대로다. 파일은 40GiB뿐이고 데이터 보존은 필요하다. 용량을
              줄이는 재구성은 시험할 수 있지만 데이터 유실은 허용하지 않는다. 가장 적절한 비용 개선 방향은?
            answer: 프로비저닝 EBS 비용을 확인하고 백업·복원 검증 후 작은 볼륨으로 이전한다
            wrong:
              - 야간 중지 시간을 더 늘리고 같은 200GiB 볼륨에 데이터 40GiB를 유지한다
              - 같은 볼륨의 파일을 압축해 사용량을 20GiB로 줄이고 청구 용량 감소를 기다린다
              - Stop 시 200GiB 볼륨을 삭제하고 다음 시작 때 빈 40GiB 볼륨을 연결한다
      - id: saa-r2-Q27-56
        source_id: Q27-56
        type: mcq
        title: Q27-56 · 모의고사 C
        explain: |
          <p>중단·재실행 가능, 결과 영속 저장, 유연한 완료 기한은 Spot을 검토하기에 적합하다. 여러 용량 풀과 큐 재시도는 회수·가용성 변동에 대응한다. 장기 기본 사용량이 불확실한 상황에서 최대 용량 약정은 유휴 비용 위험을 만든다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>한 AZ의 온디맨드 용량을 연중 예약하고 매일 최대 수의 작업자를 시작한다</td>
          <td>용량 예약은 실행 가능 용량을 확보하는 수단이며 그 자체로 할인되지 않는다. 일감이 없는 기간의 예약 비용도 생길 수 있다.</td>
          </tr>
          <tr>
          <td>최대 일별 작업량을 기준으로 3년 Standard RI를 구매해 항상 실행한다</td>
          <td>수요가 불확실한데 최대량을 3년 약정하면 실제 사용하지 않는 기간에도 약정 비용을 부담한다.</td>
          </tr>
          <tr>
          <td>여러 AZ의 온디맨드 작업자를 준비하고 작업이 없으면 모두 종료한다</td>
          <td>온디맨드 종료 방식도 유효한 운영 대안이지만 이 작업은 Spot 중단을 견딜 수 있어 할인된 유휴 용량을 검토하는 편이 비용 목적에 더 적합하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html">Spot Instances - Amazon Elastic Compute Cloud</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#spot-%EC%A4%91%EB%8B%A8%EA%B3%BC-%EC%9A%A9%EB%9F%89-%ED%92%80">중단 후 재실행 가능하고 기한이 유연하므로 Spot 할인과 재시도 설계가 맞는다</a> · <a href="/study/lessons/deep-dive/day-02.html#spot-%EC%A4%91%EB%8B%A8%EA%B3%BC-%EC%9A%A9%EB%9F%89-%ED%92%80">장기 기본 사용량이 없어 큰 약정의 미사용 위험이 높고 용량 확보 상품은 할인과 다르다</a></p>
        quizzes:
          - q: 이미지 변환 작업의 일별 규모는 아직 예측하기 어렵다. 작업은 중단 후 다시 실행할 수 있고 완료 결과를 건별 S3에 저장한다. 다음
              날까지 완료하면 되며 장기 상시 사용량은 없다. 실행 비용을 줄이는 가장 적절한 방식은?
            answer: 여러 Spot 용량 풀을 사용하고 중단된 작업을 큐에서 재시도하게 한다
            wrong:
              - 한 AZ의 온디맨드 용량을 연중 예약하고 매일 최대 수의 작업자를 시작한다
              - 최대 일별 작업량을 기준으로 3년 Standard RI를 구매해 항상 실행한다
              - 여러 AZ의 온디맨드 작업자를 준비하고 작업이 없으면 모두 종료한다
      - id: saa-r2-Q27-57
        source_id: Q27-57
        type: mcq
        title: Q27-57 · 모의고사 C
        explain: |
          <p>Compute Savings Plans는 적용 대상 EC2·Fargate·Lambda 사용량과 EC2 구성·리전 변경에 대한 유연성이 필요한 경우 검토할 수 있다. 약정은 매시간 지불하므로 보수적인 기본 사용량을 기준으로 잡는다. 용량 확보와 할인은 별도 문제다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현재 리전·EC2 패밀리에 맞춘 EC2 Instance Savings Plans에 전량 약정한다</td>
          <td>EC2 Instance Savings Plans는 선택한 리전·패밀리 범위에 묶여 향후 다른 리전·패밀리·Fargate·Lambda 전환을 같은 폭으로 수용하지 못한다.</td>
          </tr>
          <tr>
          <td>현재 EC2 구성의 Regional Standard RI에 전량 약정한다</td>
          <td>Regional RI는 지정 EC2 조건에 적용되는 할인으로 Fargate·Lambda 이동까지 포괄하는 약정이 아니다.</td>
          </tr>
          <tr>
          <td>현재 AZ의 On-Demand Capacity Reservation만 구매해 계산 사용량을 할인한다</td>
          <td>온디맨드 용량 예약 자체는 할인 상품이 아니다. 이미 해결한 AZ 용량 문제만 다시 다루고 유연한 할인 요구는 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html">Savings Plans types - Savings Plans</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">Compute Savings Plans는 EC2 구성 변경과 지원 Fargate·Lambda 사용량에 유연하게 적용된다</a> · <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">기본 소비 가능한 범위만 약정하고 초과분·대상 사용량을 검토해야 미사용 비용을 줄인다</a></p>
        quizzes:
          - q: EC2 서비스의 일부를 내년에 Fargate·Lambda로 옮기며 리전과 EC2 패밀리도 바꿀 수 있다. 보수적으로 산정한 시간당 최소
              사용 금액은 향후 1년 동안 유지된다. 특정 AZ 용량 확보는 별도로 해결했다. 할인 적용의 유연성을 가장 유지하는
              약정은?
            answer: 해당 시간당 기본 사용량을 기준으로 Compute Savings Plans를 검토한다
            wrong:
              - 현재 리전·EC2 패밀리에 맞춘 EC2 Instance Savings Plans에 전량 약정한다
              - 현재 EC2 구성의 Regional Standard RI에 전량 약정한다
              - 현재 AZ의 On-Demand Capacity Reservation만 구매해 계산 사용량을 할인한다
      - id: saa-r2-Q27-58
        source_id: Q27-58
        type: mcq
        title: Q27-58 · 모의고사 C
        explain: |
          <p>G의 장치·중단 불가 조건은 기존 GPU EC2 유지에 맞고 C는 주어진 총비용과 유휴 조건에서 Fargate가 유리하다. 문제의 금액은 가정한 비교 결과이지 EC2와 Fargate의 보편적인 가격 우열이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>G와 C를 Spot GPU EC2 풀에 두고 중단 시 모든 작업을 재실행한다</td>
          <td>Spot은 용량 회수로 중단될 수 있어 중단할 수 없는 G의 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>G와 C를 모두 Fargate로 이전해 두 서비스의 노드 운영을 제거한다</td>
          <td>Fargate는 G가 요구한 GPU 실행 환경을 제공하지 않아 호스트 운영 감소만으로 선택할 수 없다.</td>
          </tr>
          <tr>
          <td>G는 기존 GPU EC2에 두고 C는 별도 EC2 상시 풀에서 실행한다</td>
          <td>C의 성능이 같고 총비용이 250달러 대 60달러로 주어졌으므로 별도 상시 EC2 풀은 비용 목적에 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-gpu.html">ECS GPU workloads</a> · <a href="https://aws.amazon.com/fargate/pricing/">AWS Fargate pricing</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">G는 GPU 지원과 중단 불가 요구 때문에 기존 GPU EC2가 맞다</a> · <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">GPU가 필요 없는 C는 검증된 동일 성능에서 유휴 풀 비용이 없는 Fargate 추산 60달러가 EC2 풀 250달러보다 낮다</a> · <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">이 수치는 문제에서 제시한 추산이며 보편적인 가격 우열은 아니다</a></p>
        quizzes:
          - q: ECS 서비스 G는 GPU가 필수이고 중단할 수 없으며 기존 GPU EC2를 24시간 거의 다 사용한다. C는 CPU 전용 단기 작업으로
              유휴 시간에 자원이 필요 없다. C의 동일 성능을 검증했고 운영비 포함 월 비용은 별도 EC2 상시 풀 250달러,
              Fargate 60달러다. 가장 저렴한 배치는?
            answer: G는 기존 GPU EC2에 두고 C는 작업할 때만 ECS Fargate에서 실행한다
            wrong:
              - G와 C를 Spot GPU EC2 풀에 두고 중단 시 모든 작업을 재실행한다
              - G와 C를 모두 Fargate로 이전해 두 서비스의 노드 운영을 제거한다
              - G는 기존 GPU EC2에 두고 C는 별도 EC2 상시 풀에서 실행한다
      - id: saa-r2-Q27-59
        source_id: Q27-59
        type: mcq
        title: Q27-59 · 모의고사 C
        explain: |
          <p>지속 CPU 부하에서는 기본 단가에 추가 크레딧 요금을 더한 총비용과 실제 처리량을 비교해야 한다. 비버스트 계열의 적절한 사양이 더 경제적일 수 있지만 측정 없이 특정 계열이 항상 싸다고 단정하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>T 계열 Standard로 바꾸고 크레딧이 소진되어도 같은 지속 성능을 예상한다</td>
          <td>Standard는 누적 크레딧이 소진되면 기준 성능으로 제한될 수 있어 같은 지속 처리량을 무료로 유지한다고 볼 수 없다.</td>
          </tr>
          <tr>
          <td>현재 T 계열의 메모리만 늘리고 CPU 크레딧 비용은 그대로 둔다</td>
          <td>병목과 추가 요금은 지속 CPU 사용에서 발생했으므로 메모리만 조정해도 원인을 해결했다고 할 수 없다.</td>
          </tr>
          <tr>
          <td>더 작은 T 계열 Unlimited로 바꾸고 기본 인스턴스 단가만 비교한다</td>
          <td>작은 기본 단가가 추가 크레딧을 포함한 작업당 비용이나 필수 처리량을 보장하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/burstable-credits-baseline-concepts.html">Key concepts for burstable performance instances - Amazon Elastic Compute Cloud</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#cpu-%ED%81%AC%EB%A0%88%EB%94%A7%EA%B3%BC-%EC%A0%84%EC%B2%B4-io-%EA%B2%BD%EB%A1%9C">T의 지속 고부하는 크레딧 소비·추가 비용과 연결된다</a> · <a href="/study/lessons/deep-dive/day-02.html#cpu-%ED%81%AC%EB%A0%88%EB%94%A7%EA%B3%BC-%EC%A0%84%EC%B2%B4-io-%EA%B2%BD%EB%A1%9C">일반 계열의 성능과 가격을 실제 부하로 비교해야 요금 절감이 처리량 저하로 바뀌지 않는지 판단할 수 있다</a></p>
        quizzes:
          - q: 개발 API는 T 계열 Unlimited에서 하루 종일 CPU를 사용한다. 기본 인스턴스 요금은 낮지만 추가 CPU 크레딧 비용이 커졌으며
              일정 처리량을 계속 유지해야 한다. 총비용을 낮출 후보를 정하는 가장 적절한 방법은?
            answer: 지속 부하의 비버스트 계열과 현재 T 계열을 처리량·크레딧 포함 비용으로 비교한다
            wrong:
              - T 계열 Standard로 바꾸고 크레딧이 소진되어도 같은 지속 성능을 예상한다
              - 현재 T 계열의 메모리만 늘리고 CPU 크레딧 비용은 그대로 둔다
              - 더 작은 T 계열 Unlimited로 바꾸고 기본 인스턴스 단가만 비교한다
      - id: saa-r2-Q27-60
        source_id: Q27-60
        type: mcq
        title: Q27-60 · 모의고사 C
        explain: |
          <p>이미 하루 전 데이터로 충분하므로 주기적인 S3 적재와 Athena의 필요 시 SQL 조회를 검토할 수 있다. 스캔량·열 형식·파티션과 적재 비용을 비교해야 하지만 상시 분석 DB를 유지하지 않고 운영 DB 부하를 분리하는 방향이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>보고서를 운영 기본 DB로 옮기고 읽기 복제본은 제거한다</td>
          <td>복제본 비용은 줄여도 복잡한 분석을 운영 기본 DB에 되돌려 주문 DB 부하를 늘릴 수 없다는 제약을 어긴다.</td>
          </tr>
          <tr>
          <td>같은 읽기 복제본에 보고서별 연결 풀을 늘려 조회 시간을 더 짧게 만든다</td>
          <td>연결 풀 조정은 상시 인스턴스 비용을 없애지 않고 하루 대부분의 유휴 계산 자원을 계속 유지한다.</td>
          </tr>
          <tr>
          <td>분석용 Redshift 프로비저닝 클러스터를 24시간 유지해 보고서 SQL을 옮긴다</td>
          <td>프로비저닝 분석 클러스터의 상시 실행은 유휴 계산 비용을 줄이려는 방향에 덜 적합하다. 다른 워크로드·성능 요구라면 별도 비교할 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/what-is.html">What is Amazon Athena? - Amazon Athena</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">드문 분석이 최신 온라인 복제본을 요구하지 않으므로 S3·Athena 기반 일괄 분석의 비용을 비교할 수 있다</a> · <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">데이터 적재·형식·스캔과 기존 복제본 유지 비용을 함께 봐야 한다</a></p>
        quizzes:
          - q: 월별 통계 SQL을 위해 RDS 읽기 복제본을 종일 운영하지만 실제 조회는 매일 30분이다. 하루 전 데이터로 충분하고 운영 주문 DB의
              부하는 늘릴 수 없다. 복잡한 SQL 조인은 유지하되 상시 분석 인스턴스 비용을 줄일 가장 적절한 방향은?
            answer: 분석 데이터를 S3의 조회 효율적인 형식으로 내보내고 필요할 때 Athena로 조회한다
            wrong:
              - 보고서를 운영 기본 DB로 옮기고 읽기 복제본은 제거한다
              - 같은 읽기 복제본에 보고서별 연결 풀을 늘려 조회 시간을 더 짧게 만든다
              - 분석용 Redshift 프로비저닝 클러스터를 24시간 유지해 보고서 SQL을 옮긴다
      - id: saa-r2-Q27-61
        source_id: Q27-61
        type: mcq
        title: Q27-61 · 모의고사 C
        explain: |
          <p>DynamoDB TTL 삭제는 만료 시각에 즉시 일어난다는 보장이 없다. 앱은 만료 시각을 직접 확인해 보안 유효 기간을 지키고 TTL에 물리 정리를 맡기면 반복 전체 Scan 삭제 코드를 줄일 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>TTL만 설정하고 GetItem에서 항목이 반환되면 아직 유효한 토큰으로 인정한다</td>
          <td>만료 후 삭제 대기 중인 항목도 읽기에 반환될 수 있어 존재 여부만으로 인정하면 만료 토큰을 사용할 수 있다.</td>
          </tr>
          <tr>
          <td>만료 시각 GSI로 5분마다 삭제하고 앱은 항목 존재 여부로만 토큰을 인정한다</td>
          <td>삭제 Query로 Scan을 줄일 수 있어도 정리 전 최대 5분 동안 만료 토큰이 남는다. 앱이 만료 시각을 검사하지 않으면 즉시 거부를 보장하지 못한다.</td>
          </tr>
          <tr>
          <td>삭제 작업을 주 1회로 줄이고 세션 항목이 존재하는 동안 로그인 상태를 유지한다</td>
          <td>주간 정리까지 존재하는 만료 토큰을 유효하게 취급하면 즉시 거부라는 보안 요구를 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html">Using time to live (TTL) in DynamoDB - Amazon DynamoDB</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#%EC%A1%B0%EA%B1%B4%EB%B6%80-%EA%B0%B1%EC%8B%A0%EA%B3%BC-%ED%8A%B8%EB%9E%9C%EC%9E%AD%EC%85%98">TTL은 만료 데이터를 나중에 자동 삭제해 직접 정리 부담을 줄인다</a> · <a href="/study/lessons/deep-dive/day-08.html#%EC%A1%B0%EA%B1%B4%EB%B6%80-%EA%B0%B1%EC%8B%A0%EA%B3%BC-%ED%8A%B8%EB%9E%9C%EC%9E%AD%EC%85%98">정확한 만료 초에 삭제를 보장하지 않으므로 인증의 유효 기간은 앱에서 직접 확인해야 한다</a></p>
        quizzes:
          - q: DynamoDB 세션 테이블의 만료 항목을 매일 전체 Scan 후 삭제해 읽기 비용이 커졌다. 앱은 만료 시각부터 즉시 토큰을 거부해야
              하지만 물리 삭제는 며칠 늦어도 된다. 정리 코드와 비용을 줄이며 유효 기간을 유지할 설계는?
            answer: TTL로 만료 항목을 정리하고 앱은 저장된 만료 시각을 별도로 검사한다
            wrong:
              - TTL만 설정하고 GetItem에서 항목이 반환되면 아직 유효한 토큰으로 인정한다
              - 만료 시각 GSI로 5분마다 삭제하고 앱은 항목 존재 여부로만 토큰을 인정한다
              - 삭제 작업을 주 1회로 줄이고 세션 항목이 존재하는 동안 로그인 상태를 유지한다
      - id: saa-r2-Q27-62
        source_id: Q27-62
        type: mcq
        title: Q27-62 · 모의고사 C
        explain: |
          <p>주어진 부하 시험에서 128GiB 후보만 메모리 작업 집합과 지연을 충족하면서 예산 아래다. CPU가 낮다는 이유로 메모리까지 줄이면 실패할 수 있다. 제시한 월 비용은 가정이며 실제 변경은 백업·점검·복구 절차를 갖춰 수행한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>월 500달러인 16vCPU·64GiB 후보와 RDS Proxy를 구성한다</td>
          <td>병목은 메모리 작업 집합이며 Proxy는 연결 풀 관리 기능이다. 64GiB 후보의 확인된 swap·지연 문제를 해결하는 근거가 아니다.</td>
          </tr>
          <tr>
          <td>월 400달러인 8vCPU·64GiB 후보로 바꾸고 연결 한도를 높인다</td>
          <td>연결 수는 이미 여유가 있으며 한도 상향은 부족한 메모리를 늘려 주지 않는다. 시험에서 실패한 후보를 정당화하지 못한다.</td>
          </tr>
          <tr>
          <td>현재 인스턴스를 유지하고 월 300달러 읽기 복제본을 추가한다</td>
          <td>현재 인스턴스 1,000달러와 추가 복제본 300달러는 800달러 예산을 넘고 필요한 축소 목표를 해결하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_BestPractices.html">RDS best practices</a> · <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.DBInstance.Modifying.html">Modify RDS instances</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#%EC%A4%91%EC%A7%80%EC%99%80-%EC%B6%95%EC%86%8C%EC%9D%98-%EB%B9%84%EC%9A%A9-%EA%B2%BD%EA%B3%84">16vCPU·128GiB는 100GiB 작업 집합과 관측된 CPU 요구를 수용하고 실제 대표 부하 시험도 통과했다</a> · <a href="/study/lessons/deep-dive/day-07.html#%EC%A4%91%EC%A7%80%EC%99%80-%EC%B6%95%EC%86%8C%EC%9D%98-%EB%B9%84%EC%9A%A9-%EA%B2%BD%EA%B3%84">월 700달러로 비용 상한을 충족하며 승인된 점검 시간에 변경해 재시작 영향을 관리한다</a> · <a href="/study/lessons/deep-dive/day-07.html#%EC%A4%91%EC%A7%80%EC%99%80-%EC%B6%95%EC%86%8C%EC%9D%98-%EB%B9%84%EC%9A%A9-%EA%B2%BD%EA%B3%84">메모리 부족을 연결 풀이나 연결 수 변경으로 해결할 수는 없다</a></p>
        quizzes:
          - q: RDS PostgreSQL 인스턴스 비용을 월 1,000달러에서 800달러 이하로 줄이려 한다. 월말에도 CPU는 4vCPU 수준,
              메모리는 100GiB를 사용한다. 연결·I/O는 여유가 있다. 16vCPU·128GiB는 부하 시험을 통과했고
              64GiB 후보는 swap·지연 초과가 났다. 점검 중 재시작을 허용할 때 적절한 선택은?
            answer: 월 700달러인 16vCPU·128GiB 후보로 점검 시간에 변경한다
            wrong:
              - 월 500달러인 16vCPU·64GiB 후보와 RDS Proxy를 구성한다
              - 월 400달러인 8vCPU·64GiB 후보로 바꾸고 연결 한도를 높인다
              - 현재 인스턴스를 유지하고 월 300달러 읽기 복제본을 추가한다
      - id: saa-r2-Q27-63
        source_id: Q27-63
        type: mcq
        title: Q27-63 · 모의고사 C
        explain: |
          <p>VPC 내부의 같은 리전 S3 요청에는 Gateway Endpoint가 NAT 경유를 줄이는 경로가 될 수 있다. 관련 라우팅 테이블을 연결하고 네트워크 경로와 별개인 S3·IAM 권한을 유지해야 한다. 외부 API용 NAT 경로는 남겨 둘 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>각 AZ에 S3 Interface Endpoint를 만들고 두 AZ의 DNS를 사설 주소로 바꾼다</td>
          <td>Interface Endpoint도 사설 S3 경로를 제공하지만 엔드포인트 시간·데이터 처리 요금이 있으므로 이 문제의 비용 조건에 덜 적합하다.</td>
          </tr>
          <tr>
          <td>S3 버킷 정책에 앱 역할을 추가하고 모든 S3 트래픽의 NAT 경로를 유지한다</td>
          <td>버킷 정책은 접근 인가를 바꾸며 패킷의 NAT 경유 경로와 그 처리 비용을 바꾸지 않는다.</td>
          </tr>
          <tr>
          <td>NAT를 한 AZ로 통합하고 두 AZ의 S3·외부 API를 그 NAT로 보낸다</td>
          <td>NAT 개수 감소와 달리 S3 처리 요금은 계속 발생하고 교차 AZ 경로·의존성까지 추가될 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html">Gateway endpoints - Amazon Virtual Private Cloud</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#gateway-endpoint%EB%8A%94-%EC%84%9C%EB%B9%84%EC%8A%A4%EB%B3%84-%EA%B2%BD%EB%A1%9C%EB%8B%A4">같은 VPC의 같은 리전 S3 접근에는 추가 엔드포인트 요금 없는 Gateway Endpoint를 검토한다</a> · <a href="/study/lessons/deep-dive/day-05.html#gateway-endpoint%EB%8A%94-%EC%84%9C%EB%B9%84%EC%8A%A4%EB%B3%84-%EA%B2%BD%EB%A1%9C%EB%8B%A4">해당 서비스 경로만 전환하고 일반 외부 API는 NAT 경로를 계속 사용할 수 있다</a></p>
        quizzes:
          - q: 두 AZ의 비공개 앱이 같은 리전 S3에 대량 업로드하며 현재 각 AZ의 Zonal NAT를 경유한다. 외부 결제 API는 계속 NAT를
              써야 하지만 S3 처리 요금은 줄이려 한다. 별도 엔드포인트 시간·처리 요금이 없는 VPC 내 S3 경로를 선택할 때
              적절한 변경은?
            answer: S3 Gateway Endpoint를 앱 라우팅 테이블에 연결하고 버킷·IAM 권한을 유지한다
            wrong:
              - 각 AZ에 S3 Interface Endpoint를 만들고 두 AZ의 DNS를 사설 주소로 바꾼다
              - S3 버킷 정책에 앱 역할을 추가하고 모든 S3 트래픽의 NAT 경로를 유지한다
              - NAT를 한 AZ로 통합하고 두 AZ의 S3·외부 API를 그 NAT로 보낸다
      - id: saa-r2-Q27-64
        source_id: Q27-64
        type: mcq
        title: Q27-64 · 모의고사 C
        explain: |
          <p>청구 데이터는 실제 과금액·사용 유형을 제공하고 네트워크 로그는 트래픽을 원본 팀에 귀속시키는 근거다. 두 데이터를 연결해 처리·시간 요금을 구분하고 경로 중복, 미귀속과 관측량·청구량 차이를 조정해야 요구한 배분표가 된다. 로그 바이트를 청구 바이트와 무조건 동일하다고 두면 안 된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>공용 NetworkTeam 태그를 비용 할당 태그로 활성화해 그 값만으로 팀을 구분한다</td>
          <td>공용 자원의 태그 값이 하나이므로 활성화해도 트래픽을 발생시킨 각 팀을 그 태그만으로 분리할 수 없다.</td>
          </tr>
          <tr>
          <td>NAT CloudWatch 총 바이트를 팀 수로 균등 배분해 처리 요금을 계산한다</td>
          <td>동일 배분은 실제 팀별 트래픽 비중 요구와 다르고 총 바이트만으로 어떤 팀이 사용했는지도 알 수 없다.</td>
          </tr>
          <tr>
          <td>팀별 EC2 계산 비용 비율로 공용 NAT·TGW 처리 요금까지 배분한다</td>
          <td>EC2 계산 비용 비율은 네트워크 처리량 비중이 아니므로 트래픽 기준 배분 요구를 충족하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
