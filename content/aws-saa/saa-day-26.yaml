id: saa-day-26
name: 혼동하기 쉬운 분야 보충 문제
part: 26일 차
color: "#FF9900"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: Q26-01
        type: mcq
        title: Q26-01 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>DNS64가 IPv4-only 목적지의 합성 IPv6 주소를 제공하고 NAT Gateway의 NAT64가 IPv4로 변환한다. 공개 인터넷까지의 NAT·IGW 경로를 구성하며 인스턴스에 IPv4를 배정할 필요가 없다. 일반 egress-only IGW는 IPv6에서 IPv4로 변환하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>서브넷의 ::/0을 egress-only internet gateway로 보내고 공급사의 A 레코드를 조회한다</td>
          <td>IPv6 인터넷 송신은 제공하지만 IPv4-only API의 주소 변환을 수행하지 않아 이 목적지에 도달할 수 없다.</td>
          </tr>
          <tr>
          <td>DNS64와 NAT64 소프트웨어가 설치된 EC2 라우터를 배치해 합성 접두사를 라우팅한다</td>
          <td>자체 NAT64 라우터로 구현할 수는 있으나 라우터 OS 패치와 가용성 운영을 직접 맡아야 한다.</td>
          </tr>
          <tr>
          <td>작업자를 dual-stack으로 바꾸고 private IPv4 기본 경로를 공개 NAT Gateway로 보낸다</td>
          <td>일반 IPv4 NAT 방식으로 접속할 수 있지만 인스턴스에 IPv4를 배정하지 못하는 설계 조건을 바꾼다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-nat64-dns64.html">DNS64와 NAT64</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 새 작업자는 IPv6-only 서브넷에서 실행되며 인스턴스에 IPv4 주소를 배정할 수 없다. 업데이트 공급사는 IPv4 A 레코드만
              제공하는 공개 HTTPS API를 운영한다. 작업자가 시작한 연결만 허용하고 자체 변환 서버의 OS를 운영하지 않으려
              한다. 필요한 주소 변환과 경로를 함께 갖춘 구성은 무엇인가?
            answer: DNS64와 공개 NAT Gateway를 사용하고 합성 IPv6 접두사 64:ff9b::/96을 NAT Gateway로 라우팅한다
            wrong:
              - 서브넷의 ::/0을 egress-only internet gateway로 보내고 공급사의 A 레코드를 조회한다
              - DNS64와 NAT64 소프트웨어가 설치된 EC2 라우터를 배치해 합성 접두사를 라우팅한다
              - 작업자를 dual-stack으로 바꾸고 private IPv4 기본 경로를 공개 NAT Gateway로 보낸다
      - id: Q26-02
        type: mcq
        title: Q26-02 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>S3의 private DNS only for inbound Resolver endpoint 구성을 사용하면 온프레미스는 Interface endpoint를, VPC 내부는 무료 Gateway endpoint 경로를 사용할 수 있다. 두 endpoint와 하이브리드 DNS가 필요하다. 대량의 VPC 트래픽을 유료 Interface 경로에서 분리하는 것이 핵심이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 환경의 S3 요청을 VPC의 HA 프록시 EC2로 보내 Interface endpoint에 전달한다</td>
          <td>프록시를 거쳐도 목적지 Interface endpoint의 바이트 처리량은 유지되고 프록시 비용·운영 부담이 추가된다.</td>
          </tr>
          <tr>
          <td>Interface endpoint의 private DNS를 두 환경 전체에 적용하고 두 AZ에 endpoint ENI를 배치한다</td>
          <td>사설 연결과 가용성은 제공하지만 100TB VPC 읽기도 Interface endpoint 처리 요금을 계속 발생시킨다.</td>
          </tr>
          <tr>
          <td>VPC는 Gateway endpoint로 보내고 온프레미스는 Direct Connect public VIF로 S3 공개 주소에 연결한다</td>
          <td>VPC 비용은 줄일 수 있지만 온프레미스가 접속하는 S3 목적지는 공개 IP이므로 사설 IP 요구와 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html">S3 Gateway·Interface 조합의 DNS 비용 최적화</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: VPC 작업자는 S3를 월 100TB 읽고 온프레미스는 Direct Connect로 월 1TB 읽는다. 두 환경은 기존 S3 서비스 DNS
              이름을 유지해야 하며 온프레미스는 사설 IP로 접속해야 한다. 현재 모든 DNS 응답이 S3 Interface
              endpoint를 가리킨다. 지원되는 endpoint와 Resolver 구성을 사용할 때 VPC의 처리 요금을 줄일
              설계는 무엇인가?
            answer: VPC는 Gateway endpoint, Interface private DNS는 inbound Resolver 요청에만 적용한다
            wrong:
              - 두 환경의 S3 요청을 VPC의 HA 프록시 EC2로 보내 Interface endpoint에 전달한다
              - Interface endpoint의 private DNS를 두 환경 전체에 적용하고 두 AZ에 endpoint
                ENI를 배치한다
              - VPC는 Gateway endpoint로 보내고 온프레미스는 Direct Connect public VIF로 S3
                공개 주소에 연결한다
      - id: Q26-03
        type: mcq
        title: Q26-03 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>inbound endpoint는 온프레미스 DNS 요청을 VPC Resolver로 받아들인다. 사내 DNS의 조건부 전달이 그 경로로 S3 질의를 보내야 Interface endpoint의 사설 주소를 얻는다. 네트워크 도달성만 있어서는 기존 서비스 이름의 공개 DNS 응답이 바뀌지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>VPC에 Resolver outbound endpoint를 만들고 사내 DNS로의 전달 규칙을 연결한다</td>
          <td>outbound endpoint는 VPC 쪽 질의를 외부 DNS로 보내는 반대 방향의 기능이다.</td>
          </tr>
          <tr>
          <td>앱의 S3 호스트 이름을 Interface endpoint 전용 DNS 이름으로 변경한다</td>
          <td>endpoint 전용 이름으로 직접 접속할 수는 있지만 앱이 기존 서비스 호스트 이름을 유지해야 한다는 요구와 맞지 않는다.</td>
          </tr>
          <tr>
          <td>온프레미스 라우터에 S3 공개 IP prefix의 DX public VIF 경로를 추가한다</td>
          <td>공개 S3 경로를 연결하는 방식이며 기존 서비스 이름이 Interface endpoint의 사설 주소로 해석되는 DNS 요구를 해결하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html">S3 하이브리드 private DNS</a> · <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-forwarding-inbound-queries.html">Resolver inbound endpoint</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: VPC에는 S3 Gateway endpoint와 Interface endpoint가 모두 있고 private DNS only for
              inbound Resolver endpoint 모드를 사용할 예정이다. 온프레미스와 endpoint 사설 IP 사이의
              DX 경로·권한은 정상이며 VPC DNS 설정도 활성화되어 있다. 앱은 기존 S3 서비스 호스트 이름을 유지해야 하지만
              사내 DNS는 현재 공개 주소를 돌려준다. 온프레미스 DNS 질의를 해결할 조치 두 가지는 무엇인가?
            answer: VPC에 Route 53 Resolver inbound endpoint를 만들고 사내 DNS의 질의를 허용한다
            wrong:
              - VPC에 Resolver outbound endpoint를 만들고 사내 DNS로의 전달 규칙을 연결한다
              - 앱의 S3 호스트 이름을 Interface endpoint 전용 DNS 이름으로 변경한다
              - 온프레미스 라우터에 S3 공개 IP prefix의 DX public VIF 경로를 추가한다
            answers:
              - VPC에 Route 53 Resolver inbound endpoint를 만들고 사내 DNS의 질의를 허용한다
              - 사내 DNS에서 해당 리전 S3 서비스 도메인을 inbound endpoint로 조건부 전달한다
            options:
              - VPC에 Route 53 Resolver inbound endpoint를 만들고 사내 DNS의 질의를 허용한다
              - VPC에 Resolver outbound endpoint를 만들고 사내 DNS로의 전달 규칙을 연결한다
              - 사내 DNS에서 해당 리전 S3 서비스 도메인을 inbound endpoint로 조건부 전달한다
              - 앱의 S3 호스트 이름을 Interface endpoint 전용 DNS 이름으로 변경한다
              - 온프레미스 라우터에 S3 공개 IP prefix의 DX public VIF 경로를 추가한다
      - id: Q26-04
        type: mcq
        title: Q26-04 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>일치하는 명시적 거부는 다른 정책의 허용보다 우선한다. 역할의 허용을 더 넓히는 대신 버킷 정책 조건에 맞는 endpoint 경로를 사용하거나 실제 요구에 따라 승인된 정책 변경을 해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 endpoint 정책만 넓히고 앱은 기존 인터넷 경로와 버킷 정책을 유지한다</td>
          <td>이번 요청은 endpoint를 사용하지 않으며 버킷 정책의 명시적 거부도 바뀌지 않는다.</td>
          </tr>
          <tr>
          <td>역할에 AdministratorAccess를 추가하고 버킷 정책 조건은 유지한다</td>
          <td>더 넓은 IAM Allow도 적용되는 리소스 정책의 명시적 거부를 넘지 못한다.</td>
          </tr>
          <tr>
          <td>역할 IAM 정책에 해당 객체의 GetObject Allow를 한 번 더 추가한다</td>
          <td>이미 허용된 신원 정책을 반복 추가해도 요청 경로에 적용되는 버킷 정책 Deny가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html">IAM 정책 평가</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 같은 계정의 역할이 S3 객체를 읽을 때 AccessDenied를 받는다. 역할 IAM 정책에는 해당 객체의 GetObject가 허용되어
              있지만 버킷 정책은 회사 endpoint 이외 경로의 요청을 명시적으로 거부한다. 요청은 인터넷 경로에서 왔고 다른
              제한은 없다. 가장 적절한 판단은 무엇인가?
            answer: 해당 endpoint 경로를 사용하도록 바꾸거나 승인된 정책 변경이 필요하다
            wrong:
              - S3 endpoint 정책만 넓히고 앱은 기존 인터넷 경로와 버킷 정책을 유지한다
              - 역할에 AdministratorAccess를 추가하고 버킷 정책 조건은 유지한다
              - 역할 IAM 정책에 해당 객체의 GetObject Allow를 한 번 더 추가한다
      - id: Q26-05
        type: mcq
        title: Q26-05 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>다수의 제한 파일에 접근하면서 기존 URL을 유지해야 하고 브라우저 쿠키를 사용할 수 있으므로 서명 쿠키가 적합하다. 쿠키 정책의 경로·만료를 정하고 원본 직접 접근 제한도 함께 유지해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현재 파일 URL을 유지하고 객체 키에 난수 접두사만 추가해 링크 유출 가능성을 낮춘다</td>
          <td>추측하기 어려운 경로는 발급된 링크의 사용자 권한이나 만료를 검증하지 않는다.</td>
          </tr>
          <tr>
          <td>모든 영상 조각마다 개별 CloudFront 서명 URL을 발급해 기존 URL을 교체한다</td>
          <td>개별 서명 URL도 접근 제한은 가능하지만 기존 URL을 파일마다 바꾸기 어렵다는 조건과 다수 파일의 쿠키 사용 조건에 덜 적합하다.</td>
          </tr>
          <tr>
          <td>회원 ID를 캐시 키에 추가하되 viewer 서명·토큰 검증은 구성하지 않는다</td>
          <td>캐시 구분은 사용자 접근 권한·만료를 검증하는 기능이 아니어서 인가 요구가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-choosing-signed-urls-cookies.html">서명 URL과 서명 쿠키 선택</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 브라우저 학습 서비스가 유료 회원에게 한 강의의 여러 영상 조각과 이미지 수백 개를 CloudFront로 제공한다. 기존 URL을 파일마다
              바꾸기는 어렵고, 로그인 서버는 브라우저 쿠키를 설정할 수 있다. 만료되는 접근 권한을 주는 데 가장 적합한 방식은
              무엇인가?
            answer: CloudFront 서명 쿠키로 허용 경로와 만료 조건을 전달한다
            wrong:
              - 현재 파일 URL을 유지하고 객체 키에 난수 접두사만 추가해 링크 유출 가능성을 낮춘다
              - 모든 영상 조각마다 개별 CloudFront 서명 URL을 발급해 기존 URL을 교체한다
              - 회원 ID를 캐시 키에 추가하되 viewer 서명·토큰 검증은 구성하지 않는다
      - id: Q26-06
        type: mcq
        title: Q26-06 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>OAC를 이용한 S3 원본 보호에는 웹 사이트 endpoint가 아닌 일반 S3 버킷 원본을 사용한다. 원본 접근을 서명하는 OAC와 특정 배포를 허용하는 버킷 정책을 함께 구성해 직접 공개 읽기를 막는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>웹 사이트 endpoint를 유지하고 OAI를 연결해 비공개 읽기를 구성한다</td>
          <td>OAI도 일반 S3 원본에 쓰는 방식이며 웹 사이트 endpoint의 사용자 지정 원본을 비공개 S3 인증으로 바꾸지 못한다.</td>
          </tr>
          <tr>
          <td>웹 사이트 endpoint를 그대로 두고 OAC를 연결한다</td>
          <td>S3 웹 사이트 endpoint는 사용자 지정 원본으로 취급되며 S3 OAC를 그대로 연결할 수 없다.</td>
          </tr>
          <tr>
          <td>웹 사이트 원본을 유지하고 버킷 공개 읽기는 끄되 CloudFront 원본 인증은 구성하지 않는다</td>
          <td>웹 사이트 원본은 공개 읽기를 끄는 것만으로 CloudFront에서 비공개로 읽을 인증 경로가 생기지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html">S3 OAC와 웹 사이트 endpoint 제한</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 회사가 CloudFront 뒤의 S3 웹 사이트 endpoint를 비공개 버킷으로 바꾸려 한다. 원본은 정적 파일이며 웹 사이트
              endpoint의 리다이렉트 기능은 필요 없다. CloudFront에서만 객체를 읽도록 하려면 어떤 조치 두 가지가
              필요한가?
            answer: 원본을 S3 일반 버킷 REST endpoint로 변경한다
            wrong:
              - 웹 사이트 endpoint를 유지하고 OAI를 연결해 비공개 읽기를 구성한다
              - 웹 사이트 endpoint를 그대로 두고 OAC를 연결한다
              - 웹 사이트 원본을 유지하고 버킷 공개 읽기는 끄되 CloudFront 원본 인증은 구성하지 않는다
            answers:
              - 원본을 S3 일반 버킷 REST endpoint로 변경한다
              - REST 버킷 원본에 OAC를 연결하고 공개 읽기를 막은 뒤 버킷 정책에서 특정 CloudFront 배포의 OAC
                요청만 허용한다
            options:
              - 웹 사이트 endpoint를 유지하고 OAI를 연결해 비공개 읽기를 구성한다
              - 원본을 S3 일반 버킷 REST endpoint로 변경한다
              - 웹 사이트 endpoint를 그대로 두고 OAC를 연결한다
              - REST 버킷 원본에 OAC를 연결하고 공개 읽기를 막은 뒤 버킷 정책에서 특정 CloudFront 배포의 OAC
                요청만 허용한다
              - 웹 사이트 원본을 유지하고 버킷 공개 읽기는 끄되 CloudFront 원본 인증은 구성하지 않는다
      - id: Q26-07
        type: mcq
        title: Q26-07 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>낮은 접근 빈도와 즉시 조회, 여러 AZ의 데이터 보관 요구를 함께 만족하는 선택은 Standard-IA다. 낮은 저장 비용만 보지 말고 검색 요금·최소 보관 조건도 함께 검토해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 One Zone-IA</td>
          <td>One Zone-IA는 단일 AZ 저장이므로 재생성 불가 원본의 AZ 상실 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>S3 Glacier Deep Archive</td>
          <td>Deep Archive는 복원 대기가 필요해 밀리초 조회 조건을 만족하지 못한다.</td>
          </tr>
          <tr>
          <td>S3 Glacier Flexible Retrieval</td>
          <td>Flexible Retrieval은 아카이브 복원 절차가 필요한 계층으로 밀리초 즉시 조회 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">S3 저장 클래스 비교</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: 회사는 재생성할 수 없는 계약서 원본을 S3에 장기 보관한다. 접근 빈도는 낮지만 조회 때 밀리초 응답이 필요하고, 한 AZ가 사라져도
              다른 AZ에서 데이터를 읽을 수 있어야 한다. 저장 클래스 중 가장 적합한 것은 무엇인가?
            answer: S3 Standard-IA
            wrong:
              - S3 One Zone-IA
              - S3 Glacier Deep Archive
              - S3 Glacier Flexible Retrieval
      - id: Q26-08
        type: mcq
        title: Q26-08 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>매우 드문 조회와 긴 복원 대기 허용이라는 조건은 장기 아카이브용 Deep Archive에 적합하다. 저장 클래스 선택과 별도로 법정 삭제 방지에는 보관 정책·Object Lock 등을 설계하고 복원 가능성을 점검해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 Glacier Instant Retrieval에 보관해 모든 감사 조회를 즉시 처리한다</td>
          <td>즉시 조회는 가능하지만 긴 복원 대기를 허용하고 저장 비용을 우선하는 요구에서는 Deep Archive가 더 적합하다.</td>
          </tr>
          <tr>
          <td>S3 Standard로만 영구 유지한다</td>
          <td>사용은 가능하지만 즉시 조회가 필요 없는 드문 접근 아카이브의 저장 비용 최적화라는 조건에 가장 맞지 않는다.</td>
          </tr>
          <tr>
          <td>S3 One Zone-IA에 원본을 저장하고 AZ 상실에 대한 별도 원본 복제는 두지 않는다</td>
          <td>재생성 불가 원본에 단일 AZ 저장만 사용하면 해당 AZ 상실 시 데이터 보호 요구를 만족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">S3 아카이브 클래스</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: 의료 영상은 법정 보관 기간 동안 삭제하지 않으며 평소에는 거의 읽지 않는다. 감사 요청 때 하루 이상의 복원 대기를 허용해 저장 비용을
              낮추려 한다. 삭제 방지 정책은 이미 설정했고 즉시 조회는 필요 없으며 원본을 잃으면 안 된다. 어떤 S3 저장
              클래스가 가장 적합한가?
            answer: S3 Glacier Deep Archive를 사용하고 복원 절차를 준비한다
            wrong:
              - S3 Glacier Instant Retrieval에 보관해 모든 감사 조회를 즉시 처리한다
              - S3 Standard로만 영구 유지한다
              - S3 One Zone-IA에 원본을 저장하고 AZ 상실에 대한 별도 원본 복제는 두지 않는다
      - id: Q26-09
        type: mcq
        title: Q26-09 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>Savings Plans는 시간당 사용 금액을 약정하는 방식이므로 한 시간에 소비하지 못한 몫은 다음 시간으로 이월되지 않는다. 다음 날 사용량이 많아도 전날 약정 잔여가 이를 상쇄하지 않으므로 지속 소비할 기본량에 맞춰야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>야간 미사용 약정은 월말까지 적립해 같은 달 초과 사용에 쓴다</td>
          <td>약정 적용은 시간 단위이며 남은 금액을 월간 잔고처럼 모아 쓸 수 없다.</td>
          </tr>
          <tr>
          <td>야간에 인스턴스를 중지하면 그 시간의 약정 지불도 자동 취소된다</td>
          <td>자원 중지는 사용량을 줄이지만 이미 한 사용 약정의 시간당 지불 의무를 취소하지 않는다.</td>
          </tr>
          <tr>
          <td>야간 미사용 금액은 다른 달의 예약 인스턴스 구매 대금으로 자동 환급된다</td>
          <td>미사용 약정은 다른 할인 상품 구매 비용으로 자동 환급·전환되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/savingsplans/latest/userguide/sp-applying.html">Savings Plans 시간별 적용</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 회사는 Compute Savings Plans로 시간당 일정 금액을 약정했지만 야간에는 사용량이 약정의 절반이다. 다음 날 업무 시간에는
              약정을 넘는 사용량이 발생한다. 운영자는 야간 미사용 금액이 다음 날 초과분에 이월된다고 예상한다. 올바른 비용 판단은
              무엇인가?
            answer: 시간별 약정은 미사용해도 지불하고 이월 없이 초과·비적용분은 별도 과금한다
            wrong:
              - 야간 미사용 약정은 월말까지 적립해 같은 달 초과 사용에 쓴다
              - 야간에 인스턴스를 중지하면 그 시간의 약정 지불도 자동 취소된다
              - 야간 미사용 금액은 다른 달의 예약 인스턴스 구매 대금으로 자동 환급된다
      - id: Q26-10
        type: mcq
        title: Q26-10 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>용량 예약은 특정 AZ·조건의 실행 용량을 확보하므로 다른 AZ로 앱을 옮긴다고 자동 이동하지 않는다. 새 AZ의 예약과 실제 시작을 확인하고 기존 미사용 예약을 정리하되 Compute Savings Plans 할인 적용과 혼동하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>AZ B에서 온디맨드 인스턴스만 시작하고 기존 AZ A 용량 예약은 활성 상태로 계속 유지한다</td>
          <td>새 AZ 용량의 사전 확보와 기존 AZ의 미사용 예약 비용 정리가 모두 남는다.</td>
          </tr>
          <tr>
          <td>AZ A 인스턴스만 중지하고 예약 상태는 바꾸지 않은 채 앱의 AZ B 이전을 끝낸다</td>
          <td>인스턴스 중지는 용량 예약 취소가 아니므로 기존 AZ 예약의 비용이 남고 새 AZ의 예약도 확인되지 않는다.</td>
          </tr>
          <tr>
          <td>Compute Savings Plans는 유지하고 AZ A 예약만 취소한 뒤 AZ B에서는 일반 온디맨드 시작에 의존한다</td>
          <td>기존 미사용 비용을 정리해도 새 AZ에서 필요한 실행 용량을 사전 확보·검증하는 단계가 빠진다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html">용량 예약의 AZ와 매칭 조건</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 회사는 AZ A의 인스턴스 조건에 맞는 온디맨드 용량 예약과 별도 Compute Savings Plans를 사용한다. 앱을 AZ B로
              완전히 옮길 계획이며, 이전 뒤에도 AZ B의 지정 EC2 조건에 맞는 실행 용량을 사전에 확보하는 것이 필수다. AZ
              A의 미사용 예약 비용도 정리하고 싶다. 실행 용량과 할인 약정을 구분한 올바른 조치는 무엇인가?
            answer: AZ B의 필요한 용량 예약을 별도로 확보·검증하고 더 필요 없는 AZ A 예약을 정리하며 할인 적용은 별도 확인한다
            wrong:
              - AZ B에서 온디맨드 인스턴스만 시작하고 기존 AZ A 용량 예약은 활성 상태로 계속 유지한다
              - AZ A 인스턴스만 중지하고 예약 상태는 바꾸지 않은 채 앱의 AZ B 이전을 끝낸다
              - Compute Savings Plans는 유지하고 AZ A 예약만 취소한 뒤 AZ B에서는 일반 온디맨드 시작에
                의존한다
      - id: Q26-11
        type: mcq
        title: Q26-11 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>자동 백업의 보존 기간 밖 시점은 현재 보존 기간을 늘린다고 소급 생성되지 않는다. 남아 있는 삭제 전 수동 스냅샷으로 별도 DB를 복원하면 운영 DB를 유지하며 허용된 과거 데이터를 검증·추출할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>자동 백업 보존 기간을 지금 30일로 늘려 이미 지난 20일 전 복구 지점을 생성한다</td>
          <td>보존 기간 확대는 이미 소실된 과거 자동 백업·로그를 소급 복구하지 않는다.</td>
          </tr>
          <tr>
          <td>현재 읽기 복제본을 승격하면 20일 전 삭제가 자동 취소된다</td>
          <td>복제본은 삭제 변경도 반영하므로 승격만으로 과거 데이터를 되돌리지 않는다.</td>
          </tr>
          <tr>
          <td>최신 시점 복구를 실행하면 보존 기간 밖의 삭제 이전 상태도 선택할 수 있다</td>
          <td>시점 복구는 실제 보관된 백업·로그의 복원 가능 범위 안에서 동작한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_CommonTasks.BackupRestore.html">RDS 백업과 수동 스냅샷</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: RDS 앱에서 20일 전에 잘못 삭제한 보고서를 복원해야 하지만 자동 백업 보존 기간은 7일이다. 삭제 전날 만든 수동 스냅샷은 아직 남아
              있고 그 시점 데이터를 사용하는 것을 허용한다. 현재 운영 DB를 덮어쓰지 않고 복구하려면 무엇이 적절한가?
            answer: 남아 있는 삭제 전 수동 스냅샷에서 새 DB를 복원해 필요한 데이터를 검증·추출한다
            wrong:
              - 자동 백업 보존 기간을 지금 30일로 늘려 이미 지난 20일 전 복구 지점을 생성한다
              - 현재 읽기 복제본을 승격하면 20일 전 삭제가 자동 취소된다
              - 최신 시점 복구를 실행하면 보존 기간 밖의 삭제 이전 상태도 선택할 수 있다
      - id: Q26-12
        type: mcq
        title: Q26-12 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>복원 가능한 데이터 시점에서 장애 시각까지가 20분이므로 데이터 손실 목표 15분을 초과했다. 장애부터 검증을 마친 업무 재개까지는 35분이어서 RTO 1시간 목표는 만족하며 두 목표를 따로 평가해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>RPO는 장애 뒤 앱 서버를 시작하는 데 걸린 시간이다</td>
          <td>RPO는 허용 데이터 손실의 시간 범위이며 서버 시작 소요 시간이 아니다.</td>
          </tr>
          <tr>
          <td>DB 파일 복원만 10분 걸렸다면 RTO를 10분으로 기록한다</td>
          <td>RTO는 DB 복원 한 단계가 아니라 사용 가능한 업무 복구 전체 시간을 평가한다.</td>
          </tr>
          <tr>
          <td>복구가 한 시간 안에 끝났으므로 RPO도 자동 충족한다</td>
          <td>빠른 서비스 재개와 복구 데이터의 최신성은 별도 조건이므로 자동 연동되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html">RPO와 RTO 정의</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 서비스가 10시에 중단되었고 실제로 복원 가능한 최신 데이터는 9시 40분이다. 네트워크와 앱 검증을 마친 업무 재개는 10시 35분이다.
              목표는 RPO 15분 이하와 RTO 1시간 이하다. 이 결과에 대한 올바른 판단 두 가지는 무엇인가?
            answer: 실제 데이터 손실 구간은 20분으로 RPO 목표를 넘는다
            wrong:
              - RPO는 장애 뒤 앱 서버를 시작하는 데 걸린 시간이다
              - DB 파일 복원만 10분 걸렸다면 RTO를 10분으로 기록한다
              - 복구가 한 시간 안에 끝났으므로 RPO도 자동 충족한다
            answers:
              - 실제 데이터 손실 구간은 20분으로 RPO 목표를 넘는다
              - 실제 업무 복구 시간은 35분으로 RTO 목표 안이다
            options:
              - RPO는 장애 뒤 앱 서버를 시작하는 데 걸린 시간이다
              - 실제 데이터 손실 구간은 20분으로 RPO 목표를 넘는다
              - 실제 업무 복구 시간은 35분으로 RTO 목표 안이다
              - DB 파일 복원만 10분 걸렸다면 RTO를 10분으로 기록한다
              - 복구가 한 시간 안에 끝났으므로 RPO도 자동 충족한다
      - id: Q26-13
        type: mcq
        title: Q26-13 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>아직 실제 삭제 전이면 삭제 예약을 취소할 수 있으며 취소 뒤 비활성 상태인 키를 다시 활성화해야 사용할 수 있다. 키 삭제와 회전은 다르고 새 키·동일 alias만으로 원래 키의 기존 암호문을 복호화할 수 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>새 키를 같은 alias로 만들면 기존 암호문도 새 키로 바로 복호화된다</td>
          <td>Alias는 키를 가리키는 이름이며 새 키가 기존 키 재료를 승계하지 않는다.</td>
          </tr>
          <tr>
          <td>삭제 대기 기간 중 자동 회전만 켜서 기존 키 사용을 복구한다</td>
          <td>회전은 삭제 예약 취소 절차가 아니며 삭제 대기 키의 사용을 복구하지 않는다.</td>
          </tr>
          <tr>
          <td>실제 삭제가 끝난 뒤 동일 Key ID의 키를 새로 생성해 이전 암호문을 읽는다</td>
          <td>실제 삭제된 키의 재료와 Key ID를 같은 방식으로 재생성해 기존 암호문을 읽을 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html">KMS 삭제 예약 취소</a> · <a href="https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys-scheduling-key-deletion.html">삭제 취소와 키 활성화</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 실수로 고객 관리형 KMS 키에 삭제 예약을 걸어 해당 키가 삭제 대기 상태가 됐다. 실제 삭제일은 아직 오지 않았고 이 키로 보호한
              백업을 곧 읽어야 한다. 권한 있는 관리자는 키 재료 회전과 삭제 취소를 구분해야 한다. 적절한 복구 절차는 무엇인가?
            answer: 삭제 예약을 취소하고 키를 다시 활성화한 뒤 권한·백업 복호화를 확인한다
            wrong:
              - 새 키를 같은 alias로 만들면 기존 암호문도 새 키로 바로 복호화된다
              - 삭제 대기 기간 중 자동 회전만 켜서 기존 키 사용을 복구한다
              - 실제 삭제가 끝난 뒤 동일 Key ID의 키를 새로 생성해 이전 암호문을 읽는다
      - id: Q26-14
        type: mcq
        title: Q26-14 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>기본 계산 사용량은 메모리와 실행 시간을 함께 보므로 메모리 2배와 시간 3분의 1이면 곱은 약 3분의 2다. 실제 부하에서 지연·오류·다른 비용도 확인하되 최소 메모리가 항상 최소 비용이라는 가정은 피해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 메모리를 유지하고 Provisioned concurrency만 늘려 CPU 계산 시간을 최적화한다</td>
          <td>미리 준비한 환경은 초기화 지연을 줄이는 용도이며 이 문제에서 측정한 메모리·CPU 증가에 따른 계산 시간 개선을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>기존 메모리와 함수 코드를 유지하고 큐 batch 크기만 늘린 결과를 계산 비용 최적화로 확정한다</td>
          <td>Batch 변경의 효과는 따로 측정해야 하며 이미 검증된 메모리·실행 시간의 곱을 무시한 채 계산 비용 개선을 확정할 수 없다.</td>
          </tr>
          <tr>
          <td>메모리 설정이 두 배이므로 실행 시간과 무관하게 계산 비용도 항상 두 배다</td>
          <td>계산 사용량 비용에는 실행 시간도 영향을 주므로 메모리 배수만으로 총 비용을 단정할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html">Lambda 메모리와 CPU</a> · <a href="https://aws.amazon.com/lambda/pricing/">Lambda 요금</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 일반 Lambda 영상 메타데이터 함수의 요청 수는 일정하고 CPU 계산이 주요 작업이다. 메모리를 두 배로 올린 시험에서 평균 실행
              시간이 3분의 1로 줄었고 오류율도 같았다. 다른 요금 항목은 동일하다고 할 때 계산 사용량 비용과 성능을 함께
              판단하는 올바른 설명은 무엇인가?
            answer: 메모리와 실행 시간의 곱을 비교하면 계산 사용량이 약 3분의 2가 되어 성능과 비용이 함께 개선될 수 있다
            wrong:
              - 기존 메모리를 유지하고 Provisioned concurrency만 늘려 CPU 계산 시간을 최적화한다
              - 기존 메모리와 함수 코드를 유지하고 큐 batch 크기만 늘린 결과를 계산 비용 최적화로 확정한다
              - 메모리 설정이 두 배이므로 실행 시간과 무관하게 계산 비용도 항상 두 배다
      - id: Q26-15
        type: mcq
        title: Q26-15 · 혼동하기 쉬운 분야 보충 문제
        explain: |
          <p>업무 성공 조건이 쓰기 가능성이므로 private 환경의 시험 쓰기로 의미 있는 지표를 생성해야 한다. Route 53은 CloudWatch 알람을 기반으로 상태를 판단할 수 있어 private DB의 인터넷 공개가 필요 없다. 간격 단축이나 읽기 성공만으로 쓰기 장애를 식별할 수 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>주 리전의 private Lambda가 DB SELECT 성공 지표를 게시하고 해당 알람 기반 상태 확인을 failover에 연결한다</td>
          <td>SELECT 성공은 읽기 전용 DB에서도 가능하므로 해당 장애에서 주 리전이 정상으로 유지될 수 있다.</td>
          </tr>
          <tr>
          <td>주 ALB의 /health HTTP 상태 확인을 10초 간격으로 바꾸고 failover 레코드에 연결한다</td>
          <td>읽기 기반 /health가 계속 200이면 간격을 줄여도 같은 정상 결과를 더 자주 얻게 된다.</td>
          </tr>
          <tr>
          <td>주 DB의 CPUUtilization 알람을 CloudWatch 기반 상태 확인에 연결하고 failover를 구성한다</td>
          <td>읽기 전용 전환은 CPU 급증을 동반하지 않을 수 있어 주문 쓰기 가능성과 지표가 일치하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-types.html">CloudWatch 알람 기반 Route 53 상태 확인</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: Route 53 failover로 두 리전의 주문 API를 운영한다. 주 리전 ALB의 /health는 DB 읽기가 될 때 200을
              반환하지만, DB가 읽기 전용으로 전환된 사고에서는 주문 쓰기가 실패해도 200이었다. DB는 private
              subnet에 있어 인터넷 상태 확인기로 직접 접근할 수 없다. 쓰기 불가 때도 대기 리전으로 전환할 구성은 무엇인가?
            answer: 주 리전 private Lambda의 시험 쓰기 성공 지표로 CloudWatch 알람 상태 확인을 만들어 failover에
              연결한다
            wrong:
              - 주 리전의 private Lambda가 DB SELECT 성공 지표를 게시하고 해당 알람 기반 상태 확인을
                failover에 연결한다
              - 주 ALB의 /health HTTP 상태 확인을 10초 간격으로 바꾸고 failover 레코드에 연결한다
              - 주 DB의 CPUUtilization 알람을 CloudWatch 기반 상태 확인에 연결하고 failover를 구성한다
