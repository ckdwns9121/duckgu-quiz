      - id: saa-r2-Q24-50
        source_id: Q24-50
        type: mcq
        title: Q24-50 · 모의고사 B
        explain: |
          <p>한 사건 로그를 소비자별 위치에서 독립 재생하고 센서 단위 순서를 관리해야 한다. 여러 소비자가 같은 보존된 이벤트를 독립적으로 읽고 재생해야 하므로 스트림 모델이 맞다. 센서 키·샤드의 순서 범위와 키 쏠림·보존 기간·중복 처리·체크포인트를 함께 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>하나의 SQS 큐에 두 소비자가 경쟁 수신하도록 한다</td>
          <td>같은 이벤트의 독립 보존·재생보다 작업 분담 모델에 적합하다.</td>
          </tr>
          <tr>
          <td>Data Firehose만으로 S3에 전달하고 실시간 소비자의 재생 로그는 두지 않는다</td>
          <td>목적지 적재에는 적합하지만 명시한 실시간 독립 소비·최근 재생 요구를 직접 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>SNS에서 팀별 SQS 큐로 팬아웃하고 성공한 메시지는 큐에서 삭제한다</td>
          <td>팀별 적체와 독립 속도는 제공하지만 처리 후 삭제한 사건을 원래 로그의 읽기 위치로 돌아가 재생하는 모델은 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">센서별 순서는 partition key와 shard 배치 범위에 따라 설계한다</a> · <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">소비자의 체크포인트로 읽기 위치를 유지하고 처리 중복을 고려한다</a> · <a href="/study/lessons/deep-dive/day-14.html#kinesis-%EC%93%B0%EA%B8%B0%EC%9D%BD%EA%B8%B0%EC%B2%B4%ED%81%AC%ED%8F%AC%EC%9D%B8%ED%8A%B8%EC%9D%98-%EC%84%B8-%EB%B3%91%EB%AA%A9">보존 기간 안에서 재처리할 수 있으며 보존 밖 레코드는 복구되지 않는다</a></p>
        quizzes:
          - q: 센서 사건을 실시간 이상 탐지와 장기 통계가 각각 읽는다. 두 소비자는 서로 다른 속도로 처리하고 최근 하루의 사건을 다시 읽을 수 있어야
              한다. 동일 센서의 사건 순서도 유지해야 한다. 소비자를 경쟁시키지 않을 수집 구조는?
            answer: Data Streams에서 센서 키와 소비자별 읽기 위치를 설계한다
            wrong:
              - 하나의 SQS 큐에 두 소비자가 경쟁 수신하도록 한다
              - Data Firehose만으로 S3에 전달하고 실시간 소비자의 재생 로그는 두지 않는다
              - SNS에서 팀별 SQS 큐로 팬아웃하고 성공한 메시지는 큐에서 삭제한다
      - id: saa-r2-Q24-51
        source_id: Q24-51
        type: mcq
        title: Q24-51 · 모의고사 B
        explain: |
          <p>날짜 조건으로 파일 범위를 줄이고 열 지향 형식으로 필요한 열만 읽는 효과를 결합해야 한다. 날짜 파티션은 100일 중 필요한 하루의 데이터로 대상을 줄이고, Parquet는 필요한 열과 관련 데이터 블록만 읽을 수 있게 한다. 두 가지 조회 특성을 함께 활용하므로 원본 보존과 별개로 분석 사본의 스캔 양을 줄인다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>하루별 디렉터리에 Parquet를 저장하되 날짜 조건 없이 전체 사본을 조회한다</td>
          <td>열 스캔은 줄지만 날짜 필터를 통한 파티션 가지치기를 사용하지 않아 필요 없는 다른 날짜 데이터도 읽을 수 있다.</td>
          </tr>
          <tr>
          <td>날짜별 파티션에 gzip CSV 파일을 저장하고 필요한 열을 SELECT한다</td>
          <td>날짜 파티션과 압축은 유용하지만 CSV는 행 기반이므로 SELECT한 다섯 열만 물리적으로 읽는 구성이 아니다.</td>
          </tr>
          <tr>
          <td>날짜별 파티션에 압축 JSON을 저장하고 Glue Catalog에 등록한다</td>
          <td>날짜 파티션은 활용하지만 JSON은 행 단위 형식이라 필요한 다섯 열만 읽는 열 지향 형식의 이점을 얻지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/columnar-storage.html">Athena 열 지향 형식</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/partitions.html">Athena 파티션</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">날짜 파티션은 100일 중 필요한 하루의 데이터로 대상을 줄이고, Parquet는 필요한 열과 관련 데이터 블록만 읽을 수 있게 한다</a> · <a href="/study/lessons/deep-dive/day-14.html#athena%EC%97%90%EC%84%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%99%80-%EC%8B%A4%EC%A0%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%94%B0%EB%A1%9C-%EC%A4%84%EC%9D%B8%EB%8B%A4">두 가지 조회 특성을 함께 활용하므로 원본 보존과 별개로 분석 사본의 스캔 양을 줄인다</a></p>
        quizzes:
          - q: 물류사는 하루 1TB의 100열 JSON을 S3에 쌓는다. Athena 쿼리는 항상 날짜 한 개와 5개 열을 선택하며 원본 100일치는
              보존해야 한다. ETL 시간은 충분하다. 반복 쿼리의 스캔 양을 가장 직접적으로 줄일 분석 사본은?
            answer: 날짜별 파티션에 Parquet를 저장하고 해당 파티션 조건으로 조회한다
            wrong:
              - 하루별 디렉터리에 Parquet를 저장하되 날짜 조건 없이 전체 사본을 조회한다
              - 날짜별 파티션에 gzip CSV 파일을 저장하고 필요한 열을 SELECT한다
              - 날짜별 파티션에 압축 JSON을 저장하고 Glue Catalog에 등록한다
      - id: saa-r2-Q24-52
        source_id: Q24-52
        type: mcq
        title: Q24-52 · 모의고사 B
        explain: |
          <p>분석 계층의 열 제한을 원본 S3나 결과 파일 직접 읽기로 우회하지 못하게 해야 한다. 분석 도구의 열 제한을 원본 직접 읽기로 우회할 수 있으면 의도한 데이터 권한 경계가 깨진다. IAM·S3·KMS·결과 저장소와 Lake Formation을 함께 검토해 승인된 경로에서만 데이터를 보게 해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Lake Formation 열 제한만 유지하고 직접 S3 읽기는 계속 허용한다</td>
          <td>분석 도구를 우회하는 원본 접근 경로가 열려 있으므로 민감 열 차단 의도가 충족되지 않는다.</td>
          </tr>
          <tr>
          <td>BI 화면의 전화번호 열만 숨기고 데이터 원본 권한은 유지한다</td>
          <td>화면 표시 제한은 원본 API를 통한 실제 읽기 권한을 제거하지 않는다.</td>
          </tr>
          <tr>
          <td>원본 버킷의 SSE-KMS를 유지하고 분석가에게 같은 키의 Decrypt를 계속 허용한다</td>
          <td>암호화되어도 분석가에게 원본 읽기와 복호화가 허용되면 전화번호를 직접 읽을 수 있다. 키·원본·결과 접근 범위를 함께 제한해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%A0%88%EC%9D%B4%ED%81%AC-%EA%B6%8C%ED%95%9C%EA%B3%BC-%EB%B9%84%EC%9A%A9-%EC%83%81%ED%95%9C">분석 도구의 열 제한을 원본 직접 읽기로 우회할 수 있으면 의도한 데이터 권한 경계가 깨진다</a> · <a href="/study/lessons/deep-dive/day-14.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%A0%88%EC%9D%B4%ED%81%AC-%EA%B6%8C%ED%95%9C%EA%B3%BC-%EB%B9%84%EC%9A%A9-%EC%83%81%ED%95%9C">IAM·S3·KMS·결과 저장소와 Lake Formation을 함께 검토해 승인된 경로에서만 데이터를 보게 해야 한다</a></p>
        quizzes:
          - q: 분석가는 Lake Formation으로 허용한 지역 집계만 Athena에서 봐야 하고 전화번호 열에는 접근하면 안 된다. 하지만 역할에는
              원본 S3 GetObject와 KMS Decrypt가 넓게 허용되어 있다. 승인된 분석 경로의 열 제한을 실제 권한
              경계로 만들 개선은?
            answer: 원본 직접 접근·결과 버킷·KMS 권한까지 함께 제한한다
            wrong:
              - Lake Formation 열 제한만 유지하고 직접 S3 읽기는 계속 허용한다
              - BI 화면의 전화번호 열만 숨기고 데이터 원본 권한은 유지한다
              - 원본 버킷의 SSE-KMS를 유지하고 분석가에게 같은 키의 Decrypt를 계속 허용한다
      - id: saa-r2-Q24-53
        source_id: Q24-53
        type: mcq
        title: Q24-53 · 모의고사 B
        explain: |
          <p>저장 단가가 아니라 인증된 다운로드 요청의 비용 부담 주체를 바꾸어야 한다. 요구는 저장 계층 변경이 아니라 읽기 요청·전송 비용의 부담 주체 변경이다. Requester Pays는 인증된 요청자가 관련 요금을 부담하게 하며 버킷 소유자의 저장 비용과 객체 접근 정책은 별도로 남는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Standard-IA로 바꾸고 소유자 계정이 계속 다운로드 비용을 부담한다</td>
          <td>저장 단가는 줄 수 있어도 다운로드 요금의 부담 주체 변경 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>버킷을 Intelligent-Tiering으로 전환한다</td>
          <td>저장 계층을 관리하는 기능이므로 외부 연구자의 요청·전송 비용 부담 주체를 바꾸지 않는다.</td>
          </tr>
          <tr>
          <td>연구자별 IAM 역할에 비용 할당 태그를 붙이고 다운로드 청구를 역할 태그로 분리한다</td>
          <td>비용 태그는 비용 분석에 쓰이지만 요청·전송 비용의 청구 주체를 외부 계정으로 바꾸지는 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/RequesterPaysBuckets.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#%EC%97%85%EB%A1%9C%EB%93%9C%EC%A7%91%EA%B3%84%EC%9A%94%EA%B8%88-%EB%B6%80%EB%8B%B4-%EC%A3%BC%EC%B2%B4">요구는 저장 계층 변경이 아니라 읽기 요청·전송 비용의 부담 주체 변경이다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EC%97%85%EB%A1%9C%EB%93%9C%EC%A7%91%EA%B3%84%EC%9A%94%EA%B8%88-%EB%B6%80%EB%8B%B4-%EC%A3%BC%EC%B2%B4">Requester Pays는 인증된 요청자가 관련 요금을 부담하게 하며 버킷 소유자의 저장 비용과 객체 접근 정책은 별도로 남는다</a></p>
        quizzes:
          - q: 외부 연구자는 자기 AWS 계정으로 인증해 대용량 S3 데이터를 내려받는다. 버킷은 비공개를 유지하고 소유자는 저장 요금만 계속 부담하되
              연구자가 자기 요청·전송 비용을 내게 하려 한다. 지원 클라이언트는 비용 부담 의사를 요청에 표시할 수 있다. 적합한
              기능은?
            answer: S3 Requester Pays와 인증된 요청을 구성한다
            wrong:
              - Standard-IA로 바꾸고 소유자 계정이 계속 다운로드 비용을 부담한다
              - 버킷을 Intelligent-Tiering으로 전환한다
              - 연구자별 IAM 역할에 비용 할당 태그를 붙이고 다운로드 청구를 역할 태그로 분리한다
      - id: saa-r2-Q24-54
        source_id: Q24-54
        type: mcq
        title: Q24-54 · 모의고사 B
        explain: |
          <p>장기 저장 최저 견적을 선택하되 24시간 조건 때문에 느린 검색 등급은 제외해야 한다. 첫 30일 Standard 뒤 Deep Archive 전환은 장기 보관 저장 비용을 낮춘다. Deep Archive Standard retrieval은 일반적으로 12시간 이내로, 소수 객체의 24시간 허용 조건에 맞는다. 10년 보관은 180일 최소 보관 기간도 넘는다. 보존 잠금은 전환과 별도로 계속 적용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>30일 후 Glacier Instant Retrieval로 전환하고 GET 요청으로 읽는다</td>
          <td>즉시 GET이 가능하지만 첫 달 이후에는 즉시 읽기가 필요하지 않으며 제시된 장기 비용 비교에서 더 비싸다.</td>
          </tr>
          <tr>
          <td>30일 후 Glacier Deep Archive로 전환하고 Bulk retrieval을 사용한다</td>
          <td>Deep Archive Bulk retrieval은 일반적으로 48시간 이내여서 24시간 복원 허용 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>30일 뒤 Glacier Flexible Retrieval로 전환해 Standard 검색을 사용한다</td>
          <td>복원 시간은 맞출 수 있지만 제시된 검색 포함 견적에서 Deep Archive보다 비용이 높다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html">아카이브 복원 옵션과 시간</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">스토리지 클래스와 최소 보관 기간</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#lifecycle%EA%B3%BC-%EC%9A%A9%EB%9F%89-%EC%82%B0%EC%A0%95">첫 30일 Standard 뒤 Deep Archive 전환은 장기 보관 저장 비용을 낮춘다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EC%A0%80%EC%9E%A5-%ED%81%B4%EB%9E%98%EC%8A%A4%EC%99%80-%EB%B3%B5%EC%9B%90-%EC%8B%9C%EA%B0%84%EC%9D%98-%EC%84%A0%ED%83%9D">Deep Archive Standard retrieval은 일반적으로 12시간 이내로, 소수 객체의 24시간 허용 조건에 맞는다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EC%A0%80%EC%9E%A5-%ED%81%B4%EB%9E%98%EC%8A%A4%EC%99%80-%EB%B3%B5%EC%9B%90-%EC%8B%9C%EA%B0%84%EC%9D%98-%EC%84%A0%ED%83%9D">10년 보관은 180일 최소 보관 기간도 넘는다</a> · <a href="/study/lessons/deep-dive/day-03.html#object-lock%EC%9D%98-%EB%B3%B4%EC%A1%B4-%EA%B8%B0%EA%B0%84%EA%B3%BC-legal-hold">보존 잠금은 전환과 별도로 계속 적용한다</a></p>
        quizzes:
          - q: 계약 증빙은 첫 30일 즉시 읽은 뒤 10년간 잠금 보존한다. 이후 조회는 드물고 소수 객체 복원은 보통 24시간 이내면 된다. 팀의 검색
              비용 포함 견적에서 Deep Archive가 가장 저렴하며 Bulk 복원은 최대 48시간 걸릴 수 있다. 적합한
              전환·검색 조합은?
            answer: 30일 후 Glacier Deep Archive로 전환하고 Standard retrieval을 사용한다
            wrong:
              - 30일 후 Glacier Instant Retrieval로 전환하고 GET 요청으로 읽는다
              - 30일 후 Glacier Deep Archive로 전환하고 Bulk retrieval을 사용한다
              - 30일 뒤 Glacier Flexible Retrieval로 전환해 Standard 검색을 사용한다
      - id: saa-r2-Q24-55
        source_id: Q24-55
        type: mcq
        title: Q24-55 · 모의고사 B
        explain: |
          <p>기초 전체 데이터는 확보한 오프라인 경로로 옮기고 소량 변경분은 온라인으로 추격해야 한다. 80TB를 1Gbps로 보내는 데는 전송 오버헤드를 빼도 약 7.4일이 필요하다. 확보된 Terminal로 초기 스냅샷을 이틀 안에 올리고, 별도로 추적한 변경 파일만 기존 회선의 DataSync로 전송하면 소량의 증분을 반영할 수 있다. 최종 쓰기 중지·변경분 반영·무결성 확인까지 완료해야 이관이 끝난다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현행 회선의 DataSync 작업을 여러 개 병렬 실행해 80TB 전체를 전송한다</td>
          <td>작업 수를 늘려도 공유 1Gbps 병목은 없어지지 않아 전체 복사의 기한을 맞추지 못한다.</td>
          </tr>
          <tr>
          <td>10Gbps Direct Connect 회선 개통 후 전체 파일을 전송한다</td>
          <td>개통까지 10일이 걸리므로 전송 속도가 충분해도 4일 기한에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>기존 회선에서 S3 Transfer Acceleration으로 전체 파일을 업로드한다</td>
          <td>장거리 인터넷 경로를 개선할 수 있지만 고객 측 1Gbps 회선의 한도를 넘어 초기 80TB 전송 기간을 4일로 줄이지는 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/snowball/latest/developer-guide/snowball-edge-availability-change.html">현행 물리 전송 대안</a> · <a href="https://docs.aws.amazon.com/datasync/latest/userguide/configure-metadata.html">DataSync 변경 데이터 전송</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#datasync-%EC%A0%84%EC%86%A1%EB%9F%89%EA%B3%BC-%EB%B3%80%EA%B2%BD-%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%9D%98-%EC%88%98%EB%A0%B4">80TB를 1Gbps로 보내는 데는 전송 오버헤드를 빼도 약 7.4일이 필요하다</a> · <a href="/study/lessons/deep-dive/day-13.html#datasync-%EC%A0%84%EC%86%A1%EB%9F%89%EA%B3%BC-%EB%B3%80%EA%B2%BD-%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%9D%98-%EC%88%98%EB%A0%B4">확보된 Terminal로 초기 스냅샷을 이틀 안에 올리고, 별도로 추적한 변경 파일만 기존 회선의 DataSync로 전송하면 소량의 증분을 반영할 수 있다</a> · <a href="/study/lessons/deep-dive/day-13.html#datasync-%EC%A0%84%EC%86%A1%EB%9F%89%EA%B3%BC-%EB%B3%80%EA%B2%BD-%EB%8D%B0%EC%9D%B4%ED%84%B0%EC%9D%98-%EC%88%98%EB%A0%B4">최종 쓰기 중지·변경분 반영·무결성 확인까지 완료해야 이관이 끝난다</a></p>
        quizzes:
          - q: 신규 고객의 온프레미스 파일 80TB를 4일 안에 S3로 옮긴다. 1Gbps 회선에서 전체 복사는 최소 7.4일이고 하루 변경은
              200GB다. 팀은 이틀 내 업로드할 Data Transfer Terminal과 장비를 확보했다. 변경 목록 추적과
              DataSync 경로는 시험했다. 최종 데이터까지 맞출 두 조치는?
            answer: 기준 시점 스냅샷을 장비에 담아 Terminal에서 S3로 업로드한다
            wrong:
              - 현행 회선의 DataSync 작업을 여러 개 병렬 실행해 80TB 전체를 전송한다
              - 10Gbps Direct Connect 회선 개통 후 전체 파일을 전송한다
              - 기존 회선에서 S3 Transfer Acceleration으로 전체 파일을 업로드한다
            answers:
              - 기준 시점 스냅샷을 장비에 담아 Terminal에서 S3로 업로드한다
              - 변경 파일을 DataSync로 전송하고 짧은 쓰기 중지 동안 최종 변경분과 무결성을 검증한다
            options:
              - 기준 시점 스냅샷을 장비에 담아 Terminal에서 S3로 업로드한다
              - 변경 파일을 DataSync로 전송하고 짧은 쓰기 중지 동안 최종 변경분과 무결성을 검증한다
              - 현행 회선의 DataSync 작업을 여러 개 병렬 실행해 80TB 전체를 전송한다
              - 10Gbps Direct Connect 회선 개통 후 전체 파일을 전송한다
              - 기존 회선에서 S3 Transfer Acceleration으로 전체 파일을 업로드한다
      - id: saa-r2-Q24-56
        source_id: Q24-56
        type: mcq
        title: Q24-56 · 모의고사 B
        explain: |
          <p>Regional 내구성을 유지하며 짧은 고처리량 구간을 크레딧과 무관하게 제공하는 후보의 비용을 비교해야 한다. Elastic은 저장 용량이나 버스트 크레딧에 성능을 묶지 않고 실제 사용 처리량에 따라 과금한다. 제시된 지원 한도와 짧은 배치 패턴에서 500MiB/s를 충족하며 월 견적도 Provisioned보다 낮다. Regional 파일 시스템을 유지해 AZ 장애 범위도 바꾸지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>One Zone EFS의 Provisioned 500MiB/s로 파일을 옮긴다</td>
          <td>처리량은 확보할 수 있어도 파일 시스템의 데이터가 한 AZ에 저장되는 방식으로 바뀐다. 여러 AZ의 Regional 공유 파일 구성을 유지하는 비용 대안이 아니다.</td>
          </tr>
          <tr>
          <td>Bursting을 유지하고 크레딧 유지를 위한 추가 데이터를 저장한다</td>
          <td>저장량으로 기준 처리량을 높이는 방식은 불필요한 데이터를 보관하고 크레딧을 관리해야 한다. 제시된 Elastic 지원·견적이 직접적인 최소 운영 대안이다.</td>
          </tr>
          <tr>
          <td>Provisioned 500MiB/s를 설정하고 저장 용량은 실제 사용량으로 유지한다</td>
          <td>필요 성능은 제공하지만 제시된 낮은 평균 처리량의 월 견적에서는 Elastic보다 비용이 10배 높다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/efs/latest/ug/performance.html">EFS 처리량 모드</a>
          SAA 평가 항목: 4.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#efs-%EB%A7%88%EC%9A%B4%ED%8A%B8%EC%99%80-%EC%B2%98%EB%A6%AC%EB%9F%89">Elastic은 저장 용량이나 버스트 크레딧에 성능을 묶지 않고 실제 사용 처리량에 따라 과금한다</a> · <a href="/study/lessons/deep-dive/day-03.html#efs-%EB%A7%88%EC%9A%B4%ED%8A%B8%EC%99%80-%EC%B2%98%EB%A6%AC%EB%9F%89">제시된 지원 한도와 짧은 배치 패턴에서 500MiB/s를 충족하며 월 견적도 Provisioned보다 낮다</a> · <a href="/study/lessons/deep-dive/day-03.html#efs-%EB%A7%88%EC%9A%B4%ED%8A%B8%EC%99%80-%EC%B2%98%EB%A6%AC%EB%9F%89">Regional 파일 시스템을 유지해 AZ 장애 범위도 바꾸지 않는다</a></p>
        quizzes:
          - q: Regional EFS의 NFS 앱은 AZ 장애에도 파일을 유지해야 한다. 하루 10분만 500MiB/s 쓰기가 필요하고 나머지는 거의
              유휴다. Bursting 크레딧 소진으로 지연이 발생한다. 지원 조건을 확인한 월 처리량 견적은 Elastic 30,
              Provisioned 500MiB/s 300이다. 최저 비용 개선은?
            answer: Elastic 처리량을 설정하고 저장 용량은 실제 사용량으로 유지한다
            wrong:
              - One Zone EFS의 Provisioned 500MiB/s로 파일을 옮긴다
              - Bursting을 유지하고 크레딧 유지를 위한 추가 데이터를 저장한다
              - Provisioned 500MiB/s를 설정하고 저장 용량은 실제 사용량으로 유지한다
      - id: saa-r2-Q24-57
        source_id: Q24-57
        type: mcq
        title: Q24-57 · 모의고사 B
        explain: |
          <p>계열·리전 이동의 유연성을 유지하고 지속 기본 부하만 알려진 1년 기간에 약정해야 한다. Compute Savings Plans는 인스턴스 계열·리전을 바꾸어도 대상 사용량에 적용된다. 적정 사양의 지속 기본 부하만 1년 약정하고 재시작 가능한 추가 배치를 Spot으로 처리하면 피크를 24시간 약정하지 않아도 된다. 시간당 1.20은 온디맨드 단가가 아니라 해당 사용량에 대한 제시된 Savings Plans 견적 약정액이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기본 부하를 3년 Compute Savings Plans로 약정하고 추가 배치는 Spot으로 실행한다</td>
          <td>현재 기본 부하와 배치 분리는 맞지만 1년 뒤 규모가 미정이므로 3년 약정은 미사용 약정 위험을 키운다.</td>
          </tr>
          <tr>
          <td>현재 계열·리전에 1년 EC2 Instance Savings Plans를 약정하고 추가 배치는 Spot으로 실행한다</td>
          <td>EC2 Instance Savings Plans는 지정한 계열과 리전에 묶인다. 예정된 두 항목 변경 후 같은 기본 부하에 약정이 적용되지 않을 수 있다.</td>
          </tr>
          <tr>
          <td>기본 부하와 배치 피크 합계에 1년 Compute Savings Plans를 약정한다</td>
          <td>하루 두 시간인 배치 피크까지 매시간 약정하면 나머지 시간에 미사용 약정이 남을 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html">Savings Plans 적용 범위</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">Compute Savings Plans는 인스턴스 계열·리전을 바꾸어도 대상 사용량에 적용된다</a> · <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">적정 사양의 지속 기본 부하만 1년 약정하고 재시작 가능한 추가 배치를 Spot으로 처리하면 피크를 24시간 약정하지 않아도 된다</a> · <a href="/study/lessons/deep-dive/day-02.html#%ED%95%A0%EC%9D%B8%EA%B3%BC-%EC%8B%A4%ED%96%89-%EC%9A%A9%EB%9F%89%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1">시간당 1.20은 온디맨드 단가가 아니라 해당 사용량에 대한 제시된 Savings Plans 견적 약정액이다</a></p>
        quizzes:
          - q: 적정 사양의 기본 부하는 24시간 지속되며 해당 사용량의 1년 Compute Savings Plans 견적은 시간당 1.20이다. 매일 두
              시간 추가 배치는 중단·재개가 가능하다. 6개월 뒤 기본 부하는 다른 계열·리전으로 옮기고 1년 뒤 규모는 미정이다.
              기본 부하 보호와 미사용 약정 최소화에 맞는 조합은?
            answer: 기본 부하의 시간당 1.20에 1년 Compute Savings Plans를 약정하고 추가 배치는 Spot으로 실행한다
            wrong:
              - 기본 부하를 3년 Compute Savings Plans로 약정하고 추가 배치는 Spot으로 실행한다
              - 현재 계열·리전에 1년 EC2 Instance Savings Plans를 약정하고 추가 배치는 Spot으로 실행한다
              - 기본 부하와 배치 피크 합계에 1년 Compute Savings Plans를 약정한다
      - id: saa-r2-Q24-58
        source_id: Q24-58
        type: mcq
        title: Q24-58 · 모의고사 B
        explain: |
          <p>RAM 상태를 보존하면서 실행을 멈춰야 하므로 일반 중지·AMI만으로는 부족하다. 지원되는 최대 절전은 RAM을 EBS에 보존하고 컴퓨팅 실행을 멈췄다가 재개하는 요구에 맞는다. 중지 상태의 저장 요금과 지원 OS·용량·기간 등 제약은 남으며 일반 종료와 구분해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>인스턴스를 계속 실행하고 야간 앱 프로세스만 일시 정지한다</td>
          <td>RAM은 남지만 EC2가 running 상태이므로 컴퓨팅 사용 요금을 계속 부담한다.</td>
          </tr>
          <tr>
          <td>야간에 종료하고 AMI에서 새 인스턴스를 시작한다</td>
          <td>AMI 재시작은 RAM 보존·복원이 아니므로 메모리 준비 시간을 줄이는 조건이 남는다.</td>
          </tr>
          <tr>
          <td>인스턴스를 일반 중지하고 재시작 때 RAM 상태는 새로 구성한다</td>
          <td>컴퓨팅 비용은 줄지만 메모리 상태 유지로 준비 시간을 단축하는 요구를 충족하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#%EC%A4%91%EC%A7%80%EC%B5%9C%EB%8C%80-%EC%A0%88%EC%A0%84%EC%A2%85%EB%A3%8C%EC%99%80-%EB%8D%B0%EC%9D%B4%ED%84%B0">지원되는 최대 절전은 RAM을 EBS에 보존하고 컴퓨팅 실행을 멈췄다가 재개하는 요구에 맞는다</a> · <a href="/study/lessons/deep-dive/day-02.html#%EC%A4%91%EC%A7%80%EC%B5%9C%EB%8C%80-%EC%A0%88%EC%A0%84%EC%A2%85%EB%A3%8C%EC%99%80-%EB%8D%B0%EC%9D%B4%ED%84%B0">중지 상태의 저장 요금과 지원 OS·용량·기간 등 제약은 남으며 일반 종료와 구분해야 한다</a></p>
        quizzes:
          - q: 개발팀은 퇴근 때 EC2를 멈추되 다음 날 메모리에 적재한 대형 작업 상태로 바로 이어가야 한다. OS·인스턴스와 EBS 루트 암호화 등
              최대 절전 지원은 확인했다. 야간 저장 요금은 감수하면서 컴퓨팅 실행 시간을 줄일 방법은?
            answer: 지원 조건을 확인해 최대 절전하고 RAM 저장 공간·재개 제약을 관리한다
            wrong:
              - 인스턴스를 계속 실행하고 야간 앱 프로세스만 일시 정지한다
              - 야간에 종료하고 AMI에서 새 인스턴스를 시작한다
              - 인스턴스를 일반 중지하고 재시작 때 RAM 상태는 새로 구성한다
      - id: saa-r2-Q24-59
        source_id: Q24-59
        type: mcq
        title: Q24-59 · 모의고사 B
        explain: |
          <p>회수 중단을 허용하지 않는 후보끼리 운영비를 포함한 총비용과 GPU 지원을 비교해야 한다. ECS의 CPU·GPU EC2 풀을 분리하면 요구 자원을 제공하면서 월 총비용은 900+150+800=1,850이다. CPU Fargate와 GPU EC2 조합은 2,300이다. 팀의 노드 운영 능력과 운영비를 이미 반영한 동등 용량 견적이므로 EC2 조합이 최소 비용이다. 웹 작업은 연속 가용성이 필요하므로 중단 가능한 Fargate Spot만으로 대체하는 보기는 맞지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>CPU와 GPU를 같은 GPU 지원 EC2 풀에서 실행한다</td>
          <td>두 작업은 지원하지만 제시된 총비용2600은 분리한 EC2풀1850보다 높다.</td>
          </tr>
          <tr>
          <td>CPU는 Fargate Spot, GPU는 GPU 지원 EC2 풀로 분리한다</td>
          <td>Fargate Spot은 중단 가능 용량이다. 연중 실행되는 웹 작업을 전부 이 용량에 두면 제시된 연속 가용성의 동등 비교 조건을 만족하지 않는다.</td>
          </tr>
          <tr>
          <td>CPU는 Fargate, GPU는 GPU 지원 EC2 capacity provider로 분리한다</td>
          <td>관리형 CPU 실행으로 운영 부담은 줄지만 제시된 총비용은 2,300으로 EC2 조합의 1,850보다 높다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-gpu.html">ECS GPU 작업과 Fargate 제약</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-capacity-providers.html">Fargate Spot 중단</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html">Fargate 작업 정의의 지원 범위</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">ECS의 CPU·GPU EC2 풀을 분리하면 요구 자원을 제공하면서 월 총비용은 900+150+800=1,850이다</a> · <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">CPU Fargate와 GPU EC2 조합은 2,300이다</a> · <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">팀의 노드 운영 능력과 운영비를 이미 반영한 동등 용량 견적이므로 EC2 조합이 최소 비용이다</a> · <a href="/study/lessons/deep-dive/day-14.html#ecs%EC%99%80-eks%EB%A5%BC-%EB%A8%BC%EC%A0%80-%EA%B3%A0%EB%A5%B4%EA%B3%A0-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EC%9D%84-%EB%B9%84%EA%B5%90%ED%95%9C%EB%8B%A4">웹 작업은 연속 가용성이 필요하므로 중단 가능한 Fargate Spot만으로 대체하는 보기는 맞지 않는다</a></p>
        quizzes:
          - q: ECS CPU 웹 작업과 NVIDIA GPU 추론을 연중 실행하며 용량 회수 중단은 허용하지 않는다. 팀은 노드를 운영할 수 있다. 동등
              가용성의 월 총비용은 CPU 약정 EC2 900+운영150, CPU Fargate 1500이며 별도 GPU
              EC2는800이다. 모두 GPU풀에 넣으면2600이다. 최소 비용 배치는?
            answer: CPU는 약정 EC2 풀, GPU는 GPU 지원 EC2 풀로 분리한다
            wrong:
              - CPU와 GPU를 같은 GPU 지원 EC2 풀에서 실행한다
              - CPU는 Fargate Spot, GPU는 GPU 지원 EC2 풀로 분리한다
              - CPU는 Fargate, GPU는 GPU 지원 EC2 capacity provider로 분리한다
      - id: saa-r2-Q24-60
        source_id: Q24-60
        type: mcq
        title: Q24-60 · 모의고사 B
        explain: |
          <p>짧은 stop/start가 엔드포인트를 유지하며 준비시간 안에 돌아오므로 실행시간만 중지해야 한다. 예약된 stop/start는 DB 데이터와 엔드포인트를 유지하면서 중지 기간의 DB 인스턴스 시간 요금을 줄인다. 08시 시작은 제시된 15분 재시작 시간에 여유를 주며 매 주말 중지는 7일 자동 재시작 한도 안이다. 스토리지와 보관 백업 등의 비용은 계속 발생한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>18시 스냅샷·DB삭제를 하고 다음 업무일08시에 새 DB 복원을 시작한다</td>
          <td>복원70분이면09시 준비를 넘기며 새 DB의 엔드포인트 전환도 필요하다. 데이터·엔드포인트 유지에 stop/start가 맞는다.</td>
          </tr>
          <tr>
          <td>DB를 작은 인스턴스로 변경하고 24시간 실행한다</td>
          <td>실행 중 사양 조정은 다른 절약 수단이지만 야간·주말에도 컴퓨팅 시간이 계속 청구되며 이미 주어진 유휴 시간을 제거하지 않는다.</td>
          </tr>
          <tr>
          <td>1년 Reserved DB Instance를 구매하고 현재 실행 일정을 유지한다</td>
          <td>할인은 가능하지만 24시간 약정 비용이 남는다. 일시 중지가 가능한 업무 시간 전용 개발 DB에는 유휴 실행 시간을 제거하는 것이 직접적이다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_StopInstance.html">RDS DB 인스턴스 임시 중지</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#%EC%A4%91%EC%A7%80%EC%99%80-%EC%B6%95%EC%86%8C%EC%9D%98-%EB%B9%84%EC%9A%A9-%EA%B2%BD%EA%B3%84">예약된 stop/start는 DB 데이터와 엔드포인트를 유지하면서 중지 기간의 DB 인스턴스 시간 요금을 줄인다</a> · <a href="/study/lessons/deep-dive/day-07.html#%EC%A4%91%EC%A7%80%EC%99%80-%EC%B6%95%EC%86%8C%EC%9D%98-%EB%B9%84%EC%9A%A9-%EA%B2%BD%EA%B3%84">08시 시작은 제시된 15분 재시작 시간에 여유를 주며 매 주말 중지는 7일 자동 재시작 한도 안이다</a> · <a href="/study/lessons/deep-dive/day-07.html#%EC%A4%91%EC%A7%80%EC%99%80-%EC%B6%95%EC%86%8C%EC%9D%98-%EB%B9%84%EC%9A%A9-%EA%B2%BD%EA%B3%84">스토리지와 보관 백업 등의 비용은 계속 발생한다</a></p>
        quizzes:
          - q: 개발용 Single-AZ RDS PostgreSQL은 평일 09~18시에만 필요하다. stop/start와 데이터·엔드포인트 유지가
              가능하며 시험 재시작15분, 스냅샷복원70분이다. 중지기간은7일 미만이고 현재 크기는 낮 성능의 최소값이다. 저장비를
              감수하며 아침 준비와 야간 인스턴스 시간 절약을 맞출 구성은?
            answer: EventBridge Scheduler와 Lambda로 18시 중지·업무일 08시 시작을 예약한다
            wrong:
              - 18시 스냅샷·DB삭제를 하고 다음 업무일08시에 새 DB 복원을 시작한다
              - DB를 작은 인스턴스로 변경하고 24시간 실행한다
              - 1년 Reserved DB Instance를 구매하고 현재 실행 일정을 유지한다
      - id: saa-r2-Q24-61
        source_id: Q24-61
        type: mcq
        title: Q24-61 · 모의고사 B
        explain: |
          <p>테이블 총용량의 예약 확장과 한 기본 키의 쓰기 분산이 모두 필요하다. 예측 가능한 피크 전에 예약 확장하고 종료 후 줄이면 상시 6,000 WCU를 유지하지 않아도 된다. 동시에 한 batch_id에 몰린 쓰기는 기본 테이블 키를 여러 shard로 분산해야 한다. LSI가 있으면 같은 파티션 키의 항목 모음은 서로 다른 물리 파티션으로 분할되지 않는다. 한 물리 파티션의 쓰기 한도는 1,000 WCU이므로 테이블 총용량 조정만으로 충분하지 않다. 배치별 조회의 fan-out을 허용한 조건이 sharding을 가능하게 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>order_id를 파티션 키로 사용하는 GSI를 현재 테이블에 추가한다</td>
          <td>GSI의 키를 바꾸어도 기본 테이블의 batch_id 집중 쓰기는 남는다. 인덱스 저장·쓰기 비용도 더해진다.</td>
          </tr>
          <tr>
          <td>기본 테이블 WCU를 12,000으로 상시 설정한다</td>
          <td>테이블 총 WCU를 늘려도 기본 테이블의 집중 키가 여러 파티션으로 자동 균등 분산된다고 보장할 수 없으며 유휴 시간 비용도 크다.</td>
          </tr>
          <tr>
          <td>On-demand 모드로 바꾸어 테이블 요청 용량을 자동 관리한다</td>
          <td>요청 용량 관리는 쉬워지지만 같은 파티션 키의 집중 쓰기 한도를 없애지 못하며 제시된 견적에서도 최소 비용 조합이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html">DynamoDB 파티션 키 설계</a> · <a href="https://docs.aws.amazon.com/autoscaling/application/userguide/application-auto-scaling-scheduled-scaling.html">예약 확장</a> · <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html">쓰기 sharding</a> · <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/burst-adaptive-capacity.html">LSI와 adaptive capacity의 항목 모음 분할 제약</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#%ED%95%AD%EB%AA%A9-%ED%81%AC%EA%B8%B0%EC%99%80-%EC%B2%98%EB%A6%AC-%EC%9A%A9%EB%9F%89-%EA%B3%84%EC%82%B0">예측 가능한 피크 전에 예약 확장하고 종료 후 줄이면 상시 6,000 WCU를 유지하지 않아도 된다</a> · <a href="/study/lessons/deep-dive/day-08.html#hot-key%EC%99%80-lsi-item-collection">동시에 한 batch_id에 몰린 쓰기는 기본 테이블 키를 여러 shard로 분산해야 한다</a> · <a href="/study/lessons/deep-dive/day-08.html#hot-key%EC%99%80-lsi-item-collection">LSI가 있으면 같은 파티션 키의 항목 모음은 서로 다른 물리 파티션으로 분할되지 않는다</a> · <a href="/study/lessons/deep-dive/day-08.html#hot-key%EC%99%80-lsi-item-collection">한 물리 파티션의 쓰기 한도는 1,000 WCU이므로 테이블 총용량 조정만으로 충분하지 않다</a> · <a href="/study/lessons/deep-dive/day-08.html#hot-key%EC%99%80-lsi-item-collection">배치별 조회의 fan-out을 허용한 조건이 sharding을 가능하게 한다</a></p>
        quizzes:
          - q: 월말 배치의 DynamoDB 쓰기에는6,000 WCU가 필요하지만 그 외 사용은 적다. 현재 PK=batch_id로 한 배치가 한 키에
              몰리고 LSI를 유지해야 한다. 주어진 환경에서는 해당 키의 항목모음이 물리 파티션으로 분할되지 않는다. 새 키로
              이관·shard별 조회합치기는 가능하고 예약확장이 On-demand보다 싸다. 두 조치는?
            answer: 배치 전 예약 확장으로 최소6,000 WCU를 확보하고 종료 뒤 용량을 낮춘다
            wrong:
              - order_id를 파티션 키로 사용하는 GSI를 현재 테이블에 추가한다
              - 기본 테이블 WCU를 12,000으로 상시 설정한다
              - On-demand 모드로 바꾸어 테이블 요청 용량을 자동 관리한다
            answers:
              - 배치 전 예약 확장으로 최소6,000 WCU를 확보하고 종료 뒤 용량을 낮춘다
              - 기본 PK를 batch_id와 shard번호의 조합으로 바꾸고 조회결과를 합친다
            options:
              - order_id를 파티션 키로 사용하는 GSI를 현재 테이블에 추가한다
              - 기본 테이블 WCU를 12,000으로 상시 설정한다
              - 배치 전 예약 확장으로 최소6,000 WCU를 확보하고 종료 뒤 용량을 낮춘다
              - 기본 PK를 batch_id와 shard번호의 조합으로 바꾸고 조회결과를 합친다
              - On-demand 모드로 바꾸어 테이블 요청 용량을 자동 관리한다
      - id: saa-r2-Q24-62
        source_id: Q24-62
        type: mcq
        title: Q24-62 · 모의고사 B
        explain: |
          <p>스키마·코드를 먼저 변환하고 긴 전체적재를 온라인으로 끝낸 뒤 최종증분만 쓰기중단 구간에 처리해야 한다. 스키마와 수동 코드 변환을 먼저 시험한 뒤 DMS 전체 적재를 온라인으로 수행하고 CDC로 이후 변경을 따라잡는다. 제시된 2분 추격과 3분 검증·접속 전환을 최종 쓰기 중지 구간에 배치하면 8시간 전체 복사를 중단 시간 밖으로 옮길 수 있다. CDC 지원과 로그 설정 가능 여부는 지문에서 명시했다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>스키마·프로시저를 변환·시험하고 쓰기를 멈춘다. DMS 전체 적재를 실행한 뒤 검증·전환한다</td>
          <td>전체 적재 8시간 동안 쓰기를 중지하면 최대 10분의 전환 중단 조건을 넘는다.</td>
          </tr>
          <tr>
          <td>스키마를 변환하고 정기 전체CSV를 적재한 뒤 마지막 전체CSV 적재 때 쓰기를 멈춘다</td>
          <td>최종 단계에8시간 규모의 전체전송이 남아10분 중단목표를 맞추지 못한다.</td>
          </tr>
          <tr>
          <td>PostgreSQL에서 Oracle 호환 앱 계층을 구현하고 API 호출을 양 DB에 이중 기록한다. 새 기능부터 점진 전환한다</td>
          <td>점진적인 이중 기록은 가능한 앱 재설계이지만 두 DB의 원자성·재처리·호환 API를 직접 구현해야 한다. 지원되는 DMS CDC 경로보다 이관 운영·개발 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_GettingStarted.html">DMS 스키마 변환과 복제 단계</a> · <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.Creating.html">DMS 작업과 CDC</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%ED%8C%8C%EC%9D%BC-%EC%A0%91%EC%86%8D-%EA%B3%84%EC%B8%B5%EA%B3%BC-db-%EB%B3%80%EA%B2%BD-%EB%B3%B5%EC%A0%9C%EB%A5%BC-%EA%B5%AC%EB%B3%84%ED%95%9C%EB%8B%A4">스키마와 수동 코드 변환을 먼저 시험한 뒤 DMS 전체 적재를 온라인으로 수행하고 CDC로 이후 변경을 따라잡는다</a> · <a href="/study/lessons/deep-dive/day-13.html#%ED%8C%8C%EC%9D%BC-%EC%A0%91%EC%86%8D-%EA%B3%84%EC%B8%B5%EA%B3%BC-db-%EB%B3%80%EA%B2%BD-%EB%B3%B5%EC%A0%9C%EB%A5%BC-%EA%B5%AC%EB%B3%84%ED%95%9C%EB%8B%A4">제시된 2분 추격과 3분 검증·접속 전환을 최종 쓰기 중지 구간에 배치하면 8시간 전체 복사를 중단 시간 밖으로 옮길 수 있다</a> · <a href="/study/lessons/deep-dive/day-13.html#%ED%8C%8C%EC%9D%BC-%EC%A0%91%EC%86%8D-%EA%B3%84%EC%B8%B5%EA%B3%BC-db-%EB%B3%80%EA%B2%BD-%EB%B3%B5%EC%A0%9C%EB%A5%BC-%EA%B5%AC%EB%B3%84%ED%95%9C%EB%8B%A4">CDC 지원과 로그 설정 가능 여부는 지문에서 명시했다</a></p>
        quizzes:
          - q: Oracle에서 RDS PostgreSQL로 이관해 라이선스를 줄인다. DMS 전체적재·CDC 지원과 로그설정은 확인했다. 전체적재8시간,
              변경추격2분, 검증·전환3분이며 쓰기중단은10분 이내다. 저장프로시저는 수동변환이 필요하다. 앱 재설계를 줄이면서
              기한을 맞출 순서는?
            answer: 스키마·프로시저 시험 → 온라인 전체적재·CDC → 쓰기중지·최종반영·검증·전환
            wrong:
              - 스키마·프로시저를 변환·시험하고 쓰기를 멈춘다. DMS 전체 적재를 실행한 뒤 검증·전환한다
              - 스키마를 변환하고 정기 전체CSV를 적재한 뒤 마지막 전체CSV 적재 때 쓰기를 멈춘다
              - PostgreSQL에서 Oracle 호환 앱 계층을 구현하고 API 호출을 양 DB에 이중 기록한다. 새 기능부터
                점진 전환한다
      - id: saa-r2-Q24-63
        source_id: Q24-63
        type: mcq
        title: Q24-63 · 모의고사 B
        explain: |
          <p>S3만 비용 없는 Gateway Endpoint 경로로 나누고 일반인터넷 출구는 유지해야 한다. 같은 리전 S3 대량 전송은 추가 엔드포인트 요금이 없는 Gateway Endpoint로 NAT 경유를 줄일 수 있다. 일반 인터넷 API는 별도 NAT 경로를 유지하며 역할·버킷·엔드포인트 정책은 계속 평가한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 Gateway Endpoint를 연결하고 모든0.0.0.0/0 인터넷 경로를 제거한다</td>
          <td>S3는 연결되지만 일반 외부 API의 인터넷 경로도 사라져 계속호출 요구를 어긴다.</td>
          </tr>
          <tr>
          <td>S3 Interface Endpoint를 모든 AZ에 추가하고 기존 인터넷 경로는 유지한다</td>
          <td>동일 VPC·리전 S3에는 추가 엔드포인트 요금 없는 Gateway 방식이 적합하며 별도 Interface 필요 조건이 없다.</td>
          </tr>
          <tr>
          <td>NAT 두 개를 하나로 합치고 S3·외부API 트래픽을 모두 그 NAT로 보낸다</td>
          <td>NAT 고정비는 줄 수 있지만 대량 S3의 처리비용을 제거하지 못하고 AZ 장애 의존성을 늘린다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html">추가 공식 기능 근거</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#gateway-endpoint%EB%8A%94-%EC%84%9C%EB%B9%84%EC%8A%A4%EB%B3%84-%EA%B2%BD%EB%A1%9C%EB%8B%A4">같은 리전 S3 대량 전송은 추가 엔드포인트 요금이 없는 Gateway Endpoint로 NAT 경유를 줄일 수 있다</a> · <a href="/study/lessons/deep-dive/day-05.html#gateway-endpoint%EB%8A%94-%EC%84%9C%EB%B9%84%EC%8A%A4%EB%B3%84-%EA%B2%BD%EB%A1%9C%EB%8B%A4">일반 인터넷 API는 별도 NAT 경로를 유지하며 역할·버킷·엔드포인트 정책은 계속 평가한다</a></p>
        quizzes:
          - q: 두 AZ 프라이빗 앱이 같은 리전 S3에 대량업로드하고 외부 API도 소량호출한다. 현재 모두 NAT를 통과한다. 앱·버킷 권한은 유지하며
              NAT 처리비용을 줄이고 외부 API도 계속 사용할 최소고정비 구성은?
            answer: S3 Gateway Endpoint를 필요한 라우트 테이블에 연결하고 외부 API의 NAT 경로는 유지한다
            wrong:
              - S3 Gateway Endpoint를 연결하고 모든0.0.0.0/0 인터넷 경로를 제거한다
              - S3 Interface Endpoint를 모든 AZ에 추가하고 기존 인터넷 경로는 유지한다
              - NAT 두 개를 하나로 합치고 S3·외부API 트래픽을 모두 그 NAT로 보낸다
      - id: saa-r2-Q24-64
        source_id: Q24-64
        type: mcq
        title: Q24-64 · 모의고사 B
        explain: |
          <p>두 VPC 사이 직접 연결만 필요하고 주소가 겹치지 않으며 동등 견적에서 피어링이 낮으므로 피어링으로 전환한다. 연결을 만든 뒤 양방향 경로와 보안 규칙을 검증하고 트래픽을 옮긴 다음 불필요한 TGW 연결을 제거해야 기존 통신과 비용 절감을 함께 만족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>TGW를 유지하고 네트워크 트래픽을 같은두 VPC 사이에서 압축해 전송한다</td>
          <td>압축은 일부 전송량을 줄일 수 있지만 없는 허브요구 때문에 연결비용을 계속 지불한다. 제시한 동등조건 견적에서는 피어링이 낮다.</td>
          </tr>
          <tr>
          <td>각 VPC에 VPN 어플라이언스를 배포해 사설 터널을 직접 운영한다</td>
          <td>구현 가능해도 두 VPC 직접 연결에 불필요한 서버·터널 운영 책임을 더한다.</td>
          </tr>
          <tr>
          <td>두 VPC의 NAT에 고정IP를 붙여 공개인터넷 VPN을 구성한다</td>
          <td>구현과암호화는 가능하지만 VPN장비·인터넷경로·운영이 추가되며 제시된 직접 피어링보다 단순하거나 저렴하지 않다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/peering/invalid-peering-configurations.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#%EC%84%9C%EB%B9%84%EC%8A%A4%EB%A7%8C-%EC%97%B0%EA%B2%B0%ED%95%98%EB%8A%94-privatelink">비전이 직접 연결에는 피어링과 필요한 양방향 경로·보안 설정을 비교한다</a></p>
        quizzes:
          - q: 두 VPC는 CIDR가 다르고 직접 통신만 필요하다. 향후 전이 라우팅·지사연결 계획은 없다. 팀의 동등조건 견적에서 현재 TGW보다
              피어링의 총비용이 낮고 VPN어플라이언스는 운영비가 크다. 통신을 유지하면서 비용을 줄일 변경은?
            answer: 피어링의 양방향 경로·보안 규칙을 검증해 트래픽을 옮긴 뒤 불필요한 TGW 연결을 제거한다
            wrong:
              - TGW를 유지하고 네트워크 트래픽을 같은두 VPC 사이에서 압축해 전송한다
              - 각 VPC에 VPN 어플라이언스를 배포해 사설 터널을 직접 운영한다
              - 두 VPC의 NAT에 고정IP를 붙여 공개인터넷 VPN을 구성한다
      - id: saa-r2-Q24-65
        source_id: Q24-65
        type: mcq
        title: Q24-65 · 모의고사 B
        explain: |
          <p>응답을 바꾸는 언어는 키에 남기고 응답과 무관한 추적값은 제외해야 한다. 같은 언어 콘텐츠는 재사용하고 실제 응답 차이가 없는 추적 값은 키에서 제거하면 적중률을 높일 수 있다. 언어 구분까지 없애면 다른 언어 응답을 재사용할 수 있으므로 정확성 조건을 함께 지켜야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>캐시를 비활성화하고 원본 서버의 수평 확장만 사용한다</td>
          <td>정적 콘텐츠의 재사용 기회를 없애 전송·원본 비용을 줄이는 요구에 불리하다.</td>
          </tr>
          <tr>
          <td>언어 값도 제외해 모든 요청을 동일 캐시 키로 모은다</td>
          <td>응답을 바꾸는 언어 차이가 사라져 잘못된 언어 콘텐츠를 재사용할 수 있다.</td>
          </tr>
          <tr>
          <td>모든쿠키를 캐시키에 유지하고 TTL만 길게 설정한다</td>
          <td>개별추적값마다 별도사본을 만드는 캐시분할이 남는다. TTL만 늘려도 같은언어 응답의 재사용 범위가 합쳐지지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EC%BA%90%EC%8B%9C-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%9B%90%EB%B3%B8-%EC%A0%84%EB%8B%AC-%EC%A0%95%EC%B1%85">같은 언어 콘텐츠는 재사용하고 실제 응답 차이가 없는 추적 값은 키에서 제거하면 적중률을 높일 수 있다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EC%BA%90%EC%8B%9C-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%9B%90%EB%B3%B8-%EC%A0%84%EB%8B%AC-%EC%A0%95%EC%B1%85">언어 구분까지 없애면 다른 언어 응답을 재사용할 수 있으므로 정확성 조건을 함께 지켜야 한다</a></p>
        quizzes:
          - q: 강의 소개 페이지는 언어마다 다르지만 같은 언어에서는 방문자·추적쿠키와 무관하게 동일하다. CloudFront는 모든쿠키를 캐시키에 넣어
              원본요청이 많다. 언어정확성을 유지하면서 캐시재사용·원본비용을 개선할 정책은?
            answer: 언어 구분은 캐시 키에 남기고 불필요한 추적 값은 제외한다
            wrong:
              - 캐시를 비활성화하고 원본 서버의 수평 확장만 사용한다
              - 언어 값도 제외해 모든 요청을 동일 캐시 키로 모은다
              - 모든쿠키를 캐시키에 유지하고 TTL만 길게 설정한다
