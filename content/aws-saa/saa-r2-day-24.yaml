id: saa-r2-day-24
name: 모의고사 B
part: 24일 차
color: "#13a87b"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: saa-r2-Q24-01
        source_id: Q24-01
        type: mcq
        title: Q24-01 · 모의고사 B
        explain: |
          <p>외부 신원은 유지하면서 고객 계정의 한 접두사만 임시 권한으로 읽고 중앙에서 회수해야 한다. 장기 키 배포 없이 다른 계정의 허용된 신원이 제한된 역할을 맡게 해야 한다. 대상 역할의 신뢰와 호출자 측 AssumeRole 허용을 구성하고 역할 권한은 필요한 객체 접두사로 한정한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>매일 고객 계정의 키를 갱신해 분석 서버의 비밀 저장소에 전달한다</td>
          <td>보관을 안전하게 해도 고객 장기 키를 외부에 배포·교체하는 구조가 남는다.</td>
          </tr>
          <tr>
          <td>고객 계정에 분석가별 IAM 사용자를 만들고 액세스 키를 발급한다</td>
          <td>사용자별 추적은 가능하지만 고객 계정 장기 키를 배포하지 않는 조건을 위반한다.</td>
          </tr>
          <tr>
          <td>원장 사본을 외부 계정 버킷에 매일 복제하고 그 버킷에서 직원 권한을 관리한다</td>
          <td>사본을 외부 계정에 넘기면 계약 종료 시 고객 계정의 권한 회수만으로 이미 전달한 사본 접근을 통제할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#assumerole%EA%B3%BC-%EB%91%90-%EB%B2%88%EC%9D%98-%EA%B6%8C%ED%95%9C-%ED%8C%90%EB%8B%A8">교차 계정 역할 전환에는 호출자 AssumeRole 허용과 대상 신뢰가 필요하고 객체 권한은 맡은 역할에서 따로 평가한다</a> · <a href="/study/lessons/exam-supplement/day-24.html#%EC%99%B8%EB%B6%80-%EA%B3%84%EC%A0%95%EC%9D%98-%EC%82%AC%EB%B3%B8%EA%B3%BC-%EC%A0%91%EA%B7%BC-%ED%9A%8C%EC%88%98">원본 접근 회수는 이미 외부 계정에 전달한 사본을 자동 삭제하지 않는다</a></p>
        quizzes:
          - q: 회계법인의 직원은 자사 AWS 계정에 연동 로그인한다. 고객사는 자기 계정의 원장 버킷 중 audit/만 읽게 하고, 계약 종료 시 한곳의
              설정으로 신규 접근을 차단하려 한다. 고객 계정의 사람별 장기 키를 발급하지 않고 운영을 줄일 구성은?
            answer: 고객 계정에 읽기 역할을 만들고 외부 신원에 역할 전환을 허용한다
            wrong:
              - 매일 고객 계정의 키를 갱신해 분석 서버의 비밀 저장소에 전달한다
              - 고객 계정에 분석가별 IAM 사용자를 만들고 액세스 키를 발급한다
              - 원장 사본을 외부 계정 버킷에 매일 복제하고 그 버킷에서 직원 권한을 관리한다
      - id: saa-r2-Q24-02
        source_id: Q24-02
        type: mcq
        title: Q24-02 · 모의고사 B
        explain: |
          <p>주체·리소스 태그 값이 일치해야 하며 권한 판단용 태그의 위조도 막아야 한다. 신원과 리소스의 속성을 정책 조건으로 비교하는 ABAC가 잦은 프로젝트 변경에 적합하다. 다만 사용자가 태그를 임의 수정해 권한을 넓히지 못하도록 태그 변경 권한도 제한해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>프로젝트별 역할에 개별 리소스 ARN을 나열하고 인사 이동마다 갱신한다</td>
          <td>접근 제한은 가능하지만 잦은 이동과 수백 개 자원의 ARN 목록 관리 부담을 줄이지 못한다.</td>
          </tr>
          <tr>
          <td>리소스의 Project 태그 존재만 조건으로 허용하고 생성 태그 값을 자유롭게 둔다</td>
          <td>태그가 있다는 사실만으로 프로젝트 소속은 확인되지 않는다. 생성 시 다른 프로젝트 값으로 태깅하는 우회도 남는다.</td>
          </tr>
          <tr>
          <td>리소스 태그만 확인하는 조건을 쓰고 연구원에게 태그 변경을 허용한다</td>
          <td>태그 임의 변경으로 다른 프로젝트 자원에 접근할 여지가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">신원과 리소스의 속성을 정책 조건으로 비교하는 ABAC가 잦은 프로젝트 변경에 적합하다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">다만 사용자가 태그를 임의 수정해 권한을 넓히지 못하도록 태그 변경 권한도 제한해야 한다</a></p>
        quizzes:
          - q: 수백 개 프로젝트를 운영하는 연구소는 담당자가 이동할 때 리소스 ARN을 나열한 정책을 계속 수정하고 있다. 지원 리소스에는 Project
              태그가 있으며 연구원은 다른 프로젝트 태그로 자원을 만들거나 변경해서는 안 된다. 정책 수를 줄이면서 프로젝트 격리를
              유지할 설계는?
            answer: 신원·리소스 태그 조건과 태그 변경 권한을 통제한다
            wrong:
              - 프로젝트별 역할에 개별 리소스 ARN을 나열하고 인사 이동마다 갱신한다
              - 리소스의 Project 태그 존재만 조건으로 허용하고 생성 태그 값을 자유롭게 둔다
              - 리소스 태그만 확인하는 조건을 쓰고 연구원에게 태그 변경을 허용한다
      - id: saa-r2-Q24-03
        source_id: Q24-03
        type: mcq
        title: Q24-03 · 모의고사 B
        explain: |
          <p>실패 지점은 S3 호출이 아니라 교차 계정 STS 세션 발급이며 호출자 허용과 대상 신뢰가 모두 필요하다. 교차 계정 역할 전환에는 호출자의 대상 역할 호출 권한과 대상 역할의 신뢰가 함께 필요하다. 객체 읽기 권한은 역할 전환이 성공한 뒤 별도로 확인할 다음 경계다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>대상 역할의 권한 정책에 필요한 s3:GetObject를 허용</td>
          <td>역할을 맡은 뒤 객체 읽기에 필요한 권한이며 역할 전환 경계의 두 필수 허용과 다르다.</td>
          </tr>
          <tr>
          <td>운영 버킷 정책에서 Deploy 역할의 s3:GetObject를 직접 허용한다</td>
          <td>직접 객체 읽기는 별도 접근 방식이다. 버킷 정책을 바꾸어도 대상 Audit 역할을 맡는 STS 요청이 허용되지는 않는다.</td>
          </tr>
          <tr>
          <td>호출자에 대상 KMS 키의 kms:Decrypt를 허용</td>
          <td>KMS 권한은 암호문 접근에 필요할 수 있지만 STS 역할 전환을 허용하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html">추가 공식 근거</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#assumerole%EA%B3%BC-%EB%91%90-%EB%B2%88%EC%9D%98-%EA%B6%8C%ED%95%9C-%ED%8C%90%EB%8B%A8">교차 계정 역할 전환에는 호출자 AssumeRole 허용과 대상 신뢰가 필요하고 객체 권한은 맡은 역할에서 따로 평가한다</a></p>
        quizzes:
          - q: 배포 계정의 Deploy 역할이 운영 계정의 Audit 역할로 sts:AssumeRole을 호출하면 AccessDenied가 발생한다.
              Audit 역할의 S3 권한은 이미 설정되어 있고 SCP·권한 경계·세션 정책의 거부는 없다. STS가 역할 세션을
              발급하도록 두 계정에서 각각 추가할 허용 두 가지는?
            answer: 호출자에게 대상 역할의 sts:AssumeRole 허용
            wrong:
              - 대상 역할의 권한 정책에 필요한 s3:GetObject를 허용
              - 운영 버킷 정책에서 Deploy 역할의 s3:GetObject를 직접 허용한다
              - 호출자에 대상 KMS 키의 kms:Decrypt를 허용
            answers:
              - 호출자에게 대상 역할의 sts:AssumeRole 허용
              - 대상 역할 신뢰 정책에 호출자를 허용
            options:
              - 대상 역할의 권한 정책에 필요한 s3:GetObject를 허용
              - 운영 버킷 정책에서 Deploy 역할의 s3:GetObject를 직접 허용한다
              - 호출자에 대상 KMS 키의 kms:Decrypt를 허용
              - 호출자에게 대상 역할의 sts:AssumeRole 허용
              - 대상 역할 신뢰 정책에 호출자를 허용
      - id: saa-r2-Q24-04
        source_id: Q24-04
        type: mcq
        title: Q24-04 · 모의고사 B
        explain: |
          <p>SCP의 명시적 거부는 멤버 계정 안의 IAM Allow나 권한 경계를 넓혀도 무효화되지 않는다. 승인된 업무에 필요한 역할·리전 범위만 조직 담당자가 검토하여 예외로 바꾸어야 한다. 다른 멤버 계정이나 새 관리자 역할도 같은 SCP가 적용되면 같은 제한을 받는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>같은 SCP가 적용되는 멤버 계정의 새 관리자 역할로 배포한다</td>
          <td>같은 조직 거부가 적용되는 역할을 새로 만들어도 요청의 거부 조건은 달라지지 않는다.</td>
          </tr>
          <tr>
          <td>다른 멤버 계정에 같은 역할을 만들고 동일한 OU 정책을 유지한다</td>
          <td>동일 SCP 적용 범위로 이동하면 동일한 리전 생성 통제가 남는다.</td>
          </tr>
          <tr>
          <td>역할의 권한 경계를 넓히고 기존 SCP를 유지한다</td>
          <td>경계 상향으로 조직의 명시적 거부를 넘을 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EC%A1%B0%EC%A7%81-%ED%86%B5%EC%A0%9C%EC%99%80-%EC%9A%94%EC%B2%AD-%EA%B2%BD%EB%A1%9C">SCP 명시적 거부를 IAM 관리자 Allow로 넘을 수 없어 해당 조직 거부를 좁게 변경해야 한다</a></p>
        quizzes:
          - q: 운영 OU의 SCP가 특정 리전의 EC2 생성을 명시적으로 거부한다. 멤버 계정의 배포 역할에는 AdministratorAccess가 있고
              권한 경계도 생성을 허용한다. 배포는 승인된 업무지만 조직 정책 변경은 별도 담당자 승인이 필요하다. 해당 리전에
              배포하려면 어떤 변경 승인을 요청해야 하는가?
            answer: 조직 정책 담당자에게 필요한 역할·리전 범위의 SCP 거부 예외를 요청한다
            wrong:
              - 같은 SCP가 적용되는 멤버 계정의 새 관리자 역할로 배포한다
              - 다른 멤버 계정에 같은 역할을 만들고 동일한 OU 정책을 유지한다
              - 역할의 권한 경계를 넓히고 기존 SCP를 유지한다
      - id: saa-r2-Q24-05
        source_id: Q24-05
        type: mcq
        title: Q24-05 · 모의고사 B
        explain: |
          <p>생성 역할의 권한 상한을 강제하고 개발자가 그 상한을 제거하거나 다른 경계로 바꾸지 못하게 해야 한다. 역할 생성 업무는 허용하면서 부여 가능한 신원 권한의 상한을 제한하려면 권한 경계를 강제한다. 경계 자체를 빼거나 바꾸지 못하도록 생성 조건과 관리 권한도 함께 제한해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>생성 역할의 신뢰를 개발 계정으로 제한하고 작업 권한은 자유롭게 둔다</td>
          <td>누가 역할을 맡는지는 제한하지만 맡은 역할의 작업 권한 상승은 막지 못한다.</td>
          </tr>
          <tr>
          <td>모든 역할 생성 뒤 Config 비준수를 탐지해 사후 알린다</td>
          <td>탐지·알림만으로 승인 범위를 넘는 역할의 생성을 사전에 막지 못한다.</td>
          </tr>
          <tr>
          <td>개발자의 신원 정책에 승인 서비스만 허용하고 생성 역할에는 관리자 정책 연결을 허용한다</td>
          <td>개발자 자신의 권한과 생성 역할이 맡은 뒤 사용할 권한은 다르다. 생성 역할에 경계를 강제하지 않으면 관리자 정책으로 상한을 넘을 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">역할 생성 업무는 허용하면서 부여 가능한 신원 권한의 상한을 제한하려면 권한 경계를 강제한다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EA%B6%8C%ED%95%9C-%EA%B2%BD%EA%B3%84%EC%99%80-abac%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C">경계 자체를 빼거나 바꾸지 못하도록 생성 조건과 관리 권한도 함께 제한해야 한다</a></p>
        quizzes:
          - q: 플랫폼 팀은 개발자가 배포 역할을 만들고 관리형 정책을 연결하게 하려 한다. 관리자 정책이 잘못 연결되어도 생성 역할은 승인 서비스만
              사용할 수 있어야 한다. 배포를 사후 취소하는 대신 권한 상승을 요청 시점에 막는 최소 변경은?
            answer: 생성 역할에 지정한 권한 경계를 요구하고 경계 변경 권한을 제한한다
            wrong:
              - 생성 역할의 신뢰를 개발 계정으로 제한하고 작업 권한은 자유롭게 둔다
              - 모든 역할 생성 뒤 Config 비준수를 탐지해 사후 알린다
              - 개발자의 신원 정책에 승인 서비스만 허용하고 생성 역할에는 관리자 정책 연결을 허용한다
      - id: saa-r2-Q24-06
        source_id: Q24-06
        type: mcq
        title: Q24-06 · 모의고사 B
        explain: |
          <p>외부 디렉터리 신원과 여러 계정의 권한 배정을 중앙 관리해 계정별 반복 설정을 줄여야 한다. 직원의 다중 계정 접근과 중앙 신원 수명 주기를 함께 관리해야 하므로 Identity Center와 외부 신원 공급자 연동이 적합하다. 권한 세트와 그룹 배정으로 계정별 업무 권한을 구분한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>외부 디렉터리 인사 목록으로 각 계정 IAM 사용자를 동기화한다</td>
          <td>계정별 IAM 사용자·자격 증명 관리가 남아 중앙 페더레이션보다 운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>각 AWS 계정에 SAML 공급자와 부서별 역할을 만들고 신뢰·정책을 개별 관리한다</td>
          <td>계정별 SAML 연동도 가능하지만 여러 계정의 반복 설정과 수명 주기 운영을 줄인다는 요구에는 중앙 권한 세트 배정이 더 적합하다.</td>
          </tr>
          <tr>
          <td>Organizations OU마다 동일한 IAM 그룹을 수동 구성한다</td>
          <td>OU는 계정 묶음이며 계정별 사용자·자격 증명 수명 주기를 자동 통합하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EC%A7%81%EC%9B%90-%EC%A0%91%EA%B7%BC%EA%B3%BC-%EC%99%B8%EB%B6%80-%EA%B3%B5%EA%B8%89%EC%97%85%EC%B2%B4-%EC%9C%84%EC%9E%84">직원의 다중 계정 접근과 중앙 신원 수명 주기를 함께 관리해야 하므로 Identity Center와 외부 신원 공급자 연동이 적합하다</a> · <a href="/study/lessons/deep-dive/day-11.html#%ED%9A%8C%EC%9B%90-%EC%9D%B8%EC%A6%9Daws-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85%EC%A7%81%EC%9B%90-%EB%94%94%EB%A0%89%ED%84%B0%EB%A6%AC">권한 세트와 그룹 배정으로 계정별 업무 권한을 구분한다</a></p>
        quizzes:
          - q: 회사는 인사 디렉터리의 그룹으로 직원의 부서를 관리한다. 직원은 20개 AWS 계정에서 부서별 역할을 사용하며 퇴사하면 디렉터리 비활성화에
              따라 신규 로그인도 차단되어야 한다. 계정별 사용자 수명 주기와 SAML 설정을 각각 운영하지 않으려면 어떤 구성이
              적합한가?
            answer: IAM Identity Center를 외부 신원 공급자와 연동하고 그룹별 권한 세트를 배정한다
            wrong:
              - 외부 디렉터리 인사 목록으로 각 계정 IAM 사용자를 동기화한다
              - 각 AWS 계정에 SAML 공급자와 부서별 역할을 만들고 신뢰·정책을 개별 관리한다
              - Organizations OU마다 동일한 IAM 그룹을 수동 구성한다
      - id: saa-r2-Q24-07
        source_id: Q24-07
        type: mcq
        title: Q24-07 · 모의고사 B
        explain: |
          <p>S3 요청은 새 엔드포인트를 거치지만 버킷은 이전 ID만 허용하므로 허용 경로를 새 ID로 바꾸어야 한다. SSE-KMS 읽기에는 해당 키 Decrypt도 필요하다. 키 정책이 계정 IAM에 위임한 조건에서 역할에 정확한 키 사용 권한을 추가하면 두 평가 지점을 최소 범위로 해결한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버킷의 허용 엔드포인트 ID를 갱신하고 역할에 해당 키의 DescribeKey만 허용한다</td>
          <td>DescribeKey는 키 메타데이터 조회이며 암호화 객체의 복호화를 허용하지 않는다. 경로를 고쳐도 KMS 권한 부족이 남는다.</td>
          </tr>
          <tr>
          <td>역할에 S3FullAccess와 해당 키의 Decrypt를 추가하고 버킷 조건은 유지한다</td>
          <td>S3 Allow를 늘려도 버킷의 이전 엔드포인트 조건에 의한 명시적 거부는 남는다. 필요한 키 권한만으로도 S3 경로 거부는 해결되지 않는다.</td>
          </tr>
          <tr>
          <td>버킷의 엔드포인트 조건 거부를 삭제하고 역할에 해당 키의 Decrypt를 허용한다</td>
          <td>읽기는 가능해질 수 있지만 지정된 사설 엔드포인트 외의 접근도 허용할 수 있어 새 사설 경로만 쓰는 최소 권한 조건을 약화시킨다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html">IAM의 명시적 거부와 정책 평가</a>
          SAA 평가 항목: 1.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-01.html#%EC%A1%B0%EC%A7%81-%ED%86%B5%EC%A0%9C%EC%99%80-%EC%9A%94%EC%B2%AD-%EA%B2%BD%EB%A1%9C">버킷의 SourceVpce 거부 조건은 새 요청 엔드포인트와 일치해야 한다</a> · <a href="/study/lessons/deep-dive/day-01.html#%EC%A1%B0%EC%A7%81-%ED%86%B5%EC%A0%9C%EC%99%80-%EC%9A%94%EC%B2%AD-%EA%B2%BD%EB%A1%9C">SSE-KMS 객체 읽기는 S3 허용과 별도로 해당 키 복호화 권한이 필요하다</a></p>
        quizzes:
          - q: 앱이 S3 Gateway Endpoint를 교체한 뒤 SSE-KMS 객체 읽기가 실패한다. IAM의 GetObject와 새 엔드포인트
              정책은 허용한다. 버킷은 이전 aws:SourceVpce 값 외의 읽기를 거부한다. 키 정책은 이 계정 IAM에 사용을
              위임하지만 앱 역할에는 KMS 허용이 없다. 새 사설 경로만 쓰며 최소 권한으로 고칠 구성은?
            answer: 버킷의 허용 엔드포인트 ID를 갱신하고 역할에 해당 키의 Decrypt를 허용한다
            wrong:
              - 버킷의 허용 엔드포인트 ID를 갱신하고 역할에 해당 키의 DescribeKey만 허용한다
              - 역할에 S3FullAccess와 해당 키의 Decrypt를 추가하고 버킷 조건은 유지한다
              - 버킷의 엔드포인트 조건 거부를 삭제하고 역할에 해당 키의 Decrypt를 허용한다
      - id: saa-r2-Q24-08
        source_id: Q24-08
        type: mcq
        title: Q24-08 · 모의고사 B
        explain: |
          <p>파일 URL을 바꾸지 않고 여러 객체에 기간 제한을 적용하면서 CloudFront만 S3 원본을 읽게 해야 한다. 원본 우회 차단은 OAC와 S3 버킷 정책이, 구매자의 시간 제한 접근은 CloudFront 서명이 담당한다. 여러 파일에 같은 접근 조건을 적용하는 요구에는 서명 쿠키를 사용할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버킷 정책에 구매자별 IAM 역할을 허용하고 S3에서 직접 읽게 한다</td>
          <td>S3 직접 읽기를 열면 지정된 CloudFront 경로를 우회할 수 있어 원본 접근 제한 요구와 맞지 않는다.</td>
          </tr>
          <tr>
          <td>파일마다 CloudFront 서명 URL을 만들어 기존 페이지의 모든 링크를 교체한다</td>
          <td>CloudFront 서명 URL도 유효한 접근 통제지만 여러 파일의 기존 URL을 바꾸기 어렵다는 조건에는 서명 쿠키가 맞는다. 이 보기에는 원본 보호도 포함되지 않는다.</td>
          </tr>
          <tr>
          <td>CloudFront의 캐시 키에 회원 ID만 추가</td>
          <td>캐시 구분은 서명 검증이나 구매자의 기간 제한 접근 허용이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html">CloudFront 서명 쿠키</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EA%B5%AC%EB%A7%A4%EC%9E%90-%EA%B6%8C%ED%95%9C%EA%B3%BC-s3-%EC%9B%90%EB%B3%B8-%EA%B6%8C%ED%95%9C">OAC와 배포를 제한한 버킷 정책 및 공개 접근 제거로 원본 우회를 막는다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EA%B5%AC%EB%A7%A4%EC%9E%90-%EA%B6%8C%ED%95%9C%EA%B3%BC-s3-%EC%9B%90%EB%B3%B8-%EA%B6%8C%ED%95%9C">여러 경로를 URL 변경 없이 기간 제한하려면 서명 쿠키를 쓸 수 있다</a></p>
        quizzes:
          - q: 구매자 한 명은 결제 후 30분 동안 같은 경로 아래 여러 설계 도면을 CloudFront에서 내려받는다. 기존 웹페이지의 개별 파일
              URL을 바꾸기 어렵고 S3 주소 직접 다운로드는 막아야 한다. 버킷은 비공개다. 원본 보호와 사용자별 기간 제한을
              충족할 두 구성은?
            answer: OAC와 배포를 제한한 S3 버킷 정책
            wrong:
              - 버킷 정책에 구매자별 IAM 역할을 허용하고 S3에서 직접 읽게 한다
              - 파일마다 CloudFront 서명 URL을 만들어 기존 페이지의 모든 링크를 교체한다
              - CloudFront의 캐시 키에 회원 ID만 추가
            answers:
              - OAC와 배포를 제한한 S3 버킷 정책
              - 구매 확인 뒤 발급하는 CloudFront 서명 쿠키
            options:
              - 버킷 정책에 구매자별 IAM 역할을 허용하고 S3에서 직접 읽게 한다
              - OAC와 배포를 제한한 S3 버킷 정책
              - 구매 확인 뒤 발급하는 CloudFront 서명 쿠키
              - 파일마다 CloudFront 서명 URL을 만들어 기존 페이지의 모든 링크를 교체한다
              - CloudFront의 캐시 키에 회원 ID만 추가
      - id: saa-r2-Q24-09
        source_id: Q24-09
        type: mcq
        title: Q24-09 · 모의고사 B
        explain: |
          <p>서비스의 기존 DNS 이름이 사설 엔드포인트로 해석되고 앱에서 엔드포인트의 HTTPS로 도달해야 한다. 인터넷 출구 없이 해당 API에 접근하려면 지원되는 PrivateLink Interface Endpoint를 사용한다. 프라이빗 DNS와 엔드포인트 SG 등 네트워크 조건이 맞아야 이미 부여한 IAM 권한으로 실제 요청을 보낼 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>전용 egress VPC의 NAT로 향하도록 Transit Gateway와 기본 경로를 구성한다</td>
          <td>중앙 egress도 서비스에 도달할 수 있지만 인터넷 출구 추가 금지 조건을 어긴다.</td>
          </tr>
          <tr>
          <td>Secrets Manager 인터페이스 엔드포인트를 만들고 프라이빗 DNS는 비활성화한다</td>
          <td>엔드포인트 전용 DNS로 앱을 변경한다면 가능하지만 기존 서비스 DNS 이름을 그대로 쓴다는 요구에는 프라이빗 DNS 구성이 필요하다.</td>
          </tr>
          <tr>
          <td>VPC Peering을 추가하고 상대 VPC NAT를 출구로 공유한다</td>
          <td>Peering 상대 NAT를 자신의 출구처럼 경유하는 연결은 지원되는 해결책이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/secretsmanager/latest/userguide/vpc-endpoint-overview.html">Secrets Manager VPC 엔드포인트</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#interface-endpoint%EC%97%90%EC%84%9C-dns%EC%99%80-eni%EB%A5%BC-%ED%95%A8%EA%BB%98-%ED%99%95%EC%9D%B8%ED%95%98%EA%B8%B0">인터넷 출구 없이 해당 API에 접근하려면 지원되는 PrivateLink Interface Endpoint를 사용한다</a> · <a href="/study/lessons/deep-dive/day-05.html#interface-endpoint%EC%97%90%EC%84%9C-dns%EC%99%80-eni%EB%A5%BC-%ED%95%A8%EA%BB%98-%ED%99%95%EC%9D%B8%ED%95%98%EA%B8%B0">프라이빗 DNS와 엔드포인트 SG 등 네트워크 조건이 맞아야 이미 부여한 IAM 권한으로 실제 요청을 보낼 수 있다</a></p>
        quizzes:
          - q: 프라이빗 서브넷의 앱은 Secrets Manager에서 비밀값을 읽는다. IAM 권한은 있고 DNS 해석도 켜져 있지만 NAT·인터넷
              게이트웨이 경로는 없다. 보안팀은 인터넷 출구를 추가할 수 없다고 했다. 기존 서비스 DNS 이름을 그대로 사용하는
              최소 관리 구성은?
            answer: Secrets Manager용 인터페이스 엔드포인트와 프라이빗 DNS·SG를 구성한다
            wrong:
              - 전용 egress VPC의 NAT로 향하도록 Transit Gateway와 기본 경로를 구성한다
              - Secrets Manager 인터페이스 엔드포인트를 만들고 프라이빗 DNS는 비활성화한다
              - VPC Peering을 추가하고 상대 VPC NAT를 출구로 공유한다
      - id: saa-r2-Q24-10
        source_id: Q24-10
        type: mcq
        title: Q24-10 · 모의고사 B
        explain: |
          <p>필요한 것은 소비자 로그인과 JWT 발급이며 단말용 임시 AWS 자격 증명은 필요하지 않다. 앱의 회원 디렉터리·외부 로그인·JWT 발급이 요구이므로 User pool이 적합하다. 앱이 AWS API를 직접 호출할 필요가 없다면 Identity pool을 통한 AWS 임시 자격 증명 발급은 필수가 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Identity pool과 외부 OIDC 제공자를 연결하고 자체 가입·JWT 발급 서버를 운영한다</td>
          <td>Identity pool은 외부 인증 결과를 AWS 임시 자격 증명으로 교환하는 데 쓰인다. 자체 가입·JWT 서버 운영이 남고 요구하지 않는 단말 AWS 권한까지 추가한다.</td>
          </tr>
          <tr>
          <td>IAM Identity Center를 모든 소비자 회원의 가입 디렉터리로 사용한다</td>
          <td>직원 다중 계정 접근 중심 서비스로 소비자 회원 가입·토큰 요구에는 User pool이 더 적합하다.</td>
          </tr>
          <tr>
          <td>회원 데이터베이스와 OIDC 검증·토큰 발급 서버를 자체 운영한다</td>
          <td>가능한 자체 구현이지만 관리형 회원 로그인 기능을 활용하는 대안보다 운영 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%ED%9A%8C%EC%9B%90-%EC%9D%B8%EC%A6%9Daws-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85%EC%A7%81%EC%9B%90-%EB%94%94%EB%A0%89%ED%84%B0%EB%A6%AC">앱의 회원 디렉터리·외부 로그인·JWT 발급이 요구이므로 User pool이 적합하다</a> · <a href="/study/lessons/deep-dive/day-11.html#%ED%9A%8C%EC%9B%90-%EC%9D%B8%EC%A6%9Daws-%EC%9E%90%EA%B2%A9-%EC%A6%9D%EB%AA%85%EC%A7%81%EC%9B%90-%EB%94%94%EB%A0%89%ED%84%B0%EB%A6%AC">앱이 AWS API를 직접 호출할 필요가 없다면 Identity pool을 통한 AWS 임시 자격 증명 발급은 필수가 아니다</a></p>
        quizzes:
          - q: 소비자 앱은 자체 가입과 외부 OIDC 로그인을 제공해야 한다. API 서버는 JWT를 검증한 뒤 자기 역할로 DB를 사용한다. 모바일
              단말이 AWS API를 직접 호출할 필요는 없고 자체 인증 서버 운영도 줄이려 한다. 가장 적합한 구성은?
            answer: Cognito User pool에서 로그인과 토큰 발급을 제공한다
            wrong:
              - Identity pool과 외부 OIDC 제공자를 연결하고 자체 가입·JWT 발급 서버를 운영한다
              - IAM Identity Center를 모든 소비자 회원의 가입 디렉터리로 사용한다
              - 회원 데이터베이스와 OIDC 검증·토큰 발급 서버를 자체 운영한다
      - id: saa-r2-Q24-11
        source_id: Q24-11
        type: mcq
        title: Q24-11 · 모의고사 B
        explain: |
          <p>요청의 HTTP 내용과 IP별 빈도를 함께 검사하되 변하는 공격 IP를 수동 목록으로 관리하지 않아야 한다. HTTP 내용과 요청 속도를 기준으로 ALB 앞에서 검사해야 하므로 WAF가 직접적인 통제다. 정상 요청의 오탐을 확인하며 규칙을 조정하고 앱의 입력 검증과 업무 권한 검사도 유지해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Shield Advanced만 구성하고 WAF 규칙은 별도로 두지 않는다</td>
          <td>DDoS 보호만으로 지정된 악성 HTTP 내용과 맞춤 속도 규칙을 구성한 것이 아니다.</td>
          </tr>
          <tr>
          <td>ALB 앞의 프록시 EC2에서 SQL 패턴과 IP별 호출 수를 검사한다</td>
          <td>프록시로 구현은 가능하지만 프록시 확장·패치·규칙 운영이 필요해 관리형 계층 요구에 WAF보다 불리하다.</td>
          </tr>
          <tr>
          <td>ALB 접근 로그를 Lambda로 분석해 공격 IP를 보안 그룹에서 차단한다</td>
          <td>사후 로그 분석은 최초 공격 요청의 내용을 ALB 입구에서 검사하지 않으며 IP 변경 때마다 차단 목록을 운영해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#waf-%EB%8B%A8%EC%9D%BC-%EA%B7%9C%EC%B9%99-%EC%98%88%EC%99%B8%EC%99%80-%EB%82%98%EB%A8%B8%EC%A7%80-%EB%B3%B4%ED%98%B8">HTTP 내용과 요청 속도를 기준으로 ALB 앞에서 검사해야 하므로 WAF가 직접적인 통제다</a> · <a href="/study/lessons/deep-dive/day-11.html#waf-%EB%8B%A8%EC%9D%BC-%EA%B7%9C%EC%B9%99-%EC%98%88%EC%99%B8%EC%99%80-%EB%82%98%EB%A8%B8%EC%A7%80-%EB%B3%B4%ED%98%B8">정상 요청의 오탐을 확인하며 규칙을 조정하고 앱의 입력 검증과 업무 권한 검사도 유지해야 한다</a></p>
        quizzes:
          - q: ALB 뒤 주문 API에서 SQL 인젝션과 한 IP의 반복 HTTP 호출이 발견된다. 정상 사용자의 HTTPS 접속은 유지해야 하고 공격
              IP는 자주 바뀐다. 앱 수정 전 관리형 계층에서 요청 내용과 호출 빈도를 함께 제한하는 가장 적절한 변경은?
            answer: ALB에 WAF 규칙과 적절한 속도 기반 규칙을 연결한다
            wrong:
              - Shield Advanced만 구성하고 WAF 규칙은 별도로 두지 않는다
              - ALB 앞의 프록시 EC2에서 SQL 패턴과 IP별 호출 수를 검사한다
              - ALB 접근 로그를 Lambda로 분석해 공격 IP를 보안 그룹에서 차단한다
      - id: saa-r2-Q24-12
        source_id: Q24-12
        type: mcq
        title: Q24-12 · 모의고사 B
        explain: |
          <p>서브넷 단위보다 좁게 앱 역할의 인스턴스를 식별하면서 IP 변경을 자동으로 따라가야 한다. 교체되는 앱 계층을 보안 그룹 참조로 식별하면 개별 IP를 유지하지 않고 필요한 DB 포트만 허용할 수 있다. 앱의 아웃바운드와 다른 경로·정책 조건도 연결을 허용해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>앱·관리·배치가 함께 있는 전체 서브넷 CIDR</td>
          <td>앱 이외 자원까지 DB 포트가 열려 필요한 앱 계층만 허용하는 조건보다 넓다.</td>
          </tr>
          <tr>
          <td>배포 파이프라인이 앱 IP /32를 DB 보안 그룹에 매번 등록·삭제한다</td>
          <td>IP 목록으로 통제할 수는 있지만 인스턴스 교체 때마다 DB 규칙을 고쳐야 하므로 운영 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>공개 ALB의 보안 그룹</td>
          <td>ALB가 앱을 거치지 않고 DB에 접속하는 구조가 아니므로 DB 연결 출발지와 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#sg-%EC%B0%B8%EC%A1%B0%EB%A1%9C-%EA%B3%84%EC%B8%B5%EC%9D%84-%EC%97%B0%EA%B2%B0%ED%95%98%EA%B8%B0">교체되는 앱 계층을 보안 그룹 참조로 식별하면 개별 IP를 유지하지 않고 필요한 DB 포트만 허용할 수 있다</a> · <a href="/study/lessons/deep-dive/day-05.html#sg-%EC%B0%B8%EC%A1%B0%EB%A1%9C-%EA%B3%84%EC%B8%B5%EC%9D%84-%EC%97%B0%EA%B2%B0%ED%95%98%EA%B8%B0">앱의 아웃바운드와 다른 경로·정책 조건도 연결을 허용해야 한다</a></p>
        quizzes:
          - q: 앱 계층과 DB는 같은 VPC에 있으며 앱은 Auto Scaling으로 교체된다. 앱과 운영 도구가 같은 서브넷에 있지만 DB 5432
              연결은 앱 인스턴스에서만 시작할 수 있어야 한다. DB 보안 그룹 규칙을 배포마다 고치지 않을 출발지 설정은?
            answer: 앱 인스턴스에 연결한 보안 그룹
            wrong:
              - 앱·관리·배치가 함께 있는 전체 서브넷 CIDR
              - 배포 파이프라인이 앱 IP /32를 DB 보안 그룹에 매번 등록·삭제한다
              - 공개 ALB의 보안 그룹
      - id: saa-r2-Q24-13
        source_id: Q24-13
        type: mcq
        title: Q24-13 · 모의고사 B
        explain: |
          <p>응답 패킷의 목적지는 클라이언트 임시 포트이며 NACL에는 반환 트래픽도 별도 허용해야 한다. NACL은 연결 상태를 추적하지 않으므로 서버 응답이 향하는 클라이언트의 임시 목적지 포트도 허용해야 한다. 응답의 목적지는 서버 리스너 포트가 아니라 클라이언트가 선택한 포트다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>NACL 아웃바운드에서 목적지 TCP 443만 허용한다</td>
          <td>응답은 클라이언트 임시 포트를 목적지로 하므로 서버 리스너 포트만 열면 막힌다.</td>
          </tr>
          <tr>
          <td>NACL 인바운드에 클라이언트 임시 목적지 포트만 추가한다</td>
          <td>현재 서버 응답이 나가는 방향의 목적지 허용이 필요하므로 방향이 잘못됐다.</td>
          </tr>
          <tr>
          <td>서버 보안 그룹의 아웃바운드 55000을 추가하고 NACL 규칙은 유지한다</td>
          <td>관찰된 차단은 NACL 경계에 있다. 상태 저장 SG가 요청 응답을 허용해도 별도 NACL 아웃바운드 거부는 해소되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#nacl%EC%97%90%EC%84%9C-%EC%9A%94%EC%B2%AD%EA%B3%BC-%EC%9D%91%EB%8B%B5%EC%9D%98-%EB%AA%A9%EC%A0%81%EC%A7%80-%ED%8F%AC%ED%8A%B8-%EC%B0%BE%EA%B8%B0">NACL은 연결 상태를 추적하지 않으므로 서버 응답이 향하는 클라이언트의 임시 목적지 포트도 허용해야 한다</a> · <a href="/study/lessons/deep-dive/day-04.html#%ED%8C%A8%ED%82%B7%EA%B3%BC-%EC%97%B0%EA%B2%B0%EC%9D%84-%EA%B5%AC%EB%B6%84%ED%95%B4-%EC%9D%BD%EA%B8%B0">응답의 목적지는 서버 리스너 포트가 아니라 클라이언트가 선택한 포트다</a></p>
        quizzes:
          - q: 새 NACL 적용 뒤 외부 클라이언트의 HTTPS 요청이 타임아웃된다. 서버 인바운드 443과 SG·라우팅은 정상이며 클라이언트는 소스
              포트 55000을 쓴다. 추적 결과 요청은 서버까지 도착하지만 응답이 서브넷 경계에서 버려진다. 필요한 최소 변경은?
            answer: 서브넷 NACL 아웃바운드에서 클라이언트 임시 목적지 포트 범위를 허용한다
            wrong:
              - NACL 아웃바운드에서 목적지 TCP 443만 허용한다
              - NACL 인바운드에 클라이언트 임시 목적지 포트만 추가한다
              - 서버 보안 그룹의 아웃바운드 55000을 추가하고 NACL 규칙은 유지한다
      - id: saa-r2-Q24-14
        source_id: Q24-14
        type: mcq
        title: Q24-14 · 모의고사 B
        explain: |
          <p>계정 공통 방화벽 정책 배포와 패키지 취약점 평가는 별도 기능이다. Firewall Manager는 여러 계정에 지원 보안 정책을 중앙 적용하고 Inspector는 지원 컴퓨팅·이미지의 취약점을 평가한다. 정책 배포와 취약점 발견은 역할이 다르므로 함께 구성한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Amazon GuardDuty</td>
          <td>활동 기반 위협 탐지이며 이미지의 알려진 패키지 취약점 평가와 WAF 정책 중앙 적용의 담당 서비스가 아니다.</td>
          </tr>
          <tr>
          <td>Security Hub CSPM에서 보안 결과와 제어 상태를 중앙 집계한다</td>
          <td>결과 집계는 유용하지만 WAF 정책을 조직 전체에 직접 배포하거나 EC2·ECR 취약점 스캔 원천을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>AWS Config</td>
          <td>구성 준수를 평가할 수 있지만 패키지 취약점 평가 엔진과 중앙 WAF 정책 적용을 대체하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html">추가 공식 기능 근거</a> · <a href="https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html">Firewall Manager 조직 정책</a>
          SAA 평가 항목: 1.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#waf-%EB%8B%A8%EC%9D%BC-%EA%B7%9C%EC%B9%99-%EC%98%88%EC%99%B8%EC%99%80-%EB%82%98%EB%A8%B8%EC%A7%80-%EB%B3%B4%ED%98%B8">Firewall Manager는 여러 계정에 지원 보안 정책을 중앙 적용하고 Inspector는 지원 컴퓨팅·이미지의 취약점을 평가한다</a> · <a href="/study/lessons/deep-dive/day-11.html#%EA%B3%84%EC%A0%95%EB%A6%AC%EC%A0%84%EC%8A%A4%EC%BA%94-%EC%9C%A0%ED%98%95%EC%9D%98-coverage">정책 배포와 취약점 발견은 역할이 다르므로 함께 구성한다</a> · <a href="/study/lessons/exam-supplement/day-24.html#%EA%B2%B0%EA%B3%BC-%EC%A7%91%EA%B3%84%EC%99%80-%EC%9B%90%EC%B2%9C-%ED%86%B5%EC%A0%9C">보안 결과 집계는 조직 WAF 정책 적용과 취약점 원천 검사를 대신하지 않는다</a></p>
        quizzes:
          - q: Organizations의 신규 계정에도 동일한 WAF 정책을 자동 적용해야 한다. 보안팀은 동시에 EC2와 ECR 이미지의 알려진
              소프트웨어 취약점을 중앙에서 평가하려 한다. 리소스별 자체 검사 코드를 최소화할 서비스 두 가지는?
            answer: AWS Firewall Manager
            wrong:
              - Amazon GuardDuty
              - Security Hub CSPM에서 보안 결과와 제어 상태를 중앙 집계한다
              - AWS Config
            answers:
              - AWS Firewall Manager
              - Amazon Inspector
            options:
              - Amazon GuardDuty
              - AWS Firewall Manager
              - Amazon Inspector
              - Security Hub CSPM에서 보안 결과와 제어 상태를 중앙 집계한다
              - AWS Config
      - id: saa-r2-Q24-15
        source_id: Q24-15
        type: mcq
        title: Q24-15 · 모의고사 B
        explain: |
          <p>교차 계정 KMS 사용은 소유자 측 키 정책과 호출자 측 IAM 허용을 모두 충족해야 한다. 교차 계정 KMS 사용은 키 소유자의 키 정책과 호출자 측 IAM 허용을 함께 확인해야 한다. 객체 읽기 권한과 복호화 권한은 별개이며 동일한 이름의 다른 키로 원본 암호문을 해독할 수 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>소유자 키 정책만 외부 계정에 허용하고 호출자 IAM 허용은 생략한다</td>
          <td>외부 계정 호출자 측에서 해당 키 사용을 허용해야 한다.</td>
          </tr>
          <tr>
          <td>키 정책에 분석 계정의 루트를 신뢰하고 분석 역할 IAM에는 S3 읽기만 유지한다</td>
          <td>외부 계정에 키 사용을 위임해도 그 계정의 호출자 IAM에서 해당 키 사용을 허용해야 한다. S3 읽기는 KMS 허용을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>호출자 정책에 해당 키 Decrypt만 추가하고 소유자 키 정책은 변경하지 않는다</td>
          <td>교차 계정 키 사용에는 소유자 측 키 정책의 허용도 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%ED%82%A4%EC%9D%98-%EC%83%9D%EC%84%B1%EA%B3%BC-%EA%B5%90%EC%B0%A8-%EA%B3%84%EC%A0%95-%EA%B6%8C%ED%95%9C">교차 계정 KMS 사용은 키 소유자의 키 정책과 호출자 측 IAM 허용을 함께 확인해야 한다</a> · <a href="/study/lessons/deep-dive/day-11.html#%EB%8D%B0%EC%9D%B4%ED%84%B0-%ED%82%A4%EC%9D%98-%EC%83%9D%EC%84%B1%EA%B3%BC-%EA%B5%90%EC%B0%A8-%EA%B3%84%EC%A0%95-%EA%B6%8C%ED%95%9C">객체 읽기 권한과 복호화 권한은 별개이며 동일한 이름의 다른 키로 원본 암호문을 해독할 수 없다</a></p>
        quizzes:
          - q: 운영 계정의 고객 관리형 KMS 키로 암호화한 S3 객체를 분석 계정의 역할이 읽으려 한다. 양쪽 S3 정책은 이미 허용하며 KMS 요청만
              거부된다. 키 소유 계정의 정책과 분석 역할의 IAM에는 아직 이 교차 계정 사용을 허용한 항목이 없다. 필요한
              변경은?
            answer: 키 소유 계정 키 정책과 호출자 IAM 정책에서 해당 키 사용을 허용한다
            wrong:
              - 소유자 키 정책만 외부 계정에 허용하고 호출자 IAM 허용은 생략한다
              - 키 정책에 분석 계정의 루트를 신뢰하고 분석 역할 IAM에는 S3 읽기만 유지한다
              - 호출자 정책에 해당 키 Decrypt만 추가하고 소유자 키 정책은 변경하지 않는다
      - id: saa-r2-Q24-16
        source_id: Q24-16
        type: mcq
        title: Q24-16 · 모의고사 B
        explain: |
          <p>기본 암호화 변경이 아니라 기존 객체마다 K2로 암호화된 새 현재 버전을 만들어야 한다. Batch Operations Copy는 객체 목록을 관리형 작업으로 처리하면서 대상 SSE-KMS 키를 K2로 지정할 수 있다. 객체 크기가 Copy의 5GB 제한 이내이고 쓰기가 멈춰 있으므로 현재 버전을 같은 키로 복사해 검증할 수 있다. 이전 버전은 K1 암호화 상태로 남으므로 그 버전의 복원이 필요하면 K1 사용 권한을 유지하거나 별도로 이관해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버킷 기본 암호화를 K2로 바꾸고 기존 객체의 수명 주기 전환을 기다린다</td>
          <td>저장 클래스 전환은 기존 객체를 별도 KMS 키 K2로 재암호화하는 작업을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>EC2 작업자가 객체를 내려받아 복호화한 뒤 K2로 다시 업로드한다</td>
          <td>목표는 달성할 수 있으나 200만 객체 다운로드·재업로드와 작업자 재시도를 직접 운영해야 한다. Batch Copy보다 전송·운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>버킷 기본 암호화를 K2로 바꾸고 K1의 키 재료 자동 회전을 실행한다</td>
          <td>기본 암호화는 이후 새 쓰기에 적용되고 K1의 자동 회전도 기존 객체를 K2로 다시 암호화하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops-copy-object.html">Batch Operations Copy와 크기·버전 제한</a> · <a href="https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html">KMS 키 회전의 영향</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%ED%82%A4-%ED%9A%8C%EC%A0%84%EC%9E%AC%EC%95%94%ED%98%B8%ED%99%94%EC%82%AD%EC%A0%9C-%EB%8C%80%EA%B8%B0">Batch Operations Copy는 객체 목록을 관리형 작업으로 처리하면서 대상 SSE-KMS 키를 K2로 지정할 수 있다</a> · <a href="/study/lessons/deep-dive/day-11.html#%ED%82%A4-%ED%9A%8C%EC%A0%84%EC%9E%AC%EC%95%94%ED%98%B8%ED%99%94%EC%82%AD%EC%A0%9C-%EB%8C%80%EA%B8%B0">객체 크기가 Copy의 5GB 제한 이내이고 쓰기가 멈춰 있으므로 현재 버전을 같은 키로 복사해 검증할 수 있다</a> · <a href="/study/lessons/deep-dive/day-11.html#%ED%82%A4-%ED%9A%8C%EC%A0%84%EC%9E%AC%EC%95%94%ED%98%B8%ED%99%94%EC%82%AD%EC%A0%9C-%EB%8C%80%EA%B8%B0">이전 버전은 K1 암호화 상태로 남으므로 그 버전의 복원이 필요하면 K1 사용 권한을 유지하거나 별도로 이관해야 한다</a></p>
        quizzes:
          - q: S3 Standard 버킷의 현재 객체 200만 개를 KMS 키 K1에서 K2로 재암호화해야 한다. 객체는 100MB 이하이고 새 쓰기를
              중단할 수 있다. 기존 객체 키와 내용은 유지하며 Versioning이 켜져 있다. 새 버전을 검증하고 K1 권한을
              회수하려면 운영 부담이 가장 적은 방식은?
            answer: S3 Batch Operations Copy로 같은 키에 K2 암호화 사본을 생성한다
            wrong:
              - 버킷 기본 암호화를 K2로 바꾸고 기존 객체의 수명 주기 전환을 기다린다
              - EC2 작업자가 객체를 내려받아 복호화한 뒤 K2로 다시 업로드한다
              - 버킷 기본 암호화를 K2로 바꾸고 K1의 키 재료 자동 회전을 실행한다
      - id: saa-r2-Q24-17
        source_id: Q24-17
        type: mcq
        title: Q24-17 · 모의고사 B
        explain: |
          <p>새 버전 쓰기는 허용하면서 기존 보호 버전의 삭제·보존 단축을 특권 사용자에게도 막아야 한다. 이 요구는 과거 버전 존재가 아니라 보존 기간 중 삭제를 제한하는 WORM 통제다. Object Lock의 compliance 보존을 검토하고 잘못 긴 보존 기간의 비용·수정 제한도 사전에 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 Versioning과 MFA Delete를 적용하고 루트 사용자의 MFA로 버전을 삭제한다</td>
          <td>MFA Delete는 삭제에 추가 인증을 요구하지만 유효한 MFA로 인증한 소유자의 삭제를 7년 동안 금지하지 않는다. Compliance 보존과 다르다.</td>
          </tr>
          <tr>
          <td>Governance 보존과 관리자의 우회 권한을 함께 부여한다</td>
          <td>우회 가능한 관리자에게는 보존 중 삭제를 막는 조건이 충족되지 않는다.</td>
          </tr>
          <tr>
          <td>다른 버킷에 복제하고 양쪽 관리자에게 일반 삭제 권한을 유지한다</td>
          <td>복제 사본에도 불변 보존 통제가 없어 관리자 영구 삭제에 대비하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiFactorAuthenticationDelete.html">S3 MFA Delete와 버전 삭제</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#object-lock%EC%9D%98-%EB%B3%B4%EC%A1%B4-%EA%B8%B0%EA%B0%84%EA%B3%BC-legal-hold">이 요구는 과거 버전 존재가 아니라 보존 기간 중 삭제를 제한하는 WORM 통제다</a> · <a href="/study/lessons/deep-dive/day-11.html#%EB%B6%88%EB%B3%80-%EB%B3%B4%EA%B4%80%EA%B3%BC-legal-hold">Object Lock의 compliance 보존을 검토하고 잘못 긴 보존 기간의 비용·수정 제한도 사전에 확인해야 한다</a> · <a href="/study/lessons/exam-supplement/day-24.html#mfa-delete%EC%99%80-%EB%B3%B4%EC%A1%B4-%EC%9E%A0%EA%B8%88">MFA Delete 추가 인증은 Compliance 보존 기간의 영구 삭제 금지와 다르다</a></p>
        quizzes:
          - q: 버전 관리 중인 계약서 버킷은 현재 버전을 계속 추가해야 한다. 각 계약서의 보호된 버전은 7년 동안 관리자와 루트 사용자도 영구 삭제할
              수 없어야 한다. 보존 기간을 임의로 단축할 수 없게 할 구성은?
            answer: S3 Object Lock을 compliance 모드로 7년 적용한다
            wrong:
              - S3 Versioning과 MFA Delete를 적용하고 루트 사용자의 MFA로 버전을 삭제한다
              - Governance 보존과 관리자의 우회 권한을 함께 부여한다
              - 다른 버킷에 복제하고 양쪽 관리자에게 일반 삭제 권한을 유지한다
      - id: saa-r2-Q24-18
        source_id: Q24-18
        type: mcq
        title: Q24-18 · 모의고사 B
        explain: |
          <p>ACM 갱신 검증을 유지하면서 로드 밸런서 이후의 별도 연결도 HTTPS여야 한다. 인증서의 갱신 자격·DNS 검증 조건을 유지하고 서로 다른 두 통신 구간에 TLS를 적용해야 한다. 사용자 HTTPS가 로드 밸런서에서 종료된 뒤의 대상 연결까지 자동으로 암호화해 주는 것은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ALB HTTPS 리스너를 유지하고 대상 그룹은 HTTP로 구성한다</td>
          <td>사용자 구간은 보호하지만 ALB 뒤 대상 구간의 암호화 조건을 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>ACM 검증 DNS를 유지하고 HTTP 대상 그룹을 내부 전용 서브넷에 배치한다</td>
          <td>사설 서브넷은 연결의 암호화를 제공하지 않는다. 사용자→ALB TLS가 종료된 뒤 대상 구간도 HTTPS여야 한다.</td>
          </tr>
          <tr>
          <td>가져온 자체 인증서를 ALB에 연결하고 대상 그룹도 HTTPS로 설정한다</td>
          <td>두 통신 구간은 암호화할 수 있지만 가져온 인증서는 ACM 관리형 갱신 대상이 아니다. 자체 발급·재가져오기 절차를 운영해야 하므로 기존 DNS 검증 인증서의 관리형 갱신을 유지하는 구성보다 갱신 운영 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html">ALB 대상 그룹의 HTTPS 프로토콜</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#%EC%9D%B8%EC%A6%9D%EC%84%9C%EC%99%80-tls%EC%9D%98-%EB%91%90-%EA%B5%AC%EA%B0%84">인증서의 갱신 자격·DNS 검증 조건을 유지하고 서로 다른 두 통신 구간에 TLS를 적용해야 한다</a> · <a href="/study/lessons/deep-dive/day-11.html#%EC%9D%B8%EC%A6%9D%EC%84%9C%EC%99%80-tls%EC%9D%98-%EB%91%90-%EA%B5%AC%EA%B0%84">사용자 HTTPS가 로드 밸런서에서 종료된 뒤의 대상 연결까지 자동으로 암호화해 주는 것은 아니다</a></p>
        quizzes:
          - q: 웹 서비스는 DNS 검증한 ACM 발급 인증서를 ALB에서 사용한다. 인증서 갱신의 수작업을 줄이고 사용자→ALB와 ALB→대상 모두
              TLS로 암호화해야 한다. 대상 서버는 HTTPS를 지원한다. 요구를 충족할 구성은?
            answer: 검증 DNS 레코드를 유지하고 ALB 리스너·대상을 HTTPS로 설정한다
            wrong:
              - ALB HTTPS 리스너를 유지하고 대상 그룹은 HTTP로 구성한다
              - ACM 검증 DNS를 유지하고 HTTP 대상 그룹을 내부 전용 서브넷에 배치한다
              - 가져온 자체 인증서를 ALB에 연결하고 대상 그룹도 HTTPS로 설정한다
      - id: saa-r2-Q24-19
        source_id: Q24-19
        type: mcq
        title: Q24-19 · 모의고사 B
        explain: |
          <p>원본 계정·리전과 분리된 사본 및 우회 불가능한 보존 정책을 함께 구성해야 한다. 계정 분리는 운영 계정 침해의 영향을 줄이고 리전 분리는 리전 장애에 대비한다. 보관함 보존 통제를 추가하되 복사 지원·조직 관계·대상 정책과 복원에 필요한 KMS 권한을 함께 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>같은 계정·같은 리전 보관함의 백업 빈도만 늘린다</td>
          <td>빈도가 늘어도 운영 계정 침해와 리전 장애의 공동 영향 범위가 남는다.</td>
          </tr>
          <tr>
          <td>원본 DB에 다중 AZ와 읽기 복제본만 구성한다</td>
          <td>현재 변경을 전달하는 복제는 침해 삭제와 리전 장애에 대비한 잠긴 별도 백업이 아니다.</td>
          </tr>
          <tr>
          <td>같은 계정의 다른 리전에 복사하고 IAM 관리자 삭제 권한을 유지한다</td>
          <td>리전 분리는 제공하지만 운영 계정 침해와 사본 삭제 권한의 동일한 보안 경계가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html">추가 공식 근거</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EC%A0%9C%EC%99%80-%EC%82%AD%EC%A0%9C-%EB%B0%A9%EC%A7%80-%EB%B0%B1%EC%97%85%EC%9D%98-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%9E%A5%EC%95%A0">계정 분리는 운영 계정 침해의 영향을 줄이고 리전 분리는 리전 장애에 대비한다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EC%A0%9C%EC%99%80-%EC%82%AD%EC%A0%9C-%EB%B0%A9%EC%A7%80-%EB%B0%B1%EC%97%85%EC%9D%98-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%9E%A5%EC%95%A0">보관함 보존 통제를 추가하되 복사 지원·조직 관계·대상 정책과 복원에 필요한 KMS 권한을 함께 확인해야 한다</a></p>
        quizzes:
          - q: 운영 계정의 관리자 자격 증명 탈취에 대비해 백업을 다른 보안 경계에 남기려 한다. 주 리전 전체 장애에도 복구해야 하며 대상 사본은 정한
              보존 기간 동안 특권 사용자도 임의 삭제하지 못해야 한다. 지원 리소스의 백업에 결합할 조치 두 가지는?
            answer: 대상 백업 보관함에 요구 기간의 Compliance Vault Lock을 구성한다
            wrong:
              - 같은 계정·같은 리전 보관함의 백업 빈도만 늘린다
              - 원본 DB에 다중 AZ와 읽기 복제본만 구성한다
              - 같은 계정의 다른 리전에 복사하고 IAM 관리자 삭제 권한을 유지한다
            answers:
              - 대상 백업 보관함에 요구 기간의 Compliance Vault Lock을 구성한다
              - 다른 계정·리전의 보관함으로 백업 복사를 구성한다
            options:
              - 대상 백업 보관함에 요구 기간의 Compliance Vault Lock을 구성한다
              - 같은 계정·같은 리전 보관함의 백업 빈도만 늘린다
              - 원본 DB에 다중 AZ와 읽기 복제본만 구성한다
              - 같은 계정의 다른 리전에 복사하고 IAM 관리자 삭제 권한을 유지한다
              - 다른 계정·리전의 보관함으로 백업 복사를 구성한다
      - id: saa-r2-Q24-20
        source_id: Q24-20
        type: mcq
        title: Q24-20 · 모의고사 B
        explain: |
          <p>객체 내용 분류와 허용된 다른 리전의 사본이라는 두 요구를 동시에 맞춰야 한다. Macie는 S3 객체 내용을 분석해 민감정보 발견 사항을 생성한다. 분류 결과 저장 위치도 허용 리전으로 정하고, eu-central-1로 CRR을 구성하면 허용된 두 리전 안에서 리전 장애 대비 사본을 만들 수 있다. 암호화는 저장 위치 제한을 대체하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>GuardDuty S3 Protection과 eu-central-1 대상 교차 리전 복제를 구성한다</td>
          <td>GuardDuty S3 Protection은 S3 접근 관련 위협을 탐지한다. CSV 내용의 개인 식별 정보 분류 작업을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>Macie 작업과 us-east-1 복제를 구성하고 사본은 SSE-KMS로 암호화한다</td>
          <td>암호화해도 허용되지 않은 리전에 데이터를 보관하는 요구 위반은 해소되지 않는다.</td>
          </tr>
          <tr>
          <td>Macie 분류 작업과 eu-west-1의 다른 버킷 대상 동일 리전 복제를 구성한다</td>
          <td>같은 리전의 별도 버킷은 계정·버킷 수준 격리를 줄 수 있지만 eu-west-1 전체 장애 시 사용할 다른 리전 사본이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html">Macie 민감정보 발견</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html">S3 복제 유형</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-batch-replication-batch.html">기존 객체의 S3 Batch Replication</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-11.html#macie-%EB%AC%B8%EB%A7%A5%EA%B3%BC-%ED%97%88%EC%9A%A9-%EB%AA%A9%EB%A1%9D%EC%9D%98-%EA%B2%80%EC%A6%9D">Macie는 S3 객체 내용을 분석해 민감정보 발견 사항을 생성한다</a> · <a href="/study/lessons/deep-dive/day-11.html#macie-%EB%AC%B8%EB%A7%A5%EA%B3%BC-%ED%97%88%EC%9A%A9-%EB%AA%A9%EB%A1%9D%EC%9D%98-%EA%B2%80%EC%A6%9D">분류 결과 저장 위치도 허용 리전으로 정하고, eu-central-1로 CRR을 구성하면 허용된 두 리전 안에서 리전 장애 대비 사본을 만들 수 있다</a> · <a href="/study/lessons/deep-dive/day-11.html#macie-%EB%AC%B8%EB%A7%A5%EA%B3%BC-%ED%97%88%EC%9A%A9-%EB%AA%A9%EB%A1%9D%EC%9D%98-%EA%B2%80%EC%A6%9D">암호화는 저장 위치 제한을 대체하지 않는다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EB%B3%B5%EC%A0%9C%EC%99%80-%EC%95%94%ED%98%B8%ED%99%94%EC%A0%91%EA%B7%BC-%EA%B6%8C%ED%95%9C">라이브 복제는 신규 객체에 적용하고 기존 객체는 Batch Replication으로 처리한다</a></p>
        quizzes:
          - q: 회사는 eu-west-1의 비공개 S3에 CSV를 수집한다. 개인 식별 정보의 실제 내용을 정기 분류해야 하고 리전 장애에도 사본이
              필요하다. 데이터·분류 결과 저장 허용 리전은 eu-west-1과 eu-central-1뿐이며 기존 객체도 복제
              대상이다. 서비스와 권한은 준비되어 있다. 적합한 구성은?
            answer: Macie 작업과 eu-central-1 복제를 구성하고 기존 객체도 Batch Replication한다
            wrong:
              - GuardDuty S3 Protection과 eu-central-1 대상 교차 리전 복제를 구성한다
              - Macie 작업과 us-east-1 복제를 구성하고 사본은 SSE-KMS로 암호화한다
              - Macie 분류 작업과 eu-west-1의 다른 버킷 대상 동일 리전 복제를 구성한다
      - id: saa-r2-Q24-21
        source_id: Q24-21
        type: mcq
        title: Q24-21 · 모의고사 B
        explain: |
          <p>API 응답을 렌더링 완료와 분리하고 접수·결과 상태를 서버 메모리 밖에 보존해야 한다. 빠른 접수와 오래 걸리는 처리를 분리해야 하므로 내구성 있는 작업 큐와 외부 상태 저장소를 사용한다. 소비자 확장은 큐의 적체·작업 기한·다운스트림 처리량을 기준으로 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>API가 작업 상태를 DB에 기록하고 각 요청에 동기식 작업자 HTTP 호출을 기다린다</td>
          <td>상태는 보존되지만 응답이 수 분의 동기식 렌더링에 묶여 1초 접수 응답과 독립 확장 요구를 만족하지 못한다.</td>
          </tr>
          <tr>
          <td>SQS 메시지를 수신 즉시 삭제하고 렌더링 결과만 나중에 저장한다</td>
          <td>처리 중 작업자가 죽으면 큐에서 이미 지운 작업을 다시 전달받지 못한다.</td>
          </tr>
          <tr>
          <td>API 서버를 수직 확장하고 렌더링 완료까지 같은 요청에서 기다린다</td>
          <td>서버가 빨라져도 장시간 처리와 실패가 동기 응답 경로에 결합되어 즉시 접수 조건을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/day-10.html#1-%EC%9A%94%EC%B2%AD%EC%9D%84-%EA%B8%B0%EB%8B%A4%EB%A6%AC%EB%8A%94-%EC%9E%91%EC%97%85%EA%B3%BC-%EB%82%98%EC%A4%91%EC%97%90-%EC%B2%98%EB%A6%AC%ED%95%A0-%EC%9E%91%EC%97%85">빠른 접수와 오래 걸리는 처리를 분리해야 하므로 내구성 있는 작업 큐와 외부 상태 저장소를 사용한다</a> · <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">소비자 확장은 큐의 적체·작업 기한·다운스트림 처리량을 기준으로 설계한다</a></p>
        quizzes:
          - q: 영상 API는 1초 안에 작업 ID를 반환해야 한다. 렌더링은 수 분 걸리고 요청 급증 뒤 처리자가 재시작될 수 있다. 클라이언트는 ID로
              결과를 조회할 수 있어야 하며 처리 완료 전에 접수 작업을 잃으면 안 된다. API와 작업자를 독립 확장할 구조는?
            answer: 작업 ID를 저장하고 SQS에 넣은 뒤 독립 작업자가 처리한다
            wrong:
              - API가 작업 상태를 DB에 기록하고 각 요청에 동기식 작업자 HTTP 호출을 기다린다
              - SQS 메시지를 수신 즉시 삭제하고 렌더링 결과만 나중에 저장한다
              - API 서버를 수직 확장하고 렌더링 완료까지 같은 요청에서 기다린다
      - id: saa-r2-Q24-22
        source_id: Q24-22
        type: mcq
        title: Q24-22 · 모의고사 B
        explain: |
          <p>모든 구독자가 같은 사건을 받아야 하며 구독자별 내구성 적체·pull 처리가 필요하다. 두 팀 모두 같은 사건을 받고 각각 독립적으로 재시도해야 하므로 발행·구독과 구독자별 내구성 큐를 조합한다. 하나의 경쟁 소비 큐는 작업 분담이지 각 팀에 대한 독립 전달이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>이메일·회계를 하나의 Step Functions 순차 단계로 묶는다</td>
          <td>순차 결합은 한 팀의 지연이 다른 팀의 진행을 막을 수 있어 독립 처리 요구와 맞지 않는다.</td>
          </tr>
          <tr>
          <td>팀들이 하나의 SQS 큐를 경쟁 소비한다</td>
          <td>작업을 분담받는 구조이므로 두 팀 각각 모든 지급 사건을 처리하는 요구와 다르다.</td>
          </tr>
          <tr>
          <td>SNS 토픽에서 두 팀의 Lambda 함수를 직접 호출한다</td>
          <td>직접 Lambda 구독은 각 팀에 사건을 전달할 수 있지만 소비자가 큐를 직접 당기며 하루 적체를 관리하는 요구에는 팀별 SQS가 더 적합하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">두 팀 모두 같은 사건을 받고 각각 독립적으로 재시도해야 하므로 발행·구독과 구독자별 내구성 큐를 조합한다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">하나의 경쟁 소비 큐는 작업 분담이지 각 팀에 대한 독립 전달이 아니다</a></p>
        quizzes:
          - q: 지급 완료 사건은 이메일 팀과 회계 팀에 각각 한 번 이상의 처리가 필요하다. 회계팀이 하루 중단되어도 이메일은 계속 처리하고, 복구한
              회계 소비자는 직접 메시지를 당겨 적체를 해소해야 한다. 관리형 서비스를 결합할 최선의 구조는?
            answer: SNS 토픽에서 팀별 SQS 큐로 전달한다
            wrong:
              - 이메일·회계를 하나의 Step Functions 순차 단계로 묶는다
              - 팀들이 하나의 SQS 큐를 경쟁 소비한다
              - SNS 토픽에서 두 팀의 Lambda 함수를 직접 호출한다
      - id: saa-r2-Q24-23
        source_id: Q24-23
        type: mcq
        title: Q24-23 · 모의고사 B
        explain: |
          <p>단계별 상태·오류 분기·보상 절차를 중앙 워크플로로 관리해야 한다. 순서·오류별 재시도·분기·보상 절차를 명시해야 하므로 상태 머신 워크플로가 적합하다. Step Functions가 업무 부작용을 자동 롤백하지는 않으므로 재고 반환과 결제 중복 방지는 직접 정의한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SQS에 재고·결제·배송 메시지를 별도 넣고 각각 처리한다</td>
          <td>분리된 큐만으로 앞 단계 성공 후 다음 단계 실행과 보상 상태를 관리하지 못한다.</td>
          </tr>
          <tr>
          <td>SNS 토픽에서 재고·결제·배송 소비자가 독립 실행되게 한다</td>
          <td>독립 전달만으로 요구한 선후 조건·오류별 상태·보상 절차가 명시적으로 조정되지 않는다.</td>
          </tr>
          <tr>
          <td>한 Lambda가 재고·결제·배송을 호출하고 DB에 단계 상태와 재시도 횟수를 직접 저장한다</td>
          <td>구현은 가능하지만 단계별 영속 상태·재시도·보상을 자체 코드로 관리해야 하므로 상태 관리 코드 최소화에 불리하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">순서·오류별 재시도·분기·보상 절차를 명시해야 하므로 상태 머신 워크플로가 적합하다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">Step Functions가 업무 부작용을 자동 롤백하지는 않으므로 재고 반환과 결제 중복 방지는 직접 정의한다</a></p>
        quizzes:
          - q: 주문 흐름은 재고 예약→결제→배송 순서다. 일시적 재고 오류는 해당 단계만 재시도하고, 결제 영구 실패에는 예약 재고를 반환해야 한다.
              배송은 결제 성공 뒤에만 실행하며 단계 상태 저장 코드는 줄이려 한다. 가장 적합한 구성은?
            answer: Retry·Catch와 보상 단계를 정의한 Step Functions
            wrong:
              - SQS에 재고·결제·배송 메시지를 별도 넣고 각각 처리한다
              - SNS 토픽에서 재고·결제·배송 소비자가 독립 실행되게 한다
              - 한 Lambda가 재고·결제·배송을 호출하고 DB에 단계 상태와 재시도 횟수를 직접 저장한다
      - id: saa-r2-Q24-24
        source_id: Q24-24
        type: mcq
        title: Q24-24 · 모의고사 B
        explain: |
          <p>인스턴스 장애·요청 재분배 시에도 세션과 파일을 다른 인스턴스가 사용할 수 있어야 한다. 수평 확장에서는 다음 요청을 특정 인스턴스의 로컬 상태에 의존시키지 않아야 한다. 세션과 파일을 목적에 맞는 외부 저장소로 옮기고 그 저장소의 가용성·접근·보존도 함께 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>업로드를 EC2의 별도 EBS 볼륨에 저장하고 인스턴스 종료 시 볼륨을 유지한다</td>
          <td>볼륨을 보존해도 다른 AZ의 모든 대상이 같은 파일에 즉시 접근하는 구조가 되지는 않는다.</td>
          </tr>
          <tr>
          <td>Sticky session을 켜고 서버 RAM에만 세션을 유지한다</td>
          <td>특정 서버 선호는 만들 수 있으나 그 서버 장애 때 세션 복구와 어느 서버 처리 조건이 남는다.</td>
          </tr>
          <tr>
          <td>업로드 폴더를 매시간 AMI로 보관하고 장애 시 새 서버를 실행한다</td>
          <td>AMI 사이 새 파일과 RAM 세션은 복구하지 못하며 요청 재분배 시 실시간 상태 공유도 제공하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html">추가 공식 근거</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EC%84%B8%EC%85%98%EC%9D%84-%EC%99%B8%EB%B6%80%EB%A1%9C-%EC%98%AE%EA%B2%A8-%EC%84%9C%EB%B2%84-%EA%B5%90%EC%B2%B4%EB%A5%BC-%ED%97%88%EC%9A%A9%ED%95%98%EA%B8%B0">수평 확장에서는 다음 요청을 특정 인스턴스의 로컬 상태에 의존시키지 않아야 한다</a> · <a href="/study/lessons/deep-dive/day-06.html#%EC%84%B8%EC%85%98%EC%9D%84-%EC%99%B8%EB%B6%80%EB%A1%9C-%EC%98%AE%EA%B2%A8-%EC%84%9C%EB%B2%84-%EA%B5%90%EC%B2%B4%EB%A5%BC-%ED%97%88%EC%9A%A9%ED%95%98%EA%B8%B0">세션과 파일을 목적에 맞는 외부 저장소로 옮기고 그 저장소의 가용성·접근·보존도 함께 설계한다</a></p>
        quizzes:
          - q: 예약 앱을 한 EC2에서 다중 AZ ASG로 전환한다. 로그인 세션은 RAM에 있고 업로드 파일은 로컬 디스크에 있다. 인스턴스를
              교체하거나 다른 대상에 요청을 보내도 재로그인과 파일 유실이 없어야 한다. 필요한 두 조치는?
            answer: 업로드 사진을 S3 같은 외부 저장소에 보관한다
            wrong:
              - 업로드를 EC2의 별도 EBS 볼륨에 저장하고 인스턴스 종료 시 볼륨을 유지한다
              - Sticky session을 켜고 서버 RAM에만 세션을 유지한다
              - 업로드 폴더를 매시간 AMI로 보관하고 장애 시 새 서버를 실행한다
            answers:
              - 업로드 사진을 S3 같은 외부 저장소에 보관한다
              - 세션을 적절히 복제·만료되는 외부 저장소로 옮긴다
            options:
              - 업로드 사진을 S3 같은 외부 저장소에 보관한다
              - 업로드를 EC2의 별도 EBS 볼륨에 저장하고 인스턴스 종료 시 볼륨을 유지한다
              - Sticky session을 켜고 서버 RAM에만 세션을 유지한다
              - 업로드 폴더를 매시간 AMI로 보관하고 장애 시 새 서버를 실행한다
              - 세션을 적절히 복제·만료되는 외부 저장소로 옮긴다
      - id: saa-r2-Q24-25
        source_id: Q24-25
        type: mcq
        title: Q24-25 · 모의고사 B
        explain: |
          <p>기존 메시징 프로토콜·클라이언트를 유지하고 브로커 운영을 관리형으로 옮겨야 한다. 기존 브로커 프로토콜·라이브러리를 유지해야 하므로 관리형 호환 브로커인 Amazon MQ를 우선 검토한다. 실제 엔진 기능·클라이언트·HA 구성이 요구에 맞는지 확인하는 일은 남는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2의 RabbitMQ 클러스터를 그대로 이관해 직접 패치한다</td>
          <td>호환성은 유지할 수 있지만 줄이려는 브로커 패치·장애 운영 부담이 남는다.</td>
          </tr>
          <tr>
          <td>EKS에서 RabbitMQ 클러스터와 Operator를 운영한다</td>
          <td>기존 프로토콜을 유지할 수 있지만 브로커와 Kubernetes 운영이 남아 Amazon MQ보다 관리 부담이 크다.</td>
          </tr>
          <tr>
          <td>SQS로 이관하고 AMQP 호출을 SQS API로 바꾸는 어댑터를 앱에 추가한다</td>
          <td>SQS는 관리 부담을 낮출 수 있지만 클라이언트·프로토콜 어댑터 변경이 필요해 이번 코드 변경 범위를 넘는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EB%A0%88%EA%B1%B0%EC%8B%9C-%EB%B8%8C%EB%A1%9C%EC%BB%A4%EC%99%80-saas-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">기존 브로커 프로토콜·라이브러리를 유지해야 하므로 관리형 호환 브로커인 Amazon MQ를 우선 검토한다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EB%A0%88%EA%B1%B0%EC%8B%9C-%EB%B8%8C%EB%A1%9C%EC%BB%A4%EC%99%80-saas-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">실제 엔진 기능·클라이언트·HA 구성이 요구에 맞는지 확인하는 일은 남는다</a></p>
        quizzes:
          - q: 대출 앱은 RabbitMQ의 AMQP 라이브러리를 사용하며 브로커 주소·인증 설정 외에는 이번 분기에 코드를 바꾸기 어렵다. 운영팀은
              EC2 브로커 패치와 장애 복구 부담을 줄이려 한다. 지원 기능과 HA 요구를 확인한 뒤 우선 선택할 대상은?
            answer: 지원 호환성과 고가용성 구성을 확인한 Amazon MQ
            wrong:
              - EC2의 RabbitMQ 클러스터를 그대로 이관해 직접 패치한다
              - EKS에서 RabbitMQ 클러스터와 Operator를 운영한다
              - SQS로 이관하고 AMQP 호출을 SQS API로 바꾸는 어댑터를 앱에 추가한다
      - id: saa-r2-Q24-26
        source_id: Q24-26
        type: mcq
        title: Q24-26 · 모의고사 B
        explain: |
          <p>지원 SaaS 커넥터를 통한 예약 전송으로 수집·스케줄·인증 코드 운영을 줄여야 한다. 지원 SaaS에서 분석 저장소로 정기 데이터를 옮기는 요구에는 관리형 AppFlow 커넥터가 적합하다. 필드 매핑·지원 객체·실행 주기를 확인하되 서버 복제나 메시지 큐와 혼동하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Salesforce에서 정기 CSV를 내보내고 작업자가 SFTP 서버를 거쳐 S3에 적재한다</td>
          <td>전송은 가능하지만 파일 생성·전달 작업을 운영해야 하며 지원 SaaS 커넥터 활용보다 관리 단계가 많다.</td>
          </tr>
          <tr>
          <td>EC2에서 자체 Salesforce API 배치·자격 증명·스케줄러를 운영한다</td>
          <td>가능하지만 지원 커넥터가 있는데 수집 코드의 패치·오류·토큰 관리 부담을 직접 유지한다.</td>
          </tr>
          <tr>
          <td>EventBridge Scheduler가 Lambda의 Salesforce REST API 수집 코드를 실행한다</td>
          <td>예약 실행은 관리형이지만 페이지 처리·API 인증·재시도·필드 매핑 등의 수집 코드를 직접 유지해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/appflow/latest/userguide/what-is-appflow.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EB%A0%88%EA%B1%B0%EC%8B%9C-%EB%B8%8C%EB%A1%9C%EC%BB%A4%EC%99%80-saas-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">지원 SaaS에서 분석 저장소로 정기 데이터를 옮기는 요구에는 관리형 AppFlow 커넥터가 적합하다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EB%A0%88%EA%B1%B0%EC%8B%9C-%EB%B8%8C%EB%A1%9C%EC%BB%A4%EC%99%80-saas-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">필드 매핑·지원 객체·실행 주기를 확인하되 서버 복제나 메시지 큐와 혼동하지 않는다</a></p>
        quizzes:
          - q: 영업 분석팀은 지원되는 Salesforce 객체를 매일 밤 S3로 복사한다. 초 단위 반영은 필요 없고 필드 매핑·필터링과 자격 증명
              관리는 관리형으로 처리하려 한다. 별도 API 수집 프로그램을 운영하지 않을 방법은?
            answer: Amazon AppFlow의 예약 데이터 흐름
            wrong:
              - Salesforce에서 정기 CSV를 내보내고 작업자가 SFTP 서버를 거쳐 S3에 적재한다
              - EC2에서 자체 Salesforce API 배치·자격 증명·스케줄러를 운영한다
              - EventBridge Scheduler가 Lambda의 Salesforce REST API 수집 코드를 실행한다
      - id: saa-r2-Q24-27
        source_id: Q24-27
        type: mcq
        title: Q24-27 · 모의고사 B
        explain: |
          <p>생산자와 소비자 주소를 분리하고 이벤트 내용으로 중앙 라우팅해야 한다. 이벤트 내용과 소스에 따른 관리형 라우팅에는 EventBridge가 적합하다. 생산자는 사건을 발행하고 규칙이 대상을 연결하므로 직접 호출 주소 결합을 줄이며 전달 실패·보관 설정은 별도로 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SNS에서 모든 사건을 Lambda 한 개에 보내 detail 분기와 대상 호출을 직접 구현한다</td>
          <td>구현은 가능하지만 분기·대상 주소를 자체 라우터 코드에서 유지해야 한다. EventBridge 규칙은 이 라우팅을 관리형 설정으로 분리한다.</td>
          </tr>
          <tr>
          <td>생산자마다 모든 소비자의 HTTP 주소와 조건 분기를 관리한다</td>
          <td>가능하지만 소비자 추가·변경이 생산자 배포에 결합되어 요구한 직접 주소 결합 완화에 불리하다.</td>
          </tr>
          <tr>
          <td>하나의 SQS 큐를 두고 서로 다른 소비자가 메시지를 경쟁 수신한다</td>
          <td>경쟁 수신만으로 이벤트 내용에 따른 적합한 소비자 선택을 보장하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">이벤트 내용과 소스에 따른 관리형 라우팅에는 EventBridge가 적합하다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">생산자는 사건을 발행하고 규칙이 대상을 연결하므로 직접 호출 주소 결합을 줄이며 전달 실패·보관 설정은 별도로 설계한다</a></p>
        quizzes:
          - q: 여러 계정의 앱이 주문·환불 사건을 중앙 버스에 발행한다. source와 detail 필드로 조건을 지정해 서로 다른 AWS 대상에
              전달해야 하며 새 소비자를 추가할 때 생산자의 대상 주소 목록을 배포하고 싶지 않다. 적합한 연결은?
            answer: EventBridge 이벤트 버스의 규칙으로 대상을 선택한다
            wrong:
              - SNS에서 모든 사건을 Lambda 한 개에 보내 detail 분기와 대상 호출을 직접 구현한다
              - 생산자마다 모든 소비자의 HTTP 주소와 조건 분기를 관리한다
              - 하나의 SQS 큐를 두고 서로 다른 소비자가 메시지를 경쟁 수신한다
      - id: saa-r2-Q24-28
        source_id: Q24-28
        type: mcq
        title: Q24-28 · 모의고사 B
        explain: |
          <p>비동기 복제 지연을 허용하는 통계와 쓰기 직후 확인의 일관성 요구가 다르다. 지연을 허용하는 읽기만 복제본으로 분리하고 쓰기 직후의 최신 확인은 writer를 사용해야 한다. 비동기 복제 지연을 요청별 일관성 요구와 연결하는 설계가 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>writer와 읽기 복제본 사이에 조회를 무작위 분산하고 모든 읽기를 같은 경로로 보낸다</td>
          <td>통계 부하는 분산되지만 결제 직후 확인도 지연된 복제본에 도달할 수 있다. 최신 읽기가 필요한 요청은 writer로 구분해야 한다.</td>
          </tr>
          <tr>
          <td>모든 조회를 비동기 replica로 보내 쓰기 직후도 동일 처리한다</td>
          <td>최근 쓰기가 아직 전달되지 않았을 수 있어 결제 직후 최신 확인 요구를 위반한다.</td>
          </tr>
          <tr>
          <td>모든 조회를 writer로 유지하고 읽기 복제본을 장애 복구 용도로만 보관한다</td>
          <td>최신 읽기는 충족하지만 증가하는 통계 읽기 부하를 writer에서 분리하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#%EA%B0%80%EC%9A%A9%EC%84%B1-%EC%9D%BD%EA%B8%B0-%ED%99%95%EC%9E%A5%EA%B3%BC-%EC%97%B0%EA%B2%B0-%EC%88%98">지연을 허용하는 읽기만 복제본으로 분리하고 쓰기 직후의 최신 확인은 writer를 사용해야 한다</a> · <a href="/study/lessons/deep-dive/day-07.html#%EA%B0%80%EC%9A%A9%EC%84%B1-%EC%9D%BD%EA%B8%B0-%ED%99%95%EC%9E%A5%EA%B3%BC-%EC%97%B0%EA%B2%B0-%EC%88%98">비동기 복제 지연을 요청별 일관성 요구와 연결하는 설계가 필요하다</a></p>
        quizzes:
          - q: RDS 주문 DB의 쓰기는 여유가 있지만 통계 조회가 늘고 있다. 통계는 수 초 지연을 허용하며 결제 직후 확인 화면은 방금 쓴 주문을
              읽어야 한다. 코드에서 요청 종류별 엔드포인트를 고를 수 있다. 요구에 맞는 연결 분리는?
            answer: 통계는 읽기 복제본으로, 결제 직후 확인은 writer로 보낸다
            wrong:
              - writer와 읽기 복제본 사이에 조회를 무작위 분산하고 모든 읽기를 같은 경로로 보낸다
              - 모든 조회를 비동기 replica로 보내 쓰기 직후도 동일 처리한다
              - 모든 조회를 writer로 유지하고 읽기 복제본을 장애 복구 용도로만 보관한다
      - id: saa-r2-Q24-29
        source_id: Q24-29
        type: mcq
        title: Q24-29 · 모의고사 B
        explain: |
          <p>실행 에이전트의 이미지·로그 권한과 컨테이너 내부 앱의 S3 권한은 서로 다른 주체에 부여해야 한다. Fargate에서 비공개 ECR 이미지를 가져오고 awslogs로 로그를 전송하는 시작 작업에는 task execution role이 사용된다. 컨테이너 앱의 S3 API 호출은 task role에 필요한 권한을 부여해 두 실행 주체를 분리한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>앱 S3 권한을 execution role에만 넣는다</td>
          <td>execution role은 에이전트 작업용으로 앱 SDK의 task role 권한을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>이미지 다운로드 권한을 task role에만 넣는다</td>
          <td>작업 시작 시 이미지를 가져오는 에이전트의 execution role 권한이 별도로 필요하다.</td>
          </tr>
          <tr>
          <td>모든 권한을 가진 IAM 사용자 키를 Secrets Manager에서 앱 환경변수로 주입한다</td>
          <td>비밀 저장소에 보관해도 장기 사용자 키와 과도한 공통 권한이 남는다. Fargate 실행 주체별 역할 분리를 대체하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html">ECS task execution role</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html">ECS task role</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/instance_IAM_role.html">EC2 container instance role과의 차이</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#%EC%BB%A8%ED%85%8C%EC%9D%B4%EB%84%88%EA%B0%80-%EC%8B%9C%EC%9E%91%EB%90%A0-%EB%95%8C%EC%99%80-%EC%95%B1%EC%9D%B4-api%EB%A5%BC-%ED%98%B8%EC%B6%9C%ED%95%A0-%EB%95%8C">Fargate에서 비공개 ECR 이미지를 가져오고 awslogs로 로그를 전송하는 시작 작업에는 task execution role이 사용된다</a> · <a href="/study/lessons/deep-dive/day-14.html#%EC%BB%A8%ED%85%8C%EC%9D%B4%EB%84%88%EA%B0%80-%EC%8B%9C%EC%9E%91%EB%90%A0-%EB%95%8C%EC%99%80-%EC%95%B1%EC%9D%B4-api%EB%A5%BC-%ED%98%B8%EC%B6%9C%ED%95%A0-%EB%95%8C">컨테이너 앱의 S3 API 호출은 task role에 필요한 권한을 부여해 두 실행 주체를 분리한다</a></p>
        quizzes:
          - q: ECS Fargate 서비스가 비공개 ECR 이미지를 받아 awslogs로 기록한다. 컨테이너 앱은 별도로 자기 S3 경로를 읽는다. 공통
              관리자 키를 넣지 않고 시작 작업과 앱의 AWS API 권한을 분리하려면 필요한 역할 설정 두 가지는?
            answer: 앱의 S3 API 호출에 필요한 task role을 설정한다
            wrong:
              - 앱 S3 권한을 execution role에만 넣는다
              - 이미지 다운로드 권한을 task role에만 넣는다
              - 모든 권한을 가진 IAM 사용자 키를 Secrets Manager에서 앱 환경변수로 주입한다
            answers:
              - 앱의 S3 API 호출에 필요한 task role을 설정한다
              - 실행 에이전트 작업에 필요한 task execution role을 설정한다
            options:
              - 앱의 S3 API 호출에 필요한 task role을 설정한다
              - 앱 S3 권한을 execution role에만 넣는다
              - 이미지 다운로드 권한을 task role에만 넣는다
              - 모든 권한을 가진 IAM 사용자 키를 Secrets Manager에서 앱 환경변수로 주입한다
              - 실행 에이전트 작업에 필요한 task execution role을 설정한다
      - id: saa-r2-Q24-30
        source_id: Q24-30
        type: mcq
        title: Q24-30 · 모의고사 B
        explain: |
          <p>정상 AZ의 서버가 실패한 AZ의 Zonal NAT에 의존하지 않도록 출구와 경로를 나누어야 한다. 앱 서버만 다중 AZ여도 공유 출구가 한 AZ에 묶이면 전체 요청 경로에 단일 장애 지점이 남는다. AZ별 NAT와 해당 AZ 라우팅으로 출구 의존성을 나누고 추가 고정 비용을 감수한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>AZ-b에 대기 NAT를 만들고 두 앱 서브넷의 기본 경로는 AZ-a NAT로 유지한다</td>
          <td>대기 NAT가 있어도 경로가 실패한 AZ-a를 계속 가리키면 자동으로 AZ-b 출구를 이용하지 못한다.</td>
          </tr>
          <tr>
          <td>AZ-a NAT 한 개를 유지하고 두 AZ 앱의 재시도·연결 제한 시간을 늘린다</td>
          <td>재시도 설정은 일시 장애에는 도움이 되지만 출구가 놓인 AZ 전체 장애의 의존성을 제거하지 못한다.</td>
          </tr>
          <tr>
          <td>NAT 인스턴스 한 대를 기존 NAT 대신 같은 AZ에 배치한다</td>
          <td>장치 유형만 바뀌고 동일 AZ에 출구가 하나인 장애 범위는 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html">NAT Gateway의 AZ 가용성</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EB%8B%A4%EC%A4%91-az%EC%9D%98-%EC%97%AC%EC%9C%A0-%EC%9A%A9%EB%9F%89%EA%B3%BC-%EB%B9%84%EC%9A%A9">앱 서버만 다중 AZ여도 공유 출구가 한 AZ에 묶이면 전체 요청 경로에 단일 장애 지점이 남는다</a> · <a href="/study/lessons/deep-dive/day-06.html#%EB%8B%A4%EC%A4%91-az%EC%9D%98-%EC%97%AC%EC%9C%A0-%EC%9A%A9%EB%9F%89%EA%B3%BC-%EB%B9%84%EC%9A%A9">AZ별 NAT와 해당 AZ 라우팅으로 출구 의존성을 나누고 추가 고정 비용을 감수한다</a></p>
        quizzes:
          - q: 두 AZ의 앱은 외부 운송사 API를 호출하지만 두 서브넷 모두 AZ-a의 Zonal NAT Gateway로 나간다. AZ-a 장애 때
              AZ-b 서버도 외부 호출에 실패했다. 인터넷으로부터 앱의 직접 접근을 열지 않고 AZ 장애 의존성을 줄일 변경은?
            answer: 각 AZ에 NAT를 두고 앱 서브넷이 같은 AZ NAT를 사용하게 한다
            wrong:
              - AZ-b에 대기 NAT를 만들고 두 앱 서브넷의 기본 경로는 AZ-a NAT로 유지한다
              - AZ-a NAT 한 개를 유지하고 두 AZ 앱의 재시도·연결 제한 시간을 늘린다
              - NAT 인스턴스 한 대를 기존 NAT 대신 같은 AZ에 배치한다
      - id: saa-r2-Q24-31
        source_id: Q24-31
        type: mcq
        title: Q24-31 · 모의고사 B
        explain: |
          <p>ASG에 앱 계층의 상태를 반영하고 새 앱 준비 시간은 상태 검사 유예에 포함해야 한다. OS 수준 검사와 애플리케이션 건강은 다르므로 ASG가 ELB 상태를 교체 판단에 쓰도록 구성한다. 새 앱 준비 시간을 고려하되 로드 밸런서가 준비되지 않은 대상을 정상으로 취급하게 만들지는 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2 기본 상태 확인만 유지하고 ALB 상태 확인 간격을 줄인다</td>
          <td>ALB가 빨리 감지해도 ASG가 그 건강을 교체 판단에 쓰지 않으면 증상이 남는다.</td>
          </tr>
          <tr>
          <td>ASG 최대 용량만 늘리고 상태 확인 종류는 유지한다</td>
          <td>확장 상한과 앱 고장 교체 판단은 다른 설정이다.</td>
          </tr>
          <tr>
          <td>ASG에서 ELB 상태 검사를 켜고 부팅 시간을 제외한 짧은 유예 시간을 사용한다</td>
          <td>앱 오류는 감지하지만 새 서버 준비가 끝나기 전에 비정상으로 평가해 연속 교체할 위험이 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#health-grace%EC%99%80-warmup%EC%9D%80-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%8B%9C%EA%B0%84%EC%9D%84-%EB%B3%B4%ED%98%B8%ED%95%9C%EB%8B%A4">OS 수준 검사와 애플리케이션 건강은 다르므로 ASG가 ELB 상태를 교체 판단에 쓰도록 구성한다</a> · <a href="/study/lessons/deep-dive/day-06.html#health-grace%EC%99%80-warmup%EC%9D%80-%EC%84%9C%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EC%8B%9C%EA%B0%84%EC%9D%84-%EB%B3%B4%ED%98%B8%ED%95%9C%EB%8B%A4">새 앱 준비 시간을 고려하되 로드 밸런서가 준비되지 않은 대상을 정상으로 취급하게 만들지는 않는다</a></p>
        quizzes:
          - q: EC2 시스템 검사는 정상이지만 앱 프로세스가 멈춰 ALB가 대상을 unhealthy로 표시한다. ASG는 EC2 상태 검사만 쓰고 있어
              교체하지 않는다. 새 앱은 부팅 후 4분이 필요하다. 자동 교체와 불필요한 재교체를 함께 고려할 구성은?
            answer: ASG에 ELB 상태 확인을 반영하고 앱 준비에 맞는 유예 시간을 설정한다
            wrong:
              - EC2 기본 상태 확인만 유지하고 ALB 상태 확인 간격을 줄인다
              - ASG 최대 용량만 늘리고 상태 확인 종류는 유지한다
              - ASG에서 ELB 상태 검사를 켜고 부팅 시간을 제외한 짧은 유예 시간을 사용한다
      - id: saa-r2-Q24-32
        source_id: Q24-32
        type: mcq
        title: Q24-32 · 모의고사 B
        explain: |
          <p>RTO와 RPO를 모두 통과한 후보끼리 월 상시 비용을 비교해야 한다. 훈련 결과 warm standby는 30분 RTO와 2분 RPO로 두 목표를 충족한다. Active/active도 목표를 충족하지만 월 상시 비용이 더 높다. 이 수치는 각 DR 방식의 보장 시간이 아니라 해당 시스템의 사전 용량 확보 후 실측 결과다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>양쪽 리전에서 전체 업무량을 처리할 active/active를 쓴다</td>
          <td>복구 목표는 충족하지만 월 비용 900은 warm standby의 450보다 높다. 현재 목표에 필요한 최소 상시 비용 선택은 아니다.</td>
          </tr>
          <tr>
          <td>백업을 복구 리전에 보관하고 장애 시 앱과 DB를 복원한다</td>
          <td>측정된 RTO 90분과 RPO 15분 모두 허용치를 넘는다. 저렴한 저장 비용만으로 복구 목표를 만족하지 못한다.</td>
          </tr>
          <tr>
          <td>데이터 복제와 최소 코어 자원만 가동한 pilot light를 사용한다</td>
          <td>RPO는 통과하지만 훈련 복구 55분이 RTO 45분을 넘는다. 낮은 상시 비용만으로 선택할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html">DR 전략의 복구·비용 절충</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">훈련 결과 warm standby는 30분 RTO와 2분 RPO로 두 목표를 충족한다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">Active/active도 목표를 충족하지만 월 상시 비용이 더 높다</a> · <a href="/study/lessons/deep-dive/day-13.html#%EB%B3%B5%EA%B5%AC-%EC%8B%9C%EA%B0%84%EC%9D%80-%EC%9E%91%EC%97%85-%EC%9D%98%EC%A1%B4-%EA%B4%80%EA%B3%84%EB%A1%9C-%EA%B3%84%EC%82%B0%ED%95%9C%EB%8B%A4">이 수치는 각 DR 방식의 보장 시간이 아니라 해당 시스템의 사전 용량 확보 후 실측 결과다</a></p>
        quizzes:
          - q: 핵심 앱의 DR 목표는 RTO 45분·RPO 5분이다. 동일 부하의 훈련 결과 복구 시간/데이터 손실/월비용은 백업 복원
              90분/15분/100, pilot light 55분/2분/200, warm standby 30분/2분/450,
              active-active 3분/1분/900이었다. 필요한 할당량은 확보했다. 두 목표를 만족하는 최소 상시 비용
              구성은?
            answer: 축소된 앱과 복제 DB를 운영하다 확장하는 warm standby를 쓴다
            wrong:
              - 양쪽 리전에서 전체 업무량을 처리할 active/active를 쓴다
              - 백업을 복구 리전에 보관하고 장애 시 앱과 DB를 복원한다
              - 데이터 복제와 최소 코어 자원만 가동한 pilot light를 사용한다
      - id: saa-r2-Q24-33
        source_id: Q24-33
        type: mcq
        title: Q24-33 · 모의고사 B
        explain: |
          <p>복제된 논리 오염을 과거 백업으로 되돌리되 사고 이후 정상 변경을 별도로 대조해야 한다. 논리적 오염은 복제 경로에도 전파되므로 과거 시점 백업이 필요하다. PITR은 새 DB를 만들기 때문에 데이터 검증과 그 이후 정상 업무의 대조·연결 전환을 별도 절차로 수행해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현재 reader를 승격해 과거 데이터 복원 절차를 대신한다</td>
          <td>reader에도 잘못된 SQL이 전파됐으므로 승격만으로 이전 값이 돌아오지 않는다.</td>
          </tr>
          <tr>
          <td>원본 DB를 사고 전 스냅샷으로 대체하고 사고 이후 기록은 새로 입력받는다</td>
          <td>과거 상태는 얻을 수 있어도 사고 이후 정상 업무를 대조·보존해야 한다는 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>현재 DB의 전체 스냅샷을 다른 리전에 복원하고 앱 연결을 바꾼다</td>
          <td>현재 스냅샷에는 잘못된 변경도 포함된다. 복구 위치를 바꾸는 것만으로 오염 전 데이터가 복원되지는 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html">RDS 지정 시점 복구</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#pitr%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7%EC%97%90%EC%84%9C-%EC%84%9C%EB%B9%84%EC%8A%A4-%EB%B3%B5%EA%B5%AC%EA%B9%8C%EC%A7%80">논리적 오염은 복제 경로에도 전파되므로 과거 시점 백업이 필요하다</a> · <a href="/study/lessons/deep-dive/day-07.html#pitr%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7%EC%97%90%EC%84%9C-%EC%84%9C%EB%B9%84%EC%8A%A4-%EB%B3%B5%EA%B5%AC%EA%B9%8C%EC%A7%80">PITR은 새 DB를 만들기 때문에 데이터 검증과 그 이후 정상 업무의 대조·연결 전환을 별도 절차로 수행해야 한다</a></p>
        quizzes:
          - q: 잘못된 SQL이 RDS 환자 연락처를 바꾸었고 읽기 복제본에도 반영되었다. 변경 직전까지의 백업은 있다. 사고 뒤 정상 접수도 계속
              기록되어 이를 잃으면 안 된다. 올바른 연락처와 이후 정상 업무를 함께 복구할 두 조치는?
            answer: 변경 전 시점으로 새 DB를 PITR 복원한다
            wrong:
              - 현재 reader를 승격해 과거 데이터 복원 절차를 대신한다
              - 원본 DB를 사고 전 스냅샷으로 대체하고 사고 이후 기록은 새로 입력받는다
              - 현재 DB의 전체 스냅샷을 다른 리전에 복원하고 앱 연결을 바꾼다
            answers:
              - 변경 전 시점으로 새 DB를 PITR 복원한다
              - 복원 데이터 검증과 정상 변경 대조 후 앱 전환·병합 절차를 수행한다
            options:
              - 현재 reader를 승격해 과거 데이터 복원 절차를 대신한다
              - 원본 DB를 사고 전 스냅샷으로 대체하고 사고 이후 기록은 새로 입력받는다
              - 현재 DB의 전체 스냅샷을 다른 리전에 복원하고 앱 연결을 바꾼다
              - 변경 전 시점으로 새 DB를 PITR 복원한다
              - 복원 데이터 검증과 정상 변경 대조 후 앱 전환·병합 절차를 수행한다
      - id: saa-r2-Q24-34
        source_id: Q24-34
        type: mcq
        title: Q24-34 · 모의고사 B
        explain: |
          <p>롤백 기간의 새 쓰기까지 이전 앱에서 읽을 수 있도록 두 스키마를 함께 유지해야 한다. 추가형 스키마를 적용하고 기존 데이터를 backfill한 뒤 중간 앱을 배포한다. 새 AMI에서도 롤백 기간 동안 두 열을 계속 갱신해야 기존 데이터와 전환 후 새 주문 모두 이전 앱에서 읽을 수 있다. 이 상태에서 트래픽을 전환하고 롤백 기간이 끝난 뒤 기존 열을 제거하면 코드 복귀와 데이터 호환을 함께 만족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>별도 DB 복제 → 새 AMI와 복제 DB로 전환 → 장애 시 이전 ASG와 기존 DB로 전환</td>
          <td>새 DB에만 들어간 주문은 기존 DB에 반영되지 않는다. 역방향 데이터 동기화가 없는 이 구성에서는 이전 DB로 즉시 전환하면 주문을 잃는다.</td>
          </tr>
          <tr>
          <td>기존 열 이름 변경 → 새 AMI 전환 → 장애 시 ALB를 이전 ASG로 전환해 기존 DB에 연결</td>
          <td>이전 앱이 읽는 기존 열이 없어져 ALB를 되돌려도 앱이 동작하지 않는다. 트래픽 전환과 스키마 롤백은 별개다.</td>
          </tr>
          <tr>
          <td>배포 직전 스냅샷을 보관하고 장애 시 복원한 DB와 이전 ASG로 전환한다</td>
          <td>배포 전 스냅샷에는 전환 이후 주문이 없다. 스냅샷 복원만으로 주문 손실 없는 즉시 복귀를 보장하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/whitepapers/latest/blue-green-deployments/best-practices-for-managing-data-synchronization-and-schema-changes.html">스키마 변경과 blue/green 분리</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-12.html#%EA%B5%AC%EC%8B%A0-%EC%95%B1-%EA%B3%B5%EC%A1%B4%EA%B3%BC-expand-contract">추가형 스키마를 적용하고 기존 데이터를 backfill한 뒤 중간 앱을 배포한다</a> · <a href="/study/lessons/deep-dive/day-06.html#%EC%83%88-%EC%9D%B4%EB%AF%B8%EC%A7%80-%EB%B0%B0%ED%8F%AC%EC%99%80-%EB%90%98%EB%8F%8C%EB%A6%AC%EA%B8%B0%EC%9D%98-%EB%B2%94%EC%9C%84">새 AMI에서도 롤백 기간 동안 두 열을 계속 갱신해야 기존 데이터와 전환 후 새 주문 모두 이전 앱에서 읽을 수 있다</a> · <a href="/study/lessons/deep-dive/day-12.html#%EA%B5%AC%EC%8B%A0-%EC%95%B1-%EA%B3%B5%EC%A1%B4%EA%B3%BC-expand-contract">이 상태에서 트래픽을 전환하고 롤백 기간이 끝난 뒤 기존 열을 제거하면 코드 복귀와 데이터 호환을 함께 만족한다</a></p>
        quizzes:
          - q: 새 AMI는 결제 상태를 새 열에서 읽고 이전 앱은 기존 열만 읽는다. ALB 전환 뒤에도 주문 쓰기는 계속되며 10분 안에는 주문 손실
              없이 이전 앱으로 복귀해야 한다. 두 열을 함께 쓰는 중간 앱은 검증했다. 안전한 배포 순서는?
            answer: 새 열 추가·backfill → 중간 앱과 새 앱의 두 열 쓰기 → 롤백 기간 뒤 기존 열 제거
            wrong:
              - 별도 DB 복제 → 새 AMI와 복제 DB로 전환 → 장애 시 이전 ASG와 기존 DB로 전환
              - 기존 열 이름 변경 → 새 AMI 전환 → 장애 시 ALB를 이전 ASG로 전환해 기존 DB에 연결
              - 배포 직전 스냅샷을 보관하고 장애 시 복원한 DB와 이전 ASG로 전환한다
      - id: saa-r2-Q24-35
        source_id: Q24-35
        type: mcq
        title: Q24-35 · 모의고사 B
        explain: |
          <p>Route 53 전환은 새 DNS 응답에 반영되며 이미 저장한 주소나 연결을 즉시 옮기지 않는다. 사전에 TTL을 낮추고 실패한 연결이 제한된 백오프 뒤 DNS를 재조회하게 해야 옛 주소에 머무는 두 원인을 함께 줄인다. 실제 탐지·캐시·재연결 시간은 복구 훈련에서 측정한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>TTL 5분과 앱의 IP 재사용은 유지하고 Route 53 상태 확인 간격만 줄인다</td>
          <td>장애 탐지는 빨라질 수 있지만 기존 DNS 캐시와 앱의 같은 IP 재사용은 그대로 남는다.</td>
          </tr>
          <tr>
          <td>사전에 TTL을 낮추되 앱은 재연결 시 기존 IP를 최소 5분간 계속 사용하게 한다</td>
          <td>DNS TTL을 낮춰도 앱이 자체적으로 기존 IP를 5분간 재사용하면 새 응답의 정상 주소로 이동하지 못한다.</td>
          </tr>
          <tr>
          <td>TTL 5분은 유지하고 앱은 매초 같은 목적지 IP로 연결을 재시도한다</td>
          <td>같은 옛 IP를 자주 호출해도 새 DNS 주소를 사용하지 않는다. 불필요한 반복 연결이 늘고 5분 캐시 지연도 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#dns-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%A0%84%ED%99%98-%EC%8B%9C%EA%B0%84">DNS 정책은 새 질의의 응답 대상을 바꾸며 클라이언트가 보관한 TTL이나 기존 연결을 즉시 이주시키지 않는다</a> · <a href="/study/lessons/deep-dive/day-09.html#dns-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%A0%84%ED%99%98-%EC%8B%9C%EA%B0%84">장애 탐지·캐시 만료·재연결까지 측정해야 실제 RTO를 추정할 수 있다</a> · <a href="/study/lessons/deep-dive/day-06.html#%EC%9E%A5%EC%95%A0-%EB%95%8C-%ED%99%95%EC%9E%A5%ED%95%98%EB%8A%94-%EB%8A%A5%EB%A0%A5%EB%8F%84-%EB%AF%B8%EB%A6%AC-%ED%99%95%EB%B3%B4%ED%95%98%EA%B8%B0">실패 연결의 재시도는 횟수·기한과 백오프로 제한해 복구 부하를 관리한다</a></p>
        quizzes:
          - q: Route 53이 정상 대기 리전으로 응답을 바꾼 뒤에도 일부 앱은 옛 주소로 수분간 재접속한다. 기존 DNS TTL은 5분이며 앱은
              실패한 연결의 목적지 IP를 재사용한다. 다음 복구 훈련 전에 DNS와 앱 설정을 바꿀 수 있다. 캐시·재연결 지연을
              함께 줄일 변경은?
            answer: 사전에 TTL을 낮추고 연결 실패 시 제한된 백오프 후 DNS를 다시 조회해 재연결한다
            wrong:
              - TTL 5분과 앱의 IP 재사용은 유지하고 Route 53 상태 확인 간격만 줄인다
              - 사전에 TTL을 낮추되 앱은 재연결 시 기존 IP를 최소 5분간 계속 사용하게 한다
              - TTL 5분은 유지하고 앱은 매초 같은 목적지 IP로 연결을 재시도한다
      - id: saa-r2-Q24-36
        source_id: Q24-36
        type: mcq
        title: Q24-36 · 모의고사 B
        explain: |
          <p>재시도 집중을 분산하는 동작과 이미 완료한 청구를 중복 수행하지 않는 업무 키가 함께 필요하다. 복구 후 재시도 동기화를 줄이려면 간격을 늘리고 분산하며 최대 시도·시간을 제한해야 한다. 네트워크 응답 유실 뒤 이미 성공한 청구가 재실행될 수 있으므로 업무 멱등성도 함께 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 클라이언트에 같은 고정 재시도 간격을 둔다</td>
          <td>동일 시점 재시도가 겹쳐 복구 직후 부하 파동이 계속될 수 있다.</td>
          </tr>
          <tr>
          <td>지수 백오프와 지터만 적용하고 결제마다 새로운 요청 ID로 재전송한다</td>
          <td>재시도 집중은 줄지만 이미 성공한 결제를 새 요청으로 실행해 중복 청구할 수 있다. 같은 업무의 멱등 키를 유지해야 한다.</td>
          </tr>
          <tr>
          <td>고정 간격을 길게 하고 같은 멱등 키로 모든 소비자가 동시에 재시도한다</td>
          <td>중복 청구는 줄일 수 있지만 재시도 시점이 여전히 동기화되어 복구된 API의 재과부하를 유발할 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-10.html">10일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">AWS 공식 설계·기능 문서</a> · <a href="https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/">타임아웃·재시도·백오프·지터</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%EC%9E%A5%EC%95%A0-%EB%95%8C-%ED%99%95%EC%9E%A5%ED%95%98%EB%8A%94-%EB%8A%A5%EB%A0%A5%EB%8F%84-%EB%AF%B8%EB%A6%AC-%ED%99%95%EB%B3%B4%ED%95%98%EA%B8%B0">복구 후 재시도 동기화를 줄이려면 간격을 늘리고 분산하며 최대 시도·시간을 제한해야 한다</a> · <a href="/study/lessons/deep-dive/day-06.html#%EC%9E%A5%EC%95%A0-%EB%95%8C-%ED%99%95%EC%9E%A5%ED%95%98%EB%8A%94-%EB%8A%A5%EB%A0%A5%EB%8F%84-%EB%AF%B8%EB%A6%AC-%ED%99%95%EB%B3%B4%ED%95%98%EA%B8%B0">네트워크 응답 유실 뒤 이미 성공한 청구가 재실행될 수 있으므로 업무 멱등성도 함께 필요하다</a></p>
        quizzes:
          - q: 외부 결제 API가 복구되자 수백 개 소비자가 동시에 같은 주기로 재시도해 다시 과부하가 난다. 이전 요청의 응답이 유실되었을 수 있어
              중복 청구도 막아야 한다. 처리 지연은 허용할 때 가장 적절한 재시도 설계는?
            answer: 재시도 상한·백오프·지터와 업무 멱등성을 적용한다
            wrong:
              - 모든 클라이언트에 같은 고정 재시도 간격을 둔다
              - 지수 백오프와 지터만 적용하고 결제마다 새로운 요청 ID로 재전송한다
              - 고정 간격을 길게 하고 같은 멱등 키로 모든 소비자가 동시에 재시도한다
      - id: saa-r2-Q24-37
        source_id: Q24-37
        type: mcq
        title: Q24-37 · 모의고사 B
        explain: |
          <p>SMB·AD 호환성과 AZ 장애 대응을 유지하면서 파일 서버 운영을 관리형으로 옮겨야 한다. 기존 앱의 SMB·AD 연동 요구를 유지하면서 파일 서버 가용성을 높여야 하므로 FSx for Windows의 지원 배치를 검토한다. 앱을 객체 API로 재작성하거나 독립 로컬 볼륨을 공유처럼 취급할 수는 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>서로 다른 AZ의 Windows EC2 두 대에 파일 서버 클러스터를 직접 구성한다</td>
          <td>기능과 가용성을 구성할 수 있지만 Windows 서버·스토리지·클러스터 패치를 직접 운영해야 해 관리형 FSx보다 부담이 크다.</td>
          </tr>
          <tr>
          <td>EC2 Windows 파일 서버 한 대와 별도 정기 EBS 스냅샷을 운영한다</td>
          <td>SMB 호환은 가능하지만 단일 서버 장애와 패치·복구 운영 부담 감소가 충분하지 않다.</td>
          </tr>
          <tr>
          <td>앱마다 별도 Windows 파일 서버와 독립 파일 사본을 유지한다</td>
          <td>동일 공유 경로의 일관성과 중앙 운영 대신 동기화·서버 관리 부담이 늘어난다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#ebs-multi-attach%EC%99%80-fsx-%EC%84%A0%ED%83%9D">기존 앱의 SMB·AD 연동 요구를 유지하면서 파일 서버 가용성을 높여야 하므로 FSx for Windows의 지원 배치를 검토한다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-multi-attach%EC%99%80-fsx-%EC%84%A0%ED%83%9D">앱을 객체 API로 재작성하거나 독립 로컬 볼륨을 공유처럼 취급할 수는 없다</a></p>
        quizzes:
          - q: 레거시 문서 앱은 여러 Windows 서버에서 같은 SMB 경로와 AD 권한을 사용한다. 앱 코드를 바꾸지 않고 파일 서버의 AZ 장애에도
              서비스를 이어가며 OS 패치 부담을 줄여야 한다. 가장 적합한 저장 계층은?
            answer: 요구에 맞는 다중 AZ FSx for Windows File Server
            wrong:
              - 서로 다른 AZ의 Windows EC2 두 대에 파일 서버 클러스터를 직접 구성한다
              - EC2 Windows 파일 서버 한 대와 별도 정기 EBS 스냅샷을 운영한다
              - 앱마다 별도 Windows 파일 서버와 독립 파일 사본을 유지한다
      - id: saa-r2-Q24-38
        source_id: Q24-38
        type: mcq
        title: Q24-38 · 모의고사 B
        explain: |
          <p>다중 AZ 내구성을 가진 공용 NFS와 자동 증설되는 클라이언트 접근이 필요하다. 다중 AZ의 Linux 클라이언트가 같은 NFS 파일 시스템을 공유해야 하므로 Regional EFS가 적합하다. 용량 관리 부담을 줄이되 처리량·지연·네트워크 접근 설정은 워크로드에 맞게 선택해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>한 AZ의 EC2 NFS 서버 한 대에 공유 EBS를 연결한다</td>
          <td>NFS 공유는 가능하지만 단일 AZ 데이터·파일 서버 운영 부담이 조건과 충돌한다.</td>
          </tr>
          <tr>
          <td>EFS One Zone을 사용해 같은 NFS 경로를 제공한다</td>
          <td>NFS는 맞지만 저장소를 한 AZ에만 두지 않는 조건을 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>두 AZ의 EC2 NFS 클러스터와 복제 스토리지를 직접 운영한다</td>
          <td>공유 NFS와 장애 대비는 설계할 수 있지만 파일 서버 용량·복제·패치를 직접 관리해야 하므로 운영 요구에 EFS가 더 적합하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#efs-%EB%A7%88%EC%9A%B4%ED%8A%B8%EC%99%80-%EC%B2%98%EB%A6%AC%EB%9F%89">다중 AZ의 Linux 클라이언트가 같은 NFS 파일 시스템을 공유해야 하므로 Regional EFS가 적합하다</a> · <a href="/study/lessons/deep-dive/day-03.html#efs-%EB%A7%88%EC%9A%B4%ED%8A%B8%EC%99%80-%EC%B2%98%EB%A6%AC%EB%9F%89">용량 관리 부담을 줄이되 처리량·지연·네트워크 접근 설정은 워크로드에 맞게 선택해야 한다</a></p>
        quizzes:
          - q: Linux 빌드 작업자가 두 AZ에서 같은 NFS 파일 경로를 동시에 사용한다. 새 작업자가 자동으로 늘어나며 AZ 하나가 사라져도 파일이
              남아야 한다. 고정 파일 서버 용량·패치 운영을 피할 저장 계층은?
            answer: 요구 처리량을 구성한 Regional EFS
            wrong:
              - 한 AZ의 EC2 NFS 서버 한 대에 공유 EBS를 연결한다
              - EFS One Zone을 사용해 같은 NFS 경로를 제공한다
              - 두 AZ의 EC2 NFS 클러스터와 복제 스토리지를 직접 운영한다
      - id: saa-r2-Q24-39
        source_id: Q24-39
        type: mcq
        title: Q24-39 · 모의고사 B
        explain: |
          <p>멀티파트 재시도 범위와 S3 성공 쓰기의 읽기 일관성을 구분해 적용해야 한다. 큰 업로드의 재전송 범위를 줄이려면 멀티파트를 사용하며 S3는 성공한 객체 쓰기에 강력한 읽기 일관성을 제공한다. 완료 전 부분 객체를 완성 객체처럼 읽는다는 뜻은 아니며 미완료 파트 정리도 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>단일 PUT에 SDK 재시도를 켜고 오류마다 전체 객체를 다시 업로드한다</td>
          <td>재시도는 가능하지만 성공한 파트를 재사용하지 않아 실패 부분만 재전송한다는 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>쓰기 성공 뒤 별도 지연 큐로 일정 시간 기다린 후 S3를 읽게 한다</td>
          <td>S3의 성공한 객체 쓰기는 강력한 읽기 일관성을 제공한다. 직접 S3 읽기에 별도 고정 대기는 필요하지 않다.</td>
          </tr>
          <tr>
          <td>긴 만료 시간의 S3 사전 서명 URL로 클라이언트 업로드를 허용한다</td>
          <td>사전 서명 URL은 요청의 제한된 인증 수단이다. URL 만료 시간을 늘리는 것만으로 업로드를 파트별로 나누거나 실패 파트만 재전송하게 되지는 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html#ConsistencyModel">추가 공식 기능 근거</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html">S3 멀티파트 업로드</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#%EC%97%85%EB%A1%9C%EB%93%9C%EC%A7%91%EA%B3%84%EC%9A%94%EA%B8%88-%EB%B6%80%EB%8B%B4-%EC%A3%BC%EC%B2%B4">멀티파트는 실패한 파트만 다시 보내고 완료해야 최종 객체가 생긴다</a> · <a href="/study/lessons/deep-dive/day-03.html#%EA%B0%9D%EC%B2%B4-api%EC%99%80-%EB%B2%84%EC%A0%84%EB%B3%84-%EC%82%AD%EC%A0%9C">일반 S3는 성공한 쓰기 뒤 후속 직접 읽기에 강한 일관성을 제공한다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EA%B5%AC%EB%A7%A4%EC%9E%90-%EA%B6%8C%ED%95%9C%EA%B3%BC-s3-%EC%9B%90%EB%B3%B8-%EA%B6%8C%ED%95%9C">사전 서명 URL은 특정 작업과 객체의 제한된 인증이며 전송 분할 기능과 별개다</a></p>
        quizzes:
          - q: 대용량 의료 영상을 S3 일반 버킷으로 직접 업로드한다. 연결이 끊겨도 이미 보낸 데이터는 재사용하고 실패 부분만 다시 보내려 한다.
              다운로드 앱도 CloudFront 없이 S3를 직접 읽으며 성공 응답을 받은 최신 쓰기를 즉시 확인해야 한다. 맞는 두
              조치는?
            answer: 일반 S3의 성공한 객체 쓰기 뒤 강력한 읽기 일관성을 이용한다
            wrong:
              - 단일 PUT에 SDK 재시도를 켜고 오류마다 전체 객체를 다시 업로드한다
              - 쓰기 성공 뒤 별도 지연 큐로 일정 시간 기다린 후 S3를 읽게 한다
              - 긴 만료 시간의 S3 사전 서명 URL로 클라이언트 업로드를 허용한다
            answers:
              - 일반 S3의 성공한 객체 쓰기 뒤 강력한 읽기 일관성을 이용한다
              - 멀티파트 업로드로 실패한 파트만 다시 전송한다
            options:
              - 일반 S3의 성공한 객체 쓰기 뒤 강력한 읽기 일관성을 이용한다
              - 단일 PUT에 SDK 재시도를 켜고 오류마다 전체 객체를 다시 업로드한다
              - 쓰기 성공 뒤 별도 지연 큐로 일정 시간 기다린 후 S3를 읽게 한다
              - 긴 만료 시간의 S3 사전 서명 URL로 클라이언트 업로드를 허용한다
              - 멀티파트 업로드로 실패한 파트만 다시 전송한다
      - id: saa-r2-Q24-40
        source_id: Q24-40
        type: mcq
        title: Q24-40 · 모의고사 B
        explain: |
          <p>볼륨의 IOPS·처리량 두 병목을 모두 해소하면서 이미 검증된 후보 중 비용을 비교해야 한다. 필요 처리량은 10,000 × 16KiB로 약 156MiB/s다. gp3 12,000 IOPS·250MiB/s는 두 요구와 인스턴스 한도 안에 있고 지연도 검증되었다. gp3는 용량과 독립적으로 성능을 조정할 수 있으므로 추가 용량이나 더 비싼 io2가 필요하지 않다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>io2 1TiB에 12,000 IOPS를 설정하고 데이터를 옮긴다</td>
          <td>io2도 성능 목표를 충족하지만 리허설과 견적상 gp3 성능 조정보다 3배 비싸다. 이 문제에는 io2가 필요한 추가 지연 조건이 없다.</td>
          </tr>
          <tr>
          <td>EBS 한도가 32,000 IOPS인 인스턴스로 변경한다</td>
          <td>현재 인스턴스 한도는 이미 요구량보다 높다. 인스턴스만 바꾸어도 기존 gp3 볼륨의 설정 한도는 남는다.</td>
          </tr>
          <tr>
          <td>gp3를 2TiB로 늘리고 IOPS·처리량은 3,000·125MiB/s로 유지한다</td>
          <td>gp3는 용량과 별도로 성능을 설정한다. 데이터 용량만 늘리면 현재 두 성능 한도는 그대로다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html">gp3 용량과 독립적인 성능 설정</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#cpu-%ED%81%AC%EB%A0%88%EB%94%A7%EA%B3%BC-%EC%A0%84%EC%B2%B4-io-%EA%B2%BD%EB%A1%9C">필요 처리량은 10,000 × 16KiB로 약 156MiB/s다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">gp3 12,000 IOPS·250MiB/s는 두 요구와 인스턴스 한도 안에 있고 지연도 검증되었다</a> · <a href="/study/lessons/deep-dive/day-03.html#ebs-%EC%84%B1%EB%8A%A5%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7-%EC%B4%88%EA%B8%B0%ED%99%94">gp3는 용량과 독립적으로 성능을 조정할 수 있으므로 추가 용량이나 더 비싼 io2가 필요하지 않다</a></p>
        quizzes:
          - q: EC2 DB의 1TiB gp3는 3,000 IOPS·125MiB/s에서 포화된다. 피크는 16KiB I/O 초당 10,000회이며 인스턴스
              한도는 16,000 IOPS·1,000MiB/s다. 동일 부하 시험에서 gp3 12,000 IOPS·250MiB/s와
              io2 12,000 IOPS 모두 지연 목표를 통과했고 io2 증분 비용은 3배다. 최소 비용 개선은?
            answer: gp3를 1TiB로 두고 12,000 IOPS·250MiB/s를 설정한다
            wrong:
              - io2 1TiB에 12,000 IOPS를 설정하고 데이터를 옮긴다
              - EBS 한도가 32,000 IOPS인 인스턴스로 변경한다
              - gp3를 2TiB로 늘리고 IOPS·처리량은 3,000·125MiB/s로 유지한다
      - id: saa-r2-Q24-41
        source_id: Q24-41
        type: mcq
        title: Q24-41 · 모의고사 B
        explain: |
          <p>현재 x86 모듈과 납기를 만족하는 후보를 먼저 거른 뒤 처리 목표와 비용을 비교해야 한다. c7i는 x86 현재 모듈을 사용할 수 있고 작업 20분으로 목표를 충족한다. m7i도 목표를 충족하지만 비용이 16으로 더 높다. 후보별 실측과 현재 모듈 호환성·납기를 함께 적용하면 c7i가 최소 비용 선택이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>r7i와 현재 상용 모듈을 배포한다</td>
          <td>x86 호환은 만족하지만 측정된 28분은 25분 처리 목표를 넘으며 비용도 더 높다.</td>
          </tr>
          <tr>
          <td>가장 짧은 측정 시간과 최저 비용을 보인 c7g 대체 모듈을 채택한다</td>
          <td>시험 수치가 좋더라도 기존 x86 전용 모듈 유지·2주 납기를 충족하지 않는다. 호환성이 확보된 후보끼리 비교해야 한다.</td>
          </tr>
          <tr>
          <td>m7i와 현재 상용 모듈을 배포한다</td>
          <td>현재 모듈과 25분 목표는 만족하지만 같은 조건을 충족하는 c7i보다 작업별 비용이 높다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html">EC2 인스턴스 유형과 CPU 아키텍처</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-02.html#ami%EC%99%80-%EC%9D%B8%EC%8A%A4%ED%84%B4%EC%8A%A4-%EC%9C%A0%ED%98%95%EC%9D%98-%EC%A1%B0%ED%95%A9">c7i는 x86 현재 모듈을 사용할 수 있고 작업 20분으로 목표를 충족한다</a> · <a href="/study/lessons/deep-dive/day-02.html#ami%EC%99%80-%EC%9D%B8%EC%8A%A4%ED%84%B4%EC%8A%A4-%EC%9C%A0%ED%98%95%EC%9D%98-%EC%A1%B0%ED%95%A9">m7i도 목표를 충족하지만 비용이 16으로 더 높다</a> · <a href="/study/lessons/deep-dive/day-02.html#ami%EC%99%80-%EC%9D%B8%EC%8A%A4%ED%84%B4%EC%8A%A4-%EC%9C%A0%ED%98%95%EC%9D%98-%EC%A1%B0%ED%95%A9">후보별 실측과 현재 모듈 호환성·납기를 함께 적용하면 c7i가 최소 비용 선택이다</a></p>
        quizzes:
          - q: 배치를 2주 안에 이전해야 하고 현재 모듈은 x86 전용이다. Arm 버전 공급은 3개월 뒤다. 작업별 시험 결과 시간/비용은 c7i
              20분/10, m7i 23분/16, r7i 28분/20이다. Arm 대체 모듈의 c7g는 18분/8이지만 현재 상용
              모듈과 검증되지 않았다. 25분 처리 목표와 현재 모듈 유지를 만족할 최소 비용 후보는?
            answer: c7i와 현재 상용 모듈을 배포한다
            wrong:
              - r7i와 현재 상용 모듈을 배포한다
              - 가장 짧은 측정 시간과 최저 비용을 보인 c7g 대체 모듈을 채택한다
              - m7i와 현재 상용 모듈을 배포한다
      - id: saa-r2-Q24-42
        source_id: Q24-42
        type: mcq
        title: Q24-42 · 모의고사 B
        explain: |
          <p>콜드 스타트나 동시성이 아니라 호출당 계산 자원과 실행 시간의 관계를 측정해야 한다. 일반 Lambda 모델은 메모리 설정과 CPU 배정이 연계되므로 더 큰 메모리가 실행 시간을 충분히 줄이면 비용도 줄 수 있다. 호출당 자원·시간을 실제 측정하고 외부 대기 병목인지도 구분해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>메모리를 현재 값에 고정하고 호출을 더 작은 여러 Lambda로 병렬 분할한다</td>
          <td>분할은 코드·조정 비용을 추가한다. 현재 함수의 메모리와 연계된 CPU 증가 효과를 먼저 측정하는 것이 더 직접적이다.</td>
          </tr>
          <tr>
          <td>Reserved concurrency를 높이고 메모리 설정은 그대로 둔다</td>
          <td>동시 실행은 한 호출의 CPU 배정이 아니라 실행 수를 제어한다.</td>
          </tr>
          <tr>
          <td>Provisioned concurrency를 늘려 초기화가 끝난 호출의 계산 시간을 줄인다</td>
          <td>초기화 지연을 줄이는 설정이며 이미 실행 중인 CPU 계산 성능을 늘리는 설정은 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html">Lambda 메모리와 CPU 할당</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#lambda-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%EC%96%B4">일반 Lambda 모델은 메모리 설정과 CPU 배정이 연계되므로 더 큰 메모리가 실행 시간을 충분히 줄이면 비용도 줄 수 있다</a> · <a href="/study/lessons/day-10.html#%EB%A9%94%EB%AA%A8%EB%A6%ACcpu%EC%8B%A4%ED%96%89-%EC%8B%9C%EA%B0%84%EA%B3%BC-%EB%B9%84%EC%9A%A9">호출당 자원·시간을 실제 측정하고 외부 대기 병목인지도 구분해야 한다</a></p>
        quizzes:
          - q: 문서 변환 Lambda의 초기화 뒤 실행 대부분은 CPU 계산이며 외부 I/O와 메모리 부족은 없다. 호출 수를 그대로 유지하면서 지연
              목표를 맞추고 비용도 낮추려 한다. 어떤 설정을 시험해 선택해야 하는가?
            answer: 메모리별 실행 시간과 비용을 측정해 CPU 증가 효과를 비교한다
            wrong:
              - 메모리를 현재 값에 고정하고 호출을 더 작은 여러 Lambda로 병렬 분할한다
              - Reserved concurrency를 높이고 메모리 설정은 그대로 둔다
              - Provisioned concurrency를 늘려 초기화가 끝난 호출의 계산 시간을 줄인다
      - id: saa-r2-Q24-43
        source_id: Q24-43
        type: mcq
        title: Q24-43 · 모의고사 B
        explain: |
          <p>목표는 허용 대기시간/처리시간이고 현재 적체량은 대기메시지/실행 작업자 수다. 목표 적체량은 허용 대기 시간 120초를 메시지당 평균 처리 시간 3초로 나눈 40개/대다. 현재 지표는 visible 800개를 InService 10대로 나눈 80개/대이므로 목표보다 높아 확장이 필요한 상태다. 이는 정상 상태의 용량 계획 근사이며 기동 지연 등은 별도로 여유를 둔다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>목표 40개/대, 현재 800개/대로 계산한다</td>
          <td>800은 큐 전체 메시지 수다. 인스턴스당 지표에는 현재 처리자 10대로 나누어야 한다.</td>
          </tr>
          <tr>
          <td>목표 360개/대, 현재 80개/대로 계산한다</td>
          <td>현재 적체량 80개/대는 맞지만 목표는 대기120초를 처리3초로 나눈40개/대다. 두 시간을 곱한360은 허용 대기 목표를 나타내지 않는다.</td>
          </tr>
          <tr>
          <td>목표 120개/대, 현재 80개/대로 계산한다</td>
          <td>120은 초 단위의 대기 시간이다. 이를 메시지 수 목표로 쓰면 인스턴스당 약 360초의 대기 적체를 허용하게 된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html">SQS backlog per instance 목표 계산</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-06.html#%ED%81%90-%EC%9E%91%EC%97%85%EC%9E%90%EC%9D%98-%EC%A0%81%EC%B2%B4%EB%9F%89%EC%9D%84-%EA%B3%84%EC%82%B0%ED%95%98%EA%B8%B0">목표 적체량은 허용 대기 시간 120초를 메시지당 평균 처리 시간 3초로 나눈 40개/대다</a> · <a href="/study/lessons/deep-dive/day-06.html#%ED%81%90-%EC%9E%91%EC%97%85%EC%9E%90%EC%9D%98-%EC%A0%81%EC%B2%B4%EB%9F%89%EC%9D%84-%EA%B3%84%EC%82%B0%ED%95%98%EA%B8%B0">현재 지표는 visible 800개를 InService 10대로 나눈 80개/대이므로 목표보다 높아 확장이 필요한 상태다</a> · <a href="/study/lessons/deep-dive/day-06.html#%ED%81%90-%EC%9E%91%EC%97%85%EC%9E%90%EC%9D%98-%EC%A0%81%EC%B2%B4%EB%9F%89%EC%9D%84-%EA%B3%84%EC%82%B0%ED%95%98%EA%B8%B0">이는 정상 상태의 용량 계획 근사이며 기동 지연 등은 별도로 여유를 둔다</a></p>
        quizzes:
          - q: 작업자 ASG의 인스턴스는 한 번에 메시지 하나를 평균 3초에 처리한다. 정상 상태에서 큐 대기는 120초 이하가 목표다. 현재
              visible 메시지 800개와 InService 작업자 10대가 있다. 원시 큐 길이 대신 작업자당 적체량으로 확장할
              때 목표와 현재 지표는?
            answer: 목표 40개/대, 현재 80개/대로 계산한다
            wrong:
              - 목표 40개/대, 현재 800개/대로 계산한다
              - 목표 360개/대, 현재 80개/대로 계산한다
              - 목표 120개/대, 현재 80개/대로 계산한다
      - id: saa-r2-Q24-44
        source_id: Q24-44
        type: mcq
        title: Q24-44 · 모의고사 B
        explain: |
          <p>서로 다른 키의 만료 분산과 여러 앱에 걸친 같은 키의 중복 로딩 억제가 각각 필요하다. 20~30초 TTL 지터는 최대 30초의 허용 신선도를 지키면서 서로 다른 키의 만료 시점을 분산한다. 공유 키별 잠금은 여러 앱에 걸친 동일 키의 원본 적재를 한 요청으로 합친다. 잠금에는 만료·타임아웃과 로더 실패 시 복구를 두어야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 키의 TTL을 30초로 유지하고 캐시 노드의 메모리만 늘린다</td>
          <td>메모리 증설은 동일 TTL의 동시 만료나 같은 키를 여러 앱이 재적재하는 동기화를 직접 해결하지 않는다.</td>
          </tr>
          <tr>
          <td>각 앱 인스턴스에 원본 읽기용 동시 실행 세마포어를 둔다</td>
          <td>앱별 세마포어는 전체 원본 부하를 제한하는 데 도움이 되지만 여러 앱의 동일 키 중복 적재를 하나로 합치거나 키 만료를 분산하지 않는다.</td>
          </tr>
          <tr>
          <td>각 앱 인스턴스 내부에서 키별 mutex로 원본 읽기를 직렬화한다</td>
          <td>로컬 mutex는 한 앱 안의 중복만 합친다. 앱 100개가 각각 동일 키를 다시 읽는 상황을 막지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://aws.amazon.com/builders-library/caching-challenges-and-strategies/">요청 병합과 캐시 부하</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#cache-aside%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C%EC%99%80-%EC%8B%A0%EC%84%A0%EB%8F%84">20~30초 TTL 지터는 최대 30초의 허용 신선도를 지키면서 서로 다른 키의 만료 시점을 분산한다</a> · <a href="/study/lessons/deep-dive/day-08.html#cache-aside%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C%EC%99%80-%EC%8B%A0%EC%84%A0%EB%8F%84">공유 키별 잠금은 여러 앱에 걸친 동일 키의 원본 적재를 한 요청으로 합친다</a> · <a href="/study/lessons/deep-dive/day-08.html#cache-aside%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C%EC%99%80-%EC%8B%A0%EC%84%A0%EB%8F%84">잠금에는 만료·타임아웃과 로더 실패 시 복구를 두어야 한다</a></p>
        quizzes:
          - q: 100개 앱이 Redis 호환 cache-aside를 공유한다. 조회 값은 최대 30초 오래되어도 되고 결제는 원본에서 검증한다. 수천
              키의 동일 TTL이 동시에 만료되며 인기 키 하나를 여러 앱이 함께 재적재해 DB가 급증한다. 두 원인을 각각 줄일
              조치는?
            answer: 키마다 20~30초 범위에서 TTL을 임의로 선택한다
            wrong:
              - 모든 키의 TTL을 30초로 유지하고 캐시 노드의 메모리만 늘린다
              - 각 앱 인스턴스에 원본 읽기용 동시 실행 세마포어를 둔다
              - 각 앱 인스턴스 내부에서 키별 mutex로 원본 읽기를 직렬화한다
            answers:
              - 키마다 20~30초 범위에서 TTL을 임의로 선택한다
              - 공유 캐시의 키별 분산 잠금으로 한 요청이 원본을 읽고 나머지는 결과를 기다리게 한다
            options:
              - 모든 키의 TTL을 30초로 유지하고 캐시 노드의 메모리만 늘린다
              - 각 앱 인스턴스에 원본 읽기용 동시 실행 세마포어를 둔다
              - 키마다 20~30초 범위에서 TTL을 임의로 선택한다
              - 공유 캐시의 키별 분산 잠금으로 한 요청이 원본을 읽고 나머지는 결과를 기다리게 한다
              - 각 앱 인스턴스 내부에서 키별 mutex로 원본 읽기를 직렬화한다
      - id: saa-r2-Q24-45
        source_id: Q24-45
        type: mcq
        title: Q24-45 · 모의고사 B
        explain: |
          <p>생성 후 기존 테이블에 다른 파티션 키의 접근 경로를 추가하되 최종 일관성을 허용한다. 기존 테이블에 다른 파티션 키의 조회 경로가 필요하면 GSI를 검토한다. 상태 값이 적어 hot key가 생길 수 있고 인덱스 저장·쓰기에 비용이 더 들며 읽기는 최종 일관성을 전제로 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>status 키의 별도 테이블을 만들고 Streams 소비자로 원본 변경을 동기화한다</td>
          <td>별도 조회 모델도 가능하지만 동기화 소비자·오류 처리를 운영해야 한다. 지원 GSI를 추가하는 것이 요구에 더 직접적이다.</td>
          </tr>
          <tr>
          <td>상태별 전체 Scan과 필터를 운영 화면의 매 요청에 수행한다</td>
          <td>가능하지만 데이터가 커지면 전체 읽기 부담이 커져 설계한 키 조회 경로보다 비효율적이다.</td>
          </tr>
          <tr>
          <td>매 조회에서 병렬 Scan으로 status를 필터링한다</td>
          <td>병렬 Scan은 전체 읽기를 병렬화할 뿐 status별 키 조회로 바꾸지 않아 반복 저지연 화면의 읽기 비용과 지연을 키운다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SecondaryIndexes.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#%EC%A0%91%EA%B7%BC-%ED%8C%A8%ED%84%B4%EA%B3%BC-%EC%9D%B8%EB%8D%B1%EC%8A%A4%EC%9D%98-%EC%8B%A4%EC%A0%9C-%EA%B5%AC%EC%84%B1">기존 테이블에 GSI를 추가해 다른 키로 조회할 수 있고 최종 일관성과 키 쏠림을 고려한다</a></p>
        quizzes:
          - q: DynamoDB 주문 테이블은 customer_id로 조회한다. 운영자는 status별 최신 주문을 반복 조회해야 하며 약간의 인덱스 반영
              지연은 허용한다. 원본 테이블을 다시 만들지 않고 낮은 지연의 조회 경로를 추가할 최선의 설계는?
            answer: 상태 기반 GSI를 추가하고 키 쏠림·쓰기 유지 비용을 검토한다
            wrong:
              - status 키의 별도 테이블을 만들고 Streams 소비자로 원본 변경을 동기화한다
              - 상태별 전체 Scan과 필터를 운영 화면의 매 요청에 수행한다
              - 매 조회에서 병렬 Scan으로 status를 필터링한다
      - id: saa-r2-Q24-46
        source_id: Q24-46
        type: mcq
        title: Q24-46 · 모의고사 B
        explain: |
          <p>계산이나 읽기 부하가 아니라 많은 클라이언트의 DB 연결 수명 주기가 병목이다. 병목이 SQL 계산보다 연결 관리에 있으므로 지원되는 RDS Proxy의 연결 풀을 검토한다. 세션 고정·긴 트랜잭션은 재사용 효과를 줄일 수 있으며 Proxy가 결과 캐시나 SQL 최적화를 대신하지는 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Lambda 동시성을 작게 제한하고 각 실행 환경이 DB에 직접 새 연결을 만든다</td>
          <td>DB 연결을 제한할 수 있지만 처리 동시성과 지연을 희생하며 연결 재사용을 중앙화하지 않는다. 지원 RDS Proxy가 더 직접적이다.</td>
          </tr>
          <tr>
          <td>DB 인스턴스 CPU만 늘리고 연결 재사용은 하지 않는다</td>
          <td>계산에 여유가 있으므로 연결 생성이 병목인 상황에서 직접적인 개선보다 비용 부담이 커질 수 있다.</td>
          </tr>
          <tr>
          <td>읽기 복제본을 추가하고 기존 writer 연결 생성 패턴을 유지한다</td>
          <td>읽기 분산은 가능하지만 현재 writer의 연결 생성·종료 부담을 직접 풀링하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#aurora%EC%9D%98-%EA%B3%B5%EC%9C%A0-%EC%A0%80%EC%9E%A5%EC%86%8C%EC%99%80-%EC%97%B0%EA%B2%B0-%EB%B6%84%EC%82%B0">병목이 SQL 계산보다 연결 관리에 있으므로 지원되는 RDS Proxy의 연결 풀을 검토한다</a> · <a href="/study/lessons/deep-dive/day-07.html#aurora%EC%9D%98-%EA%B3%B5%EC%9C%A0-%EC%A0%80%EC%9E%A5%EC%86%8C%EC%99%80-%EC%97%B0%EA%B2%B0-%EB%B6%84%EC%82%B0">세션 고정·긴 트랜잭션은 재사용 효과를 줄일 수 있으며 Proxy가 결과 캐시나 SQL 최적화를 대신하지는 않는다</a></p>
        quizzes:
          - q: 짧은 Lambda 호출이 늘자 RDS의 연결 생성·종료와 최대 연결 수가 병목이 됐다. SQL CPU는 여유가 있고 쓰기 결과를 캐시할 수
              없다. 긴 세션 상태를 쓰지 않는 앱에서 코드 변경·연결 관리 부담을 줄일 방법은?
            answer: 지원 엔진·인증 조건에 맞는 RDS Proxy
            wrong:
              - Lambda 동시성을 작게 제한하고 각 실행 환경이 DB에 직접 새 연결을 만든다
              - DB 인스턴스 CPU만 늘리고 연결 재사용은 하지 않는다
              - 읽기 복제본을 추가하고 기존 writer 연결 생성 패턴을 유지한다
      - id: saa-r2-Q24-47
        source_id: Q24-47
        type: mcq
        title: Q24-47 · 모의고사 B
        explain: |
          <p>고정 글로벌 진입 IP·UDP·상태 기반 리전 선택을 관리형으로 제공해야 한다. UDP와 고정 Anycast 진입 IP·정상 엔드포인트 선택이 요구되므로 Global Accelerator가 적합하다. 웹 객체 캐시인 CloudFront나 S3 전송 가속과 처리 계층이 다르다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>각 리전 NLB의 주소만 별도로 배포하고 글로벌 전환은 클라이언트가 구현한다</td>
          <td>리전별 진입은 가능하지만 고정 글로벌 진입과 관리형 정상 리전 선택에 비해 클라이언트 부담이 커진다.</td>
          </tr>
          <tr>
          <td>Route 53의 상태 확인과 리전별 NLB Elastic IP를 고객 목록에 모두 등록한다</td>
          <td>리전별 고정 IP와 DNS 장애 조치는 제공하지만 하나의 글로벌 진입 IP 집합에서 DNS 캐시 없이 엔드포인트를 전환하는 요구와 다르다.</td>
          </tr>
          <tr>
          <td>Route 53 latency 정책만 구성하고 고정 진입 IP는 두지 않는다</td>
          <td>리전 DNS 선택은 가능하지만 고객이 요구하는 고정 IP 허용 목록 조건이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#dns-cdn%EA%B3%BC-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%84%A4%ED%8A%B8%EC%9B%8C%ED%81%AC-%EA%B0%80%EC%86%8D">UDP와 고정 Anycast 진입 IP·정상 엔드포인트 선택이 요구되므로 Global Accelerator가 적합하다</a> · <a href="/study/lessons/deep-dive/day-09.html#dns-cdn%EA%B3%BC-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%84%A4%ED%8A%B8%EC%9B%8C%ED%81%AC-%EA%B0%80%EC%86%8D">웹 객체 캐시인 CloudFront나 S3 전송 가속과 처리 계층이 다르다</a></p>
        quizzes:
          - q: 글로벌 UDP 게임의 접속 허용 목록은 고정된 글로벌 IP만 등록할 수 있다. 게임 서버는 두 리전에 있으며 한 리전 장애 때 앱의 DNS
              캐시 만료를 기다리지 않고 정상 엔드포인트를 선택해야 한다. 별도 글로벌 라우터를 운영하지 않을 서비스는?
            answer: 표준 AWS Global Accelerator
            wrong:
              - 각 리전 NLB의 주소만 별도로 배포하고 글로벌 전환은 클라이언트가 구현한다
              - Route 53의 상태 확인과 리전별 NLB Elastic IP를 고객 목록에 모두 등록한다
              - Route 53 latency 정책만 구성하고 고정 진입 IP는 두지 않는다
      - id: saa-r2-Q24-48
        source_id: Q24-48
        type: mcq
        title: Q24-48 · 모의고사 B
        explain: |
          <p>중복 주소의 전체 라우팅을 만들지 않고 특정 제공 서비스만 소비자에게 노출해야 한다. 특정 서비스를 제공하고 겹친 주소 공간의 전체 라우팅을 피하려면 PrivateLink 서비스 노출을 검토한다. 서비스 엔드포인트와 승인·SG·앱 인증을 구성하며 VPC 전체 연결과 구분한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>주소를 유지한 채 두 VPC를 TGW의 같은 라우트 테이블에 연결한다</td>
          <td>중복 주소 라우팅 충돌을 자동 해결하지 않아 특정 서비스 사설 노출보다 부적합하다.</td>
          </tr>
          <tr>
          <td>서로 다른 CIDR로 재주소화한 뒤 전체 VPC를 VPN으로 연결한다</td>
          <td>가능한 재설계지만 주소 재설계를 피하고 특정 서비스만 공개하려는 조건에 비해 변경 범위가 크다.</td>
          </tr>
          <tr>
          <td>중복 주소를 NAT 어플라이언스로 변환하고 VPN 사설 터널을 직접 운영한다</td>
          <td>주소 변환과 터널로 연결을 설계할 수 있지만 어플라이언스·HA·경로 운영이 늘어난다. 한 서비스 노출에는 PrivateLink가 더 직접적이다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-05.html#%EC%84%9C%EB%B9%84%EC%8A%A4%EB%A7%8C-%EC%97%B0%EA%B2%B0%ED%95%98%EB%8A%94-privatelink">특정 서비스를 제공하고 겹친 주소 공간의 전체 라우팅을 피하려면 PrivateLink 서비스 노출을 검토한다</a> · <a href="/study/lessons/deep-dive/day-05.html#%EC%84%9C%EB%B9%84%EC%8A%A4%EB%A7%8C-%EC%97%B0%EA%B2%B0%ED%95%98%EB%8A%94-privatelink">서비스 엔드포인트와 승인·SG·앱 인증을 구성하며 VPC 전체 연결과 구분한다</a></p>
        quizzes:
          - q: 인수한 회사의 VPC와 서비스 제공 VPC는 CIDR가 겹친다. 소비자는 제공자의 결제 TCP 서비스 하나만 사설로 호출하면 되고 두
              VPC의 전체 통신은 금지한다. 양쪽 주소를 바꾸지 않고 제공 서비스 접근만 승인할 방식은?
            answer: NLB 기반 서비스와 PrivateLink 엔드포인트를 구성한다
            wrong:
              - 주소를 유지한 채 두 VPC를 TGW의 같은 라우트 테이블에 연결한다
              - 서로 다른 CIDR로 재주소화한 뒤 전체 VPC를 VPN으로 연결한다
              - 중복 주소를 NAT 어플라이언스로 변환하고 VPN 사설 터널을 직접 운영한다
      - id: saa-r2-Q24-49
        source_id: Q24-49
        type: mcq
        title: Q24-49 · 모의고사 B
        explain: |
          <p>라우팅 그룹 격리와 3Gbps를 넘는 다중 터널 합산 용량을 따로 충족해야 한다. 라우트 테이블을 그룹별로 연결·전파하면 TGW 라우팅으로 운영·개발을 분리할 수 있다. 1.25Gbps 터널 두 개는 합계 한도도 2.5Gbps이므로 3Gbps를 충족할 수 없다. 두 번째 동적 VPN과 지원되는 ECMP는 네 터널에 여러 흐름을 분산할 수 있게 한다. 실제 합산 처리량은 장비·흐름 분포에도 좌우되며 단일 흐름 속도를 네 배로 만들지는 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 그룹을 기본 TGW 테이블에 연결하고 각 VPC·지사 CIDR을 자동 전파한다</td>
          <td>모든 경로가 같은 테이블에 전파되면 운영·개발 사이의 경로도 생긴다. 그룹 간 격리를 요구하는 연결 범위와 다르다.</td>
          </tr>
          <tr>
          <td>운영 지사에 두 번째 VPN을 추가하고 높은 우선순위 경로와 대기 경로로 구성한다</td>
          <td>대기 경로는 장애 복구에는 도움이 되지만 여러 연결의 대역폭을 동시에 합치는 ECMP 구성이 아니다.</td>
          </tr>
          <tr>
          <td>기존 두 터널에 서로 다른 MED를 부여해 선호 경로를 지정한다</td>
          <td>선호 경로를 지정하면 장애 시 대기 경로를 사용할 수 있지만 기존 터널 한도와 연결 개수로 총 3Gbps를 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/tgw/how-transit-gateways-work.html">TGW 라우팅 및 ECMP</a> · <a href="https://docs.aws.amazon.com/vpn/latest/s2svpn/vpn-limits.html">VPN 터널 대역폭</a>
          SAA 평가 항목: 3.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-13.html#tgw%EC%97%90%EC%84%9C-%EC%97%B0%EA%B2%B0%EA%B3%BC-%ED%97%88%EC%9A%A9-%EA%B2%BD%EB%A1%9C%EB%A5%BC-%EB%B6%84%EB%A6%AC%ED%95%9C%EB%8B%A4">라우트 테이블을 그룹별로 연결·전파하면 TGW 라우팅으로 운영·개발을 분리할 수 있다</a> · <a href="/study/lessons/deep-dive/day-13.html#tgw%EC%97%90%EC%84%9C-%EC%97%B0%EA%B2%B0%EA%B3%BC-%ED%97%88%EC%9A%A9-%EA%B2%BD%EB%A1%9C%EB%A5%BC-%EB%B6%84%EB%A6%AC%ED%95%9C%EB%8B%A4">1.25Gbps 터널 두 개는 합계 한도도 2.5Gbps이므로 3Gbps를 충족할 수 없다</a> · <a href="/study/lessons/deep-dive/day-13.html#tgw%EC%97%90%EC%84%9C-%EC%97%B0%EA%B2%B0%EA%B3%BC-%ED%97%88%EC%9A%A9-%EA%B2%BD%EB%A1%9C%EB%A5%BC-%EB%B6%84%EB%A6%AC%ED%95%9C%EB%8B%A4">두 번째 동적 VPN과 지원되는 ECMP는 네 터널에 여러 흐름을 분산할 수 있게 한다</a> · <a href="/study/lessons/deep-dive/day-13.html#tgw%EC%97%90%EC%84%9C-%EC%97%B0%EA%B2%B0%EA%B3%BC-%ED%97%88%EC%9A%A9-%EA%B2%BD%EB%A1%9C%EB%A5%BC-%EB%B6%84%EB%A6%AC%ED%95%9C%EB%8B%A4">실제 합산 처리량은 장비·흐름 분포에도 좌우되며 단일 흐름 속도를 네 배로 만들지는 않는다</a></p>
        quizzes:
          - q: 운영·개발 VPC와 각 지사가 TGW를 공유하지만 두 그룹 사이는 통신하면 안 된다. 운영 백업은 여러 TCP 흐름으로 총 3Gbps가
              필요하다. 지문 환경의 VPN 터널 한도는 1.25Gbps이고 현재 2터널 동적 VPN 하나다. 고객 장비는 다중
              BGP 경로를 동시에 쓸 수 있다. 필요한 두 조치는?
            answer: 그룹별 TGW 라우트 테이블에 연결·전파를 분리하고 반환 경로를 구성한다
            wrong:
              - 두 그룹을 기본 TGW 테이블에 연결하고 각 VPC·지사 CIDR을 자동 전파한다
              - 운영 지사에 두 번째 VPN을 추가하고 높은 우선순위 경로와 대기 경로로 구성한다
              - 기존 두 터널에 서로 다른 MED를 부여해 선호 경로를 지정한다
            answers:
              - 그룹별 TGW 라우트 테이블에 연결·전파를 분리하고 반환 경로를 구성한다
              - 운영 동적 VPN을 하나 더 만들고 동일 비용 BGP 경로와 VPN ECMP를 쓴다
            options:
              - 두 그룹을 기본 TGW 테이블에 연결하고 각 VPC·지사 CIDR을 자동 전파한다
              - 운영 지사에 두 번째 VPN을 추가하고 높은 우선순위 경로와 대기 경로로 구성한다
              - 기존 두 터널에 서로 다른 MED를 부여해 선호 경로를 지정한다
              - 그룹별 TGW 라우트 테이블에 연결·전파를 분리하고 반환 경로를 구성한다
