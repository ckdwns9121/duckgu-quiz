id: saa-r2-day-19
name: 서버리스·메시징·콘텐츠 전송
part: 19일 차
color: "#FF9900"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: saa-r2-Q19-01
        source_id: Q19-01
        type: mcq
        title: Q19-01 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>SQS는 요청 접수와 외부 서비스 처리를 분리하며 7일 보존은 72시간 중단을 넘긴다. 제공사 복구 후 작업자가 남은 메시지를 소비하면 별도 재발행 저장소를 운영할 필요가 줄어든다. 최대 이벤트 수명보다 긴 장애를 재시도만으로 견딜 수는 없으며 정상 복구 후 적체 처리 시간도 보존 기간 안에 계획해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EventBridge 대상 이벤트 수명을 24시간으로 설정하고 발송 API에 재시도한다.</td>
          <td>대상 이벤트 수명 24시간이 중단 72시간보다 짧아 별도 보관·재발행 경로가 필요하다.</td>
          </tr>
          <tr>
          <td>SQS Standard 보존을 1일로 설정하고 API와 별도 작업자가 큐를 소비하게 한다.</td>
          <td>큐를 사용해도 1일 보존이면 72시간 중단 중에 먼저 접수한 작업이 만료된다.</td>
          </tr>
          <tr>
          <td>Lambda 비동기 이벤트 수명을 6시간으로 설정하고 함수에서 이메일을 발송한다.</td>
          <td>6시간이 지난 비동기 이벤트는 별도 실패 처리 없이는 72시간 뒤 정상 재처리할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-queue-parameters.html">SQS 메시지 보존</a> · <a href="https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-configuring.html">Lambda 비동기 수명</a> · <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rule-retry-policy.html">EventBridge 대상 재시도</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">7일 보존 큐는 72시간 처리 중단 후에도 작업을 보유한다</a></p>
        quizzes:
          - q: 주문 API는 이메일 발송 작업을 접수한 직후 응답해야 한다. 외부 이메일 제공사가 최대 72시간 중단돼도 이미 접수한 작업을 보존하고
              복구 후 자동 처리해야 한다. 작업자는 멱등하게 동작하며 자체 장기 보관·재발행 코드를 최소화하려 한다. 어떤 설정이
              가장 적절한가?
            answer: SQS Standard 보존을 7일로 설정하고 API와 별도 작업자가 큐를 소비하게 한다.
            wrong:
              - EventBridge 대상 이벤트 수명을 24시간으로 설정하고 발송 API에 재시도한다.
              - SQS Standard 보존을 1일로 설정하고 API와 별도 작업자가 큐를 소비하게 한다.
              - Lambda 비동기 이벤트 수명을 6시간으로 설정하고 함수에서 이메일을 발송한다.
      - id: saa-r2-Q19-02
        source_id: Q19-02
        type: mcq
        title: Q19-02 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>visibility timeout은 처리 중 다른 소비자에게 같은 메시지가 보이지 않는 시간을 조절한다. 최대 시간에 맞추거나 처리 중 연장하면 긴 작업의 불필요한 겹침을 줄일 수 있다. Standard 큐의 중복 전달 가능성과 성공 후 삭제 응답 손실은 남으므로 작업 ID 기반 멱등 처리가 별도로 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>큐의 메시지 보존을 1일로 줄이고 기존 3분 visibility timeout을 유지한다.</td>
          <td>보존 기간은 큐에 메시지를 보관하는 기간이며 처리 중 숨김 시간이나 중복 효과를 해결하지 않는다.</td>
          </tr>
          <tr>
          <td>긴 visibility timeout을 설정하고 파일 결과에는 별도 중복 판별을 두지 않는다.</td>
          <td>숨김 시간을 늘려도 성공 후 재전달 등 모든 중복을 배제할 수 없어 멱등 처리가 필요하다.</td>
          </tr>
          <tr>
          <td>수신 직후 메시지를 삭제하고 작업 실패는 원본 파일에서 별도 발견한다.</td>
          <td>삭제 후 작업자가 실패하면 큐에 재시도할 메시지가 남지 않아 처리 신뢰성을 낮춘다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">Visibility timeout은 처리 중 재노출을 줄이지만 Standard 전달의 중복 가능성을 없애지 않는다</a> · <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">처리 시간에 맞는 비가시성 관리와 업무 식별자 기반 멱등 처리를 함께 적용해야 한다</a></p>
        quizzes:
          - q: SQS Standard 작업자가 받은 파일 변환 작업은 보통 2분이지만 드물게 12분 걸린다. 현재 visibility timeout은
              3분이며 긴 작업을 다른 작업자가 다시 받는다. 성공한 메시지의 삭제 응답을 잃어 재전달되는 사례도 있다. 불필요한
              동시 실행과 중복 결과 반영을 각각 줄일 조치 두 가지는?
            answer: visibility timeout을 작업 시간에 맞추고 긴 실행 중에는 필요에 따라 연장한다.
            wrong:
              - 큐의 메시지 보존을 1일로 줄이고 기존 3분 visibility timeout을 유지한다.
              - 긴 visibility timeout을 설정하고 파일 결과에는 별도 중복 판별을 두지 않는다.
              - 수신 직후 메시지를 삭제하고 작업 실패는 원본 파일에서 별도 발견한다.
            answers:
              - visibility timeout을 작업 시간에 맞추고 긴 실행 중에는 필요에 따라 연장한다.
              - 작업 ID로 완료 결과를 기록·확인해 재실행 시 같은 업무 효과를 중복 반영하지 않는다.
            options:
              - 큐의 메시지 보존을 1일로 줄이고 기존 3분 visibility timeout을 유지한다.
              - 긴 visibility timeout을 설정하고 파일 결과에는 별도 중복 판별을 두지 않는다.
              - visibility timeout을 작업 시간에 맞추고 긴 실행 중에는 필요에 따라 연장한다.
              - 수신 직후 메시지를 삭제하고 작업 실패는 원본 파일에서 별도 발견한다.
              - 작업 ID로 완료 결과를 기록·확인해 재실행 시 같은 업무 효과를 중복 반영하지 않는다.
      - id: saa-r2-Q19-03
        source_id: Q19-03
        type: mcq
        title: Q19-03 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>SNS의 팬아웃과 서비스별 SQS 큐를 함께 사용하면 각 소비자가 이벤트의 사본을 받고 자기 속도로 처리한다. 분석 소비가 중단돼도 해당 큐의 보존 기간 내 메시지는 남고 다른 큐의 처리는 계속된다. 큐 하나의 경쟁 소비는 작업 분산이지 모든 서비스에 사본을 제공하는 방송이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SNS HTTP 구독 세 개로 직접 전달하고 소비자 장애 복구 후 별도 보관 없이 이어간다.</td>
          <td>직접 HTTP 전달은 서비스별 내구성 있는 적체 큐를 제공하지 않으며 장시간 중단 시 별도 실패 보관·재처리 설계가 필요하다.</td>
          </tr>
          <tr>
          <td>SQS 큐 하나에 이벤트를 넣고 세 서비스가 각각 자기 작업을 실행하며 경쟁 소비한다.</td>
          <td>한 큐에서 한 소비자가 삭제한 메시지를 다른 서비스도 반드시 받는 구조가 아니어서 서비스별 실행을 보장하지 못한다.</td>
          </tr>
          <tr>
          <td>생산자가 세 서비스에 동기 HTTP 요청을 보내고 각 재시도 상태를 저장한다.</td>
          <td>동작은 구현할 수 있지만 생산자가 소비자 주소·실패·재시도를 직접 관리해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">SNS와 서비스별 SQS를 조합하면 하나의 발행을 각 소비자의 내구성 있는 큐로 fanout할 수 있다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">서비스들은 자기 큐에서 독립적으로 대기·재시도하므로 다른 소비자의 장애와 처리 속도를 분리한다</a></p>
        quizzes:
          - q: 결제 완료 한 건마다 이메일·재고·분석 서비스가 각각 작업을 실행해야 한다. 분석 서비스가 몇 시간 중단돼도 나머지 처리는 계속하고, 분석
              복구 후 누락 없이 따라잡아야 한다. 생산자에서 각 소비자의 주소와 재시도를 관리하지 않을 구조는?
            answer: SNS 토픽에 서비스별 SQS 큐를 구독시키고 각 서비스가 자기 큐를 소비한다.
            wrong:
              - SNS HTTP 구독 세 개로 직접 전달하고 소비자 장애 복구 후 별도 보관 없이 이어간다.
              - SQS 큐 하나에 이벤트를 넣고 세 서비스가 각각 자기 작업을 실행하며 경쟁 소비한다.
              - 생산자가 세 서비스에 동기 HTTP 요청을 보내고 각 재시도 상태를 저장한다.
      - id: saa-r2-Q19-04
        source_id: Q19-04
        type: mcq
        title: Q19-04 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>EventBridge는 AWS 서비스와 사용자 이벤트를 버스로 받아 이벤트 패턴으로 대상을 고르고 아카이브의 시간 범위를 원래 버스에 재전달할 수 있다. 다른 제안도 일부 기능을 구현하지만 소스 어댑터나 분기·재발행 코드를 추가 운영한다. 이벤트 보존과 소비자 멱등성은 별도 설정이 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SNS FIFO 필터·아카이브를 사용하고 AWS 서비스 이벤트 수집용 Lambda를 운영한다.</td>
          <td>필터·아카이브는 제공하지만 제안한 구성은 AWS 서비스 이벤트를 연결하는 별도 어댑터가 남는다.</td>
          </tr>
          <tr>
          <td>Kinesis에 30일 보존을 두고 Lambda로 이벤트 수집·대상 분기·재읽기를 구현한다.</td>
          <td>장기 보존·재읽기는 가능하지만 국가·상태별 라우팅과 소스 연결을 자체 코드로 관리해야 한다.</td>
          </tr>
          <tr>
          <td>S3에 원본 이벤트를 저장하고 Lambda로 소스 연결·필터·시간별 재발행을 구현한다.</td>
          <td>원본을 보관할 수 있지만 요구한 분기와 시간 구간 재전달을 자체 코드로 구현해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html">EventBridge 이벤트 패턴</a> · <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-replay-archived-event.html">아카이브 replay</a> · <a href="https://docs.aws.amazon.com/sns/latest/dg/message-archiving-and-replay-subscriber.html">SNS FIFO 아카이브와 replay</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%9E%AC%EB%B6%84%EB%B0%B0%EC%99%80-%EC%84%A0%ED%83%9D%ED%95%9C-%EA%B7%9C%EC%B9%99%EC%9D%98-replay">EventBridge의 AWS 서비스 이벤트 통합, 내용 기반 규칙, 아카이브와 원본 버스 replay를 함께 사용하면 요구한 흐름을 적은 연결 코드로 구성한다</a></p>
        quizzes:
          - q: 회사는 S3 같은 AWS 서비스 이벤트와 자체 주문 이벤트를 같은 흐름에서 처리한다. 국가·결제 상태에 맞는 워크플로로 분기하고, 새
              소비자에 지난 30일 중 지정한 시간 구간을 다시 전달해야 한다. 생산자는 소비자 목록을 몰라야 하며 소스
              연결·분기·재전달 코드를 최소화하려 한다. 어떤 설계가 적합한가?
            answer: EventBridge 버스에 이벤트 패턴 규칙과 30일 아카이브를 두고 지정 구간을 replay한다.
            wrong:
              - SNS FIFO 필터·아카이브를 사용하고 AWS 서비스 이벤트 수집용 Lambda를 운영한다.
              - Kinesis에 30일 보존을 두고 Lambda로 이벤트 수집·대상 분기·재읽기를 구현한다.
              - S3에 원본 이벤트를 저장하고 Lambda로 소스 연결·필터·시간별 재발행을 구현한다.
      - id: saa-r2-Q19-05
        source_id: Q19-05
        type: mcq
        title: Q19-05 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>완료 콜백을 지원하므로 Standard 워크플로에서 task token으로 외부 작업 완료를 기다리고 20분 대기 조건에 맞는 시간 제한을 설정한다. Retry와 Catch로 일시 오류와 최종 보상을 구분하면 자체 상태 저장·조정 코드를 줄일 수 있다. 콜백 토큰의 전달·보호와 호출 주체 권한은 함께 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Step Functions Standard에서 5초 간격으로 결제를 조회하고 실패 시 좌석을 반환한다.</td>
          <td>5초마다 조회하면 예약당 분당 한 번인 조회 API 허용률을 넘는다.</td>
          </tr>
          <tr>
          <td>Step Functions Standard 콜백 대기를 5분으로 제한하고 시간 초과 시 좌석을 반환한다.</td>
          <td>정상 결제가 20분 걸릴 수 있는데 5분에 좌석을 반환하면 유효한 예약을 조기에 실패 처리한다.</td>
          </tr>
          <tr>
          <td>SQS·DynamoDB에 상태를 저장하고 작업자가 콜백·대기·재시도·보상 동작을 조정한다.</td>
          <td>구현 가능하지만 상태·재시도·콜백·보상 흐름의 조정 코드를 직접 운영한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html">Step Functions 콜백 패턴</a> · <a href="https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html">Retry와 Catch</a>
          SAA 평가 항목: 2.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">Standard 워크플로의 task token은 외부 콜백을 기다리는 동안 단계를 유지할 수 있다</a> · <a href="/study/lessons/deep-dive/day-10.html#%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9Ccallback%EB%B3%B4%EC%83%81">20분 결제 대기를 조회 API 호출 없이 처리하고 Retry·Catch와 보상 작업을 상태 머신에 표현해 직접 조정할 코드를 줄인다</a></p>
        quizzes:
          - q: 여행 예약은 좌석 확보 후 외부 결제 완료를 최대 20분 기다린다. 결제사는 완료 콜백을 보내며 조회 API는 예약당 분당 한 번만
              허용한다. 일시 오류에는 제한 재시도하고 실패·시간 초과에는 좌석을 반환해야 한다. API들은 멱등하며 상태 보관
              코드를 최소화하려 한다. 어떤 구성으로 구현할 것인가?
            answer: Step Functions Standard의 task token 콜백 대기와 Retry·Catch에 좌석 반환을 연결한다.
            wrong:
              - Step Functions Standard에서 5초 간격으로 결제를 조회하고 실패 시 좌석을 반환한다.
              - Step Functions Standard 콜백 대기를 5분으로 제한하고 시간 초과 시 좌석을 반환한다.
              - SQS·DynamoDB에 상태를 저장하고 작업자가 콜백·대기·재시도·보상 동작을 조정한다.
      - id: saa-r2-Q19-06
        source_id: Q19-06
        type: mcq
        title: Q19-06 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>부분 배치 실패 응답은 성공한 항목까지 재시도되는 것을 줄이고, SQS의 redrive 정책은 반복 실패 항목을 DLQ로 분리한다. 두 조치는 배치 단위 중복과 영구 오류 격리라는 별개 요구를 해결한다. Standard 전달의 중복 가능성은 남으므로 업무 처리 자체도 멱등하게 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>visibility timeout을 길게 늘리고 배치 전체 실패 응답을 계속 반환한다.</td>
          <td>재시도 시점을 늦출 뿐 성공한 아홉 개의 재전달과 영구 오류의 격리를 해결하지 않는다.</td>
          </tr>
          <tr>
          <td>배치를 한 개로 줄이고 오류 항목은 원본 큐에서 보존 기간까지 반복 재시도한다.</td>
          <td>성공 항목의 배치 재시도는 줄지만 영구 오류를 별도 큐로 격리하지 못한다.</td>
          </tr>
          <tr>
          <td>배치에 실패가 있어도 성공으로 응답하고 오류 메시지는 함수 로그에만 남긴다.</td>
          <td>성공 응답은 잘못된 메시지까지 처리 완료로 간주하게 하여 DLQ에서 조사·재처리할 항목을 잃는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">부분 배치 응답은 실패한 레코드만 재시도하도록 해 불필요한 성공 작업 반복을 줄인다</a> · <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">계속 실패하는 메시지는 DLQ로 격리하고 원인 수정과 안전한 재처리 절차를 마련해야 한다</a></p>
        quizzes:
          - q: SQS Standard를 읽는 Lambda가 한 배치의 메시지 10개를 순서와 무관하게 처리한다. 9개는 성공하지만 한 개의 잘못된 형식
              때문에 배치 전체가 재시도된다. 성공 작업의 재전달을 줄이고 영구 오류를 일정 횟수 후 격리해 조사하려 한다. 필요한
              조치 두 가지는?
            answer: 수신 횟수 기준 redrive와 DLQ를 구성하고 격리 알림·수정·재처리를 운영한다.
            wrong:
              - visibility timeout을 길게 늘리고 배치 전체 실패 응답을 계속 반환한다.
              - 배치를 한 개로 줄이고 오류 항목은 원본 큐에서 보존 기간까지 반복 재시도한다.
              - 배치에 실패가 있어도 성공으로 응답하고 오류 메시지는 함수 로그에만 남긴다.
            answers:
              - 수신 횟수 기준 redrive와 DLQ를 구성하고 격리 알림·수정·재처리를 운영한다.
              - 이벤트 소스 매핑의 부분 배치 응답을 켜고 실패한 메시지 ID만 반환한다.
            options:
              - visibility timeout을 길게 늘리고 배치 전체 실패 응답을 계속 반환한다.
              - 수신 횟수 기준 redrive와 DLQ를 구성하고 격리 알림·수정·재처리를 운영한다.
              - 배치를 한 개로 줄이고 오류 항목은 원본 큐에서 보존 기간까지 반복 재시도한다.
              - 이벤트 소스 매핑의 부분 배치 응답을 켜고 실패한 메시지 ID만 반환한다.
              - 배치에 실패가 있어도 성공으로 응답하고 오류 메시지는 함수 로그에만 남긴다.
      - id: saa-r2-Q19-07
        source_id: Q19-07
        type: mcq
        title: Q19-07 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>Reserved concurrency는 해당 함수의 동시 실행 상한을 설정한다. 실행당 연결 한 개라는 전제에서 상한 40으로 DB에 동시에 접근하는 실행 수를 제한한다. 준비된 실행 환경 수와 최대 동시 실행 수는 다르며 초과 요청의 throttling·재시도·대기 동작을 요청 경로에 맞게 설계해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Lambda 제한 시간을 짧게 줄이고 동시 실행은 계정 기본 한도까지 허용한다.</td>
          <td>실행 시간 단축은 작업 실패를 늘릴 수 있고 짧은 시간 안에도 많은 실행이 겹치므로 상한 40을 보장하지 않는다.</td>
          </tr>
          <tr>
          <td>API Gateway 요청률을 고정하고 긴 실행 시간에도 함수 동시 실행 제한은 두지 않는다.</td>
          <td>요청률이 같아도 실행 시간이 늘면 동시 실행 수가 증가하므로 함수의 최대 동시 실행 제한을 대신하지 못한다.</td>
          </tr>
          <tr>
          <td>Provisioned concurrency를 40으로 설정하고 그 밖의 동시 실행은 요청 때 초기화한다.</td>
          <td>Provisioned concurrency는 초기화된 환경을 준비하지만 그것만으로 그 이상의 동시 실행을 막지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a> · <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#lambda-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%EC%96%B4">Reserved concurrency는 함수에 동시 실행 몫을 배정하면서 상한도 정한다</a></p>
        quizzes:
          - q: 하나의 재고 Lambda 함수가 실행당 DB 연결 한 개를 사용한다. DB가 이 함수에 허용한 연결 수는 40개이고, 트래픽 증가 시 동시
              실행 200개가 생겨 연결 오류가 난다. DB 보호를 위해 대기·재시도를 허용하며 함수의 최대 동시 실행을 40으로
              제한하려 한다. 가장 직접적인 설정은?
            answer: Reserved concurrency를 40으로 설정하고 throttling과 재시도 적체를 관찰한다.
            wrong:
              - Lambda 제한 시간을 짧게 줄이고 동시 실행은 계정 기본 한도까지 허용한다.
              - API Gateway 요청률을 고정하고 긴 실행 시간에도 함수 동시 실행 제한은 두지 않는다.
              - Provisioned concurrency를 40으로 설정하고 그 밖의 동시 실행은 요청 때 초기화한다.
      - id: saa-r2-Q19-08
        source_id: Q19-08
        type: mcq
        title: Q19-08 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>지연 목표를 만족하는 설정은 2048MB와 4096MB다. 동일 단위 요금에서 비용은 할당 GB와 실행 시간의 곱에 비례하므로 각각 2×0.2=0.4 GB초, 4×0.16=0.64 GB초다. 가장 빠른 설정이 가장 싼 설정은 아니며 여기서는 2048MB가 두 조건을 만족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>1024MB로 배포하고 실행 시간이 긴 대신 메모리 단가를 낮춘다.</td>
          <td>메모리가 작아도 600ms로 지연 목표 250ms를 넘는다.</td>
          </tr>
          <tr>
          <td>1536MB로 배포하고 1024MB보다 짧아진 실행 시간을 활용한다.</td>
          <td>600ms보다 개선되지만 340ms여서 지연 목표를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>4096MB로 배포해 측정한 네 설정 중 가장 짧은 응답 시간을 사용한다.</td>
          <td>응답은 더 빠르지만 0.64 GB초로 2048MB의 0.4 GB초보다 컴퓨팅 비용이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html">Lambda 메모리·CPU 할당</a> · <a href="https://aws.amazon.com/lambda/pricing/">Lambda 계산 요금</a>
          SAA 평가 항목: 4.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#lambda-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%EC%96%B4">지연 조건을 충족하는 설정은 2048MB와 4096MB다</a> · <a href="/study/lessons/deep-dive/day-10.html#lambda-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%EC%96%B4">요청당 계산 사용량은 각각 2GB×0.2초=0.4GB-초, 4GB×0.16초=0.64GB-초이므로 같은 단위 요금에서는 2048MB가 저렴하다</a> · <a href="/study/lessons/deep-dive/day-10.html#lambda-%EC%8B%A4%ED%96%89-%EC%9E%90%EC%9B%90%EA%B3%BC-%EC%9A%94%EC%B2%AD-%EC%A0%9C%EC%96%B4">가장 빠른 설정과 가장 싼 적합 설정은 다르다</a></p>
        quizzes:
          - q: 이미지 API의 Lambda를 같은 CPU 아키텍처로 시험했다. 메모리별 과금 시간과 응답 시간은 1024MB=600ms,
              1536MB=340ms, 2048MB=200ms, 4096MB=160ms다. 요청 수·정확성·단위 GB초 요금과 다른
              비용은 같고 목표는 250ms 이하다. 목표를 만족하면서 요청당 컴퓨팅 비용이 가장 낮은 설정은?
            answer: 2048MB로 배포해 지연 목표를 맞추고 메모리×시간 비용을 낮춘다.
            wrong:
              - 1024MB로 배포하고 실행 시간이 긴 대신 메모리 단가를 낮춘다.
              - 1536MB로 배포하고 1024MB보다 짧아진 실행 시간을 활용한다.
              - 4096MB로 배포해 측정한 네 설정 중 가장 짧은 응답 시간을 사용한다.
      - id: saa-r2-Q19-09
        source_id: Q19-09
        type: mcq
        title: Q19-09 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>개인화 응답이 사용자 구분 없는 공유 키로 캐시되는 것이 사고 원인이다. 검증 전 즉시 조치는 해당 동작의 캐시를 끄되 로그인 쿠키를 원본에 전달해 원본 인증·인가를 유지하는 것이다. 짧은 TTL이나 일시 무효화로는 다음 요청이 다른 사용자의 응답을 다시 공유하는 구조를 없애지 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>언어 헤더만 캐시 키에 추가하고 로그인 쿠키는 원본에만 전달한다.</td>
          <td>언어는 사용자를 구분하지 못하므로 같은 언어 사용자의 개인정보 응답이 공유된다.</td>
          </tr>
          <tr>
          <td>경로 캐시는 유지하되 응답 TTL을 30초로 줄이고 쿠키를 원본에 전달한다.</td>
          <td>노출 시간이 짧아질 수 있지만 같은 30초 안에는 사용자 간 공유가 계속된다.</td>
          </tr>
          <tr>
          <td>로그인 때만 캐시를 무효화하고 /account의 경로 기반 공유 캐시를 유지한다.</td>
          <td>무효화 후 새 응답이 같은 경로 키에 다시 저장되면 다음 사용자에게 공유될 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EC%BA%90%EC%8B%9C-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%9B%90%EB%B3%B8-%EC%A0%84%EB%8B%AC-%EC%A0%95%EC%B1%85">개인화 응답을 경로만으로 공유하면 다른 사용자에게 노출될 수 있다</a></p>
        quizzes:
          - q: CloudFront의 /account API는 로그인 쿠키에 따라 개인정보를 반환한다. 현재 공유 캐시 키에는 경로만 들어 있고 원본에는
              쿠키가 전달된다. 다른 사용자의 응답이 보이는 사고가 발생했다. 사용자별 캐시 설계를 검증할 때까지 개인정보 공유
              위험을 즉시 줄이고 인증은 유지할 변경은?
            answer: /account 캐시를 비활성화하고 인증 쿠키는 원본에 계속 전달한다.
            wrong:
              - 언어 헤더만 캐시 키에 추가하고 로그인 쿠키는 원본에만 전달한다.
              - 경로 캐시는 유지하되 응답 TTL을 30초로 줄이고 쿠키를 원본에 전달한다.
              - 로그인 때만 캐시를 무효화하고 /account의 경로 기반 공유 캐시를 유지한다.
      - id: saa-r2-Q19-10
        source_id: Q19-10
        type: mcq
        title: Q19-10 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>OAC와 배포를 제한한 버킷 정책은 CloudFront가 비공개 S3를 읽는 원본 경로를 통제한다. 구매자를 제한하려면 앱이 구매 확인 후 만료되는 서명 URL·쿠키를 발급하는 별도 viewer 접근 제어가 필요하다. 캐시 TTL은 구매 권한의 만료를 대신하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>구매 확인 후 S3 presigned URL을 발급해 브라우저가 원본에서 직접 재생하게 한다.</td>
          <td>유효 기간은 제한할 수 있지만 제안한 방식은 S3 직접 다운로드를 허용한다.</td>
          </tr>
          <tr>
          <td>S3를 비공개로 두고 OAC만 설정한 CloudFront 주소를 모든 사용자에게 제공한다.</td>
          <td>원본은 보호하지만 CloudFront 주소에 접근하는 사람이 구매자인지는 검증하지 않는다.</td>
          </tr>
          <tr>
          <td>S3 공개 읽기를 허용하고 CloudFront의 캐시 TTL을 재생 허용 시간으로 맞춘다.</td>
          <td>S3 공개 읽기가 남아 원본 직접 다운로드를 막지 못하며 TTL은 구매자 인증이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 1.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EA%B5%AC%EB%A7%A4%EC%9E%90-%EA%B6%8C%ED%95%9C%EA%B3%BC-s3-%EC%9B%90%EB%B3%B8-%EA%B6%8C%ED%95%9C">구매자 접근은 CloudFront 서명으로 제한하고 원본 우회는 비공개 S3와 OAC·배포 조건 버킷 정책으로 막는다</a> · <a href="/study/lessons/deep-dive/day-09.html#%EA%B5%AC%EB%A7%A4%EC%9E%90-%EA%B6%8C%ED%95%9C%EA%B3%BC-s3-%EC%9B%90%EB%B3%B8-%EA%B6%8C%ED%95%9C">사용자 접근과 CloudFront의 원본 접근은 별도 권한 경계이므로 둘 다 구성해야 한다</a></p>
        quizzes:
          - q: 유료 영상 서비스가 S3 일반 버킷을 CloudFront 원본으로 사용한다. 구매자가 받은 재생 주소는 제한 시간 동안만 유효해야 하고,
              S3 주소를 알아도 직접 다운로드할 수 없어야 한다. 앱은 구매 여부를 확인할 수 있다. 원본 보호와 구매자 접근을
              각각 구현할 조치 두 가지는?
            answer: 구매 확인 후 만료 시각이 있는 CloudFront 서명 URL 또는 서명 쿠키를 발급한다.
            wrong:
              - 구매 확인 후 S3 presigned URL을 발급해 브라우저가 원본에서 직접 재생하게 한다.
              - S3를 비공개로 두고 OAC만 설정한 CloudFront 주소를 모든 사용자에게 제공한다.
              - S3 공개 읽기를 허용하고 CloudFront의 캐시 TTL을 재생 허용 시간으로 맞춘다.
            answers:
              - 구매 확인 후 만료 시각이 있는 CloudFront 서명 URL 또는 서명 쿠키를 발급한다.
              - S3 공개 읽기를 제거하고 OAC·버킷 정책으로 해당 CloudFront 배포의 읽기를 허용한다.
            options:
              - 구매 확인 후 만료 시각이 있는 CloudFront 서명 URL 또는 서명 쿠키를 발급한다.
              - 구매 확인 후 S3 presigned URL을 발급해 브라우저가 원본에서 직접 재생하게 한다.
              - S3를 비공개로 두고 OAC만 설정한 CloudFront 주소를 모든 사용자에게 제공한다.
              - S3 공개 읽기를 허용하고 CloudFront의 캐시 TTL을 재생 허용 시간으로 맞춘다.
              - S3 공개 읽기를 제거하고 OAC·버킷 정책으로 해당 CloudFront 배포의 읽기를 허용한다.
      - id: saa-r2-Q19-11
        source_id: Q19-11
        type: mcq
        title: Q19-11 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>표준 Global Accelerator는 고정 anycast IP를 진입점으로 유지하면서 지원 엔드포인트의 상태와 트래픽 정책에 따라 정상 리전으로 유도한다. 고객 허용 목록과 리전별 NLB 주소를 분리하고 자체 목적지 매핑을 줄이는 조건에 맞는다. 실제 장애·리전 추가는 엔드포인트 구성과 앱의 상태 공유도 함께 검증한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Global Accelerator custom routing에 EC2 서브넷을 연결하고 앱이 목적지 매핑을 관리한다.</td>
          <td>custom routing은 목적지 매핑·포트 사용을 앱이 제어하는 모델이어서 제시한 자동 유도·운영 최소화와 다르다.</td>
          </tr>
          <tr>
          <td>Route 53 지연·상태 확인으로 두 NLB를 응답하고 리전별 NLB EIP를 고객에게 등록한다.</td>
          <td>DNS 라우팅은 가능하지만 고객이 리전별 진입 IP를 등록해야 하여 향후 리전 추가와 허용 목록이 결합된다.</td>
          </tr>
          <tr>
          <td>한 리전의 NLB EIP 두 개를 진입점으로 두고 앱이 다른 리전의 서버로 중계한다.</td>
          <td>다른 리전으로 중계할 수 있지만 고정 진입 리전이 중단되면 다른 리전도 고객 요청을 직접 받지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-how-it-works.html">Standard와 custom routing 차이</a> · <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/about-custom-routing-guidelines.html">Custom routing 상태 확인 제한</a>
          SAA 평가 항목: 3.2</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#dns-cdn%EA%B3%BC-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%84%A4%ED%8A%B8%EC%9B%8C%ED%81%AC-%EA%B0%80%EC%86%8D">Standard accelerator는 고정 진입 IP를 유지하면서 정상 endpoint로 신규 흐름을 유도한다</a></p>
        quizzes:
          - q: 기업용 UDP 접수 서비스를 두 리전의 NLB 뒤에서 운영한다. 요청은 어느 정상 리전에서도 처리할 수 있고 고객 방화벽은 고정 진입 IP
              두 개만 등록한다. 향후 리전 추가 때 고객 허용 목록은 바꾸지 않으려 한다. 직접 목적지 매핑 서버를 운영하지 않고
              정상 리전으로 유도할 구성은?
            answer: Global Accelerator 표준 가속기에 UDP 리스너와 두 리전 NLB 그룹을 연결한다.
            wrong:
              - Global Accelerator custom routing에 EC2 서브넷을 연결하고 앱이 목적지 매핑을 관리한다.
              - Route 53 지연·상태 확인으로 두 NLB를 응답하고 리전별 NLB EIP를 고객에게 등록한다.
              - 한 리전의 NLB EIP 두 개를 진입점으로 두고 앱이 다른 리전의 서버로 중계한다.
      - id: saa-r2-Q19-12
        source_id: Q19-12
        type: mcq
        title: Q19-12 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>기존 DNS 캐시의 긴 TTL이 만료될 시간을 둔 뒤 새로 짧은 TTL을 적용해야 한다. DNS 변경은 열린 WebSocket을 이동시키지 않으므로 무응답 감지와 재연결도 필요하다. 제시한 클라이언트 동작에서는 사전에 낮춘 60초 TTL과 30초 heartbeat가 5분 재연결 목표에 맞는 경로를 제공한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>2시간 전부터 DNS 가중치를 조정하되 TTL 3600초와 30초 heartbeat를 유지한다.</td>
          <td>새 연결의 비중은 조정할 수 있지만 기존 긴 DNS 캐시가 남아 재연결 시 구 리전으로 갈 수 있다.</td>
          </tr>
          <tr>
          <td>09시에 TTL을 60초로 바꾸고 30초 무응답 후 재연결하는 heartbeat를 배포한다.</td>
          <td>전환 직전에 TTL을 낮춰도 이미 3600초로 캐시된 응답은 그 캐시 수명 동안 남을 수 있다.</td>
          </tr>
          <tr>
          <td>전환 2시간 전에 TTL을 60초로 낮추고 WebSocket은 최대 24시간 응답을 기다린다.</td>
          <td>DNS 캐시가 바뀌어도 열린 연결이 무응답 상태로 오래 유지되면 5분 안에 재조회하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/best-practices-dns.html">Route 53 DNS 변경과 TTL 권장</a> · <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resource-record-sets-values-basic.html">Route 53 TTL과 변경 준비</a> · <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover.html">DNS 장애 조치</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#dns-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%A0%84%ED%99%98-%EC%8B%9C%EA%B0%84">기존 3600초 캐시가 전환 전에 만료될 시간을 주고 새 응답의 TTL을 60초로 줄여야 한다</a></p>
        quizzes:
          - q: 내일 09시에 두 리전 웹 서비스를 계획 전환한다. 기존 Route 53 TTL은 3600초이며 WebSocket은 최대 24시간 열린다.
              회사 클라이언트는 TTL을 준수하고 재연결 때 DNS를 다시 조회한다. 구 리전이 응답하지 않으면 전환 후 5분 안에
              새 리전으로 재연결해야 한다. 어떤 사전 준비가 적합한가?
            answer: 전환 2시간 전에 TTL을 60초로 낮추고 30초 무응답 후 재연결하는 heartbeat를 배포한다.
            wrong:
              - 2시간 전부터 DNS 가중치를 조정하되 TTL 3600초와 30초 heartbeat를 유지한다.
              - 09시에 TTL을 60초로 바꾸고 30초 무응답 후 재연결하는 heartbeat를 배포한다.
              - 전환 2시간 전에 TTL을 60초로 낮추고 WebSocket은 최대 24시간 응답을 기다린다.
      - id: saa-r2-Q19-13
        source_id: Q19-13
        type: mcq
        title: Q19-13 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>캐시 키에는 응답을 실제로 바꾸는 v를 남기고 같은 결과를 만드는 추적 쿼리는 빼야 한다. 이렇게 해야 버전별 정확성은 유지하면서 불필요한 사용자별 캐시 분할을 줄인다. 캐시 키와 원본 요청 정책은 다른 역할이므로 추적 정보가 원본에 필요한지는 따로 결정한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 쿼리는 키에 유지하고 추적 값마다 긴 TTL로 캐시한다.</td>
          <td>TTL이 길어도 요청마다 다른 추적 값으로 키가 나뉘어 불필요한 사본과 낮은 적중률이 남는다.</td>
          </tr>
          <tr>
          <td>이미지 동작의 TTL을 0으로 두고 모든 쿼리를 원본에 전달한다.</td>
          <td>공유 오류는 피할 수 있지만 캐시를 사용하지 않아 원본 요청을 줄이는 목적을 달성하지 못한다.</td>
          </tr>
          <tr>
          <td>v와 추적 쿼리를 모두 캐시 키에서 제외하고 경로만으로 이미지를 캐시한다.</td>
          <td>이미지 버전을 바꾸는 v까지 제외하면 서로 다른 버전이 같은 캐시 키를 공유할 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 4.4</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-09.html#%EC%BA%90%EC%8B%9C-%EC%A0%95%EC%B1%85%EA%B3%BC-%EC%9B%90%EB%B3%B8-%EC%A0%84%EB%8B%AC-%EC%A0%95%EC%B1%85">원본 응답에 영향을 주지 않는 추적 값은 캐시 키에서 빼 같은 이미지를 재사용할 수 있다</a></p>
        quizzes:
          - q: 상품 이미지는 CloudFront에서 배포한다. 같은 파일에도 사용자마다 utm_source·click_id가 붙고 원본은 이 값을
              무시한다. 캐시 키가 모든 쿼리를 포함해 같은 이미지 사본이 많이 생긴다. 이미지 버전을 고르는 v 값은 응답을
              바꾼다. 이미지 정확성을 유지하면서 원본 요청을 줄일 변경은?
            answer: v는 캐시 키에 유지하고 추적 쿼리는 제외하며 원본 전달 여부는 별도로 정한다.
            wrong:
              - 모든 쿼리는 키에 유지하고 추적 값마다 긴 TTL로 캐시한다.
              - 이미지 동작의 TTL을 0으로 두고 모든 쿼리를 원본에 전달한다.
              - v와 추적 쿼리를 모두 캐시 키에서 제외하고 경로만으로 이미지를 캐시한다.
      - id: saa-r2-Q19-14
        source_id: Q19-14
        type: mcq
        title: Q19-14 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>FIFO의 MessageGroupId를 주문별로 나누면 같은 주문은 순서를 지키면서 다른 그룹은 병렬 처리할 수 있다. 그러나 큐 중복 제거와 외부 결제 효과의 멱등성은 별개다. 결제 성공 후 삭제가 확인되지 않아 재수신될 수 있으므로 동일 업무 요청 ID로 외부 효과를 중복 적용하지 않아야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>FIFO deduplication ID만 사용하고 결제 제공사에는 매 시도 새 결제 ID를 보낸다.</td>
          <td>큐의 전송 중복 제거만으로 소비자의 외부 결제 재호출을 보호하지 못하고 새 결제 ID는 중복 과금을 만들 수 있다.</td>
          </tr>
          <tr>
          <td>Standard 큐를 사용하고 주문별 수신 시각을 업무 발생 순서로 간주한다.</td>
          <td>Standard 큐는 주문별 업무 순서 보장을 제공하지 않으므로 수신 시각만으로 원래 순서를 확정할 수 없다.</td>
          </tr>
          <tr>
          <td>FIFO의 모든 이벤트에 고정 MessageGroupId 하나를 사용한다.</td>
          <td>같은 그룹 하나로 전체 이벤트 순서를 묶으면 서로 다른 주문까지 직렬화되어 요구한 병렬성을 잃는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-understanding-logic.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#sqs-%EC%88%98%EC%8B%A0%EC%8B%A4%ED%8C%A8%EC%82%AD%EC%A0%9C-%ED%9D%90%EB%A6%84">생산자가 같은 주문의 이벤트를 생성 순서로 전송한다는 전제에서 FIFO 그룹별 전송 순서 보장을 활용할 수 있다</a></p>
        quizzes:
          - q: 생산자는 같은 주문의 상태 이벤트를 업무 순서대로 하나씩 SQS에 보낸다. 소비자는 주문 안에서는 그 순서를 유지하되 다른 주문은 병렬
              처리해야 한다. 결제 호출 성공 뒤 메시지 삭제 응답을 잃어도 외부 결제가 중복되면 안 된다. 필요한 조치 두 가지는?
            answer: 결제 요청 ID로 외부 중복 효과를 막고 성공 처리 뒤 메시지를 삭제한다.
            wrong:
              - FIFO deduplication ID만 사용하고 결제 제공사에는 매 시도 새 결제 ID를 보낸다.
              - Standard 큐를 사용하고 주문별 수신 시각을 업무 발생 순서로 간주한다.
              - FIFO의 모든 이벤트에 고정 MessageGroupId 하나를 사용한다.
            answers:
              - 결제 요청 ID로 외부 중복 효과를 막고 성공 처리 뒤 메시지를 삭제한다.
              - FIFO에서 주문 ID를 MessageGroupId로 사용해 주문별로 그룹을 나눈다.
            options:
              - FIFO deduplication ID만 사용하고 결제 제공사에는 매 시도 새 결제 ID를 보낸다.
              - 결제 요청 ID로 외부 중복 효과를 막고 성공 처리 뒤 메시지를 삭제한다.
              - Standard 큐를 사용하고 주문별 수신 시각을 업무 발생 순서로 간주한다.
              - FIFO의 모든 이벤트에 고정 MessageGroupId 하나를 사용한다.
              - FIFO에서 주문 ID를 MessageGroupId로 사용해 주문별로 그룹을 나눈다.
      - id: saa-r2-Q19-15
        source_id: Q19-15
        type: mcq
        title: Q19-15 · 서버리스·메시징·콘텐츠 전송
        explain: |
          <p>이번 선택을 가르는 조건은 브로커 운영 감소와 기존 AMQP 앱의 변경 제한이다. Amazon MQ for RabbitMQ는 기존 RabbitMQ 클라이언트와 메시징 모델의 이관을 우선 검토할 관리형 브로커다. 지원 버전·플러그인·고가용성·용량이 현재 앱과 맞는지는 실제로 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SQS로 옮기고 AMQP 생산자·소비자를 AWS SDK 호출과 가시성 제한 모델로 변경한다.</td>
          <td>관리형 큐를 사용할 수 있지만 기존 AMQP와 확인 응답을 AWS API·가시성 모델에 맞춰 바꾸어야 한다.</td>
          </tr>
          <tr>
          <td>EventBridge로 옮기고 브로커 연결을 이벤트 버스·대상 호출 모델로 변경한다.</td>
          <td>이벤트 연결은 가능하지만 기존 브로커의 연결·라우팅·확인 응답 모델을 재설계해야 한다.</td>
          </tr>
          <tr>
          <td>SNS·SQS 팬아웃을 만들고 RabbitMQ 라우팅·확인 응답을 새 모델로 재구현한다.</td>
          <td>장기 재설계 대안이 될 수 있으나 단기간의 메시징 API 변경 제한에 비해 앱 수정 범위가 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 3.5</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-10.html#%EB%A0%88%EA%B1%B0%EC%8B%9C-%EB%B8%8C%EB%A1%9C%EC%BB%A4%EC%99%80-saas-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">기존 RabbitMQ 프로토콜과 API 의존을 유지하며 운영 부담을 줄이려면 관리형 브로커인 Amazon MQ를 먼저 검토한다</a></p>
        quizzes:
          - q: 결제 앱이 RabbitMQ의 AMQP 연결·라우팅·확인 응답에 의존한다. 팀은 브로커 서버 패치를 줄이려 하지만 이번 이관 기간에는
              생산자와 소비자의 메시징 API를 크게 바꿀 수 없다. 기존 동작의 호환성과 장애 복구를 시험한다는 전제에서 우선
              검토할 설계는?
            answer: Amazon MQ for RabbitMQ의 지원 엔진·배포·용량을 검토하고 기존 클라이언트를 이관한다.
            wrong:
              - SQS로 옮기고 AMQP 생산자·소비자를 AWS SDK 호출과 가시성 제한 모델로 변경한다.
              - EventBridge로 옮기고 브로커 연결을 이벤트 버스·대상 호출 모델로 변경한다.
              - SNS·SQS 팬아웃을 만들고 RabbitMQ 라우팅·확인 응답을 새 모델로 재구현한다.
