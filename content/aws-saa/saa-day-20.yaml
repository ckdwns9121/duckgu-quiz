id: saa-day-20
name: 전체 범위 혼합 문제
part: 20일 차
color: "#4385ef"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: Q20-01
        type: mcq
        title: Q20-01 · 전체 범위 혼합 문제
        explain: |
          <p>지정 endpoint 이외의 요청을 버킷 정책에서 거부하면 유출된 역할 자격 증명으로도 인터넷 경로의 객체 읽기가 차단된다. 기존 역할의 최소 권한은 유지한다. 실제 배포에서는 콘솔·다른 독자까지 차단될 수 있어 적용 범위를 접두사와 읽기 작업으로 한정해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2 보안 그룹의 아웃바운드를 S3 prefix list로 제한하고 버킷 정책은 계정 역할을 허용한다</td>
          <td>SG는 해당 EC2의 통신을 제어한다. 외부에서 같은 역할 자격 증명으로 보낸 API 요청에는 적용되지 않는다.</td>
          </tr>
          <tr>
          <td>버킷의 Block Public Access를 켜고 reports/ 객체를 고객 관리형 KMS 키로 암호화한다</td>
          <td>공개 접근 차단은 익명·공개 정책 접근을 제한한다. 이미 권한을 가진 역할의 인터넷 요청이나 KMS 사용 경로를 제한하지 않는다.</td>
          </tr>
          <tr>
          <td>역할의 세션 시간을 줄이고 reports/ 읽기용 IAM 관리형 정책을 별도로 연결한다</td>
          <td>세션 축소는 노출 시간을 줄이지만 유효한 세션으로 인터넷에서 읽는 경로를 막지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html">S3 버킷 정책의 endpoint 경로 제한</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 정산 EC2의 역할에는 같은 계정 reports 버킷의 reports/ 접두사 GetObject만 허용되어 있다. 보안 팀은 이 역할의
              임시 자격 증명이 외부로 유출되더라도 해당 파일을 인터넷에서 읽지 못하게 해야 한다. 앱은 지정 S3 Gateway
              endpoint를 사용하며 이 접두사의 독자는 이 앱뿐이다. 자격 증명 수명을 줄이는 것보다 요청 경로를 강제하면서
              기존 SDK 호출을 유지할 설계는 무엇인가?
            answer: 버킷 정책에 reports/의 GetObject를 지정 aws:SourceVpce 이외 경로에서 명시적으로 거부한다
            wrong:
              - EC2 보안 그룹의 아웃바운드를 S3 prefix list로 제한하고 버킷 정책은 계정 역할을 허용한다
              - 버킷의 Block Public Access를 켜고 reports/ 객체를 고객 관리형 KMS 키로 암호화한다
              - 역할의 세션 시간을 줄이고 reports/ 읽기용 IAM 관리형 정책을 별도로 연결한다
      - id: Q20-02
        type: mcq
        title: Q20-02 · 전체 범위 혼합 문제
        explain: >
          <p>단일 AZ 배치이고 해당 AZ 상실 시 중간 파일 재생성이 가능하므로 EFS One Zone을 비용 절감 후보로 선택할
          수 있다. Regional의 다중 AZ 복원력을 포기하는 대신 관리형 POSIX 공유 파일 기능을 사용한다.</p>

          <table>

          <thead>

          <tr>

          <th>오답</th>

          <th>틀린 이유</th>

          </tr>

          </thead>

          <tbody><tr>

          <td>작업자마다 독립 EBS를 붙이고 공유 경로는 구성하지 않는다</td>

          <td>독립 블록 볼륨은 여러 작업자에게 같은 공유 파일 경로를 제공하지 않는다.</td>

          </tr>

          <tr>

          <td>직접 운영하는 EC2 NFS 서버 한 대를 두고 OS·백업을 관리한다</td>

          <td>공유 파일은 제공할 수 있지만 파일 서버를 직접 운영하지 않으려는 조건에 맞지 않는다.</td>

          </tr>

          <tr>

          <td>작업자별 로컬 파일을 독립 저장하고 야간에만 복사해 경로 내용을 동기화한다</td>

          <td>야간 복사는 실행 중인 작업자들이 같은 파일 경로에서 즉시 서로의 중간 결과를 공유하는 구조가 아니다.</td>

          </tr>

          </tbody></table>

          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>

          공식 근거: <a
          href="https://docs.aws.amazon.com/efs/latest/ug/features.html">EFS 파일
          시스템 유형</a> · <a
          href="https://docs.aws.amazon.com/pdfs/efs/latest/ug/efs-ug.pdf">EFS
          공식 사용자 안내서: One Zone</a>

          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: 한 AZ 안의 Linux 계산 작업자들이 POSIX 공유 경로로 중간 파일을 읽고 쓴다. 원본은 S3에 따로 있으며 AZ 전체 장애 때
              중간 파일은 재생성해도 된다. 파일 서버를 직접 운영하지 않고 Regional 구성보다 저장 비용을 낮추려 할 때
              적합한 선택은 무엇인가?
            answer: 같은 AZ에서 접근하는 EFS One Zone 파일 시스템을 사용한다
            wrong:
              - 작업자마다 독립 EBS를 붙이고 공유 경로는 구성하지 않는다
              - 직접 운영하는 EC2 NFS 서버 한 대를 두고 OS·백업을 관리한다
              - 작업자별 로컬 파일을 독립 저장하고 야간에만 복사해 경로 내용을 동기화한다
      - id: Q20-03
        type: mcq
        title: Q20-03 · 전체 범위 혼합 문제
        explain: |
          <p>NAT Gateway는 IPv4 주소 하나당 동일 목적지 IP·포트·프로토콜에 약 55,000개 동시 연결을 지원한다. 각 NAT에 주소를 추가하면 7만 연결의 포트 할당 여유를 확보하면서 AZ별 경로를 유지할 수 있다. 외부 허용 목록에는 새 EIP도 반영해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 NAT의 EIP는 유지하고 앱 ASG의 최대 인스턴스 수를 두 배로 늘린다</td>
          <td>인스턴스 수를 늘려도 NAT가 같은 목적지에 사용할 변환 주소·포트 조합 수는 늘지 않는다.</td>
          </tr>
          <tr>
          <td>AZ A에 EIP 하나인 NAT를 추가하고 AZ B 트래픽 절반을 그 NAT로 라우팅한다</td>
          <td>연결은 분산할 수 있으나 AZ B의 일부 결제가 AZ A 출구에 의존하여 장애 격리 조건을 잃는다.</td>
          </tr>
          <tr>
          <td>AZ A에 EIP 두 개인 NAT 하나를 두고 두 AZ의 기본 경로를 그 NAT로 모은다</td>
          <td>주소 두 개로 연결 한도는 높일 수 있지만 두 AZ의 송신이 AZ A 장애에 함께 영향을 받는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-working-with.html">NAT 보조 주소와 연결 한도</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 두 AZ의 앱은 각 AZ의 공개 Zonal NAT Gateway를 통해 같은 결제 서버의 단일 IPv4:443으로 연결한다. NAT마다
              EIP가 하나이며 각 AZ에서 동시 TCP 연결 7만 개가 필요하다. ErrorPortAllocation이 증가하지만
              대역폭은 충분하다. 결제사는 송신 EIP 추가 등록을 허용한다. AZ 간 출구 장애 격리를 유지하면서 연결 수 제한을
              해결할 변경은 무엇인가?
            answer: 각 AZ NAT에 보조 IPv4와 EIP를 하나씩 추가하고 결제사의 허용 목록도 갱신한다
            wrong:
              - 두 NAT의 EIP는 유지하고 앱 ASG의 최대 인스턴스 수를 두 배로 늘린다
              - AZ A에 EIP 하나인 NAT를 추가하고 AZ B 트래픽 절반을 그 NAT로 라우팅한다
              - AZ A에 EIP 두 개인 NAT 하나를 두고 두 AZ의 기본 경로를 그 NAT로 모은다
      - id: Q20-04
        type: mcq
        title: Q20-04 · 전체 범위 혼합 문제
        explain: |
          <p>NACL은 낮은 번호부터 검사하며 첫 일치 규칙을 적용한다. 파트너 /24의 443만 거부 규칙 앞에서 허용하면 그 밖의 /16 주소는 규칙 100에서 계속 거부된다. 이 문제의 장애는 반환 포트가 아니라 인바운드 규칙 순서다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>아웃바운드 90에 10.20.8.0/24의 임시 포트 허용을 추가한다</td>
          <td>응답 경로는 이미 정상이며 파트너의 최초 요청이 인바운드 100에서 거부되는 문제를 해결하지 않는다.</td>
          </tr>
          <tr>
          <td>인바운드 150에 10.20.8.0/24의 TCP 443 허용을 추가한다</td>
          <td>파트너 주소도 먼저 규칙 100에 일치하므로 150의 허용까지 도달하지 않는다.</td>
          </tr>
          <tr>
          <td>인바운드 90에 10.20.0.0/16의 TCP 443 허용을 추가한다</td>
          <td>100 앞에서 /16 전체의 HTTPS를 허용해 파트너 밖 주소까지 접근할 수 있게 된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nacl-rules.html">NACL 규칙 평가 순서</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 웹 서브넷의 NACL 인바운드는 규칙 100에서 10.20.0.0/16의 모든 트래픽을 거부하고, 규칙 200에서 모든 주소의 TCP
              443을 허용한다. 아웃바운드 응답 규칙과 SG는 정상이다. 새 파트너 10.20.8.0/24에만 HTTPS를 열고
              같은 /16의 다른 주소는 계속 차단해야 한다. 가장 적절한 변경은 무엇인가?
            answer: 인바운드 90에 10.20.8.0/24의 TCP 443 허용을 추가한다
            wrong:
              - 아웃바운드 90에 10.20.8.0/24의 임시 포트 허용을 추가한다
              - 인바운드 150에 10.20.8.0/24의 TCP 443 허용을 추가한다
              - 인바운드 90에 10.20.0.0/16의 TCP 443 허용을 추가한다
      - id: Q20-05
        type: mcq
        title: Q20-05 · 전체 범위 혼합 문제
        explain: |
          <p>가중치 전달은 실제 요청을 두 그룹에 나눌 수 있다. 하지만 ALB는 한 가중치 그룹에 정상 대상이 없다고 다른 그룹으로 자동 재분배하지 않는다. 알람 기반으로 규칙 가중치를 바꾸는 자동화가 추가로 필요하다. 전환 감지·실행 동안의 오류 가능성은 별도 검증한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>/orders/beta 경로를 새 그룹에 연결하고 /orders의 기본 전달은 기존 그룹에 연결한다</td>
          <td>경로로 명시적 beta 요청을 구분할 수 있지만 일반 /orders 요청 10%의 운영 트래픽 분할이 되지 않는다.</td>
          </tr>
          <tr>
          <td>배포 시 /orders 규칙을 새 그룹으로 전환하고 비정상 알람에서 기존 그룹으로 되돌린다</td>
          <td>전체 전환과 복귀는 구현할 수 있으나 배포 초기에 요청 10%만 새 버전으로 보내는 조건을 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>가중치 90:10 전달 규칙과 두 대상 그룹의 ALB 상태 확인을 구성한다</td>
          <td>상태 확인은 개별 대상을 제외하지만 비정상 가중치 그룹의 몫을 다른 그룹으로 자동 넘기지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-action-types.html">ALB 가중치 대상 그룹 동작</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: ALB의 /orders 경로에 새 버전을 배포한다. 실제 주문 요청의 약 10%를 새 대상 그룹으로 보내고 나머지는 기존 버전으로 보내야
              한다. 새 그룹 전체가 unhealthy가 되면 기존 그룹으로만 새 요청을 보내야 한다. 앱 프록시를 운영하지 않고
              초기 분할과 장애 전환을 모두 구현할 계획은 무엇인가?
            answer: 가중치 90:10 전달 규칙을 설정하고 새 그룹 비정상 알람의 자동화가 새 그룹 가중치를 0으로 변경한다
            wrong:
              - /orders/beta 경로를 새 그룹에 연결하고 /orders의 기본 전달은 기존 그룹에 연결한다
              - 배포 시 /orders 규칙을 새 그룹으로 전환하고 비정상 알람에서 기존 그룹으로 되돌린다
              - 가중치 90:10 전달 규칙과 두 대상 그룹의 ALB 상태 확인을 구성한다
      - id: Q20-06
        type: mcq
        title: Q20-06 · 전체 범위 혼합 문제
        explain: |
          <p>여러 용량 풀과 capacity-optimized 전략은 가용 용량이 더 풍부한 풀을 선택하는 데 초점을 둔다. Capacity Rebalancing은 rebalance 권고 때 교체 용량 확보를 일찍 시도한다. 중단이 사라지는 보장은 없으므로 체크포인트·재시도는 계속 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>여러 유형·AZ를 지정하고 lowest-price 할당으로 가장 싼 풀부터 채운다</td>
          <td>풀 다양화는 유효하지만 lowest-price는 가격을 우선하므로 중단·재처리 감소를 우선하는 요구에는 용량 중심 전략이 더 적절하다.</td>
          </tr>
          <tr>
          <td>기존 유형을 세 AZ에서 사용하고 각 AZ의 On-Demand Capacity Reservation을 확보한다</td>
          <td>On-Demand 예약으로 중단 위험을 줄일 수 있으나 Spot 비중 유지라는 비용 조건을 바꾼다.</td>
          </tr>
          <tr>
          <td>단일 유형 Spot 풀의 최대 용량을 늘리고 재시도 대기 시간을 짧게 설정한다</td>
          <td>최대 수량과 짧은 재시도만으로 공급이 부족한 단일 풀의 용량이나 회수 위험이 개선되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/allocation-strategies.html">Spot 할당 전략</a> · <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-capacity-rebalancing.html">Capacity Rebalancing</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 체크포인트를 S3에 남기는 Spot 배치 ASG가 한 인스턴스 유형·한 AZ에 집중되어 중단과 대기 시간이 늘었다. 동일 바이너리가 여러
              유형과 AZ에서 검증되었고 작업량은 일정하지 않다. 비용 한도 때문에 Spot 비중은 유지해야 한다. 최저 순간
              단가보다 중단에 따른 재처리 감소를 우선하면서 장기 약정은 피하려 한다. 가장 적절한 ASG 정책은 무엇인가?
            answer: 여러 유형·AZ의 Spot 풀과 capacity-optimized 할당을 사용하고 Capacity Rebalancing을 켠다
            wrong:
              - 여러 유형·AZ를 지정하고 lowest-price 할당으로 가장 싼 풀부터 채운다
              - 기존 유형을 세 AZ에서 사용하고 각 AZ의 On-Demand Capacity Reservation을 확보한다
              - 단일 유형 Spot 풀의 최대 용량을 늘리고 재시도 대기 시간을 짧게 설정한다
      - id: Q20-07
        type: mcq
        title: Q20-07 · 전체 범위 혼합 문제
        explain: |
          <p>Multi-AZ DB 인스턴스 배포는 다른 AZ의 대기 DB와 관리형 장애 조치를 제공한다. 이 문제는 읽기 확장보다 AZ 장애 복구가 핵심이며 장애 조치 중 연결 재수립은 앱이 처리해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>같은 AZ의 새 DB에 주기적으로 데이터를 복사하고 장애 시 수동 전환한다</td>
          <td>같은 AZ 복사와 수동 전환은 요구한 AZ 장애 경계·관리형 자동 장애 조치와 다르다.</td>
          </tr>
          <tr>
          <td>일일 스냅샷만 추가하고 장애 시 새 DB를 수동 생성한다</td>
          <td>백업 복원은 데이터 보호에 유용하지만 요구한 관리형 자동 장애 조치가 아니다.</td>
          </tr>
          <tr>
          <td>같은 AZ에 읽기 복제본만 두고 자동 장애 조치를 가정한다</td>
          <td>일반 읽기 복제본은 읽기 확장·별도 승격 용도이며 같은 AZ 배치는 AZ 장애 경계를 나누지도 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html">RDS Multi-AZ 배포 구분</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 주문 DB는 RDS MySQL 단일 DB 인스턴스로 운영 중이다. 읽기 성능은 충분하지만 한 AZ 장애 때 수동 복원 없이 관리형 장애
              조치를 원한다. 애플리케이션은 재연결을 처리할 수 있다. 요구에 가장 직접적으로 맞는 변경은 무엇인가?
            answer: Multi-AZ DB 인스턴스 배포로 전환한다
            wrong:
              - 같은 AZ의 새 DB에 주기적으로 데이터를 복사하고 장애 시 수동 전환한다
              - 일일 스냅샷만 추가하고 장애 시 새 DB를 수동 생성한다
              - 같은 AZ에 읽기 복제본만 두고 자동 장애 조치를 가정한다
      - id: Q20-08
        type: mcq
        title: Q20-08 · 전체 범위 혼합 문제
        explain: |
          <p>재고 조건과 감소를 하나의 조건부 업데이트로 평가하면 여러 요청이 동시에 도착해도 허용 조건을 만족하는 변경만 반영할 수 있다. 먼저 읽은 값만 믿는 방식은 읽기와 쓰기 사이 경쟁을 막지 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>클라이언트가 읽은 재고에서 빼고 조건 없는 PutItem을 보낸다</td>
          <td>동시 클라이언트가 같은 재고를 읽고 서로의 변경을 덮어쓸 수 있다.</td>
          </tr>
          <tr>
          <td>기본 테이블에서 강력한 일관성 GetItem 후 조건 없는 UpdateItem으로 차감한다</td>
          <td>최신 값을 읽어도 읽기와 쓰기 사이 다른 요청이 변경할 수 있어 차감 조건을 원자적으로 보장하지 못한다.</td>
          </tr>
          <tr>
          <td>재고 수량 조건 없이 TransactWriteItems에서 감소 연산만 실행한다</td>
          <td>트랜잭션 사용만으로 재고가 충분하다는 업무 조건이 자동 추가되지 않는다. 조건 없는 감소는 음수가 될 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Expressions.ConditionExpressions.html">DynamoDB 조건부 업데이트</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: DynamoDB에 한정 수량 상품의 재고를 저장한다. 동시에 여러 구매 요청이 오더라도 재고가 음수가 되면 안 되고, 구매자는 최신 재고를
              먼저 읽었는지와 관계없이 원자적으로 수량을 차감해야 한다. 어떤 방식을 사용해야 하는가?
            answer: 재고가 충분한 경우에만 감소하는 조건부 UpdateItem을 사용한다
            wrong:
              - 클라이언트가 읽은 재고에서 빼고 조건 없는 PutItem을 보낸다
              - 기본 테이블에서 강력한 일관성 GetItem 후 조건 없는 UpdateItem으로 차감한다
              - 재고 수량 조건 없이 TransactWriteItems에서 감소 연산만 실행한다
      - id: Q20-09
        type: mcq
        title: Q20-09 · 전체 범위 혼합 문제
        explain: |
          <p>Viewer 인증과 원본 읽기·키 사용 권한은 별개다. SSE-KMS 원본에는 해당 배포의 KMS 복호화 경로를 허용하고, 버킷의 기존 공개 읽기를 차단한 뒤 특정 배포의 OAC 요청만 허용해야 우회를 막을 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 공개 읽기를 유지한 채 TTL만 줄인다</td>
          <td>TTL은 KMS 복호화 권한을 부여하지 않으며 공개 읽기 우회도 남는다.</td>
          </tr>
          <tr>
          <td>Viewer 서명 URL만 다시 발급하고 원본·KMS 정책은 유지한다</td>
          <td>Viewer 서명은 원본의 KMS 키 사용 허용이나 기존 S3 공개 읽기를 수정하지 않는다.</td>
          </tr>
          <tr>
          <td>배포의 viewer 인증을 제거해 KMS 오류를 우회한다</td>
          <td>사용자 인증을 제거해도 원본의 KMS 정책 거부가 해결되지 않고 접근 범위만 넓어진다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html">OAC의 SSE-KMS 키 정책과 버킷 정책</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: CloudFront의 S3 일반 버킷 원본을 OAC로 연결했지만 SSE-KMS 객체에서만 403이 발생한다. 고객 관리형 KMS 키를
              사용하며 viewer 인증은 이미 정상이다. 기존 S3 공개 읽기도 제거해 특정 배포만 원본을 읽도록 하려면
              확인·수정할 조치 두 가지는 무엇인가?
            answer: KMS 키 정책에 필요한 CloudFront 복호화 권한을 특정 배포 조건으로 허용한다
            wrong:
              - S3 공개 읽기를 유지한 채 TTL만 줄인다
              - Viewer 서명 URL만 다시 발급하고 원본·KMS 정책은 유지한다
              - 배포의 viewer 인증을 제거해 KMS 오류를 우회한다
            answers:
              - KMS 키 정책에 필요한 CloudFront 복호화 권한을 특정 배포 조건으로 허용한다
              - 기존 공개 읽기를 차단하고 버킷 정책을 해당 CloudFront 배포의 OAC 읽기로 제한한다
            options:
              - KMS 키 정책에 필요한 CloudFront 복호화 권한을 특정 배포 조건으로 허용한다
              - S3 공개 읽기를 유지한 채 TTL만 줄인다
              - 기존 공개 읽기를 차단하고 버킷 정책을 해당 CloudFront 배포의 OAC 읽기로 제한한다
              - Viewer 서명 URL만 다시 발급하고 원본·KMS 정책은 유지한다
              - 배포의 viewer 인증을 제거해 KMS 오류를 우회한다
      - id: Q20-10
        type: mcq
        title: Q20-10 · 전체 범위 혼합 문제
        explain: |
          <p>두 리전이 동시에 서비스하고 선택 기준이 사용자에게 더 나은 네트워크 지연이므로 지연 시간 기반 라우팅이 적합하다. 국가별 고정 분류나 비율 분산과 선택 기준이 다르다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>가중치 라우팅만 사용해 같은 비율로 나눈다</td>
          <td>가중치는 지정한 비율로 응답을 분산하며 최적 지연을 기준으로 리전을 고르지 않는다.</td>
          </tr>
          <tr>
          <td>장애 조치 라우팅으로 항상 한 리전만 활성화한다</td>
          <td>장애 조치 정책은 주로 활성·대기 구성이며 두 리전의 지연을 비교하려는 목적과 다르다.</td>
          </tr>
          <tr>
          <td>단순 라우팅 레코드에 두 리전 주소를 함께 넣는다</td>
          <td>두 주소 제공만으로 사용자에 대한 네트워크 지연을 비교해 리전을 선택하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html">Route 53 라우팅 정책</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 서울과 프랑크푸르트에서 같은 API를 운영하며 두 리전 모두 정상 상태로 트래픽을 처리한다. 사용자의 국가를 고정 기준으로 삼기보다 더
              좋은 네트워크 지연을 제공하는 리전으로 DNS 응답을 주려 한다. 적합한 Route 53 정책은 무엇인가?
            answer: 지연 시간 기반 라우팅을 사용한다
            wrong:
              - 가중치 라우팅만 사용해 같은 비율로 나눈다
              - 장애 조치 라우팅으로 항상 한 리전만 활성화한다
              - 단순 라우팅 레코드에 두 리전 주소를 함께 넣는다
      - id: Q20-11
        type: mcq
        title: Q20-11 · 전체 범위 혼합 문제
        explain: |
          <p>Provisioned concurrency는 실행 환경을 미리 초기화해 준비하므로 예측 가능한 트래픽의 시작 지연을 줄이는 데 적합하다. 준비 용량 비용이 있으며 초과 트래픽의 지연과 별도 한도까지 없애지는 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>함수 제한 시간을 늘려 초기화와 실행에 허용되는 대기 시간을 확보한다</td>
          <td>허용 시간을 늘리는 것은 초기화 지연을 줄이는 것이 아니므로 첫 요청 응답 지연 목표를 직접 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>동시 실행 계정 한도만 높이고 실행 환경은 기존처럼 요청 때 초기화한다</td>
          <td>동시 실행 한도를 늘리는 것만으로 미리 초기화한 환경이 준비되는 것은 아니어서 콜드 스타트 목표를 직접 해결하지 않는다.</td>
          </tr>
          <tr>
          <td>Reserved concurrency로 필요한 동시 실행 몫을 확보하고 초기화 설정은 그대로 둔다</td>
          <td>Reserved concurrency는 실행 몫과 상한을 관리하지만 미리 초기화한 환경을 준비하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html">Lambda 동시 실행 설정</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: 일반 Lambda 기반 검색 API에서 새 실행 환경의 초기화 때문에 첫 요청 지연이 자주 발생한다. 업무 시간의 예상 호출량은 안정적이며
              추가 준비 비용을 감수해 시작 지연을 줄이려 한다. 어떤 설정이 가장 직접적으로 맞는가?
            answer: Provisioned concurrency를 필요한 버전·별칭에 구성한다
            wrong:
              - 함수 제한 시간을 늘려 초기화와 실행에 허용되는 대기 시간을 확보한다
              - 동시 실행 계정 한도만 높이고 실행 환경은 기존처럼 요청 때 초기화한다
              - Reserved concurrency로 필요한 동시 실행 몫을 확보하고 초기화 설정은 그대로 둔다
      - id: Q20-12
        type: mcq
        title: Q20-12 · 전체 범위 혼합 문제
        explain: |
          <p>처리보다 짧은 숨김 시간은 실행 중 재수신을 늘릴 수 있으므로 실제 처리 시간에 맞춘다. 반복 실패는 수신 횟수 기준으로 DLQ에 분리하고 알림·조사·재처리 절차를 연결하면 정상 작업의 낭비를 줄인다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>메시지를 수신하는 즉시 삭제하고 변환 실패는 로그만 남긴다</td>
          <td>완료 전에 삭제하면 소비자 중단·일시 실패 때 작업을 재시도할 메시지를 잃는다.</td>
          </tr>
          <tr>
          <td>Visibility timeout만 하루로 늘리고 영구 실패 분리는 구성하지 않는다</td>
          <td>긴 숨김 시간만으로 영구 실패를 조사용 큐에 분리하지 못하고 재시도·장애 인지까지 늦어진다.</td>
          </tr>
          <tr>
          <td>메시지 보관 기간을 정상 처리 시간보다 짧게 줄여 실패 항목을 자동 만료시킨다</td>
          <td>짧은 보관 기간으로 일시 오류와 정상 대기 작업까지 만료시킬 수 있어 입력 보존 요구를 해친다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html">SQS DLQ</a> · <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">Visibility timeout</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: SQS Standard 소비자는 변환 불가능한 파일 메시지 하나를 반복 수신해 처리 시간을 소모한다. 정상 파일은 보통 2분 안에 끝나지만
              visibility timeout은 20초이며, 영구 실패를 분리해 조사하되 일시 오류에는 제한된 재시도를 허용하려
              한다. 적절한 구성은 무엇인가?
            answer: 처리 시간에 맞는 visibility timeout과 수신 횟수 기준의 DLQ·조사 알림을 구성한다
            wrong:
              - 메시지를 수신하는 즉시 삭제하고 변환 실패는 로그만 남긴다
              - Visibility timeout만 하루로 늘리고 영구 실패 분리는 구성하지 않는다
              - 메시지 보관 기간을 정상 처리 시간보다 짧게 줄여 실패 항목을 자동 만료시킨다
      - id: Q20-13
        type: mcq
        title: Q20-13 · 전체 범위 혼합 문제
        explain: |
          <p>EventBridge replay는 아카이브를 만든 원래 버스로 반환하며 특정 규칙만 대상으로 지정할 수 있다. 어제 구간과 복구 규칙을 함께 제한하면 배송 규칙의 실시간 동작을 유지하면서 과거 결제 이벤트를 복구 대상으로만 전달한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>회계 규칙의 대상을 복구 Lambda로 교체한 뒤 어제 구간을 모든 규칙으로 replay한다</td>
          <td>회계 대상은 바뀌어도 replay가 배송 규칙에 도달하는 경로가 남는다. 실시간 회계 대상도 함께 변경된다.</td>
          </tr>
          <tr>
          <td>아카이브의 어제 구간을 모든 규칙으로 replay하고 회계 소비자를 새 버전으로 교체한다</td>
          <td>모든 규칙으로 보내면 과거 결제에 매칭되는 배송 규칙도 실행될 수 있어 배송 중복 위험이 있다.</td>
          </tr>
          <tr>
          <td>배송 규칙을 비활성화한 뒤 어제 구간을 replay하고 완료 후 배송 규칙을 활성화한다</td>
          <td>과거 배송은 막을 수 있지만 비활성화 기간의 실시간 배송 이벤트 처리도 중단된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-replay-archived-event.html">아카이브 replay의 특정 규칙 지정</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: EventBridge 버스에는 배송·회계 규칙과 지난 30일 이벤트의 아카이브가 있다. 회계 소비자의 버그로 어제 결제 완료 이벤트를 다시
              계산해야 하지만 배송이 재실행되면 안 된다. 복구 Lambda를 대상으로 결제 완료 패턴의 복구 규칙을 같은 버스에
              만들었다. 기존 배송·회계의 실시간 처리를 유지할 재처리 계획은 무엇인가?
            answer: 아카이브의 어제 구간을 원래 버스로 replay하며 대상 규칙을 복구 규칙으로 지정한다
            wrong:
              - 회계 규칙의 대상을 복구 Lambda로 교체한 뒤 어제 구간을 모든 규칙으로 replay한다
              - 아카이브의 어제 구간을 모든 규칙으로 replay하고 회계 소비자를 새 버전으로 교체한다
              - 배송 규칙을 비활성화한 뒤 어제 구간을 replay하고 완료 후 배송 규칙을 활성화한다
      - id: Q20-14
        type: mcq
        title: Q20-14 · 전체 범위 혼합 문제
        explain: |
          <p>ViaService는 S3가 역할을 대신해 사용하는 경로를 제한하고 S3 암호화 컨텍스트의 객체 ARN은 대상 버킷을 제한한다. 두 조건이 서로 다른 요구를 해결한다. Bucket Key 사용 시에는 컨텍스트가 버킷 ARN이 되므로 이 문제의 객체 ARN 조건을 그대로 재사용하면 안 된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>kms:CallerAccount를 B 계정 번호와 일치하도록 제한한다</td>
          <td>호출 계정 범위는 좁히지만 같은 B 역할의 직접 Decrypt나 다른 버킷 사용을 구분하지 못한다.</td>
          </tr>
          <tr>
          <td>aws:RequestedRegion을 reports 버킷의 리전과 일치하도록 제한한다</td>
          <td>같은 리전의 다른 버킷과 직접 KMS 요청도 리전 조건을 만족하므로 서비스·데이터 범위가 제한되지 않는다.</td>
          </tr>
          <tr>
          <td>kms:EncryptionAlgorithm을 SYMMETRIC_DEFAULT로 제한한다</td>
          <td>대칭 암호화 알고리즘은 같은 알고리즘을 쓰는 다른 버킷이나 직접 Decrypt를 구별하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html#conditions-kms-via-service">KMS ViaService 조건</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html">S3 KMS 암호화 컨텍스트</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: A 계정의 S3 reports 버킷은 고객 관리형 KMS 키로 암호화하고 Bucket Key는 사용하지 않는다. B 계정 역할의
              GetObject와 양쪽 계정의 kms:Decrypt 허용은 이미 정상이다. 이 역할이 키를 사용할 때 reports
              버킷의 S3 복호화만 허용하고 직접 KMS Decrypt 호출과 다른 버킷 사용은 제한하려 한다. 기존 키 사용
              허용문에 함께 적용할 조건 두 가지는 무엇인가?
            answer: kms:ViaService를 버킷 리전의 s3 서비스 이름과 일치하도록 제한한다
            wrong:
              - kms:CallerAccount를 B 계정 번호와 일치하도록 제한한다
              - aws:RequestedRegion을 reports 버킷의 리전과 일치하도록 제한한다
              - kms:EncryptionAlgorithm을 SYMMETRIC_DEFAULT로 제한한다
            answers:
              - kms:ViaService를 버킷 리전의 s3 서비스 이름과 일치하도록 제한한다
              - kms:EncryptionContext:aws:s3:arn을 arn:aws:s3:::reports/*로 제한한다
            options:
              - kms:CallerAccount를 B 계정 번호와 일치하도록 제한한다
              - aws:RequestedRegion을 reports 버킷의 리전과 일치하도록 제한한다
              - kms:EncryptionAlgorithm을 SYMMETRIC_DEFAULT로 제한한다
              - kms:ViaService를 버킷 리전의 s3 서비스 이름과 일치하도록 제한한다
              - kms:EncryptionContext:aws:s3:arn을 arn:aws:s3:::reports/*로 제한한다
      - id: Q20-15
        type: mcq
        title: Q20-15 · 전체 범위 혼합 문제
        explain: |
          <p>개별 규칙 Count override로 즉시 차단을 멈추되 label을 남길 수 있다. 뒤의 custom rule이 label과 경로를 결합하면 다른 경로의 SQLi는 계속 차단하고 /articles의 다른 관리형 규칙도 적용된다. 예외 경로의 앱 입력 검증은 별도 유지해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>정상 게시자 IP set의 Allow 규칙을 관리형 그룹보다 앞에 두고 그룹의 Block을 유지한다</td>
          <td>앞선 Allow는 해당 IP의 이후 WAF 평가를 종료하므로 게시자의 다른 요청과 다른 관리형 보호까지 우회할 수 있다.</td>
          </tr>
          <tr>
          <td>관리형 그룹의 scope-down 조건에서 /articles를 제외하고 그룹의 Block 동작을 유지한다</td>
          <td>경로를 그룹에서 제외하면 /articles에 SQLi 이외의 관리형 검사도 적용되지 않는다.</td>
          </tr>
          <tr>
          <td>그룹 전체를 Count로 override하고 /admin 경로에는 별도 SQLi Block 규칙을 추가한다</td>
          <td>전체 그룹 Count는 /admin 밖의 다른 공격 규칙까지 차단에서 관측으로 바꾸어 요구보다 보호 범위를 크게 줄인다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-label-overview.html">WAF label과 후속 규칙 평가</a> · <a href="https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-rule-group-override-options.html">규칙 action override</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: ALB의 WAF 관리형 규칙 그룹에서 특정 SQLi 규칙이 /articles의 정상 HTML 본문을 차단한다. 다른 경로의 SQLi 차단과
              /articles의 나머지 관리형 보호는 유지해야 한다. 해당 규칙은 일치 요청에 label을 붙이며 뒤 규칙에서
              label을 참조할 수 있다. 앱 배포 전 오차단만 줄일 구성은 무엇인가?
            answer: 해당 SQLi 규칙만 Count로 override하고 뒤 규칙에서 해당 label과 /articles 이외 경로를 함께
              Block한다
            wrong:
              - 정상 게시자 IP set의 Allow 규칙을 관리형 그룹보다 앞에 두고 그룹의 Block을 유지한다
              - 관리형 그룹의 scope-down 조건에서 /articles를 제외하고 그룹의 Block 동작을 유지한다
              - 그룹 전체를 Count로 override하고 /admin 경로에는 별도 SQLi Block 규칙을 추가한다
      - id: Q20-16
        type: mcq
        title: Q20-16 · 전체 범위 혼합 문제
        explain: |
          <p>CloudTrail은 변경 작업의 API 호출 주체·시각 등의 감사 근거를 제공하고 Config는 리소스의 과거·현재 구성과 관계를 확인하는 데 사용한다. 두 기록을 결합해야 누가 무엇을 바꿨는지 연결하기 쉽다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>AWS Config의 현재 구성 스냅샷만 확인하고 과거 이력은 사용하지 않는다</td>
          <td>현재 스냅샷만으로 변경 주체와 변경 전후 전체 구성 이력을 모두 확인할 수 없다.</td>
          </tr>
          <tr>
          <td>VPC Flow Logs의 ACCEPT·REJECT 기록</td>
          <td>흐름 로그는 네트워크 송수신 정보를 기록하며 보안 그룹 변경 API 주체나 구성 이력 자체를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>CloudTrail의 S3 객체 데이터 이벤트만 조사한다</td>
          <td>S3 객체 작업 기록은 보안 그룹 변경 API의 관리 이벤트를 대신하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html">CloudTrail 감사</a> · <a href="https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html">Config 구성 이력</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 보안 그룹의 인터넷 전체 SSH 허용 규칙이 어제 추가되었다. 감사자는 변경 API를 호출한 주체와, 변경 전후 실제 리소스 구성 이력을
              각각 확인해야 한다. 필요한 기록이 이미 활성화되어 있다면 사용할 서비스 두 가지는 무엇인가?
            answer: CloudTrail의 관련 API 이벤트
            wrong:
              - AWS Config의 현재 구성 스냅샷만 확인하고 과거 이력은 사용하지 않는다
              - VPC Flow Logs의 ACCEPT·REJECT 기록
              - CloudTrail의 S3 객체 데이터 이벤트만 조사한다
            answers:
              - CloudTrail의 관련 API 이벤트
              - AWS Config의 구성 이력
            options:
              - CloudTrail의 관련 API 이벤트
              - AWS Config의 현재 구성 스냅샷만 확인하고 과거 이력은 사용하지 않는다
              - AWS Config의 구성 이력
              - VPC Flow Logs의 ACCEPT·REJECT 기록
              - CloudTrail의 S3 객체 데이터 이벤트만 조사한다
      - id: Q20-17
        type: mcq
        title: Q20-17 · 전체 범위 혼합 문제
        explain: |
          <p>프로젝트 범위 필터와 약정 선결제의 상각 관점을 모두 맞춘 예산이어야 한다. Budgets의 실제·예측 알림으로 두 임계 조건을 구성할 수 있다. 청구 자료와 알림은 지연될 수 있으며 비용의 실시간 강제 상한은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Project=A로 필터한 unblended cost 예산에 실제 비용과 예측 비용 알림을 구성한다</td>
          <td>태그별 실제·예측 알림은 가능하지만 unblended 관점은 선결제를 사용 기간에 상각한 월별 계획과 다르다.</td>
          </tr>
          <tr>
          <td>계정 전체 amortized cost 예산에 실제 비용과 예측 비용 알림을 구성한다</td>
          <td>상각 관점은 맞지만 다른 프로젝트 지출도 합산되므로 A 프로젝트 자체의 예산 초과를 구별하지 못한다.</td>
          </tr>
          <tr>
          <td>Project=A의 Cost Anomaly Detection 모니터에 영향 비용 기준 이메일 구독을 구성한다</td>
          <td>이상 탐지는 과거 패턴 대비 비정상 지출을 찾는 용도다. 정상적으로 증가하는 월말 예측의 고정 예산 초과와 같은 조건이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-create.html">Budgets 비용 예산과 필터</a> · <a href="https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_budgets_CostTypes.html">Budgets 비용 종류</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 팀은 Project=A 태그의 컴퓨팅 비용을 월별 계획과 비교하려 한다. 선결제 Savings Plans 구매월의 청구 급증 대신 약정
              비용을 사용 기간에 나눈 관점으로 보고 싶고, 실제 누적액 또는 월말 예측액이 한도를 넘으면 이메일을 받아야 한다.
              비용 할당 태그는 활성화되어 있다. 직접 집계 코드를 최소화할 설정은 무엇인가?
            answer: Project=A로 필터한 amortized cost 예산에 실제 비용과 예측 비용 알림을 구성한다
            wrong:
              - Project=A로 필터한 unblended cost 예산에 실제 비용과 예측 비용 알림을 구성한다
              - 계정 전체 amortized cost 예산에 실제 비용과 예측 비용 알림을 구성한다
              - Project=A의 Cost Anomaly Detection 모니터에 영향 비용 기준 이메일 구독을 구성한다
      - id: Q20-18
        type: mcq
        title: Q20-18 · 전체 범위 혼합 문제
        explain: |
          <p>측정된 병목은 데이터 복원이나 앱 용량보다 승인·전환 절차다. 상시 비용 제약을 유지하면서 장애 판단·검증·DNS 전환을 런북으로 개선하고 캐시·승인 시간을 포함한 전체 복구 시험으로 목표 충족을 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 리전에 전체 용량을 상시 가동하고 항상 양쪽에 쓰도록 전환한다</td>
          <td>전체 다중 리전 상시 용량과 동시 쓰기는 비용·정합성 운영을 크게 바꿔 상시 비용을 늘릴 수 없다는 조건과 맞지 않는다.</td>
          </tr>
          <tr>
          <td>DB 백업 간격만 줄이고 기존 수동 DNS·승인 절차는 유지한다</td>
          <td>백업 주기는 데이터 손실 목표에 영향을 주지만 이번 훈련에서 확인된 전환·승인 지연을 줄이지 않는다.</td>
          </tr>
          <tr>
          <td>서버 인스턴스 크기만 두 배로 높이고 DNS 전환 단계는 그대로 둔다</td>
          <td>이미 20분에 준비된 컴퓨팅만 키워도 수동 승인·DNS 단계의 지연이 그대로 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html">DR 계획 시험과 전환</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 회사는 다른 리전에 축소된 전체 웹 환경과 DB 복제를 유지하며 상시 비용을 더 늘릴 수 없다. 복구 훈련에서 앱·DB 준비는 20분에
              끝났지만 담당자 승인과 수동 DNS 변경 때문에 실제 재개가 90분 걸려 RTO 1시간을 넘겼다. 가장 직접적인 개선은
              무엇인가?
            answer: 축소 환경의 장애 판단·DNS 전환을 자동화하고 승인·캐시 영향까지 재시험한다
            wrong:
              - 두 리전에 전체 용량을 상시 가동하고 항상 양쪽에 쓰도록 전환한다
              - DB 백업 간격만 줄이고 기존 수동 DNS·승인 절차는 유지한다
              - 서버 인스턴스 크기만 두 배로 높이고 DNS 전환 단계는 그대로 둔다
      - id: Q20-19
        type: mcq
        title: Q20-19 · 전체 범위 혼합 문제
        explain: |
          <p>전체 로드로 기존 데이터를 옮기는 동안 CDC로 원본 변경을 따라가면 최종 전환 때 처리할 차이를 줄일 수 있다. 대상 스키마·로그 전제와 복제 지연·검증·최종 쓰기 전환 절차는 별도로 관리해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DMS CDC를 켰다는 사실만 확인하고 지연·데이터 검증 전에 대상 DB로 쓰기를 전환한다</td>
          <td>CDC가 실행된다고 변경분이 모두 적용됐다는 뜻은 아니다. 지연과 정합성을 확인하고 최종 쓰기를 통제해야 한다.</td>
          </tr>
          <tr>
          <td>pg_dump를 한 번 떠서 복원하되 복사 중 원본 쓰기는 유지하고 이후 변경 전달은 생략한다</td>
          <td>복사 중 발생한 변경이 반영되지 않으므로 마지막 전환에서 변경분 손실을 줄이는 요구를 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>DMS 작업을 전체 로드만으로 구성하고 원본의 후속 갱신은 캡처하지 않는다</td>
          <td>전체 로드만 하면 복사 중·이후 변경을 지속 반영하지 못하므로 짧은 쓰기 중단 전환 요구가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.html">DMS 마이그레이션 작업</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: 온프레미스 PostgreSQL DB를 RDS PostgreSQL로 옮긴다. 초기 데이터가 많아 복사하는 동안 원본은 계속 갱신되어야 하고,
              최종 전환 시 쓰기 중단 시간을 줄여야 한다. 대상 스키마와 필요한 로그 설정은 준비되어 있다. 적합한 이관 방식은
              무엇인가?
            answer: AWS DMS의 전체 로드와 CDC를 구성하고 지연·검증 후 전환한다
            wrong:
              - DMS CDC를 켰다는 사실만 확인하고 지연·데이터 검증 전에 대상 DB로 쓰기를 전환한다
              - pg_dump를 한 번 떠서 복원하되 복사 중 원본 쓰기는 유지하고 이후 변경 전달은 생략한다
              - DMS 작업을 전체 로드만으로 구성하고 원본의 후속 갱신은 캡처하지 않는다
      - id: Q20-20
        type: mcq
        title: Q20-20 · 전체 범위 혼합 문제
        explain: |
          <p>ECS와 Fargate는 Kubernetes가 필요 없는 컨테이너에서 호스트 운영 부담을 줄인다. 컨테이너 앱의 AWS API 권한은 task role에 부여하며 이미지·로그 등 실행 준비용 execution role과 구분해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>작업 실행 역할만 배정하고 앱용 task role은 생략한다</td>
          <td>이미지 가져오기·로그 전송용 실행 역할이 앱 코드의 S3 API 권한을 자동 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>앱의 S3 권한을 task execution role에만 부여한다</td>
          <td>Execution role은 에이전트의 작업 시작 등에 사용되며 앱 코드가 사용하는 task role을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>ECS의 EC2 실행 방식으로 앱을 배포하고 고객이 호스트 AMI 패치·교체를 운영한다</td>
          <td>가능한 실행 방식이지만 호스트 OS와 용량 운영을 줄이려는 요구에는 Fargate가 더 직접적이다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html">ECS task role</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html">Fargate</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: 회사는 Docker 기반 API를 AWS에서 운영하되 EC2 호스트의 OS 패치와 용량 관리를 줄이고 싶다. Kubernetes 호환
              요구는 없으며 컨테이너 앱 코드가 특정 S3 버킷을 읽어야 한다. 적절한 구성 요소 두 가지는 무엇인가?
            answer: ECS 서비스에 Fargate 실행 방식을 사용한다
            wrong:
              - 작업 실행 역할만 배정하고 앱용 task role은 생략한다
              - 앱의 S3 권한을 task execution role에만 부여한다
              - ECS의 EC2 실행 방식으로 앱을 배포하고 고객이 호스트 AMI 패치·교체를 운영한다
            answers:
              - ECS 서비스에 Fargate 실행 방식을 사용한다
              - 앱의 S3 읽기 권한을 ECS task role에 부여한다
            options:
              - 작업 실행 역할만 배정하고 앱용 task role은 생략한다
              - ECS 서비스에 Fargate 실행 방식을 사용한다
              - 앱의 S3 권한을 task execution role에만 부여한다
              - 앱의 S3 읽기 권한을 ECS task role에 부여한다
              - ECS의 EC2 실행 방식으로 앱을 배포하고 고객이 호스트 AMI 패치·교체를 운영한다
