id: saa-day-16
name: VPC·네트워크
part: 16일 차
color: "#4385ef"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: Q16-01
        type: mcq
        title: Q16-01 · VPC·네트워크
        explain: |
          <p>Zonal 퍼블릭 NAT의 인터넷 연결에는 NAT가 있는 공개 서브넷의 IGW행 경로가 필요하다. 앱에서 NAT까지만 길이 있어도 NAT 이후 인터넷 출구가 없으면 요청은 목적지에 도달하지 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>앱 서브넷의 기본 경로를 IGW로 직접 바꾸되 앱에는 프라이빗 IPv4만 유지한다.</td>
          <td>프라이빗 IPv4만 가진 앱은 IGW 기본 경로만으로 직접 IPv4 인터넷 통신을 할 수 없다. 명시된 NAT 이후 경로를 수정해야 한다.</td>
          </tr>
          <tr>
          <td>NAT의 EIP를 새 주소로 교체하되 NAT 서브넷의 local 경로만 유지한다.</td>
          <td>정상 EIP를 교체해도 인터넷으로 향하는 다음 경로가 생기지 않는다. NAT 서브넷의 IGW행 경로 부족은 그대로다.</td>
          </tr>
          <tr>
          <td>앱 인바운드 SG에 인터넷 전체의 TCP 443을 추가한다.</td>
          <td>앱이 시작한 연결의 응답은 SG가 추적한다. NAT 이후 경로가 없는 문제를 인바운드 개방으로 해결할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-scenarios.html">NAT Gateway 사용 사례</a> · <a href="https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html">인터넷 게이트웨이</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 비공개 앱 서버가 외부 HTTPS API에 접속할 때 연결이 시간 초과된다. 앱 서브넷의 기본 경로는 공개 Zonal NAT로 연결됐고
              NAT에는 EIP가 있다. NAT 서브넷에는 VPC local 경로만 존재하며 보안 규칙은 요청·응답을 허용한다.
              필요한 수정은 무엇인가?
            answer: NAT 서브넷에 인터넷 게이트웨이행 IPv4 기본 경로를 구성하고 VPC에 IGW가 연결됐는지 확인한다.
            wrong:
              - 앱 서브넷의 기본 경로를 IGW로 직접 바꾸되 앱에는 프라이빗 IPv4만 유지한다.
              - NAT의 EIP를 새 주소로 교체하되 NAT 서브넷의 local 경로만 유지한다.
              - 앱 인바운드 SG에 인터넷 전체의 TCP 443을 추가한다.
      - id: Q16-02
        type: mcq
        title: Q16-02 · VPC·네트워크
        explain: |
          <p>172.16.8.10에는 /32가 /24와 /16보다 우선한다. 나머지 /24 주소는 TGW 검사망을, 일반 인터넷은 NAT를 사용하므로 호스트 하나의 예외를 만들면서 다른 두 경로 요구를 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>172.16.8.0/24의 대상을 VPN으로 바꾼다.</td>
          <td>결제 서버는 VPN을 사용하지만 같은 /24의 다른 서버도 검사망을 우회한다.</td>
          </tr>
          <tr>
          <td>172.16.0.0/16의 VPN 경로를 삭제한 뒤 같은 목적지와 대상으로 다시 추가한다.</td>
          <td>같은 /16을 재등록해도 더 구체적인 TGW /24가 결제 서버 트래픽에 계속 우선한다.</td>
          </tr>
          <tr>
          <td>0.0.0.0/0의 대상을 VPN으로 바꾸고 온프레미스 인터넷 출구를 사용한다.</td>
          <td>인터넷 출구를 VPN으로 변경하고도 결제 서버에는 더 구체적인 TGW /24가 우선한다. 결제 예외와 기존 인터넷 경로 유지 모두 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/route-tables-priority.html">VPC 최장 접두사 경로</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 앱 라우트 테이블에는 172.16.0.0/16→VPN, 172.16.8.0/24→TGW 검사망, 0.0.0.0/0→NAT가 있다.
              172.16.8.10의 레거시 결제 서버는 승인된 예외로 VPN을 사용해야 하고, 같은 /24의 나머지 서버는 검사망을
              통과해야 한다. 인터넷 API 경로도 유지해야 한다. 두 사설 경로의 반환 라우팅·허용 규칙이 준비됐다면 최소 경로
              변경은?
            answer: 172.16.8.10/32→VPN 경로를 추가한다.
            wrong:
              - 172.16.8.0/24의 대상을 VPN으로 바꾼다.
              - 172.16.0.0/16의 VPN 경로를 삭제한 뒤 같은 목적지와 대상으로 다시 추가한다.
              - 0.0.0.0/0의 대상을 VPN으로 바꾸고 온프레미스 인터넷 출구를 사용한다.
      - id: Q16-03
        type: mcq
        title: Q16-03 · VPC·네트워크
        explain: |
          <p>응답의 목적지는 클라이언트가 사용한 임시 포트다. NACL은 상태를 추적하지 않으므로 응답 방향도 별도로 허용해야 하며 허용 범위는 실제 클라이언트의 임시 포트 사용 범위에 맞춘다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>NACL의 443 허용 규칙을 더 높은 번호로 옮기면 응답이 자동 추적된다.</td>
          <td>규칙 번호를 바꿔도 NACL이 stateful로 바뀌지 않는다. 일치하는 반환 포트 허용 규칙이 필요하다.</td>
          </tr>
          <tr>
          <td>NACL 아웃바운드에 출발지 포트 443 조건을 넣으면 모든 클라이언트 임시 포트의 응답이 허용된다.</td>
          <td>일반적인 NACL TCP 포트 범위 규칙은 목적지 포트를 평가한다. 서버의 출발지 443만 생각해 동일 443을 열면 클라이언트 임시 포트 응답은 통과하지 못한다.</td>
          </tr>
          <tr>
          <td>SG 인바운드에 TCP 53000을 열고 NACL은 그대로 둔다.</td>
          <td>SG 인바운드 개방은 서버에서 나가는 응답을 막은 NACL 아웃바운드를 수정하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html">NACL 반환 임시 포트</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 웹 서버에 새 사용자 정의 NACL을 적용한 후 HTTPS 요청은 서버에 도착하지만 클라이언트는 응답을 받지 못한다. 클라이언트는 임시
              포트 53000을 사용하며 NACL 인바운드와 아웃바운드 모두 목적지 TCP 443만 허용한다. SG와 경로는
              정상이다. 최소 수정은 무엇인가?
            answer: NACL 아웃바운드에 클라이언트 주소 범위의 실제 반환 임시 포트 범위를 허용한다.
            wrong:
              - NACL의 443 허용 규칙을 더 높은 번호로 옮기면 응답이 자동 추적된다.
              - NACL 아웃바운드에 출발지 포트 443 조건을 넣으면 모든 클라이언트 임시 포트의 응답이 허용된다.
              - SG 인바운드에 TCP 53000을 열고 NACL은 그대로 둔다.
      - id: Q16-04
        type: mcq
        title: Q16-04 · VPC·네트워크
        explain: |
          <p>SG 참조로 계층별 출발지를 식별하면 인스턴스 교체 시 IP 규칙 변경을 줄일 수 있다. 앱과 DB가 필요한 상위 계층의 SG와 포트만 허용해야 통신 범위를 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DB SG에 ALB SG를 출발지로 한 모든 포트를 허용한다.</td>
          <td>DB 연결을 시작하는 주체는 앱이다. ALB를 DB 출발지로 허용하는 것은 필요한 앱 경로와 맞지 않으며 범위도 넓다.</td>
          </tr>
          <tr>
          <td>ALB SG의 모든 허용 규칙을 앱과 DB SG에 복사한다.</td>
          <td>SG 참조는 규칙 복제가 아니다. 모든 계층에 같은 규칙을 복사하면 계층별 최소 허용 요구가 사라진다.</td>
          </tr>
          <tr>
          <td>앱 SG에 VPC 전체 CIDR의 모든 포트를 허용해 교체 작업을 줄인다.</td>
          <td>VPC 전체·모든 포트 허용은 ALB에서 오는 앱 요청만 받는다는 조건을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html">보안 그룹 규칙</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: ALB 뒤 앱 서버를 새 ASG로 교체할 때마다 IP가 바뀐다. 앱은 ALB에서 오는 TCP 8080만, DB는 앱에서 오는 TCP
              5432만 받아야 한다. 운영자는 교체 때마다 개별 IP 규칙을 수정하는 일을 없애고 싶다. 적절한 인바운드 규칙 두
              가지는 무엇인가?
            answer: 앱 SG에 출발지가 ALB SG인 TCP 8080을 허용한다.
            wrong:
              - DB SG에 ALB SG를 출발지로 한 모든 포트를 허용한다.
              - ALB SG의 모든 허용 규칙을 앱과 DB SG에 복사한다.
              - 앱 SG에 VPC 전체 CIDR의 모든 포트를 허용해 교체 작업을 줄인다.
            answers:
              - 앱 SG에 출발지가 ALB SG인 TCP 8080을 허용한다.
              - DB SG에 출발지가 앱 SG인 TCP 5432를 허용한다.
            options:
              - DB SG에 ALB SG를 출발지로 한 모든 포트를 허용한다.
              - ALB SG의 모든 허용 규칙을 앱과 DB SG에 복사한다.
              - 앱 SG에 출발지가 ALB SG인 TCP 8080을 허용한다.
              - 앱 SG에 VPC 전체 CIDR의 모든 포트를 허용해 교체 작업을 줄인다.
              - DB SG에 출발지가 앱 SG인 TCP 5432를 허용한다.
      - id: Q16-05
        type: mcq
        title: Q16-05 · VPC·네트워크
        explain: |
          <p>Gateway Endpoint는 같은 리전 S3행 경로를 제공해 해당 트래픽이 NAT를 통과하지 않도록 할 수 있다. 일반 외부 API는 기존 기본 경로를 사용하므로 별도 인터넷 통신도 유지된다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>동일 리전 S3 통신을 모두 다른 리전 프록시 EC2로 보내 처리량을 줄인다.</td>
          <td>다른 리전 프록시는 추가 컴퓨팅·전송 비용과 운영 부담을 만들며 같은 리전 S3 접근의 불필요한 우회다.</td>
          </tr>
          <tr>
          <td>S3 Interface Endpoint를 만들되 모든 앱 AZ마다 배치하고 비교 없이 항상 Gateway보다 비용이 낮다고 본다.</td>
          <td>Interface Endpoint도 S3 연결에 사용할 수 있지만 시간·처리량 요금이 있다. 같은 리전 VPC 앱의 비용 절감 요구에는 무료 Gateway 경로를 우선 비교해야 한다.</td>
          </tr>
          <tr>
          <td>NAT를 삭제하고 앱 SG 아웃바운드에 S3 관리형 prefix list만 허용한다.</td>
          <td>SG의 목적지 허용은 경로를 생성하지 않는다. Gateway Endpoint가 없으면 S3행 경로가 해결되지 않고 외부 라이선스 API도 끊긴다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html">Gateway Endpoint</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: 같은 리전의 비공개 EC2 작업자가 매일 대용량 S3 결과를 업로드한다. 외부 라이선스 API도 호출해야 하므로 NAT는 계속 필요하지만
              S3 때문에 늘어난 NAT 처리량 요금을 줄이고 싶다. 앱 코드와 S3 권한을 유지할 때 가장 적절한 구성은 무엇인가?
            answer: S3 Gateway Endpoint를 만들고 작업자 서브넷의 라우팅 테이블에 연결한다. 외부 API의 NAT 기본 경로는
              유지한다.
            wrong:
              - 동일 리전 S3 통신을 모두 다른 리전 프록시 EC2로 보내 처리량을 줄인다.
              - S3 Interface Endpoint를 만들되 모든 앱 AZ마다 배치하고 비교 없이 항상 Gateway보다 비용이
                낮다고 본다.
              - NAT를 삭제하고 앱 SG 아웃바운드에 S3 관리형 prefix list만 허용한다.
      - id: Q16-06
        type: mcq
        title: Q16-06 · VPC·네트워크
        explain: |
          <p>기존 서비스 이름을 사설 ENI로 연결하려면 지원되는 프라이빗 DNS를 사용해야 한다. Interface Endpoint ENI의 SG도 앱의 HTTPS 접속을 허용해야 하며 API 권한은 별도로 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Gateway Endpoint용 S3 prefix list 경로만 추가하면 Secrets Manager DNS도 사설로 바뀐다.</td>
          <td>S3 Gateway Endpoint 경로는 Secrets Manager Interface Endpoint의 DNS 해석과 접근 제어를 구성하지 않는다.</td>
          </tr>
          <tr>
          <td>앱 인스턴스에 퍼블릭 IPv4를 추가하고 인터넷 기본 경로를 활성화한다.</td>
          <td>퍼블릭 인터넷 접근은 인터넷 없이 API를 호출한다는 요구와 맞지 않으며 사설 DNS·엔드포인트 SG 문제를 고치지 않는다.</td>
          </tr>
          <tr>
          <td>엔드포인트 정책에 Allow를 추가하면 DNS와 SG 설정은 자동으로 변경된다.</td>
          <td>엔드포인트 정책은 경유 요청의 API 범위를 제한한다. DNS 해석이나 SG 허용을 대신 변경하는 기능이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html">Interface Endpoint 생성</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 앱이 인터넷 경로 없이 Secrets Manager API를 호출하도록 Interface Endpoint를 만들었다. 앱은 기존 서비스
              DNS 이름을 유지해야 한다. VPC DNS 설정은 지원 상태지만 연결은 여전히 퍼블릭 주소를 가리키고 엔드포인트
              SG에는 인바운드가 없다. 필요한 조치 두 가지는 무엇인가?
            answer: 엔드포인트의 프라이빗 DNS를 활성화해 서비스 이름이 엔드포인트 사설 주소로 해석되도록 한다.
            wrong:
              - Gateway Endpoint용 S3 prefix list 경로만 추가하면 Secrets Manager DNS도
                사설로 바뀐다.
              - 앱 인스턴스에 퍼블릭 IPv4를 추가하고 인터넷 기본 경로를 활성화한다.
              - 엔드포인트 정책에 Allow를 추가하면 DNS와 SG 설정은 자동으로 변경된다.
            answers:
              - 엔드포인트의 프라이빗 DNS를 활성화해 서비스 이름이 엔드포인트 사설 주소로 해석되도록 한다.
              - 엔드포인트 SG에 앱의 필요한 출발지에서 TCP 443 인바운드를 허용한다.
            options:
              - Gateway Endpoint용 S3 prefix list 경로만 추가하면 Secrets Manager DNS도
                사설로 바뀐다.
              - 앱 인스턴스에 퍼블릭 IPv4를 추가하고 인터넷 기본 경로를 활성화한다.
              - 엔드포인트 정책에 Allow를 추가하면 DNS와 SG 설정은 자동으로 변경된다.
              - 엔드포인트의 프라이빗 DNS를 활성화해 서비스 이름이 엔드포인트 사설 주소로 해석되도록 한다.
              - 엔드포인트 SG에 앱의 필요한 출발지에서 TCP 443 인바운드를 허용한다.
      - id: Q16-07
        type: mcq
        title: Q16-07 · VPC·네트워크
        explain: |
          <p>엔드포인트 정책도 통과 요청의 범위를 제한한다. 필요한 리소스에만 그 경로를 열어야 하며 IAM 허용이 엔드포인트 제한을 무효로 만들지는 않는다. 네트워크 응답을 받았다는 단서도 활용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>앱 역할에 AdministratorAccess를 연결하면 엔드포인트 제한을 넘어선다.</td>
          <td>호출자의 관리자 허용도 경로에 적용되는 엔드포인트 정책의 제한을 무시하지 못하며 불필요하게 권한을 넓힌다.</td>
          </tr>
          <tr>
          <td>버킷 정책에 해당 역할의 GetObject Allow를 다시 추가하고 엔드포인트 정책은 그대로 둔다.</td>
          <td>버킷·IAM의 허용은 엔드포인트에서 허용하지 않은 버킷 경유를 열어 주지 않는다. 거부 경계인 엔드포인트 정책을 수정해야 한다.</td>
          </tr>
          <tr>
          <td>엔드포인트를 없애고 같은 역할로 NAT를 통해 해당 버킷에 접속하도록 바꾼다.</td>
          <td>경로를 우회하면 읽을 수 있을 가능성은 있지만 필요한 버킷만 엔드포인트에 허용하는 최소 정책 수정 대신 NAT 비용과 인터넷 출구 의존성을 추가한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html">엔드포인트 정책</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: S3 Gateway Endpoint를 통해 접속하는 EC2 앱이 AccessDenied 응답을 받는다. 앱 역할에는 해당 객체의
              GetObject가 있고 버킷·조직 정책에는 거부가 없다. 엔드포인트 정책은 다른 버킷만 허용한다. 최소 권한을
              유지하는 가장 적절한 해결은 무엇인가? 회사는 해당 S3 통신을 기존 엔드포인트 경로로 유지해야 한다.
            answer: 엔드포인트 정책에 필요한 버킷·작업·주체 범위를 추가하고 기존 앱 역할 권한을 유지한다.
            wrong:
              - 앱 역할에 AdministratorAccess를 연결하면 엔드포인트 제한을 넘어선다.
              - 버킷 정책에 해당 역할의 GetObject Allow를 다시 추가하고 엔드포인트 정책은 그대로 둔다.
              - 엔드포인트를 없애고 같은 역할로 NAT를 통해 해당 버킷에 접속하도록 바꾼다.
      - id: Q16-08
        type: mcq
        title: Q16-08 · VPC·네트워크
        explain: |
          <p>Egress-only IGW는 IPv6에서 내부가 시작한 연결과 응답을 허용하면서 외부가 시작한 연결을 막는 요구에 맞는다. IPv4 기본 경로는 IPv6와 별도이며 NAT64가 필요한 상황도 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>0.0.0.0/0을 NAT로 보내면 IPv6 패킷도 같은 기본 경로를 사용한다.</td>
          <td>IPv4 기본 경로는 IPv6 패킷에 일치하지 않는다. 주소 체계별로 경로를 구성해야 한다.</td>
          </tr>
          <tr>
          <td>::/0을 일반 IGW로 보내면 설정과 관계없이 모든 외부 시작 연결이 차단된다.</td>
          <td>일반 IGW는 egress-only 기능과 다르다. 다른 접근 규칙이 허용하면 외부가 시작한 IPv6 연결도 가능하다.</td>
          </tr>
          <tr>
          <td>일반 IGW 기본 경로만 구성하고 인바운드 SG에서 인터넷 전체를 허용한다.</td>
          <td>일반 IGW와 열린 인바운드는 외부가 시작하는 연결을 막는 요구와 반대다. Egress-only 경로나 적절한 제한이 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html">Egress-only IGW</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: IPv6를 사용하는 앱 서버가 외부 업데이트 사이트에 연결해야 한다. 인터넷에서 새 연결을 시작해 서버에 들어오는 일은 허용할 수 없고
              IPv4 전용 목적지 변환 요구는 없다. 서버의 IPv6 주소를 유지하면서 가장 간단히 구성할 외부 경로는 무엇인가?
            answer: ::/0을 egress-only internet gateway로 보내고 필요한 보안 규칙을 적용한다.
            wrong:
              - 0.0.0.0/0을 NAT로 보내면 IPv6 패킷도 같은 기본 경로를 사용한다.
              - ::/0을 일반 IGW로 보내면 설정과 관계없이 모든 외부 시작 연결이 차단된다.
              - 일반 IGW 기본 경로만 구성하고 인바운드 SG에서 인터넷 전체를 허용한다.
      - id: Q16-09
        type: mcq
        title: Q16-09 · VPC·네트워크
        explain: |
          <p>각 AZ에 독립된 출구가 있으면 한 AZ의 중단이 남은 AZ의 NAT 경로를 끊지 않는다. 같은 AZ의 앱과 NAT를 연결하면 평상시 교차 AZ NAT 전송을 피하며 EIP 세 개의 허용 목록 안에 들어간다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>AZ A에 NAT 세 개와 서로 다른 EIP를 두고 각 앱 AZ를 NAT 하나씩에 연결한다.</td>
          <td>EIP와 NAT 수는 충분하지만 세 NAT가 같은 장애 도메인에 있어 A 장애가 모든 앱 출구에 영향을 준다.</td>
          </tr>
          <tr>
          <td>AZ B에 NAT 한 개와 EIP 세 개를 연결하고 세 앱 AZ의 기본 경로를 그 NAT로 연결한다.</td>
          <td>추가 EIP는 목적지별 연결 용량을 늘릴 수 있으나 NAT의 배치 AZ를 분산하지 않는다. A·C의 교차 AZ 전송과 B 장애 의존성도 남는다.</td>
          </tr>
          <tr>
          <td>AZ A와 B에 NAT를 두고 C 앱의 기본 경로를 B NAT로 연결한다.</td>
          <td>A·B는 독립 출구가 있지만 C는 평상시 B까지 교차 AZ 전송하고 B 장애 시 경로 변경이 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html">Zonal NAT 가용성</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 앱이 세 AZ에서 외부 결제 API를 호출한다. 보안 승인은 공개 Zonal NAT 방식이며 결제사는 출구 EIP 세 개까지 등록한다.
              어떤 AZ가 중단되어도 남은 AZ는 라우트 수정 없이 호출해야 하고, 평상시 NAT행 교차 AZ 전송도 피해야 한다.
              이 조건에서 가장 적절한 배치는?
            answer: AZ마다 NAT 한 개와 EIP 한 개를 두고 각 앱 서브넷을 같은 AZ NAT로 연결한다.
            wrong:
              - AZ A에 NAT 세 개와 서로 다른 EIP를 두고 각 앱 AZ를 NAT 하나씩에 연결한다.
              - AZ B에 NAT 한 개와 EIP 세 개를 연결하고 세 앱 AZ의 기본 경로를 그 NAT로 연결한다.
              - AZ A와 B에 NAT를 두고 C 앱의 기본 경로를 B NAT로 연결한다.
      - id: Q16-10
        type: mcq
        title: Q16-10 · VPC·네트워크
        explain: |
          <p>VPC Peering은 A–B와 B–C 연결을 A–C 전이 경로로 만들지 않는다. 다수 VPC의 허브형 연결은 TGW 등으로 설계하고 attachment와 VPC 양쪽 라우팅·접근 통제까지 구성해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>B의 모든 포트를 열면 피어링이 자동으로 A에서 C까지 전이된다.</td>
          <td>SG는 패킷을 허용할 수 있지만 지원되지 않는 전이적 라우팅 기능을 피어링에 추가하지 않는다.</td>
          </tr>
          <tr>
          <td>A의 기본 경로를 B의 IGW로 보내 C의 프라이빗 주소를 인터넷에서 찾는다.</td>
          <td>피어링 상대의 IGW를 자신의 출구로 사용할 수 없고 C의 사설 주소를 인터넷 경로로 찾는 설계도 맞지 않는다.</td>
          </tr>
          <tr>
          <td>B에 양방향 정적 경로만 추가하고 두 기존 피어링을 전이 허브로 사용한다.</td>
          <td>정적 경로를 적어도 피어링이 지원하지 않는 전이 전달이 생기지 않는다. A–C 직접 연결이나 TGW 같은 다른 연결 구조가 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html">VPC Peering 제한</a> · <a href="https://docs.aws.amazon.com/vpc/latest/tgw/tgw-route-tables.html">Transit Gateway 라우트 테이블</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: VPC A는 B와, B는 C와 피어링돼 있으며 CIDR는 서로 다르다. A의 앱이 B를 경유해 C의 DB에 연결하려 하자 실패했다. 팀은
              B의 SG만 열면 해결된다고 주장한다. 여러 VPC 간 허브형 전이 연결을 원하는 경우 가장 적절한 판단은 무엇인가?
            answer: Transit Gateway 등으로 허브 연결과 양방향 경로·보안 규칙을 구성한다.
            wrong:
              - B의 모든 포트를 열면 피어링이 자동으로 A에서 C까지 전이된다.
              - A의 기본 경로를 B의 IGW로 보내 C의 프라이빗 주소를 인터넷에서 찾는다.
              - B에 양방향 정적 경로만 추가하고 두 기존 피어링을 전이 허브로 사용한다.
      - id: Q16-11
        type: mcq
        title: Q16-11 · VPC·네트워크
        explain: |
          <p>피어링은 CIDR가 겹치는 VPC를 연결하지 못한다. 동일 주소의 목적지를 식별할 수 있도록 주소 계획을 고쳐야 하며 특정 서비스 접근 요구는 PrivateLink 같은 별도 구조로 범위를 좁힐 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>원격 VPC의 중복 주소에 더 구체적인 /32 경로를 추가하고 기존 피어링 생성 요청을 반복한다.</td>
          <td>경로 선택을 더 구체화해도 겹치는 CIDR의 피어링 생성 제한 자체를 해소하지 못한다. 연결 방식이나 주소 계획을 먼저 바꿔야 한다.</td>
          </tr>
          <tr>
          <td>두 VPC를 피어링한 뒤 한쪽 라우트 테이블에만 우선 경로를 넣어 겹치는 주소를 구분한다.</td>
          <td>겹치는 CIDR는 피어링 생성 자체의 제한이다. 연결 뒤 한쪽 경로를 바꾸는 계획으로 생성 제한이나 동일 목적지 충돌을 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>Transit Gateway를 붙이면 어떤 중복 CIDR도 별도 변환 없이 자동으로 해소된다.</td>
          <td>TGW가 중복 주소를 자동 변환해 주지는 않는다. Attachment 추가만으로 모든 직접 사설 연결이 성립하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html">VPC Peering 제한</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 인수한 회사 VPC와 본사 VPC가 모두 10.0.0.0/16을 사용한다. 두 VPC의 모든 서버가 당장 서로 직접 사설 통신할 수 있도록
              피어링하려 했지만 생성 단계에서 실패했다. 근본 원인과 후속 방향으로 가장 적절한 것은 무엇인가?
            answer: 전체 연결은 주소 재설계, 특정 서비스 접근은 별도 서비스 노출을 검토한다.
            wrong:
              - 원격 VPC의 중복 주소에 더 구체적인 /32 경로를 추가하고 기존 피어링 생성 요청을 반복한다.
              - 두 VPC를 피어링한 뒤 한쪽 라우트 테이블에만 우선 경로를 넣어 겹치는 주소를 구분한다.
              - Transit Gateway를 붙이면 어떤 중복 CIDR도 별도 변환 없이 자동으로 해소된다.
      - id: Q16-12
        type: mcq
        title: Q16-12 · VPC·네트워크
        explain: |
          <p>AWS의 두 터널을 모두 설정하면 터널 단위 점검·장애에 대비할 수 있다. 그러나 라우터와 회선 한 개의 장애는 남으므로 네트워크 양 끝의 공통 장애 지점도 분리하고 전환을 검증해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현재 한 터널의 처리량만 늘리고 두 번째 터널은 구성하지 않는다.</td>
          <td>처리량 증가는 사용 중 터널의 점검·장애 시 대체 경로를 제공하지 않는다. 터널 가용성 요구와 성능 개선은 다르다.</td>
          </tr>
          <tr>
          <td>데이터센터 라우터 하나에 가상 인터페이스만 추가하고 동일 회선·장비를 계속 공유한다.</td>
          <td>같은 물리 장비와 회선을 공유하면 그 장비나 회선 장애에 함께 영향을 받는다. 공통 장애 지점을 분리해야 한다.</td>
          </tr>
          <tr>
          <td>데이터센터 라우터는 한 대로 두고 VPN 경로의 우선순위 조정만으로 장비 고장까지 대비한다.</td>
          <td>라우팅 우선순위는 살아 있는 대체 경로 선택에 쓰인다. 같은 라우터가 고장 나면 그 장비에 의존한 경로도 함께 중단된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html">Site-to-Site VPN</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 회사 데이터센터와 AWS 사이에 VPN 연결을 만들었다. AWS 쪽 두 터널 중 하나만 장비에 구성돼 있어 터널 점검 때 업무가 중단된다.
              데이터센터 라우터와 인터넷 회선도 각각 한 개다. 가용성을 실제로 개선할 조치 두 가지는 무엇인가?
            answer: 제공된 두 VPN 터널과 적절한 경로 전환을 모두 구성하고 장애 전환을 시험한다.
            wrong:
              - 현재 한 터널의 처리량만 늘리고 두 번째 터널은 구성하지 않는다.
              - 데이터센터 라우터 하나에 가상 인터페이스만 추가하고 동일 회선·장비를 계속 공유한다.
              - 데이터센터 라우터는 한 대로 두고 VPN 경로의 우선순위 조정만으로 장비 고장까지 대비한다.
            answers:
              - 제공된 두 VPN 터널과 적절한 경로 전환을 모두 구성하고 장애 전환을 시험한다.
              - 데이터센터 장비·회선의 단일 장애 지점을 분리하는 이중화를 검토한다.
            options:
              - 제공된 두 VPN 터널과 적절한 경로 전환을 모두 구성하고 장애 전환을 시험한다.
              - 현재 한 터널의 처리량만 늘리고 두 번째 터널은 구성하지 않는다.
              - 데이터센터 장비·회선의 단일 장애 지점을 분리하는 이중화를 검토한다.
              - 데이터센터 라우터 하나에 가상 인터페이스만 추가하고 동일 회선·장비를 계속 공유한다.
              - 데이터센터 라우터는 한 대로 두고 VPN 경로의 우선순위 조정만으로 장비 고장까지 대비한다.
      - id: Q16-13
        type: mcq
        title: Q16-13 · VPC·네트워크
        explain: |
          <p>Private IP VPN은 DX를 통해 TGW에 연결하면서 고객 게이트웨이부터 VPN 종단까지 IPsec 보호를 제공한다. TCP와 UDP를 앱 변경 없이 운반하며, MACsec의 단일 링크 보호보다 긴 요구 구간을 대상으로 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>고객 라우터와 Direct Connect 장비 사이에 MACsec을 구성하고 transit VIF로 TGW에 연결한다.</td>
          <td>MACsec은 고객 에지와 DX 에지의 이더넷 링크를 보호한다. 여러 후속 네트워크 구간을 포함하는 고객 라우터부터 VPN 종단까지의 IPsec 요구를 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>EC2 앞에 TLS 프록시를 두고 온프레미스 TCP 클라이언트의 연결 대상을 프록시로 변경한다.</td>
          <td>TCP의 TLS 적용은 가능하지만 주어진 레거시 UDP 전송과 IP 계층 암호화 요구를 함께 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>고객 라우터에서 TGW로 인터넷 기반 Site-to-Site VPN을 구성하고 대상 VPC의 경로를 VPN으로 보낸다.</td>
          <td>IPsec 구간은 만들 수 있으나 데이터가 기존 DX를 통과해야 한다는 전송 경로 조건과 다르다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpn/latest/s2svpn/private-ip-dx.html">Private IP VPN over Direct Connect</a> · <a href="https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html">MACsec 보호 경계</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 온프레미스에서 TGW 뒤 프라이빗 EC2까지 TCP와 레거시 UDP 데이터를 전송한다. 트래픽은 기존 Direct Connect를 이용해야
              하며 고객 라우터에서 AWS VPN 종단까지 IP 계층 암호화가 필요하다. DX 교차 연결 이후 구간도 보호 대상이고
              앱 프로토콜 변경은 어렵다. 처리량은 VPN 한도 안이다. 적절한 구성은?
            answer: DX의 transit VIF·DX gateway·TGW 경로 위에 Private IP Site-to-Site VPN을 구성한다.
            wrong:
              - 고객 라우터와 Direct Connect 장비 사이에 MACsec을 구성하고 transit VIF로 TGW에
                연결한다.
              - EC2 앞에 TLS 프록시를 두고 온프레미스 TCP 클라이언트의 연결 대상을 프록시로 변경한다.
              - 고객 라우터에서 TGW로 인터넷 기반 Site-to-Site VPN을 구성하고 대상 VPC의 경로를 VPN으로
                보낸다.
      - id: Q16-14
        type: mcq
        title: Q16-14 · VPC·네트워크
        explain: |
          <p>TGW의 attachment 연결만으로 환경 격리가 완성되지는 않는다. 테이블별 연결·전파로 원격 목적지 도달 범위를 분리하고 VPC 라우트·보안 규칙과 반환 경로를 함께 맞춰 필요한 공유 통신만 허용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>TGW에 연결됐으면 기본적으로 모든 통신이 격리되므로 아무 변경도 하지 않는다.</td>
          <td>TGW는 연결된 네트워크의 도달 범위를 라우트 설정에 따라 결정한다. 모두 같은 테이블로 전파하면 원하는 격리가 보장되지 않는다.</td>
          </tr>
          <tr>
          <td>개발의 운영 DB행 반환 경로만 제거하고 공유 DNS에 필요한 반환 경로 검토는 생략한다.</td>
          <td>반환 경로 누락에 의존하면 통신 동작이 불명확해지고 필요한 공유 서비스까지 끊길 수 있다. 의도된 TGW 테이블 분리와 양방향 허용을 설계해야 한다.</td>
          </tr>
          <tr>
          <td>개발 attachment의 모든 경로를 기존 공통 테이블에 계속 전파하고 각 VPC 기본 경로만 TGW로 보낸다.</td>
          <td>운영 목적지 경로가 공유된 상태이고 기본 경로까지 허브로 보내면 원하는 환경 격리가 보장되지 않는다. 전달 범위를 테이블별로 제한해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/tgw/tgw-route-tables.html">Transit Gateway 라우트 테이블</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 중앙 TGW에 운영·개발·공유 서비스 VPC를 연결했다. 개발은 공유 DNS에 접근해야 하지만 운영 DB로 직접 갈 수 없어야 한다. 현재
              모든 attachment 경로가 같은 TGW 테이블에 전파된다. 의도한 격리를 유지하는 설계는 무엇인가?
            answer: 서로 다른 TGW 라우트 테이블의 연결·전파를 구성하고 VPC 경로·보안 규칙도 필요한 공유 통신으로 제한한다.
            wrong:
              - TGW에 연결됐으면 기본적으로 모든 통신이 격리되므로 아무 변경도 하지 않는다.
              - 개발의 운영 DB행 반환 경로만 제거하고 공유 DNS에 필요한 반환 경로 검토는 생략한다.
              - 개발 attachment의 모든 경로를 기존 공통 테이블에 계속 전파하고 각 VPC 기본 경로만 TGW로 보낸다.
      - id: Q16-15
        type: mcq
        title: Q16-15 · VPC·네트워크
        explain: |
          <p>자동 모드는 새 AZ의 ENI 존재를 따라 확장한다. 기존 AZ 경유 처리 구간이 생길 수 있으므로 새 AZ를 사전에 활성화하고 확장이 끝난 상태에서 배치를 시작해야 첫 요청부터 교차 AZ 처리를 피한다. 앱 경로 대상은 같은 NAT ID를 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>내일 09시에 새 AZ의 배치를 생성하고 그 서브넷을 기존 Regional NAT ID로 라우팅한다.</td>
          <td>통신은 가능하지만 확장 완료 전에는 기존 AZ에서 처리할 수 있어 신규 배치 시작부터 교차 AZ 처리를 피한다는 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>새 AZ에 Zonal NAT를 미리 만들고 배치 서브넷을 그 NAT ID로 라우팅한다.</td>
          <td>동일 AZ 출구를 사전에 확보할 수 있지만 배치가 별도 Zonal NAT ID를 사용해 단일 Regional NAT ID 유지 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>기존 AZ에 배치를 먼저 실행하고 09시에 새 AZ로 옮긴 뒤 기존 Regional NAT ID로 라우팅한다.</td>
          <td>이전 AZ에서 미리 실행한 것은 새 AZ의 ENI 존재를 사전에 만들지 않는다. 09시 이동 시 자동 확장이 시작되어 교차 AZ 처리 구간이 생길 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html">Regional NAT 자동 AZ 확장</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: 기존 두 AZ의 앱은 Regional NAT 자동 모드의 같은 NAT ID를 사용한다. 내일 09시부터 세 번째 AZ에 매일 실행되는
              배치가 추가된다. 정책상 신규 배치 시작부터 NAT의 교차 AZ 처리를 피해야 하며 같은 NAT ID를 계속 사용하려
              한다. 새 AZ를 감지한 자동 확장은 최대 60분 걸릴 수 있다. 가장 적절한 준비는?
            answer: 오늘 새 AZ에 ENI 리소스를 두어 확장 완료 후 내일 배치를 시작하고 기존 Regional NAT ID로 라우팅한다.
            wrong:
              - 내일 09시에 새 AZ의 배치를 생성하고 그 서브넷을 기존 Regional NAT ID로 라우팅한다.
              - 새 AZ에 Zonal NAT를 미리 만들고 배치 서브넷을 그 NAT ID로 라우팅한다.
              - 기존 AZ에 배치를 먼저 실행하고 09시에 새 AZ로 옮긴 뒤 기존 Regional NAT ID로 라우팅한다.
