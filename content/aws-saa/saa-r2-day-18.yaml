      - id: saa-r2-Q18-10
        source_id: Q18-10
        type: mcq
        title: Q18-10 · 저장소·데이터베이스
        explain: |
          <p>일반적인 쓰기 후 무효화가 빠른 반영을 돕고 짧은 TTL이 무효화 누락과 동시 캐시 채우기 경쟁의 오래된 값을 제한한다. 제시한 읽기·채우기 시간에서 60초 TTL은 5분 허용 범위 안이며 hit마다 DB를 읽지 않는다. 1시간 TTL이나 캐시 우선 무효화만으로는 앱 종료 시 오래된 값을 충분히 빨리 제거할 수 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DB 커밋 뒤 캐시를 무효화하고 새로 채우는 모든 항목에 1시간 TTL을 둔다.</td>
          <td>커밋 직후 앱이 종료되면 무효화가 누락되어 이전 값이 1시간 남을 수 있다.</td>
          </tr>
          <tr>
          <td>캐시 hit마다 DB의 현재 버전을 읽어 값이 다르면 캐시를 교체한다.</td>
          <td>최신성 확인은 가능하지만 hit에서 DB를 조회하지 않는다는 조건을 어긴다.</td>
          </tr>
          <tr>
          <td>캐시를 먼저 무효화한 뒤 DB를 커밋하고 새 항목에 1시간 TTL을 둔다.</td>
          <td>무효화와 커밋 사이 읽기가 이전 DB 값을 다시 채울 수 있고 1시간 TTL이 이를 오래 유지한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html">캐시 채우기·무효화와 TTL</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#cache-aside%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C%EC%99%80-%EC%8B%A0%EC%84%A0%EB%8F%84">커밋 후 무효화는 일반 변경을 빠르게 반영하고, 60초 TTL은 커밋 후 앱 종료나 동시 캐시 채우기로 무효화가 놓친 오래된 값을 제한한다</a> · <a href="/study/lessons/deep-dive/day-08.html#cache-aside%EC%9D%98-%EC%8B%A4%ED%8C%A8-%EA%B2%BD%EB%A1%9C%EC%99%80-%EC%8B%A0%EC%84%A0%EB%8F%84">읽기·채우기 1초 조건에서도 5분 허용 범위 안이며 hit는 DB 조회 없이 처리한다</a></p>
        quizzes:
          - q: 상품 설명 API는 RDS 앞에 cache-aside ElastiCache를 사용한다. DB 읽기와 캐시 채우기는 1초 이내이며 변경된
              설명은 5분 안에 보여야 한다. 캐시 hit에서 DB 조회는 금지하고 별도 동기화 워커도 두지 않는다. 쓰기 앱이 DB
              커밋 직후 종료돼 후속 작업을 못 할 수 있다. 어떤 전략이 요구를 만족하는가?
            answer: DB 커밋 뒤 캐시를 무효화하고 새로 채우는 모든 항목에 60초 TTL을 둔다.
            wrong:
              - DB 커밋 뒤 캐시를 무효화하고 새로 채우는 모든 항목에 1시간 TTL을 둔다.
              - 캐시 hit마다 DB의 현재 버전을 읽어 값이 다르면 캐시를 교체한다.
              - 캐시를 먼저 무효화한 뒤 DB를 커밋하고 새 항목에 1시간 TTL을 둔다.
      - id: saa-r2-Q18-11
        source_id: Q18-11
        type: mcq
        title: Q18-11 · 저장소·데이터베이스
        explain: |
          <p>두 샤드로 나누면 샤드당 데이터 약 90GB와 초당 8만 쓰기가 되어 제시한 노드 한도에 들어간다. 각 primary에 다른 AZ의 replica가 하나씩 있어야 AZ 장애 때 승격할 수 있으므로 최소 네 대가 필요하다. 읽기 복제본 수만 늘리면 데이터 분할과 primary 쓰기 부하 분할이 이루어지지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>한 샤드에 primary 한 대와 서로 다른 AZ의 replica 세 대를 배치한다.</td>
          <td>노드 네 대라도 한 샤드의 primary가 데이터 180GB와 초당 16만 쓰기를 맡아 각 한도를 넘는다.</td>
          </tr>
          <tr>
          <td>두 샤드의 primary를 각각 다른 AZ에 배치하고 replica 없이 운영한다.</td>
          <td>두 샤드로 용량은 맞출 수 있지만 각 샤드에 승격 가능한 replica가 없다.</td>
          </tr>
          <tr>
          <td>세 샤드에 primary 한 대와 다른 AZ의 replica 한 대씩 배치한다.</td>
          <td>요구를 충족하지만 여섯 노드가 필요해 네 노드 구성보다 비용이 높다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Shards.html">Valkey 샤드와 복제 노드</a>
          SAA 평가 항목: 3.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#%EC%84%B8%EC%85%98%EC%9D%98-%EC%83%A4%EB%93%9C%EC%99%80-%EB%B3%B5%EC%A0%9C%EB%B3%B8">두 샤드로 분할하면 샤드당 약 90GB와 초당 8만 쓰기로 한도 안에 들어간다</a></p>
        quizzes:
          - q: ElastiCache for Valkey에 세션 180GB를 저장하며 균등 분포한 단일 키 쓰기가 초당 16만 건이다. 선택 가능한
              노드마다 데이터 100GB·초당 10만 쓰기를 감당하며 더 큰 노드는 없다. 앱은 cluster mode를 지원한다.
              한 AZ가 중단돼도 각 샤드의 승격 대상이 필요하다. 노드 단가가 같을 때 최소 구성을 선택하라.
            answer: 두 샤드에 primary 한 대와 다른 AZ의 replica 한 대씩 배치한다.
            wrong:
              - 한 샤드에 primary 한 대와 서로 다른 AZ의 replica 세 대를 배치한다.
              - 두 샤드의 primary를 각각 다른 AZ에 배치하고 replica 없이 운영한다.
              - 세 샤드에 primary 한 대와 다른 AZ의 replica 한 대씩 배치한다.
      - id: saa-r2-Q18-12
        source_id: Q18-12
        type: mcq
        title: Q18-12 · 저장소·데이터베이스
        explain: |
          <p>사용료는 피크 검증을 통과한 사양으로 축소해 줄이고, 백업 저장료는 더 이상 보존할 필요가 없는 테스트 수동 스냅샷을 삭제해 줄인다. 사양 변경에 따른 재시작은 지문이 허용한 점검 창에 반영한다. 수동 스냅샷은 원래 DB를 삭제해도 남을 수 있다. 점검 외의 상시 서비스·30일 PITR·90일 법적 보존은 유지한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>밤마다 DB를 중지하고 업무 시작 전에 자동으로 다시 시작한다.</td>
          <td>사양 변경의 짧은 점검 재시작은 허용됐지만 밤마다 서비스를 중지하는 것은 점검 외 상시 운영 조건을 어긴다.</td>
          </tr>
          <tr>
          <td>자동 백업을 7일로 줄이고 월별 법적 스냅샷 90일은 유지한다.</td>
          <td>7일 자동 백업은 30일 PITR 정책을 충족하지 못한다.</td>
          </tr>
          <tr>
          <td>자동 백업은 30일로 두고 30일이 지난 모든 수동 스냅샷을 삭제한다.</td>
          <td>30일을 넘긴 모든 수동 스냅샷을 지우면 90일 보존 대상인 월별 스냅샷도 사라진다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html">RDS 자동·수동 백업 보존</a> · <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_CreateSnapshot.html">RDS 수동 스냅샷</a> · <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.DBInstance.Modifying.html">RDS DB 인스턴스 변경과 가동 중지 영향</a>
          SAA 평가 항목: 4.3</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-07.html#%EC%A4%91%EC%A7%80%EC%99%80-%EC%B6%95%EC%86%8C%EC%9D%98-%EB%B9%84%EC%9A%A9-%EA%B2%BD%EA%B3%84">피크 부하 시험을 통과한 사양 축소는 현재 사용량의 낭비를 줄인다</a> · <a href="/study/lessons/deep-dive/day-07.html#pitr%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7%EC%97%90%EC%84%9C-%EC%84%9C%EB%B9%84%EC%8A%A4-%EB%B3%B5%EA%B5%AC%EA%B9%8C%EC%A7%80">DB를 삭제해도 수동 스냅샷은 남을 수 있으므로 필요 없는 테스트 사본을 별도 정리해야 한다</a> · <a href="/study/lessons/deep-dive/day-07.html#pitr%EA%B3%BC-%EC%8A%A4%EB%83%85%EC%83%B7%EC%97%90%EC%84%9C-%EC%84%9C%EB%B9%84%EC%8A%A4-%EB%B3%B5%EA%B5%AC%EA%B9%8C%EC%A7%80">두 조치는 서로 다른 비용을 줄이며 30일 PITR·90일 법적 보존을 유지한다</a></p>
        quizzes:
          - q: RDS 운영 DB는 상시 서비스를 제공하지만 승인된 점검 창에서 사양 변경에 따른 짧은 재시작은 허용한다. 최근 피크 부하 시험에서 한
              단계 작은 사양도 응답 목표를 충족했다. 정책은 PITR 30일과 법적 보존 월별 스냅샷 90일이다. 삭제된 테스트
              DB의 만료된 수동 스냅샷도 요금에 남아 있다. 이 운영 조건과 보존 정책을 지키며 사용료·백업 비용을 각각 줄일 조치
              두 가지는?
            answer: 승인된 점검 창에 검증한 작은 DB 사양으로 변경하고 성능 지표를 관찰한다.
            wrong:
              - 밤마다 DB를 중지하고 업무 시작 전에 자동으로 다시 시작한다.
              - 자동 백업을 7일로 줄이고 월별 법적 스냅샷 90일은 유지한다.
              - 자동 백업은 30일로 두고 30일이 지난 모든 수동 스냅샷을 삭제한다.
            answers:
              - 승인된 점검 창에 검증한 작은 DB 사양으로 변경하고 성능 지표를 관찰한다.
              - 복구·법적 보존 사본은 유지하고 만료된 테스트 DB의 수동 스냅샷만 삭제한다.
            options:
              - 승인된 점검 창에 검증한 작은 DB 사양으로 변경하고 성능 지표를 관찰한다.
              - 밤마다 DB를 중지하고 업무 시작 전에 자동으로 다시 시작한다.
              - 자동 백업을 7일로 줄이고 월별 법적 스냅샷 90일은 유지한다.
              - 자동 백업은 30일로 두고 30일이 지난 모든 수동 스냅샷을 삭제한다.
              - 복구·법적 보존 사본은 유지하고 만료된 테스트 DB의 수동 스냅샷만 삭제한다.
      - id: saa-r2-Q18-13
        source_id: Q18-13
        type: mcq
        title: Q18-13 · 저장소·데이터베이스
        explain: |
          <p>온라인 거래와 분석 부하를 분리하고, 변화하는 조인·필터와 필요한 열 중심의 반복 대규모 집계에 맞는 분석 엔진을 선택해야 한다. Redshift는 열 지향 데이터 웨어하우스로 이 요구를 지원한다. 적재 지연을 허용하므로 주문 DB와 분석 데이터 사이의 갱신 경로를 따로 설계할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DynamoDB에 거래를 복제하고 분석마다 Scan 결과를 앱에서 조인한다.</td>
          <td>DynamoDB의 키 기반 접근 장점보다 전체 Scan·앱 조인을 반복하게 되어 제시한 SQL 분석에 덜 맞는다.</td>
          </tr>
          <tr>
          <td>ElastiCache에 미리 계산한 정해진 보고서만 저장하고 새 필터도 캐시에서 처리한다.</td>
          <td>고정 보고서 캐시는 반복 결과에 유용하지만 새 필터와 조인의 원본 계산을 대신하는 분석 엔진은 아니다.</td>
          </tr>
          <tr>
          <td>주문 DB의 크기를 늘리고 운영 DB에서 거래 쓰기와 모든 분석을 계속 실행한다.</td>
          <td>사양 증설은 일부 성능을 개선할 수 있지만 온라인 주문과 분석의 자원 경합을 분리하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/redshift/latest/dg/c_columnar_storage_disk_mem_mgmnt.html">AWS 공식 기능 문서</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-14.html#spark-%EB%B3%80%ED%99%98%EA%B3%BC-redshift-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9D%B4%EB%8F%99">대규모 이력 집계와 온라인 트랜잭션을 분리하려는 조건에는 분석용 데이터 웨어하우스가 맞는다</a> · <a href="/study/lessons/deep-dive/day-08.html#%EB%AA%A9%EC%A0%81%EB%B3%84-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%AA%A8%EB%8D%B8%EC%9D%98-%EB%8F%99%EC%9E%91">Redshift의 열 지향 구조는 필요한 열 중심의 집계에 유리하며 적재·갱신 지연을 별도로 설계한다</a></p>
        quizzes:
          - q: 금융팀은 주문 RDS에 쌓인 수년치 수십억 거래를 여러 테이블과 조인해 하루 종일 반복 집계한다. 조회마다 필요한 열과 필터가 바뀌며 수분
              정도의 적재 지연은 허용한다. 온라인 주문의 처리량을 보호하고 필요한 열 중심의 대규모 SQL 분석을 운영하려면 어떤
              구성이 가장 적합한가?
            answer: 분석 데이터를 Redshift에 적재하고 열 지향 데이터 웨어하우스에서 SQL을 실행한다.
            wrong:
              - DynamoDB에 거래를 복제하고 분석마다 Scan 결과를 앱에서 조인한다.
              - ElastiCache에 미리 계산한 정해진 보고서만 저장하고 새 필터도 캐시에서 처리한다.
              - 주문 DB의 크기를 늘리고 운영 DB에서 거래 쓰기와 모든 분석을 계속 실행한다.
      - id: saa-r2-Q18-14
        source_id: Q18-14
        type: mcq
        title: Q18-14 · 저장소·데이터베이스
        explain: |
          <p>Neptune은 관계를 노드와 간선으로 모델링하고 다단계 경로를 쿼리로 탐색하는 관리형 그래프 DB다. 현재 관계를 직접 탐색하면서 앱의 단계별 조회·경로 조합과 DB 서버 패치를 줄이는 요구에 맞는다. 응답 지연은 모델과 부하 시험으로 검증해야 하며 서비스 이름만으로 보장되지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>DynamoDB에 인접 ID를 저장하고 Lambda가 단계별 BatchGetItem 결과를 결합한다.</td>
          <td>경로를 계산할 수 있지만 앱이 여러 차례 읽고 합치는 기존 코드의 책임이 남는다.</td>
          </tr>
          <tr>
          <td>Redshift에 관계를 적재하고 야간 배치로 만든 경로 테이블을 조회한다.</td>
          <td>분석은 가능하지만 야간에 계산된 경로는 지속 갱신되는 현재 관계를 반환하지 않는다.</td>
          </tr>
          <tr>
          <td>EC2에 그래프 DB를 설치하고 컨테이너 이미지·DB 패치를 배포 파이프라인으로 운영한다.</td>
          <td>그래프 쿼리는 가능하지만 EC2와 DB 패치를 팀이 운영해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/neptune/latest/userguide/intro.html">Neptune 그래프 엔진과 관리 책임</a>
          SAA 평가 항목: 3.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-08.html#%EB%AA%A9%EC%A0%81%EB%B3%84-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%AA%A8%EB%8D%B8%EC%9D%98-%EB%8F%99%EC%9E%91">Neptune의 관리형 그래프 엔진은 관계를 간선으로 저장하고 여러 단계 경로를 쿼리로 표현한다</a> · <a href="/study/lessons/deep-dive/day-08.html#%EB%AA%A9%EC%A0%81%EB%B3%84-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%AA%A8%EB%8D%B8%EC%9D%98-%EB%8F%99%EC%9E%91">구체 지연 목표는 실제 모델·부하로 검증한다</a></p>
        quizzes:
          - q: 사기 조사 앱은 계정·기기·결제 수단의 관계가 추가될 때마다 현재 데이터로 2~6단계 연결 경로를 반환한다. 앱에서 여러 차례 ID를 읽어
              경로를 조합하는 코드가 커지고 있다. 어제 계산한 경로로는 조사할 수 없으며 DB 서버 패치도 맡지 않으려 한다. 관계
              탐색 쿼리로 앱 코드를 줄일 구성은?
            answer: Neptune에 노드·간선을 저장하고 Gremlin 또는 openCypher로 경로를 탐색한다.
            wrong:
              - DynamoDB에 인접 ID를 저장하고 Lambda가 단계별 BatchGetItem 결과를 결합한다.
              - Redshift에 관계를 적재하고 야간 배치로 만든 경로 테이블을 조회한다.
              - EC2에 그래프 DB를 설치하고 컨테이너 이미지·DB 패치를 배포 파이프라인으로 운영한다.
      - id: saa-r2-Q18-15
        source_id: Q18-15
        type: mcq
        title: Q18-15 · 저장소·데이터베이스
        explain: |
          <p>Versioning은 같은 객체 키의 이전 버전과 삭제 마커를 남겨 실수로 한 덮어쓰기·일반 삭제에서 복구할 수 있게 한다. 비현재 버전의 수명 주기로 보존 비용을 관리한다. 리전 간 복제나 배치 사본 없이 이 요구를 충족하지만 DeleteObjectVersion 권한을 가진 주체의 영구 삭제를 막는 규제 보존은 별도 문제다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>원본을 Glacier Deep Archive로 이동하고 다운로드 시 복원한다.</td>
          <td>아카이브는 즉시 다운로드 조건을 만족하지 않으며 저장 클래스 변경만으로 객체 버전 이력을 만들지 않는다.</td>
          </tr>
          <tr>
          <td>매일 밤 다른 버킷에 현재 객체를 동기화하고 같은 삭제도 반영한다.</td>
          <td>하루 사이의 변경이 사본에 없고 삭제까지 동기화하면 직전 상태 보호가 충분하지 않다.</td>
          </tr>
          <tr>
          <td>다른 리전의 버킷에 복제하고 양쪽 버킷의 비현재 버전을 보존한다.</td>
          <td>추가 내구성은 얻을 수 있지만 필요하지 않은 다른 리전의 저장·전송 비용을 부담한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html">AWS 공식 기능 문서</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-what-is-isnot-replicated.html">S3 복제 대상과 제외 항목</a>
          SAA 평가 항목: 2.1</p>
          <p>선택지를 가르는 개념: <a href="/study/lessons/deep-dive/day-03.html#%EA%B0%9D%EC%B2%B4-api%EC%99%80-%EB%B2%84%EC%A0%84%EB%B3%84-%EC%82%AD%EC%A0%9C">Versioning은 덮어쓰기 전 버전과 삭제 마커를 통해 잘못된 변경에서 복구할 수 있게 한다</a> · <a href="/study/lessons/deep-dive/day-03.html#lifecycle%EA%B3%BC-%EC%9A%A9%EB%9F%89-%EC%82%B0%EC%A0%95">이전 버전에도 저장 비용이 발생하므로 비현재 버전의 보존 기간과 Lifecycle을 함께 설계해야 한다</a></p>
        quizzes:
          - q: 사진 서비스는 S3 원본을 잘못 덮어쓰거나 삭제했을 때 직전 상태를 복구해야 한다. 삭제 직전 업로드도 보호 대상이고 즉시 다운로드를
              유지한다. 다른 리전 재해 복구나 관리자도 삭제할 수 없는 규제 보존은 요구하지 않는다. 별도 복사 배치와 리전 간
              전송을 최소화할 기본 보호는?
            answer: 버킷 Versioning을 켜고 비현재 버전의 보존 기간·수명 주기를 설정한다.
            wrong:
              - 원본을 Glacier Deep Archive로 이동하고 다운로드 시 복원한다.
              - 매일 밤 다른 버킷에 현재 객체를 동기화하고 같은 삭제도 반영한다.
              - 다른 리전의 버킷에 복제하고 양쪽 버킷의 비현재 버전을 보존한다.
