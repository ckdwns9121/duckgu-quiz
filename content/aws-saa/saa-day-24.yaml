id: saa-day-24
name: 모의고사 B
part: 24일 차
color: "#13a87b"
dark: "#985800"
blocks:
  - tip: SAA 시험 범위를 바탕으로 만든 창작 문제입니다. 실제 기출문제가 아닙니다. 복수 정답은 지정한 개수를 모두 맞혀야 합니다.
  - items:
      - id: Q24-01
        type: mcq
        title: Q24-01 · 모의고사 B
        explain: |
          <p>장기 키 배포 없이 다른 계정의 허용된 신원이 제한된 역할을 맡게 해야 한다. 대상 역할의 신뢰와 호출자 측 AssumeRole 허용을 구성하고 역할 권한은 필요한 객체 접두사로 한정한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>매일 고객 계정의 키를 갱신해 분석 서버의 비밀 저장소에 전달한다</td>
          <td>보관을 안전하게 해도 고객 장기 키를 외부에 배포·교체하는 구조가 남는다.</td>
          </tr>
          <tr>
          <td>고객 계정에 분석가별 IAM 사용자를 만들고 액세스 키를 발급한다</td>
          <td>사용자별 추적은 가능하지만 고객 계정 장기 키를 배포하지 않는 조건을 위반한다.</td>
          </tr>
          <tr>
          <td>외부 분석 서버를 VPN으로 연결하고 기존 계정 권한만 유지한다</td>
          <td>VPN은 네트워크 경로를 제공하며 고객 버킷의 객체 권한을 부여하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 외부 회계법인의 분석가는 자기 회사 AWS 계정으로 인증한다. 고객사의 원장 버킷에서는 특정 접두사만 읽어야 하며 고객 계정의 장기 액세스
              키를 배포할 수 없다. 접근을 회수하기도 쉬워야 한다. 가장 적합한 구성은?
            answer: 고객 계정에 읽기 역할을 만들고 외부 신원에 역할 전환을 허용한다
            wrong:
              - 매일 고객 계정의 키를 갱신해 분석 서버의 비밀 저장소에 전달한다
              - 고객 계정에 분석가별 IAM 사용자를 만들고 액세스 키를 발급한다
              - 외부 분석 서버를 VPN으로 연결하고 기존 계정 권한만 유지한다
      - id: Q24-02
        type: mcq
        title: Q24-02 · 모의고사 B
        explain: |
          <p>신원과 리소스의 속성을 정책 조건으로 비교하는 ABAC가 잦은 프로젝트 변경에 적합하다. 다만 사용자가 태그를 임의 수정해 권한을 넓히지 못하도록 태그 변경 권한도 제한해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>프로젝트별 역할에 개별 리소스 ARN을 나열하고 인사 이동마다 갱신한다</td>
          <td>접근 제한은 가능하지만 잦은 이동과 수백 개 자원의 ARN 목록 관리 부담을 줄이지 못한다.</td>
          </tr>
          <tr>
          <td>비용 할당 태그를 활성화하고 현재 IAM 권한 모델을 유지한다</td>
          <td>비용 태그 활성화는 API 인가에 프로젝트 일치 조건을 추가하지 않는다.</td>
          </tr>
          <tr>
          <td>리소스 태그만 확인하는 조건을 쓰고 연구원에게 태그 변경을 허용한다</td>
          <td>태그 임의 변경으로 다른 프로젝트 자원에 접근할 여지가 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 연구소는 프로젝트마다 수백 개의 리소스를 만들고 연구원이 프로젝트를 옮기는 일이 잦다. 개별 리소스 ARN 목록을 계속 고치는 대신
              프로젝트가 같은 자원만 접근시키려 한다. 태그를 이용할 때 반드시 함께 설계할 내용은?
            answer: 신원·리소스 태그 조건과 태그 변경 권한을 통제한다
            wrong:
              - 프로젝트별 역할에 개별 리소스 ARN을 나열하고 인사 이동마다 갱신한다
              - 비용 할당 태그를 활성화하고 현재 IAM 권한 모델을 유지한다
              - 리소스 태그만 확인하는 조건을 쓰고 연구원에게 태그 변경을 허용한다
      - id: Q24-03
        type: mcq
        title: Q24-03 · 모의고사 B
        explain: |
          <p>교차 계정 역할 전환에는 호출자의 대상 역할 호출 권한과 대상 역할의 신뢰가 함께 필요하다. 객체 읽기 권한은 역할 전환이 성공한 뒤 별도로 확인할 다음 경계다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>대상 역할의 권한 정책에 필요한 s3:GetObject를 허용</td>
          <td>역할을 맡은 뒤 객체 읽기에 필요한 권한이며 역할 전환 경계의 두 필수 허용과 다르다.</td>
          </tr>
          <tr>
          <td>버킷 정책에 외부 분석 신원의 직접 읽기 권한을 허용</td>
          <td>직접 객체 접근 설계와 대상 역할의 AssumeRole 허용·신뢰는 다른 경계다.</td>
          </tr>
          <tr>
          <td>호출자에 대상 KMS 키의 kms:Decrypt를 허용</td>
          <td>KMS 권한은 암호문 접근에 필요할 수 있지만 STS 역할 전환을 허용하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html">추가 공식 근거</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 개발 계정의 배포 역할은 운영 계정의 감사 역할을 맡으려 하지만 AccessDenied를 받는다. 역할 전환 이후의 S3 권한을 논의하기
              전에, 두 계정의 역할 전환 경계에서 확인할 필수 허용 두 가지를 고르시오. 적용되는 명시적 거부는 없다고 가정한다.
            answer: 호출자에게 대상 역할의 sts:AssumeRole 허용
            wrong:
              - 대상 역할의 권한 정책에 필요한 s3:GetObject를 허용
              - 버킷 정책에 외부 분석 신원의 직접 읽기 권한을 허용
              - 호출자에 대상 KMS 키의 kms:Decrypt를 허용
            answers:
              - 호출자에게 대상 역할의 sts:AssumeRole 허용
              - 대상 역할 신뢰 정책에 호출자를 허용
            options:
              - 대상 역할의 권한 정책에 필요한 s3:GetObject를 허용
              - 버킷 정책에 외부 분석 신원의 직접 읽기 권한을 허용
              - 호출자에 대상 KMS 키의 kms:Decrypt를 허용
              - 호출자에게 대상 역할의 sts:AssumeRole 허용
              - 대상 역할 신뢰 정책에 호출자를 허용
      - id: Q24-04
        type: mcq
        title: Q24-04 · 모의고사 B
        explain: |
          <p>SCP는 멤버 계정에서 사용할 수 있는 권한을 제한하는 조직 통제다. IAM 관리자 권한을 부여해도 적용되는 SCP의 명시적 거부를 넘지 못하며 허용 범위를 바꾸려면 조직 정책을 검토해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>관리자 역할의 세션 기간을 늘려 더 긴 권한 세션을 발급한다</td>
          <td>세션 유효 시간은 SCP 거부의 우선순위를 바꾸지 않는다.</td>
          </tr>
          <tr>
          <td>다른 멤버 계정에 같은 역할을 만들고 동일한 OU 정책을 유지한다</td>
          <td>동일 SCP 적용 범위로 이동하면 동일한 리전 생성 통제가 남는다.</td>
          </tr>
          <tr>
          <td>역할의 권한 경계를 넓히고 기존 SCP를 유지한다</td>
          <td>경계 상향으로 조직의 명시적 거부를 넘을 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 조직은 멤버 계정의 일반 역할이 특정 리전에서 리소스를 만들지 못하도록 SCP를 적용했다. 계정 관리자는 해당 역할에
              AdministratorAccess를 붙였지만 생성이 계속 거부된다. 이 접근 거부에 대한 판단 또는 대응으로 가장
              적절한 것은?
            answer: 적용되는 SCP의 거부는 역할의 관리자 허용으로 무효화되지 않는다
            wrong:
              - 관리자 역할의 세션 기간을 늘려 더 긴 권한 세션을 발급한다
              - 다른 멤버 계정에 같은 역할을 만들고 동일한 OU 정책을 유지한다
              - 역할의 권한 경계를 넓히고 기존 SCP를 유지한다
      - id: Q24-05
        type: mcq
        title: Q24-05 · 모의고사 B
        explain: |
          <p>역할 생성 업무는 허용하면서 부여 가능한 신원 권한의 상한을 제한하려면 권한 경계를 강제한다. 경계 자체를 빼거나 바꾸지 못하도록 생성 조건과 관리 권한도 함께 제한해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>생성 역할의 신뢰를 개발 계정으로 제한하고 작업 권한은 자유롭게 둔다</td>
          <td>누가 역할을 맡는지는 제한하지만 맡은 역할의 작업 권한 상승은 막지 못한다.</td>
          </tr>
          <tr>
          <td>모든 역할 생성 뒤 Config 비준수를 탐지해 사후 알린다</td>
          <td>탐지·알림만으로 승인 범위를 넘는 역할의 생성을 사전에 막지 못한다.</td>
          </tr>
          <tr>
          <td>개발자 역할의 세션 기간을 짧게 하고 생성 역할 권한은 제한하지 않는다</td>
          <td>시간 단축은 생성 역할에 부여 가능한 권한 상한을 정하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 플랫폼 팀은 개발자가 배포 역할을 직접 만들게 하되 승인된 서비스 권한을 넘어가는 역할은 만들지 못하게 하려 한다. 개발자에게 필요한 역할
              생성 기능은 유지해야 한다. 가장 직접적인 권한 설계는?
            answer: 생성 역할에 지정한 권한 경계를 요구하고 경계 변경 권한을 제한한다
            wrong:
              - 생성 역할의 신뢰를 개발 계정으로 제한하고 작업 권한은 자유롭게 둔다
              - 모든 역할 생성 뒤 Config 비준수를 탐지해 사후 알린다
              - 개발자 역할의 세션 기간을 짧게 하고 생성 역할 권한은 제한하지 않는다
      - id: Q24-06
        type: mcq
        title: Q24-06 · 모의고사 B
        explain: |
          <p>직원의 다중 계정 접근과 중앙 신원 수명 주기를 함께 관리해야 하므로 Identity Center와 외부 신원 공급자 연동이 적합하다. 권한 세트와 그룹 배정으로 계정별 업무 권한을 구분한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>외부 디렉터리 인사 목록으로 각 계정 IAM 사용자를 동기화한다</td>
          <td>계정별 IAM 사용자·자격 증명 관리가 남아 중앙 페더레이션보다 운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>Cognito User pool에 직원 계정을 복제하고 AWS 계정 권한 세트는 수동 관리한다</td>
          <td>앱 로그인과 별개인 다중 AWS 계정 권한 배정을 수동 유지해야 한다.</td>
          </tr>
          <tr>
          <td>Organizations OU마다 동일한 IAM 그룹을 수동 구성한다</td>
          <td>OU는 계정 묶음이며 계정별 사용자·자격 증명 수명 주기를 자동 통합하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 회사는 직원의 입사·퇴사를 중앙 디렉터리에서 관리한다. 직원은 여러 AWS 계정에서 부서별로 다른 권한을 받아야 하고 계정마다 별도 IAM
              사용자 비밀번호를 유지하고 싶지 않다. 운영 부담이 가장 적은 접근 방식은?
            answer: IAM Identity Center를 외부 신원 공급자와 연동하고 그룹별 권한 세트를 배정한다
            wrong:
              - 외부 디렉터리 인사 목록으로 각 계정 IAM 사용자를 동기화한다
              - Cognito User pool에 직원 계정을 복제하고 AWS 계정 권한 세트는 수동 관리한다
              - Organizations OU마다 동일한 IAM 그룹을 수동 구성한다
      - id: Q24-07
        type: mcq
        title: Q24-07 · 모의고사 B
        explain: |
          <p>데이터 접근에는 객체 정책과 암호 키 사용 권한이라는 별도 경계가 있다. 역할의 GetObject 허용만으로 명시적 거부를 넘거나 KMS 복호화 권한을 자동 얻지는 못한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>역할에 같은 객체 ARN의 추가 Allow 정책을 연결한다</td>
          <td>허용 추가만으로 버킷의 명시적 거부와 필요한 KMS 복호화 권한이 해결되지 않는다.</td>
          </tr>
          <tr>
          <td>CloudFront OAC를 추가하고 현재 역할로 S3 직접 읽기를 계속한다</td>
          <td>OAC는 배포의 원본 요청 경로이며 현재 역할의 직접 읽기 거부를 고치지 않는다.</td>
          </tr>
          <tr>
          <td>엔드포인트 정책을 확대하고 버킷 거부·키 정책은 유지한다</td>
          <td>네트워크 경로의 제한을 풀어도 다른 경계의 명시적 거부와 키 권한 부족이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-01.html">1일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.1</p>
        quizzes:
          - q: 보안 엔지니어는 같은 계정 역할의 s3:GetObject 허용을 확인했지만 특정 객체 읽기가 거부되는 사건을 조사한다. 객체에는
              SSE-KMS가 적용되어 있고 버킷 정책에는 특정 경로를 막는 명시적 Deny가 있다. 가장 올바른 조사는?
            answer: 버킷의 거부 조건과 KMS 키 사용 권한을 각각 확인한다
            wrong:
              - 역할에 같은 객체 ARN의 추가 Allow 정책을 연결한다
              - CloudFront OAC를 추가하고 현재 역할로 S3 직접 읽기를 계속한다
              - 엔드포인트 정책을 확대하고 버킷 거부·키 정책은 유지한다
      - id: Q24-08
        type: mcq
        title: Q24-08 · 모의고사 B
        explain: |
          <p>원본 우회 차단은 OAC와 S3 버킷 정책이, 구매자의 시간 제한 접근은 CloudFront 서명이 담당한다. 여러 파일에 같은 접근 조건을 적용하는 요구에는 서명 쿠키를 사용할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>OAC만 연결하고 CloudFront 사용자 접근은 공개로 유지</td>
          <td>원본은 보호할 수 있지만 구매자·접근 기간 제한을 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>S3 presigned URL을 구매자에게 발급해 직접 다운로드를 허용</td>
          <td>S3 직접 접근을 허용하는 방식이므로 원본 우회 차단 조건과 충돌한다.</td>
          </tr>
          <tr>
          <td>CloudFront의 캐시 키에 회원 ID만 추가</td>
          <td>캐시 구분은 서명 검증이나 구매자의 기간 제한 접근 허용이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 유료 설계 도면을 비공개 S3에 보관한다. 구매자는 CloudFront에서 제한된 시간에 여러 도면을 읽어야 하며 S3 주소로 직접
              다운로드하는 우회는 막아야 한다. 필요한 구성 두 가지를 고르시오.
            answer: OAC와 배포를 제한한 S3 버킷 정책
            wrong:
              - OAC만 연결하고 CloudFront 사용자 접근은 공개로 유지
              - S3 presigned URL을 구매자에게 발급해 직접 다운로드를 허용
              - CloudFront의 캐시 키에 회원 ID만 추가
            answers:
              - OAC와 배포를 제한한 S3 버킷 정책
              - 구매 확인 뒤 발급하는 CloudFront 서명 쿠키
            options:
              - OAC만 연결하고 CloudFront 사용자 접근은 공개로 유지
              - OAC와 배포를 제한한 S3 버킷 정책
              - 구매 확인 뒤 발급하는 CloudFront 서명 쿠키
              - S3 presigned URL을 구매자에게 발급해 직접 다운로드를 허용
              - CloudFront의 캐시 키에 회원 ID만 추가
      - id: Q24-09
        type: mcq
        title: Q24-09 · 모의고사 B
        explain: |
          <p>인터넷 출구 없이 해당 API에 접근하려면 지원되는 PrivateLink Interface Endpoint를 사용한다. 프라이빗 DNS와 엔드포인트 SG 등 네트워크 조건이 맞아야 이미 부여한 IAM 권한으로 실제 요청을 보낼 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 Gateway Endpoint를 앱 라우트 테이블에 연결한다</td>
          <td>S3용 경로는 Secrets Manager API에 대한 사설 접점을 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>Private hosted zone에 서비스 DNS 이름만 새로 등록한다</td>
          <td>DNS 이름만 바꿔도 실제 서비스의 사설 ENI와 연결 경로가 만들어지지 않는다.</td>
          </tr>
          <tr>
          <td>VPC Peering을 추가하고 상대 VPC NAT를 출구로 공유한다</td>
          <td>Peering 상대 NAT를 자신의 출구처럼 경유하는 연결은 지원되는 해결책이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 비공개 서브넷의 작업자는 Secrets Manager에서 비밀값을 읽어야 한다. 인터넷 출구를 추가할 수 없고 IAM 읽기 권한은 이미
              부여되어 있다. 최소한의 사설 연결로 구성하면서 반드시 확인할 항목은?
            answer: Secrets Manager용 인터페이스 엔드포인트와 프라이빗 DNS·SG를 구성한다
            wrong:
              - S3 Gateway Endpoint를 앱 라우트 테이블에 연결한다
              - Private hosted zone에 서비스 DNS 이름만 새로 등록한다
              - VPC Peering을 추가하고 상대 VPC NAT를 출구로 공유한다
      - id: Q24-10
        type: mcq
        title: Q24-10 · 모의고사 B
        explain: |
          <p>앱의 회원 디렉터리·외부 로그인·JWT 발급이 요구이므로 User pool이 적합하다. 앱이 AWS API를 직접 호출할 필요가 없다면 Identity pool을 통한 AWS 임시 자격 증명 발급은 필수가 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Cognito Identity pool을 만들고 User pool·외부 토큰 검증은 별도로 구현한다</td>
          <td>AWS 자격 증명이 필요 없는 요구에 불필요한 계층을 더하며 회원 디렉터리를 직접 구현해야 한다.</td>
          </tr>
          <tr>
          <td>IAM Identity Center를 모든 소비자 회원의 가입 디렉터리로 사용한다</td>
          <td>직원 다중 계정 접근 중심 서비스로 소비자 회원 가입·토큰 요구에는 User pool이 더 적합하다.</td>
          </tr>
          <tr>
          <td>회원 데이터베이스와 OIDC 검증·토큰 발급 서버를 자체 운영한다</td>
          <td>가능한 자체 구현이지만 관리형 회원 로그인 기능을 활용하는 대안보다 운영 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 모바일 앱은 자체 회원 가입과 외부 OIDC 로그인을 지원한다. 백엔드는 JWT로 사용자를 확인하고 자기 역할로 DB에 접근하므로
              브라우저에 AWS 자격 증명을 배포할 필요가 없다. 가장 적합한 인증 구성은?
            answer: Cognito User pool에서 로그인과 토큰 발급을 제공한다
            wrong:
              - Cognito Identity pool을 만들고 User pool·외부 토큰 검증은 별도로 구현한다
              - IAM Identity Center를 모든 소비자 회원의 가입 디렉터리로 사용한다
              - 회원 데이터베이스와 OIDC 검증·토큰 발급 서버를 자체 운영한다
      - id: Q24-11
        type: mcq
        title: Q24-11 · 모의고사 B
        explain: |
          <p>HTTP 내용과 요청 속도를 기준으로 ALB 앞에서 검사해야 하므로 WAF가 직접적인 통제다. 정상 요청의 오탐을 확인하며 규칙을 조정하고 앱의 입력 검증과 업무 권한 검사도 유지해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Shield Advanced만 구성하고 WAF 규칙은 별도로 두지 않는다</td>
          <td>DDoS 보호만으로 지정된 악성 HTTP 내용과 맞춤 속도 규칙을 구성한 것이 아니다.</td>
          </tr>
          <tr>
          <td>ALB 대상 SG에 요청 출발지 CIDR 허용 목록만 적용한다</td>
          <td>IP 목록은 URI·본문의 SQL 인젝션 패턴 검사나 유동적 HTTP 속도 제어를 대신하지 못한다.</td>
          </tr>
          <tr>
          <td>Network Firewall에 TCP 연결 규칙만 적용하고 웹 요청 검사는 두지 않는다</td>
          <td>명시된 TCP 규칙만으로 HTTP 내용의 SQL 인젝션 패턴을 검사하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 공개 주문 API에 SQL 인젝션 패턴과 특정 IP의 대량 HTTP 요청이 반복된다. API는 ALB 뒤에서 운영하며 정상 요청은 계속
              받아야 한다. OS 취약점 진단과 별개로 요청을 입구에서 검사하려면 무엇을 적용해야 하는가?
            answer: ALB에 WAF 규칙과 적절한 속도 기반 규칙을 연결한다
            wrong:
              - Shield Advanced만 구성하고 WAF 규칙은 별도로 두지 않는다
              - ALB 대상 SG에 요청 출발지 CIDR 허용 목록만 적용한다
              - Network Firewall에 TCP 연결 규칙만 적용하고 웹 요청 검사는 두지 않는다
      - id: Q24-12
        type: mcq
        title: Q24-12 · 모의고사 B
        explain: |
          <p>교체되는 앱 계층을 보안 그룹 참조로 식별하면 개별 IP를 유지하지 않고 필요한 DB 포트만 허용할 수 있다. 앱의 아웃바운드와 다른 경로·정책 조건도 연결을 허용해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>앱·관리·배치가 함께 있는 전체 서브넷 CIDR</td>
          <td>앱 이외 자원까지 DB 포트가 열려 필요한 앱 계층만 허용하는 조건보다 넓다.</td>
          </tr>
          <tr>
          <td>현재 앱 인스턴스들의 사설 IP /32 목록</td>
          <td>지금은 좁게 허용되지만 교체·확장 시 IP 목록 수동 갱신 부담이 남는다.</td>
          </tr>
          <tr>
          <td>공개 ALB의 보안 그룹</td>
          <td>ALB가 앱을 거치지 않고 DB에 접속하는 구조가 아니므로 DB 연결 출발지와 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 앱은 비공개 DB에 TCP 5432로 접속하며 앱 서버는 Auto Scaling으로 자주 교체된다. IP 목록을 수동 갱신하지 않고 앱
              계층에서 시작한 DB 연결만 허용해야 한다. DB 인바운드 규칙의 가장 적합한 출발지는?
            answer: 앱 인스턴스에 연결한 보안 그룹
            wrong:
              - 앱·관리·배치가 함께 있는 전체 서브넷 CIDR
              - 현재 앱 인스턴스들의 사설 IP /32 목록
              - 공개 ALB의 보안 그룹
      - id: Q24-13
        type: mcq
        title: Q24-13 · 모의고사 B
        explain: |
          <p>NACL은 연결 상태를 추적하지 않으므로 서버 응답이 향하는 클라이언트의 임시 목적지 포트도 허용해야 한다. 응답의 목적지는 서버 리스너 포트가 아니라 클라이언트가 선택한 포트다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>NACL 아웃바운드에서 목적지 TCP 443만 허용한다</td>
          <td>응답은 클라이언트 임시 포트를 목적지로 하므로 서버 리스너 포트만 열면 막힌다.</td>
          </tr>
          <tr>
          <td>NACL 인바운드에 클라이언트 임시 목적지 포트만 추가한다</td>
          <td>현재 서버 응답이 나가는 방향의 목적지 허용이 필요하므로 방향이 잘못됐다.</td>
          </tr>
          <tr>
          <td>NACL에서 클라이언트 CIDR만 좁히고 기존 아웃바운드 포트를 유지한다</td>
          <td>주소 범위 제한을 조정해도 반환 트래픽의 목적지 포트가 계속 차단된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 웹 서버 서브넷에 새 NACL을 적용한 뒤 HTTPS 연결이 시간 초과된다. 서버 인바운드 TCP 443은 허용되어 있고 클라이언트는 임시
              포트 55000을 사용한다. SG와 라우팅은 정상이다. 반환 경로를 복구하는 변경은?
            answer: 서브넷 NACL 아웃바운드에서 클라이언트 임시 목적지 포트 범위를 허용한다
            wrong:
              - NACL 아웃바운드에서 목적지 TCP 443만 허용한다
              - NACL 인바운드에 클라이언트 임시 목적지 포트만 추가한다
              - NACL에서 클라이언트 CIDR만 좁히고 기존 아웃바운드 포트를 유지한다
      - id: Q24-14
        type: mcq
        title: Q24-14 · 모의고사 B
        explain: |
          <p>Firewall Manager는 여러 계정에 지원 보안 정책을 중앙 적용하고 Inspector는 지원 컴퓨팅·이미지의 취약점을 평가한다. 정책 배포와 취약점 발견은 역할이 다르므로 함께 구성한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Amazon GuardDuty</td>
          <td>활동 기반 위협 탐지이며 이미지의 알려진 패키지 취약점 평가와 WAF 정책 중앙 적용의 담당 서비스가 아니다.</td>
          </tr>
          <tr>
          <td>AWS Security Hub CSPM</td>
          <td>발견 사항을 집계·점검할 수 있지만 자체가 모든 계정 WAF 정책 배포와 이미지 취약점 평가를 둘 다 수행하는 것은 아니다.</td>
          </tr>
          <tr>
          <td>AWS Config</td>
          <td>구성 준수를 평가할 수 있지만 패키지 취약점 평가 엔진과 중앙 WAF 정책 적용을 대체하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html">추가 공식 기능 근거</a>
          SAA 평가 항목: 1.2</p>
        quizzes:
          - q: 다중 계정 회사는 계정이 늘 때마다 동일한 WAF 기준을 적용해야 한다. 동시에 인스턴스·컨테이너 이미지의 알려진 취약점도 별도로 평가하려
              한다. 두 요구를 각각 담당하는 서비스 두 가지를 고르시오.
            answer: AWS Firewall Manager
            wrong:
              - Amazon GuardDuty
              - AWS Security Hub CSPM
              - AWS Config
            answers:
              - AWS Firewall Manager
              - Amazon Inspector
            options:
              - Amazon GuardDuty
              - AWS Firewall Manager
              - Amazon Inspector
              - AWS Security Hub CSPM
              - AWS Config
      - id: Q24-15
        type: mcq
        title: Q24-15 · 모의고사 B
        explain: |
          <p>교차 계정 KMS 사용은 키 소유자의 키 정책과 호출자 측 IAM 허용을 함께 확인해야 한다. 객체 읽기 권한과 복호화 권한은 별개이며 동일한 이름의 다른 키로 원본 암호문을 해독할 수 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>소유자 키 정책만 외부 계정에 허용하고 호출자 IAM 허용은 생략한다</td>
          <td>외부 계정 호출자 측에서 해당 키 사용을 허용해야 한다.</td>
          </tr>
          <tr>
          <td>분석 역할에 버킷 정책 수정 권한을 주고 KMS 사용은 유지한다</td>
          <td>버킷 정책 관리 권한은 KMS 키 복호화 허용을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>호출자 정책에 해당 키 Decrypt만 추가하고 소유자 키 정책은 변경하지 않는다</td>
          <td>교차 계정 키 사용에는 소유자 측 키 정책의 허용도 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 다른 계정 분석 역할이 SSE-KMS 암호화 객체를 읽는다. 버킷 정책과 역할의 GetObject는 정상인데 KMS 복호화가 거부된다. 키
              소유 계정의 키 정책과 호출자 IAM 정책 모두 해당 키 사용을 허용하지 않고 있다. 고객 관리형 키를 유지하며 접근을
              허용할 변경은?
            answer: 키 소유 계정 키 정책과 호출자 IAM 정책에서 해당 키 사용을 허용한다
            wrong:
              - 소유자 키 정책만 외부 계정에 허용하고 호출자 IAM 허용은 생략한다
              - 분석 역할에 버킷 정책 수정 권한을 주고 KMS 사용은 유지한다
              - 호출자 정책에 해당 키 Decrypt만 추가하고 소유자 키 정책은 변경하지 않는다
      - id: Q24-16
        type: mcq
        title: Q24-16 · 모의고사 B
        explain: |
          <p>Batch Operations Copy는 객체 목록을 관리형 작업으로 처리하면서 대상 SSE-KMS 키를 K2로 지정할 수 있다. 객체 크기가 Copy의 5GB 제한 이내이고 쓰기가 멈춰 있으므로 현재 버전을 같은 키로 복사해 검증할 수 있다. 이전 버전은 K1 암호화 상태로 남으므로 그 버전의 복원이 필요하면 K1 사용 권한을 유지하거나 별도로 이관해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>버킷 기본 암호화를 K2로 바꾸고 S3 Inventory 보고서를 생성한다</td>
          <td>기본 암호화는 이후 객체 쓰기에 적용된다. Inventory는 객체 목록을 만들지만 기존 현재 버전을 K2로 다시 쓰지 않는다.</td>
          </tr>
          <tr>
          <td>EC2 작업자가 객체를 내려받아 복호화한 뒤 K2로 다시 업로드한다</td>
          <td>목표는 달성할 수 있으나 200만 객체 다운로드·재업로드와 작업자 재시도를 직접 운영해야 한다. Batch Copy보다 전송·운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>K1의 자동 회전을 실행하고 K2 별칭을 K1에 연결한다</td>
          <td>자동 회전은 K1 내부 키 재료를 바꾸며 K2로 기존 객체를 다시 암호화하는 작업이 아니다. 별칭 변경도 객체 암호문을 바꾸지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops-copy-object.html">Batch Operations Copy와 크기·버전 제한</a> · <a href="https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html">KMS 키 회전의 영향</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 규정 변경으로 S3 Standard의 현재 객체 200만 개를 KMS 키 K1에서 별도 키 K2로 다시 암호화해야 한다. 객체는 각각
              100MB 이하이고 작업 중 새 쓰기는 중단할 수 있다. 기존 객체 키와 파일 내용은 유지하며 버킷 버전 관리는 켜져
              있다. 새 현재 버전을 검증한 뒤 K1 권한을 회수하려 할 때, 대규모 객체를 처리하는 운영 부담이 가장 적은 방식은?
            answer: S3 Batch Operations Copy로 같은 키에 K2 암호화 사본을 생성한다
            wrong:
              - 버킷 기본 암호화를 K2로 바꾸고 S3 Inventory 보고서를 생성한다
              - EC2 작업자가 객체를 내려받아 복호화한 뒤 K2로 다시 업로드한다
              - K1의 자동 회전을 실행하고 K2 별칭을 K1에 연결한다
      - id: Q24-17
        type: mcq
        title: Q24-17 · 모의고사 B
        explain: |
          <p>이 요구는 과거 버전 존재가 아니라 보존 기간 중 삭제를 제한하는 WORM 통제다. Object Lock의 compliance 보존을 검토하고 잘못 긴 보존 기간의 비용·수정 제한도 사전에 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 Versioning과 일반 수명 주기 만료 규칙만 구성한다</td>
          <td>버전이 존재해도 권한 있는 관리자가 영구 삭제할 수 있어 불변 보존 요구가 남는다.</td>
          </tr>
          <tr>
          <td>Governance 보존과 관리자의 우회 권한을 함께 부여한다</td>
          <td>우회 가능한 관리자에게는 보존 중 삭제를 막는 조건이 충족되지 않는다.</td>
          </tr>
          <tr>
          <td>다른 버킷에 복제하고 양쪽 관리자에게 일반 삭제 권한을 유지한다</td>
          <td>복제 사본에도 불변 보존 통제가 없어 관리자 영구 삭제에 대비하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 회사는 계약서를 7년간 보존하고 보존 기간 동안 관리자 실수로도 영구 삭제되지 않게 해야 한다. 여러 버전은 이미 보관하고 있지만
              관리자에게 버전 삭제 권한이 있다. 요구를 직접 충족하는 선택은?
            answer: S3 Object Lock을 compliance 모드로 7년 적용한다
            wrong:
              - S3 Versioning과 일반 수명 주기 만료 규칙만 구성한다
              - Governance 보존과 관리자의 우회 권한을 함께 부여한다
              - 다른 버킷에 복제하고 양쪽 관리자에게 일반 삭제 권한을 유지한다
      - id: Q24-18
        type: mcq
        title: Q24-18 · 모의고사 B
        explain: |
          <p>인증서의 갱신 자격·DNS 검증 조건을 유지하고 서로 다른 두 통신 구간에 TLS를 적용해야 한다. 사용자 HTTPS가 로드 밸런서에서 종료된 뒤의 대상 연결까지 자동으로 암호화해 주는 것은 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>ALB HTTPS 리스너를 유지하고 대상 그룹은 HTTP로 구성한다</td>
          <td>사용자 구간은 보호하지만 ALB 뒤 대상 구간의 암호화 조건을 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>검증 레코드를 지우고 만료 때마다 인증서를 수동 재발급한다</td>
          <td>갱신 실패 위험을 낮추는 관리형 DNS 검증 조건을 버리고 수동 작업을 늘린다.</td>
          </tr>
          <tr>
          <td>가져온 자체 인증서를 ALB에 연결하고 대상 그룹도 HTTPS로 설정한다</td>
          <td>두 통신 구간은 암호화할 수 있지만 가져온 인증서는 ACM 관리형 갱신 대상이 아니다. 자체 발급·재가져오기 절차를 운영해야 하므로 기존 DNS 검증 인증서의 관리형 갱신을 유지하는 구성보다 갱신 운영 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 웹 서비스는 ACM 인증서를 ALB에 연결하고 DNS 검증을 사용한다. 운영자는 갱신 실패 위험을 줄이면서 사용자→ALB와 ALB→대상
              구간을 모두 암호화해야 한다. 가장 적합한 구성은?
            answer: 검증 DNS 레코드를 유지하고 ALB 리스너·대상을 HTTPS로 설정한다
            wrong:
              - ALB HTTPS 리스너를 유지하고 대상 그룹은 HTTP로 구성한다
              - 검증 레코드를 지우고 만료 때마다 인증서를 수동 재발급한다
              - 가져온 자체 인증서를 ALB에 연결하고 대상 그룹도 HTTPS로 설정한다
      - id: Q24-19
        type: mcq
        title: Q24-19 · 모의고사 B
        explain: |
          <p>계정 분리는 운영 계정 침해의 영향을 줄이고 리전 분리는 리전 장애에 대비한다. 보관함 보존 통제를 추가하되 복사 지원·조직 관계·대상 정책과 복원에 필요한 KMS 권한을 함께 확인해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>같은 계정·같은 리전 보관함의 백업 빈도만 늘린다</td>
          <td>빈도가 늘어도 운영 계정 침해와 리전 장애의 공동 영향 범위가 남는다.</td>
          </tr>
          <tr>
          <td>원본 DB에 다중 AZ와 읽기 복제본만 구성한다</td>
          <td>현재 변경을 전달하는 복제는 침해 삭제와 리전 장애에 대비한 잠긴 별도 백업이 아니다.</td>
          </tr>
          <tr>
          <td>백업을 다른 리전에만 복사하고 동일 운영 계정의 삭제 권한을 유지한다</td>
          <td>리전 분리는 가능하지만 침해 계정이 사본을 지우는 위험을 별도 보존 통제로 막지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html">추가 공식 근거</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 운영 계정이 침해되어도 백업을 즉시 지우지 못하게 하고 리전 장애에도 복구 사본을 남기려 한다. 선택한 리소스는 관련 백업 복사 기능을
              지원한다. 조직·KMS 조건을 확인하면서 구성할 조치 두 가지를 고르시오.
            answer: 대상 보관함에 요구 보존 기간의 Vault Lock을 설계한다
            wrong:
              - 같은 계정·같은 리전 보관함의 백업 빈도만 늘린다
              - 원본 DB에 다중 AZ와 읽기 복제본만 구성한다
              - 백업을 다른 리전에만 복사하고 동일 운영 계정의 삭제 권한을 유지한다
            answers:
              - 대상 보관함에 요구 보존 기간의 Vault Lock을 설계한다
              - 다른 계정·리전의 보관함으로 백업 복사를 구성한다
            options:
              - 대상 보관함에 요구 보존 기간의 Vault Lock을 설계한다
              - 같은 계정·같은 리전 보관함의 백업 빈도만 늘린다
              - 원본 DB에 다중 AZ와 읽기 복제본만 구성한다
              - 백업을 다른 리전에만 복사하고 동일 운영 계정의 삭제 권한을 유지한다
              - 다른 계정·리전의 보관함으로 백업 복사를 구성한다
      - id: Q24-20
        type: mcq
        title: Q24-20 · 모의고사 B
        explain: |
          <p>Macie는 S3 객체 내용을 분석해 민감정보 발견 사항을 생성한다. 분류 결과 저장 위치도 허용 리전으로 정하고, eu-central-1로 CRR을 구성하면 허용된 두 리전 안에서 리전 장애 대비 사본을 만들 수 있다. 암호화는 저장 위치 제한을 대체하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>GuardDuty S3 Protection과 eu-central-1 대상 교차 리전 복제를 구성한다</td>
          <td>GuardDuty S3 Protection은 S3 접근 관련 위협을 탐지한다. CSV 내용의 개인 식별 정보 분류 작업을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>Macie 분류 작업과 us-east-1 대상 교차 리전 복제에 SSE-KMS를 적용한다</td>
          <td>SSE-KMS로 암호화해도 객체 사본을 us-east-1에 저장한다. 허용 저장 리전 조건을 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>Macie 분류 작업과 eu-west-1의 다른 버킷 대상 동일 리전 복제를 구성한다</td>
          <td>같은 리전의 별도 버킷은 계정·버킷 수준 격리를 줄 수 있지만 eu-west-1 전체 장애 시 사용할 다른 리전 사본이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html">Macie 민감정보 발견</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html">S3 복제 유형</a>
          SAA 평가 항목: 1.3</p>
        quizzes:
          - q: 회사는 eu-west-1의 비공개 S3 버킷에 CSV를 모은다. 문서 내용에서 개인 식별 정보를 주기적으로 찾아 보고해야 하며 리전 전체
              장애에 대비한 사본도 필요하다. 데이터와 분류 결과를 저장할 수 있는 곳은 eu-west-1과
              eu-central-1뿐이다. 두 리전에 필요한 서비스·권한을 준비했고 기존 복제본은 없다. 가장 적합한 구성은?
            answer: Macie 분류 작업과 eu-central-1 대상 S3 교차 리전 복제를 구성한다
            wrong:
              - GuardDuty S3 Protection과 eu-central-1 대상 교차 리전 복제를 구성한다
              - Macie 분류 작업과 us-east-1 대상 교차 리전 복제에 SSE-KMS를 적용한다
              - Macie 분류 작업과 eu-west-1의 다른 버킷 대상 동일 리전 복제를 구성한다
      - id: Q24-21
        type: mcq
        title: Q24-21 · 모의고사 B
        explain: |
          <p>빠른 접수와 오래 걸리는 처리를 분리해야 하므로 내구성 있는 작업 큐와 외부 상태 저장소를 사용한다. 소비자 확장은 큐의 적체·작업 기한·다운스트림 처리량을 기준으로 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>별도 작업자를 두되 API 서버 로컬 메모리 목록에서 작업을 전달한다</td>
          <td>메모리 전달 목록은 API 인스턴스 교체·장애 시 작업을 잃을 수 있다.</td>
          </tr>
          <tr>
          <td>SQS 메시지를 수신 즉시 삭제하고 렌더링 결과만 나중에 저장한다</td>
          <td>처리 중 작업자가 죽으면 큐에서 이미 지운 작업을 다시 전달받지 못한다.</td>
          </tr>
          <tr>
          <td>API 서버를 수직 확장하고 렌더링 완료까지 같은 요청에서 기다린다</td>
          <td>서버가 빨라져도 장시간 처리와 실패가 동기 응답 경로에 결합되어 즉시 접수 조건을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 영상 렌더링 API는 접수 결과를 즉시 응답해야 하지만 렌더링에는 수 분이 걸린다. 요청이 몰려도 작업을 잃지 않고 처리자 수를 따로
              늘리고 싶다. 렌더링 속도가 API 응답 시간을 직접 지배하지 않게 하는 구조는?
            answer: 작업 ID를 저장하고 SQS에 넣은 뒤 독립 작업자가 처리한다
            wrong:
              - 별도 작업자를 두되 API 서버 로컬 메모리 목록에서 작업을 전달한다
              - SQS 메시지를 수신 즉시 삭제하고 렌더링 결과만 나중에 저장한다
              - API 서버를 수직 확장하고 렌더링 완료까지 같은 요청에서 기다린다
      - id: Q24-22
        type: mcq
        title: Q24-22 · 모의고사 B
        explain: |
          <p>두 팀 모두 같은 사건을 받고 각각 독립적으로 재시도해야 하므로 발행·구독과 구독자별 내구성 큐를 조합한다. 하나의 경쟁 소비 큐는 작업 분담이지 각 팀에 대한 독립 전달이 아니다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>이메일·회계를 하나의 Step Functions 순차 단계로 묶는다</td>
          <td>순차 결합은 한 팀의 지연이 다른 팀의 진행을 막을 수 있어 독립 처리 요구와 맞지 않는다.</td>
          </tr>
          <tr>
          <td>팀들이 하나의 SQS 큐를 경쟁 소비한다</td>
          <td>작업을 분담받는 구조이므로 두 팀 각각 모든 지급 사건을 처리하는 요구와 다르다.</td>
          </tr>
          <tr>
          <td>SNS에서 두 팀의 HTTP 엔드포인트로만 전달하고 별도 적체 저장은 두지 않는다</td>
          <td>중단 후 밀린 일을 팀별로 안정적으로 회수하는 구조가 구독 큐보다 부족하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 보험사는 지급 완료 사건을 이메일 발송팀과 회계 적재팀이 각각 처리하게 하려 한다. 한 팀의 장애가 다른 팀을 지연시키지 않아야 하고 각
              팀 소비자는 복구 후 원하는 속도로 메시지를 직접 당겨 밀린 일을 처리해야 한다. 가장 적합한 구조는?
            answer: SNS 토픽에서 팀별 SQS 큐로 전달한다
            wrong:
              - 이메일·회계를 하나의 Step Functions 순차 단계로 묶는다
              - 팀들이 하나의 SQS 큐를 경쟁 소비한다
              - SNS에서 두 팀의 HTTP 엔드포인트로만 전달하고 별도 적체 저장은 두지 않는다
      - id: Q24-23
        type: mcq
        title: Q24-23 · 모의고사 B
        explain: |
          <p>순서·오류별 재시도·분기·보상 절차를 명시해야 하므로 상태 머신 워크플로가 적합하다. Step Functions가 업무 부작용을 자동 롤백하지는 않으므로 재고 반환과 결제 중복 방지는 직접 정의한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SQS에 재고·결제·배송 메시지를 별도 넣고 각각 처리한다</td>
          <td>분리된 큐만으로 앞 단계 성공 후 다음 단계 실행과 보상 상태를 관리하지 못한다.</td>
          </tr>
          <tr>
          <td>SNS 토픽에서 재고·결제·배송 소비자가 독립 실행되게 한다</td>
          <td>독립 전달만으로 요구한 선후 조건·오류별 상태·보상 절차가 명시적으로 조정되지 않는다.</td>
          </tr>
          <tr>
          <td>한 Lambda에서 각 API를 호출하고 모든 오류에 전체 함수를 재시도한다</td>
          <td>이미 성공한 단계와 영구 실패를 구분하지 못하며 별도 단계 상태 추적 구현이 필요하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 프랜차이즈는 재고 예약 뒤 결제하고, 결제 성공 때만 배송을 요청한다. 재고 서비스의 일시 오류는 제한적으로 재시도하되 결제 영구 실패에는
              재고 반환 절차를 실행해야 한다. 단계 상태를 직접 추적하는 코드 부담을 줄일 서비스는?
            answer: Retry·Catch와 보상 단계를 정의한 Step Functions
            wrong:
              - SQS에 재고·결제·배송 메시지를 별도 넣고 각각 처리한다
              - SNS 토픽에서 재고·결제·배송 소비자가 독립 실행되게 한다
              - 한 Lambda에서 각 API를 호출하고 모든 오류에 전체 함수를 재시도한다
      - id: Q24-24
        type: mcq
        title: Q24-24 · 모의고사 B
        explain: |
          <p>수평 확장에서는 다음 요청을 특정 인스턴스의 로컬 상태에 의존시키지 않아야 한다. 세션과 파일을 목적에 맞는 외부 저장소로 옮기고 그 저장소의 가용성·접근·보존도 함께 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>새 서버에도 동일한 로컬 폴더 경로만 만들어 업로드를 저장한다</td>
          <td>경로 이름이 같아도 데이터가 공유되지는 않아 다른 서버가 파일을 읽지 못한다.</td>
          </tr>
          <tr>
          <td>Sticky session을 켜고 서버 RAM에만 세션을 유지한다</td>
          <td>특정 서버 선호는 만들 수 있으나 그 서버 장애 때 세션 복구와 어느 서버 처리 조건이 남는다.</td>
          </tr>
          <tr>
          <td>정기 AMI로 업로드와 세션 상태를 대체한다</td>
          <td>AMI는 실행 중 변경을 실시간 공유하는 저장소가 아니며 RAM 세션을 보존하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html">추가 공식 근거</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 예약 사이트를 한 EC2에서 여러 AZ의 앱 서버로 늘리려 한다. 현재 로그인 세션은 서버 RAM에, 업로드 사진은 로컬 디스크에만 있다.
              어느 서버로 요청이 가도 처리할 수 있게 만드는 조치 두 가지는?
            answer: 업로드 사진을 S3 같은 외부 저장소에 보관한다
            wrong:
              - 새 서버에도 동일한 로컬 폴더 경로만 만들어 업로드를 저장한다
              - Sticky session을 켜고 서버 RAM에만 세션을 유지한다
              - 정기 AMI로 업로드와 세션 상태를 대체한다
            answers:
              - 업로드 사진을 S3 같은 외부 저장소에 보관한다
              - 세션을 적절히 복제·만료되는 외부 저장소로 옮긴다
            options:
              - 업로드 사진을 S3 같은 외부 저장소에 보관한다
              - 새 서버에도 동일한 로컬 폴더 경로만 만들어 업로드를 저장한다
              - Sticky session을 켜고 서버 RAM에만 세션을 유지한다
              - 정기 AMI로 업로드와 세션 상태를 대체한다
              - 세션을 적절히 복제·만료되는 외부 저장소로 옮긴다
      - id: Q24-25
        type: mcq
        title: Q24-25 · 모의고사 B
        explain: |
          <p>기존 브로커 프로토콜·라이브러리를 유지해야 하므로 관리형 호환 브로커인 Amazon MQ를 우선 검토한다. 실제 엔진 기능·클라이언트·HA 구성이 요구에 맞는지 확인하는 일은 남는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2의 RabbitMQ 클러스터를 그대로 이관해 직접 패치한다</td>
          <td>호환성은 유지할 수 있지만 줄이려는 브로커 패치·장애 운영 부담이 남는다.</td>
          </tr>
          <tr>
          <td>MSK로 이관하고 기존 AMQP 연동을 그대로 유지한다</td>
          <td>Kafka와 RabbitMQ의 프로토콜·클라이언트가 달라 일정 내 대규모 변경 회피 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>SQS로 전환하고 기존 RabbitMQ 클라이언트의 접속 주소만 변경한다</td>
          <td>API와 프로토콜이 달라 클라이언트 주소 변경만으로 기존 코드가 호환되지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 기존 대출 심사 앱은 RabbitMQ 프로토콜과 관련 라이브러리를 깊이 사용한다. 이관 일정상 대규모 코드 변경은 어렵지만 브로커 서버의
              패치·장애 대응 부담은 줄여야 한다. 가장 적합한 우선 검토 대상은?
            answer: 지원 호환성과 고가용성 구성을 확인한 Amazon MQ
            wrong:
              - EC2의 RabbitMQ 클러스터를 그대로 이관해 직접 패치한다
              - MSK로 이관하고 기존 AMQP 연동을 그대로 유지한다
              - SQS로 전환하고 기존 RabbitMQ 클라이언트의 접속 주소만 변경한다
      - id: Q24-26
        type: mcq
        title: Q24-26 · 모의고사 B
        explain: |
          <p>지원 SaaS에서 분석 저장소로 정기 데이터를 옮기는 요구에는 관리형 AppFlow 커넥터가 적합하다. 필드 매핑·지원 객체·실행 주기를 확인하되 서버 복제나 메시지 큐와 혼동하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SFTP Transfer Family 서버만 만들어 SaaS API 수집을 맡긴다</td>
          <td>파일 업로드 접점은 제공하지만 Salesforce API에서 예약 데이터를 가져오는 커넥터를 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>EC2에서 자체 Salesforce API 배치·자격 증명·스케줄러를 운영한다</td>
          <td>가능하지만 지원 커넥터가 있는데 수집 코드의 패치·오류·토큰 관리 부담을 직접 유지한다.</td>
          </tr>
          <tr>
          <td>DMS CDC로 Salesforce 객체의 데이터베이스 로그를 직접 읽는다</td>
          <td>지원 SaaS 커넥터 요구와 DB 로그 기반 CDC는 다르며 Salesforce 객체를 임의 DB 로그처럼 읽을 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/appflow/latest/userguide/what-is-appflow.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 유통사는 매일 밤 Salesforce 매출 데이터를 S3 분석 영역으로 옮기려 한다. 지원 커넥터가 있고 초 단위 전송이나 DB 트랜잭션
              CDC는 필요 없다. 커스텀 API 수집 코드의 운영을 줄이는 서비스는?
            answer: Amazon AppFlow의 예약 데이터 흐름
            wrong:
              - SFTP Transfer Family 서버만 만들어 SaaS API 수집을 맡긴다
              - EC2에서 자체 Salesforce API 배치·자격 증명·스케줄러를 운영한다
              - DMS CDC로 Salesforce 객체의 데이터베이스 로그를 직접 읽는다
      - id: Q24-27
        type: mcq
        title: Q24-27 · 모의고사 B
        explain: |
          <p>이벤트 내용과 소스에 따른 관리형 라우팅에는 EventBridge가 적합하다. 생산자는 사건을 발행하고 규칙이 대상을 연결하므로 직접 호출 주소 결합을 줄이며 전달 실패·보관 설정은 별도로 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>SNS 구독 필터 대신 모든 구독자가 전체 사건을 받아 자체 분류한다</td>
          <td>불필요한 전달과 소비자별 필터 구현이 늘어 관리형 내용 라우팅에 비해 운영 부담이 크다.</td>
          </tr>
          <tr>
          <td>생산자마다 모든 소비자의 HTTP 주소와 조건 분기를 관리한다</td>
          <td>가능하지만 소비자 추가·변경이 생산자 배포에 결합되어 요구한 직접 주소 결합 완화에 불리하다.</td>
          </tr>
          <tr>
          <td>하나의 SQS 큐를 두고 서로 다른 소비자가 메시지를 경쟁 수신한다</td>
          <td>경쟁 수신만으로 이벤트 내용에 따른 적합한 소비자 선택을 보장하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 플랫폼은 주문 생성·환불·가입 이벤트를 중앙에 모은다. 이벤트의 source와 detail 속성에 따라 서로 다른 AWS 처리기로 보내야
              하고 서비스 간 직접 주소 결합을 줄이고 싶다. 적합한 이벤트 연결 방식은?
            answer: EventBridge 이벤트 버스의 규칙으로 대상을 선택한다
            wrong:
              - SNS 구독 필터 대신 모든 구독자가 전체 사건을 받아 자체 분류한다
              - 생산자마다 모든 소비자의 HTTP 주소와 조건 분기를 관리한다
              - 하나의 SQS 큐를 두고 서로 다른 소비자가 메시지를 경쟁 수신한다
      - id: Q24-28
        type: mcq
        title: Q24-28 · 모의고사 B
        explain: |
          <p>지연을 허용하는 읽기만 복제본으로 분리하고 쓰기 직후의 최신 확인은 writer를 사용해야 한다. 비동기 복제 지연을 요청별 일관성 요구와 연결하는 설계가 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>일반 Multi-AZ DB instance의 standby에 통계 연결을 보낸다</td>
          <td>해당 standby는 읽기 조회용 대상이 아니므로 통계 부하를 분리할 수 없다.</td>
          </tr>
          <tr>
          <td>모든 조회를 비동기 replica로 보내 쓰기 직후도 동일 처리한다</td>
          <td>최근 쓰기가 아직 전달되지 않았을 수 있어 결제 직후 최신 확인 요구를 위반한다.</td>
          </tr>
          <tr>
          <td>월말 통계를 writer에서 계속 수행하고 replica는 연결하지 않는다</td>
          <td>부하를 분리할 수 있는 지연 허용 통계가 원본 CPU를 계속 소비한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 통계 API의 읽기 부하만 꾸준히 늘고 주문 쓰기는 현재 DB로 충분하다. 통계는 몇 초 전 값도 허용하지만 결제 직후 주문 확인은 최신
              쓰기를 읽어야 한다. 요구를 가장 잘 만족하는 연결 분리는?
            answer: 통계는 읽기 복제본으로, 결제 직후 확인은 writer로 보낸다
            wrong:
              - 일반 Multi-AZ DB instance의 standby에 통계 연결을 보낸다
              - 모든 조회를 비동기 replica로 보내 쓰기 직후도 동일 처리한다
              - 월말 통계를 writer에서 계속 수행하고 replica는 연결하지 않는다
      - id: Q24-29
        type: mcq
        title: Q24-29 · 모의고사 B
        explain: |
          <p>Fargate에서 비공개 ECR 이미지를 가져오고 awslogs로 로그를 전송하는 시작 작업에는 task execution role이 사용된다. 컨테이너 앱의 S3 API 호출은 task role에 필요한 권한을 부여해 두 실행 주체를 분리한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>앱 S3 권한을 execution role에만 넣는다</td>
          <td>execution role은 에이전트 작업용으로 앱 SDK의 task role 권한을 대신하지 않는다.</td>
          </tr>
          <tr>
          <td>이미지 다운로드 권한을 task role에만 넣는다</td>
          <td>작업 시작 시 이미지를 가져오는 에이전트의 execution role 권한이 별도로 필요하다.</td>
          </tr>
          <tr>
          <td>EC2 인스턴스 프로파일에 모든 작업 권한을 몰아 공유한다</td>
          <td>Fargate에는 고객이 관리하는 EC2 컨테이너 인스턴스 프로파일을 연결하는 방식이 없으며 task execution role과 task role을 분리해야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html">ECS task execution role</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html">ECS task role</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/instance_IAM_role.html">EC2 container instance role과의 차이</a>
          SAA 평가 항목: 2.1</p>
        quizzes:
          - q: 팀은 앱을 ECS Service의 Fargate 작업으로 실행한다. 비공개 ECR 이미지를 가져오고 awslogs로 로그를 전송해야 하며,
              컨테이너의 앱 코드는 별도로 S3 API를 호출한다. 작업에 관리자 권한을 주지 않으면서 실행 주체별 권한을 분리하는
              조치 두 가지는?
            answer: 앱의 S3 API 호출에 필요한 task role을 설정한다
            wrong:
              - 앱 S3 권한을 execution role에만 넣는다
              - 이미지 다운로드 권한을 task role에만 넣는다
              - EC2 인스턴스 프로파일에 모든 작업 권한을 몰아 공유한다
            answers:
              - 앱의 S3 API 호출에 필요한 task role을 설정한다
              - 실행 에이전트 작업에 필요한 task execution role을 설정한다
            options:
              - 앱의 S3 API 호출에 필요한 task role을 설정한다
              - 앱 S3 권한을 execution role에만 넣는다
              - 이미지 다운로드 권한을 task role에만 넣는다
              - EC2 인스턴스 프로파일에 모든 작업 권한을 몰아 공유한다
              - 실행 에이전트 작업에 필요한 task execution role을 설정한다
      - id: Q24-30
        type: mcq
        title: Q24-30 · 모의고사 B
        explain: |
          <p>앱 서버만 다중 AZ여도 공유 출구가 한 AZ에 묶이면 전체 요청 경로에 단일 장애 지점이 남는다. AZ별 NAT와 해당 AZ 라우팅으로 출구 의존성을 나누고 추가 고정 비용을 감수한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>정상 AZ의 앱 인스턴스 대수만 늘린다</td>
          <td>같은 장애 NAT를 향하는 경로가 그대로이므로 외부 API 출구 장애를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>두 AZ 앱을 동일 NAT로 유지하고 ASG 예약 확장만 추가한다</td>
          <td>사전 확장은 계산 용량을 늘리지만 공유 NAT의 AZ 의존성을 분리하지 않는다.</td>
          </tr>
          <tr>
          <td>NAT 인스턴스 한 대를 기존 NAT 대신 같은 AZ에 배치한다</td>
          <td>장치 유형만 바뀌고 동일 AZ에 출구가 하나인 장애 범위는 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 배송 서비스는 두 AZ에 앱을 배치했지만 외부 운송사 API 호출은 한 AZ의 NAT에 의존한다. 그 AZ 장애 때 다른 AZ 앱도 운송장
              발급에 실패했다. AZ 장애 범위를 줄이는 가장 적합한 변경은?
            answer: 각 AZ에 NAT를 두고 앱 서브넷이 같은 AZ NAT를 사용하게 한다
            wrong:
              - 정상 AZ의 앱 인스턴스 대수만 늘린다
              - 두 AZ 앱을 동일 NAT로 유지하고 ASG 예약 확장만 추가한다
              - NAT 인스턴스 한 대를 기존 NAT 대신 같은 AZ에 배치한다
      - id: Q24-31
        type: mcq
        title: Q24-31 · 모의고사 B
        explain: |
          <p>OS 수준 검사와 애플리케이션 건강은 다르므로 ASG가 ELB 상태를 교체 판단에 쓰도록 구성한다. 새 앱 준비 시간을 고려하되 로드 밸런서가 준비되지 않은 대상을 정상으로 취급하게 만들지는 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>EC2 기본 상태 확인만 유지하고 ALB 상태 확인 간격을 줄인다</td>
          <td>ALB가 빨리 감지해도 ASG가 그 건강을 교체 판단에 쓰지 않으면 증상이 남는다.</td>
          </tr>
          <tr>
          <td>ASG 최대 용량만 늘리고 상태 확인 종류는 유지한다</td>
          <td>확장 상한과 앱 고장 교체 판단은 다른 설정이다.</td>
          </tr>
          <tr>
          <td>앱 준비 시간을 무시하고 새 인스턴스 유예 시간을 0으로 만든다</td>
          <td>앱 부팅 중 정상 준비 과정을 실패로 판단해 반복 교체하는 위험이 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: ALB는 앱 프로세스가 멈춘 EC2를 unhealthy로 표시했지만 ASG는 인스턴스를 교체하지 않았다. EC2 시스템 검사는 정상이며 새
              인스턴스 준비에는 몇 분이 필요하다. 적합한 변경은?
            answer: ASG에 ELB 상태 확인을 반영하고 앱 준비에 맞는 유예 시간을 설정한다
            wrong:
              - EC2 기본 상태 확인만 유지하고 ALB 상태 확인 간격을 줄인다
              - ASG 최대 용량만 늘리고 상태 확인 종류는 유지한다
              - 앱 준비 시간을 무시하고 새 인스턴스 유예 시간을 0으로 만든다
      - id: Q24-32
        type: mcq
        title: Q24-32 · 모의고사 B
        explain: |
          <p>훈련 결과 warm standby는 30분 RTO와 2분 RPO로 두 목표를 충족한다. Active/active도 목표를 충족하지만 월 상시 비용이 더 높다. 이 수치는 각 DR 방식의 보장 시간이 아니라 해당 시스템의 사전 용량 확보 후 실측 결과다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>양쪽 리전에서 전체 업무량을 처리할 active/active를 쓴다</td>
          <td>복구 목표는 충족하지만 월 비용 900은 warm standby의 450보다 높다. 현재 목표에 필요한 최소 상시 비용 선택은 아니다.</td>
          </tr>
          <tr>
          <td>백업을 복구 리전에 보관하고 장애 시 앱과 DB를 복원한다</td>
          <td>측정된 RTO 90분과 RPO 15분 모두 허용치를 넘는다. 저렴한 저장 비용만으로 복구 목표를 만족하지 못한다.</td>
          </tr>
          <tr>
          <td>복제 DB를 가동하고 장애 시 앱 계층을 배포하는 pilot light를 쓴다</td>
          <td>RPO 2분은 충족하지만 앱 배포를 포함한 RTO 55분이 45분을 초과한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html">DR 전략의 복구·비용 절충</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 주 리전 장애에 대한 목표는 RTO 45분, RPO 5분이다. 복구 리전의 할당량과 필요한 용량을 확보한 뒤 네 가지 구성을 동일한
              업무량으로 훈련했다. 백업 복원은 복구 90분·데이터 손실 15분·월 100, pilot light는 55분·2분·월
              200, warm standby는 30분·2분·월 450, active/active는 3분·1분·월 900이었다.
              금액은 팀의 월별 비용 추정 단위다. 두 목표를 충족하며 상시 비용이 가장 낮은 선택은?
            answer: 축소된 앱과 복제 DB를 운영하다 확장하는 warm standby를 쓴다
            wrong:
              - 양쪽 리전에서 전체 업무량을 처리할 active/active를 쓴다
              - 백업을 복구 리전에 보관하고 장애 시 앱과 DB를 복원한다
              - 복제 DB를 가동하고 장애 시 앱 계층을 배포하는 pilot light를 쓴다
      - id: Q24-33
        type: mcq
        title: Q24-33 · 모의고사 B
        explain: |
          <p>논리적 오염은 복제 경로에도 전파되므로 과거 시점 백업이 필요하다. PITR은 새 DB를 만들기 때문에 데이터 검증과 그 이후 정상 업무의 대조·연결 전환을 별도 절차로 수행해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>현재 reader를 승격해 과거 데이터 복원 절차를 대신한다</td>
          <td>reader에도 잘못된 SQL이 전파됐으므로 승격만으로 이전 값이 돌아오지 않는다.</td>
          </tr>
          <tr>
          <td>Multi-AZ 자동 장애 조치를 실행하고 과거 데이터 대조는 생략한다</td>
          <td>standby는 과거 시점 보관본이 아니므로 논리 오염도 복제되어 있다.</td>
          </tr>
          <tr>
          <td>변경 이후 가장 최신 스냅샷만 복원한다</td>
          <td>오염 후 사본에는 잘못된 데이터가 포함되므로 변경 전 시점을 찾아야 한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 병원의 RDS에는 모든 환자 연락처를 잘못 바꾸는 SQL이 실행되어 Multi-AZ와 reader에도 변경이 반영되었다. 정상 연락처로
              돌아가야 하지만 최근의 정상 업무도 비교·복구해야 한다. 필요한 조치 두 가지는?
            answer: 변경 전 시점으로 새 DB를 PITR 복원한다
            wrong:
              - 현재 reader를 승격해 과거 데이터 복원 절차를 대신한다
              - Multi-AZ 자동 장애 조치를 실행하고 과거 데이터 대조는 생략한다
              - 변경 이후 가장 최신 스냅샷만 복원한다
            answers:
              - 변경 전 시점으로 새 DB를 PITR 복원한다
              - 복원 데이터 검증과 정상 변경 대조 후 앱 전환·병합 절차를 수행한다
            options:
              - 현재 reader를 승격해 과거 데이터 복원 절차를 대신한다
              - Multi-AZ 자동 장애 조치를 실행하고 과거 데이터 대조는 생략한다
              - 변경 이후 가장 최신 스냅샷만 복원한다
              - 변경 전 시점으로 새 DB를 PITR 복원한다
              - 복원 데이터 검증과 정상 변경 대조 후 앱 전환·병합 절차를 수행한다
      - id: Q24-34
        type: mcq
        title: Q24-34 · 모의고사 B
        explain: |
          <p>추가형 스키마를 적용하고 기존 데이터를 backfill한 뒤 중간 앱을 배포한다. 새 AMI에서도 롤백 기간 동안 두 열을 계속 갱신해야 기존 데이터와 전환 후 새 주문 모두 이전 앱에서 읽을 수 있다. 이 상태에서 트래픽을 전환하고 롤백 기간이 끝난 뒤 기존 열을 제거하면 코드 복귀와 데이터 호환을 함께 만족한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>별도 DB 복제 → 새 AMI와 복제 DB로 전환 → 장애 시 이전 ASG와 기존 DB로 전환</td>
          <td>새 DB에만 들어간 주문은 기존 DB에 반영되지 않는다. 역방향 데이터 동기화가 없는 이 구성에서는 이전 DB로 즉시 전환하면 주문을 잃는다.</td>
          </tr>
          <tr>
          <td>기존 열 이름 변경 → 새 AMI 전환 → 장애 시 ALB를 이전 ASG로 전환해 기존 DB에 연결</td>
          <td>이전 앱이 읽는 기존 열이 없어져 ALB를 되돌려도 앱이 동작하지 않는다. 트래픽 전환과 스키마 롤백은 별개다.</td>
          </tr>
          <tr>
          <td>DB 스냅샷·이전 AMI 보관 → 새 AMI 전환 → 장애 시 스냅샷 복원 DB와 이전 ASG로 전환</td>
          <td>스냅샷은 배포 직전 시점의 데이터다. 그 뒤 접수된 주문을 되돌리는 것은 주문 손실 없는 즉시 복귀 요구와 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/whitepapers/latest/blue-green-deployments/best-practices-for-managing-data-synchronization-and-schema-changes.html">스키마 변경과 blue/green 분리</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 쇼핑몰은 새 AMI를 별도 ASG에 배포한 뒤 ALB로 트래픽을 전환하려 한다. 새 앱은 결제 상태를 새 열에 저장하지만 이전 앱은 기존
              열만 읽는다. 전환 뒤에도 주문 쓰기는 계속되며 10분 내 문제가 발견되면 주문 손실 없이 이전 앱으로 즉시 돌아가야
              한다. 리허설에서 두 열을 함께 갱신하는 중간 앱은 정상 동작했다. 적합한 릴리스 순서는?
            answer: 새 열 추가·기존 데이터 backfill → 중간 앱·새 AMI로 롤백 기간 두 열 갱신 → 기간 종료 후 기존 열 제거
            wrong:
              - 별도 DB 복제 → 새 AMI와 복제 DB로 전환 → 장애 시 이전 ASG와 기존 DB로 전환
              - 기존 열 이름 변경 → 새 AMI 전환 → 장애 시 ALB를 이전 ASG로 전환해 기존 DB에 연결
              - DB 스냅샷·이전 AMI 보관 → 새 AMI 전환 → 장애 시 스냅샷 복원 DB와 이전 ASG로 전환
      - id: Q24-35
        type: mcq
        title: Q24-35 · 모의고사 B
        explain: |
          <p>DNS 정책은 새 질의의 응답 대상을 바꾸며 클라이언트가 보관한 TTL이나 기존 연결을 즉시 이주시키지 않는다. 장애 탐지·캐시 만료·재연결까지 측정해야 실제 RTO를 추정할 수 있다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Route 53 TTL을 그대로 유지하고 헬스 체크 간격만 단축한다</td>
          <td>탐지는 빨라질 수 있으나 이미 캐시된 주소·기존 연결의 전환 지연이 남는다.</td>
          </tr>
          <tr>
          <td>대기 리전에 서버만 더 추가하고 클라이언트 재시도는 금지한다</td>
          <td>대기 용량은 늘지만 예전 연결을 종료·재시도해 새 주소를 쓰는 절차가 해결되지 않는다.</td>
          </tr>
          <tr>
          <td>DNS 가중치를 100으로 올리면 모든 기존 세션도 즉시 이동한다고 본다</td>
          <td>새 응답 선택과 기존 DNS 캐시·TCP 세션은 다른 상태이므로 즉시 이동하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 사용자는 주 리전 장애 뒤에도 일정 시간 옛 주소로 접속한다. Route 53 Failover는 대기 리전의 정상 주소를 응답하기 시작했고
              새 조회에서는 정상이다. DB와 앱은 대기 리전에서 동작한다. 가장 타당한 설명과 대응은?
            answer: 기존 DNS 캐시와 연결의 영향을 고려해 TTL·클라이언트 재연결을 복구 시간에 포함한다
            wrong:
              - Route 53 TTL을 그대로 유지하고 헬스 체크 간격만 단축한다
              - 대기 리전에 서버만 더 추가하고 클라이언트 재시도는 금지한다
              - DNS 가중치를 100으로 올리면 모든 기존 세션도 즉시 이동한다고 본다
      - id: Q24-36
        type: mcq
        title: Q24-36 · 모의고사 B
        explain: |
          <p>복구 후 재시도 동기화를 줄이려면 간격을 늘리고 분산하며 최대 시도·시간을 제한해야 한다. 네트워크 응답 유실 뒤 이미 성공한 청구가 재실행될 수 있으므로 업무 멱등성도 함께 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 클라이언트에 같은 고정 재시도 간격을 둔다</td>
          <td>동일 시점 재시도가 겹쳐 복구 직후 부하 파동이 계속될 수 있다.</td>
          </tr>
          <tr>
          <td>동시 실행을 늘리고 재시도 횟수·시간 제한은 없앤다</td>
          <td>외부 API의 처리 한도를 넘겨 장애를 악화시키고 재시도 폭을 제한하지 못한다.</td>
          </tr>
          <tr>
          <td>재시도를 전부 비활성화하고 실패 사건은 운영자가 수동 재입력한다</td>
          <td>일시 장애 자동 회복 능력을 잃고 중복 청구 방지·작업 유실 관리 부담이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-10.html">10일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 여러 서비스가 장애 복구 후 동시에 외부 API를 재호출해 API가 다시 과부하에 빠진다. 업무는 약간 지연되어도 되지만 중복 청구는
              허용되지 않는다. 재해 재발을 줄이는 가장 적절한 소비자 동작은?
            answer: 재시도 상한·백오프·지터와 업무 멱등성을 적용한다
            wrong:
              - 모든 클라이언트에 같은 고정 재시도 간격을 둔다
              - 동시 실행을 늘리고 재시도 횟수·시간 제한은 없앤다
              - 재시도를 전부 비활성화하고 실패 사건은 운영자가 수동 재입력한다
      - id: Q24-37
        type: mcq
        title: Q24-37 · 모의고사 B
        explain: |
          <p>기존 앱의 SMB·AD 연동 요구를 유지하면서 파일 서버 가용성을 높여야 하므로 FSx for Windows의 지원 배치를 검토한다. 앱을 객체 API로 재작성하거나 독립 로컬 볼륨을 공유처럼 취급할 수는 없다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Regional EFS를 기존 Windows SMB 공유의 직접 대체로 연결한다</td>
          <td>EFS의 NFS 인터페이스는 기존 SMB·AD 요구의 직접 호환 대안이 아니다.</td>
          </tr>
          <tr>
          <td>EC2 Windows 파일 서버 한 대와 별도 정기 EBS 스냅샷을 운영한다</td>
          <td>SMB 호환은 가능하지만 단일 서버 장애와 패치·복구 운영 부담 감소가 충분하지 않다.</td>
          </tr>
          <tr>
          <td>앱마다 별도 Windows 파일 서버와 독립 파일 사본을 유지한다</td>
          <td>동일 공유 경로의 일관성과 중앙 운영 대신 동기화·서버 관리 부담이 늘어난다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 2.2</p>
        quizzes:
          - q: 레거시 문서 앱은 수정하기 어려우며 여러 Windows 서버가 같은 SMB 경로와 Active Directory 인증을 사용해야 한다.
              단일 파일 서버 장애에 대한 대비와 관리 부담 감소가 필요하다. 가장 적합한 저장 계층은?
            answer: 요구에 맞는 다중 AZ FSx for Windows File Server
            wrong:
              - Regional EFS를 기존 Windows SMB 공유의 직접 대체로 연결한다
              - EC2 Windows 파일 서버 한 대와 별도 정기 EBS 스냅샷을 운영한다
              - 앱마다 별도 Windows 파일 서버와 독립 파일 사본을 유지한다
      - id: Q24-38
        type: mcq
        title: Q24-38 · 모의고사 B
        explain: >
          <p>다중 AZ의 Linux 클라이언트가 같은 NFS 파일 시스템을 공유해야 하므로 Regional EFS가 적합하다. 용량
          관리 부담을 줄이되 처리량·지연·네트워크 접근 설정은 워크로드에 맞게 선택해야 한다.</p>

          <table>

          <thead>

          <tr>

          <th>오답</th>

          <th>틀린 이유</th>

          </tr>

          </thead>

          <tbody><tr>

          <td>한 AZ의 EC2 NFS 서버 한 대에 공유 EBS를 연결한다</td>

          <td>NFS 공유는 가능하지만 단일 AZ 데이터·파일 서버 운영 부담이 조건과 충돌한다.</td>

          </tr>

          <tr>

          <td>EFS One Zone을 사용해 같은 NFS 경로를 제공한다</td>

          <td>NFS는 맞지만 저장소를 한 AZ에만 두지 않는 조건을 충족하지 않는다.</td>

          </tr>

          <tr>

          <td>FSx for Windows를 선택하고 Linux NFS 클라이언트 설정을 그대로 유지한다</td>

          <td>SMB 중심 Windows 파일 서비스는 요구된 NFS 접속 방식의 직접 대안이 아니다.</td>

          </tr>

          </tbody></table>

          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>

          공식 근거: <a
          href="https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html">AWS 공식
          설계·기능 문서</a>

          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: Linux 기반 분산 빌드 서버가 여러 AZ에서 같은 소스·결과 파일을 NFS로 동시에 읽고 써야 한다. 서버가 늘 때 파일 서버 용량을
              직접 운영하고 싶지 않으며 한 AZ에만 데이터를 두는 것도 허용되지 않는다. 가장 적합한 저장소는?
            answer: 요구 처리량을 구성한 Regional EFS
            wrong:
              - 한 AZ의 EC2 NFS 서버 한 대에 공유 EBS를 연결한다
              - EFS One Zone을 사용해 같은 NFS 경로를 제공한다
              - FSx for Windows를 선택하고 Linux NFS 클라이언트 설정을 그대로 유지한다
      - id: Q24-39
        type: mcq
        title: Q24-39 · 모의고사 B
        explain: |
          <p>큰 업로드의 재전송 범위를 줄이려면 멀티파트를 사용하며 S3는 성공한 객체 쓰기에 강력한 읽기 일관성을 제공한다. 완료 전 부분 객체를 완성 객체처럼 읽는다는 뜻은 아니며 미완료 파트 정리도 필요하다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>S3 버전 관리를 켜서 업로드 실패 파트 재전송을 대신한다</td>
          <td>버전 관리는 완료된 객체 변경 이력을 남기며 부분 업로드의 전송 재시도 단위를 바꾸지 않는다.</td>
          </tr>
          <tr>
          <td>CloudFront의 원본 캐시 TTL을 줄여 실패 업로드를 복구한다</td>
          <td>캐시 만료는 큰 업로드의 부분 재전송과 완료된 S3 객체의 읽기 일관성 설계와 다르다.</td>
          </tr>
          <tr>
          <td>실패 때 전체 파일을 단일 PUT으로 다시 전송한다</td>
          <td>지원되는 전송은 가능하지만 실패한 부분만 다시 보내려는 낭비 감소 조건을 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html#ConsistencyModel">추가 공식 기능 근거</a>
          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: 의료 영상 업로드는 큰 객체를 인터넷 경로로 전송하며 간헐적으로 끊긴다. 클라이언트는 실패 때 전체 파일을 다시 보내는 낭비를 줄여야 하고
              다운로드 사용자가 같은 키의 최신 성공 쓰기를 읽어야 한다. 올바른 설명·조치 두 가지는?
            answer: 일반 S3의 성공한 객체 쓰기 뒤 강력한 읽기 일관성을 이용한다
            wrong:
              - S3 버전 관리를 켜서 업로드 실패 파트 재전송을 대신한다
              - CloudFront의 원본 캐시 TTL을 줄여 실패 업로드를 복구한다
              - 실패 때 전체 파일을 단일 PUT으로 다시 전송한다
            answers:
              - 일반 S3의 성공한 객체 쓰기 뒤 강력한 읽기 일관성을 이용한다
              - 멀티파트 업로드로 실패한 파트만 다시 전송한다
            options:
              - 일반 S3의 성공한 객체 쓰기 뒤 강력한 읽기 일관성을 이용한다
              - S3 버전 관리를 켜서 업로드 실패 파트 재전송을 대신한다
              - CloudFront의 원본 캐시 TTL을 줄여 실패 업로드를 복구한다
              - 실패 때 전체 파일을 단일 PUT으로 다시 전송한다
              - 멀티파트 업로드로 실패한 파트만 다시 전송한다
      - id: Q24-40
        type: mcq
        title: Q24-40 · 모의고사 B
        explain: |
          <p>필요 처리량은 10,000 × 16KiB로 약 156MiB/s다. gp3 12,000 IOPS·250MiB/s는 두 요구와 인스턴스 한도 안에 있고 지연도 검증되었다. gp3는 용량과 독립적으로 성능을 조정할 수 있으므로 추가 용량이나 더 비싼 io2가 필요하지 않다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>io2 1TiB에 12,000 IOPS를 설정하고 데이터를 옮긴다</td>
          <td>io2도 성능 목표를 충족하지만 리허설과 견적상 gp3 성능 조정보다 3배 비싸다. 이 문제에는 io2가 필요한 추가 지연 조건이 없다.</td>
          </tr>
          <tr>
          <td>EBS 한도가 32,000 IOPS인 인스턴스로 변경한다</td>
          <td>현재 인스턴스 한도는 이미 요구량보다 높다. 인스턴스만 바꾸어도 기존 gp3 볼륨의 설정 한도는 남는다.</td>
          </tr>
          <tr>
          <td>gp3를 2TiB로 늘리고 3,000 IOPS·125MiB/s를 설정한다</td>
          <td>gp3의 크기 증가만으로 지정 IOPS와 처리량이 늘지 않는다. 설정한 3,000 IOPS·125MiB/s가 계속 병목이다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-03.html">3일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html">gp3 용량과 독립적인 성능 설정</a>
          SAA 평가 항목: 3.1</p>
        quizzes:
          - q: EC2 DB의 1TiB gp3는 3,000 IOPS·125MiB/s로 설정되어 있다. 16KiB 임의 I/O가 초당 10,000회 필요한
              시간대에 볼륨 한도에 도달한다. 인스턴스는 16,000 EBS IOPS·1,000MiB/s를 지원하며 용량은 충분하다.
              리허설에서 gp3 12,000 IOPS·250MiB/s와 io2 12,000 IOPS 모두 지연 목표를 충족했고 후자의
              월 증분 견적은 전자의 3배다. 비용이 가장 낮은 개선은?
            answer: gp3를 1TiB로 두고 12,000 IOPS·250MiB/s를 설정한다
            wrong:
              - io2 1TiB에 12,000 IOPS를 설정하고 데이터를 옮긴다
              - EBS 한도가 32,000 IOPS인 인스턴스로 변경한다
              - gp3를 2TiB로 늘리고 3,000 IOPS·125MiB/s를 설정한다
      - id: Q24-41
        type: mcq
        title: Q24-41 · 모의고사 B
        explain: |
          <p>c7i는 x86 현재 모듈을 사용할 수 있고 작업 20분으로 목표를 충족한다. m7i도 목표를 충족하지만 비용이 16으로 더 높다. 후보별 실측과 현재 모듈 호환성·납기를 함께 적용하면 c7i가 최소 비용 선택이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>r7i와 현재 상용 모듈을 배포한다</td>
          <td>x86 호환은 만족하지만 측정된 28분은 25분 처리 목표를 넘으며 비용도 더 높다.</td>
          </tr>
          <tr>
          <td>c7g와 Arm용 대체 모듈을 배포한다</td>
          <td>측정된 속도와 비용은 유리하지만 Arm 대체 모듈을 쓴 결과다. 현재 상용 모듈을 유지해야 하며 공급자의 지원 시점도 이관 기한보다 늦다.</td>
          </tr>
          <tr>
          <td>m7i와 현재 상용 모듈을 배포한다</td>
          <td>현재 모듈과 25분 목표는 만족하지만 같은 조건을 충족하는 c7i보다 작업별 비용이 높다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html">EC2 인스턴스 유형과 CPU 아키텍처</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: 영상 분석 배치를 2주 내 옮겨야 한다. CPU 사용률은 95%, 메모리는 20%이고 GPU 가속은 지원하지 않는 x86 전용 상용 모듈을
              쓴다. 공급자는 Arm 버전을 3개월 뒤 제공한다. 후보의 동일 입력 테스트에서 c7i는 20분·비용 10, m7i는
              23분·비용 16, r7i는 28분·비용 20, c7g는 Arm용 대체 모듈로 18분·비용 8이었다. 값은 팀이 측정한
              작업별 시간과 비용 단위다. 25분 이내 처리와 현재 모듈 사용을 만족하는 최소 비용 후보는?
            answer: c7i와 현재 상용 모듈을 배포한다
            wrong:
              - r7i와 현재 상용 모듈을 배포한다
              - c7g와 Arm용 대체 모듈을 배포한다
              - m7i와 현재 상용 모듈을 배포한다
      - id: Q24-42
        type: mcq
        title: Q24-42 · 모의고사 B
        explain: |
          <p>일반 Lambda 모델은 메모리 설정과 CPU 배정이 연계되므로 더 큰 메모리가 실행 시간을 충분히 줄이면 비용도 줄 수 있다. 호출당 자원·시간을 실제 측정하고 외부 대기 병목인지도 구분해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>최소 메모리를 고정하고 동시 실행 상한만 늘린다</td>
          <td>여러 호출 수는 늘 수 있지만 개별 계산 시간과 메모리·시간 비용을 최적화하지 않는다.</td>
          </tr>
          <tr>
          <td>Reserved concurrency를 높이고 메모리 설정은 그대로 둔다</td>
          <td>동시 실행은 한 호출의 CPU 배정이 아니라 실행 수를 제어한다.</td>
          </tr>
          <tr>
          <td>Provisioned concurrency를 늘려 초기화가 끝난 호출의 계산 시간을 줄인다</td>
          <td>초기화 지연을 줄이는 설정이며 이미 실행 중인 CPU 계산 성능을 늘리는 설정은 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: Lambda로 실행하는 문서 변환은 메모리 부족 없이 동작하지만 CPU 계산 시간이 길다. 호출량은 같고 지연 목표를 맞추면서 총 계산
              비용도 비교해야 한다. 가장 적절한 최적화 방법은?
            answer: 메모리별 실행 시간과 비용을 측정해 CPU 증가 효과를 비교한다
            wrong:
              - 최소 메모리를 고정하고 동시 실행 상한만 늘린다
              - Reserved concurrency를 높이고 메모리 설정은 그대로 둔다
              - Provisioned concurrency를 늘려 초기화가 끝난 호출의 계산 시간을 줄인다
      - id: Q24-43
        type: mcq
        title: Q24-43 · 모의고사 B
        explain: |
          <p>목표 적체량은 허용 대기 시간 120초를 메시지당 평균 처리 시간 3초로 나눈 40개/대다. 현재 지표는 visible 800개를 InService 10대로 나눈 80개/대이므로 목표보다 높아 확장이 필요한 상태다. 이는 정상 상태의 용량 계획 근사이며 기동 지연 등은 별도로 여유를 둔다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>목표 40개/대, 현재 800개/대로 계산한다</td>
          <td>800은 큐 전체 메시지 수다. 인스턴스당 지표에는 현재 처리자 10대로 나누어야 한다.</td>
          </tr>
          <tr>
          <td>목표 360개/대, 현재 80개/대로 계산한다</td>
          <td>시간을 처리 시간으로 나누는 대신 곱한 값이다. 360개/대는 평균 1,080초의 적체에 해당한다.</td>
          </tr>
          <tr>
          <td>목표 120개/대, 현재 80개/대로 계산한다</td>
          <td>120은 초 단위의 대기 시간이다. 이를 메시지 수 목표로 쓰면 인스턴스당 약 360초의 대기 적체를 허용하게 된다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-06.html">6일 차 개념</a> · <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html">SQS backlog per instance 목표 계산</a>
          SAA 평가 항목: 3.2</p>
        quizzes:
          - q: SQS 작업을 EC2 ASG가 처리한다. 인스턴스 하나는 동시에 작업 하나를 처리하고 평균 처리 시간은 3초로 안정적이다. 팀은 정상
              상태에서 대기 메시지의 허용 대기 시간을 120초로 잡았다. 현재 visible 메시지는 800개이고 InService
              인스턴스는 10대다. 인스턴스당 큐 적체량으로 목표 추적을 설정할 때 적절한 목표와 이번 지표값은?
            answer: 목표 40개/대, 현재 80개/대로 계산한다
            wrong:
              - 목표 40개/대, 현재 800개/대로 계산한다
              - 목표 360개/대, 현재 80개/대로 계산한다
              - 목표 120개/대, 현재 80개/대로 계산한다
      - id: Q24-44
        type: mcq
        title: Q24-44 · 모의고사 B
        explain: |
          <p>20~30초 TTL 지터는 최대 30초의 허용 신선도를 지키면서 서로 다른 키의 만료 시점을 분산한다. 공유 키별 잠금은 여러 앱에 걸친 동일 키의 원본 적재를 한 요청으로 합친다. 잠금에는 만료·타임아웃과 로더 실패 시 복구를 두어야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>모든 키의 TTL을 30초에서 20초로 줄인다</td>
          <td>동일한 20초 TTL은 만료 빈도를 늘리며 한꺼번에 적재된 서로 다른 키의 만료 시점을 계속 맞춘다.</td>
          </tr>
          <tr>
          <td>각 앱 인스턴스에 원본 읽기용 동시 실행 세마포어를 둔다</td>
          <td>앱별 세마포어는 전체 원본 부하를 제한하는 데 도움이 되지만 여러 앱의 동일 키 중복 적재를 하나로 합치거나 키 만료를 분산하지 않는다.</td>
          </tr>
          <tr>
          <td>각 앱 인스턴스 내부에서 키별 mutex로 원본 읽기를 직렬화한다</td>
          <td>로컬 mutex는 한 앱 안의 중복만 합친다. 앱 100개가 각각 동일 키를 다시 읽는 상황을 막지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/whitepapers/latest/database-caching-strategies-using-redis/cache-validity.html">캐시 TTL 지터</a> · <a href="https://aws.amazon.com/builders-library/caching-challenges-and-strategies/">요청 병합과 캐시 부하</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: 항공권 조회는 Redis 호환 캐시를 cache-aside로 사용하고 결제 가격은 원본에서 다시 확인한다. 조회 값은 최대 30초까지
              오래되어도 된다. 100개 앱 인스턴스가 공유하는 수천 키를 한꺼번에 적재한 뒤 같은 순간 만료되며, 인기 키 하나가
              비면 여러 인스턴스가 동시에 DB에서 다시 읽는다. 서로 다른 키의 동시 만료와 같은 키의 중복 적재를 각각 줄일 조치
              두 가지는?
            answer: 키마다 20~30초 범위에서 TTL을 임의로 선택한다
            wrong:
              - 모든 키의 TTL을 30초에서 20초로 줄인다
              - 각 앱 인스턴스에 원본 읽기용 동시 실행 세마포어를 둔다
              - 각 앱 인스턴스 내부에서 키별 mutex로 원본 읽기를 직렬화한다
            answers:
              - 키마다 20~30초 범위에서 TTL을 임의로 선택한다
              - 공유 캐시의 키별 분산 잠금으로 한 요청이 원본을 읽고 나머지는 결과를 기다리게 한다
            options:
              - 모든 키의 TTL을 30초에서 20초로 줄인다
              - 각 앱 인스턴스에 원본 읽기용 동시 실행 세마포어를 둔다
              - 키마다 20~30초 범위에서 TTL을 임의로 선택한다
              - 공유 캐시의 키별 분산 잠금으로 한 요청이 원본을 읽고 나머지는 결과를 기다리게 한다
              - 각 앱 인스턴스 내부에서 키별 mutex로 원본 읽기를 직렬화한다
      - id: Q24-45
        type: mcq
        title: Q24-45 · 모의고사 B
        explain: |
          <p>기존 테이블에 다른 파티션 키의 조회 경로가 필요하면 GSI를 검토한다. 상태 값이 적어 hot key가 생길 수 있고 인덱스 저장·쓰기에 비용이 더 들며 읽기는 최종 일관성을 전제로 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 테이블에 파티션 키가 다른 LSI를 추가한다</td>
          <td>LSI는 같은 파티션 키와 생성 시점 제약이 있어 요구된 사후 새 접근 키에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>상태별 전체 Scan과 필터를 운영 화면의 매 요청에 수행한다</td>
          <td>가능하지만 데이터가 커지면 전체 읽기 부담이 커져 설계한 키 조회 경로보다 비효율적이다.</td>
          </tr>
          <tr>
          <td>상태를 앱 서버 메모리 목록에만 복제해 조회한다</td>
          <td>내구성·확장·교체 시 정합성 관리 구현이 더 필요하며 관리형 보조 인덱스의 대체로 부적합하다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SecondaryIndexes.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: DynamoDB 주문 테이블은 고객 ID를 파티션 키로 쓰지만 운영팀은 상태별 주문을 조회해야 한다. 테이블 생성 후 새 접근 경로를
              추가하고 싶으며 약간의 반영 지연은 허용된다. 가장 적합한 선택과 제약은?
            answer: 상태 기반 GSI를 추가하고 키 쏠림·쓰기 유지 비용을 검토한다
            wrong:
              - 기존 테이블에 파티션 키가 다른 LSI를 추가한다
              - 상태별 전체 Scan과 필터를 운영 화면의 매 요청에 수행한다
              - 상태를 앱 서버 메모리 목록에만 복제해 조회한다
      - id: Q24-46
        type: mcq
        title: Q24-46 · 모의고사 B
        explain: |
          <p>병목이 SQL 계산보다 연결 관리에 있으므로 지원되는 RDS Proxy의 연결 풀을 검토한다. 세션 고정·긴 트랜잭션은 재사용 효과를 줄일 수 있으며 Proxy가 결과 캐시나 SQL 최적화를 대신하지는 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>각 Lambda 환경에 더 큰 연결 풀을 두고 상한은 설정하지 않는다</td>
          <td>환경 수만큼 풀 규모가 늘어 DB 연결 수 포화를 악화시킬 수 있다.</td>
          </tr>
          <tr>
          <td>DB 인스턴스 CPU만 늘리고 연결 재사용은 하지 않는다</td>
          <td>계산에 여유가 있으므로 연결 생성이 병목인 상황에서 직접적인 개선보다 비용 부담이 커질 수 있다.</td>
          </tr>
          <tr>
          <td>읽기 복제본을 추가하고 기존 writer 연결 생성 패턴을 유지한다</td>
          <td>읽기 분산은 가능하지만 현재 writer의 연결 생성·종료 부담을 직접 풀링하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-10.html">10일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.3</p>
        quizzes:
          - q: 짧은 Lambda 호출이 늘면서 RDS 연결 수가 급증했다. DB SQL 실행 CPU는 여유지만 연결 생성과 종료에 부담이 크다. SQL
              결과를 캐시하는 변경 없이 연결을 재사용하려면 무엇을 검토하는 것이 가장 적합한가?
            answer: 지원 엔진·인증 조건에 맞는 RDS Proxy
            wrong:
              - 각 Lambda 환경에 더 큰 연결 풀을 두고 상한은 설정하지 않는다
              - DB 인스턴스 CPU만 늘리고 연결 재사용은 하지 않는다
              - 읽기 복제본을 추가하고 기존 writer 연결 생성 패턴을 유지한다
      - id: Q24-47
        type: mcq
        title: Q24-47 · 모의고사 B
        explain: |
          <p>UDP와 고정 Anycast 진입 IP·정상 엔드포인트 선택이 요구되므로 Global Accelerator가 적합하다. 웹 객체 캐시인 CloudFront나 S3 전송 가속과 처리 계층이 다르다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>각 리전 NLB의 주소만 별도로 배포하고 글로벌 전환은 클라이언트가 구현한다</td>
          <td>리전별 진입은 가능하지만 고정 글로벌 진입과 관리형 정상 리전 선택에 비해 클라이언트 부담이 커진다.</td>
          </tr>
          <tr>
          <td>CloudFront 배포를 게임 UDP 세션의 프런트로 사용한다</td>
          <td>HTTP 콘텐츠 전송과 달리 임의 UDP 게임 세션 요구에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>Route 53 latency 정책만 구성하고 고정 진입 IP는 두지 않는다</td>
          <td>리전 DNS 선택은 가능하지만 고객이 요구하는 고정 IP 허용 목록 조건이 남는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-09.html">9일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 다국적 게임사는 UDP 게임 서버를 여러 리전에서 운영한다. 고객 네트워크의 허용 목록에는 고정 진입 IP가 필요하고 장애 시 정상
              리전으로 보내야 한다. 정적 웹 객체 캐시는 요구하지 않는다. 가장 적합한 서비스는?
            answer: 표준 AWS Global Accelerator
            wrong:
              - 각 리전 NLB의 주소만 별도로 배포하고 글로벌 전환은 클라이언트가 구현한다
              - CloudFront 배포를 게임 UDP 세션의 프런트로 사용한다
              - Route 53 latency 정책만 구성하고 고정 진입 IP는 두지 않는다
      - id: Q24-48
        type: mcq
        title: Q24-48 · 모의고사 B
        explain: |
          <p>특정 서비스를 제공하고 겹친 주소 공간의 전체 라우팅을 피하려면 PrivateLink 서비스 노출을 검토한다. 서비스 엔드포인트와 승인·SG·앱 인증을 구성하며 VPC 전체 연결과 구분한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>주소를 유지한 채 두 VPC를 TGW의 같은 라우트 테이블에 연결한다</td>
          <td>중복 주소 라우팅 충돌을 자동 해결하지 않아 특정 서비스 사설 노출보다 부적합하다.</td>
          </tr>
          <tr>
          <td>서로 다른 CIDR로 재주소화한 뒤 전체 VPC를 VPN으로 연결한다</td>
          <td>가능한 재설계지만 주소 재설계를 피하고 특정 서비스만 공개하려는 조건에 비해 변경 범위가 크다.</td>
          </tr>
          <tr>
          <td>주소를 유지한 채 VPC Peering을 구성한다</td>
          <td>겹친 CIDR의 Peering은 지원하지 않아 현재 주소 변경 회피 조건에 맞지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: 서로 주소가 겹치는 두 회사 VPC 사이에서 한쪽의 특정 TCP 서비스만 사설로 제공하려 한다. 네트워크 전체의 상호 라우팅은 불필요하고
              소비자마다 제공자 전체 주소를 재설계하기 어렵다. 적합한 연결 방식은?
            answer: NLB 기반 서비스와 PrivateLink 엔드포인트를 구성한다
            wrong:
              - 주소를 유지한 채 두 VPC를 TGW의 같은 라우트 테이블에 연결한다
              - 서로 다른 CIDR로 재주소화한 뒤 전체 VPC를 VPN으로 연결한다
              - 주소를 유지한 채 VPC Peering을 구성한다
      - id: Q24-49
        type: mcq
        title: Q24-49 · 모의고사 B
        explain: |
          <p>라우트 테이블을 그룹별로 연결·전파하면 TGW 라우팅으로 운영·개발을 분리할 수 있다. 1.25Gbps 터널 두 개는 합계 한도도 2.5Gbps이므로 3Gbps를 충족할 수 없다. 두 번째 동적 VPN과 지원되는 ECMP는 네 터널에 여러 흐름을 분산할 수 있게 한다. 실제 합산 처리량은 장비·흐름 분포에도 좌우되며 단일 흐름 속도를 네 배로 만들지는 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>두 그룹을 기본 TGW 테이블에 연결하고 각 VPC·지사 CIDR을 자동 전파한다</td>
          <td>모든 경로가 같은 테이블에 전파되면 운영·개발 사이의 경로도 생긴다. 그룹 간 격리를 요구하는 연결 범위와 다르다.</td>
          </tr>
          <tr>
          <td>운영 지사에 두 번째 VPN을 추가하고 높은 우선순위 경로와 대기 경로로 구성한다</td>
          <td>대기 경로는 장애 복구에는 도움이 되지만 여러 연결의 대역폭을 동시에 합치는 ECMP 구성이 아니다.</td>
          </tr>
          <tr>
          <td>기존 두 터널에 서로 다른 MED를 부여해 선호 경로를 지정한다</td>
          <td>선호 경로를 지정하면 장애 시 대기 경로를 사용할 수 있지만 기존 터널 한도와 연결 개수로 총 3Gbps를 충족하지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/tgw/how-transit-gateways-work.html">TGW 라우팅 및 ECMP</a> · <a href="https://docs.aws.amazon.com/vpn/latest/s2svpn/vpn-limits.html">VPN 터널 대역폭</a>
          SAA 평가 항목: 3.4</p>
        quizzes:
          - q: TGW로 연결한 운영 VPC·운영 지사와 개발 VPC·개발 지사는 서로 통신하면 안 된다. 각 그룹 내부 통신은 필요하며 CIDR은 모두
              다르다. 운영 지사의 백업은 다수 TCP 흐름으로 총 3Gbps를 보내려 한다. 현재 표준 VPN 터널당 한도는
              1.25Gbps이고 터널 두 개를 가진 동적 VPN 연결 하나가 있다. 고객 장비는 여러 BGP 터널의 동시 사용을
              지원한다. 두 요구를 충족할 조치 두 가지는?
            answer: 운영·개발 TGW 라우트 테이블을 분리하고 각 그룹 attachment만 연결·전파하며 VPC 반환 경로를 맞춘다
            wrong:
              - 두 그룹을 기본 TGW 테이블에 연결하고 각 VPC·지사 CIDR을 자동 전파한다
              - 운영 지사에 두 번째 VPN을 추가하고 높은 우선순위 경로와 대기 경로로 구성한다
              - 기존 두 터널에 서로 다른 MED를 부여해 선호 경로를 지정한다
            answers:
              - 운영·개발 TGW 라우트 테이블을 분리하고 각 그룹 attachment만 연결·전파하며 VPC 반환 경로를 맞춘다
              - 운영 지사에 두 번째 동적 VPN 연결을 추가하고 동일 비용 BGP 경로와 VPN ECMP를 사용한다
            options:
              - 두 그룹을 기본 TGW 테이블에 연결하고 각 VPC·지사 CIDR을 자동 전파한다
              - 운영 지사에 두 번째 VPN을 추가하고 높은 우선순위 경로와 대기 경로로 구성한다
              - 기존 두 터널에 서로 다른 MED를 부여해 선호 경로를 지정한다
              - 운영·개발 TGW 라우트 테이블을 분리하고 각 그룹 attachment만 연결·전파하며 VPC 반환 경로를 맞춘다
              - 운영 지사에 두 번째 동적 VPN 연결을 추가하고 동일 비용 BGP 경로와 VPN ECMP를 사용한다
      - id: Q24-50
        type: mcq
        title: Q24-50 · 모의고사 B
        explain: |
          <p>여러 소비자가 같은 보존된 이벤트를 독립적으로 읽고 재생해야 하므로 스트림 모델이 맞다. 센서 키·샤드의 순서 범위와 키 쏠림·보존 기간·중복 처리·체크포인트를 함께 설계한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>하나의 SQS 큐에 두 소비자가 경쟁 수신하도록 한다</td>
          <td>같은 이벤트의 독립 보존·재생보다 작업 분담 모델에 적합하다.</td>
          </tr>
          <tr>
          <td>Data Firehose만으로 S3에 전달하고 실시간 소비자의 재생 로그는 두지 않는다</td>
          <td>목적지 적재에는 적합하지만 명시한 실시간 독립 소비·최근 재생 요구를 직접 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>SNS에서 두 처리기로 즉시 전달하고 이벤트 보존·재생은 두지 않는다</td>
          <td>발행·구독은 가능하지만 최근 데이터를 소비자별 위치에서 다시 읽는 로그가 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: 공장은 센서 이벤트를 실시간 이상 탐지와 장기 통계가 서로 다른 속도로 읽게 하려 한다. 최근 데이터를 다시 읽는 기능도 필요하며 동일
              센서의 순서는 중요하다. 적합한 수집 구조는?
            answer: Data Streams에서 센서 키와 소비자별 읽기 위치를 설계한다
            wrong:
              - 하나의 SQS 큐에 두 소비자가 경쟁 수신하도록 한다
              - Data Firehose만으로 S3에 전달하고 실시간 소비자의 재생 로그는 두지 않는다
              - SNS에서 두 처리기로 즉시 전달하고 이벤트 보존·재생은 두지 않는다
      - id: Q24-51
        type: mcq
        title: Q24-51 · 모의고사 B
        explain: |
          <p>날짜 파티션은 100일 중 필요한 하루의 데이터로 대상을 줄이고, Parquet는 필요한 열과 관련 데이터 블록만 읽을 수 있게 한다. 두 가지 조회 특성을 함께 활용하므로 원본 보존과 별개로 분석 사본의 스캔 양을 줄인다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>전체 날짜를 합친 Parquet 파일을 고객 ID별 디렉터리에 저장한다</td>
          <td>열 지향 형식은 활용하지만 조회 조건에 없는 고객 ID 디렉터리는 날짜별 파티션 제거를 제공하지 않는다.</td>
          </tr>
          <tr>
          <td>날짜별 파티션에 gzip CSV 파일을 저장하고 필요한 열을 SELECT한다</td>
          <td>날짜 파티션과 압축은 유용하지만 CSV는 행 기반이므로 SELECT한 다섯 열만 물리적으로 읽는 구성이 아니다.</td>
          </tr>
          <tr>
          <td>날짜별 파티션에 압축 JSON을 저장하고 Glue Catalog에 등록한다</td>
          <td>날짜 파티션은 활용하지만 JSON은 행 단위 형식이라 필요한 다섯 열만 읽는 열 지향 형식의 이점을 얻지 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/athena/latest/ug/columnar-storage.html">Athena 열 지향 형식</a> · <a href="https://docs.aws.amazon.com/athena/latest/ug/partitions.html">Athena 파티션</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: 물류사는 매일 1TB의 JSON을 S3에 저장하고 100일치를 Athena로 조회한다. 대부분의 쿼리는 특정 하루의 100개 열 중 5개만
              읽는다. ETL 시간은 충분하고 날짜 조건은 항상 쿼리에 포함한다. 원본은 보존하면서 Athena 스캔 양을 가장
              직접적으로 줄일 분석용 데이터 구성은?
            answer: 날짜별 파티션에 Parquet를 저장하고 해당 파티션 조건으로 조회한다
            wrong:
              - 전체 날짜를 합친 Parquet 파일을 고객 ID별 디렉터리에 저장한다
              - 날짜별 파티션에 gzip CSV 파일을 저장하고 필요한 열을 SELECT한다
              - 날짜별 파티션에 압축 JSON을 저장하고 Glue Catalog에 등록한다
      - id: Q24-52
        type: mcq
        title: Q24-52 · 모의고사 B
        explain: |
          <p>분석 도구의 열 제한을 원본 직접 읽기로 우회할 수 있으면 의도한 데이터 권한 경계가 깨진다. IAM·S3·KMS·결과 저장소와 Lake Formation을 함께 검토해 승인된 경로에서만 데이터를 보게 해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Lake Formation 열 제한만 유지하고 직접 S3 읽기는 계속 허용한다</td>
          <td>분석 도구를 우회하는 원본 접근 경로가 열려 있으므로 민감 열 차단 의도가 충족되지 않는다.</td>
          </tr>
          <tr>
          <td>BI 화면의 전화번호 열만 숨기고 데이터 원본 권한은 유지한다</td>
          <td>화면 표시 제한은 원본 API를 통한 실제 읽기 권한을 제거하지 않는다.</td>
          </tr>
          <tr>
          <td>S3 기본 암호화만 강화하고 분석가의 복호화 권한은 그대로 둔다</td>
          <td>읽기·복호화가 허용된 사용자는 암호화 강화만으로 민감 열 접근이 막히지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-11.html">11일 차 개념</a> · <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 3.5</p>
        quizzes:
          - q: 분석가는 레이크의 지역별 합계만 보아야 하며 고객 전화번호 열은 볼 수 없어야 한다. Athena와 Lake Formation의 테이블
              권한을 제한했지만 원본 S3를 직접 읽는 넓은 권한도 있다. 가장 적합한 보안 개선은?
            answer: 원본 직접 접근·결과 버킷·KMS 권한까지 함께 제한한다
            wrong:
              - Lake Formation 열 제한만 유지하고 직접 S3 읽기는 계속 허용한다
              - BI 화면의 전화번호 열만 숨기고 데이터 원본 권한은 유지한다
              - S3 기본 암호화만 강화하고 분석가의 복호화 권한은 그대로 둔다
      - id: Q24-53
        type: mcq
        title: Q24-53 · 모의고사 B
        explain: |
          <p>요구는 저장 계층 변경이 아니라 읽기 요청·전송 비용의 부담 주체 변경이다. Requester Pays는 인증된 요청자가 관련 요금을 부담하게 하며 버킷 소유자의 저장 비용과 객체 접근 정책은 별도로 남는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>Standard-IA로 바꾸고 소유자 계정이 계속 다운로드 비용을 부담한다</td>
          <td>저장 단가는 줄 수 있어도 다운로드 요금의 부담 주체 변경 요구를 충족하지 않는다.</td>
          </tr>
          <tr>
          <td>버킷을 Intelligent-Tiering으로 전환한다</td>
          <td>저장 계층을 관리하는 기능이므로 외부 연구자의 요청·전송 비용 부담 주체를 바꾸지 않는다.</td>
          </tr>
          <tr>
          <td>연구자별 비용 할당 태그를 활성화한다</td>
          <td>비용을 분석·배분하는 메타데이터이며 외부 요청자 청구로 전환하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/RequesterPaysBuckets.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: 공공 데이터 버킷은 외부 연구자의 대용량 다운로드 때문에 전송 비용이 커졌다. 데이터는 비공개 권한으로 관리하되 이용자가 다운로드
              요청·전송 요금을 부담하게 하고 싶다. 클라이언트도 해당 기능을 지원한다. 적합한 설정은?
            answer: S3 Requester Pays와 인증된 요청을 구성한다
            wrong:
              - Standard-IA로 바꾸고 소유자 계정이 계속 다운로드 비용을 부담한다
              - 버킷을 Intelligent-Tiering으로 전환한다
              - 연구자별 비용 할당 태그를 활성화한다
      - id: Q24-54
        type: mcq
        title: Q24-54 · 모의고사 B
        explain: |
          <p>첫 30일 Standard 뒤 Deep Archive 전환은 장기 보관 저장 비용을 낮춘다. Deep Archive Standard retrieval은 일반적으로 12시간 이내로, 소수 객체의 24시간 허용 조건에 맞는다. 10년 보관은 180일 최소 보관 기간도 넘는다. 보존 잠금은 전환과 별도로 계속 적용한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>30일 후 Glacier Instant Retrieval로 전환하고 GET 요청으로 읽는다</td>
          <td>즉시 GET이 가능하지만 첫 달 이후에는 즉시 읽기가 필요하지 않으며 제시된 장기 비용 비교에서 더 비싸다.</td>
          </tr>
          <tr>
          <td>30일 후 Glacier Deep Archive로 전환하고 Bulk retrieval을 사용한다</td>
          <td>Deep Archive Bulk retrieval은 일반적으로 48시간 이내여서 24시간 복원 허용 조건에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>30일 후 Glacier Flexible Retrieval로 전환하고 Standard retrieval을 사용한다</td>
          <td>일반적으로 3~5시간으로 복원 조건은 충족하지만 문제의 검색 비용을 포함한 견적에서 Deep Archive보다 비싸다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a> · <a href="/study/lessons/day-11.html">11일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html">아카이브 복원 옵션과 시간</a> · <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html">스토리지 클래스와 최소 보관 기간</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: 법정 자료를 첫 30일은 즉시 읽고 이후에는 10년 보관한다. 그 뒤 복원은 드물고 소수 객체 단위이며 일반적인 복원 시간이 24시간
              이내이면 된다. Object Lock compliance 보존은 이미 적용되어 있다. 최소 보관 기간을 넘겨 보관하며,
              후보별 검색 비용까지 산정한 견적에서는 Deep Archive가 가장 저렴하다. 적합한 수명 주기와 복원 방식은?
            answer: 30일 후 Glacier Deep Archive로 전환하고 Standard retrieval을 사용한다
            wrong:
              - 30일 후 Glacier Instant Retrieval로 전환하고 GET 요청으로 읽는다
              - 30일 후 Glacier Deep Archive로 전환하고 Bulk retrieval을 사용한다
              - 30일 후 Glacier Flexible Retrieval로 전환하고 Standard retrieval을 사용한다
      - id: Q24-55
        type: mcq
        title: Q24-55 · 모의고사 B
        explain: |
          <p>80TB를 1Gbps로 보내는 데는 전송 오버헤드를 빼도 약 7.4일이 필요하다. 확보된 Terminal로 초기 스냅샷을 이틀 안에 올리고, 별도로 추적한 변경 파일만 기존 회선의 DataSync로 전송하면 소량의 증분을 반영할 수 있다. 최종 쓰기 중지·변경분 반영·무결성 확인까지 완료해야 이관이 끝난다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 회선의 DataSync 작업으로 80TB 전체를 전송한다</td>
          <td>DataSync는 온라인 전송을 효율화하지만 1Gbps 회선으로 80TB를 4일 안에 보내는 물리적 대역폭 문제를 해결하지 못한다.</td>
          </tr>
          <tr>
          <td>10Gbps Direct Connect 회선 개통 후 전체 파일을 전송한다</td>
          <td>개통까지 10일이 걸리므로 전송 속도가 충분해도 4일 기한에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>기존 회선에서 S3 Transfer Acceleration으로 전체 파일을 업로드한다</td>
          <td>장거리 인터넷 경로를 개선할 수 있지만 고객 측 1Gbps 회선의 한도를 넘어 초기 80TB 전송 기간을 4일로 줄이지는 못한다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/snowball/latest/developer-guide/snowball-edge-availability-change.html">현행 물리 전송 대안</a> · <a href="https://docs.aws.amazon.com/datasync/latest/userguide/configure-metadata.html">DataSync 변경 데이터 전송</a>
          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: 신규 고객이 온프레미스 파일 80TB를 4일 내 S3로 이관한다. 기존 회선의 실효 속도는 1Gbps이며 데이터는 하루 200GB 바뀐다.
              10Gbps 회선 개통에는 10일이 걸린다. 팀은 이틀 안에 기초 스냅샷을 운반·업로드할 Data Transfer
              Terminal 예약과 장비를 확보했다. 변경 파일 목록을 추적하고 있으며 현행 회선으로 그 파일을 DataSync
              전송하는 경로와 검증을 시험했다. 기한 내 최종 데이터를 맞추기 위해 결합할 두 조치는?
            answer: 기준 시점 스냅샷을 장비에 담아 Terminal에서 S3로 업로드한다
            wrong:
              - 기존 회선의 DataSync 작업으로 80TB 전체를 전송한다
              - 10Gbps Direct Connect 회선 개통 후 전체 파일을 전송한다
              - 기존 회선에서 S3 Transfer Acceleration으로 전체 파일을 업로드한다
            answers:
              - 기준 시점 스냅샷을 장비에 담아 Terminal에서 S3로 업로드한다
              - 변경 파일을 DataSync로 전송하고 짧은 쓰기 중지 동안 최종 변경분과 무결성을 검증한다
            options:
              - 기준 시점 스냅샷을 장비에 담아 Terminal에서 S3로 업로드한다
              - 변경 파일을 DataSync로 전송하고 짧은 쓰기 중지 동안 최종 변경분과 무결성을 검증한다
              - 기존 회선의 DataSync 작업으로 80TB 전체를 전송한다
              - 10Gbps Direct Connect 회선 개통 후 전체 파일을 전송한다
              - 기존 회선에서 S3 Transfer Acceleration으로 전체 파일을 업로드한다
      - id: Q24-56
        type: mcq
        title: Q24-56 · 모의고사 B
        explain: >
          <p>Elastic은 저장 용량이나 버스트 크레딧에 성능을 묶지 않고 실제 사용 처리량에 따라 과금한다. 제시된 지원 한도와
          짧은 배치 패턴에서 500MiB/s를 충족하며 월 견적도 Provisioned보다 낮다. Regional 파일 시스템을 유지해
          AZ 장애 범위도 바꾸지 않는다.</p>

          <table>

          <thead>

          <tr>

          <th>오답</th>

          <th>틀린 이유</th>

          </tr>

          </thead>

          <tbody><tr>

          <td>One Zone EFS의 Provisioned 500MiB/s로 파일을 옮긴다</td>

          <td>처리량은 확보할 수 있어도 파일 시스템의 데이터가 한 AZ에 저장되는 방식으로 바뀐다. 여러 AZ의 Regional
          공유 파일 구성을 유지하는 비용 대안이 아니다.</td>

          </tr>

          <tr>

          <td>Bursting을 유지하고 크레딧을 채우기 위해 파일을 장기 보관한다</td>

          <td>용량을 불필요하게 늘려 버스트 성능을 얻으려면 저장 비용과 파일 관리가 늘며 실제 사용량에 따른 용량 감소의 이점을
          잃는다.</td>

          </tr>

          <tr>

          <td>Provisioned 500MiB/s를 설정하고 저장 용량은 실제 사용량으로 유지한다</td>

          <td>필요 성능은 제공하지만 제시된 낮은 평균 처리량의 월 견적에서는 Elastic보다 비용이 10배 높다.</td>

          </tr>

          </tbody></table>

          <p>관련 개념: <a href="/study/lessons/day-03.html">3일 차 개념</a>

          공식 근거: <a
          href="https://docs.aws.amazon.com/efs/latest/ug/performance.html">EFS
          처리량 모드</a>

          SAA 평가 항목: 4.1</p>
        quizzes:
          - q: Regional EFS의 General Purpose 파일 시스템을 여러 AZ에서 NFS로 공유하며 한 AZ가 소실되어도 파일을 유지해야
              한다. 용량 감소 뒤 Bursting 모드의 크레딧이 소진되면 배치가 느려진다. 사용 패턴은 하루 10분 동안
              500MiB/s 쓰기, 나머지는 거의 유휴다. 현재 리전과 클라이언트는 Elastic 500MiB/s를 지원한다. 월
              처리량 비용 견적은 Elastic 30, Provisioned 500MiB/s는 300이다. 낮은 운영 부담으로 배치
              성능을 유지하는 최소 비용 변경은?
            answer: Elastic 처리량을 설정하고 저장 용량은 실제 사용량으로 유지한다
            wrong:
              - One Zone EFS의 Provisioned 500MiB/s로 파일을 옮긴다
              - Bursting을 유지하고 크레딧을 채우기 위해 파일을 장기 보관한다
              - Provisioned 500MiB/s를 설정하고 저장 용량은 실제 사용량으로 유지한다
      - id: Q24-57
        type: mcq
        title: Q24-57 · 모의고사 B
        explain: |
          <p>Compute Savings Plans는 인스턴스 계열·리전을 바꾸어도 대상 사용량에 적용된다. 적정 사양의 지속 기본 부하만 1년 약정하고 재시작 가능한 추가 배치를 Spot으로 처리하면 피크를 24시간 약정하지 않아도 된다. 시간당 1.20은 온디맨드 단가가 아니라 해당 사용량에 대한 제시된 Savings Plans 견적 약정액이다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기본 부하에 3년 Compute Savings Plans를 약정하고 추가 배치는 온디맨드로 실행한다</td>
          <td>3년 약정은 1년 뒤 규모가 미정인 조건보다 길며 중단 재개 가능한 배치를 온디맨드로 사는 조합도 비용 기회를 줄인다.</td>
          </tr>
          <tr>
          <td>현재 계열·리전에 1년 EC2 Instance Savings Plans를 약정하고 추가 배치는 Spot으로 실행한다</td>
          <td>EC2 Instance Savings Plans는 지정한 계열과 리전에 묶인다. 예정된 두 항목 변경 후 같은 기본 부하에 약정이 적용되지 않을 수 있다.</td>
          </tr>
          <tr>
          <td>기본 부하와 배치 피크 합계에 1년 Compute Savings Plans를 약정한다</td>
          <td>하루 두 시간인 배치 피크까지 매시간 약정하면 나머지 시간에 미사용 약정이 남을 수 있다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-12.html">12일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html">Savings Plans 적용 범위</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 적정 사양으로 줄인 뒤에도 24시간 실행해야 하는 기본 부하가 있다. 그 사용량에 대한 1년 Compute Savings Plans 견적의
              약정액은 시간당 1.20이고, 매일 두 시간의 추가 배치는 중단 후 재개할 수 있다. 6개월 뒤 기본 부하를 다른
              인스턴스 계열과 리전으로 옮길 계획이며 1년 뒤 규모는 미정이다. 부하를 보호하고 미사용 약정을 줄일 구매 조합은?
            answer: 기본 부하의 시간당 1.20에 1년 Compute Savings Plans를 약정하고 추가 배치는 Spot으로 실행한다
            wrong:
              - 기본 부하에 3년 Compute Savings Plans를 약정하고 추가 배치는 온디맨드로 실행한다
              - 현재 계열·리전에 1년 EC2 Instance Savings Plans를 약정하고 추가 배치는 Spot으로 실행한다
              - 기본 부하와 배치 피크 합계에 1년 Compute Savings Plans를 약정한다
      - id: Q24-58
        type: mcq
        title: Q24-58 · 모의고사 B
        explain: |
          <p>지원되는 최대 절전은 RAM을 EBS에 보존하고 컴퓨팅 실행을 멈췄다가 재개하는 요구에 맞는다. 중지 상태의 저장 요금과 지원 OS·용량·기간 등 제약은 남으며 일반 종료와 구분해야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>야간에도 실행을 유지하고 Reserved Instance 할인만 적용한다</td>
          <td>사용하지 않는 시간의 실행은 계속되며 최대 절전 가능한 유휴 자원의 요금을 끊는 방식과 다르다.</td>
          </tr>
          <tr>
          <td>야간에 종료하고 AMI에서 새 인스턴스를 시작한다</td>
          <td>AMI 재시작은 RAM 보존·복원이 아니므로 메모리 준비 시간을 줄이는 조건이 남는다.</td>
          </tr>
          <tr>
          <td>인스턴스를 일반 중지하고 재시작 때 RAM 상태는 새로 구성한다</td>
          <td>컴퓨팅 비용은 줄지만 메모리 상태 유지로 준비 시간을 단축하는 요구를 충족하지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-02.html">2일 차 개념</a> · <a href="/study/lessons/day-06.html">6일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: 개발 환경은 평일 낮에만 사용하며 재개 때 메모리 상태를 유지하면 준비 시간을 줄일 수 있다. 지원되는 EBS 기반 EC2를 쓰고 저장
              비용은 감수할 수 있다. 밤에도 컴퓨팅 요금을 낭비하지 않는 적합한 선택은?
            answer: 지원 조건을 확인해 최대 절전하고 RAM 저장 공간·재개 제약을 관리한다
            wrong:
              - 야간에도 실행을 유지하고 Reserved Instance 할인만 적용한다
              - 야간에 종료하고 AMI에서 새 인스턴스를 시작한다
              - 인스턴스를 일반 중지하고 재시작 때 RAM 상태는 새로 구성한다
      - id: Q24-59
        type: mcq
        title: Q24-59 · 모의고사 B
        explain: |
          <p>ECS의 CPU·GPU EC2 풀을 분리하면 요구 자원을 제공하면서 월 총비용은 900+150+800=1,850이다. CPU Fargate와 GPU EC2 조합은 2,300이다. 팀의 노드 운영 능력과 운영비를 이미 반영한 동등 용량 견적이므로 EC2 조합이 최소 비용이다. 웹 작업은 연속 가용성이 필요하므로 중단 가능한 Fargate Spot만으로 대체하는 보기는 맞지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>CPU와 GPU를 같은 GPU 지원 EC2 풀에 집적한다</td>
          <td>두 작업 모두 실행할 수 있지만 GPU 노드에 CPU 웹 작업까지 집적한 단일 풀의 제시된 총비용 2,600은 분리된 EC2 풀의 1,850보다 높다.</td>
          </tr>
          <tr>
          <td>CPU는 Fargate Spot, GPU는 GPU 지원 EC2 풀로 분리한다</td>
          <td>Fargate Spot은 중단 가능 용량이다. 연중 실행되는 웹 작업을 전부 이 용량에 두면 제시된 연속 가용성의 동등 비교 조건을 만족하지 않는다.</td>
          </tr>
          <tr>
          <td>CPU는 Fargate, GPU는 GPU 지원 EC2 capacity provider로 분리한다</td>
          <td>관리형 CPU 실행으로 운영 부담은 줄지만 제시된 총비용은 2,300으로 EC2 조합의 1,850보다 높다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-14.html">14일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-gpu.html">ECS GPU 작업과 Fargate 제약</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-capacity-providers.html">Fargate Spot 중단</a> · <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html">Fargate 작업 정의의 지원 범위</a>
          SAA 평가 항목: 4.2</p>
        quizzes:
          - q: ECS로 CPU 웹 작업과 NVIDIA GPU 추론 작업을 연중 실행하며 실행 중인 작업의 용량 회수에 따른 중단은 허용하지 않는다.
              운영팀은 EC2 노드를 관리할 수 있다. 동일한 가용성과 용량으로 검증한 월 총비용은 CPU를 약정 할인 EC2에
              집적하면 실행 900+운영 150, CPU를 Fargate로 실행하면 1,500이다. 분리한 GPU용 EC2 풀은 어느
              경우든 800이며, CPU도 GPU 노드에 집적하는 단일 풀의 총비용은 2,600이다. 최소 비용으로 두 작업을
              지원하는 배치는?
            answer: CPU는 약정 EC2 풀, GPU는 GPU 지원 EC2 풀로 분리한다
            wrong:
              - CPU와 GPU를 같은 GPU 지원 EC2 풀에 집적한다
              - CPU는 Fargate Spot, GPU는 GPU 지원 EC2 풀로 분리한다
              - CPU는 Fargate, GPU는 GPU 지원 EC2 capacity provider로 분리한다
      - id: Q24-60
        type: mcq
        title: Q24-60 · 모의고사 B
        explain: |
          <p>예약된 stop/start는 DB 데이터와 엔드포인트를 유지하면서 중지 기간의 DB 인스턴스 시간 요금을 줄인다. 08시 시작은 제시된 15분 재시작 시간에 여유를 주며 매 주말 중지는 7일 자동 재시작 한도 안이다. 스토리지와 보관 백업 등의 비용은 계속 발생한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>매일 DB 스냅샷 생성·DB 삭제 후 업무일 08시에 복원을 예약한다</td>
          <td>스냅샷 복원은 새 DB를 생성하므로 기존 엔드포인트가 그대로 유지되지 않고 제시된 70분 복원 시간도 09시 준비에 맞지 않는다.</td>
          </tr>
          <tr>
          <td>DB를 작은 인스턴스로 변경하고 24시간 실행한다</td>
          <td>실행 중 사양 조정은 다른 절약 수단이지만 야간·주말에도 컴퓨팅 시간이 계속 청구되며 이미 주어진 유휴 시간을 제거하지 않는다.</td>
          </tr>
          <tr>
          <td>1년 Reserved DB Instance를 구매하고 현재 실행 일정을 유지한다</td>
          <td>할인은 가능하지만 24시간 약정 비용이 남는다. 일시 중지가 가능한 업무 시간 전용 개발 DB에는 유휴 실행 시간을 제거하는 것이 직접적이다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_StopInstance.html">RDS DB 인스턴스 임시 중지</a>
          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: 개발용 Single-AZ RDS PostgreSQL은 평일 09~18시에만 사용한다. 읽기 복제본은 없으며 stop/start를 지원한다.
              테스트한 재시작은 15분 이내이고 스냅샷 복원은 70분이다. 데이터·엔드포인트를 유지하고 매일 09시에 준비되어야 하며
              야간·주말 접속은 필요 없다. 단기 중지는 주말을 포함해 7일보다 짧다. 현재 크기는 주간 성능 목표를 만족하는 최소
              크기다. 저장 요금은 감수하면서 야간·주말의 DB 인스턴스 시간 요금을 없앨 구성은?
            answer: EventBridge Scheduler와 Lambda로 18시 중지·업무일 08시 시작을 예약한다
            wrong:
              - 매일 DB 스냅샷 생성·DB 삭제 후 업무일 08시에 복원을 예약한다
              - DB를 작은 인스턴스로 변경하고 24시간 실행한다
              - 1년 Reserved DB Instance를 구매하고 현재 실행 일정을 유지한다
      - id: Q24-61
        type: mcq
        title: Q24-61 · 모의고사 B
        explain: |
          <p>예측 가능한 피크 전에 예약 확장하고 종료 후 줄이면 상시 6,000 WCU를 유지하지 않아도 된다. 동시에 한 batch_id에 몰린 쓰기는 기본 테이블 키를 여러 shard로 분산해야 한다. LSI가 있으면 같은 파티션 키의 항목 모음은 서로 다른 물리 파티션으로 분할되지 않는다. 한 물리 파티션의 쓰기 한도는 1,000 WCU이므로 테이블 총용량 조정만으로 충분하지 않다. 배치별 조회의 fan-out을 허용한 조건이 sharding을 가능하게 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>order_id를 파티션 키로 사용하는 GSI를 현재 테이블에 추가한다</td>
          <td>GSI의 키를 바꾸어도 기본 테이블의 batch_id 집중 쓰기는 남는다. 인덱스 저장·쓰기 비용도 더해진다.</td>
          </tr>
          <tr>
          <td>기본 테이블 WCU를 12,000으로 상시 설정한다</td>
          <td>테이블 총 WCU를 늘려도 기본 테이블의 집중 키가 여러 파티션으로 자동 균등 분산된다고 보장할 수 없으며 유휴 시간 비용도 크다.</td>
          </tr>
          <tr>
          <td>On-demand 모드로 바꾸어 테이블 요청 용량을 자동 관리한다</td>
          <td>요청 용량 관리는 쉬워지지만 같은 파티션 키의 집중 쓰기 한도를 없애지 못하며 제시된 견적에서도 최소 비용 조합이 아니다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-08.html">8일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html">DynamoDB 파티션 키 설계</a> · <a href="https://docs.aws.amazon.com/autoscaling/application/userguide/application-auto-scaling-scheduled-scaling.html">예약 확장</a> · <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html">쓰기 sharding</a> · <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/burst-adaptive-capacity.html">LSI와 adaptive capacity의 항목 모음 분할 제약</a>
          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: 월말 일괄 처리 때만 DynamoDB에 1KiB 항목을 초당 3,000개 쓴다. 현재 Provisioned 테이블은 PK=batch_id,
              SK=order_id이며 한 배치의 쓰기가 같은 PK로 몰린다. LSI 쓰기까지 포함한 피크 필요 용량은 6,000
              WCU다. 같은 PK로 묶이는 LSI를 유지해야 하며 새 테이블로 키를 이관할 수 있다. 그 외 시간에는 초당 10개
              정도다. 배치 시작 시각은 고정이고 읽기는 배치별 조회이므로 여러 키 조회 결과를 합칠 수 있다. 견적상 예약 확장
              Provisioned가 On-demand보다 싸다. 월말 성능을 확보하고 상시 과다 용량을 줄일 조치 두 가지는?
            answer: Application Auto Scaling 예약 작업으로 배치 전 최소 WCU를 6,000 이상 확보하고 종료 뒤 용량 범위를
              낮춘다
            wrong:
              - order_id를 파티션 키로 사용하는 GSI를 현재 테이블에 추가한다
              - 기본 테이블 WCU를 12,000으로 상시 설정한다
              - On-demand 모드로 바꾸어 테이블 요청 용량을 자동 관리한다
            answers:
              - Application Auto Scaling 예약 작업으로 배치 전 최소 WCU를 6,000 이상 확보하고 종료 뒤
                용량 범위를 낮춘다
              - 새 테이블 PK를 batch_id와 균등한 shard 번호의 조합으로 이관하고 배치 조회는 shard별 결과를 합친다
            options:
              - order_id를 파티션 키로 사용하는 GSI를 현재 테이블에 추가한다
              - 기본 테이블 WCU를 12,000으로 상시 설정한다
              - Application Auto Scaling 예약 작업으로 배치 전 최소 WCU를 6,000 이상 확보하고 종료 뒤
                용량 범위를 낮춘다
              - 새 테이블 PK를 batch_id와 균등한 shard 번호의 조합으로 이관하고 배치 조회는 shard별 결과를 합친다
              - On-demand 모드로 바꾸어 테이블 요청 용량을 자동 관리한다
      - id: Q24-62
        type: mcq
        title: Q24-62 · 모의고사 B
        explain: |
          <p>스키마와 수동 코드 변환을 먼저 시험한 뒤 DMS 전체 적재를 온라인으로 수행하고 CDC로 이후 변경을 따라잡는다. 제시된 2분 추격과 3분 검증·접속 전환을 최종 쓰기 중지 구간에 배치하면 8시간 전체 복사를 중단 시간 밖으로 옮길 수 있다. CDC 지원과 로그 설정 가능 여부는 지문에서 명시했다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>스키마·프로시저를 변환·시험하고 쓰기를 멈춘다. DMS 전체 적재를 실행한 뒤 검증·전환한다</td>
          <td>전체 적재 8시간 동안 쓰기를 중지하면 최대 10분의 전환 중단 조건을 넘는다.</td>
          </tr>
          <tr>
          <td>스키마·프로시저를 변환·시험하고 주기적으로 전체 CSV를 적재한다. 전환 때 마지막 전체 CSV를 생성·적재한다</td>
          <td>최종 전체 데이터 적재도 8시간 규모의 복사가 필요하다. 주기적 전체 CSV만으로 마지막 전환 시점의 변경분을 10분 안에 맞추는 계획이 아니다.</td>
          </tr>
          <tr>
          <td>PostgreSQL에서 Oracle 호환 앱 계층을 구현하고 API 호출을 양 DB에 이중 기록한다. 새 기능부터 점진 전환한다</td>
          <td>점진적인 이중 기록은 가능한 앱 재설계이지만 두 DB의 원자성·재처리·호환 API를 직접 구현해야 한다. 지원되는 DMS CDC 경로보다 이관 운영·개발 부담이 크다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-07.html">7일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_GettingStarted.html">DMS 스키마 변환과 복제 단계</a> · <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.Creating.html">DMS 작업과 CDC</a>
          SAA 평가 항목: 4.3</p>
        quizzes:
          - q: 팀은 Oracle DB를 RDS PostgreSQL로 전환해 라이선스 비용을 줄이려 한다. 두 엔진의 해당 소스·대상 조합은 DMS 전체
              적재와 CDC를 지원하며 필요한 로그 설정도 가능하다. 전환 중 쓰기 중지는 최대 10분이다. 리허설 전체 복사는
              8시간, 변경분 따라잡기는 2분, 최종 검증과 접속 전환은 합쳐 3분이며 스키마 평가에서 저장 프로시저 일부의 수동
              변환이 필요했다. 앱 재설계를 최소화하면서 중단 조건을 맞출 이관 계획은?
            answer: 스키마·프로시저를 변환·시험하고 DMS 전체 적재와 CDC를 실행한다. 쓰기를 잠깐 멈춰 마지막 변경을 반영·검증한 뒤 전환한다
            wrong:
              - 스키마·프로시저를 변환·시험하고 쓰기를 멈춘다. DMS 전체 적재를 실행한 뒤 검증·전환한다
              - 스키마·프로시저를 변환·시험하고 주기적으로 전체 CSV를 적재한다. 전환 때 마지막 전체 CSV를 생성·적재한다
              - PostgreSQL에서 Oracle 호환 앱 계층을 구현하고 API 호출을 양 DB에 이중 기록한다. 새 기능부터
                점진 전환한다
      - id: Q24-63
        type: mcq
        title: Q24-63 · 모의고사 B
        explain: |
          <p>같은 리전 S3 대량 전송은 추가 엔드포인트 요금이 없는 Gateway Endpoint로 NAT 경유를 줄일 수 있다. 일반 인터넷 API는 별도 NAT 경로를 유지하며 역할·버킷·엔드포인트 정책은 계속 평가한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>NAT를 제거하고 외부 API 호출을 위한 대체 인터넷 경로는 두지 않는다</td>
          <td>S3 접속 비용은 줄 수 있어도 계속 필요한 일반 외부 API 통신이 실패한다.</td>
          </tr>
          <tr>
          <td>S3 Interface Endpoint를 모든 AZ에 추가하고 기존 인터넷 경로는 유지한다</td>
          <td>동일 VPC·리전 S3에는 추가 엔드포인트 요금 없는 Gateway 방식이 적합하며 별도 Interface 필요 조건이 없다.</td>
          </tr>
          <tr>
          <td>NAT를 유지하고 S3 파일 업로드 배치 시간만 야간으로 옮긴다</td>
          <td>전송 시간이 바뀌어도 NAT를 경유한 데이터 처리량 비용 자체는 줄지 않는다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-04.html">4일 차 개념</a> · <a href="/study/lessons/day-05.html">5일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html">AWS 공식 설계·기능 문서</a> · <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html">추가 공식 기능 근거</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: 두 AZ의 프라이빗 앱이 같은 리전 S3로 대량 파일을 보낸다. 현재 모든 파일은 NAT를 통과하며 일반 외부 API 호출도 소량
              필요하다. 서비스 접근 권한을 유지하면서 NAT 처리 비용을 줄이는 가장 적합한 구성은?
            answer: S3 Gateway Endpoint를 필요한 라우트 테이블에 연결하고 외부 API의 NAT 경로는 유지한다
            wrong:
              - NAT를 제거하고 외부 API 호출을 위한 대체 인터넷 경로는 두지 않는다
              - S3 Interface Endpoint를 모든 AZ에 추가하고 기존 인터넷 경로는 유지한다
              - NAT를 유지하고 S3 파일 업로드 배치 시간만 야간으로 옮긴다
      - id: Q24-64
        type: mcq
        title: Q24-64 · 모의고사 B
        explain: |
          <p>두 VPC의 직접 통신만 필요하고 주소가 겹치지 않으면 Peering이 단순한 대안이다. 필요한 경로와 보안 설정을 유지하고 리전·AZ별 전송 비용까지 비교하되 없는 허브 요구를 추가하지 않는다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>기존 TGW를 유지하고 두 VPC의 모든 트래픽을 공통 VPC로 우회한다</td>
          <td>필요 없는 우회는 처리·전송·운영 부담을 추가해 단순 직접 연결 요구에 불리하다.</td>
          </tr>
          <tr>
          <td>각 VPC에 VPN 어플라이언스를 배포해 사설 터널을 직접 운영한다</td>
          <td>구현 가능해도 두 VPC 직접 연결에 불필요한 서버·터널 운영 책임을 더한다.</td>
          </tr>
          <tr>
          <td>TGW의 공유 허브를 장기 유지하고 연결·처리 비용은 비교에서 제외한다</td>
          <td>비용이 문제인 현재 조건에서 없는 미래 허브 요구를 근거로 주요 비용을 제외할 수 없다.</td>
          </tr>
          </tbody></table>
          <p>관련 개념: <a href="/study/lessons/day-05.html">5일 차 개념</a> · <a href="/study/lessons/day-13.html">13일 차 개념</a>
          공식 근거: <a href="https://docs.aws.amazon.com/vpc/latest/peering/invalid-peering-configurations.html">AWS 공식 설계·기능 문서</a>
          SAA 평가 항목: 4.4</p>
        quizzes:
          - q: 회사는 두 VPC만 낮은 전송량으로 연결한다. CIDR는 겹치지 않고 향후 지사 연결이나 전이 라우팅 계획도 없다. 현재 TGW 연결·처리
              요금이 사용량 대비 크다. 요구를 만족하며 비용을 검토할 대안은?
            answer: VPC Peering과 양방향 경로·보안 규칙의 총비용을 비교한다
            wrong:
              - 기존 TGW를 유지하고 두 VPC의 모든 트래픽을 공통 VPC로 우회한다
              - 각 VPC에 VPN 어플라이언스를 배포해 사설 터널을 직접 운영한다
              - TGW의 공유 허브를 장기 유지하고 연결·처리 비용은 비교에서 제외한다
      - id: Q24-65
        type: mcq
        title: Q24-65 · 모의고사 B
        explain: |
          <p>같은 언어 콘텐츠는 재사용하고 실제 응답 차이가 없는 추적 값은 키에서 제거하면 적중률을 높일 수 있다. 언어 구분까지 없애면 다른 언어 응답을 재사용할 수 있으므로 정확성 조건을 함께 지켜야 한다.</p>
          <table>
          <thead>
          <tr>
          <th>오답</th>
          <th>틀린 이유</th>
          </tr>
          </thead>
          <tbody><tr>
          <td>캐시를 비활성화하고 원본 서버의 수평 확장만 사용한다</td>
          <td>정적 콘텐츠의 재사용 기회를 없애 전송·원본 비용을 줄이는 요구에 불리하다.</td>
          </tr>
          <tr>
          <td>언어 값도 제외해 모든 요청을 동일 캐시 키로 모은다</td>
          <td>응답을 바꾸는 언어 차이가 사라져 잘못된 언어 콘텐츠를 재사용할 수 있다.</td>
          </tr>
          <tr>
          <td>전체 추적 쿠키 전달과 캐시 키를 그대로 유지하고 TTL만 늘린다</td>
          <td>재사용 가능한 키가 잘게 나뉜 원인이 남으며 다른 쿠키의 새 조합은 계속 원본 미스를 만든다.</td>
          </tr>
          </tbody></table>
